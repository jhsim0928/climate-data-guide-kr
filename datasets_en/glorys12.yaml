notices:
  - date: "2026-04-28"
    level: info
    title: "[MDSOP-377] Application of retention periods to ARCO datacubes"
    body: >-
      Copernicus Marine is applying the retention periods defined in the Product User Manuals to some ARCO datacubes, so some time series may start later
      in the Subset GUI, the Copernicus Marine Toolbox subset and MyOcean Viewer. Original files (File Browser, copernicusmarine get) are not affected.
      The notice does not list the affected products.
    source: https://marine.copernicus.eu/user-corner/user-notification-service
  - date: "2025-11"
    level: warning
    title: Multi-year interim dataset merged into the corresponding multi-year dataset
    body: >-
      The datasets cmems_mod_glo_phy_myint_0.083deg_P1D-m and cmems_mod_glo_phy_myint_0.083deg_P1M-m were retired and their data moved into
      cmems_mod_glo_phy_my_0.083deg_P1D-m / _P1M-m. Code that uses the myint IDs must be updated.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=GLOBAL_MULTIYEAR_PHY_001_030
  - date: "2025-07"
    level: warning
    title: Copernicus Marine Toolbox 1.x end of support
    body: Toolbox 1.x (latest 1.3.6) is no longer supported and should be replaced with 2.x; version 2.4.0 dropped support for Python 3.9.
    source: https://toolbox-docs.marine.copernicus.eu/en/stable/end-of-life.html
  - date: "2024-11"
    level: info
    title: Interim dataset extended every month (Month-1)
    body: The interim dataset is now extended every month closer to real time, until Month-1 (the offset was then 4 months).
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=GLOBAL_MULTIYEAR_PHY_001_030
  - date: "2023-11"
    level: info
    title: Time extension, addition of an interim dataset and renaming of datasets
    body: >-
      The multi-year datasets were extended to June 2021, and months from July 2021 onwards switched to monthly "interim" generation in new interim datasets.
      Several datasets were renamed at the same time (e.g. cmems_mod_glo_phy_my_0.083_P1D-m became cmems_mod_glo_phy_my_0.083deg_P1D-m).
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=GLOBAL_MULTIYEAR_PHY_001_030

