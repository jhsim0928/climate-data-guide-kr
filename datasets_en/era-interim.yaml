notices:
  - date: "2024-09-26"
    level: warning
    title: Goodbye legacy Climate Data Store — ERA-Interim CDS API scripts also need a new account and key
    body: >-
      The legacy CDS has been decommissioned and replaced by the new CDS. Because ERA-Interim is available only through the CDS API,
      scripts that use an old .cdsapirc (url and key) must be updated with the new ECMWF account details.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380
  - date: "2023-06-01"
    level: critical
    title: Decommissioning of ECMWF Public Datasets service (Web API)
    body: >-
      As announced on 2 March 2023, the ECMWF Public Datasets service was retired on 1 June 2023, so ERA-Interim can no longer be retrieved with the Web API (ecmwfapi).
      ECMWF strongly advises migrating to ERA5 and keeps CDS API access open for those who still need ERA-Interim.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2019-08-31"
    level: info
    title: ERA-Interim production stopped
    body: Production of ERA-Interim stopped on 31 August 2019. Its successor is ERA5.
    source: https://confluence.ecmwf.int/spaces/CKB/pages/155337848/ERA-Interim+documentation

