# ─────────────────────────────────────────────────────────────
# ERA-Interim — dataset information file
# ─────────────────────────────────────────────────────────────
id: era-interim
name: ERA-Interim
full_name: ECMWF Interim Reanalysis (ERA-Interim)
category: reanalysis
domain: atmosphere
group: 재분석
order: 20
domains: [대기, 육지, 해양파랑]
provider: ECMWF (now distributed by the Copernicus Climate Change Service, C3S)

status: ended
status_note: >-
  Production stopped on 31 August 2019, and ERA-Interim has been superseded by ERA5. Web API (Public Datasets) access ended on 1 June 2023;
  the data remain available through the Climate Data Store (CDS) API "until further notice", by script only (no web-form download).
  A copy is also kept at NCAR GDEX. Unless you are reproducing older studies, use ERA5.

successor:
  name: ERA5
  url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
  note: >-
    1940 to present, about 31 km, 137 levels, hourly. ECMWF strongly advises ERA-Interim users to migrate to ERA5.
    The two use different models and data assimilation systems, so climatologies and trends can differ — do not splice them into one time series.

transitions:
  - from: ERA-Interim
    to: ERA5
    to_id: era5
    status: completed
    date: "2019-08"
    summary: Much higher resolution (79 km→31 km, 60→137 levels) and output frequency (6-hourly→hourly), plus ensemble-based uncertainty estimates and climate-oriented forcing; distribution moved to the CDS.
    changes:
      - aspect: Period
        before: 1979-01–2019-08 (ended)
        after: 1940-01–present (near-real-time updates, about 5-day latency)
      - aspect: Horizontal resolution
        before: About 79 km (T255)
        after: About 31 km (TL639); ensemble about 62–63 km
      - aspect: Vertical resolution and model top
        before: 60 levels, top at 0.1 hPa
        after: 137 levels, top at 0.01 hPa
      - aspect: Model and data assimilation
        before: IFS CY31r2, 4D-Var
        after: IFS CY41r2, 4D-Var
      - aspect: Output frequency
        before: Analyses 6-hourly, forecasts 3-hourly
        after: Hourly for both analyses and forecasts (ensemble 3-hourly)
      - aspect: Uncertainty information
        before: None
        after: Uncertainty from a 10-member Ensemble of Data Assimilations (EDA)
      - aspect: Forcing (SST, sea ice, radiation)
        before: As in operations at the time (inconsistent SST)
        after: Climate-oriented (CMIP5 greenhouse gases, volcanic aerosols, etc.; consistent SST and sea ice)
      - aspect: Observations and bias correction
        before: ERA-40 observations + GTS; VarBC for satellite radiances only; RTTOV-7 clear-sky radiances
        after: Reprocessed datasets and new satellites added; VarBC extended to ozone, aircraft and surface pressure; RTTOV-11 all-sky radiances
      - aspect: Number of single-level parameters
        before: About 100
        after: More than 240 (some ERA-Interim parameters are not available)
      - aspect: Accumulation reference
        before: Accumulated from the start of the forecast
        after: Accumulated since the previous post-processing (1-hour accumulations in the hourly data)
      - aspect: Performance
        before: Global-mean correlation with GPCP monthly precipitation 67%
        after: Correlation 77%; better fit to radiosondes for tropospheric temperature, wind and humidity; reforecast skill improved by up to one day
      - aspect: Distribution
        before: ECMWF Public Datasets / Web API (closed 2023) → now CDS API only
        after: Copernicus Climate Data Store (CDS)
    impacts:
      - Do not splice the two into one series. Climatologies and trends differ even over the 1979–2019 overlap, so long-term analyses are safest recomputed entirely with ERA5.
      - The accumulation convention differs. ERA-Interim accumulates from the forecast start (3, 6, 9, 12 hours, etc.) and needs differencing, whereas ERA5 hourly data are 1-hour accumulations. Running old scripts unchanged will give wrong precipitation and radiation.
      - ERA5 has a pronounced cold bias in the lower stratosphere in 2000–2006, for which a separate rerun, ERA5.1, exists. If you work on stratospheric temperature, humidity or ozone, use ERA5.1 for that period.
      - ERA5 provides ensemble spread, but the ensemble has a different resolution and output interval (3-hourly) from the main (HRES) data.
    sources:
      - name: ECMWF — What are the changes from ERA-Interim to ERA5 and ERA5-Land?
        url: https://confluence.ecmwf.int/spaces/CKB/pages/74764925/What+are+the+changes+from+ERA-Interim+to+ERA5+and+ERA5-Land
      - name: Hersbach et al. (2020), The ERA5 global reanalysis, QJRMS
        url: https://doi.org/10.1002/qj.3803
      - name: Dee et al. (2011), The ERA-Interim reanalysis, QJRMS
        url: https://doi.org/10.1002/qj.828
      - name: "ECMWF Technical Memo — Global stratospheric temperature bias and other stratospheric aspects of ERA5 and ERA5.1"
        url: https://www.ecmwf.int/en/elibrary/81149-global-stratospheric-temperature-bias-and-other-stratospheric-aspects-era5-and
      - name: NCAR GDEX — ERA5.1 Corrections to ERA5 Stratospheric Temperature 2000-2006
        url: https://gdex.ucar.edu/news/era51-corrections-to-era5-stratospheric-temperature-2000-2006/

period:
  start: "1979-01"
  end: "2019-08"
  note: 1 January 1979 to 31 August 2019. The 1979–1988 segment was produced later, in 2011.

resolution:
  spatial_short: "78 km (0.7°)"
  temporal_short: "3시간"
  spatial: "Spectral T255 / reduced Gaussian grid N128 (around 80 km) / ocean waves 1.0° × 1.0°"
  vertical: "60 model levels (top at 0.1 hPa) / 37 pressure levels (1000–1 hPa) / 16 potential temperature levels / potential vorticity level ±2 PVU"
  temporal: Analyses 6-hourly (00, 06, 12, 18 UTC), forecasts 3-hourly (monthly means provided separately)

update: Ended (August 2019)
license: ERA-Interim Product licence (CDS) / NCAR GDEX copy under CC BY 4.0 + ECMWF terms of use
account_required: true

summary: >-
  The ECMWF global atmospheric reanalysis that succeeded ERA-40, covering 1 January 1979 to 31 August 2019.
  It was the first ECMWF reanalysis to make full use of 12-hour 4D-Var data assimilation and variational bias correction of satellite radiances (VarBC),
  and was among the most widely cited reanalyses in climate research of the 2010s. It has been superseded by ERA5.

time_convention:
  summary: >-
    Analysis fields are instantaneous values at 00, 06, 12 and 18 UTC. Accumulated fields such as precipitation, radiation and heat fluxes come only from forecasts started at 00 or 12 UTC,
    and are accumulated from the start of the forecast to the selected step (3, 6, 9, 12 hours, etc.).
  points:
    - "Accumulations run from the start of the forecast. Example: tp at step 12 of the 00 UTC forecast = 12-hour precipitation from 00 to 12 UTC. Get 3-hour amounts by differencing adjacent steps (step 6 − step 3)."
    - "ECMWF's guidance for daily precipitation is to add step 12 of the 00 UTC forecast and step 12 of the 12 UTC forecast."
    - "To convert accumulated radiation and heat fluxes in W m-2 s (= J m-2) to mean fluxes (W m-2), divide by the accumulation period in seconds (e.g. 43200 for 12 hours)."
    - "Minimum/maximum fields (e.g. mx2t) refer to the period since the previous post-processing (archived step). Example: step 9 of the 00 UTC forecast = 06–09 UTC."
    - "Among the monthly means, moda (monthly means of daily means) holds analysis and instantaneous forecast fields only; monthly means of accumulated fields are in the separate mdfa stream (monthly means of daily forecast accumulations)."
  source: https://confluence.ecmwf.int/spaces/CKB/pages/155337848/ERA-Interim+documentation
  source_name: "ERA-Interim documentation (Copernicus Knowledge Base)"

variables:
  note: >-
    Main parameters from the parameter tables of the official ECMWF ERA-Interim documentation and the ERA-Interim archive report.
    Names are ECMWF GRIB short names. The data are GRIB1, and accumulated fields (precipitation, radiation, heat fluxes) are accumulated from the start of the forecast.
  full_list: https://confluence.ecmwf.int/spaces/CKB/pages/155337848/ERA-Interim+documentation
  groups:
    - name: Surface and single level
      kind: instant
      items:
        - "2 metre temperature — `2t` (K)"
        - "2 metre dewpoint temperature — `2d` (K)"
        - "10 metre U wind component — `10u` (m s-1)"
        - "10 metre V wind component — `10v` (m s-1)"
        - "Mean sea level pressure — `msl` (Pa)"
        - "Surface pressure — `sp` (Pa)"
        - "Sea surface temperature — `sst` (K)"
        - "Sea-ice cover — `ci` (0-1)"
        - "Skin temperature — `skt` (K)"
        - "Total cloud cover — `tcc` (0-1)"
        - "Total column water vapour — `tcwv` (kg m-2)"
        - text: "Boundary layer height (forecast) — `blh` (m)"
          kind: instant
          note: "Forecast only (value at the forecast step)"
    - name: Accumulated forecast fields
      kind: accum
      period: "Since forecast start"
      items:
        - "Total precipitation — `tp` (m of water)"
        - "Surface solar radiation downwards — `ssrd` (W m-2 s)"
        - "Surface thermal radiation downwards — `strd` (W m-2 s)"
        - "Top net thermal radiation — `ttr` (W m-2 s)"
        - "Surface sensible heat flux — `sshf` (W m-2 s)"
        - "Surface latent heat flux — `slhf` (W m-2 s)"
    - name: Pressure levels (37 levels)
      kind: instant
      items:
        - "Geopotential — `z` (m2 s-2)"
        - "Temperature — `t` (K)"
        - "U component of wind — `u` (m s-1)"
        - "V component of wind — `v` (m s-1)"
        - "Vertical velocity — `w` (Pa s-1)"
        - "Specific humidity — `q` (kg kg-1)"
        - "Relative humidity — `r` (%)"
        - "Vorticity (relative) — `vo` (s-1)"
        - "Divergence — `d` (s-1)"
        - "Potential vorticity — `pv` (K m2 kg-1 s-1)"
        - "Ozone mass mixing ratio — `o3` (kg kg-1)"
        - "Specific cloud liquid and ice water content — `clwc`, `ciwc` (kg kg-1)"
    - name: Ocean waves (1.0° grid)
      kind: instant
      items:
        - "Significant height of combined wind waves and swell — `swh` (m)"
        - "Mean wave direction — `mwd` (degree)"
        - "Mean wave period — `mwp` (s)"
    - name: Land surface and invariants
      kind: instant
      items:
        - "Soil temperature level 1 — `stl1` (K)"
        - "Volumetric soil water layer 1 — `swvl1` (m3 m-3)"
        - "Snow depth — `sd` (m of water equivalent)"
        - text: "Land-sea mask — `lsm` (0-1)"
          kind: static
        - text: "Geopotential at the surface (orography) — `z` (m2 s-2)"
          kind: static

access:
  - name: Copernicus Climate Data Store (CDS) — ERA-Interim
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-era-interim
    method: CDS API (cdsapi) scripts only
    note: >-
      Requires an ECMWF account, and you must first accept the ERA-Interim Product licence on the dataset page.
      There is no web-form download; data can be retrieved only with scripts as described on the ECMWF help page. Format is GRIB1.
  - name: ECMWF help — How to download ERA-Interim data from the ECMWF data archive
    url: https://confluence.ecmwf.int/spaces/CKB/pages/85419044/How+to+download+ERA-Interim+data+from+the+ECMWF+data+archive
    method: Documentation (example CDS API requests)
  - name: NSF NCAR GDEX — ERA-Interim Project (d627000)
    url: https://gdex.ucar.edu/datasets/d627000/
    method: Web download / subsetting / NCAR HPC (GLADE)
    note: >-
      NCAR account required (for subsetting, etc.). GRIB1, about 39 TB in total. GDEX flags this dataset as recommended for ancillary use only and superseded by a newer dataset.

tips:
  - "ECMWF known issue: CAPE is zero at forecast step 3 (03 and 15 UTC) because of an error in how ERA-Interim calculated CAPE at that step. Do not use CAPE at those times."
  - "At forecast steps 3/6/9/15/18/21, SST over land is 0 °C rather than missing. Always mask out land with the land-sea mask (lsm)."
  - The NCAR Climate Data Guide lists as main limitations an overly strong hydrological cycle over the oceans (precipitation and evaporation) and a warm, moist bias below 850 hPa in the Arctic relative to radiosondes.
  - Old Web API scripts (ecmwfapi, class=ei) have not worked since June 2023. To reproduce earlier work, rewrite them for the CDS API or use the NCAR copy.

