# ─────────────────────────────────────────────────────────────
# GISTEMP v4 — dataset information file (English edition)
# Listed under the Atmosphere tab (temperature datasets). Combines GHCN v4 over land with ERSST v5 over the ocean.
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gistemp
name: GISTEMP v4
full_name: GISS Surface Temperature Analysis, version 4
category: analysis
domain: atmosphere
group: 기온 자료
order: 20
domains: [대기, 해양]
provider: NASA Goddard Institute for Space Studies (GISS)

status: active
status_note: >-
  Operational, updated around the 10th of every month. As of October 2026 the ocean input is still
  ERSST v5 (file name gistemp1200_GHCNv4_ERSSTv5), but NOAA has announced that ERSST v5 will be
  discontinued in favour of ERSST v6, so a change of ocean input is likely. We will update this page
  when GISS announces it.

period:
  start: "1880-01"
  end: present
  note: >-
    Under the GISS 2026 release schedule, the September 2026 data were due on 2026-10-09. We could not open
    the tables (tabledata_v4) during this check, so the latest month has not been confirmed. Each monthly
    update can also revise earlier months as late reports and corrections arrive.

resolution:
  spatial_short: "222 km (2°)"
  temporal_short: "1개월"
  spatial: >-
    NetCDF and Zarr files on a regular 2°×2° grid; the basic analysis files (SBBX) are on an equal-area subbox grid.
    Provided as the Land-Ocean Temperature Index with 1200 km smoothing and as surface air temperature
    (no ocean data) with 250 km smoothing
  vertical: Surface only (surface air temperature over land and sea ice blended with sea surface temperature over open ocean)
  temporal: Monthly mean anomalies (the tables also give seasonal and annual means)

update: Monthly, around the 10th, simultaneously with NOAA/NCEI's monthly Global Analysis release
license: >-
  U.S. Government (NASA) data with no licence stated on the site; GISS asks users to credit
  "NASA's Goddard Institute for Space Studies" (or "NASA GISS/GISTEMP") and to cite the webpage and the latest publication
account_required: false

summary: >-
  The GISS Surface Temperature Analysis version 4 (GISTEMP v4) is an estimate of global surface temperature
  change since 1880. It combines NOAA GHCN v4 meteorological station data over land with ERSST v5 over ocean
  areas, following Hansen et al. (2010) and Lenssen et al. (2024), and reports anomalies relative to the
  1951–1980 means. Station anomalies are spread over a 1200 km radius, so sparsely observed regions such as the
  Arctic are filled. A 200-member observational uncertainty ensemble (1880–2020) is also available.

time_convention:
  summary: >-
    Every value is a monthly mean temperature anomaly (°C) relative to the 1951–1980 mean for the same month.
    These are not instantaneous values; the seasonal and annual values in the tables are means of the monthly values.
  points:
    - "From the GISS FAQ: 'normal' always means the average over the 30-year period 1951–1980 for that place and time of year. GISS keeps this fixed base period because a fixed base period yields anomalies that are consistent over time."
    - "LOTI uses surface air temperature anomalies over land and sea ice, and sea surface temperature anomalies only over ice-free water; SSTs in grid boxes with sea ice (or lakes) are not used."
    - "Late reports and the way records are combined mean that each monthly update can slightly change earlier months and years."
    - "The AIRS-based tables use a different base period (2007–2016); do not compare them directly with LOTI values."
  source: https://data.giss.nasa.gov/gistemp/faq/
  source_name: GISTEMP FAQ / Data Downloads page

variables:
  note: >-
    Products as listed on the official Data Downloads page. We could not open the NetCDF files during this check,
    so the variable names inside them are not given here (run ncdump -h after downloading).
  full_list: https://data.giss.nasa.gov/gistemp/data_v4.html
  groups:
    - name: Gridded data (regular 2°×2° grid, NetCDF and Zarr)
      kind: mean
      period: Monthly
      items:
        - "Land-Ocean Temperature Index, ERSSTv5, 1200km smoothing — gistemp1200_GHCNv4_ERSSTv5 (°C)"
        - "Surface air temperature (no ocean data), 250km smoothing — gistemp250_GHCNv4 (°C)"
        - text: "Land mask on a 2°×2° grid — landmask.2degx2deg.txt"
          kind: static
    - name: Summary tables (L-OTI, plain text and CSV)
      kind: mean
      period: Monthly
      items:
        - "Global, Northern and Southern Hemisphere means — GLB/NH/SH.Ts+dSST (°C; monthly, seasonal and annual)"
        - text: "Zonal annual means — ZonAnn.Ts+dSST (°C)"
          kind: mean
          period: Annual
    - name: Observational uncertainty ensemble (Lenssen et al. 2024)
      kind: mean
      period: Monthly
      items:
        - "200-member gridded anomaly ensemble (2°×2°, 1880–2020) — FullEnsembleZips (°C)"
        - "Key global, hemispheric and zonal monthly mean series, all 200 members — KeySeries.zip (°C)"
        - "Gridded summary statistics — GriddedSummary.zip"

access:
  - name: GISTEMP Data Downloads
    url: https://data.giss.nasa.gov/gistemp/data_v4.html
    method: HTTPS (browser / wget / curl)
    note: >-
      Summary tables (tabledata_v4/GLB.Ts+dSST.csv etc.), gzip-compressed 2°×2° NetCDF and Zarr v3 (tar.gz) files,
      the basic SBBX files and Fortran code to read them. Gridded files live under https://data.giss.nasa.gov/pub/gistemp/.
  - name: Observational uncertainty ensemble v2.0
    url: https://data.giss.nasa.gov/gistemp/uncertainty/
    method: HTTPS
    note: >-
      The full 200-member ensemble (16 ZIP archives of about 700 MiB each), KeySeries.zip, GriddedSummary.zip and R analysis code.
      Some downloads ask for the shared user ID and password given on the page. The NetCDF files were updated on 2024-10-01 to fix
      a minor error in labelling the time dimension.
  - name: Station data
    url: https://data.giss.nasa.gov/gistemp/station_data_v4_globe/
    method: Web tool
    note: Browse and download raw and adjusted records for individual stations.
  - name: GISTEMP source code
    url: https://data.giss.nasa.gov/gistemp/sources_v4/
    method: HTTPS (tar.gz)

example:
  lang: python
  note: >-
    Downloads the 1200 km LOTI grid and computes an area-weighted global mean. Open the file first and adjust
    variable and coordinate names if needed (the code below picks the first time-lat-lon variable automatically).
  code: |
    import gzip, shutil, urllib.request
    import numpy as np
    import xarray as xr

    url = "https://data.giss.nasa.gov/pub/gistemp/gistemp1200_GHCNv4_ERSSTv5.nc.gz"
    urllib.request.urlretrieve(url, "gistemp1200.nc.gz")
    with gzip.open("gistemp1200.nc.gz") as fi, open("gistemp1200.nc", "wb") as fo:
        shutil.copyfileobj(fi, fo)

    ds = xr.open_dataset("gistemp1200.nc")
    print(ds)                                         # check variable/coordinate names and units
    name = [v for v in ds.data_vars if ds[v].ndim == 3][0]
    da = ds[name]                                     # monthly anomalies vs 1951-1980
    tdim, ydim, xdim = da.dims
    w = np.cos(np.deg2rad(da[ydim]))
    glob = da.weighted(w).mean([ydim, xdim])
    print(glob.isel({tdim: slice(-12, None)}).round(2).to_series())

tips:
  - Anomalies are relative to 1951–1980, so they look warmer than HadCRUT5 (1961–1990). Rebase to a common period before comparing datasets.
  - The 1200 km product extends station information far into the Arctic and the Antarctic interior. When interpreting polar results, check them against the 250 km land product and the station coverage.
  - As of October 2026 the ocean input is ERSST v5. NOAA adopted ERSST v6 in 2026 and has announced the end of v5; if GISTEMP switches its ocean input, values for the whole record may change. Keep an eye on the Updates to Analysis page.
  - Monthly updates revise past values, so record your download date and archive the files you used (the GISS citation includes an access date).
  - The uncertainty ensemble (v2.0) covers 1880–2020 only and is not updated monthly. For recent years, use the FAQ's rough figure (about ±0.05°C for annual global means after 1960).
  - GISS removes faulty station reports as they are found and reports them to NOAA (e.g. three Maliye Karmakuly reports dropped in September 2025). For regional or station-level work, check the Updates to Analysis log.

