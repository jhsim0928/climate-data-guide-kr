notices:
  - date: "2026-09-14"
    level: info
    title: New GISTEMP GMSTA page — current and next year's GMST anomaly estimates (vs 1850–1900)
    body: >-
      GISS added a page, run in partnership with the International Research Institute for Climate and Society (Columbia University),
      showing estimates of the current and next years' annual Global Mean Surface Temperature anomaly relative to the pre-industrial
      period 1850–1900, updated monthly by the middle of the month. The LOTI data themselves (1951–1980 base) are unchanged.
    source: https://data.giss.nasa.gov/gistemp/gmsta/
  - date: "2026-06-10"
    level: info
    title: AIRS v7 displays now include recent corrections for 2021–2025
    body: AIRS v7-based displays now include all recent corrections, mostly for 2021–2025, and months corrected in AIRS v6 are also used in the products. These are separate from the GHCN/ERSST-based LOTI.
    source: https://data.giss.nasa.gov/gistemp/updates_v4/
  - date: "2026-04-26"
    level: warning
    title: Ocean input ERSST v5 to be discontinued (NOAA, June 2026)
    body: >-
      NOAA PSL announced that "the NOAA ERSSTv5 dataset will be discontinued by NOAA/NCEI in June 2026" and replaced by ERSSTv6.
      As of October 2026 GISTEMP still uses ERSST v5 (per its home and Data Downloads pages), and no plan to change the input has been announced.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-09-11"
    level: info
    title: Faulty station reports omitted (Maliye Karmakuly)
    body: The August 2025 report from Maliye Karmakuly was confirmed to be about 12°C off. It was omitted from the analysis together with faulty June 2024 and June 2025 reports from the same station (about 3–4°C off), and all three were reported to NCEI.
    source: https://data.giss.nasa.gov/gistemp/updates_v4/
  - date: "2024-09-04"
    level: info
    title: GISTEMP v4 observational uncertainty ensemble published (Lenssen et al. 2024)
    body: >-
      An ensemble of 200 equally likely reconstructions (2°×2° grid, 1880–2020) was released with the JGR Atmospheres paper.
      The NetCDF files were updated on 2024-10-01 to fix a minor error in labelling the time dimension; download them again if you got them earlier.
    source: https://data.giss.nasa.gov/gistemp/uncertainty/

