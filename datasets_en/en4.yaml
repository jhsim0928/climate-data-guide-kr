# ─────────────────────────────────────────────────────────────
# EN4 — dataset information file (English edition)
# Met Office Hadley Centre EN.4.2.2 (quality-controlled temperature and salinity profiles + monthly objective analyses)
# After editing, set last_verified to the date the official pages were checked.
# ─────────────────────────────────────────────────────────────
id: en4
name: EN4
full_name: "EN4: Quality-Controlled Subsurface Ocean Temperature and Salinity Profiles and Objective Analyses, version EN.4.2.2"
category: analysis
domain: ocean
group: 수온·염분 분석장
order: 10
domains: [해양]
provider: Met Office Hadley Centre

status: active
status_note: >-
  The current version, EN.4.2.2, is updated monthly. In late 2023, 2024 and 2025 some months were produced without full access to GTSPP, the non-Argo data source;
  the affected files have either been reprocessed or the gaps are described on the download page. Earlier versions (EN.4.2.1 and before) remain downloadable but are no longer updated.

period:
  start: "1900-01"
  end: present
  note: >-
    On 2026-10-12 the latest preliminary files on the download page were for August 2026 (202608), and the yearly zip files run through 2026.
    Data are available about two months after collection, with preliminary versions released about a month earlier. Early decades (especially before 1950) have very sparse observations, so the analyses stay close to climatology.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1개월"
  spatial: >-
    Objective analyses: regular 1° latitude/longitude grid, 360 longitudes × 173 latitudes (the southernmost ~7° contain no ocean and are not stored, so the grid starts at 83°S) /
    Profiles: at observed locations (not gridded)
  vertical: >-
    Objective analyses: 42 unevenly spaced levels — first layer 0–10.0475 m (centre about 5.02 m), last layer 5200.5986–5500 m (centre about 5350.27 m);
    depth values are the approximate mid-points of each layer (depth, depth_bnds). Profiles: observed levels, maximum 400 levels (deepest levels thinned to roughly every 50 m below 2000 m)
  temporal: Objective analyses are monthly; profile files hold one month of observations at their observed times

update: Monthly (final data about 2 months after collection; preliminary files for the previous month usually appear around the 12th–18th)
license: >-
  Crown Copyright, provided under a Non-Commercial Government Licence (v2) — free for personal study and scientific research; contact the Met Office Customer Centre for commercial use.
  A credit line and citation of Good et al. (2013) and of the bias-correction paper(s) used are required
account_required: false

summary: >-
  EN4 is the Met Office Hadley Centre's global subsurface ocean temperature and salinity dataset. It consists of two products: observed profiles with data-quality information,
  and monthly 1° objective analyses formed from those profiles, with uncertainty estimates. Profiles come from Argo, ASBO, GTSPP and the World Ocean Database, and the record runs from 1900 to the present.
  Four versions apply different XBT and MBT bias-correction schemes (g10, l09, c13, c14), giving a measure of structural uncertainty.
  EN4 is widely used for ocean heat and salinity change studies, model evaluation and comparison with ocean reanalyses.

time_convention:
  summary: >-
    The objective analyses are monthly fields built from one month of observations: time is the middle of the analysed month and time_bnds its beginning and end.
    Profile files collect one month of observations; each profile is an instantaneous measurement at its observation time (JULD).
  points:
    - "Analysis time is in days since 1800-01-01; profile JULD is the Julian day relative to REFERENCE_DATE_TIME, 1950-01-01 (Product User Guide)."
    - "The background is a persistence-based forecast of the previous month's analysis that incorporates the 1971–2000 climatology. Without observations over the long term, the analyses relax back to the 1971–2000 climatology."
    - "Observation weights near 1 mean the value is driven by that month's observations; near 0 mean no observations were available and the background (climatology) dominates. Values can exceed 1."
    - "Preliminary (p) files may change when the finalised (f) files are released; the p/f letter in the file name tells them apart."
  source: https://www.metoffice.gov.uk/hadobs/en4/EN.4.2.2_Product_User_Guide_v1.0.pdf
  source_name: EN.4.2.2 Product User Guide v1.0 · EN4 analysis file format page · EN4 FAQ

variables:
  note: >-
    Based on the EN.4.2.2 file-format pages, FAQ and Product User Guide. Analysis temperature is potential temperature (reference pressure 0 dbar) stored in Kelvin;
    salinity is practical salinity with units of "1" (changed from psu in EN.4.2.0 for CF compliance, values unchanged).
  full_list: https://www.metoffice.gov.uk/hadobs/en4/en4-2-2-analysis-file-format.html
  groups:
    - name: Objective analyses (EN.4.2.2.f.analysis.<correction>.YYYYMM.nc)
      kind: mean
      period: month
      items:
        - "Potential temperature — `temperature` (K)"
        - "Salinity (practical salinity) — `salinity` (1)"
        - text: "Analysis error standard deviation of the potential temperature — `temperature_uncertainty` (K)"
          note: Uncertainties are not independent between grid points and have no defined correlation structure, so they cannot be combined assuming independence for area averages
        - "Analysis error standard deviation of the salinity — `salinity_uncertainty` (1)"
        - text: "Relative weighting of observations versus background — `temperature_observation_weights`, `salinity_observation_weights` (dimensionless, about 0–1)"
          note: Shows how much observations versus the background drove the analysis; check before any trend analysis
    - name: Profiles (EN.4.2.2.f.profiles.<correction>.YYYYMM.nc)
      kind: instant
      items:
        - "Potential temperature, bias-corrected — `POTM_CORRECTED` (°C)"
        - "In situ temperature — `TEMP` (°C)"
        - "Practical salinity — `PSAL_CORRECTED` (1)"
        - "Depth, bias-corrected — `DEPH_CORRECTED` (m)"
        - "Julian day of the profile — `JULD` (days since 1950-01-01)"
        - text: "Quality-control flags — `PROFILE_POTM_QC`, `PROFILE_PSAL_QC`, `QC_FLAGS_PROFILES`, `QC_FLAGS_LEVELS`"
          note: Results of EN4's own automatic QC; apart from Argo, most QC flags supplied with the input data are discarded and re-assessed by EN4

access:
  - name: Met Office Hadley Centre — EN.4.2.2 download page
    url: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
    method: Web download (yearly zip files; recent preliminary months as .nc.gz) / wget list files
    note: >-
      Profiles and analyses are provided separately for each bias-correction option (g10, l09, c13, c14). For multi-year downloads, use the per-option list files,
      e.g. `EN.4.2.2.analyses.g10.download-list.txt`, with `wget -i`. No account is needed.
      Data without bias corrections are available on request.
  - name: Earlier versions (EN.4.2.1 and before)
    url: https://www.metoffice.gov.uk/hadobs/en4/download.html
    method: Web download
    note: No longer updated; use only to reproduce earlier studies.

example:
  lang: python
  note: >-
    Download EN.4.2.2.analyses.g10.2020.zip from the download page and unzip it first; it contains the monthly files EN.4.2.2.f.analysis.g10.2020MM.nc.
  code: |
    # pip install xarray netCDF4 dask
    import xarray as xr

    ds = xr.open_mfdataset("EN.4.2.2.f.analysis.g10.2020*.nc")
    temp_c = ds["temperature"] - 273.15          # Kelvin -> degC (potential temperature)
    w = ds["temperature_observation_weights"]

    # Mask grid boxes where observations had little influence (mostly background/climatology)
    temp_obs = temp_c.where(w > 0.5)
    print(temp_obs.sel(depth=5, method="nearest").sel(lat=slice(30, 45), lon=slice(120, 135)).mean(["lat", "lon"]).values)

tips:
  - >-
    Where observations are missing, the analyses relax back to the 1971–2000 climatology, so variability and trends are damped in sparsely sampled periods and regions
    (before 1950, high southern latitudes, the deep ocean). The FAQ discourages trend analysis where observation weights are low; map `*_observation_weights` before computing heat-content trends.
  - >-
    g10, l09, c13 and c14 differ only in their XBT/MBT bias corrections (g10: Gouretski & Reseghetti 2010 XBT + Gouretski & Cheng 2020 MBT;
    l09: Levitus et al. 2009 XBT and MBT; c13: Cowley et al. 2013 XBT + Levitus et al. 2009 MBT; c14: Cheng et al. 2014 XBT + Gouretski & Cheng 2020 MBT).
    The Met Office recommends looking at all four to see what impact the choice makes. Quote the version (EN.4.2.2) and the correction used in publications.
  - Analysis temperature is potential temperature in Kelvin (with the 273.15 offset in the file); profile POTM_CORRECTED is in °C. Do not mix the two.
  - >-
    Where no background salinity is available, potential temperature is computed assuming a salinity of 35.0 and flagged as untrustworthy. Always apply the QC flags when using the profiles directly.
  - >-
    World Ocean Database (WOD18) data were taken as a single download in October 2020 and will not be updated until the next EN4 version, so there are no WOD-sourced observations after late 2020.
    Recent years rely mainly on Argo and GTSPP; if coastal or ship-based observations matter for your study, check WOD as well.
  - EN4 does not take data from surface-only sources. For gridded sea surface temperature, the FAQ recommends HadSST4 or HadISST.

