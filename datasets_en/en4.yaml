  acknowledgement: >-
    The terms and conditions require a credit line: "EN.4.2.2 data were obtained from https://www.metoffice.gov.uk/hadobs/en4/ and are © Crown Copyright, Met Office,
    [year of first publication], provided under a Non-Commercial Government Licence" (outside the UK, "© British Crown Copyright"). Quote the version, the bias corrections used and the download date.
    Cite Good et al. (2013) and the paper(s) for the bias corrections you used, and acknowledge the input data sources (Argo, ASBO, GTSPP, WOD18) as set out in the Product User Guide.
    The guide also lists the Hanawa et al. (1995) and Kizu et al. (2005) XBT fall-rate adjustments, applied in all versions, as references.

notices:
  - date: "2025-11"
    level: warning
    title: GTSPP service pause — non-Argo data missing from September and October 2025 files
    body: >-
      A pause in the GTSPP service meant the September 2025 preliminary and final files contain only some GTSPP data, and the October 2025 preliminary file contains none.
      The service has resumed and the Met Office is monitoring the situation. The page gives no posting date, so the date here is when the affected files appeared (around November 2025).
      Re-check analyses for this period that depend on coastal or ship-based observations.
    source: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
  - date: "2024-11"
    level: info
    title: September 2024 preliminary files lack Pacific GTSPP data — final files are complete
    body: >-
      The September 2024 preliminary (p) files were produced without any GTSPP (non-Argo) data in the Pacific Ocean. This was fixed before the final (f) files were released in November 2024,
      which used the usual Argo and GTSPP inputs; replace any preliminary files you downloaded.
    source: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
  - date: "2024-01-29"
    level: warning
    title: October–December 2023 data reprocessed — download again
    body: >-
      The Met Office was unable to fully access GTSPP data for October to December 2023; the files have since been reprocessed with the new data.
      If you downloaded data for these months between 12 December 2023 and 29 January 2024, download the new files.
    source: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
  - date: "2021-08-25"
    level: info
    title: EN.4.2.2 — WOD18 input not updated after late 2020
    body: >-
      According to the EN.4.2.2 Product User Guide (25 August 2021), WOD18 was taken as a single download in October 2020 and will not be updated until a new EN4 version,
      so no WOD-sourced observations enter after late 2020. The same version introduced the Gouretski & Cheng (2020) MBT corrections, added the c13 and c14 sets,
      and removed eight TAO buoys (2015–2016) with spurious salinity and one early Argo float with stuck depths.
    source: https://www.metoffice.gov.uk/hadobs/en4/EN.4.2.2_Product_User_Guide_v1.0.pdf

