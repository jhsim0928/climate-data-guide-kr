# ─────────────────────────────────────────────────────────────
# neXtSIM Sea Ice Reanalysis — dataset information file
# Copernicus Marine ARCTIC_MULTIYEAR_PHY_ICE_002_016 (NERSC neXtSIM-F stand-alone sea ice reanalysis, first released 2024-11-26)
# ─────────────────────────────────────────────────────────────
id: nextsim
name: neXtSIM Sea Ice Reanalysis
full_name: Arctic Ocean Sea Ice Reanalysis (ARCTIC_MULTIYEAR_PHY_ICE_002_016, neXtSIM-F)
category: reanalysis
domain: seaice
group: 재분석
order: 30
domains: [해빙]
provider: >-
  Nansen Environmental and Remote Sensing Center (NERSC), Norway — Copernicus Marine Service Arctic Monitoring and Forecasting Centre (ARC MFC) /
  distributed by the Copernicus Marine Service (Mercator Ocean International)

status: active
status_note: >-
  A multi-year (MY) reanalysis in regular production on Copernicus Marine. The update of 2026-09-21 extended the daily data to 2026-05-31 and the monthly data to May 2026.
  However, two assimilated inputs named in the PUM and QUID have changed: the OSI SAF SSMIS sea ice concentration interim record was suspended on 2025-10-17, and AWI's merged
  thickness moved from CS2SMOS to CS3SMOS from the 2025/26 winter. As of 2026-10-12 the official documentation does not say which inputs were used after these changes.

period:
  start: "1993-01"
  end: present
  note: >-
    According to the Copernicus Marine (STAC) metadata, daily data cover 1993-01-01 to 2026-05-31 (12,204 days) and monthly data January 1993 to May 2026 (401 months), as of the
    2026-09-21 update. The PUM gives the period as "1993 to Y-1" with "yearly updates in November after the update of ARCTIC_MULTIYEAR_PHY_002_003", while the QUID says the product is
    "extended regularly every 6 months", so the documents disagree. The initial state is the TOPAZ4 reanalysis plus a two-year spin-up (PUM). Thickness is assimilated only in winter
    (October–April) from October 2010 onward.

resolution:
  spatial_short: "3 km (0.03°)"
  temporal_short: "1일"
  spatial: >-
    Model: neXtSIM-F ("neXtSIM Lagrangian version 2023" in the PUM) on a moving (Lagrangian) triangular mesh with "triangle sides of about 10 km (corresponding to about 7 km square
    grid resolution)"; model domain from the Bering Strait to 50°N in the Labrador Sea (Pacific excluded). Output: bilinearly interpolated from the model mesh to a 3 km polar
    stereographic grid (originalGrid part, x 2467 × y 2367, x −3,600,000 to 3,798,000 m, y −4,300,000 to 2,798,000 m, spacing 3,000 m,
    "+proj=stere +lat_0=90 +lat_ts=90 +lon_0=-45 +x_0=0 +y_0=0 +R=6378273 +ellps=sphere +units=m +no_defs" — a spherical Earth, not the WGS 84 ellipsoid).
    The default Copernicus Marine datasets re-interpolate this to a 0.03° latitude–longitude grid (49.98–90.03°N, 1336 × 12000).
    Product coverage: "North of 63°N and ice-covered North Atlantic Ocean" (PUM); north of 63°N with a margin out to 53°N (QUID)
  vertical: Not applicable (2D sea ice and snow variables only)
  temporal: Daily means (centred at 12:00 UTC, PUM) and monthly means (centred at mid-month); a separate 1993–2022 monthly climatology dataset

update: >-
  The stated update frequency differs between documents (PUM: yearly in November; QUID: every 6 months; product page: "Unknown"). The most recent extension at the time of checking
  was on 2026-09-21 (data to 2026-05-31).
license: Copernicus Marine Service Licence / Terms of Use (free of charge; acknowledge the source and cite the DOI). The product metadata lists the license as "proprietary"
account_required: true

summary: >-
  A stand-alone Arctic sea ice reanalysis produced by NERSC with the neXtSIM-F sea ice model. neXtSIM solves the Brittle-Bingham-Maxwell (BBM) rheology, which treats sea ice as a
  brittle material, with a finite-element method on an adaptive Lagrangian triangular mesh. It is forced by hourly ERA5 atmospheric fields and daily ocean fields from the TOPAZ4b
  physical reanalysis (ARCTIC_MULTIYEAR_PHY_002_003). OSI SAF SSMIS sea ice concentration is assimilated daily, and CS2SMOS winter (October–April) thickness from October 2010.
  Besides concentration, thickness, snow depth and drift, it provides multiyear and young ice fractions, ice age, ridged ice volume fraction and albedo on a 3 km grid,
  which makes it well suited to studies of sea ice dynamics.

time_convention:
  summary: >-
    All variables are averages of hourly model output. Daily fields are 24-hour means (centred at 12:00 UTC, PUM) and monthly fields are monthly means (centred at mid-month);
    there are no instantaneous datasets. The climatology dataset is the 1993–2022 mean of each calendar month.
  points:
    - "The file metadata give cell_methods = \"time: mean (interval: 1 hours)\", i.e. averages of hourly model output."
    - "The native time units are days since 1900-01-01 00:00:00. The Copernicus Marine (STAC) metadata label the daily time axis from 1993-01-01T00:00:00Z in one-day steps and the monthly axis on the 1st of each month; these stamps denote the mean over that whole day or month."
    - "Assimilation is daily (the PUM text describes data insertion as a weighted function of forecast and observations, while the PUM table and the QUID call it nudging). Day-to-day changes such as thickness growth rates therefore mix model physics with assimilation increments."
    - "CS2SMOS thickness (7-day moving window) is inserted daily from October to April only. Thickness from May to September, and before October 2010, is unconstrained by thickness observations."
    - "The climatology dataset (cmems_mod_arc_phy_my_3km-climatology_P1M-m) has 12 time steps labelled 2007-01 to 2007-12; they are the 1993–2022 means of each month, as recorded in climatology_bounds (1993-01-01 to 2023-01-01)."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-016.pdf
  source_name: Copernicus Marine PUM (CMEMS-ARC-PUM-002-016, Issue 1.0, 2025-11) · QUID (CMEMS-ARC-QUID-002-016, Issue 1.0)

variables:
  note: >-
    Names checked against the metadata of the Copernicus Marine daily dataset (cmems_mod_arc_phy_my_nextsim_P1D-m_202411, including originalGrid) and the PUM variable table.
    The monthly and climatology datasets contain the same 10 variables. Damage, the key state variable of the BBM rheology, and deformation or stress fields are not included in this product.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-016.pdf
  groups:
    - name: Sea ice and snow state
      kind: mean
      period: Daily/monthly
      items:
        - "Sea ice area fraction — `siconc` (1)"
        - "Sea ice thickness — `sithick` (m)"
        - "Surface snow thickness — `sisnthick` (m)"
        - text: "Sea ice volume fraction of ridged ice — `si_ridge_ratio` (1)"
          note: A statistical indication of pressure ridges in the grid cell; carries no information on individual ridges (PUM)
    - name: Ice type and age
      kind: mean
      period: Daily/monthly
      items:
        - text: "Multiyear ice area fraction — `siconc_my` (1)"
          note: Shares the CF standard_name sea_ice_classification with the young ice fraction; tell them apart by variable name
        - "Young ice area fraction — `siconc_young` (1)"
        - text: "Sea ice age — `siage` (years)"
          note: Volume-weighted mean age, generally lower than satellite surface-based ice age. Not fully spun up until about 2000 (QUID)
    - name: Ice drift and albedo
      kind: mean
      period: Daily/monthly
      items:
        - text: "Sea ice velocity components — `vxsi`, `vysi` (m s-1)"
          note: Eastward/northward components in the default lat–lon datasets; x/y components of the polar stereographic grid (sea_ice_x/y_velocity) in originalGrid
        - text: "Sea ice albedo — `sialb` (1)"
          note: About 0.1 too high in June–July (QUID; possibly because the model version used does not represent melt ponds)

access:
  - name: Copernicus Marine — ARCTIC_MULTIYEAR_PHY_ICE_002_016
    url: https://data.marine.copernicus.eu/product/ARCTIC_MULTIYEAR_PHY_ICE_002_016/description
    method: Copernicus Marine Toolbox (Python, CLI) / web download (Subset, File Browser)
    note: >-
      A free Copernicus Marine account is required. Dataset IDs: daily mean cmems_mod_arc_phy_my_nextsim_P1D-m and monthly mean cmems_mod_arc_phy_my_nextsim_P1M-m
      (version tag 202411), monthly climatology cmems_mod_arc_phy_my_3km-climatology_P1M-m (202511). The native 3 km polar stereographic grid is served separately as the
      originalGrid part of each dataset.
  - name: Copernicus Marine Toolbox documentation
    url: https://toolbox-docs.marine.copernicus.eu/en/stable/
    method: Python / command line (CLI)
    note: subset (area and variable extraction) returns the interpolated lat–lon version; get downloads the original NetCDF files unchanged.
  - name: Product User Manual (PUM) and Quality Information Document (QUID)
    url: https://documentation.marine.copernicus.eu/QUID/CMEMS-ARC-QUID-002-016.pdf
    method: Web documents (PDF)
    note: The QUID summarises the validation of concentration, thickness, age, albedo and drift (Table 1).

example:
  lang: python
  note: >-
    Install with pip install copernicusmarine and store your credentials once with login(). open_dataset lazily opens the default lat–lon (0.03°) interpolated version.
    Open the native 3 km polar stereographic grid with dataset_part="originalGrid" and set the extent with minimum_x etc. (in metres for this product).
  code: |
    import copernicusmarine

    # copernicusmarine.login()  # first time only

    ds = copernicusmarine.open_dataset(
        dataset_id="cmems_mod_arc_phy_my_nextsim_P1D-m",
        variables=["siconc", "sithick", "sisnthick", "vxsi", "vysi"],
        minimum_latitude=70, maximum_latitude=90,
        minimum_longitude=-180, maximum_longitude=180,
        start_datetime="2024-03-01", end_datetime="2024-03-31",
    )

    # March mean thickness (average of the daily means)
    sit_mar = ds["sithick"].mean("time")

    # Ice speed (m/s) — eastward/northward components in the default dataset
    speed = (ds["vxsi"] ** 2 + ds["vysi"] ** 2) ** 0.5
    print(float(speed.mean()))

    # Native 3 km polar stereographic grid (x/y in m, velocities along grid x/y)
    ds_pol = copernicusmarine.open_dataset(
        dataset_id="cmems_mod_arc_phy_my_nextsim_P1D-m",
        dataset_part="originalGrid",
        variables=["sithick"],
        minimum_x=-1_500_000, maximum_x=1_500_000,
        minimum_y=-1_500_000, maximum_y=1_500_000,
        start_datetime="2024-03-01", end_datetime="2024-03-31",
    )

tips:
  - >-
    Thickness before October 2010, and every May–September, is free-running model output with no thickness assimilation. The QUID reports a 0.28 m RMSD against CS2SMOS during
    the assimilation period, but compared with PIOMAS the reanalysis is about 0.4 m thinner early in the record and only about 0.1 m thinner once assimilation starts.
    Allow for a possible discontinuity at October 2010 when computing thickness or volume trends from 1993.
  - >-
    The default dataset (0.03° lat–lon) and subset output are re-interpolated from the native polar stereographic grid, which slightly smooths the fields and enlarges the land mask (PUM).
    For small-scale features or area and volume integrals, use the originalGrid (regular 3 km) data. Even the 3 km grid is interpolated from the ~10 km model mesh, so the effective
    resolution is coarser.
  - >-
    In originalGrid files, `vxsi` and `vysi` are grid x/y components, not eastward/northward. The PUM includes a Python example that rotates the vectors with cartopy.
    Coordinates are in metres on a spherical projection (R = 6378273 m); treating them as WGS 84 will misplace the data.
  - >-
    Per the QUID, the assimilated inputs are OSI SAF SSMIS sea ice concentration (CDR v3 for 1993–2020 and ICDR v3 for 2021–2023, obtained from the C3S CDS) and AWI CS2SMOS
    ("version 2.6"). The SSMIS-based interim record (OSI SAF OSI-430-a, release 3) was suspended on 2025-10-17 and AWI's merged thickness became CS3SMOS (v300) from the 2025/26 winter,
    so inputs from 2024 onward may differ from the documentation. If you analyse the recent period together with earlier years, ask the Copernicus Marine Service Desk which inputs were used.
  - >-
    The QUID reports concentration about 4–8% higher than passive microwave estimates, multiyear ice area overestimated by 0.5–1 million km², ice-edge advance in October–December
    slower than observed, and underestimated magnitude of high-drift events (trajectory error about 4.2 km per day against OSI SAF 24-hour drift). Ice age accumulates from 1993 and is
    not fully spun up until around 2000. The real-time forecast product from the same neXtSIM-F system is ARCTIC_ANALYSISFORECAST_PHY_ICE_002_011.

