notices:
  - date: "2026-09-21"
    level: info
    title: Daily and monthly data extended to May 2026
    body: >-
      Per the Copernicus Marine metadata, the daily dataset (cmems_mod_arc_phy_my_nextsim_P1D-m_202411) now runs to 2026-05-31 and the monthly dataset to May 2026
      (data updated 2026-09-21). The dataset version tag (202411) is unchanged.
    source: https://stac.marine.copernicus.eu/metadata/ARCTIC_MULTIYEAR_PHY_ICE_002_016/cmems_mod_arc_phy_my_nextsim_P1D-m_202411/dataset.stac.json
  - date: "2025-11-25"
    level: info
    title: PUM Issue 1.0 published and metadata updated — monthly climatology dataset listed
    body: >-
      The Product User Manual (CMEMS-ARC-PUM-002-016) Issue 1.0 was approved in November 2025 and added to the product documentation, and the product metadata were updated on 2025-11-25.
      The product now includes a 1993–2022 monthly climatology dataset (cmems_mod_arc_phy_my_3km-climatology_P1M-m, version tag 202511).
    source: https://stac.marine.copernicus.eu/metadata/ARCTIC_MULTIYEAR_PHY_ICE_002_016/product.stac.json
  - date: "2025-10-17"
    level: warning
    title: Documented assimilation inputs (OSI SAF SSMIS concentration, CS2SMOS thickness) replaced in 2025 — later inputs not documented
    body: >-
      OSI SAF suspended the SSMIS-based sea ice concentration interim climate record (OSI-430-a) on 17 October 2025 because long gaps in the input data affected its temporal
      consistency (replacement: AMSR2-based OSI-438), and AWI's merged thickness switched from CS2SMOS (v206) to CS3SMOS (v300) on 2025-10-23. The PUM and QUID describe only
      SSMIS concentration and CS2SMOS thickness assimilation; the inputs used for the recent period extended to May 2026 are not stated in the official documentation.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2024-11-26"
    level: info
    title: neXtSIM sea ice reanalysis first released on Copernicus Marine
    body: >-
      ARCTIC_MULTIYEAR_PHY_ICE_002_016 was added to the Copernicus Marine catalogue (daily and monthly datasets released 2024-11-26, QUID Issue 1.0).
      At first release, the OSI SAF interim record used for assimilation covered 2021–2023.
    source: https://data.marine.copernicus.eu/product/ARCTIC_MULTIYEAR_PHY_ICE_002_016/description

