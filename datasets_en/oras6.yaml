# ─────────────────────────────────────────────────────────────
# ORAS6 — dataset information file (not yet released)
# ECMWF's sixth-generation ensemble ocean and sea-ice reanalysis; ocean and sea-ice initial conditions for ERA6. Release preparation announced 2026-06; no public release date yet.
# After editing, update last_verified to the date checked on the official page.
# ─────────────────────────────────────────────────────────────
id: oras6
name: ORAS6
full_name: ECMWF Ocean ReAnalysis System 6 (ORAS6)
category: reanalysis
domain: ocean
group: 재분석
order: 22
domains: [해양, 해빙]
provider: ECMWF (developed with support from C3S and the Copernicus Marine Service)

status: upcoming
status_note: >-
  Not yet publicly released. In June 2026 ECMWF announced that the altimeter period from 1993 onward had been produced and would be made available shortly to ECMWF
  Member States and external collaborators. As of 2026-10-12, ORAS6 is not listed on the CDS or in ECMWF's reanalysis datasets, and no public release date or
  distribution channel has been announced.

period:
  start: "1950"
  end: present
  note: >-
    Planned to cover 1950 to the present, produced in several parallel streams that are joined using analyses from the preceding stream. Per the June 2026 ECMWF announcement,
    the period from 1993 onward has been produced and the early stream from 1950 was expected to finish in August 2026 (no completion notice seen yet). The July 2024 Newsletter
    expected the full record back to 1950 by the end of 2024, but the schedule slipped. As of 2026-10-12 no data have been publicly released.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1시간"
  spatial: >-
    NEMO v4 eORCA025 tripolar grid, ¼° (approximately 27 km at the equator and 12 km in the Arctic; Browne et al. 2026) — the same horizontal resolution as ORAS5.
    The grid of the public product has not yet been announced
  vertical: 75 levels (as in ORAS5)
  temporal: >-
    For 1993 onward, hourly 2D and daily 3D fields are planned (ECMWF, June 2026). Formats for other periods and for statistics have not been announced

update: Not yet released (update frequency after public release not announced)
license: To be confirmed (expected at release)
account_required: true

summary: >-
  ECMWF's sixth-generation global ocean and sea-ice reanalysis and the successor to ORAS5. It uses the NEMO v4.0.6 ocean model with the SI3 multi-category sea-ice model,
  hourly ERA5 atmospheric forcing and ensemble-based 3D-Var (NEMOVAR) data assimilation of temperature and salinity profiles, reprocessed DUACS sea-level anomalies,
  OSI SAF sea-ice concentration and reprocessed OSTIA SST. It is the first ECMWF ocean reanalysis to assimilate SST directly, and it produces 11 ensemble members of
  ocean and sea-ice analyses in GRIB2. It provides the ocean and sea-ice initial conditions for ERA6.

variables:
  note: >-
    The variable list is not final because the data are not yet released. According to ECMWF, ocean and sea-ice state variables (temperature, salinity, currents, sea surface
    height, sea-ice concentration and thickness, etc.) will be provided for 1993 onward as hourly 2D and daily 3D fields. Variable names and units will be added on release.
  groups: []

access:
  - name: ECMWF news — New ORAS6 ocean reanalysis (2026-06-08)
    url: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
    method: Announcement page (Member States and collaborators first)
    note: ECMWF states that the 1993-onward period will be made available first to Member States and external collaborators. No distribution channel for general users has been announced.
  - name: ECMWF reanalysis datasets (expected release location)
    url: https://www.ecmwf.int/en/forecasts/datasets/browse-reanalysis-datasets
    method: ECMWF data dissemination services
    note: >-
      The data availability statement of Browne et al. (2026) says ORAS6 "will be publically available via the ECMWF data dissemination services" at this address.
      When checked on 2026-10-12, ORAS6 was not yet listed. Newsletter 180 states that the output is archived in MARS as GRIB2.

tips:
  - Even after release, do not join ORAS6 to ORAS5 as one time series. Atmospheric forcing (hourly ERA5), model (NEMO4/SI3) and assimilation (ensemble 3D-Var with direct SST assimilation) all differ.
  - ERA6's ocean component starts from ORAS6 initial conditions, but "ERA6 will not ingest ocean observations directly". Do not treat ERA6 ocean fields as equivalent to ORAS6.
  - ECMWF Newsletter 180 notes that ORAS6 Arctic sea ice can be biased thin in some regions. For sea-ice thickness work, compare with satellite thickness products.
  - The system produces 11 ensemble members, so once the release format is known, check whether uncertainty information (ensemble spread) is provided.

