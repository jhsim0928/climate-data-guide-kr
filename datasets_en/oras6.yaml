notices:
  - date: "2026-06-08"
    level: info
    title: New ORAS6 ocean reanalysis supporting forecasting and climate monitoring — 1993 onward first
    body: >-
      ECMWF announced it is preparing to release ORAS6. Hourly 2D and daily 3D fields for 1993 onward have been produced and will be made available shortly to Member States and
      external collaborators; the early stream from 1950 was expected to finish in August 2026. No public release date, distribution channel or end date for ORAS5 has been announced.
    source: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
  - date: "2026-06-03"
    level: info
    title: "\"Sea ice data assimilation in ORAS6\" published in The Cryosphere"
    body: >-
      Browne et al. (2026) describe how sea-ice concentration increments are distributed across the thickness categories of the SI3 multi-category model and add a sea ice–sea water
      temperature relationship. The paper documents the ORAS6 set-up: eORCA025 grid, an ensemble of one control and 10 perturbed members, and OSI SAF L3 sea-ice concentration assimilation.
    source: https://doi.org/10.5194/tc-20-3299-2026
  - date: "2026-03-06"
    level: info
    title: Copernicus Climate's ERA6 reanalysis production starts (initialised from ORAS6)
    body: >-
      Copernicus announced the start of ERA6 production. ERA6's coupled ocean takes its ocean and sea-ice initial conditions from ORAS6, developed together with the Copernicus Marine Service.
    source: https://climate.copernicus.eu/copernicus-climates-era6-reanalysis-production-starts
  - date: "2024-07"
    level: info
    title: "ECMWF Newsletter 180 — ECMWF's next ensemble reanalysis system for ocean and sea ice: ORAS6"
    body: >-
      The first detailed description of the ORAS6 configuration: NEMO v4.0.6 with SI3, hourly ERA5 forcing, ensemble-based 3D-Var, direct assimilation of OSTIA SST and 11-member
      GRIB2 output. It expected the full record back to 1950 by the end of 2024, but the schedule has slipped.
    source: https://www.ecmwf.int/en/newsletter/180/earth-system-science/ecmwfs-next-ensemble-reanalysis-system-ocean-and-sea-ice

