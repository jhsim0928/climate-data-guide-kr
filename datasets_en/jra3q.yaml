# ─────────────────────────────────────────────────────────────
# JRA-3Q — dataset information file (English edition)
# ─────────────────────────────────────────────────────────────
id: jra3q
name: JRA-3Q
full_name: Japanese Reanalysis for Three Quarters of a Century (JRA-3Q)
category: reanalysis
domain: atmosphere
group: 재분석
order: 40
domains: [대기, 육지]
provider: Japan Meteorological Agency (JMA)

status: active
status_note: >-
  Available and current; JRA-3Q is the official successor to JRA-55. At NCAR GDEX the main dataset grows monthly and the near-real-time dataset every few days.
  DIAS in Japan has only partly resumed service after its long-term maintenance in 2026, and currently offers only data dated 24 June 2026 or later.
  The licence is non-commercial (CC BY-NC-SA 4.0); for commercial use, obtain the data through the Japan Meteorological Business Support Center (JMBSC).

period:
  start: "1947-09"
  end: present
  note: >-
    From 1 September 1947. The NCAR main dataset (d640000) is extended month by month (through September 2026 when checked in October 2026);
    the most recent days to weeks appear first in the near-real-time dataset (d640001). The sub-product JRA-3Q-COBE covers only June 1985 to December 1990.

resolution:
  spatial_short: "139 km (1.25°)"
  temporal_short: "1시간"
  spatial: "Model resolution TL479 (about 40 km) / 1.25° × 1.25° latitude–longitude grid (288 × 145) / 0.375° × 0.375° grid based on the model grid (960 × 480)"
  vertical: "100 model levels (top at 0.01 hPa) / 45 isobaric surfaces (1000–0.01 hPa) / 36 isentropic surfaces (270–4,000 K)"
  temporal: Analyses every 6 hours, surface diagnostics and fluxes hourly (monthly and monthly diurnal statistics provided separately)

update: Monthly (NCAR main dataset) / near-real-time dataset updated continually with a lag of a few days
license: Creative Commons Attribution Non Commercial Share Alike 4.0 International (CC BY-NC-SA 4.0) — for commercial use, purchase the data through JMBSC
account_required: true

summary: >-
  JRA-3Q is JMA's third long-term global atmospheric reanalysis, covering September 1947 to the present.
  It uses a data assimilation system based on JMA's operational set-up as of December 2018 (TL479, 4D-Var) and assimilates newly rescued historical observations
  and reprocessed satellite data, alleviating many of the deficiencies of JRA-55, such as the energy imbalance at the top of the atmosphere and the surface and the artificial weakening trend in tropical cyclone intensity.
  SST comes from COBE-SST2 until May 1985 and from MGDSST from June 1985; JRA-3Q-COBE was released alongside so the effect of that switch can be assessed.

time_convention:
  summary: >-
    Analyses (anl_*) are instantaneous values every 6 hours (00, 06, 12, 18 UTC), and forecast diagnostics are hourly.
    fcst_surf125 and bnd_ocean125 hold hourly instantaneous values; fcst_phy2m125 (precipitation, fluxes, radiation) holds 1-hour averages.
    Precipitation and evaporation are 1-hour mean rates (kg m-2 s-1), not accumulations.
  points:
    - "In the NCAR GDEX files the variable attribute time_step states the temporal nature, e.g. \"6-hour\" (analyses), \"1-hour instantaneous\" (instantaneous forecasts), \"1-hour average\" (averaged diagnostics) and \"24-hour\" (snow analysis). Check this attribute when in doubt."
    - "The snow depth analysis (anl_snow125) is daily, at 18 UTC."
    - "The JMA format document does not state how the 1-hour averages are time-stamped. The GDEX daily files are labelled 00–23 UTC, which suggests that, as in JRA-55, the time stamp marks the start of the averaging interval (our inference). Check this yourself if precise timing matters."
    - "Which forecast window the averaged diagnostics come from is only mentioned in the format document's description of climatological normals (\"averages from the beginning of forecasts up to six hours for average diagnostic fields\")."
    - "In minmax_surf (Gaussian grid), 2 m maximum and minimum temperature and maximum wind speed are maxima and minima over 1-hour intervals (GDEX time_step \"1-hour maximum\")."
    - "To compare with the JRA-55 3-hour means (mm/day), average three 1-hour means and multiply by 86400."
  source: https://www.data.jma.go.jp/jra/html/JRA-3Q/document/JRA-3Q_LL125_format_v1_en.pdf
  source_name: "JRA-3Q 1.25° format document + NCAR GDEX d640000 file metadata (time_step)"

variables:
  note: >-
    Main variables from the JMA document "JRA-3Q Product Format (1.25-degree latitude/longitude grid)" and the NCAR GDEX (d640000) NetCDF files.
    Names are the JMA short names that begin the GDEX file and variable names (e.g. tmp2m-hgt-an-ll125 → `tmp2m`).
    The originals are GRIB2; GDEX converts them to NetCDF4, one variable per file. Note that precipitation and evaporation units differ from JRA-55 (mm/day).
  full_list: https://www.data.jma.go.jp/jra/html/JRA-3Q/document/JRA-3Q_LL125_format_v1_en.pdf
  groups:
    - name: Isobaric analysis (anl_p125, 6-hourly)
      kind: instant
      period: "every 6 hours"
      items:
        - "Geopotential height — `hgt` (gpm)"
        - "Temperature — `tmp` (K)"
        - "u-component of wind — `ugrd` (m s-1)"
        - "v-component of wind — `vgrd` (m s-1)"
        - "Vertical velocity (pressure) — `vvel` (Pa s-1)"
        - "Specific humidity — `spfh` (kg kg-1)"
        - "Relative humidity — `rh` (%)"
        - "Dewpoint depression (or deficit) — `depr` (K)"
        - "Relative vorticity — `relv` (s-1)"
        - "Stream function · velocity potential — `strm`, `vpot` (m2 s-1)"
    - name: Surface analysis (anl_surf125, 6-hourly)
      kind: instant
      period: "every 6 hours"
      items:
        - "Temperature at 2 m — `tmp2m` (K)"
        - "Specific humidity at 2 m — `spfh2m` (kg kg-1)"
        - "Relative humidity at 2 m — `rh2m` (%)"
        - "u- and v-components of wind at 10 m — `ugrd10m`, `vgrd10m` (m s-1)"
        - "Pressure (ground or water surface) — `pres` (Pa)"
        - "Pressure reduced to MSL — `prmsl` (Pa)"
        - "Total column integrated water vapour — `tciwv` (kg m-2)"
        - "Water equivalent of accumulated snow depth — `weasd` (kg m-2)"
    - name: Fluxes and diagnostics — 1-hour average forecasts (fcst_phy2m125)
      kind: mean
      period: "1-hour"
      items:
        - text: "Total precipitation rate — `tprate` (kg m-2 s-1)"
          kind: mean
          period: "1-hour"
          note: "GDEX time_step \"1-hour average\" confirmed. The units are a rate, not an accumulation"
        - "Convective · large scale precipitation rate — `cprat`, `lsprate` (kg m-2 s-1)"
        - "Total snowfall rate, water equivalent — `tsrwe` (kg m-2 s-1)"
        - "Evaporation rate — `evarate` (kg m-2 s-1)"
        - "Latent · sensible heat net flux — `lhtfl`, `shtfl` (W m-2)"
        - "Momentum flux, u- and v-components — `uflx`, `vflx` (N m-2)"
        - "Downward short-wave · long-wave radiation flux — `dswrf`, `dlwrf` (W m-2)"
        - "Upward short-wave · long-wave radiation flux (surface and top of atmosphere) — `uswrf`, `ulwrf` (W m-2)"
        - "Vertically integrated zonal · meridional water vapour flux — `tuwv`, `tvwv` (kg m-1 s-1)"
    - name: Clouds, ozone, snow — 1-hour instantaneous forecasts (fcst_surf125)
      kind: instant
      period: "every hour"
      items:
        - "Total · low · medium · high cloud cover — `tcdc`, `lcdc`, `mcdc`, `hcdc` (%)"
        - "Total ozone — `tozne` (DU)"
        - "Snow depth — `snod` (m)"
    - name: Ocean boundary conditions (bnd_ocean125)
      kind: instant
      period: "every hour"
      items:
        - "Water temperature — `wtmp` (K)"
        - "Ice cover — `icec` (proportion)"

access:
  - name: NSF NCAR GDEX — JRA-3Q main dataset (d640000)
    url: https://gdex.ucar.edu/datasets/d640000/
    method: Web download / THREDDS / Kerchunk and Intake-ESM catalogues
    note: >-
      NCAR account required; non-commercial use only. NetCDF4 files, one variable per file, about 477 TB in total, so select only the products and variables you need.
  - name: NSF NCAR GDEX — Near Real-Time JRA-3Q (d640001)
    url: https://gdex.ucar.edu/datasets/d640001/
    method: Web download / THREDDS
    note: Recent data from 9 December 2023. Use it when you need recent periods not yet added to the main dataset (d640000).
  - name: NSF NCAR GDEX — monthly statistics (d640002) and monthly diurnal statistics (d640004)
    url: https://gdex.ucar.edu/datasets/d640002/
    method: Web download
    note: The diurnal statistics are at https://gdex.ucar.edu/datasets/d640004/.
  - name: NSF NCAR GDEX — JRA-3Q-COBE (d640006)
    url: https://gdex.ucar.edu/datasets/d640006/
    method: Web download
    note: June 1985 to December 1990. Intended for assessing the effect of the SST input switch (COBE-SST2 → MGDSST).
  - name: DIAS — JRA-3Q
    url: https://search.diasjp.net/en/dataset/JRA3Q
    method: Web download (original GRIB2)
    note: >-
      DIAS account required. After the long-term maintenance, downloads partly resumed on 19 August 2026, but only data dated 24 June 2026 or later are available;
      republication dates for earlier periods and for JRA-3Q-COBE have not been determined.
  - name: Japan Meteorological Business Support Center (JMBSC)
    url: https://www.jmbsc.or.jp/en/index-e.html
    method: Paid data service
    note: The official public distributor designated by JMA. For commercial purposes, obtain the data here rather than from the collaborative organizations (NCAR, DIAS).

tips:
  - "Precipitation and evaporation are in kg m-2 s-1 (= mm s-1), not mm day-1 as in JRA-55. Multiply by 86400 to convert to mm/day before comparing with JRA-55."
  - The SST input switches from COBE-SST2 (1°) to MGDSST (0.25°) in June 1985. If your trend or variability analysis spans that date, use JRA-3Q-COBE to check its effect.
  - JMA has reported a local quality issue from June 1985 to April 2013 affecting ice cover, surface fluxes and 2 m temperature within about 250 km of the sea-ice edge. Check it if you study the polar sea-ice margin.
  - "The metadata inside the GDEX files give the pages of Kosaka et al. (2024) as 102, 1-168, but the official J-STAGE record is 102(1), 49–109."

