notices:
  - date: "2026-08-19"
    level: warning
    title: "DIAS Notice of Partial Resumption — JRA-3Q only data dated 24 June 2026 or later"
    body: >-
      DIAS, which had been under long-term maintenance, resumed downloads of part of the JRA-3Q data: "only data dated 24 June 2026 or later".
      Republication dates for the remaining data have not yet been determined. Use NCAR GDEX for earlier periods.
    source: https://diasjp.net/en/information/operation/20260727-resumption/
  - date: "2026-04-28"
    level: warning
    title: "DIAS Service Outage — all datasets inaccessible"
    body: >-
      DIAS announced that it is in long-term maintenance, that all systems except the website are unavailable, and that "the expected date of service restoration has not yet been determined."
      The JMA JRA-3Q page likewise says DIAS datasets are inaccessible.
    source: https://diasjp.net/en/information/operation/20260428-unscheduled-maintenance/
  - date: "2025-12-02"
    level: info
    title: JMA reanalysis website moved
    body: The JRA project website moved from jra.kishou.go.jp to www.data.jma.go.jp/jra/html/. The old address redirects automatically for the time being; update your bookmarks.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/index_en.html
  - date: "2023-12-05"
    level: info
    title: Near real-time JRA-3Q data available from NCAR
    body: Near real-time JRA-3Q data became available from NCAR. Around the same time JMA announced that near real-time JRA-55 updates would end at the end of January 2024.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/information_en.html
  - date: "2023-08-10"
    level: info
    title: Full period and JRA-3Q-COBE available from DIAS
    body: Data for September 1947 to December 1990 and from May 2013 onward were added to DIAS, completing the record, and the sub-product JRA-3Q-COBE was released at the same time.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/information_en.html
  - date: "2022-12-09"
    level: warning
    title: Local issues with sea ice parameters
    body: >-
      From June 1985 to April 2013, sea-ice areas were expanded by several grid cells before conversion to the model grid, so ice cover that should be 0.0 is reported
      as an average of 0.15 within around 250 km of the ice edge. Surface radiation and turbulent heat fluxes and near-surface temperature and humidity nearby are also slightly affected.
      JMA describes the effects as local and minor, a small fraction of interannual variability.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/document/JRA-3Q_qualityissue_20221209_en.pdf

