# ─────────────────────────────────────────────────────────────
# JRA55-do — dataset information file
# ─────────────────────────────────────────────────────────────
id: jra55-do
name: JRA55-do
full_name: JRA-55 based surface dataset for driving ocean–sea-ice models (JRA55-do)
category: forcing
domain: ocean
group: 모델 강제력
order: 10
domains: [해양, 해빙, 대기]
provider: Meteorological Research Institute, Japan Meteorological Agency (JMA/MRI)

status: ended
status_note: >-
  "Updating of JRA55-do was discontinued on 31 January 2024" following the end of its parent reanalysis, JRA-55; v1.6.0 (January 1958 – January 2024) is the final version.
  MRI has not released a JRA-3Q-based successor (checked October 2026). NCAR, GFDL and LANL have presented at WCRP an ERA5-based next-generation forcing for CMIP7-era OMIP,
  CFORCE, so watch for its release in the longer term.

successor:
  name: None
  note: >-
    There is no official successor yet. CFORCE, based on ERA5, is being developed as the next-generation OMIP forcing (presented at WCRP in October 2024).

transitions:
  - from: JRA55-do
    to: CFORCE (ERA5-based, in development)
    status: planned
    summary: >-
      Planning-stage information, not an official successor. NCAR, GFDL and LANL are building CFORCE, a next-generation ERA5-based dataset for forcing ocean–sea-ice models.
      The October 2024 WCRP presentation anticipated availability in early 2026, after which OMIP and LMIP may switch to it; the same presentation noted that CMIP7 OMIP
      uses JRA55-do because it "goes through 2023". As of October 2026 no data or formal documentation have been released.
    changes:
      - aspect: Parent reanalysis
        before: "JRA-55 (ended January 2024)"
        after: "ERA5 (continuing ECMWF reanalysis)"
      - aspect: Period
        before: "1958-01 to 2024-01"
        after: "1940 to present (planned)"
      - aspect: Resolution and time step
        before: "TL319 (~0.5625°), 3-hourly"
        after: "0.25°, hourly (planned target, for eddying and coastal ocean models)"
      - aspect: Producer
        before: "JMA Meteorological Research Institute (MRI)"
        after: "NSF NCAR · NOAA GFDL · DOE LANL (with CLIVAR OMDP; funded by DOE and NOAA)"
      - aspect: Extension
        before: "Discontinued; v1.6.0 is final"
        after: "Designed for annual extension (reference observations must also be kept current); built with open Python tools reusable for later reanalyses such as ERA6"
      - aspect: Target experiments
        before: "OMIP-2 (CMIP6); the 1958–2023 period is also planned for CMIP7 OMIP"
        after: "OMIP-Future · LMIP-Future (candidate for future OMIP/LMIP)"
      - aspect: Release status
        before: "Published on input4MIPs (MRI-JRA55-do-1-6-0)"
        after: "Not released — expected in early 2026 per the October 2024 presentation, but no official data as of October 2026"
    impacts:
      - If you are starting OMIP-style experiments now, JRA55-do v1.6.0 (1958–2023 cycle) is still the standard. There is no official reason yet to delay experiments while waiting for CFORCE.
      - Once CFORCE is out, its parent reanalysis, resolution and adjustment methods will all differ, so runs forced with JRA55-do cannot be compared directly. Run the same model with both forcings to quantify the differences.
      - Variable list, bulk formulae and freshwater runoff for CFORCE have not been announced. Do not commit to adapting your JRA55-do preprocessing code until it is released.
    sources:
      - name: WCRP presentation — Next Generation Datasets for Forcing Ocean/Sea-ice (CFORCE, NSF NCAR, 2024-10)
        url: https://wcrp-cmip.org/wp-content/uploads/2024/10/S5_DLawrence.pdf
      - name: MRI JRA55-do official page (updates discontinued 2024-01-31, v1.6.0 final)
        url: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/

period:
  start: "1958-01"
  end: "2024-01"
  note: >-
    v1.6.0 covers "the entire period (01Jan1958-01Feb2024)", i.e. 1 January 1958 to 1 February 2024 00 UTC. Its content is identical to v1.5.0 (to July 2020) joined with
    its extension v1.5.0.1 (2020 to 2024). OMIP experiments use the 66-year period 1958–2023 as one forcing cycle.

resolution:
  spatial_short: "62 km (0.56°)"
  temporal_short: "3시간"
  spatial: "Atmospheric variables on the TL319 Gaussian grid (~0.5625°, ~55 km) / river and ice-sheet runoff 0.25° × 0.25° / supplementary SST and sea ice 1° × 1°"
  vertical: Surface single level (atmospheric variables at 10 m)
  temporal: Atmospheric variables 3-hourly (radiation and precipitation as 3-hourly means, the rest as snapshots) / runoff as daily means

update: Ended (updates discontinued on 31 January 2024)
license: CC BY 4.0 (per the input4MIPs v1.6.0 file metadata)
account_required: false

summary: >-
  A surface dataset for driving ocean–sea-ice models, made by adjusting the JRA-55 reanalysis surface atmospheric fields toward satellite and other observation-based products.
  It replaced CORE-II as the standard forcing for phase 2 of OMIP (OMIP-2) and provides, in one package, 3-hourly wind, air temperature, humidity, radiation and precipitation
  together with river, Antarctic and Greenland freshwater runoff. Its higher resolution and more frequent updates than CORE-II made it widely used in high-resolution ocean modelling.

time_convention:
  summary: >-
    Among the 3-hourly atmospheric variables, wind, temperature, humidity and sea level pressure (uas, vas, tas, huss, psl) are snapshots, while downward radiation and precipitation
    (rsds, rlds, prra, prsn) are 3-hourly means. River and ice runoff (friver, licalvf) are daily means. Precipitation and runoff are mean fluxes (kg m-2 s-1), not accumulations.
  points:
    - "For snapshot variables, the first datum of each year is the 00 UTC value on 1 January."
    - "For 3-hourly mean variables, \"the first datum of each year is averaged from 00:00 to 03:00 UTC on the 1st of January\" and is time-stamped at the middle of the interval (01:30 UTC), so these variables are offset by 1.5 hours from the snapshot variables."
    - "River runoff friver and calving flux licalvf are daily means on the 0.25° grid."
    - "Among the supplementary data, tos and siconc (COBE-SST) are daily means, siconca and ts (JRA-55) are 3-hourly snapshots, sos is a monthly climatology, and uos and vos are annual climatologies."
  source: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/docs/v1_6-manual/User_manual_jra55_do_v1_6.pdf
  source_name: "JRA55-do v1.6 User Manual (Tables 1 and 2)"

variables:
  note: >-
    Variables from Tables 1 and 2 of the JRA55-do v1.6 User Manual. Names are the CMOR variable names in the input4MIPs files (NetCDF).
    Atmospheric variables are given at 10 m above the sea surface (not 2 m).
  full_list: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/docs/v1_6-manual/User_manual_jra55_do_v1_6.pdf
  groups:
    - name: Atmospheric forcing (3-hourly, TL319)
      kind: instant
      period: "3-hourly"
      items:
        - "10 m air temperature — `tas` (K)"
        - "10 m specific humidity — `huss` (kg kg-1)"
        - "10 m eastward wind — `uas` (m s-1)"
        - "10 m northward wind — `vas` (m s-1)"
        - "Sea level pressure — `psl` (Pa)"
        - text: "Downward shortwave radiation — `rsds` (W m-2)"
          kind: mean
          period: "3 hours"
        - text: "Downward longwave radiation — `rlds` (W m-2)"
          kind: mean
          period: "3 hours"
        - text: "Rainfall flux — `prra` (kg m-2 s-1)"
          kind: mean
          period: "3 hours"
          note: "Mean rainfall flux, not an accumulation"
        - text: "Snowfall flux — `prsn` (kg m-2 s-1)"
          kind: mean
          period: "3 hours"
          note: "Mean snowfall flux, not an accumulation"
    - name: Freshwater runoff (daily mean, 0.25°)
      kind: mean
      period: "Daily"
      items:
        - "Liquid water runoff — `friver` (kg m-2 s-1)"
        - "Solid ice runoff (calving flux) — `licalvf` (kg m-2 s-1)"
    - name: Supplementary data
      kind: mean
      period: "Daily"
      items:
        - "Sea surface temperature from COBE-SST (daily mean, 1°) — `tos` (°C)"
        - "Sea-ice distribution from COBE-SST (daily mean, 1°) — `siconc` (%)"
        - text: "Sea-ice distribution from JRA-55 (3-hourly) — `siconca` (%)"
          kind: instant
          period: "3-hourly"
          note: "JRA-55 sea-ice distribution (0% or 100%)"
        - text: "Sea surface salinity from World Ocean Atlas 2013 v2 (monthly climatology) — `sos` (0.001)"
          kind: mean
          period: "Monthly"
          note: "Monthly climatology from World Ocean Atlas 2013 v2 (the same values repeat every year)"
        - text: "Grid-cell area for atmospheric data — `areacella` (m2)"
          kind: static

