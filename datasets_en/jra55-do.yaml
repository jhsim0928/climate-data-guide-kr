    method: THREDDS / direct HTTPS download
    note: Organised in realm folders atmos, land, landIce, ocean and seaIce.
  - name: MRI server — v1.5.0.1 (2020 to January 2024)
    url: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/jra55do_latest.html
    method: Direct HTTPS download (yearly files)
    note: The post-2020 extension ("a preliminary release extending v1.5.0 to latest"). MRI directs users to input4MIPs for 1958–2019.

tips:
  - "Atmospheric variables (tas, huss, uas, vas) are at 10 m. Do not feed them to a bulk formula that assumes 2 m temperature; use the Large and Yeager-type bulk formula used to produce JRA55-do and recommended in Tsujino et al. (2018) (bulk_ncar.F90)."
  - Radiation and precipitation are 3-hourly means, with each year's first value centred on 00–03 UTC on 1 January. Wind, temperature, humidity and pressure are snapshots from 00 UTC, so the two sets of time axes are offset by 1.5 hours.
  - Total precipitation is prra + prsn and total freshwater runoff is friver + licalvf. All atmospheric variables except sea level pressure are adjusted to reference observations, so they differ from the original JRA-55 fields.
  - Versions before v1.5 contained erroneously (anti-cyclonically) rotating tropical cyclones (northeastern Pacific in 1959, North Atlantic in 1967–1987), fixed from v1.5. Keep this in mind when comparing with runs forced by older versions.

