notices:
  - date: "2026-09-10"
    level: info
    title: "CPC Global Ocean Monitoring briefing for August 2026 still uses GODAS"
    body: >-
      CPC's briefing "Global Ocean Monitoring: Recent Evolution, Current Status, and Predictions" (10 September 2026) still uses "NCEP's GODAS temperature, heat content, currents".
      The same briefing credits winds, surface radiation and heat fluxes to NCEP CORe, but does not say whether the GODAS forcing has switched to CORe.
    source: https://www.cpc.ncep.noaa.gov/products/GODAS/ocean_briefing_gif/global_ocean_monitoring_current.pdf
  - date: "2026-02-28"
    level: warning
    title: "PSL Data Notice: NCEP/NCAR Reanalysis 1 updates to end"
    body: >-
      Announcing that R1 updates will end with the switch from CDAS to CORe, PSL said it is reviewing other products that may stop updating or need an alternative to CDAS.
      GODAS is not named in the notice, and as of 2026-10-12 the PSL GODAS files are still being updated.
    source: https://psl.noaa.gov/news/2026/r1datanotice.html
  - date: "2026-02-09"
    level: warning
    title: "NWS SCN 26-12 — Upgrading CDAS to CORe; distribution of the GODAS forcing source (R2/cdas2) ends"
    body: >-
      The service change notice lists the NOMADS and FTP /com/cdas2/ directories among the CDAS data files that will no longer be available as of March 9, 2026,
      and the R2 data at PSL and NCAR stop at 28 February 2026. The notice does not mention GODAS, and how GODAS has been forced since then has not been officially confirmed.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf

