# ─────────────────────────────────────────────────────────────
# JRA-55 — dataset information file (English edition)
# ─────────────────────────────────────────────────────────────
id: jra55
name: JRA-55
full_name: Japanese 55-year Reanalysis
category: reanalysis
domain: atmosphere
group: 재분석
order: 30
domains: [대기, 육지]
provider: Japan Meteorological Agency (JMA)

status: ended
status_note: >-
  Update of the near real-time JRA-55 data was terminated at the end of January 2024. Data for 1958 to January 2024 remain available,
  but the record will not be extended. If you need recent years or are starting a new study, consider the successor, JRA-3Q.

successor:
  name: JRA-3Q
  url: https://gdex.ucar.edu/datasets/d640000/
  note: >-
    Covers September 1947 to present (updated monthly); model resolution TL479 (about 40 km) with 100 levels.
    Unlike JRA-55, it is licensed under CC BY-NC-SA 4.0 (non-commercial).
    Reference: Kosaka et al. (2024), J. Meteor. Soc. Japan, 102, 49–109, doi:10.2151/jmsj.2024-004

transitions:
  - from: JRA-55
    to: JRA-3Q
    to_id: jra3q
    status: completed
    date: "2024-01"
    summary: >-
      JRA-3Q is JMA's third-generation reanalysis, rerun from September 1947 with the operational system upgraded from its 2009 to its 2018 version and with higher
      resolution, more levels and a higher model top. It greatly reduces JRA-55's energy-budget imbalance, its artificial decline in tropical cyclone detection and its
      upper-tropospheric warm bias. Boundary conditions, observations, variable names and units, and the licence all changed, so treat it as a separate dataset rather than a drop-in replacement.
    changes:
      - aspect: Period
        before: "1958-01 to 2024-01 (near real-time updates ended)"
        after: "1947-09 to present (monthly updates at NCAR; separate near real-time stream)"
      - aspect: Base operational system
        before: "JMA global data assimilation system as of December 2009"
        after: "JMA global NWP system as of December 2018 (TL479 version)"
      - aspect: Horizontal resolution
        before: "TL319 (about 55 km)"
        after: "TL479 (about 40 km)"
      - aspect: Vertical levels and model top
        before: "60 levels, top at 0.1 hPa"
        after: "100 levels, top at 0.01 hPa"
      - aspect: Data assimilation
        before: "4D-Var (inner loop T106), VarBC for satellite radiances, RTTOV 9.3"
        after: "Incremental 4D-Var (inner loop TL319L100), VarBC for all satellite radiances, RTTOV 10.2. Static background error covariances (NMC method), with background error variances inflated before July 1998 when observations are sparse (about 155% before 1958)"
      - aspect: SST and sea-ice boundary conditions
        before: "COBE-SST (1°) throughout / sea ice as a single-layer 2 m slab, with a 55% concentration threshold for ice presence"
        after: "COBE-SST2 (1°, to 1985-05) then MGDSST (0.25°, from 1985-06) / sea ice as a 4-layer 1.5 m slab with separate ice and open-water tiles. A companion run, JRA-3Q-COBE (1985-06 to 1990-12), quantifies the impact of the switch"
      - aspect: Observations
        before: "Observations from 1958 onward; satellite reprocessing available at the time"
        after: "Adds rescued pre-1958 observations (HadISD, ICOADS R3.0, ISPD v4, IGRA v2, CHUAN and others), reprocessed GMS-5 and MTSAT AMVs, GNSS-RO bending angles, ground-based GNSS zenith delays (1994–2014) and hyperspectral IR sounders. Radiosonde bias correction moves from RAOBCORE to RISE"
      - aspect: Tropical cyclones
        before: "Assimilates tropical cyclone wind retrievals (TCRs) — an artificial downward trend in TC detection and maximum winds from the late 1980s"
        after: "JMA operational-style TC bogus (sea-level pressure, 850 and 300 hPa winds) — detection rate generally above 90% throughout"
      - aspect: Global energy budget
        before: "Large upward net energy imbalances at both TOA and surface; ocean surface net flux −15.9 W m-2"
        after: "TOA net flux −5.5 W m-2 (about half that of JRA-55); ocean surface net flux −6.5 W m-2"
      - aspect: Temperature and humidity biases
        before: "Upper-tropospheric warm bias near 250 hPa, cold bias near 850 hPa, mid-tropospheric dry bias, excessive tropical precipitation"
        after: "Upper-tropospheric warm bias much reduced; lower-tropospheric cold bias and mid-tropospheric dry bias alleviated"
      - aspect: Model physics and external forcing
        before: "Longwave radiation with 9 bands every 3 hours, WMO aerosol distribution, MRI-CCM1 ozone, SiB land surface with 1 soil temperature layer and 3 soil moisture layers"
        after: "Longwave radiation with 11 bands every hour, MASINGAR-based climatology of 5 aerosol species, MRI-CCM2.1 ozone, SiB with 7 soil layers and up to 4 snow layers"
      - aspect: Output levels and format
        before: "37 pressure levels (1000–1 hPa), 3-hourly surface diagnostics, GRIB1"
        after: "45 pressure levels (1000–0.01 hPa), hourly surface diagnostics and fluxes, GRIB2 (converted to per-variable NetCDF4 at NCAR GDEX)"
      - aspect: Variable names and units
        before: "Precipitation and evaporation in mm day-1 (e.g. `tprat`); 2 m temperature in file `anl_surf125.011_tmp`"
        after: "Precipitation and evaporation in kg m-2 s-1 (e.g. `tprate`); 2 m temperature as variable `tmp2m-hgt-an-ll125`"
      - aspect: Licence and distribution
        before: "CC BY 4.0 (as listed by NCAR) + JMA terms of use / NCAR d628000 and d628001, DIAS"
        after: "CC BY-NC-SA 4.0 (non-commercial, share-alike) / NCAR d640000–d640006, DIAS (partly resumed); commercial use via JMBSC"
    impacts:
      - The two reanalyses differ in climatology and trends, so do not splice JRA-55 and JRA-3Q into one time series at January 2024. If you need a long record, recomputing everything from JRA-3Q alone is the safer option.
      - "Precipitation and evaporation units changed from mm/day to kg m-2 s-1. Unchanged scripts will give values 86400 times too small, so update both the variable names and the unit conversion."
      - JRA-3Q carries a non-commercial licence (CC BY-NC-SA 4.0), so it cannot be used for commercial projects or services, and derived data cannot be redistributed under other terms. For such uses, check the JMBSC route.
      - The SST input switch in June 1985 (COBE-SST2 to MGDSST) and the sea-ice-edge quality problem from June 1985 to April 2013 are sources of discontinuity that JRA-55 did not have. For ocean boundary-layer or polar work, check JRA-3Q-COBE and the quality notices.
      - JRA-3Q still underestimates stratospheric warming after volcanic eruptions, and its TC maximum 10 m winds are only 50–60% of best-track values. The improvements over JRA-55 do not extend to these issues.
    sources:
      - name: Kosaka et al. (2024), The JRA-3Q Reanalysis, J. Meteor. Soc. Japan, 102, 49–109
        url: https://doi.org/10.2151/jmsj.2024-004
      - name: Kobayashi et al. (2015), The JRA-55 Reanalysis, J. Meteor. Soc. Japan, 93, 5–48
        url: https://doi.org/10.2151/jmsj.2015-001
      - name: Harada et al. (2026), evaluation of JRA-3Q tropical oceanic precipitation, Q. J. R. Meteorol. Soc., 152, e70026
        url: https://doi.org/10.1002/qj.70026
      - name: JMA JRA-3Q official page (products, SST configuration, data providers, quality notices)
        url: https://www.data.jma.go.jp/jra/html/JRA-3Q/index_en.html
      - name: JMA TCC training lecture — Reanalysis and JRA-3Q (2024-01, JRA-25/55/3Q comparison tables)
        url: https://ds.data.jma.go.jp/gmd/tcc/tcc/library/library2023/lectures/4.2.Reanalysis_and_JRA-3Q_20240129.pdf
      - name: JRA-3Q 1.25° data format document (GRIB2, 45 pressure levels)
        url: https://www.data.jma.go.jp/jra/html/JRA-3Q/document/JRA-3Q_LL125_format_v1_en.pdf
      - name: JRA-55 Product Users' Handbook (1.25° grid; 37 pressure levels and variable units)
        url: https://www.data.jma.go.jp/jra/html/JRA-55/document/JRA-55_handbook_LL125_v7_en.pdf

period:
  start: "1958-01"
  end: "2024-01"
  note: Near real-time updates ended, so 31 January 2024 is the last day of data.

resolution:
  spatial_short: "139 km (1.25°)"
  temporal_short: "3시간"
  spatial: "Model resolution TL319 (about 55 km) / 1.25° × 1.25° latitude–longitude grid / regular Gaussian grid of 640 × 320 (nominally 0.5625°)"
  vertical: "60 model levels / 37 pressure levels"
  temporal: 6-hourly analyses, 3-hourly forecasts and diagnostics (monthly means provided separately)

update: Ended (end of January 2024)
license: CC BY 4.0 (as listed at NCAR GDEX) + JMA terms of use
account_required: true

summary: >-
  JRA-55 is the second Japanese global atmospheric reanalysis, conducted by the Japan Meteorological Agency (JMA). It extends back to 1958, coinciding with
  the establishment of the global radiosonde observing system, and is based on a newer data assimilation and prediction system than JRA-25, with 4D-Var and
  variational bias correction (VarBC) of satellite radiances. It has been widely used alongside ERA5 as a comparison dataset, especially for East Asia.

time_convention:
  summary: >-
    Analyses (anl_*) are instantaneous values at 00, 06, 12 and 18 UTC. Averaged forecast diagnostics (fcst_phy2m125 and others) are averages over forecast hours 0–3
    and 3–6 of forecasts started every 6 hours. Dates in file names indicate the beginning of the averaging period (e.g. fcst_phy2m125.1981010100 = average for 00–03 UTC on 1 January).
    Precipitation, evaporation and fluxes are period-mean rates (mm day-1, W m-2), not accumulations.
  points:
    - "Analysis products (anl_p125, anl_surf125, anl_column, anl_land) are 6-hourly (00, 06, 12, 18 UTC); only the snow depth analysis (anl_snow125) is output once a day at 18 UTC."
    - "fcst_phy2m125 and fcst_phyland125 are 3-hour averages: 00–03, 06–09, 12–15 and 18–21 UTC are forecast hours 0–3; 03–06, 09–12, 15–18 and 21–24 UTC are forecast hours 3–6."
    - "fcst_phy3m125 (isobaric average diagnostics) is averaged over forecast hours 0–6."
    - "fcst_surf125 holds 3-hourly instantaneous values. Cloud cover (tcdc, lcdc, mcdc, hcdc) is marked in the Handbook as switched from average to instantaneous forecast fields in JRA-55."
    - "The date convention differs from JRA-25, whose file names gave the end of the averaging period. Reading both with the same code shifts averages by 3–6 hours."
    - "The NCAR GDEX THREDDS aggregations give the averaging interval in time_bounds, so for averaged variables check time_bounds, not just time."
  source: https://www.data.jma.go.jp/jra/html/JRA-55/document/JRA-55_handbook_LL125_v7_en.pdf
  source_name: "JRA-55 Product Users' Handbook (1.25° latitude-longitude grid), Chapter 4 and Sections 10.2–10.3"

variables:
  note: >-
    Main variables from the JRA-55 Product Users' Handbook (1.25° grid) and the NCAR GDEX file names.
    The short name is the abbreviation after the GRIB1 parameter number in the file name (e.g. anl_p125.011_tmp → `tmp`).
    Product categories (file prefixes) are given in parentheses; precipitation and evaporation are mean rates in mm day-1.
  full_list: https://www.data.jma.go.jp/jra/html/JRA-55/document/JRA-55_handbook_LL125_v7_en.pdf
  groups:
    - name: Isobaric analysis (anl_p125, 6-hourly, 37 levels)
      kind: instant
      period: "6-hourly"
      items:
        - "Geopotential height — `hgt` (gpm)"
        - "Temperature — `tmp` (K)"
        - "Dew-point depression (or deficit) — `depr` (K)"
        - "u-component of wind — `ugrd` (m s⁻¹)"
        - "v-component of wind — `vgrd` (m s⁻¹)"
        - "Vertical velocity — `vvel` (Pa s⁻¹)"
        - "Specific humidity — `spfh` (kg kg⁻¹)"
        - "Relative humidity — `rh` (%)"
        - "Relative vorticity — `relv` (s⁻¹)"
        - "Stream function — `strm` (m² s⁻¹)"
        - "Velocity potential — `vpot` (m² s⁻¹)"
    - name: Surface analysis (anl_surf125, 6-hourly)
      kind: instant
      period: "6-hourly"
      items:
        - "Pressure (surface) — `pres` (Pa)"
        - "Pressure reduced to MSL — `prmsl` (Pa)"
        - "2 m temperature — `tmp` (K)"
        - "2 m specific humidity — `spfh` (kg kg⁻¹)"
        - "10 m u- and v-components of wind — `ugrd`, `vgrd` (m s⁻¹)"
    - name: Total column analysis (anl_column, 6-hourly)
      kind: instant
      period: "6-hourly"
      items:
        - "Precipitable water (water vapour only) — `pwat` (kg m⁻²)"
        - "Zonal water vapour flux — `uwv` (kg m⁻¹ s⁻¹)"
        - "Meridional water vapour flux — `vwv` (kg m⁻¹ s⁻¹)"
    - name: Fluxes and diagnostics — 3-hour forecast averages (fcst_phy2m125)
      kind: mean
      period: "3-hour"
      items:
        - "Total precipitation — `tprat` (mm day⁻¹)"
        - "Convective precipitation — `cprat` (mm day⁻¹)"
        - "Large scale precipitation — `lprat` (mm day⁻¹)"
        - "Snowfall rate water equivalent — `srweq` (mm day⁻¹)"
        - "Evaporation — `evp` (mm day⁻¹)"
        - "Latent heat flux — `lhtfl` (W m⁻²)"
        - "Sensible heat flux — `shtfl` (W m⁻²)"
        - "Momentum flux, u and v components — `uflx`, `vflx` (N m⁻²)"
        - "Downward solar and long wave radiation flux (surface) — `dswrf`, `dlwrf` (W m⁻²)"
        - "Upward solar and long wave radiation flux (surface and nominal top of atmosphere) — `uswrf`, `ulwrf` (W m⁻²)"
    - name: Clouds and ozone (fcst_surf125 3-hourly instantaneous / fcst_p125 6-hourly)
      kind: instant
      items:
        - text: "Total, low, medium and high cloud cover — `tcdc`, `lcdc`, `mcdc`, `hcdc` (%)"
          kind: instant
          period: "3-hourly"
          note: "fcst_surf125. Marked in Handbook Section 10.3 as switched from average to instantaneous"
        - text: "Ozone mixing ratio (pressure levels) — `ozone` (mg kg⁻¹)"
          kind: instant
          period: "6-hourly"
          note: "fcst_p125 (output at 00, 06, 12, 18 UTC). The Handbook does not explicitly call it instantaneous; based on the absence of an averaging interval in the GDEX metadata"
        - text: "Cloud water (liquid + ice, pressure levels) — `cwat` (kg kg⁻¹)"
          kind: instant
          period: "6-hourly"
          note: "fcst_p125. Not explicitly called instantaneous in the Handbook; the GDEX metadata show no averaging interval"
    - name: Land surface (anl_land / fcst_phyland125)
      kind: instant
      period: "6-hourly"
      items:
        - "Water equivalent of accumulated snow depth — `snwe` (kg m⁻²)"
        - "Soil wetness — `soilw` (proportion)"
        - text: "Water run-off — `rof` (mm day⁻¹)"
          kind: mean
          period: "3-hour"
          note: "fcst_phyland125 — same 0–3 and 3–6 hour forecast averages as fcst_phy2m125"

access:
  - name: NSF NCAR GDEX — 3-hourly and 6-hourly data (d628000)
    url: https://gdex.ucar.edu/datasets/d628000/
    method: Web download / subsetting and format conversion / THREDDS
    note: Requires NCAR registration. WMO GRIB1, about 91 TB in total, so download only the variables and levels you need.
  - name: NSF NCAR GDEX — monthly means and variances (d628001)
    url: https://gdex.ucar.edu/datasets/d628001/
    method: Web download
  - name: DIAS (Data Integration and Analysis System, Japan)
    url: https://diasjp.net/en/
    method: Web download
    note: >-
      After long-term maintenance, DIAS announced in July–September 2026 that some services have resumed. The JMA page still says DIAS is inaccessible,
      so first check whether JRA-55 is available on DIAS, and use NCAR if not.

tips:
  - Under the JMA terms of use, send a copy of any paper or report that uses JRA-55 to JMA (jra@met.kishou.go.jp).
  - "On the GDEX dataset page, the Publications entry for the JRA-55 paper carries the DOI of the JRA-25 paper (10.2151/jmsj.85.369). The correct DOI for the JRA-55 paper is 10.2151/jmsj.2015-001."
  - JRA-55 and JRA-3Q can differ in climatology and trends, so do not splice them together within one analysis.

