notices:
  - date: "2021-01-07"
    level: info
    title: 20th Century Reanalysis v3 now extends back to 1806
    body: PSL announced an experimental extension of version 3 back to 1806, making the full record 210 years long. Observations in the extension are very sparse, so uncertainty is large.
    source: https://psl.noaa.gov/news/2021/010721.html
  - date: "2019-08-16"
    level: info
    title: Version 3 of the 20CR dataset will provide a 180-year history of the weather
    body: >-
      PSL announced that version 3, extending back to 1836, would be hosted at PSL starting in late September 2019. Compared with version 2c it offers more consistent
      uncertainty estimates and smaller errors, and it reduces an artificial trend in global sea-level pressure.
    source: https://psl.noaa.gov/news/2019/081619.html

