example:
  lang: python
  note: Data from 1981 onward are in the MO folders; data up to 1980 are in the SI folders.
  code: |
    import xarray as xr

    base = "https://psl.noaa.gov/thredds/dodsC/Datasets/20thC_ReanV3"
    slp = xr.open_dataset(f"{base}/miscMO/prmsl.2014.nc")["prmsl"]   # Pa, 3-hourly ensemble mean
    print(slp.sel(lat=37.5, lon=127.0, method="nearest").resample(time="1D").mean())

tips:
  - Reliability varies widely with observation density, even at the same time. Do not use the ensemble mean alone; check the spread in the spreads/ folder and avoid interpreting regions where the spread approaches the size of climate variability.
  - "The SST boundary condition is SODAsi.3 through 1980 and HadISST2.2 from 1981, which is why the PSL folders are split into SI and MO. Analyses spanning 1980/1981 must read both folders, and should check for a discontinuity at that point."
  - Version 3 uses different variable abbreviations from versions 2 and 2c, as the NERSC portal also points out. Check variable names first when reusing old scripts.
  - The developers' evaluation shows systematic biases in tropical precipitation and time-varying biases in Southern Hemisphere high-latitude pressure. For these topics, cross-check results against other long reanalyses such as ERA-20C.

