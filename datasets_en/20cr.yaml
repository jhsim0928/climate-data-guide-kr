# 20CR (v3) — dataset information file (English edition)
# ─────────────────────────────────────────────────────────────
id: 20cr
name: 20CR (v3)
full_name: NOAA-CIRES-DOE Twentieth Century Reanalysis Version 3
category: reanalysis
domain: atmosphere
group: 위성 관측 미동화 재분석
order: 10
domains: [대기, 육지]
provider: NOAA Physical Sciences Laboratory (PSL), University of Colorado CIRES and U.S. Department of Energy (DOE) (distributed by NOAA PSL, NSF NCAR GDEX and NERSC)

status: ended
status_note: >-
  A fixed-period dataset produced once for 1836–2015 (with an experimental extension to 1806–1835); it will not be extended beyond 2015. As of 2026-10-11
  the PSL 20CR pages mention no further extension or a version 4. Because it is almost the only ensemble reanalysis of the 19th- and early 20th-century atmosphere,
  it remains the standard dataset for that period.

successor:
  name: "None (ERA5 recommended from 1940)"
  url: https://psl.noaa.gov/data/20thC_Rean/
  note: >-
    No new version succeeding 20CR v3 has been released. ERA-20C and CERA-20C (1900–2010, both ended) are other long reanalyses that likewise assimilate
    only surface observations and are useful for comparison. If you only need the period from 1940, ERA5, which assimilates the full observing system, is more accurate.

transitions:
  - from: 20CR v2c
    to: 20CR v3
    status: completed
    date: "2019"
    summary: >-
      Version 3 moves to the autumn 2017 operational GFS, raising the resolution from T62 to T254, increases the ensemble from 56 to 80 members, and adds many
      more surface pressure observations from ISPD version 4.7. Adaptive covariance inflation and localization give more realistic uncertainty (ensemble spread) estimates,
      and the mid-19th-century sea-level pressure bias and precipitation spin-up problems are reduced. The record now starts in 1836 (1806 experimentally).
    changes:
      - aspect: Period
        before: "1851–2014 (2013–2014 as an experimental extension)"
        after: "1836–2015 (1806–1835 as an experimental extension, released in 2021)"
      - aspect: Forecast model
        before: "NCEP GFS circa 2009 (T62, 28 levels)"
        after: "Autumn 2017 operational NCEP GFS v14.0.1 + Noah land surface model + 2.5-layer thermodynamic sea-ice model, with dry-air mass conserved"
      - aspect: Horizontal resolution
        before: "T62 (about 1.9°), analysis output on a 2° × 2° grid"
        after: "T254 (about 0.7°, 512 × 256 Gaussian); described by PSL as 75 km grids"
      - aspect: Vertical levels
        before: "28 levels"
        after: "64 levels (PSL pressure-level output: 28 levels, 1000–1 hPa)"
      - aspect: Ensemble size
        before: "56 members"
        after: "80 members"
      - aspect: Data assimilation
        before: "Ensemble Kalman filter with fixed covariance localization (4000 km) and fixed inflation; digital filter initialization"
        after: "Ensemble square-root filter with 4D incremental analysis update (4D-IAU), adaptive localization, adaptive inflation via relaxation to prior spread (RTPS), adaptive quality control"
      - aspect: Observations
        before: "Surface and marine pressure only, ISPD version 3.2.9"
        after: "Surface and marine pressure only, ISPD version 4.7 (including ICOADS 3.0, IBTrACS and newly digitized Old Weather and Weather Detective data). Marine pressures before 1870 bias-corrected against climatology"
      - aspect: SST and sea-ice boundary conditions
        before: "SST: SODAsi.2 pentads (to 2012), daily high-resolution blended analysis from 2013 / sea ice: COBE-SST2"
        after: "SST: 8 members of SODAsi.3 (to 1980) and 8 members of HadISST2.2 (1981–2015) / sea ice: HadISST2.3"
      - aspect: Output interval and format
        before: "6-hourly analyses, GRIB1 (NCAR) / netCDF (PSL)"
        after: "3-hourly (8 times a day), netCDF4. Variable abbreviations differ from versions 2 and 2c (as noted by NERSC)"
      - aspect: Known issues addressed
        before: "Mid-19th-century low bias in global sea-level pressure (influence of Maury marine observations, 1851–1865), precipitation spin-up, unreliable confidence (spread) estimates"
        after: "Reduced sea-level pressure bias and artificial trend, no precipitation spin-up, more reliable confidence estimates, better storm and hurricane intensities"
      - aspect: Remaining issues
        before: "—"
        after: "Systematic biases in tropical precipitation and time-varying biases in Southern Hemisphere high-latitude pressure remain in version 3 (Slivinski et al. 2019)"
    impacts:
      - Versions 2c and 3 differ in boundary conditions, observations and model, so values differ even for the same year. Do not mix versions; when reproducing v2c results with v3, recompute climatologies and trends from scratch.
      - In v3 the SST input switches from SODAsi.3 to HadISST2.2 between 1980 and 1981, and files are split into SI (1806–1980) and MO (1981–2015) folders. Check for a discontinuity in any trend analysis that crosses this boundary.
      - "Variable abbreviations and folder layout changed (e.g. sea-level pressure `prmsl`, 3-hourly accumulated precipitation `apcp`), so v2c scripts will not run unchanged."
      - The v3 ensemble spread is more reliable, so when interpreting 19th-century results where observations are sparse, report uncertainty from the spread files rather than relying on the ensemble mean alone.
    sources:
      - name: Slivinski et al. (2019), Towards a more reliable historical reanalysis — 20CRv3, QJRMS, 145, 2876–2908
        url: https://doi.org/10.1002/qj.3598
      - name: NSF NCAR GDEX — 20CR Version 3 (d131003)
        url: https://gdex.ucar.edu/datasets/d131003/
      - name: NSF NCAR GDEX — 20CR Version 2c (d131002)
        url: https://gdex.ucar.edu/datasets/d131002/
      - name: reanalyses.org — 20CRv3 system details (compiled by the 20CR team)
        url: https://reanalyses.org/node/3637
      - name: reanalyses.org — New 20CR DA system presentation (comparison with the previous system)
        url: https://reanalyses.org/sites/default/files/NCRTF/new20CRDA.pdf
      - name: NCAR Climate Data Guide — 20CR Version 2 and 2c
        url: https://climatedataguide.ucar.edu/climate-data/noaa-20th-century-reanalysis-version-2-and-2c
      - name: NOAA PSL news — Version 3 of the 20CR dataset will provide a 180-year history of the weather (2019-08-16)
        url: https://psl.noaa.gov/news/2019/081619.html

period:
  start: "1836-01"
  end: "2015-12"
  note: >-
    The released period is January 1836 to December 2015, with 1806–1835 as an experimental extension (released in 2021). In the NCAR metadata, the full range is
    1805-12-31 18 UTC to 2016-01-01 00 UTC. Uncertainty is very large in the early 19th century, when observations are sparse, so always look at the ensemble spread.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "3시간"
  spatial: "Model T254 (0.703° × 0.702°, 512 × 256 Gaussian; described by PSL as 75 km grids) / PSL pressure-level output on a 1° × 1° grid (360 × 181)"
  vertical: "64 model levels / 28 PSL pressure levels (1000–1 hPa; specific humidity up to 100 hPa)"
  temporal: 3-hourly (8 times a day), daily and monthly means; ensemble mean and spread of 80 members
update: Ended (fixed-period dataset)
license: PSL data are freely available without restrictions (acknowledgement of PSL and copies of publications requested) / NCAR GDEX copy under CC BY 4.0
account_required: false

summary: >-
  The Twentieth Century Reanalysis assimilates only surface observations of synoptic pressure into NOAA's Global Forecast System and prescribes sea surface temperature
  and sea-ice distribution, producing 3-hourly estimates of the global atmosphere from the early 19th century to 2015. Using a single observation type avoids
  artificial changes from the introduction of satellite and upper-air data, and the 80-member ensemble filter provides an uncertainty estimate for every analysis.
  It is mainly used for historical extreme events, long-term circulation variability, and the pre-1940 period that other reanalyses do not cover.

time_convention:
  summary: >-
    The 20CR v3 files at PSL are 3-hourly (8 times a day) means of the 80-member ensemble, with time defined as the start of the interval (coordinate_defines 'start').
    00, 06, 12 and 18 UTC are analyses; 03, 09, 15 and 21 UTC are filled with 3-hour forecasts from those analyses (original pgrbensmeananl / +3 files).
    Variables available only from the forecast, such as precipitation, heat fluxes and radiation, are 3-hour averages or accumulations.
  points:
    - "Original GRIB descriptors: analyses are 'anl', intermediate times '3 hour fcst', fluxes '0-3 hour ave fcst', precipitation and runoff '0-3 hour acc fcst', maximum and minimum temperature '0-3 hour max/min'"
    - "`apcp` is a 3-hour accumulation (kg/m^2 = mm); fluxes such as `lhtfl` and `dswrf` are 3-hour mean rates (W/m^2)"
    - "The PSL file attributes carry no averaging information (avg_period, cell_methods), and every statistic is 'Ensemble Mean'. Whether a field is a mean or an accumulation was inferred from the long_name ('3-hourly accumulated …') and the original GRIB descriptors"
    - "The PSL files do not state whether accumulation or averaging intervals start or end at the time stamp. The original GRIB labels them as 3-hour windows from the forecast start (0–3 h, 3–6 h)"
    - "Values in the spreads/ folder are the ensemble standard deviation at the same time; Dailies and Monthlies are daily and monthly averages of the 3-hourly values"
  source: https://reanalyses.org/task-forces/pgrbensmeananlyyyymmddhhplus3
  source_name: "20CRv3 output file lists from the 20CR team (reanalyses.org: pgrbensmeananl, +3, sflxgrbensmeanfg) + PSL netCDF file attributes"

variables:
  note: >-
    Main variables from the NOAA PSL netCDF files (OPeNDAP attributes). Short names are the in-file names; the PSL folder name is given in each group heading.
    Folder names ending in SI hold 1806–1980 files and MO hold 1981–2015 files (e.g. prsSI, prsMO). Spread files follow the same layout under spreads/.
  full_list: https://psl.noaa.gov/thredds/catalog/Datasets/20thC_ReanV3/catalog.html
  groups:
    - name: Pressure levels (prsSI, prsMO; 3-hourly, 1000–1 hPa)
      kind: instant
      items:
        - "Air temperature — `air` (degK)"
        - "Geopotential height — `hgt` (m)"
        - "U- and V-components of wind — `uwnd`, `vwnd` (m/s)"
        - "Specific humidity (1000–100 hPa) — `shum` (kg/kg)"
    - name: Near surface (2mSI, 2mMO, 10mSI, 10mMO)
      kind: instant
      items:
        - "2 m air temperature — `air` (degK, file air.2m)"
        - "10 m U-component of wind — `uwnd` (m/s, file uwnd.10m)"
    - name: Single level and column (miscSI, miscMO)
      kind: instant
      items:
        - "Pressure reduced to MSL — `prmsl` (Pa)"
        - text: "Total cloud cover (entire atmosphere) — `tcdc` (%, file tcdc.eatm)"
          kind: mean
          period: 3-hour
          note: "Original GRIB descriptor for entire-atmosphere total cloud cover: '0-3 hour ave fcst'"
    - name: Accumulations and snow (accumsSI, accumsMO; 3-hourly accumulation)
      kind: accum
      period: 3-hour
      items:
        - "Total precipitation — `apcp` (kg/m^2)"
        - text: "Water equivalent of accumulated snow depth — `weasd` (kg/m^2)"
          kind: instant
          note: "Stored in the accums folder but a state variable; original GRIB descriptor '3 hour fcst' (instantaneous)"
    - name: Surface fluxes (sfcFlxSI, sfcFlxMO)
      kind: mean
      period: 3-hour
      items:
        - "Latent heat net flux — `lhtfl` (W/m^2)"
        - "Downward short-wave radiation flux at the surface — `dswrf` (W/m^2, file dswrf.sfc)"

