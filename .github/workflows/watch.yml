# 매일 아침 6시(한국 시간)쯤 자료 제공 기관의 공지 페이지를 점검해 바뀐 부분을 watch/changes.json에 남깁니다.
# 이어서 8시쯤 Claude 점검이 진짜 공지인지 판단해 공지 후보(PR)를 만들고, 9시에 운영자에게 요약 메일이 갑니다.
# 운영자가 PR을 머지(승인)해야 사이트와 구독자 메일에 반영됩니다.
name: 공지 페이지 점검

on:
  schedule:
    - cron: "7 21 * * *"   # UTC 21:07 = 한국 06:07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 PyYAML
      - run: python scripts/watch.py
      - name: 점검 결과 저장
        run: |
          git config user.name "notice-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "watch: 공지 페이지 점검 $(TZ=Asia/Seoul date +%F) [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
