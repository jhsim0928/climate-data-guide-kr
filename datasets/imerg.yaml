transitions:
  - from: IMERG V06 (V06B)
    to: IMERG V07 (V07B)
    status: completed
    date: "2023-07"
    summary: >-
      입력 마이크로파 알고리즘(GPROF2021)·보정 체계가 전반적으로 바뀌고, 얼음·눈 지표 위 강수와 극지가 처음 채워졌으며, 기록이 1998년 1월까지 늘었습니다.
      주요 변수 이름도 바뀌어(`precipitationCal` → `precipitation`) V06용 코드는 고쳐야 합니다.
    changes:
      - aspect: 전환 시점
        before: "V06 Final 마지막 달 2021-09 / V06 Early·Late는 2024-06-03 생산 중단"
        after: "V07 Final 재처리 2023-07-01~08-30(V07A), 결함 GPROF 궤도 162개 수정 후 V07B 2024-01-08 완료 / V07 Early·Late는 2024-06-01 자료부터"
      - aspect: 기간
        before: "2000-06~ (Final)"
        after: "1998-01~ (2024-11-07 V07B 연장, 2000-05 이전은 GridSat-B1 적외 사용)"
      - aspect: 고위도·얼음 지표
        before: "얼음·눈 덮인 지표 위 마이크로파 추정을 걸러 내 빈 곳이 많음"
        after: "포함 — 극 부근 일부 격자를 빼고 거의 전지구. 해당 지역 품질 지수는 낮춰 표시"
      - aspect: 변수 이름·위치
        before: "`precipitationCal`, `precipitationUncal`, `HQprecipitation`, `HQprecipSource`, `HQobservationTime`, `IRkalmanFilterWeight` (Grid 그룹)"
        after: "`precipitation`(Grid), `Grid/Intermediate/` 아래 `precipitationUncal`, `MWprecipitation`, `MWprecipSource`, `MWobservationTime`, `IRinfluence`. 월 파일 변수 이름은 그대로"
      - aspect: 일자료 계산
        before: "30분 값의 단순 합계(결측이 있으면 건조 편향)"
        after: "유효 30분 강도의 평균 × 24 (mm/day), 표본 수 `precipitation_cnt` 제공"
      - aspect: 우량계 보정
        before: "Legates-Willmott 포착 손실 보정, CORRA의 GPCP 조정을 육지에도 적용 / Early·Late는 우량계 보정 없음"
        after: "북위 45° 이북 유라시아에 Fuchs 보정 결합, 육지에서 CORRA의 GPCP 조정 중단 / Early·Late에 Final 기반 월별 기후 보정 추가"
      - aspect: 강수 상(액체 확률)
        before: "V06 방식"
        after: "ERA5(Final)·JMA(Early·Late) 열역학 변수 사용, 평균적으로 액체 확률이 높아짐. 강도 상한은 200 mm/hr로 올림"
    impacts:
      - V06과 V07을 한 시계열로 이어 붙이지 말고 전 기간을 V07로 다시 받으세요(V06은 더 이상 제공되지 않습니다).
      - 경로·변수 이름에 '06'·`precipitationCal`이 들어간 스크립트는 '07'·`precipitation`으로 고쳐야 합니다.
      - 고위도·겨울철 결과는 V07에서 새로 값이 생긴 지역이므로 품질 지수를 함께 확인하세요.
    sources:
      - name: IMERG V07 Release Notes (2024-11-26)
        url: https://gpm.nasa.gov/sites/default/files/2024-12/IMERG_V07_ReleaseNotes_241126.pdf
      - name: Status of IMERG Version 06 and 07 Data (GPM, 2024-06-21)
        url: https://gpm.nasa.gov/mission/news/status-imerg-version-06-and-07-data
      - name: GES DISC GPM_3IMERGDF V07 컬렉션 설명
        url: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGDF_07/summary
  - from: IMERG V07 (Final V07B, Early·Late V07C)
    to: IMERG V08
    status: planned
    date: "2026"
    summary: >-
      입력 산출물(GPROF·CORRA)이 V08로 바뀌어 V07 Final은 2025년 9월에서 멈췄고, 1998년부터 다시 만든 V08 Final은 2026년 가을, V08 Early·Late는
      그 뒤(빨라야 2026년 겨울) 공개될 예정입니다. 2026-10-12 확인 시 NASA CMR에는 V08 IMERG 컬렉션이 아직 등록되어 있지 않습니다.
    changes:
      - aspect: Final Run
        before: "V07B, 1998-01~2025-09-30에서 중단"
        after: "V08 Final, 1998-01부터 재처리 후 평소처럼 약 4개월 지연 갱신 (2026년 4월 공지 '2026년 여름' → 8월 공지 '2026년 가을 가능성')"
      - aspect: Early·Late Run
        before: "V07B (V07 알고리즘 + V07 입력)"
        after: "2026-03-04부터 V07C 혼합(V07 알고리즘 + GPROF V08 입력, 2026-03-01부터 CORRA 보정은 계절별 기후값 사용) → V08 전환은 빨라야 2026년 겨울, 전환 전 1998년부터의 V08 Early·Late 소급 기록 공개 예정"
      - aspect: 입력(부모 산출물)
        before: "GPROF·CORRA V07"
        after: "GPROF·CORRA V08 (GPM 전체 산출물 V08 재처리, 2026-03-09 시작)"
    impacts:
      - 2025년 10월 이후 연구용(Final) 자료가 필요하면 V08 Final을 기다리거나, Late Run(V07C)을 임시로 쓰되 판이 다르다는 점을 밝히세요.
      - V08 Final이 나오면 1998년부터 값이 모두 바뀌므로 V07로 만든 기후값·추세와 섞지 마세요.
    sources:
      - name: Update to the IMERG V08 Transition Schedule (GPM, 2026-08-06)
        url: https://gpm.nasa.gov/data/news/update-imerg-v08-transition-schedule-aug-2026
      - name: IMERG V08 Transition Schedule (GPM, 2026-04-28)
        url: https://gpm.nasa.gov/data/news/imerg-v08-transition-schedule
      - name: GPM Version 08 Reprocessing (Earthdata 공지)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/gpm-version-08-reprocessing

notices:
  - date: "2026-09-30"
    level: warning
    title: GES DISC 기존 데이터 서버(gpm1 등) 접근 종료 예정 — Earthdata Cloud로 전환
    body: >-
      gpm1.gesdisc.eosdis.nasa.gov 서버 안내문은 이 서버와 다른 모든 GES DISC 데이터 서버의 접근이 '빨라야 2026년 9월 30일' 이후 끝나며,
      계속 쓰려면 Earthdata Cloud로 옮겨야 한다고 밝히고 있습니다(익명 FTP는 이미 중단). 2026-10-12 확인 시 서버는 아직 응답합니다.
      스크립트의 주소를 data.gesdisc.earthdata.nasa.gov(HTTPS)나 earthaccess로 바꾸세요.
    source: https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/
  - date: "2026-08-06"
    level: warning
    title: IMERG V08 일정 재조정 — Final은 2026년 가을, Early·Late는 빨라야 2026년 겨울
    body: >-
      V08 부모 산출물 하나의 확정이 늦어져 1998년부터의 재처리를 시작하지 못했다며, V08 Final 공개가 '2026년 가을'일 가능성이 높다고 밝혔습니다.
      Early·Late는 V08 Final과 소급 기록 공개 뒤에 전환하며, 그때까지 혼합(V07C) 상태를 유지합니다.
    source: https://gpm.nasa.gov/data/news/update-imerg-v08-transition-schedule-aug-2026
  - date: "2026-04-28"
    level: critical
    title: IMERG V07 Final 기록이 2025년 9월에서 끝남
    body: >-
      입력인 CORRA·GPROF가 V08로 바뀌어, V07 코드로 계속 만들면 불연속이 생기므로 V07 Final은 2025년 9월 자료로 끝냈습니다.
      연구용 Final 자료는 V08 Final(1998년부터 재처리)이 나올 때까지 2025년 10월 이후 기간이 비어 있습니다.
    source: https://gpm.nasa.gov/data/news/imerg-v08-transition-schedule
  - date: "2026-03-04"
    level: info
    title: Early·Late Run이 GPROF V08 입력으로 전환 — 파일 버전 V07B → V07C
    body: >-
      GPM 전 산출물의 V08 재처리에 따라 IMERG Early·Late는 V07 알고리즘을 유지하되 V08 GPROF 강수를 입력으로 쓰기 시작했고,
      이를 표시하려고 파일 이름의 부버전이 V07C로 바뀌었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/gpm-version-08-reprocessing
  - date: "2026-01-15"
    level: info
    title: GES DISC GrADS Data Server(GDS) 서비스 중단 — IMERG 포함
    body: >-
      GES DISC는 IMERG(Early·Late·Final 30분·일·월, 해륙 마스크)를 포함한 GDS 서비스를 빨라야 2026년 3월 27일 이후 중단한다고 공지했습니다.
      같은 자료는 Earthdata Cloud에서 HTTPS와 부분 추출 서비스로 받을 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-discontinued-earlier-than-march-27-2026
  - date: "2024-11-07"
    level: info
    title: V07B Final 기록 시작을 1998년 1월로 연장 (TRMM 시대 포함)
    body: >-
      V07B의 시작점이 2000년 6월에서 1998년 1월로 늘었습니다. 2000년 6월 이전은 GridSat-B1 적외 자료로 만들었습니다.
      V07은 이전의 모든 IMERG 버전과 TRMM TMPA(3B42·3B43)를 대체합니다.
    source: https://gpm.nasa.gov/resources/documents/imerg-v07-release-notes

