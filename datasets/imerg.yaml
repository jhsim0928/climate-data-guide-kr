# ─────────────────────────────────────────────────────────────
# GPM IMERG — 데이터셋 정보 파일
# 대기 탭(강수 자료). V07 Final은 2025-09로 멈춰 있고 V08 전환 대기 중입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: imerg
name: GPM IMERG V07
full_name: Integrated Multi-satellitE Retrievals for GPM (IMERG) Version 07 (NASA 전지구 다중위성 강수 분석, 30분·0.1°)
category: satellite
domain: atmosphere
group: 강수 자료
order: 20
domains: [대기, 육지, 해양]
provider: NASA GSFC 강수처리시스템(PPS)·GPM 과학팀 (배포 NASA GES DISC, PPS)

status: delayed
status_note: >-
  연구용 Final Run(V07)은 2025년 9월 30일 자료를 끝으로 멈춰 있습니다. 입력 산출물(GPROF·CORRA)이 V08로 바뀌면서 V07 코드로는
  이어 만들 수 없기 때문이며, NASA는 2026년 8월 공지에서 1998년부터 다시 만든 V08 Final을 '2026년 가을'에 내놓을 가능성이 높다고 밝혔습니다.
  준실시간 Early·Late Run은 V07 알고리즘에 GPROF V08 입력을 쓴 '혼합(hybrid)' 상태(파일 이름 V07C)로 매일 계속 나오고 있습니다(2026-10-12 확인 시 2026년 10월 11일분까지).

period:
  start: "1998-01"
  end: present
  note: >-
    V07B Final(GPM_3IMERGHH·DF·M)은 1998-01-01~2025-09-30 (2024년 11월 7일 시작점을 2000년 6월에서 1998년 1월로 연장, 2000년 6월 이전은 GridSat-B1 적외 자료 사용).
    Early·Late(GPM_3IMERGHHE·HHL·DE·DL)도 1998-01-01부터 현재까지이며, 2026-10-12 확인 시 GES DISC 최신 파일은 2026-10-11 자료입니다.
    2025년 10월 이후 기간의 Final 자료는 V08 Final이 나올 때까지 없습니다.

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "30분"
  spatial: >-
    0.1° × 0.1° 전지구 위경도 격자(GES DISC 표기 90°S–90°N, 180°W–180°E). V07부터 극지방까지 값이 들어가지만(극 부근 일부 격자 제외),
    적외(IR) 기반 추정은 CPC 합성 적외 자료 범위인 60°N–60°S에만 있고 그 바깥은 마이크로파 추정(Final 월자료는 우량계 포함)만 씁니다.
  vertical: 지표 강수 단일층
  temporal: >-
    30분(반시간, 기본 산출) / 일(00~24 UTC, 30분 값으로 계산) / 월. PPS는 3시간·7일 묶음 파일도 제공합니다.

update: "Early 약 4시간, Late 약 14시간(최근엔 12시간 안팎) 지연으로 30분 단위 연속 생산 / Final은 관측 월 이후 약 3.5~4개월 지연 월 단위 (V07 Final은 2025-09에서 중단, V08 대기)"
license: NASA 지구과학 공개 자료 — 무료. GES DISC는 무료 NASA Earthdata 로그인, PPS 서버는 무료 PPS 등록이 필요합니다. 데이터셋 DOI 인용 요청
account_required: true

summary: >-
  IMERG는 NASA가 GPM 위성군의 수동 마이크로파(PMW) 강수 추정을 GPM 핵심위성 레이더·복사계 결합 산출물(CORRA)에 맞춰 보정하고,
  정지궤도 적외 자료와 칼만 필터 '모핑(morphing)'으로 빈틈을 메워 30분·0.1° 전지구 강수를 만드는 다중위성 강수 분석입니다.
  관측 후 약 4시간(Early)·14시간(Late)에 나오는 준실시간 판과, 월별 우량계 분석으로 보정해 약 4개월 뒤 나오는 연구용 Final 판이 있습니다.
  V07은 TRMM 시대를 포함한 1998년부터 다시 만든 기록으로, 이전 TMPA(3B42·3B43)와 IMERG V06을 모두 대체했습니다.

time_convention:
  summary: >-
    30분 파일의 강수 `precipitation`은 단위가 mm/hr인 '강도'입니다. IMERG 책임연구자(Huffman)는 30분 구간 중 어느 한 시점의 추정(스냅샷)을
    그 30분 전체의 대표값으로 쓴 것이라고 설명하므로, 30분 강수량(mm)은 값 × 0.5입니다. 파일 시각은 구간의 시작이며 파일 이름에 시작·끝 시각
    (예: S013000-E015959 = 01:30~01:59:59 UTC)이 들어 있습니다. 일자료는 00~24 UTC 하루의 '평균 강도 × 24'(mm/day), 월자료는 그달 평균 강도(mm/hr)입니다.
  points:
    - "30분 값을 그대로 더하면 강수량이 2배가 됩니다. 시간 합계는 (값 × 0.5)를 더하거나, 평균 강도(mm/hr)에 시간 수를 곱하세요."
    - "일자료(GPM_3IMERGDF·DE·DL)는 V07부터 유효한 30분 값의 평균 강도에 24를 곱한 값입니다(V06 이전의 단순 합계 방식에서 생기던 건조 편향을 줄임). 유효 표본 수는 `precipitation_cnt`에 있습니다."
    - "일자료의 하루는 00~24 UTC(파일 이름 S000000-E235959)이므로 한국 시간으로는 09시~다음날 09시입니다. 한국 시간 기준 일강수가 필요하면 30분 자료로 직접 합산하세요."
    - "월자료 `precipitation`도 mm/hr이므로 월강수량(mm)은 값 × 그달의 시간 수(예: 31일 × 24)입니다."
    - "Final의 30분 값은 그달의 위성-우량계 월합계와 맞도록 조정되고, Early·Late는 Final에서 만든 월별 기후 보정만 받습니다. 같은 시각이라도 세 판의 값이 다릅니다."
    - "`time`·`time_bnds` 단위는 30분·월 파일이 'seconds since 1980-01-06 00:00:00 UTC', 일 파일이 'days since 1980-01-06 00:00:00Z'입니다(GPS 기준 시각)."
  source: https://forum.earthdata.nasa.gov/viewtopic.php?p=23098
  source_name: "Earthdata Forum IMERG 책임연구자 답변(2025) + GES DISC GPM_3IMERGDF·HH·M V07 컬렉션 설명(CMR)"

variables:
  note: >-
    GES DISC V07 컬렉션 메타데이터 기준 주요 변수입니다. 30분·월 파일(HDF5)은 `Grid` 그룹(보조 변수는 `Grid/Intermediate`) 안에 있고,
    일 파일(netCDF4)은 최상위에 있습니다. 배열 순서가 (time, lon, lat)라 지도로 그리려면 축을 바꿔야 합니다. 대부분의 사용자에게는 `precipitation`이 권장 변수입니다.
  full_list: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGHH_07/summary
  groups:
    - name: 30분 자료 (GPM_3IMERGHH Final / HHE Early / HHL Late)
      kind: instant
      period: "30분 구간 대표값"
      items:
        - text: "보정된 다중위성 강수 강도 — `precipitation` (mm/hr)"
          note: "V06의 `precipitationCal`. 30분 안 한 시점의 추정을 30분 대표값으로 쓴 강도이므로 30분 강수량은 × 0.5"
        - "강수 추정 무작위 오차 — `randomError` (mm/hr)"
        - "액체 강수 확률(강수 상) — `probabilityLiquidPrecipitation` (%)"
        - "품질 지수 — `precipitationQualityIndex` (무차원)"
        - text: "보정 전 다중위성 강수 — `Grid/Intermediate/precipitationUncal` (mm/hr)"
          note: V07에서 Intermediate 그룹으로 이동
        - text: "마이크로파 강수 — `Grid/Intermediate/MWprecipitation` (mm/hr)"
          note: "V06의 `HQprecipitation`. 마이크로파 관측이 있는 격자만 값이 있음"
        - "적외 강수 — `Grid/Intermediate/IRprecipitation` (mm/hr)"
        - "마이크로파 관측 시각 — `Grid/Intermediate/MWobservationTime` (분), 센서 코드 — `MWprecipSource`, 적외 영향도 — `IRinfluence`"
    - name: 일자료 (GPM_3IMERGDF Final / DE Early / DL Late)
      kind: mean
      period: 일 (00~24 UTC)
      items:
        - text: "일강수 — `precipitation` (mm/day)"
          note: 유효한 30분 강도의 평균 × 24
        - "마이크로파 일강수 — `MWprecipitation` (mm/day)"
        - "무작위 오차 — `randomError` (mm/day)"
        - "액체 강수 확률 — `probabilityLiquidPrecipitation` (%)"
        - text: "유효 30분 표본 수 — `precipitation_cnt`, `MWprecipitation_cnt` (개)"
          kind: accum
          note: 하루 최대 48개. 단순 합계를 되살리거나 신뢰도를 판단할 때 사용
    - name: 월자료 (GPM_3IMERGM, Final만)
      kind: mean
      period: 월
      items:
        - text: "위성-우량계 결합 월강수 강도 — `precipitation` (mm/hr)"
          note: 월강수량(mm) = 값 × 그달 시간 수
        - "무작위 오차 — `randomError` (mm/hr)"
        - "우량계 상대 가중치 — `gaugeRelativeWeighting` (%)"
        - "액체 강수 확률 — `probabilityLiquidPrecipitation` (%)"
        - "품질 지수 — `precipitationQualityIndex`"
    - name: 고정 자료
      kind: static
      items:
        - "IMERG 해륙 마스크 0.1° — GES DISC `GPM_IMERG_LandSeaMask` V2"

access:
  - name: NASA GES DISC (Earthdata Cloud, HTTPS)
    url: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGHH_07/summary
    method: HTTPS 다운로드 / earthaccess / Earthdata Search / 부분 추출
    note: >-
      Final은 GPM_3IMERGHH(30분)·GPM_3IMERGDF(일)·GPM_3IMERGM(월), Early는 GPM_3IMERGHHE·GPM_3IMERGDE, Late는 GPM_3IMERGHHL·GPM_3IMERGDL입니다.
      파일 주소는 https://data.gesdisc.earthdata.nasa.gov/data/GPM_L3/GPM_3IMERGDF.07/YYYY/MM/ 형식이며 무료 Earthdata 로그인이 필요합니다.
      예전 서버(gpm1.gesdisc.eosdis.nasa.gov)는 2026년 9월 30일 이후 언제든 닫힐 수 있다고 안내되어 있으니 스크립트 주소를 바꾸세요.
  - name: Earthdata Cloud OPeNDAP
    url: https://opendap.earthdata.nasa.gov/
    method: OPeNDAP (Hyrax) — 변수·영역 부분 추출
    note: 파일별 OPeNDAP 주소는 CMR·Earthdata Search 결과에 함께 나옵니다. GES DISC의 GrADS Data Server(GDS)는 2026년 3월 이후 중단 대상입니다.
  - name: AWS us-west-2 직접 접근 (S3)
    url: https://data.gesdisc.earthdata.nasa.gov/s3credentials
    method: 클라우드 저장소(S3, us-west-2 안에서만)
    note: s3://gesdisc-cumulus-prod-protected/GPM_L3/GPM_3IMERGHH.07/ 처럼 저장되어 있으며 임시 자격증명이 필요합니다.
  - name: NASA PPS (GPM 자료 디렉터리)
    url: https://gpm.nasa.gov/data/directory
    method: HTTPS / FTP (PPS 등록 필요)
    note: 가장 빠르게 올라오는 곳입니다. Early·Late GeoTIFF(GIS) 파일과 3시간·7일 묶음도 여기서 받습니다.
  - name: NASA Giovanni
    url: https://giovanni.gsfc.nasa.gov/
    method: 웹 지도·시계열 분석
    note: 내려받기 전에 영역 평균 시계열이나 지도로 값의 크기를 점검하기 좋습니다.

example:
  lang: python
  note: >-
    earthaccess로 2023년 7월 한반도 영역의 Final 일자료를 받아 xarray로 여는 예입니다. 처음 실행 때 Earthdata 아이디·비밀번호를 묻습니다.
    일 파일은 (time, lon, lat) 순서라 지도로 그릴 때 transpose가 필요합니다.
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="GPM_3IMERGDF", version="07",
        temporal=("2023-07-01", "2023-07-31"),
        bounding_box=(124, 33, 132, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "imerg_daily")

    ds = xr.open_mfdataset(files, combine="by_coords")
    pr = ds["precipitation"].sel(lon=slice(124, 132), lat=slice(33, 39))   # mm/day, 00~24 UTC
    pr = pr.transpose("time", "lat", "lon")
    print(pr.mean("time"))

    # 30분 파일(HDF5)은 그룹을 지정해 엽니다: xr.open_dataset(f, group="Grid")
    # 30분 강수량(mm) = precipitation(mm/hr) * 0.5

tips:
  - "30분 `precipitation`은 mm/hr 강도입니다. 30분 파일 48개를 그냥 더하면 일강수가 2배로 나옵니다. 30분 강수량은 × 0.5, 월자료(mm/hr)는 × 그달 시간 수로 바꾸세요."
  - "Early·Late·Final은 알고리즘(전방 모핑만/양방향 모핑)과 보정(기후 보정/월 우량계 보정)이 달라 서로 다른 자료입니다. 장기 연구에는 Final을 쓰고, 최근 몇 달을 Late로 이어 붙였다면 그 사실을 논문에 밝히세요."
  - "2025년 10월 이후는 Final이 없습니다. V08 Final이 나오면 1998년부터 전체가 바뀌므로 V07과 V08을 섞지 말고 전 기간을 다시 받으세요."
  - "Early·Late 파일 이름의 V07C(2026-03-04~)는 V07 알고리즘에 GPROF V08 입력을 쓴 혼합 판입니다. 그 이전의 V07B 구간과 입력이 달라 미세한 불연속이 있을 수 있습니다."
  - "V07은 얼음·눈 덮인 지표 위 마이크로파 추정을 처음 포함했지만, NASA는 극지 강수와 강설량은 신중히 검토하라고 안내합니다. 산악 지형(한반도 동부 산지 포함)에서도 불확실성이 큽니다."
  - "2000년 6월 이전(1998-01~2000-05)은 GridSat-B1 적외 자료로 만든 구간이라 이후와 품질이 다를 수 있습니다. TRMM 시대(2014년 이전) 주의사항 문서도 함께 보세요."
  - "일자료의 하루는 00~24 UTC입니다. 기상청 관측(09시 또는 00시 KST 기준)과 비교할 때 날짜 경계를 맞추세요."
  - "30분·월 파일은 HDF5, 일 파일은 netCDF4입니다. 배열이 (lon, lat) 순서로 저장되어 있어 그대로 그리면 지도가 90° 돌아갑니다."

