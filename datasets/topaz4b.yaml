  - date: "2023-11"
    level: info
    title: 북극 예보 시스템은 TOPAZ5로 교체 — 재분석은 TOPAZ4b 유지
    body: >-
      같은 기관의 분석·예보 제품(ARCTIC_ANALYSISFORECAST_PHY_002_001)이 TOPAZ4에서 TOPAZ5로 바뀌어 수평·연직 해상도가 두 배가 되었습니다.
      재분석(002_003)은 계속 TOPAZ4b로 생산되므로, 최근 기간을 예보 제품으로 이어 붙이면 모델 체계가 다릅니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=ARCTIC_ANALYSISFORECAST_PHY_002_001

