    level: info
    title: ARCO 데이터큐브에 보존 기간(retention) 적용 예정
    body: >-
      Copernicus Marine가 일부 ARCO 데이터큐브에 제품 설명서의 보존 기간을 적용한다고 알렸습니다. 해당 데이터셋은 Subset 화면·Toolbox subset에서
      시계열 시작일이 늦어질 수 있고, 원본 파일(File Browser, copernicusmarine get)은 영향이 없습니다. 대상 제품 목록은 공지에 없습니다.
