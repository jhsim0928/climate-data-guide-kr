# ─────────────────────────────────────────────────────────────
# TOPAZ4b — 데이터셋 정보 파일
# Copernicus Marine 북극해 물리 재분석 (ARCTIC_MULTIYEAR_PHY_002_003, NERSC 생산)
# 해양 탭(재분석)에 싣고, 해빙 탭에도 교차 수록합니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: topaz4b
name: TOPAZ4b
full_name: >-
  Copernicus Marine Arctic Ocean Physics Reanalysis — TOPAZ4b (ARCTIC_MULTIYEAR_PHY_002_003, 북극해·북대서양 해양-해빙 결합 재분석)
category: reanalysis
domain: ocean
group: 재분석
order: 60
also_in:
  - domain: seaice
    group: 재분석
    label: "TOPAZ4b (북극 해빙)"
domains: [해양, 해빙]
provider: NERSC(노르웨이 난센 환경원격탐사센터) 생산 / Copernicus Marine Service(CMEMS) 배포

status: active
status_note: >-
  정상 제공 중이며 1년에 두 번 기간이 늘어납니다. 2025년 6월 2010년 이전 해빙 두께의 얇은 편향을 AI로 보정한 변수(sithick_corr)가 추가되었습니다.
  같은 기관의 예보 시스템(ARCTIC_ANALYSISFORECAST_PHY_002_001)은 2023년 11월 TOPAZ5로 바뀌었지만, 재분석은 계속 TOPAZ4b입니다.
  2026-10 확인 기준으로 이 재분석을 TOPAZ5·TOPAZ6 기반으로 바꾼다는 공식 계획은 찾지 못했습니다.

period:
  start: "1991-01"
  end: present
  note: >-
    1990년을 모델 안정화(spin-up)에 쓰고 1991년부터 제공합니다. 2026-10-12 확인 시 Copernicus Marine 카탈로그상 마지막 날짜는
    일자료 2026-06-30, 월자료 2026-06입니다. PUM은 매년 7월(준실시간 입력)과 11월(재처리 입력)에 직전 해를 갱신한다고 적고 있어,
    최근 구간은 나중에 다른 입력으로 다시 만들어질 수 있습니다.

resolution:
  spatial_short: "12.5 km (0.11°)"
  temporal_short: "1일"
  spatial: >-
    모델 원본: HYCOM 880×800 Arakawa C 격자, 격자 간격 약 12~16 km(북극해·북대서양).
    제공 원래 격자(originalGrid): 12.5 km 극 평사도법 609×881 (x −38~38, y −55~55, 단위 100 km; +proj=stere +lon_0=-45 +lat_0=90 +k=1 +R=6378273, WGS84 아님).
    기본 제공본: 0.125° 위경도 격자 2880×321 (50°N~90°N)으로 보간
  vertical: >-
    모델은 하이브리드 연직 좌표 50층. 제공 자료는 0~4,000 m의 40개 고정 깊이(0, 2, 4, 6, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 125, 150, 175, 200,
    250, 300, 350, 400, 450, 500, 600, 700, 800, 900, 1000, 1200, 1400, 1600, 1800, 2000, 2500, 3000, 3500, 4000 m)로 보간
  temporal: 일평균, 월평균, 연평균 (해면 운동량·열 플럭스는 일평균·월평균)

update: 연 2회 (7월·11월 연장)
license: Copernicus Marine Service 이용약관 — 무료(상업적 이용 포함), 출처 표시와 제품 DOI 인용 필수
account_required: true

summary: >-
  노르웨이 NERSC가 Copernicus Marine을 위해 만든 북극해·북대서양 해양-해빙 결합 재분석입니다. HYCOM 해양 모델과 CICE 해빙 모델을 결합하고,
  100개 앙상블의 결정론적 앙상블 칼만 필터(DEnKF)로 매주 위성 해수면 고도·해수면온도·해빙 농도·해빙 이동·해빙 두께(2010년 이후)와
  수온·염분 단면 관측을 동화했습니다. 1991년부터 일·월·연평균 수온·염분·해류와 해빙 농도·두께·이동을 12.5 km 격자로 제공해
  북극 해빙 변화, 대서양 해수 유입, 담수 저장량 연구에 쓰입니다.

time_convention:
  summary: >-
    모든 변수는 순간값이 아닌 평균값입니다. 일자료는 하루 평균(PUM상 12:00 UTC 중심), 월자료는 달 평균(PUM상 월 중앙 중심), 연자료는 일자료를 평균한 값이며,
    각 값은 100개 앙상블 구성원의 평균입니다. 수심(model_depth)만 시간에 따라 변하지 않는 고정값입니다.
  points:
    - "PUM은 일평균을 12:00 UTC 중심, 월평균을 월 중앙 중심이라고 설명하지만, Copernicus Marine 카탈로그의 시간 좌표는 일자료가 그날 00:00, 월자료가 그달 1일 00:00으로 표기됩니다. 시각 값은 '그 날짜(그 달)의 평균'을 가리키는 표시로만 해석하세요."
    - "연평균(…_P1Y)은 혼합층 두께처럼 비선형인 변수의 오차를 피하려고 월평균이 아니라 일평균 파일에서 계산했습니다."
    - "자료동화(DEnKF, 100개 앙상블)는 1주일 주기로 이루어지며, 일평균 값은 동화 사이의 모델 적분 결과를 하루 단위로 평균한 것입니다."
    - "대기 강제력은 ERA5 6시간 자료입니다."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-003.pdf
  source_name: CMEMS-ARC-PUM-002-003 (TOPAZ4b Product User Manual)

variables:
  note: >-
    Copernicus Marine 제품 사용자 매뉴얼(PUM)과 데이터셋 메타데이터 기준 파일 속 변수명입니다. 일·월·연 데이터셋(cmems_mod_arc_phy_my_topaz4_P1D-m, _P1M, _P1Y)의
    변수 구성은 같습니다. 원래 격자(극 평사도법)에서 벡터 성분은 격자 x·y 방향 기준이므로 위경도로 바꿀 때 회전이 필요합니다.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-003.pdf
  groups:
    - name: 3차원 해양 (40개 깊이)
      kind: mean
      period: 일 / 월 / 연
      items:
        - "잠재수온 — `thetao` (°C)"
        - "염분 — `so` (1e-3)"
        - "동쪽 방향 해류 — `vxo` (m/s)"
        - "북쪽 방향 해류 — `vyo` (m/s)"
    - name: 2차원 해양
      kind: mean
      period: 일 / 월 / 연
      items:
        - "해수면 높이(지오이드 기준) — `zos` (m)"
        - "혼합층 두께(포텐셜 밀도 기준) — `mlotst` (m)"
        - text: "해저면 잠재수온 — `bottomT` (°C)"
          note: 해저면 10 m 위에서 보간한 값이라 층 사이에서 불연속처럼 보일 수 있음
        - "순압 유선함수 — `stfbaro` (m3 s-1)"
    - name: 해빙
      kind: mean
      period: 일 / 월 / 연
      items:
        - "해빙 농도 — `siconc` (비율, 0~1)"
        - text: "해빙 두께 — `sithick` (m)"
          note: 모델 값(보정 전). 2010년 이전에는 두께 관측 동화가 없어 얇게 치우침
        - text: "AI 보정 해빙 두께 — `sithick_corr` (m)"
          note: 2010년 이전 구간을 기계학습으로 보정(Edel et al. 2025). 2010년 이후는 sithick과 같음
        - "적설 두께 — `sisnthick` (m)"
        - "해빙 동쪽 방향 속도 — `vxsi` (m/s)"
        - "해빙 북쪽 방향 속도 — `vysi` (m/s)"
    - name: 해면 플럭스 (별도 데이터셋)
      kind: mean
      period: 일 / 월
      items:
        - text: "해면 바람 응력 동·북 방향 — `tauuo`, `tauvo` (N m-2)"
          note: cmems_mod_arc_phy_my_mflux_P1D-m / _P1M-m (2024-11 추가)
        - text: "해면 순 하향 단파 복사 — `rsntds` (W m-2)"
          note: cmems_mod_arc_phy_my_hflux_P1D-m / _P1M-m
        - text: "해면 순 하향 열 플럭스 — `hfds` (W m-2)"
          note: cmems_mod_arc_phy_my_hflux_P1D-m / _P1M-m
    - name: 고정장(static)
      kind: static
      items:
        - "해저 수심 — `model_depth` (m)"

access:
  - name: Copernicus Marine Data Store — ARCTIC_MULTIYEAR_PHY_002_003
    url: https://data.marine.copernicus.eu/product/ARCTIC_MULTIYEAR_PHY_002_003/description
    method: 웹 다운로드(Subset·File Browser) / Copernicus Marine Toolbox(copernicusmarine)
    note: >-
      무료 Copernicus Marine 계정이 필요합니다. 데이터셋 ID — 일평균 cmems_mod_arc_phy_my_topaz4_P1D-m, 월평균 cmems_mod_arc_phy_my_topaz4_P1M,
      연평균 cmems_mod_arc_phy_my_topaz4_P1Y (현재 버전 202506), 플럭스 cmems_mod_arc_phy_my_mflux_P1D-m·_P1M-m, cmems_mod_arc_phy_my_hflux_P1D-m·_P1M-m.
      각 데이터셋에 0.125° 위경도 보간본(기본)과 12.5 km 극 평사도법 원래 격자(originalGrid)가 함께 있습니다.
  - name: Copernicus Marine Toolbox 문서
    url: https://toolbox-docs.marine.copernicus.eu/en/stable/
    method: Python / 명령줄(CLI)
    note: 현재 지원 버전은 2.x입니다.

example:
  lang: python
  note: "pip install copernicusmarine 으로 설치한 뒤, 처음 한 번 login()으로 계정 정보를 저장하고 실행합니다."
  code: |
    import copernicusmarine

    # 처음 한 번만: copernicusmarine.login()

    # 북극해 일평균 해빙 농도·두께(AI 보정 포함) — 기본 0.125° 위경도 격자
    copernicusmarine.subset(
        dataset_id="cmems_mod_arc_phy_my_topaz4_P1D-m",
        variables=["siconc", "sithick", "sithick_corr", "vxsi", "vysi"],
        minimum_longitude=-180, maximum_longitude=180,
        minimum_latitude=65, maximum_latitude=90,
        start_datetime="2005-03-01", end_datetime="2005-03-31",
        output_filename="topaz4b_seaice_200503.nc",
    )
    # 원래 12.5 km 극 평사도법 격자가 필요하면 dataset_part="originalGrid" 를 추가하고,
    # 영역은 minimum_x/maximum_x, minimum_y/maximum_y(단위 100 km)로 지정합니다.

tips:
  - >-
    2010년(CryoSat-2·SMOS 두께 동화 시작)을 경계로 sithick에 불연속이 있습니다. 1991년부터 해빙 두께·부피 추세를 볼 때는 sithick_corr를 쓰고,
    논문에 어느 변수를 썼는지 밝히세요.
  - >-
    PUM은 원래 격자의 벡터(해류·해빙 속도·바람 응력)가 극 평사 격자 방향 기준이라 위경도로 재투영할 때 회전해야 한다고 적고 있습니다.
    원래 격자 파일을 직접 GIS로 옮길 때는 x·y 좌표 단위(100 km)를 m로 바꾸고 투영의 지구 반지름(6378273 m 구)도 맞추세요.
  - 기본 0.125° 위경도 보간본은 원래 격자보다 약간 평활되고 육지 마스크가 넓어집니다. 해협·연안 수송 계산에는 원래 격자를 쓰는 편이 낫습니다.
  - "격자가 약 12 km라 북극해 중규모 소용돌이(로스비 반경 1~2 km)는 분해하지 못합니다. 소용돌이 규모 현상은 고해상도 모델 자료와 비교하세요."
  - 연직 보간(3차 스플라인) 때문에 수온·염분 경사가 강한 곳에서 값이 넘치거나(overshoot) 해저 근처 칸이 간헐적으로 비어 있을 수 있습니다.
  - 북극 범위는 GLORYS12(전지구 1/12°)에도 있지만, TOPAZ4b는 해빙 이동·두께를 직접 동화한 북극 전용 재분석입니다. 두 자료를 비교하면 해빙 분석의 불확실성을 가늠할 수 있습니다.

