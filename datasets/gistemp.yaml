notices:
  - date: "2026-09-14"
    level: info
    title: GMSTA 페이지 추가 — 올해·내년 연평균 기온 편차 추정 (1850~1900년 기준)
    body: >-
      GISS가 컬럼비아대 IRI와 함께 올해와 내년의 전지구 연평균 지표 기온 편차를 산업화 이전(1850~1900년) 기준으로 추정하는 GMSTA 페이지를 열었습니다. 매월 중순 갱신 예정입니다.
      LOTI 자료 자체(1951~1980년 기준)는 바뀌지 않았습니다.
    source: https://data.giss.nasa.gov/gistemp/gmsta/
  - date: "2026-06-10"
    level: info
    title: AIRS v7 기반 표·지도에 2021~2025년 보정 반영
    body: AIRS v7 기반 표시 자료에 주로 2021~2025년 구간의 최근 보정이 모두 반영되었고, AIRS v6에서 보정된 달도 제품에 쓰이게 되었습니다. GHCN·ERSST 기반 LOTI와는 별개의 자료입니다.
    source: https://data.giss.nasa.gov/gistemp/updates_v4/
  - date: "2026-04-26"
    level: warning
    title: 해양 입력 ERSST v5 중단 예고 (NOAA, 2026년 6월)
    body: >-
      NOAA PSL이 "NCEI가 2026년 6월 ERSST v5를 중단하고 v6로 대체할 예정"이라고 공지했습니다. GISTEMP는 2026년 10월 확인 시점에도
      ERSST v5를 쓰고 있으며(Data Downloads·홈 페이지 기준), 입력 교체 계획은 아직 공지되지 않았습니다.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-09-11"
    level: info
    title: 잘못된 관측소 보고 제외 (Maliye Karmakuly)
    body: 2025년 8월 보고가 약 12°C 어긋난 것으로 확인되어, 같은 관측소의 2024년 6월·2025년 6월 보고(약 3~4°C 오차)와 함께 분석에서 뺐다고 밝혔습니다.
    source: https://data.giss.nasa.gov/gistemp/updates_v4/
  - date: "2024-09-04"
    level: info
    title: GISTEMP v4 관측 불확실성 앙상블 공개 (Lenssen et al. 2024)
    body: >-
      200개 멤버로 이루어진 관측 불확실성 앙상블(2° 격자, 1880~2020)과 논문이 공개되었습니다. 2024-10-01에 NetCDF 파일의 시간 차원 표기 오류가 고쳐졌으니
      그 전에 받은 파일은 다시 받으세요.
    source: https://data.giss.nasa.gov/gistemp/uncertainty/

