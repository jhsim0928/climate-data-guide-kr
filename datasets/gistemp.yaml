# ─────────────────────────────────────────────────────────────
# GISTEMP v4 — 데이터셋 정보 파일
# 대기 탭(기온 자료)에 싣습니다. 육상 GHCN v4 + 해양 ERSST v5 결합 자료입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: gistemp
name: GISTEMP v4
full_name: NASA GISS Surface Temperature Analysis, version 4 (NASA 고다드 우주연구소 지표 기온 분석 4판)
category: analysis
domain: atmosphere
group: 기온 자료
order: 20
domains: [대기, 해양]
provider: NASA Goddard Institute for Space Studies (GISS)

status: active
status_note: >-
  매월 10일 무렵 갱신되며 정상 제공 중입니다. 2026년 10월 확인 시점에도 해양 입력은 ERSST v5이고(파일 이름 gistemp1200_GHCNv4_ERSSTv5),
  NOAA가 ERSST v6로 옮겨 가며 v5 중단을 예고한 상태라 앞으로 입력 교체가 있을 수 있습니다. 공식 공지가 나오면 이 페이지에 반영합니다.

period:
  start: "1880-01"
  end: present
  note: >-
    GISS 2026년 공개 일정상 2026년 9월분은 2026-10-09에 공개 예정이었습니다. 표 파일(tabledata_v4)은 이번 확인에서 직접 열어 보지 못해
    실제 마지막 달은 확인하지 못했습니다. 매달 갱신 때 늦게 들어온 관측이 반영되어 지난 달 값도 바뀔 수 있습니다.

resolution:
  spatial_short: "222 km (2°)"
  temporal_short: "1개월"
  spatial: >-
    NetCDF·Zarr 파일은 2° × 2° 정규 위경도 격자. 원 분석 파일(SBBX)은 등면적 격자(subbox).
    육상 관측소 영향 반경(smoothing radius)이 1200 km인 육지+해양 자료(LOTI)와 250 km인 육상 전용 자료를 따로 제공
  vertical: 지표 단일층 (육상 지상 기온 + 해양 해수면온도의 혼합)
  temporal: 월평균 편차 (표 파일에는 계절·연평균 함께 수록)

update: 매월 (보통 10일 무렵, NOAA NCEI 월간 기후 분석 발표와 같은 날)
license: 미국 정부(NASA) 공개 자료 — 페이지에 별도 라이선스 표기는 없고, "NASA GISS/GISTEMP" 출처 표기와 논문 인용 요청
account_required: false

summary: >-
  NASA 고다드 우주연구소(GISS)가 만드는 1880년부터의 전지구 월별 지표 기온 편차 자료입니다.
  육상은 NOAA GHCN v4 관측소 기온, 해양은 NOAA ERSST v5 해수면온도를 Hansen et al. (2010)·Lenssen et al. (2024) 방법으로 합쳐
  1951~1980년 평균 대비 편차로 제공합니다. 관측소 하나의 영향 반경을 1200 km까지 넓혀 북극처럼 관측이 드문 곳도 채우는 것이 특징이며,
  200개 멤버의 관측 불확실성 앙상블(1880~2020)도 따로 공개되어 있습니다.

time_convention:
  summary: >-
    모든 값은 해당 달의 월평균 기온 편차(1951~1980년 같은 달 평균 기준, °C)입니다. 특정 시각의 순간값이 아니며, 표 파일의 계절·연 값은 월값의 평균입니다.
  points:
    - "GISS FAQ: '평년(normal)'은 언제나 그 장소·그 달의 1951~1980년 평균을 뜻합니다. 기준 기간을 바꾸지 않는 이유는 장기 연구의 일관성 때문이라고 설명합니다."
    - "LOTI 지도는 육지와 해빙 위에서는 지상 기온 편차를, 해빙이 없는 바다에서는 해수면온도 편차를 씁니다. 해빙이나 호수가 있는 격자의 해수면온도는 쓰지 않습니다."
    - "매달 갱신 때 늦게 들어온 관측과 결측 처리 방식 때문에 이전 달·이전 연도 값도 조금씩 바뀝니다."
    - "AIRS 위성 기반 표는 기준 기간이 2007~2016년으로 다르므로 LOTI 값과 바로 비교하지 마세요."
  source: https://data.giss.nasa.gov/gistemp/faq/
  source_name: GISTEMP FAQ / Data Downloads 페이지

variables:
  note: >-
    공식 Data Downloads 페이지 기준 제공 자료입니다. NetCDF 파일 속 변수 이름은 이번 확인에서 직접 열어 보지 못해 적지 않았습니다
    (받은 뒤 ncdump -h로 확인하세요).
  full_list: https://data.giss.nasa.gov/gistemp/data_v4.html
  groups:
    - name: 격자 자료 (2° × 2°, NetCDF·Zarr)
      kind: mean
      period: 월
      items:
        - "육지+해양 기온 편차 (LOTI, 1200 km 반경) — gistemp1200_GHCNv4_ERSSTv5 (°C)"
        - "육상 지상 기온 편차 (해양 자료 없음, 250 km 반경) — gistemp250_GHCNv4 (°C)"
        - text: "2° 육지 마스크 — landmask.2degx2deg.txt"
          kind: static
    - name: 요약 표 (LOTI, 텍스트·CSV)
      kind: mean
      period: 월
      items:
        - "전지구·북반구·남반구 평균 편차 — GLB/NH/SH.Ts+dSST (°C, 월·계절·연)"
        - text: "위도대별 연평균 편차 — ZonAnn.Ts+dSST (°C)"
          kind: mean
          period: 연
    - name: 관측 불확실성 앙상블 (Lenssen et al. 2024)
      kind: mean
      period: 월
      items:
        - "200개 멤버 격자 편차 (2° × 2°, 1880~2020) — FullEnsembleZips (°C)"
        - "전지구·반구·위도대 평균 200개 멤버 시계열 — KeySeries.zip (°C)"
        - "격자별 앙상블 요약 통계 — GriddedSummary.zip"

access:
  - name: GISTEMP Data Downloads
    url: https://data.giss.nasa.gov/gistemp/data_v4.html
    method: HTTPS (웹 / wget / curl)
    note: >-
      요약 표(tabledata_v4/GLB.Ts+dSST.csv 등), 2° 격자 NetCDF(gz 압축)·Zarr v3(tar.gz), 원 분석 SBBX 파일과 변환용 Fortran 코드가 있습니다.
      격자 파일은 https://data.giss.nasa.gov/pub/gistemp/ 아래에 있습니다.
  - name: 관측 불확실성 앙상블 v2.0
    url: https://data.giss.nasa.gov/gistemp/uncertainty/
    method: HTTPS
    note: >-
      200개 멤버 앙상블(약 700 MiB zip 16개), KeySeries.zip, GriddedSummary.zip, R 분석 코드가 있습니다.
      일부 파일은 페이지에 안내된 공용 아이디·비밀번호가 필요합니다. 2024-10-01에 NetCDF 시간 차원 표기 오류가 고쳐졌습니다.
  - name: 관측소 자료 검색
    url: https://data.giss.nasa.gov/gistemp/station_data_v4_globe/
    method: 웹 도구
    note: 관측소별 원자료·보정 자료를 보고 받을 수 있습니다.
  - name: GISTEMP 소스 코드
    url: https://data.giss.nasa.gov/gistemp/sources_v4/
    method: HTTPS (tar.gz)

example:
  lang: python
  note: >-
    1200 km LOTI 격자 파일을 받아 면적 가중 전지구 평균을 계산합니다. 변수·좌표 이름은 파일을 열어 확인한 뒤 맞추세요
    (아래 코드는 시간·위도·경도 3차원 변수를 자동으로 고릅니다).
  code: |
    import gzip, shutil, urllib.request
    import numpy as np
    import xarray as xr

    url = "https://data.giss.nasa.gov/pub/gistemp/gistemp1200_GHCNv4_ERSSTv5.nc.gz"
    urllib.request.urlretrieve(url, "gistemp1200.nc.gz")
    with gzip.open("gistemp1200.nc.gz") as fi, open("gistemp1200.nc", "wb") as fo:
        shutil.copyfileobj(fi, fo)

    ds = xr.open_dataset("gistemp1200.nc")
    print(ds)                                         # 변수·좌표 이름과 단위 확인
    name = [v for v in ds.data_vars if ds[v].ndim == 3][0]
    da = ds[name]                                     # 1951~1980 기준 월평균 편차
    tdim, ydim, xdim = da.dims
    w = np.cos(np.deg2rad(da[ydim]))
    glob = da.weighted(w).mean([ydim, xdim])
    print(glob.isel({tdim: slice(-12, None)}).round(2).to_series())

tips:
  - 편차 기준이 1951~1980년이라 HadCRUT5(1961~1990년)보다 값이 높게 보입니다. 자료끼리 비교할 때는 같은 기준 기간으로 다시 맞추세요.
  - 1200 km 반경 자료는 관측소에서 멀리 떨어진 북극·남극 내륙까지 값을 채웁니다. 극지 결과를 해석할 때는 250 km 육상 자료나 관측소 분포와 함께 보세요.
  - 2026년 10월 현재 해양 입력은 ERSST v5입니다. NOAA는 2026년부터 ERSST v6를 공식 자료로 쓰고 v5 중단을 예고했으므로, GISTEMP의 해양 입력이 바뀌면 전 기간 값이 바뀔 수 있습니다. Updates to Analysis 페이지를 확인하세요.
  - 매월 갱신에서 과거 값도 바뀌므로, 논문에는 내려받은 날짜를 적고 원본 파일을 보관하세요(GISS 권장 인용에도 접근 날짜가 들어갑니다).
  - 불확실성 앙상블(v2.0)은 1880~2020년만 다루고 매달 갱신되지 않습니다. 최근 몇 년의 불확실성은 FAQ의 대략적 범위(연평균 약 ±0.05°C, 1960년 이후)를 참고하세요.
  - "이상한 관측소 보고는 GISS가 수시로 빼고 NOAA에 알립니다(예: 2025-09 Maliye Karmakuly 관측소 보고 3건 제외). 지역·관측소 단위 분석에서는 Updates to Analysis 기록을 확인하세요."

