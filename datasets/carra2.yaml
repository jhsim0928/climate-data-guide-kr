notices:
  - date: "2026-09-07"
    level: warning
    title: CDS 요청 양식의 지표 유출 이름 오류 수정 (2026-09-01)
    body: >-
      CDS 요청 양식에서 거칠기 길이(roughness)를 고르면 지표 유출(surface runoff) 자료가 내려받아지던 오류가 2026-09-01에 고쳐졌다고
      알려진 문제(Known issues) 페이지에 적혔습니다. 같은 페이지는 일·월 통계의 지표 순 단파복사(2011년 10월), 최고·최저 기온, 지표 유출,
      돌풍(전 기간) 누락분을 채우는 중이라고 밝혔습니다.
    source: https://confluence.ecmwf.int/spaces/CKB/pages/583771254/Copernicus+pan-Arctic+Regional+Reanalysis+CARRA2+Known+issues
  - date: "2026-06-03"
    level: info
    title: 매월 정기 갱신 계획 — CARRA1과 2027년 3월까지 병행
    body: >-
      C3S 총회 발표에 따르면 CARRA1과 CARRA2를 적어도 2026년 11월~2027년 3월 함께 매월 갱신하고, CARRA1은 2027년 3월 뒤로 연장하지 않으며
      CARRA2는 이후에도 매월 준실시간으로 갱신합니다. CDS 페이지는 "2027년부터 매월 갱신 예정", C3S 서비스 페이지는 "늦어도 2027년 1월부터"라고 적었습니다.
    source: https://climate.copernicus.eu/sites/default/files/custom-uploads/9th%20C3S%20GA/Day1/Day%201.7_Block%20I_SCHYBERG.pdf
  - date: "2026-05-27"
    level: info
    title: 과거 전체 기간(1986~2025) CDS 공개
    body: >-
      2025년 12월 일부 공개에 이어 CARRA2 40년 전체 자료가 시간별(reanalysis-pan-carra)과 일·월 통계(reanalysis-pan-carra-means) 두 데이터셋으로
      CDS에 공개되었습니다. 정기 갱신은 2026년 말부터 시작할 예정이라고 C3S가 밝혔습니다.
    source: https://climate.copernicus.eu/full-historical-carra2-data-release-offers-new-insights-arctic-extremes
  - date: "2026-05-15"
    level: warning
    title: 일·월 통계 데이터셋 일부 변수 누락
    body: >-
      CDS 일·월 통계 데이터셋 경고에 따르면 돌풍은 아직 제공되지 않고, 지표 유출과 안개는 많은 기간이 비어 있으며,
      최고·최저 기온과 해빙 표면 온도에도 빈 기간이 있습니다. 누락분은 채우는 중입니다.
    source: https://cds.climate.copernicus.eu/datasets/reanalysis-pan-carra-means
  - date: "2025-12-10"
    level: info
    title: CARRA2 첫 자료 공개 (24년, 3년 단위 8개 구간)
    body: >-
      1986~1988, 1991~1993, 1996~1998, 2001~2003, 2006~2008, 2011~2013, 2016~2018, 2021~2023년이 먼저 CDS에 공개되었습니다.
      모든 층 종류를 한 데이터셋에 담고 지역 잘라 받기를 지원하는 구성이 함께 도입되었습니다.
    source: https://forum.ecmwf.int/t/new-datasets-family-published-in-cds-copernicus-pan-arctic-regional-reanalysis-carra2/14483

