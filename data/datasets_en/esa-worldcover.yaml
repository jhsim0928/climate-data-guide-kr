    Cite the Zenodo DOI of the year you used (the official website says a reference publication is in preparation). On maps and figures, credit the source with the matching year, e.g.
    "© ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium".

transitions:
  - from: WorldCover 2020 v100
    to: WorldCover 2021 v200
    status: completed
    date: "2022-10"
    summary: >-
      The 2021 map was produced from scratch with an improved algorithm (v200); the 2020 map was not reprocessed with v200. Format and legend are the same, but the two maps are different versions.
    changes:
      - aspect: Training data and features
        before: "259,734 training locations, 131 features"
        after: "319,415 training locations, 115 features"
      - aspect: Overall accuracy (independent validation)
        before: "74.4%"
        after: "76.7% (±0.5%)"
      - aspect: File format and legend
        before: "COG, 3°×3° tiles, 11 classes"
        after: "Unchanged"
      - aspect: Distribution paths
        before: "s3://esa-worldcover/v100/2020/, single tar.gz on Zenodo"
        after: "s3://esa-worldcover/v200/2021/, 60°×60° macrotiles on Zenodo"
    impacts:
      - Do not read differences between the two maps as real land cover change (they are mostly algorithmic).
      - If only one year is needed, the more accurate 2021 v200 map is the usual choice.
    sources:
      - name: ESA WorldCover Product User Manual v2.0
        url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/docs/WorldCover_PUM_V2.0.pdf
      - name: ESA WorldCover — Data access (version notes)
        url: https://esa-worldcover.org/en/data-access
  - from: ESA WorldCover (2020–2021)
    to: Copernicus LCFM 10 m Global Land Cover (2020–2026)
    status: completed
    date: "2026-02"
    summary: >-
      The ESA demonstration project has ended, and 10 m global land cover is now an operational product of the EU Copernicus Land Monitoring Service (CLMS) LCFM project, planned yearly for 2020–2026.
      As of 2026-10-13 only the 2020 LCFM 10 m map has been released.
    changes:
      - aspect: Operator
        before: "ESA demonstration project (VITO-led consortium)"
        after: "EU Copernicus Land Monitoring Service (CLMS) — LCFM project"
      - aspect: Period
        before: "Two years, 2020 and 2021"
        after: "Yearly for 2020–2026 as planned (only 2020 released as of October 2026; 2021 onward announced for 2026)"
      - aspect: Input sensors
        before: "Sentinel-1 + Sentinel-2"
        after: "Sentinel-2 MSI (per the CLMS product description)"
      - aspect: Distribution
        before: "AWS, Zenodo, Terrascope, GEE"
        after: "Copernicus Data Space Ecosystem (browser, OData API, S3) and the CLMS product page"
    impacts:
      - LCFM is a separate product; check legend, definitions and accuracy before joining it to WorldCover in one series.
      - For 10 m global maps after 2021, follow the LCFM release schedule.
    sources:
      - name: ESA WorldCover news (2026-02-25, Copernicus LCFM operational successor)
        url: https://esa-worldcover.org/en/news
      - name: "CLMS — LCFM: a new chapter in global land cover monitoring (2025-06-26)"
        url: https://land.copernicus.eu/en/news/lcfm-a-new-chapter-in-global-land-cover-monitoring
      - name: CDSE forum — answer on LCM 10 m availability from 2021 onward (October 2025)
        url: https://forum.dataspace.copernicus.eu/t/timeline-of-availability-for-lcm-global-10m-2021-onwards/4051

notices:
  - date: "2026-02-25"
    level: warning
    title: WorldCover project concluded — operational successor is Copernicus LCFM
    body: >-
      The WorldCover website announced that the ESA WorldCover project has been completed and that 10 m global land cover maps are now available through the Copernicus LCFM product suite.
      WorldCover closes with its 2020 and 2021 maps.
    source: https://esa-worldcover.org/en/news
  - date: "2025-06-26"
    level: info
    title: Copernicus LCFM 10 m global land cover map (2020) released
    body: >-
      CLMS released the first LCFM products — a 10 m global land cover map and a pan-tropical tree cover density map, both for 2020 — and said yearly updates are planned for 2020–2026.
    source: https://land.copernicus.eu/en/news/lcfm-a-new-chapter-in-global-land-cover-monitoring
  - date: "2022-10-28"
    level: info
    title: WorldCover 2021 (v200) released
    body: >-
      The 2021 map, produced with an improved algorithm, was released with an overall accuracy of 76.7%. Differences from the 2020 (v100) map are mostly algorithmic.
    source: https://esa-worldcover.org/en/about/about

