notices:
  - date: "2026-08-14"
    level: warning
    title: High-biased cloud optical properties in NOAA-20 data — fix planned for Version 7.0
    body: >-
      According to the NCEI PATMOS-x page (revised 2026-08-14), much of the NOAA-20 data has high reflectance at oblique sun angles, biasing cloud optical properties high in some regions.
      Data for July 2018, January 2019 and after 13 January 2026 are not affected, and the fix is planned for Version 7.0.
    source: https://www.ncei.noaa.gov/products/climate-data-records/avhrr-hirs-cloud-properties-patmos

