# ─────────────────────────────────────────────────────────────
# MODIS Burned Area MCD64A1 C6.1 — dataset information file
# Listed under the Land tab, 'Fire'. Being phased out ahead of the end of Terra and Aqua; the successor is VIIRS VNP64A1 (viirs-burned-area.yaml).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-burned-area
name: "MODIS Burned Area (MCD64A1)"
full_name: MODIS/Terra+Aqua Burned Area Monthly L3 Global 500m SIN Grid V061 (MCD64A1, combined Terra and Aqua MODIS monthly burned area at 500 m)
category: satellite
domain: land
group: 산불
order: 10
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA MODIS Land Science Team (University of Maryland, Louis Giglio) / produced by NASA GSFC MODAPS / distributed by LP DAAC (USGS EROS)

status: deprecated
status_note: >-
  Still produced every month (on 2026-10-13 data were available through July 2026), but marked for replacement because both platforms are nearing the end of their missions.
  NASA projects the end of science operations for Terra in February 2027 and for Aqua in September 2027, and advises users that a final reprocessing will follow the end of
  data collection and that they should move to comparable VIIRS products. The burned area successor is VIIRS VNP64A1 (from March 2012), which uses the same algorithm and grid —
  but it faces its own problem, since Suomi NPP data delivery stops in November 2026. See the viirs-burned-area page as well.

period:
  start: "2000-11"
  end: present
  note: >-
    Starts in November 2000 (earlier data are not distributed because of unresolved Terra MODIS crosstalk and calibration issues). The early record uses Terra alone; Aqua observations were added once Aqua was operating.
    A CMR query on 2026-10-13 returned July 2026 as the latest month (produced 2026-09-10). June 2001 is heavily degraded by an extended Terra outage.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1개월"
  spatial: >-
    MODIS Sinusoidal (SIN) tile grid (horizontal h00–h35, vertical v00–v17, each tile about 10°×10°), 500 m — the true cell size is 463.31271653 m,
    and each tile is 2400 × 2400 pixels (grid name MOD_Grid_Monthly_500m_DB_BA).
  vertical: Single surface level
  temporal: Monthly (one file per calendar month). Each pixel stores the day within that month on which burning was detected (day of year, daily precision).

coverage:
  short: 전지구
update: "Monthly (on 2026-10-13 the July 2026 files had been produced on 2026-09-10 — about six weeks after the end of the month)"
license: NASA Earth science open data — freely shared without restriction. Citing the dataset DOI is encouraged
account_required: true

summary: >-
  MCD64A1 is a monthly, global burned area product that combines 500 m Terra and Aqua MODIS surface reflectance with 1 km MODIS active fire detections and records, for every burned
  500 m cell, the date on which it burned. Dynamic thresholds, trained on active fire observations, are applied to a burn-sensitive vegetation index from the shortwave infrared
  bands 5 and 7 and to a temporal texture measure. It is the most widely used reference burned area record, underpinning fire emission inventories such as GFED and FINN as well as
  carbon cycle and air quality research.

time_convention:
  summary: >-
    Each file covers one calendar month, and `Burn Date` is the day of year (1–366) on which burning was detected within that month. The value is not a snapshot at an observation
    time; it is the outcome of analysing a month of reflectance time series, with a separate date uncertainty (`Burn Date Uncertainty`, days). Observations from Terra
    (10:30 descending) and Aqua (13:30 ascending) are combined, but both satellites have drifted far from their nominal overpass times.
  points:
    - "AYYYYDDD in the file name is the first day (day of year) of the calendar month. Example: A2026182 = July 2026 (1 July = day 182)."
    - "In `Burn Date`, 0 is unburned land, -1 is unmapped because of insufficient data and -2 is water. Count only pixels with values 1–366 when computing burned area."
    - "`First Day` and `Last Day` bracket the period over which change could be reliably detected. Under persistent cloud the window is shorter than the month and QA bit 2 (shortened mapping period) is set."
    - "Annual burned area is built by pooling the burned pixels of 12 monthly files. A pixel can burn twice in a year, so decide whether you need total burned area or area burned at least once."
    - "Terra stopped orbit maintenance in 2020; its equator crossing time was expected to drift from 10:30 to about 9:00 by late 2025, while Aqua was expected to drift from 13:30 to about 15:50 by August 2026. Solar elevation, shadowing and pixel spacing have changed, so detection behaviour in recent years may differ from earlier years."
  source: https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf
  source_name: "MCD64A1 C6.1 User Guide (Giglio et al.) + LP DAAC Terra and Aqua MODIS acquisition plan notices"

variables:
  note: >-
    The five science data sets (SDS) listed in the LP DAAC and LAADS file specifications (HDF-EOS2, HDF4). The layer names contain spaces (e.g. "Burn Date"), so use them exactly as written.
    There is no scale factor. In Google Earth Engine (`MODIS/061/MCD64A1`) the bands are named without spaces (`BurnDate`, `Uncertainty`, `QA`, `FirstDay`, `LastDay`).
  full_list: https://ladsweb.modaps.eosdis.nasa.gov/filespec/MODIS/61/MCD64A1
  groups:
    - name: Monthly burned area layers (500 m)
      kind: instant
      items:
        - text: "Burn date (day of year) — `Burn Date` (day, int16)"
          note: "Day within the month on which burning was detected. 0 = unburned, -1 = unmapped, -2 = water"
          std: []
        - text: "Burn date uncertainty — `Burn Date Uncertainty` (days)"
          note: Always 0 for unburned and unmapped cells
        - text: "First day of reliable change detection — `First Day` (day of year)"
          note: First day on which burning in that month could be reliably mapped
          std: []
        - text: "Last day of reliable change detection — `Last Day` (day of year)"
          std: []
        - text: "Quality assurance — `QA` (8-bit field)"
          note: "Bit 0 land/water, 1 valid data, 2 shortened mapping period, 3 contextual relabeling, 5–7 special-condition code for unburned cells (too few observations, too few training samples, persistent hot spot, etc.)"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2565786756-LPCLOUD
    method: Web search and HTTPS download / earthaccess / direct S3 access in AWS us-west-2
    note: >-
      short_name MCD64A1, version 061. Files are per-tile HDF-EOS2 (.hdf) and need a free Earthdata Login.
      The S3 prefix is s3://lp-prod-protected/MCD64A1.061/, with temporary credentials from https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials.
      MODIS distribution from the old LP DAAC Data Pool (e4ftl01) ended on 30 June 2025.
  - name: AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Area and point subsetting with reprojection (GeoTIFF, NetCDF4)
    note: Convenient when you want only a region of interest on a lat-lon grid rather than raw tiles.
  - name: LP DAAC product page (DOI landing page)
    url: https://doi.org/10.5067/MODIS/MCD64A1.061
    method: Documentation (User Guide, ATBD) and layer information
  - name: University of Maryland burned area server (fuoco.geog.umd.edu)
    url: https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf
    method: SFTP — Plate Carrée GeoTIFF and shapefile subsets
    note: The science team provides regionally reprojected GeoTIFFs and burned area shapefiles; the openly shared login details are in the User Guide.
  - name: Google Earth Engine
    url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MCD64A1
    method: Cloud analysis (`MODIS/061/MCD64A1`)
  - name: NASA FIRMS (Burned Area mode)
    url: https://firms.modaps.eosdis.nasa.gov/
    method: Web map viewer
    note: Monthly and annual burned area can be overlaid on VIIRS VNP64A1 for comparison.

example:
  lang: python
  note: >-
    Downloads the March 2025 tiles covering the eastern Korean Peninsula with earthaccess and counts burned pixels and area. HDF4 files are opened with rasterio built against GDAL with HDF4 support.
    Pick the layer from the subdatasets list; one cell is 463.31271653 m squared.
  code: |
    # pip install earthaccess rasterio numpy   (rasterio needs a GDAL build with HDF4 support)
    import earthaccess
    import numpy as np
    import rasterio

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MCD64A1", version="061",
        temporal=("2025-03-01", "2025-03-31"),
        bounding_box=(127, 35, 130, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "mcd64a1")

    for f in files:
        with rasterio.open(f) as src:
            sds = [s for s in src.subdatasets if s.endswith("Burn Date")][0]
        with rasterio.open(sds) as b:
            burn = b.read(1)
        burned = (burn >= 1) & (burn <= 366)       # 0 unburned, -1 unmapped, -2 water
        area_km2 = burned.sum() * 463.31271653**2 / 1e6
        print(f, burned.sum(), "pixels,", round(area_km2, 1), "km2")

tips:
  - "`Burn Date` is a date, not an area. Compute area as the number of pixels with values 1–366 times the cell area (463.31271653 m squared, about 21.5 ha), excluding 0, -1 and -2."
  - "The data are on a sinusoidal projection. Use nearest-neighbour resampling when moving to a lat-lon grid; averaging or bilinear interpolation mixes dates and creates spurious ones."
  - "A 500 m product misses many small fires. Against Landsat 30 m reference data (Giglio et al. 2025), MCD64A1 had 71.5% omission and 34.2% commission error, and GFED5 adds small fires to reach roughly 90% more burned area than MCD64A1. Underestimation is large where small wildfires and crop-residue burning dominate, as on the Korean Peninsula."
  - "The User Guide recommends treating burned area in croplands as low confidence. Do not rely on MCD64A1 alone for agricultural burning."
  - "June 2001 (extended Terra outage) and August 2020 (about two weeks of lost Aqua telemetry, partly offset by direct broadcast data) are degraded months."
  - "Under persistent cloud, `Burn Date` is -1 (unmapped) or the `First Day`–`Last Day` window is shorter than the month. Do not count missing data as unburned (check QA bits 1 and 2)."
  - "Terra and Aqua orbit drift has changed observation times and pixel spacing in recent data. When examining trends in the 2020s, consider this change and compare with VIIRS VNP64A1, which overlaps from 2012."
  - "The production timestamp at the end of the file name changes with every reprocessing. Search by date and tile in scripts rather than hard-coding full file names."

