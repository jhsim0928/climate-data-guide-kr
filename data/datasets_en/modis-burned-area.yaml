transitions:
  - from: MCD64A1 C6
    to: MCD64A1 C6.1
    status: completed
    date: "2021-11"
    summary: >-
      The full record was regenerated as Collection 6.1 with improved Level-1B calibration. The burned area algorithm itself is unchanged from C6, and C6 (version 006) distribution ended on 31 July 2023.
    changes:
      - aspect: Input calibration
        before: "C6 L1B"
        after: "Improved response-versus-scan-angle handling for Aqua and Terra reflective bands, Terra IR optical crosstalk correction, corrected 2012–2017 Terra forward look-up table, polarization correction for the reflective solar bands"
      - aspect: Version label and DOI
        before: "MCD64A1.006"
        after: "MCD64A1.061, DOI 10.5067/MODIS/MCD64A1.061 (released 2021-11-08)"
      - aspect: Availability
        before: "LP DAAC distribution ended 2023-07-31"
        after: "Current version, updated monthly"
    impacts:
      - Do not append C6.1 to a time series built from C6 files; download the whole record again as C6.1.
    sources:
      - name: MCD64A1 C6.1 User Guide
        url: https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf
      - name: "Final Notice: MODIS Version 6.0 Land Data Products Decommissioned on July 31, 2023"
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023
  - from: MODIS MCD64A1 C6.1
    to: VIIRS VNP64A1 C2
    to_id: viirs-burned-area
    status: planned
    date: "2027"
    summary: >-
      VNP64A1 adapts the MCD64A1 C6.1 algorithm to Suomi NPP VIIRS and keeps the same 500 m sinusoidal grid and layer set. Over 2012–2023 the monthly global totals correlate at 0.989,
      but VIIRS maps 2–6% more area every year, so the two records should not simply be spliced. And because Suomi NPP data delivery ends in November 2026, VIIRS continuity itself
      depends on Collection 3, which is planned to add NOAA-20.
    changes:
      - aspect: Satellite and sensor
        before: "Combined Terra (10:30) and Aqua (13:30) MODIS"
        after: "Suomi NPP VIIRS only (13:30 ascending) — no morning overpass"
      - aspect: Input resolution
        before: "500 m reflectance + 1 km active fire (MOD14/MYD14 family)"
        after: "750 m M-band reflectance resampled to 500 m + VNP14A1 active fire (750 m resampled to a 1 km grid)"
      - aspect: Burn index bands
        before: "Shortwave infrared bands 5 and 7 (band 7 at 2.105–2.155 µm)"
        after: "Corresponding VIIRS bands (SWIR at 2.225–2.275 µm); the red band also differs"
      - aspect: Algorithm parameters
        before: "C6.1 defaults"
        after: "Temporal texture threshold 8 → 7.5 days, relaxed morphological erosion (N → N−1 neighbours), minimum prior probability 0.01 → 0.005"
      - aspect: Period
        before: "2000-11 to present (end of science projected for Terra 2027-02, Aqua 2027-09)"
        after: "2012-03 to present (Suomi NPP data delivery scheduled to end 2026-11-01)"
      - aspect: Processing level and format
        before: "L3, HDF-EOS2, file names MCD64A1.AYYYYDDD.hHHvVV.061.*.hdf"
        after: "L4, HDF4 (HDF-EOS2) with a virtually identical structure, VNP64A1.AYYYYDDD.hHHvVV.002.*.hdf (netCDF4 planned from Collection 3)"
      - aspect: Validation error (Landsat reference, 561 pairs)
        before: "Omission 71.5%, commission 34.2%"
        after: "Omission 72.4%, commission 36.7%"
      - aspect: Burned area magnitude (2012–2023 mean)
        before: "370.9 Mha per year"
        after: "386.0 Mha per year (2.1–6.3% more every year, largest difference in Southeast Asia)"
    impacts:
      - Do not splice the two records naively. Check regional differences over the overlap period (2012 onward) first, and if you do join them, report how in the paper.
      - Regional differences range from 0.1% in Europe to 33.1% in Southeast Asia, so a single global offset (about 4%) is not an adequate correction.
      - The file structure and layer names match, so MCD64A1 code works almost unchanged. Without a morning overpass, though, VIIRS burn dates agree slightly less often with active fire dates (same-day agreement 38% vs 46%).
      - Because Suomi NPP stops delivering data in November 2026, VIIRS burned area after that date depends on whether a NOAA-20-based product (planned Collection 3) is released.
    sources:
      - name: Giglio et al. (2025), The NASA VIIRS burned area product, global validation, and intercomparison with the NASA MODIS burned area product
        url: https://doi.org/10.1016/j.rse.2025.115006
      - name: Transition from MODIS to VIIRS (Earthdata, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: VNP64A1 V002 (LP DAAC DOI landing page)
        url: https://doi.org/10.5067/VIIRS/VNP64A1.002

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS placed in standby — use caution with data from 26 March 20:00 to 27 March 19:23 UTC, 2026
    body: >-
      A Terra spacecraft anomaly put MODIS into standby for almost a day before it returned to science mode on 27 March. Data from that window were flagged by the calibration team
      as questionable or bad, and MCD64A1 V061 is among the products listed in the notice. The March 2026 burned area may be missing about a day of Terra observations.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: End of science projected for Terra in February 2027 and Aqua in September 2027
    body: >-
      NASA projects that fuel and power limits will end Terra science operations in February 2027 and Aqua in September 2027. Once both stop, routine MCD64A1 production ends too,
      so long-term studies should secure an overlap period with VIIRS VNP64A1 now.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool distribution of MODIS ends (2025-06-30) — move to Earthdata Cloud
    body: >-
      LP DAAC announced that Data Pool (e4ftl01) access to all MODIS datasets, including C6.1, would be retired on 30 June 2025, with Earthdata Cloud as the primary archive.
      Earthdata Search and AppEEARS users are unaffected, but scripts pointing at Data Pool URLs must switch to earthaccess or cloud URLs.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua expected to begin shutting down in late 2026 or early 2027
    body: >-
      Terra and Aqua are expected to begin shutting down in late 2026 or early 2027; MODIS data collection will then stop and a final reprocessing will take place. Both platforms are
      drifting out of their designed orbits, changing crossing times and possibly affecting the data, so NASA encourages users to explore similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 land products (including MCD64A1.006) decommissioned on 2023-07-31
    body: >-
      LP DAAC ended distribution of all Version 6.0 Terra, Aqua and combined MODIS land datasets on 31 July 2023 (MOD44W and MCD43GF excepted).
      Use Version 6.1 (MCD64A1.061) for burned area.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

