# ─────────────────────────────────────────────────────────────
# MODIS BRDF/Albedo (MCD43) C6.1 — dataset information file (English edition)
# Land tab (land surface temperature & albedo). Deprecated as Terra and Aqua near their end; linked to the VIIRS successor (viirs-albedo.yaml).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-albedo
name: "MODIS BRDF/Albedo (MCD43)"
full_name: MODIS/Terra+Aqua BRDF/Albedo (MCD43) Collection 6.1 — BRDF model parameters, surface albedo and nadir BRDF-adjusted reflectance, produced daily from a 16-day window
category: satellite
domain: land
group: 지표면온도·알베도
order: 20
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA MODIS Land Science Team (Schaaf lab, UMass Boston) / NASA LP DAAC

status: deprecated
status_note: >-
  Collection 6.1 (V061) is the current version and is still produced daily (the latest MCD43A3 file on 2026-10-13 was dated 2 October 2026), but the Terra and Aqua platforms that feed it
  are out of fuel, drifting in orbit and approaching the end of their missions. In a May 2025 notice NASA said MODIS collection will stop once shutdown begins in late 2026 or early 2027,
  that a final reprocessing will follow, and that users should move to the similar VIIRS products (VNP43, VJ143). Both satellites have outlived the originally planned end dates
  (Terra December 2025, Aqua August 2026), but no official end date has been announced.

period:
  start: "2000-02"
  end: present
  note: >-
    CMR lists 2000-02-16 as the start, with no end date (ongoing). Before Aqua joined in mid-2002 the product used Terra observations only.
    Because each file is dated to the middle of its 16-day window, the newest file lags real time by about ten days (on 2026-10-13 the latest MCD43A3 file was A2026275 = 2026-10-02).

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1일"
  spatial: >-
    MODIS Sinusoidal tile grid, 500 m (MCD43A1–A4; each tile 2400 × 2400 pixels, about 1200 km × 1200 km) /
    0.05° Climate Modeling Grid (CMG; MCD43C1–C4) / 30 arc-second CMG (per-band, per-variable MCD43D products and the gap-filled snow-free MCD43GF)
  vertical: Land surface (single level)
  temporal: Produced daily (each retrieval uses 16 days of Terra and Aqua observations weighted to the 9th day; the file-name date is that 9th day)

coverage:
  short: 전지구
update: Daily (the 16-day window must fill before processing, so files appear roughly 10 days after their nominal date)
license: NASA Earth science open data — free and unrestricted under the EOSDIS Data Use and Citation Guidance. Downloads require a free NASA Earthdata Login
account_required: true

summary: >-
  MCD43 is the MODIS land team's standard BRDF/albedo suite. For every pixel, cloud-free multi-angle observations from Terra and Aqua over 16 days are fitted with a kernel-driven
  bidirectional reflectance distribution function (BRDF; the RossThick/LiSparse-Reciprocal model), and the fitted model is used to compute black-sky and white-sky albedo and
  nadir BRDF-adjusted reflectance (NBAR). Since Collection 6 the 16-day window slides forward one day at a time to give daily retrievals, with the 9th day emphasized so that fast
  surface changes such as snowfall, snowmelt, green-up and crop growth are captured. It comes as 500 m tiles (A products) and as global 0.05° and 30 arc-second grids (C and D products),
  and is a reference dataset for evaluating land surface albedo in climate models and for surface radiation budget studies.

time_convention:
  summary: >-
    A value is not a single observation: it comes from a BRDF model fitted to 16 days of observations, weighted towards the 9th day of the window (the date in the file name).
    Black-sky albedo and NBAR are computed for the solar zenith angle at local solar noon on that date, while white-sky albedo is the fully diffuse case and does not depend on sun position.
  points:
    - "The AYYYYDDD date in the file name is the centre (9th day) of the 16-day input window. A2026275 (2026-10-02), for example, is built from observations on either side of that date, not from that one day."
    - "Earlier reprocessed versions dated each retrieval to the first day of the window, and the Direct Broadcast version used the last day. Keep this in mind when aligning dates with old data."
    - "When a pixel has enough well-distributed observations (currently seven or more) a full inversion is made; otherwise a magnitude inversion scales an a priori BRDF shape. The quality flags tell them apart."
    - "Terra (morning) and Aqua (afternoon) observations are pooled, so the value does not belong to a particular time of day. Orbit drift has moved Terra's crossing earlier (about 09:00 by late 2025) and Aqua's later (projected around 15:50 by August 2026), so more observations are taken at low sun elevation."
    - "Actual (blue-sky) albedo is not provided. It has to be computed by interpolating between black-sky and white-sky albedo using the diffuse skylight fraction, which depends on aerosol optical depth."
    - "`BRDF_Albedo_ValidObs_Band*` in MCD43A2 records the days with valid observations within the 16-day window."
  source: https://www.umb.edu/spectralmass/modis-user-guide-v006-and-v0061/mcd43a3-albedo-product/
  source_name: "MODIS BRDF/Albedo V006/V006.1 User Guide (UMass Boston) + LP DAAC MCD43A3 V061 collection description (CMR)"

variables:
  note: >-
    Names inside the files, checked against the LP DAAC product pages and LAADS V061 file specifications. Albedo and BRDF parameters are INT16 with scale_factor 0.001, NBAR uses 0.0001, and the fill value is 32767.
    Band1–Band7 are MODIS bands 1–7 (620–2155 nm); vis, nir and shortwave are broadbands. The files are HDF-EOS2 (HDF4).
  full_list: https://lpdaac.usgs.gov/products/mcd43a3v061/
  groups:
    - name: Albedo (MCD43A3 500 m / MCD43C3 0.05°)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - text: "Black-sky albedo (direct beam, local solar noon) — `Albedo_BSA_Band1`–`Albedo_BSA_Band7`, `Albedo_BSA_vis`, `Albedo_BSA_nir`, `Albedo_BSA_shortwave` (dimensionless)"
          note: The BRDF fitted to 16 days of data, integrated at the local-noon solar zenith angle. A weighted model inversion, not an arithmetic mean
        - text: "White-sky albedo (fully diffuse) — `Albedo_WSA_Band1`–`Albedo_WSA_Band7`, `Albedo_WSA_vis`, `Albedo_WSA_nir`, `Albedo_WSA_shortwave` (dimensionless)"
          note: Independent of sun position
        - "Per-band mandatory quality — `BRDF_Albedo_Band_Mandatory_Quality_Band1`–`_shortwave` (0 full inversion, 1 magnitude inversion, 2–7 flag missing bands 5/6)"
        - text: "Fraction of snow-flagged inputs in the CMG cell — `Percent_Snow` (%)"
          note: MCD43C3. Share of the underlying 500 m inputs flagged as snow
        - text: "Fraction of valid inputs in the CMG cell — `Percent_Inputs` (%)"
          note: MCD43C3
        - text: "Solar zenith angle at local solar noon — `Local_Solar_Noon` (degrees)"
          kind: instant
          note: MCD43C3. Local-noon solar zenith on the file date
    - name: Nadir BRDF-adjusted reflectance, NBAR (MCD43A4 500 m / MCD43C4 0.05°)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - text: "Nadir BRDF-adjusted reflectance (local-noon sun, nadir view) — `Nadir_Reflectance_Band1`–`Nadir_Reflectance_Band7` (dimensionless)"
          note: scale_factor 0.0001. View-angle-corrected reflectance for vegetation index and land cover work
        - "Per-band mandatory quality — `BRDF_Albedo_Band_Mandatory_Quality_Band1`–`Band7`"
    - name: BRDF model parameters (MCD43A1 500 m / MCD43C1, C2 0.05°)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - text: "Kernel weights (isotropic, volumetric, geometric) — `BRDF_Albedo_Parameters_Band1`–`Band7`, `_vis`, `_nir`, `_shortwave`"
          note: "The last dimension (Num_Parameters) holds iso, vol and geo in that order. Use them to recompute reflectance and albedo for any sun/view geometry. MCD43C2 holds snow-free parameters"
    - name: Quality and ancillary information (MCD43A2 500 m)
      kind: mean
      period: 16-day window
      items:
        - "Snow status (snow vs snow-free retrieval) — `Snow_BRDF_Albedo`"
        - "Detailed BRDF inversion quality — `BRDF_Albedo_Band_Quality_Band1`–`Band7`"
        - "Albedo uncertainty (weight of determination for white-sky albedo) — `BRDF_Albedo_Uncertainty`"
        - text: "Days with valid observations in the 16-day window — `BRDF_Albedo_ValidObs_Band1`–`Band7` (days)"
          kind: accum
          note: Number of days within the 16-day window with valid observations
        - text: "Solar zenith angle at local solar noon — `BRDF_Albedo_LocalSolarNoon` (degrees)"
          kind: instant
        - "Platform used (Terra/Aqua) — `BRDF_Albedo_Platform`; land/water type — `BRDF_Albedo_LandWaterType`"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2278860820-LPCLOUD
    method: Web search and download / earthaccess (HDF-EOS2)
    note: >-
      MCD43A1, A2, A3 and A4 (500 m tiles), MCD43C1–C4 (0.05° CMG), MCD43D01–D68 (30 arc-second per band and variable) and MCD43GF (snow-free, gap-filled) are all available as V061.
      In CMR the short name is, for example, MCD43A3 with version 061. A free Earthdata Login is required.
  - name: NASA AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Point and area extraction with reprojection (GeoTIFF, NetCDF4)
    note: Returns point time series or latitude–longitude grids without handling Sinusoidal tiles yourself — the easiest route for first-time users.
  - name: LP DAAC product page (MCD43A3 V061)
    url: https://lpdaac.usgs.gov/products/mcd43a3v061/
    method: Documentation, layer tables, DOI
  - name: Google Earth Engine (MODIS/061/MCD43A4, MODIS/061/MCD43C3, etc.)
    url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MCD43C3
    method: Cloud analysis (Earth Engine account required)
    note: A redistributed copy of the NASA data; update timing can differ from the original.

example:
  lang: python
  note: >-
    Downloads one day of MCD43A3 tiles for April 2024 with earthaccess and reads white-sky shortwave albedo. The files are HDF4, so pyhdf is used (pip install earthaccess pyhdf numpy).
    The example keeps only full inversions (quality 0).
  code: |
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MCD43A3", version="061",
        temporal=("2024-04-15", "2024-04-15"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "mcd43a3")

    for f in files:
        sd = SD(f, SDC.READ)
        wsa = sd.select("Albedo_WSA_shortwave")[:].astype("float32")
        qa = sd.select("BRDF_Albedo_Band_Mandatory_Quality_shortwave")[:]
        wsa[wsa == 32767] = np.nan        # fill value
        wsa *= 0.001                      # scale_factor
        wsa[qa != 0] = np.nan             # keep full inversions only
        print(f, np.nanmean(wsa))

    # A file date such as A2024106 is the 9th day of the 16-day window.

tips:
  - "Values are stored as integers. Multiply albedo and BRDF parameters by 0.001 and NBAR by 0.0001, after first setting the fill value 32767 to missing."
  - "LP DAAC and the user guide recommend using the per-band quality flags to keep only full inversions (value 0). Magnitude inversions (1) come from pixels with too few observations and are much less certain."
  - "Collection 6.1 added quality values 2–7, which flag cases where band 5 or 6 (1.24 and 1.64 µm) was set to fill because of non-functional or noisy detectors — many Aqua MODIS band 6 detectors do not work. Check these values if your analysis uses those bands."
  - "Do not treat a file as one day's observation. The 16-day windows overlap, so neighbouring dates are strongly correlated and day-to-day differences cannot pin down the timing of a change."
  - "During snow-covered periods the retrieval is a snow retrieval (see `Snow_BRDF_Albedo`). For snow-free background albedo use MCD43C2 (snow-free parameters) or MCD43GF."
  - "The 500 m products are MODIS Sinusoidal tiles (hXXvYY). For a latitude–longitude grid, reproject with AppEEARS or use the 0.05° CMG (MCD43C3)."
  - "Orbit drift has shifted Terra and Aqua crossing times, increasing low-sun observations and shadows, and the lower orbits no longer keep a strict 16-day repeat. Keep this in mind when analysing trends from the 2020s onward."
  - "The MODIS land team has said it is preparing a final reprocessing, Collection 7 (all products in netCDF4), but as of 2026-10-13 CMR lists no MCD43 C7 collection. When C7 appears the whole record will change, so do not mix it with C6.1."
  - "Since 7 July 2023 the platforms have been flown with Lights-Out-Operations, so non-recoverable data gaps are more frequent than before. Check the dates on the LDOPE quality site (landweb.modaps.eosdis.nasa.gov)."

