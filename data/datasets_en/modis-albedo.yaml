transitions:
  - from: MODIS MCD43 C6.1 (Terra+Aqua)
    to: VIIRS VNP43·VJ143 C2
    to_id: viirs-albedo
    status: planned
    date: "2026"
    summary: >-
      To prepare for the end of Terra and Aqua, NASA produces VNP43 (Suomi NPP), VJ143 (NOAA-20) and VJ243 (NOAA-21) by applying the same algorithm
      (RossThick/LiSparse-Reciprocal BRDF, 16-day window weighted to the 9th day) to VIIRS data as the MODIS follow-on. Resolution, bands, file format and observing time differ, so the records cannot simply be joined.
    changes:
      - aspect: Platform and sensor
        before: "Terra (from 2000-02) and Aqua (from 2002-07) MODIS observations combined into one product (MCD43)"
        after: "VIIRS on Suomi NPP (VNP43, from 2012-01), NOAA-20 (VJ143, from 2018-01) and NOAA-21 (VJ243, from 2023-02), each a separate product"
      - aspect: Observing time
        before: "Mix of morning (Terra) and afternoon (Aqua) observations"
        after: "Observations from one afternoon-orbit satellite. No follow-on continues Terra's morning crossing (LAADS)"
      - aspect: Spatial resolution and bands
        before: "500 m, MODIS bands 1–7 plus vis, nir and shortwave broadbands / 0.05° and 30 arc-second CMG"
        after: "500 m (imagery bands I1–I3, IA products) + 1 km (M1–M5, M7, M8, M10, M11 plus vis, nir and shortwave, MA products) / 0.05° and 30 arc-second CMG"
      - aspect: Variable names
        before: "`Albedo_WSA_Band1`–`Band7`, `Albedo_WSA_shortwave`, etc."
        after: "`Albedo_WSA_M1`–`M11`, `Albedo_WSA_I1`–`I3`; broadbands keep names such as `Albedo_WSA_shortwave`. Same scale_factor 0.001"
      - aspect: File format
        before: "HDF-EOS2 (HDF4)"
        after: "HDF-EOS5 (HDF5)"
      - aspect: Algorithm
        before: "16-day window, 9th day weighted, full/magnitude inversions"
        after: "Same approach (designed to continue the MODIS BRDF/albedo suite)"
    impacts:
      - "Before joining MODIS and VIIRS albedo into one series, compare the two over their overlap (2012 onward) at the same sites and bands. Band centres differ, so spectral albedos do not map one-to-one; comparing broadband (vis, nir, shortwave) values is safer."
      - "MCD43 pools morning and afternoon observations, whereas the VIIRS products use a single afternoon satellite. Fewer observations can raise the share of magnitude inversions, so look at the quality-flag distribution too."
      - "Delivery of Suomi NPP data (VNP43) ends on 2 November 2026. Going forward, use VJ143 (NOAA-20) or VJ243 (NOAA-21)."
      - "HDF4 code (pyhdf, etc.) must be rewritten for HDF5 (h5py, xarray)."
    sources:
      - name: Liu et al. (2017) — evaluation of VIIRS BRDF/Albedo/NBAR and continuity with the MODIS record
        url: https://doi.org/10.1016/j.rse.2017.09.020
      - name: Román et al. (2024) — continuity between MODIS C6.1 and VIIRS C2 land products
        url: https://doi.org/10.1016/j.rse.2023.113963
      - name: NASA Earthdata — Transition from MODIS to VIIRS (2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: LAADS DAAC — MODIS To VIIRS Transition
        url: https://ladsweb.modaps.eosdis.nasa.gov/learn/modis-to-viirs-transition/
  - from: MCD43 Collection 6
    to: MCD43 Collection 6.1
    status: completed
    date: "2021-02"
    summary: >-
      A reprocessing with improved Level 1B calibration (reflective-band response, Terra IR crosstalk correction, polarization correction). The algorithm is unchanged, and the quality flag gained values marking missing bands 5 and 6.
      LP DAAC stopped distributing Collection 6.0 on 31 July 2023 (except MCD43GF).
    changes:
      - aspect: Input calibration
        before: "C6 Level 1B"
        after: "Revised response-versus-scan (RVS) approach for reflective bands, optical crosstalk correction for Terra IR bands, corrected Terra LUT updates for 2012–2017, polarization correction for reflective solar bands"
      - aspect: Mandatory quality values
        before: "0 full inversion / 1 magnitude inversion"
        after: "0 and 1 plus 2–7 (band 5 and/or 6 set to fill because of non-functional or noisy detectors)"
      - aspect: Availability
        before: "Distribution ended 2023-07-31"
        after: "Current version (CMR release date 2021-02-22)"
    impacts:
      - Do not mix C6 and C6.1; download the whole period again as C6.1.
      - "Code that assumes quality values of only 0/1 must be updated to handle 2–7."
    sources:
      - name: LP DAAC MCD43A3 V061 product page (Improvements/Changes)
        url: https://lpdaac.usgs.gov/products/mcd43a3v061/
      - name: MODIS Version 6.0 Land Data Products Decommissioned (Earthdata)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/modis-version-6-0-land-data-products-decommissioned

notices:
  - date: "2026-03-26"
    level: warning
    title: Terra MODIS placed in standby — data for 26–27 March 2026 flagged as bad
    body: >-
      After a spacecraft anomaly at about 20:00 UTC on 26 March, Terra MODIS went into standby mode and returned to science mode on 27 March.
      The calibration team flagged data from day 2026-085 20:00 UTC to day 2026-086 19:23 UTC as questionable or bad, so check the quality of MCD43 retrievals whose 16-day window includes this period.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2025-05-02"
    level: warning
    title: Move from MODIS to VIIRS — Terra and Aqua expected to shut down in late 2026 or early 2027
    body: >-
      NASA said MODIS data collection will stop once Terra and Aqua begin shutting down in late 2026 or early 2027, with a final reprocessing beforehand.
      It noted that orbit drift is affecting crossing times and may affect the data, and encouraged users to switch to similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2024-11-12"
    level: info
    title: MCD43GF V6.1 (snow-free, gap-filled, 30 arc-second) released
    body: >-
      The gap-filled, snow-free daily albedo, BRDF and NBAR product MCD43GF V6.1 was released starting with 2013–2021, with the remaining years to follow.
      The V6 MCD43GF stays available until the rest of V6.1 is out.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/gap-filled-modis-version-6-1-albedo-brdf-nbar-data-product-released
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 land products decommissioned (2023-07-31)
    body: >-
      LP DAAC stopped distributing Terra, Aqua and combined MODIS V6.0 land products (except MOD44W and MCD43GF). Users need to move to V6.1.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/modis-version-6-0-land-data-products-decommissioned
  - date: "2023-07-07"
    level: info
    title: Terra and Aqua MODIS switch to Lights-Out-Operations — more data loss possible
    body: >-
      The Flight Operations Team no longer staffs the 12-hour night shift and no longer fills gaps with solid-state recorder replays, so non-recoverable data loss may occur more often.
      Overall capture is still expected to exceed the 95% mission guideline. All MODIS V6.1 products are affected.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/modis-light-out-operations-potential-data-loss
  - date: "2021-11-10"
    level: warning
    title: Aqua orbit drift — equator crossing getting later
    body: >-
      After its last orbit maintenance manoeuvre in March 2021, Aqua began drifting to later crossing times in July 2021, passed 13:45 in February 2023, and was projected to reach about 15:50 around August 2026.
      Products are expected to stay mostly science quality, but the lower altitude reduces grid coverage and the strict 16-day repeat is no longer kept.
    source: https://lpdaac.usgs.gov/news/aqua-modis-acquisition-plan-through-august-2026/

