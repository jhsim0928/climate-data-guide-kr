# ─────────────────────────────────────────────────────────────
# NOAA/NSIDC CDR — dataset information file
# G02202 (final CDR) + G10016 (near-real-time CDR)
# ─────────────────────────────────────────────────────────────
id: nsidc-cdr-sic
name: NOAA/NSIDC CDR
full_name: NOAA/NSIDC Climate Data Record of Passive Microwave Sea Ice Concentration (G02202, Version 6) / Near-Real-Time NOAA/NSIDC Climate Data Record of Passive Microwave Sea Ice Concentration (G10016, Version 4)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 20
domains: [해빙, 해양]
provider: NOAA NCEI Climate Data Record (CDR) Program / National Snow and Ice Data Center (NSIDC)

status: active
status_note: >-
  Active. Version 6, released on 15 January 2026, adds JAXA AMSR2 as the brightness temperature input from 1 January 2025 onward, replacing DMSP SSMIS.
  The previous versions (CDR Version 5 and Near-Real-Time CDR Version 3) were retired and access to them removed on 17 June 2026; scripts that still point to the old paths must be switched to the V6/V4 paths.
  The end of the DMSP mission (expected September 2026) does not directly affect V6 and later updates.

transitions:
  - from: NOAA/NSIDC CDR V5
    to: NOAA/NSIDC CDR V6
    status: completed
    date: "2026-01"
    summary: >-
      Version 6 switches the input brightness temperatures from 1 January 2025 onward to JAXA AMSR2, ahead of the loss of the ageing and increasingly unreliable DMSP SSMIS data stream.
      The grids and variables are essentially those of V5, except that the V5 AMSR2 prototype group has been removed and a bug in the land spillover correction has been fixed.
      Differences over 1978–2024 are very small, but V5 access ended in June 2026, so the full record has to be downloaded again as V6.
    changes:
      - aspect: Period
        before: "1978-10-25 to 2024-12-31 (the last V5 update ran through the end of 2024)"
        after: "1978-10-25 to present (final CDR about 3 weeks behind; Near-Real-Time V4 covers the rest)"
      - aspect: Input sensor from 2025
        before: "DMSP-F17 SSMIS (from 2008-01-01)"
        after: "GCOM-W1 AMSR2 (from 2025-01-01): 18.7, 23.8 and 36.5 GHz channels; the native 12.5 km brightness temperatures are resampled to the 25 km grid"
      - aspect: Intercalibration
        before: "SSMIS-based tie-points and regressions used to intercalibrate with earlier sensors"
        after: "A varying ice/water threshold (adapted from Seki et al. 2024) is applied to AMSR2 to remove the residual hemispheric extent bias. Over the 2023–2024 overlap, differences from SSMIS are within the uncertainty range of the data"
      - aspect: Algorithm bug fix
        before: "Concentrations below 10% were wrongly considered in the land spillover correction"
        after: "Fixed. Ice extent increases slightly, mostly in the SMMR period (1978–1987). Updating the Python libraries (NumPy, Xarray) also causes minor rounding differences"
      - aspect: Differences 1978–2024 (V6 − V5 extent)
        before: "V5 values"
        after: "Mean difference 0.00066 (NH) and 0.0010 (SH) million km²; maximum daily difference 0.022 (NH) and 0.078 (SH) million km² (NSIDC Special Report 29)"
      - aspect: AMSR2 prototype data
        before: "Separate prototype_am2 group (from 2013) with `am2_seaice_conc`, `am2_seaice_conc_stdev`, `am2_seaice_conc_qa_flag`, etc."
        after: "prototype_am2 group removed; from 2025, AMSR2-derived values go directly into the main CDR variables (`cdr_seaice_conc`, etc.)"
      - aspect: Variable names and groups
        before: "Structure introduced in V5: main group with `cdr_seaice_conc`, `cdr_seaice_conc_stdev` and the QA/interpolation flags; cdr_supplementary group with `raw_bt_seaice_conc`, `raw_nt_seaice_conc`, `surface_type_mask`, `cdr_melt_onset_day` (V4's `nsidc_bt_seaice_conc`/`nsidc_nt_seaice_conc` were renamed in V5)"
        after: "Same names and group structure as V5 (only the prototype_am2 group is gone)"
      - aspect: Pole hole
        before: "SSMIS F17 — north of 89.02°N, 0.0292 million km²"
        after: "AMSR2 from 2025 — north of 88.5°N, 0.064 million km² (filled by interpolation)"
      - aspect: File names
        before: "sic_ps[n|s]25_[date]_F17_[version].nc (2008–2024)"
        after: "From 2025 the satellite code becomes am2: sic_ps[n|s]25_[date]_am2_[version].nc"
      - aspect: Access and DOI
        before: "G02202 V5, DOI 10.7265/rjzb-pf78 / Near-Real-Time V3, DOI 10.7265/j0z0-4h87"
        after: "https://noaadata.apps.nsidc.org/NOAA/G02202_V6/, DOI 10.7265/b18j-z797 / Near-Real-Time V4 https://noaadata.apps.nsidc.org/NOAA/G10016_V4/, DOI 10.7265/tm2n-1m33"
      - aspect: Near-real-time input
        before: "V3 — SSMIS-based, plus an AMSR2 prototype group (AMSR2 prototype discontinued 2025-09-01)"
        after: "V4 — AMSR2 input from 2025-01-01, same code as V6"
      - aspect: Support for previous versions
        before: "V5 and Near-Real-Time V3 — no longer updated from 2026-01-15"
        after: "V5 and V3 retired and access removed on 2026-06-17; only V6 and V4 are distributed"
    impacts:
      - V5 files are no longer distributed. For new work, download the full record from 1978 onward as V6, and never mix V5 and V6 in one time series.
      - The input sensor changes from SSMIS to AMSR2 on 2025-01-01. NSIDC reports the differences are within the data uncertainty, but for anomaly or trend analyses that straddle 2025, state the sensor change and test the sensitivity of your results to it.
      - "Scripts that read the `prototype_am2` group, or hard-code `F17` in file names, will fail on 2025+ data. Switch to the main CDR variables and the `am2` satellite code."
      - The land spillover fix makes SMMR-era (1978–1987) extent slightly larger than in V5. Keep this in mind when comparing 1980s baselines or long-term trends with earlier V5-based results.
      - The DOIs have changed. Cite V6 (10.7265/b18j-z797), and also V4 (10.7265/tm2n-1m33) if the most recent period comes from the near-real-time product.
    sources:
      - name: "NSIDC announcement — New version release: NOAA/NSIDC Sea Ice Concentration Data Records - CDR Version 6 and Near-Real-Time CDR Version 4 (2026-01-15)"
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-concentration-data-records-cdr-version-6-and-near-real-time
      - name: NSIDC Special Report 29 — NOAA/NSIDC Climate Data Record of Passive Microwave Sea Ice Concentration Version 6 Updates (Windnagel, Meier, Fetterer, 2026)
        url: https://nsidc.org/sites/default/files/documents/other/nsidc-special-report-29.pdf
      - name: G02202 Version 6 User Guide
        url: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v006-userguide.pdf
      - name: G02202 Version 5 User Guide
        url: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v005-userguide.pdf
      - name: G10016 Version 4 User Guide
        url: https://nsidc.org/sites/default/files/documents/user-guide/g10016-v004-userguide.pdf
      - name: NOAA@NSIDC Data Updates (V5 and V3 retired 2026-06-17)
        url: https://nsidc.org/data/data-programs/noaa-nsidc/data-updates

period:
  start: "1978-10"
  end: present
  note: >-
    Daily data begin on 25 October 1978 and monthly data in November 1978. The final CDR (G02202) runs through the most recent processing, about three weeks behind real time;
    the Near-Real-Time CDR (G10016) fills the gap and covers roughly the last three months. A gap exists from 3 December 1987 through mid-January 1988 due to satellite issues.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: "25 km × 25 km NSIDC polar stereographic grids (Northern Hemisphere EPSG:3411, 448 × 304; Southern Hemisphere EPSG:3412), true scale at 70°"
  vertical: Not applicable (surface data)
  temporal: Daily and monthly

update: Final CDR updated as processing proceeds (about 3 weeks behind); Near-Real-Time CDR updated daily (roughly the last 3 months retained)
license: Public NOAA data. Citation is required as a condition of use, and NSIDC asks users to describe the subset used (period, hemisphere) in the citation
account_required: false

summary: >-
  A Climate Data Record (CDR) of sea ice concentration from passive microwave data, produced by NSIDC under the NOAA CDR Program for both polar regions since 1978.
  It combines concentration estimates from the NASA Team and NASA Bootstrap algorithms with a rule-based method, and provides the spread between the two as an uncertainty estimate (standard deviation).
  Brightness temperatures from SMMR, SSM/I and SSMIS — and, from 2025, AMSR2 — feed a consistent daily and monthly time series on the same 25 km polar stereographic grids.
  It is widely used for studies of Arctic and Antarctic sea ice area and extent. (The NSIDC Sea Ice Index is a separate product computed from NSIDC-0051 and NSIDC-0803, not from this CDR.)

time_convention:
  summary: >-
    Daily fields represent the whole day: they are computed from daily brightness temperatures in which all satellite passes over a grid cell during the day are averaged ("drop-in-the-bucket" gridding).
    Monthly fields are averages of the daily concentrations at each grid cell. Neither is an instantaneous value at a particular time.
  points:
    - "Daily input brightness temperatures come from NSIDC's polar-gridded brightness temperature products (e.g. NSIDC-0001), where 24 hours of swath data are averaged into each grid cell. The CDR user guide does not specify the day boundary (e.g. whether it is UTC)."
    - "Missing days and cells are filled by two-sided linear interpolation using up to five days on either side; if that fails, a one-sided method copies the value from the nearest day within three days. Check cdr_seaice_conc_interp_temporal_flag, cdr_seaice_conc_interp_spatial_flag and the QA flag to see where filling was applied."
    - "Monthly means are per-cell averages of daily values, and at least 20 days of data (10 for SMMR) must be available for a month to be calculated. The monthly standard deviation is the standard deviation of that month's daily values."
    - "In the SMMR period (1978-10 to 1987-07) there is a file for every date, but days without observations contain the fill value. For 3 December 1987 to mid-January 1988 there are no files at all."
    - "The time coordinate in daily files is a date expressed as 'days since 1970-01-01 00:00:00'; it does not refer to a particular time of day."
  source: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v006-userguide.pdf
  source_name: G02202 Version 6 User Guide / NSIDC-0001 Version 6 data set page

variables:
  note: >-
    Daily-file variables as listed in the Version 6 user guide. Concentrations are stored as bytes 0–100 with scale_factor 0.01, so they usually read as fractions 0–1.
    Supplementary variables sit in the cdr_supplementary group. Monthly files use `cdr_seaice_conc_monthly`, `cdr_seaice_conc_monthly_stdev` and `cdr_seaice_conc_monthly_qa`.
    V4's `nsidc_bt_seaice_conc` and `nsidc_nt_seaice_conc` were renamed `raw_bt_seaice_conc` and `raw_nt_seaice_conc` in V5.
  full_list: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v006-userguide.pdf
  groups:
    - name: Sea ice concentration (main group)
      kind: mean
      period: Daily
      items:
        - text: "CDR sea ice concentration — `cdr_seaice_conc` (unitless, 0–1)"
          note: Daily value computed from daily-averaged brightness temperatures. The monthly `cdr_seaice_conc_monthly` is the monthly mean of the daily values
        - text: "CDR concentration standard deviation (uncertainty estimate) — `cdr_seaice_conc_stdev` (unitless, 0–1)"
          note: Spatial standard deviation of the 18 NASA Team and Bootstrap values in the surrounding 3×3 cells of that day's field (not a temporal statistic). The monthly `cdr_seaice_conc_monthly_stdev` is the standard deviation of the month's daily values
    - name: Quality and interpolation flags (main group)
      kind: mean
      period: Daily
      items:
        - text: "QA bit flags (weather filter, land spillover correction, missing, interpolation, melt onset, etc.) — `cdr_seaice_conc_qa_flag` (bit flags)"
          note: Records which processing was applied to that day's concentration. Ancillary information for the daily field, not a time statistic
        - text: "Spatial interpolation flag — `cdr_seaice_conc_interp_spatial_flag` (bit flags)"
          note: Marks cells that were spatially interpolated in that day's field
        - text: "Temporal interpolation flag — `cdr_seaice_conc_interp_temporal_flag` (bit flags)"
          note: Indicates whether the day's value was interpolated from neighbouring days
    - name: Supplementary variables (cdr_supplementary group)
      kind: mean
      items:
        - text: "Bootstrap algorithm raw concentration — `raw_bt_seaice_conc` (unitless, 0–2.54)"
          period: Daily
          note: Computed from the same daily brightness temperatures as the CDR concentration, without the weather filter, land spillover correction or masks
        - text: "NASA Team algorithm raw concentration — `raw_nt_seaice_conc` (unitless, 0–2.54)"
          period: Daily
          note: Computed from the same daily brightness temperatures as the CDR concentration, without the weather filter, land spillover correction or masks
        - text: "Melt onset day (Northern Hemisphere) — `cdr_melt_onset_day` (day of year)"
          kind: instant
          note: Day of year (60–244) on which melt was first detected in that melt season. Once set, the value is kept until the end of the season, so read it as the detection state up to that date
        - text: "Surface type mask (ocean 50, lake 75, polar hole 100, coast 200, land 250) — `surface_type_mask` (code)"
          kind: static
          note: Fixed surface mask. The file has a time dimension, but the guide does not describe any change over time. The sensor-dependent pole hole is handled by a separate ancillary field (polehole_bitmask)

access:
  - name: NSIDC data set page — G02202 Version 6 (final CDR)
    url: https://nsidc.org/data/g02202/versions/6
    method: Web documentation / HTTPS directory download
    note: User guide, C-ATBD, version-change report (Special Report 29) and a sign-up form for update notifications.
  - name: NOAA@NSIDC HTTPS archive — G02202_V6
    url: https://noaadata.apps.nsidc.org/NOAA/G02202_V6/
    method: HTTPS (browser, wget, Python/R scripts)
    note: No login needed. Daily and monthly files are under north/ and south/, and yearly aggregated daily files are also available.
  - name: NSIDC data set page — G10016 Version 4 (Near-Real-Time CDR)
    url: https://nsidc.org/data/g10016/versions/4
    method: Web documentation / HTTPS (https://noaadata.apps.nsidc.org/NOAA/G10016_V4/)
    note: Provisional data covering about the last three months. Replace that period with G02202 once the final CDR is available.
  - name: NOAA NCEI Sea Ice Concentration CDR page
    url: https://www.ncei.noaa.gov/products/climate-data-records/sea-ice-concentration
    method: Web documentation (documents, source code, maturity matrix)
  - name: How to access NOAA@NSIDC data sets via PolarWatch (help article)
    url: https://nsidc.org/data/user-resources/help-center/how-access-noaansidc-data-sets-polarwatch
    method: ERDDAP (subsetting, format conversion)
    note: Check the PolarWatch dataset ID first to confirm that it serves Version 6.

example:
  lang: bash
  note: Download over HTTPS without logging in. File names follow sic_ps<n|s>25_<YYYYMMDD>_<satellite code>_<vXXrXX>.nc (satellite codes such as F17 or am2), so check the exact names in the directory listing.
  code: |
    # Mirror the Northern Hemisphere V6 daily directory (better to restrict to the year folders you need)
    wget -r -np -nH --cut-dirs=3 -A "*.nc" -e robots=off \
      https://noaadata.apps.nsidc.org/NOAA/G02202_V6/north/daily/

    # In Python, open the supplementary group separately
    # xr.open_dataset(f)                               -> cdr_seaice_conc, etc.
    # xr.open_dataset(f, group="cdr_supplementary")    -> raw_bt_seaice_conc, etc.

tips:
  - >-
    The same date can have different values in the final CDR (G02202) and the Near-Real-Time CDR (G10016): the near-real-time product is provisional and lacks some
    quality control and temporal interpolation. Base published analyses on the final CDR, fill only the last few weeks with near-real-time data, and replace them later.
  - >-
    From 1 January 2025 the input sensor is AMSR2 instead of SSMIS (F17). NSIDC adjusted AMSR2 to match SSMIS and reports differences within the data uncertainty,
    but it is still safest to flag the sensor change in trend or anomaly analyses that compare periods before and after 2025.
  - >-
    The pole hole is filled by interpolation and flagged as 100 in surface_type_mask. Its size depends on the sensor (north of 84.1°N for SMMR, 86.7°N for SSM/I,
    89.0°N for SSMIS, 88.5°N for AMSR2), which can affect late-summer and early-autumn trends and climatologies.
  - >-
    The polar stereographic grid is not equal-area, so cell areas vary. When computing sea ice area yourself, do not simply multiply by 25 km × 25 km —
    use the latitude-dependent cell areas.

