notices:
  - date: "2026-06-17"
    level: critical
    title: Sea Ice Concentration CDR Version 5 and Near-Real-Time CDR Version 3 retired
    body: >-
      NSIDC retired Version 5 of the sea ice concentration CDR and Version 3 of the Near-Real-Time CDR, and access to these versions has been removed.
      Scripts using the old paths (G02202_V5, G10016_V3) must be switched to V6 (G02202_V6) and V4 (G10016_V4).
    source: https://nsidc.org/data/data-programs/noaa-nsidc/data-updates
  - date: "2026-01-15"
    level: warning
    title: "New version release: NOAA/NSIDC Sea Ice Concentration Data Records - CDR Version 6 and Near-Real-Time CDR Version 4"
    body: >-
      AMSR2 is added as a brightness temperature input from 1 January 2025, the AMSR2 prototype group (prototype_am2) from Version 5 is removed, and a bug that let
      concentrations below 10% be considered in land spillover corrections is fixed. The fix makes V6 extent slightly larger than V5, mainly in the SMMR period.
      V5 and Near-Real-Time V3 are no longer updated as of this date.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-concentration-data-records-cdr-version-6-and-near-real-time
  - date: "2025-08-06"
    level: info
    title: "User notice: NOAA/NSIDC Sea Ice Concentration Near-Real-Time CDR Version 3 will Continue SSMIS Data Processing"
    body: >-
      The U.S. Department of Defense will keep processing and delivering SSMIS data until the DMSP mission retires (expected September 2026), so Near-Real-Time CDR V3 continues to be updated.
      Gaps in SSMIS data that began in late spring 2025 may continue; NSIDC subsequently moved to AMSR2 in V6/V4.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-noaansidc-sea-ice-concentration-near-real-time-cdr-version-3-will-continue-ssmis-data
  - date: "2025-06-25"
    level: warning
    title: "User notice: SSMIS Data Discontinuation Affecting Sea Ice Index and Sea Ice CDR Effective 30 June 2025 (later withdrawn)"
    body: >-
      The Department of Defense announced it would stop processing and delivering SSMIS data no later than 30 June 2025, so the Near-Real-Time CDR and the Sea Ice Index would stop processing after that date.
      Delivery was then extended to the end of July (30 June update), and in August it was continued until the end of the DMSP mission.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-ssmis-data-discontinuation-affecting-sea-ice-index-and-sea-ice-cdr-effective-30-june
  - date: "2025-06-04"
    level: info
    title: "User notice: Degraded SSMIS Data Delivery Affecting Data Products"
    body: >-
      The U.S. Navy's delivery of SSMIS data has become sporadic, which will likely cause daily data gaps in several NSIDC products that use SSMIS input.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-degraded-ssmis-data-delivery-affecting-data-products

