notices:
  - date: "2026-08-26"
    level: info
    title: Production status — first release (2007 onward) towards the end of 2027, then ERA5T replacement
    body: >-
      According to ECMWF Newsletter 188, the 2007 and 2017 streams are running and the 1987 and 1997 streams are due to start, giving four streams in parallel.
      The streams from 2007 onward are expected to be published towards the end of 2027, and ERA6 will replace ERA5T once enough data are published.
      The ERA6T latency and detailed timing will follow in a transition plan.
    source: https://www.ecmwf.int/en/newsletter/188/news/era6-reanalysis-production
  - date: "2026-06-03"
    level: info
    title: C3S General Assembly talk — ERA5T maintained for the time being
    body: >-
      ECMWF's talk at the C3S General Assembly (June 2026) said to expect 2007 onwards public by late 2027 and presented new outputs (3D and 2D ocean parameters,
      11 height levels, clear-air turbulence) and fast access through Polytope. It also stated that ERA5T will be maintained for the time being.
    source: https://climate.copernicus.eu/sites/default/files/custom-uploads/9th%20C3S%20GA/Day1/Day%201.6_Block%20I_HERSBACH.pdf
  - date: "2026-05-08"
    level: info
    title: ERA6 prototype test data published (not for publication)
    body: >-
      ECMWF published ERA6 prototype sample data for June–August 2022 and October 2019–September 2020. They are not an ERA6 production
      and should not be used for any application or publication — only for testing workflows and giving feedback.
    source: https://www.ecmwf.int/en/forecasts/datasets/era6-prototype-1-sample-data-testing-only-june-august-2022
  - date: "2026-03-06"
    level: info
    title: Copernicus Climate's ERA6 reanalysis production starts
    body: >-
      Copernicus announced the start of ERA6 production. The first two decades will be deployed first, followed by backward extensions, and users should be able to
      download the first four decades by early 2028. ERA5 production continues uninterrupted for as long as needed.
    source: https://climate.copernicus.eu/copernicus-climates-era6-reanalysis-production-starts

