# ─────────────────────────────────────────────────────────────
# ERA6 — dataset information file (not yet released)
# ECMWF's sixth-generation global reanalysis, produced for C3S. Production started 2026-03; first release (2007 onward) expected towards the end of 2027.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: era6
name: ERA6
full_name: ECMWF Reanalysis v6 (ERA6)
category: reanalysis
domain: atmosphere
group: 재분석
order: 12
domains: [대기, 육지, 해양, 해양파랑]
provider: ECMWF / Copernicus Climate Change Service (C3S)

status: upcoming
status_note: >-
  Not yet released. Production started in March 2026 in parallel ten-year streams beginning in 2007 and 2017,
  and the streams covering 2007 onward are expected to be published towards the end of 2027. Only prototype test data are available so far;
  the distribution channel (dataset names) and the date ERA6 replaces ERA5T have not been announced.

period:
  start: "1950"
  end: present
  note: >-
    ECMWF aims to extend ERA6 back to at least 1950 and up to the present (Copernicus says "over 75 years"; the C3S General Assembly talk says "75 (likely 80) years").
    Ten-year streams are run in parallel, each with a one-year spin-up. According to the August 2026 ECMWF Newsletter, the 2007 and 2017 streams are running and the
    1987 and 1997 streams are due to start next. As checked on 2026-10-12, no ERA6 data have been released (apart from prototype test data).

resolution:
  spatial_short: "14 km (0.13°)"
  temporal_short: "1시간"
  spatial: >-
    Atmosphere, land and ocean waves at TCo799 (about 14 km) / coupled NEMO ocean at 0.25° /
    uncertainty ensemble (EDA) of 10 members plus a control at 28 km. Grids for public distribution (e.g. on the CDS) have not been announced
  vertical: "137 atmospheric levels (top at 1 Pa), plus 11 height levels from 15 to 500 m above the surface / 75 ocean levels"
  temporal: Hourly (daily data and precalculated monthly statistics also planned)

coverage:
  short: 전지구
update: >-
  Not yet released. Once enough data are published, ERA6 will replace ERA5T (the timely updates); the ERA6T latency is still to be confirmed (TBC).
license: To be announced at release (ERA5, the current C3S reanalysis, is CC BY 4.0)
account_required: true

summary: >-
  The successor to ERA5, produced by ECMWF for the Copernicus Climate Change Service (C3S). Built on IFS Cycle 49r2, it raises the horizontal resolution to
  about 14 km (ERA5: about 31 km) and is the first ECMWF flagship reanalysis to include an ocean model, coupling NEMO-4 with the SI3 sea-ice model
  (ocean starting conditions from ORAS6). Rescued and reprocessed historical observations and a better representation of the upper stratosphere
  aim to address known ERA5 issues. All data will be provided in GRIB2 with WMO units.

variables:
  note: >-
    The variable list is not final before release. New outputs announced by ECMWF include 3D and 2D ocean parameters, 11 height levels from 15 to 500 m,
    multi-layer snow, 3D clear-air turbulence, new surface parameters such as 2 m relative humidity, and hourly data together with daily data and monthly statistics.
    Variable names and units will be added at release.
  groups: []

access:
  - name: Copernicus announcement — ERA6 reanalysis production starts (release schedule and distribution plans)
    url: https://climate.copernicus.eu/copernicus-climates-era6-reanalysis-production-starts
    method: Information page
    note: >-
      The distribution channel and dataset names for released data have not been announced. Copernicus mentions fast retrieval of time series and profiles
      through Polytope and ARCO-ready versions. This entry will be updated at release.
  - name: ECMWF — ERA6 prototype 1 sample data for testing only (June to August 2022)
    url: https://www.ecmwf.int/en/forecasts/datasets/era6-prototype-1-sample-data-testing-only-june-august-2022
    method: IFS Experiments portal / MARS-style requests (GRIB or NetCDF)
    note: >-
      A prototype experiment, not an ERA6 production; ECMWF states it "should not be used for any application or publication".
      Use it to test workflows (e.g. the move to GRIB2) and to send feedback. DOI 10.21957/gmf0-rw02
  - name: ECMWF — ERA6 prototype test sample dataset 2 (October 2019 to September 2020)
    url: https://www.ecmwf.int/en/forecasts/datasets/era6-prototype-test-sample-dataset-2-oct-2019-sept-2020
    method: IFS Experiments portal / MARS-style requests (GRIB or NetCDF)
    note: Also for testing only (known missing components). DOI 10.21957/1qyd-ep25

example:
  lang: text
  note: >-
    The MARS-style request shown on the ECMWF prototype 1 page (hourly 2 m temperature analyses, 0.25° NetCDF), copied as given.
    The page does not say which tool or account to submit it with. This is test data; do not use it for research or publication.
  code: |
    retrieve,
    class=rd,
    stream=lwda,
    expver=ibpb,
    type=an,
    levtype=sfc,
    param=2t,
    date=2022-08-01,
    time=00/TO/23/BY/1,
    grid=0.25/0.25,format=netcdf,
    target='output2.nc'

tips:
  - The first release covers 2007 onward only. For long-term work back to 1940, stay with ERA5 for now, and do not splice ERA5 and ERA6 into one time series.
  - All data move to GRIB2 (WMO units). Test GRIB1-only tools and scripts that assume ERA5 parameter names and units on the prototype data ahead of time.
  - The date ERA6 replaces ERA5T and the ERA6T latency are not yet set. If your workflow pulls ERA5 up to the present, watch for the transition plan ECMWF has promised.
  - The ocean is a coupled model started from ORAS6 initial conditions; ERA6 does not assimilate ocean observations directly. Keep the differences from the ocean reanalysis (ORAS6) in mind when using ocean variables.

