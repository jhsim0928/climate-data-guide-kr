# ─────────────────────────────────────────────────────────────
# Copernicus-GlobColour global ocean colour (Copernicus Marine OCEANCOLOUR_GLO_BGC_*_009_101 to 104) — dataset information file (English edition)
# Satellite tab (ocean colour), cross-listed in the Ocean tab (satellite observations). ACRI-ST produces multi-sensor chlorophyll, reflectance, transparency, primary production and more as 4 km (OLCI 300 m) L3 daily, L4 monthly and gap-free daily data.
# When checked on 2026-10-13, MY L3 ran to 2026-10-05 and NRT L3 multi-sensor chlorophyll to 2026-10-11. A new dataset version (202611) is scheduled for 2026-11-24.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: globcolour
name: Copernicus-GlobColour
full_name: >-
  Global Ocean Colour (Copernicus-GlobColour), Bio-Geo-Chemical, L3 (daily) / L4 (monthly and interpolated) from Satellite Observations
  (Copernicus Marine; MY OCEANCOLOUR_GLO_BGC_L3_MY_009_103 and L4_MY_009_104, NRT L3_NRT_009_101 and L4_NRT_009_102)
category: satellite
domain: satellite
group: 해색
order: 50
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 원격탐사]
provider: Copernicus Marine Service (Ocean Colour TAC, produced by ACRI-ST with the Copernicus-GlobColour processor)

status: active
status_note: >-
  Both the multi-year (MY) and near-real-time (NRT) products are updated daily. When checked on 2026-10-13, MY L3 daily data ran to 2026-10-05, NRT L3 multi-sensor chlorophyll to 2026-10-11, MY L4 monthly data to 2026-09 and MY L4 gap-free daily data to 2026-09-07.
  In March 2026 a new version (202603) dropped MODIS from the multi-sensor data (from early 2023) and added VIIRS-NOAA21; a further version (202611) with updated OC5 coefficients and new carbon (POC, DOC) datasets is scheduled for November 2026.

period:
  start: "1997-09"
  end: present
  note: >-
    MY multi-sensor data start on 1997-09-04 (L4 monthly in 1997-09) and OLCI-only data on 2016-04-25. NRT holds only the recent period (when checked on 2026-10-13, the NRT L3 collection started 2023-04-25 and the 202411 multi-sensor chlorophyll dataset 2024-09-30).
    Some days are missing in the SeaWiFS-only period (1997–2002), and phytoplankton functional types (PFT) are not available before 2002.

resolution:
  spatial_short: "4 km (0.04°)"
  temporal_short: "1일"
  spatial: >-
    4 km products use a plate carrée latitude–longitude grid of 4320 × 8640 with 0.0416667° spacing (cell centres 89.979°S–89.979°N, 179.979°W–179.979°E).
    OLCI 300 m products use 32400 × 64800 with 0.0055556° spacing. The PUM explains that "4 km" is the approximate pixel size at the equator and that east–west spacing shrinks toward the poles
  vertical: Satellite ocean-surface observation (remote-sensing reflectance and surface properties derived from it; primary production is water-column integrated)
  temporal: >-
    L3 daily (daily composite merging all satellite passes) / L4 monthly mean / L4 gap-free daily (chlorophyll and transparency, space–time interpolation). Primary production (PP) is available as L4 monthly only

coverage:
  short: 전지구
  note: "Ocean only. L3 has no values under cloud, sea ice, at night or at low sun elevation (high-latitude winter); only the L4 gap-free daily data are interpolated"
update: >-
  MY L3 and NRT are updated daily at 22:00 (UTC) (first NRT version about 24 hours after acquisition); MY L4 monthly data are updated monthly. The PUM states that MY extensions (MYINT) are produced within 31 days of sensing,
  and the QUID says the MY archive runs to about 8 days before present; when checked on 2026-10-13, the latest MY L3 day was 2026-10-05
license: Free use under the Copernicus Marine Service Commitments and Licence. Acknowledgement and citation of the product DOI are required
account_required: true

summary: >-
  Global ocean-colour biogeochemical data produced by the Copernicus Marine Ocean Colour TAC with ACRI-ST's Copernicus-GlobColour processor. There are 4 km multi-sensor products merging SeaWiFS, MODIS, MERIS,
  VIIRS (SNPP, NOAA-20, NOAA-21) and OLCI (S3A, S3B), and OLCI-only 4 km and 300 m products, covering chlorophyll-a, phytoplankton functional types and size classes, remote-sensing reflectance, Kd(490),
  transparency (Secchi depth), suspended matter, backscattering, coloured dissolved organic matter and primary production. Chlorophyll is computed per sensor and then merged, unlike OC-CCI, which merges reflectance first.
  Separate near-real-time (NRT, available the day after observation) and multi-year (MY, from 1997) products are provided.

time_convention:
  summary: >-
    L3 daily values are averages within a daily composite that merges all satellite passes of the day; L4 monthly values are temporal averages over the month. L4 gap-free daily data fill cloudy cells by space–time interpolation.
    Monthly time values are the first day of the month at 00:00 UTC (e.g. 1997-09-01, … 2026-09-01), while the averaging period is the whole month.
  points:
    - "One daily composite covers about 24 hours of observations. The QUID notes that areas crossing the date line (180°) need products from two days."
    - "NRT is first produced with climatological ancillary data (orbit, meteorology) and may be of somewhat lower quality; it is later reprocessed. MY extensions (MYINT) are replaced by MY only at a full reprocessing."
    - "Primary production PP is in mg m-2 day-1, a monthly mean daily rate. Multiply by the number of days for a monthly total."
    - "In the gap-free daily data, the flags variable is 1 for land (LAND) and 2 for interpolated cells (INTERPOLATED). Exclude cells with 2 to keep only observation-based values."
    - "The *_uncertainty variables are uncertainty estimates for the value in the same cell, in %."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-OC-PUM.pdf
  source_name: Copernicus Marine OC PUM (Issue 7.0) + QUID 009-101to104 (Issue 7.0) + STAC metadata

variables:
  note: >-
    Variable names and units follow the Copernicus Marine dataset metadata (STAC, versions 202603 and 202411). The multi-sensor 4 km datasets are split into five groups: plankton (chlorophyll and PFT), reflectance,
    optics (BBP, CDM), transp (KD490, SPM, ZSD) and pp (primary production). OLCI-only datasets have more reflectance bands (400–709 nm, per the product description).
  full_list: https://data.marine.copernicus.eu/product/OCEANCOLOUR_GLO_BGC_L3_MY_009_103/description
  groups:
    - name: Chlorophyll and phytoplankton (plankton, L3 daily / L4 monthly)
      kind: mean
      period: Daily (L3) or monthly (L4)
      items:
        - text: "Chlorophyll-a concentration — `CHL` (mg m-3)"
          note: CI (Hu et al.) in oligotrophic waters, OC5 in mesotrophic and coastal waters, blended between 0.15 and 0.2 mg m-3
        - text: "Chlorophyll uncertainty — `CHL_uncertainty` (%)"
          std: []
        - text: "Phytoplankton functional type chlorophyll — `DIATO` (diatoms), `DINO` (dinophytes), `GREEN` (green algae), `HAPTO` (haptophytes), `PROCHLO` (Prochlorococcus), `PROKAR` (prokaryotes) (mg m-3)"
          note: Each has a *_uncertainty variable (%). Not available before 2002
        - text: "Phytoplankton size class chlorophyll — `MICRO`, `NANO`, `PICO` (mg m-3)"
        - text: "Chlorophyll horizontal gradient — `CHL_gradient` (mg m-3 km-1)"
          note: In the OLCI datasets; to be extended to the multi-sensor L3 daily data from November 2026
          std: []
        - text: "Flags — `flags`"
          kind: static
          note: "1 land (LAND). The gap-free daily data add 2 interpolated (INTERPOLATED)"
          std: []
    - name: Remote-sensing reflectance (reflectance, multi-sensor 4 km)
      kind: mean
      period: Daily (L3) or monthly (L4)
      items:
        - "Fully normalised remote-sensing reflectance — `RRS412`, `RRS443`, `RRS490`, `RRS555`, `RRS670` (sr-1)"
        - text: "Reflectance uncertainty — `RRS412_uncertainty` etc. (%)"
          std: []
    - name: Optics and transparency (optics, transp)
      kind: mean
      period: Daily (L3) or monthly (L4)
      items:
        - "Diffuse attenuation coefficient at 490 nm — `KD490` (m-1)"
        - "Secchi disk depth — `ZSD` (m)"
        - "Inorganic suspended particulate matter — `SPM` (g m-3)"
        - "Particulate backscattering coefficient at 443 nm — `BBP` (m-1)"
        - "Coloured dissolved and detrital organic materials absorption — `CDM` (m-1)"
        - text: "Uncertainty of each variable — `KD490_uncertainty`, `ZSD_uncertainty`, `SPM_uncertainty`, `BBP_uncertainty`, `CDM_uncertainty` (%)"
          std: []
    - name: Primary production (pp, L4 monthly only)
      kind: mean
      period: Monthly
      items:
        - text: "Primary productivity — `PP` (mg m-2 day-1)"
          note: Antoine & Morel model using merged chlorophyll, PAR, Kd(PAR), OSTIA SST and GLORYS12V1 mixed layer depth
        - text: "Primary productivity uncertainty — `PP_uncertainty` (%)"
          std: []
    - name: Gap-free daily data (L4 gap-free, multi-sensor 4 km)
      kind: mean
      period: Daily
      items:
        - text: "Interpolated chlorophyll-a — `CHL` (mg m-3)"
          note: Cloudy cells filled by space–time interpolation; flags=2 marks interpolated cells
        - text: "Interpolated chlorophyll uncertainty — `CHL_uncertainty` (%)"
          std: []
        - text: "Interpolated transparency data — transp gap-free dataset (KD490, ZSD, etc.)"
          note: Gap-free KD and ZSD provided since 2019 and 2020 (QUID)

