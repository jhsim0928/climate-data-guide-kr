example:
  lang: python
  note: >-
    Downloads MY L4 monthly chlorophyll for the seas around Korea with the Copernicus Marine Toolbox. Run copernicusmarine.login() once to store your credentials.
    Around a dataset version change (e.g. 2026-11), you can pin dataset_version to keep results reproducible.
  code: |
    # pip install copernicusmarine xarray
    import copernicusmarine
    import xarray as xr

    copernicusmarine.login()   # once only (stores username and password)
    copernicusmarine.subset(
        dataset_id="cmems_obs-oc_glo_bgc-plankton_my_l4-multi-4km_P1M",
        variables=["CHL", "CHL_uncertainty"],
        minimum_longitude=120, maximum_longitude=132,
        minimum_latitude=30, maximum_latitude=40,
        start_datetime="2024-01-01", end_datetime="2024-12-31",
        output_filename="globcolour_chl_korea_2024.nc",
    )
    ds = xr.open_dataset("globcolour_chl_korea_2024.nc")
    print(ds["CHL"].mean(["latitude", "longitude"]).values)

tips:
  - "The PUM notes that GlobColour MY may contain time-series inconsistencies from upstream sensor recalibrations and processing changes, while OC-CCI, designed for inter-sensor consistency, does not extend to the present. Consider OC-CCI for long-term trends and GlobColour for recent and near-real-time monitoring."
  - "In the multi-sensor data, MODIS was dropped from early 2023 and VIIRS-NOAA21 added from November 2022 (version 202603). Coverage and values may shift around these dates."
  - "The QUID states that reprocessing can change values by more than 20% in some regions. Record the dataset ID and version (from the file and your download date) in papers, and do not mix versions."
  - "In turbid waters such as the coastal Yellow Sea and East China Sea, OC5 applies an adaptation for complex waters, but suspended matter (SPM) and CDM may dominate the optics more than chlorophyll. Check SPM, CDM and the uncertainties together."
  - "Gap-free daily data are interpolated. Cells with flags equal to 2 (INTERPOLATED) are not actual observations, so for short-lived events such as harmful algal blooms use L3 daily data or values filtered by flags."
  - "The 300 m OLCI products help in coastal work but start only on 2016-04-25, and their algorithms and sensors differ from the multi-sensor 4 km data, so do not mix them."
  - "Primary production PP relies on model and analysis inputs such as GLORYS12V1 mixed layer depth and OSTIA SST; the QUID notes that in situ validation is limited (r² about 0.63)."
  - "Version 202611 is due on 2026-11-24, when some 202603 datasets are scheduled to retire (STAC metadata). The double-dissemination period is announced as 2026-11-03 to 2027-01-12, so check your scripts before then."

