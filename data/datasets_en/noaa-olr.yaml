notices:
  - date: "2026-05-07"
    level: info
    title: PSL OMI (MJO index) updated — now uses NOAA daily blended OLR
    body: >-
      PSL announced that its OLR-based MJO index (OMI) has been updated to near present and now uses the NOAA daily blended OLR as input.
      Interpolated OLR has no data after 2022, so take the change of input into account when continuing OMI from earlier values.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-08-26"
    level: warning
    title: Daily OLR CDR v2.0 and monthly v3.0 released; daily v1.2 superseded
    body: >-
      NCEI released Version 2.0 of the daily OLR CDR and Version 3.0 of the monthly OLR CDR, both combining HIRS, IASI and CrIS. Daily v1.2 stops at 2025-08-22 and is now flagged as superseded;
      NCEI recommends the new version except for purposes such as reproducing earlier studies.
    source: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C00875

