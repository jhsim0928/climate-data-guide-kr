    url: https://www.ncei.noaa.gov/products/climate-data-records/outgoing-longwave-radiation-daily
    method: Web / AWS S3 explorer (netCDF-4, one file per year)
    note: The download link leads to the NOAA CDR archive (https://archive.data.noaa.gov/climatedatarecords#UMD_ESSIC/OLR_CDR/Daily/OLR-D-CDR_01B-21/).
  - name: NCEI — OLR Monthly CDR product page
    url: https://www.ncei.noaa.gov/products/climate-data-records/outgoing-longwave-radiation-monthly
    method: Web / AWS S3 explorer (netCDF-4, whole record in one file)
  - name: NOAA PSL download server — OLR CDR copy (olr_cdr_day) and Interpolated OLR (interp_OLR)
    url: https://downloads.psl.noaa.gov/Datasets/olr_cdr_day/
    method: Direct HTTPS download / THREDDS and OPeNDAP
    note: >-
      Provides olr.day.mean.v2.nc (daily, about 3.6 GB), olr.mon.mean.v2.nc (monthly) and 1991–2020 climatologies as single files. Interpolated OLR is at
      https://downloads.psl.noaa.gov/Datasets/interp_OLR/ . No account is needed.

example:
  lang: python
  note: "Opens directly through PSL OPeNDAP with no account. Interpolated OLR ends in 2022; for later dates download the OLR CDR copy from the olr_cdr_day folder and open it the same way (check its variable names)."
  code: |
    # pip install xarray netCDF4
    import xarray as xr

    url = "https://psl.noaa.gov/thredds/dodsC/Datasets/interp_OLR/olr.day.mean.nc"
    ds = xr.open_dataset(url)
    olr = ds["olr"].sel(time=slice("2015-01-01", "2016-12-31"))
    trop = olr.where(abs(olr["lat"]) <= 15, drop=True)  # 15°S–15°N regardless of latitude order
    # tropical-mean OLR time series (W/m^2)
    print(trop.mean(("lat", "lon")).to_series().head())

tips:
  - Daily OLR CDR v1.2 and v2.0, and PSL Interpolated OLR and the OLR CDR, are different datasets. Do not splice them into one series; pick one and use it throughout.
  - "The most recent part of the daily OLR CDR is preliminary (file names contain -preliminary). Download again once the final version appears and re-check your results."
  - "The OLR CDR has no quality flags. Daily v2.0 has 30 missing days (mostly in the NOAA-6 and NOAA-9 single-satellite periods), and the guide notes an unexpectedly large CrIS inter-satellite adjustment of about 1.4 W m-2."
  - "Known HIRS issues listed in the guides — a one-step scan offset on NOAA-15 and -16, wrong zenith angles on NOAA-14 after March 1999, and incomplete geostationary coverage before late 1998. Take care with local analyses in those periods."
  - "The PSL and NCEI files differ in grid (2.5° 144×73, 1° 360×180, 2.5° 144×72) and may differ in latitude ordering. Check the order before slicing with `sel(lat=slice(...))`."
  - Convective indices (for example the MJO OMI and RMM) change with the OLR dataset used. State the OLR dataset and version in publications.
  - For the absolute energy budget use broadband radiometer data such as CERES EBAF or SYN1deg. The OLR CDR is estimated from narrowband and hyperspectral radiances, with an accuracy of about 2 W m-2 relative to CERES.

