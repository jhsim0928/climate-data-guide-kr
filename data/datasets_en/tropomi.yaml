notices:
  - date: "2026-10-21"
    level: info
    title: Copernicus Sentinel-5P OFFL HCHO and SO2 v2.8.0 products reprocessed — now available on CDSE (22 November–2 December 2025, orbits 42023–42173)
    body: >-
      The affected OFFL products, mainly Formaldehyde (HCHO) v2.8.0 and to a lesser extent Sulphur Dioxide (SO2) v2.8.0, have been successfully reprocessed
      for the period 22 November to 2 December 2025 (orbits 42023–42173) and are available for download from the Copernicus Data Space Ecosystem.
    source: https://dataspace.copernicus.eu/news/2026-10-21-copernicus-sentinel-5p-offl-hcho-and-so2-v280-products-reprocessed-now-available
  - date: "2026-10-13"
    level: warning
    title: Processor upgrade on 2026-11-10 — L1B 3.1.0, NL-L2 3.0.0, UPAS 3.0.1
    body: >-
      ESA announced that the operational processors will be upgraded on 10 November 2026: NL-L2 (NO2, CO, CH4, AER_AI, AER_LH, O3_PR) to 3.0.0,
      UPAS (HCHO, SO2, CLOUD, O3, O3_TCL) to 3.0.1 and L1B to 3.1.0. NO2 switches to a new air mass factor look-up table and gains variables
      (files about 5% larger); the CH4 and AER_LH cloud masks, the AER_AI degradation correction and the O3_PR, CLOUD and O3_TCL algorithms also change.
      The NL-L2 DOI is updated for the new version, and no NRT products will be generated for data acquired during the switchover.
      No reprocessing is mentioned, so check the processor version before combining data from before and after the change.
    source: https://dataspace.copernicus.eu/news/2026-10-13-copernicus-sentinel-5-precursor-s5p-products-improvement
  - date: "2026-10-07"
    level: info
    title: Orbit control manoeuvre — possible data degradation on 7 October 2026
    body: >-
      A planned Sentinel-5P orbit control manoeuvre on 7 October could leave data missing or degraded for a time. The impact is documented on the SentiBoard event page for October 2026.
    source: https://dataspace.copernicus.eu/news/2026-10-7-copernicus-sentinel-5p-data-unavailability-07-october-2026
  - date: "2025-12-22"
    level: warning
    title: HCHO and SO2 2.8.0 striping fixed — affected OFFL period to be reprocessed
    body: >-
      Right after the processor switch, HCHO 2.8.0 data (and SO2 to a lesser extent) showed marked stripes, which have now been fixed. Affected periods are NRTI 2025-11-26 to 12-06
      (orbits 42080–42230) and OFFL 2025-11-22 to 12-02 (orbits 42023–42173); the OFFL data will be reprocessed.
    source: https://dataspace.copernicus.eu/news/2025-12-22-copernicus-sentinel-5-precursor-s5p-issue-hcho-and-so2-v280-products-solved
  - date: "2025-11-27"
    level: warning
    title: Processor switch — L1B 3.0.0, NL-L2 2.9.1, UPAS 2.8.0 (from OFFL 2025-11-22)
    body: >-
      The L1B (improved stray-light and background corrections) and L2 processors changed. NO2, CO, CH4, aerosol index, aerosol layer height and ozone profile moved to 2.9.1,
      and HCHO, SO2, cloud, total ozone and tropospheric ozone to 2.8.0, starting with OFFL orbit 42023 (2025-11-22) and NRTI orbit 42080 (2025-11-26). The NO2 configuration now excludes
      the Fraunhofer line near 430 nm, and a new CH4 NRTI service started.
    source: https://dataspace.copernicus.eu/news/2025-11-27-copernicus-sentinel-5-precursor-s5p-products-improvement-operational-switch
  - date: "2022-07-17"
    level: info
    title: Processor 2.4.0 goes operational with the first full-mission reprocessing (RPRO)
    body: >-
      Version 2.4.0 became operational from OFFL orbit 24655 (2022-07-17), and RPRO data reprocessed with the same version from mission start (2018-04-30) to July 2022 have been available since early 2023.
      The official advice is to use RPRO where it exists and the latest OFFL afterwards.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/S5P/S5P-MPC-KNMI-PRF-NO2-Sentinel-5P-Nitrogen-Dioxide-Level-2-Product-Readme-File-2025-2.8.pdf
  - date: "2019-08-06"
    level: info
    title: Along-track pixel size reduced from 7 km to 5.5 km
    body: >-
      From orbit 9388, the along-track resolution of all measurements changed from 7.0 km to 5.5 km. Nadir pixels are now 5.5 × 3.5 km (5.5 × 7 km for CO and CH4).
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/S5P/S5P-MPC-KNMI-PRF-NO2-Sentinel-5P-Nitrogen-Dioxide-Level-2-Product-Readme-File-2025-2.8.pdf

