      text: >-
        Diez-Sierra, J., Iturbide, M., Gutiérrez, J. M., Fernández, J., Milovac, J., Cofiño, A. S., Cimadevilla, E., Nikulin, G., Levavasseur, G.,
        Kjellström, E., et al. (2022): The Worldwide C3S CORDEX Grand Ensemble: A Major Contribution to Assess Regional Climate Change in the IPCC AR6 Atlas.
        Bulletin of the American Meteorological Society, 103(12), E2804–E2826.
      doi: 10.1175/BAMS-D-22-0111.1
      bibtex: |
