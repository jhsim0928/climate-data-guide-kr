    Program for Climate Model Diagnosis and Intercomparison, the European Network for Earth System Modelling and other partners in the Global Organisation
    for Earth System Science Portals (GO-ESSP)." Replace Table XX with your model table number.

notices:
  - date: "2026-07"
    level: info
    title: Copernicus CDS CORDEX data now support spatial and temporal sub-selection
    body: >-
      According to the update log on the CDS dataset page, spatial and temporal sub-selection are now available. The adaptor now uses a WPS-based process,
      so requests use year and month widgets instead of start and end keys. Check the request keys in older API scripts.
    source: https://cds.climate.copernicus.eu/datasets/projections-cordex-domains-single-levels?tab=documentation
  - date: "2025-05-16"
    level: critical
    title: ESGF data loss at DKRZ — about 20,000 CORDEX-CMIP5 datasets affected
    body: >-
      A major data loss at DKRZ in early 2025 affected CORDEX-CMIP5 availability on ESGF. Many datasets were stored only at that node without replicas, so
      the loss is largely unrecoverable; about 20,000 datasets (over 200 TB) across multiple domains, variables and frequencies are still affected. The full
      list is in Missing_CORDEX_Data.txt on GitHub, and some of the most commonly used variables remain accessible via the Copernicus CDS.
    source: https://cordex.org/2025/05/16/esgf-data-loss-impacting-the-availablility-of-cordex-cmip5-data/

transitions:
  - from: CORDEX-CMIP5
    to: CORDEX-CMIP6
    to_id: cordex-cmip6
    status: planned
    summary: >-
      The next generation, with driving GCMs moving from CMIP5 to CMIP6 and scenarios from RCPs to SSPs. As of 2026-10-16 some domains (Europe, North
      America, etc.) are on ESGF but East Asia (EAS) is not yet published, so Korean Peninsula studies will rely on both generations for a while.
    changes:
      - aspect: Driving global models
        before: CMIP5 GCMs (e.g. for East Asia HadGEM2-ES, MPI-ESM-LR, MPI-ESM-MR, NorESM1-M, CNRM-CM5, EC-EARTH)
        after: CMIP6 GCMs (EAS-12 EC-Earth3-Veg, MPI-ESM1-2-HR, NorESM2-MM; EAS-25 UKESM1-0-LL)
      - aspect: Future scenarios
        before: RCP2.6, 4.5, 8.5, 2006–2100
        after: SSP1-2.6 and 3-7.0 first, SSP2-4.5 and 5-8.5 recommended, 2015–2100
      - aspect: Historical period
        before: 1950–2005
        after: 1950–2014 (at least 1960–2014)
      - aspect: Evaluation (reanalysis-driven) runs
        before: ERA-Interim, 1989–2008 advised
        after: ERA5, 1979–2020 or longer
      - aspect: Domain names and resolution
        before: EAS-44, EAS-22, EAS-11 (grid spacing in degrees), 0.44° default for most domains
        after: EAS-50, EAS-25, EAS-12 (nearest km, same grid definitions), primary target grid spacings 25 km and 12.5 km
      - aspect: Output frequencies
        before: 3-hourly, 6-hourly, daily, monthly, seasonal (sem), fixed
        after: 1-hourly, 3-hourly, 6-hourly, daily, monthly, fixed (hourly recommended for CORE variables, no seasonal files)
      - aspect: Archive specifications and DRS
        before: CORDEX Archive Specifications (v3.2, 2020), project_id CORDEX, RCM version v1 etc.
        after: CORDEX-CMIP6 archiving specifications (v1 2024 → v4 2026), project_id CORDEX-CMIP6, new version_realization element vN-rM
      - aspect: Time units
        before: days since 1949-12-01T00:00:00Z
        after: days since 1950-01-01 (1850-01-01 allowed before 1950)
      - aspect: Licence
        before: unrestricted / non-commercial (varies by simulation)
        after: CC BY 4.0 strongly recommended (all 54 registered models CC BY 4.0 on 2026-10-16)
      - aspect: Distribution
        before: Legacy ESGF index (affected by the DKRZ loss) + Copernicus CDS
        after: New ESGF STAC index (CORDEX-CMIP6 collection), some data on interim servers before publication
    impacts:
      - "Both driving GCMs and scenarios changed, so do not pool CORDEX-CMIP5 and CORDEX-CMIP6 results into one ensemble or splice them into one series. RCP and SSP scenarios do not map one to one."
      - "Domain names changed (EAS-44 → EAS-50, EAS-22 → EAS-25), so update the domain values in searches and scripts. The grid definitions are the same."
      - "As of 2026-10-16 CORDEX-CMIP6 EAS-25 has only one driving GCM (UKESM1-0-LL), so its range of inter-GCM uncertainty can differ from the CORDEX-CMIP5 East Asia ensemble."
      - "The search project name changed from CORDEX to CORDEX-CMIP6, and experiments are searched with driving_experiment_id (historical, ssp126, etc.)."
    sources:
      - name: CORDEX Archive Specifications v3.2 (CORDEX-CMIP5)
        url: http://wcrp-cordex.github.io/cordex-cmip5/cordex_archive_specifications.pdf
      - name: CORDEX-CMIP6 Archiving Specifications for Dynamical Downscaling
        url: https://wcrp-cordex.github.io/archive-specifications/CORDEX-CMIP6_archiving_specifications_DD/
      - name: CORDEX experiment design for dynamical downscaling of CMIP6 (18 May 2021)
        url: https://cordex.org/wp-content/uploads/2021/05/CORDEX-CMIP6_exp_design_RCM.pdf
      - name: CORDEX domain tables (WCRP-CORDEX/domain-tables)
        url: https://github.com/WCRP-CORDEX/domain-tables
      - name: CORDEX-CMIP6 simulation status by domain
        url: https://wcrp-cordex.github.io/simulation-status/CORDEX_CMIP6_status.html
      - name: CORDEX-CMIP6 Terms of Use
        url: https://cordex.org/data-access/cordex-cmip6-data/cordex-cmip6-terms-of-use/

