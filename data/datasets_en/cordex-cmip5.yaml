# ─────────────────────────────────────────────────────────────
# CORDEX-CMIP5 — dataset information file (English edition)
# First-generation WCRP CORDEX: dynamical downscaling of CMIP5 GCMs with regional climate models (RCP scenarios)
# Checked 2026-10-16: no new simulations (superseded by CORDEX-CMIP6); part of the ESGF holdings lost at DKRZ in early 2025
# ─────────────────────────────────────────────────────────────
id: cordex-cmip5
name: CORDEX-CMIP5
full_name: Coordinated Regional Climate Downscaling Experiment driven by CMIP5
category: model_output
domain: model
group: 지역 다운스케일링
order: 20
domains: [대기, 육지, 극지]
provider: WCRP CORDEX (produced by regional modelling groups, distributed via ESGF and the Copernicus CDS)

status: ended
status_note: >-
  The first CORDEX generation, driven by CMIP5 GCMs under RCP scenarios; community work has moved on to the CMIP6-driven CORDEX-CMIP6. As checked on
  2026-10-16, a major data loss at the DKRZ ESGF node in early 2025 still affects about 20,000 datasets (over 200 TB), and some of the most commonly used
  variables remain accessible via the Copernicus CDS. The US ESGF index (ORNL Globus index) returns no CORDEX project datasets.
successor:
  name: CORDEX-CMIP6
  url: https://wcrp-cordex.github.io/simulation-status/
  note: The next generation, driven by CMIP6 GCMs under SSP scenarios. As of 2026-10-16 only some domains (Europe, North America, etc.) are on ESGF; East Asia (EAS) is not yet published.

period:
  start: "1950"
  end: "2100"
  note: >-
    The archive specifications give 1950–2005 for historical runs, 2006–2100 for RCP4.5 and RCP8.5, and 1989–2008 as the advised period for
    ERA-Interim-driven evaluation runs. The Copernicus CDS holdings span up to 1979–2019 for evaluation, 1948–2010 for historical and 2006–2101 for RCP
    experiments depending on the simulation, and also include RCP2.6.

resolution:
  spatial_short: "모델마다 다름"
  temporal_short: "3시간"
  spatial: >-
    CORDEX rotated-pole grids per domain — Table 1 of the archive specifications defines 16 grids: 13 domains at 0.44° (e.g. EAS-44), MNA-22 and SEA-22
    at 0.22°, and EUR-11 at 0.11°; further 0.22° domains such as EAS-22 were used later (CORDEX domain tables). Core variables must also be provided on regular latitude-longitude i-grids (e.g. EAS-44i at 0.5°, with grid point boundaries at
    whole-number degrees). East Asia data on the Copernicus CDS are at 0.22° and 0.44°.
  vertical: Surface and single-level variables + selected pressure-level variables (200, 500, 850 hPa, etc.)
  temporal: 3-hourly, 6-hourly, daily, monthly, seasonal (sem) + invariant fields (fx)

coverage:
  short: 대륙별 영역
  note: >-
    CORDEX regional domains (South America, Central America, North America, Europe, Africa, South Asia, East Asia, Central Asia, Australasia, Antarctica,
    Arctic, Mediterranean, Middle East and North Africa, South-East Asia). The Korean Peninsula lies in the East Asia domain (EAS, CORDEX Region 7):
    EAS-44 is a 203×167 grid with the rotated north pole at longitude -64.78°, latitude 77.61°, and EAS-44i is a 0.5° regular 227×157 grid (cell
    positions 62.75°–175.75°E, 18.75°S–59.25°N).
update: Ended (no new simulations; the CDS copy is described as updated quarterly, with only the latest version provided)
license: >-
  The CORDEX-CMIP5 terms of use (2 May 2013) split data into "unrestricted" (commercial use allowed) and "non-commercial" (non-commercial research and
  educational purposes only); which applies to each simulation is given in the CORDEX RCM list. On the Copernicus CDS the data are under the "CORDEX
  licence" and can be used for commercial purposes except simulations from BOUN-RegCM4-3 (Central Asia and MENA) and RU-CORE-RegCM4-3 (South-East Asia).
  Publications need an acknowledgement and a table of the models used.
account_required: true

summary: >-
  CORDEX-CMIP5 is the first generation of continental-scale regional climate simulations from the WCRP Coordinated Regional Climate Downscaling
  Experiment (CORDEX), in which multiple regional climate models (RCMs) are driven by CMIP5 global climate models (GCMs) and by the ERA-Interim reanalysis.
  Most domains use a 0.44° (about 50 km) grid and cover historical (1950–2005) and RCP2.6, 4.5 and 8.5 scenario (2006–2100) periods. It underlies the
  C3S CORDEX ensemble used for the regional assessment in the IPCC AR6 Atlas; its successor is the CMIP6-driven CORDEX-CMIP6.

time_convention:
  summary: >-
    Averages, maxima and minima use the midpoint of the time interval as the time value, with time_bnds giving the interval. Instantaneous 3-hourly and
    6-hourly variables are on the hour (every 3 or 6 hours from 0Z).
  points:
    - "6-hourly instantaneous values are at 0, 6, 12 and 18Z and 6-hourly averages at 3, 9, 15 and 21Z; 3-hourly instantaneous values are every 3 hours from 0Z and 3-hourly averages at 1.5Z, 4.5Z, and so on."
    - "Even for tas, 3-hourly data are instantaneous (point) while daily, monthly and seasonal data are means. Monthly and seasonal tasmax/tasmin are means of daily maxima (minima)."
    - "Time units are 'days since 1949-12-01T00:00:00Z' (or an equivalent format), and the calendar follows the driving data (proleptic Gregorian or standard Gregorian for evaluation runs). GCM-driven runs may use 365-day or 360-day calendars."
    - "Reanalysis-driven runs use experiment_id 'evaluation', not 'historical'."
  source: http://wcrp-cordex.github.io/cordex-cmip5/cordex_archive_specifications.pdf
  source_name: CORDEX Archive Specifications v3.2 (5 May 2020) + CORDEX variables requirement table v3.1 (21 Feb 2014)

variables:
  note: >-
    Core variables from the CORDEX variables requirement table (v3.1, 21 Feb 2014). Names are as in the files and units as in the table. No 1-hourly
    output is specified. On the Copernicus CDS the same variables are selected by CDS names such as '2m_air_temperature'.
  full_list: http://wcrp-cordex.github.io/cordex-cmip5/CORDEX_variables_requirement_table.pdf
  groups:
    - name: Daily (day)
      kind: mean
      period: Daily
      items:
        - "Near-surface air temperature — `tas` (K)"
        - text: "Daily maximum near-surface air temperature — `tasmax` (K)"
          kind: max
        - text: "Daily minimum near-surface air temperature — `tasmin` (K)"
          kind: min
        - "Precipitation — `pr` (kg m-2 s-1)"
        - "Near-surface specific humidity — `huss` (1)"
        - "Near-surface relative humidity — `hurs` (%)"
        - "Sea level pressure — `psl` (Pa)"
        - "Near-surface wind speed — `sfcWind` (m s-1)"
        - "Eastward near-surface wind — `uas` (m s-1)"
        - "Northward near-surface wind — `vas` (m s-1)"
        - "Surface downwelling shortwave radiation — `rsds` (W m-2)"
        - "Surface downwelling longwave radiation — `rlds` (W m-2)"
        - "Evaporation — `evspsbl` (kg m-2 s-1)"
        - text: "Total runoff — `mrro` (kg m-2 s-1)"
          note: Mean over land
    - name: Monthly (mon)
      kind: mean
      period: Monthly
      items:
        - "Near-surface air temperature — `tas` (K)"
        - text: "Daily maximum near-surface air temperature, monthly mean — `tasmax` (K)"
          note: Mean of daily maxima
        - text: "Daily minimum near-surface air temperature, monthly mean — `tasmin` (K)"
          note: Mean of daily minima
        - "Precipitation — `pr` (kg m-2 s-1)"
        - "Sea level pressure — `psl` (Pa)"
        - "Total cloud fraction — `clt` (%)"
    - name: 3-hourly (3hr)
      kind: instant
      period: 3-hourly
      items:
        - "Near-surface air temperature — `tas` (K)"
        - text: "Precipitation — `pr` (kg m-2 s-1)"
          kind: mean
        - "Near-surface specific humidity — `huss` (1)"
        - "Sea level pressure — `psl` (Pa)"
        - "Near-surface wind speed — `sfcWind` (m s-1)"
        - text: "Surface downwelling shortwave radiation — `rsds` (W m-2)"
          kind: mean
    - name: 6-hourly (6hr)
      kind: instant
      period: 6-hourly
      items:
        - "Eastward near-surface wind — `uas` (m s-1)"
        - "Northward near-surface wind — `vas` (m s-1)"
        - "Geopotential height at 500 hPa — `zg500` (m)"
        - "Eastward wind at 850 hPa — `ua850` (m s-1)"
    - name: Invariant fields (fx)
      kind: static
      items:
        - "Surface altitude — `orog` (m)"
        - "Land area fraction — `sftlf` (%)"

access:
  - name: Copernicus CDS — CORDEX regional climate model data on single levels
    url: https://cds.climate.copernicus.eu/datasets/projections-cordex-domains-single-levels
    login: true
    method: Web download form / CDS API (cdsapi); spatial and temporal sub-selection available since July 2026
    note: >-
      14 domains (East Asia at 0.22° and 0.44°), evaluation, historical and RCP2.6/4.5/8.5 experiments, 3-hourly, 6-hourly, daily, monthly and seasonal
      data, 24 main variables, NetCDF4 (CF-1.4). Requires an ECMWF account and acceptance of the CORDEX licence. CORDEX points here for the most
      commonly used variables after the DKRZ data loss.
  - name: CEDA Archive — CORDEX EAS-44i (MOHC HadRM3P, ERA-Interim evaluation run)
    url: https://catalogue.ceda.ac.uk/uuid/c47ee635b055465da578404741e3170f
    login: true
    method: CEDA Archive web/FTP (path /badc/cordex/data/CORDEX/output/EAS-44i/MOHC/ECMWF-ERAINT/evaluation)
    note: Monthly averages and seasonal means from the Met Office Hadley Centre's 0.44° East Asia evaluation run (1990–2010). Available to any registered CEDA user.

example:
  lang: python
  note: >-
    Put your CDS API key in ~/.cdsapirc and accept the licence on the dataset page first. A request only succeeds if the domain, resolution, GCM, RCM and
    member combination exists, so check the available combinations in the download form and change the values (the GCM–RCM pair below is an example).
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()
    client.retrieve(
        "projections-cordex-domains-single-levels",
        {
            "domain": "east_asia",
            "experiment": "historical",
            "horizontal_resolution": "0_44_degree_x_0_44_degree",
            "temporal_resolution": "daily_mean",
            "variable": ["2m_air_temperature"],
            "gcm_model": "mohc_hadgem2_es",
            "rcm_model": "clmcom_cclm5_0_2",
            "ensemble_member": "r1i1p1",
            "year": ["2001", "2002", "2003", "2004", "2005"],
            "month": ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"],
        },
        "cordex_eas44_tas_day.zip",
    )

tips:
  - >-
    A data loss at the DKRZ node in early 2025 removed about 20,000 CORDEX-CMIP5 datasets (over 200 TB) without replicas from ESGF. First check whether the
    data you need are on the loss list (esgf-data-loss/Missing_CORDEX_Data.txt in the WCRP-CORDEX/cordex-cmip5 GitHub repository), and do not delete files
    you downloaded earlier. CORDEX asks anyone holding affected datasets to contact datasupport@cordex.org.
  - >-
    The ESGF route is in transition. The CORDEX page says four nodes (SMHI-NSC, DKRZ, CEDA/BADC, IPSL) fully support the CORDEX search facets, but ESGF
    is decommissioning the legacy SOLR index those nodes use and has no plans to migrate older projects such as CMIP5 to the new indexes. As checked on
    2026-10-16, the US ORNL Globus index returns 0 results for project=CORDEX. Downloading via ESGF requires joining the CORDEX Research (non-commercial)
    or CORDEX Commercial group.
  - >-
    The East Asia ESGF summary (version 2023-07-13) shows only EAS-22 (REMO2015 and RegCM4-4 driven by HadGEM2-ES, MPI-ESM-LR, MPI-ESM-MR and NorESM1-M,
    RCP2.6 and 8.5) and EAS-44 (CCLM5-0-2 and HIRHAM5 driven by CNRM-CM5, EC-EARTH, HadGEM2-ES and MPI-ESM-LR, RCP4.5 and 8.5). Simulations by Korean
    institutions are mostly absent from that table, so also check the regional EAST ASIA CORDEX website linked from the CORDEX East Asia domain page and
    its contact people.
  - >-
    File names follow VariableName_Domain_GCMModelName_Experiment_Ensemble_RCMModelName_RCMVersionID_Frequency_StartTime-EndTime.nc; 3- and 6-hourly
    files hold one year, daily files five years or fewer, and monthly or seasonal files ten years or fewer. Join the historical (1950–2005) and RCP
    (2006–2100) files of one GCM–RCM pair to build a continuous series.
  - >-
    Native rotated-pole grids (EAS-44, etc.) carry rlat/rlon coordinates plus 2-D lat/lon. To compare several RCMs, use the regular i-grids (e.g.
    EAS-44i) where core variables are provided, or regrid to a common grid with care (e.g. conservative remapping). Calendars can be 365-day or 360-day
    following the driving GCM.
  - >-
    Check known data problems in the CORDEX errata service linked from the CDS documentation and on the CDS known-issues page.

