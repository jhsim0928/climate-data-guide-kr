    The CORDEX-CMIP5 terms of use (2013) require an acknowledgement and a table listing the models and modelling groups used: "We acknowledge the World
    Climate Research Programme's Working Group on Regional Climate, and the Working Group on Coupled Modelling, former coordinating body of CORDEX and
    responsible panel for CMIP5. We also thank the climate modelling groups (listed in Table XX of this paper) for producing and making available their
