notices:
  - date: "2026-08-03"
    level: critical
    title: Suomi NPP science data delivery ends 13:00 UTC on 2 November 2026 — move to NOAA-21 and NOAA-20
    body: >-
      NOAA NESDIS announced that delivery of all remaining Suomi NPP science data, including VIIRS, ATMS, CERES and OMPS, will permanently cease at 13:00 UTC on 2 November 2026, and named NOAA-21 (primary) and NOAA-20 (secondary) as replacements.
      This ends data delivery, not satellite operations, and NASA continues to archive and distribute existing Suomi NPP data. The NASA Earthdata alert (2026-08-07) gives 1 November, while the GES DISC re-announcement (2026-10-07) gives 2 November (2026/306); the date may change.
    source: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
  - date: "2025-10"
    level: info
    title: NOAA-21 VIIRS ocean color R2025.0 collections released
    body: >-
      OBPG processed NOAA-21 VIIRS ocean color with the calibration-only "VIIRS-NOAA21 Ocean Color Reprocessing 2025.0" and released L2, L3 and L4 collections (version 2025.0). Vicarious calibration gains were rederived from HyperNAV in situ radiometry,
      which OBPG says reduces residual Rrs bias in oligotrophic waters and reduces striping. The reprocessing page carries no date, so the DOI registration date (2025-10-06) is used here.
    source: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2025/noaa21
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua to begin decommissioning in late 2026 to early 2027
    body: >-
      NASA announced that Terra and Aqua are expected to cease operations in late 2026 or early 2027, that orbit drift may affect their data, and that users should consider comparable VIIRS products. MODIS ocean color users will be moving to this dataset.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2022-10"
    level: info
    title: Full-mission R2022.0 reprocessing of Suomi NPP and NOAA-20 VIIRS ocean color begins
    body: >-
      OBPG began the full-mission R2022.0 reprocessing of Suomi NPP and NOAA-20 VIIRS ocean color in October 2022. It moved to VIIRS Level-1 code v3.2 (with JPSS-2 support), regenerated geolocation,
      and updated instrument and vicarious calibration, chlorophyll coefficients and ancillary data. OBPG reports chlorophyll and Rrs from both satellites and MODIS Aqua agree within 10% over global deep water.
    source: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/snpp

transitions:
  - from: VIIRS ocean color R2022.0 (Suomi NPP)
    to: VIIRS ocean color R2022.0.1 and R2022.0.2 (Suomi NPP mini-reprocessings)
    status: completed
    summary: >-
      Mini-reprocessings that removed a temporal drift left in the R2022 calibration, bringing Suomi NPP closer to NOAA-21 VIIRS and Aqua MODIS. A minor calibration error in late-2020 data was fixed at the same time, and data since 2020-08-01 were reprocessed.
    changes:
      - aspect: Suomi NPP calibration
        before: R2022.0 on-orbit calibration (residual drift)
        after: "Updated calibration without the drift (R2022.0.1), plus fixes for post-2022 quality issues (R2022.0.2)"
      - aspect: Period reprocessed
        before: "-"
        after: Since 2020-08-01
    impacts:
      - "Suomi NPP values after August 2020 changed, so download them again rather than mixing them with older files."
    sources:
      - name: OBPG — VIIRS-SNPP R2022.0.1
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.1/snpp
      - name: OBPG — VIIRS-SNPP R2022.0.2
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.2/snpp
  - from: Suomi NPP VIIRS Ocean
    to: NOAA-21 and NOAA-20 VIIRS Ocean
    status: planned
    date: "2026-11"
    summary: >-
      Once NOAA ends Suomi NPP delivery at 13:00 UTC on 2026-11-02, the Suomi NPP version gets no new data. NOAA-21 (primary) and NOAA-20 (secondary) carry the same VIIRS sensor with the same OBPG processing,
      but their processing versions, band centres and product sets differ slightly.
    changes:
      - aspect: Period
        before: "2012-01-02 to 2026-11-02 (delivery ends)"
        after: "NOAA-20 2017-11-29~ / NOAA-21 2022-11-10~"
      - aspect: Ocean color processing version
        before: R2022.0 (mini-reprocessing R2022.0.2)
        after: "NOAA-20 R2022.0 (R2022.0.2) / NOAA-21 R2025.0"
      - aspect: Rrs wavelengths
        before: "`Rrs_410`, `Rrs_443`, `Rrs_486`, `Rrs_551`, `Rrs_671`"
        after: "`Rrs_411`, `Rrs_445`, `Rrs_489`, `Rrs_556`, `Rrs_667`"
      - aspect: Sea surface temperature
        before: "SST, NSST, SST3 (version 2016.2)"
        after: "NOAA-20 SST, NSST, SST3 (version 2024.0; only NRT seen since 2026) / no OB.DAAC SST for NOAA-21"
      - aspect: File name prefix
        before: SNPP_VIIRS
        after: "JPSS1_VIIRS (NOAA-20), JPSS2_VIIRS (NOAA-21)"
    impacts:
      - "Rrs variable names change, so scripts need new variable names. The red band (671 → 667 nm) differs by about 20% according to OBPG and cannot be joined as is."
      - "Suomi NPP and NOAA-20/21 chlorophyll agree within 10% over global deep water, but regional differences can be larger; compare over the overlap before switching."
      - "The only continuation of Suomi NPP SST (2016.2) is NOAA-20 SST (2024.0), and the processing versions differ, so avoid simple splicing."
    sources:
