notices:
  - date: "2025-09-03"
    level: critical
    title: AVHRR Pathfinder SST product and CDR discontinued (no updates after 2023-12-31)
    body: >-
      In a NOAA NESDIS Notice of Changes, NCEI announced that the AVHRR Pathfinder SST product and Climate Data Record are discontinued, with no updates beyond 2023-12-31.
      All archived data remain authoritative and available from the product and CDR pages. No successor was mentioned.
    source: https://www.nesdis.noaa.gov/news/avhrr-pathfinder-sst
  - date: "2019-08-29"
    level: info
    title: PO.DAAC retires Pathfinder v5.0 and v5.1
    body: >-
      NASA PO.DAAC stopped supporting NOAA AVHRR Pathfinder SST v5.0 and v5.1 and directed users to NOAA NCEI, which hosts these and newer versions.
    source: https://podaac.jpl.nasa.gov/announcements/2019-08-29_NOAA_AVHRR_PATHFINDER_SST_v5.0_and_v5.1_datasets_retired
  - date: "2016-08-27"
    level: info
    title: Release of Pathfinder v5.3 L3C
    body: >-
      NCEI published v5.3 L3C, reprocessed on SeaDAS 6.4. Changes from 5.2 include quality level 0 data, improved sun glint handling, consistent cloud tests for NOAA-7 and NOAA-19, and an updated land mask.
    source: https://www.ncei.noaa.gov/archive/accession/AVHRR_Pathfinder-NCEI-L3C-v5.3
  - date: "2016-07-20"
    level: warning
    title: High-latitude SST errors near the solstices in v5.2 and v5.3
    body: >-
      An NCEI technical note (CDRP-RPT-0831) reported that Pathfinder v5.2 and v5.3 SST above 50° latitude is often incorrect near the June and December solstices.
      The cause is improper splitting of mixed day/night granules, which affects L3C; NCEI said it would fix this in a future version, but updates ended without one.
    source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Sea_Surface_Temperature_Pathfinder/TechnicalNote_01B-08.pdf

transitions:
  - from: AVHRR Pathfinder v5.2
    to: AVHRR Pathfinder v5.3
    status: completed
    date: "2016-08"
    summary: >-
      A rebuild on SeaDAS 6.4 that adds quality level 0 data and improves sun glint and land-boundary handling and metadata conventions.
      The record was also extended from 2012 to 2023.
    changes:
      - aspect: Period
        before: "1981-09-01 to 2012-12-31"
        after: "1981-08-25 to 2023-12-31"
      - aspect: DOI
        before: 10.7289/v5wd3xhb
        after: 10.7289/v52j68xx
      - aspect: Quality levels
        before: Quality level 0 data excluded
        after: "Quality level 0 data included; daytime SST above 39.8°C flagged with l2p_flags bit 6"
      - aspect: Cloud and sun glint handling
        before: NOAA-7 and NOAA-19 cloud tests differed from other sensors
        after: "Consistent cloud tree tests, better sun glint handling, improved flagging of land–water boundary hot spots"
      - aspect: Masks
        before: Earlier land mask
        after: "Land mask from the Global Lakes and Wetlands Database; Antarctic ice shelves flagged as 100% ice"
      - aspect: File format
        before: netCDF-4
        after: "netCDF-4 classic with improved CF and ACDD compliance"
    impacts:
      - Pixel values and missing pixels differ between 5.2 and 5.3, so do not mix them in one series; download the whole period in 5.3.
      - "Quality level 0 is now included, so re-check your quality_level and pathfinder_quality_level filters if you want to match 5.2-era screening."
      - The high-latitude solstice errors are not fixed in 5.3.
    sources:
      - name: NCEI — AVHRR Pathfinder SST product page (5.3 changes, version history)
        url: https://www.ncei.noaa.gov/products/avhrr-pathfinder-sst
      - name: NCEI archive record — v5.3 L3C
        url: https://www.ncei.noaa.gov/archive/accession/AVHRR_Pathfinder-NCEI-L3C-v5.3

