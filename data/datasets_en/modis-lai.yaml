transitions:
  - from: MODIS LAI/FPAR C6.1 (MCD15A2H etc.)
    to: VIIRS LAI/FPAR V2 (VNP15A2H, VJ115A2H, VJ215A2H)
    to_id: viirs-lai
    status: planned
    date: "2027"
    summary: >-
      The successor ports the same Boston University algorithm (3D radiative-transfer look-up tables plus an NDVI backup) to the VIIRS red and near-infrared channels. In a 2012–2016 comparison the global
      mean differences were small (LAI −0.006, FPAR −0.002), but variable names, quality-bit layout and file format differ, so code must be updated. MODIS collection ends with Terra and Aqua (late 2026 to 2027).
    changes:
      - aspect: Satellites and overpass time
        before: "Terra (originally 10:30 descending) and Aqua (originally 13:30 ascending), drifting since 2020 and 2021"
        after: "Suomi NPP (2012–, distribution to end November 2026), NOAA-20 (2018–) and NOAA-21 (2023–), all in 13:30 ascending orbits"
      - aspect: Products and time step
        before: "8-day (MOD15A2H, MYD15A2H, MCD15A2H) + 4-day (MCD15A3H)"
        after: "8-day only (VNP15A2H, VJ115A2H, VJ215A2H) — one product per satellite, no combined product"
      - aspect: Input channels
        before: "MODIS red (648 nm) and NIR (858 nm) reflectance from 500 m MOD09GA"
        after: "VIIRS I1 (640 nm) and I2 (865 nm) from VNP09GA, with sensor-specific look-up tables"
      - aspect: Compositing
        before: "Day of maximum FPAR within the 8-day (4-day) period"
        after: "Same — the day of maximum FPAR in 8 days, with that day's LAI and QA"
      - aspect: Variable names
        before: "`Lai_500m`, `Fpar_500m`, `LaiStdDev_500m`, `FparStdDev_500m`, `FparLai_QC`, `FparExtra_QC`"
        after: "`Lai`, `Fpar`, `LaiStdDev`, `FparStdDev`, `FparLai_QC`, `FparExtra_QC` (same scale factors and 249–255 codes)"
      - aspect: Quality bits (FparLai_QC)
        before: "Bit 0 MODLAND, bit 1 sensor, bit 2 dead detector, bits 3–4 cloud, bits 5–7 SCF_QC"
        after: "Bits 0–2 SCF_QC, bit 3 dead detector, bits 4–7 biome type — reusing the MODIS bit operations selects the wrong pixels"
      - aspect: File format
        before: "HDF-EOS2 (HDF4, .hdf)"
        after: "HDF-EOS5 (HDF5, .h5)"
      - aspect: Consistency (2012–2016, VIIRS − MODIS)
        before: "Reference"
        after: "Mean difference LAI −0.006 ± 0.013, FPAR −0.002 ± 0.002. Larger differences over tropical forest (reflectance saturation), and VIIRS showed larger year-to-year variation in main-algorithm success (Xu et al. 2018, VIIRS V1)"
    impacts:
      - When joining the two records, check pixel- and season-level differences over the overlap (2012 onward, 2018 onward for NOAA-20) and state in the paper that there is a seam.
      - The QC bit layout differs, so do not reuse MODIS quality-filter code on VIIRS. The `_500m` suffix has also gone from the variable names.
      - Analyses built on the MODIS 4-day product (MCD15A3H) can only be continued at 8 days with VIIRS.
      - Suomi NPP products (VNP15A2H) stop being distributed in November 2026, so the reference satellites going forward are NOAA-21 (VJ215A2H, primary) and NOAA-20 (VJ115A2H, secondary).
    sources:
      - name: Transition from MODIS to VIIRS (NASA Earthdata notice, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: VNP15 User Guide V1.2 (2018)
        url: https://lpdaac.usgs.gov/documents/126/VNP15_User_Guide.pdf
      - name: Xu et al. (2018) — consistency of VIIRS and MODIS LAI/FPAR (Forests)
        url: https://doi.org/10.3390/f9020073
      - name: Román et al. (2024) — continuity between MODIS C6.1 and VIIRS C2 land products (RSE)
        url: https://doi.org/10.1016/j.rse.2023.113963
  - from: MODIS LAI/FPAR C6
    to: MODIS LAI/FPAR C6.1
    status: completed
    date: "2023-07"
    summary: >-
      A full-record reprocessing that kept the science algorithm and changed only the Terra and Aqua L1B calibration approach and the polarization correction. Format and variable names are the same as C6.
      Distribution of C6 (006) land products ended on 31 July 2023.
    changes:
      - aspect: Algorithm
        before: "C6 (500 m MOD09GA input, daily intermediate MOD15IP, improved multi-year land cover)"
        after: "Unchanged"
      - aspect: Input calibration
        before: "C6 L1B calibration"
        after: "Revised Terra and Aqua L1B calibration approach and polarization correction"
      - aspect: Availability
        before: "006 — distribution ended 2023-07-31"
        after: "061 — the only version available"
    impacts:
      - Re-check results made with 006 using 061. The 006 files can no longer be downloaded.
    sources:
      - name: MOD15 C6.1 User Guide (2020)
        url: https://lpdaac.usgs.gov/documents/926/MOD15_User_Guide_V61.pdf
      - name: Final notice — MODIS Version 6.0 land products decommissioned (2023-07-25)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS placed in standby — part of 2026 days 085–086 flagged questionable/bad
    body: >-
      A Terra anomaly at about 20:00 UTC on 26 March 2026 put MODIS into standby; it returned to science mode on 27 March.
      The calibration team flagged data from 2026-085 20:00 UTC to 2026-086 19:23 UTC as questionable or bad and said later data are safe to use.
      Check the quality flags of the 8-day and 4-day composites (Terra-based MOD15 and MCD15) that include this window.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: End of science operations projected for February 2027 (Terra) and September 2027 (Aqua)
    body: >-
      An editor's note on NASA Earth Observer's Terra feature (published 2025-12-29, updated 2026-03-20) gives the projected end of science activities as February 2027 for Terra and September 2027 for Aqua.
      Operations continue until then; because its ageing battery limits power, Terra switched off MOPITT on 9 April 2025 to save energy for the remaining four instruments, and the ASTER shortwave infrared subsystem no longer works.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-01-08"
    level: warning
    title: MODIS quality team note — Terra and Aqua orbit drift affects pixel size, scan gaps and diurnal sampling
    body: >-
      LDOPE reported that drift since the last orbit adjustments (Terra 2022, Aqua 2021) has changed pixel size and spacing, scan gaps, bowtie overlap and diurnal sampling,
      with impacts growing sharply from late 2024. Effects on individual products, starting with fire, are under investigation.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool distribution of MODIS ends (2025-06-30) — move to Earthdata Cloud
    body: >-
      LP DAAC announced that Data Pool access to all MODIS data, including C6.1, would be retired on 30 June 2025, with NASA Earthdata Cloud as the primary archive.
      Earthdata Search and AppEEARS users see no change, but scripts that call Data Pool URLs directly need updating.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua expected to shut down late 2026 to early 2027
    body: >-
      NASA expects Terra and Aqua to stop operating in late 2026 or early 2027; MODIS data collection will end then and a final reprocessing will follow.
      Because orbit drift may affect crossing times and data quality, users are encouraged to move to comparable VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 land products decommissioned (2023-07-31) — only V6.1 available
    body: >-
      LP DAAC stopped distributing Terra, Aqua and combined MODIS V6.0 land products (except MOD44W and MCD43GF) on 31 July 2023.
      User Guides and ATBDs remain on the DOI landing pages, and users were advised to move to V6.1.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

