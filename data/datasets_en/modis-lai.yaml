# ─────────────────────────────────────────────────────────────
# MODIS LAI/FPAR (MCD15A2H, MCD15A3H, MOD15A2H, MYD15A2H) — dataset information file
# Land tab, 'Vegetation'. Deprecated because Terra and Aqua are nearing end of mission; the successor is VIIRS LAI/FPAR (viirs-lai.yaml).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-lai
name: "MODIS LAI/FPAR (MCD15)"
full_name: MODIS Leaf Area Index / FPAR (MCD15A2H, MCD15A3H, MOD15A2H, MYD15A2H) Version 6.1 (500 m, 8-day and 4-day composites)
category: satellite
domain: land
group: 식생
order: 10
domains: [육지, 원격탐사]
provider: NASA MODIS Land Team (Myneni group, Boston University) / LP DAAC

status: deprecated
status_note: >-
  Collection 6.1 (061) is still produced every 8 and 4 days (on 2026-10-13 the latest MCD15A2H composite began on 2026-09-22), but the satellites behind it are at the end of their lives.
  NASA has said MODIS data collection will stop when Terra and Aqua end operations in late 2026 or early 2027, followed by a final reprocessing, and advises users to move to comparable VIIRS products;
  NASA's Earth Observer projects the end of science operations in February 2027 for Terra and September 2027 for Aqua. Both platforms stopped orbit maintenance to save fuel and their
  overpass times are drifting, so plan new work around VIIRS LAI/FPAR (VNP15, VJ115, VJ215) as well.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra-only MOD15A2H starts on 2000-02-18; Aqua-only MYD15A2H and the combined Terra+Aqua MCD15A2H (8-day) and MCD15A3H (4-day) start on 2002-07-04.
    A CMR check of the Korean tile (h28v05) on 2026-10-13 found the latest MCD15A2H and MOD15A2H composite was 2026-09-22 to 29, and the latest MCD15A3H composite 2026-09-30 to 10-03.
    MODIS data collection is expected to end when Terra and Aqua end operations.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "8일"
  spatial: "MODIS Sinusoidal tile grid (tiles about 10°×10° at the equator, 2400×2400 pixels per tile), 500 m"
  vertical: Single layer (vegetation canopy at the surface)
  temporal: >-
    8-day composites (MCD15A2H, MOD15A2H, MYD15A2H) / 4-day composites (MCD15A3H, combined Terra+Aqua only). The file date is the first day of the compositing period
    (day of year, e.g. A2026265), and the compositing periods restart on 1 January (day 001) each year.

update: New 8-day (or 4-day) composites roughly 1–2 weeks after the period ends (to stop when Terra and Aqua end operations)
license: NASA Earth science open data — free and unrestricted under the EOSDIS Data Use and Citation Guidance; file downloads need a free NASA Earthdata Login; please cite the dataset DOI
account_required: true

summary: >-
  Global leaf area index (LAI) and fraction of photosynthetically active radiation (400–700 nm) absorbed by vegetation (FPAR) derived from MODIS on NASA's Terra and Aqua satellites.
  The main algorithm inverts red and near-infrared surface reflectance against look-up tables built from a 3D radiative transfer model; when that fails, an empirical NDVI-based backup is used.
  Data come as 500 m sinusoidal tiles in 8-day (combined and single-sensor) and 4-day (combined) composites, and the record back to 2000 makes it a standard reference for ecology,
  carbon-cycle studies and land-model evaluation. The successor products apply the same algorithm to VIIRS (VNP15, VJ115, VJ215).

time_convention:
  summary: >-
    Within each 8-day (or 4-day) period the daily retrievals are composited by picking the day with the highest FPAR, and that day's FPAR, LAI and quality flags are written out
    (maximum-FPAR compositing in the ATBD). FPAR is therefore the period maximum, while LAI is the value on the selected day rather than a period mean. The file date is the start of the period.
  points:
    - "A2026265 in a file name means an 8-day composite starting on day 265 of 2026 (22 September). The file does not record which day within the period supplied the value; it can be any of them."
    - "Combined products (MCD15) pick either a Terra or an Aqua observation, so the sensor varies from pixel to pixel. Bit 1 of `FparLai_QC` (0 = Terra, 1 = Aqua) tells you which."
    - "Terra originally crossed the equator at 10:30 descending and Aqua at 13:30 ascending, but since orbit maintenance ended Terra has drifted to earlier mornings and Aqua to later afternoons (Aqua was expected near 15:50 around August 2026). Solar elevation and shadowing at overpass therefore change from year to year."
    - "Compositing restarts on 1 January each year, so the last composite of a year (e.g. starting 27 December) runs into early January and overlaps the first composite of the next year."
    - "The 4-day product (MCD15A3H) follows the same rule and picks one day out of four. It has finer time resolution than the 8-day product but can contain more cloud-affected pixels (a higher share of backup retrievals)."
  source: https://lpdaac.usgs.gov/documents/90/MOD15_ATBD.pdf
  source_name: "MOD15 ATBD (1999) + MOD15 C6.1 User Guide (2020) + LP DAAC/CMR collection descriptions"

variables:
  note: >-
    From the MOD15 C6.1 User Guide and LP DAAC collection information. The 8-day and 4-day, Terra, Aqua and combined products all use the same SDS names.
    Values are stored as unsigned 8-bit integers that must be multiplied by the scale factor, and 249–255 are non-vegetation and fill codes (see tips).
  full_list: https://lpdaac.usgs.gov/documents/926/MOD15_User_Guide_V61.pdf
  groups:
    - name: LAI and FPAR (500 m, 8-day and 4-day composites)
      kind: instant
      period: Selected day within the compositing period
      items:
        - text: "Fraction of absorbed photosynthetically active radiation (FPAR) — `Fpar_500m` (fraction 0–1, stored value × 0.01)"
          kind: max
          period: 8-day (4-day for MCD15A3H)
          note: Value on the day with the highest FPAR in the compositing period
        - text: "Leaf area index (LAI) — `Lai_500m` (m² m-2, stored value × 0.1)"
          note: Value on the selected observation day (the day of maximum FPAR)
        - "FPAR standard deviation — `FparStdDev_500m` (fraction, stored value × 0.01; 248 = not available because the backup algorithm was used)"
        - "LAI standard deviation — `LaiStdDev_500m` (m² m-2, stored value × 0.1; 248 = not available because the backup algorithm was used)"
        - text: "LAI/FPAR quality flags — `FparLai_QC` (bit field)"
          note: "Bit 0 MODLAND (0 = main algorithm), bit 1 sensor (0 = Terra, 1 = Aqua), bit 2 dead detector, bits 3–4 cloud state, bits 5–7 SCF_QC (algorithm path)"
        - "Extra quality flags — `FparExtra_QC` (bit field)"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2222147000-LPCLOUD
    method: Web search and HTTPS download / earthaccess
    note: >-
      The link opens MCD15A2H V061. Short names are MCD15A2H, MCD15A3H, MOD15A2H and MYD15A2H, version 061; files are HDF-EOS2 (.hdf) tiles.
      LP DAAC Data Pool distribution of MODIS data ended on 30 June 2025, so scripts that used Data Pool URLs should switch to Earthdata Cloud (for example via earthaccess).
  - name: AppEEARS (area and point extraction)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Web and API — area (GeoTIFF, NetCDF4) or point (CSV) extraction with optional reprojection
    note: Lets you receive just your region on a geographic grid without handling tiles or the sinusoidal projection, which is convenient for new users. Quality-bit lookup tables are included.
  - name: Earthdata catalog (MCD15A2H V061)
    url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd15a2h-061
    method: Web (documents, citation, layer information)

example:
  lang: python
  note: >-
    Downloads MCD15A2H for July 2024 with earthaccess and reads LAI from the central Korean tile (h28v05). The files are HDF4, so pyhdf is used.
    Stored values of 249 and above are non-vegetation or fill codes and are removed first, and only main-algorithm retrievals (SCF_QC bits 5–7 equal to 0 or 1) are kept.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MCD15A2H", version="061",
        temporal=("2024-07-01", "2024-07-31"),
        bounding_box=(126.5, 35.5, 128.5, 37.5),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "./mcd15a2h")

    for f in sorted(map(str, files)):
        if ".h28v05." not in f:          # central Korea tile only
            continue
        sd = SD(f, SDC.READ)
        raw = sd.select("Lai_500m")[:].astype("float32")
        qc = sd.select("FparLai_QC")[:]
        lai = np.where(raw <= 100, raw * 0.1, np.nan)   # 249-255 = non-vegetation / fill
        scf = (qc >> 5) & 0b111                          # 0 or 1 = main (RT) algorithm
        lai[scf > 1] = np.nan
        print(f.split("/")[-1], "mean LAI:", np.nanmean(lai))

tips:
  - "LAI and FPAR are stored as uint8. Multiply LAI by 0.1 and FPAR by 0.01, and always remove 249–255 first (255 fill, 254 inland water, 253 barren or sparse vegetation, 252 permanent snow and ice, 251 wetland, 250 urban, 249 unclassified). Averaging them as they are produces absurd LAI values near 25."
  - "Bits 5–7 of `FparLai_QC` (SCF_QC) give the algorithm path. 0 (main algorithm) and 1 (main algorithm, saturated) are reliable; 2 and 3 are the empirical NDVI backup; 4 means not produced. Backup retrievals are common during the cloudy monsoon season over Korea, so analyse by quality class."
  - Reflectance saturates over dense forest, so LAI is underestimated and highly uncertain there (QC 1, saturation). Take care when comparing peak LAI in tropical or temperate broadleaf forest.
  - Bits are read from the right (bit 0). As in the User Guide example, 64 is binary 1000000, so bits 5–7 equal 2 (backup algorithm).
  - The tiles use a sinusoidal projection, so pixel edges do not line up with a latitude–longitude grid. Use AppEEARS or GDAL for point extraction or reprojection. Korea spans several tiles, including h28v05 and h29v05.
  - "According to the MODIS quality team (LDOPE), Terra and Aqua orbit drift has noticeably changed MODIS pixel size, scan gaps and diurnal sampling since late 2024. When interpreting trends over recent years, compare against VIIRS LAI for the same period."
  - For long-term analysis use the combined MCD15A2H (from 2002-07). If you need 2000–2002 you have to use Terra-only MOD15A2H, so state that the sampling changes at that point.

