  papers:
    - label: MERRA reference paper
      text: >-
        Rienecker, M. M., Suarez, M. J., Gelaro, R., Todling, R., Bacmeister, J., Liu, E., Bosilovich, M. G.,
        Schubert, S. D., Takacs, L., Kim, G.-K., et al. (2011): MERRA: NASA's Modern-Era Retrospective Analysis
        for Research and Applications. Journal of Climate, 24(14), 3624–3648.
      doi: 10.1175/JCLI-D-11-00015.1
      bibtex: |
        @article{rienecker2011merra,
          author  = {Rienecker, Michele M. and Suarez, Max J. and Gelaro, Ronald and Todling, Ricardo and Bacmeister, Julio and Liu, Emily and Bosilovich, Michael G. and Schubert, Siegfried D. and Takacs, Lawrence and Kim, Gi-Kong and others},
          title   = {{MERRA}: {NASA}'s Modern-Era Retrospective Analysis for Research and Applications},
          journal = {Journal of Climate},
          volume  = {24},
          number  = {14},
          pages   = {3624--3648},
          year    = {2011},
          doi     = {10.1175/JCLI-D-11-00015.1}
