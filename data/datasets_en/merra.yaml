# ─────────────────────────────────────────────────────────────
# MERRA (original) — dataset information file (English edition)
# ─────────────────────────────────────────────────────────────
id: merra
name: MERRA
full_name: Modern-Era Retrospective analysis for Research and Applications
category: reanalysis
domain: atmosphere
group: 재분석
order: 120
domains: [대기, 육지]
provider: NASA Global Modeling and Assimilation Office (GMAO) / distributed by NASA GES DISC

status: ended
status_note: >-
  Production ended in March 2016; the analyses for February 29, 2016 are the last. GMAO states that its MERRA pages are no longer under development.
  As of 2026-10-11 the files are still on the GES DISC on-premises server (goldsmr1), but GES DISC has announced that on-premises HTTPS access ends by
  September 30, 2026, and the original MERRA collections could not be found in the Earthdata Cloud catalogue (CMR). Download any files you need now, and use MERRA-2 for new work.

successor:
  name: MERRA-2
  url: https://gmao.gsfc.nasa.gov/gmao-products/merra-2/
  note: >-
    1980–present, 0.5° × 0.625° grid, 72 levels. Adds assimilation of satellite aerosol observations and observation-corrected precipitation forcing.
    Reference: Gelaro et al. (2017), J. Climate, 30, 5419–5454, doi:10.1175/JCLI-D-16-0758.1

transitions:
  - from: MERRA
    to: MERRA-2
    to_id: merra2
    status: completed
    date: "2016-02"
    summary: >-
      MERRA used GEOS-5.2.0, frozen in 2008, and could not ingest observations from satellites launched after NOAA-18 (2005). GMAO produced MERRA-2 with GEOS-5.12.4
      to fill that gap, adding a cubed-sphere grid, aerosol assimilation, dry-mass and water-budget constraints, and observation-corrected precipitation forcing.
      MERRA production stopped after the analyses for February 29, 2016.
    changes:
      - aspect: Period
        before: "1979-01 to 2016-02 (ended)"
        after: "1980-01 to present (updated monthly, released around the 15th–20th of the following month)"
      - aspect: System version
        before: "GEOS-5.2.0 (frozen in 2008)"
        after: "GEOS-5.12.4"
      - aspect: Model and output grids
        before: "Latitude–longitude grid, output at 1/2° × 2/3° (540 × 361), 72 levels (top at 0.01 hPa)"
        after: "Cubed-sphere grid (removes the polar grid singularity), output at 0.5° × 0.625° (576 × 361), 72 levels"
      - aspect: Observations
        before: "Only satellites up to NOAA-18 (2005) could be assimilated; about 1.5 million observations per 6 hours"
        after: "Adds IASI, CrIS and ATMS radiances, GPS radio occultation bending angles, MLS and OMI ozone, AVHRR atmospheric motion vectors, ASCAT and WindSat ocean surface winds and more. About 2 million (2002) to about 5 million (2015) observations per 6 hours"
      - aspect: Radiative transfer model
        before: "Early CRTM (GLATOVS for SSU)"
        after: "CRTM 2.1.3 for all radiances"
      - aspect: Aerosols
        before: "Prescribed annual climatology (no assimilation)"
        after: "Assimilates 550 nm aerosol optical depth from AVHRR, MODIS, MISR and AERONET; five GOCART aerosol species coupled to the model"
      - aspect: Mass and water budgets
        before: "Large analysis increments, offset by unphysical variations in precipitation minus evaporation"
        after: "Dry-air mass conserved (fixed at 983.24 hPa); global mean water vapour analysis increment constrained to zero"
      - aspect: Land surface precipitation forcing
        before: "Model precipitation used as is"
        after: "Corrected with observation-based precipitation for the land surface and wet deposition (provided as `PRECTOTCORR`; no correction poleward of 62.5°)"
      - aspect: SST and sea-ice boundary conditions
        before: "Reynolds et al. (2002) 1° data"
        after: "CMIP data before 1982, then NOAA OISST (1982–2006-03), then OSTIA (2006-04 onward)"
      - aspect: Stratosphere, ozone and cryosphere
        before: "No QBO; SBUV v8 ozone (reduced to 12 layers)"
        after: "Model generates a QBO; SBUV 8.6 (21 layers, to 2004) then OMI and MLS ozone from October 2004; MLS temperature assimilated above 5 hPa; glaciated land representation and seasonally varying sea-ice albedo"
      - aspect: File format and collection names
        before: "HDF (.hdf), e.g. MAT1NXSLV V5.2.0 (no dataset DOI)"
        after: "netCDF4 (.nc4), e.g. M2T1NXSLV V5.12.4 (a DOI for each collection)"
    impacts:
      - Do not splice the two reanalyses into one time series at 2016. Observations, model and boundary conditions all differ, so climatologies and trends differ even in the overlap period.
      - "Variable names (`T2M`, `SLP`, `PRECTOT`, etc.) are largely the same, but collection names (MAT… to M2T…), file format (HDF to netCDF4) and grid (540 to 576 longitudes) changed, so reading and regridding scripts need updating."
      - "MERRA-2 starts in 1980, so 1979 exists only in MERRA. For analyses that include 1979, compare with another reanalysis or adjust the period."
      - Precipitation is now split into model (`PRECTOT`) and observation-corrected (`PRECTOTCORR`) fields. When comparing with MERRA results, compare model precipitation with model precipitation.
    sources:
      - name: Gelaro et al. (2017), The MERRA-2 reanalysis, J. Climate, 30, 5419–5454
        url: https://doi.org/10.1175/JCLI-D-16-0758.1
      - name: Rienecker et al. (2011), MERRA, J. Climate, 24, 3624–3648
        url: https://doi.org/10.1175/JCLI-D-11-00015.1
      - name: GMAO news — GMAO Terminates MERRA Production (2016-03-14)
        url: https://gmao.gsfc.nasa.gov/geos-system-news/gmao-terminates-merra-production/
      - name: GMAO MERRA official page
        url: https://gmao.gsfc.nasa.gov/gmao-products/merra/
      - name: MERRA-2 File Specification (GMAO Office Note No. 9)
        url: https://gmao.gsfc.nasa.gov/media/publications/zbly36ziNFDFbmYmvhQeVqPhUo/Bosilovich785.pdf

period:
  start: "1979-01"
  end: "2016-02"
  note: Production ended with the analyses for February 29, 2016 (GMAO announcement, 2016-03-14).

resolution:
  spatial_short: "56 km (0.5°×0.667°)"
  temporal_short: "1시간"
  spatial: "Native grid 1/2° latitude × 2/3° longitude (540 × 361) / reduced grid 1.25° × 1.25° (288 × 144)"
  vertical: "72 model levels (top at 0.01 hPa) / 42 pressure levels"
  temporal: Hourly (2D diagnostics), 3- and 6-hourly (3D), monthly means
update: Ended (March 2016)
license: NASA open data (no restrictions on use); acknowledgement of GMAO and GES DISC requested
account_required: true

summary: >-
  MERRA is NASA GMAO's satellite-era global reanalysis, based on a version of the GEOS-5 atmospheric data assimilation system that was frozen in 2008, and released in 2009.
  A major goal was a better representation of the hydrological cycle, and its hourly 2D diagnostics gave it unusually high time resolution for its day.
  It has been superseded by MERRA-2 and is now used mainly to reproduce earlier studies and for comparisons across reanalysis generations.

time_convention:
  summary: >-
    MERRA follows the same conventions as MERRA-2: inst collections hold instantaneous values at the time stamp, tavg collections hold interval averages time-stamped at the centre
    of the interval (00:30, 01:30, …). inst1_2d_int_Nx, which contains total precipitable water (`TQV`), is instantaneous on the hour, so it is offset by 30 minutes from tavg1 data even though both are hourly.
  points:
    - "tavg1_2d_slv_Nx and tavg1_2d_flx_Nx: hourly averages stamped at 00:30, 01:30, … (mid-interval)"
    - "inst1_2d_int_Nx: vertically integrated quantities, instantaneous on the hour (00:00, 01:00, …)"
    - "inst3_3d_asm_Cp: instantaneous at 00, 03, 06, …, 21 UTC (1.25° grid)"
    - "Precipitation and heat fluxes are mean rates in kg m-2 s-1 and W m-2, not accumulations. Monthly files represent averages for the calendar months, accounting for leap years"
  source: https://gmao.gsfc.nasa.gov/pubs/docs/Lucchesi528.pdf
  source_name: "File Specification for MERRA Products (GMAO Office Note No. 1, v2.3), Section 3 and Appendices D and F"

variables:
  note: Main variables from the MERRA file specification (GMAO Office Note No. 1). Short names are the in-file names; the collection is given in each group heading.
  full_list: https://gmao.gsfc.nasa.gov/pubs/docs/Lucchesi528.pdf
  groups:
    - name: Surface and single level (tavg1_2d_slv_Nx, hourly average)
      kind: mean
      period: 1-hour
      items:
        - "Temperature at 2 m above the displacement height — `T2M` (K)"
        - "Specific humidity at 2 m above the displacement height — `QV2M` (kg kg-1)"
        - "Eastward and northward wind at 10 m above the displacement height — `U10M`, `V10M` (m s-1)"
        - "Sea level pressure — `SLP` (Pa)"
        - "Surface pressure — `PS` (Pa)"
    - name: Surface fluxes (tavg1_2d_flx_Nx, hourly average)
      kind: mean
      period: 1-hour
      items:
        - "Total surface precipitation flux — `PRECTOT` (kg m-2 s-1)"
        - "Sensible heat flux (positive upward) — `HFLUX` (W m-2)"
        - "Latent heat flux (positive upward) — `EFLUX` (W m-2)"
    - name: Vertically integrated (inst1_2d_int_Nx, hourly instantaneous)
      kind: instant
      items:
        - "Total water vapor (total precipitable water) — `TQV` (kg m-2)"
    - name: Pressure levels (inst3_3d_asm_Cp, 3-hourly instantaneous, 1.25° grid, 42 levels)
      kind: instant
      items:
        - "Air temperature — `T` (K)"
        - "Eastward and northward wind components — `U`, `V` (m s-1)"
        - "Geopotential height — `H` (m)"
        - "Specific humidity — `QV` (kg kg-1)"
        - "Relative humidity — `RH` (fraction)"
        - "Vertical pressure velocity — `OMEGA` (Pa s-1)"

access:
  - name: NASA GES DISC — MERRA dataset list
    url: https://disc.gsfc.nasa.gov/datasets?project=MERRA
    method: Web search and download
    note: Requires a NASA Earthdata Login. This is the official route given on the GMAO data access page.
  - name: GES DISC on-premises archive (goldsmr1, MERRA directory)
    url: https://goldsmr1.gesdisc.eosdis.nasa.gov/data/MERRA/
    method: HTTPS directory download
    note: >-
      Files for 1979–2016 are in per-collection folders such as MAT1NXSLV.5.2.0. The server banner says access ends after September 30, 2026,
      so it could close at any time. Requires an Earthdata Login.
  - name: GMAO MERRA data access page
    url: https://gmao.gsfc.nasa.gov/gmao-products/merra/data-access_merra/
    method: Information page

tips:
  - "MERRA was computed in three production streams, and the MERRA100/200/300 prefix in file names gives the stream number (e.g. MERRA100.prod.assim.tavg1_2d_slv_Nx.19790101.hdf). The prefix changes with the period, so read file names from the directory listing rather than hard-coding a fixed pattern."
  - Values on pressure levels below the surface (e.g. 1000 or 850 hPa over high terrain) are undefined. Check how missing values are handled when averaging over regions that include mountains.
  - "`SPEED` in the FLX collection is the wind speed used in the turbulent flux calculation, not the ordinary surface wind. The GMAO FAQ advises using the 2 m winds (`U2M`, `V2M`) if you need surface wind."
  - Aerosols were not assimilated; an annual climatology was prescribed. For aerosol or radiation studies, use MERRA-2.

