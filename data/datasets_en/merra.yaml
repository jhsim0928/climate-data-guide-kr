  acknowledgement: >-
    The MERRA README asks users to acknowledge GMAO and the data distributor, GES DISC. The original MERRA collections have no verifiable dataset DOI,
    so the safest approach is to cite the paper above together with the collection name you used (e.g. MAT1NXSLV V5.2.0) and your access date.

notices:
  - date: "2026-05-11"
    level: critical
    title: GES DISC on-premises servers closing — access route for original MERRA uncertain
    body: >-
      GES DISC announced that HTTPS access to data on its on-premises servers will no longer be available by September 30, 2026, as it moves to Earthdata Cloud.
      The goldsmr1 server holding the original MERRA carries the same closure notice, but whether the MERRA collections will be offered in the cloud has not been officially confirmed.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2016-03-14"
    level: critical
    title: GMAO Terminates MERRA Production
    body: >-
      On March 14, 2016, the MERRA production stream completed the analyses for February 29, 2016, the last date for which MERRA data will be produced.
      GMAO's reanalysis work has since moved to MERRA-2.
    source: https://gmao.gsfc.nasa.gov/geos-system-news/gmao-terminates-merra-production/

