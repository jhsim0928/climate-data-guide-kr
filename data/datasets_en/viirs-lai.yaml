# VIIRS LAI/FPAR V2 (VNP15A2H, VJ115A2H, VJ215A2H) — dataset information file
# Land tab, 'Vegetation'. Successor to MODIS LAI/FPAR (modis-lai.yaml).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: viirs-lai
name: "VIIRS LAI/FPAR (VNP15)"
full_name: VIIRS Leaf Area Index / FPAR (VNP15A2H, VJ115A2H, VJ215A2H) Version 2 (500 m, 8-day composites)
category: satellite
domain: land
group: 식생
order: 11
domains: [육지, 원격탐사]
provider: NASA VIIRS Land Team (Myneni group, Boston University) / LP DAAC

status: active
status_note: >-
  Version 2 (002) is produced every 8 days separately for Suomi NPP (VNP15A2H), NOAA-20 (VJ115A2H) and NOAA-21 (VJ215A2H); on 2026-10-13 the latest composite began on 2026-09-14.
  NOAA has announced that delivery of Suomi NPP data ends at 13:00 UTC on 2 November 2026 (1 November in the NASA notice), and LP DAAC advises users to move from VNP15A2H
  to VJ215A2H (primary) or VJ115A2H (secondary). Version 1 distribution ended in April 2025.

period:
  start: "2012-01"
  end: present
  note: >-
    VNP15A2H (Suomi NPP) starts in January 2012 (the first file for the Korean tile is the composite beginning 2012-01-17), VJ115A2H (NOAA-20) on 2018-01-01 and VJ215A2H (NOAA-21) on 2023-02-10.
    A CMR check of the Korean tile (h28v05) on 2026-10-13 found the 2026-09-14 to 21 composite was the latest for all three. VNP15A2H is expected to stop when Suomi NPP data delivery ends in November 2026.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "8일"
  spatial: "The same sinusoidal tile grid as MODIS (horizontal tiles 0–35, vertical 0–17), 500 m"
  vertical: Single layer (vegetation canopy at the surface)
  temporal: 8-day composites (file date is the day of year of the first day, e.g. A2026257; periods restart on 1 January each year)

coverage:
  short: 전지구
update: New 8-day composites roughly 1–3 weeks after the period ends (VNP15A2H expected to end in November 2026)
license: NASA Earth science open data — free and unrestricted under the EOSDIS Data Use and Citation Guidance; file downloads need a free NASA Earthdata Login; please cite the dataset DOI
account_required: true

summary: >-
  Global leaf area index (LAI) and fraction of absorbed photosynthetically active radiation (FPAR) produced by porting the MODIS LAI/FPAR algorithm to the VIIRS sensor to continue the MODIS record.
  VIIRS red (I1) and near-infrared (I2) reflectances are inverted with sensor-specific 3D radiative-transfer look-up tables, with an empirical NDVI backup when the main algorithm fails.
  It uses the same 500 m sinusoidal tiles and 8-day compositing as MODIS, so the two can be compared directly, and is issued separately for Suomi NPP, NOAA-20 and NOAA-21.

time_convention:
  summary: >-
    Of the daily LAI and FPAR retrievals, the day with the highest FPAR over the 8 days is selected, and that day's FPAR, LAI and quality information are written out (VNP15 ATBD section 3.3.2).
    FPAR is the 8-day maximum, while LAI is the value on the selected day rather than a period mean. The file date is the start of the compositing period.
  points:
    - "All three satellites are in 13:30 local-time ascending orbits, close to Aqua MODIS's original overpass. No VIIRS product continues Terra MODIS's morning observations."
    - "Each satellite has its own product, so VNP15A2H, VJ115A2H and VJ215A2H differ slightly for the same dates. Choose one satellite as the reference when building a time series."
    - "A2026257 in a file name is the 8-day composite starting on day 257 of 2026 (14 September). The selected observation day itself is not recorded in the file."
    - "Compositing restarts on 1 January each year, so the last composite of a year overlaps the first composite of the next."
  source: https://lpdaac.usgs.gov/documents/125/VNP15_ATBD.pdf
  source_name: "VNP15 ATBD V1.1 (2018) + VNP15 User Guide V1.2 (2018) + LP DAAC/CMR collection descriptions"

variables:
  note: >-
    From LP DAAC collection information and the VNP15 User Guide. All three satellite products use the same names, which, unlike MODIS, have no `_500m` suffix.
    Values are stored as unsigned 8-bit integers that must be multiplied by the scale factor, and 249–255 are non-vegetation and fill codes.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp15a2h-002
  groups:
    - name: LAI and FPAR (500 m, 8-day composites)
      kind: instant
      period: Selected day within the compositing period
      items:
        - text: "Fraction of absorbed photosynthetically active radiation (FPAR) — `Fpar` (fraction 0–1, stored value × 0.01)"
          kind: max
          period: 8-day
          note: Value on the day with the highest FPAR in the 8 days
        - text: "Leaf area index (LAI) — `Lai` (m² m-2, stored value × 0.1)"
          note: Value on the selected observation day (the day of maximum FPAR)
        - "FPAR standard deviation — `FparStdDev` (fraction, stored value × 0.01; 248 = not available because the backup algorithm was used)"
        - "LAI standard deviation — `LaiStdDev` (m² m-2, stored value × 0.1; 248 = not available because the backup algorithm was used)"
        - text: "LAI/FPAR quality flags — `FparLai_QC` (bit field)"
          note: "Bits 0–2 SCF_QC (algorithm path), bit 3 dead detector, bits 4–7 biome type — a different layout from MODIS"
        - "Extra quality flags — `FparExtra_QC` (bit field)"

access:
  - name: NASA Earthdata Search — VJ215A2H (NOAA-21, recommended)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2843640489-LPCLOUD
    method: Web search and HTTPS download / earthaccess
    note: >-
      Short names are VJ215A2H (NOAA-21), VJ115A2H (NOAA-20) and VNP15A2H (Suomi NPP), version 002. Files are HDF-EOS5 (.h5) tiles.
      Because Suomi NPP data delivery ends in November 2026, LP DAAC recommends VJ215A2H as primary and VJ115A2H as secondary.
  - name: NASA Earthdata Search — VNP15A2H (Suomi NPP, 2012 onward)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2545314545-LPCLOUD
    method: Web search and HTTPS download / earthaccess
    note: Only the Suomi NPP product covers 2012–2017. Existing files appear to remain downloadable, but no distribution policy for after delivery ends has been announced yet.
  - name: AppEEARS (area and point extraction)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Web and API — area (GeoTIFF, NetCDF4) or point (CSV) extraction with optional reprojection
    note: Delivers just your region without having to handle tiles or the HDF5 structure.

example:
  lang: python
  note: >-
    Downloads NOAA-20 VJ115A2H for July 2024 with earthaccess and reads LAI from the central Korean tile (h28v05). To avoid hard-coding paths inside the HDF-EOS5 file,
    h5py is used to find the datasets named `Lai` and `FparLai_QC`. Unlike MODIS, SCF_QC sits in bits 0–2.
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="VJ115A2H", version="002",
        temporal=("2024-07-01", "2024-07-31"),
        bounding_box=(126.5, 35.5, 128.5, 37.5),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "./vj115a2h")

    def find(h5, name):
        hits = []
        h5.visititems(lambda k, v: hits.append(k) if isinstance(v, h5py.Dataset) and k.endswith("/" + name) else None)
        return h5[hits[0]][()]

    for f in sorted(map(str, files)):
        if ".h28v05." not in f:
            continue
        with h5py.File(f, "r") as h5:
            raw = find(h5, "Lai").astype("float32")
            qc = find(h5, "FparLai_QC")
        lai = np.where(raw <= 100, raw * 0.1, np.nan)   # 249-255 = non-vegetation / fill
        scf = qc & 0b111                                 # 0 or 1 = main (RT) algorithm (bit position differs from MODIS)
        lai[scf > 1] = np.nan
        print(f.split("/")[-1], "mean LAI:", np.nanmean(lai))

tips:
  - "The `FparLai_QC` bit layout differs from MODIS. In VIIRS, bits 0–2 are SCF_QC (0 main algorithm, 1 main algorithm with saturation, 2 and 3 NDVI backup, 4 not produced), bit 3 is dead detector and bits 4–7 are biome. Reusing the MODIS `(qc >> 5) & 7` code ruins the quality screening."
  - "Always remove stored values 249–255 (255 fill, 254 inland water, 253 barren or sparse vegetation, 252 permanent snow and ice, 251 wetland, 250 urban, 249 unclassified) and apply the scale factors (LAI × 0.1, FPAR × 0.01)."
  - "VNP15A2H (Suomi NPP) ends in November 2026. VJ115A2H continues from 2018 and VJ215A2H from 2023, so choose a reference satellite for long-term work in advance and state where the satellite changes."
  - In Boston University's comparison (VIIRS V1), VIIRS differed more from MODIS where reflectance saturates, such as tropical forest, and its main-algorithm success rate varied more between years because of input reflectance issues. Read interannual changes in dense forest together with the quality flags.
  - The biome type in bits 4–7 lets you stratify statistics into forest, grassland, cropland and so on without a separate land-cover product. Note that this is the algorithm's eight-biome input classification, not a general land-cover map.
  - The files are HDF5 (HDF-EOS5), so MODIS pyhdf code will not open them. Use h5py, xarray (h5netcdf) or GDAL.

