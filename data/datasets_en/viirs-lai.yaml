transitions:
  - from: VIIRS LAI/FPAR V1 (VNP15A2H V001)
    to: VIIRS LAI/FPAR V2 (VNP15A2H, VJ115A2H, VJ215A2H V002)
    status: completed
    date: "2023-08"
    summary: >-
      Version 2 (Suomi NPP and NOAA-20) was released in August 2023; V1 production stopped on 17 June 2024 and its distribution ended on 8 April 2025.
      A NOAA-21 product (VJ215A2H) was added to V2 in February 2026.
    changes:
      - aspect: Satellites
        before: "Suomi NPP only (VNP15A2H V001)"
        after: "Suomi NPP (VNP15A2H), NOAA-20 (VJ115A2H, 2018–) and NOAA-21 (VJ215A2H, 2023-02–) — V002"
      - aspect: Availability
        before: "Production ended 2024-06-17, distribution ended 2025-04-08 (User Guide and ATBD remain on DOI pages)"
        after: "The only version available"
      - aspect: File format and variable names
        before: "HDF-EOS5, `Lai`, `Fpar`, etc."
        after: "Unchanged"
    impacts:
      - Re-check results made with V1 using V2. V1 files are no longer available from Earthdata Search, the Data Pool or AppEEARS.
    sources:
      - name: VIIRS Version 2 LAI/FPAR products released (Earthdata notice, 2023-08-21)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-leaf-area-index-fpar-products-released
      - name: VIIRS V1 SR, VI, LAI/FPAR, LST and Active Fires products decommissioned (Earthdata notice, 2025-04-08)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned

notices:
  - date: "2026-08-07"
    level: warning
    title: Suomi NPP data delivery ends in November 2026 — move from VNP15A2H to VJ215A2H or VJ115A2H
    body: >-
      On 3 August 2026 NOAA announced it will permanently stop delivering all Suomi NPP science data, including VIIRS, at 13:00 UTC on 2 November 2026; NASA Earthdata's 7 August notice
      gives 13:00 UTC on 1 November (subject to change). The LP DAAC description of VNP15A2H recommends moving to VJ215A2H (primary) or VJ115A2H (secondary).
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
  - date: "2026-02-20"
    level: info
    title: NOAA-21 VIIRS LAI/FPAR V2 (VJ215A2H) released
    body: >-
      LP DAAC released an additional Version 2 LAI/FPAR product from NOAA-21 (formerly JPSS-2) VIIRS. According to CMR, the record starts on 2023-02-10.
    source: https://earthdata.nasa.gov/data/alerts-outages/additional-viirs-version-2-leaf-area-index-fraction-photosynthetically-active
  - date: "2025-04-08"
    level: info
    title: VIIRS Version 1 LAI/FPAR decommissioned
    body: >-
      LP DAAC stopped distributing VIIRS V1 surface reflectance, LAI/FPAR, land surface temperature and active fire products on 8 April 2025. V1 production had already ended on 17 June 2024,
      and the User Guides and ATBDs remain on the DOI pages. Users were directed to the Suomi NPP and NOAA-20 V2 products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned
  - date: "2023-08-21"
    level: info
    title: VIIRS Version 2 LAI/FPAR (VNP15A2H, VJ115A2H) released
    body: >-
      Version 2 LAI/FPAR 8-day 500 m products from Suomi NPP and NOAA-20 (formerly JPSS-1) were released. Suomi NPP V1 continued to be produced alongside them for a while.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-leaf-area-index-fpar-products-released

