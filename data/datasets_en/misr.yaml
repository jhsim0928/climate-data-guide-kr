notices:
  - date: "2026-03-20"
    level: warning
    title: NASA projects the end of Terra science operations in February 2027
    body: >-
      The editor's note in the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects the end of Terra science operations in February 2027 because of fuel and power limits.
      The article also explains that after inclination adjustments stopped in late 2020, by autumn 2022 the orbit was about 5 km lower and crossing the equator at 10:15 instead of 10:30. The MISR record is tied to this schedule.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2023-11-06"
    key_date: "2023-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: critical
    title: Terra orbit altitude change forces new MISR processing — FINAL L2 and L3 stop at 2022-10-12
    body: >-
      ASDC states that the October 2022 change in Terra's orbit altitude meant orbit tracks no longer follow the fixed 233 WRS-2 paths, requiring a major update to MISR L1 and L2 production.
      Data from 2022-10-14 (orbit 121388) onward are processed with the updates; orbits from 126974 (2023-11-01) were released first and earlier ones are being filled in (the notice itself is undated).
      As checked in CMR on 2026-10-13, FINAL L2 (MIL2ASAE) and L3 have no data after 2022-10-12, while FIRSTLOOK L2 has been back-filled from 2022-10-13 and continues to the present.
    source: https://asdc.larc.nasa.gov/project/MISR
  - date: "2018-02-07"
    level: info
    title: L2 aerosol V23 released — 4.4 km resolution, NetCDF-4
    body: >-
      MISR L2 aerosol moved to V23 (file version F13_0023), raising retrieval resolution to 4.4 km and switching to NetCDF-4. The whole mission was reprocessed as MIL2ASAE V003;
      optical depth is Stage 3 validated and the other particle properties Stage 2.
    source: https://asdc.larc.nasa.gov/documents/misr/quality_summaries/DQS_AEROSOL_V023.20180207.pdf

