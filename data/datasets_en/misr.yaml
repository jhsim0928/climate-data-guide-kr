example:
  lang: python
  note: "Run earthaccess.login() once with a NASA Earthdata account first. For data after October 2022, change short_name to MIL2ASAF and version to 002 (provisional)."
  code: |
    # pip install earthaccess xarray netCDF4 numpy
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="MIL2ASAE", version="003",          # FINAL L2 aerosol V23, 4.4 km
        temporal=("2020-08-01", "2020-08-02"),
        bounding_box=(124, 33, 131, 39),               # around the Korean Peninsula (W, S, E, N)
    )
    files = earthaccess.download(results[:1], "./misr")

    ds = xr.open_dataset(files[0], group="4.4_KM_PRODUCTS")
    aod = ds["Aerosol_Optical_Depth"].where(ds["Aerosol_Optical_Depth"] > -9999)
    print(float(aod.mean()), ds["Latitude"].shape)

tips:
  - "After October 2022 only FIRSTLOOK (provisional) data exist. FIRSTLOOK uses ancillary data from an earlier period, and later orbits come from the new processing system (product version 30). State this when splicing a time series across 2022."
  - "The quality statement says only `Aerosol_Optical_Depth` is Stage 3 validated, while particle properties (Ångström exponent, absorbing, non-spherical and size-resolved AOD) are Stage 2. Particle properties are more reliable when mid-visible AOD exceeds about 0.15."
  - "Known issues: high AOD from unscreened clouds, thin cirrus (optical depth below 0.3) appearing as non-spherical particles, thick plumes screened as cloud, anomalously high values over snow and ice, and no retrievals above AOD 3.0."
  - "Retrievals over Greenland and Antarctica are screened out of the user fields; the guidance is to look at the raw (`_Raw`) fields in the `AUXILIARY` group if needed."
  - "Terra has drifted since late 2020, with an earlier equator crossing time and lower altitude. Orbits after October 2022 no longer line up with the fixed 233 WRS-2 paths, so finding the same location by path number may not work."
  - "Because global coverage takes nine days, a location is not seen every day. When comparing monthly means with daily-global sensors such as MODIS, account for the difference in sampling."

