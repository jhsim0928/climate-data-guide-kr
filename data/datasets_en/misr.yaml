# ─────────────────────────────────────────────────────────────
# MISR (Terra) aerosol — Level 2 V23 (4.4 km) and Level 3 — dataset information file
# Satellite tab (Aerosols and atmospheric composition). Since the October 2022 Terra orbit change, FINAL L2 and L3 production has stopped and only FIRSTLOOK L2 continues.
# Key caveats: projected end of Terra science operations (February 2027) and orbit drift (changing overpass time).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: misr
name: "MISR"
full_name: Terra Multi-angle Imaging SpectroRadiometer (MISR) Level 2 Aerosol (V23, 4.4 km) and Level 3 Component Global Aerosol
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 30
domains: [대기, 에어로졸, 원격탐사]
provider: NASA JPL MISR Science Team / NASA Langley ASDC

status: delayed
status_note: >-
  The standard (FINAL) L2 aerosol product (MIL2ASAE V003, algorithm V23) and the daily and monthly L3 products stop at 12 October 2022, because the change in Terra's orbit altitude required a reworked processing system.
  Since then only the provisional FIRSTLOOK L2 (MIL2ASAF, product version 30) is produced daily (as checked on 2026-10-13, through the 11 October orbits). No schedule for FINAL L2 and L3 processing after October 2022 could be confirmed,
  and NASA projects the end of Terra science operations in February 2027 because of fuel and power limits.

transitions:
  - from: MISR L2 Aerosol V22 (17.6 km)
    to: MISR L2 Aerosol V23 (4.4 km)
    status: completed
    date: "2018-02"
    summary: >-
      V23 raised the aerosol retrieval resolution from 17.6 km to 4.4 km and moved from HDF4 to NetCDF-4; the whole mission was reprocessed as V23 (MIL2ASAE V003).
    changes:
      - aspect: Retrieval resolution
        before: 17.6 km
        after: 4.4 km × 4.4 km
      - aspect: File format
        before: HDF4 stacked-block format
        after: NetCDF-4, with latitude, longitude and time for each retrieval
      - aspect: Field names
        before: V22-specific names
        after: Streamlined names consistent with other satellite products (e.g. `Aerosol_Optical_Depth`)
      - aspect: Algorithm
        before: V22 algorithm
        after: "Additional cloud screening, extra lookup-table AOD grid points below 0.025, veiling-light correction of L1B2 radiances, chlorophyll (underlight) correction over dark water, near-surface wind from MISR glint, standardised land mixture selection and uncertainty"
      - aspect: Validation level
        before: V22 level
        after: "`Aerosol_Optical_Depth` Stage 3 validated; other particle properties Stage 2"
    impacts:
      - Analyses built on V22 files and code need rewriting for V23, since both field names and grid changed.
      - The quality statement reports wider coverage and better agreement with AERONET-DRAGON deployments at 4.4 km, though formal validation of V23 AOD was still ongoing when it was written.
    sources:
      - name: Data Quality Statement for the MISR Level 2 Aerosol Product (V023, 2018-02-07)
        url: https://asdc.larc.nasa.gov/documents/misr/quality_summaries/DQS_AEROSOL_V023.20180207.pdf
      - name: Garay et al. (2020), AMT — introducing the 4.4 km MISR aerosol product
        url: https://doi.org/10.5194/amt-13-593-2020

period:
  start: "2000-02"
  end: present
  note: >-
    FINAL L2 (MIL2ASAE V003) runs from 2000-03-01 to 2022-10-12, daily L3 (MIL3DAEN) to 2022-10-12, and monthly L3 (MIL3MAEN) from February 2000 to September 2022.
    FIRSTLOOK L2 (MIL2ASAF) runs from 2017-11-01 to the present; orbits from 2022-10-13 onward are produced with the new processing system (product version 30), and as checked on 2026-10-13 they extend to the 2026-10-11 orbits.

resolution:
  spatial_short: "4.4 km (0.04°)"
  temporal_short: "1일"
  spatial: >-
    L2: 4.4 km × 4.4 km retrieval grid (orbit swaths in the MISR path/block system) / L3: 0.5° × 0.5° global latitude-longitude grid (MISR_AM1_CGAS files)
  vertical: Single total-column aerosol optical depth (surface to top of atmosphere)
  temporal: >-
    L2: one file per orbit (path and orbit numbers in the file name), global coverage every 9 days / L3: daily, monthly, seasonal (quarterly) and yearly

coverage:
  short: 전지구
  note: "Daytime orbital swath (about 380 km wide); global coverage every 9 days"
update: "FIRSTLOOK L2 daily (as checked on 2026-10-13, the 11 October orbits were produced on the 12th). FINAL L2 and L3 production has been halted since 2022-10-12"
license: Open NASA Earth science data, free and unrestricted. File downloads need a free NASA Earthdata Login; data citation and the ASDC acknowledgement are requested
account_required: true

summary: >-
  MISR on NASA's Terra satellite images each location with nine cameras at angles from nadir to 70.5° fore and aft in four bands (446, 558, 672 and 867 nm), and uses those multi-angle views
  to retrieve aerosol optical depth and particle size, absorption and non-sphericity over land and ocean. Its record since 2000 is widely used alongside MODIS for long-term aerosol change,
  wildfire smoke and dust, and climate model evaluation. Global coverage takes nine days, and since October 2022 the standard (FINAL) products have stopped, leaving only provisional (FIRSTLOOK) data for recent years.

time_convention:
  summary: >-
    L2 values are snapshots at the time Terra passed overhead (morning orbit); L3 values are statistics of those L2 retrievals collected on a 0.5° grid by day, month, season and year.
  points:
    - "Terra is a morning-orbit satellite with a nominal 10:30 local equator crossing, and MISR observes only the sunlit side. NASA says that after inclination manoeuvres stopped in late 2020 the orbit drifted, so by autumn 2022 it was about 5 km lower and crossing the equator at 10:15."
    - "L2 files carry an observation time (`Time`, ±30 s) plus year, month, day, hour and minute fields for each retrieval. When building daily means, distinguish UTC dates from local dates."
    - "FIRSTLOOK is a provisional product processed quickly with ancillary data from an earlier period (the quality statement says the prior year); FINAL is the definitive product. The quality statement asks users to check whether the file name contains FIRSTLOOK."
    - "MISR needs nine days for global coverage. Daily L3 files have many gaps, and the number of observations in monthly means varies strongly by region."
  source: https://asdc.larc.nasa.gov/documents/misr/quality_summaries/DQS_AEROSOL_V023.20180207.pdf
  source_name: MISR L2 Aerosol V23 Data Quality Statement + DPS + NASA 'Terra The End of An Era'

variables:
  note: >-
    L2 field names follow the V23 L2 aerosol Data Product Specification; the main fields sit in the NetCDF group `4.4_KM_PRODUCTS` (raw values in `4.4_KM_PRODUCTS/AUXILIARY`, angles in `GEOMETRY`).
    Optical depth fields refer to 550 nm and the fill value is -9999.0. L3 variable names follow the CGAS Data Product Specification (F15_0032) and sit in the NetCDF group `Aerosol_Parameter_Average`.
  full_list: https://asdc.larc.nasa.gov/documents/misr/DPS_AEROSOL_V023.20180125.pdf
  groups:
    - name: L2 aerosol (MIL2ASAE, MIL2ASAF, 4.4 km)
      kind: instant
      period: overpass time
      items:
        - text: "Aerosol optical depth (550 nm) — `Aerosol_Optical_Depth` (unitless)"
          note: Stage 3 validated — the most reliable field
        - "Optical depth uncertainty — `Aerosol_Optical_Depth_Uncertainty` (unitless)"
        - "Ångström exponent (550–860 nm) — `Angstrom_Exponent_550_860nm` (unitless)"
        - "Absorption aerosol optical depth — `Absorption_Aerosol_Optical_Depth` (unitless)"
        - "Non-spherical aerosol optical depth — `Nonspherical_Aerosol_Optical_Depth` (unitless)"
        - "Optical depth by size (radius < 0.35 µm, 0.35–0.7 µm, > 0.7 µm) — `Small_Mode_Aerosol_Optical_Depth`, `Medium_Mode_Aerosol_Optical_Depth`, `Large_Mode_Aerosol_Optical_Depth` (unitless)"
        - "Observation time — `Time` (seconds, ±30 s)"
    - name: L3 Component Global Aerosol (MIL3DAEN daily / MIL3MAEN monthly, 0.5°)
      kind: mean
      period: Daily / monthly
      items:
        - text: "Column aerosol optical depth (550 nm) mean, standard deviation and sample count — `Aerosol_Optical_Depth`, `Aerosol_Optical_Depth_Standard_Deviation`, `Aerosol_Optical_Depth_Count` (unitless)"
          note: "Dimensions Latitude, Longitude, Optical_Depth_Range (index 0 = all, 1–8 = optical depth bins). The count is a number of samples. Absorbing optical depth `Absorbing_Optical_Depth`, Ångström exponent `Angstrom_Exponent_550_860` and per-band optical depth `Aerosol_Optical_Depth_Per_Band` are also present"
        - text: "Aerosol optical depth by size and shape (mean) — `Small_Mode_Aerosol_Optical_Depth`, `Medium_Mode_Aerosol_Optical_Depth`, `Large_Mode_Aerosol_Optical_Depth`, `Nonspherical_Aerosol_Optical_Depth` (unitless)"
          note: "Summarises the aerosol mixtures chosen in L2 by size (radius < 0.35 µm, 0.35–0.7 µm, > 0.7 µm) and non-sphericity. Each comes with `_Count` and `_Standard_Deviation`. The 'compositional type frequency histogram' in the collection description has no separate variable in the current file format (F15_0032) specification"

