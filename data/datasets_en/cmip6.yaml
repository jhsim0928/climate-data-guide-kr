# ─────────────────────────────────────────────────────────────
# CMIP6 — dataset information file (English edition)
# WCRP Coupled Model Intercomparison Project Phase 6 (DECK + historical + CMIP6-Endorsed MIPs)
# ─────────────────────────────────────────────────────────────
id: cmip6
name: CMIP6
full_name: Coupled Model Intercomparison Project Phase 6
category: model_output
domain: model
group: 전지구 모델 실험
order: 20
domains: [대기, 해양, 해빙, 육지]
provider: WCRP CMIP (coordinated by WGCM) · participating modelling centres · Earth System Grid Federation (ESGF)

status: deprecated
status_note: >-
  As checked on 2026-10-16, all CMIP6 data remain available and CMIP6 is still the largest multi-model archive of climate model output; nothing is
  being deleted. However, the ESGF CMIP6 project closed to further publications on 2025-04-07, and data from its successor, CMIP7, began appearing
  on ESGF on 2026-09-04, so it is marked as "to be superseded". ESGF search is also migrating to new indexes, so search routes and tool defaults are
  changing — see the notices and tips below.

transitions:
  - from: CMIP6
    to: CMIP7
    to_id: cmip7
    status: planned
    date: "2026-09"
    summary: >-
      CMIP7 data started to be published on ESGF on 2026-09-04 (five models from three modelling centres and seven experiments at the time of the
      announcement; 8 models, 5 institutions and 24 experiments when the STAC index items were aggregated on 2026-10-16). Publication is still at an early stage, so CMIP6 remains the main multi-model resource for now. Experiment design, scenarios,
      variable naming and file naming have all changed, so keep the two phases separate rather than pooling them into one ensemble.
    changes:
      - aspect: Experiment design
        before: DECK + CMIP historical + 23 CMIP6-Endorsed MIPs
        after: Expanded DECK (historical, esm-hist, piClim-control, piClim-anthro, piClim-4xCO2 added) + 58 high-priority Assessment Fast Track experiments
      - aspect: Historical period
        before: 1850–2014
        after: 1850-01-01 to 2021-12-31 (172 years)
      - aspect: Future scenarios
        before: SSP scenarios (ssp119, ssp126, ssp245, ssp370, ssp585, etc.), 2015–2100, some extensions
        after: New ScenarioMIP scenarios (scen7-h, hl, m, ml, l, ln, vl; emissions-driven esm-scen7-*), 2022-01-01 to 2100-12-31, extensions (-ext) up to 2500
      - aspect: Data Request
        before: DR6 — about 2,063 variables from 322 experiments; frequency set by MIP tables (Amon, day, etc.)
        after: DR7 v1.2.2.5 — similar overall size to DR6, a Core of 135 Baseline Climate Variables (ESM-BCVs) requested from all experiments, organised by 46 Opportunities
      - aspect: Variable naming
        before: Table + variable (e.g. Amon.tas)
        after: Branded variable + frequency + region (e.g. atmos.tas.tavg-h2m-hxy-u.mon.glb) — frequency is no longer part of the variable definition
      - aspect: File names and directory structure (DRS)
        before: <variable_id>_<table_id>_<source_id>_<experiment_id>_<member_id>_<grid_label>[_<time_range>].nc
        after: <variable_id>_<branding_suffix>_<frequency>_<region>_<grid_label>_<source_id>_<experiment_id>_<variant_label>[_<timeRange>].nc (variant_label instead of member_id)
      - aspect: Grid label
        before: gn (native grid), gr (regridded), gr1–gr9, gm (global mean)
        after: Registered grid number g<N>, a three-digit integer of at least 100 (e.g. g104)
      - aspect: Licence metadata
        before: Mostly CC BY 4.0 (some CC0); the per-model licence page takes precedence over the file attribute
        after: license_id attribute on each dataset, CC-BY-4.0 or CC0-1.0
      - aspect: Search index
        before: ESGF Solr indexes → Globus-based ESGF 1.5 index on US nodes
        after: Next-generation ESGF (ESGF-NG) STAC indexes (discovery.east.esgf.io, discovery.west.esgf.io)
      - aspect: Metadata conventions
        before: CF-1.7 CMIP-6.2
        after: CF-1.11 to CF-1.13 (summary of the CMIP7 collection in the STAC index, 2026-10-16)
    impacts:
      - The CMIP Rapid Evaluation Framework charts CMIP6 and CMIP7 separately because "the ensembles are not directly comparable". Do not mix model generations in a single ensemble mean or spread.
      - Different historical end years (2014 vs 2021) and scenarios (SSPs vs scen7-*) mean future changes cannot be compared directly without aligning baselines and scenarios.
      - From intake-esgf v2026.9.4 the default project is CMIP7. Add project="CMIP6" to existing CMIP6 scripts.
      - Code that parses file names or walks directories assuming tables (Amon, etc.), member_id or gn/gr labels needs updating for CMIP7.
    sources:
      - name: Mackallah et al. (2026), CMIP7 Data Request, GMD 19, 8053–8079
        url: https://doi.org/10.5194/gmd-19-8053-2026
      - name: Dunne et al. (2025), CMIP7 and Fast Track, GMD 18, 6671–6700
        url: https://doi.org/10.5194/gmd-18-6671-2025
      - name: Van Vuuren et al. (2026), ScenarioMIP-CMIP7, GMD 19, 2627–2656
        url: https://doi.org/10.5194/gmd-19-2627-2026
      - name: WCRP CMIP — CMIP7 overview (DECK expansion)
        url: https://wcrp-cmip.org/cmip-phases/cmip7/
      - name: WCRP CMIP — CMIP6 overview (DECK and 23 endorsed MIPs)
        url: https://wcrp-cmip.org/cmip-phases/cmip6/
      - name: CMIP7 Guidance — Updates for Users (first data 2026-09-04, REF note)
        url: https://wcrp-cmip.github.io/cmip7-guidance/docs/Updates_for_Users/
      - name: CMIP7 Guidance — Guidance for users (branded variables)
        url: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Guidance_for_users/
      - name: CMIP7 Guidance — Global Attributes (file names, DRS, grid_label, license_id)
        url: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Global_Attributes/
      - name: CMIP7 Guidance — historical experiment set-up
        url: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Experiment_set_up_and_Forcings/historical/
      - name: CMIP7 Guidance — scen7-m experiment set-up
        url: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Experiment_set_up_and_Forcings/scen7-m/
      - name: CMIP6 Global Attributes, DRS, Filenames and CVs (v6.2.7)
        url: https://wcrp-cmip.github.io/WGCM_Infrastructure_Panel/Papers/CMIP6_global_attributes_filenames_CVs_v6.2.7.pdf
      - name: CMIP6_CVs — grid_label
        url: https://github.com/WCRP-CMIP/CMIP6_CVs/blob/main/CMIP6_grid_label.json
      - name: intake-esgf release v2026.9.4 (CMIP7 default project, STAC indexes)
        url: https://github.com/esgf2-us/intake-esgf/releases/tag/v2026.9.4
      - name: ESGF STAC index — CMIP7 collection
        url: https://discovery.west.esgf.io/collections/CMIP7

period:
  start: "1850-01"
  end: "2100-12"
  note: >-
    Shown for the core experiments: historical covers 1850–2014 and the ScenarioMIP SSP scenarios (ssp119, ssp126, ssp245, ssp370, ssp585, etc.) cover
    2015–2100, with some models extended to 2300 (a few to 2500). Other experiments have other ranges — for example amip is 1979–2014, the DAMIP
    hist-nat and hist-GHG runs are 1850–2020, and idealised experiments such as piControl, 1pctCO2 and abrupt-4xCO2 use model years rather than
    calendar years (CMIP6_CVs experiment list and ESGF index).

resolution:
  spatial_short: "모델마다 다름"
  temporal_short: "1시간 미만"
  spatial: >-
    Varies by model. The nominal_resolution global attribute (CMIP6 CV values from 0.5 km to 10000 km, plus 1x1 degree) indicates the approximate
    output grid resolution; on 2026-10-16 the ORNL index listed the latest historical Amon tas datasets as 250 km (1,198), 100 km (630), 500 km (535),
    10000 km (3) and 50 km (2). grid_label gn means data reported on a model's native grid, gr means data regridded to the data provider's preferred target grid,
    gr1–gr9 mean other regridded grids, and gm means global mean data (CMIP6_CVs grid_label). Ocean and sea-ice variables are usually on the model's
    native curvilinear grid (gn, e.g. ORCA1).
  vertical: >-
    Varies by variable (table) — three-dimensional atmospheric variables in Amon use 19 pressure levels (plev19) and those in the day table use 8
    pressure levels (plev8) (CMOR tables); some tables use plev3, plev27 or model levels (alevel). Three-dimensional ocean variables are on the
    model's vertical levels (lev, in m). Near-surface variables are at 2 m (height2m) or 10 m (height10m).
  temporal: >-
    16 frequencies in CMIP6_CVs — subhrPt (sampled sub-hourly), 1hr, 1hrPt, 1hrCM, 3hr, 3hrPt, 6hr, 6hrPt, day, mon, monPt, monC, yr, yrPt, dec and
    fx (fixed). Frequencies ending in Pt are samples at a specified time point; the others are means over the interval. Most data are monthly (mon)
    and daily (day) means; sub-hourly output exists only for some variables in the CFsubhr and Esubhr tables (point samples at sites or on the grid).

coverage:
  short: 전지구
  note: >-
    Mostly global gridded fields. Some tables differ — ice-sheet tables (ImonAnt, ImonGre, etc.) cover only Antarctica or Greenland, some variables in
    CFsubhr and similar tables are given only at selected sites, and EmonZ, EdayZ and other "Z" tables hold zonal means (latitude–height sections).
update: Closed to new publications (the ESGF CMIP6 project stopped accepting publications on 2025-04-07); published data remain available
license: >-
  CC BY 4.0 under the CMIP6 Terms of Use (version 6.2, 12 October 2022). As of October 2022 all CMIP6 contributing modelling groups relaxed the
  licence on their output, lifting the earlier CC BY-NC-SA and CC BY-SA restrictions. The current licence for each model is listed on the CMIP6
  licence page (of 132 entries, 125 CC BY 4.0 and 6 CC0), which takes precedence over the license global attribute in the netCDF files.
  Data citation, an acknowledgement and a table of models and institutions are required.
account_required: false

summary: >-
  CMIP6 is the sixth phase of the Coupled Model Intercomparison Project, coordinated by the World Climate Research Programme's Working Group on
  Coupled Modelling (WGCM). Modelling centres around the world ran the same experiment protocols and released their output through ESGF. CMIP6
  consists of the DECK and CMIP historical simulations common to all models plus experiments from 23 CMIP6-Endorsed MIPs (ScenarioMIP, DAMIP and
  others), and it underpins the IPCC Sixth Assessment Report. It is the most widely used source for future climate projections, detection and
  attribution, model evaluation, and as input to regional and statistical downscaling and bias adjustment.

time_convention:
  summary: >-
    How each variable treats time is recorded in its cell_methods attribute. Variables in mean tables such as Amon and day are means over the interval
    given by time_bnds ("time: mean"); tasmax and tasmin are daily maxima and minima; and variables in tables whose frequency ends in Pt (3hrPt,
    6hrPt, 1hrPt, subhrPt) are instantaneous samples ("time: point").
  points:
    - "For mean variables the time value is just one instant within the time_bnds interval, not the time the value refers to. In EC-Earth3 historical Amon files, for example, time sits in the middle of the bounds (mid-month), but CF only requires it to be within the interval or at one end, so placement can differ between models. Use time_bnds to decide which month or day a value belongs to."
    - "In Amon, tasmax and tasmin have cell_methods \"time: maximum within days time: mean over days\" (minimum for tasmin), i.e. the monthly mean of daily maxima/minima. In the day table they are the daily maximum and minimum themselves."
    - "The same variable name can mean different things in different tables — in the 3hr table pr is a 3-hour mean, while tas, uas, vas and huss are 3hrPt instantaneous samples (on a time coordinate named time1). Always check table_id and frequency."
    - "Precipitation pr is a mean flux (kg m-2 s-1), not an accumulation. Multiply by 86400 to get mm per day."
    - "The calendar attribute of time (proleptic_gregorian, standard, noleap, 360_day, etc.) differs between models. Even the first time stamp of SSP5-8.5 monthly data in the ESGF index varies (2015-01-16T12, 2015-01-16T00, 2015-01-15T12 and others)."
  source: https://cfconventions.org/cf-conventions/cf-conventions.html#cell-methods
  source_name: CF Conventions chapter 7 (cell boundaries, cell_methods, climatological statistics) + CMIP6 CMOR tables (github.com/PCMDI/cmip6-cmor-tables)

variables:
  note: >-
    Core variables, with units and cell_methods checked against the CMIP6 CMOR tables (PCMDI/cmip6-cmor-tables, data_specs_version 01.00.33), the
    ORNL ESGF index and attributes of actual files. Names are CMOR variable names (as in the files). The same variable appears in several tables
    (frequencies), so include table_id when searching. Not every model provides every variable; the full list is in the CMOR tables and the CMIP6
    Data Request.
  full_list: https://github.com/PCMDI/cmip6-cmor-tables/tree/main/Tables
  groups:
    - name: Monthly atmosphere — surface and single level (Amon)
      kind: mean
      period: Monthly
      items:
        - "Near-surface (2 m) air temperature — `tas` (K)"
        - text: "Monthly mean of daily maximum near-surface air temperature — `tasmax` (K)"
          kind: max
          period: Monthly mean of daily maxima
          note: 'cell_methods "area: mean time: maximum within days time: mean over days"'
        - text: "Monthly mean of daily minimum near-surface air temperature — `tasmin` (K)"
          kind: min
          period: Monthly mean of daily minima
          note: 'cell_methods "area: mean time: minimum within days time: mean over days"'
        - "Precipitation — `pr` (kg m-2 s-1)"
        - "Sea level pressure — `psl` (Pa)"
        - "Near-surface (2 m) specific humidity — `huss` (1)"
        - "Near-surface (2 m) relative humidity — `hurs` (%)"
        - "Eastward near-surface (10 m) wind — `uas` (m s-1)"
        - "Northward near-surface (10 m) wind — `vas` (m s-1)"
        - "Surface downwelling shortwave radiation — `rsds` (W m-2)"
        - "Surface downwelling longwave radiation — `rlds` (W m-2)"
        - "Total cloud cover percentage — `clt` (%)"
    - name: Monthly atmosphere — 19 pressure levels (Amon, plev19)
      kind: mean
      period: Monthly
      items:
        - "Air temperature — `ta` (K)"
        - "Eastward wind — `ua` (m s-1)"
        - "Northward wind — `va` (m s-1)"
        - "Geopotential height — `zg` (m)"
        - "Specific humidity — `hus` (1)"
    - name: Daily atmosphere (day)
      kind: mean
      period: Daily
      items:
        - "Daily mean near-surface (2 m) air temperature — `tas` (K)"
        - text: "Daily maximum near-surface air temperature — `tasmax` (K)"
          kind: max
          note: 'cell_methods "area: mean time: maximum"'
        - text: "Daily minimum near-surface air temperature — `tasmin` (K)"
          kind: min
          note: 'cell_methods "area: mean time: minimum"'
        - "Daily precipitation — `pr` (kg m-2 s-1)"
        - "Sea level pressure — `psl` (Pa)"
        - "Near-surface (2 m) specific humidity — `huss` (1)"
        - "Daily-mean near-surface (10 m) wind speed — `sfcWind` (m s-1)"
        - "Eastward near-surface (10 m) wind — `uas` (m s-1)"
        - "Northward near-surface (10 m) wind — `vas` (m s-1)"
        - "Surface downwelling shortwave radiation — `rsds` (W m-2)"
    - name: Monthly ocean (Omon)
      kind: mean
      period: Monthly
      items:
        - "Sea surface temperature — `tos` (degC)"
        - text: "Sea surface salinity — `sos` (0.001)"
          note: A small number of older files give the unit as psu (ORNL index).
        - "Sea surface height above geoid — `zos` (m)"
        - "Sea water potential temperature — `thetao` (degC)"
        - "Sea water salinity — `so` (0.001)"
    - name: Monthly sea ice (SImon)
      kind: mean
      period: Monthly
      items:
        - "Sea-ice area percentage (ocean grid) — `siconc` (%)"
        - text: "Sea-ice thickness — `sithick` (m)"
          note: >-
            Actual (floe) thickness averaged over the ice-covered part of the cell, not a grid-cell mean (cell_methods "area: time: mean where sea_ice");
            not volume divided by grid area as was done in CMIP5.
        - "Sea-ice mass per area — `simass` (kg m-2)"
    - name: Fixed fields (fx, Ofx)
      kind: static
      items:
        - text: "Grid-cell area for atmospheric grid variables — `areacella` (m2)"
          note: 'Use for area-weighted means of atmospheric-grid variables (cell_methods "area: sum").'
        - "Percentage of the grid cell occupied by land (including lakes) — `sftlf` (%)"
        - "Surface altitude — `orog` (m)"
        - text: "Grid-cell area for ocean variables — `areacello` (m2)"
          note: Use for area weighting of ocean and sea-ice variables (Omon, SImon).
        - "Sea area percentage — `sftof` (%)"
        - "Sea floor depth below geoid — `deptho` (m)"

access:
  - name: ESGF MetaGrid — ORNL (US Globus index)
    url: https://esgf-node.ornl.gov/search
    login: false
    method: Web search → HTTP download, wget script, Globus
    note: >-
      CMIP6 data are available without restriction, so files can be downloaded without logging in (Globus transfers need a free Globus account).
      WCRP also lists search pages at DKRZ, CEDA, NCI and IPSL, but during the transition results from the European nodes (legacy Solr index) and
      the US nodes (Globus index) may differ.
  - name: intake-esgf (Python)
    url: https://intake-esgf.readthedocs.io/en/latest/
    login: false
    method: Python package (search → download and open as xarray, cell measures included automatically)
    note: >-
      Since September 2026 the default project is CMIP7, so add project="CMIP6" to search(). Because of an error in republishing CMIP6 to the STAC
      indexes, some member_id values are wrong; as the documentation recommends, disable the STAC indexes when searching CMIP6 (see the example).
  - name: ORNL ESGF 1.5 index search API (Solr-compatible)
    url: https://esgf-node.ornl.gov/esgf-1-5-bridge
    login: false
    method: REST search API (project, experiment_id, table_id, variable_id, etc. → per-file HTTPS, OPeNDAP and Globus URLs)
    note: Returns responses in the same format as the former ESGF Solr search API. Use latest=true to keep only the latest versions.
  - name: Copernicus Climate Data Store — CMIP6 climate projections
    url: https://cds.climate.copernicus.eu/datasets/projections-cmip6
    login: true
    method: Web form and CDS API (spatial and temporal subsetting, NetCDF4 CF-1.7)
    note: >-
      Daily and monthly data for 46 main variables from historical (1850–2014) and SSP (2015–2100) experiments only. Subsetting is computed on the
      ESGF nodes where the data are stored. A CDS account and acceptance of the dataset's terms of use are required.
  - name: Pangeo/ESGF cloud copy — Google Cloud (gs://cmip6) and AWS (s3://cmip6-pds)
    url: https://pangeo-data.github.io/pangeo-cmip6-cloud/
    login: false
    method: Cloud Zarr (catalog https://storage.googleapis.com/cmip6/pangeo-cmip6.json, open with intake-esm)
    note: >-
      Zarr copies of a subset of core CMIP6 data. The documentation warns that the AWS copy mechanism is broken, so the S3 data may be out of sync
      with Google Cloud, and that a new version (Pangeo-ESGF CMIP6 Zarr Data 2.0, leap-stc/cmip6-leap-feedstock) is in beta testing. The -noQC
      catalogs include errata status.
  - name: AWS Open Data — CMIP6 (Zarr cmip6-pds, NetCDF esgf-world)
    url: https://registry.opendata.aws/cmip6/
    login: false
    method: S3 (--no-sign-request), Zarr (us-west-2) and original NetCDF (us-east-2)
    note: Managed by ESGF and Pangeo. A file list for the NetCDF copy is at https://cmip6-nc.s3.amazonaws.com/esgf-world.csv.gz.

example:
  lang: python
  note: >-
    ESGFCatalog search as in the intake-esgf documentation. Because the default project is now CMIP7, project="CMIP6" is set, and the STAC indexes
    are switched off while searching CMIP6, as the documentation recommends (searching the default Globus index).
  code: |
    # pip install intake-esgf
    import intake_esgf
    from intake_esgf import ESGFCatalog

    stac_off = {"discovery.west.esgf.io": False, "discovery.east.esgf.io": False}
    with intake_esgf.conf.set(indices=stac_off):
        cat = ESGFCatalog()
        cat.search(
            project="CMIP6",
            experiment_id="historical",
            source_id="CanESM5",
            member_id="r1i1p1f1",
            table_id="Amon",
            variable_id="tas",
        )
        print(cat)                    # check the datasets found
        dsd = cat.to_dataset_dict()   # downloads to the local cache, returns a dict of xarray Datasets

    ds = dsd["tas"]
    print(ds["tas"].attrs.get("cell_methods"), ds.time.encoding.get("calendar"))

tips:
  - >-
    A single variable arrives as many files, split by model, experiment, member, grid, version and time chunk. File names follow
    <variable_id>_<table_id>_<source_id>_<experiment_id>_<member_id>_<grid_label>_<time_range>.nc (e.g. tas_Amon_EC-Earth3_historical_r1i1p1f1_gr_188201-188212.nc,
    one file per year), and the version (vYYYYMMDD) is part of the directory path. For an availability table and scripts to download and merge many
    models and members at once, see this site's "Model data download" page (/model-data/).
  - >-
    Calendars differ between models (proleptic_gregorian, standard, noleap, 360_day, etc.). Decode times with cftime when opening with xarray, and
    weight monthly or annual means by the length of time_bnds. 360_day models have a 30 February, and noleap models have no 29 February.
  - >-
    Member labels r<k>i<l>p<m>f<n> give the realization, initialization, physics and forcing indices. A different f index (e.g. f2) means a different
    forcing configuration (on 2026-10-16 the ORNL index listed UKESM1-0-LL historical with f2 and f3 members only, no r1i1p1f1), and the differences
    may not be clearly recorded in the variant_info attribute, so check ES-DOC. In DCPP prediction experiments the member_id is prefixed by the
    sub_experiment_id (initialisation year), e.g. s1960-r1i1p1f1.
  - >-
    gn is the model's native grid and gr is regridded output. The same model and variable may exist on both, so pick one. For area means, use the
    same model's and grid's areacella (atmosphere) or areacello (ocean) instead of cos(latitude). When putting several models on a common grid, use
    conservative regridding (e.g. xESMF "conservative"); curvilinear ocean grids need cell-corner coordinates.
  - >-
    When an error is found, the dataset is retracted and republished as a new version. Before analysis check that you have the latest version and
    look at the ESGF Errata Service (errata.esgf.io), and report the dataset version (or the download date if no version is available) in papers.
  - >-
    ESGF is retiring the old Solr index and moving to new STAC indexes. During the transition, results can differ between nodes, and some CMIP6
    records in the STAC indexes have the sub_experiment_id wrongly prepended to the member_id (e.g. s2000-r1i1p1f1 instead of r1i1p1f1). Scripts
    that used old Solr endpoints (e.g. esgf-node.llnl.gov) may fail since the LLNL node was shut down on 2025-07-29.
  - >-
    The license attribute inside some files still shows an old value (e.g. CC BY-SA 4.0). The Terms of Use state that the CMIP6 licence page takes
    precedence over the file attribute, so check the current licence there.
  - >-
    Do not pool CMIP6 and CMIP7 in one ensemble. Historical end years, scenarios and forcings differ, and the CMIP Rapid Evaluation Framework charts
    the two ensembles separately. Tool defaults such as intake-esgf have switched to CMIP7, so set project="CMIP6" explicitly when searching CMIP6.

citations:
  dataset:
    - label: CMIP6 model output data citation (required)
      text: >-
        Following the CMIP6 Data Citation Guidelines, cite the model output either at the fine level (one model, one experiment) or the coarse level
        (one model, one MIP), including the dataset version (or the latest download date if no version is available). Citation text and DOIs for each
        dataset are available from the WDC-Climate (DKRZ) citation service.
        Example: EC-Earth Consortium (EC-Earth) (2019). EC-Earth-Consortium EC-Earth3 model output prepared for CMIP6 CMIP historical.
        Version YYYYMMDD. Earth System Grid Federation. https://doi.org/10.22033/ESGF/CMIP6.4700
  papers:
    - label: CMIP6 experimental design overview (recommended citation)
      text: >-
        Eyring, V., Bony, S., Meehl, G. A., Senior, C. A., Stevens, B., Stouffer, R. J., and Taylor, K. E. (2016):
        Overview of the Coupled Model Intercomparison Project Phase 6 (CMIP6) experimental design and organization.
        Geoscientific Model Development, 9, 1937–1958.
      doi: 10.5194/gmd-9-1937-2016
      bibtex: |
        @article{eyring2016cmip6,
          author  = {Eyring, V. and Bony, S. and Meehl, G. A. and Senior, C. A. and Stevens, B. and Stouffer, R. J. and Taylor, K. E.},
          title   = {Overview of the Coupled Model Intercomparison Project Phase 6 ({CMIP6}) experimental design and organization},
          journal = {Geoscientific Model Development},
          volume  = {9},
          number  = {5},
          pages   = {1937--1958},
          year    = {2016},
          doi     = {10.5194/gmd-9-1937-2016}
        }
    - label: ScenarioMIP paper — when using SSP scenario data
      text: >-
        O'Neill, B. C., Tebaldi, C., van Vuuren, D. P., Eyring, V., Friedlingstein, P., Hurtt, G., Knutti, R., Kriegler, E., Lamarque, J.-F.,
        Lowe, J., Meehl, G. A., Moss, R., Riahi, K., and Sanderson, B. M. (2016): The Scenario Model Intercomparison Project (ScenarioMIP) for CMIP6.
        Geoscientific Model Development, 9, 3461–3482.
      doi: 10.5194/gmd-9-3461-2016
      bibtex: |
        @article{oneill2016scenariomip,
          author  = {O'Neill, B. C. and Tebaldi, C. and van Vuuren, D. P. and Eyring, V. and Friedlingstein, P. and Hurtt, G. and Knutti, R. and Kriegler, E. and Lamarque, J.-F. and Lowe, J. and Meehl, G. A. and Moss, R. and Riahi, K. and Sanderson, B. M.},
          title   = {The Scenario Model Intercomparison Project ({ScenarioMIP}) for {CMIP6}},
          journal = {Geoscientific Model Development},
          volume  = {9},
          number  = {9},
          pages   = {3461--3482},
          year    = {2016},
          doi     = {10.5194/gmd-9-3461-2016}
        }
  acknowledgement: >-
    The CMIP6 Terms of Use (6.2) ask publications to include an acknowledgment with language similar to:
    "We acknowledge the World Climate Research Programme, which, through its Working Group on Coupled Modelling, coordinated and promoted CMIP6.
    We thank the climate modeling groups for producing and making available their model output, the Earth System Grid Federation (ESGF) for archiving
    the data and providing access, and the multiple funding agencies who support CMIP6 and ESGF."
    They also require a table of the models and institutions used (with official CMIP6 names) and ask authors to register articles in the CMIP6
    publications database once a DOI is assigned.

notices:
  - date: "2026-09-28"
    level: warning
    title: CMIP6 STAC publishing error — some member_id values wrong
    body: >-
      intake-esgf v2026.9.28 added a warning about a CMIP6 STAC publishing error. According to the intake-esgf documentation, republishing CMIP6 to the
      new STAC indexes left some records with the sub_experiment_id prepended to the member_id (e.g. s2000-r1i1p1f1 instead of r1i1p1f1), and users
      are advised to disable the STAC indexes for CMIP6 searches until this is resolved.
    source: https://github.com/esgf2-us/intake-esgf/releases/tag/v2026.9.28
  - date: "2026-09-04"
    level: info
    title: First CMIP7 data on ESGF
    body: >-
      The first CMIP7 datasets are available on ESGF. At the time of the announcement, data had been published from five models across three
      modelling centres, covering seven experiments, with more expected over the coming months.
    source: https://wcrp-cmip.github.io/cmip7-guidance/docs/Updates_for_Users/
  - date: "2026-09-04"
    level: warning
    title: intake-esgf default project changed to CMIP7 — add project="CMIP6" to CMIP6 scripts
    body: >-
      From intake-esgf v2026.9.4 the default_project is CMIP7, and the default indexes are the Globus-based ESGF 1.5 index (CMIP3–6) plus the East
      and West STAC-based indexes for CMIP7. Adding project="CMIP6" to a search preserves the previous behaviour. Users with saved custom
      configurations may need to reset them.
    source: https://github.com/esgf2-us/intake-esgf/releases/tag/v2026.9.4
  - date: "2025-07-29"
    level: warning
    title: LLNL ESGF node shut down — search results may differ between nodes
    body: >-
      The LLNL ESGF node was shut down. ESGF is in a transition period with two separate systems, so some services may be unavailable, and results
      from the US nodes (ORNL etc., Globus index) and from DKRZ, IPSL and CEDA (legacy Solr index) may differ.
    source: https://wcrp-cmip.org/esgf-information/
  - date: "2025-04-07"
    level: warning
    title: ESGF CMIP6 project closed to new publications
    body: >-
      To free resources for CMIP7 infrastructure, the ESGF CMIP6 project was closed to further publications. All CMIP6 data remain available, and
      CMIP6Plus, obs4MIPs, input4MIPs and other small projects are not affected. New DECK-like experiments can be published to CMIP6Plus.
    source: https://wcrp-cmip.org/esgf-information/
  - date: "2022-10-12"
    level: info
    title: Licence relaxed for all CMIP6 model output (CC BY 4.0)
    body: >-
      Version 6.2 of the Terms of Use states that as of October 2022 all CMIP6 contributing modelling groups relaxed the licence on their output,
      lifting the earlier CC BY-NC-SA and CC BY-SA restrictions; the CMIP6 licence page takes precedence over the license attribute in the files.
    source: https://pcmdi.llnl.gov/CMIP6/TermsOfUse/TermsOfUse6-2.html

