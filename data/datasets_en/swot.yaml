transitions:
  - from: SWOT KaRIn Version C
    to: SWOT KaRIn Version D
    status: completed
    date: "2025-05"
    summary: >-
      A release that fixes known Version C issues through updated processing algorithms, calibration parameters and some geophysical models. Tide models, the mean sea surface and the MDT were replaced,
      a geoid error of order 10 cm was fixed, and the whole record since 2023-03 was reprocessed as Version D.
    changes:
      - aspect: Collection and DOI
        before: "SWOT_L2_LR_SSH_2.0 (10.5067/SWOT-SSH-2.0)"
        after: "SWOT_L2_LR_SSH_D (10.5067/SWOT-SSH-D)"
      - aspect: CRID in file names
        before: "PGC0 (reprocessing, 2023-03-30 to 2024-01-25), PIC0 (2024-01-25 to 10-15), PIC2 (2024-10-16 to early 2025-05)"
        after: "PGD0 (reprocessing, 2023-03 to 2025-05), PID0 (forward, from 2025-05-06)"
      - aspect: Ocean and load tide models
        before: FES2014
        after: "FES2022b; a non-equilibrium long-period ocean tide is now applied to SSHA"
      - aspect: Mean sea surface (MSS)
        before: "CNES/CLS 2022, DTU 2018"
        after: "CNES/CLS/SIO/DTU Hybrid 2023, DTU2021"
      - aspect: Mean dynamic topography (MDT)
        before: CNES/CLS 2022
        after: CNES/CLS 2024
      - aspect: Calibration
        before: "-"
        after: "Refined KaRIn height calibration (short-wavelength changes of order 5 mm), sigma0 about 2.5 dB lower, updated radiometer (AMR) calibration reducing the side-to-side bias to under 0.2 mm"
      - aspect: Other
        before: "-"
        after: "Geoid fix (errors of order 10 cm), updated crossover processing, new variables such as unsmoothed SSHA posting, Doppler mitigation and a spacecraft event flag (Expert)"
    impacts:
      - Do not mix Version C and D files in one time series. Changes in tides, MSS and MDT shift the SSHA and ADT mean fields.
      - "Sigma0 is about 2.5 dB lower, so empirical relations built on sigma0 (wind speed, ice detection and the like) need refitting."
      - "Where both PID0 and PGD0 exist, use PGD0; when a pass has several counters, use the highest."
    sources:
      - name: PO.DAAC — Version C to D transition complete (2025-05-21)
