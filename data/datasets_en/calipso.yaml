notices:
  - date: "2025-10-01"
    level: warning
    title: V5.00 released — full 2006–2023 reprocessing replaces V4.51
    body: >-
      The CALIPSO team released V5.00, reprocessing all Level 1, 2 and 3 products (release date 2025-10-01 per the quality summaries; the CMR citation lists 2025-12-12).
      Stronger low-energy-shot handling and revised Level 3 screening change the values, so run new analyses with V5.00 and do not mix it with earlier versions.
    source: https://asdc.larc.nasa.gov/documents/calipso/quality_summaries/cal_lid_l2_pro_v5-00_desc_qs.pdf
  - date: "2023-09-26"
    level: critical
    title: CALIPSO science mission ended — last observations 2023-06-30
    body: >-
      NASA and CNES ended the CALIPSO science mission on 1 August 2023. With its fuel exhausted the orbit was decaying and the spacecraft could no longer
      generate enough power to run the science instruments; the standard products end with observations on 30 June 2023. The spacecraft was passivated in December 2023.
    source: https://www.nasa.gov/missions/calipso/first-long-duration-lidar-satellite-mission-calipso-ends/

