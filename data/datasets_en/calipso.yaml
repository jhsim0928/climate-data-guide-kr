example:
  lang: python
  note: >-
    Downloads a V5.00 Level 2 aerosol profile file with earthaccess and reads it with pyhdf. The first run asks for your Earthdata credentials.
    CALIPSO files are HDF4, which xarray cannot open directly.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="CAL_LID_L2_05kmAPro-Standard-V5-00", version="V5-00",
        temporal=("2021-03-15", "2021-03-16"),
        bounding_box=(115, 30, 135, 45),          # (west, south, east, north) — East Asia
    )
    files = earthaccess.download(results[:1], "./calipso")

    f = SD(files[0], SDC.READ)
    ext = f.select("Extinction_Coefficient_532")[:].astype(float)   # (profiles, 399 altitudes), km-1
    qc = f.select("Extinction_QC_Flag_532")[:]
    cad = f.select("CAD_Score")[:]
    alt = f.select("Lidar_Data_Altitudes")[:]                       # a dataset from V5.00 on (km)
    ext[ext < 0] = np.nan                                          # drop -9999, -333, -111 and other special values
    print(ext.shape, alt[:3], np.nanmax(ext))

tips:
  - "Do not average extinction as is. First remove special values such as -9999 (no particulates), -333 (retrieval failed), -111 (low energy) and -444 (suspect cloud clearing), low-confidence features with `CAD_Score` between −20 and 0, and rejected `Extinction_QC_Flag_532` values."
  - "`CAD_Score` is negative for aerosol and positive for cloud. A magnitude of 20 or less means low confidence."
  - "Below fully attenuating cloud or dust layers there is no signal, so the column optical depth only reaches the base of the lowest visible layer. Ignoring opacity leads to underestimated AOD."
  - "CALIOP AOD is at 532 nm and depends on the assumed lidar ratio. When comparing with MODIS or AERONET (550 or 500 nm), consider both the wavelength difference and the lidar-ratio uncertainty."
  - "Daytime data are noisy and easily miss tenuous aerosol layers. Climatologies and trends are often checked against night-time data first."
  - "In the South Atlantic Anomaly, radiation noise and low-energy shots cut V5.00 Level 3 samples by 80–100%, leaving many fill cells."
  - "The V4.20 data description lists the tropospheric AOD as `Column_Optical_Depth_Aerosols_532`. If you also use older files, check the SDS names for each version."
  - "After the orbit was lowered from 705 km to 688 km in September 2018 to form the C-Train with CloudSat, CALIPSO no longer followed the A-Train (Aqua, Aura) track. Re-check space-time collocation distances for MODIS or OMI matchups after that date."

