transitions:
  - from: ESA CCI SM v08.1
    to: ESA CCI SM v09.x (v09.1 → v09.2)
    status: completed
    summary: >-
      v09.1 introduced the first end-to-end, error-propagation-based uncertainty, a new way of combining multiple SMOS incidence angles and an updated COMBINED rescaling, and extended the record to end-2023.
      v09.2 extends v09.1 to end-2024 without algorithm changes. C3S version v202505 corresponds to this 'CCI algorithm version 9'.
    changes:
      - aspect: Period (PASSIVE/COMBINED / ACTIVE)
        before: "v08.1 1978-11 to 2022-12 / 1991-01 to 2022-12 (per the FAQ)"
        after: "v09.1 to 2023-12; v09.2 1978-11-01 to 2024-12-31 / 1991-08-05 to 2024-12-31"
      - aspect: Uncertainty
        before: "Mainly input error estimates"
        after: "First end-to-end uncertainty budget (error propagation)"
      - aspect: PASSIVE processing
        before: "Previous approach"
        after: "New method for combining multiple SMOS incidence angles; improved brightness-temperature merging"
      - aspect: COMBINED rescaling
        before: "Previous approach"
        after: "Updated rescaling methodology"
      - aspect: Published on CEDA
        before: "v08.1 (2023)"
        after: "v09.1 2024-10; v09.2 2025-12-03"
    impacts:
      - When switching versions, download the past record again; values for the same date differ between versions.
      - The definition of `sm_uncertainty` changed, so do not compare it directly with error estimates from v08 or earlier.
    sources:
      - name: ESA CCI Soil Moisture project page
        url: https://climate.esa.int/en/projects/soil-moisture/
      - name: ESA news — v09.1 release
        url: https://climate.esa.int/en/news-events/New-upgrade-to-ESACCI-SoilMoisture-Dataset-v091/
      - name: CEDA — COMBINED v09.2 catalogue record
        url: https://catalogue.ceda.ac.uk/uuid/d4e66299f5054129b8076fb7502949e1

notices:
  - date: "2025-12-12"
    level: info
    title: C3S soil moisture (CDS) surface soil moisture variables renamed
    body: >-
      The CDS Known issues list reports that the two surface soil moisture variables (volumetric and saturation) of the C3S soil moisture product were renamed for clarity.
      Scripts using the CDS API must be updated with the new names shown in the download form. This does not affect the `sm` variable in the ESA CCI SM files on CEDA.
    source: https://cds.climate.copernicus.eu/datasets/satellite-soil-moisture?tab=documentation
  - date: "2025-12-03"
    level: info
    title: ESA CCI SM v09.2 released (extended to end-2024)
    body: >-
      ACTIVE, PASSIVE and COMBINED v09.2 were published on CEDA. v09.2 extends v09.1 in time to 2024-12-31, with an updated Product User Guide (PUG) and validation report (PVIR).
      The dataset DOIs were registered on 2026-04-13.
    source: https://catalogue.ceda.ac.uk/uuid/d4e66299f5054129b8076fb7502949e1
  - date: "2024-10"
    level: info
    title: ESA CCI SM v09.1 released — first uncertainty budget
    body: >-
      v09.1 extended the record to end-2023, provided an error-propagation-based uncertainty for the first time, and improved the COMBINED rescaling and PASSIVE brightness-temperature merging.
    source: https://climate.esa.int/en/news-events/New-upgrade-to-ESACCI-SoilMoisture-Dataset-v091/

