# ─────────────────────────────────────────────────────────────
# GLEAM — dataset information file
# Listed under the Land tab, 'Evapotranspiration'. The GLEAM v3 → GLEAM4 and GLEAM4.2 → 4.3 version changes are in this file's transitions (no to_id).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gleam
name: "GLEAM4"
full_name: Global Land Evaporation Amsterdam Model (GLEAM) 4.3 (satellite-based global land evaporation and soil moisture, 0.1°, daily)
category: analysis
domain: land
group: 증발산
order: 10
domains: [육지, 수문, 원격탐사]
provider: Ghent University (Diego G. Miralles group)

status: active
status_note: >-
  The server currently holds GLEAM4.3a (1980–2024, satellite and reanalysis forcing) and GLEAM4.3b (2003 onward, satellite forcing). A news item of 2026-09-21
  says 4.3b now runs to the end of 2025, but the dataset description on the same page still says end-2024. Old versions are removed from the server when a new one is released,
  so 4.2 and earlier are available only on request.

period:
  start: "1980-01"
  end: "2025-12"
  note: >-
    4.3a covers 1980-01-01 to 2024-12-31 (44 years). 4.3b starts on 2003-01-01; the news item (2026-09-21) says it runs to the end of 2025, while the dataset description says 2024-12-31.
    Records are normally extended to the previous year around April, but on 2026-10-13 4.3a still ended in 2024.

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "1일"
  spatial: >-
    0.1° regular latitude-longitude grid, 1800 latitudes × 3600 longitudes (first cell centred at 89.95°N, 179.95°W). Land only; ocean cells are empty.
    Inputs not already at 0.1° were resampled by bilinear interpolation.
  vertical: Single-level surface fluxes + two soil moisture variables (surface SMs, root zone SMrz). From 4.3 the first two soil layers are set to 5 cm and 95 cm
  temporal: Daily (monthly and yearly files also provided)

update: Annually (usually extended to the previous year around April; users are notified by email of new releases)
license: CC BY 4.0 (per the Zenodo technical note). Free for research; commercial use requires internal approval by the GLEAM team
account_required: true

summary: >-
  GLEAM is a set of algorithms — and the resulting datasets — that estimate land evaporation and its components (transpiration, interception loss, bare-soil evaporation,
  sublimation, open-water evaporation) from satellite observations of radiation, precipitation, temperature, soil moisture and vegetation. The fourth generation, GLEAM4,
  moves to 0.1° and adds evaporative stress learned from eddy-covariance and sap-flow data, Penman-based potential evaporation and plant access to groundwater.
  Two archives with different forcing are provided — 'a' (1980 onward, satellite and reanalysis) and 'b' (2003 onward, mostly satellite).

time_convention:
  summary: >-
    Evaporation components in the daily files are daily totals (mm/day); the monthly and yearly files sum them to mm/month and mm/year.
    The documentation does not define the day boundary (e.g. UTC) or whether state variables such as soil moisture are daily means or values at a given time.
  points:
    - "Evaporation (E etc.) is a water depth in mm. To get latent heat flux (W m-2), multiply by the latent heat of vaporization."
    - "Negative values indicate net condensation (usually when surface net radiation is negative); missing data are -999."
    - "Evaporative stress S is the ratio E/Ep (0 = maximum stress, 1 = no stress)."
    - "Monthly (_MO) files are in mm/month and yearly (_YR) files in mm/year, unlike the daily files (mm/day)."
  source: https://www.nature.com/articles/s41597-025-04610-y
  source_name: Miralles et al. (2025) GLEAM4 paper, Data Records + gleam.eu FAQ

variables:
  note: >-
    The 12 variables listed in the GLEAM4 paper (Data Records) and on gleam.eu. There is one file per variable per year, named <VARIABLE>_<YEAR>_GLEAM_<version>.nc (monthly and yearly files add _MO or _YR).
    From 4.2a the aerodynamic and radiative components of potential evaporation are also provided, but their variable names could not be confirmed and are not listed.
  full_list: https://www.gleam.eu/
  groups:
    - name: Evaporation components (daily totals)
      kind: accum
      period: Daily
      items:
        - "Actual evaporation (total evapotranspiration) — `E` (mm/day)"
        - "Transpiration — `Et` (mm/day)"
        - "Interception loss — `Ei` (mm/day)"
        - "Bare-soil evaporation — `Eb` (mm/day)"
        - "Snow sublimation — `Es` (mm/day)"
        - "Surface condensation — `Ec` (mm/day)"
        - "Open-water evaporation — `Ew` (mm/day)"
        - "Potential evaporation — `Ep` (mm/day)"
    - name: Stress and heat flux (daily)
      kind: mean
      period: Daily
      items:
        - text: "Evaporative stress — `S` (unitless, 0–1)"
          note: Ratio E/Ep
        - "Sensible heat flux — `H` (W m-2)"
    - name: Soil moisture (daily model state)
      kind: instant
      items:
        - text: "Surface soil moisture — `SMs` (m3 m-3)"
          note: One value per day. The documentation does not say whether it is a daily mean or a value at a specific time
        - text: "Root-zone soil moisture — `SMrz` (m3 m-3)"
          note: One value per day. The documentation does not say whether it is a daily mean or a value at a specific time

access:
  - name: GLEAM website (registration, then SFTP)
    url: https://www.gleam.eu/
    method: Register on the web → connect by SFTP (port 2225) with the credentials sent by email
    note: >-
      Enter your first name, last name and email under Downloads, and login details are emailed to you (if nothing arrives within an hour, check spam and then contact info@gleam.eu).
      Connect with SFTP, not plain FTP, and make sure your firewall does not block port 2225. A detailed README is on the server.
  - name: Older versions (on request)
    url: https://www.gleam.eu/
    method: Email request
    note: Old versions are removed from the server when a new one is released. If you need one (for example to reproduce a paper), it may be provided upon reasonable request.

example:
  lang: python
  note: >-
    Fill in the SFTP host, username and password from the registration email. The directory layout follows the v4.2a example in the paper
    (v4.2a/daily/2023/E_2023_GLEAM_v4.2a.nc); check the README on the server for the actual paths.
  code: |
    # pip install paramiko xarray netCDF4
    import paramiko
    import xarray as xr

    HOST, PORT = "<host from the email>", 2225
    USER, PASSWORD = "<username>", "<password>"

    transport = paramiko.Transport((HOST, PORT))
    transport.connect(username=USER, password=PASSWORD)
    sftp = paramiko.SFTPClient.from_transport(transport)
    print(sftp.listdir("."))                      # check the version folder names first
    remote = "v4.3a/daily/2024/E_2024_GLEAM_v4.3a.nc"   # example path
    sftp.get(remote, "E_2024_GLEAM_v4.3a.nc")
    sftp.close(); transport.close()

    ds = xr.open_dataset("E_2024_GLEAM_v4.3a.nc")
    e = ds["E"].sel(lat=slice(39, 33), lon=slice(124, 132))   # latitude runs north to south
    print(e.sum("time").mean().values)            # area-mean 2024 annual evaporation (mm)

tips:
  - "Archives 'a' and 'b' share the method but use different forcing (per the GLEAM4 paper, a: MSWX meteorology and MSWEP precipitation; b: IMERG precipitation, AIRS temperature, CERES radiation). Use 'a' for long climate records and 'b' for a shorter, more observation-based record, and do not mix them."
  - When a new version is released the old one is removed from the server and past values change. Record the version you downloaded (e.g. v4.3a) and state it in your paper.
  - Evaporation is not measured directly from space; GLEAM values are model estimates. When comparing with eddy-covariance towers, the team notes footprint mismatch (~1 km vs ~10 km pixels), energy-balance non-closure and unreliable measurements during rain, and recommends masking rain and interception periods.
  - Component partitioning differs strongly between versions. In GLEAM4 transpiration makes up about 62% of global evaporation, down from about 74% in v3.
  - No uncertainty (error) estimates are provided with the data.
  - "GLEAM4 assimilates ESA CCI surface soil moisture, so GLEAM soil moisture and ESA CCI SM are not independent when compared."
  - "Forcing data and static parameters are not hosted on the GLEAM server; get them from their original portals (see the README and Miralles et al. 2025)."

