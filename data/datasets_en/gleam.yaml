transitions:
  - from: GLEAM v3 (e.g. v3.8a)
    to: GLEAM4 (v4.1–4.2)
    status: completed
    date: "2024-07"
    summary: >-
      The fourth generation raises the resolution from 0.25° to 0.1°, reworks potential evaporation, interception and evaporative stress, and adds plant access to groundwater.
      Component partitioning changed substantially (global transpiration fraction 74% → 62%), so v3 results must not be compared directly with, or appended to, GLEAM4.
    changes:
      - aspect: Horizontal resolution
        before: "0.25°"
        after: "0.1° (1800 × 3600)"
      - aspect: Potential evaporation
        before: "Priestley–Taylor (radiation-driven)"
        after: "Penman equation — includes wind, vegetation height and VPD (aerodynamic term)"
      - aspect: Interception loss
        before: "Tall vegetation only"
        after: "van Dijk–Bruijnzeel-based model constrained by satellite vegetation data, computed separately for tall and short vegetation"
      - aspect: Evaporative stress
        before: "Soil moisture and vegetation optical depth (VOD) formulation"
        after: "Deep neural network trained on eddy-covariance and sap-flow data (replaced by XGBoost in 4.3)"
      - aspect: Groundwater
        before: "Not represented"
        after: "Plant access to groundwater via a linear reservoir model"
      - aspect: Period and archives
        before: "v3a 1980–, v3b 2003–, v3c 2011– (per the v3 paper)"
        after: "a 1980–, b 2003– (no 'c' archive)"
      - aspect: Global transpiration fraction
        before: "About 74%"
        after: "About 62%"
    impacts:
      - Do not mix v3 climatologies or trends with GLEAM4, especially for component-level analyses such as transpiration and bare-soil evaporation.
      - The grid changed, so regrid to a common grid before cell-by-cell comparison.
    sources:
      - name: Miralles et al. (2025), GLEAM4, Scientific Data
        url: https://doi.org/10.1038/s41597-025-04610-y
      - name: Martens et al. (2017), GLEAM v3, Geoscientific Model Development
        url: https://doi.org/10.5194/gmd-10-1903-2017
      - name: GLEAM website
        url: https://www.gleam.eu/
  - from: GLEAM4.2 (4.2a and 4.2b)
    to: GLEAM4.3 (4.3a and 4.3b)
    status: completed
    summary: >-
      Within the GLEAM4 framework, 4.3 changes how evaporative stress is learned, fixes the soil-layer depths and represents irrigation explicitly. 4.2 was removed from the server when 4.3 was released.
    changes:
      - aspect: Evaporative stress model
        before: "Deep neural network"
        after: "XGBoost, with a monotonic plant-available-water (PAW)–stress relationship enforced during training"
      - aspect: Soil layers
        before: "Multi-layer water balance (depths not stated in the paper)"
        after: "First and second layers set to 5 cm and 95 cm"
      - aspect: Irrigation
        before: "Not represented"
        after: "Irrigation represented explicitly (related paper under review)"
      - aspect: Period available
        before: "4.2a 1980–2023 (paper), later extended to 2024; 4.2b 2003–"
        after: "4.3a 1980–2024; 4.3b 2003–2025 (per the 2026-09-21 news item)"
    impacts:
      - Do not join 4.2 and 4.3 into one series; download the full record again as 4.3.
      - In irrigated regions (e.g. the North China Plain, northern India) 4.3 evaporation can differ markedly from 4.2, so state the version in regional analyses.
    sources:
      - name: GLEAM website (Datasets and News)
        url: https://www.gleam.eu/

notices:
  - date: "2026-09-21"
    level: info
    title: GLEAM4.3b released (through end-2025)
    body: >-
      GLEAM4.3b was released on the server and is said to cover up to the end of 2025 at 0.1°. The dataset description on the same page still gives the 4.3b period as
      2003-01-01 to 2024-12-31, so check the last date in the files you download.
    source: https://www.gleam.eu/
  - date: "2024-07"
    level: info
    title: GLEAM4 released — 0.1° resolution, new evaporative stress and potential evaporation
    body: >-
      The fourth generation of GLEAM was released, with resolution raised to 0.1° and the record extended from 1980 to near present, plus hybrid-learned evaporative stress,
      Penman-based potential evaporation and plant access to groundwater. According to the FAQ, old versions are removed from the server when a new version is released.
    source: https://www.gleam.eu/

