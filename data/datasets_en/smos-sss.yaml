notices:
  - date: "2026-08-05"
    level: info
    title: CATDS LOCEAN debiased L3 v11 released (2010-01 to 2025-12)
    body: >-
      LOCEAN's debiased SMOS salinity L3 v11 is available at CATDS. It keeps the v10 debiasing and adds a correction for the ice-vicinity bias in the Southern Ocean, reducing uncertainty up to about 800 km from the ice edge.
      9-day and 18-day products are provided; the products are experimental and user feedback is requested.
    source: https://www.catds.fr/News/New-version-v11-of-debiased-SSS-L3-maps-from-Locean
  - date: "2026-04-09"
    level: info
    title: CATDS Arctic salinity maps now produced operationally
    body: >-
      The CATDS production centre (CPDC) now produces Arctic sea surface salinity maps (ARCTIC L3G, 9-day) operationally, following the research CEC ARCTIC V2. CEC ARCTIC V2 runs to 2023-08-30,
      and CATDS recommends using V2 where available for scientific studies and filling recent periods with L3G.
    source: https://www.catds.fr/News/Arctic-SSS-Maps-now-produced-operationally
  - date: "2026-01-29"
    level: info
    title: New version of the CATDS SMOS/SMAP OI L4 salinity maps
    body: >-
      A new version of the LOPS SMOS–SMAP merged optimal interpolation (OI) L4 sea surface salinity is available at CATDS. It first estimates and removes large-scale, time-varying biases and then remaps at about 45 km, and it also provides density and spiciness.
    source: https://www.catds.fr/News/New-version-of-SSS-SMOS-SMAP-OI-L4-maps
  - date: "2023-03-21"
    level: info
    title: SMOS mission extended to the end of 2025
    body: >-
      ESA announced that SMOS, CryoSat and Swarm had each been extended at least until the end of 2025. ESA's May 2026 presentation later stated that SMOS is "currently extended until end of 2028".
    source: https://earth.esa.int/eogateway/news/esa-s-excellent-earth-explorer-missions-extended-to-2025
  - date: "2021-05-28"
    level: info
    title: SMOS L1 and L2 processing baseline version 7 operational, full mission reprocessed
    body: >-
      From 25 May 2021 the SMOS L1 and L2 processors run on version 7, and the full mission archive was reprocessed with it. ESA said the new dataset supersedes the version 6 data and asked users to read the read-me-first notes before use.
    source: https://earth.esa.int/eogateway/news/smos-level-1-and-level-2-products-new-baseline-is-now-available

transitions:
  - from: ESA SMOS L2OS v662
    to: ESA SMOS L2OS v700
    status: completed
    date: "2021-05"
    summary: >-
      The third mission reprocessing baseline. The anomaly reference changed to a SMOS-derived climatology, a new dielectric model improves retrievals in cold water, and the land–sea contamination correction now uses ISAS-15 reference fields.
    changes:
      - aspect: Anomaly (SSS_anom) reference
        before: WOA2009 climatology
        after: "SMOS-derived climatology (2013–2019), with some systematic biases corrected"
      - aspect: Seawater dielectric model
        before: Klein–Swift
        after: "Somaraju–Trumpf (ST) — better cold-water retrievals"
      - aspect: Land–sea contamination reference fields
        before: WOA
        after: ISAS-15, with stricter RFI filtering
      - aspect: Input L1C
        before: Previous L1 baseline
        after: L1C brightness temperatures v724
      - aspect: Period split
        before: v662 reprocessed and operational data
        after: "REPR v700 2010-06-01 to 2021-05-24, OPER v700 from 2021-05-25"
    impacts:
      - Do not mix v662 time series with v700. The anomaly reference and dielectric model changed, so values differ for the same dates.
      - "The v700 release note lists known issues: seasonal biases at southern high latitudes, negative biases of about -0.5 pss or more on ascending passes, and ascending–descending differences."
      - "ESA has announced the next mission reprocessing baseline v740 (as of end-2025) and v750 with an ice contamination correction (2027). Download the data again once a new baseline is distributed."
