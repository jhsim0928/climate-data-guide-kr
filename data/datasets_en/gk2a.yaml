notices:
  - date: "2026-05-06"
    level: info
    title: Observations and data services suspended for routine maintenance (2026-05-07, 09:00–15:00 KST)
    body: >-
      Twice-yearly AMI scanner calibration and storage performance work stopped observations and data services on 7 May 2026 from 09:00 to 15:00 KST.
      NMSC warned that image navigation accuracy could be degraded for about an hour afterwards. Similar maintenance took place in May and November 2025.
    source: https://nmsc.kma.go.kr/homepage/html/base/bbs/selectBbs.do?bbsCd=00237&bbsUsq=203145
  - date: "2025-12-22"
    level: warning
    title: NMSC website satellite data service ended (2025-12-23)
    body: >-
      The satellite data service on the NMSC website ended on 23 December 2025. Satellite data downloads are now on the KMA Open MET Data Portal (data.kma.go.kr)
      and APIs on the KMA API Hub (apihub.kma.go.kr).
    source: https://nmsc.kma.go.kr/homepage/html/base/bbs/selectBbs.do?bbsCd=00237&bbsUsq=203013
  - date: "2025-09-05"
    level: warning
    title: Data services consolidated — downloads to the Open MET Data Portal, Open API to the API Hub
    body: >-
      NMSC announced that its data service (datasvc.nmsc.kma.go.kr) would be merged into the KMA Open MET Data Portal and the KMA API Hub.
      The originally announced end dates were 31 October 2025 for data provision and 22 December 2025 for the Open API; Open API users must get a new key from the API Hub and change their request URLs.
    source: https://nmsc.kma.go.kr/homepage/html/base/bbs/selectBbs.do?bbsCd=00237&bbsUsq=202887

