# ─────────────────────────────────────────────────────────────
# GEO-KOMPSAT-2A (GK-2A) AMI meteorological products — dataset information file
# Listed under the satellite tab, 'Clouds and radiation'. At the end of 2025 data distribution moved from the NMSC website
# to the KMA Open MET Data Portal (downloads) and the KMA API Hub (API).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gk2a
name: "GK-2A (GEO-KOMPSAT-2A)"
full_name: GEO-KOMPSAT-2A (Chollian-2A) Advanced Meteorological Imager (AMI) meteorological products — KMA National Meteorological Satellite Center (NMSC)
category: satellite
domain: satellite
group: 구름·복사
order: 80
domains: [대기, 해양, 육지, 원격탐사]
provider: KMA National Meteorological Satellite Center (NMSC) / Korea Aerospace Research Institute (KARI, satellite development)

status: active
status_note: >-
  GK-2A operates normally from geostationary orbit at 128.2°E and images the full disk every 10 minutes (WMO OSCAR expects end of life no earlier than 2029).
  Where to get the data has changed: the satellite data service on the NMSC website ended at the end of 2025, and data now come from the KMA Open MET Data Portal (downloads)
  and the KMA API Hub (API). Routine maintenance in spring and autumn stops observations and data services for a few hours each time.

period:
  start: "2019-07"
  end: present
  note: >-
    Launched in December 2018; the satellite broadcast service started on 25 July 2019. The archive depth available from the Open MET Data Portal and the API Hub could not be confirmed
    from official guidance, so check it on the portal. The NOAA Open Data Dissemination copy of level-1B data on AWS starts in February 2023 (checked 2026-10-13).

resolution:
  spatial_short: "2 km (0.02°)"
  temporal_short: "10분"
  spatial: >-
    AMI has 16 channels — visible 1 km (0.5 km for the 0.64 µm channel only), near-infrared and infrared 2 km (at nadir). Level-2 products such as cloud detection, cloud amount,
    cloud top, rain rate and land surface temperature are 2 km pixels according to the ATBDs, delivered as arrays in the geostationary projection.
  vertical: Cloud-top height, pressure and temperature (single layer); surface and top-of-atmosphere radiation; atmospheric profiles (depending on product)
  temporal: >-
    Full disk (FD) every 10 minutes; extended local area (ELA) and Korean Peninsula areas every 2 minutes. Some products (for example SST) also have 1-, 5- and 10-day composites.
    (Comparison tables show 10 minutes, the full-disk interval; the extended Korean Peninsula and Korean Peninsula areas are scanned every 2 minutes.)

coverage:
  short: 아시아
  note: "Full disk from 128.2°E geostationary orbit — East Asia, western Pacific and Oceania, with a separate rapid-scan Korean Peninsula area"
update: Real time (right after each 10-minute or 2-minute observation)
license: >-
  Works on the NMSC website carry the Korea Open Government License (KOGL) 'Attribution–NonCommercial–NoDerivatives' condition. Data from the Open MET Data Portal and the API Hub
  follow those sites' terms of use, and the NOAA open bucket (AWS) copy may be used freely with attribution.
account_required: true

summary: >-
  GEO-KOMPSAT-2A (GK-2A, Chollian-2A), launched in December 2018, is Korea's geostationary weather satellite. Its 16-channel Advanced Meteorological Imager (AMI) scans
  the full Earth disk visible from 128.2°E every 10 minutes and the area around the Korean Peninsula every 2 minutes. From these data NMSC produces 52 meteorological products,
  23 baseline and 29 additional: clouds (detection, amount, type, top properties, optical properties), rain rate, land and sea surface temperature, radiation, aerosol and Asian dust,
  atmospheric motion vectors and more. It gives the finest time resolution available from Korean satellites for heavy rain, typhoon, dust and fog studies and regional climate analysis.

time_convention:
  summary: >-
    Level-2 products are instantaneous values for each observation (10 minutes for the full disk, 2 minutes for the extended local area). A full-disk image is scanned from north to south
    over several minutes, so the actual observation moment differs slightly from the file's nominal time depending on latitude.
  points:
    - "File names follow `gk2a_ami_<level>_<channel or product>_<area, resolution, projection>_<YYYYMMDDhhmm>.nc` (for example the AWS copy `gk2a_ami_le1b_ir087_fd020ge_202610010000.nc`). The last 12 digits are the observation time; check the file attributes for the time zone (UTC or KST)."
    - "Cloud optical thickness, effective radius and liquid and ice water path are retrieved only in daytime (solar zenith angle below 80°), and sea and land surface temperature only for clear-sky pixels (according to each ATBD)."
    - "There are two cloud amounts: the satellite cloud fraction (CF), the share of cloudy pixels within about 5 km of each 2 km pixel, and a geometric cloud amount (CA) that mimics what a ground observer sees."
    - "The SST ATBD says that besides real-time retrievals, simple-average composites are made over 1, 5 and 10 days. Composites are period means."
    - "During routine maintenance (usually May and November, 4–6 hours) there are no observations, leaving gaps in time series, and image navigation accuracy can be degraded for about an hour afterwards."
  source: https://nmsc.kma.go.kr/homepage/html/base/cmm/selectPage.do?page=static.edu.atbdGk2a
  source_name: NMSC GK-2A product Algorithm Theoretical Basis Documents (ATBD, in Korean)

variables:
  note: >-
    Only names given in the 'variable' or 'Name' column of the product tables in the NMSC ATBDs are listed as variable names. Confirm names, units and scale factors in the operational files you download.
    Where the in-file variable name could not be confirmed, the notes give only the product abbreviation and the file-name code (the <code> in gk2a_ami_le2_<code>_<area>_<time>.nc, from the NMSC product service list). The full list of 52 products is on the ATBD page.
  full_list: https://nmsc.kma.go.kr/homepage/html/base/cmm/selectPage.do?page=static.edu.atbdGk2a
  groups:
    - name: Clouds (instantaneous at observation time, 2 km)
      kind: instant
      items:
        - text: "Cloud detection (cloud, probably cloud, clear) — `CLD`"
          note: "Values 0 = cloud, 1 = probably cloud, 2 = clear (ATBD Table 7). Per-test result bits in `TTF1`~`TTF3`. File-name code cld"
        - text: "Satellite cloud fraction — `CF` (%)"
          note: "scale_factor 0.01 according to the ATBD table; quality variable `CF_DQF`"
        - text: "Ground-equivalent cloud amount — `CA` (dimensionless)"
          note: "scale_factor 0.01 according to the ATBD table; quality variable `CA_DQF`"
        - "Cloud phase (clear, water, ice, uncertain) — `CPH`"
        - "Cloud-top temperature — `CTT` (K)"
        - "Cloud-top pressure — `CTP` (hPa)"
        - "Cloud-top height — `CTH` (km)"
        - text: "Cloud type and cloud layer/height — `CT`·`CLL`"
          note: "`CT` is the ISCCP cloud type 1–9 and `CLL` is 1 = high, 2 = mid, 3 = low (ATBD Tables 4 and 5); quality variable `CT_DQF`. East Asia cloud types are `NCCT1`~`NCCT3` (type) and `PCCT1`~`PCCT3` (probability, %). File-name codes cla-ct and cla-cll"
        - text: "Cloud optical thickness, effective radius, liquid water path, ice water path"
          note: "Daytime only. Product abbreviations: COT, CER, LWP and IWP; file-name codes dcoew-cot etc. (in-file variable names not confirmed in official documents)"
    - name: Precipitation (instantaneous at observation time)
      kind: instant
      items:
        - text: "Rain rate (mm/h)"
          note: "Product abbreviation: RR; file-name code rr (in-file variable name not confirmed in official documents)"
        - text: "Quantitative precipitation forecast"
          note: "Probability of rain and potential rainfall. Product abbreviations: POR and PAR; file-name codes qpn-por and qpn-par (in-file variable names not confirmed in official documents)"
    - name: Land and ocean (clear pixels, instantaneous at observation time)
      kind: instant
      items:
        - text: "Land surface temperature — `LST` (K)"
          note: "Clear land pixels only, every 10 minutes; scaling 0.01 and quality variable `DQF_LST` according to the ATBD table"
        - text: "Sea surface temperature"
          note: "Product abbreviation: SST; file-name code sst (in-file variable name not confirmed in official documents)"
        - text: "Surface albedo and land surface emissivity — `BSA`·`WSA`, `LSE038`·`LSE087`·`LSE105`·`LSE123` (dimensionless)"
          note: "`BSA` and `WSA` are broadband black-sky and white-sky albedo (scale_factor 10000; per-band `BSA_b01` etc.; quality variables `DQF_BSA` and `DQF_WSA`). `LSE038` etc. are 3.8, 8.7, 10.5 and 12.3 µm emissivity (scale_factor 0.001; quality variable `DQF_LSE`). Product abbreviations SAL and LSE; file-name codes sal-bsa, lse-038 etc."
        - text: "Snow and sea-ice detection, snow depth — `SCSI`"
          note: "`SCSI` values 0 = night, 1 = snow, 2 = snow-free land, 3 = cloud, 4 = sea ice, 5 = ice-free water; quality variable `DQF_SCSI`. The in-file variable name for snow depth (product abbreviation SD, cm) was not confirmed in official documents (the ATBD table names the output 'Snow Depth')"
        - text: "Vegetation index and fractional vegetation cover"
          note: "Product abbreviations: NDVI and FVC; file-name codes vgt-ndvi and vgt-fvc (in-file variable names not confirmed in official documents)"
    - name: Radiation (instantaneous at observation time)
      kind: instant
      items:
        - text: "Radiation and shortwave radiation — `RAD`, `RSR`·`DSR`·`ASR`"
          note: "`RAD` is the 16×16-pixel mean radiance (reflectance for channels 1–6, brightness temperature for 7–16). `RSR` (TOA reflected), `DSR` (surface downward) and `ASR` (surface absorbed) shortwave are in W m-2, with quality variables `Quality_flag1` and `Quality_flag2`. Product abbreviations RAD and SWRAD"
        - text: "Top-of-atmosphere outgoing longwave radiation — `OLR` (W m-2)"
          note: "Quality variables `Quality_flag1` and `Quality_flag2`. File-name code lwrad-olr"
        - text: "Surface upward and downward longwave radiation — `ULR`·`DLR` (W m-2)"
          note: "Quality variables `Quality_flag1` and `Quality_flag2`. File-name codes lwrad-ulr and lwrad-dlr"
    - name: Aerosol and atmosphere
      kind: instant
      items:
        - text: "Aerosol optical depth"
          note: "At 0.55 µm. Product abbreviation: AOD; file-name code apps-aod (in-file variable name not confirmed in official documents)"
        - text: "Asian dust and aerosol detection, dust optical depth"
          note: "Product abbreviations: ADPS and DAOD; file-name codes adps and apps-daod055 (in-file variable names not confirmed in official documents)"
        - text: "Atmospheric motion vectors"
          note: "Product abbreviation: AMV; file-name codes such as amv-ir105-cd (in-file variable names not confirmed in official documents)"
        - text: "Atmospheric vertical profiles"
          note: "Temperature and humidity profiles, stability indices, precipitable water, total ozone. Product abbreviation: AAP; file-name codes in the tqprof, aii, tpw and toz series (in-file variable names not confirmed in official documents)"

access:
  - name: KMA Open MET Data Portal (satellite data downloads)
    url: https://data.kma.go.kr
    method: Web (register and log in, then search and download)
    note: >-
      The official download point for GK-2A data since the end of 2025; NMSC directs users there for satellite data downloads. Check the menu location, archive period and product list
      on the portal itself (it blocks automated access, so they could not be confirmed for this page). The portal is mainly in Korean.
  - name: KMA API Hub (satellite data API)
    url: https://apihub.kma.go.kr
    method: Open API (register → issue an authentication key → call)
    note: >-
      The NMSC website Open API ended in December 2025 and moved here. Existing users must also get a new key from the API Hub and change their request URLs.
      Check the API list, request format and call limits on the API Hub.
  - name: NOAA Open Data Dissemination — AWS bucket noaa-gk2a-pds (level 1B)
    url: https://registry.opendata.aws/noaa-gk2a-pds/
    method: S3 (anonymous access)
    note: >-
      A copy uploaded by NOAA in coordination with KMA. It holds level-1B channel data, not level-2 products, under `AMI/L1B/FD/` (full disk) and `AMI/L1B/LA/` (local area)
      in year-month/day/hour folders from February 2023. An SNS topic announces new files.
  - name: NMSC — product Algorithm Theoretical Basis Documents (ATBD)
    url: https://nmsc.kma.go.kr/homepage/html/base/cmm/selectPage.do?page=static.edu.atbdGk2a
    method: Web (PDF, in Korean)
    note: Per-product definitions, variables and quality information.
  - name: NMSC — software and sample data (lat/lon grids, calibration tables, sample code)
    url: https://nmsc.kma.go.kr/homepage/html/base/cmm/selectPage.do?page=static.utilization.software
    method: Web
    note: Latitude-longitude files (NetCDF) for converting geostationary-projection pixels, land-sea masks, L1B Python and Fortran samples, and a receive-and-display Docker package (September 2026 release).

example:
  lang: python
  note: >-
    Opens one full-disk level-1B infrared (10.5 µm) image from AWS without an account. Level-2 products must come from the Open MET Data Portal or the API Hub; confirm variable names in the files.
    Use the latitude-longitude grid files on the NMSC software page to geolocate pixels.
  code: |
    # pip install s3fs xarray h5netcdf
    import s3fs
    import xarray as xr

    fs = s3fs.S3FileSystem(anon=True)
    # Full-disk (FD) L1B, ir105 channel files in the 2026-10-01 00h folder
    keys = fs.glob("noaa-gk2a-pds/AMI/L1B/FD/202610/01/00/gk2a_ami_le1b_ir105_fd020ge_*.nc")
    print(keys[:3])

    ds = xr.open_dataset(fs.open(keys[0]), engine="h5netcdf")
    print(ds)                                  # variable names, dimensions, attributes
    print(ds.attrs)                            # global attributes such as observation time and calibration

tips:
  - Data ordering and downloads on the NMSC website (datasvc.nmsc.kma.go.kr) and its Open API ended at the end of 2025. Download scripts written for the old addresses must be rewritten for the Open MET Data Portal and the API Hub.
  - Level-2 products are arrays of 2 km pixels in the geostationary (GEOS) projection. Attach coordinates with the latitude-longitude files distributed by NMSC, and remember that pixels grow large near the disk edge (high latitudes, distant longitudes) because of the large viewing angle.
  - Sea and land surface temperatures exist only for clear pixels, so averages over cloudy periods (the summer monsoon, typhoons) are biased toward clear days. Always use the quality flags (DQF).
  - There are no observations during routine maintenance (usually May and November). Check for missing times when building daily means from 10-minute data.
  - WMO OSCAR lists GK-2A's expected end of life as 2029 or later and the follow-on GEO-KOMPSAT-5 as 2031–2041. For long-term studies, plan for a discontinuity at the satellite changeover.
  - Many studies compare or combine GK-2A with Japan's Himawari (AHI), which has similar time resolution. The channel sets are similar, but calibration and retrieval algorithms differ.

