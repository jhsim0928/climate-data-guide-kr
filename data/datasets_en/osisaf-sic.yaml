example:
  lang: python
  note: Assumes a daily file downloaded via FTP or THREDDS from the product page. File names follow ice_conc_<nh|sh>_ease2-250_<prodID>_<YYYYMMDD>1200.nc.
  code: |
    import xarray as xr

    # e.g. OSI-450-a1 Northern Hemisphere daily file (product ID cdr-v3p1)
    ds = xr.open_dataset("ice_conc_nh_ease2-250_cdr-v3p1_201909011200.nc")
    sic = ds["ice_conc"].squeeze()                       # units: % (0–100), one day's 2-D grid
    unc = ds["total_standard_uncertainty"].squeeze()     # units: % (one standard deviation)

    # EASE2 grid is equal-area 25 km x 25 km -> cell area 625 km²
    area_km2 = float((sic.where(sic >= 15) / 100 * 625).sum())
    print(f"Sea-ice area (cells with concentration >= 15%): {area_km2:,.0f} km²")

tips:
  - >-
    The SSMIS series (OSI-450-a1 + OSI-430-a) and the AMSR series (OSI-458 + OSI-438 + OSI-438-a) are separate records. When extending
    beyond 2020, use the ICDR from the same series as your CDR. OSI-430-a ended at 2025-10-16, so if you need ongoing updates, move to the AMSR series.
  - >-
    The earlier OSI-450-a (DOI 10.15770/EUM_SAF_OSI_0013) had a land spill-over correction bug affecting 343 days and was replaced in 2025
    by the corrected OSI-450-a1 (DOI 10.15770/EUM_SAF_OSI_0023). The affected dates are listed in PUM Appendix B.
  - >-
    In summer, melt ponds look like open water to microwave radiometers, so concentration is underestimated. This error is not included in
    the uncertainty variables, so take care with Arctic concentrations in June–August. Thin ice at the edge below about 10% can also be removed to 0% by the weather filter.
  - >-
    The polar observation hole differs by sensor (poleward of 84°N for SMMR, 87°N for SSM/I, 89°N for SSMIS). In the climate records it is
    filled by interpolation, so check interpolated cells with status_flag and state how you treat this area when computing your own area or extent series.

