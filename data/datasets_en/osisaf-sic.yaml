# ─────────────────────────────────────────────────────────────
# OSI SAF (sea ice concentration) — dataset information file (English edition)
# EUMETSAT OSI SAF sea-ice concentration climate data records (CDR/ICDR) and near-real-time (NRT) products
# ─────────────────────────────────────────────────────────────
id: osisaf-sic
name: "OSI SAF (sea ice concentration)"
full_name: EUMETSAT OSI SAF Global Sea-Ice Concentration Climate Data Record (OSI-450-a1 and related products)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 10
also_in:
  - domain: satellite
    group: 해빙
domains: [해빙, 해양]
provider: EUMETSAT Ocean and Sea Ice Satellite Application Facility (OSI SAF) / Norwegian Meteorological Institute (MET Norway)

status: active
status_note: >-
  Operational, but in a transition between input sensors. Because access to DMSP SSMIS data became unstable, the
  SSMIS-based interim record (OSI-430-a) has been suspended since 17 October 2025, and the AMSR2-based interim record
  (OSI-438, declared operational on 2026-05-04) has taken over. From 1 September 2026 the AMSR3-based interim record
  (OSI-438-a) provides the fast-track updates (about 2 days latency).

transitions:
  - from: OSI SAF SSMIS series
    to: OSI SAF AMSR series
    status: completed
    date: "2025-10"
    summary: >-
      As DMSP SSMIS data became intermittent, OSI SAF moved the extension (ICDR) of its sea-ice concentration climate record
      from the SSMIS series to the AMSR series. The SSMIS ICDR OSI-430-a was suspended on 2025-10-17, the AMSR2-based OSI-438 was
      declared operational on 2026-05-04, and from 2026-09-01 the AMSR3-based OSI-438-a provides the fast-track updates. Grid and
      latency are unchanged, but the AMSR record starts only in 2002, so treat it separately from the single long record starting in 1978.
    changes:
      - aspect: Input sensors
        before: "SMMR, SSM/I, SSMIS (DMSP SSMIS for the extension from 2021)"
        after: "AMSR-E (2002-06 to 2011-10), AMSR2 (2012-07 onwards), GOSAT-GW AMSR3 from 2026-09-01"
      - aspect: Climate data record (CDR)
        before: "OSI-450-a1 — 1978-10-25 to 2020-12-31"
        after: "OSI-458 — 2002-06-01 to 2020-12-31 (gap 2011-10-04 to 2012-07-23)"
      - aspect: Interim climate data record (ICDR)
        before: "OSI-430-a — 2021-01-01 to 2025-10-16 (suspended 2025-10-17)"
        after: "OSI-438 (AMSR2) from 2021-01-01, operational 2026-05-04 / OSI-438-a (AMSR3) from 2026-09-01"
      - aspect: Grid, time step and latency
        before: "25 km EASE2, daily means, nominal 16 days and fast-track 2 days latency"
        after: "Unchanged — 25 km EASE2, daily means, nominal 16 days and fast-track 2 days latency"
      - aspect: Fast-track files
        before: "OSI-430-a fast-track (FTP only)"
        after: "From 2026-09-01 fast-track only from OSI-438-a (AMSR3); OSI-438 (AMSR2) continues with nominal files only, at a new FTP location"
      - aspect: Effective sensor resolution and coastal contamination
        before: "SSMIS effective resolution about 30–60 km; relatively strong land spill-over at coasts"
        after: "AMSR effective resolution about 15–25 km; sharper ice edge and less land spill-over"
      - aspect: Polar observation hole
        before: "SSMIS — north of 89°N"
        after: "AMSR-E north of 89.5°N; AMSR3 slightly larger than AMSR2 because of its narrower swath"
      - aspect: Product ID in file names
        before: "cdr-v3p1 (OSI-450-a1) / icdr-v3p0, icdrft-v3p0 (OSI-430-a)"
        after: "cdr-v3p0-amsr (OSI-458) / icdr-v3p0-amsr, icdrft-v3p0-amsr (OSI-438)"
      - aspect: FTP directories (under ftp://osisaf.met.no/reprocessed/)
        before: "ice/conc/v3p1 (OSI-450-a1), conc-cont-reproc/v3p0 (OSI-430-a)"
        after: "ice/conc_amsr/v3p0 (OSI-458), ice/conc-cont-reproc-amsr/v3p0_amsr2_continued (OSI-438), ice/conc-cont-reproc-amsr/v3p0 (OSI-438-a)"
      - aspect: DOI
        before: "10.15770/EUM_SAF_OSI_0023 (OSI-450-a1), 10.15770/EUM_SAF_OSI_0014 (OSI-430-a)"
        after: "10.15770/EUM_SAF_OSI_0015 (OSI-458), 10.15770/EUM_SAF_OSI_0024 (OSI-438), 10.15770/EUM_SAF_OSI_0027 (OSI-438-a)"
      - aspect: Near-real-time products (10 km polar stereographic)
        before: "OSI-401-d (SSMIS) — users advised to move away because of unstable input"
        after: "OSI-408-a (AMSR2, from 2016); from 2026-09-01 OSI-408-g (AMSR3, file names amsr2 → amsr3)"
    impacts:
      - The single SSMIS-series record from 1978 stops at 2025-10-16. If you fill 2021 onwards with the AMSR ICDR (OSI-438), use the matching AMSR CDR (OSI-458) for consistency — which means starting in 2002.
      - Joining different series into one time series (e.g. OSI-450-a1 + OSI-438) can introduce a step at the junction because of differences in sensor resolution and coastal contamination. If you must, first quantify the difference between the two series over their 2002–2020 overlap.
      - Automated download scripts need the new FTP directories and product IDs in file names (icdr-v3p0 → icdr-v3p0-amsr, etc.). For 2-day-latency files after 2026-09-01, switch to OSI-438-a.
      - After the switch to AMSR3 on 2026-09-01, OSI-438-a uses a different sensor from OSI-438 (AMSR2). Use OSI-438-a for the most recent weeks and the nominal OSI-438 files for climate analyses, and document it if you mix the two.
      - Cite the DOI of each product you actually used (OSI-458, OSI-438, OSI-438-a).
    sources:
      - name: OSI SAF — Implications of the end of SSMIS data on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
      - name: OSI SAF — Implications of AMSR2 being replaced by AMSR3 on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-amsr2-being-replaced-amsr3-osi-saf-products
      - name: OSI SAF Service Message #3571 (2026-08-31)
        url: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september
      - name: OSI-430-a product page
        url: https://osi-saf.eumetsat.int/products/osi-430-a
      - name: OSI-438 product page
        url: https://osi-saf.eumetsat.int/products/osi-438
      - name: OSI-458 product page
        url: https://osi-saf.eumetsat.int/products/osi-458
      - name: Sea-ice concentration CDR/ICDR Product User Manual (PUM v3.4)
        url: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-conc-climate-data-record_3.4.pdf
  - from: OSI-450-a v3.0
    to: OSI-450-a1 v3.1
    status: completed
    date: "2025-06"
    summary: >-
      A bug was found in the land spill-over correction of the SSMIS-series CDR OSI-450-a, and a corrected release, OSI-450-a1,
      was issued with a new DOI. Period, grid and variables are unchanged.
    changes:
      - aspect: Land spill-over correction
        before: "Bug made coastal values too high on 343 days"
        after: "Fixed (affected dates listed in PUM Appendix B)"
      - aspect: Version and DOI
        before: "v3.0, DOI 10.15770/EUM_SAF_OSI_0013"
        after: "v3.1, DOI 10.15770/EUM_SAF_OSI_0023 (declared operational 2025-06-04)"
      - aspect: FTP directory (under ftp://osisaf.met.no/reprocessed/)
        before: "ice/conc/v3p0"
        after: "ice/conc/v3p1"
      - aspect: Period, grid and variables
        before: "1978-10-25 to 2020-12-31, 25 km EASE2"
        after: "Unchanged"
    impacts:
      - If you have OSI-450-a files, replace them with OSI-450-a1. Check the affected dates (PUM Appendix B), especially if you work on concentration or area near coasts.
      - Update the DOI you cite to 10.15770/EUM_SAF_OSI_0023.
    sources:
      - name: OSI-450-a1 product page
        url: https://osi-saf.eumetsat.int/products/osi-450-a1
      - name: OSI-450-a product page (superseded)
        url: https://osi-saf.eumetsat.int/products/osi-450-a
      - name: Sea-ice concentration CDR/ICDR Product User Manual (PUM v3.4)
        url: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-conc-climate-data-record_3.4.pdf

period:
  start: "1978-10"
  end: present
  note: >-
    The SSMIS-series CDR (OSI-450-a1) covers 1978-10-25 to 2020-12-31, and its extension OSI-430-a covers 2021-01-01 to 2025-10-16, where it stopped.
    The AMSR series continues with the CDR OSI-458 (2002-06 to 2020-12, gap 2011-10 to 2012-07) and the ICDRs OSI-438 (from 2021-01, AMSR2)
    and OSI-438-a (from 2026-09, AMSR3). Before July 1987 (SMMR) the temporal sampling is 48 hours.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: "Climate records on the 25 km EASE2 grid (Lambert Azimuthal Equal Area, 432 x 432 for each hemisphere) / near-real-time OSI-401-d and OSI-408 on a 10 km polar stereographic grid"
  vertical: Not applicable (surface product)
  temporal: Daily means (centred on 12:00 UTC); monthly and yearly mean files and monthly sea-ice area and extent indices provided separately

coverage:
  short: 양극
update: >-
  ICDR updated daily — nominal files about 16 days latency, fast-track files about 2 days latency (FTP only, replaced by nominal files after 16 days).
  Near-real-time OSI-401-d and OSI-408 about 5 hours latency.
license: CC BY 4.0 (credit "EUMETSAT OSI SAF" and give the DOI)
account_required: false

summary: >-
  Global (Northern and Southern Hemisphere) sea-ice concentration from EUMETSAT OSI SAF, derived from SMMR, SSM/I, SSMIS and
  AMSR-E/AMSR2/AMSR3 passive microwave observations. Atmospheric effects are corrected with ERA5, tie-points are dynamic, and every
  grid cell comes with an uncertainty estimate. Use the CDR and its interim extension (ICDR) for long-term climate analyses, and the
  near-real-time products (OSI-401-d, OSI-408) for current conditions. The algorithms are shared with the ESA CCI Sea Ice project, and
  the records are redistributed by Copernicus Marine and the C3S CDS.

time_convention:
  summary: >-
    Each value in the daily climate-record files (CDR/ICDR) is a daily mean of the satellite observations over the 24 hours (00–24 UTC)
    centred on 12:00 UTC, with equal weight per grid cell. The time in the file name (…1200) is the centre of the averaging period, not an
    instantaneous value. Monthly and yearly files are averages of the daily fields.
  points:
    - "Daily fields: footprints within 12.5 km are averaged over the day (L3), and grid cells without observations are filled using the mean of the neighbouring days (D-1, D+1) and spatial interpolation (L4). Interpolated cells are marked in status_flag."
    - "Before July 1987 (SMMR) the sensor operated only every other day, so the temporal sampling is 48 hours and gap filling uses D-2 and D+2."
    - "Monthly and yearly means average the unfiltered daily concentrations (ice_conc + raw_ice_conc_values); values below 10% are then set to 0% and values above 100% to 100%. Missing days are not interpolated, and no monthly file is produced if more than 5 consecutive days are missing."
    - "Monthly and yearly files have no uncertainty variables. The daily uncertainty is one standard deviation of that day's mean field (before filtering) and is not given for interpolated cells."
    - "The near-real-time OSI-401-d and OSI-408 are also one field per day (centred on 12:00), but processing and grids differ from the climate records, so do not assume the same rules."
  source: https://osisaf-hl.met.no/sites/osisaf-hl/files/baseline_document/osisaf_atbd_sea-ice-conc-climate-data-record_3.2.pdf
  source_name: OSI SAF sea-ice concentration CDR ATBD v3.2 (Section 6.1) / PUM v3.4 / OSI-450-a1 product page

variables:
  note: >-
    Variables in the daily climate-record (CDR/ICDR) files, following the Product User Manual (PUM v3.4). Monthly and yearly files have
    no uncertainty variables, and monthly/yearly means below 10% are removed from ice_conc and moved to raw_ice_conc_values. The
    near-real-time files (OSI-401-d, OSI-408) contain a different set of variables.
  full_list: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-conc-climate-data-record_3.4.pdf
  groups:
    - name: Sea-ice concentration
      kind: mean
      period: Daily
      items:
        - text: "Sea-ice concentration (filtered) — `ice_conc` (%)"
          note: 24-hour mean centred on 12:00 UTC (48-hour sampling in the SMMR period). In monthly and yearly files the same variable is the monthly or yearly mean
        - text: "Raw sea-ice concentration values (including values below 0% and above 100%) — `raw_ice_conc_values` (%)"
          note: Original values of the cells changed by filtering in the same daily field as ice_conc. In monthly and yearly files, the values cut off after averaging
    - name: Uncertainty (one standard deviation)
      kind: mean
      period: Daily
      items:
        - text: "Total uncertainty — `total_standard_uncertainty` (%)"
          note: Uncertainty of that day's mean concentration (before filtering), combining the algorithm and smearing variances; not given for interpolated cells. Daily files only
        - text: "Algorithm uncertainty — `algorithm_standard_uncertainty` (%)"
          note: Belongs to the daily mean concentration; combines the uncertainties of the day's observations as variances
        - text: "Smearing uncertainty — `smearing_standard_uncertainty` (%)"
          note: Belongs to the daily mean concentration (error from the mismatch between sensor footprint and grid resolution)
    - name: Quality information
      kind: mean
      period: Daily
      items:
        - text: "Status flag — `status_flag` (bit flags)"
          note: Per-day flags for the processing applied to the daily field (land/lake, open-water filter, coastal correction, temporal/spatial interpolation, outside climatology, etc.). Land and lake bits come from a fixed mask; the maximum-ice climatology bit changes by month

