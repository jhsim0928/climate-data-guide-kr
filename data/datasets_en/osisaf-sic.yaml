notices:
  - date: "2026-10-23"
    level: warning
    title: Missing AMSR3 products (update, Service Message #3607) — input data not yet received, timeline unknown
    body: >-
      In relation to the previous message #3605, OSI SAF is not yet receiving input data from the originating centre, and the timeline at this moment is unknown.
      AMSR3-based sea-ice products may therefore remain missing after 23 October 2026.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/missing-amsr3-products-update
  - date: "2026-10-20"
    level: warning
    title: Missing AMSR3 products (19 to 23 October 2026, Service Message #3605)
    body: >-
      Due to a system maintenance at the originating centre (JAXA) from 19 October 05:00 UTC to 23 October 2026 03:00 UTC, the GOSAT-GW AMSR3
      products Level 2 PMW Sea-Ice Concentration (OSI-410-g), Sea-Ice Concentration (AMSR3) (OSI-408-g) and Sea-Ice Emissivity (OSI-404-d)
      will be unavailable or delayed.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/missing-amsr3-products
  - date: "2026-08-31"
    level: warning
    title: Operational release of AMSR3-based sea-ice products on 1st September 2026 (Service Message #3571)
    body: >-
      AMSR3 becomes the main satellite input, and the AMSR3-based ICDR OSI-438-a (about 2 days latency) is now operational. For the
      AMSR2-based OSI-438, only the nominal ICDR (16 days latency) continues, at a new FTP location; users of the fast-track ICDR are invited
      to use OSI-438-a. The near-real-time L3 concentration moves to OSI-408-g (AMSR3) with new file names.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september
  - date: "2026-05-04"
    level: info
    title: AMSR2-based ICDR OSI-438 declared operational
    body: >-
      OSI-438 (AMSR2-based interim record from 2021), available as a demonstrational product since July 2025, was declared operational
      on 2026-05-04. It extends the AMSR-series CDR OSI-458 consistently.
    source: https://osi-saf.eumetsat.int/products/osi-438
  - date: "2025-10-17"
    level: critical
    title: SSMIS-based ICDR OSI-430-a suspended
    body: >-
      OSI-430-a was suspended because of unstable access to DMSP SSMIS data; long gaps in the input affect its temporal consistency
      (last date 2025-10-16). OSI SAF recommends switching to the AMSR2-based OSI-438. The SSMIS-only near-real-time OSI-401-d is also affected
      by the unstable input, and users are advised to start using OSI-408-a.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2025-06-13"
    level: warning
    title: Implications of the end of SSMIS data on OSI SAF products
    body: >-
      In response to the U.S. Department of Defense plan to stop distributing SSMIS data (first set for 2025-06-30, later postponed, with
      best-effort distribution until September 2026), OSI SAF described the impact on each product. Multi-sensor products no longer use SSMIS
      from July 2025, and users of SSMIS-only products are advised to move to AMSR2-based products. The page is updated as the situation evolves.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2025-06-04"
    level: warning
    title: Corrected CDR OSI-450-a1 released — replaces OSI-450-a
    body: >-
      OSI-450-a1 (v3.1, new DOI 10.15770/EUM_SAF_OSI_0023) corrects OSI-450-a, in which a land spill-over correction bug affected 343 days,
      and is now the operational product. If you use OSI-450-a, switch to the new release.
    source: https://osi-saf.eumetsat.int/products/osi-450-a1

