transitions:
  - from: MODIS aerosol C6 (MOD04, MOD08)
    to: MODIS aerosol C6.1
    status: completed
    date: "2018-03"
    summary: >-
      A version that fixed problems in the input L1B data and added some L2 and L3 improvements. The full record was reprocessed from September to December 2017 for Terra (public release 15 October 2017)
      and January to March 2018 for Aqua; since 30 April 2018 only C6.1 has been produced. DT gained improved retrievals over urban areas and DB gained per-pixel uncertainty estimates.
    changes:
      - aspect: Input L1B calibration
        before: C6 L1B
        after: C6.1 L1B with the input problems fixed
      - aspect: Dark Target
        before: C6 DT
        after: Improved retrievals over urban areas
      - aspect: Deep Blue
        before: C6 DB (no uncertainty)
        after: Per-pixel estimated uncertainty added (`Deep_Blue_Aerosol_Optical_Depth_550_Land_Estimated_Uncertainty`)
      - aspect: Production
        before: C6 (produced in parallel until 2018-04-30)
        after: C6.1 only
    impacts:
      - Do not mix C6 and C6.1 in one time series; download the whole record again as C6.1.
    sources:
      - name: MODIS Atmosphere — Data Versions (collections overview)
        url: https://atmosphere-imager.gsfc.nasa.gov/collections/overview
      - name: C6.1 Dark Target change document
        url: https://modis-atmos.gsfc.nasa.gov/sites/default/files/ModAtmo/C061_Aerosol_Dark_Target_v2.pdf
      - name: C6.1 Deep Blue change document
        url: https://modis-atmos.gsfc.nasa.gov/sites/default/files/ModAtmo/modis_deep_blue_c61_changes2.pdf
  - from: MODIS aerosol MOD04, MOD08 C6.1
    to: VIIRS Deep Blue AERDB and Dark Target AERDT
    to_id: viirs-aerosol
    status: planned
    summary: >-
      The successors are continuity products that apply the same Deep Blue and Dark Target algorithms to VIIRS (Suomi NPP, NOAA-20, NOAA-21). The two algorithms become separate products (AERDB and AERDT);
      DB gains an ocean algorithm (SOAR) and covers land and ocean, and there is no combined AOD and no 8-day L3. They mainly continue Aqua, which flies in the same afternoon orbit; no VIIRS continues Terra's morning observations.
      The transition completes when Terra and Aqua end operations in 2027.
    changes:
      - aspect: Product layout
        before: "DT, DB and combined AOD in one file (MOD04_L2) / L3 MOD08 D3, E3, M3"
        after: "AERDB_L2, D3, M3 (DB over land + SOAR over ocean) and AERDT_L2 (DT over land and ocean; no L3 at LAADS as of 2026-10). No combined AOD"
      - aspect: Pixel size
        before: "10 km at nadir (10×10 pixels) / 3 km (DT)"
        after: "6 km at nadir (8×8 VIIRS M-band 750 m pixels)"
      - aspect: Granules and swath
        before: 5-minute granules
        after: 6-minute granules, wider swath than MODIS
      - aspect: Overpass time
        before: "Terra 10:30 descending, Aqua 13:30 ascending (drifting since 2020–2021)"
        after: "13:30 ascending (Suomi NPP, NOAA-20 and NOAA-21 are all afternoon orbits)"
      - aspect: Shortwave infrared band
        before: MODIS 2.13 µm
        after: VIIRS 2.25 µm (the wavelength difference changes surface reflectance relationships)
      - aspect: Variable names and format
        before: "`Optical_Depth_Land_And_Ocean`, `AOD_550_Dark_Target_Deep_Blue_Combined` etc., HDF-EOS2 (HDF4)"
        after: "`Aerosol_Optical_Thickness_550_Land_Ocean_Best_Estimate` (DB), `geophysical_data/Optical_Depth_Land_And_Ocean` (DT), NetCDF-4"
      - aspect: Period
        before: "Terra 2000-02 onward / Aqua 2002-07 onward"
        after: "Suomi NPP 2012-03 onward (delivery ends 2026-11-02) / NOAA-20 2018 onward / NOAA-21 2023-02 onward"
    impacts:
      - "MODIS and VIIRS AOD generally differ by fairly constant offsets. Sawyer et al. (2025) find that for DT, NOAA-20 is close to Aqua, Terra is about 0.015 higher and Suomi NPP is the highest. Check the difference over an overlap period before joining records."
      - Sawyer et al. (2020) report that much of the DT difference comes from sampling (pixel size, cloud mask, swath width) rather than calibration. Comparing only cells retrieved by both sensors on the same day is the safest approach.
      - "Analyses that used the MODIS combined AOD must choose either DB (AERDB) or DT (AERDT) for VIIRS. If you need daily or monthly L3, only AERDB D3 and M3 exist at present."
      - There is no successor for Terra's morning observations, so Terra-based records differ in time of day from Aqua and VIIRS afternoon observations.
    sources:
      - name: Sawyer et al. (2020), Remote Sensing — Continuing the MODIS Dark Target Aerosol Time Series with VIIRS
        url: https://doi.org/10.3390/rs12020308
      - name: Sawyer et al. (2025), Frontiers in Environmental Science — updated VIIRS DT and MODIS continuity
        url: https://doi.org/10.3389/fenvs.2025.1602145
      - name: Sayer et al. (2019), JGR — consistency of MODIS C6.1 and VIIRS Deep Blue
        url: https://doi.org/10.1029/2018JD029598
      - name: LAADS DAAC — MODIS to VIIRS Transition
        url: https://ladsweb.modaps.eosdis.nasa.gov/learn/modis-to-viirs-transition

notices:
  - date: "2026-08-03"
    level: info
    title: LAADS Classic API retired on 2026-08-31 — move to API-V2
    body: >-
      LAADS DAAC announced that its old Classic web service API would be retired on 31 August 2026. Automated download scripts and clients need to move to LAADS API-V2, a JSON/REST interface.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199517
  - date: "2026-04-30"
    level: info
    title: Earthdata Login now required for LAADS OPeNDAP
    body: >-
      From 30 April 2026 the LAADS OPeNDAP service also requires NASA Earthdata Login authentication. Scripts that read OPeNDAP URLs without credentials must add them.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199527
  - date: "2026-03-31"
    level: info
    title: Terra anomaly put MODIS in standby — data from 2026-03-26 to 27 questionable or bad
    body: >-
      A Terra spacecraft anomaly around 20:00 UTC on 26 March 2026 put MODIS into standby mode; it returned to science mode on the afternoon of 27 March. The calibration team flagged data from 20:00 UTC on 26 March
      to 19:30 UTC on 27 March as questionable or bad and considers data after that safe to use.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199533
  - date: "2026-03-20"
    level: warning
    title: NASA expects Terra science operations to end in February 2027 and Aqua in September 2027
    body: >-
      The editor's note on the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects that fuel and power limits will end science operations for Terra in February 2027
      and Aqua in September 2027, with both continuing to operate until then. No new MOD04, MYD04, MOD08 or MYD08 data will be produced after that.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2026-03-18"
    level: info
    title: MODIS L1B and geolocation Version 7.0 released — atmosphere products still C6.1
    body: >-
      LAADS DAAC released Version 7.0 MODIS calibrated radiances (L1B) and geolocation and said the V6.1 L1 data would be removed on 2026-09-30. On 2026-10-13 CMR listed only Version 6.1
      for the MOD04 and MOD08 atmosphere products, and no official notice gave a release date for aerosol products made from V7 L1B.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua begin shutting down in late 2026 to early 2027
    body: >-
      NASA LAADS DAAC announced that Terra and Aqua will begin shutting down in late 2026 or early 2027, and that both are drifting out of their designed orbits, changing crossing times and possibly affecting the data.
      A final reprocessing will follow once MODIS data collection stops, and users are encouraged to use similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

