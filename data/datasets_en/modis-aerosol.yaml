# ─────────────────────────────────────────────────────────────
# MODIS aerosol MOD04_L2/MYD04_L2 (10 km), MOD04_3K (3 km) and MOD08 L3 aerosol C6.1 — dataset information file
# Satellite tab (Aerosols & atmospheric composition). Covers the Dark Target and Deep Blue algorithms and the combined AOD on one page.
# The key caveats are Terra and Aqua orbit drift (changing overpass times) and the end of both missions. The VIIRS successor is viirs-aerosol.yaml.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-aerosol
name: "MODIS Aerosol (MOD04·MOD08)"
full_name: MODIS/Terra and Aqua Aerosol 5-Min L2 Swath 10km and 3km (MOD04_L2, MYD04_L2, MOD04_3K, MYD04_3K) and MOD08/MYD08 L3 1° aerosol, Collection 6.1 (MODIS Dark Target and Deep Blue aerosol optical depth)
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 10
domains: [대기, 에어로졸, 원격탐사]
provider: NASA GSFC MODIS Atmosphere Team (Dark Target and Deep Blue algorithm teams) / NASA LAADS DAAC (MODAPS)

status: deprecated
status_note: >-
  Collection 6.1 is still produced every day (on 2026-10-13 MOD08_D3 reached 9 October), but Terra and Aqua have drifted out of their orbits because of fuel limits, shifting their overpass times,
  and NASA expects Terra science operations to end in February 2027 and Aqua's in September 2027. LAADS DAAC advises users to move to similar VIIRS products (Deep Blue AERDB, Dark Target AERDT)
  and says a final calibration (v8.0) will support one last reprocessing after operations end. As of 2026-10-13, CMR lists only Version 6.1 of the MODIS atmosphere products.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra (MOD04, MOD08) from 2000-02-24; Aqua (MYD04, MYD08) from 2002-07-04. On 2026-10-13 LAADS held data up to early October 2026 (MOD08_D3 A2026282).
    C6.1 was reprocessed for the full record from September to December 2017 (Terra) and January to March 2018 (Aqua); since 30 April 2018 only C6.1 has been produced. No new data will appear once Terra and Aqua operations end.

resolution:
  spatial_short: "10 km (0.09°)"
  temporal_short: "1일"
  spatial: >-
    L2 swath: 10 km at nadir (10×10 pixel boxes, MOD04_L2/MYD04_L2) and 3 km at nadir (Dark Target only, MOD04_3K/MYD04_3K), growing larger away from nadir /
    L3: global 1°×1° equal-angle grid (360×180, MOD08_D3/E3/M3)
  vertical: Total column (aerosol optical depth); no vertical profile information
  temporal: >-
    L2 in 5-minute granules (orbital swaths), one daytime overpass per satellite per day (several at high latitudes) / L3 daily (D3), 8-day (E3) and monthly (M3).
    Nominal equator crossing times are 10:30 descending (Terra) and 13:30 ascending (Aqua) local time, but orbit drift has changed them.

coverage:
  short: 전지구
  note: "Daytime clear sky only; not over snow or ice"
update: Daily (L3 daily files around the day after observation); 8-day and monthly products after each period ends. A near-real-time (NRT) version is served separately by LANCE
license: Freely available without restriction under the NASA EOSDIS data use policy. Downloading (including HTTPS and OPeNDAP) needs a free NASA Earthdata Login; citation of the dataset DOI is requested.
account_required: true

summary: >-
  Clear-sky aerosol optical depth (AOD) retrieved from MODIS visible and near-infrared reflectance. Each file carries two families of retrievals from different algorithms.
  Dark Target (DT) works over ocean and over dark, vegetated land; Deep Blue (DB) works over all land, including bright desert surfaces; a combined AOD (`AOD_550_Dark_Target_Deep_Blue_Combined`) merges the two.
  Collection 6.1 improved DT retrievals over urban areas and added per-pixel uncertainty estimates to DB. The products are the standard 10 km L2, a 3 km DT L2 for air quality work and 1° gridded L3 (daily, 8-day, monthly),
  with separate Terra (morning) and Aqua (afternoon) versions.

time_convention:
  summary: >-
    L2 (MOD04) values are clear-sky observations at the moment of the overpass; because they rely on reflected sunlight, they exist only in daytime. The time in the file name (AYYYYDDD.HHMM) is the start of the 5-minute granule (UTC).
    The L3 daily product (MOD08_D3) holds statistics (mean, standard deviation, QA-weighted mean, etc.) of the day's L2 pixels in each 1° cell, and the 8-day (E3) and monthly (M3) products average the daily means (`_Mean_Mean`).
  points:
    - "Nominally Terra crosses the equator descending at 10:30 local time and Aqua ascending at 13:30, both in daylight. Even for one satellite the observation time of each pixel varies with swath position and latitude; the `Scan_Start_Time` variable gives it."
    - "Orbit drift: after its last inclination adjustment on 27 February 2020, Terra moved steadily earlier, reaching 10:15 by autumn 2022; Aqua, after its last adjustment on 8 March 2021, has moved later and was expected to reach about 15:50 around August 2026. Aerosol varies through the day and retrievals depend on solar geometry, so take care with long-term trends."
    - "L3 daily files follow the UTC date, but since C6 the window is widened by up to 3 hours on either side to reduce gaps and overlaps near the date line (L3 ATBD)."
    - "8-day (E3) products are built from 8 consecutive daily files, with intervals restarting on 1 January, so the last interval of a year can run into early January. Monthly (M3) products use all daily files in the calendar month, and C6.1 monthly aerosol cells need at least 3 valid days."
    - "`_Mean` weights every L2 pixel equally, while `_QA_Mean` weights pixels by their L2 confidence flag (3 counts three times, 2 twice, 1 once, 0 excluded). According to the L3 ATBD tables, the 8-day and monthly aerosol values (`_Mean_Mean`) give each daily mean equal weight (cloud and water vapour use pixel-count weighting)."
    - "The near-real-time (NRT, LANCE) version arrives sooner than the standard product but is made separately from standard processing at LAADS, so values can differ. Use the standard product for research time series."
  source: https://atmosphere-imager.gsfc.nasa.gov/sites/default/files/ModAtmo/L3_ATBD_C6_C61_2019_02_20.pdf
  source_name: "MODIS Atmosphere L3 Global Gridded Product User's Guide & ATBD (C6 and C6.1) + MOD04_L2 collection description (CMR) + NASA Terra article and LP DAAC Aqua orbit plan"

variables:
  note: >-
    SDS names from the CMR variable records (UMM-Var) and the C6.1 documents. Files are HDF-EOS2 (HDF4) with integer storage, so physical value = scale_factor × (stored value − add_offset), as defined in the MODIS Atmosphere L3 ATBD (add_offset is subtracted).
    AOD is dimensionless and referenced to 550 nm (0.55 µm). MYD (Aqua) files use the same names.
  full_list: https://atmosphere-imager.gsfc.nasa.gov/products/aerosol
  groups:
    - name: L2 swath 10 km (MOD04_L2, MYD04_L2) and 3 km (MOD04_3K, DT only)
      kind: instant
      period: overpass time
      items:
        - text: "DT ocean and land aerosol optical depth at 550 nm (recommended quality only) — `Optical_Depth_Land_And_Ocean` (dimensionless)"
          std: [aerosol]
          note: Field for science use, holding ocean values with QA 1–3 and land values with QA 3. Also present under the same name in the 3 km files
        - text: "DT ocean and land aerosol optical depth at 550 nm (all quality) — `Image_Optical_Depth_Land_And_Ocean` (dimensionless)"
          std: [aerosol]
          note: Imagery field holding QA 0–3; not for quantitative analysis
        - text: "DT/DB combined aerosol optical depth at 550 nm — `AOD_550_Dark_Target_Deep_Blue_Combined` (dimensionless)"
          std: [aerosol]
          note: DT over ocean; over land one of DT, DB or a blend of both (see the algorithm flag). 10 km files only
        - "Combined AOD algorithm flag — `AOD_550_Dark_Target_Deep_Blue_Combined_Algorithm_Flag` (0 = DT, 1 = DB, 2 = mixed)"
        - "Combined AOD confidence flag — `AOD_550_Dark_Target_Deep_Blue_Combined_QA_Flag` (0 = no confidence or fill, 1 = marginal, 2 = good, 3 = very good)"
        - text: "DB land aerosol optical depth at 550 nm (QA 2 and 3) — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Best_Estimate` (dimensionless)"
          std: [aerosol]
        - "DB land AOD estimated uncertainty (1σ) — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Estimated_Uncertainty` (dimensionless)"
        - "DB confidence flag — `Deep_Blue_Aerosol_Optical_Depth_550_Land_QA_Flag` (0–3)"
        - "DB land Ångström exponent — `Deep_Blue_Angstrom_Exponent_Land` (dimensionless)"
        - "DT ocean Ångström exponent, 550/860 nm — `Angstrom_Exponent_1_Ocean` (dimensionless)"
        - "DT ocean and land quality flag — `Land_Ocean_Quality_Flag` (0 = bad, 1 = marginal, 2 = good, 3 = very good)"
        - text: "Scan start time — `Scan_Start_Time` (seconds, TAI time)"
          note: Observation time of each pixel. In the 3 km files a known interpolation error makes it drift by up to about 12 minutes within a granule
    - name: L3 daily 1° (MOD08_D3, MYD08_D3)
      kind: mean
      period: daily (UTC date, widened by up to 3 hours)
      items:
        - text: "DT/DB combined aerosol optical depth at 550 nm, daily mean — `AOD_550_Dark_Target_Deep_Blue_Combined_Mean` (dimensionless)"
          std: [aerosol]
        - text: "DT ocean and land aerosol optical depth at 550 nm, daily mean — `Aerosol_Optical_Depth_Land_Ocean_Mean` (dimensionless)"
          std: [aerosol]
        - text: "DB land aerosol optical depth at 550 nm, daily mean — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Mean` (dimensionless)"
          std: [aerosol]
        - text: "DT land aerosol optical depth, QA-weighted daily mean (470, 550, 660 nm) — `Aerosol_Optical_Depth_Land_QA_Mean` (dimensionless)"
          std: [aerosol]
          note: Mean weighted by the L2 confidence flag
        - text: "Combined AOD daily maximum — `AOD_550_Dark_Target_Deep_Blue_Combined_Maximum` (dimensionless)"
          kind: max
          std: []
        - text: "DT ocean and land AOD pixel counts — `Aerosol_Optical_Depth_Land_Ocean_Pixel_Counts` (count)"
          kind: accum
          std: []
    - name: L3 8-day and monthly 1° (MOD08_E3 8-day / MOD08_M3 monthly)
      kind: mean
      period: 8 days or month (mean of daily means)
      items:
        - text: "DT/DB combined aerosol optical depth at 550 nm — `AOD_550_Dark_Target_Deep_Blue_Combined_Mean_Mean` (dimensionless)"
          std: [aerosol]
          note: Average of the daily mean values
        - text: "DT ocean and land aerosol optical depth at 550 nm — `Aerosol_Optical_Depth_Land_Ocean_Mean_Mean` (dimensionless)"
          std: [aerosol]
        - text: "DB land aerosol optical depth at 550 nm — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Mean_Mean` (dimensionless)"
          std: [aerosol]
        - text: "Combined AOD, maximum of the daily means in the period — `AOD_550_Dark_Target_Deep_Blue_Combined_Mean_Max` (dimensionless)"
          kind: max
          std: []

access:
  - name: LAADS DAAC (search, order and direct download)
    url: https://ladsweb.modaps.eosdis.nasa.gov/search/order/1/MOD08_D3--61
    method: Web search, direct HTTPS download (archive/allData/61/<short name>/) / LAADS API-V2 / OPeNDAP
    note: >-
      Example short names: MOD04_L2, MYD04_L2, MOD04_3K, MYD04_3K, MOD08_D3, MOD08_E3, MOD08_M3 (MYD for Aqua). All are C6.1 (archive 61; CMR version "6.1").
      Since 2026-04-30 OPeNDAP also requires Earthdata Login, and the old LAADS Classic API was retired on 2026-08-31, so scripts must move to API-V2.
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search/granules?p=C1443727145-LAADS
    method: Web search / earthaccess (Python)
    note: The link points to MOD08_D3 C6.1; search other products by short name. Files are also served from Earthdata Cloud (s3://prod-lads).
  - name: LANCE near-real-time (NRT) MOD04_L2
    url: https://search.earthdata.nasa.gov/search/granules?p=C1426436561-LANCEMODIS
    method: Web search / HTTPS
    note: Near-real-time version (version 6.1NRT, DOI 10.5067/MODIS/MOD04_L2.NRT.061, from 2017-10-11). Use it when speed matters, such as hazard monitoring; use the standard product for research time series.

example:
  lang: python
  note: >-
    Downloads a Terra MOD08_D3 daily file with earthaccess and reads the combined AOD daily mean with pyhdf. MODIS atmosphere products subtract add_offset from the stored value before multiplying by scale_factor, so convert by hand.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MOD08_D3", version="6.1",
        temporal=("2024-04-01", "2024-04-03"),
    )
    files = earthaccess.download(results, "mod08")

    hdf = SD(files[0], SDC.READ)
    sds = hdf.select("AOD_550_Dark_Target_Deep_Blue_Combined_Mean")
    raw = sds.get().astype("float64")
    att = sds.attributes()
    aod = np.where(raw == att["_FillValue"], np.nan,
                   att["scale_factor"] * (raw - att["add_offset"]))  # 1° grid, 180×360
    # row 0 = 89–90°N, column 0 = 180–179°W
    lat = 89.5 - np.arange(180); lon = -179.5 + np.arange(360)
    j = np.argmin(abs(lat - 37.5)); i = np.argmin(abs(lon - 127.0))
    print("AOD in the 1° cell near Seoul:", aod[j, i])

tips:
  - "Which algorithm feeds the combined AOD (`AOD_550_Dark_Target_Deep_Blue_Combined`) changes with region and season (see `_Algorithm_Flag`). In a long record for one region, switching algorithms can show up as a jump in the values, so use DT or DB alone if needed."
  - "For quantitative work use `Optical_Depth_Land_And_Ocean` (ocean QA ≥ 1, land QA = 3) or the DB `_Best_Estimate` (QA 2 and 3); do not use all-quality fields such as `Image_Optical_Depth_Land_And_Ocean`."
  - "In the HDF4 files the physical value is scale_factor × (stored value − add_offset). The sign is opposite to the common 'stored × scale + offset' convention, so take care when reading with pyhdf and similar tools. Values outside valid_range are not screened out."
  - "Terra and Aqua differ in overpass time and calibration, so their AOD levels differ slightly (Sawyer et al., 2025 report DT Terra about 0.015 higher than Aqua). Rather than averaging both together, pick one satellite as the reference, and check the overpass time change in the orbit drift period after 2020 (Terra) and 2021 (Aqua)."
  - "The 3 km product (MOD04_3K) uses the same DT algorithm and lookup tables but changes pixel selection, the minimum number of good pixels and quality handling for air quality users. It has DT values only, with no combined AOD or DB fields."
  - "According to the MODIS Atmosphere issues list, the C6.1 DB cloud screening update that reduces low stratus contamination applies only to data produced since autumn 2019; earlier data will get it in the next reprocessing. Be careful when comparing DB records over marine stratus regions across that date."
  - "L3 daily means (`_Mean`) collect only clear pixels, so cloudy days and regions have few samples. Check `_Pixel_Counts`, and interpret monthly cells with few valid days with care."
  - "AOD is not the same thing as surface PM2.5. It is column-integrated extinction, so its relationship with surface concentration depends on boundary layer height and humidity."

