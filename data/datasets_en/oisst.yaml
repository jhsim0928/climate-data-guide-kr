notices:
  - date: "2026-10-02"
    level: warning
    title: "NCEI Data Access Delays (cloud migration, planned through 2026-10-30)"
    body: >-
      NCEI is moving its data and applications to the cloud, which may result in temporary data access delays. Order fulfillment services may also be degraded
      during this period, with empty or incomplete results. If downloads fail, use the PSL, AWS or Google Cloud copies.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2023-04-01"
    level: info
    title: v2.1b — ship SST bias correction changed to a monthly time-dependent scheme
    body: The ship SST bias correction changed from a constant to a monthly time-dependent scheme, consistent with ERSST v5, to account for ship biases that vary over time. It applies only to data produced from this date.
    source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
  - date: "2021-10-01"
    level: info
    title: v2.1a — satellite input switched to NOAA ACSPO SST
    body: The satellite SST input switched from Navy SST to NOAA ACSPO SST, partly because of the deorbit of METOP-A. It applies only to data produced from this date.
    source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
  - date: "2020-04-01"
    level: info
    title: v2.1 released, replacing v2.0
    body: v2.1 replaced v2.0, whose production stopped on April 26, 2020 after its input datasets were discontinued. Data from 2016 onward were improved.
    source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst

