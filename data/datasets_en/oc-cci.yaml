notices:
  - date: "2026-01-19"
    level: info
    title: Downloads of OC-CCI v6.0 data at CEDA restored (unavailable since 2025-11-20)
    body: >-
      CEDA announced on 20 November 2025 that downloads of OC-CCI v6.0 records (such as sinusoidal chlor_a) were temporarily unavailable, and on 19 January 2026 that online access had been restored.
      Re-run any automated downloads that failed during this period.
    source: https://catalogue.ceda.ac.uk/uuid/474ac06235e54e6cb0ec6eed635e1213/
  - date: "2025-05"
    level: info
    title: OC-CCI enters CCI+ Phase 2 — v7.0 in preparation
    body: >-
      The Ocean Colour project began CCI+ Phase 2 in May 2025 with the same consortium, continuing to extend and improve the record. The processing system has moved into an operational setting in Copernicus,
      and the v6.0 user guide said the next version, v7.0, was planned for 2025 or 2026 (not yet released when checked on 2026-10-13).
    source: https://climate.esa.int/en/projects/ocean-colour/about/
  - date: "2023-08-08"
    level: info
    title: OC-CCI v6.0 4 km collection published at CEDA (DOI assigned)
    body: >-
      The v6.0 4 km data for 1997-09-04 to 2022-12-31 (sinusoidal and lat–lon grids; daily, 5-day, 8-day, monthly and yearly composites; monthly climatology) were archived at CEDA under the collection DOI
      10.5285/5011d22aae5a4671b0cbc7d05c56c4f0. The main changes from v5.0 are the addition of Sentinel-3B OLCI, the fourth MERIS reprocessing, OLCI bug fixes and QAA v6.
    source: https://catalogue.ceda.ac.uk/uuid/5011d22aae5a4671b0cbc7d05c56c4f0/
  - date: "2022-06-01"
    level: warning
    title: Reflectance jump in C3S CDS v5.0 (December 2020 to February 2021) — fixed in v5.0.1
    body: >-
      A spurious jump in remote-sensing reflectance from December 2020 to February 2021 was reported in the C3S CDS v5.0 release, and a corrected v5.0.1 was published in the CDS.
      The CDS request form now marks v5.0 and v5.0.1 as deprecated, with v6.0 as the default.
    source: https://cds.climate.copernicus.eu/datasets/satellite-ocean-colour?tab=documentation
  - date: "2021-05-19"
    level: info
    title: OC-CCI v5.0 released — first version with OLCI
    body: >-
      v5.0 (1997-09 to 2020-12, DOI 10.5285/1dbe7a109c0244aaad713e078fd3059a), the first version to include Sentinel-3A OLCI, was released. It has since been superseded by v6.0.
    source: https://climate.esa.int/en/projects/ocean-colour/data/

transitions:
  - from: OC-CCI v5.0
    to: OC-CCI v6.0
    status: completed
    summary: >-
      Adds Sentinel-3B OLCI, uses the fourth MERIS reprocessing, and applies OLCI bug fixes, updated system vicarious calibration (SVC) and masking, and QAA v6.
      MODIS and VIIRS were dropped after 2019, changing the sensor mix in recent years.
    changes:
      - aspect: Period (CEDA CDR)
        before: 1997-09-04 to 2020-12-31
        after: 1997-09-04 to 2022-12-31 (then C3S and PML extensions)
      - aspect: Input sensors
        before: SeaWiFS, MERIS (earlier reprocessing), MODIS-Aqua, VIIRS, OLCI-A
        after: "SeaWiFS, MERIS (fourth reprocessing), MODIS-Aqua and VIIRS (through 2019), OLCI-A, OLCI-B (2018 onward)"
      - aspect: IOP and Kd(490) algorithms
        before: v5.0 system
        after: "IOPs from QAA_v6G with Zhang backscattering coefficients; Kd(490) from a Lee variant with Zhang coefficients"
      - aspect: Processing improvements
        before: "-"
        after: OLCI bug fixes, updated SVC and masking
      - aspect: DOI
        before: 10.5285/1dbe7a109c0244aaad713e078fd3059a
        after: 10.5285/5011d22aae5a4671b0cbc7d05c56c4f0
    impacts:
      - Do not splice the two versions into one series. From 2019 onward the input sensors differ, so coverage and values differ from v5.0.
      - When downloading from the C3S CDS, set version to 6_0 explicitly. 5_0 and 5_0_1 are deprecated.
    sources:
      - name: C3S CDS dataset overview (v6.0 changes)
        url: https://cds.climate.copernicus.eu/datasets/satellite-ocean-colour?tab=overview
      - name: OC-CCI Product User Guide v6.5 (D4.2)
        url: https://www.climate.esa.int/documents/3068/D4.2_-_OC-CCI_Product_User_Guide_PUG_v6.5b.docx
      - name: CEDA — v5.0 record (Superseded)
        url: https://catalogue.ceda.ac.uk/uuid/8154e881452f49c1ba86982ed88b20f0
  - from: OC-CCI v6.0
    to: OC-CCI v7.0
    status: planned
    summary: >-
      The next version, in preparation under CCI+ Phase 2. Plans include an updated in situ database, re-evaluated calibration and new OLCI-era bands (400, 620, 681 and 709 nm). No release date has been announced.
    changes:
      - aspect: Reflectance bands (OLCI era)
        before: 412, 443, 490, 510, 560, 665 nm
        after: The existing six plus planned 400, 620, 681 and 709 nm
      - aspect: Release
        before: v6.0 (CEDA, 2023-08)
        after: Planned for 2025–2026 in the user guide; not released when checked on 2026-10-13
    impacts:
      - v7.0 will reprocess the full record, so do not mix it with v6.0 and state the version clearly.
    sources:
      - name: OC-CCI Product User Guide v6.5 (v7.0 plans)
        url: https://www.climate.esa.int/documents/3068/D4.2_-_OC-CCI_Product_User_Guide_PUG_v6.5b.docx
      - name: IOCS 2025 agency talk (NCEO, OC-CCI V7 plans)
        url: https://iocs.ioccg.org/wp-content/uploads/2025/12/AgencyTalk_Groom_NCEO_rr.pdf

