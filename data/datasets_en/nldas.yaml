# ─────────────────────────────────────────────────────────────
# NLDAS-2 — dataset information file
# Listed under the Land tab, 'Land reanalyses & data assimilation'. Covers the NLDAS-2 netCDF (V2.0) forcing (FORA, FORB) and the Noah, Mosaic and VIC output.
# As of 2026-10-13 only beta forcing for NLDAS-3 has been released, so it is described as a planned transition rather than on its own page.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: nldas
name: "NLDAS-2"
full_name: North American Land Data Assimilation System Phase 2 (NLDAS-2 — 0.125° hourly forcing and Noah, Mosaic and VIC land surface model output)
category: reanalysis
domain: land
group: 육상 재분석·자료동화
order: 22
domains: [육지, 수문]
provider: NLDAS project (NASA GSFC Hydrological Sciences Laboratory, NOAA NCEP EMC and partners) / GES DISC

status: active
status_note: >-
  The netCDF version (V2.0) is updated daily with about a 4-day lag (on 2026-10-13 the hourly Noah output reached 2026-10-08 23Z and the monthly files 2026-09).
  The older GRIB-1 version (V002) stopped updating with data valid at 23Z on 1 August 2024, and August 2022 to March 2024 was reprocessed in June 2024 after a forcing error.
  The successor, NLDAS-3 (1 km), is still in development with only beta forcing released, and the GES DISC on-premises server that hosts the files (hydro1) may close after 30 September 2026.

period:
  start: "1979-01"
  end: present
  note: >-
    Hourly forcing (FORA, FORB) starts at 13Z on 1979-01-01 and model output (Noah, Mosaic, VIC) around 00Z on 1979-01-02 (01Z for Noah and 00Z for Mosaic and VIC in CMR).
    Monthly files start in 1979-01 and the monthly climatology (MC) is a 40-year 1981–2020 average. On 2026-10-13 hourly Noah reached 2026-10-08 23Z, FORA 2026-10-09 12Z and the monthly files 2026-09.

resolution:
  spatial_short: "14 km (0.125°)"
  temporal_short: "1시간"
  spatial: >-
    1/8° (0.125°) latitude-longitude grid of 464 × 224, 25–53°N, 125–67°W (centred on the conterminous US, with parts of southern Canada and northern Mexico).
    Cell centres run from (124.9375°W, 25.0625°N) to (67.0625°W, 52.9375°N). The forcing is interpolated and temporally disaggregated from 32 km, 3-hourly NARR fields.
  vertical: >-
    Single surface level plus soil. Noah has 4 soil layers (0–10, 10–40, 40–100, 100–200 cm) plus 0–100 and 0–200 cm totals; VIC has 3 soil layers (layer1–3); Mosaic also has layered output.
    Wind, temperature and humidity in the FORB forcing are on a NARR hybrid level.
  temporal: "Hourly (FORA, FORB, Noah, Mosaic, VIC) / monthly (same five products) / 1981–2020 monthly climatology"

coverage:
  short: 북미
  note: "25–53°N, 125–67°W (conterminous US, with parts of southern Canada and northern Mexico)"
update: "Daily, about 4 days behind real time (each day's forcing is typically added as a 12Z–12Z block) / monthly files about 10–15 days after the start of the following month"
license: NASA Earth science open data — free of charge. Downloading from GES DISC requires a free NASA Earthdata Login; please cite the product DOI
account_required: true

summary: >-
  NLDAS-2 is a land dataset for the conterminous US and surroundings run jointly by NASA, NOAA and partners. It provides 0.125° hourly forcing built from observation-based precipitation
  (CPC daily gauge analysis disaggregated with radar) and NARR meteorology, together with soil moisture, evapotranspiration, runoff, snow and energy fluxes from the Noah, Mosaic and VIC
  land surface models driven by that forcing, from 1979 onward. Despite the name, it is an open-loop simulation without data assimilation, and the forcing alone is widely used to drive other
  hydrological models. It is widely used for drought monitoring and hydrological research, and a successor, NLDAS-3 (1 km, North and Central America), is under development.

time_convention:
  summary: >-
    Hourly files are labelled by GMT hour, and each variable is either instantaneous (point), averaged over the previous hour (mean) or accumulated over the previous hour (sum); the mean and sum
    values in a 03Z file cover 02–03Z. In monthly files, rainfall, snowfall, evapotranspiration, runoff and snowmelt (plus FORA convective precipitation and potential evaporation) are monthly totals (kg m-2), and everything else is a monthly mean.
  points:
    - "In the FORA forcing, temperature, humidity, pressure, wind, downward longwave, downward shortwave and CAPE are instantaneous values at the top of the hour; precipitation `Rainf` and potential evaporation `PotEvap` are totals over the previous hour (kg m-2 = mm). The files' cell_methods attributes record the same distinction."
    - "Downward shortwave and longwave are instantaneous in the FORA forcing files but hourly backward averages as `SWdown` and `LWdown` in the Noah output files. Be careful when mixing the two."
    - "In model output, energy fluxes (`SWnet`, `LWnet`, `Qle`, `Qh`, `Qg`) and evaporation components are previous-hour means (W m-2), water fluxes (`Rainf`, `Snowf`, `Evap`, `Qs`, `Qsb`, `Qsm`) are previous-hour totals (kg m-2), and states (soil moisture, soil temperature, snow, LAI, albedo, skin temperature) are instantaneous at the top of the hour."
    - "There is no daily product; build daily values from the hourly files. Because the 03Z file covers 02–03Z, a 00–24Z daily total is the sum of the 24 files from 01Z that day to 00Z the next day. Hourly precipitation is disaggregated so that the CPC daily gauge totals are preserved, so a 00–24Z total can differ from the CPC daily value if the CPC day is defined differently."
    - "Monthly files cover 00Z on the 1st to 23:59Z on the last day. The only exception is January 1979, which starts at 00Z on 2 January (12Z on 1 January for FORA precipitation, convective precipitation and PotEvap, and FORB precipitation)."
    - "`time` is in 'hours since 1979-01-01 00:00:00' and `time_bnds` holds the averaging or accumulation interval."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/NLDAS2_README.pdf
  source_name: "NLDAS-2 README (README Document for NLDAS Phase 2 netCDF, last revised 2023-07-07) + GES DISC netCDF file attributes + NLDAS FAQ"

variables:
  note: >-
    Main variables from the NLDAS-2 netCDF (V2.0) README tables (Tables 3 and 6) and GES DISC files (NLDAS_FORA0125_H, NLDAS_NOAH0125_M). Names are ALMA-convention netCDF names
    and differ from the GRIB-1 PDS-number names. Mosaic and VIC output use the same naming pattern and differ only in the soil variables (VIC uses `SoilM_layer1` to `3`, etc.).
    The optional secondary forcing FORB holds NARR precipitation, NARR hybrid-level temperature, humidity, pressure and wind with their height, aerodynamic conductance and more (see the README for the list).
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/NLDAS2_README.pdf
  groups:
    - name: Primary forcing FORA (hourly, instantaneous at the top of the hour)
      kind: instant
      items:
        - "2 m air temperature — `Tair` (K)"
        - "2 m specific humidity — `Qair` (kg kg-1)"
        - "Surface pressure — `PSurf` (Pa)"
        - "10 m zonal and meridional wind — `Wind_E`, `Wind_N` (m s-1)"
        - text: "Surface downward shortwave radiation — `SWdown` (W m-2)"
          note: Bias-corrected with GOES-based shortwave; instantaneous in the forcing files
        - "Surface downward longwave radiation — `LWdown` (W m-2)"
        - "Convective available potential energy — `CAPE` (J kg-1)"
    - name: Primary forcing FORA (hourly, total over the previous hour)
      kind: accum
      period: 1-hour
      items:
        - text: "Total precipitation — `Rainf` (kg m-2)"
          note: CPC daily gauge analysis (PRISM orographic adjustment) disaggregated with radar, CMORPH or NARR in that order
        - text: "Potential evaporation — `PotEvap` (kg m-2)"
          note: Modified Penman scheme from NARR
        - text: "Convective fraction of precipitation — `CRainf_frac` (fraction)"
          note: cell_methods says sum, but the value is the convective share of the previous hour's precipitation; monthly files carry convective precipitation `CRainf` (kg m-2)
    - name: Noah output — energy fluxes (hourly, previous-hour mean)
      kind: mean
      period: 1-hour
      items:
        - "Net shortwave and longwave radiation — `SWnet`, `LWnet` (W m-2)"
        - "Latent heat flux — `Qle` (W m-2)"
        - "Sensible heat flux — `Qh` (W m-2)"
        - "Ground heat flux — `Qg` (W m-2)"
        - "Snow phase-change heat flux — `Qf` (W m-2)"
        - "Surface downward shortwave and longwave radiation — `SWdown`, `LWdown` (W m-2)"
        - "Potential evaporation — `PotEvap` (W m-2)"
        - "Canopy water evaporation, transpiration, bare-soil evaporation, snow sublimation — `ECanop`, `TVeg`, `ESoil`, `SubSnow` (W m-2)"
    - name: Noah output — water fluxes (hourly, previous-hour total)
      kind: accum
      period: 1-hour
      items:
        - "Rainfall (liquid precipitation) — `Rainf` (kg m-2)"
        - "Snowfall — `Snowf` (kg m-2)"
        - "Total evapotranspiration — `Evap` (kg m-2)"
        - "Surface runoff — `Qs` (kg m-2)"
        - "Subsurface runoff (baseflow) — `Qsb` (kg m-2)"
        - "Snowmelt — `Qsm` (kg m-2)"
        - text: "Streamflow — `Streamflow` (m3 s-1)"
          kind: mean
          note: Undefined outside the NWS River Forecast Center domain
    - name: Noah output — states (hourly, instantaneous at the top of the hour)
      kind: instant
      items:
        - "Average surface skin temperature — `AvgSurfT` (K)"
        - "Albedo — `Albedo` (%)"
        - "Snow water equivalent — `SWE` (kg m-2)"
        - "Snow depth — `SnowDepth` (m)"
        - "Snow cover — `SnowFrac` (fraction)"
        - "Soil moisture — `SoilM_0_10cm`, `SoilM_10_40cm`, `SoilM_40_100cm`, `SoilM_100_200cm`, `SoilM_0_100cm`, `SoilM_0_200cm`, `RootMoist` (kg m-2)"
        - "Liquid soil moisture — `SMLiq_0_10cm` etc. (kg m-2)"
        - "Soil moisture availability — `SMAvail_0_100cm`, `SMAvail_0_200cm` (%)"
        - "Soil temperature — `SoilT_0_10cm`, `SoilT_10_40cm`, `SoilT_40_100cm`, `SoilT_100_200cm` (K)"
        - "Plant canopy surface water — `CanopInt` (kg m-2)"
        - "Leaf area index — `LAI` (unitless)"
    - name: Monthly files (NLDAS_*0125_M)
      kind: mean
      period: Monthly
      items:
        - text: "Monthly precipitation — `Rainf` (kg m-2)"
          kind: accum
          note: Monthly total (total precipitation in FORA, rainfall in Noah)
        - text: "Monthly evapotranspiration, surface and subsurface runoff, snowmelt — `Evap`, `Qs`, `Qsb`, `Qsm` (kg m-2)"
          kind: accum
          note: Monthly totals
        - "Monthly mean soil moisture — `SoilM_0_10cm` etc. (kg m-2)"
        - "Monthly mean latent and sensible heat flux — `Qle`, `Qh` (W m-2)"
        - "Monthly mean 2 m air temperature (FORA) — `Tair` (K)"

access:
  - name: NASA GES DISC — NLDAS dataset list
    url: https://disc.gsfc.nasa.gov/datasets?keywords=NLDAS
    method: HTTPS download / earthaccess / Earthdata Search / OPeNDAP / subsetting
    note: >-
      Short names are NLDAS_<FORA|FORB|NOAH|MOS|VIC>0125_<H|M|MC>, version 2.0 (file names end in .020.nc). The GRIB-1 version (V002) has not been updated since 2024-08-01.
      SAC model output is not at GES DISC; it is only on the NOAA NCEP/EMC NLDAS website. A free Earthdata Login is required, and the old server (hydro1.gesdisc.eosdis.nasa.gov)
      may close after 30 September 2026, so switch to data.gesdisc.earthdata.nasa.gov or earthaccess.
  - name: AWS us-west-2 direct access (S3)
    url: https://data.gesdisc.earthdata.nasa.gov/s3credentials
    method: Cloud storage (S3, in-region us-west-2 only)
    note: "Example: s3://gesdisc-cumulus-prod-protected/NLDAS/NLDAS_FORA0125_H.2.0/ — temporary credentials are required."
  - name: NASA Giovanni
    url: https://giovanni.gsfc.nasa.gov/
    method: Web maps and time series; NetCDF, GeoTIFF and KMZ downloads
    note: Quick area-mean time series.
  - name: NASA LDAS — NLDAS
    url: https://ldas.gsfc.nasa.gov/nldas
    method: Documentation, FAQ and news
    note: Forcing configuration, known issues, reprocessing notices and NLDAS-3 development news.

example:
  lang: python
  note: >-
    Uses earthaccess to download the FORA hourly files for 1 July 2023 and build the 00–24Z daily precipitation (mm). Because the 03Z file holds the 02–03Z total,
    the 24 files from 01Z that day to 00Z the next day are used. You will be asked for your Earthdata credentials on the first run.
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="NLDAS_FORA0125_H", version="2.0",
        temporal=("2023-07-01T01:00:00", "2023-07-02T00:00:00"),   # files 01Z to next-day 00Z = 00-24Z totals
        bounding_box=(-125, 25, -67, 53),
    )
    files = earthaccess.download(results, "nldas_fora_h")

    ds = xr.open_mfdataset(files, combine="by_coords")
    print(ds.time.values)                     # check there are 24 time steps
    daily_precip = ds["Rainf"].sum("time")    # kg m-2 = mm, 2023-07-01 00-24Z
    tmax = ds["Tair"].max("time") - 273.15    # highest of the hourly instantaneous values (deg C)
    print(float(daily_precip.mean()), float(tmax.mean()))

tips:
  - "`SWdown` and `LWdown` are instantaneous in the FORA forcing but previous-hour means in the Noah output files. Check which file you use when computing daily mean radiation."
  - "Hourly `Rainf` is a previous-hour total (kg m-2 = mm), not a rate. Sum the 01Z to next-day 00Z files for a daily total; monthly `Rainf` is already the monthly total, so do not multiply by the number of days again."
  - "From August 2022 to 1 March 2024, an error in the NCEP R-CDAS snow-depth input made temperatures too warm, so snow, runoff and soil moisture (especially in winter 2022–23) were wrong; the period was reprocessed on 7 June 2024. Re-download any data for this period obtained before then."
  - "Known issues: unrealistic precipitation on the Canadian side of the US–Canada border in many years; isolated very dry spots from gauge quality-control problems; and a change in precipitation behaviour from 1 January 2012 due to a new interpolation algorithm, notably along the US–Mexico border, in western mountains and along coastlines. The README states these cannot be fixed by regenerating the data at this time."
  - "Mosaic output: the four evaporation fluxes had reversed signs in the GRIB files (corrected in netCDF), and canopy conductance has been incorrectly defined since 01Z on 2008-03-09, which carries over to netCDF."
  - "Noah soil moisture such as `SoilM_0_100cm` is in kg m-2 (mm). Divide by the layer thickness in mm to get volumetric water content."
  - "The old GRIB-1 version (V002) uses different variable names from netCDF V2.0 and has not been updated since 23Z on 2024-08-01. On 2026-10-13 no V002 collections appeared in NASA CMR, so move scripts to V2.0."
  - "The monthly climatology (MC) in the netCDF version averages 1981–2020 (40 years; the old GRIB version used 1980–2009). State the baseline when computing anomalies."

