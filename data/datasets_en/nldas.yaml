transitions:
  - from: NLDAS-2 GRIB-1 (V002)
    to: NLDAS-2 netCDF (V2.0)
    status: completed
    date: "2024-08"
    summary: >-
      V2.0, the same NLDAS-2 data rewritten as CF/ALMA-convention netCDF, was released in 2020–2021, and the GRIB-1 version (V002) stopped updating with data valid at 23Z on 1 August 2024.
    changes:
      - aspect: Format and version
        before: "GRIB-1, version 002"
        after: "netCDF, version 2.0 (file names end in .020.nc)"
      - aspect: Variable names
        before: "GRIB PDS numbers and abbreviations"
        after: "ALMA names (`Tair`, `Rainf`, `SoilM_0_10cm`, etc.) with cell_methods attributes (point, mean, sum)"
      - aspect: Mosaic evaporation flux signs
        before: "Signs of four evaporation fluxes reversed"
        after: "Corrected"
      - aspect: Monthly climatology period
        before: "1980–2009 (30 years)"
        after: "1981–2020 (40 years)"
      - aspect: Updates
        before: "Stopped at 23Z on 2024-08-01"
        after: "Daily, about 4 days behind real time"
    impacts:
      - "GRIB scripts need both variable names and file paths changed."
      - "The climatology baseline changed, so anomaly values change too."
    sources:
      - name: NLDAS-2 GRIB-1 files no longer updated as of 1 August 2024 (NASA LDAS)
        url: https://ldas.gsfc.nasa.gov/nldas/news/nldas-2-grib-1-files-no-longer-updated-1-august-2024
      - name: NLDAS-2 README (netCDF V2.0)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/NLDAS2_README.pdf
  - from: NLDAS-2
    to: NLDAS-3
    status: planned
    summary: >-
      NASA's third-phase NLDAS raises the resolution to 1 km, extends the domain to all of North and Central America, and moves to the Noah-MP model with satellite data assimilation.
      On 2026-10-13 only beta forcing for 2001–2023 was public on AWS; model output, announced as 'expected mid-2026', had not yet appeared. NLDAS-3 is not registered at GES DISC or in CMR.
    changes:
      - aspect: Horizontal resolution and grid
        before: "0.125° (about 12.5 km), 464 × 224"
        after: "1 km, 11,700 × 6,500 grid"
      - aspect: Domain
        before: "25–53°N, 125–67°W (conterminous US focus)"
        after: "7–72°N, 169–52°W (North America including Alaska, Hawaii and Puerto Rico, plus Central America)"
      - aspect: Land surface models
        before: "Noah, Mosaic, VIC, SAC"
        after: "Noah-MP with HyMAP river routing"
      - aspect: Forcing
        before: "NARR + CPC daily gauge analysis (radar disaggregation)"
        after: "MERRA-2 and GEOS-IT background + gauges, IMERG and Canada's CaPA precipitation"
      - aspect: Data assimilation
        before: "None (open loop)"
        after: "Planned assimilation of soil moisture (SMAP and others), snow, MODIS/VIIRS LAI and GRACE/GRACE-FO terrestrial water storage"
      - aspect: Period and latency
        before: "1979-01 to present, about 4-day lag"
        after: "Beta forcing 2001–2023; planned near-real-time Early Look with about 7-hour latency"
      - aspect: Release status
        before: "Operational distribution at GES DISC"
        after: "Only beta forcing public on AWS (s3://nasa-waterinsight/NLDAS3/forcing/), with a warning that it may change substantially before the final release"
    impacts:
      - "Beta data may change substantially before release, so keep using NLDAS-2 for long-term analyses in publications for now."
      - "When NLDAS-3 arrives, resolution, model and forcing all change; do not splice it with NLDAS-2 into one series."
      - "The schedule in the April 2025 workshop slides (open loop in late summer 2025, data assimilation in late fall 2025) was not met. Check the NASA LDAS NLDAS-3 page and GitHub for release news."
    sources:
      - name: NASA LDAS — NLDAS-3
        url: https://ldas.gsfc.nasa.gov/nldas/v3
      - name: NLDAS-3 GitHub (NASAWaterInsight)
        url: https://github.com/NASAWaterInsight/NLDAS-3
      - name: NLDAS-3 Drought Workshop 3 Slides (2025-04-10)
        url: https://ldas.gsfc.nasa.gov/sites/default/files/ldas/nldas/NLDAS-3_Drought-Workshop-3_Slides.pdf

notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC on-premises servers closing — NLDAS users must move to Earthdata Cloud
    body: >-
      GES DISC announced that HTTPS access to its on-premises servers ends by 30 September 2026 and that on-premises OPeNDAP is switched off between 20 August and 30 September.
      The hydro1.gesdisc.eosdis.nasa.gov server that hosts NLDAS states that access will end 'no earlier than 30 September 2026' (still responding on 2026-10-13).
      Point scripts to data.gesdisc.earthdata.nasa.gov or use earthaccess.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2026-04-16"
    level: info
    title: GrADS Data Server (GDS) discontinued — NLDAS included
    body: >-
      The GES DISC GDS, which served the NLDAS forcing, Noah, Mosaic and VIC hourly, monthly and climatology collections, was discontinued on 6 April 2026 (announced on 15 January).
      The same data are available from Earthdata Cloud over HTTPS and through subsetting services.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-has-been-discontinued
  - date: "2024-08-01"
    level: warning
    title: NLDAS-2 GRIB-1 (V002) no longer updated — switch to netCDF (V2.0)
    body: >-
      Daily updates of the NLDAS version 002 (GRIB-1) files at GES DISC stopped with files valid at 23Z on 1 August 2024. Users are directed to the daily-updated NLDAS V2.0 netCDF data.
    source: https://ldas.gsfc.nasa.gov/nldas/news/nldas-2-grib-1-files-no-longer-updated-1-august-2024
  - date: "2024-06-07"
    level: critical
    title: All collections reprocessed for 2022-08-01 to 2024-03-01 — re-download earlier copies
    body: >-
      In August 2022 an error in the snow-depth input to NCEP R-CDAS (the real-time extension of NARR) made temperatures too warm, reducing snow in winter 2022–23 and leaving many northern soils too dry.
      The FORA, FORB, Mosaic, Noah and VIC hourly and monthly data (both netCDF and GRIB) were reprocessed for this period and released on 7 June 2024. Re-download any data for this period obtained before then.
    source: https://ldas.gsfc.nasa.gov/nldas/news/nldas-2-data-re-processed-2022-08-01-2024-03-01
  - date: "2020-04-01"
    level: info
    title: NLDAS-1 data decommissioned
    body: NLDAS phase 1 (version 001) data were removed from GES DISC on 1 April 2020. Use NLDAS-2.
    source: https://ldas.gsfc.nasa.gov/nldas/news/nldas-1-data-will-be-decommissioned-412020

