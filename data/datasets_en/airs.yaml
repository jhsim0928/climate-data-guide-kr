    url: https://disc.gsfc.nasa.gov/datacollection/AIRS3STM_7.0.html
    method: Web, HTTPS, OPeNDAP and subsetting (HDF-EOS2)
    note: Daily data are on the AIRS3STD_7.0 page and L2 on AIRS2RET_7.0. A free NASA Earthdata Login is required.
  - name: GES DISC HTTPS data directory (L3 monthly)
    url: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aqua_AIRS_Level3/AIRS3STM.7.0/
    method: HTTPS (wget, curl with Earthdata Login)
  - name: NASA Earthdata Search — AIRS2RET V7.0 (L2)
    url: https://search.earthdata.nasa.gov/search/granules?p=C1701805619-GES_DISC
    method: Earthdata Search / earthaccess
  - name: CLIMCAPS-Aqua V2 (the same AIRS observations processed with a different algorithm, netCDF)
    url: https://search.earthdata.nasa.gov/search/granules?p=C1693440795-GES_DISC
    method: Earthdata Search / earthaccess (SNDRAQIL2CCPRET and others)
    note: CLIMCAPS uses MERRA-2 as its first guess, so it has no NRT version; the same algorithm is applied to CrIS (Suomi NPP, NOAA-20) to carry the record beyond AIRS.

example:
  lang: python
  note: "Run earthaccess.login() once with a NASA Earthdata account first. AIRS L2 and L3 files are HDF-EOS2 (HDF4), so read them with pyhdf."
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="AIRS3STM", version="7.0",          # AIRS-only L3 monthly
        temporal=("2025-01-01", "2025-12-31"),
    )
    files = earthaccess.download(results[:1], "./airs")

    f = SD(files[0], SDC.READ)
    t = f.select("Temperature_A")[:].astype(float)   # (24 levels, 180 lat, 360 lon), ascending (day) orbit
    t[t == -9999] = np.nan                            # fill value
    print(t.shape, np.nanmean(t[0]))                  # mean 1000 hPa temperature (not area-weighted)

tips:
  - "Use only AIRS-only (AIRS2RET, AIRS3STD, AIRS3STM) for long-term trends. AIRX (AIRS+AMSU) ended on 2016-09-25, and the two streams differ in retrieval sampling and quality control."
  - "The L3 user guide notes unrealistic relative humidity values above 200% (sometimes up to 500%); screen them out."
  - "L3 grid values average only retrievals that pass QC (0 or 1), so heavily cloudy or rainy regions are biased toward clearer scenes. Treat cells with low counts (`_ct`) as less representative, but do not use the grid-box cloud fraction for extra QC (per the guide)."
  - "L3 grid edges fall on the dateline (180°), so longitudes run -180 to 180. Reorder the longitude bins to draw a map centred on 0°."
  - "Aqua has been drifting since December 2021, with later equator crossing times and lower altitude. Recent trends in variables with a strong diurnal cycle (surface air temperature, skin temperature, low-level humidity) can be affected by the change in observation time."
  - "No L2 or L3 products exist for 19–28 January 2026, and the January 2026 monthly mean is missing that period."
  - "V7 has no 8-day product. To combine several days, weight the daily files by `_ct`."

