notices:
  - date: "2026-03-20"
    level: warning
    title: NASA projects the end of Aqua science operations in September 2027
    body: >-
      The editor's note in the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects the end of science operations, because of fuel and power limits,
      in February 2027 for Terra, September 2027 for Aqua and August 2028 for Aura, with operations continuing until then. The end of the AIRS record is tied to this schedule.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-03-02"
    level: warning
    title: AIRS detector DC Restore anomaly — no L2/L3 for 2026-01-19 to 01-28
    body: >-
      From about 03:14 UTC on 19 January 2026 the AIRS DC Restore circuit stopped working and signals from modules M3–M10 drifted out of range until a routine guard test on 28 January restored it.
      No L2 or L3 products were generated in between; the 19 and 28 January daily files and the January 2026 monthly file are incomplete and should be used with caution.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/DC-Restore_Anomaly_Note_Final_260302_ADF1122.pdf
  - date: "2019-12-15"
    level: info
    title: AIRS Version 7 L3 released (L2 on 2019-11-27)
    body: >-
      Version 7, a full-mission reprocessing, was released. Monthly L3 means became simple averages of the daily files, and the 8-day products were dropped.
      Version 6 collections remain in CMR, but V7 is the default for new work.
    source: https://cmr.earthdata.nasa.gov/search/concepts/C1701805662-GES_DISC.html
  - date: "2016-09-24"
    level: critical
    title: AMSU-A2 power loss — AIRS+AMSU (AIRX) products end
    body: >-
      Aqua's AMSU-A2 lost power, so the combined AIRS+AMSU products (AIRX2RET, AIRX3STD, AIRX3STM) end with 24 September 2016 data.
      Users are directed to the AIRS-only products (AIRS2RET and others) after that date. AMSU-A1 keeps operating but has problem channels (5, 7 and 14).
    source: https://airs.jpl.nasa.gov/data/outages/

