# ─────────────────────────────────────────────────────────────
# AIRS (Aqua) Version 7 L2/L3 — dataset information file
# Satellite tab (Temperature and water vapour). The AIRS-only stream (AIRS2RET, AIRS3STD, AIRS3STM) is the current baseline;
# AIRS+AMSU (AIRX*) ended with the AMSU-A2 failure on 2016-09-24. CLIMCAPS-Aqua is a separate retrieval system run on the same observations.
# Key caveats: projected end of Aqua science operations (September 2027) and orbit drift.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: airs
name: "AIRS V7"
full_name: Aqua Atmospheric Infrared Sounder (AIRS) Version 7 Level 2 and Level 3 Standard Physical Retrieval
category: satellite
domain: satellite
group: 기온·수증기
order: 10
domains: [대기, 원격탐사]
provider: NASA JPL AIRS Project / NASA GES DISC

status: active
status_note: >-
  The AIRS-only Version 7 products (L2 AIRS2RET, L3 AIRS3STD and AIRS3STM) are still produced daily (as checked on 2026-10-13: L2 through 9 October, daily L3 through 6 October, monthly L3 through September 2026).
  Aqua, however, has been drifting since its last drag-makeup manoeuvre in December 2021, and NASA projects the end of Aqua science operations in September 2027 because of fuel and power limits.
  The AIRS+AMSU products (AIRX2RET, AIRX3STD, AIRX3STM) ended in September 2016 when AMSU-A2 lost power.

transitions:
  - from: AIRS+AMSU (AIRX2RET·AIRX3STD·AIRX3STM)
    to: AIRS-only (AIRS2RET·AIRS3STD·AIRS3STM)
    status: completed
    date: "2016-09"
    summary: >-
      The combined infrared plus microwave retrieval ended when AMSU-A2 lost power on 24 September 2016; the only continuing record since then is the infrared-only AIRS-only stream,
      which has been processed consistently for the whole mission from 2002.
    changes:
      - aspect: Period
        before: "2002-08-30 to 2016-09-25 (AIRX2RET V7.0, COMPLETE)"
        after: "2002-08-30 to present (AIRS2RET V7.0, ACTIVE)"
      - aspect: Input instruments
        before: AIRS infrared + AMSU-A microwave
        after: AIRS infrared only (no AMSU; surface classification uses landFrac plus forecast snow and sea-ice fields)
      - aspect: Microwave-only products
        before: "MW-only temperature, precipitable water and others (`TAirMWOnlyStd`, `totH2OMWOnlyStd`)"
        after: No MW-only products
      - aspect: Quality control (ocean surface air temperature QC threshold)
        before: 1.1 K
        after: 1.2 K
      - aspect: Why it exists
        before: Baseline product (microwave helps with cloud effects)
        after: "Built because noise in several AMSU channels rose sharply from June 2007; it became the only continuing stream after the AMSU-A2 failure"
    impacts:
      - Use AIRS-only (AIRS2RET, AIRS3STM) from the start for long time series. Splicing AIRX and AIRS at September 2016 mixes processing differences into the climate signal.
      - According to the V7 L2 guide, the AIRS+AMSU stream has a larger share of QC 0/1 (best/good) cases. Even over the same period, the samples entering AIRS-only averages can differ, so check the count (`_ct`) fields.
    sources:
      - name: AIRS/AMSU/HSB Version 7 Level 2 Product User Guide (V1.1, 2021-07-14)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L2_Product_User_Guide.pdf
      - name: CMR — AIRX2RET V7.0 (ended with AMSU-A2 power loss)
        url: https://cmr.earthdata.nasa.gov/search/concepts/C1701805641-GES_DISC.html
      - name: AIRS outages and anomalies (AIRS Project)
        url: https://airs.jpl.nasa.gov/data/outages/
  - from: AIRS Version 6
    to: AIRS Version 7
    status: completed
    date: "2019-12"
    summary: >-
      Version 7, released at the end of 2019, is the current full-mission reprocessing. At Level 3 the monthly averaging method changed, and the 8-day products and some total-column trace-gas fields were dropped.
    changes:
      - aspect: Release date
        before: Version 6
        after: "L2 AIRS2RET V7.0 2019-11-27; L3 AIRS3STD and AIRS3STM V7.0 2019-12-15 (CMR citation metadata)"
      - aspect: L3 monthly averaging
        before: "Weighted by observation counts (Averaged By Observation)"
        after: "Simple arithmetic mean of the daily products (Averaged By Day), not count-weighted"
      - aspect: L3 8-day products
        before: "8-day products such as AIRS3ST8"
        after: Not produced; build multi-day means yourself from daily files and the count (`_ct`) fields
      - aspect: Trace gases
        before: Total-column CO and CH4 fields
        after: "Total-column CO and CH4 removed; only the CO profile `CO_VMR` remains"
    impacts:
      - V6 and V7 monthly means are computed differently, so values for the same month can differ. Do not mix versions.
      - Code that used the old 8-day product (AIRS3ST8 V006) should be rewritten to aggregate V7 daily files (AIRS3STD) with count weighting.
    sources:
      - name: AIRS Version 7 Level 3 Product User Guide
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L3_User_Guide.pdf
      - name: AIRS documentation index (including V7 Changes from V6)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/AIRS_Documentation.pdf

period:
  start: "2002-08"
  end: present
  note: >-
    AIRS-only L2 (AIRS2RET) starts on 2002-08-30, daily L3 (AIRS3STD) on 2002-08-31 and monthly L3 (AIRS3STM) in September 2002. As checked on 2026-10-13,
    L2 runs through 2026-10-09, daily L3 through 2026-10-06 and monthly L3 through September 2026. AIRS+AMSU (AIRX*) ended on 2016-09-25 and AIRS+AMSU+HSB on 2003-02-05.
    No L2 or L3 products were generated for 19–28 January 2026 because of an AIRS detector anomaly.

resolution:
  spatial_short: "50 km (0.45°)"
  temporal_short: "1일"
  spatial: >-
    L2: swath data, one retrieval per field of regard (a 3×3 array of AIRS infrared fields of view of about 15 km at nadir; about 50 km at nadir),
    each granule 30 footprints across track × 45 lines along track / L3: 1° × 1° global latitude-longitude grid (180°W–180°E, 90°S–90°N, grid edges on the dateline)
  vertical: >-
    L2 standard product: temperature on 28 levels (1100–0.1 hPa), water vapour on 15 levels (the lowest 15 standard levels) / L3: temperature and geopotential height
    on 24 levels (1000–1 hPa, `StdPressureLev`), water vapour on 12 levels (1000–100 hPa, `H2OPressureLev`) and 12 layers (`H2OPressureLay`)
  temporal: >-
    L2: 6-minute granules (240 per day), orbital period 98.8 minutes, 16-day (233-orbit) repeat / L3: daily (separate ascending and descending grids) and monthly (mean of daily files).
    There is no 8-day product in V7. Near-real-time (NRT) L2 appears within about 3 hours of observation.

coverage:
  short: 전지구
update: "Daily (standard products within 72 hours of observation, NRT within about 3 hours). Monthly files appear early to mid following month"
license: Open NASA Earth science data, free and unrestricted. File downloads need a free NASA Earthdata Login; citation of the dataset DOI is requested
account_required: true

summary: >-
  Temperature and water vapour profiles, surface air temperature, clouds, and ozone, carbon monoxide and methane retrieved since 2002 from AIRS,
  the 2,378-channel hyperspectral infrared sounder on NASA's Aqua satellite, using cloud clearing to work in partly cloudy scenes.
  It comes as 6-minute L2 swath granules along the orbit and as L3 daily and monthly 1° grids kept separate for the ascending (day) and descending (night) passes.
  Since parts of the AMSU microwave instrument failed, the infrared-only AIRS-only stream is the baseline; its 20-plus-year record is widely used for tropospheric temperature and humidity change and for evaluating reanalyses and models.

time_convention:
  summary: >-
    L2 values are snapshots at the time the satellite viewed each field of regard. Daily L3 values are grid-cell averages for the day, kept separately for the ascending
    (day, nominal equator crossing about 13:30 local time) and descending (night, about 01:30) passes (`_A`, `_D`); monthly values are means of the daily files.
  points:
    - "A daily L3 file does not run from midnight to midnight UTC. It covers 24 hours starting at the dateline and progressing westward, so neighbouring cells are at most about 90 minutes apart; scan lines that cross the dateline are split between the two dates."
    - "Field suffixes: `_A` ascending (day), `_D` descending (night), `_ct` number of observations averaged, `_sdev` standard deviation. For temperature–humidity correlations the guide recommends the `_TqJ_A` and `_TqJ_D` grids, which share one observation set and one QC criterion."
    - "V7 monthly means are simple averages of the daily files (not weighted by counts). Daily files have gores between orbit tracks."
    - "The 13:30 and 01:30 crossing times are nominal. Aqua stopped station-keeping in December 2021 and is drifting to later local crossing times, so 'daytime' values in recent years come from a different time of day."
    - "Near-real-time L2 (AIRS2RET_NRT) appears within about 3 hours but is kept online for only 7 days. Use the standard products (within about 72 hours) for research."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L3_User_Guide.pdf
  source_name: AIRS Version 7 Level 3 Product User Guide + AIRS3STD V7.0 CMR description + Aqua mission home page

variables:
  note: >-
    L3 names are the field names in the AIRS V7 L3 user guide; each carries an `_A` (ascending) or `_D` (descending) suffix and comes with `_ct` and `_sdev` companions (for example `Temperature_A`).
    L2 field names follow the V7 L2 standard pressure levels and QC and error estimation documents; error estimates append `Err` and quality flags append `_QC` to the name (QC 0 best, 1 good, 2 do not use). The fill value is -9999.
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L3_User_Guide.pdf
  groups:
    - name: L3 temperature and water vapour (AIRS3STD daily / AIRS3STM monthly)
      kind: mean
      period: Daily / monthly
      items:
        - "Air temperature profile (24 levels) — `Temperature_A`, `Temperature_D` (K)"
        - "Surface air temperature — `SurfAirTemp_A`, `SurfAirTemp_D` (K)"
        - "Surface skin temperature — `SurfSkinTemp_A`, `SurfSkinTemp_D` (K)"
        - "Water vapour mass mixing ratio (12 levels) — `H2O_MMR_A`, `H2O_MMR_D` (g/kg)"
        - "Relative humidity — `RelHum_A`, `RelHum_D` (%)"
        - "Total precipitable water vapour — `TotH2OVap_A`, `TotH2OVap_D` (kg/m2)"
        - "Geopotential height (24 levels) — `GPHeight_A`, `GPHeight_D` (m)"
    - name: L3 clouds, radiation and trace gases
      kind: mean
      period: Daily / monthly
      items:
        - "Cloud fraction — `CloudFrc_A`, `CloudFrc_D` (0–1)"
        - "Outgoing longwave radiation (all-sky and clear-sky) — `OLR_A`, `ClrOLR_A` etc. (W/m2)"
        - "Total ozone — `TotO3_A`, `TotO3_D` (DU)"
        - "Carbon monoxide volume mixing ratio — `CO_VMR_A`, `CO_VMR_D` (unitless)"
    - name: L2 swath (AIRS2RET)
      kind: instant
      period: overpass time
      items:
        - text: "Surface skin temperature — `TSurfStd` (K), quality flag `TSurfStd_QC`"
          note: QC 0 best, 1 good, 2 do not use
        - text: "Air temperature profile (28 levels) — `TAirStd` (K)"
          note: "Levels are `pressStd` (1100–0.1 hPa). Error estimate `TAirStdErr`, quality flag `TAirStd_QC`"
        - text: "Water vapour mass mixing ratio profile (15 levels) — `H2OMMRLevStd`"
          note: "Levels are `pressH2O` (1100–50 hPa). Layer values are in `H2OMMRStd`. Quality flag `H2OMMRLevStd_QC`"
        - text: "Ozone volume mixing ratio profile — `O3VMRLevStd`"
          note: "Values on the `pressStd` levels (layer values in `O3VMRStd`). Quality flag `O3VMRLevStd_QC`"
        - text: "Carbon monoxide volume mixing ratio profile — `COVMRLevStd`"
          note: "Quality flag `COVMRLevStd_QC`"
        - text: "Methane volume mixing ratio profile — `CH4VMRLevStd`"
          note: "Quality flag `CH4VMRLevStd_QC`"

