transitions:
  - from: MODIS Vegetation Indices C6.1 (MOD13, MYD13)
    to: VIIRS Vegetation Indices V2 (VNP13, VJ113, VJ213)
    to_id: viirs-vi
    status: planned
    date: "2027"
    summary: >-
      The successor carries the MODIS vegetation index system over to VIIRS. CV-MVC compositing, NDVI and EVI continue, but there is no 250 m product, a different blue band weakens EVI continuity,
      and the two-band EVI2 has been added. Fill values, scale notation, pixel-reliability classes and file format differ, so code must be updated. MODIS collection ends with Terra and Aqua (late 2026 to 2027).
    changes:
      - aspect: Satellites and overpass time
        before: "Terra (originally 10:30 descending) and Aqua (originally 13:30 ascending), both drifting"
        after: "Suomi NPP (2012–, distribution to end November 2026), NOAA-20 (2018–) and NOAA-21 (2023–), 13:30 ascending. No product continues Terra's morning observations"
      - aspect: Product resolutions
        before: "250 m (Q1), 500 m (A1), 1 km (A2, A3), 0.05° (C1, C2)"
        after: "500 m (A1), 1 km (A2, A3), 0.05° (C1, C2) — no 250 m product"
      - aspect: 16-day composite spacing
        before: "Every 16 days per satellite (Terra and Aqua offset by 8 days, quasi-8-day together)"
        after: "16-day composites produced every 8 days for each satellite (periods overlap by 8 days)"
      - aspect: Indices
        before: "NDVI, EVI"
        after: "NDVI, EVI, EVI2 (two-band red/NIR, computed without the blue band)"
      - aspect: Compositing
        before: "CV-MVC — smallest view angle of the two highest-NDVI observations"
        after: "CV-MVC — smallest view angle among the top two-thirds of observations by NDVI, plus view-angle bins ([0–30°], [>30°]) to avoid large view angles"
      - aspect: Blue band
        before: "MODIS band 3, 459–479 nm"
        after: "VIIRS M3, 478–498 nm — EVI is sensitive to the blue band, weakening continuity with MODIS EVI (hence EVI2)"
      - aspect: Reflectance layers
        before: "Red, NIR, blue, MIR (bands 1, 2, 3, 7)"
        after: "Red, NIR, blue, green, SWIR1, SWIR2, SWIR3"
      - aspect: Stored values and quality layer (500 m 16-day)
        before: "Scale 0.0001, index fill −3000 and valid −2000 to 10000, pixel reliability 0–3 (fill −1)"
        after: "Scale given as 10000 (divide by 10000), index fill −15000 and valid −10000 to 10000, pixel reliability 0–11 (fill −4)"
      - aspect: Layer names and file format
        before: "`250m 16 days NDVI` etc., HDF-EOS2 (HDF4)"
        after: "`500 m 16 days NDVI` etc. (space between number and m), HDF-EOS5 (HDF5)"
    impacts:
      - Analyses that need 250 m (small fields, urban green space) cannot be continued at that resolution with VIIRS. Compare at a common 500 m.
      - Long EVI series may show a seam because of the blue-band difference, so consider NDVI or EVI2 first when joining the two sensors.
      - Fill values, scale notation and pixel-reliability classes differ, so do not reuse MODIS quality-filter code as is.
      - Suomi NPP products (VNP13) stop being distributed in November 2026, so the reference going forward is NOAA-21 (VJ213, primary) and NOAA-20 (VJ113, secondary).
    sources:
      - name: Transition from MODIS to VIIRS (NASA Earthdata notice, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: VNP13 User Guide and ATBD V2.1.2 (Didan et al., 2018)
        url: https://lpdaac.usgs.gov/documents/1372/VNP13_User_Guide_ATBD_V2.1.2.pdf
      - name: Earthdata catalog — VNP13A1 V002 (layer table)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
      - name: Román et al. (2024) — continuity between MODIS C6.1 and VIIRS C2 land products (RSE)
        url: https://doi.org/10.1016/j.rse.2023.113963
  - from: MODIS Vegetation Indices C6
    to: MODIS Vegetation Indices C6.1
    status: completed
    date: "2023-07"
    summary: >-
      A full-record reprocessing that kept the science algorithm and changed only the Terra and Aqua L1B calibration approach and the polarization correction. Format and layer names are the same as C6,
      and distribution of C6 (006) land products ended on 31 July 2023.
    changes:
      - aspect: Algorithm
        before: "C6 (8-day precomposited L2G reflectance input, CV-MVC)"
        after: "Unchanged"
      - aspect: Input calibration
        before: "C6 L1B calibration"
        after: "Revised Terra and Aqua L1B calibration approach and polarization correction"
      - aspect: Availability
        before: "006 — distribution ended 2023-07-31"
        after: "061 — the only version available"
    impacts:
      - Re-check results made with 006 using 061. The 006 files can no longer be downloaded.
    sources:
      - name: MOD13 User's Guide V3.10 (2019)
        url: https://lpdaac.usgs.gov/documents/621/MOD13_User_Guide_V61.pdf
      - name: Final notice — MODIS Version 6.0 land products decommissioned (2023-07-25)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS placed in standby — part of 2026 days 085–086 flagged questionable/bad
    body: >-
      A Terra anomaly at about 20:00 UTC on 26 March 2026 put MODIS into standby; it returned to science mode on 27 March.
      The calibration team flagged data from 2026-085 20:00 UTC to 2026-086 19:23 UTC as questionable or bad. Check the quality layers of the MOD13 16-day composite starting on day 81 of 2026 and the March monthly data.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: End of science operations projected for February 2027 (Terra) and September 2027 (Aqua)
    body: >-
      An editor's note on NASA Earth Observer's Terra feature (published 2025-12-29, updated 2026-03-20) gives the projected end of science activities as February 2027 for Terra and September 2027 for Aqua.
      Operations continue until then; because its ageing battery limits power, Terra switched off MOPITT on 9 April 2025 to save energy for the remaining four instruments, and the ASTER shortwave infrared subsystem no longer works.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-01-08"
    level: warning
    title: MODIS quality team note — Terra and Aqua orbit drift affects pixel size, scan gaps and diurnal sampling
    body: >-
      LDOPE reported that drift since the last orbit adjustments (Terra 2022, Aqua 2021) has changed pixel size and spacing, scan gaps, bowtie overlap and diurnal sampling,
      with impacts growing sharply from late 2024. Effects on individual products, starting with fire, are under investigation.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool distribution of MODIS ends (2025-06-30) — move to Earthdata Cloud
    body: >-
      LP DAAC announced that Data Pool access to all MODIS data, including C6.1, would be retired on 30 June 2025, with NASA Earthdata Cloud as the primary archive.
      Earthdata Search and AppEEARS users see no change, but scripts that call Data Pool URLs directly need updating.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua expected to shut down late 2026 to early 2027
    body: >-
      NASA expects Terra and Aqua to stop operating in late 2026 or early 2027; MODIS data collection will end then and a final reprocessing will follow.
      Because orbit drift may affect crossing times and data quality, users are encouraged to move to comparable VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 land products decommissioned (2023-07-31) — only V6.1 available
    body: >-
      LP DAAC stopped distributing Terra, Aqua and combined MODIS V6.0 land products (except MOD44W and MCD43GF) on 31 July 2023.
      User Guides and ATBDs remain on the DOI landing pages, and users were advised to move to V6.1.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023
  - date: "2021-11-10"
    level: info
    title: Aqua orbit drift plan — the 16-day repeat cycle is no longer strictly kept
    body: >-
      LP DAAC explained that Aqua began drifting toward later afternoons in July 2021 and would reach an overpass time of about 15:50 around August 2026.
      Products are expected to stay mostly science quality, but the lower altitude reduces grid size, the strict 16-day repeat is lost, and lower sun angles can mean more shadows.
    source: https://lpdaac.usgs.gov/news/aqua-modis-acquisition-plan-through-august-2026/

