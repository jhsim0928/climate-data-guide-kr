notices:
  - date: "2021-03"
    level: warning
    title: GOCI mission ended
    body: >-
      GOCI on COMS officially ended its mission in March 2021, about four years beyond its design life (to 2017). Ocean observation passed to GOCI-II on GEO-KOMPSAT-2B.
      The OB.DAAC record ends on 2021-03-31.
    source: https://koreascience.or.kr/article/JAKO202131452697681.pdf
  - date: "2020-10"
    level: info
    title: Successor GOCI-II data service started
    body: >-
      NOSC started the GEO-KOMPSAT-2B (GOCI-II) data service in October 2020. From 2020-10 to 2021-03 both GOCI and GOCI-II observed, allowing the two records to be compared.
    source: https://www.nosc.go.kr/boardContents/actionBoardContentsCons0015.do
  - date: "2016-05"
    level: info
    title: NASA OBPG GOCI reprocessing R2014.0 completed — L1B and L2 distribution begins
    body: >-
      NASA OBPG completed the full-mission GOCI reprocessing (R2014.0) and began distributing L1B (HDF5) and L2 ocean colour products through OB.DAAC. A vicarious calibration against VIIRS moved the chlorophyll ratio against MODIS-Aqua
      from about 0.6 to about 0.9, and the interpretation of COMS orbit information and the timing of data slots were improved.
    source: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2014/goci

transitions:
  - from: GOCI (COMS)
    to: GOCI-II (GEO-KOMPSAT-2B)
    to_id: goci2
    status: completed
    date: "2021-03"
    summary: >-
      GOCI-II raised the resolution from 500 m to 250 m and the spectral bands from 8 to 12, increased acquisitions around Korea from 8 to 10 a day and added a Full Disk acquisition.
      GOCI ended its mission in March 2021, and both sensors observed together from 2020-10 to 2021-03.
    changes:
      - aspect: Period
        before: "2011-04 to 2021-03 (OB.DAAC L2)"
        after: "2020-10 to present (planned mission life 2020–2029)"
      - aspect: Spatial resolution
        before: 500 m
        after: 250 m
      - aspect: Spectral bands
        before: "8 (412–865 nm; 6 visible, 2 NIR)"
        after: "12 (380–865 nm) + a wideband channel for navigation"
      - aspect: Acquisitions and coverage
        before: "2,500 km × 2,500 km around Korea, 8 a day (09:00–16:00 local time)"
        after: "Local Area of the same size 10 a day (08:15–17:15 KST) + Full Disk once a day"
      - aspect: Products
        before: "OB.DAAC L2 — NASA standard ocean colour products such as Rrs, chlor_a, Kd_490, poc and aot_865"
        after: "NOSC L2, 26 products — reflectance, chlorophyll, suspended matter and CDOM plus red tide, floating algae, sea fog, surface currents, low-salinity water, aerosol and land products"
      - aspect: Provider and account
        before: "NASA OB.DAAC (Earthdata Login), KIOST Korea Ocean Satellite Center"
        after: "KHOA National Ocean Satellite Center (no login; web, web directory, OPeNDAP). Not at NASA OB.DAAC"
    impacts:
      - The two sensors differ in resolution, bands, atmospheric correction and processing, so compare values for the same waters during the overlap (2020-10 to 2021-03) before splicing them into one time series.
      - GOCI comes from OB.DAAC (NASA processing) and GOCI-II from NOSC (Korean processing), so product names, variable names and file structures differ. Prepare separate reading code.
      - GOCI-II starts an hour earlier and ends an hour later (08:15–17:15 KST), so match acquisition times when comparing diurnal variability.
    sources:
      - name: Choi et al. (2021), One Year of GOCI-II Launch — Korean Journal of Remote Sensing
        url: https://koreascience.or.kr/article/JAKO202131452697681.pdf
      - name: NOSC — GK-2B GOCI-II
        url: https://www.nosc.go.kr/eng/boardContents/actionBoardContentsCons0024.do
      - name: NASA OBPG — GOCI Ocean Color Reprocessing 2014.0
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2014/goci

