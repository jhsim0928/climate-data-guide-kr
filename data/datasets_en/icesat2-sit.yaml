# ICESat-2 — dataset information file
# Gridded: IS2SITMOGR4 v4 (monthly sea ice thickness, Arctic) · ATL20 v5 (daily/monthly freeboard) / Along-track: ATL07 v7 (sea ice height) · ATL10 v7 (freeboard) — distributed by the NSIDC DAAC
# ─────────────────────────────────────────────────────────────
id: icesat2-sit
name: ICESat-2
full_name: >-
  ICESat-2 L4 Monthly Gridded Sea Ice Thickness (IS2SITMOGR4, Version 4) · ATLAS/ICESat-2 L3B Daily and Monthly Gridded Sea Ice Freeboard (ATL20, Version 5),
  with the along-track products ATLAS/ICESat-2 L3A Sea Ice Height (ATL07) and L3A Sea Ice Freeboard (ATL10), Version 7
category: satellite
domain: seaice
group: 위성 관측 자료
order: 60
domains: [해빙]
provider: >-
  NASA ICESat-2 Project Science Office and Science Team (ATL07 · ATL10 · ATL20; Kwok et al.) / IS2SITMOGR4: Petty et al. (CMR data center UMD/ESSIC) —
  distributed by the NASA National Snow and Ice Data Center Distributed Active Archive Center (NSIDC DAAC, Earthdata Cloud)

status: active
status_note: >-
  The along-track products ATL07 and ATL10 are at Version 7 (Release 007, released 2025-10-07); Version 6 was retired on 2026-04-07. The gridded freeboard ATL20 is at
  Version 5 (released 2025-11-04), and the monthly gridded thickness IS2SITMOGR4 is at Version 4 (released 2025-11-25, derived from ATL10 v7), which was extended with the
  2025/26 winter (September 2025 – April 2026) on 2026-08-27. As of 2026-10-12, standard ATL10 data run to 2026-07-20, ATL20 to February 2026 and IS2SITMOGR4 to April 2026;
  the most recent days are available only as Quick Look data.

period:
  start: "2018-10"
  end: present
  note: >-
    ICESat-2 science data begin on 14 October 2018. As of 2026-10-12 (NASA CMR), the latest granules are ATL07/ATL10 v7 for 2026-07-20, ATL20 v5 for February 2026 (monthly),
    IS2SITMOGR4 v4 for April 2026 (monthly) and Quick Look ATL10QL for 2026-10-08. IS2SITMOGR4 covers Arctic winters only: November 2018 – April 2019 for the first winter,
    then September through April each year. There are no science data during the spacecraft safe-mode periods of 4–16 April 2022 and 10 May – 21 June 2024
    (with additional partial gaps in June–July 2019).

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    Gridded (ATL20, IS2SITMOGR4): 25 km NSIDC Sea Ice Polar Stereographic grids — North, EPSG:3411 (448 rows × 304 columns in ATL20); South, EPSG:3412 (332 × 316, ATL20 only).
    ATL20 covers grid cells with sea ice concentration ≥ 50% and more than 25 km from the coast (89°N–37°N and 53°S–79°S); IS2SITMOGR4 spans the Arctic Ocean and its peripheral seas
    south of 88°N. Along-track (ATL07, ATL10): segment-based — ATL07 heights are computed over variable-length segments of ~150 signal photons (fixed 10 m segments are also
    provided for the strong beams), and ATL10 gives freeboard for these segments relative to a lead-derived reference sea surface within 10 km swath segments. Geolocation in WGS 84
  vertical: Not applicable (single-level freeboard, thickness and snow depth)
  temporal: >-
    ATL20: daily composites (that day's tracks) and monthly composites (calendar month); IS2SITMOGR4: monthly means (September–April); ATL07/ATL10: along-track data at
    measurement time (91-day exact repeat orbit)

coverage:
  short: 양극
  note: "ATL20 covers both poles; IS2SITMOGR4 covers the Arctic only"
update: >-
  Standard ATL07/ATL10 are released with a lag of several months (latest at time of checking: 2026-07-20). Quick Look products (ATL07QL, ATL10QL) have a 3–5 day latency and are
  removed once the standard data are available. ATL20 is updated "several times a year"; IS2SITMOGR4 adds each full winter at once in late spring or early summer of the following
  year (later if ATL10 processing is delayed; the 2025/26 winter arrived on 2026-08-27)
license: >-
  NASA Earth Science Data and Information Policy — data from NASA-led missions carry no restrictions on use (Creative Commons Zero, CC0) unless otherwise noted; please cite the data sets in publications
account_required: true

summary: >-
  The Advanced Topographic Laser Altimeter System (ATLAS), a photon-counting lidar on NASA's ICESat-2, measures the heights of sea ice and of leads (open water between floes).
  From these, the products derive total freeboard (the height of the snow surface above local sea level) and, with assumptions about snow depth and density, sea ice thickness.
  Most research use relies on the monthly 25 km gridded thickness IS2SITMOGR4 (Arctic winter, with NESOSIM snow loading) and the daily and monthly 25 km gridded freeboard ATL20
  (both hemispheres, all seasons), both built from the along-track sea ice height (ATL07) and freeboard (ATL10). Because the laser ranges to the snow surface rather than the
  ice surface sensed by radar altimeters such as CryoSat-2, the assumed snow loading largely determines the retrieved thickness.

time_convention:
  summary: >-
    Gridded products are period means. ATL20 daily and monthly composites are segment-length-weighted averages of all freeboard segments that fall in a grid cell during the day or
    calendar month; IS2SITMOGR4 bins the along-track thickness estimates of a month onto the 25 km grid. Along-track data (ATL07, ATL10) are instantaneous values at the time of measurement.
  points:
    - "Track coverage is sparse, so a monthly grid cell may represent only one or two days of data — ATL20 imposes no minimum number of observation days (ATL20 Known Issues). Check `mean_day_of_month` in IS2SITMOGR4 and `n_segs` and `delta_time_beg`/`delta_time_end` in ATL20."
    - "The date and time in an ATL20 file name (e.g. ATL20-01_20260201003450_…) is the time of the first ATL10 granule used for that month, not the end or middle of the month. IS2SITMOGR4 file names (IS2SITMOGR4_01_202604_007_004.nc) give year and month, the ATL10 input version and the product version, in that order."
    - "Along-track `delta_time` is in GPS seconds since 2018-01-01 (the ATLAS Standard Data Product epoch). Add `/ancillary_data/atlas_sdp_gps_epoch` to get seconds since the GPS epoch; GPS time and UTC differ by the accumulated leap seconds."
    - "IS2SITMOGR4 snow depth and density are daily NESOSIM fields sub-sampled at the ICESat-2 locations and dates before monthly binning; `sea_ice_conc` is the monthly mean NOAA/NSIDC CDR v4 concentration and is not sub-sampled by ICESat-2."
  source: https://nsidc.org/sites/default/files/documents/user-guide/is2sitmogr4-v004-userguide.pdf
  source_name: NSIDC user guides for IS2SITMOGR4 v4, ATL20 v5 and ATL07/ATL10 v7; ATL20/ATL21 Known Issues

variables:
  note: >-
    Names as given in the NSIDC user guides and data dictionaries (IS2SITMOGR4 v4, ATL20 v5, ATL07/ATL10 v7). IS2SITMOGR4 uses netCDF-4 variables;
    the ATL products use HDF5 paths, where `gtx` stands for one of the six beam groups gt1l–gt3r.
  full_list: https://nsidc.org/sites/default/files/documents/technical-reference/icesat2_atl20_data_dict_v005.pdf
  groups:
    - name: Monthly gridded sea ice thickness (IS2SITMOGR4, Arctic, September–April)
      kind: mean
      period: Monthly
      items:
        - text: "Sea ice thickness — `ice_thickness` (m)"
          note: Primary variable, using redistributed NESOSIM v1.1 snow loading and a bulk ice density of 916 kg m-3
        - text: "Total sea ice thickness uncertainty — `ice_thickness_unc` (m)"
          note: Combined systematic uncertainties only (random errors assumed to average out at 25 km; representation and sampling errors not included). Component variables for freeboard, snow depth, snow density and ice density are also provided
        - text: "Interpolated and smoothed sea ice thickness — `ice_thickness_int` (m)"
          note: Delaunay linear interpolation plus a Gaussian filter; masked more than 50 km from data and where concentration is below 50%. The guide calls these fields preliminary and urges caution
        - text: "Sea ice thickness with alternative assumptions — `ice_thickness_mw99`, `ice_thickness_sm_e5`, `ice_thickness_sm_m2`, `ice_thickness_j22` (m)"
          note: Modified Warren (1999) snow climatology, SnowModel-LG forced by ERA5 or MERRA-2, and the experimental Jutila et al. (2022) ice density. Use with more caution than the primary variable
    - name: Monthly gridded freeboard, snow and ancillary fields (IS2SITMOGR4)
      kind: mean
      period: Monthly
      items:
        - text: "Total freeboard — `freeboard` (m)"
          note: Monthly mean of ATL10 v7 freeboard (snow surface). Interpolated version `freeboard_int`
        - "Snow depth — `snow_depth` (m)"
        - "Snow density — `snow_density` (kg m-3)"
        - text: "Bulk sea ice density — `ice_density` (kg m-3)"
          kind: static
          note: Fixed at 916 kg m-3
        - text: "Sea ice concentration — `sea_ice_conc` (0–1)"
          note: Monthly mean of the NOAA/NSIDC CDR v4; masked below 0.15
        - text: "Number of valid thickness segments per grid cell — `num_segments` (count)"
        - text: "Mean day of month represented by the grid cell — `mean_day_of_month` (day)"
        - text: "Grid cell area — `grid_cell_area` (m2)"
          kind: static
    - name: Daily and monthly gridded freeboard (ATL20, both hemispheres)
      kind: mean
      period: Daily/monthly
      items:
        - text: "Monthly mean freeboard — `/monthly/mean_fb` (m)"
          period: Monthly
          note: Segment-length-weighted mean. The same group holds `n_segs` (number of segments), `length_sum` (sum of segment lengths, m) and `sigma` (standard deviation, m)
        - text: "Daily mean freeboard — `/daily/dayxx/mean_fb` (m)"
          period: Daily
          note: One subgroup per day of the month (dayxx); check the actual subgroup names in the file
        - text: "Grid coordinates and land mask — `/grid_x`, `/grid_y` (m), `/grid_lat`, `/grid_lon` (degrees), `/land_mask_map` (0/1)"
          kind: static
          note: "land_mask_map: 1 = land, 0 = ocean/sea ice"
    - name: Along-track data (ATL07 sea ice height · ATL10 freeboard)
      kind: instant
      items:
        - text: "Sea ice and sea surface height — `gtx/sea_ice_segments/heights/height_segment_height` (m)"
          note: ATL07. Relative to the tide-free mean sea surface (MSS), after ocean tide and inverted barometer corrections
        - text: "Segment surface type and sea surface flag — `height_segment_type`, `height_segment_ssh_flag` (flag values)"
          note: ATL07. ssh_flag 1 = candidate sea surface (lead) used by ATL10, 0 = sea ice
        - text: "Beam freeboard — `gtx/freeboard_segment/beam_fb_height` (m)"
          note: ATL10. Height above the reference surface built from leads on the same beam (`gtx/reference_surface_section/beam_refsurf_height`). Uncertainty `beam_fb_unc`; quality `beam_fb_quality_flag` (1 best to 5 poor)
        - text: "Lead height — `gtx/leads/lead_height` (m)"
          note: ATL10. Weighted mean of contiguous sea surface segments, relative to the tide-free MSS

access:
  - name: NSIDC — IS2SITMOGR4 v4 (monthly gridded sea ice thickness)
    url: https://nsidc.org/data/is2sitmogr4/versions/4
    method: Earthdata Search / earthaccess (Python) / HTTPS / NASA Earthdata Cloud (AWS us-west-2)
    note: >-
      Requires a free NASA Earthdata Login. One netCDF-4 file per month (IS2SITMOGR4_01_YYYYMM_007_004.nc, 01 = Northern Hemisphere) with a browse PNG.
      The CMR version is "4". No Southern Hemisphere (02) files exist yet.
  - name: NSIDC — ATL20 v5 (daily and monthly gridded freeboard)
    url: https://nsidc.org/data/atl20/versions/5
    method: Earthdata Search / earthaccess / HTTPS / NASA Earthdata Cloud
    note: >-
      HDF5; one file per hemisphere (01 north, 02 south) and month, holding the monthly composite and the daily composites. If a file is reprocessed under the same name, use the one
      with the highest trailing revision number. A rolling 30-day gridded Quick Look (ATL20QL v5, built from ATL10QL) was released on 2026-06-16.
  - name: NSIDC — ATL10 v7 (along-track freeboard) · ATL07 v7 (along-track sea ice height)
    url: https://nsidc.org/data/atl10/versions/7
    method: Earthdata Search / earthaccess / NSIDC Data Access Tool (subsetting) / Harmony
    note: >-
      Up to 32 HDF5 granules per day (per-hemisphere orbit segments). ATL07 is at https://nsidc.org/data/atl07/versions/7.
      The 3–5 day Quick Look products (ATL07QL, ATL10QL v7) are deleted once the standard files are out, so use the standard products for the research record.
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search/granules?p=C3878683537-NSIDC_CPRD
    method: Web search and download
    note: The link opens the IS2SITMOGR4 v4 collection (C3878683537-NSIDC_CPRD). ATL20 v5 is C3825009052-NSIDC_CPRD.

example:
  lang: python
  note: >-
    Install with pip install earthaccess xarray h5py netCDF4. On the first login() you can enter your Earthdata credentials and save them to ~/.netrc.
    Monthly thickness (IS2SITMOGR4) opens with xarray; ATL20 uses HDF5 groups, so read it with h5py.
  code: |
    import earthaccess
    import h5py
    import numpy as np
    import xarray as xr

    earthaccess.login()  # NASA Earthdata Login

    # 1) Monthly gridded sea ice thickness (IS2SITMOGR4 v4) — March 2026
    res = earthaccess.search_data(short_name="IS2SITMOGR4", version="4",
                                  temporal=("2026-03-01", "2026-03-31"))
    files = earthaccess.download(res, "./is2sitmogr4")
    nc = [f for f in files if str(f).endswith(".nc")][0]
    ds = xr.open_dataset(nc)
    sit = ds["ice_thickness"].squeeze()            # m, NESOSIM snow loading
    print(float(sit.mean()), float(ds["mean_day_of_month"].mean()))

    # 2) Monthly gridded freeboard (ATL20 v5) — February 2026, Northern Hemisphere (01)
    res = earthaccess.search_data(short_name="ATL20", version="005",
                                  temporal=("2026-02-01", "2026-02-28"))
    files = earthaccess.download(res, "./atl20")
    h5 = [f for f in files if "ATL20-01_" in str(f) and str(f).endswith(".h5")][0]
    with h5py.File(h5, "r") as h:
        v = h["monthly/mean_fb"]
        fb = v[:].astype(float)
        fill = v.attrs.get("_FillValue")
        if fill is not None:
            fb[fb == fill] = np.nan
        nseg = h["monthly/n_segs"][:]
        print(list(h["daily"].keys())[:3])        # daily composite groups
    print(np.nanmean(fb))

tips:
  - >-
    ICESat-2 measures total freeboard, i.e. to the snow surface. Snow depth and density are the largest error sources in the thickness conversion, so before comparing with
    CryoSat-2 thickness (radar, ice-surface freeboard) make sure both use the same snow product. The IS2SITMOGR4 developers recommend the NESOSIM-based `ice_thickness` and advise
    caution with the alternative thickness variables.
  - >-
    The SnowModel-LG variables in IS2SITMOGR4 (`*_sm_e5`, `*_sm_m2`) are only available through July 2021 (user guide footnote). They are empty for recent winters, so do not mix
    them with the primary variable.
  - >-
    OSI SAF does not provide ice type in September, so all ice is treated as multiyear ice that month. In April 2022 the safe mode removed the first part of the month
    (4–11 April per Known Issues), biasing that monthly mean toward the second half. Sampling dates differ between grid cells, so always check `mean_day_of_month` in regional comparisons.
  - >-
    Near the ice edge, some 10 km segments still use a reference surface lowered by tens of centimetres by wave troughs, which inflates freeboard (ATL07/ATL10 and ATL20 Known Issues).
    The multi-beam (swath) freeboard in ATL10 is disabled because of beam alignment issues; only the per-beam values (`beam_fb_height`) are valid.
  - >-
    Do not mix versions. Version 7 changed how ATL10 builds the reference surface (from a static 10 km value to interpolation between neighbouring reference surfaces), so freeboards differ
    from v6, and v6, ATL20 v4 and IS2SITMOGR4 v3 files can no longer be downloaded. Since 2026-01-15 the ATL07/ATL10 sea ice concentration input has been the AMSR2-based NRT CDR
    (G10016 v4), which introduces a very small (≤ 0.4%) discontinuity at the ice edge.
  - >-
    ATL20 is produced for summer months too, but clouds sharply reduce coverage and surface melt makes ATL10 retrievals difficult (IS2SITMOGR4 Known Issues). IS2SITMOGR4 covers
    September–April only; summer thickness is still at the "initial assessment" research stage (Petty, Cabaj & Landy, 2025). North of 88°N lies the pole hole not covered by the orbit.

transitions:
  - from: ICESat-2 Release 006
    to: ICESat-2 Release 007
    status: completed
    date: "2025-10"
    summary: >-
      The along-track products moved to v7 with a new freeboard reference surface calculation, the gridded freeboard and thickness products followed with new versions,
      and all previous versions were retired during 2026.
    changes:
      - aspect: Release date
        before: ATL07/ATL10 v6 2023-08-03, ATL20 v4 2023-08-24, IS2SITMOGR4 v3 2023-12
        after: ATL07/ATL10 v7 2025-10-07, ATL20 v5 2025-11-04, IS2SITMOGR4 v4 2025-11-25
      - aspect: ATL10 reference sea surface
        before: Freeboard computed from a static 10 km reference surface value
        after: >-
          Reference surface heights interpolated to the freeboard location when neighbouring reference surfaces are available; option to use lognormal-distribution heights;
          `oc_depth` fixed (previously always 0.0)
      - aspect: ATL07 processing
        before: Variable-length ~150-photon segments only
        after: >-
          Fixed 10 m segments for strong beams (`sea_ice_segments_10m`), independent DDA-Bifurcation heights, lognormal expected-waveform tables, dynamic atmospheric correction (DAC) added
      - aspect: ATL20
        before: v4
        after: v5 — grid mapping attribute and coordinate reference system (crs) variable updated for netCDF compliance
      - aspect: IS2SITMOGR4
        before: v3 — ATL10 v6; SnowModel-LG with ERA5 forcing only
        after: v4 — ATL10 v7; MERRA-2-forced SnowModel-LG added; `grid_cell_area` and `time` variables added
      - aspect: Retirement of previous versions
        before: Available
        after: IS2SITMOGR4 v3 retired 2026-01, ATL07/ATL10 v6 on 2026-04-07, ATL20 v4 on 2026-05-11
    impacts:
      - Do not splice freeboard or thickness series built from v6 or earlier onto v7 data; recompute the full record with v7.
      - Scripts that assume v6 file names (…_006_xx.h5) or IS2SITMOGR4 v3 names need the version numbers updated.
    sources:
      - name: NSIDC announcement — ATL07, ATL10 and ATL12 v7 release (2025-10-07)
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-atlasicesat-2-v7-along-track-products-atl07-atl10-and-atl12
      - name: ATL10 v7 user guide (version history)
        url: https://nsidc.org/sites/default/files/documents/user-guide/atl10-v007-userguide.pdf
      - name: ATL07 v7 user guide (version history)
        url: https://nsidc.org/sites/default/files/documents/user-guide/atl07-v007-userguide_0.pdf
      - name: ATL20 v5 user guide (version history)
        url: https://nsidc.org/sites/default/files/documents/user-guide/atl20-v005-userguide.pdf
      - name: IS2SITMOGR4 v4 user guide (version history)
        url: https://nsidc.org/sites/default/files/documents/user-guide/is2sitmogr4-v004-userguide.pdf

