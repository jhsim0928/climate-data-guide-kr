notices:
  - date: "2026-08-27"
    level: info
    title: "Data set update: ICESat-2 L4 Monthly Gridded Sea Ice Thickness, Version 4 (September 2025 – April 2026 added)"
    body: >-
      NSIDC extended IS2SITMOGR4 Version 4 with monthly files for September 2025 through April 2026. The version is unchanged (v4, based on ATL10 v7).
      The 2026/27 winter is likely to follow, as in past years, as a single update in late spring or summer 2027.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-update-icesat-2-l4-monthly-gridded-sea-ice-thickness-version-4
  - date: "2026-04-07"
    level: warning
    title: "Data set retirements: Version 6 of ATL07 and ATL10 (ATL20 v4 retired 2026-05-11)"
    body: >-
      NSIDC retired Version 6 of ATL07, ATL10 and ATL12 on 7 April 2026, followed by ATL20 v4 and ATL21 v3 on 11 May 2026. Documentation remains on each data set page, but the
      data can no longer be accessed. Analyses built on v6 must be recomputed with v7 (v5 for ATL20) to be reproduced.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-retirements-version-6-atlasicesat-2-sea-ice-and-ocean-surface-along-track-products
  - date: "2026-01-15"
    level: info
    title: ATL07/ATL10 sea ice concentration input switched to the AMSR2-based NRT CDR (G10016 v4)
    body: >-
      Because the SSM/I-series concentration input was discontinued, ATL07 and ATL10 have used the AMSR2-based NOAA/NSIDC Near-Real-Time CDR (G10016 Version 4) since 15 January 2026.
      A one-month overlap showed differences at the ATL07 (0.15) and ATL10 (0.5) concentration thresholds of ≤ 0.4% at the ice edge, but the record has a small discontinuity.
    source: https://nsidc.org/sites/default/files/documents/technical-reference/icesat2_atl07_10_known_issues_v007_0.pdf
  - date: "2025-11-25"
    level: info
    title: "New version release: ICESat-2 L4 Monthly Gridded Sea Ice Thickness, Version 4"
    body: >-
      Monthly gridded thickness now combines ATL10 Version 7 freeboard with NESOSIM snow loading. MERRA-2-forced SnowModel-LG snow loading and the `grid_cell_area` and `time`
      variables were added. Version 3 was retired in January 2026; ATL20 v5 had been released earlier, on 2025-11-04.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-icesat-2-l4-monthly-gridded-sea-ice-thickness-version-4
  - date: "2025-10-07"
    level: warning
    title: "New version release: ATLAS/ICESat-2 v7 along-track products ATL07, ATL10 and ATL12 — freeboard reference surface changed"
    body: >-
      Along-track sea ice height and freeboard moved to v7. ATL10 now interpolates the reference sea surface between neighbouring reference surfaces before computing freeboard, and ATL07
      adds fixed 10 m segments, DDA-Bifurcation heights and a dynamic atmospheric correction. Values differ from v6, so do not mix versions.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-atlasicesat-2-v7-along-track-products-atl07-atl10-and-atl12
  - date: "2025-10-06"
    level: info
    title: "User Notice: ATL07 and ATL10 \"Quick Look\" data outage (30 September – 14 November 2025)"
    body: >-
      A lapse in federal government funding disrupted the SSMIS (DMSP) input, so the Quick Look products (ATL07QL, ATL10QL) were unavailable from 30 September 2025; production resumed
      on 14 November 2025 (notice of 20 November 2025). The standard ATL07 and ATL10 products were not affected.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-atl07-and-atl10-quick-look-data-outage

