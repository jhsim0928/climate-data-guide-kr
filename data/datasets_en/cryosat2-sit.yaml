# ─────────────────────────────────────────────────────────────
# CryoSat-2 — dataset information file (English edition)
# Default: AWI CryoSat-2 Sea Ice Thickness v2.6 / alternatives: ESA CCI, CPOM, ESA Cryo-TEMPO, C3S
# ─────────────────────────────────────────────────────────────
id: cryosat2-sit
name: CryoSat-2
full_name: AWI CryoSat-2 Sea Ice Thickness (version 2.6) and other Arctic sea ice thickness products from the CryoSat-2 radar altimeter
category: satellite
domain: seaice
group: 위성 관측 자료
order: 30
domains: [해빙]
provider: Alfred Wegener Institute (AWI), Germany — source data ESA CryoSat-2 / alternative products from ESA CCI, CPOM (UK) and ESA

status: active
status_note: >-
  AWI v2.6 is the current version; near-real-time and reprocessed data are updated every year from October to April (near-real-time production for winter 2025/26 started on 7 October 2025).
  As of 2026-10-11, the AWI wiki has not yet announced the start of near-real-time production for winter 2026/27.
  CryoSat-2 was designed to last about five years and is still operating well beyond that; according to CPOM, the mission has been extended until 2028.

period:
  start: "2010-10"
  end: present
  note: >-
    The v2.6 record starts on 2010-10-21. Northern hemisphere thickness is produced only for the freezing season, October to April; May to September is empty,
    because surface melt prevents a reliable freeboard retrieval. "Present" therefore means up to the most recent winter.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "7일"
  spatial: "Gridded (L3C): 25 km EASE2 northern hemisphere grid (Lambert azimuthal equal-area, EPSG:6931) / Trajectory (L2P): individual measurement points"
  vertical: Not applicable (single thickness and freeboard values)
  temporal: Weekly (ISO week) and monthly grids; daily trajectory files

update: Daily during the freezing season (October–April) — near-real-time about 2 days behind, reprocessed about 33 days behind (the reprocessed data replace the near-real-time data for the same period)
license: Creative Commons Attribution 4.0 International (CC BY 4.0) for the AWI products. Alternative products follow their providers' terms (ESA CCI terms of use, ESA data policy, etc.)
account_required: false

summary: >-
  Arctic winter sea ice thickness derived from the SIRAL radar altimeter on ESA's CryoSat-2: the sea ice freeboard (height above the water line) is measured,
  and thickness is computed under hydrostatic equilibrium using assumed snow depth and snow, ice and sea-water densities. This page uses AWI's v2.6, produced with pysiral, as the default.
  Besides thickness, each file contains radar and sea ice freeboard, the snow depth and densities used, sea ice draft and quality flags, which makes it easy to trace sources of error.
  ESA CCI, CPOM and ESA Cryo-TEMPO also produce products from the same source data, and their values differ with the processing.

time_convention:
  summary: >-
    Values in the AWI gridded files (L3C) are period averages of all satellite measurements that fell within each grid cell during the period (calendar month or ISO week).
    They are not instantaneous thickness on a given date; only the trajectory data (L2P) are instantaneous values at the time of measurement.
  points:
    - "Monthly files (…-YYYYMM-fv2p6.nc) average the trajectory measurements over a month, and weekly files (…-YYYYMMDD_YYYYMMDD-fv2p6.nc) over the 7 days of an ISO week. Cells with fewer than two valid measurements are left empty."
    - "If orbits do not sample the period evenly, the average may represent only part of it. Use the temporal coverage statistics in the file (`stat_temporal_coverage_day_fraction`, `stat_temporal_coverage_weighted_center`, etc.) to check the fraction of days with data and any phase bias."
    - "Trajectory data (L2P, daily files) are point measurements and therefore instantaneous. Use L2P if you need thickness on a daily basis."
    - "Snow depth and snow density are not observations but monthly climatologies (Warren climatology merged with AMSR2-based snow depth), so the same month gets similar values every year."
    - "Near-real-time data (about 2 days behind) are replaced by the reprocessed data (about 33 days behind) for the same period. In the Arctic, files exist only for October to April."
  source: https://github.com/shendric/pysiral
  source_name: AWI pysiral v2.6 L3C output and processing definitions (output/l3/awi/l3c_awi_v2p6.yaml, proc/l3/awi/l3c_awi_v2p6.yaml) / AWI SIRAL wiki

variables:
  note: >-
    Variables in the AWI v2.6 monthly and weekly gridded (L3C) files, checked against the v2.6 output definitions in AWI's processing code (pysiral); full descriptions are in the Product User Guide.
    Each physical quantity comes with an uncertainty variable suffixed `_uncertainty` (e.g. `sea_ice_freeboard_uncertainty`).
  full_list: https://doi.org/10.5281/zenodo.10044554
  groups:
    - name: Thickness and freeboard
      kind: mean
      period: Month (7 days in weekly files)
      items:
        - text: "Thickness of the sea ice layer (primary estimate) — `sea_ice_thickness` (m)"
          note: Arithmetic mean of the trajectory measurements in the cell over the period (at least two valid measurements)
        - text: "Algorithm uncertainty of sea ice thickness — `sea_ice_thickness_uncertainty` (m)"
          note: Error propagation for the period-mean thickness, including uncertainty reduction of random components by gridding
        - "Sea ice freeboard (with snow range corrections) — `sea_ice_freeboard` (m)"
        - "Radar freeboard (no snow range corrections) — `radar_freeboard` (m)"
        - "Depth of the sea-ice layer below the water surface (draft) — `sea_ice_draft` (m)"
    - name: Auxiliary fields used in the thickness retrieval
      kind: mean
      period: Month (7 days in weekly files)
      items:
        - text: "Thickness of the snow layer — `snow_depth` (m)"
          note: Period mean of the per-measurement input. The input itself is a monthly climatology (Warren climatology + AMSR2-based snow depth), not the actual snow depth of that year
        - text: "Density of the snow layer — `snow_density` (kg m-3)"
          note: Period mean of the per-measurement input. An assumption of the processing, not an observation
        - text: "Density of the sea ice layer — `sea_ice_density` (kg m-3)"
          note: Period mean of the per-measurement input. An assumption of the processing, not an observation
        - text: "Sea ice concentration (OSI SAF) — `sea_ice_concentration` (%)"
          note: Period mean of the OSI SAF daily concentration attached to each measurement
        - text: "Fraction of multi-year sea ice — `sea_ice_type` (0–1)"
          note: Period mean of the OSI SAF/C3S ice type attached to each measurement (fraction classified as multi-year ice)
    - name: Quality and status
      kind: mean
      period: Month (7 days in weekly files)
      items:
        - text: "Sea ice thickness quality flag (0 nominal to 3 no data) — `quality_flag` (code)"
          note: One flag per period, assessed from statistics of all measurements in the period (number of measurements, lead fraction, fraction of negative thickness, MIZ, etc.)
        - text: "Sea ice thickness status flag (nominal, open ocean, satellite pole hole, land, etc.) — `status_flag` (code)"
          note: One flag per period, determined from the period-mean thickness and concentration
        - text: "Marginal ice zone flag — `miz_flag` (code)"
          note: Median of the per-measurement flags during the period
        - text: "NSIDC Arctic region code — `region_code` (code)"
          kind: static
          note: Fixed regional mask (NSIDC 2021). Stored as the median value within the cell, but it does not change over time

access:
  - name: AWI FTP — CryoSat-2 v2.6 (L2P trajectory, L3C weekly and monthly grids)
    url: ftp://ftp.awi.de/sea_ice/product/cryosat2/v2p6/
    login: false
    method: Anonymous FTP (FTP client required)
    note: >-
      Northern hemisphere data are in the nh/l3c_grid/month, nh/l3c_grid/isoweek and nh/l2p_trajectory folders. The Latest folders hold only the newest near-real-time
      files, not the full record, so use the reprocessed data for analysis.
  - name: AWI SIRAL wiki — Sea Ice Thickness from Satellite Radar Altimetry
    url: https://spaces.awi.de/spaces/SIRAL/pages/185827416/Sea+Ice+Thickness+from+Satellite+Radar+Altimetry
    method: Web documentation (product description, operational news, document links)
    note: The same page also covers the Sentinel-3A/B sea ice thickness produced with the same v2.6 processing.
  - name: ESA Sea Ice CCI — CryoSat-2 northern hemisphere monthly thickness L3C v4.0 (CEDA)
    url: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
    login: false
    method: Web download / HTTP directory
    note: A climate-record reprocessing for 2010-10 to 2024-04, from the same processing lineage as AWI. ESA CCI sea ice terms of use apply.
  - name: CPOM (Centre for Polar Observation and Modelling, UK) Sea Ice Thickness portal
    url: https://www.cpom.ucl.ac.uk/seaice/download.php?region=Arctic
    method: Web download (NetCDF, CSV time series)
    note: >-
      Based on CryoSat-2 and Sentinel-3, on a sparse 5 km polar stereographic grid (EPSG:3411). Provides near-real-time (last 2, 14 and 28 days) and monthly data, plus regional volume and mass time series.
  - name: ESA Cryo-TEMPO sea ice products (Winter Sea Ice, Summer Sea Ice, Snow Depth on Sea Ice)
    url: https://earth.esa.int/eogateway/catalog/cryotempo
    method: CS2EO platform / ESA MAAP (EO Sign In account required)
    note: ESA's own thematic CryoSat-2 products. A separate summer (May–September) radar freeboard product is also available.
  - name: C3S Climate Data Store — Sea ice thickness gridded data for the Arctic
    url: https://cds.climate.copernicus.eu/datasets/satellite-sea-ice-thickness
    method: Web download / CDS API
    note: Requires an ECMWF account. Provides a long-term L3 multi-altimeter record and a gap-filled L4 product combining CryoSat-2, Sentinel-3 and SMOS.

example:
  lang: python
  note: Assumes a monthly gridded file downloaded from the AWI FTP. File names follow awi-siral-l3c-sithick-cryosat2-<timeliness>-nh_25km_ease2-<YYYYMM>-fv2p6.nc.
  code: |
    import glob
    import xarray as xr

    f = glob.glob("awi-siral-l3c-sithick-cryosat2-*-nh_25km_ease2-201903-fv2p6.nc")[0]
    ds = xr.open_dataset(f)

    sit = ds["sea_ice_thickness"]          # m
    qf = ds["quality_flag"]                # 0 nominal, 1 intermediate, 2 low, 3 no data

    # Keep only nominal and intermediate quality cells and compute the mean thickness
    sit_ok = sit.where(qf <= 1)
    print(float(sit_ok.mean()))

    # Check how sensitive the thickness is to the assumed snow depth
    print(float(ds["snow_depth"].where(qf <= 1).mean()))

tips:
  - >-
    Thickness is not measured directly; it is converted from freeboard using assumed snow depth and densities. AWI v2.6 uses a monthly climatology that regionally merges
    the Warren climatology (halved over first-year ice) with AMSR2-based snow depth. If your results differ from another product, compare the snow_depth and sea_ice_density variables first.
  - >-
    Arctic data exist only for October to April. For May–September you need a product made with a different method, such as the ESA Cryo-TEMPO Summer Sea Ice freeboard,
    and you should not splice it directly onto the winter data.
  - >-
    AWI, CPOM and ESA CCI all start from the same CryoSat-2 data but differ in retracker, snow data and grid, so their mean thickness and trends differ.
    Use one product and one version within an analysis, and record the version you downloaded (e.g. v2.6).
  - >-
    Because of its 92° orbit inclination, CryoSat-2 does not observe north of about 88°N. This area is marked satellite_pole_hole in status_flag, so decide how to handle it
    before computing pan-Arctic volume. Thin ice (below roughly 1 m) has large relative errors; the CS2SMOS product, which merges CryoSat-2 with SMOS, may be more suitable there.

