notices:
  - date: "2026-07-04"
    level: info
    title: CryoSat Ice Baseline-F data products now available (offline processors)
    body: >-
      ESA upgraded the CryoSat Ice Level 1 and Level 2 offline processors to Baseline-F. Level 2 adds sea ice freeboard and thickness variables, and the ocean tide model (FES2022b)
      and geoid (EGM2008) have changed. AWI v2.6 uses Baseline-E L1B, so its values do not change for now, but check the baseline when comparing ESA's official L2 thickness with AWI thickness.
      No Baseline-F near-real-time processor has been released yet.
    source: https://earth.esa.int/eogateway/instruments/siral/processor-releases
  - date: "2025-10-09"
    level: info
    title: Start of AWI v2.6 near real-time data for winter 2025/26 (CryoSat-2 & Sentinel-3A/B)
    body: Generation of near-real-time Arctic products started for winter 2025/26 (the AWI wiki news box gives 7 October 2025; the blog post is dated 9 October). The algorithm version remains v2.6, as in previous winters.
    source: https://spaces.awi.de/spaces/SIRAL/pages/185827416/Sea+Ice+Thickness+from+Satellite+Radar+Altimetry
  - date: "2023-10-05"
    level: warning
    title: Start of AWI CryoSat-2 v2.6 — previous versions archived
    body: >-
      From v2.6, CryoSat-2 Baseline-E L1B data are used for the full data record, and the new version 3 of the OSI SAF/C3S sea ice type record improves ice type information in early October.
      The near-real-time latency increased from 36 h to 48 h. Data of previous versions have been archived; contact info[at]meereisportal.de if you need them.
    source: https://spaces.awi.de/display/SIRAL/Version+History

