account_required: false

summary: >-
  A weekly Arctic sea ice thickness data record from merged CryoSat-2 and SMOS satellite data. The CryoSat-2 radar altimeter is most accurate over
  thick ice, while the SMOS L-band radiometer is most sensitive to thin ice (below about 1 m); the two are combined by optimal interpolation. Compared with
  CryoSat-2 monthly fields alone, the product offers better temporal resolution and gap-free coverage, and it has been widely used for sea ice prediction
  initialisation, model evaluation and shipping-route studies. It is produced by AWI and distributed by ESA as SMOS-CryoSat L4 Sea Ice Thickness.

time_convention:
  summary: >-
    Each file merges SMOS and CryoSat-2 observations from a 7-day window (start and end dates in the file name) into one weekly field; it is a 7-day mean,
    not an instantaneous value. Since v2.02 the target week is moved forward in daily increments, so files on consecutive days overlap by six days.
  points:
    - "The two dates in the file name are the start and end of the 7-day window (e.g. 20190304_20190310). time_coverage_end is given as 00:00 UTC on the day after the end date, so the window runs from 00:00 on the start date to 24:00 on the end date."
    - "The PDD describes weekly fields based on calendar weeks from Monday to Sunday, whereas the ATBD states that since v2.02 target weeks are updated in daily increments. If you need non-overlapping samples, use only files starting on a Monday."
    - "The `time` variable is defined only as 'reference time of product'; the documents do not say whether it marks the start or the centre of the window. Use the file name or time_bnds for dates."
    - "The optimal interpolation background is built from data outside the target week (CryoSat-2 two weeks before and after, SMOS one week before and after). Operational ('o') files can only use data before the target week, so they may differ from reprocessed ('r') files."
    - "Sea ice concentration is the weekly mean of the OSI SAF daily ice concentration over the target week."
  source: https://earth.esa.int/eogateway/documents/20142/0/CryoSat-2-SMOS-ATBD.pdf/9ba793ce-2cfa-cc59-1b0e-8e18b7180f30
  source_name: ESA CryoSat-2/SMOS merged thickness ATBD / Product Description Document (PDD v1.6)

variables:
  note: >-
    Variables as listed in the v206 Product Description Document (PDD v1.6, Table 3). Figure captions in the same document use some other names, so check
    an actual file once. The successor CS3SMOS (v300) has a new file format and different variable names.
  full_list: https://earth.esa.int/eogateway/documents/20142/37627/CryoSat-2-SMOS-Merged-Product-Description-Document-PDD.pdf
  groups:
    - name: Merged thickness (main product)
      kind: mean
      period: 7 days
      items:
        - text: "CS2SMOS merged sea ice thickness — `analysis_sea_ice_thickness` (m)"
          note: Weekly SMOS and CryoSat-2 thicknesses of the 7-day window merged with the background field by optimal interpolation.
        - text: "Uncertainty of the merged sea ice thickness — `analysis_sea_ice_thickness_unc` (m)"
          note: Uncertainty of the same weekly analysis.
        - text: "Optimal interpolation background field — `background_sea_ice_thickness` (m)"
          note: Built from observations outside the target week (CryoSat-2 two weeks before and after, SMOS one week before and after); in operational mode only the preceding weeks are used. It is therefore not a 7-day mean but a field from several weeks around the target week.
        - text: "Weighted mean of weekly CS2 and SMOS ice thickness retrievals — `weighted_mean_sea_ice_thickness` (m)"
          note: Weighted mean of the weekly averaged CryoSat-2 and SMOS thicknesses (PDD definition).
        - text: "Difference between background and analysis ice thickness — `innovation` (m)"
          note: For the same week.
    - name: Thickness by input sensor
      kind: mean
      period: 7 days
      items:
        - text: "Weekly averaged SMOS ice thickness — `smos_sea_ice_thickness` (m)"
          note: PDD definition 'weekly averaged SMOS ice thickness'.
        - text: "SMOS ice thickness uncertainty — `smos_sea_ice_thickness_uncertainty` (m)"
          note: Uncertainty of the weekly averaged SMOS thickness.
        - text: "Weekly averaged CryoSat-2 ice thickness — `cryosat_sea_ice_thickness` (m)"
          note: PDD definition 'weekly averaged CryoSat-2 ice thickness'.
        - text: "CryoSat-2 ice thickness uncertainty — `cryosat_sea_ice_thickness_uncertainty` (m)"
          note: Uncertainty of the weekly averaged CryoSat-2 thickness.
    - name: Auxiliary fields
      kind: mean
      period: 7 days
      items:
        - text: "Sea ice concentration — `sea_ice_concentration` (%)"
          note: Weekly mean of OSI SAF daily ice concentration over the target week (ATBD).
        - text: "Sea ice type (2 = first-year ice, 3 = multi-year ice) — `sea_ice_type` (flag)"
          note: Uses OSI SAF daily sea ice type as input. The documents do not say how it is aggregated to a weekly value (mean, representative day, etc.).
        - text: "Correlation length scale of sea ice thickness — `correlation_length_scale` (m)"
          note: An optimal interpolation parameter estimated per grid cell from the background field of the target week. Recomputed every week; not a time mean of observations.

