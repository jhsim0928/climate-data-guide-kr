example:
  lang: python
  note: "Assumes a v206 weekly file downloaded from the ESA server, e.g. W_XX-ESA,SMOS_CS2,NH_25KM_EASE2_20190304_20190310_o_v206_01_l4sit.nc"
  code: |
    import xarray as xr

    ds = xr.open_dataset("W_XX-ESA,SMOS_CS2,NH_25KM_EASE2_20190304_20190310_o_v206_01_l4sit.nc")

    sit = ds["analysis_sea_ice_thickness"].squeeze()        # m
    unc = ds["analysis_sea_ice_thickness_unc"].squeeze()    # m

    # Compare SMOS and CryoSat-2 contributions over thin ice (< 1 m)
    thin = sit < 1.0
    print("SMOS  :", float(ds["smos_sea_ice_thickness"].squeeze().where(thin).mean()))
    print("CS2   :", float(ds["cryosat_sea_ice_thickness"].squeeze().where(thin).mean()))
    print("Merged:", float(sit.where(thin).mean()))

tips:
  - >-
    Each file is a 7-day mean. A new file appears every day, but files on consecutive days share six days of data, so do not treat them as an
    independent daily series and ignore the autocorrelation. Using only non-overlapping weekly files (Monday–Sunday) is the safe choice.
  - >-
    Operational ('o') files and reprocessed ('r') files can differ. Where both exist for the same period, use the reprocessed version.
  - >-
    SMOS thickness is known to be underestimated where ice concentration is below 100%, and SMOS data are frequently missing over the Barents, Kara and
    Laptev Seas because of radio-frequency interference (RFI). Merged thickness there relies essentially on altimetry, so interpret it with care.
  - >-
    v206 and its successor CS3SMOS (v300) differ in resolution, input satellites and uncertainty model and should not be treated as one record. To extend
    beyond the 2025/26 winter, move the whole analysis to v300 where possible; if you combine them, state the switch date explicitly.

