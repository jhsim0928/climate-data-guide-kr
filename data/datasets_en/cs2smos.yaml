# ─────────────────────────────────────────────────────────────
# CS2SMOS — dataset information file (English edition)
# AWI/ESA merged CryoSat-2 + SMOS weekly Arctic sea ice thickness (up to v206) → succeeded by CS3SMOS (v300)
# ─────────────────────────────────────────────────────────────
id: cs2smos
name: CS2SMOS
full_name: CryoSat-2/SMOS Merged Sea Ice Thickness (ESA SMOS-CryoSat L4 Sea Ice Thickness)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 40
also_in:
  - domain: satellite
    group: 해빙
domains: [해빙]
provider: Alfred Wegener Institute (AWI) / European Space Agency (ESA) — based on ESA CryoSat-2 and SMOS data

status: ended
status_note: >-
  CS2SMOS (last version v206) completed its final season with the 2024/25 winter (April 2025). From the 2025/26 winter the product continues as
  CS3SMOS (v300), which adds Sentinel-3A/B altimetry, a 12.5 km grid and Southern Hemisphere coverage. The 2010–2025 v206 record remains available from
  the ESA dissemination server. Both SMOS and CryoSat-2 are still delivering data in 2026, and CS3SMOS is in routine production.

successor:
  name: CS3SMOS (CryoSat-2/Sentinel-3/SMOS Merged Sea Ice Thickness, v300)
  url: https://spaces.awi.de/spaces/CS2SMOS/pages/297634429/CryoSat-2+Sentinel-3+SMOS+Merged+Sea+Ice+Thickness
  note: >-
    Operational since 2025-10-23. Resolution 25 km → 12.5 km, Sentinel-3A (from October 2016) and Sentinel-3B (from October 2018) altimetry added,
    austral winter (15 April–15 October) coverage, and a new file format and uncertainty model (altimetry uncertainties substantially higher than in v206).
    As of October 2026 no separate dataset DOI has been found; AWI still asks users to cite Ricker et al. (2017), The Cryosphere, 11, 1607–1623,
    doi:10.5194/tc-11-1607-2017.

transitions:
  - from: CS2SMOS v206
    to: CS3SMOS v300
    to_id: cs3smos
    status: completed
    date: "2025-10"
    summary: >-
      The second major revision of AWI's merged sea ice thickness product: Sentinel-3A/B altimetry was added and the processing system rebuilt in Python.
      Resolution improved from 25 km to 12.5 km, austral winter fields were added, and the uncertainty model and file content changed.
      It replaced v206 from the 2025/26 winter (operational from 2025-10-23).
    changes:
      - aspect: Product name and version
        before: "CS2SMOS v206 (released 2023-10)"
        after: "CS3SMOS v300 (released 2025-10; new Python processing system)"
      - aspect: Altimetry input
        before: "CryoSat-2 (AWI L2P v2.6)"
        after: "CryoSat-2 + Sentinel-3A (from 2016) + Sentinel-3B (from 2018), all from the AWI v2.6 algorithm; daily gridding of altimetry now done within the AWI v2.6 production system"
      - aspect: SMOS input
        before: "SMOS L3C v3.3"
        after: "SMOS L3 v3.6"
      - aspect: Horizontal resolution and grid
        before: "25 km EASE2, Northern Hemisphere (432 × 432)"
        after: "12.5 km EASE2, Northern and Southern Hemispheres"
      - aspect: Region and season
        before: "Arctic only, freezing season (roughly mid-October to mid-April)"
        after: "Arctic 15 October–15 April + Antarctic 15 April–15 October"
      - aspect: Period
        before: "2010-11 to 2025-04 (last season 2024/25)"
        after: "AWI near-real-time operations from the 2025/26 winter (first weekly field 2025-10-15). Copernicus Marine hosts v300 Northern Hemisphere data from 2023-10-18 and Southern Hemisphere data from 2025-04-18. Public location of a full reprocessing from 2010 not confirmed"
      - aspect: Uncertainty
        before: "v206 uncertainty model"
        after: "Altimetry and SMOS uncertainties recomputed — SMOS includes the effect of sea ice concentration below 100% with a minimum of 20 cm; altimetry uncertainties substantially higher than in v206"
      - aspect: Land/ocean mask
        before: "v206 mask"
        after: "Same mask as the ESA CCI sea ice products, plus a land/ocean fraction variable"
      - aspect: File content
        before: "Analysis, background and weighted-mean thickness, innovation, separate SMOS and CryoSat-2 thicknesses and uncertainties, etc. (PDD v1.6, Table 3)"
        after: "Reduced to six variables — sea_ice_thickness, sea_ice_thickness_uncertainty, sea_ice_concentration, status_flag, quality_flag, density_of_ocean (ocean fraction per cell) (per the Copernicus Marine product manual)"
      - aspect: File name
        before: "W_XX-ESA,SMOS_CS2,NH_25KM_EASE2_<start>_<end>_<o|r>_v206_01_l4sit.nc"
        after: "W_XX-ESA,SMOS_CS2_S3A_S3B,NH_12P5KM_EASE2_<start>_<end>_o_v300_01_l4sit (from AWI quicklook file names)"
      - aspect: Distribution and DOI
        before: "ESA SMOS dissemination server, L4_SIT_Open, DOI 10.57780/sm1-4f787c3 (Version 206) / AWI FTP"
        after: "AWI FTP, cryosat2_smos/v300 folder / Copernicus Marine SEAICE_GLO_PHY_L4_NRT_011_014 (product DOI 10.48670/moi-00125). Not on the ESA dissemination server as of October 2026"
    impacts:
      - v206 (2010–2025) and v300 (2025/26 onward) differ in resolution, input satellites and uncertainty model, so a series joined across the switch may show a step. Until a consistent record in a single version is available, treat the v206 and v300 periods separately in long-term analyses.
      - File names (SMOS_CS2 → SMOS_CS2_S3A_S3B, 25KM → 12P5KM, v206 → v300) and variables have changed, so existing readers will break. Check the variable names in the new files before updating your code.
      - Larger v300 uncertainties reflect the new uncertainty model, not lower quality. Do not compare uncertainties across versions directly or filter both versions with the same threshold.
      - Antarctic winter thickness is new; the CS2SMOS record is Arctic only. For Antarctic work, check when the record starts and how far it has been validated.
    sources:
      - name: AWI CS3SMOS/CS2SMOS product page (version history)
        url: https://spaces.awi.de/spaces/CS2SMOS/pages/297634429/CryoSat-2+Sentinel-3+SMOS+Merged+Sea+Ice+Thickness
      - name: AWI CS2SMOS-PDS announcements (v300 start on 2025-10-23)
        url: https://spaces.awi.de/spaces/CS2SMOS/overview
      - name: ESA SMOS-CryoSat L4 Sea Ice Thickness catalogue (v206)
        url: https://earth.esa.int/eogateway/catalog/smos-cryosat-l4-sea-ice-thickness
      - name: ESA CS2SMOS Product Description Document (PDD v1.6, v206)
        url: https://earth.esa.int/eogateway/documents/20142/37627/CryoSat-2-SMOS-Merged-Product-Description-Document-PDD.pdf

period:
  start: "2010-11"
  end: "2025-04"
  note: >-
    Starts 2010-11-15 according to the ESA catalogue. Coverage is limited to the Northern Hemisphere October–April (winter) period; summers are empty.
    The last v206 season is winter 2024/25, and three weeks of L4 data (4–23 February 2025) are missing because the JRA-3Q reanalysis input was unavailable.

