  spatial_short: "25 km (0.23°)"
  temporal_short: "7일"
  spatial: "25 km EASE2 Grid, Northern Hemisphere (polar aspect spherical Lambert azimuthal equal-area projection, 432 × 432 grid centred on the geographic pole) — successor CS3SMOS is 12.5 km"
  vertical: Not applicable (single thickness value)
  temporal: Weekly (7-day window) fields updated daily — each file represents one week (Monday–Sunday or the latest 7 days)

