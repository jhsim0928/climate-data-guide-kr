notices:
  - date: "2026-04-21"
    level: info
    title: Successor CS3SMOS — near-real-time processing ends for the Arctic 2025/26 winter season
    body: >-
      CS3SMOS Arctic near-real-time processing has concluded for the season (final map 9–15 April 2026), and Southern Hemisphere processing is expected
      to begin soon. As of 2026-10-11 the start of the 2026/27 Arctic season has not yet been announced.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-10-23"
    level: critical
    title: CS2SMOS (v206) replaced by CS3SMOS (v300)
    body: >-
      From the 2025/26 winter the merged thickness product is v300 (CS3SMOS). Key changes are added Sentinel-3A/B altimetry, a 12.5 km grid, Antarctic
      winter coverage and a new file format. v206 is no longer updated, so check the paths and variable names in operational scripts.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-10-23"
    level: warning
    title: Degraded quality in the Barents, Kara and Laptev Seas due to SMOS radio-frequency interference (RFI)
    body: >-
      Recurring RFI removes SMOS thin-ice measurements in these seas, so thickness there is estimated from radar altimetry alone and may be higher than
      SMOS-based estimates.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-04-17"
    level: info
    title: L4 CryoSat-2/SMOS v206 near real time completed for winter season 2024/25 — last CS2SMOS season
    body: The v206 near-real-time Arctic season has ended; production will continue in October 2025 as v300.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-02-24"
    level: warning
    title: L4 CryoSat-2/SMOS v206 near-real-time production interrupted (February 2025) — some weekly fields missing
    body: >-
      Production of SMOS L3 and the merged L4 stopped because the JRA-3Q reanalysis input was unavailable, and resumed on 2025-03-03.
      L4 data for three weeks, 4–23 February 2025, remain missing.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview

