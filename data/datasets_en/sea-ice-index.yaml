notices:
  - date: "2026-09-08"
    level: info
    title: "User notice: AMSR2 products continued forward processing — Sea Ice Index input (NSIDC-0803) maintained"
    body: >-
      NSIDC announced that its AMSR2 products, including AMSR2 Daily Polar Gridded Sea Ice Concentrations (NSIDC-0803), will continue forward processing while the data remain available from JAXA.
      NSIDC is planning AMSR3 data products in 2027, so the Sea Ice Index input is expected to stay AMSR2 until then (the notice does not mention the Sea Ice Index itself).
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-amsr2-products-continued-forward-processing
  - date: "2025-07-31"
    level: warning
    title: "New version release: NOAA/NSIDC Sea Ice Index, Version 4 — AMSR2 input from 2025, V3 retired"
    body: >-
      From 2025-01-01, extent, area and images are computed from AMSR2-based NSIDC-0803 concentrations. The near-real-time/final distinction is removed, gaps are filled by temporal interpolation,
      and the Arctic pole hole is slightly different in size. Values through 2024 are the same as V3. The new DOI is 10.7265/a98x-0f50.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-index-version-4
  - date: "2025-07-23"
    level: warning
    title: "User Notice: Sea Ice Index Transitioning to Version 4 with AMSR2 Data — AMSR2 extent slightly smaller than SSMIS"
    body: >-
      AMSR2 usually places the ice edge slightly further inward than SSMIS, giving smaller extents (differences less than about 0.1 million km² in the Northern Hemisphere and about 0.15 million km² in the Southern Hemisphere)
      and a slightly more negative extent trend. The intercalibration is preliminary with further improvements planned, and V3 will be retired once V4 is released.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-sea-ice-index-transitioning-version-4-amsr2-data
  - date: "2025-07-03"
    level: info
    title: "Data set update: Sea Ice Index, Version 3 — 2023–2024 updated to final data"
    body: >-
      The 2023-01-01 to 2024-12-31 portion of V3 was reprocessed from near-real-time input to the final NASA Goddard concentration data. V4 uses these V3 values unchanged through 2024.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-update-sea-ice-index-version-3-0
  - date: "2025-06-25"
    level: critical
    title: "User notice: SSMIS Data Discontinuation Affecting Sea Ice Index and Sea Ice CDR Effective 30 June 2025 (later resolved by the AMSR2 transition)"
    body: >-
      The Department of Defense notified NSIDC that it would stop processing and delivering SSMIS data by 30 June 2025, so the SSMIS-based Sea Ice Index was expected to stop processing after that date;
      MASIE was suggested as an alternative for Northern Hemisphere extent. SSMIS processing was later extended to the end of July (notice of 2025-06-30), and processing continued with the release of V4 (AMSR2) on 31 July.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-ssmis-data-discontinuation-affecting-sea-ice-index-and-sea-ice-cdr-effective-30-june
  - date: "2025-05-06"
    level: warning
    title: "User notice: Level of Service Update for Data Products — reduced to Basic"
    body: >-
      With NOAA NCEI decommissioning its snow and ice data products (effective 2025-05-05), the Sea Ice Index moved to a Basic level of service. The data continue to update automatically,
      but they may not be actively maintained, updated or fully supported.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-level-service-update-data-products

