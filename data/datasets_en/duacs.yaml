transitions:
  - from: DUACS DT-2021
    to: DUACS DT-2024
    status: completed
    date: "2024-11"
    summary: >-
      Full reprocessing of the 30-year altimetry record with new L2P input standards and corrections. The Copernicus Marine products switched to MIOST
      mapping on a 1/8° grid; the C3S product keeps 0.25° optimal interpolation but adopts the new standards. The MDT changed to MDT_CNES_CLS22.
    changes:
      - aspect: Processing version and file attributes
        before: "DT-2021 (e.g. product_version vDec2021, software_version 7.0_DUACS_DT2021_baseline)"
        after: "DT-2024 (product_version vNov2024; MY software_version 8.0_MIOST_DT2024_baseline)"
      - aspect: Copernicus Marine grid
        before: "0.25° (…-l4-duacs-0.25deg_P1D)"
        after: "1/8° = 0.125° (…-l4-duacs-0.125deg_P1D); C3S stays at 0.25°"
      - aspect: Mapping method
        before: Optimal interpolation (OI)
        after: "Copernicus Marine — MIOST (Multiscale Inversion of Ocean Surface Topography); C3S — optimal interpolation retained"
      - aspect: Ocean tide model
        before: "FES2014 (FES2022 from the 2023-11 myint datasets)"
        after: FES22b
      - aspect: Mean sea surface (MSS)
        before: "Hybrid SIO/CNES_CLS2015/DT15 (hybrid SIO2022/CNES_CLS2022 from the 2023-11 myint datasets)"
        after: "Hybrid_2023 MSS (SIO, CNES/CLS22, DTU21)"
      - aspect: Mean dynamic topography (MDT) for ADT
        before: DT-2021 MDT
        after: "MDT_CNES_CLS22 (merged with the regional CMEMS_2020 MDT in the Mediterranean and Black Seas) — in NRT from 2024-11-06"
      - aspect: Reprocessed dataset IDs
        before: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.25deg_P1D (DT-2021) / …_myint_allsat-l4-duacs-0.25deg_P1D (added 2023-11)"
        after: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D / …0.125deg_P1M-m (version 202411)"
      - aspect: Reported improvements
        before: "-"
        after: "About 10% lower coastal errors (improved tide correction) and 5–7% lower mapping errors in energetic regions (MIOST) — CLS, EGU 2025 / NRT: mesoscale SLA errors reduced by about 20% in high-energy areas"
    impacts:
      - Do not combine DT-2021 and DT-2024 files in one time series; download the whole record from 1993 again in DT-2024.
      - "Scripts using the 0.25° dataset IDs (my, myint, nrt) must switch to the 0.125° IDs. The grid size changes, so rebuild any precomputed masks or regional indices."
      - The new MDT changes the mean fields of ADT and the absolute geostrophic currents (ugos, vgos). Take care when comparing mean circulation with earlier results.
      - From DT-2024 the C3S and Copernicus Marine products differ in mapping method (OI vs MIOST) and grid, so do not mix them or use one as a drop-in replacement for the other.
    sources:
      - name: Copernicus Marine QUID (CMEMS-SL-QUID-008-032-068)
        url: https://documentation.marine.copernicus.eu/QUID/CMEMS-SL-QUID-008-033-068.pdf
      - name: Copernicus Marine transition information — SEALEVEL_GLO_PHY_L4_NRT_008_046
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
      - name: Copernicus Marine transition information — SEALEVEL_GLO_PHY_L4_MY_008_047
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_MY_008_047
      - name: C3S Sea Level vDT2024 PUGS
        url: https://confluence.ecmwf.int/x/kriuHg
      - name: Ballarotta et al. — DUACS DT-2024 (EGU25-3715)
        url: https://meetingorganizer.copernicus.org/EGU25/EGU25-3715.html

notices:
  - date: "2025-11"
    level: info
    title: "Demonstration datasets added — reprocessed L4 with enhanced MIOST; NRT L4 combining nadir and SWOT-KaRIn"
    body: >-
      A 30-year reprocessing with an enhanced MIOST that also models equatorial waves and high-frequency barotropic variability was added as a demonstration
      dataset (…my_allsat-demo-l4-duacs-0.125deg_P1D-i), and a new NRT L4 dataset merging nadir altimetry with SWOT-KaRIn data
      (…nrt_demo-allsat-swos-l4-duacs-0.125deg_P1D-i) was released. The reprocessed demo will not be extended in time; the official operational products
      remain the existing datasets.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_MY_008_047
  - date: "2025-09-19"
    level: warning
    title: C3S product — affected files replaced; re-download recommended
    body: >-
      A CDS known issue (now closed) affected daily and monthly global data from 23-12-2023 onwards: the ICDR update was delivered without some necessary
      along-track correction data. Users who downloaded affected data before 19-09-2025 should re-download the updated files. The end of the affected
      period is not shown on the public page.
    source: https://cds.climate.copernicus.eu/datasets/satellite-sea-level-global?tab=documentation
  - date: "2025-07"
    level: warning
    title: Copernicus Marine Toolbox 1.x end of life
    body: Toolbox v1 is no longer supported and should be replaced with v2. Support for Python 3.9 was dropped in version 2.4.0.
    source: https://toolbox-docs.marine.copernicus.eu/en/stable/end-of-life.html
  - date: "2025-06-25"
    key_date: "2025-06"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: Backward temporal extension of the L4 NRT dataset for the second half of 2024
    body: >-
      The NRT 0.125° daily dataset (cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D) was extended backward into the second half of 2024
      (it now starts on 2024-07-01), with a double-dissemination period from 25 June to 29 July 2025.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
  - date: "2024-11-26"
    level: warning
    title: NRT L4 moves to DT-2024 standards, MIOST and 0.125°; 0.25° NRT dataset stops updating
    body: >-
      Global NRT L4 processing moved to DT-2024 standards with a new MDT, MIOST mapping in place of optimal interpolation and a 1/8° grid, in a new dataset
      (…-0.125deg_P1D). The 0.25° NRT dataset stopped updating on 26 November, so download scripts must be updated.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
  - date: "2024-11-26"
    key_date: "2024-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: warning
    title: "Full reprocessing of the DT products: DUACS DT-2024 (C3S vDT2024)"
    body: >-
      The whole reprocessed record from 1993 was regenerated with DT-2024 standards. Copernicus Marine provides it at 0.125° with MIOST mapping and C3S as
      vDT2024 (0.25°, optimal interpolation); C3S vDT2021 and vDT2018 are no longer extended. Do not mix it with earlier versions.
    source: https://documentation.marine.copernicus.eu/QUID/CMEMS-SL-QUID-008-033-068.pdf

