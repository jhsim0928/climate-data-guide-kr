# ─────────────────────────────────────────────────────────────
# DUACS — dataset information file (English edition)
# Multi-mission altimetry L4 gridded sea level (Copernicus Marine 008_047 / 008_046, C3S satellite-sea-level-global)
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: duacs
name: DUACS
full_name: >-
  SSALTO/DUACS multi-mission altimeter L4 gridded sea level (sea level anomaly, absolute dynamic topography, geostrophic currents) —
  Copernicus Marine SEALEVEL_GLO_PHY_L4_MY_008_047 (reprocessed) and SEALEVEL_GLO_PHY_L4_NRT_008_046 (near real time), C3S satellite-sea-level-global
category: satellite
domain: ocean
group: 위성 관측 자료
order: 10
also_in:
  - domain: satellite
    group: 해면고도·파랑
domains: [해양]
provider: CLS (France; DUACS production) / distributed by the Copernicus Marine Service (CMEMS) and the Copernicus Climate Change Service (C3S)

status: active
status_note: >-
  Operational. In November 2024 the full record was reprocessed with the DUACS DT-2024 standards; the Copernicus Marine products moved from a 0.25° to a
  1/8° (0.125°) grid and switched their mapping method to MIOST. The C3S product (vDT2024) is the climate-oriented version, kept on a 0.25° grid with a
  steady two-satellite constellation; vDT2021 and vDT2018 are no longer extended. As of October 2026 no successor to DT-2024 has been announced.

period:
  start: "1993-01"
  end: present
  note: >-
    Latest dates as of 2026-10-12: Copernicus Marine reprocessed (MY) daily 2026-05-15, monthly 2026-04; near-real-time (NRT) 0.125° daily 2026-10-11
    (dataset starts 2024-07-01); C3S vDT2024 2026-01-16 (CDS catalogue). NRT normally keeps only about the last two years online, so use MY or C3S for
    long-term work.

resolution:
  spatial_short: "14 km (0.125°)"
  temporal_short: "1일"
  spatial: >-
    Copernicus Marine (MY, NRT): 0.125° × 0.125° (1/8°) regular lat-lon grid, global, 2880 × 1440 (cell centres 179.9375°W–179.9375°E, 89.9375°S–89.9375°N).
    C3S: 0.25° Cartesian lat-lon grid, 1440 × 720 (cell centres 179.875°W–179.875°E, 89.875°S–89.875°N); useful data nominally reach about 82° latitude.
    The European regional products (008_068, 008_060) are on a 1/16° grid
  vertical: Single level (sea surface)
  temporal: >-
    Daily maps. Monthly means are provided separately by Copernicus Marine MY (sla only) and C3S (sla, eke)
coverage:
  short: 전지구
  note: "Copernicus Marine version is global; the C3S version extends to about 82° latitude"
update: >-
  Copernicus Marine MY — extended several times a year (to roughly 5–9 months before present), with a full reprocessing typically every 3–4 years /
  NRT — daily at 11:30; each date's map is replaced in turn by the preliminary (d0), intermediate (d0+3) and final (d0+6) maps /
  C3S — extended about three times a year, with a delay of about 5 months
license: >-
  Copernicus Marine version — Copernicus Marine Service licence (service commitments and licence; free of charge, attribution and product DOI required) /
  C3S version — CC-BY licence (CC BY 4.0)
account_required: true

summary: >-
  Altimeter satellite gridded sea level anomalies (SLA), computed with respect to a twenty-year [1993, 2012] mean, produced by merging along-track
  measurements from all available altimeter missions (TOPEX/Poseidon, the Jason series, Sentinel-6 MF, Sentinel-3, SARAL/AltiKa and others) into
  gap-free daily global maps. The products also contain absolute dynamic topography (ADT = SLA + mean dynamic topography), surface geostrophic currents
  and formal mapping errors. They are generated by the DUACS system at CLS and distributed in two flavours: the Copernicus Marine products, which use every
  available satellite on a 0.125° grid and target mesoscale applications, and the C3S product, which uses a steady two-satellite constellation on a
  0.25° grid for a homogeneous, stable record of climate-scale sea level change.

time_convention:
  summary: >-
    A daily map is not an average of that day's observations. It is an estimate of sea level on that date, obtained by space–time mapping of along-track
    data from several weeks around it (MIOST for Copernicus Marine DT-2024, optimal interpolation for C3S). The time value is 00:00 UTC on the map date, and
    the file metadata give the coverage as 12:00 UTC on the previous day to 12:00 UTC on the map date. Monthly files are simple averages of the daily maps.
  points:
    - "C3S example: dt_global_twosat_phy_l4_20230910_vDT2024 has time_coverage_start 2023-09-09T12:00:00Z and time_coverage_end 2023-09-10T12:00:00Z (time units: days since 1950-01-01)."
    - "Delayed-time (DT) maps use observations before and after the map date; NRT maps have no 'future' data and use only the preceding six weeks. NRT and MY values for the same date therefore differ."
    - "NRT produces three maps per day: a preliminary map at d0, an intermediate map at d0+3 and the final NRT map at d0+6, which replaces the preliminary one."
    - "Because of the temporal mapping, the effective time resolution is much coarser than one day: the QUID gives about 33 days for the global L4 product."
    - "Monthly files (Copernicus Marine …_P1M-m, C3S …-M01) are monthly means of the daily maps; Copernicus Marine stamps them with the first day of the month."
  source: https://confluence.ecmwf.int/x/kriuHg
  source_name: C3S Sea Level vDT2024 PUGS / Copernicus Marine PUM and QUID (SL 008-046, 008-047)

variables:
  note: >-
    Variable names as in the Copernicus Marine dataset metadata and the C3S Product User Guide (PUGS). MY and C3S daily files have the same variables;
    NRT has no tpa_correction. All variables are stored as int32 with a scale_factor of 0.0001. The MDT itself is not included in the files.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-SL-PUM-008-046-047-060-068.pdf
  groups:
    - name: Sea surface height (daily maps)
      kind: instant
      items:
        - text: "Sea level anomaly (SLA, relative to the 1993–2012 mean) — `sla` (m)"
          note: An interpolated estimate for the map date (centred on 00 UTC), not a daily mean; it includes temporal smoothing.
        - text: "Absolute dynamic topography (ADT, above the geoid) — `adt` (m)"
          note: adt = sla + MDT. DT-2024 uses MDT_CNES_CLS22, merged with the regional CMEMS_2020 MDT in the Mediterranean and Black Seas.
        - "Formal mapping error on SLA — `err_sla` (m)"
    - name: Geostrophic currents (daily maps)
      kind: instant
      items:
        - "Absolute geostrophic velocity, zonal component — `ugos` (m/s)"
        - "Absolute geostrophic velocity, meridional component — `vgos` (m/s)"
        - "Geostrophic velocity anomaly, zonal component — `ugosa` (m/s)"
        - "Geostrophic velocity anomaly, meridional component — `vgosa` (m/s)"
        - "Formal mapping error on geostrophic velocity anomalies (zonal, meridional) — `err_ugosa`, `err_vgosa` (m/s)"
    - name: Monthly means
      kind: mean
      period: Monthly
      items:
        - text: "Monthly mean sea level anomaly — `sla` (m)"
          note: In the Copernicus Marine MY monthly dataset (…0.125deg_P1M-m) and the C3S monthly files.
        - text: "Eddy kinetic energy — `eke` (cm2 s-2)"
          note: C3S monthly files only; computed as ½(U² + V²).
    - name: Flags and corrections
      kind: instant
      items:
        - text: "Ice flag (15% sea ice concentration criterion; 0 = ocean, 1 = ice) — `flag_ice` (0/1)"
          note: Based on OSI SAF sea ice concentration.
        - text: "TOPEX-A instrumental drift correction — `tpa_correction` (m)"
          note: A one-dimensional variable (time only), in MY and C3S only. The C3S PUGS states that for vDT2024 the correction has not yet been computed and the variable holds a default value.

