    url: https://data.marine.copernicus.eu/product/SEALEVEL_GLO_PHY_L4_MY_008_047/description
    method: Web Subset and File Browser / Copernicus Marine Toolbox (copernicusmarine)
    note: >-
      Free Copernicus Marine account required. Dataset IDs — daily cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D,
      monthly cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1M-m (current version 202411).
  - name: Copernicus Marine — near real time (SEALEVEL_GLO_PHY_L4_NRT_008_046)
    url: https://data.marine.copernicus.eu/product/SEALEVEL_GLO_PHY_L4_NRT_008_046/description
    method: Web Subset and File Browser / Copernicus Marine Toolbox (copernicusmarine)
    note: >-
      Dataset ID cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D (from 2024-07-01). The former 0.25° dataset
      (…-0.25deg_P1D) has not been updated since 2024-11-26.
  - name: C3S Climate Data Store (satellite-sea-level-global)
    url: https://cds.climate.copernicus.eu/datasets/satellite-sea-level-global
    method: Web download / CDS API (cdsapi)
    note: >-
      Requires an ECMWF account and acceptance of the licence. Choose variable daily or monthly_mean and version vdt2024 (recommended), vdt2021 or vdt2018;
      NetCDF files are delivered in a zip archive.
  - name: Copernicus Marine Toolbox documentation
    url: https://toolbox-docs.marine.copernicus.eu/en/stable/
    method: Python / command line (CLI)

example:
  lang: python
  note: >-
    After pip install copernicusmarine, run copernicusmarine.login() once to store your credentials. For the C3S product, put your CDS API key in
    ~/.cdsapirc and use cdsapi as in the commented example below.
  code: |
    import copernicusmarine

    # Copernicus Marine reprocessed (MY) 0.125° daily data — East Asia subset
    copernicusmarine.subset(
        dataset_id="cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D",
        variables=["sla", "adt", "ugos", "vgos"],
        minimum_longitude=120, maximum_longitude=150,
        minimum_latitude=20, maximum_latitude=50,
        start_datetime="2020-01-01", end_datetime="2020-12-31",
        output_filename="duacs_my_eastasia_2020.nc",
    )

    # C3S product (vDT2024, 0.25°, two-satellite constellation)
    # import cdsapi
    # cdsapi.Client().retrieve(
    #     "satellite-sea-level-global",
    #     {"variable": "monthly_mean", "version": "vdt2024",
    #      "year": ["2020"], "month": [f"{m:02d}" for m in range(1, 13)]},
    #     "c3s_sealevel_2020_monthly.zip",
    # )

tips:
  - >-
    The Copernicus Marine (allsat) maps use every satellite available at the time, which is best for mesoscale eddies, but the changing number of
    satellites makes the record less homogeneous over decades. C3S builds a separate climate product with a fixed two-satellite (twosat) constellation for
    long-term stability, so use C3S for global or regional mean sea level rise and long-term trends.
  - The QUID states that NRT products should not be used for long-term signal analysis, because constellation changes can cause jumps or drifts. If you append recent NRT months to MY, check the differences over an overlap period first.
  - "DUACS L4 sea level is not corrected for glacial isostatic adjustment (GIA). Apply your own GIA correction where needed, e.g. for trends or comparisons with tide gauges or GRACE."
  - Geostrophic currents derived from altimeter maps are usually weaker than in situ observations (QUID). Bear this in mind when comparing statistics such as eddy kinetic energy with other datasets.
  - "ADT is SLA plus the MDT, so a new MDT (MDT_CNES_CLS22 in DT-2024) also changes ADT and the absolute geostrophic currents. Do not mix files from different versions."
  - "Copernicus Marine datasets carry a version tag (e.g. reprocessed 202411, NRT 202506). You can pin it with the Toolbox's dataset_version argument; record the version you downloaded if reproducibility matters."

