notices:
  - date: "2026-06-09"
    level: info
    title: NSIDC retires the GoLIVE map application (30 June 2026) and points users to ITS_LIVE
    body: >-
      NSIDC DAAC announced that the map application for GoLIVE (NSIDC-0710), the Landsat 8 glacier velocity dataset, would be retired on 30 June 2026. The GoLIVE data remain available,
      and users who need a more fully reprocessed velocity product were pointed to ITS_LIVE, which provides global ice velocities from 1984 to the present.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-upcoming-retirement-golive-map-application
  - date: "2025-09-05"
    level: info
    title: Reference paper for ITS_LIVE V2 published, noting a pause in Sentinel-1 processing
    body: >-
      Gardner et al. (2025, The Cryosphere) describe how V2.0 image pairs, datacubes and mosaics are made, their latency and known errors. At the time of writing, Sentinel-1 processing was on
      hold because of its cost, with only 2014–2022 processed, and the authors expected it to resume by mid-2025. When checked on 2026-10-13, 2026 Sentinel-1C/1D pairs were appearing in STAC.
    source: https://doi.org/10.5194/tc-19-3517-2025
  - date: "2025-07-23"
    level: warning
    title: NSIDC-0776 regional annual mosaics V2 released; V1 retired on 2025-08-26
    body: >-
      NSIDC DAAC released V2 of the 120 m regional annual velocities (1984–2022) and 2014–2022 climatology mosaics, made with autoRIFT from Sentinel-1, Sentinel-2 and Landsat 4–9.
      V1 (Landsat only, 1985–2018) was removed from NSIDC on 26 August 2025 and can no longer be downloaded; only its documentation remains.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-measures-its_live-regional-glacier-and-ice-sheet-surface-velocities-version-2

transitions:
  - from: ITS_LIVE V1
    to: ITS_LIVE V2
    status: completed
    date: "2025-07"
    summary: >-
      V2 extends the Landsat-only V1 to Sentinel-1, Sentinel-2 and Landsat 9, refines the grid from 240 m to 120 m and reprocesses the full record with improved autoRIFT feature tracking and error
      estimates. Image pairs and datacubes on AWS moved to V2 first; the NSIDC regional mosaics followed with V2 (NSIDC-0776) in 2025-07, when V1 was retired.
    changes:
      - aspect: Input satellites
        before: Landsat 4, 5, 7, 8 (TM, ETM+, OLI)
        after: "Landsat 4, 5, 7, 8, 9, Sentinel-2A/B(/C), Sentinel-1A/B(/C) IW"
      - aspect: Grid spacing
        before: "240 m (some NSIDC-0776 V1 files 120 m)"
        after: 120 m for all sensors
      - aspect: Regional mosaic period
        before: "1985–2018 (sparse before 2013)"
        after: "1984–2022 (NSIDC V2), climatology 2014–2022. AWS V02.1 runs to 2024"
      - aspect: Projection distortion
        before: Velocities corrected for map projection scale distortion
        after: Velocities left in the map projection plane (scale errors up to a few percent; users correct)
      - aspect: Processing
        before: Early auto-RIFT
        after: Improved autoRIFT feature tracking, stable-ground bias correction (stable_shift), updated error estimates
      - aspect: Distribution
        before: NSIDC (Earthdata Login), data before April 2023
        after: "AWS its-live-data bucket and STAC (no login), NSIDC-0776 V2 (login)"
    impacts:
      - Do not join V1 and V2 into one time series. Sensors, grid and projection-distortion handling differ, so values differ at the same point.
      - "A V1 workflow for comparing with GPS will be off by the projection distortion (up to a few percent) if applied to V2 unchanged. Apply the scale correction yourself before comparing."
      - "NSIDC-0776 V1 files cannot be downloaded after 2025-08-26. To reproduce older results, recompute with V2 and note the version difference."
      - "The NSIDC Landsat image-pair V1 (NSIDC-0775, 240 m, 1985–2018) is still listed as the most recent version there, but V2 image pairs are available only from AWS and STAC."
    sources:
      - name: NSIDC — NSIDC-0776 V2 release and V1 retirement (2025-07-23)
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-measures-its_live-regional-glacier-and-ice-sheet-surface-velocities-version-2
      - name: NSIDC-0776 V2 user guide
        url: https://nsidc.org/sites/default/files/documents/user-guide/nsidc-0776-v002-userguide.pdf
      - name: Gardner et al. (2025), The Cryosphere
        url: https://doi.org/10.5194/tc-19-3517-2025
      - name: Lei et al. (2022), ESSD (Sentinel-1 V2 processing)
        url: https://doi.org/10.5194/essd-14-5111-2022

