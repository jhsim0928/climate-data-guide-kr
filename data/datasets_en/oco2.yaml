notices:
  - date: "2026-10-21"
    level: warning
    title: Ingest & Archive Migration to interrupt GES DISC data ingestion (Oct. 28-30)
    body: >-
      As part of NASA's planned Consolidated Ingest and Archive (I&A) system migration, GES DISC will experience temporary interruptions to new data ingestion and availability from October 28, 5:00 p.m. to October 30, 9:00 a.m. ET.
      Existing data search and download services are expected to remain operational. New data ingestion will resume and newly ingested data will become available once migration is complete.
    source: https://disc.gsfc.nasa.gov/information/alerts
  - date: "2026-09-18"
    level: warning
    title: GES DISC legacy data servers closing — move to Earthdata Cloud
    body: >-
      GES DISC issued an emergency notice that HTTPS access to its on-premises servers will end no earlier than 30 September 2026. Data remain free from Earthdata Cloud,
      but recursive wget/curl downloads of directories will no longer work, so granule lists must be built through CMR (or earthaccess). OPeNDAP for OCO2_L2_Lite_FP V11.3r and Fwd_FP V11.3 moved to the cloud in late August 2026.
    source: https://disc.gsfc.nasa.gov/information/alerts
  - date: "2026-08-24"
    level: info
    title: NASA and Caltech sign OCO-2 and OCO-3 operations agreements (up to five years)
    body: >-
      NASA announced that it signed non-reimbursable Space Act Agreements with Caltech for OCO-2 and OCO-3 on 14 August 2026. Caltech operates both missions and their science data systems,
      including new data products, while NASA retains ownership. The partnership lasts up to five years.
    source: https://science.nasa.gov/blogs/oco-2/2026/08/24/nasa-caltech-partner-on-two-earth-science-missions/
  - date: "2026-06-01"
    level: warning
    title: Lite XCO2 V11.3r released — detector-icing bias corrected from 2024
    body: >-
      With no decontamination between February 2023 and February 2025, ice on the detectors biased V11.2 XCO2 low (about 0.5 ppm by February 2025).
      V11.3 adds an icing term to the bias correction for data from 2024-01-01 onward. Switch to V11.3r for any analysis after 2024.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_L2_Data_Release_Statement_v11.3_RevA_V01.pdf
  - date: "2025-06-10"
    level: info
    title: Bias-corrected daily forward XCO2 and SIF now within a week of observation
    body: >-
      Bias-corrected daily forward-stream products (V11.2) for OCO-2 and OCO-3 began appearing within a week of observation. The monthly retrospective Lite files remain the reference record.
    source: https://ocov2.jpl.nasa.gov/whats-new-oco-2/
  - date: "2025-02-20"
    level: info
    title: 21st decontamination completed after the longest (two-year) gap
    body: >-
      OCO-2 completed its 21st decontamination cycle (10–17 February 2025) to clear ice from the focal plane arrays, two years after the previous one — the longest gap so far.
      The icing effects from that interval are corrected in V11.3.
    source: https://ocov2.jpl.nasa.gov/whats-new-oco-2/

