example:
  lang: python
  note: >-
    Downloads Lite XCO2 (V11.3r) around Korea for July 2024 with earthaccess and keeps only soundings with quality flag 0. The first run asks for your Earthdata credentials.
    For years up to 2023, use version="11.2r".
  code: |
    import earthaccess
    import xarray as xr
    import numpy as np

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="OCO2_L2_Lite_FP", version="11.3r",
        temporal=("2024-07-01", "2024-07-31"),
        bounding_box=(120, 30, 135, 45),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "oco2_lite")

    out = []
    for f in files:
        ds = xr.open_dataset(f)                         # root-level variables (xco2, latitude, ...)
        good = (ds["xco2_quality_flag"] == 0) \
            & ds["latitude"].between(30, 45) & ds["longitude"].between(120, 135)
        out.append(ds[["xco2", "xco2_uncertainty", "latitude", "longitude", "time"]].where(good, drop=True))
        # Mode and land fraction live in a group:
        # snd = xr.open_dataset(f, group="Sounding"); snd["operation_mode"]

    sel = xr.concat(out, dim=out[0]["xco2"].dims[0])   # concatenate along the sounding dimension
    print(sel.sizes, float(sel["xco2"].mean()))

tips:
  - "Use `xco2` from the Lite files (bias-corrected and filtered). `Retrieval/xco2_raw` and the XCO2 in L2 Standard are pre-correction values and should not be used as is."
  - "Start with `xco2_quality_flag` = 0. Land and ocean-glint soundings have different bias behaviour, so compare them by mode (`Sounding/operation_mode`) before averaging them together."
  - "Use V11.3r from 2024 onward. With no decontamination between February 2023 and February 2025, detector icing biased V11.2 XCO2 low by up to about 0.5 ppm. Decontaminations are now planned yearly."
  - "According to the User's Guide, the Lite files include an XCO2 converted to the WMO X2019 CO2 scale (about 0.08 ppm higher than X2007). The scale of `xco2` is given in its comment attribute; match scales when comparing with NOAA or TCCON data."
  - "`xco2_uncertainty` is the retrieval's posterior error, which the product description says is generally 30–50% smaller than the true uncertainty. Do not use it unadjusted for error propagation or inversion weights."
  - "Cloudy and aerosol-laden regions (the East Asian summer monsoon, the tropics) yield far fewer valid soundings. Report sample counts with any regional mean."
  - "OCO-3 (on the International Space Station's JEM-EF since 2019) is OCO-2's sister instrument. It samples latitudes below about 52° at varying times of day and has a snapshot area map (SAM) mode for cities. There are no data during its storage period from November 2023 to July 2024 (science resumed 16 July 2024). Its data are separate OCO-3 collections at GES DISC."
  - "`SIF_740nm` is the easiest SIF quantity to compare with other sensors such as TROPOMI. For comparisons with GPP, use `Daily_SIF_*` rather than instantaneous values and state the clear-sky assumption."

