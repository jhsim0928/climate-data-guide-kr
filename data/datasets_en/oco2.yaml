# ─────────────────────────────────────────────────────────────
# OCO-2 XCO2 and SIF — dataset information file
# Satellite tab (Aerosols and atmospheric composition). Lite XCO2 is split between V11.2r (2014–2023) and V11.3r (2024 onward, detector-icing correction).
# Since August 2026 Caltech operates OCO-2 and OCO-3 under a non-reimbursable Space Act Agreement with NASA (up to five years).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: oco2
name: "OCO-2"
full_name: Orbiting Carbon Observatory-2 (OCO-2) Level 2 XCO2 (Lite FP, Standard) and Solar-Induced Fluorescence (Lite SIF), Build 11
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 80
domains: [대기, 육지, 원격탐사]
provider: NASA JPL OCO-2/OCO-3 Science Team (operated by Caltech since August 2026) / NASA GES DISC

status: active
status_note: >-
  Launched in July 2014, OCO-2 has far outlived its two-year prime mission and is still observing. After soliciting partners for the two missions in 2025, NASA signed non-reimbursable Space Act Agreements
  with Caltech for OCO-2 and OCO-3 on 14 August 2026. The partnership lasts up to five years, NASA keeps ownership of both missions, and Caltech operates them and their science data systems.
  As checked on 2026-10-13, GES DISC holds Lite XCO2 V11.3r through 2026-07-28, Lite SIF V11.2r through 2026-07-27 and forward-stream V11.3 through 2026-10-10.
  Since 1 June 2026, XCO2 from 2024 onward has been replaced by V11.3r, which corrects a detector-icing bias.

transitions:
  - from: OCO-2 Lite XCO2 V11.2r
    to: OCO-2 Lite XCO2 V11.3r
    status: completed
    date: "2026-06"
    summary: >-
      V11.3r adds a bias-correction term for the negative XCO2 bias caused by ice building up on the focal plane arrays after 2024. The 2014–2023 record was not reprocessed,
      so a full-record analysis uses V11.2r through 2023 and V11.3r from 2024.
    changes:
      - aspect: Release
        before: "V11.2r, 2024-04-01 (citation release date)"
        after: "V11.3r, 2026-06-01 (forward-stream V11.3 from 2026-06-03 production)"
      - aspect: Period covered
        before: "2014-09 to 2026-03 (per CMR granules)"
        after: "2024-01-01 to present; 2014–2023 remain V11.2r only"
      - aspect: Bias correction
        before: "Three terms: feature (FEAT), footprint (FOOT) and global TCCON adjustment"
        after: "The same three terms plus an icing term based on the zero-level offset, a stray-light measure tracking icing-related throughput loss"
      - aspect: Size of correction (2024 mean)
        before: "V11.2 bias of about 0.5 ppm, varying by footprint, by the February 2025 decontamination"
        after: "Icing correction averaging 0.20 ppm (0.25 ppm land, 0.17 ppm water)"
      - aspect: Reversibility
        before: "-"
        after: "The daily files contain the information needed to subtract the icing term and recover V11.2r values"
    impacts:
      - "V11.2r values after 2024 retain the icing bias (up to about 0.5 ppm); switch to V11.3r. Biases of 0.2–0.5 ppm matter for growth-rate and seasonal-amplitude studies."
      - "There are no V11.3r files before 2024. Long time series must join the two versions; state the join (2024-01) in publications."
      - "According to the release documents, Lite SIF and L2 Standard are not part of this revision."
    sources:
      - name: OCO-2 Level 2 Data Release Statement v11.3 (Rev A, 2026-06)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_L2_Data_Release_Statement_v11.3_RevA_V01.pdf
      - name: OCO-2 V11.2 / OCO-3 V11 L2 Data User's Guide (v04 Rev B, 2026-06-10)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_V11.2_OCO3_V11_L2_Data_Users_Guide_v04_RevB_260610.pdf

period:
  start: "2014-09"
  end: present
  note: >-
    OCO-2 launched on 2014-07-02 and joined the A-Train on 2014-08-03. Lite XCO2 V11.2r files begin on 2014-09-06 and Lite SIF V11.2r on 2014-09-01.
    As checked on 2026-10-13, retrospective Lite XCO2 V11.3r runs through 2026-07-28, Lite SIF through 2026-07-27 and L2 Standard V11.2r through 2026-07-28,
    while the forward-stream XCO2 (OCO2_L2_Fwd_FP V11.3, from 2025-02-02) runs through 2026-10-10. Decontamination and manoeuvre periods leave gaps.

resolution:
  spatial_short: "2 km (0.02°)"
  temporal_short: "1일"
  spatial: >-
    Swath data with 8 side-by-side footprints recorded every 0.333 s along the orbit. Footprints are under 2.25 km along track and 0.1–1.3 km across track at nadir;
    the swath subtends 0.8° and is under 10 km wide. These are point data with a latitude and longitude for each sounding, not a grid.
  vertical: "Column-averaged dry-air mole fraction XCO2 (single value), with prior CO2 profiles and averaging kernels on each sounding's retrieval pressure levels (`pressure_levels`)"
  temporal: >-
    Sun-synchronous near-polar orbit, ascending node near 13:30 mean local time, 16-day (233-orbit) repeat. Only the sunlit hemisphere is observed, in nadir, glint and target modes.
    Lite files are grouped by UTC day; Standard files cover orbit and mode segments.

coverage:
  short: 전지구
  note: "Point soundings along a swath less than 10 km wide; daytime"
update: "Forward stream: typically within 2 days of acquisition (bias-corrected daily forward files within a week) / Retrospective: monthly (about 2–3 months behind as of October 2026)"
license: NASA Earth science open data — free with no restrictions. Downloads need a free NASA Earthdata Login; please cite the dataset DOI
account_required: true

summary: >-
  OCO-2 is NASA's carbon observatory. It measures reflected sunlight at high spectral resolution in the CO2 bands near 1.61 and 2.06 µm and the O2 A-band (0.76 µm),
  retrieving the column-averaged dry-air mole fraction of CO2 (XCO2) in soundings no larger than about 1.3 km × 2.25 km at nadir, almost a million per day.
  The same O2 A-band also yields solar-induced chlorophyll fluorescence (SIF), a proxy for photosynthetic activity. The project recommends the filtered, bias-corrected daily Lite files
  (XCO2: OCO2_L2_Lite_FP; SIF: OCO2_L2_Lite_SIF) for science, which are widely used for carbon-sink, urban and power-plant emission, and drought-impact studies.

time_convention:
  summary: >-
    All values are instantaneous measurements at the overpass (around 13:30 local time). Each Lite file holds one UTC day of soundings, and `time` gives each sounding's time.
    The SIF files also carry `Daily_SIF_*`, an estimate of the daily mean derived by assuming clear-sky changes in sunlight through the day.
  points:
    - "In the XCO2 Lite files `time` is seconds since 1970-01-01 00:00:00 UTC; in the SIF Lite files `Delta_Time` is seconds since 1990-01-01 00:00:00 UTC. The two files use different epochs."
    - "Lite files are organised by UTC day. East Asian overpasses (around 13:30 local time) fall within a single UTC date, but orbits near the date line can cross the boundary."
    - "The forward stream (OCO2_L2_Fwd_FP) arrives within days but has less refined calibration and screening. Retrospective products (version suffix 'r', e.g. 11.3r) are delivered monthly and are recommended for science."
    - "`Daily_SIF_*` is not a measured daily mean: it is instantaneous SIF multiplied by `Science/daily_correction_factor`, which integrates clear-sky cos(solar zenith angle) over the day."
    - "As of January 2025 only OCO-2 and GCOM-W1 remained in the A-Train after Aqua, Aura and others left; OCO-2 no longer shares an overpass time with Aqua MODIS."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_V11.2_OCO3_V11_L2_Data_Users_Guide_v04_RevB_260610.pdf
  source_name: OCO-2 V11.2 / OCO-3 V11 L2 Data User's Guide + OCO-2 SIF v11.2 User's Guide + OCO-2 Lite file description (V8r)

variables:
  note: >-
    XCO2 Lite variables follow the OCO-2 L2 Data User's Guide (V11.2/V11.3) and the Lite file product description (V8r, 2017); SIF Lite variables follow Table 4-1 of the SIF V11.2 User's Guide.
    `Sounding/`, `Retrieval/`, `Science/` and `Metadata/` are netCDF4 groups. Some readers do not show groups; use an HDF5 tool or xarray's group argument.
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_V11.2_OCO3_V11_L2_Data_Users_Guide_v04_RevB_260610.pdf
  groups:
    - name: XCO2 Lite (OCO2_L2_Lite_FP, daily netCDF4)
      kind: instant
      period: observation time
      items:
        - text: "Bias-corrected, filtered XCO2 — `xco2` (ppm)"
          note: primary science variable
        - "XCO2 posterior uncertainty — `xco2_uncertainty` (ppm)"
        - text: "Simple quality flag — `xco2_quality_flag`"
          note: 0 good (all tests passed), 1 poor
        - "Per-test bit flags — `xco2_qf_bitflag`, `xco2_qf_simple_bitflag`"
        - "XCO2 before bias correction — `Retrieval/xco2_raw` (ppm)"
        - "Prior XCO2 — `xco2_apriori` (ppm)"
        - "Column averaging kernel — `xco2_averaging_kernel` (dimensionless)"
        - "Prior CO2 profile — `co2_profile_apriori` (ppm)"
        - "Retrieval pressure levels — `pressure_levels` (hPa)"
        - "Pressure weighting function — `pressure_weight`"
        - text: "Retrieved surface pressure — `Retrieval/psurf`"
          std: []
        - text: "Footprint-centre latitude and longitude — `latitude`, `longitude` (°)"
          std: []
        - text: "Sounding time — `time` (seconds since 1970-01-01 00:00:00 UTC)"
          std: []
        - text: "Sounding identifier — `sounding_id`"
          note: 16-digit number in YYYYMMDDhhmmssmf form
          std: []
        - text: "Measurement mode — `Sounding/operation_mode`"
          note: 0 nadir, 1 glint, 2 target, 3 transition
          std: []
        - text: "Land fraction — `Sounding/land_fraction`"
          std: []
        - text: "Solar zenith angle — `solar_zenith_angle` (°)"
          std: []
    - name: SIF Lite (OCO2_L2_Lite_SIF, daily netCDF4)
      kind: instant
      period: observation time
      items:
        - text: "SIF scaled to 740 nm — `SIF_740nm` (W/m2/sr/µm)"
          note: derived from the 757 and 771 nm retrievals
        - "740 nm SIF 1σ uncertainty — `SIF_Uncertainty_740nm` (W/m2/sr/µm)"
        - "SIF at 757 and 771 nm — `Science/SIF_757nm`, `Science/SIF_771nm` (W/m2/sr/µm)"
        - text: "Daily-average-corrected SIF — `Daily_SIF_740nm`, `Daily_SIF_757nm`, `Daily_SIF_771nm` (W/m2/sr/µm)"
          kind: mean
          period: Daily
          note: instantaneous value × daily correction factor (clear-sky assumption)
        - "Daily correction factor — `Science/daily_correction_factor`"
        - text: "Quality flag — `Quality_Flag`"
          note: 0 best, 1 good, 2 failed, −1 not investigated; normally use 0 and 1
        - text: "Latitude and longitude — `Latitude` (°N), `Longitude` (°E)"
          std: []
        - text: "Sounding time — `Delta_Time` (seconds since 1990-01-01 00:00:00 UTC)"
          std: []
        - text: "Measurement mode — `Metadata/MeasurementMode`"
          note: 0 nadir, 1 glint, 2 target, 3 area map (OCO-3 only), 4 transition
          std: []

