transitions:
  - from: MODIS Snow Cover C6.1 (MOD10, MYD10)
    to: VIIRS Snow Cover C2 (VNP10, VJ110)
    to_id: viirs-snow
    status: planned
    date: "2026"
    summary: >-
      The VIIRS snow products were developed alongside the MODIS Collection 6 algorithm and use an almost identical approach (NDSI plus data screens), designed to continue the MODIS record.
      Resolution (500 m → 375 m), cloud mask, observing time and the set of products differ, so the records should not simply be joined.
    changes:
      - aspect: Platform and observing time
        before: "Terra (morning, from 2000-02) and Aqua (afternoon, from 2002-07) as separate products"
        after: "Suomi NPP (VNP10, from 2012-01; delivery ends 2026-11-02), NOAA-20 (VJ110, from 2018-01), NOAA-21 (VJ210, from 2023-02), all in afternoon orbits. No follow-on for Terra's morning observations"
      - aspect: Resolution
        before: "500 m Sinusoidal tiles (2400×2400) / 0.05° CMG"
        after: "375 m Sinusoidal tiles (3000×3000) / 0.05° CMG / 375 m global lat-lon cloud-gap-filled (D1F)"
      - aspect: NDSI bands
        before: "MODIS visible band and band 6 (1.6 µm; QIR-restored for Aqua)"
        after: "VIIRS I1 (0.64 µm) and I3 (1.61 µm)"
      - aspect: Cloud mask
        before: "MOD35/MYD35"
        after: "VNP35 and equivalents (750 m cloud confidence applied to the four corresponding 375 m pixels)"
      - aspect: Products
        before: "Daily (A1), gap-filled daily (A1F), 8-day (A2, C2), daily CMG (C1), monthly CMG (CM), snow albedo layer"
        after: "Daily (A1), gap-filled daily (A1F), daily CMG (C1) and 375 m gap-filled CMG (D1F) only — no 8-day or monthly products and no snow albedo"
      - aspect: Variables and codes
        before: "`NDSI_Snow_Cover_Basic_QA`, `NDSI_Snow_Cover_Algorithm_Flags_QA`, NDSI scale 0.0001, 200 missing, 254 saturated"
        after: "`Basic_QA`, `Algorithm_bit_flags_QA`, NDSI scale 0.001, adds 251 missing L1B, 252 failed calibration, 253 bowtie trim"
      - aspect: File format
        before: "HDF-EOS2 (HDF4)"
        after: "HDF-EOS5 (HDF5, CF-1.6)"
    impacts:
      - "Hall et al. (2024) found that VIIRS (VNP10A1F) maps slightly more snow than MODIS (MOD10A1F) in the US Great Basin (a less conservative cloud mask and different overpass times). The mean daily difference in snow-covered area in water year 2023 was 0.69%, while VIIRS snow seasons in the Great Salt Lake Basin were about two days longer."
      - "Analyses that used the MODIS 8-day or monthly products must composite VIIRS daily data themselves. Match the compositing rule (maximum extent, mean) to MODIS."
      - "Terra (morning) and VIIRS (afternoon) observe at different times, so diurnal melt and morning cloud differences show up in the values. Before joining, compare Aqua with VIIRS over their overlap (2012 onward)."
      - "Delivery of Suomi NPP data (VNP10) ends on 2 November 2026; from then on use VJ110 (NOAA-20) and VJ210 (NOAA-21)."
    sources:
      - name: Riggs, Hall, Román (2017) — overview of the MODIS and VIIRS snow ESDRs
        url: https://doi.org/10.5194/essd-9-765-2017
      - name: Hall, Riggs, DiGirolamo (2024) — comparison of MODIS and VIIRS snow products (Great Basin)
        url: https://doi.org/10.3390/rs16163029
      - name: Román et al. (2024) — continuity between MODIS C6.1 and VIIRS C2 land products
        url: https://doi.org/10.1016/j.rse.2023.113963
      - name: NASA Earthdata — Transition from MODIS to VIIRS (2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - from: MODIS Snow Cover Collection 6.1 (V61)
    to: MODIS Snow Cover Collection 7
    status: planned
    summary: >-
      The MODIS snow team has published the Collection 7 User Guide (February 2025, Version 1.0) for the final reprocessing. The snow algorithm is the same as C6.1, with only improved Level 1B calibration;
      as of 2026-10-13 no C7 data were available at NSIDC or in CMR.
    changes:
      - aspect: File format
        before: "HDF-EOS2 (HDF4)"
        after: "HDF-EOS5 (HDF5-based)"
      - aspect: Products
        before: "L2, A1, A1F, A2 (8-day), C1, C2 (8-day CMG), CM (monthly CMG)"
        after: "L2, A1, A1F, C1 — 8-day (A2, C2) and monthly (CM) products discontinued"
      - aspect: Snow albedo
        before: "`Snow_Albedo_Daily_Tile` in MOD10A1"
        after: "Removed"
      - aspect: Algorithm
        before: "C6.1 snow algorithm"
        after: "Unchanged (only improved L1B calibration inputs; Aqua band 6 still restored with QIR)"
    impacts:
      - When C7 appears the whole record will change, so do not mix it with C6.1.
      - "Code using the 8-day or monthly products or snow albedo will need an alternative in C7 (for example compositing the daily data yourself)."
    sources:
      - name: MODIS Snow Products Collection 7 User Guide (Riggs and Hall, 2025-02)
        url: https://nsidc.org/sites/default/files/documents/technical-reference/modis_c7_snow_userguide.pdf
      - name: MODIS Land News (Collection 7 plans)
        url: https://modis-land.gsfc.nasa.gov/news.html

notices:
  - date: "2026-03-26"
    level: warning
    title: Terra MODIS placed in standby — data for 26–27 March 2026 flagged as bad
    body: >-
      After a spacecraft anomaly at about 20:00 UTC on 26 March, Terra MODIS went into standby mode and returned to science mode on 27 March.
      The calibration team flagged data from day 2026-085 20:00 UTC to day 2026-086 19:23 UTC as questionable or bad; it is safest not to use MOD10 values for those dates.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2025-08-19"
    level: warning
    title: NSIDC DAAC retires the legacy MODIS archive — move to Earthdata Cloud
    body: >-
      In a 22 May 2025 notice NSIDC announced that access to MODIS C6.1 and related data in the legacy on-premises archive (n5eil01u.ecs.nsidc.org HTTPS and Earthdata Search "Stage for Delivery" orders)
      would end on 19 August. NASA Earthdata Cloud is now the primary archive, so download scripts need new URLs.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-retirement-legacy-data-archive-modis-collection-61-and-modis-related-data-sets
  - date: "2025-05-02"
    level: warning
    title: Move from MODIS to VIIRS — Terra and Aqua expected to shut down in late 2026 or early 2027
    body: >-
      NASA said MODIS collection will stop once Terra and Aqua begin shutting down in late 2026 or early 2027, with a final reprocessing beforehand.
      It noted that orbit drift affects crossing times and may affect the data, and encouraged users to switch to similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2025-03-18"
    level: info
    title: 22 MODIS V6.1 snow and sea ice data sets available from Earthdata Cloud
    body: >-
      NSIDC added 22 MODIS V6.1 data sets to NASA Earthdata Cloud (AWS). The new HTTPS location is under the "HTTPS File System" link on each data set page,
      and the 4 March 2025 notice asked users to update scripts because the legacy URLs would soon be removed.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-new-nasa-earthdata-cloud-access-option-modis-version-61-collections-available-18
  - date: "2023-07-07"
    level: info
    title: Terra and Aqua MODIS switch to Lights-Out-Operations — more data loss possible
    body: >-
      With no night-shift operator and no more solid-state recorder replays, all MODIS V6.1 data from this date may see more frequent non-recoverable gaps.
      The NSIDC MODIS data pages carry the same notice.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/modis-light-out-operations-potential-data-loss
  - date: "2021-10-28"
    level: warning
    title: Changes in Terra and Aqua orbits affect MODIS snow and sea ice products
    body: >-
      Terra has drifted since its last orbit maintenance in February 2020 and Aqua since March 2021. Terra's crossing time was projected to move earlier to about 09:00 by December 2025
      and Aqua's later to about 15:50 by August 2026. Lower sun elevation brings more shadow, and the lower altitude reduces coverage and breaks the 16-day repeat.
    source: https://nsidc.org/data/user-resources/data-announcements/ongoing-changes-terra-and-aqua-orbits-impacting-modis-snow-and-sea-ice-products

