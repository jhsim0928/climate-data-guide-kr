# ─────────────────────────────────────────────────────────────
# MODIS Snow Cover (MOD10, MYD10) C6.1 — dataset information file (English edition)
# Land tab (snow). Deprecated as Terra and Aqua near their end; linked to the VIIRS successor (viirs-snow.yaml).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-snow
name: "MODIS Snow (MOD10)"
full_name: MODIS/Terra and Aqua Snow Cover (MOD10, MYD10) Version 61 — NDSI-based snow cover, daily, 8-day and monthly, on 500 m tiles and the 0.05° Climate Modeling Grid, including cloud-gap-filled daily maps
category: satellite
domain: land
group: 적설
order: 10
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 수문, 원격탐사]
provider: NASA GSFC MODIS Snow Team (Hall and Riggs) / NASA NSIDC DAAC

status: deprecated
status_note: >-
  Version 61 (Collection 6.1) is current and is still updated daily for both Terra (MOD10) and Aqua (MYD10); on 2026-10-13 the latest MOD10A1 and MYD10A1 files were for 11 October 2026.
  Both satellites are out of fuel and drifting, however, and NASA has said MODIS collection will stop when they shut down in late 2026 or early 2027, recommending a move to VIIRS snow cover (VNP10, VJ110).
  Operations have already outlasted the originally planned end dates (Terra December 2025, Aqua August 2026), but no official end date has been announced.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra starts on 2000-02-24 (MOD10A1, A1F, C1), 2000-02-18 for the 8-day products (MOD10A2, C2) and 2000-03 for the monthly product (MOD10CM); all Aqua (MYD10) products start on 2002-07-04.
    On 2026-10-13 daily data from both satellites ran through 2026-10-11.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1일"
  spatial: >-
    MODIS Sinusoidal tile grid, 500 m (MOD10A1, A1F, A2; each 10°×10° tile is 2400×2400 pixels) / 0.05° Climate Modeling Grid (CMG; MOD10C1, C2, CM; 3600×7200) /
    500 m swath (MOD10_L2, 5-minute granules)
  vertical: Land surface (single level)
  temporal: Daily (A1, A1F, C1) / 8-day (A2, C2; periods restart on 1 January each year) / monthly (CM)

coverage:
  short: 전지구
update: Daily (a few days' latency, longer around spacecraft manoeuvres) / 8-day and monthly products after each period closes
license: NASA Earth science open data — free and unrestricted. Downloads require a free NASA Earthdata Login
account_required: true

summary: >-
  Global snow cover from Terra (MOD10) and Aqua (MYD10) MODIS, produced by the NASA MODIS snow team using the Normalized Difference Snow Index (NDSI) and a series of data screens.
  The daily 500 m tile product (MOD10A1) gives an NDSI snow cover value from 0 to 100 for each pixel; alongside it come a cloud-gap-filled daily product that fills cloudy pixels
  with the most recent clear view (MOD10A1F), 8-day maximum snow extent (MOD10A2), and daily, 8-day and monthly snow cover percentages on the 0.05° grid (MOD10C1, C2, CM).
  The record starts in 2000 and is widely used for snow climatology, melt timing and hydrological model evaluation; the VIIRS snow products continue it.

time_convention:
  summary: >-
    Daily data (MOD10A1) hold the single "best" observation of the day for each pixel — the one nearest local solar noon, nearest the orbit nadir track and covering the most of the cell — so they are instantaneous values.
    Terra is a morning satellite and Aqua an afternoon one, so the two products observe at different times on the same day. The 8-day product is a maximum extent ("snow on any day means snow"); the monthly product is a mean of the daily values.
  points:
    - "Which swath (and therefore observation time) each pixel came from can be traced with `granule_pnt`, `orbit_pnt` and the file metadata. Other observations of the day are discarded, so observation time varies from pixel to pixel within one date."
    - "Terra originally crossed the equator at 10:30 and Aqua at 13:30, but after their fuel ran out they drifted: Terra was projected to reach about 09:00 around December 2025 and Aqua about 15:50 around August 2026. Lower sun angles mean more shadow and low-illumination effects."
    - "MOD10A1F (cloud-gap-filled) puts the most recent clear-sky value into today's cloudy pixels. Where `Cloud_Persistence` is 1 or more, the value is from that many days earlier, not from today (0 = clear today)."
    - "MOD10A2 (8-day) marks a pixel as snow if snow was seen on any day of the period, and as cloud only if all eight days were cloudy. The 8-day periods restart on 1 January, so the last period of a year can be shorter."
    - "In MOD10C1 (daily CMG) the snow percentage is the share of snow among all land observations in the cell, with cloud percentage given separately. Antarctica is deliberately set to 100% snow, so the product cannot be used for Antarctic snow cover."
    - "MOD10CM (monthly) is the monthly mean snow cover extent derived from the daily MOD10C1."
  source: https://nsidc.org/sites/default/files/c61_modis_snow_user_guide.pdf
  source_name: "MODIS Snow Products Collection 6.1 User Guide (Riggs, Hall and Román, 2019) + NSIDC data set pages"

variables:
  note: >-
    Layer names from the MODIS Snow Products C6.1 User Guide (NSIDC). Files are HDF-EOS2 (HDF4).
    `NDSI_Snow_Cover` values 0–100 are NDSI × 100 (not fractional snow cover); 200 missing, 201 no decision, 211 night, 237 inland water, 239 ocean, 250 cloud, 254 detector saturated, 255 fill.
  full_list: https://nsidc.org/sites/default/files/c61_modis_snow_user_guide.pdf
  groups:
    - name: Daily snow cover, 500 m (MOD10A1 / MYD10A1)
      kind: instant
      period: one selected observation per day
      items:
        - text: "NDSI snow cover — `NDSI_Snow_Cover` (0–100, dimensionless)"
          note: Value from the best observation of the day. Fractional snow cover (FSC) has not been provided since C6
        - "Raw NDSI — `NDSI` (scale_factor 0.0001)"
        - "Basic quality — `NDSI_Snow_Cover_Basic_QA` (0 best, 1 good, 2 ok)"
        - "Algorithm screen bits — `NDSI_Snow_Cover_Algorithm_Flags_QA` (bits 0–7: inland water, low visible / low NDSI / temperature-height / high SWIR screens, probably cloudy/clear, solar zenith above 70°)"
        - text: "Snow albedo — `Snow_Albedo_Daily_Tile` (0–100, %)"
          note: Computed for snow pixels only. Within about 10% of field measurements under ideal conditions, but errors can be very large in steep terrain. To be dropped in Collection 7
        - "Observation source pointers — `orbit_pnt`, `granule_pnt`"
    - name: Cloud-gap-filled daily snow cover, 500 m (MOD10A1F / MYD10A1F)
      kind: instant
      period: most recent clear-sky observation
      items:
        - text: "Cloud-gap-filled NDSI snow cover — `CGF_NDSI_Snow_Cover` (0–100)"
          note: Cloudy pixels are filled with the previous clear value. A nearly cloud-free map usually needs five to seven days
        - text: "Consecutive cloudy days — `Cloud_Persistence` (days)"
          kind: accum
          note: 0 = clear today; n = cloudy for n consecutive days (the value is n days old)
        - text: "Copy of the same-day MOD10A1 value — `MOD10A1_NDSI_Snow_Cover`, `MYD10A1_NDSI_Snow_Cover`"
          note: "The first name is used in Terra files, the second in Aqua files"
        - "Quality — `Basic_QA`, `Algorithm_Flags_QA`"
    - name: 8-day snow cover, 500 m (MOD10A2 / MYD10A2)
      kind: max
      period: 8 days
      items:
        - text: "8-day maximum snow extent — `Maximum_Snow_Extent` (classes: 25 no snow, 37 lake, 39 ocean, 50 cloud, 100 lake ice, 200 snow, etc.)"
          note: Snow if snow was seen on any day of the period
        - text: "Day-by-day snow occurrence bits — `Eight_Day_Snow_Cover`"
          kind: instant
          note: Bit 0 = first day of the period. Shows which days snow was seen
    - name: 0.05° CMG snow cover percentage (MOD10C1 daily / MOD10C2 8-day / MOD10CM monthly)
      items:
        - text: "Daily snow cover — `Day_CMG_Snow_Cover` (%)"
          kind: instant
          period: one selected observation per day
          note: MOD10C1. Share of land observations in the cell that are snow
        - text: "Daily cloud cover — `Day_CMG_Cloud_Obscured` (%); clear index — `Day_CMG_Clear_Index` (%)"
          kind: instant
          period: one selected observation per day
        - text: "8-day snow cover — `Eight_Day_CMG_Snow_Cover` (%)"
          kind: max
          period: 8 days
          note: MOD10C2. Maximum snow cover percentage over eight days (from MOD10A2)
        - text: "8-day cloud cover — `Eight_Day_CMG_Cloud_Obscured` (%); clear index — `Eight_Day_CMG_Clear_Index` (%)"
          kind: max
          period: 8 days
          note: Persistent cloud over the whole eight days
        - text: "Monthly snow cover — `Snow_Cover_Monthly_CMG` (%)"
          kind: mean
          period: Monthly
          note: Monthly mean snow cover extent from daily MOD10C1
        - text: "Per-cell quality — `Snow_Spatial_QA`"
          kind: instant

access:
  - name: NSIDC DAAC data set page (MOD10A1 V61)
    url: https://nsidc.org/data/mod10a1/versions/61
    method: NSIDC Data Access Tool (date/area selection, Python script) / HTTPS / documentation
    note: Terra products are MOD10*, Aqua products MYD10*. The list of all 22 MODIS V61 data sets is at https://nsidc.org/data/modis/data.
  - name: NASA Earthdata Search and earthaccess (Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2565093311-NSIDC_CPRD
    method: Web search and download / earthaccess / AWS S3 (in us-west-2 only)
    note: >-
      Since 19 August 2025 the legacy NSIDC archive (n5eil01u.ecs.nsidc.org) is closed and Earthdata Cloud is the primary archive.
      In CMR the short name is MOD10A1 with version 61 (no leading zero, unlike MCD43's "061").
  - name: NASA AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Point and area extraction with reprojection
  - name: NASA Worldview
    url: https://worldview.earthdata.nasa.gov/
    method: Web map visualization
    note: Handy for checking daily snow and cloud patterns before downloading.

example:
  lang: python
  note: >-
    Downloads Terra cloud-gap-filled daily snow cover (MOD10A1F) over the Korean Peninsula for January 2024 with earthaccess and reads it. The files are HDF4, so pyhdf is used (pip install earthaccess pyhdf numpy).
  code: |
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MOD10A1F", version="61",
        temporal=("2024-01-15", "2024-01-15"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "mod10a1f")

    for f in files:
        sd = SD(f, SDC.READ)
        ndsi = sd.select("CGF_NDSI_Snow_Cover")[:].astype("float32")
        cp = sd.select("Cloud_Persistence")[:]
        ndsi[ndsi > 100] = np.nan          # 200+ are codes for missing, night, water, cloud, etc.
        snow = ndsi > 0                     # example: treat NDSI snow cover 1-100 as snow (tune the threshold for your study)
        fresh = cp == 0                     # pixels clear today, i.e. observed today
        print(f, np.nanmean(snow), fresh.mean())

tips:
  - "`NDSI_Snow_Cover` values 0–100 are NDSI (× 100), not fractional snow cover. Since Collection 6 neither FSC nor a binary snow map is provided, so choose an NDSI threshold suited to your region and purpose and report it in your paper."
  - "Values of 200 and above (200 missing, 201 no decision, 211 night, 237 inland water, 239 ocean, 250 cloud, 254 saturated, 255 fill) must be removed first or averages will be badly wrong."
  - "About 75% of the Aqua MODIS band 6 (1.6 µm) detectors do not work. Collections 6 and 6.1 restore band 6 with Quantitative Image Restoration (QIR) and run the same algorithm as Terra, whereas Collection 5 Aqua data used band 7 and differ from Terra. Do not mix in old Aqua data."
  - "Cloud-gap-filled values (MOD10A1F) can be `Cloud_Persistence` days old. During fast-changing periods such as melt, exclude pixels with long cloud persistence."
  - "Known issues include cloud/snow confusion (cloud edges, thin snow flagged as cloud), Antarctica (frequent errors; not recommended), false lake ice in turbid lakes, and false snow on bright surfaces such as salt flats. Day-to-day geolocation wobble can blur lake and coastline edges."
  - "Orbit drift has changed Terra and Aqua crossing times, increasing low-sun observations. This can affect high-latitude winter and early-spring data and trends from the 2020s onward."
  - "Since 7 July 2023 Lights-Out-Operations have made non-recoverable gaps more frequent. Missing tiles are treated like cloud in the gap-filled product, so earlier values carry forward."
  - "The MODIS snow team has published a Collection 7 User Guide (February 2025). C7 keeps the algorithm but uses HDF-EOS5 and drops the 8-day (A2, C2) and monthly (CM) products and the snow albedo layer. On 2026-10-13 NSIDC still offered only V61."

