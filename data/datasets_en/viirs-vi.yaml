transitions:
  - from: VIIRS Vegetation Indices V1 (VNP13 V001)
    to: VIIRS Vegetation Indices V2 (VNP13, VJ113, VJ213 V002)
    status: completed
    date: "2023-07"
    summary: >-
      Version 2 (Suomi NPP and NOAA-20) was released in July 2023; V1 production stopped on 17 June 2024 and its distribution ended in 2025 (the last V1 products on 2025-07-31).
      A NOAA-21 product (VJ213) was added to V2 in March 2026.
    changes:
      - aspect: Satellites
        before: "Suomi NPP only (VNP13 V001)"
        after: "Suomi NPP (VNP13), NOAA-20 (VJ113, 2018–) and NOAA-21 (VJ213, 2023-02–) — V002"
      - aspect: Input and processing improvements
        before: "V1 inputs"
        after: "Improved calibration and geolocation, corrected aerosol quantity flag, updated cloud mask, new land/water mask, revised VI Quality usefulness bits"
      - aspect: Availability
        before: "Production ended 2024-06-17, distribution ended in 2025 (User Guide and ATBD remain on DOI pages)"
        after: "The only version available"
    impacts:
      - Re-check results made with V1 using V2. V1 files are no longer available from Earthdata Search, the Data Pool or AppEEARS.
      - The definition of the VI Quality usefulness bits changed, so review any quality filters written for V1.
    sources:
      - name: VIIRS Version 2 vegetation indices products released (Earthdata notice, 2023-07-19)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-vegetation-indices-products-released
      - name: Earthdata catalog — VNP13A1 V002 (V2 changes)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
      - name: VIIRS Version 1 data products decommissioned (Earthdata notice, 2025-07-08)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-data-products-decommissioned

notices:
  - date: "2026-08-07"
    level: warning
    title: Suomi NPP data delivery ends in November 2026 — move from VNP13 to VJ213 or VJ113
    body: >-
      On 3 August 2026 NOAA announced it will permanently stop delivering all Suomi NPP science data, including VIIRS, at 13:00 UTC on 2 November 2026; NASA Earthdata's 7 August notice
      gives 13:00 UTC on 1 November (subject to change). The LP DAAC descriptions of the VNP13 products recommend moving to the equivalent VJ213 (primary) or VJ113 (secondary).
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
  - date: "2026-03-17"
    level: info
    title: NOAA-21 VIIRS vegetation indices V2 (VJ213) released
    body: >-
      LP DAAC released additional Version 2 vegetation index products from NOAA-21 (formerly JPSS-2) VIIRS. According to CMR, the 16-day products start on 2023-02-10 and the monthly products on 2023-02-01.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/additional-viirs-version-2-vegetation-indices-data-products-released
  - date: "2025-07-08"
    level: info
    title: Remaining VIIRS Version 1 products, including vegetation indices, decommissioned (2025-07-31)
    body: >-
      LP DAAC announced that distribution of the remaining VIIRS V1 products (thermal anomalies, land cover dynamics, vegetation indices, burned area, BRDF/albedo) would end on 31 July 2025, completing the V1 retirement.
      Surface reflectance, LAI/FPAR and other V1 products had already been withdrawn on 8 April. User Guides and ATBDs remain on the DOI pages.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-data-products-decommissioned
  - date: "2023-07-19"
    level: info
    title: VIIRS Version 2 vegetation indices (VNP13, VJ113) released
    body: >-
      Ten Version 2 vegetation index products from Suomi NPP and NOAA-20 (formerly JPSS-1) were released (500 m and 1 km 16-day, 1 km monthly, 0.05° 16-day and monthly).
      Suomi NPP V1 continued to be produced alongside them for a while.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-vegetation-indices-products-released

