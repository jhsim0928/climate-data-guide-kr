notices:
  - date: "2026-08-31"
    level: warning
    title: "Operational release of AMSR3-based sea-ice products on 1st September 2026 (service message #3571)"
    body: >-
      From 1 September 2026 AMSR3 is the main satellite input for OSI SAF sea-ice products, including the L3 sea-ice drift OSI-405-d. Products stay at the
      same FTP and THREDDS locations as the AMSR2-based ones and NRT files remain on EUMETCast; product ID and file names are unchanged.
      Record that the input sensor differs before and after September 2026.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september
  - date: "2026-08-18"
    level: info
    title: "Planned AMSR2 outage (JAXA G-Portal maintenance) halts sea-ice products for three days (service messages #3564, #3568)"
    body: >-
      A planned outage of AMSR2 data interrupted the AMSR2-based products, OSI-405-d among them, from 18 August 2026; the outage ended at 02:00 UTC on 21 August.
      Production resumed in stages, with OSI-405-d last because it needs input data two days apart.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/resuming-production-osi-saf-sea-ice-products-based-amsr2
  - date: "2026-06-01"
    level: info
    title: Interim Climate Data Record OSI-435 (2021–2025) released as a demonstrational product
    body: >-
      The Global Low Resolution Sea-Ice Drift Interim Climate Data Record (OSI-435), which extends OSI-455, has been on the FTP server (reprocessed_test) and THREDDS
      since 1 June 2026. It uses SSMIS and AMSR2 with ERA5T winds (ECMWF operational forecasts as backup). No DOI or operational schedule has been announced.
    source: https://osi-saf.eumetsat.int/products/osi-435-complementing-osi-455
  - date: "2025-07-17"
    level: warning
    title: "DMSP SSMIS no longer used in OSI-405-d (service message #3321)"
    body: >-
      With the SSMIS data supply ending, the multi-sensor products OSI-402-d, OSI-403-d and OSI-405-d no longer use SSMIS as input, and AMSR2 is the primary data source.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2025-05-19"
    level: warning
    title: "Discontinuation of OSI SAF Medium Resolution Sea Ice Drift on 19 May 2025 (service message #3236)"
    body: >-
      User surveys and helpdesk contacts showed no regular use, so dissemination of the Medium Resolution Sea Ice Drift product (OSI-407-a) on EUMETCast and FTP
      stopped on 19 May 2025 (announced 9 April 2025). OSI SAF recommends the Global Low Resolution Sea Ice Drift product (OSI-405) or the CMEMS high-resolution SAR sea-ice drift product instead.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/discontinuation-osi-saf-medium-resolution-sea-ice-drift-19-may
  - date: "2025-03-04"
    level: info
    title: "New sea ice emissivity and LR sea ice drift products: OSI-405-c → OSI-405-d (service message #3193)"
    body: >-
      Distribution switched from OSI-405-c to OSI-405-d on all channels. The drift product moves from NetCDF3 to NetCDF4, switches ASCAT from Metop-B to Metop-C
      and changes its global attributes; EUMETCast files no longer carry the .gz extension.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/new-sea-ice-emissivity-and-lr-sea-ice-drift-products

