  - name: Copernicus Marine — SEAICE_GLO_SEAICE_L4_NRT_OBSERVATIONS_011_001
    url: https://data.marine.copernicus.eu/product/SEAICE_GLO_SEAICE_L4_NRT_OBSERVATIONS_011_001
    method: Web download / copernicusmarine toolbox
    note: NRT redistribution listed on the OSI-405-d product page. Requires a Copernicus Marine account.

example:
  lang: python
  note: >-
    Opens an OSI-405-d Northern Hemisphere merged file downloaded from FTP or THREDDS. File names follow
    ice_drift_<nh|sh>_polstere-625_multi-oi_<start>-<end>.nc (times as YYYYMMDDhhmm). OSI-455 files follow
    ice_drift_<nh|sh>_ease2-750_cdr-v1p0-<source>_24h-<end YYYYMMDD1200>.nc (the source part is left out for merged files);
    check the exact names in the FTP listing.
  code: |
    import numpy as np
    import xarray as xr

    ds = xr.open_dataset("ice_drift_nh_polstere-625_multi-oi_202401011200-202401031200.nc")
    dX = ds["dX"].squeeze()            # km, 48-hour displacement along grid x
    dY = ds["dY"].squeeze()
    flag = ds["status_flag"].squeeze()

    # Actual elapsed time per vector = (time_bnds[1] + dt1) - (time_bnds[0] + dt0)
    tb = ds["time_bnds"].squeeze().values
    span_s = (tb[1] - tb[0]) / np.timedelta64(1, "s") + ds["dt1"].squeeze() - ds["dt0"].squeeze()

    speed_cm_s = np.hypot(dX, dY) * 1e5 / span_s       # km -> cm; mean speed over the period
    good = flag >= 20                                  # 20-30: valid vectors (30 = nominal quality)
    print(float(speed_cm_s.where(good).mean()), "cm/s")

tips:
  - >-
    `dX` and `dY` are displacements in km over 48 h (OSI-405-d) or 24 h (OSI-455), along the grid x and y axes rather than east and north.
    Before comparing with winds or currents, divide by the elapsed time and recompute the direction from the start (`lat`, `lon`) and end (`lat1`, `lon1`) positions.
  - >-
    OSI-405-d is issued daily but each file spans 48 h, so consecutive files overlap by 24 h. Account for this when building daily series or counting independent samples.
  - >-
    Summer melt makes satellite tracking unreliable. OSI-405-d has summer vectors (NH 1 May–1 Oct, SH 1 Nov–1 Apr) only in the merged files, and most OSI-455 summer values
    (NH Jun–Sep, SH Nov–Feb) come from the ERA5-wind free-drift model. Use status_flag to see where each vector comes from.
  - >-
    OSI-455 combines different inputs over time (SSM/I and SSMIS near 90 GHz, AMSR-E and AMSR2 at 36.5 GHz), and its merged files fill remaining gaps by spatial
    interpolation and wind vectors. Its grid (75 km EASE2) and period (24 h) also differ from OSI-405-d (62.5 km polar stereographic, 48 h), so do not splice the two into one series.
  - >-
    For a CDR-consistent record after 2020, the demonstrational ICDR OSI-435 (2021–2025) is currently the only option. It has no DOI yet and lives in the reprocessed_test folder,
    so record the product ID and download date in publications and check later whether it becomes operational.

