# ─────────────────────────────────────────────────────────────
# OSI SAF (sea ice drift) — dataset information file
# NRT Global Low Resolution Sea-Ice Drift OSI-405-d (62.5 km, 48-hour displacement)
# + climate data record OSI-455 (75 km, 24-hour displacement) + demonstrational ICDR OSI-435
# ─────────────────────────────────────────────────────────────
id: osisaf-drift
name: "OSI SAF (sea ice drift)"
full_name: EUMETSAT OSI SAF Global Low Resolution Sea-Ice Drift (OSI-405-d) / Global Low Resolution Sea-Ice Drift data record (OSI-455) and Interim Climate Data Record (OSI-435)
category: satellite
domain: seaice
group: 해빙 이동
order: 20
domains: [해빙]
provider: EUMETSAT Ocean and Sea Ice Satellite Application Facility (OSI SAF) / Norwegian Meteorological Institute (MET Norway)

status: active
status_note: >-
  The near-real-time product OSI-405-d is operational. SSMIS was dropped as an input in July 2025, leaving AMSR2 as the primary source,
  and AMSR3 became the main input on 1 September 2026; the product ID and file names did not change.
  The climate data record OSI-455 is a fixed record for 1991–2020. Its continuation, the Interim CDR OSI-435 (2021–2025), has been on the FTP server
  as a demonstrational product since June 2026. Dissemination of the Medium Resolution Sea Ice Drift product (OSI-407-a) stopped on 19 May 2025.

transitions:
  - from: OSI-405-c
    to: OSI-405-d
    status: completed
    date: "2025-03"
    summary: >-
      On 4 March 2025 all distribution channels switched from OSI-405-c to OSI-405-d. The method, grid and 48-hour displacement are unchanged;
      the update moved files to NetCDF4, switched ASCAT from Metop-B to Metop-C and changed the global attributes. Removal of SSMIS input (17 July 2025)
      and the move to AMSR3 (1 September 2026) followed under the same product ID.
    changes:
      - aspect: File format
        before: "NetCDF3 (EUMETCast files distributed as .nc.gz)"
        after: "NetCDF4 (no .gz extension on EUMETCast files); global attributes changed"
      - aspect: ASCAT input
        before: "Metop-B"
        after: "Metop-C"
      - aspect: Passive microwave input
        before: "DMSP SSMIS F18 (91 GHz) + GCOM-W1 AMSR2 (37 and 18.7 GHz)"
        after: "No SSMIS from 2025-07-17 (AMSR2 is the primary source); GOSAT-GW AMSR3 is the main input from 2026-09-01"
      - aspect: Grid, displacement period, product ID
        before: "62.5 km polar stereographic, 48-hour displacement"
        after: "Unchanged. The AMSR3 switch kept the product ID (OSI-405-d) and the merged-file names"
      - aspect: DOI
        before: "10.15770/EUM_SAF_OSI_NRT_2007"
        after: "Unchanged (the recommended citation now names OSI-405-d)"
    impacts:
      - "If you build a record that spans OSI-405-c and OSI-405-d, note the input changes in July 2025 and September 2026; everything from September 2026 onward is AMSR3-based."
      - "EUMETCast ingest scripts that expect NetCDF3 or gunzip a .nc.gz file need updating."
      - "Users of the single-sensor files should check the FTP listing directly: the PUM (v1.9, December 2024) predates the SSMIS removal (2025-07-17) and the AMSR3 switch (2026-09-01), so the current per-sensor file set and names are not documented there."
    sources:
      - name: "OSI SAF service message #3193 (2025-03-03): New sea ice emissivity and LR sea ice drift products"
        url: https://osi-saf.eumetsat.int/community/list-of-service-messages/new-sea-ice-emissivity-and-lr-sea-ice-drift-products
      - name: OSI-405-d product page
        url: https://osi-saf.eumetsat.int/products/osi-405-d
      - name: OSI SAF — Implications of the end of SSMIS data on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
      - name: "OSI SAF service message #3571 (2026-08-31): Operational release of AMSR3-based sea-ice products on 1st September 2026"
        url: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september

period:
  start: "1991-01"
  end: present
  note: >-
    OSI-455 covers 1991-01-01 to 2020-12-31 (both hemispheres, year-round). The demonstrational ICDR OSI-435 starts on 2021-01-01 and covers 2021–2025
    (the product page gives no exact last date). The NRT OSI-405 series runs from 2009 and is updated daily as of 2026-10-12
    (the FTP prod folder holds the last 31 days; the archive folder holds the full record).
    We could not open the THREDDS or FTP listings, so the date of the latest file was not checked.

resolution:
  spatial_short: "62.5 km (0.56°)"
  temporal_short: "1일"
  spatial: >-
    NRT OSI-405-d — 62.5 km polar stereographic grids: NH 119 × 177 (true at 70°N, central meridian 45°W), SH 125 × 131 (true at 70°S, central meridian 0°).
    CDR OSI-455 — EASE2 75 km grid (Lambert Azimuthal Equal Area on WGS84), 144 × 144 in each hemisphere; motion is tracked on 12.5 km imagery
    with overlapping sub-images. ICDR OSI-435 — 75 km grid
  vertical: Not applicable (sea-ice surface motion)
  temporal: >-
    One file per day. OSI-405-d gives the 48-hour displacement from 12:00 UTC to 12:00 UTC two days later; OSI-455 and OSI-435 give the displacement
    from (D-1) 12:00 to D 12:00 UTC. The actual start and end times vary from vector to vector, so durations are not exactly 48 h or 24 h

update: >-
  OSI-405-d is updated daily: the calculation runs at about 04:00 UTC on day D using day D-3 to D-1 data, and products are distributed around 05:00 UTC
  (timeliness better than 5 h from the last swath per the PUM; 6 h on the product page).
  OSI-455 is a closed record ("No updates expected" on the C3S CDS). No regular update schedule has been announced for OSI-435
license: CC BY 4.0 (attribution to "EUMETSAT OSI SAF" required; quote the product DOI)
account_required: false

summary: >-
  Gridded sea-ice drift vector fields for both hemispheres, retrieved by EUMETSAT OSI SAF from passive microwave (AMSR2 and AMSR3; formerly SSM/I,
  SSMIS and AMSR-E) and ASCAT scatterometer imagery with the Continuous Maximum Cross-Correlation (CMCC) method. The NRT product OSI-405-d delivers
  48-hour displacements on a 62.5 km polar stereographic grid every day. The climate data record OSI-455 gives year-round 24-hour displacements
  on the 75 km EASE2 grid for 1991–2020, with summer seasons gap-filled by a free-drift model forced with ERA5 10 m winds.
  Every vector carries an uncertainty (1 standard deviation) and a status flag.

time_convention:
  summary: >-
    The fields are displacements (km) over a fixed period, not velocities. OSI-405-d gives the ice displacement from 12:00 UTC on the start day to
    12:00 UTC two days later (48 h); OSI-455 gives the displacement from 12:00 UTC on the previous day to 12:00 UTC on the file date (24 h).
    Each value is the velocity integrated over that period. To get a mean speed, divide by the actual elapsed time of each vector.
  points:
    - "OSI-405-d file names end in …_<startdate12>-<enddate12>.nc (YYYYMMDDhhmm). These are the nominal 12:00 UTC start and end of the 48-hour period, also stored in `time_bnds`. Example: the 16 Feb 12:00 → 18 Feb 12:00 field is distributed around 05:00 UTC on 19 Feb."
    - "Per-vector start and end times differ from the nominal ones: OSI-405-d stores them as `dt0` and `dt1` (seconds relative to time_bnds[0] and time_bnds[1]), OSI-455 as `t0` and `t1`. The elapsed time is therefore not exactly 48 h or 24 h."
    - "The date in an OSI-455 file name (<date12>, YYYYMMDD1200) is the end of the 24-hour period. Reading it as the start date shifts your series by one day."
    - "`lat1` and `lon1` are the ice position at the end of the displacement; `lat` and `lon` are the grid-point (start) positions."
    - "OSI-405-d single-sensor files contain no valid vectors in the summer period (NH 1 May–1 Oct, SH 1 Nov–1 Apr; status_flag 4); only the merged multi-oi analysis has (less accurate) summer vectors. OSI-455 uses free-drift wind vectors in summer (NH Jun–Sep, SH Nov–Feb) and uncertainty-weighted blends of satellite and wind vectors in spring and autumn."
  source: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-drift-lr_v1p9.pdf
  source_name: OSI-405-d Product User Manual (v1.9) / OSI-455 PUM (v1.0) / OSI-455 product page

variables:
  note: >-
    Variables in the merged files (multi-oi for OSI-405-d, merged for OSI-455) as listed in the OSI-405-d PUM v1.9 and the OSI-455 PUM v1.0.
    Variable names are mostly the same in both products; only the per-vector time offsets differ (`dt0`/`dt1` in OSI-405-d, `t0`/`t1` in OSI-455).
    The fill value for floating-point variables is -1e10.
  full_list: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-drift-lr_v1p9.pdf
  groups:
    - name: Ice displacement
      kind: accum
      period: 48 hours
      items:
        - text: "Component of the displacement along the x axis of the grid — `dX` (km; sea_ice_x_displacement)"
          note: Displacement accumulated over 48 h (OSI-405-d) or 24 h (OSI-455 and OSI-435). Along the grid x axis, not eastward
        - text: "Component of the displacement along the y axis of the grid — `dY` (km; sea_ice_y_displacement)"
          note: Same period as dX. Along the grid y axis
        - text: "Uncertainty (1 standard deviation) of dX and dY components of the drift vector — `uncert_dX_and_dY` (km)"
          note: Uncertainty of the displacement over the same period. Divide by the same elapsed time when converting to speed
    - name: Position and time
      kind: instant
      items:
        - text: "Latitude and longitude at end of displacement — `lat1`, `lon1` (degrees)"
          period: end of displacement period
          note: Ice position at the end of the displacement period
        - text: "Delta time for start and end of displacement — `dt0`, `dt1` (s, OSI-405-d) / `t0`, `t1` (OSI-455)"
          note: Actual start and end time relative to the nominal time_bnds; use them to compute the elapsed time
        - text: "Latitude and longitude coordinate (start position) — `lat`, `lon` (degrees); projection coordinates — `xc`, `yc` (km)"
          kind: static
    - name: Quality information
      kind: accum
      period: 48 hours
      items:
        - text: "Rejection and quality level flag (0–19 rejection, 20–30 quality index, 30 nominal) — `status_flag` (code)"
          note: Flag attached to the displacement vector for that period (not a time statistic). E.g. 4 summer period, 22 interpolated (multi-oi only); in OSI-455, 23–25 mark wind-derived or blended vectors

