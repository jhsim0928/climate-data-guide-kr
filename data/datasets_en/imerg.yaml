transitions:
  - from: IMERG V06 (V06B)
    to: IMERG V07 (V07B)
    status: completed
    date: "2023-07"
    summary: >-
      The input microwave algorithm (GPROF2021) and the calibration scheme changed throughout, precipitation over snow- and ice-covered surfaces and the polar regions was filled in for the first time, and the record was extended back to January 1998.
      Key variable names also changed (`precipitationCal` → `precipitation`), so code written for V06 needs updating.
    changes:
      - aspect: Transition dates
        before: "Last V06 Final month 2021-09 / V06 Early and Late production ceased 2024-06-03"
        after: "V07 Final reprocessed 2023-07-01 to 08-30 (V07A); after fixing defective GPROF estimates in 162 orbits, V07B completed 2024-01-08 / V07 Early and Late from data of 2024-06-01"
      - aspect: Period
        before: "2000-06 onward (Final)"
        after: "1998-01 onward (V07B extended on 2024-11-07; before 2000-06 uses GridSat-B1 IR)"
      - aspect: High latitudes and frozen surfaces
        before: "Microwave estimates over snow- and ice-covered surfaces screened out, leaving many gaps"
        after: "Included — nearly global apart from some cells near the poles, with reduced Quality Index values there"
      - aspect: Variable names and locations
        before: "`precipitationCal`, `precipitationUncal`, `HQprecipitation`, `HQprecipSource`, `HQobservationTime`, `IRkalmanFilterWeight` (Grid group)"
        after: "`precipitation` (Grid); `precipitationUncal`, `MWprecipitation`, `MWprecipSource`, `MWobservationTime`, `IRinfluence` under `Grid/Intermediate/`. Monthly file variable names unchanged"
      - aspect: Daily computation
        before: "Simple sum of half-hourly values (dry bias when values are missing)"
        after: "Mean of valid half-hourly rates × 24 (mm/day), with sample count `precipitation_cnt`"
      - aspect: Gauge adjustment
        before: "Legates-Willmott undercatch correction, GPCP adjustment of CORRA also applied over land / no gauge calibration in Early and Late"
        after: "Fuchs adjustment added over Eurasia north of 45°N; GPCP adjustment to CORRA no longer applied over land / Early and Late get a climatological calibration based on the Final Run"
      - aspect: Precipitation phase (probability of liquid)
        before: "V06 method"
        after: "Uses ERA5 (Final) and JMA (Early and Late) thermodynamic variables with a wet-bulb correction; liquid probability higher on average. Rate cap raised to 200 mm/hr"
    impacts:
      - Do not splice V06 and V07 into one time series; download the whole period again as V07 (V06 is no longer distributed).
      - Scripts with '06' in paths or `precipitationCal` in variable names must change to '07' and `precipitation`.
      - High-latitude and winter results come from areas that are newly filled in V07, so check the Quality Index alongside them.
    sources:
      - name: IMERG V07 Release Notes (2024-11-26)
        url: https://gpm.nasa.gov/sites/default/files/2024-12/IMERG_V07_ReleaseNotes_241126.pdf
      - name: Status of IMERG Version 06 and 07 Data (GPM, 2024-06-21)
        url: https://gpm.nasa.gov/mission/news/status-imerg-version-06-and-07-data
      - name: GES DISC GPM_3IMERGDF V07 collection description
        url: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGDF_07/summary
  - from: IMERG V07 (Final V07B, Early and Late V07C)
    to: IMERG V08
    status: planned
    date: "2026"
    summary: >-
      With the parent products (GPROF, CORRA) moving to V08, V07 Final stopped at September 2025. V08 Final, reprocessed from 1998, is expected in fall 2026, and V08 Early and Late
      after that (no sooner than winter 2026). When checked on 2026-10-12, no V08 IMERG collection was yet registered in NASA CMR.
    changes:
      - aspect: Final Run
        before: "V07B, stopped at 1998-01 to 2025-09-30"
        after: "V08 Final, reprocessed from 1998-01 and then updated with the usual ~4-month latency (April 2026 notice: 'summer of 2026' → August notice: 'more likely … fall of 2026')"
      - aspect: Early and Late Runs
        before: "V07B (V07 algorithm + V07 inputs)"
        after: "From 2026-03-04, hybrid V07C (V07 algorithm + GPROF V08 input; CORRA calibration set to seasonal climatological values from 2026-03-01) → switch to V08 no sooner than winter 2026, with a retrospective V08 Early and Late record from 1998 provided before the switch"
      - aspect: Inputs (parent products)
        before: "GPROF and CORRA V07"
        after: "GPROF and CORRA V08 (reprocessing of all TRMM/GPM products to V08 started 2026-03-09)"
    impacts:
      - If you need research-grade (Final) data after September 2025, wait for V08 Final, or use the Late Run (V07C) as a stopgap and state that it is a different run.
      - When V08 Final is released, all values from 1998 will change, so do not mix it with climatologies or trends built from V07.
    sources:
      - name: Update to the IMERG V08 Transition Schedule (GPM, 2026-08-06)
        url: https://gpm.nasa.gov/data/news/update-imerg-v08-transition-schedule-aug-2026
      - name: IMERG V08 Transition Schedule (GPM, 2026-04-28)
        url: https://gpm.nasa.gov/data/news/imerg-v08-transition-schedule
      - name: GPM Version 08 Reprocessing (Earthdata alert)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/gpm-version-08-reprocessing

notices:
  - date: "2026-09-30"
    level: warning
    title: "Access to GES DISC legacy data servers (gpm1 and others) to end — move to Earthdata Cloud"
    body: >-
      The notice on gpm1.gesdisc.eosdis.nasa.gov states that "access to this server (and all other GES DISC data servers) will end no earlier than September 30th 2026"
      and that users will need to transition to Earthdata Cloud (anonymous FTP access is already gone). When checked on 2026-10-12 the server still responded.
      Point your scripts to data.gesdisc.earthdata.nasa.gov (HTTPS) or use earthaccess.
    source: https://gpm1.gesdisc.eosdis.nasa.gov/data/GPM_L3/
  - date: "2026-08-06"
    level: warning
    title: "Update to the IMERG V08 Transition Schedule — Final likely fall 2026, Early and Late no sooner than winter 2026"
    body: >-
      The team is still waiting for a finalized V08 version of one parent product and so cannot begin reprocessing the record from 1998; it now says V08 Final "seems more likely" to be released in fall 2026.
      Early and Late will switch after the V08 Final release and the retrospective record, and remain in "hybrid" (V07C) mode until then.
    source: https://gpm.nasa.gov/data/news/update-imerg-v08-transition-schedule-aug-2026
  - date: "2026-04-28"
    level: critical
    title: "IMERG V08 Transition Schedule — the V07 Final record ends in September 2025"
    body: >-
      Because the parent products CORRA and GPROF are being upgraded to V08 and running the V07 code beyond September 2025 could create discontinuities, "the V07 record ends in September 2025."
      Research-grade Final data have a gap from October 2025 until V08 Final (reprocessed from 1998) is released.
    source: https://gpm.nasa.gov/data/news/imerg-v08-transition-schedule
  - date: "2026-03-04"
    level: info
    title: "GPM Version 08 Reprocessing — IMERG Early and Late switch to GPROF V08 input (V07B → V07C)"
    body: >-
      As part of the V08 reprocessing of all GPM products, "as of March 4, IMERG Early and Late have been produced using GPROF v08 as input", keeping the V07 algorithm;
      the file-name minor version changed to V07C to mark this.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/gpm-version-08-reprocessing
  - date: "2026-01-15"
    level: info
    title: "GrADS Data Server (GDS) Service Will Be Discontinued No Earlier Than March 27, 2026 — includes IMERG"
    body: >-
      GES DISC announced that the GDS service, including IMERG (Early, Late and Final half-hourly, daily and monthly, and the land/sea mask), will be discontinued no earlier than 27 March 2026.
      The same data are available in the Earthdata Cloud through HTTPS and subsetting services.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-discontinued-earlier-than-march-27-2026
  - date: "2024-11-07"
    level: info
    title: V07B Final record extended back to January 1998 (TRMM era included)
    body: >-
      The start of V07B was moved from June 2000 back to January 1998, using GridSat-B1 IR data before June 2000.
      V07 supersedes all prior IMERG versions as well as the TRMM-based TMPA products (3B42, 3B43).
    source: https://gpm.nasa.gov/resources/documents/imerg-v07-release-notes

