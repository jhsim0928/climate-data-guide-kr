# ─────────────────────────────────────────────────────────────
# GPM IMERG — dataset information file (English edition)
# Atmosphere tab (precipitation). V07 Final stops at 2025-09 and is waiting for the V08 transition.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: imerg
name: GPM IMERG V07
full_name: Integrated Multi-satellitE Retrievals for GPM (IMERG) Version 07
category: satellite
domain: atmosphere
group: 강수 자료
order: 20
domains: [대기, 육지, 해양]
provider: NASA GSFC Precipitation Processing System (PPS) and GPM Science Team (distributed by NASA GES DISC and PPS)

status: delayed
status_note: >-
  The research-grade Final Run (V07) ends with data for 30 September 2025: its parent products (GPROF, CORRA) are moving to V08, and continuing with the V07 code would create discontinuities.
  In its August 2026 update NASA said it "seems more likely that IMERG V08 Final Run will be released in the fall of 2026", reprocessed from 1998.
  The near-real-time Early and Late Runs continue daily in a "hybrid" mode — the V07 algorithm ingesting GPROF V08 (file version V07C) — and ran through 11 October 2026 when checked on 2026-10-12.

period:
  start: "1998-01"
  end: present
  note: >-
    V07B Final (GPM_3IMERGHH, DF, M) covers 1998-01-01 to 2025-09-30 (on 7 November 2024 the start was extended from June 2000 back to January 1998, using GridSat-B1 IR data before June 2000).
    Early and Late (GPM_3IMERGHHE, HHL, DE, DL) also run from 1998-01-01 to the present; when checked on 2026-10-12 the latest GES DISC file was for 2026-10-11.
    There are no Final data from October 2025 onward until V08 Final is released.

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "30분"
  spatial: >-
    0.1° × 0.1° global latitude–longitude grid (GES DISC extent 90°S–90°N, 180°W–180°E). From V07, estimates extend to the polar regions (except some grid cells near the poles),
    but IR-based estimates exist only within 60°N–60°S, the extent of the CPC merged IR data; outside that band only passive microwave estimates are used (plus gauges in the Final monthly product).
  vertical: Surface precipitation (single level)
  temporal: >-
    Half-hourly (the base product) / daily (00–24 UTC, computed from the half-hourly values) / monthly. PPS also provides 3-hour and 7-day accumulation files.

update: "Early with ~4 h latency and Late with ~14 h latency (recently closer to 12 h), produced continuously every half hour / Final monthly, about 3.5–4 months after the observation month (V07 Final stopped at 2025-09, awaiting V08)"
license: NASA Earth science open data — free of charge. GES DISC requires a free NASA Earthdata Login and the PPS servers require free PPS registration. Users are asked to cite the dataset DOI
account_required: true

summary: >-
  IMERG is NASA's multi-satellite precipitation product, combining information from the GPM satellite constellation: passive microwave (PMW) precipitation estimates are intercalibrated to the GPM Core Observatory
  combined radar–radiometer product (CORRA), and gaps are filled by morphing the microwave estimates along the motion of rain systems and by geostationary IR estimates in a Kalman filter, giving global half-hourly 0.1° precipitation.
  It comes as near-real-time Early (~4 hours after observation) and Late (~14 hours) Runs, and a research-grade Final Run calibrated to monthly gauge analyses and released about 4 months later.
  V07 reprocesses the whole record from 1998, including the TRMM era, and supersedes all prior IMERG versions as well as the TRMM-based TMPA products (3B42, 3B43).

time_convention:
  summary: >-
    Half-hourly `precipitation` is a rate in mm/hr. IMERG principal investigator George Huffman explains that "the IMERG value is provided from a single snapshot sometime during the half-hour period"
    and is taken as representative of the entire half hour, so the half-hour amount (mm) is rate × 0.5. File times mark the start of the interval, and file names carry the start and end times
    (e.g. S013000-E015959 = 01:30–01:59:59 UTC). Daily data are the mean rate over the 00–24 UTC day × 24 (mm/day), and monthly data are the mean rate for the month (mm/hr).
  points:
    - "Summing half-hourly values as they are doubles the precipitation amount. For hourly totals, sum (value × 0.5), or multiply the mean rate (mm/hr) by the number of hours."
    - "From V07, daily data (GPM_3IMERGDF, DE, DL) are computed by first taking the mean precipitation rate of the valid half-hourly values for the data day and then multiplying by 24, which minimizes the dry bias of the simple daily totals used before V07. The number of valid samples is in `precipitation_cnt`."
    - "The daily data day is 00–24 UTC (file name S000000-E235959), i.e. 09:00 to 09:00 the next day in Korea Standard Time. If you need daily totals for a local-time day, sum the half-hourly data yourself."
    - "Monthly `precipitation` is also in mm/hr, so the monthly amount (mm) is value × the number of hours in the month (e.g. 31 days × 24)."
    - "Final half-hourly values are adjusted to agree with the month's satellite–gauge total, while Early and Late receive only a monthly climatological calibration derived from the Final Run. The three runs give different values for the same time."
    - "`time` and `time_bnds` are in 'seconds since 1980-01-06 00:00:00 UTC' in the half-hourly and monthly files and 'days since 1980-01-06 00:00:00Z' in the daily files (the GPS epoch)."
  source: https://forum.earthdata.nasa.gov/viewtopic.php?p=23098
  source_name: "Answer by the IMERG principal investigator on the Earthdata Forum (2025) + GES DISC GPM_3IMERGDF, HH and M V07 collection descriptions (CMR)"

variables:
  note: >-
    Main variables from the GES DISC V07 collection metadata. In the half-hourly and monthly files (HDF5) they sit in the `Grid` group (auxiliary variables in `Grid/Intermediate`);
    in the daily files (netCDF4) they are at the top level. Arrays are ordered (time, lon, lat), so swap axes before plotting maps. `precipitation` is the recommended variable for most users.
  full_list: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGHH_07/summary
  groups:
    - name: Half-hourly (GPM_3IMERGHH Final / HHE Early / HHL Late)
      kind: instant
      period: "snapshot representing the half hour"
      items:
        - text: "Calibrated multi-satellite precipitation rate — `precipitation` (mm/hr)"
          note: "`precipitationCal` in V06. A rate in which a single snapshot during the half hour represents the whole half hour, so the half-hour amount is × 0.5"
        - "Random error of the precipitation estimate — `randomError` (mm/hr)"
        - "Probability of liquid precipitation phase — `probabilityLiquidPrecipitation` (%)"
        - "Quality index — `precipitationQualityIndex` (dimensionless)"
        - text: "Uncalibrated multi-satellite precipitation — `Grid/Intermediate/precipitationUncal` (mm/hr)"
          note: Moved to the Intermediate group in V07
        - text: "Merged passive microwave precipitation — `Grid/Intermediate/MWprecipitation` (mm/hr)"
          note: "`HQprecipitation` in V06. Has values only in grid cells with a microwave observation"
        - "IR precipitation — `Grid/Intermediate/IRprecipitation` (mm/hr)"
        - "Microwave observation time — `Grid/Intermediate/MWobservationTime` (minutes), sensor code — `MWprecipSource`, IR influence — `IRinfluence`"
    - name: Daily (GPM_3IMERGDF Final / DE Early / DL Late)
      kind: mean
      period: Daily (00–24 UTC)
      items:
        - text: "Daily precipitation — `precipitation` (mm/day)"
          note: Mean of the valid half-hourly rates × 24
        - "Daily microwave precipitation — `MWprecipitation` (mm/day)"
        - "Random error — `randomError` (mm/day)"
        - "Probability of liquid precipitation — `probabilityLiquidPrecipitation` (%)"
        - text: "Number of valid half-hourly samples — `precipitation_cnt`, `MWprecipitation_cnt` (count)"
          kind: accum
          note: Up to 48 per day. Use it to reconstruct simple totals or to judge reliability
    - name: Monthly (GPM_3IMERGM, Final only)
      kind: mean
      period: Monthly
      items:
        - text: "Merged satellite–gauge precipitation rate — `precipitation` (mm/hr)"
          note: Monthly amount (mm) = value × hours in the month
        - "Random error — `randomError` (mm/hr)"
        - "Gauge relative weighting — `gaugeRelativeWeighting` (%)"
        - "Probability of liquid precipitation — `probabilityLiquidPrecipitation` (%)"
        - "Quality index — `precipitationQualityIndex`"
    - name: Static fields
      kind: static
      items:
        - "IMERG land/sea mask at 0.1° — GES DISC `GPM_IMERG_LandSeaMask` V2"

access:
  - name: NASA GES DISC (Earthdata Cloud, HTTPS)
    url: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGHH_07/summary
    method: HTTPS download / earthaccess / Earthdata Search / subsetting
    note: >-
      Final is GPM_3IMERGHH (half-hourly), GPM_3IMERGDF (daily) and GPM_3IMERGM (monthly); Early is GPM_3IMERGHHE and GPM_3IMERGDE; Late is GPM_3IMERGHHL and GPM_3IMERGDL.
      Files are at https://data.gesdisc.earthdata.nasa.gov/data/GPM_L3/GPM_3IMERGDF.07/YYYY/MM/ and require a free Earthdata Login.
      The legacy server (gpm1.gesdisc.eosdis.nasa.gov) may close any time after 30 September 2026, so update the URLs in your scripts.
  - name: Earthdata Cloud OPeNDAP
    url: https://opendap.earthdata.nasa.gov/
    method: OPeNDAP (Hyrax) — variable and spatial subsetting
    note: Per-file OPeNDAP URLs are listed in CMR and Earthdata Search results. The GES DISC GrADS Data Server (GDS) is being discontinued from March 2026.
  - name: Direct access in AWS us-west-2 (S3)
    url: https://data.gesdisc.earthdata.nasa.gov/s3credentials
    method: Cloud storage (S3, from within us-west-2 only)
    note: Stored under paths such as s3://gesdisc-cumulus-prod-protected/GPM_L3/GPM_3IMERGHH.07/; temporary credentials are required.
  - name: NASA PPS (GPM data directory)
    url: https://gpm.nasa.gov/data/directory
    method: HTTPS / FTP (PPS registration required)
    note: The fastest place to get new data. Early and Late GeoTIFF (GIS) files and the 3-hour and 7-day files are also here.
  - name: NASA Giovanni
    url: https://giovanni.gsfc.nasa.gov/
    method: Web maps and time-series analysis
    note: Handy for checking magnitudes with area-mean time series or maps before downloading.

example:
  lang: python
  note: >-
    Downloads Final daily data for the Korean Peninsula for July 2023 with earthaccess and opens them with xarray. You will be asked for your Earthdata username and password on the first run.
    Daily files are ordered (time, lon, lat), so transpose before plotting maps.
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="GPM_3IMERGDF", version="07",
        temporal=("2023-07-01", "2023-07-31"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "imerg_daily")

    ds = xr.open_mfdataset(files, combine="by_coords")
    pr = ds["precipitation"].sel(lon=slice(124, 132), lat=slice(33, 39))   # mm/day, 00–24 UTC
    pr = pr.transpose("time", "lat", "lon")
    print(pr.mean("time"))

    # Half-hourly files (HDF5) need the group: xr.open_dataset(f, group="Grid")
    # Half-hour amount (mm) = precipitation (mm/hr) * 0.5

tips:
  - "Half-hourly `precipitation` is a rate in mm/hr. Adding 48 half-hourly files as they are gives twice the daily total. Convert half-hourly values with × 0.5 and monthly values (mm/hr) with × the hours in the month."
  - "Early, Late and Final differ in algorithm (forward-only vs forward-and-backward morphing) and calibration (climatological vs monthly gauge), so treat them as different datasets. Use Final for long-term work, and if you append recent months from the Late Run, say so in your paper."
  - "There are no Final data after September 2025. When V08 Final arrives, the whole record from 1998 will change, so do not mix V07 and V08 — download the full period again."
  - "V07C in Early and Late file names (from 2026-03-04) is the hybrid run: V07 algorithm with GPROF V08 input. Its inputs differ from the earlier V07B period, so small discontinuities are possible."
  - "V07 is the first version to include microwave estimates over snow- and ice-covered surfaces, but these polar estimates have lower confidence, and NASA notes that snowfall amounts are deficient. Uncertainty is also large over mountainous terrain."
  - "Data before June 2000 (1998-01 to 2000-05) are built from GridSat-B1 IR data; the release notes warn of lower quality and inconsistencies and recommend avoiding this period unless necessary. Also read the caveats document for the TRMM era (before 2014)."
  - "The daily data day is 00–24 UTC. Align day boundaries when comparing with station observations reported for local-time days."
  - "Half-hourly and monthly files are HDF5; daily files are netCDF4. Arrays are stored as (lon, lat), so plotting them directly rotates the map by 90°."

