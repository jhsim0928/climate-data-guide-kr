notices:
  - date: "2011-08"
    level: info
    title: CFSRR Known Issues technical document released
    body: >-
      NCEI provides the August 2011 document listing known issues in the CFSR and reforecast files: the f00 time-series records
      are not the analysis, a precision problem in some monthly means, tmpsfc in the ipv files should not be used, and mislabelled
      isotherm levels in the ocean files, among others.
    source: https://www.ncei.noaa.gov/sites/default/files/2023-10/CFSRR-Known-Issues-Technical-Document-August-2011%20%282%29.pdf
  - date: "2011-04-18"
    level: info
    title: "Amended: Climate Forecast System (CFS) changes effective March 30, 2011 (TIN 10-55)"
    body: >-
      NWS confirmed that CFSv2 became operational beginning with the 1200 UTC cycle on 30 March 2011 and that the original CFS
      will continue to run through June 2012. The analysis moves to T574 (27 km) with 64 hybrid sigma-pressure levels, the
      atmospheric forecast model to T126 (100 km), and the ocean to the global MOM4.
    source: https://www.weather.gov/media/notification/tins/tin10-55cfs_aad.pdf
  - date: "2010-02-18"
    level: warning
    title: GRIB2 metadata issue in CFSR time-series files corrected
    body: >-
      A format conversion issue affected the metadata in non-instantaneous CFSR time-series files (28 of the 73 file types), so
      averaging and accumulation intervals were recorded as instantaneous. Corrected files were in place by 22 UTC on 18 February 2010;
      download again any files obtained earlier (the data values themselves are valid).
    source: https://www.ncei.noaa.gov/products/weather-climate-models/climate-forecast-system

