# ─────────────────────────────────────────────────────────────
# VIIRS BRDF/Albedo (VNP43, VJ143) C2 — dataset information file (English edition)
# Land tab (land surface temperature & albedo). Successor to MODIS MCD43 (modis-albedo.yaml); the MODIS → VIIRS transition is described in modis-albedo.yaml.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: viirs-albedo
name: "VIIRS BRDF/Albedo (VNP43)"
full_name: VIIRS BRDF/Albedo Collection 2 (VNP43 Suomi NPP, VJ143 NOAA-20, VJ243 NOAA-21) — the VIIRS continuation of MODIS MCD43, produced daily from a 16-day window
category: satellite
domain: land
group: 지표면온도·알베도
order: 21
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA VIIRS Land Science Team (Schaaf lab, UMass Boston) / NASA LP DAAC

status: active
status_note: >-
  Collection 2 (V002) is the current version and is updated daily (on 2026-10-13 the latest VJ143MA3 file was dated 4 October 2026 and VNP43MA3 1 October 2026).
  However, NOAA will stop delivering Suomi NPP data (VNP43) at 15:40 UTC on 2 November 2026, so from then on users need the NOAA-21 (VJ243, primary) or NOAA-20 (VJ143, secondary) products.
  Collection 1 (V001) stopped production in early 2025 and has been superseded.

period:
  start: "2012-01"
  end: present
  note: >-
    In CMR, VNP43 (Suomi NPP) starts 2012-01-17, VJ143 (NOAA-20) 2018-01-01 and VJ243 (NOAA-21) 2023-02-10 (the CMG products start two to four days later).
    No new VNP43 data are expected after 2 November 2026, and some gaps from the Suomi NPP anomaly of 10–21 July 2026 may not have been recovered.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1일"
  spatial: >-
    MODIS/VIIRS Sinusoidal tile grid — 500 m (IA products, imagery bands I1–I3) and 1 km (MA products, moderate bands M1–M5, M7, M8, M10, M11 and broadbands) /
    0.05° Climate Modeling Grid (CMG, C1–C4) / 30 arc-second CMG (D products) / separate 1 km Day/Night Band (DNB) products
  vertical: Land surface (single level)
  temporal: Produced daily (each retrieval uses 16 days of VIIRS observations weighted to the 9th day; the file-name date is that 9th day)

coverage:
  short: 전지구
update: Daily (the 16-day window must fill, so files appear roughly one to two weeks after their nominal date)
license: NASA Earth science open data — free and unrestricted under the EOSDIS Data Use and Citation Guidance. Downloads require a free NASA Earthdata Login
account_required: true

summary: >-
  NASA's standard VIIRS BRDF/albedo suite applies the same kernel-driven BRDF model (RossThick/LiSparse-Reciprocal) and 16-day, 9th-day-weighted approach as MODIS MCD43
  to VIIRS observations so that the MODIS BRDF/albedo record can continue. It provides black-sky and white-sky albedo (A3), nadir BRDF-adjusted reflectance (A4),
  BRDF model parameters (A1) and quality (A2) at 500 m (I bands), 1 km (M bands), 0.05° and 30 arc-second, as separate products per satellite: VNP43 (Suomi NPP), VJ143 (NOAA-20) and VJ243 (NOAA-21).
  Collection 2 is a reprocessing with improved calibration over the whole Suomi NPP mission, better geolocation, and improved cloud and land/water masks.

time_convention:
  summary: >-
    As with MODIS MCD43, each value comes from a BRDF model fitted to 16 days of observations, weighted towards the 9th day of the window (the date in the file name).
    Black-sky albedo and NBAR refer to the solar zenith angle at local solar noon on that date; white-sky albedo is the fully diffuse case and does not depend on sun position.
  points:
    - "The AYYYYDDD date in the file name is the 9th day of the 16-day input window, not a single day's observation."
    - "Unlike MODIS MCD43, which pools Terra (morning) and Aqua (afternoon), each VIIRS product uses one satellite in an afternoon orbit. VNP43, VJ143 and VJ243 are separate retrievals from different satellites."
    - "Pixels with enough observations get a full inversion; otherwise a magnitude inversion is used. The quality flag (0/1) tells them apart."
    - "Actual (blue-sky) albedo is not provided; compute it by interpolating between black-sky and white-sky albedo using the diffuse skylight fraction."
  source: https://www.umb.edu/spectralmass/viirs-user-guides-c1-and-c2/vnp43ia3-and-vnp43ma3-albedo-products/
  source_name: "VIIRS BRDF/Albedo User Guide (UMass Boston) + LP DAAC VNP43MA3 and VJ143MA3 V002 collection descriptions (CMR)"

variables:
  note: >-
    Variable names come from the LAADS file specifications for VNP43IA3, VNP43MA3, VNP43C3, VNP43IA4, VNP43MA4 and VNP43MA1 and the LP DAAC product pages (Collection 1; the V002 catalog layer lists for VNP43IA1, MA1, IA4 and MA4 are the same) and match the layer counts in the Collection 2 descriptions (9 for IA3, 36 for MA3, 31 for C3).
    Albedo is INT16 with scale_factor 0.001 (valid range 0–1000) and fill value 32767. Files are HDF-EOS5 (HDF5); check the group path in your downloaded files.
  full_list: https://ladsweb.modaps.eosdis.nasa.gov/filespec/VIIRS/1/VNP43MA3
  groups:
    - name: Albedo 1 km (VNP43MA3 / VJ143MA3 / VJ243MA3)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - text: "Black-sky albedo (local solar noon) — `Albedo_BSA_M1`~`M5`, `Albedo_BSA_M7`, `M8`, `M10`, `M11`, `Albedo_BSA_vis`, `Albedo_BSA_nir`, `Albedo_BSA_shortwave` (dimensionless)"
          note: The BRDF fitted to 16 days of data, integrated at the local-noon solar zenith angle
        - text: "White-sky albedo — `Albedo_WSA_M1`~`M11` (no M6, M9), `Albedo_WSA_vis`, `Albedo_WSA_nir`, `Albedo_WSA_shortwave` (dimensionless)"
          note: Fully diffuse illumination, independent of sun position
        - "Per-band mandatory quality — `BRDF_Albedo_Band_Mandatory_Quality_M1`~`_shortwave` (0 full inversion, 1 magnitude inversion, 255 fill)"
    - name: Albedo 500 m (VNP43IA3 / VJ143IA3 / VJ243IA3)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - "Black-sky albedo — `Albedo_BSA_I1`, `Albedo_BSA_I2`, `Albedo_BSA_I3` (dimensionless)"
        - "White-sky albedo — `Albedo_WSA_I1`, `Albedo_WSA_I2`, `Albedo_WSA_I3` (dimensionless)"
        - "Per-band mandatory quality — `BRDF_Albedo_Band_Mandatory_Quality_I1`~`I3`"
    - name: Albedo 0.05° CMG (VNP43C3 / VJ143C3 / VJ243C3)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - text: "Black-sky and white-sky albedo (M bands, DNB and broadbands) — `Albedo_BSA_*`, `Albedo_WSA_*` (dimensionless)"
          note: "`*` is M1–M5, M7, M8, M10, M11, DNB, vis, nir or shortwave (e.g. `Albedo_WSA_shortwave`). 3600×7200 grid, INT16 × 0.001 (valid 0–1000, fill 32767)"
        - text: "Fraction of snow-covered inputs in the CMG cell — `Percent_Snow` (%)"
          note: 0–100, fill 255
        - text: "Ancillary layers for uncertainty, quality, local solar noon and percent of finer-resolution inputs — `BRDF_Albedo_Uncertainty`, `BRDF_Quality`, `Local_Solar_Noon`, `Percent_Inputs`"
          note: "`BRDF_Albedo_Uncertainty` × 0.001 (fill 32767), `BRDF_Quality` 0 best to 5 (50% or more fill) (fill 255), `Local_Solar_Noon` solar zenith at local noon (degrees), `Percent_Inputs` percent of finer-resolution inputs (%)"
    - name: NBAR and BRDF parameters (IA4, MA4 / IA1, MA1)
      kind: mean
      period: 16-day window (9th day weighted)
      items:
        - text: "Nadir BRDF-adjusted reflectance, NBAR (local-noon sun, nadir view) — `Nadir_Reflectance_I1`~`I3`, `Nadir_Reflectance_M1`~`M11` (dimensionless)"
          note: "I bands in VNP43IA4 (500 m), M bands in VNP43MA4 (1 km; no M6, M9). INT16 × 0.0001 (valid 0–10000, fill 32767). Both files also carry the per-band mandatory quality layers `BRDF_Albedo_Band_Mandatory_Quality_I1`–`I3` and `_M1`–`_M11`"
        - text: "BRDF kernel weights (isotropic, volumetric, geometric) — `BRDF_Albedo_Parameters_I1`~`I3`, `BRDF_Albedo_Parameters_M1`~`M11`, `BRDF_Albedo_Parameters_vis`, `BRDF_Albedo_Parameters_nir`, `BRDF_Albedo_Parameters_shortwave` (dimensionless)"
          note: "I bands in VNP43IA1, M bands and broadbands in VNP43MA1 (no M6, M9). 3-D arrays (third dimension Num_Parameters = 3: fiso, fvol, fgeo), INT16 × 0.001 (fill 32767). The mandatory quality layers are included as well"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2545314605-LPCLOUD
    method: Web search and download / earthaccess (HDF-EOS5)
    note: >-
      Short names combine the satellite prefix (VNP43, VJ143, VJ243) with the product (IA1–IA4, MA1–MA4, C1–C4, D, DNBA1–4); the version is 002. A free Earthdata Login is required.
      Suomi NPP (VNP43) will have no new data after 2 November 2026, so for long records download VJ143 and VJ243 as well.
  - name: NASA AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Point and area extraction with reprojection (GeoTIFF, NetCDF4)
    note: Since March 2025 (AppEEARS 3.76) it supports 16 Suomi NPP and NOAA-20 VIIRS BRDF/Albedo V2 products at 500 m and 1 km.
  - name: LP DAAC product page (VNP43MA3 V002)
    url: https://doi.org/10.5067/VIIRS/VNP43MA3.002
    method: Documentation, layer tables, DOI

example:
  lang: python
  note: >-
    Downloads one day of NOAA-20 (VJ143MA3) 1 km albedo with earthaccess and reads white-sky shortwave albedo (pip install earthaccess h5py numpy).
    Variables are located by name, so you do not need to know the HDF-EOS5 group path.
  code: |
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="VJ143MA3", version="002",
        temporal=("2024-04-15", "2024-04-15"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "vj143ma3")

    def find(h5, name):
        hits = []
        h5.visititems(lambda k, v: hits.append(k) if k.endswith("/" + name) else None)
        return h5[hits[0]]

    for f in files:
        with h5py.File(f, "r") as h5:
            wsa = find(h5, "Albedo_WSA_shortwave")[:].astype("float32")
            qa = find(h5, "BRDF_Albedo_Band_Mandatory_Quality_shortwave")[:]
        wsa[wsa == 32767] = np.nan        # fill value
        wsa *= 0.001                      # scale_factor
        wsa[qa != 0] = np.nan             # keep full inversions only
        print(f, np.nanmean(wsa))

tips:
  - "Delivery of Suomi NPP data (VNP43) ends on 2 November 2026. Switch the short names in your scripts to VJ243 (NOAA-21) or VJ143 (NOAA-20), and check for offsets where the satellite changes."
  - "VNP43, VJ143 and VJ243 share the algorithm but come from different sensors. Before joining them into one series, compare them over their overlap, and state in papers which satellite product you used for which period."
  - "Multiply albedo by 0.001 and treat 32767 as fill. Using only quality flag 0 (full inversions) is recommended."
  - "Variable names differ from MODIS MCD43 (M and I bands instead of Band1–7). The broadband names (vis, nir, shortwave) are the same, but the sensors' spectral response differs, so values are not identical."
  - "The 500 m products (IA) contain only imagery bands I1–I3 and no broadband albedo. For broadband shortwave albedo use the 1 km products (MA) or the 0.05° CMG (C3)."
  - "Files are HDF-EOS5 (HDF5), so MODIS HDF4 code (pyhdf) will not work. The Sinusoidal projection uses the same sphere as MODIS (radius 6371007.181 m)."
  - "Production of VNP43 stopped during the Suomi NPP anomaly of 10–21 July 2026. VNP43 retrievals whose 16-day window includes this period have fewer observations, so check their quality."

