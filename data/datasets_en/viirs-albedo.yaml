transitions:
  - from: VIIRS BRDF/Albedo Collection 1 (V001)
    to: VIIRS BRDF/Albedo Collection 2 (V002)
    status: completed
    date: "2024-10"
    summary: >-
      A reprocessing with improved calibration over the whole Suomi NPP mission, better geolocation, and improved cloud and land/water masks. NOAA-20 (VJ143) products first appeared in C2,
      and NOAA-21 (VJ243) products have since been added. C1 (VNP43 V001) stopped production in early 2025.
    changes:
      - aspect: Release
        before: "V001 (Suomi NPP only)"
        after: "Tiled products 2024-10-31, CMG 2025-01-31 / NOAA-21 (VJ243) DOIs registered in 2026"
      - aspect: Satellites
        before: "Suomi NPP (VNP43)"
        after: "Suomi NPP (VNP43) + NOAA-20 (VJ143) + NOAA-21 (VJ243)"
      - aspect: Calibration and geolocation
        before: "C1 calibration coefficients"
        after: "Improved calibration algorithm and coefficients for the whole Suomi NPP mission; better geolocation with outliers around manoeuvres fixed"
      - aspect: Input masks
        before: "C1 cloud mask and land/water mask"
        after: "Improved cloud mask input (fewer coastline errors and coarse-climatology artefacts), corrected aerosol quantity flag (bright mid/high-latitude surfaces), eight-class land/water mask from VNP03 (closer to MODIS)"
      - aspect: Period
        before: "2012-01 to 2025-02 (end of V001)"
        after: "2012-01 to present"
    impacts:
      - Do not mix C1 and C2; download the whole period again as C2.
      - Values near coastlines and over bright high-latitude surfaces may differ from C1.
    sources:
      - name: LP DAAC VNP43MA4 V002 collection description (version changes, CMR)
        url: https://doi.org/10.5067/VIIRS/VNP43MA4.002
      - name: VIIRS Version 2 Albedo, BRDF, and NBAR Tiled Data Products Released (Earthdata)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-tiled-data-products-released
      - name: VIIRS Version 2 Albedo, BRDF, and NBAR CMG Data Products Released (Earthdata)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-cmg-data-products-released

notices:
  - date: "2026-10-30"
    level: warning
    title: "Update #3: Cessation of S-NPP data to users on November 02, 2026 1540 UTC and decommissioning"
    body: >-
      NOAA NESDIS Update #3 (issued October 30, 2026 1400 UTC): delivery of Suomi National Polar-orbiting Partnership (S-NPP) data to users will cease on November 02, 2026 15:40 UTC
      (previously 13:00 UTC) for ATMS, CERES, OMPS Nadir and Limb, VIIRS and HRD Direct Broadcast; the outage is permanent.
      Starting December 1st 2026, S-NPP will be lowered incrementally through approximately December 12th for reentry over the South Pacific Ocean. Users should transition to NOAA-21 (primary) and NOAA-20 (secondary) products.
    source: https://www.nesdis.noaa.gov/news/update-3-cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-november-02-2026-1540-utc-and-decommissioning-issued-october-30-2026-1400-utc
  - date: "2026-08-03"
    level: critical
    title: Suomi NPP data delivery ends on 2 November 2026 — no new VNP43 data
    body: >-
      NOAA announced that it will permanently end delivery of the remaining Suomi NPP science products, including VIIRS, at 13:00 UTC on 2 November 2026, and recommended moving to NOAA-21 (primary) and NOAA-20 (secondary).
      LP DAAC's VNP43 collection descriptions now carry the same date and point users to the VJ243 (primary) and VJ143 (secondary) products. Already published historical data remain available.
    source: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
  - date: "2026-07-13"
    level: warning
    title: Suomi NPP anomaly — VIIRS product generation halted from 10 July 2026
    body: >-
      Suomi NPP entered a non-nominal state at about 14:50 UTC on 10 July, and all science product generation (including VNP43) was disabled from 01:30 UTC on 11 July.
      According to NSIDC, the spacecraft was back to nominal on 21 July and processing resumed afterwards, but observations from this period may not be recoverable.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-viirs-data-outage-anomaly-july-10-2026
  - date: "2025-03-28"
    level: info
    title: VIIRS BRDF/Albedo V2 products available in AppEEARS
    body: >-
      AppEEARS 3.76 added 16 Suomi NPP and NOAA-20 VIIRS BRDF/Albedo V2 products on the 500 m and 1 km Sinusoidal grids.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-brdf-albedo-version-2-products-available-appeears
  - date: "2025-01-31"
    level: info
    title: VIIRS V2 BRDF/Albedo/NBAR 0.05° CMG products released
    body: >-
      Eight 0.05° Climate Modeling Grid products (VNP43C1–C4, VJ143C1–C4) with BRDF parameters, snow-free parameters, albedo and NBAR were released.
      Forward processing of the V1 BRDF/albedo products continued through 31 January 2025.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-cmg-data-products-released
  - date: "2024-10-31"
    level: info
    title: VIIRS V2 BRDF/Albedo/NBAR tiled products released (Suomi NPP, NOAA-20)
    body: >-
      V2 products VNP43IA1–4 and VJ143IA1–4 (500 m) and VNP43MA1–4 and VJ143MA1–4 (1 km) were released. Suomi NPP V1 remained available during the transition.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-tiled-data-products-released

