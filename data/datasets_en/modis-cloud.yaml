# ─────────────────────────────────────────────────────────────
# MODIS clouds MOD06_L2/MYD06_L2 (cloud top and optical properties), MOD35_L2 (cloud mask) and MOD08 L3 cloud C6.1 — dataset information file
# Satellite tab (Clouds & radiation). Covers the cloud mask, cloud top pressure, temperature and height, cloud optical thickness, effective radius and water path, and 1° L3 statistics on one page.
# The key caveats are Terra and Aqua orbit drift and the end of both missions. The MODIS-VIIRS continuity cloud products (CLDPROP, CLDMSK) are in viirs-cloud.yaml.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-cloud
name: "MODIS Cloud (MOD06·MOD35)"
full_name: MODIS/Terra and Aqua Clouds 5-Min L2 Swath 1km and 5km (MOD06_L2, MYD06_L2), Cloud Mask and Spectral Test Results (MOD35_L2, MYD35_L2) and MOD08/MYD08 L3 1° cloud, Collection 6.1 (MODIS cloud mask, cloud top and optical properties)
category: satellite
domain: satellite
group: 구름·복사
order: 60
domains: [대기, 원격탐사]
provider: NASA GSFC MODIS Atmosphere Team (cloud optical properties Platnick et al.; cloud top and cloud mask University of Wisconsin SSEC) / NASA LAADS DAAC (MODAPS)

status: deprecated
status_note: >-
  Collection 6.1 is still produced every day (on 2026-10-13 MOD08_D3 reached 9 October), but Terra and Aqua have drifted from their orbits, shifting their overpass times,
  and NASA expects Terra science operations to end in February 2027 and Aqua's in September 2027. LAADS DAAC points users to the continuity cloud products (CLDMSK, CLDPROP), which use only bands common to MODIS and VIIRS,
  and says a final calibration (v8.0) will support one last reprocessing after operations end. As of 2026-10-13, CMR lists only Version 6.1.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra (MOD06, MOD35, MOD08) from 2000-02-24; Aqua (MYD06, MYD35, MYD08) from 2002-07-04. On 2026-10-13 LAADS held data up to early October 2026 (MOD08_D3 A2026282).
    C6.1 was reprocessed for the full record from September to December 2017 (Terra) and January to March 2018 (Aqua); since 30 April 2018 only C6.1 has been produced.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    L2 swath (at nadir): cloud mask MOD35 at 1 km (with 250 m visible test bits) / MOD06 cloud optical properties and 1 km cloud top (`cloud_top_*_1km`) at 1 km, heritage cloud top properties (`Cloud_Top_Pressure` etc.) at 5 km —
    pixels grow away from nadir / L3: global 1°×1° equal-angle grid (360×180, MOD08_D3/E3/M3)
  vertical: Cloud top pressure, temperature and height, plus column-integrated cloud properties (optical thickness, effective radius, water path)
  temporal: >-
    L2 in 5-minute granules (orbital swaths). Cloud mask and cloud top are produced day and night; optical properties in daytime only / L3 daily (D3), 8-day (E3) and monthly (M3).
    Nominal equator crossing times are 10:30 descending (Terra, day) and 13:30 ascending (Aqua, day) local time, with night observations on the opposite orbit leg, but orbit drift has changed them.

update: Daily (L3 daily files around the day after observation); 8-day and monthly products after each period ends. A near-real-time (NRT) version is served separately by LANCE
license: Freely available without restriction under the NASA EOSDIS data use policy. Downloading (including HTTPS and OPeNDAP) needs a free NASA Earthdata Login; citation of the dataset DOI is requested.
account_required: true

summary: >-
  NASA's standard cloud products made from the 36 MODIS bands. MOD35 is a cloud mask that combines visible and infrared threshold tests into a per-pixel confidence that the view is clear.
  MOD06 holds cloud top pressure, temperature, height and infrared phase, retrieved with the CO2 absorption bands (CO2 slicing) and the infrared window, plus cloud optical thickness, effective particle radius and water path from visible and shortwave infrared reflectance (daytime).
  MOD08 L3 gathers these into daily, 8-day and monthly statistics on a 1° grid, in the same files as aerosol, water vapour and atmospheric profile statistics. There are separate Terra (morning) and Aqua (afternoon) versions.
  Because the algorithms use CO2 and water vapour absorption bands that only MODIS has, they cannot simply be carried over to VIIRS.

time_convention:
  summary: >-
    L2 values (MOD06, MOD35) are observations at the moment of the overpass. The time in the file name (AYYYYDDD.HHMM) is the start of the first scan in the 5-minute granule (UTC). The cloud mask and cloud top properties
    are produced day and night; optical properties (optical thickness, effective radius, water path) need sunlight and exist only in daytime. The L3 daily product (MOD08_D3) holds statistics of the day's L2 values in each 1° cell,
    with separate daytime (`_Day`) and nighttime (`_Night`) statistics, and the 8-day (E3) and monthly (M3) products average the daily means (`_Mean_Mean`).
  points:
    - "Nominally Terra crosses the equator descending at 10:30 local time and Aqua ascending at 13:30, both in daylight, with night observations on the opposite orbit leg. Cloudiness changes strongly through the day (especially convective clouds and marine stratus), so Terra–Aqua differences include the time-of-day difference."
    - "Orbit drift: after its last inclination adjustment on 27 February 2020, Terra moved earlier, reaching 10:15 by autumn 2022; Aqua, after its last adjustment on 8 March 2021, has moved later and was expected to reach about 15:50 around August 2026. Long-term trends in cloud variables with a strong diurnal cycle need to account for this."
    - "L3 daily files follow the UTC date, but since C6 the window is widened by up to 3 hours on either side to reduce gaps and overlaps near the date line (L3 ATBD)."
    - "8-day (E3) products use 8 consecutive daily files starting from 1 January, and monthly (M3) products use all daily files in the month. According to the L3 ATBD, 8-day and monthly cloud optical property means weight each daily mean by its pixel count."
    - "Cloud optical thickness is close to log-normally distributed, so L3 carries both an arithmetic mean (`_Mean`) and a log mean (`_Log_Mean`). For radiative calculations and model comparisons, state which mean you used."
    - "The near-real-time (NRT, LANCE) version is made separately from the standard product (LAADS); use the standard product for research time series."
  source: https://atmosphere-imager.gsfc.nasa.gov/sites/default/files/ModAtmo/L3_ATBD_C6_C61_2019_02_20.pdf
  source_name: "MODIS Atmosphere L3 Global Gridded Product User's Guide & ATBD (C6 and C6.1) + MOD06_L2 and MOD35_L2 collection descriptions (CMR) + NASA Terra article and LP DAAC Aqua orbit plan"

variables:
  note: >-
    SDS names and units from the CMR variable records (UMM-Var). Files are HDF-EOS2 (HDF4) with integer storage, so physical value = scale_factor × (stored value − add_offset) (the MODIS Atmosphere definition; add_offset is subtracted).
    For example `Cloud_Top_Temperature` has scale 0.01 and add_offset −15000, so the physical value is 0.01 × (stored value + 15000) K. MYD (Aqua) files use the same names.
  full_list: https://atmosphere-imager.gsfc.nasa.gov/products/cloud
  groups:
    - name: L2 cloud mask 1 km (MOD35_L2, MYD35_L2)
      kind: instant
      period: overpass time
      items:
        - text: "Cloud mask and spectral test results — `Cloud_Mask` (6-byte bit field)"
          std: []
          note: Byte 1 bits 0–2 hold whether the mask was determined and four confidence levels (cloudy, probably cloudy, probably clear, confident clear), plus day/night, sunglint, snow/ice and land/water paths. Bytes 2–4 hold 1 km tests, bytes 5–6 the 250 m visible tests
        - "250 m reflectance dispersion index — `Cloud_Mask_SPI` (bands 1 and 2)"
    - name: L2 cloud top and phase (MOD06_L2, MYD06_L2)
      kind: instant
      period: overpass time
      items:
        - "Cloud top pressure (5 km) — `Cloud_Top_Pressure` (hPa, scale 0.1)"
        - "Cloud top pressure (1 km) — `cloud_top_pressure_1km` (hPa)"
        - "Cloud top height (1 km, geopotential height) — `cloud_top_height_1km` (m)"
        - "Cloud top temperature (5 km) — `Cloud_Top_Temperature` (K, scale 0.01, add_offset −15000)"
        - text: "Cloud fraction (5×5 1 km pixels, from the cloud mask) — `Cloud_Fraction` (dimensionless, scale 0.01)"
          std: [cloud]
        - "Infrared cloud phase (1 km) — `Cloud_Phase_Infrared_1km` (0 = clear, 1 = water, 2 = ice, 3 = mixed, 6 = undetermined)"
    - name: L2 cloud optical properties 1 km, daytime (MOD06_L2, MYD06_L2)
      kind: instant
      period: overpass time (daytime)
      items:
        - "Cloud optical thickness (2.1 µm band pair) — `Cloud_Optical_Thickness` (dimensionless, scale 0.01)"
        - "Cloud effective particle radius (2.1 µm) — `Cloud_Effective_Radius` (µm, scale 0.01)"
        - text: "Cloud water path (liquid or ice column, 2.1 µm) — `Cloud_Water_Path` (g m-2)"
          std: [cloud_water]
        - "Cloud phase used in the optical retrieval — `Cloud_Phase_Optical_Properties` (0 = mask undetermined, 1 = clear, 2 = liquid, 3 = ice, 4 = undetermined, retrieved as liquid)"
        - "Optical thickness from the 1.6 µm and 1.6/2.1 µm pairs — `Cloud_Optical_Thickness_16`, `Cloud_Optical_Thickness_1621` (dimensionless)"
        - "Partly cloudy (cloud edge) pixel retrieval (PCL) — `Cloud_Optical_Thickness_1621_PCL` (dimensionless)"
    - name: L3 daily 1° (MOD08_D3, MYD08_D3)
      kind: mean
      period: daily (UTC date, widened by up to 3 hours)
      items:
        - text: "Cloud fraction (cloud mask 'cloudy + probably cloudy' / total), daily mean — `Cloud_Fraction_Mean` (dimensionless, scale 0.0001)"
          std: [cloud]
        - text: "Daytime and nighttime cloud fraction, daily mean — `Cloud_Fraction_Day_Mean`, `Cloud_Fraction_Night_Mean` (dimensionless)"
          std: [cloud]
        - "Cloud top pressure, daily mean — `Cloud_Top_Pressure_Mean` (hPa, scale 0.1)"
        - "Cloud top temperature, daily mean — `Cloud_Top_Temperature_Mean` (K, scale 0.01, add_offset −15000)"
        - "Cloud top height, daily mean — `Cloud_Top_Height_Mean` (m)"
        - "Liquid and ice cloud optical thickness, daily mean — `Cloud_Optical_Thickness_Liquid_Mean`, `Cloud_Optical_Thickness_Ice_Mean` (dimensionless, scale 0.01)"
        - "Liquid cloud effective radius, daily mean — `Cloud_Effective_Radius_Liquid_Mean` (µm, scale 0.01)"
        - text: "Liquid cloud water path, daily mean — `Cloud_Water_Path_Liquid_Mean` (g m-2)"
          std: [cloud_water]
    - name: L3 8-day and monthly 1° (MOD08_E3 8-day / MOD08_M3 monthly)
      kind: mean
      period: 8 days or month (mean of daily means)
      items:
        - text: "Cloud fraction — `Cloud_Fraction_Mean_Mean` (dimensionless, scale 0.0001)"
          std: [cloud]
        - "Cloud top temperature — `Cloud_Top_Temperature_Mean_Mean` (K)"
        - "Liquid cloud optical thickness — `Cloud_Optical_Thickness_Liquid_Mean_Mean` (dimensionless)"
        - "Liquid cloud effective radius — `Cloud_Effective_Radius_Liquid_Mean_Mean` (µm)"
        - text: "Liquid cloud water path — `Cloud_Water_Path_Liquid_Mean_Mean` (g m-2)"
          std: [cloud_water]

access:
  - name: LAADS DAAC (search, order and direct download)
    url: https://ladsweb.modaps.eosdis.nasa.gov/search/order/2/MOD06_L2--61
    method: Web search, direct HTTPS download (archive/allData/61/<short name>/) / LAADS API-V2 / OPeNDAP
    note: >-
      Example short names: MOD06_L2, MYD06_L2, MOD35_L2, MYD35_L2, MOD08_D3, MOD08_E3, MOD08_M3 (MYD for Aqua). All are C6.1 (archive 61; CMR version "6.1").
      Since 2026-04-30 OPeNDAP also requires Earthdata Login, and the old LAADS Classic API was retired on 2026-08-31, so scripts must move to API-V2.
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search/granules?p=C1443535037-LAADS
    method: Web search / earthaccess (Python)
    note: The link points to MOD06_L2 C6.1; search other products by short name. Files are also served from Earthdata Cloud.
  - name: Worldview (imagery)
    url: https://worldview.earthdata.nasa.gov/
    method: Web map
    note: Shows MODIS cloud product imagery by date, which helps when choosing case studies.

example:
  lang: python
  note: >-
    Downloads an Aqua MYD08_M3 monthly file with earthaccess and reads the monthly mean cloud fraction with pyhdf. MODIS atmosphere products subtract add_offset from the stored value before multiplying by scale_factor, so convert by hand.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MYD08_M3", version="6.1",
        temporal=("2024-07-01", "2024-07-31"),
    )
    files = earthaccess.download(results[:1], "myd08")

    hdf = SD(files[0], SDC.READ)
    sds = hdf.select("Cloud_Fraction_Mean_Mean")
    raw = sds.get().astype("float64")
    att = sds.attributes()
    cf = np.where(raw == att["_FillValue"], np.nan,
                  att["scale_factor"] * (raw - att["add_offset"]))  # 1° grid, 180×360
    lat = 89.5 - np.arange(180)                     # row 0 = 89–90°N
    w = np.cos(np.deg2rad(lat))[:, None] * np.ones((1, 360))
    ok = np.isfinite(cf)
    print("Global area-weighted cloud fraction:", (cf[ok] * w[ok]).sum() / w[ok].sum())

tips:
  - "'Cloud fraction' means different things in different fields. L3 `Cloud_Fraction_Mean` is the share of 'cloudy + probably cloudy' pixels in the cloud mask, while `Cloud_Retrieval_Fraction_*` is the share of pixels with a successful optical property retrieval. Match the definition when comparing with ISCCP or reanalysis cloud cover."
  - "Optical thickness, effective radius and water path exist only in daytime, and only where cloud fills the pixel and the retrieval succeeds. Polar night, high-latitude winter with large solar zenith angles, and regions with much thin cirrus have few samples and may be biased."
  - "Cloud top properties come at 5 km (`Cloud_Top_Pressure`) and 1 km (`cloud_top_pressure_1km`). The MODIS Atmosphere team recommends the 1 km products for new work, but L3 statistics are still built from the 5 km L2."
  - "In the HDF4 files the physical value is scale_factor × (stored value − add_offset). With a variable like `Cloud_Top_Temperature`, whose add_offset is −15000, getting the sign wrong gives nonsense instead of about 300 K."
  - "The MODIS Atmosphere known issues list notes that warming of Aqua band 29 (8.6 µm) has created artificial trends in the Aqua C6.1 infrared cloud phase (largest in the tropics), and that Aqua 5 km cloud top data over southern Africa between 09:00 and 12:30 UTC are intermittently missing."
  - "A Terra part failure (PWA) on 5 October 2020 removed visible and near-infrared reflectance in some high-latitude scenes, creating false clouds in the daytime polar and subpolar cloud mask. MOD35 and MOD06 for 2020-10-05 to 2021-09-25 were reprocessed with updated algorithms, so use the reprocessed files for that period (check the production date)."
  - "After NOAA stopped producing Reynolds SST in December 2022, MOD35 and MOD06 kept using the last Reynolds SST (week of 2022-11-27), according to a LAADS notice. Whether a replacement SST was applied and the period reprocessed could not be confirmed from notices as of 2026-10-13, so take care with ocean cloud mask and low cloud top analyses after December 2022."
  - "The MODIS Atmosphere issues list has a 'C7.0 Cloud L3' entry (updated 2026-09), but on 2026-10-13 no MODIS C7 cloud products were public in CMR or at LAADS. Check LAADS notices for a release."

