transitions:
  - from: MODIS clouds C6 (MOD06, MOD35, MOD08)
    to: MODIS clouds C6.1
    status: completed
    date: "2018-03"
    summary: >-
      A reprocessing that fixed problems in the input L1B data; changes to the cloud products are mostly small (ancillary inputs, QA, handling of cloud top fill values). C6.1 fixed false ocean clouds caused by Terra band 29 calibration drift
      and the C6 December bias in low-cloud pressure over ocean. Since 30 April 2018 only C6.1 has been produced.
    changes:
      - aspect: Input L1B
        before: C6 L1B (Terra band 29 calibration drift; 1–2% step in Aqua from July 2016)
        after: Calibration problems fixed in C6.1 L1B
      - aspect: Cloud top
        before: "False low clouds over ocean in Terra from band 29 drift (from 2010, worst after 2014); December bias in 1 km low-cloud pressure over ocean"
        after: Both problems fixed
      - aspect: Cloud optical properties
        before: C6
        after: Minor changes such as updated ancillary inputs and QA
      - aspect: Production
        before: C6 (produced in parallel until 2018-04-30)
        after: C6.1 only
    impacts:
      - Do not mix C6 and C6.1 in one time series; download the whole record again as C6.1.
    sources:
      - name: MODIS Atmosphere — Data Versions (collections overview)
        url: https://atmosphere-imager.gsfc.nasa.gov/collections/overview
      - name: MODIS Cloud (06_L2) known issues
        url: https://atmosphere-imager.gsfc.nasa.gov/issues/cloud
      - name: C6.1 cloud optical properties change summary
        url: https://modis-atmos.gsfc.nasa.gov/sites/default/files/ModAtmo/C6.1_Change_Summary_Cloud_Optical_%2806_OD%29_v2.pdf
  - from: MODIS clouds MOD06, MOD35, MOD08 C6.1
    to: MODIS-VIIRS continuity cloud products CLDMSK and CLDPROP
    to_id: viirs-cloud
    status: planned
    summary: >-
      VIIRS lacks the MODIS CO2 absorption bands (around 13 µm) and water vapour bands (6.7 and 7.3 µm), and its shortwave infrared band is at 2.25 µm instead of 2.13 µm, so MOD06 and MOD35 cannot be ported directly.
      NASA therefore built a cloud mask (CLDMSK) and cloud properties (CLDPROP) with algorithms that use only bands common to both sensors, applied in the same way to VIIRS (Suomi NPP, NOAA-20) and to Aqua MODIS.
      The key point is the Aqua MODIS CLDPROP, which remakes the MODIS record with the same algorithm so it can be joined to VIIRS.
    changes:
      - aspect: Cloud mask algorithm
        before: "MOD35 (all MODIS bands, including CO2 and water vapour absorption tests)"
        after: "MODIS-VIIRS Cloud Mask (MVCM): MOD35 heritage using common bands only (no 0.905, 0.936, 6.7, 7.3, 13.3 or 13.9 µm tests)"
      - aspect: Cloud top algorithm
        before: "CO2 slicing (13 µm bands) + infrared window"
        after: "NOAA CLAVR-x AWG Cloud Height Algorithm (ACHA), mainly infrared window — results differ structurally"
      - aspect: Cloud optical properties
        before: "MOD06 (2.13 µm; liquid refractive index from a 300 K data set)"
        after: "MOD06 heritage with common bands (0.65, 0.86, 1.24, 1.6, 2.2, 3.7, 11 µm), liquid refractive index from a 265 K data set, no multilayer detection"
      - aspect: Satellites and overpass time
        before: "Terra 10:30 descending, Aqua 13:30 ascending (drifting)"
        after: "Aqua MODIS, Suomi NPP and NOAA-20 all in afternoon orbits ascending around 13:30. No continuity product for Terra's morning observations"
      - aspect: Resolution and format
        before: "L2 1 km and 5 km, L3 1° (D3, E3, M3), HDF-EOS2 (HDF4)"
        after: "L2 VIIRS 750 m and MODIS 1 km, L3 1° (D3, M3; no 8-day), NetCDF-4"
      - aspect: Period
        before: "Terra 2000-02 onward / Aqua 2002-07 onward"
        after: "Aqua MODIS 2002-07 onward / Suomi NPP 2012-03 onward (delivery ends 2026-11-02) / NOAA-20 2018-02 onward"
    impacts:
      - "MOD06 C6.1 and CLDPROP give different values even for the same Aqua observations (different refractive index, cloud top algorithm and QA). Do not join the MODIS standard record directly to VIIRS CLDPROP; use Aqua MODIS CLDPROP as the bridge."
      - Platnick et al. (2021) report systematic differences in effective radius and phase because of the VIIRS 2.25 µm versus MODIS 2.13 µm band, part of which has not yet been separated from radiometric calibration differences between the sensors.
      - "No continuity product carries on the Terra (morning) cloud record. Do not mix observations from different times of day."
    sources:
      - name: Platnick et al. (2021), Remote Sensing — The NASA MODIS-VIIRS Continuity Cloud Optical Properties Products
        url: https://doi.org/10.3390/rs13010002
      - name: LAADS DAAC — MODIS to VIIRS Transition (continuity product table)
        url: https://ladsweb.modaps.eosdis.nasa.gov/learn/modis-to-viirs-transition
      - name: MODIS-VIIRS Cloud Mask (MVCM) User Guide
        url: https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/archives/Document%20Archive/Science%20Data%20Product%20Documentation/MVCM_User_Guide_Oct_2020.pdf

notices:
  - date: "2026-08-03"
    level: info
    title: LAADS Classic API retired on 2026-08-31 — move to API-V2
    body: >-
      LAADS DAAC announced that its old Classic web service API would be retired on 31 August 2026. Automated download scripts and clients need to move to LAADS API-V2, a JSON/REST interface.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199517
  - date: "2026-04-30"
    level: info
    title: Earthdata Login now required for LAADS OPeNDAP
    body: >-
      From 30 April 2026 the LAADS OPeNDAP service also requires NASA Earthdata Login authentication. Scripts that read OPeNDAP URLs without credentials must add them.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199527
  - date: "2026-03-31"
    level: info
    title: Terra anomaly put MODIS in standby — data from 2026-03-26 to 27 questionable or bad
    body: >-
      A Terra spacecraft anomaly around 20:00 UTC on 26 March 2026 put MODIS into standby mode; it returned to science mode on the afternoon of 27 March. The calibration team flagged data from 20:00 UTC on 26 March
      to 19:30 UTC on 27 March as questionable or bad and considers data after that safe to use.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199533
  - date: "2026-03-20"
    level: warning
    title: NASA expects Terra science operations to end in February 2027 and Aqua in September 2027
    body: >-
      The editor's note on the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects that fuel and power limits will end science operations for Terra in February 2027
      and Aqua in September 2027, with both continuing to operate until then. When Aqua ends, the Aqua MODIS continuity cloud products (CLDPROP, CLDMSK) end with it.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2026-03-18"
    level: info
    title: MODIS L1B and geolocation Version 7.0 released — cloud products still C6.1
    body: >-
      LAADS DAAC released Version 7.0 MODIS calibrated radiances (L1B) and geolocation and said the V6.1 L1 data would be removed on 2026-09-30. V7 L1B includes an electronic crosstalk correction for Aqua bands 27–30
      and a bias correction for Terra band 29. On 2026-10-13 CMR listed only Version 6.1 for MOD06, MOD35 and MOD08.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua begin shutting down in late 2026 to early 2027
    body: >-
      NASA LAADS DAAC announced that Terra and Aqua will begin shutting down in late 2026 or early 2027, and that both are drifting out of their designed orbits, changing crossing times and possibly affecting the data.
      A final reprocessing will follow once MODIS data collection stops, and users are encouraged to use similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2022-12-19"
    level: warning
    title: NOAA Reynolds SST discontinued — MOD35 and MOD06 frozen on the last SST
    body: >-
      NOAA stopped producing Reynolds SST, so MODAPS kept making the Terra and Aqua cloud mask (MxD35_L2) and cloud top (MxD06) products with the last Reynolds SST, from the week of 2022-11-27, until a replacement is chosen.
      It said the affected period would be reprocessed once an alternative SST is adopted.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199628
  - date: "2022-11-29"
    level: info
    title: Terra L1B and atmosphere products reprocessed after constellation exit maneuvers (2022-10-23 to 11-21)
    body: >-
      After Terra's constellation exit maneuvers (12 and 19 October), the crosstalk behaviour of some detectors in bands 27–30 changed, so Terra C6.1 L1B and atmosphere products for 23 October to 21 November 2022 were reprocessed.
      Cloud and water vapour products are the most affected; production from 22 November uses corrected L1B. Users are advised to use the reprocessed versions for this period.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199633
  - date: "2022-11-04"
    level: info
    title: Aqua L1B and atmosphere products reprocessed after safe mode (2022-04-17 to 07-26)
    body: >-
      After Aqua MODIS returned from safe mode (31 March to 14 April 2022), the crosstalk correction for bands 27–30 drifted, so Aqua C6.1 L1B and atmosphere products for 17 April to 26 July were reprocessed.
      Cloud and water vapour products are the most affected; production from 27 July already includes the fix.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199635
  - date: "2021-08-06"
    level: warning
    title: Terra part failure (2020-10-05) caused high-latitude cloud mask and cloud top errors
    body: >-
      A Terra MODIS Printed Wire Assembly (PWA) failure on 5 October 2020 removed visible and near-infrared reflectance in some high-latitude scenes; the cloud mask then assumed no snow or ice and flagged many false clouds in daytime,
      and the cloud top product mislabelled these scenes as 'night'. A follow-up notice (2021-11-23) says MOD35 and MOD06 for 2020-10-05 to 2021-09-25 were reprocessed with updated algorithms, and the instrument returned to normal after a recorder reboot in September 2021.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199683

