example:
  lang: python
  note: "Put the url (https://cds.climate.copernicus.eu/api) and your API key in ~/.cdsapirc, and accept the dataset licence on the CDS website before running."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()
    client.retrieve(
        "satellite-sea-surface-temperature",
        {
            "variable": "all",
            "processinglevel": "level_4",
            "sensor_on_satellite": "combined_product",
            "version": "3_0",
            "temporal_resolution": "daily",
            "year": ["2023"],
            "month": ["08"],
            "day": ["01", "02", "03"],
        },
        "sst_cci_l4_202308.zip",   # NetCDF files arrive bundled in a zip
    )

tips:
  - >-
    This record's SST is adjusted to 20 cm depth and the daily mean, which is not quite the same as foundation SST (OSTIA) or daily-mean bulk SST (OISST).
    Check depth and time-of-day definitions before comparing SST analyses.
  - Because no ship or buoy data go in, comparisons with in situ observations are independent. When it disagrees with analyses that assimilate in situ data (OISST, OSTIA, etc.), consider this design difference first.
  - "The PUG flags January 1980–September 1981 (a single AVHRR on NOAA-06, sparse data) and October 1982–September 1983 (noisy AVHRR with calibration errors) as periods to treat with caution. Avoid them as climatology or trend start points."
  - "When working with L3C directly, use quality_level 4 and 5 only. Uncertainty is split into components with different correlation properties (random, correlated, systematic, etc.); propagate them separately, as the PUG describes, when averaging in space or time."
  - The Copernicus Marine copy stops in 2021; use CEDA or the CDS for recent data. Do not mix older v2.1 files (CEDA neodc/esacci/sst path, CDS version 2_1) with v3.0 in one series.

