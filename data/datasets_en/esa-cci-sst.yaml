# ─────────────────────────────────────────────────────────────
# ESA SST CCI / C3S — dataset information file
# Satellite-based sea surface temperature climate data record (CDR v3.0, 1980–2021) + Interim CDR (ICDR, 2022 onward)
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: esa-cci-sst
name: ESA SST CCI CDR v3
full_name: >-
  ESA Sea Surface Temperature Climate Change Initiative (SST_cci) Climate Data Record version 3.0 + Interim Climate Data Record
  (distributed by CEDA; on the C3S Climate Data Store as "Global sea surface temperature derived from satellite observations")
category: satellite
domain: ocean
group: 해수면온도 분석장
order: 70
domains: [해양]
provider: >-
  ESA Climate Change Initiative SST project (CDR v3.0) / UK EOCIS and UKMCAS (ICDR from 2023) and Copernicus Climate Change Service (ICDR 2022, CDS distribution) /
  archived at CEDA. The L4 analysis is produced with the Met Office OSTIA system

status: active
status_note: >-
  Active: the 1980–2021 climate data record (CDR v3.0) is extended daily by an Interim CDR (ICDR) from 2022 onward.
  Version 3.0 replaced v2.1 at CEDA in April 2024, on the C3S CDS on 28 November 2025 and on Copernicus Marine in March 2026.
  The Copernicus Marine copy still ends in 2021; adding the ICDR is planned for November 2026, subject to the C3S publication schedule.

period:
  start: "1980-01"
  end: present
  note: >-
    The L4 analysis CDR covers 1980-01-01 to 2021-12-31; data from 2022 onward are ICDR. The C3S CDS catalogue lists a temporal extent of 1979-07-13
    (start of the L3C daily data) to 2026-09-23 (checked 2026-10-12); end dates per level and sensor were not checked.
    The ESA data page gives the ICDR as about 2 weeks behind present, the CEDA record as about one month behind.
    January 1980 to September 1981 rest on a single AVHRR (NOAA-06), so coverage is sparse.

resolution:
  spatial_short: "6 km (0.05°)"
  temporal_short: "1일"
  spatial: >-
    Regular 0.05° latitude-longitude grid, 7200 × 3600 (cell centres 179.975°W–179.975°E, 89.975°S–89.975°N), shared by L3U, L3C and L4.
    L2P is at native sensor resolution (swath geometry). The L4 feature resolution is coarser than the grid spacing
  vertical: >-
    Sea surface only — skin SST (about 10 µm depth) and SST adjusted to 20 cm depth (depth SST, comparable with drifting-buoy measurements).
    L4 provides the 20 cm depth SST only
  temporal: Daily (L4 daily-mean analysis; L3C collated into daily day-time and night-time files). Monthly means are also offered on the C3S CDS
coverage:
  short: 전지구
update: ICDR daily (about 2 weeks to 1 month behind present). The CDR itself is not updated
license: >-
  CC BY 4.0 — attribution with the citation given in the CEDA record is required (see also the ESA CCI SST terms and conditions).
  The C3S CDS copy is under the SST CCI datasets licence and CC BY 4.0; the Copernicus Marine copy is under the Copernicus Marine Service licence
account_required: false

summary: >-
  A satellite-only sea surface temperature climate data record from the ESA Climate Change Initiative (CCI), built by reprocessing the AVHRR, ATSR and SLSTR
  infrared sensor series and the AMSR microwave sensors with consistent algorithms. No ship or buoy data are used, so in situ observations provide an
  independent validation, and every value comes with an uncertainty estimate. Products include skin SST and SST adjusted to 20 cm depth and the daily mean;
  the most widely used is the daily, gap-free 0.05° Level 4 analysis from 1980. Version 3.0 (Embury et al. 2024) is the 1980–2021 CDR, extended daily from 2022 by an ICDR made the same way.

time_convention:
  summary: >-
    L4 is a daily-mean estimate of SST at 20 cm depth, time-stamped 12:00 UTC on the file date. The L3C depth SST adjusts each observation to the nearest of
    10:30 or 22:30 local mean solar time (when the diurnal anomaly is closest to zero), approximating the daily mean; skin SST is the temperature at the time of observation.
  points:
    - "Daily L3C and L4 file names carry the time 120000 (12:00 UTC). For L3C it is the centre of the collation window; for L4 it is the nominal analysis time, not an observation time."
    - "L3C has separate day-time and night-time files. Skin SST keeps the daytime diurnal warming, so use depth SST if you need a daily-mean value."
    - "L4 is an OSTIA analysis of the CCI satellite SSTs with gaps filled statistically. Cells with no satellite data that day are interpolated, so check analysed_sst_uncertainty alongside the SST."
    - "The CDR (to 2021) and ICDR (from 2022) use the same v3 system, but the ICDR is a delayed-mode extension. Check that long-term trends do not jump at the join."
  source: https://eu-west-1.climate.esa.int/documents/2568/SST_CCI_D4.2_PUG_v1.1.pdf
  source_name: SST CCI Product User Guide (SST_CCI_D4.2_PUG v1.1, CDR v3) / Embury et al. (2024)

variables:
  note: >-
    Variable names as given in the SST CCI Product User Guide (PUG) and the Copernicus Marine metadata. Values are stored as packed integers,
    so make sure add_offset and scale_factor are applied when reading. Units are K.
  full_list: https://eu-west-1.climate.esa.int/documents/2568/SST_CCI_D4.2_PUG_v1.1.pdf
  groups:
    - name: L4 analysis (daily, gap-free)
      kind: mean
      period: day
      items:
        - text: "Analysed sea surface temperature (20 cm depth) — `analysed_sst` (K)"
          note: Daily mean SST at 0.2 m depth
        - text: "Estimated uncertainty in analysed_sst — `analysed_sst_uncertainty` (K)"
          note: Uncertainty of the same day's analysed_sst. L4 has a single uncertainty, so correlation scales cannot be separated
        - text: "Sea ice area fraction — `sea_ice_fraction` (0–1)"
          note: Taken from OSI SAF sea-ice concentration (OSI-450, OSI-430). Its internal time definition was not checked
        - text: "Land, sea, lake and sea-ice mask — `mask` (bit flags)"
          kind: static
          note: Ice-free ocean pixels have mask = 1. The sea-ice bit can change from day to day
    - name: L3C single-sensor daily collation (with gaps)
      items:
        - text: "Sea surface skin temperature — `sea_surface_temperature` (K)"
          kind: instant
          note: Skin (about 10 µm) temperature at the time of observation. Separate day-time and night-time files
        - text: "Sea surface temperature at 20 cm depth — `sea_surface_temperature_depth` (K)"
          kind: mean
          period: day
          note: Adjusted to the nearest of 10:30 or 22:30 local time, equivalent to the daily average
        - text: "Total uncertainty — `sea_surface_temperature_total_uncertainty`, `sea_surface_temperature_depth_total_uncertainty` (K)"
          kind: instant
          note: Uncertainty of each SST value; the quadrature sum of the components (uncertainty_random, uncertainty_correlated, uncertainty_systematic, etc.)
        - text: "Quality level — `quality_level` (0–5)"
          kind: instant
          note: Use 4 and 5 for quantitative work; 2 and 3 for qualitative use only
    - name: Climatology (separate product)
      kind: mean
      period: day (1991–2020 mean)
      items:
        - text: "Daily SST climatology 1991–2020 (0.05°) — Climatology product v3.0"
          note: Separate CEDA dataset (DOI 10.5285/62800d3d2227449085b430b503d36b01). A 30-year mean for each calendar day, not a specific year

