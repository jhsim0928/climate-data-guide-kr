transitions:
  - from: SST CCI CDR v2.1
    to: SST CCI CDR v3.0
    status: completed
    date: "2024-04"
    summary: >-
      CDR v3.0 brings a longer time series (1980–2021), retrieval improvements that reduce systematic biases, better handling of desert-dust aerosols,
      dual-view SLSTR from 2016, early AVHRR/1 data and full-resolution MetOp AVHRR. It replaced v2.1 at CEDA (2024-04), on the C3S CDS (2025-11-28) and on Copernicus Marine (2026-03).
    changes:
      - aspect: Period
        before: "1981–2016 (v2.1 CDR)"
        after: "1980–2021 (v3.0 CDR) + daily ICDR extension from 2022"
      - aspect: Retrieval algorithm
        before: v2.1 algorithm
        after: Bias-aware retrieval that reduces systematic biases; improved desert-dust aerosol handling
      - aspect: Input sensors
        before: "AVHRR, ATSR, SLSTR, etc. (v2.1 set)"
        after: "Dual-view SLSTR (2016 onward), early AVHRR/1 (1980s), full-resolution MetOp AVHRR, AMSR L2P added"
      - aspect: Climatology product
        before: Previous climatology product (v2.2)
        after: "Climatology product v3.0 — daily climatology for 1991–2020 (DOI 10.5285/62800d3d2227449085b430b503d36b01)"
      - aspect: CEDA path and DOI
        before: "neodc/esacci/sst/… (v2.1)"
        after: "neodc/eocis/data/global_and_regional/sea_surface_temperature/CDR_v3/…; L4 DOI 10.5285/4a9654136a7148e39b7feb56f8bb02d2"
      - aspect: C3S CDS
        before: "version 2_1 / 2_0 / 1_1"
        after: "version 3_0 (published 2025-11-28)"
      - aspect: Data paper
        before: "Merchant et al. (2019), Sci. Data 6, 223"
        after: "Embury et al. (2024), Sci. Data 11, 326"
    impacts:
      - Do not mix v2.1 and v3.0 in one series; download the whole period again as v3.0. Values in the 1980s and after 2016 in particular may have changed.
      - For a 1991–2020 baseline, use the v3.0 climatology product.
      - The citation DOIs and the data paper have changed.
    sources:
      - name: CEDA — SST CCI L4 Analysis v3.0
        url: https://catalogue.ceda.ac.uk/uuid/4a9654136a7148e39b7feb56f8bb02d2/
      - name: Embury et al. (2024), Scientific Data
        url: https://doi.org/10.1038/s41597-024-03147-w
      - name: ECMWF Forum — New version 3.0 of Global Sea Surface Temperature daily data now available on CDS (2025-11-28)
        url: https://forum.ecmwf.int/t/new-version-3-0-of-global-sea-surface-temperature-daily-data-now-available-on-cds/14329
      - name: Copernicus Marine transition information — SST_GLO_SST_L4_REP_OBSERVATIONS_010_024
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SST_GLO_SST_L4_REP_OBSERVATIONS_010_024

