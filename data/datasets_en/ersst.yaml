# ─────────────────────────────────────────────────────────────
# ERSST v5 — dataset information file (English edition)
# The successor ERSST v6 has been released, so v5 is marked as deprecated.
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: ersst
name: ERSST v5
full_name: NOAA Extended Reconstructed Sea Surface Temperature (ERSST), Version 5
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 20
domains: [해양]
provider: NOAA National Centers for Environmental Information (NCEI)

status: deprecated
status_note: >-
  The successor, ERSST v6, has been released and is now NOAA's official SST dataset. In April 2026 NOAA PSL announced that "the NOAA ERSSTv5 dataset will be
  discontinued by NOAA/NCEI in June 2026", but as checked in October 2026 the v5 files at NCEI and PSL are still being updated through September 2026.
  Updates could stop at any time, so start new work with v6 and keep v5 for reproducing earlier results.

successor:
  name: ERSST v6
  url: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
  note: >-
    January 1850 to present, 2° monthly (same format as v5). Adds artificial neural network (ANN) interpolation, stronger quality control and an improved
    ice-SST proxy, and moves the anomaly climatology to 1991–2020. References: Huang et al. (2025), J. Climate, 38(4), 1105–1121,
    doi:10.1175/JCLI-D-23-0707.1 and Part II, 1123–1136, doi:10.1175/JCLI-D-24-0185.1.
    The dataset DOI is 10.25921/z7cw-es89 (different from the v5 DOI, 10.7289/V5T72FNM).

transitions:
  - from: ERSST v5
    to: ERSST v6
    to_id: ersst-v6
    status: completed
    date: "2025-12"
    summary: >-
      v6 keeps the 2° monthly grid and the in situ basis, but replaces the EOT-based gap filling with artificial neural network (ANN) interpolation.
      Ship-observation quality control, a large-scale filter and the ice-SST proxy were revised too, improving agreement with observations in data-sparse periods and regions
      and since the 1970s. The anomaly climatology moved to 1991–2020, and in 2026 NOAA's ENSO monitoring and NOAAGlobalTemp switched to v6.
    changes:
      - aspect: Period
        before: "1854-01 to present"
        after: "1850-01 to present"
      - aspect: Grid and time resolution
        before: "2° × 2°, monthly mean"
        after: "2° × 2°, monthly mean (unchanged)"
      - aspect: In situ input
        before: "ICOADS Release 3.0 + Argo"
        after: "ICOADS Release 3.0.2 + Argo"
      - aspect: Gap filling (reconstruction)
        before: "Empirical orthogonal teleconnections (EOTs) (v5 reduced spatial filtering and added Arctic EOTs)"
        after: "Replaced by artificial neural network (ANN) interpolation"
      - aspect: Temporal smoothing
        before: "3-month running mean applied"
        after: "3-month running mean removed"
      - aspect: Ship-observation QC
        before: "Existing quality control"
        after: "Adds a nearest-neighbor check against nearby buoy and Argo values"
      - aspect: Large-scale filter
        before: "None"
        after: "Large-scale filter (LS200, scales above 200 km) applied to SST super-observations"
      - aspect: Sea ice and SST in ice-covered regions
        before: "Ice concentration from HadISST2 (to 2015) + NCEP (2016–)"
        after: "Same ice concentration inputs, with a time-varying ice-SST proxy algorithm (bias and RMSD in ice-covered regions reduced by 0.67°C and 0.29°C relative to the ANN-only version)"
      - aspect: Anomaly (ssta) climatology
        before: "1971–2000"
        after: "1991–2020"
      - aspect: Distribution format and location
        before: "NetCDF + ASCII, ersst.v5.YYYYMM.nc (/pub/data/cmb/ersst/v5/netcdf/)"
        after: "NetCDF, ersst.v6.YYYYMM.nc (/pub/data/cmb/ersst/v5/v6/, /data/.../v6/access/). Same file conventions as v5. ASCII is listed in the NCEI metadata but was not found in the public directories"
      - aspect: NOAA operational use
        before: "NOAA ENSO monitoring; ocean component of NOAAGlobalTemp up to 6.0.0"
        after: "NOAA ENSO monitoring and RONI from 2026; NOAAGlobalTemp 6.1.0 (from the January 2026 analysis)"
      - aspect: Accuracy (against observations)
        before: "Baseline"
        after: "Spatial correlation up about 5% and RMSD down 0.03°C over 1850–2021, with the largest gains in the tropical Pacific and the Southern Hemisphere oceans between 60°S and 30°S"
    impacts:
      - Do not splice v5 and v6 into one time series. The interpolation methods differ, so values and spatial patterns differ even for the same month.
      - The anomaly baselines differ, so v5 and v6 ssta cannot be compared directly. Recompute both against the same climatology period first.
      - NOAA ENSO indices based on v6 (such as RONI) may differ from historical ONI values computed from v5. Recheck your list of El Niño and La Niña events.
      - Without the 3-month running mean, v6 can show more month-to-month variability. Account for the smoothing when comparing variance or extremes.
      - Uncertainty estimates for v6 are still in development (announced for release in 2026). If your analysis needs them, check their availability.
    sources:
      - name: Huang et al. (2025) ERSSTv6 Part I
        url: https://doi.org/10.1175/JCLI-D-23-0707.1
      - name: Huang et al. (2025) ERSSTv6 Part II
        url: https://doi.org/10.1175/JCLI-D-24-0185.1
      - name: NCEI Extended Reconstructed SST product page
        url: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
      - name: NCEI news — Key NOAA Dataset Upgraded Using AI (2025-12-04)
        url: https://www.ncei.noaa.gov/node/8486
      - name: NCEI news — AI Supercharges Key NOAA Dataset, Ensuring Peak Accuracy (NOAAGlobalTemp 6.1.0, 2026-04-13)
        url: https://www.ncei.noaa.gov/node/8841
      - name: NOAA PSL Data Notices
        url: https://psl.noaa.gov/data/notices/
      - name: NCAR Climate Data Guide — ERSSTv6
        url: https://climatedataguide.ucar.edu/climate-data/sst-data-noaa-extended-reconstruction-ssts-version-6-ersstv6

period:
  start: "1854-01"
  end: present
  note: >-
    As of 2026-10-11, the NOAA PSL v5 file runs through September 2026. Discontinuation has been announced, so updates may stop.
    Early values (when observations were sparse) are highly uncertain; the official product page notes that data are more reliable after the 1940s.

resolution:
  spatial_short: "222 km (2°)"
  temporal_short: "1개월"
  spatial: "2° × 2° latitude–longitude grid (88°S–88°N)"
  vertical: Sea surface (single level)
  temporal: Monthly mean

coverage:
  short: 전지구
update: Monthly (discontinuation announced)
license: US Government public data — no restrictions on use; please cite the dataset DOI and the reference paper
account_required: false

summary: >-
  ERSST is a global monthly analysis of SST derived from the International Comprehensive Ocean–Atmosphere Dataset (ICOADS), with Argo float data added.
  It is produced on a 2° × 2° grid with spatial completeness enhanced using statistical methods, beginning in January 1854. It uses in situ data only (no satellite data),
  and for many years has been the basis of NOAA's ENSO index (ONI) and the ocean component of the NOAA global temperature dataset (NOAAGlobalTemp).

time_convention:
  summary: >-
    A monthly analysis: every value is the mean SST (or SST anomaly) for that month. The time value only labels the month and is not an instantaneous value at a particular time.
  points:
    - "The NOAA PSL file (sst.mnmean.nc) gives the statistic as 'Mean' and the averaging period (avg_period) as one month."
    - "The original NCEI files (ersst.v5.YYYYMM.nc) hold one month each, and the day used for the time stamp (the 1st or the 15th) varies between distributors. For example, the ERDDAP mirror labels time as 'Start Time', yet its first value is 1854-01-01 and its last 2026-08-15. Match records by year and month, not by date."
    - "Anomalies (ssta) are relative to the 1971–2000 monthly climatology. The successor v6 uses 1991–2020."
  source: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
  source_name: NCEI ERSST product page / NOAA PSL and ERDDAP file metadata

variables:
  note: Variable names are those in the original NCEI NetCDF files. The NOAA PSL single-file version (sst.mnmean.nc) contains only sst.
  full_list: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C00927
  groups:
    - name: Sea surface temperature
      kind: mean
      period: Monthly
      items:
        - "Monthly mean sea surface temperature — `sst` (°C)"
        - text: "Sea surface temperature anomaly (relative to the 1971–2000 climatology) — `ssta` (°C)"
          kind: mean
          period: Monthly
          note: Monthly mean SST minus the 1971–2000 monthly climatology

access:
  - name: NCEI direct download (monthly NetCDF)
    url: https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/netcdf/
    login: false
    method: HTTPS (wget / curl)
    note: One file per month, named ersst.v5.YYYYMM.nc. ASCII files are in the ascii/ folder alongside.
  - name: NOAA PSL (full record in one file)
    url: https://psl.noaa.gov/data/gridded/data.noaa.ersst.v5.html
    login: false
    method: Web download / THREDDS / OPeNDAP
    note: The full record is in a single file, sst.mnmean.nc, which is convenient to use directly. Climatology files (e.g. 1991–2020) are also provided.
  - name: NOAA CoastWatch ERDDAP (nceiErsstv5)
    url: https://coastwatch.pfeg.noaa.gov/erddap/info/nceiErsstv5/index.html
    login: false
    method: ERDDAP (choose region and period, then NetCDF, CSV, etc.)
    note: A mirror that re-downloads the NCEI files each month, so new months appear a few days later.

tips:
  - For new work, use ERSST v6. NOAA's ENSO monitoring, the RONI index and NOAAGlobalTemp have already moved to v6.
  - v5 and v6 use different anomaly climatologies (v5 1971–2000, v6 1991–2020). Do not compare their ssta fields directly.
  - Do not splice v5 and v6 into one time series. The interpolation methods differ, so values differ even for the same month.
  - If you need v5, for example to reproduce a paper, download the full record now. Distribution locations may change once updates stop.

