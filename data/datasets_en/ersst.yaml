notices:
  - date: "2026-10-02"
    level: warning
    title: "NCEI Data Access Delays (cloud migration, planned through 2026-10-30)"
    body: Downloads from NCEI servers may be slow or fail while NCEI moves its data and applications to the cloud. If they do, use the PSL or ERDDAP copies.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2026-08-03"
    level: info
    title: ERSSTv6 is the new official SST dataset for NOAA ENSO monitoring
    body: NOAA ERSSTv6 is now the official SST dataset used by NOAA to determine the current ENSO phase, and the RONI (Relative Oceanic Niño Index) has been updated to use ERSSTv6.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-04-26"
    level: critical
    title: ERSSTv5 to be discontinued (June 2026)
    body: >-
      NOAA PSL announced that "the NOAA ERSSTv5 dataset will be discontinued by NOAA/NCEI in June 2026" and replaced by ERSSTv6.
      As of October 2026, v5 files are still being updated, but updates could stop at any time.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-04-13"
    level: info
    title: NOAAGlobalTemp 6.1.0 switches its ocean component to ERSST v6
    body: Starting with the January 2026 analysis, NOAA's global temperature dataset NOAAGlobalTemp 6.1.0 uses ERSST version 6.
    source: https://www.ncei.noaa.gov/node/8841
  - date: "2026-03-06"
    level: info
    title: NOAA ERSST V6 added to NOAA PSL
    body: PSL added NOAA ERSST V6 (monthly, from 1850) to its data collection and began updating it monthly.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-12-04"
    level: warning
    title: ERSST v6 released — Key NOAA Dataset Upgraded Using AI
    body: >-
      NCEI released ERSST v6, which uses artificial neural network interpolation. Compared with v5, spatial correlation with observations increases by 5% and RMSD decreases,
      with larger improvements in the tropical Pacific, the Southern Hemisphere oceans between 60°S and 30°S, and ice-covered regions.
    source: https://www.ncei.noaa.gov/node/8486

