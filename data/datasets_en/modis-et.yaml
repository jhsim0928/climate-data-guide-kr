# ─────────────────────────────────────────────────────────────
# MODIS evapotranspiration MOD16/MYD16 C6.1 — dataset information file
# Land tab (Evapotranspiration). Deprecated ahead of the end of Terra and Aqua. The VIIRS successor (VNP16/VJ116) V2 was withdrawn on 2026-08-17,
# so it has no page on this site (when V2.1 is released, create a viirs-et page and add to_id to the transitions).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-et
name: "MODIS ET (MOD16)"
full_name: MODIS/Terra and Aqua Net Evapotranspiration MOD16A2(GF), MYD16A2(GF), MOD16A3GF, MYD16A3GF Version 6.1 (global 500 m actual and potential evapotranspiration from MODIS)
category: satellite
domain: land
group: 증발산
order: 20
domains: [육지, 수문, 원격탐사]
provider: NASA MODIS Land Team (MOD16 developers Running, Mu, Zhao, Moreno) / NASA LP DAAC

status: deprecated
status_note: >-
  Collection 6.1 is still produced every 8 days (on 2026-10-13 the latest composite was 22–29 September 2026), but Terra and Aqua are drifting out of their orbits because of fuel and power limits
  and are expected to begin shutting down in late 2026 to early 2027, and NASA advises users to move to similar VIIRS products. However, the VIIRS evapotranspiration successor (VNP16/VJ116) V2
  was withdrawn on 17 August 2026 because of data issues, with no date announced for the V2.1 reprocessing, so for now there is no NASA satellite ET product that replaces MODIS.

period:
  start: "2000-02"
  end: present
  note: >-
    The year-end gap-filled (GF) products are the long-term record. MOD16A2GF starts in 2000 (CMR lists 2000-01-01; Terra data begin in late February 2000) and MYD16A2GF in 2002 (Aqua data from 2002-07-04),
    both running to December 2025 (the 2025 files were produced on 2026-02-05). The non-gap-filled forward products (MOD16A2, MYD16A2) only start on 2021-01-01 in V6.1 and, on 2026-10-13, extended to the 2026-09-22–29 composite.
    Yearly data exist in CMR only as GF products (MOD16A3GF, MYD16A3GF), up to 2025.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "8일"
  spatial: "MODIS Sinusoidal (SIN) tile grid, 500 m (tiles hXXvYY, global vegetated land). Meteorological input (GMAO reanalysis, 0.5°×0.6° or 1°×1.25°) is interpolated to the 500 m grid"
  vertical: Single surface layer (total ET = soil evaporation + wet canopy evaporation + plant transpiration)
  temporal: >-
    8-day composites (starting 1 January each year; the last period of the year is 5 days, or 6 in leap years) / yearly (A3GF). The algorithm runs daily and the values are then summed or averaged.

update: "Forward 8-day products (MOD16A2, MYD16A2) appear one to two weeks after the period ends (the 2026-09-22–29 composite was produced on 7–8 October) / GF 8-day and yearly products are produced once, early in the following year, after a full year of LAI/FPAR is available (2025 data on 2026-02-05)"
license: Openly shared without restriction under the NASA EOSDIS Data Use and Citation Guidance. Downloading requires a free NASA Earthdata Login; citation of the dataset DOI is requested.
account_required: true

summary: >-
  MOD16 is a Level 4 product that feeds MODIS leaf area index and fraction of absorbed PAR (LAI/FPAR), albedo and land cover, together with daily GMAO meteorological reanalysis,
  into a Penman-Monteith-based algorithm (Mu et al., 2011) to estimate actual evapotranspiration (ET), latent heat flux (LE), potential ET (PET) and potential LE (PLE) over global vegetated land at 500 m every 8 days.
  There are Terra (MOD16) and Aqua (MYD16) versions; the year-end gap-filled (GF) products, rebuilt after poor-quality LAI/FPAR values in the full year are replaced by temporal interpolation, are the research standard.
  It is widely used for water balance, drought and agricultural water use studies, but has no values over urban, barren, water and permanent snow/ice pixels.

time_convention:
  summary: >-
    ET and PET are totals over the 8-day period (one year for the yearly product) in kg m-2 (= mm), while LE and PLE are daily averages over the same period (J m-2 day-1).
    The file date (AYYYYDDD) is the first day of the composite; periods start on 1 January (DOY 001) and run in 8-day steps, and only the last period of the year is 5 days (6 in leap years).
  points:
    - "Do not simply average ET_500m. The last period of the year (file date DOY 361, 27–31 December) is a 5- or 6-day total and looks smaller than the others. For monthly or annual totals, weight by days or convert to a daily mean by dividing by the period length first."
    - "To convert LE and PLE (J m-2 day-1) to W m-2, divide by 86400. The 8-day ET total (mm) and the daily mean LE are different temporal statistics."
    - "The 8-day periods do not line up with calendar months (e.g. A2023001 = 1–8 January, A2023025 = 25 January–1 February). For monthly totals, apportion each period by the fraction of days in each month."
    - "The algorithm computes daily values from daily meteorological inputs and then sums or averages them over 8 days (or a year). Values are not instantaneous at the satellite overpass."
    - "The Terra (MOD16, nominal 10:30 descending node) and Aqua (MYD16, 13:30 ascending node) versions are built from each satellite's own MODIS input products and differ slightly. Terra stopped orbit maintenance in 2020 and Aqua in 2021, so their crossing times have shifted (Terra earlier, Aqua later); this reaches ET indirectly through the reflectance-based inputs (LAI/FPAR, albedo). No official quantitative assessment for ET has been published yet."
    - "GF products are recomputed for the whole year at year end, so for the same date the forward (MOD16A2) and gap-filled (MOD16A2GF) values differ."
  source: https://lpdaac.usgs.gov/documents/931/MOD16_User_Guide_V61.pdf
  source_name: "MOD16 C6.1 User's Guide (LP DAAC) + MOD16A2GF and MOD16A2 V061 collection descriptions (CMR)"

variables:
  note: >-
    Science datasets (SDS) from the LP DAAC data catalog and the C6.1 User's Guide. In the HDF-EOS2 (HDF4) files, physical value = stored value × scale_factor;
    in the 8-day files, stored values 32761–32767 are fill values marking non-vegetated land cover classes and must be removed first. MYD16 (Aqua) files use the same names.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mod16a2gf-061
  groups:
    - name: 8-day data (MOD16A2GF, MYD16A2GF year-end gap-filled / MOD16A2, MYD16A2 forward)
      kind: accum
      period: "8 days (5–6 days in the last period of the year)"
      items:
        - text: "Actual evapotranspiration, 8-day total — `ET_500m` (kg m-2 8day-1 = mm, scale 0.1)"
          note: Sum of daily ET over 8 days (5–6 days at year end). 32761–32767 are fill values
        - text: "Potential evapotranspiration, 8-day total — `PET_500m` (kg m-2 8day-1, scale 0.1)"
          note: 8-day total. 32761–32767 are fill values
        - text: "Latent heat flux, 8-day mean — `LE_500m` (J m-2 day-1, scale 10000)"
          kind: mean
          note: Average daily energy over the 8 days. W m-2 = value ÷ 86400
        - text: "Potential latent heat flux, 8-day mean — `PLE_500m` (J m-2 day-1, scale 10000)"
          kind: mean
          note: Average daily energy over the 8 days
        - text: "Quality bits — `ET_QC_500m` (bit field: 0 MODLAND_QC, 1 sensor Terra/Aqua, 2 dead detector, 3–4 cloud state, 5–7 LAI/FPAR retrieval method)"
          kind: instant
          note: Quality information on the LAI/FPAR input. The User's Guide notes that in the gap-filled products it mainly indicates whether interpolated LAI/FPAR was used
    - name: Yearly data (MOD16A3GF, MYD16A3GF, gap-filled only)
      kind: accum
      period: Yearly
      items:
        - text: "Actual evapotranspiration, annual total — `ET_500m` (kg m-2 yr-1, scale 0.1)"
          note: Sum of daily values over the year. 65529–65535 are fill values
        - text: "Potential evapotranspiration, annual total — `PET_500m` (kg m-2 yr-1, scale 0.1)"
        - text: "Latent heat flux, annual mean — `LE_500m` (J m-2 day-1, scale 10000)"
          kind: mean
          note: Average daily energy over the year
        - text: "Potential latent heat flux, annual mean — `PLE_500m` (J m-2 day-1, scale 10000)"
          kind: mean
        - text: "Share of interpolated input — `ET_QC_500m` (%, percentage of growing-season days that used gap-filled LAI/FPAR)"
          kind: mean
          note: A percentage, not a bit field as in the 8-day files. 249–255 are fill values

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2565791021-LPCLOUD
    method: HTTPS download / earthaccess / Earthdata Search
    note: >-
      Short names are MOD16A2GF and MYD16A2GF (8-day gap-filled), MOD16A3GF and MYD16A3GF (yearly gap-filled), and MOD16A2 and MYD16A2 (8-day forward), all version 061.
      Files are served over HTTPS from data.lpdaac.earthdatacloud.nasa.gov and need a free Earthdata Login. Distribution through the old LP DAAC Data Pool ended on 2025-06-30.
  - name: AppEEARS (area and point subsetting)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Web / API — point time series and area extracts as GeoTIFF or NetCDF4
    note: Lets you request only the area, period and layers you need and reproject to geographic coordinates, which is convenient for small regions.
  - name: Direct access in AWS us-west-2 (S3)
    url: https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials
    method: Cloud storage (S3, from within us-west-2 only)
    note: Stored under paths such as s3://lp-prod-protected/MOD16A2GF.061/ and accessed with temporary credentials.

example:
  lang: python
  note: >-
    Downloads the Terra 8-day gap-filled tiles around the Korean Peninsula for July 2023 with earthaccess and reads them with pyhdf (the files are HDF4, which xarray's default engines may not open).
    Remove the fill values (32761 and above) first.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MOD16A2GF", version="061",
        temporal=("2023-07-01", "2023-07-31"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "mod16")

    hdf = SD(files[0], SDC.READ)
    raw = hdf.select("ET_500m").get().astype("float64")
    raw[raw > 32700] = np.nan          # 32761–32767: water, barren, urban, snow/ice and other fill
    et = raw * 0.1                      # mm per 8 days (5–6 days in the last period of the year)
    qc = hdf.select("ET_QC_500m").get()
    print(files[0], np.nanmean(et))

tips:
  - "Use the year-end gap-filled products (MOD16A2GF, MYD16A2GF, MxD16A3GF) for research. The forward MOD16A2 is a near-real-time product that substitutes a recent 5-year LAI/FPAR climatology for cloudy inputs, and in V6.1 it only starts in 2021."
  - "Stored ET_500m values of 32761–32767 (65529–65535 in yearly files) are not missing data but non-vegetated land cover flags (32766 water, 32765 barren or sparsely vegetated, 32764 permanent snow/ice, 32763 wetland, 32762 urban, 32761 unclassified). Remove them before applying the scale factor or absurd values will creep in."
  - "Units differ. ET and PET are 8-day totals (mm); LE and PLE are daily averages (J m-2 day-1, scale 10000). The last period of each year is a 5- or 6-day total."
  - "Biome parameters are fixed per MODIS land cover class (IGBP 17 classes, 3-year smoothed), so land cover misclassification passes straight into ET error and regional variation within a biome is not captured. Pixels with no valid albedo during a year are computed with an albedo of 0.4."
  - "The meteorological input is GMAO reanalysis (0.5°×0.6° or 1°×1.25°) interpolated to 500 m, so in mountains and along coasts, where weather changes sharply, the product does not carry 500 m-scale meteorological detail."
  - "The first GF year (2000 for Terra, 2002 for Aqua) is less reliable because the start of the year has no observations to interpolate from."
  - "Data come in MODIS Sinusoidal tiles (the Korean Peninsula is mostly h27v05 and h28v05). Reproject with GDAL or rioxarray, or use AppEEARS, to get a latitude-longitude grid."
  - "Terra and Aqua are expected to shut down from late 2026 onward, and the VIIRS ET successor was withdrawn on 2026-08-17. If you need to extend a long time series, watch both the MODIS end-of-mission and the VIIRS V2.1 release notices."

