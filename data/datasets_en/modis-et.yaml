transitions:
  - from: MOD16 C6
    to: MOD16 C6.1
    status: completed
    date: "2021-03"
    summary: >-
      The science algorithm is unchanged; the input MODIS L1B calibration improved and gap handling changed. C6 left pixels with contaminated LAI/FPAR as fill values, leaving many gaps,
      whereas C6.1 fills them with climatological LAI/FPAR and gap-filled albedo as backup inputs. Distribution of C6 ended on 2023-07-31.
    changes:
      - aspect: Science algorithm
        before: Penman-Monteith-based MOD16 (Mu et al., 2011)
        after: Unchanged
      - aspect: Input L1B calibration
        before: C6 calibration
        after: "Revised response-versus-scan-angle approach for reflective bands, optical crosstalk correction for Terra IR bands, corrected Terra forward look-up table for 2012–2017, polarization correction"
      - aspect: LAI/FPAR gaps (forward product)
        before: Contaminated LAI/FPAR pixels left as fill values
        after: Backup input from the mean of the best LAI/FPAR for each 8-day period over the past 5 years (MCD15A2HCL climatology)
      - aspect: Albedo
        before: No gap filling
        after: Gap-filled albedo (Sun et al., 2017) used for GF and backup processing
      - aspect: Coverage (8-day forward product)
        before: "2000 onward (MOD16A2 V006)"
        after: "V061 MOD16A2 and MYD16A2 start on 2021-01-01; use the GF products for earlier years"
      - aspect: File format
        before: HDF-EOS2
        after: Same (variable names and format unchanged)
    impacts:
      - Do not mix C6 and C6.1; download the full period again from the C6.1 GF products (C6 has not been distributed since 2023-07-31).
      - The C6.1 forward product has fewer gaps thanks to the backup inputs, but pixels filled with climatological LAI/FPAR do not reflect the actual vegetation state of that year.
    sources:
      - name: MOD16 C6.1 User's Guide
        url: https://lpdaac.usgs.gov/documents/931/MOD16_User_Guide_V61.pdf
      - name: "Final Notice: MODIS Version 6.0 Land Data Products Decommissioned July 31, 2023"
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023
  - from: MODIS evapotranspiration MOD16/MYD16 C6.1
    to: VIIRS evapotranspiration VNP16/VJ116 V2.1 (not yet released)
    status: planned
    summary: >-
      To prepare for the end of MODIS, NASA released VNP16, VJ116 and VJ216 V2 — the same MOD16 algorithm applied to VIIRS on Suomi NPP, NOAA-20 and NOAA-21 — in 2025–2026,
      but withdrew all of them on 2026-08-17 after data issues were found, stating that they are not of science quality and should not be used. They will be reprocessed as V2.1 once the issues are fixed; no date has been set.
    changes:
      - aspect: Availability
        before: "MOD16 and MYD16 C6.1 in production (to stop when Terra and Aqua end)"
        after: "VIIRS V2 withdrawn and removed on 2026-08-17; V2.1 reprocessing planned (no date). On 2026-10-13 CMR had no public VIIRS ET collection"
      - aspect: Algorithm
        before: Penman-Monteith-based MOD16
        after: Same algorithm family (designed to continue the MODIS ET series), with VIIRS LAI/FPAR and albedo as inputs
      - aspect: Satellites and overpass time
        before: "Terra (10:30 descending, drifting) and Aqua (13:30 ascending, drifting)"
        after: "Suomi NPP, NOAA-20 and NOAA-21 (13:30 ascending). Suomi NPP data delivery is scheduled to end in early November 2026"
      - aspect: Resolution and product set
        before: "500 m SIN, 8-day (MOD16A2, A2GF), yearly (A3GF)"
        after: "500 m SIN, 8-day (VNP16A2, A2GF), yearly (A3GF only) — as in V2"
      - aspect: File format
        before: HDF-EOS2 (HDF4)
        after: HDF-EOS5 (HDF5)
    impacts:
      - If you already downloaded the withdrawn VIIRS ET V2 files, do not use them for research. NASA has stated V2 is not of science quality.
      - Even after V2.1 is released, check the differences between the two records over their overlap before joining them. In particular, no VIIRS satellite continues Terra's morning observations.
    sources:
      - name: VIIRS Actual and Potential Evapotranspiration Data Products Unavailable (LP DAAC, 2026-08-17)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-actual-potential-evapotranspiration-data-products-unavailable
      - name: VIIRS Version 2 Actual and Potential Evapotranspiration Data Products Released (LP DAAC, 2025-07-10)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-actual-potential-evapotranspiration-data-products-released
      - name: VIIRS Land — NASA Evapotranspiration and Potential Evapotranspiration
        url: https://viirsland.gsfc.nasa.gov/Products/NASA/ET_ESDR.html

notices:
  - date: "2026-08-17"
    level: warning
    title: Successor VIIRS evapotranspiration V2 fully withdrawn — V2.1 reprocessing planned, no date set
    body: >-
      Citing newly discovered issues in the data, LP DAAC removed all VIIRS evapotranspiration (VNP16, VJ116, VJ216) V2 products from Suomi NPP, NOAA-20 and NOAA-21 from the archive
      and disabled them in AppEEARS. It states that the data are not of science quality and should not be used in any research or application, and that they will be reprocessed as V2.1 once the issues are resolved.
      Until then there is no NASA VIIRS product continuing MODIS ET.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-actual-potential-evapotranspiration-data-products-unavailable
  - date: "2026-03-20"
    level: warning
    title: NASA projects end of science for Terra in February 2027 and Aqua in September 2027
    body: >-
      The editor's note in the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects that, because of fuel and power limits, science operations will end
      in February 2027 for Terra, September 2027 for Aqua and August 2028 for Aura, with the missions operating until then. This is later than the earlier plans (Terra in December 2025, Aqua in August 2026).
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-03-18"
    level: info
    title: MODIS L1B and geolocation Version 7.0 released — land products still C6.1
    body: >-
      LAADS DAAC released MODIS calibrated radiances and geolocation V7.0 and announced that the V6.1 Level-1 collection would be decommissioned after 2026-09-30.
      On 2026-10-13, CMR listed only V061 for MOD16 and other land products, and no release schedule for C7 land products had been confirmed in an official notice.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2026-01-08"
    level: warning
    title: Impact of Terra and Aqua orbit drift on MODIS data under investigation (LDOPE)
    body: >-
      The MODIS Land Data Operational Product Evaluation team (LDOPE) reported that, as Terra and Aqua drift after ending orbit maintenance, pixel size and spacing, scan gaps,
      bow-tie overlap and diurnal sampling have changed, with significant impacts seen from late 2024, and that the effects on MODIS products are under investigation.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: info
    title: LP DAAC Data Pool distribution of MODIS ends (2025-06-30) — move to Earthdata Cloud
    body: >-
      LP DAAC ended Data Pool distribution of all MODIS datasets, including C6.1, on 30 June 2025. Scripts using Data Pool URLs must switch to Earthdata Cloud (HTTPS or earthaccess);
      Earthdata Search and AppEEARS continue to work.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua to begin shutting down in late 2026 to early 2027
    body: >-
      NASA announced that Terra and Aqua will begin shutting down in late 2026 or early 2027, and that both platforms are drifting from their designed orbits, changing crossing times and possibly affecting the data.
      A final reprocessing of MODIS data will follow the end of data collection, and users are encouraged to explore similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS V6.0 land products decommissioned (2023-07-31) — move to V6.1
    body: >-
      LP DAAC stopped distributing MODIS V6.0 land products, including MOD16, on 31 July 2023. User guides and ATBDs remain on the DOI landing pages; use V6.1 for data.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

