# ─────────────────────────────────────────────────────────────
# GNSS radio occultation (RO) — UCAR CDAAC (COSMIC-2 and others) and EUMETSAT ROM SAF — dataset information file (English edition)
# Satellite tab (Temperature and water vapour). Processing centres and product levels (bending angle, refractivity, dry/wet temperature, water vapour, monthly grids) on one page.
# As of 2026-10, COSMIC-2 near-real-time processing is running normally; ROM SAF climate data are CDR v1.0 (2001-09 to 2016-12) plus the Metop ICDR (2017-01 onward).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gnss-ro
name: "GNSS-RO (COSMIC-2·ROM SAF)"
full_name: GNSS Radio Occultation — UCAR CDAAC (COSMIC-2, Metop, commercial RO and others) and EUMETSAT ROM SAF climate data records
category: satellite
domain: satellite
group: 기온·수증기
order: 40
domains: [대기, 원격탐사]
provider: UCAR COSMIC Program Data Processing Center (CDAAC) / EUMETSAT ROM SAF (consortium of DMI, Met Office, ECMWF, IEEC and WEGC)

status: active
status_note: >-
  COSMIC-2 (FORMOSAT-7) near-real-time data are produced every day (as checked on 2026-10-13, Level 2 for day 284 of 2026, i.e. 11 October, was posted on 12 October). Post-processed (postProc) Level 2 stops in May 2022.
  ROM SAF provides a multi-mission climate data record (CDR v1.0, 2001-09 to 2016-12) and its Metop extension (ICDR, 2017-01 onward), with the next reprocessing announced for 2026.
  Metop-A reached end of life in November 2021, and bending angles from its successor Metop-SG A1 (Metop-D, launched 2025-08-13) have been disseminated since November 2025.

transitions:
  - from: ROM SAF CDR v1.0 (GRM-28/29/30/32/33-R1) + Metop ICDR (GRM-29-I1)
    to: Next ROM SAF reprocessed climate record (CDR v2.0 series)
    status: planned
    summary: >-
      The ROM SAF product status table now includes a 'CDR v2.0 (+ICDR v2)' column, and the operations reports announce the next reprocessing for 2026. No release date or DOI has been confirmed yet.
    changes:
      - aspect: Period
        before: CDR 2001-09 to 2016-12, ICDR (Metop) 2017-01 to present
        after: To be announced (to be extended by the reprocessing)
      - aspect: Input missions (status table)
        before: Metop, COSMIC, CHAMP, GRACE (+ Metop ICDR)
        after: Metop, COSMIC, CHAMP, GRACE (+ Metop ICDR) — planetary boundary layer height (PBLH) not in the v2.0 list
      - aspect: CDS distribution
        before: Only the monthly gridded humidity distributed through the C3S CDS
        after: Monthly gridded dry temperature to be added to the CDS after the reprocessing
    impacts:
      - When the new version appears, join CDR and ICDR of the same version; do not mix, for example, a v1 CDR with a v2 ICDR.
      - State the product ID (e.g. GRM-29-R1, GRM-29-I1) and version in publications.
    sources:
      - name: ROM SAF Product Status overview (2026-06-22)
        url: https://rom-saf.eumetsat.int/product_documents/Product_status_overview_2026-06-22.pdf
      - name: ROM SAF News Archive (operations report notices)
        url: https://rom-saf.eumetsat.int/previous_news.php

period:
  start: "2001-09"
  end: present
  note: >-
    ROM SAF CDR v1.0 covers September 2001 to December 2016 (CHAMP, GRACE, COSMIC, Metop) and the Metop ICDR starts in January 2017. COSMIC-2 near-real-time data run from 1 October 2019 to the present,
    and post-processed Level 2 covers 2019 to May 2022 (day 151 of 2022). UCAR CDAAC also holds earlier missions such as GPS/MET (1995), CHAMP and COSMIC-1 (reprocessings repro2013 and repro2021).

resolution:
  spatial_short: "555 km (5°)"
  temporal_short: "1일"
  spatial: >-
    Level 1b and 2 are one vertical profile per occultation (tangent-point latitude and longitude, drifting horizontally with height). COSMIC-2 is a six-satellite constellation at 24° inclination, concentrated at low latitudes, producing more than 4,000 profiles a day.
    ROM SAF Level 3 is a monthly grid of 5° latitude bands × 200 m height (longitude dimension of one); the UCAR RO CDR temperature is on a 5° × 10° latitude-longitude grid.
  vertical: >-
    atmPrf (COSMIC-2) at full resolution; wetPf2 at 100 m mean-sea-level altitude spacing. ROM SAF Level 3 uses impact altitude for bending angle and mean-sea-level altitude for refractivity, temperature and specific humidity, at 200 m spacing up to 40 km or 50 km
  temporal: >-
    Profiles are observations at the occultation time (bundled daily). COSMIC-2 near-real-time by 02 UTC the next day, post-processed about 6 weeks behind. ROM SAF Level 3 and the UCAR CDR are monthly means

coverage:
  short: 전지구
  note: "COSMIC-2 concentrates on low latitudes (roughly 40°S–40°N); Metop is global"
update: "COSMIC-2 near real time: daily (by 02 UTC the next day) / ROM SAF Metop ICDR and Offline: about 5 days to 6 months after measurement / UCAR RO CDR monthly grids: released in periodic bundles"
license: "UCAR CDAAC data are free with no login and DOI citation is requested. ROM SAF products are CC BY 4.0 and need free registration and login to download"
account_required: false

summary: >-
  Low-Earth-orbit satellites measure how much GNSS (GPS, GLONASS, Galileo and others) signals bend as they graze the atmosphere (the bending angle), from which refractivity and profiles of temperature, pressure and water vapour are derived.
  Because the measurement is a phase delay referenced to atomic clocks, it has almost no instrument calibration bias and is unaffected by clouds, making it a climate benchmark for upper-tropospheric and stratospheric temperature and an 'anchor' that reanalyses assimilate without bias correction.
  In the US, UCAR CDAAC produces Level 0–2 data for COSMIC-2 and many other missions; in Europe, EUMETSAT ROM SAF produces Metop-centred near-real-time and offline data and multi-mission climate records (CDR and ICDR).

time_convention:
  summary: >-
    Level 1b and 2 profiles are observations made at the time of the occultation (start and stop times are recorded in each file) and are distributed in daily bundles (tar). ROM SAF Level 3 and the UCAR RO CDR are monthly means of the profiles falling in each grid cell.
  points:
    - "In COSMIC-2 atmPrf files the start and stop times (`start_time`, `stop_time`) are in GPS seconds; the date and time are also given as file attributes (year, month, day, hour, minute, second)."
    - "atmPrf temperature (`Temp`) and pressure (`Pres`) are 'dry' values that ignore water vapour. In the moist lower troposphere they are colder than the real temperature, so use 1D-Var products (wetPf2, ROM SAF 1D-Var), which include background information, at those heights."
    - "wetPf2 separates refractivity into temperature, pressure and water vapour using a forecast or analysis as background, so it mixes in model information. The pure observational information is in the bending angle and refractivity."
    - "Near-real-time versions (COSMIC-2 nrt, ROM SAF NRT) are produced quickly for forecast assimilation; post-processed and reprocessed versions re-apply precise orbits and corrections and are better suited to climate work. COSMIC-2 post-processed Level 2 is not available after May 2022."
    - "COSMIC-2's 24° inclination concentrates occultations at low latitudes; polar sampling comes from Metop and commercial missions (Spire, PlanetiQ)."
    - "Monthly grids carry sampling error because occultations fall irregularly. ROM SAF supplies a sampling-error estimate (`_samperr`), while the UCAR RO CDR applies no sampling-error correction (generally below 0.2 K for zonal monthly means outside polar regions)."
  source: https://cdaac-www.cosmic.ucar.edu/cdaac/cgi_bin/fileFormats.cgi?type=atmPrf
  source_name: CDAAC file format documents (atmPrf, wetPf2) + COSMIC-2 Data page + ROM SAF Level 3 Product User Manual v3.2

variables:
  note: >-
    COSMIC-2 (CDAAC) names are from the CDAAC file format documents. ROM SAF Level 3 grids come in one file per variable (six-letter product code in the file name, e.g. RRGMET, RTGMET),
    and the Level 3 Product User Manual (v3.2, Section 5.3) shows only the refractivity file header (`REF`), so in-file names of the other variables are left blank.
    Check ROM SAF Level 1b/2 and other Level 3 variable names in your files.
  full_list: https://cdaac-www.cosmic.ucar.edu/cdaac/doc/formats.html
  groups:
    - name: COSMIC-2 Level 2 atmPrf (dry retrieval, full resolution)
      kind: instant
      period: occultation time
      items:
        - "Bending angle (raw) — `Bend_ang` (rad)"
        - "Optimized bending angle — `Opt_bend_ang` (rad)"
        - "Impact parameter — `Impact_parm` (km)"
        - "Refractivity — `Ref` (N)"
        - "Dry temperature — `Temp` (°C)"
        - "Dry pressure — `Pres` (hPa)"
        - "Mean-sea-level altitude — `MSL_alt` (km)"
    - name: COSMIC-2 Level 2 wetPf2 (1D-Var moist retrieval, 100 m spacing)
      kind: instant
      period: occultation time
      items:
        - "Temperature — `Temp` (°C)"
        - "Water vapour pressure — `Vp` (hPa)"
        - "Pressure — `Pres` (hPa)"
        - "Observed refractivity (interpolated from atmPrf) — `Ref_obs` (N)"
    - name: ROM SAF Level 3 monthly grids (CDR and ICDR)
      kind: mean
      period: Monthly
      items:
        - text: "Refractivity — `REF` (N-units)"
          note: Standard deviation, measurement uncertainty, sampling error and data count are `REF_stdev`, `REF_obssig`, `REF_samperr` and `REF_num`; the a priori fraction is `Wref`
        - "Bending angle — (mrad)"
        - "Dry temperature — (K)"
        - "1D-Var temperature — (K)"
        - "1D-Var specific humidity — (g/kg)"
        - "Tropopause height — (m)"

access:
  - name: UCAR CDAAC data archive (COSMIC-2, Metop, commercial RO, COSMIC-1 and others)
    url: https://data.cosmic.ucar.edu/gnss-ro/
    method: Direct HTTPS download (no login; tar.gz by date and level)
    note: >-
      COSMIC-2 near-real-time Level 2 is under cosmic2/nrt/level2/<year>/<day-of-year>/ as daily bundles of atmPrf, wetPf2, bfrPrf (BUFR) and others.
      The monthly gridded climate record (UCAR RO CDR) is under gridded/cdr/.
  - name: COSMIC-2 data guide (processing streams, latency, citation)
    url: https://www.cosmic.ucar.edu/what-we-do/cosmic-2/data
    method: Web
  - name: EUMETSAT ROM SAF product archive (NRT, Offline, CDR, ICDR)
    url: https://rom-saf.eumetsat.int/product_archive.php
    method: Web download (free registration and login, netCDF)
    note: Monthly gridded humidity is also distributed through the C3S Climate Data Store. Products are CC BY 4.0.

example:
  lang: python
  note: "Downloads a no-login COSMIC-2 near-real-time wetPf2 daily bundle (about 200 MB), extracts it and opens the first profile. Member names may not end in .nc, so they are not filtered by extension."
  code: |
    # pip install requests xarray netCDF4
    import tarfile, requests, xarray as xr

    url = ("https://data.cosmic.ucar.edu/gnss-ro/cosmic2/nrt/level2/"
           "2026/284/wetPf2_nrt_2026_284.tar.gz")          # day 284 of 2026 (11 October)
    with open("wetPf2.tar.gz", "wb") as f:
        f.write(requests.get(url, timeout=600).content)

    with tarfile.open("wetPf2.tar.gz") as tar:
        members = [m for m in tar.getmembers() if m.isfile()]
        tar.extractall("wetPf2", members=members[:1])     # extract a single profile

    ds = xr.open_dataset("wetPf2/" + members[0].name, engine="netcdf4")
    print(ds[["MSL_alt", "Temp", "Vp", "Pres"]])           # altitude (km), temperature (°C), vapour pressure (hPa), pressure (hPa)

tips:
  - "COSMIC-2 atmPrf `Temp` is in Celsius and `Pres` in hPa (written mb in the files). Convert units before comparing with reanalyses (K, Pa)."
  - "atmPrf carries a quality flag `bad` (1 means the profile failed QC). Remove those before computing statistics."
  - "atmPrf attributes include the lowest height of the straight-line GPS–LEO path (`hslbot`) and signal-quality indicators (`snr1avg`, `s4` and others). Use them to select profiles for lower-tropospheric analysis."
  - "The COSMIC-2 initial-operations notice (2020-03) reported larger bias and standard deviation at about 19–29 km for GPS L2P occultations than for others. Split by signal type for precise lower-stratosphere work."
  - "Dry temperature equals the real temperature only where water vapour is negligible, in the upper troposphere and stratosphere. ROM SAF and UCAR climate records mainly provide dry-temperature grids in that range (UCAR CDR temperature 10–40 km)."
  - "ROM SAF CDR (2001–2016) and ICDR (2017 onward) come from different processing systems, so there may be a seam. Use a matching CDR–ICDR pair (e.g. GRM-29-R1 + GRM-29-I1) and mark the join."
  - "Metop-A ended in November 2021, so later Metop data come from Metop-B and -C (and from November 2025 also Metop-SG A1). Check for sampling changes when the satellite mix changes."
  - "The UCAR RO CDR monthly grids use COSMIC-2 only between 30°N and 30°S and drop Spire data south of 60°S, so the mission mix varies with latitude."

