notices:
  - date: "2026-04-28"
    level: info
    title: Report on Metop-SG A1 (Metop-D) radio occultation data published
    body: >-
      ROM SAF Report 49 states that Level 1 bending angles from EPS-SG A1 (Metop-D), launched on 13 August 2025, have been on EUMETCast since 6 November 2025 at about 1,200 occultations a day.
      Observation-minus-background standard deviations were smaller than for Metop-B and -C, PlanetiQ and Spire, and the Met Office expected operational assimilation around June 2026.
    source: https://rom-saf.eumetsat.int/previous_news.php#April28-26_205
  - date: "2026-03-20"
    level: info
    title: ROM SAF demonstration dataset — decadal atmospheric temperature trends (CDR GRM-28-R1 + ICDR GRM-29-I1)
    body: >-
      ROM SAF released sampling-error-corrected decadal trends computed from monthly grids that join the multi-mission CDR (GRM-28-R1) for 2002–2016 with the Metop ICDR (GRM-29-I1) afterwards.
      It is a useful official example of joining CDR and ICDR.
    source: https://rom-saf.eumetsat.int/previous_news.php
  - date: "2024-03-08"
    level: info
    title: ROM SAF Metop near-real-time processing updated (GPAC 3.4) — file names and attributes changed
    body: >-
      The Metop near-real-time processor moved from GPAC 0.4.3 to 3.4.0; netCDF file names and global attributes now follow other ROM SAF products, and the bgr file was replaced by a bgo file.
      High-altitude hemispheric bias decreased and a QC change increased the number of nominal occultations. Check file-name patterns in automated scripts.
    source: https://rom-saf.eumetsat.int/previous_news.php

