notices:
  - date: "2026-03-10"
    level: info
    title: Satellite-name attribute fixed in TOA radiation (RSF, OLR) files (Service Message 167)
    body: >-
      In the CLARA-A3 CDR and ICDR daily and monthly TOA reflected solar and outgoing longwave files, the global attribute 'platforms' omitted Metop-B (from January 2013) and Metop-C (from July 2019).
      The attribute is filled correctly from 1 March 2026; the data values and all other attributes are correct.
    source: https://www.cmsaf.eu/EN/Products/Service_Messages/_serviceMessages/sm_167.html
  - date: "2025-08-01"
    level: info
    title: ICDR sea-ice input switched to AMSR2-based product (Service Message 165)
    body: >-
      Because access to SSMIS data from the US DMSP satellites has moved to a best-effort basis, the sea-ice concentration input to the CLARA-A3 and CLAAS-3 ICDRs changed from
      SSMIS-based OSI-401-d to AMSR2-based OSI-408-a. CM SAF found only minor differences, limited to grid cells at the ice edge.
    source: https://www.cmsaf.eu/EN/Products/Service_Messages/_serviceMessages/sm_165.html
  - date: "2025-06-06"
    level: warning
    title: ICDR now Metop only; water path and JCH production ended (Service Message 164)
    body: >-
      NOAA-18 was removed from processing on 31 May 2025 and NOAA-19 from 1 June 2025 (NOAA ended data provision for both on 16 June), so the ICDR is now made from Metop-B and Metop-C.
      The CWP monthly histogram, IWP and LWP daily and monthly means and the JCH monthly histogram, which need the NOAA channel combination, are no longer produced, and single-NOAA-satellite products have stopped.
      Fewer satellites and a change in daytime coverage affect product quality, especially daily means.
    source: https://www.cmsaf.eu/EN/Products/Service_Messages/_serviceMessages/sm_164.html

