transitions:
  - from: CMORPH V0.x (CPC real-time version)
    to: CMORPH CDR V1.0
    status: completed
    date: "2015-10"
    summary: >-
      V0.x, produced since 2002 with an evolving algorithm and inputs, was superseded by V1.0, reprocessed from 1998 with a fixed algorithm and fixed inputs.
      Unlike the satellite-only V0.x, V1.0 provides versions bias-corrected against gauges and GPCP, and was first released as an NCEI CDR in October 2015.
    changes:
      - aspect: Period
        before: "2002-12 onward (NCAR archive through 2017-10-02)"
        after: "1998-01 to present"
      - aspect: Homogeneity
        before: "Algorithm and input versions kept changing — notably inhomogeneous in 2003–2006"
        after: "Reprocessed with a fixed algorithm and the same input versions"
      - aspect: Products
        before: "Satellite-only (uncorrected) estimates only"
        after: "Satellite-only (RAW), bias-corrected (ADJ) and gauge–satellite blended versions. NCEI distributes the bias-corrected (ADJ) version"
      - aspect: Bias correction
        before: "None"
        after: "PDF matching to the CPC daily gauge analysis over land; scaling to the GPCP pentad analysis over ocean"
      - aspect: Format and distribution
        before: "CPC FTP binary files (global_CMORPH)"
        after: "netCDF4 at NCEI, AWS and Google Cloud (30-minute 8 km; hourly and daily 0.25°)"
    impacts:
      - Do not splice V0.x and V1.0 into one time series. Download the whole period again as V1.0 for long-term analysis.
      - Scripts that use the old FTP path (global_CMORPH) should switch to the V1.0 paths at NCEI or AWS.
    sources:
      - name: CMORPH V1.0 README (NCAR GDEX d502002)
        url: https://osdata.gdex.ucar.edu/web/datasets/d502002/docs/CMORPH_V1.0_README.txt
      - name: CMORPH CDR Climate Algorithm Theoretical Basis Document (C-ATBD, 2018)
        url: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation-CMORPH/AlgorithmDescription_01B-23.pdf
      - name: Xie et al. (2017)
        url: https://doi.org/10.1175/JHM-D-16-0168.1

notices:
  - date: "2026-10-02"
    level: info
    title: "Data Access Delays — NCEI cloud migration (through 2026-11-30)"
    body: >-
      NCEI is moving its data and applications to the cloud, which may temporarily delay access; the stated current impact is intermittent degraded order fulfillment (2026-10-02 to 11-30).
      The CMORPH CDR product page carries the same notice. Downloading from the AWS or Google Cloud buckets is less affected.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2022-03-04"
    level: info
    title: "Input microwave precipitation switched to NASA GPROF from January 2021 (technical note)"
    body: >-
      With the NESDIS MSPPS system retired, CMORPH CDR v1.0 uses NASA GPROF microwave precipitation from data of 2021-01-01. Comparisons of the uncorrected (RAW) fields showed hourly differences
      of roughly ±0.7 mm/h and December 2020 monthly-mean differences within ±7 mm/day, largest over convective ocean areas. Because the bias-correction procedure is unchanged, the impact on the final CDR was expected to be limited.
    source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation-CMORPH/TechnicalNote_01B-23.pdf

