# ─────────────────────────────────────────────────────────────
# CMORPH CDR — dataset information file (English edition)
# Satellite tab (precipitation). 30-minute, 8-km multi-satellite precipitation produced by NOAA CPC and distributed by NCEI as Climate Data Record v1.0.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: cmorph
name: "CMORPH CDR"
full_name: NOAA Climate Data Record (CDR) of CPC Morphing Technique (CMORPH) High Resolution Global Precipitation Estimates, Version 1
category: satellite
domain: satellite
group: 강수
order: 20
also_in:
  - domain: atmosphere
    group: 강수 자료
domains: [대기, 육지, 해양, 원격탐사]
provider: NOAA CPC (Climate Prediction Center; PI Pingping Xie) / NOAA NCEI CDR Program (distributed by NCEI, AWS and Google Cloud, and NCAR GDEX)

status: active
status_note: >-
  CMORPH CDR v1.0 continues as the formal version, produced once a month with a latency of 3–4 months.
  When checked on 2026-10-13, the public AWS bucket held data through May 2026 (posted on 2026-10-09). From January 2021 the input microwave precipitation comes from NASA GPROF instead of the retired NESDIS MSPPS.

period:
  start: "1998-01"
  end: present
  note: >-
    1 January 1998 to the present (about 3–4 months behind). When checked on 2026-10-13, the daily, hourly and 30-minute data in the AWS bucket ran through 2026-05-31, and the NCAR GDEX copy through 2026-01-31.
    The older real-time version produced since December 2002 (V0.x, with an evolving algorithm) has been superseded by V1.0 (the NCAR archive of it ends on 2017-10-02).

resolution:
  spatial_short: "8 km (0.073°)"
  temporal_short: "30분"
  spatial: >-
    Full resolution on a 0.07277° latitude–longitude grid (about 8 km at the equator), 60°S–60°N. Hourly and daily data are on a 0.25° latitude–longitude grid.
    Individual satellite estimates are coarser (about 12×15 km); the 8-km grid is produced by interpolation.
  vertical: Surface precipitation (single level)
  temporal: >-
    30-minute (8 km; each hourly file holds two 30-minute fields) / hourly (0.25°) / daily (0.25°, file name DLY_00Z)

coverage:
  short: 준전지구
  note: "60°S–60°N"
update: Monthly, with a latency of about 3–4 months (NCEI metadata). CPC separately publishes preliminary (real-time) data on its FTP site
license: NOAA CDR open data — free to download without an account. Cite the dataset DOI in line with the NCEI Use Agreement
account_required: false

summary: >-
  CMORPH is NOAA CPC's method for producing global (60°S–60°N) precipitation at 30-minute, 8-km resolution: passive microwave (PMW) precipitation estimates from low-Earth-orbit satellites
  are transported with cloud motion vectors derived from geostationary IR imagery, and the features are "morphed" between overpasses by time-weighted interpolation.
  CDR v1.0 is a reprocessing from 1998 with a fixed algorithm and fixed inputs, bias-corrected against the CPC daily gauge analysis over land and the GPCP pentad analysis over ocean.
  The morphing technique in GPM IMERG also descends from CMORPH.

time_convention:
  summary: >-
    Values in the 30-minute data are precipitation rates in mm/hr, and each 30-minute slot is labelled by its start time (e.g. the 00:00Z slot = 00:00–00:30 UTC). Each hourly file (HH at the end of the name)
    holds the HH:00 and HH:30 slots. The 0.25° hourly data are rates in mm/hour, the daily data are totals in mm/day, and DLY_00Z in the NCEI file names means a day bounded at 00 UTC.
  points:
    - "Adding two 30-minute values as they are doubles the hourly amount. The 30-minute amount (mm) is rate × 0.5."
    - "The daily data day is 00–24 UTC (09:00 to 09:00 next day in Korea Standard Time). For local-time daily totals, sum the hourly or 30-minute data yourself."
    - "The CDR is a final record with a 3–4 month delay. CPC's preliminary (real-time) data differ in bias-correction steps and inputs and can disagree with the CDR."
    - "The algorithm document also describes daily totals matched to each country's gauge end-of-day (EOD) time, but the daily files distributed by NCEI are named 00Z. Check the time attributes in the files you download."
  source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation-CMORPH/AlgorithmDescription_01B-23.pdf
  source_name: "CMORPH CDR v1.0 Climate Algorithm Theoretical Basis Document (C-ATBD, 2018) + NCEI metadata (C00948)"

variables:
  note: >-
    The NCEI metadata and the algorithm document list a single variable, surface precipitation. According to the NCEI ISO metadata (C00948), the precipitation variable in all three netCDF4 file types is `cmorph` (stored as short, lwe_precipitation_rate),
    with time, lat and lon coordinates and their _bounds variables.
  full_list: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc%3AC00948
  groups:
    - name: 30-minute (8 km, CMORPH_V1.0_ADJ_8km-30min)
      kind: instant
      period: "value representing the 30-minute slot"
      items:
        - text: "Bias-corrected precipitation rate — `cmorph` (mm/hr)"
          note: "Rate at 30-minute intervals produced by morphing. The official documents do not say whether it is a 30-minute mean or an instantaneous value"
    - name: Hourly (0.25°, CMORPH_V1.0_ADJ_0.25deg-HLY)
      kind: mean
      period: Hourly
      items:
        - "Bias-corrected precipitation rate — `cmorph` (mm/hour)"
    - name: Daily (0.25°, CMORPH_V1.0_ADJ_0.25deg-DLY_00Z)
      kind: accum
      period: Daily (00–24 UTC)
      items:
        - "Daily precipitation — `cmorph` (mm/day)"

access:
  - name: NOAA NCEI (direct HTTPS download)
    url: https://www.ncei.noaa.gov/data/cmorph-high-resolution-global-precipitation-estimates/access/
    method: HTTPS download (no account)
    note: Organized into 30min/8km, hourly/0.25deg and daily/0.25deg with year/month(/day) folders. NCEI warns of possible access delays during its October 2026 cloud migration.
  - name: AWS S3 public bucket (NOAA Open Data Dissemination)
    url: https://noaa-cdr-precip-cmorph-pds.s3.amazonaws.com/index.html
    method: S3 (us-east-1, anonymous access) / HTTPS
    note: >-
      Laid out as s3://noaa-cdr-precip-cmorph-pds/data/30min/8km/YYYY/MM/DD/, data/hourly/0.25deg/YYYY/MM/DD/ and data/daily/0.25deg/YYYY/MM/,
      with the algorithm document and technical note in the documentation/ folder.
  - name: Google Cloud Storage
    url: https://console.cloud.google.com/storage/browser/noaa-cdr-precip-cmorph
    method: Public GCS bucket
  - name: NCAR GDEX (d502002)
    url: https://gdex.ucar.edu/datasets/d502002/
    method: HTTPS / THREDDS (NCAR copy, DOI 10.5065/0EFN-KZ90)
    note: When checked on 2026-10-13 it ran through 2026-01-31, behind NCEI and AWS.
  - name: NOAA CPC preliminary data (CMORPH_RT)
    url: https://ftp.cpc.ncep.noaa.gov/precip/CMORPH_RT/GLOBE/data/
    method: HTTPS/FTP
    note: The CPC folder that the NCEI product page links as "Preliminary Data". It is not the formal CDR, so do not use it for long-term analysis.

example:
  lang: python
  note: >-
    Downloads 0.25° daily data for July 2023 from the public AWS bucket without an account and computes the Korean Peninsula area mean (requires s3fs, xarray and netCDF4/h5netcdf).
    Because the variable name inside the files could not be confirmed from documentation, the code picks the three-dimensional (time, lat, lon) variable. Run print(ds) first to check the structure.
  code: |
    import s3fs
    import xarray as xr

    fs = s3fs.S3FileSystem(anon=True)
    paths = sorted(fs.glob("noaa-cdr-precip-cmorph-pds/data/daily/0.25deg/2023/07/*.nc"))
    files = [fs.open(p) for p in paths]
    ds = xr.open_mfdataset(files, engine="h5netcdf", combine="by_coords")
    print(ds)                                    # check variable names, units and coordinate ranges

    name = [v for v in ds.data_vars if ds[v].ndim == 3][0]   # daily precipitation (mm/day)
    la = [c for c in ds[name].dims if c.lower().startswith("lat")][0]
    lo = [c for c in ds[name].dims if c.lower().startswith("lon")][0]
    pr = ds[name]
    box = pr.where((ds[la] >= 33) & (ds[la] <= 39) & (ds[lo] >= 124) & (ds[lo] <= 132), drop=True)
    print(box.mean([la, lo]).values)             # 00–24 UTC days

tips:
  - "The 30-minute data are rates in mm/hr. Adding two 30-minute slots as they are doubles the hourly amount."
  - "Coverage is 60°S–60°N only, and there are no retrievals over snow- or ice-covered surfaces. The product is not suited to winter snowfall or high-latitude precipitation."
  - "The algorithm document notes that heavy rain tends to be underestimated and light rain can be missed, and that annual totals in the tropics are still too low."
  - "After TRMM TMI ended in April 2015, inter-calibration across sensors relies on historical tables, and from January 2021 the input microwave precipitation switched from NESDIS MSPPS to NASA GPROF. Watch for small discontinuities around these dates."
  - "Bias correction relies on the CPC daily gauge analysis (land) and the GPCP pentad analysis (ocean), so magnitudes are uncertain where gauges are sparse."
  - "The old CPC 'global_CMORPH' real-time data (V0.x, from 2002-12) were built with an evolving algorithm and inputs and are notably inhomogeneous in 2003–2006. Use CDR v1.0 for research."
  - "IMERG (30-minute, 0.1°) inherits CMORPH's morphing approach but has different inputs and calibration. Do not splice the two into one time series."

