transitions:
  - from: VIIRS Snow Cover Version 1 (VNP10 C1)
    to: VIIRS Snow Cover Version 2 (C2)
    status: completed
    date: "2024-06"
    summary: >-
      A version with improved algorithms, cloud masking and noise detection that added NOAA-20 (VJ110) products. Version 1 (Suomi NPP only) stopped production on 17 June 2024,
      and NOAA-21 (VJ210) products were added in January 2026.
    changes:
      - aspect: Satellites
        before: "Suomi NPP (VNP10) only"
        after: "Suomi NPP (VNP10) + NOAA-20 (VJ110, released 2023-06) + NOAA-21 (VJ210, released 2026-01)"
      - aspect: Algorithm and inputs
        before: "C1 algorithm"
        after: "Improved snow algorithm, better cloud masking, enhanced noise detection (per NSIDC)"
      - aspect: Products
        before: "L2, daily (A1), gap-filled daily (A1F), daily CMG (C1)"
        after: "Same set + 375 m global gap-filled map (D1F, DOIs registered in 2025)"
      - aspect: Metadata
        before: "`mask_values` and `mask_meanings` attributes"
        after: "Renamed `flag_values` and `flag_meanings` for CF-1.6; Projection variable added"
      - aspect: Production
        before: "Forward processing ended 2024-06-17"
        after: "Current version"
    impacts:
      - Do not mix V1 and V2; download the whole period again as V2.
      - "Code that reads the `mask_values` attribute must switch to `flag_values`."
    sources:
      - name: NSIDC — VIIRS Version 1 (Collection 1) cease forward processing notice
        url: https://nsidc.org/data/user-resources/data-announcements/user-notice-visible-infrared-imaging-radiometer-suite-viirs-version-1-collection-1-cease-forward-0
      - name: NSIDC VNP10A1 V2 User Guide (version history)
        url: https://nsidc.org/sites/default/files/documents/user-guide/multi_vnp10a1-v002-userguide.pdf

notices:
  - date: "2026-10-06"
    level: critical
    title: Suomi NPP VIIRS data delivery ends on 2 November 2026 — no new VNP10 data
    body: >-
      NSIDC announced that delivery of Suomi NPP science data products is expected to stop at 13:00 UTC on 2 November 2026 and encouraged users to move to the equivalent JPSS-1 (NOAA-20) and JPSS-2 (NOAA-21) products (VJ110, VJ210).
      Historical data and documentation remain available. The notice follows NOAA's 3 August 2026 announcement ending S-NPP data delivery.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-s-nppvisible-infrared-imaging-radiometer-suite-viirs-data-sets-cessation-data-delivery
  - date: "2026-07-11"
    level: warning
    title: Suomi NPP anomaly — VIIRS snow production temporarily halted
    body: >-
      Suomi NPP entered a non-nominal state at about 14:50 UTC on 10 July, and all products were disabled from 01:30 UTC on 11 July. The spacecraft was back to nominal on 21 July and processing then resumed;
      NSIDC said recoverable missing products would be published after review.
    source: https://nsidc.org/data/vnp10a1/versions/2
  - date: "2026-03-05"
    level: info
    title: VIIRS 375 m daily snow cover (VNP10A1, VJ110A1) now in AppEEARS
    body: >-
      Suomi NPP and NOAA-20 VIIRS daily 375 m snow cover V2 can now be extracted by point or area through AppEEARS.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-viirsjpss1-and-viirsnpp-snow-cover-daily-l3-global-375m-sin-grid-data-sets-are-now
  - date: "2026-01-29"
    level: info
    title: NOAA-21 (JPSS-2) VIIRS Version 2 snow data released
    body: >-
      NSIDC released NOAA-21 VIIRS Version 2 data sets, including VJ210 snow cover. The record starts in February 2023 and becomes the main successor once Suomi NPP ends.
    source: https://nsidc.org/data/user-resources/data-announcements/new-data-sets-released-viirs-jpss-2-version-2
  - date: "2024-06-17"
    level: info
    title: VIIRS Version 1 snow and sea ice production ended
    body: >-
      Forward processing of VIIRS Version 1 (Collection 1) snow and sea ice data sets ended. V1 data stay downloadable for a while, but NSIDC strongly advised moving to Version 2.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-visible-infrared-imaging-radiometer-suite-viirs-version-1-collection-1-cease-forward-0

