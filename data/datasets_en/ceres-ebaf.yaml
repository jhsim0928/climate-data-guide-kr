    url: https://ceres-tool.larc.nasa.gov/ord-tool/jsp/EBAF421Selection.jsp
    method: Web order (choose variables, period and region → NetCDF3, up to 2 GB)
    note: The route recommended by the CERES team. Choose regional (1°), zonal or global means, and monthly means or climatology.
  - name: CERES data page (product table and data availability)
    url: https://ceres.larc.nasa.gov/data/
    method: Web
  - name: NASA Earthdata / ASDC (CERES_EBAF, CERES_EBAF-TOA Edition4.2.1)
    url: https://search.earthdata.nasa.gov/search/granules?p=C3880496704-LARC_CLOUD
    method: Earthdata Search / earthaccess (NetCDF4)
    note: File downloads require a (free) NASA Earthdata Login.
