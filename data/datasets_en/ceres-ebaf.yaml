example:
  lang: python
  note: "Run earthaccess.login() once with your NASA Earthdata account first. Confirm variable names in the downloaded file."
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import numpy as np
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(short_name="CERES_EBAF-TOA", version="Edition4.2.1")
    files = earthaccess.download(results[:1], "./ceres")

    ds = xr.open_dataset(files[0])
    net = ds["toa_net_all_mon"]          # TOA net flux (W m-2), 1° monthly mean
    w = np.cos(np.deg2rad(ds["lat"]))
    print(net.weighted(w).mean(("lat", "lon")).sel(time="2024"))  # area-weighted global mean

tips:
  - EBAF is energy-balanced, so the absolute global-mean net flux is tied to ocean heat storage estimates. Changes in net flux (trends, anomalies) come from the observations, but do not treat the absolute level as an independent measurement.
  - Cloud properties may have discontinuities around July 2002 (Aqua joins) and April 2022 (switch to NOAA-20 only). Check these dates before interpreting long-term cloud trends.
  - Surface fluxes are computed from cloud and atmospheric inputs, not observed. Anomalies can be noisy where surface adjustments are large (the Andes, Tibet, central eastern Africa), and near-surface temperatures before March 2006 run high in some regions because of the coarse MERRA-2 SST input.
  - The DQS warns that Arctic polar night cloud fraction is over-adjusted in Ed4.2.1 (differences of up to 20–30%) and advises against correlating Arctic or Antarctic polar night cloud properties.
  - The 3–5 February 2024 data gap remains in both editions. Check the DQS notes on missing data before using that month.
  - For daily or hourly fluxes, use CERES SYN1deg rather than EBAF.

