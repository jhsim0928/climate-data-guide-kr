notices:
  - date: "2026-09-10"
    level: warning
    title: March 2026 surface file replaced — re-download if you obtained it in June–July 2026
    body: >-
      A March 2026 file with low aerosol optical thickness was in the archive for about a month (June to July 2026) before being replaced by a corrected file.
      All-sky and clear-sky surface SW and LW fluxes and the surface cloud radiative effects are affected, clear-sky surface downward SW most of all. Download the file again if you got it in that window.
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
  - date: "2026-03-20"
    level: info
    title: Terra end of science projected for February 2027 — EBAF already NOAA-20 based
    body: >-
      NASA projects the end of Terra science operations in February 2027 because of fuel and power limits; Terra's CERES FM2 was powered off in January 2025
      because of battery constraints. According to the CERES DQS, EBAF switched to a NOAA-20-only record in April 2022 because of the drifting Terra and Aqua orbits.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-12-29"
    level: info
    title: Libera to fly on JPSS-4 (launch targeted for 2027)
    body: >-
      Libera, which will continue the CERES record, will be integrated on JPSS-4 instead of JPSS-3; JPSS-4 is targeted for launch in 2027 and will be named NOAA-22 once in orbit.
      Until then EBAF relies on a single instrument, CERES FM6 on NOAA-20.
    source: https://science.nasa.gov/science-research/earth-science/the-state-of-ceres-updates-and-highlights
  - date: "2025-03-14"
    level: warning
    title: Ed4.2.1 surface data released — use Ed4.2.1 from April 2022 onward
    body: >-
      Following the TOA release (2024-11-25), the surface and CRE data were released as Ed4.2.1. April 2022 to July 2024 was reprocessed with MERRA-2 input,
      and production from August 2024 is Ed4.2.1 only. Data through March 2022 are identical to Ed4.2.
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
  - date: "2024-01-02"
    level: info
    title: EBAF Ed4.2 released, replacing Ed4.1
    body: Ed4.2 was released and replaced Ed4.1. The period from April 2022 onward was later revised as Ed4.2.1 (TOA 2024-11, surface 2025-03).
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf

