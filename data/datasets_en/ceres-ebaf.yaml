id: ceres-ebaf
name: CERES EBAF Ed4.2.1
full_name: Clouds and the Earth's Radiant Energy System (CERES) Energy Balanced and Filled (EBAF) Edition 4.2.1
category: satellite
domain: atmosphere
group: 복사 자료
order: 10
domains: [대기, 육지, 해양]
provider: NASA Langley Research Center (LaRC) CERES Science Team / Atmospheric Science Data Center (ASDC)

status: active
status_note: >-
  Ed4.2.1 is the current edition and is extended monthly; TOA data appear about two to three months after the data month, surface data later.
  Since April 2022 the record has relied on NOAA-20 alone (CERES FM6) because the Terra and Aqua orbits are drifting,
  so it effectively depends on a single instrument until the follow-on Libera (on JPSS-4, targeted for launch in 2027) is in orbit.

transitions:
  - from: EBAF Ed4.2
    to: EBAF Ed4.2.1
    status: completed
    date: "2025-03"
    summary: For April 2022 onward, Ed4.2.1 switches the atmospheric input for imager cloud retrievals from GEOS-5.4.1 to MERRA-2. Data through March 2022 are identical to Ed4.2, which stopped at July 2024.
    changes:
      - aspect: Release date
        before: 2024-01-02
        after: TOA 2024-11-25, surface 2025-03-14
      - aspect: Period
        before: 2000-03 to 2024-07 (production then stopped)
        after: 2000-03 to present (2022-04 to 2024-07 reprocessed; produced as Ed4.2.1 from 2024-08)
      - aspect: Atmospheric input for cloud retrievals
        before: GEOS-5.4.1 (discontinued July 2024)
        after: MERRA-2 from April 2022 (GEOS-5.4.1 unchanged before that)
      - aspect: Sea surface temperature input
        before: GEOS-5.4.1 SST
        after: MERRA-2 SST from April 2022
      - aspect: Known-issue fixes
        before: Some missing data; narrowband-to-broadband coefficient error over partly cloudy scenes; sun-glint coding bug
        after: Most missing data recovered; coefficients corrected; glint bug fixed from March 2024 data onward
      - aspect: Surface fluxes
        before: Aerosol optical thickness discontinuity from the MODIS-to-VIIRS transition; polar surface flux trends hard to trust
        after: AOT discontinuity mitigated; polar trend problem reduced
    impacts:
      - Values for March 2000 to March 2022 are identical in both editions. For anything that uses April 2022 onward, use Ed4.2.1 throughout and do not mix editions.
      - The differences are small, but results computed with Ed4.2 for April 2022 to July 2024 are worth re-checking with Ed4.2.1.
      - The CERES team recommends checking the edition and release date in your files against the Data Quality Summary (DQS).
    sources:
      - name: CERES EBAF Ed4.2/Ed4.2.1 Data Quality Summary (V8, 2026-09-10)
        url: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
      - name: ECMWF Forum — Reprocessed CERES EBAF (Ed 4.2.1) now available (2025-06-05)
        url: https://forum.ecmwf.int/t/reprocessed-ceres-ebaf-ed-4-2-1-now-available/13343

period:
  start: "2000-03"
  end: present
  note: >-
    As checked on 2026-10-12, the CERES data page lists EBAF-TOA through July 2026 and the combined TOA and surface EBAF through May 2026.
    March 2000–June 2002 is Terra only, July 2002–March 2022 Terra and Aqua, and April 2022 onward NOAA-20 only.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1개월"
  spatial: "Regional 1° × 1° latitude-longitude grid, zonal (1° latitude), and global means"
  vertical: Top of atmosphere (TOA) and surface
  temporal: Monthly means (plus a separate July 2005–June 2015 climatology)

update: Monthly (TOA about 2–3 months behind; surface later)
license: Freely available without restriction under NASA's Earth science data policy; citation and acknowledgement requested
account_required: false

summary: >-
  A climate data record of monthly mean top-of-atmosphere (TOA) shortwave, longwave and net radiative fluxes on a 1° grid from NASA's CERES instruments.
  The TOA net flux is constrained to the ocean heat storage ("energy balanced"), and clear-sky gaps are filled to give regionally complete fields.
  The same product family includes computed surface fluxes (upward, downward and net), cloud radiative effects and cloud properties,
  making it a standard reference for Earth's energy imbalance, cloud feedback and model evaluation.

time_convention:
  summary: >-
    All variables are monthly means (W m-2, etc.), not instantaneous values. Climatology (_clim) variables are monthly means over the
    July 2005–June 2015 base period.
  points:
    - "TOA variable names end in `_mon` (monthly mean) or `_clim` (climatology). A leading `z` marks zonal means and a leading `g` global means (from Ed4.1 file metadata)."
    - "The time units are 'days since 2000-03-01 00:00:00'; climatology uses its own dimension (ctime) (from Ed4.1 files)."
    - "Surface net flux is down minus up, so positive values mean the surface gains energy. Cloud radiative effect (CRE) is all-sky minus clear-sky flux."
    - "Clear-sky fluxes come from the cloud-free part of each 1° region, so all-sky and clear-sky are sampled differently; rarely this yields unphysical values such as positive SW or negative LW CRE."
    - "Forward (near-real-time) monthly processing excludes the first day of the following month to allow the two-month latency; reprocessed records include it."
    - "Cloud optical depth (cldtau) is daytime only; the other cloud properties are day-and-night averages."
  source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
  source_name: CERES EBAF Ed4.2/Ed4.2.1 Data Quality Summary (V8) + EBAF-TOA Ed4.1 file metadata

variables:
  note: >-
    TOA and cloud variable names are those in the EBAF-TOA Ed4.1 NetCDF file metadata; check that they are the same in your Ed4.2.1 files.
    The official documentation does not give in-file names for the surface variables, so only descriptions are listed. All fluxes are in W m-2.
  full_list: https://ceres.larc.nasa.gov/data/
  groups:
    - name: Top-of-atmosphere fluxes — EBAF-TOA
      kind: mean
      period: month
      items:
        - "Incoming solar flux — `solar_mon` (W m-2)"
        - "TOA shortwave flux, all-sky — `toa_sw_all_mon` (W m-2)"
        - "TOA longwave flux (outgoing longwave radiation), all-sky — `toa_lw_all_mon` (W m-2)"
        - "TOA net flux, all-sky — `toa_net_all_mon` (W m-2)"
        - "TOA shortwave, longwave and net flux, clear-sky (cloud-free areas) — `toa_sw_clr_c_mon`, `toa_lw_clr_c_mon`, `toa_net_clr_c_mon` (W m-2)"
        - text: "Climatology (July 2005–June 2015) — `toa_sw_all_clim` and other `_clim` variables (W m-2)"
          note: Monthly climatology, averaging each calendar month
    - name: Cloud properties (CERES-MODIS/VIIRS)
      kind: mean
      period: month
      items:
        - "Cloud area fraction, daytime-and-nighttime — `cldarea_total_daynight_mon` (%)"
        - "Cloud effective pressure, daytime-and-nighttime — `cldpress_total_daynight_mon` (hPa)"
        - "Cloud effective temperature, daytime-and-nighttime — `cldtemp_total_daynight_mon` (K)"
        - text: "Cloud visible optical depth, daytime — `cldtau_total_day_mon` (dimensionless)"
          note: Averaged over daytime observations only
    - name: Surface fluxes and cloud radiative effects (combined EBAF file, computed)
      kind: mean
      period: month
      items:
        - text: "Surface shortwave flux down and up, all-sky and clear-sky (W m-2)"
          note: "The official documents do not give the in-file variable names; check the downloaded file"
        - text: "Surface longwave flux down and up, all-sky and clear-sky (W m-2)"
          note: "The official documents do not give the in-file variable names; check the downloaded file"
        - text: "Surface net shortwave, net longwave and net total flux (W m-2)"
          note: "The official documents do not give the in-file variable names; check the downloaded file"
        - text: "TOA and surface cloud radiative effects, shortwave, longwave and net (W m-2)"
          note: "The official documents do not give the in-file variable names; check the downloaded file"

