notices:
  - date: "2026-10"
    level: warning
    title: "Version 4.2: 2025 data added — AMSR2 TBs replace SSMIS TBs and ERA5 replaces NCEP/NCAR winds"
    body: >-
      With the October 2026 update of the user guide, daily and weekly data were extended to 2025-12-31. From the 2025 data (file version v4.2), "AMSR2 TBs replaced SSMIS TBs as the passive microwave source",
      and ERA5 replaced the NCEP/NCAR Reanalysis as the wind source. 1978–2024 (v4.1) is unchanged.
    source: https://nsidc.org/sites/default/files/documents/user-guide/nsidc-0116-v004-userguide_0.pdf
  - date: "2026-09-08"
    level: info
    title: "User notice: AMSR2 products continued forward processing — AMSR3 products planned for 2027"
    body: >-
      NSIDC's AMSR2 products, including the daily polar gridded brightness temperatures (NSIDC-0802) and sea ice concentrations (NSIDC-0803) that feed this dataset and its quicklook extension, "will continue forward processing, as the data remain available from" JAXA.
      "NSIDC is planning for the development of AMSR3 data products in 2027."
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-amsr2-products-continued-forward-processing
  - date: "2026-03-18"
    level: info
    title: "NCEP/NCAR Reanalysis 1 updates end — this dataset uses ERA5 winds from 2025"
    body: >-
      NOAA PSL announced the end of R1 updates (NCEP switched from CDAS to CORe on 2026-03-18). NSIDC-0116 switched its wind input to ERA5 from 2025-01-01 (User Guide Table 11),
      and the quicklook product NSIDC-0748 also uses ERA5, so updates are not affected. The 1978–2024 record continues to use NCEP/NCAR winds as input.
    source: https://psl.noaa.gov/news/2026/r1datanotice.html

