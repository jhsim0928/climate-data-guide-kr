notices:
  - date: "2026-03-17"
    level: critical
    title: "NCEP/NCAR Reanalysis 1 has ceased updates — last date of data 17 March 2026"
    body: >-
      PSL announced that the NCEP/NCAR Reanalysis 1 dataset has ceased updates due to the National Weather Service change from CDAS to CORe; historical data remain available on the PSL site.
      The PSL data notice gives 18 March as NCEP's switchover date, while the CPC CORe page gives 19 March as the start of CORe operations.
    source: https://psl.noaa.gov/news/2026/r1datanotice.html
  - date: "2026-02-28"
    level: warning
    title: PSL warns that R1 updates will stop
    body: A PSL data notice announced that the NCEP/NCAR Reanalysis 1 dataset will no longer be updated effective on or around 18 March.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-02-09"
    level: warning
    title: "NWS Service Change Notice 26-12 — Upgrading the Climate Data Assimilation System (CDAS) to the Conventional Observation Reanalysis (CORe)"
    body: >-
      NWS announced that CORe would replace CDAS on or about 9 March 2026 and that the cdas and cdas2 directories on NOMADS and FTP would be removed (updated notice reissued on 13 February).
      CORe files are provided in GRIB2 under /com/core/.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf

