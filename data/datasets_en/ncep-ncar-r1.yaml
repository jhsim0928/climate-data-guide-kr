# ─────────────────────────────────────────────────────────────
# NCEP/NCAR R1 — dataset information file
# ─────────────────────────────────────────────────────────────
id: ncep-ncar-r1
name: NCEP/NCAR R1
full_name: NCEP/NCAR Reanalysis 1 (including its real-time extension, the Climate Data Assimilation System, CDAS)
category: reanalysis
domain: atmosphere
group: 재분석
order: 60
domains: [대기, 육지]
provider: NOAA National Centers for Environmental Prediction (NCEP) and NSF National Center for Atmospheric Research (NCAR); distributed by NOAA PSL and NSF NCAR GDEX

status: ended
status_note: >-
  According to NOAA PSL, the NCEP/NCAR Reanalysis 1 dataset has ceased updates; the last date of data is 17 March 2026. NCEP replaced the Climate Data Assimilation System (CDAS),
  which had extended R1 in real time, with the new Conventional Observation Reanalysis (CORe) in March 2026 (NWS Service Change Notice 26-12).
  Historical data remain available from PSL and NCAR but will not be extended, so analyses that need recent years must move to another reanalysis.

successor:
  name: "CORe (NOAA Conventional Observation Reanalysis) — not a reprocessing of R1"
  url: https://www.cpc.ncep.noaa.gov/products/CORe/index.html
  note: >-
    NCEP replaced CDAS (the real-time extension of R1) with CORe, a UFS-based (circa-2020 code) Ensemble Kalman Filter reanalysis covering 1950 to the present.
    It assimilates only conventional observations and atmospheric motion vectors, is distributed in GRIB2, and is updated on the NOAA NODD archive with a 1-day latency.
    Because the model and observing system differ, it is not the same dataset as R1, and PSL has no immediate plans to serve CORe itself. For general atmospheric research,
    ERA5 or JRA-3Q are the practical alternatives; the related NCEP–DOE R2 has not been updated since February 2026. To keep using NCEP operational analyses, consider the CFSv2 analysis (2011 onward).

transitions:
  - from: NCEP/NCAR R1
    to: NCEP–DOE R2
    to_id: ncep-doe-r2
    status: completed
    date: "2002"
    summary: >-
      R2 keeps R1's T62, 28-level system but fixes known errors in R1 processing and updates the model physics, rerun from 1979.
      Its developers explicitly did not call it a "next-generation" reanalysis: Northern Hemisphere mid-latitude heights and winds are nearly the same, while land-surface variables and surface fluxes are much improved.
      It was originally recommended as a complement to R1.
    changes:
      - aspect: Period
        before: "1948-01 to 2026-03 (updates stopped when CDAS ended)"
        after: "1979-01 onward (satellite era only; no updates after 2026-02)"
      - aspect: Model resolution
        before: "T62 (about 210 km), 28 sigma levels"
        after: "Unchanged: T62, 28 levels (no resolution increase)"
      - aspect: Southern Hemisphere PAOBS error
        before: "Southern Hemisphere synthetic surface pressure data (PAOBS) mis-processed for 1979–1992"
        after: "Fixed"
      - aspect: Snow-related errors
        before: "Snow cover analysis error for 1974–1994, \"spectral snow\" caused by a humidity diffusion error, and an error in the snowmelt term"
        after: "All fixed; the snow cover mask is interpolated from weekly to daily values and snow handling is revised to use model snow depth"
      - aspect: Ocean albedo and cloud tables
        before: "Ocean albedo error over the whole period; relative humidity–cloud cover tables discontinuous at 0° and 180° longitude"
        after: "Fixed"
      - aspect: Soil moisture
        before: "Nudged towards climatology on a 60-day time scale, giving an excessive annual cycle"
        after: "Nudging removed; observed pentad precipitation (satellite + gauge) corrects model precipitation errors, which feeds into soil moisture"
      - aspect: Boundary layer and radiation
        before: "Original R1 boundary-layer diffusion; shortwave radiation computed every 3 hours on a reduced (128 × 64) grid"
        after: "Hong–Pan non-local boundary-layer diffusion, Chou shortwave radiation, radiation computed hourly on the full Gaussian grid (192 × 94), enhanced cloud-top longwave cooling"
      - aspect: Fixed boundary fields
        before: "SST, sea ice, ozone and desert albedo as used at the time of R1"
        after: "AMIP-II SST and sea ice, new ozone climatology, CO₂ at 350 ppmv, Briegleb desert albedo, smoothed orography"
      - aspect: Observational input
        before: "Conventional observations + NESDIS satellite temperature retrievals"
        after: "Mostly the same raw observations (some additions possible after 1993); SSM/I not used; still dependent on NESDIS retrievals"
      - aspect: Improvements
        before: "Known problems in land-surface variables, surface fluxes and the water budget"
        after: "Improved surface fluxes, water budget and shortwave fluxes; weaknesses remain in tropical warm-pool OLR and upper-tropospheric tropical moisture (NCAR GDEX description)"
      - aspect: PSL file layout
        before: "Pressure-level humidity `shum` and `rhum` up to 300 hPa; sea level pressure file `slp`; surface fluxes in folder surface_gauss"
        after: "Pressure-level humidity `rhum` only (up to 10 hPa); sea level pressure file `mslp`; surface fluxes in folder gaussian_grid"
    impacts:
      - R2 starts in 1979, so 1948–1978 exists only in R1. Splicing R1 and R2 at 1979 builds the system differences into your series as a discontinuity — use one dataset per analysis.
      - R2 is the same first-generation system as R1 in resolution and observational input, so switching does not change the upper-air circulation much. Agreement between R1 and R2 in a circulation study is not an independent confirmation.
      - For soil moisture, surface fluxes and the water budget, the developers judge R2 to be better than R1. The R1–R2 difference itself can serve as a measure of analysis uncertainty.
      - "File names and folders differ on PSL (`slp` → `mslp`, surface_gauss → gaussian_grid), so R1 scripts will not find the R2 files without changes."
      - Neither dataset has been updated since spring 2026; studies that need recent years should move to a current reanalysis such as ERA5 or JRA-3Q.
    sources:
      - name: Kanamitsu et al. (2002), NCEP–DOE AMIP-II Reanalysis (R-2), BAMS, 83, 1631–1643
        url: https://doi.org/10.1175/BAMS-83-11-1631
      - name: CPC — Overview of NCEP/DOE Reanalysis-2 (Kanamitsu et al.; list of R1 error fixes and physics changes)
        url: https://www.cpc.ncep.noaa.gov/products/tools/reanalysis2/kana/Overview.htm
      - name: CPC NCEP/DOE AMIP-II Reanalysis (Reanalysis-2) home page
        url: https://www.cpc.ncep.noaa.gov/products/wesley/reanalysis2/
      - name: NSF NCAR GDEX — NCEP/DOE Reanalysis 2 (d091000)
        url: https://gdex.ucar.edu/datasets/d091000/
      - name: Kalnay et al. (1996), The NCEP/NCAR 40-Year Reanalysis Project, BAMS, 77, 437–471
        url: https://doi.org/10.1175/1520-0477(1996)077<0437:TNYRP>2.0.CO;2
  - from: NCEP/NCAR R1 CDAS
    to: CORe
    to_id: core
    status: completed
    date: "2026-03"
    summary: >-
      NCEP ended CDAS, the real-time extension of R1, and moved operations to CORe, a reanalysis rebuilt from 1950 with a new model and data assimilation system (operational from 2026-03-19).
      CORe is not a reprocessed R1 but a separate reanalysis: the model (FV3GFS), data assimilation (80-member EnKF) and observing system are all different.
    changes:
      - aspect: Period
        before: "1948-01 to 2026-03-17"
        after: "1950-01 to present (about 1-day latency)"
      - aspect: Model and vertical levels
        before: "NCEP global spectral model T62, 28 sigma levels"
        after: "FV3GFS (UFS) C128 cubed-sphere grid, 64 hybrid levels"
      - aspect: Data assimilation
        before: "3D-Var (SSI), single analysis"
        after: "Ensemble Kalman Filter (EnKF) with 80 members; the distributed fields are the ensemble mean (members for the last 7 days on NOMADS)"
      - aspect: Assimilated observations
        before: "Conventional observations + satellite temperature soundings (from 1979), etc."
        after: "Conventional observations + satellite atmospheric motion vectors (AMVs) only — no satellite radiances or temperature soundings"
      - aspect: Output grids
        before: "Pressure levels 2.5° × 2.5° (144 × 73); surface and fluxes T62 Gaussian (192 × 94)"
        after: "Both flx and pgb on a 512 × 256 Gaussian grid; 22 pressure levels (1000–1 hPa)"
      - aspect: Time step and format
        before: "6-hourly, GRIB1 (redistributed as NetCDF by PSL)"
        after: "3-hourly, GRIB2 (not redistributed by PSL — NODD, NOMADS, NCAR GDEX)"
      - aspect: Variables
        before: "Sea level pressure slp (PRMSL) provided"
        after: "No PRMSL — use mean-sea-level PRES; relative vorticity and divergence must be computed from the winds"
    impacts:
      - Do not splice R1 (or CDAS) and CORe into one time series. Model, observations and resolution all differ, so values differ even on the same date.
      - CORe fields are ensemble means, which weakens strong winds such as those in tropical cyclones. For extremes and tropical cyclone work, look at the individual members (last 7 days on NOMADS).
      - Scripts written for R1 (PSL NetCDF on the 2.5° grid) will not work as-is. You will need to read GRIB2 and regrid (e.g. with wgrib2).
    sources:
      - name: NOAA CPC — CORe home page
        url: https://www.cpc.ncep.noaa.gov/products/CORe/index.html
      - name: NOAA CPC — CORe datasets (comparison with CDAS)
        url: https://www.cpc.ncep.noaa.gov/products/CORe/pns/eval/eval_datasets.html
      - name: NWS SCN 26-12 (CDAS → CORe, 2026-02)
        url: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf
      - name: NOAA PSL — About NOAA CORe Reanalysis
        url: https://psl.noaa.gov/data/coreinfo.html

period:
  start: "1948-01"
  end: "2026-03"
  note: >-
    1 January 1948 to 17 March 2026, 18 UTC (last time step in the PSL files). Quality is lower in 1948–1957, when upper-air observations were sparse,
    and the assimilated data change from 1979 when satellite retrievals enter. The NCAR GDEX copy was updated on a different schedule and may end earlier than PSL.

resolution:
  spatial_short: "278 km (2.5°)"
  temporal_short: "6시간"
  spatial: "Model T62 (about 210 km) / pressure levels on a 2.5° × 2.5° grid (144 × 73) / surface and flux fields on the T62 Gaussian grid (192 × 94, about 1.9°)"
  vertical: "Model: 28 sigma levels / 17 pressure levels (1000–10 hPa). Humidity (`shum`, `rhum`) only 1000–300 hPa; vertical velocity (`omega`) only 1000–100 hPa"
  temporal: 6-hourly (00, 06, 12, 18 UTC); daily and monthly means provided separately by PSL
update: Ended (last data 17 March 2026)
license: PSL data are freely available without restriction (PSL asks for an acknowledgement) / NCAR GDEX copy under CC BY 4.0
account_required: false

summary: >-
  The first long-term global atmospheric reanalysis, produced by NCEP and NCAR in the 1990s with a data assimilation system frozen from 1948 onward
  and continued in real time as CDAS. Its resolution is low, but it offers the longest period from a single system and is easy to obtain as yearly netCDF files from PSL,
  so for decades it was widely used for climate diagnostics and index calculations. Updates ended in March 2026 when CDAS was discontinued.

time_convention:
  summary: >-
    In the PSL 6-hourly files, pressure-level and surface analysis variables (`air`, `hgt`, `slp`, `pr_wtr`, etc.) are instantaneous values at the time stamp (00, 06, 12, 18 UTC).
    Precipitation, heat fluxes and radiation in the Gaussian-grid flux files (surface_gauss, other_gauss), by contrast, are 0–6 hour forecast averages started from that analysis,
    and the time stamp marks the start of the averaging interval (e.g. the 00 UTC value = 00–06 UTC mean).
  points:
    - "The PSL file attributes tell them apart: instantaneous fields have statistic 'Individual Obs'; 6-hour means have statistic 'Mean' and avg_period '06:00:00' on the time variable."
    - "The NCEP documentation defines fluxes as '0–6 hour forecast average/accumulation from the analysis'. The R1 PSL files carry no attribute saying whether the time stamp is the start or end of the interval; we treat it as the start, based on coordinate_defines 'start' in the PSL files of R2, which uses the same system."
    - "Precipitation `prate` is a mean rate (Kg/m^2/s), not an accumulation. Multiply by 21600 for 6-hour totals (mm) or by 86400 for daily totals."
    - "2 m temperature and 10 m winds are 6-hour forecasts, not analyses."
    - "Daily means (dailyavgs) average the four values at 00, 06, 12 and 18 UTC (00–24 UTC); monthly means (derived) are averages over the month."
  source: https://www.cpc.ncep.noaa.gov/products/wesley/cdrom/surfaceflux.html
  source_name: "NCEP/NCAR Reanalysis documentation — surface flux code definitions (A = 0–6 h forecast average/accumulation, 6 = 6-h forecast) + PSL netCDF file attributes"

variables:
  note: >-
    Main variables in the NOAA PSL netCDF files (from the OPeNDAP attributes). Names are those inside the files; the PSL folder and file-name pattern are given with each group.
    Most surface and flux variables are 6-hour forecasts (or forecast averages), not analyses.
  full_list: https://psl.noaa.gov/data/gridded/data.ncep.reanalysis.html
  groups:
    - name: Pressure levels (pressure/, e.g. air.2025.nc, 2.5°, 17 levels)
      kind: instant
      items:
        - "Air temperature — `air` (degK)"
        - "Geopotential height — `hgt` (m)"
        - "U-wind — `uwnd` (m/s)"
        - "V-wind — `vwnd` (m/s)"
        - "Omega (vertical velocity in pressure coordinates, 1000–100 hPa) — `omega` (Pascal/s)"
        - "Relative humidity (1000–300 hPa) — `rhum` (%)"
        - "Specific humidity (1000–300 hPa) — `shum` (kg/kg)"
    - name: Surface and column-integrated (surface/, 2.5°)
      kind: instant
      items:
        - "Sea level pressure — `slp` (Pascals)"
        - "Precipitable water for entire atmosphere — `pr_wtr` (kg/m^2, file pr_wtr.eatm)"
    - name: Surface fluxes and near-surface (surface_gauss/, T62 Gaussian)
      kind: mean
      period: 6-hourly
      items:
        - text: "Air temperature at 2 m — `air` (degK, file air.2m.gauss)"
          kind: instant
          note: "A 6-hour forecast according to the NCEP documentation (code 6). The PSL file attributes, however, label it statistic 'Mean' with avg_period 6 hours, which contradicts the documentation — check before use"
        - text: "U-wind at 10 m — `uwnd` (m/s, file uwnd.10m.gauss)"
          kind: instant
          note: "6-hour forecast (PSL attribute statistic 'Individual Obs')"
        - "Precipitation rate — `prate` (Kg/m^2/s)"
        - "Latent heat net flux — `lhtfl` (W/m^2)"
        - "Sensible heat net flux — `shtfl` (W/m^2)"
        - "Downward solar radiation flux at the surface — `dswrf` (W/m^2, file dswrf.sfc.gauss)"
    - name: Top of atmosphere (other_gauss/)
      kind: mean
      period: 6-hourly
      items:
        - "Upward longwave radiation flux at the nominal top of atmosphere (OLR) — `ulwrf` (W/m^2, file ulwrf.ntat.gauss)"

access:
  - name: NOAA PSL — NCEP/NCAR Reanalysis 1 data page
    url: https://psl.noaa.gov/data/gridded/data.ncep.reanalysis.html
    method: Variable listing, plotting and subsetting
    note: No account needed. Files are netCDF, one per variable and year.
  - name: NOAA PSL download server (6-hourly data)
    url: https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis/
    method: Direct HTTPS download
    note: >-
      Organised into pressure/, surface/, surface_gauss/, other_gauss/, spectral/ and tropopause/ folders.
      Daily means are in ncep.reanalysis.dailyavgs/ and monthly means in ncep.reanalysis.derived/.
  - name: NOAA PSL THREDDS / OPeNDAP (pressure-level example)
    url: https://psl.noaa.gov/thredds/catalog/Datasets/ncep.reanalysis/pressure/catalog.html
    method: Remote access via OPeNDAP
  - name: NSF NCAR GDEX — NCEP/NCAR Global Reanalysis Products (d090000)
    url: https://gdex.ucar.edu/datasets/d090000/
    method: Web download / subsetting
    note: >-
      Original GRIB1 (some BUFR), CC BY 4.0. This copy was updated monthly, so its end date can differ from PSL's.
      GDEX flags it as "recommended for ancillary use only and not as a primary research dataset" and notes it "has likely been superseded by a newer, improved dataset".

example:
  lang: python
  note: The PSL OPeNDAP URLs open directly in xarray. The 2026 files end at 18 UTC on 17 March.
  code: |
    import xarray as xr

    url = "https://psl.noaa.gov/thredds/dodsC/Datasets/ncep.reanalysis/pressure/air.2025.nc"
    ds = xr.open_dataset(url)
    t500 = ds["air"].sel(level=500)   # units degK, 6-hourly
    print(t500.mean("time"))

tips:
  - Kalnay et al. (1996) classify variables by how strongly observations constrain them — A (upper-air temperature and wind, most reliable), B (humidity, surface temperature), C (clouds, precipitation, surface fluxes; no direct observational influence), and so on. Class C variables largely reflect the model, so use them with caution.
  - Pressure-level humidity stops at 300 hPa and omega at 100 hPa. If you need upper-tropospheric water vapour, use another reanalysis.
  - "PSL's list of known problems covers, among others, the Southern Hemisphere PAOBS error (1979–1992), TOVS retrieval problems (1997–2001) and cold Southern Hemisphere land temperatures after a 1998 change in the snow analysis. Check these periods before interpreting long-term trends."
  - R1-based indices and climatologies (e.g. PSL plotting tools, circulation indices) may also have stopped in March 2026. For real-time monitoring, check whether they now use CORe or another reanalysis.

