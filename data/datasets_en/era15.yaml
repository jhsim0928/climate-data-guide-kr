# ─────────────────────────────────────────────────────────────
# ERA-15 — dataset information file
# ─────────────────────────────────────────────────────────────
id: era15
name: ERA-15
full_name: ECMWF 15-year Reanalysis (ERA-15)
category: reanalysis
domain: atmosphere
group: 재분석
order: 90
domains: [대기, 육지]
provider: ECMWF

status: ended
status_note: >-
  ECMWF's first reanalysis, produced once in the mid-1990s and never extended. It is no longer listed among ECMWF's public download services and is now most easily
  obtained from the copies archived at NSF NCAR GDEX and CEDA (UK). GDEX recommends it for "ancillary use only", so use ERA5 unless you are reproducing older
  studies or comparing reanalysis generations.

successor:
  name: "ERA-40 (currently recommended: ERA5)"
  url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
  note: >-
    The direct successor was ERA-40 (1957–2002), followed by ERA-Interim; ECMWF's current reanalysis is ERA5 (1940 to present, about 31 km).
    The link points to the ERA5 page on the CDS.

transitions:
  - from: ERA-15
    to: ERA-40
    to_id: era40
    status: completed
    summary: >-
      The move from the first generation (optimal interpolation, T106L31) to the second (3D-Var, T159L60) extended the record back to 1957 and added direct assimilation of
      satellite radiances and a coupled ocean-wave model.
    changes:
      - aspect: Period
        before: 1979–1993 (15 years)
        after: 1957-09 to 2002-08 (45 years)
      - aspect: Horizontal resolution
        before: T106 (~1.125°, ~125 km Gaussian grid)
        after: T159 (reduced Gaussian N80, ~125 km grid spacing)
      - aspect: Vertical resolution and model top
        before: 31 model levels (top at about 10 hPa)
        after: 60 model levels (top at about 0.1 hPa)
      - aspect: Pressure levels archived
        before: 17 levels (1000–10 hPa)
        after: 23 levels
      - aspect: Data assimilation
        before: Optimal interpolation (OI), 6-hourly cycle
        after: 3D-Var (FGAT), 6-hourly cycle
      - aspect: Use of satellite data
        before: TOVS cloud-cleared radiances converted by 1D-Var retrievals, used only below 100 hPa (not used above 100 hPa between 20°N and 20°S)
        after: Direct assimilation of satellite radiances from VTPR, TOVS, SSM/I, ATOVS and others (VTPR and SSU used for the first time)
      - aspect: Ocean waves
        before: None
        after: Coupled 1.5° ocean-wave model; significant wave height and other wave parameters provided
      - aspect: Model version
        before: Based on the 1995 operational system (resolution changed only)
        after: IFS CY23r4
    impacts:
      - Model, assimilation and observation usage all differ, so climatologies and variability can differ. Do not mix the two, even over their 1979–1993 overlap.
      - ERA-15 has only 17 pressure levels up to 10 hPa. When reproducing older stratospheric analyses, compare only the pressure levels common to ERA-40.
      - Uppala et al. (2005) judged ERA-40 generally better than ERA-15, but noted excessive tropical oceanic precipitation in the later years and an overly strong Brewer–Dobson circulation in ERA-40. Switching to ERA-40 does not remove the limits for hydrological-cycle and stratospheric studies.
      - Both are discontinued earlier-generation products; use ERA5 for new work.
    sources:
      - name: Gibson et al. (1997), ERA Description (ERA-15 Report Series No. 1)
        url: https://www.ecmwf.int/en/elibrary/9584-era-description
      - name: Uppala et al. (2005), The ERA-40 re-analysis, QJRMS
        url: https://doi.org/10.1256/qj.04.176
      - name: Kållberg et al. (2004), The ERA-40 archive (ERA-40 Project Report Series No. 17)
        url: https://www.ecmwf.int/sites/default/files/elibrary/2004/10595-era-40-archive-revised-october-2007.pdf
      - name: Uppala (2006), From ERA-15 to ERA-40 and ERA-Interim (ECMWF/GEO Workshop)
        url: https://www.ecmwf.int/sites/default/files/elibrary/2006/12885-era-15-era-40-and-era-interim.pdf
      - name: NCAR Climate Data Guide — ERA-40
        url: https://climatedataguide.ucar.edu/climate-data/era40
      - name: CEDA ERA-15 parameter tables (17 pressure levels)
        url: https://artefacts.ceda.ac.uk/badc_datadocs/ecmwf-era/params.html

period:
  start: "1979-01"
  end: "1993-12"
  note: >-
    January 1979 to December 1993 (15 years) at ECMWF and NCAR GDEX. The CEDA archive holds "a long time-series (January 1979 - February 1994) of consistent meteorological
    analyses", i.e. it also includes data to the end of February 1994.

resolution:
  spatial_short: "125 km (1.125°)"
  temporal_short: "6시간"
  spatial: "Spectral T106 (~1.125°) / reduced Gaussian N80 / regular 2.5° × 2.5° latitude–longitude grid"
  vertical: "31 model levels / 17 pressure levels (1000–10 hPa)"
  temporal: 6-hourly analyses (00, 06, 12, 18 UTC); monthly means separately

coverage:
  short: 전지구
update: Ended (production completed in the mid-1990s)
license: NCAR GDEX copy — Creative Commons Attribution 4.0 International plus ECMWF Terms of Use / CEDA copy — ECMWF ERA products licence
account_required: true

summary: >-
  ECMWF's first reanalysis, which re-analysed 1979–1993 with "a special version of their 1995 operational data assimilation system and model" held fixed throughout.
  It used optimal interpolation (OI) and a T106, 31-level model and, together with the contemporaneous NCEP/NCAR reanalysis, is classed as a first-generation reanalysis.
  Lessons learned (handling of observation biases, quality-control blacklists and more) were carried into ERA-40.

time_convention:
  summary: >-
    The ERA-15 data archived at NCAR and CEDA are analyses at 00, 06, 12 and 18 UTC, and all variables listed here are instantaneous values at those times.
    Accumulated forecast fields such as precipitation, radiation and heat fluxes are not in the public parameter tables summarised on this page.
  points:
    - "The time in the file name (HH in YYMMDDHH = 00, 06, 12, 18) is the analysis time."
    - "According to ECMWF documentation, the analyses were produced by 6-hourly optimal interpolation (OI), so each value is the analysed state at that time."
    - "For accumulated forecast fields (precipitation, fluxes) or monthly means, check the archive tables (monthly means and forecast accumulations) in the ERA-15 technical report; they are not included in the variable list on this page."
  source: https://artefacts.ceda.ac.uk/badc_datadocs/ecmwf-era/params.html
  source_name: "CEDA ERA-15 parameter tables (analysis files)"

variables:
  note: >-
    Based on the parameter tables of the ERA-15 data held at CEDA. Names are ECMWF GRIB abbreviations (upper case in the original);
    current ecCodes shows the same codes as lower-case short names (`t`, `2t`, etc.). The original files are GRIB1.
  full_list: https://artefacts.ceda.ac.uk/badc_datadocs/ecmwf-era/params.html
  groups:
    - name: Pressure levels (17)
      kind: instant
      items:
        - text: "Geopotential — `Z` (m2 s-2)"
          note: "divide by 9.80665 for geopotential height (m)"
        - "Temperature — `T` (K)"
        - "U-velocity — `U` (m s-1)"
        - "V-velocity — `V` (m s-1)"
        - "Vertical velocity — `W` (Pa s-1)"
        - "Relative humidity — `R` (%)"
        - "Vorticity (relative; spectral data) — `VO` (s-1)"
        - "Divergence (spectral data) — `D` (s-1)"
    - name: Surface and single level
      kind: instant
      items:
        - "Mean sea level pressure — `MSL` (Pa)"
        - "2 metre temperature — `2T` (K)"
        - "2 metre dewpoint temperature — `2D` (K)"
        - "10 metre u wind component — `10U` (m s-1)"
        - "10 metre v wind component — `10V` (m s-1)"
        - "Skin temperature — `SKT` (K)"
        - "Snow depth — `SD` (m of water equivalent)"
    - name: Land surface
      kind: instant
      items:
        - "Soil temperature level 1 — `STL1` (K)"
        - "Soil wetness level 1 — `SWL1` (m of water)"
        - text: "Surface roughness — `SR` (m)"
          kind: instant
          note: "Stored at each analysis time in the analysis files; whether it varies in time is not stated in the official documentation"
        - text: "Albedo — `AL` (-)"
          kind: instant
          note: "Stored at each analysis time in the analysis files; whether it varies in time is not stated in the official documentation"

access:
  - name: NSF NCAR GDEX — ERA-15 Global Surface Reanalysis (d115000)
    url: https://gdex.ucar.edu/datasets/d115000/
    method: Web download (HTTPS) / Globus / subsetting
    note: Global 6-hourly surface, near-surface and single-level analyses, about 12 GB. Subsetting and format conversion require an NCAR login.
  - name: NSF NCAR GDEX — ERA-15 Global Upper Air Analyses (d115001)
    url: https://gdex.ucar.edu/datasets/d115001/
    method: Web download (HTTPS) / Globus / subsetting
    note: Global 6-hourly upper-air (pressure-level) analyses, about 55 GB.
  - name: NSF NCAR GDEX — ERA-15 upper-air analyses at model resolution (d115004)
    url: https://gdex.ucar.edu/datasets/d115004/
    method: Web download (HTTPS) / Globus
  - name: CEDA Archive — ERA-15 model data
    url: https://catalogue.ceda.ac.uk/uuid/73ec447ea99457c77c0ef9692f76393f
    method: Web download
    note: Requires CEDA registration. The ECMWF ERA products licence applies.

tips:
  - "According to ECMWF reports, January 1979 – August 1980 was rerun early in production because of an upper-air humidity error, and June 1990 – October 1992 was rerun because satellite cloud-motion winds (except GMS) had been omitted. If you use an old copy, check that it contains the rerun data."
  - Snow is reset by observations in every analysis cycle, so the water budget (precipitation − evaporation − runoff) does not close. The data are not suitable for hydrological budget calculations.
  - With only 17 pressure levels (top at 10 hPa) and no direct radiance assimilation, this first-generation product is unsuitable for stratospheric or long-term trend work; use ERA5.

