      text: >-
        Schweiger, A., Lindsay, R., Zhang, J., Steele, M., Stern, H., Kwok, R. (2011): Uncertainty in modeled Arctic sea ice volume.
        Journal of Geophysical Research, 116, C00D06.
      doi: 10.1029/2011JC007084
      bibtex: |
        @article{schweiger2011piomas,
          author  = {Schweiger, Axel and Lindsay, Ron and Zhang, Jinlun and Steele, Mike and Stern, Harry and Kwok, Ron},
          title   = {Uncertainty in modeled {Arctic} sea ice volume},
          journal = {Journal of Geophysical Research},
          volume  = {116},
          pages   = {C00D06},
          year    = {2011},
          doi     = {10.1029/2011JC007084}
        }
    - label: Model description (cited as requested by PSC)
      text: >-
        Zhang, J., Rothrock, D. A. (2003): Modeling global sea ice with a thickness and enthalpy distribution model in generalized
        curvilinear coordinates. Monthly Weather Review, 131(5), 845–861.
      doi: 10.1175/1520-0493(2003)131<0845:MGSIWA>2.0.CO;2
      bibtex: |
        @article{zhang2003ted,
          author  = {Zhang, Jinlun and Rothrock, D. A.},
          title   = {Modeling Global Sea Ice with a Thickness and Enthalpy Distribution Model in Generalized Curvilinear Coordinates},
          journal = {Monthly Weather Review},
          volume  = {131},
          number  = {5},
          pages   = {845--861},
          year    = {2003},
          doi     = {10.1175/1520-0493(2003)131<0845:MGSIWA>2.0.CO;2}
        }
  acknowledgement: >-
    PSC asks users to cite Schweiger et al. (2011) for the volume time series and uncertainties and Zhang and Rothrock (2003) for model details.
    Recording the version (currently v2.1) and download date will help distinguish your data from any later reprocessing or forcing change.

notices:
  - date: "2026-03-24"
    level: critical
    title: NCEP/NCAR R1 reanalysis terminated — PIOMAS updates stopped
    body: >-
      NOAA NWS/NCEP terminated the NCEP/NCAR R1 reanalysis, PIOMAS's atmospheric forcing, as of March 18, 2026 (announced by NOAA on February 13).
      PSC will have to find alternatives and generate a replacement, does not yet know whether that is possible with available funds, and warns that the gap will be longer than usual.
      No restart had been announced as of 2026-10-11.
    source: https://psc.apl.uw.edu/research/projects/arctic-sea-ice-volume-anomaly/

