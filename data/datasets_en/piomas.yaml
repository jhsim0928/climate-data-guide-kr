example:
  lang: python
  note: Download and unzip heff.H2025.gz, and also get grid.dat from utilities/ on the same server.
  code: |
    import numpy as np

    nx, ny = 360, 120
    # Headerless single-precision binary; 12 monthly fields back to back (use ">f4" if big-endian)
    heff = np.fromfile("heff.H2025", dtype="<f4").reshape(12, ny, nx)
    if np.nanmax(np.abs(heff)) > 100:  # implausible values: re-read with swapped byte order
        heff = np.fromfile("heff.H2025", dtype=">f4").reshape(12, ny, nx)
    print("September mean thickness, max (m):", heff[8].max())

tips:
  - >-
    PIOMAS is a model estimate that assimilates no thickness observations. In the satellite era it has been reported to overestimate thin ice and underestimate thick ice,
    so do not call it "observed thickness", and compare with ICESat or CryoSat-2 thickness where possible.
  - >-
    PSC gives an uncertainty of about ±1.0 × 10³ km³ per decade for the volume trend and about ±0.75 × 10³ km³ for monthly anomalies. Long-term trends also depend on the atmospheric reanalysis used as forcing,
    so if production resumes with a new forcing after 2026, check the version and forcing before joining new and old data.
  - >-
    The model's southern boundary excludes parts of the Sea of Okhotsk, the Gulf of St. Lawrence and the Labrador Sea. Match domains when comparing with Northern Hemisphere ice volume from other sources,
    especially in winter.
  - >-
    Binary files may need byte-swapping depending on your system. heff and area are also available as NetCDF (.nc.gz), which is easier.

