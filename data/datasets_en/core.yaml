notices:
  - date: "2026-04-01"
    level: info
    title: NODD now holds 1950–2025
    body: >-
      CPC reports that, as of April 1, 2026, the NOAA NODD archive (Google Cloud) has data from 1950 through 2025 (3-hourly, daily means and monthly means).
      Newer data are added in near real time with about a 1-day latency.
    source: https://www.cpc.ncep.noaa.gov/products/CORe/index.html
  - date: "2026-03-19"
    level: info
    title: CORe implemented at NCEP, replacing CDAS
    body: >-
      The CPC CORe page states that CORe was implemented on March 19, 2026 (a PSL notice gives NCEP's switchover as March 18).
      The NCEP Director approved running CDAS for one more year for internal conversion, with public CDAS distribution ending 30 days after CORe became operational.
      PSL is not involved in CORe production and has no plans to distribute it.
    source: https://www.cpc.ncep.noaa.gov/products/CORe/index.html
  - date: "2026-03-13"
    level: info
    title: NOAA CORe (d090004) published at NCAR GDEX
    body: Published 2026-03-13 according to the UCAR data catalog, under CC BY 4.0; the dataset DOI is listed as not assigned.
    source: https://data.ucar.edu/dataset/noaa-conventional-observation-reanalysis-core
  - date: "2026-03-09"
    level: warning
    title: "SCN 26-12 Updated: CDAS upgraded to CORe — cdas and cdas2 directories removed from NOMADS and FTP"
    body: >-
      Under Service Change Notice 26-12 (issued February 9, updated February 13, 2026), CDAS data files are no longer available as of March 9, 2026,
      including the cdas/ and cdas2/ paths on NOMADS and FTP and the tgftp CDAS path. CORe files are on NOMADS under /com/core/.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf
  - date: "2026-03-09"
    level: warning
    title: GRIB1 replaced by GRIB2; new file names and directory structure
    body: >-
      CDAS GRIB version 1 files are replaced by CORe GRIB version 2 files under core.YYYYMMDD/HH/post/ (flx, flx_stats, nceppost, spost, spost_stats),
      named per member (e.g. core.tRRz.flx.memMMM.grib2, MMM = 001–080), ensemble mean (ensmean) and ensemble statistics (ensstats). Existing CDAS download scripts need updating.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf
  - date: "2025-09-05"
    level: warning
    title: Cloud top/bottom fields removed from NODD flx files; record numbers will change
    body: >-
      Interpolation of cloud top and bottom TMP and PRES from the model grid to the Gaussian grid had a problem, so these fields were removed from the flx files uploaded to NODD.
      CPC notes that once NODD is updated in real time the fixed fields will be included, adding 11 GRIB messages to the flx files and changing the field numbering.
    source: https://ftp.cpc.ncep.noaa.gov/CORe/get_core/get_core.txt

