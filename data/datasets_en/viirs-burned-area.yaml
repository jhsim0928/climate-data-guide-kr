transitions:
  - from: VNP64A1 V001
    to: VNP64A1 V002 (Collection 2)
    status: completed
    date: "2024-10"
    summary: >-
      Collection 2 (V002), with a corrected cloud mask and calibration, was released on 22 October 2024. V001 had many false detections caused by cloud-mask artifacts,
      was released only on a limited basis, and was decommissioned on 31 July 2025.
    changes:
      - aspect: Release status
        before: "Limited, provisional release; decommissioned 2025-07-31"
        after: "Released 2024-10-22 as a standard product (2012-03 onward)"
      - aspect: Cloud mask
        before: "Blocky ~5 km cloud-mask artifacts caused many false burns along inland water edges and at high latitudes"
        after: "Improved cloud mask; eight-class land/water mask from VNP03"
      - aspect: Inputs
        before: "Collection 1 VIIRS inputs"
        after: "Updated calibration coefficients, improved geolocation, corrected aerosol quantity flag"
    impacts:
      - Recompute results built on V001 with V002; V001 can no longer be downloaded.
    sources:
      - name: VIIRS Version 2 Burned Area Data Product Released (Earthdata, 2024-10-22)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-burned-area-data-product-released
      - name: VNP64A1 V001 catalog entry (decommissioning note)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp64a1-001
      - name: Giglio et al. (2025)
        url: https://doi.org/10.1016/j.rse.2025.115006
  - from: VNP64A1 C2 (Suomi NPP only)
    to: VIIRS burned area Collection 3 (Suomi NPP + NOAA-20)
    status: planned
    summary: >-
      The developers say a Collection 3 combining Suomi NPP and NOAA-20 VIIRS is planned, with the file format moving to netCDF4. Because Suomi NPP delivery ends in November 2026,
      continuity of the burned area record depends on this product, but as of 2026-10-13 no release schedule has been published.
    changes:
      - aspect: Satellites
        before: "Suomi NPP VIIRS only"
        after: "Planned combination of Suomi NPP and NOAA-20 VIIRS (tests showed composite gaps shrinking by 10–20%)"
      - aspect: File format
        before: "HDF4 (HDF-EOS2)"
        after: "netCDF4 planned"
      - aspect: Release
        before: "C2 released 2024-10"
        after: "Not scheduled (no NOAA-20 burned area collection in CMR on 2026-10-13)"
    impacts:
      - Burned area after November 2026 must wait for a Collection 3 or NOAA-20 release; once available, check its differences from C2 over the overlap period.
    sources:
      - name: Giglio et al. (2025) — Collection 3 plans
        url: https://doi.org/10.1016/j.rse.2025.115006
      - name: VNP64 User Guide v1.1
        url: https://lpdaac.usgs.gov/documents/2124/VNP64_User_Guide_v1.1.pdf

notices:
  - date: "2026-08-07"
    level: critical
    title: Suomi NPP science data delivery ends on 1 November 2026 — routine VNP64A1 production to stop
    body: >-
      Following NOAA NESDIS's 3 August 2026 announcement, delivery of all Suomi NPP science data, including VIIRS, ends at 13:00 UTC on 1 November 2026, and NASA advises moving
      to NOAA-20 and NOAA-21 products (the date may change). The VNP64A1 collection description also gives 2 November 2026 (2026/306) as the end of delivery.
      LAADS has said the existing Suomi NPP VIIRS archive is currently planned to remain available afterwards, but that this may change.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
  - date: "2025-09-24"
    level: info
    title: VNP64A1 burned area added to NASA FIRMS
    body: >-
      Monthly and annual VNP64A1 burned area can now be viewed alongside the MODIS products in FIRMS Advanced and Burned Area modes.
      The announcement notes that both products appear with roughly a five-month lag and that a combined Suomi NPP and NOAA-20 burned area product is planned.
    source: https://www.earthdata.nasa.gov/news/blog/viirs-global-burned-area-product-added-firms
  - date: "2025-07-08"
    level: info
    title: VIIRS Version 1 products, including burned area (VNP64A1.001), decommissioned on 2025-07-31
    body: >-
      LP DAAC announced it would stop distributing VIIRS Version 1 thermal anomalies, land cover dynamics, vegetation indices, burned area and BRDF/albedo products on 31 July 2025.
      Use Version 2 (VNP64A1.002) for burned area.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-data-products-decommissioned
  - date: "2024-11-02"
    level: info
    title: Suomi NPP GPS anomaly — VIIRS land data gap, 2–6 November 2024
    body: >-
      A GPS anomaly left data from 21:12 UTC on 2 November to 17:36 UTC on 6 November 2024 unrecoverable because of geolocation and timestamp errors, and Suomi NPP VIIRS land production was suspended.
      Normal production resumed after recovery, but the gap is permanent and may affect November 2024 burned area.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-viirs-data-product-anomaly-november-2024
  - date: "2024-10-22"
    level: info
    title: VIIRS Version 2 burned area (VNP64A1.002) released
    body: >-
      LP DAAC released Version 2 of the Suomi NPP VIIRS burned area product from March 2012 onward, with improved calibration, geolocation and cloud mask.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-burned-area-data-product-released
  - date: "2024-09-24"
    level: info
    title: Suomi NPP VIIRS anomaly — data from 26–27 September 2024 unrecoverable
    body: >-
      Data from 00:00 UTC on 26 September to 17:30 UTC on 27 September 2024 could not be recovered, and Suomi NPP VIIRS land production was temporarily suspended.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-viirs-data-product-anomaly-september-2024

