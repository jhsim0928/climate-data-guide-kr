notices:
  - date: "2026-09-21"
    level: info
    title: Follow-on ISCCP-NG demonstrator released (CM SAF, year 2021)
    body: >-
      EUMETSAT CM SAF released an ISCCP-NG demonstrator dataset built from global level-1 composites of five geostationary satellites. The first release covers 2021
      and provides cloud properties and top-of-atmosphere radiative fluxes at 0.05° and half-hourly resolution. It is a demonstrator, not a long-term record, so it does not yet continue ISCCP-H.
    source: https://www.cmsaf.eu/SharedDocs/Kurzmeldungen/EN/2026/news5.html

