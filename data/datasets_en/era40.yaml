  - name: NSF NCAR GDEX — ERA-40 Global Surface and Flux Data (d117000)
    url: https://gdex.ucar.edu/datasets/d117000/
    method: Web download (HTTPS) / Globus / subsetting and format conversion
    note: 6-hourly surface and flux data on the Gaussian grid. Subsetting and format conversion require an NCAR login.
  - name: NSF NCAR GDEX — ERA-40 Monthly Means of 2.5 Degree Upper Air Pressure Level Analysis (d120001)
    url: https://gdex.ucar.edu/datasets/d120001/
    method: Web download (HTTPS) / Globus / subsetting
  - name: NSF NCAR GDEX — ERA-40 2.5° surface and flux monthly means (d120000)
    url: https://gdex.ucar.edu/datasets/d120000/
    method: Web download (HTTPS) / Globus / subsetting
  - name: NSF NCAR GDEX — ERA-40 Global Upper Air Pressure Level Analysis (d117001)
    url: https://gdex.ucar.edu/datasets/d117001/
    method: On request
    note: >-
      When checked on 2026-10-11 the dataset was marked as containing files that are not currently available, so request them through GDEX Contact Us.
      The 2.5° 6-hourly pressure-level (d118001) and surface (d118000) datasets are in the same state.
  - name: CEDA Archive — ERA-40 model data
    url: https://catalogue.ceda.ac.uk/uuid/775634f7e339b5262067e28a5d7b679d
    method: Web download
    note: Requires a CEDA account. Holds data on the reduced Gaussian grid and the regular 2.5° grid; ECMWF data conditions apply.

tips:
  - "The NCAR Climate Data Guide lists the main weaknesses: tropical moisture (precipitation, total column water) too high after 1991, precipitation well above evaporation, an overly strong Brewer-Dobson circulation and unrealistic Arctic temperature trends. Avoid ERA-40 for hydrological-cycle, stratospheric or Arctic-trend studies."
  - The observing system changes sharply around 1979 as satellite data come in. A trend over the full 1957–2002 period can carry that discontinuity.
  - With only 23 pressure levels, compare with ERA-Interim or ERA5 (37 levels) on the levels they share.

