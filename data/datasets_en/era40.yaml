# ─────────────────────────────────────────────────────────────
# ERA-40 — dataset information file
# ─────────────────────────────────────────────────────────────
id: era40
name: ERA-40
full_name: ECMWF 40-year Reanalysis (ERA-40)
category: reanalysis
domain: atmosphere
group: 재분석
order: 100
domains: [대기, 육지, 해양파랑]
provider: European Centre for Medium-Range Weather Forecasts (ECMWF)

status: ended
status_note: >-
  Production finished in the early 2000s and the record is no longer updated. ECMWF decommissioned its Public Datasets service (web interface and Web API)
  on 1 June 2023 and does not offer another public route for ERA-40. In practice the data now come from NCAR GDEX (some products openly available)
  or the copy at CEDA in the UK.

successor:
  name: ERA-Interim → ERA5
  url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
  note: >-
    The direct successor was ERA-Interim (1979–2019), itself now discontinued; the recommended reanalysis today is ERA5 (1940 to present, about 31 km, 137 levels).
    ERA5 also covers 1957–1978, the period that used to require ERA-40.

transitions:
  - from: ERA-40
    to: ERA-Interim
    to_id: era-interim
    status: completed
    summary: ERA-Interim replaced 3D-Var with 12-hour 4D-Var and variational bias correction of satellite radiances (VarBC) and raised the resolution to T255, addressing ERA-40's problems with the hydrological cycle, the stratospheric circulation and temporal consistency.
    changes:
      - aspect: Period
        before: 1957-09 to 2002-08
        after: 1979-01 to 2019-08 (updated in near real time until August 2019)
      - aspect: Horizontal resolution
        before: T159 (N80, about 125 km)
        after: T255 (N128, about 79–80 km)
      - aspect: Vertical resolution and model top
        before: 60 model levels, top level 0.1 hPa
        after: 60 model levels, top level 0.1 hPa (unchanged)
      - aspect: Pressure and isentropic output levels
        before: 23 pressure levels / 15 isentropic levels
        after: 37 pressure levels / 16 isentropic levels
      - aspect: Model version
        before: IFS CY23r4
        after: IFS CY31r2
      - aspect: Data assimilation
        before: 3D-Var (FGAT), 6-hour window
        after: 4D-Var, 12-hour window
      - aspect: Satellite radiance bias correction
        before: Static bias correction
        after: Variational bias correction (VarBC), adjusted automatically
      - aspect: Observations
        before: Observations collected and reprocessed for ERA-40
        after: ERA-40 observations plus GTS real-time data, rain-affected SSM/I radiances (1D-Var), reprocessed Meteosat winds and more
      - aspect: Known problems addressed
        before: Excessive tropical oceanic precipitation, too strong Brewer-Dobson circulation, poor temporal consistency
        after: More realistic hydrological cycle (global precipitation-evaporation balance) and stratospheric circulation (age of air)
      - aspect: Ocean-wave grid
        before: 1.5°
        after: 1.0°
    impacts:
      - Do not splice the two into one time series. Climatologies and trends can differ even over the 1979–2002 overlap.
      - ERA-40 has 23 pressure levels against ERA-Interim's 37; compare on the common levels only.
      - ERA-Interim starts in 1979. For 1957–1978, use ERA5 (from 1940) rather than ERA-40.
      - ERA-Interim still has its own limitations, such as too strong a hydrological cycle over the oceans and warm, moist low-level biases in the Arctic. Do not overstate the improvement.
    sources:
      - name: Dee et al. (2011), The ERA-Interim reanalysis, QJRMS
        url: https://doi.org/10.1002/qj.828
      - name: Uppala et al. (2005), The ERA-40 re-analysis, QJRMS
        url: https://doi.org/10.1256/qj.04.176
      - name: ECMWF — What is the difference between ERA-Interim (1979-2019) and ERA-40 (1957-2002)
        url: https://confluence.ecmwf.int/spaces/CKB/pages/56659628/What+is+the+difference+between+ERA-Interim+1979-2019+and+ERA-40+1957-2002
      - name: ERA-Interim documentation (Copernicus Knowledge Base)
        url: https://confluence.ecmwf.int/spaces/CKB/pages/155337848/ERA-Interim+documentation
      - name: Kållberg et al. (2004), The ERA-40 archive
        url: https://www.ecmwf.int/sites/default/files/elibrary/2004/10595-era-40-archive-revised-october-2007.pdf
      - name: Uppala (2006), From ERA-15 to ERA-40 and ERA-Interim
        url: https://www.ecmwf.int/sites/default/files/elibrary/2006/12885-era-15-era-40-and-era-interim.pdf

period:
  start: "1957-09"
  end: "2002-08"
  note: September 1957 to August 2002 (45 years), starting just before the International Geophysical Year (1958).

resolution:
  spatial_short: "125 km (1.125°)"
  temporal_short: "6시간"
  spatial: "Spectral T159 / reduced Gaussian grid N80 (approximately uniform 125 km spacing) / 2.5° × 2.5° latitude-longitude grid on the public data server"
  vertical: "60 model levels (top level 0.1 hPa) / 23 pressure levels / 15 isentropic levels"
  temporal: 6-hourly analyses (00, 06, 12, 18 UTC); monthly means separately

update: Ended (August 2002 is the last month)
license: NCAR GDEX copies are CC BY 4.0, with acceptance of the ECMWF terms of use
account_required: true

summary: >-
  ECMWF's second-generation reanalysis of the global atmosphere and surface conditions for the 45 years from September 1957 to August 2002.
  It used 3D-Var (FGAT) data assimilation with a T159, 60-level model and was among the first reanalyses to assimilate satellite radiances (TOVS, SSM/I, etc.) directly.
  A coupled ocean-wave model provides wave parameters as well. ERA-40 was a standard dataset for climate research until the mid-2000s and has since been superseded by ERA5.

time_convention:
  summary: >-
    Analysed fields are instantaneous values at 00, 06, 12 and 18 UTC. Accumulated quantities such as precipitation, radiation and surface fluxes come only from forecasts
    and are accumulated from the forecast start to the given step (the public 2.5° data offered 6-hour forecasts only).
  points:
    - "Accumulations run from the start of the forecast. Forecasts start at 00 and 12 UTC (to 36 h) and at 06 and 18 UTC (to 6 h); for shorter intervals, difference consecutive forecast steps."
    - "The 2.5° data on ECMWF's former public data server contained 6-hour forecasts only, so accumulations there are 6-hour totals. For files from other archives, check the forecast start time and step in the GRIB header."
    - "To turn accumulated radiation and heat fluxes (W m-2 s) into mean fluxes (W m-2), divide by the accumulation period in seconds. The monthly accumulation stream (mdfa) is expressed per day: divide by 86,400 to get W m-2, and multiply precipitation by 1000 to get mm/day."
    - "Fluxes in the monthly mean stream moda are in 'per six hours' units and not aligned with calendar months; ECMWF strongly recommends using mdfa instead."
    - "Maximum and minimum 2 m temperature refer to the period since the previous post-processing; no monthly means were produced for them."
  source: https://www.ecmwf.int/sites/default/files/elibrary/2004/10595-era-40-archive-revised-october-2007.pdf
  source_name: "The ERA-40 archive (ERA-40 Project Report Series No. 17)"

variables:
  note: >-
    Main parameters from the parameter tables of the ERA-40 archive report (ERA-40 Project Report Series No. 17).
    Names are ECMWF GRIB short names (matching the parameter codes). The original data are GRIB1; accumulated parameters are forecast accumulations (W m-2 s, etc.).
  full_list: https://www.ecmwf.int/sites/default/files/elibrary/2004/10595-era-40-archive-revised-october-2007.pdf
  groups:
    - name: Pressure levels (23)
      kind: instant
      items:
        - "Geopotential — `z` (m2 s-2)"
        - "Temperature — `t` (K)"
        - "Eastward wind component — `u` (m s-1)"
        - "Northward wind component — `v` (m s-1)"
        - "Vertical velocity — `w` (Pa s-1)"
        - "Specific humidity — `q` (kg kg-1)"
        - "Relative humidity — `r` (%)"
        - "Vorticity (relative) — `vo` (s-1)"
        - "Divergence — `d` (s-1)"
        - "Potential vorticity — `pv` (K m2 kg-1 s-1)"
        - "Ozone mass mixing ratio — `o3` (kg kg-1)"
    - name: Surface and single level
      kind: instant
      items:
        - "Mean sea level pressure — `msl` (Pa)"
        - "2 metre temperature — `2t` (K)"
        - "2 metre dewpoint temperature — `2d` (K)"
        - "10 metre eastward wind component — `10u` (m s-1)"
        - "10 metre northward wind component — `10v` (m s-1)"
        - "Sea surface temperature — `sst` (K)"
        - "Sea ice fraction — `ci` (0-1)"
        - "Total cloud cover — `tcc` (0-1)"
        - "Total column water vapour — `tcwv` (kg m-2)"
    - name: Accumulated forecast parameters
      kind: accum
      period: "since forecast start"
      items:
        - "Large-scale and convective precipitation — `lsp`, `cp` (m of water)"
        - "Surface sensible and latent heat flux — `sshf`, `slhf` (W m-2 s)"
        - "Surface solar and thermal radiation downwards — `ssrd`, `strd` (W m-2 s)"
        - "Top thermal radiation — `ttr` (W m-2 s)"
        - "Evaporation — `e` (m of water)"
    - name: Ocean waves
      kind: instant
      items:
        - "Significant wave height — `swh` (m)"
        - "Mean wave direction — `mwd` (degrees)"
        - "Mean wave period — `mwp` (s)"
    - name: Land surface
      kind: instant
      items:
        - "Soil temperature level 1 — `stl1` (K)"
        - "Volumetric soil water layer 1 — `swvl1` (m3 m-3)"
        - "Snow depth — `sd` (m of water equivalent)"

