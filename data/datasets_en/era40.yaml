notices:
  - date: "2023-06-01"
    level: critical
    title: Decommissioning of ECMWF Public Datasets service — ECMWF web and Web API downloads end
    body: >-
      As announced on 2 March 2023, ECMWF decommissioned the Public Datasets service (web interface and Web API access), so ERA-40 can no longer be downloaded publicly from ECMWF.
      ECMWF names no alternative access route for ERA-40; use the NCAR GDEX or CEDA copies.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2022-06"
    level: info
    title: Access disruptions during the move of the ECMWF archive (MARS) to Bologna
    body: Because MARS moved to the new data centre in Bologna, ECMWF warned of no or degraded access to ERA-40 at times between June and October 2022 (now past).
    source: https://www.ecmwf.int/en/forecasts/dataset/ecmwf-reanalysis-40-years

