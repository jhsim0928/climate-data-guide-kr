transitions:
  - from: MODIS LST C6 (MOD11 and MOD21)
    to: MODIS LST C6.1
    status: completed
    date: "2021-02"
    summary: >-
      For MOD11 the science algorithm and file format are unchanged and the input L1B calibration improved. For MOD21 the atmospheric correction input changed from MERRA-2 (partly NCEP) to GEOS-5 FP,
      and new 0.05° global (CMG) products MxD21C1, C2 and C3 were added. Distribution of C6 ended on 2023-07-31.
    changes:
      - aspect: Input L1B calibration
        before: C6 calibration
        after: "Revised response-versus-scan-angle approach for reflective bands, optical crosstalk correction for Terra IR bands, corrected Terra forward look-up table for 2012–2017, polarization correction"
      - aspect: MOD11 algorithm
        before: Generalized split-window (C6)
        after: Unchanged (format also identical)
      - aspect: MOD21 atmospheric input
        before: MERRA-2 / NCEP operational and near-real-time combination
        after: GEOS-5 FP (about 1/3°×1/4°, 3-hourly); the User's Guide reports no apparent change in quality
      - aspect: MOD21 product set
        before: L2, A1D, A1N, A2
        after: L2, A1D, A1N, A2 + 0.05° CMG daily, 8-day and monthly (MxD21C1, C2, C3)
    impacts:
      - Do not mix C6 and C6.1; download the full period again from C6.1 (C6 has not been distributed since 2023-07-31).
    sources:
      - name: MOD21A1D V061 collection description (version description)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mod21a1d-061
      - name: MOD11 C6.1 User's Guide
        url: https://lpdaac.usgs.gov/documents/715/MOD11_User_Guide_V61.pdf
      - name: MOD21 C6.1 User's Guide
        url: https://lpdaac.usgs.gov/documents/1398/MOD21_User_Guide_V61.pdf
  - from: MODIS LST MOD11 and MOD21 C6.1
    to: VIIRS LST VNP21, VJ121 and VJ221 V2
    to_id: viirs-lst
    status: planned
    summary: >-
      NASA's VIIRS land surface temperature products are VNP21 (Suomi NPP), VJ121 (NOAA-20) and VJ221 (NOAA-21) V2, made with the same TES algorithm and inputs as MOD21; the developers report that MODIS (MxD21)
      and VIIRS LST agree within about ±0.5 K. There is no NASA VIIRS product continuing the MOD11 split-window method, so MOD11 users also change algorithm.
      The transition completes when Terra and Aqua end, from late 2026 onward.
    changes:
      - aspect: Algorithm
        before: "MOD11/MYD11 split-window (assumed emissivity) / MOD21/MYD21 TES"
        after: "TES only (VNP21, VJ121, VJ221, same method and inputs as MOD21)"
      - aspect: Thermal infrared bands
        before: "MODIS bands 29 (8.55 µm), 31 (11 µm), 32 (12 µm)"
        after: "VIIRS M14 (8.55 µm), M15 (10.76 µm), M16 (12 µm)"
      - aspect: Resolution
        before: "L2 1 km at nadir → L3 1 km SIN / 0.05° CMG"
        after: "L2 750 m → L3 1 km SIN (resampled from 750 m) / 0.05° CMG"
      - aspect: Overpass time
        before: "Terra 10:30 descending, Aqua 13:30 ascending (drifting since 2020–2021)"
        after: "13:30 ascending (Suomi NPP, NOAA-20 and NOAA-21 are all afternoon orbits). No VIIRS continues Terra's morning orbit"
      - aspect: Period
        before: "Terra 2000-02 onward / Aqua 2002-07 onward"
        after: "Suomi NPP from 2012-01-17 (delivery ending early November 2026) / NOAA-20 from 2018-01-01 / NOAA-21 from 2023-02-10"
      - aspect: Daily file layout and variable names
        before: "MOD11A1: day and night in one file (`LST_Day_1km`, `LST_Night_1km`) / MOD21A1D and A1N: separate day and night files (`LST_1KM`)"
        after: "VNP21A1D and A1N: separate day and night files (`LST_1KM`), emissivity `Emis_14`, `Emis_15`, `Emis_16`"
      - aspect: File format
        before: HDF-EOS2 (HDF4)
        after: HDF-EOS5 (HDF5)
    impacts:
      - Joining a MOD11 (split-window) series to VIIRS introduces a discontinuity from the algorithm difference (e.g. the 3–5 K arid-land bias). To join records, compare MOD21 (TES) and VIIRS over their overlap.
      - No VIIRS observation continues the Terra (morning) series. Even when joining Aqua (afternoon) to VIIRS, Aqua's drift period (2021 onward) samples a different time of day from VIIRS at 13:30.
      - VIIRS satellites also differ from each other in overpass time by 50 minutes to an hour, and a summer difference of about 0.5 K has been reported (VNP21 User's Guide).
    sources:
      - name: Hulley et al. (2018), IEEE JSTARS — MODIS and VIIRS LST consistency
        url: https://doi.org/10.1109/JSTARS.2017.2779330
      - name: VNP21 Collection 2 User's Guide
        url: https://lpdaac.usgs.gov/documents/1662/VNP21_User_Guide_V2.pdf
      - name: Transition from MODIS to VIIRS (Earthdata, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS placed in standby — some 2026-03-26/27 data flagged questionable or bad
    body: >-
      After a Terra spacecraft anomaly, MODIS went to standby at about 20:00 UTC on 26 March 2026 and returned to science mode on the 27th. The calibration team flagged data from 20:00 UTC on 26 March (DOY 085)
      until the blackbody reached its nominal temperature at 19:23 UTC on 27 March (DOY 086) as questionable or bad; data after that are considered safe to use.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: NASA projects end of science for Terra in February 2027 and Aqua in September 2027
    body: >-
      The editor's note in the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects that, because of fuel and power limits, science operations will end
      in February 2027 for Terra, September 2027 for Aqua and August 2028 for Aura, with the missions operating until then. This is later than the earlier plans (Terra in December 2025, Aqua in August 2026).
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-03-18"
    level: info
    title: MODIS L1B and geolocation Version 7.0 released — land products still C6.1
    body: >-
      LAADS DAAC released MODIS calibrated radiances and geolocation V7.0 and announced that the V6.1 Level-1 collection would be decommissioned after 2026-09-30.
      On 2026-10-13, CMR listed only V061 for the MOD11 and MOD21 land products, and no release schedule for C7 land products had been confirmed in an official notice.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2026-01-08"
    level: warning
    title: Impact of Terra and Aqua orbit drift on MODIS data under investigation (LDOPE)
    body: >-
      The MODIS Land Data Operational Product Evaluation team (LDOPE) reported that, as Terra and Aqua drift after ending orbit maintenance, pixel size and spacing, scan gaps,
      bow-tie overlap and diurnal sampling have changed, with significant impacts seen from late 2024, and that the effects on MODIS products are under investigation. Changes in diurnal sampling directly affect land surface temperature.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: info
    title: LP DAAC Data Pool distribution of MODIS ends (2025-06-30) — move to Earthdata Cloud
    body: >-
      LP DAAC ended Data Pool distribution of all MODIS datasets, including C6.1, on 30 June 2025. Scripts using Data Pool URLs must switch to Earthdata Cloud (HTTPS or earthaccess);
      Earthdata Search and AppEEARS continue to work.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua to begin shutting down in late 2026 to early 2027
    body: >-
      NASA announced that Terra and Aqua will begin shutting down in late 2026 or early 2027, and that both platforms are drifting from their designed orbits, changing crossing times and possibly affecting the data.
      A final reprocessing of MODIS data will follow the end of data collection, and users are encouraged to explore similar VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2024-01-16"
    level: warning
    title: Aqua MYD21 land surface temperature warm bias — band 29 brightness temperature drift since 2018
    body: >-
      LDOPE reported that Aqua MODIS band 29 brightness temperature has trended significantly upward since 2018 because of increasing electronic crosstalk among the LWIR bands, so that C6.1 Aqua TES land surface temperature (MYD21)
      is warmer than expected. A crosstalk correction from the calibration team is being tested and will be added to forward production once confirmed; whether the period since 2018 will be reprocessed has not been decided.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=220
  - date: "2023-07-25"
    level: info
    title: MODIS V6.0 land products decommissioned (2023-07-31) — move to V6.1
    body: >-
      LP DAAC stopped distributing MODIS V6.0 land products, including MOD11 and MOD21, on 31 July 2023. User guides and ATBDs remain on the DOI landing pages; use V6.1 for data.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

