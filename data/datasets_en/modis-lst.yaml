# ─────────────────────────────────────────────────────────────
# MODIS land surface temperature and emissivity MOD11/MYD11 and MOD21/MYD21 C6.1 — dataset information file
# Land tab (Land surface temperature & albedo). Covers both algorithms — split-window (MOD11) and TES (MOD21) — on one page.
# The key caveats are Terra and Aqua orbit drift (changing overpass times) and the end of both missions. The VIIRS successor is viirs-lst.yaml.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: modis-lst
name: "MODIS LST (MOD11·MOD21)"
full_name: MODIS/Terra and Aqua Land Surface Temperature and Emissivity MOD11/MYD11 (split-window) and MOD21/MYD21 (TES) Version 6.1 (1 km day and night land surface temperature and emissivity from MODIS)
category: satellite
domain: land
group: 지표면온도·알베도
order: 10
domains: [육지, 원격탐사]
provider: NASA MODIS Land Team (MOD11 Wan, Hook, Hulley; MOD21 Hulley, Hook / NASA JPL) / NASA LP DAAC

status: deprecated
status_note: >-
  Collection 6.1 is still produced daily (on 2026-10-13 MOD11A1 reached 6 October and MYD21A1D 11 October), but Terra and Aqua have drifted from their orbits because of fuel and power limits,
  shifting their overpass times substantially, and are expected to begin shutting down in late 2026 to early 2027; NASA advises moving to similar VIIRS products (VNP21, VJ121, VJ221).
  Because land surface temperature is very sensitive to observation time, values from the drift period (2020–2021 onward) should not be treated as taken at the same time of day as earlier values.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra (MOD11, MOD21) from 2000-02-24 (8-day and monthly products start with the periods beginning 2000-02-18 and 2000-02-01); Aqua (MYD11, MYD21) from 2002-07-04.
    On 2026-10-13 LP DAAC held data up to early to mid October 2026. Terra data from 2026-03-26 20:00 UTC to 2026-03-27 19:23 UTC were flagged as questionable or bad by the calibration team.
    A final reprocessing is planned once MODIS data collection ends.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    L3 tiles: MODIS Sinusoidal (SIN) grid at 1 km (actual 0.928 km, 1200×1200 pixels per tile) — MOD11A1/A2, MOD21A1D/A1N/A2 /
    MOD11B1/B2/B3: SIN grid at 6 km (5.568 km) / CMG: global 0.05° equal-angle grid — MOD11C1/C2/C3, MOD21C1/C2/C3 /
    L2 swath: about 1 km at nadir (MOD11_L2, MOD21, 5-minute granules)
  vertical: Single surface (skin) temperature layer + per-band thermal infrared emissivity (MOD11 bands 31 and 32; MOD21 bands 29, 31 and 32)
  temporal: >-
    Each satellite gives one daytime and one nighttime overpass per day (several at high latitudes) / daily (A1, C1) / 8-day (A2, C2) / monthly (B3, C3). Nominal equator crossing times are 10:30 descending (day) for Terra
    and 13:30 ascending (day) for Aqua local time, with night observations on the opposite orbit leg, but orbit drift has changed them.

update: Daily (1–2 days after observation); 8-day and monthly products after each period ends
license: Openly shared without restriction under the NASA EOSDIS Data Use and Citation Guidance. Downloading requires a free NASA Earthdata Login; citation of the dataset DOI is requested.
account_required: true

summary: >-
  Clear-sky land surface (skin) temperature and emissivity retrieved from the MODIS thermal infrared bands. Collection 6.1 contains two product families with different algorithms.
  MOD11/MYD11 use the generalized split-window method, based on the band 31–32 brightness temperature difference, with emissivity assumed from land cover classification, and screen out suspected cloudy pixels.
  MOD21/MYD21 use the ASTER-heritage temperature/emissivity separation (TES) method, which solves physically for band 29, 31 and 32 emissivity together with temperature; this reduces MOD11's 3–5 K cold bias over deserts and arid land, but unscreened hot outliers remain.
  There are separate Terra (morning and late evening) and Aqua (afternoon and early morning) versions, with daily, 8-day and monthly products on 1 km tiles and a 0.05° global grid.

time_convention:
  summary: >-
    Daily products (A1, C1) are clear-sky observations at the moment of the satellite overpass (at high latitudes with several overpasses per day, the average of the qualifying observations). Observation time varies
    from pixel to pixel, so check the view time layers that come with the data (`Day_view_time`, `View_Time`, etc.). The 8-day (A2, C2) and monthly (B3, C3) products are simple averages of the clear-sky daily values; cloudy days are left out.
  points:
    - "Nominally Terra crosses the equator at 10:30 local time descending (day) and Aqua at 13:30 ascending (day); night observations come from the opposite orbit leg. Even for one satellite the observation time of each pixel varies with position in the swath and latitude, so check the view time layers."
    - "Orbit drift: after its final inclination adjustment on 27 February 2020, Terra moved steadily earlier, reaching 10:15 by autumn 2022, and was predicted to reach about 9:00 around December 2025. Aqua began drifting later in July 2021, passed 13:45 in February 2023 and was expected to reach about 15:50 around August 2026."
    - "Land surface temperature changes strongly over the day, so computing trends straight across the period of changing overpass times mixes the time shift into the temperature signal. Since 2020, daytime Terra LST is sampled earlier (cooler) and daytime Aqua LST later in the afternoon, past midday."
    - "In MOD11A1 and A2, `Day_view_time` and `Night_view_time` are local solar time (UTC + longitude/15). The User's Guide describes the view time in the CMG products (C1, C2, C3) as UTC, so the reference may differ; check the file attributes."
    - "The 8-day day and night values in MOD11A2 and MOD21A2 average clear days only, so a single clear day out of eight still produces a value. In MOD11A2 the clear-sky bitmaps (`Clear_sky_days`, `Clear_sky_nights`) show which days went into the average."
    - "The file date (AYYYYDDD) of an 8-day product is the first day of the composite; for monthly products (B3, C3) it is the first day of the month."
  source: https://lpdaac.usgs.gov/documents/715/MOD11_User_Guide_V61.pdf
  source_name: "MOD11 C6.1 and MOD21 C6.1 User's Guides + LP DAAC 'Aqua MODIS Acquisition Plan Through August 2026' + Terra mission orbit information"

variables:
  note: >-
    Science datasets (SDS) from the LP DAAC data catalog and the C6.1 User's Guides. In the HDF-EOS2 (HDF4) files, physical value = stored value × scale_factor (+ offset).
    LST uses scale 0.02 (K) and stored value 0 is fill. MYD (Aqua) files use the same names. MOD11 sets suspected contaminated pixels to fill, whereas MOD21 keeps their values, so you must screen them with QC yourself.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mod11a1-061
  groups:
    - name: MOD11 split-window — daily 1 km (MOD11A1, MYD11A1)
      kind: instant
      period: overpass time
      items:
        - text: "Daytime land surface temperature — `LST_Day_1km` (K, scale 0.02)"
          std: [tskin]
          note: Clear-sky value at that day's daytime overpass. Above 30° latitude, the average of qualifying observations when there are several
        - text: "Nighttime land surface temperature — `LST_Night_1km` (K, scale 0.02)"
          std: [tskin]
          note: Value at that day's nighttime overpass
        - "Band 31 and 32 emissivity (land-cover based) — `Emis_31`, `Emis_32` (dimensionless, scale 0.002, offset 0.49)"
        - text: "Day and night view time — `Day_view_time`, `Night_view_time` (hours, local solar time, scale 0.1)"
          note: Actual observation time of each pixel; essential for orbit drift analysis
        - "Day and night view zenith angle — `Day_view_angl`, `Night_view_angl` (degrees, offset -65)"
        - "Day and night quality bits — `QC_Day`, `QC_Night` (bit field: 0–1 mandatory QA, 2–3 data quality, 4–5 emissivity error, 6–7 LST error)"
    - name: MOD11 split-window — 8-day and monthly (MOD11A2 1 km / MOD11C3 0.05°)
      kind: mean
      period: 8 days or month (clear days only)
      items:
        - text: "8-day day and night land surface temperature — `LST_Day_1km`, `LST_Night_1km` (K, scale 0.02)"
          std: [tskin]
          period: 8 days
          note: Simple average of clear-sky MOD11A1 values
        - text: "Monthly day and night land surface temperature (0.05°) — `LST_Day_CMG`, `LST_Night_CMG` (K, scale 0.02)"
          std: [tskin]
          period: Monthly
          note: Monthly average of the MOD11C1 daily values
        - text: "Clear-sky day and night bitmaps — `Clear_sky_days`, `Clear_sky_nights` (bit field)"
          kind: accum
          note: Bits mark the days in the period with a clear observation; use them to check how many days entered the average
    - name: MOD21 TES — daily 1 km (MOD21A1D day / MOD21A1N night; same for MYD21)
      kind: instant
      period: overpass time
      items:
        - text: "Land surface temperature — `LST_1KM` (K, scale 0.02)"
          std: [tskin]
          note: Separate day (A1D) and night (A1N) files. Coverage-weighted average of clear, good-accuracy observations overlapping the grid cell by more than 15%
        - "Band 29, 31 and 32 emissivity (retrieved by TES) — `Emis_29`, `Emis_31`, `Emis_32` (dimensionless, scale 0.002, offset 0.49)"
        - text: "View time — `View_Time` (hours, scale 0.1)"
          note: Observation time of each pixel
        - "View zenith angle — `View_Angle` (degrees, offset -65)"
        - "Quality bits — `QC` (16 bits: mandatory QA, data quality, cloud, TES iterations, atmospheric opacity, emissivity contrast, emissivity and LST accuracy)"
    - name: MOD21 TES — 8-day and monthly (MOD21A2 1 km / MOD21C3 0.05°)
      kind: mean
      period: 8 days or month (clear days only)
      items:
        - text: "8-day day and night land surface temperature — `LST_Day_1KM`, `LST_Night_1KM` (K, scale 0.02)"
          std: [tskin]
          period: 8 days
          note: Simple average of clear-sky MOD21A1D/A1N values; emissivity is averaged over day and night together
        - text: "Monthly day and night land surface temperature (0.05°) — `LST_Day`, `LST_Night` (K, scale 0.02)"
          std: [tskin]
          period: Monthly
          note: Monthly average of the MOD21C1 daily values
        - text: "Monthly LST uncertainty (0.05°) — `LST_Day_err`, `LST_Night_err` (K, scale 0.04)"
          period: Monthly
    - name: Static information
      kind: static
      items:
        - "Land fraction in grid cell (CMG) — `Percent_land_in_grid` (%)"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C1748058432-LPCLOUD
    method: HTTPS download / earthaccess / Earthdata Search
    note: >-
      Example short names: MOD11A1, MOD11A2, MOD11C1, MOD11C3, MOD11_L2, MOD21A1D, MOD21A1N, MOD21A2, MOD21C1, MOD21C3, MOD21 (L2); replace MOD with MYD for Aqua. All are version 061.
      Files are served over HTTPS from data.lpdaac.earthdatacloud.nasa.gov and need a free Earthdata Login. Distribution through the old LP DAAC Data Pool ended on 2025-06-30.
  - name: AppEEARS (area and point subsetting)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Web / API — point time series and area extracts as GeoTIFF or NetCDF4
    note: Lets you request only the area, period and layers you need and reproject to geographic coordinates; handy for comparisons with station points.
  - name: Direct access in AWS us-west-2 (S3)
    url: https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials
    method: Cloud storage (S3, from within us-west-2 only)
    note: Stored under paths such as s3://lp-prod-protected/MOD11A1.061/ and accessed with temporary credentials.

example:
  lang: python
  note: >-
    Downloads Terra MOD11A1 daily files with earthaccess, reads them with pyhdf and keeps only pixels whose mandatory QA (bits 0–1) is 'good' (00). Read the view time too, to check the effect of orbit drift.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="MOD11A1", version="061",
        temporal=("2024-08-01", "2024-08-03"),
        bounding_box=(126.5, 37.0, 127.5, 38.0),   # (west, south, east, north) around Seoul
    )
    files = earthaccess.download(results, "mod11")

    hdf = SD(files[0], SDC.READ)
    lst = hdf.select("LST_Day_1km").get().astype("float64")
    qc = hdf.select("QC_Day").get()
    vt = hdf.select("Day_view_time").get().astype("float64")

    good = (lst > 0) & ((qc & 0b11) == 0)        # drop fill + keep mandatory QA 'good'
    lst_k = np.where(good, lst * 0.02, np.nan)    # K
    view_time = np.where(vt < 255, vt * 0.1, np.nan)  # local solar time (hours)
    print(np.nanmean(lst_k) - 273.15, np.nanmedian(view_time))

tips:
  - "MOD11 and MOD21 give different values for the same place and day. Over deserts, arid land and bare soil MOD11 can read 3–5 K low (cold bias), while MOD21 more often has hot outliers from unscreened dust and cloud contamination. Do not mix the two families in one study."
  - "MOD21 does not set contaminated pixels to fill. The User's Guide recommends screening with the QC bits (especially mandatory QA and LST accuracy), emissivity (band 31 or 32 below 0.95 is suspect) and the error estimates together."
  - "Because of orbit drift, the observation time has shifted year by year since 2020 (Terra) and 2021 (Aqua). For long-term trends and anomalies, look at `Day_view_time` / `View_Time` as well, and consider a time-of-day adjustment or selecting samples from the same time window."
  - "According to LP DAAC, the lower, drifting orbit reduces the grid size and breaks the strict 16-day repeat cycle, and later crossing times mean lower sun elevation and more shadows. The MODIS land QA team reports that impacts such as widening scan gaps became significant from late 2024."
  - "An official notice (2024-01) reports that Aqua MODIS band 29 brightness temperature has drifted upward since 2018 because of electronic crosstalk, making MYD21 land surface temperatures warmer than expected. Be careful with post-2018 trends from Aqua TES data."
  - "Terra MOD21 shows striping in L2 from 2006-08-29 because of a dead band 29 detector; those pixels are flagged in the QC bits and filled with nearest-neighbour values, so they must not be used for science."
  - "The 8-day and monthly products average clear days only and carry a clear-sky bias. In the cloudy monsoon season few days enter the average and representativeness drops."
  - "LST is surface (skin) temperature, not 2 m air temperature. It is much higher than air temperature at midday and lower on clear nights. Do not compare it directly with station air temperature."
  - "Value = stored value × 0.02 (K), with stored value 0 as fill. Emissivity = stored value × 0.002 + 0.49."

