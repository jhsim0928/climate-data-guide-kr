# ─────────────────────────────────────────────────────────────
# ESA CCI Land Cover (1992–2015) + C3S Land Cover (2016 onward) — dataset information file (English edition)
# Listed under the Land tab, 'Land cover'. One page covers both sources of the same processing chain (ESA CCI v2.0.7cds and C3S v2.1.1).
# The 2023–2025 maps have been under ECMWF review since July 2026 (the CDS ended at 2022 when checked on 2026-10-13).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: esa-cci-landcover
name: "ESA CCI / C3S Land Cover"
full_name: ESA Land Cover CCI (1992–2015, v2.0.7cds) + Copernicus C3S Land cover classification gridded maps (2016 onward, v2.1.1) (annual global 300 m land cover maps, 22-class UN LCCS legend)
category: satellite
domain: land
group: 토지피복
order: 20
domains: [육지, 원격탐사]
provider: ESA Land Cover CCI project (UCLouvain and partners) / Copernicus Climate Change Service (C3S, ECMWF)

status: delayed
status_note: >-
  Maps for 1992–2022 are available from the CDS. Updates are normally yearly with a one-year lag, but a contractual transition between project phases delayed the 2023 and 2024 maps;
  following an April 2026 update, the 2023, 2024 and 2025 maps were delivered to ECMWF together at the end of June 2026. As of July 2026 the data and documentation were in review,
  and ECMWF said publication on the CDS usually takes about three months from that point. On 2026-10-13 the CDS still ended at 2022.

period:
  start: "1992-01"
  end: "2022-12"
  note: >-
    1992–2015 is the ESA CCI v2.0.7cds record; from 2016 the record continues as C3S v2.1.1 produced with the same processing chain (2016–2022 in the CDS request form on 2026-10-13).
    The 2023–2025 maps are under ECMWF review with no announced release date.

resolution:
  spatial_short: "0.3 km (0.0028°)"
  temporal_short: "1년"
  spatial: "300 m global Plate Carrée (WGS84 latitude–longitude) grid, pixel spacing 0.002778° (1/360°)"
  vertical: Single surface level
  temporal: Yearly (annual maps, one file per year)

coverage:
  short: 전지구
update: Normally once a year with a one-year lag — the 2023–2025 maps are delayed
license: >-
  Downloading from the CDS requires accepting three licences: CC BY 4.0, the ESA CCI licence and the VITO (PROBA-V) licence. ESA CCI asks users to credit the ESA CCI Land Cover project and send a copy of publications
account_required: true

summary: >-
  A single continuous record that joins the annual 300 m global land cover maps produced from 1992 onward by ESA's Climate Change Initiative (CCI) Land Cover project
  with the maps the Copernicus Climate Change Service (C3S) has produced from 2016 with the same processing chain. A baseline map is built from the 2003–2012 MERIS archive and then
  back- and up-dated with change detection from AVHRR (1992–1999), SPOT-VGT (1998–2012) and PROBA-V, Sentinel-3 OLCI and SLSTR (from 2013). The maps use a 22-class legend based on the
  FAO LCCS (plus regional sub-classes) with four quality flags, and are widely used for plant-functional-type maps in climate models and for long-term land cover change studies.

time_convention:
  summary: >-
    `lccs_class` is the classification result for that year. Rather than classifying each year independently, the yearly map is the 2003–2012 baseline updated with the changes detected
    for that year, so wherever no change is detected the baseline class carries through. Each file covers 1 January to 31 December of its year.
  points:
    - "A change must persist over consecutive years before it is accepted (PUG v2 describes at least two consecutive years). Real changes can therefore appear a year or two late, and the last year of the record is more conservative because there is no following year to confirm it."
    - "Change detection only captures transitions between the six IPCC land categories (forest, grassland, cropland, wetland, settlement, other). Changes within a category — between forest types, from rainfed to irrigated cropland, between pure and mosaic classes — are not mapped."
    - "Changes are detected at about 1 km and then delineated at 300 m; abrupt changes are captured better than gradual ones."
    - "`change_count` gives the number of class changes from 1992 up to the map year (0 means stable)."
  source: https://climate.esa.int/media/documents/CCI_Land_Cover_PUG_v2.0.pdf
  source_name: Land Cover CCI Product User Guide v2.0 (CCI-LC-PUGV2, 2017) + CDS satellite-land-cover overview

variables:
  note: >-
    NetCDF variable names as given in ESA CCI and C3S release notes and v2.0.7cds file metadata. All are dimensionless integers, and the CDS delivers all variables in one request.
    The class code table (0 = no data, 10–220) is in the PUG and the Quick User Guide.
  full_list: https://cds.climate.copernicus.eu/datasets/satellite-land-cover?tab=overview
  groups:
    - name: Land cover classification (classification for the year)
      kind: instant
      items:
        - text: "LCCS land cover class — `lccs_class` (class codes 10–220, 0 = no data)"
          std: []
          note: 22 level-1 classes plus regional sub-classes (61/62, 71/72, etc.). Sub-classes are separate codes that do not overlap their parent class
    - name: Quality flags
      kind: instant
      items:
        - text: "Processed flag — `processed_flag` (0 not processed, 1 processed)"
        - text: "Pixel state — `current_pixel_state` (0 invalid, 1 clear land, 2 clear water, 3 clear snow/ice, 4 cloud, 5 cloud shadow)"
          note: Pixel type identified during pre-processing
        - text: "Number of valid observations — `observation_count` (count)"
          kind: accum
          period: observation period used for the classification
          note: Number of valid satellite observations used in the classification
        - text: "Number of class changes — `change_count` (count)"
          kind: accum
          period: from 1992 to the map year
          note: 0 means no change since 1992

access:
  - name: Copernicus CDS — Land cover classification gridded maps from 1992 to present
    url: https://cds.climate.copernicus.eu/datasets/satellite-land-cover
    method: Web download / CDS API (cdsapi)
    note: >-
      Choose the year and the version (v2_0_7cds for 1992–2015, v2_1_1 for 2016–2022). Area subsetting is available; files are NetCDF-4 (CF-1.6).
      Requires an ECMWF account and acceptance of all three licences (CC BY, ESA CCI, VITO).
  - name: CEDA archive — ESA Land_Cover_cci Global Land Cover Maps v2.0.7 (1992–2015)
    url: https://catalogue.ceda.ac.uk/uuid/b382ebe6679d44b8b0e68ea4ef4b701c
    method: HTTPS download (NetCDF and GeoTIFF)
    note: The original ESA CCI package (58 files, about 67 GB). Use the CDS for 2016 onward.
  - name: ESA CCI Land Cover viewer and download page (UCLouvain)
    url: https://maps.elie.ucl.ac.be/CCI/viewer/download.php
    method: Web viewer / download / CCI-LC User Tool
    note: Map preview plus the PFT maps (v2.0.8), the water body map and the user tool for re-gridding and PFT conversion.

example:
  lang: python
  note: >-
    Put the url (https://cds.climate.copernicus.eu/api) and your API key in ~/.cdsapirc and accept the dataset licences on the CDS web page first.
    Request version "v2_1_1" for 2016 onward and "v2_0_7cds" for 1992–2015. The download may be zipped, so unpack it before opening.
  code: |
    # pip install --upgrade cdsapi xarray netCDF4
    import cdsapi

    client = cdsapi.Client()
    client.retrieve(
        "satellite-land-cover",
        {
            "variable": "all",
            "year": ["2022"],
            "version": ["v2_1_1"],          # use "v2_0_7cds" for 1992–2015
            "area": [39, 124, 33, 132],      # north, west, south, east (around Korea)
        },
        "c3s_lc_2022_korea.zip",
    )

    # Unpack (file name e.g. C3S-LC-L4-LCCS-Map-300m-P1Y-2022-v2.1.1.nc)
    import glob, zipfile
    import xarray as xr
    if zipfile.is_zipfile("c3s_lc_2022_korea.zip"):
        zipfile.ZipFile("c3s_lc_2022_korea.zip").extractall("c3s_lc")
        nc = glob.glob("c3s_lc/*.nc")[0]
    else:
        nc = "c3s_lc_2022_korea.zip"   # delivered as a single NetCDF without zipping
    ds = xr.open_dataset(nc)
    lc = ds["lccs_class"]            # class codes (e.g. 190 = urban, 210 = water bodies)
    forest = lc.isin([50, 60, 61, 62, 70, 71, 72, 80, 81, 82, 90])   # tree cover classes

tips:
  - "Sub-classes are separate codes from their parent class. Class 60 (broadleaved deciduous tree cover, >15%) does not contain the pixels coded 61 (>40%) or 62 (15–40%), so total broadleaved deciduous tree cover is the sum of 60, 61 and 62 (likewise 70/71/72 and 80/81/82). The project team confirmed this on the ECMWF forum in September 2026."
  - "v2.0.7cds (1992–2015) and v2.1.1 (2016 onward) are designed to join into one series, but the producer and input sensors change at 2016. If the 2015→2016 change looks unusually large, suspect a seam."
  - "Because change detection only captures transitions between IPCC categories and requires changes to persist for two or more years, forest type replacement, changes within cropland and short-lived disturbances do not appear. Treat area-change statistics as a conservative lower bound."
  - "These are class codes: when moving them to another grid use mode aggregation or nearest neighbour, never averaging or bilinear interpolation. If you need PFT fractions for a climate model, the project's PFT maps (v2.0.8) or the CCI-LC User Tool are more accurate."
  - "The documentation notes poorer baseline quality where MERIS coverage was sparse (western Amazon, Chile, western Congo basin, Gulf of Guinea, eastern Russia, eastern China, Indonesia, among others)."
  - "Preliminary validation in PUG v2 gave an overall accuracy of about 71–75%, with low accuracy for mosaic natural vegetation, lichens and mosses, sparse vegetation and fresh-water flooded forest."
  - "CDS requests fail if the version does not match the year (for example 2018 with v2_0_7cds)."

