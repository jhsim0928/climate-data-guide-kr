transitions:
  - from: ESA CCI Land Cover v2.0.7cds (1992–2015)
    to: C3S Land Cover v2.1.1 (2016 onward)
    status: completed
    date: "2019-10"
    summary: >-
      C3S took over the 1992–2015 ESA CCI record and has extended it yearly from 2016 with the same processing chain.
      The two versions are designed to form one series but differ in producer, input sensors and file names.
    changes:
      - aspect: Period
        before: 1992–2015
        after: 2016–2022 (as of October 2026; 2023–2025 under review)
      - aspect: Production and distribution
        before: ESA CCI Land Cover project (CEDA and the CCI viewer; included in the CDS as v2.0.7cds)
        after: Copernicus C3S (CDS) — 2016–2018 released October 2019, 2019 in January 2021, 2020 in May 2021
      - aspect: Sensors for change detection
        before: AVHRR (1992–1999), SPOT-VGT (1998–2012), PROBA-V (2013–2015)
        after: PROBA-V, Sentinel-3 OLCI and SLSTR
      - aspect: File names
        before: ESACCI-LC-L4-LCCS-Map-300m-P1Y-…-v2.0.7cds
        after: C3S-LC-L4-LCCS-Map-300m-P1Y-YYYY-v2.1.1.nc
      - aspect: Variables and legend
        before: lccs_class + four quality flags, 22-class LCCS legend
        after: Unchanged
    impacts:
      - Pick the version that matches the year in CDS requests (v2_0_7cds for 1992–2015, v2_1_1 from 2016). Joining the two is the officially intended use.
      - Input sensors and production change at the 2015→2016 boundary; if change in that year looks anomalous, check whether it is real.
    sources:
      - name: CDS — Land cover classification gridded maps from 1992 to present (overview)
        url: https://cds.climate.copernicus.eu/datasets/satellite-land-cover?tab=overview
      - name: ESA CCI — Release of C3S Global Land Cover products for 2016, 2017 & 2018
        url: https://climate.esa.int/en/projects/land-cover/news/new-release-c3s-global-land-cover-products-2016-2017-2018-consistent-cci-1992-2015-map-series/
      - name: ESA CCI Land Cover download page (release history by year)
        url: https://maps.elie.ucl.ac.be/CCI/viewer/download.php

notices:
  - date: "2026-10-05"
    level: info
    title: CDS terms of use change (effective 2026-10-28)
    body: >-
      Article 1 (Description of Products and Services) of the CDS terms of use changes on 28 October 2026. Continued use counts as acceptance;
      users who decline must tell ECMWF Support by 27 October and will then lose access to Copernicus Products.
    source: https://forum.ecmwf.int/t/upcoming-cds-terms-of-use-change/15374
  - date: "2026-07-17"
    level: info
    title: 2023–2025 maps and documentation under ECMWF review — publication usually about three months later
    body: >-
      ECMWF said the 2023–2025 data and documentation (PUGS, PQAR, ATBD) were in review and that publication on the CDS usually follows about three months after this stage,
      possibly longer because of summer leave. No exact release date was given.
    source: https://forum.ecmwf.int/t/esa-cci-lc-landcover-23-24-25-updates/15175
  - date: "2026-04-16"
    level: warning
    title: Release plan revised — 2023, 2024 and 2025 maps delivered together in June 2026
    body: >-
      The project team said the 2023, 2024 and 2025 maps would be delivered to ECMWF together in June 2026, with public release subject to the standard review.
      Compared with the earlier plan (2023–2024 by end of March 2026, 2025 by end of February 2027), 2023–2024 are about three months later and 2025 about eight months earlier.
    source: https://forum.ecmwf.int/t/update-of-land-cover-classification-gridded-maps/12957
  - date: "2025-07-04"
    level: warning
    title: Updates delayed by a project phase transition — 2023 and 2024 maps expected during 2026
    body: >-
      A message on the CDS dataset said the update timeline changed because of a transition between project phases and that the 2023 and 2024 data were now expected during 2026.
      Normally the dataset is updated yearly with a one-year lag.
    source: https://cds.climate.copernicus.eu/datasets/satellite-land-cover
  - date: "2024-09-26"
    level: critical
    title: Legacy CDS closed — update the API URL and key
    body: >-
      The legacy CDS was shut down and replaced by the new CDS. Set the url in .cdsapirc to https://cds.climate.copernicus.eu/api and use your key from the new CDS;
      requests sent with the old configuration fail.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380

