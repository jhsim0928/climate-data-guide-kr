notices:
  - date: "2026-04-23"
    level: info
    title: Paper describing HadSST.4.2.0.0 published
    body: >-
      Sandford & Rayner (2026), "Addressing the World War 2 Warm Anomaly in HadSST.4.2.0.0", describing the new wartime bias adjustments, is published
      online in the International Journal of Climatology. The terms and conditions require it to be cited together with Kennedy et al. (2019).
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/
  - date: "2025-09"
    level: warning
    title: HadSST.4.2.0.0 released — 1941–1945 values changed; download the full dataset again
    body: >-
      Refined pre-1950 ERI bias estimates reduce the anomalous warmth during the Second World War; the release also adds Kobe Collection truncation bias
      corrections and fixes the ERI uncertainty term, and repackages the ensemble and error covariance files. Replace all data from earlier versions.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-08"
    level: info
    title: Moored buoy data switched from iQuam to CMEMS
    body: From August 2025 onwards moored buoy observations come from Copernicus Marine (CMEMS) instead of iQuam. Drifting buoys were already taken from CMEMS.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-03"
    level: info
    title: HadSST.4.1.1.0 released (mainly workflow improvements)
    body: >-
      Mostly an internal workflow release. Visible changes: time series CSV values rounded to 6 decimal places, a fill value reinstated in the NetCDF
      products, and a new random sampling method for insulated bucket corrections to improve reproducibility.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-01"
    level: info
    title: HadSST.4.1.0.0 supersedes HadSST.4.0.1.0 — no changes to the science
    body: >-
      HadSST.4.1.0.0 replaced HadSST.4.0.1.0, with the science unchanged from Kennedy et al. (2019). Updates to 4.0.1.0 ended with December 2024 data.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/previous_versions.html

