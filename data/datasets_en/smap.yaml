transitions:
  - from: SMAP L3 SPL3SMP V8 · SPL3SMP_E V5
    to: SMAP L3 SPL3SMP V9 · SPL3SMP_E V6 (CRID R19)
    status: completed
    date: "2024-10"
    summary: >-
      A reprocessing that applied an improved method to the input L1B/L1C brightness temperatures; the soil moisture algorithms, file structure and variables are unchanged.
      Forward processing began in December 2023, reprocessing of the full record from 2015 finished on 30 October 2024, and the previous versions were retired on 16 December 2024.
    changes:
      - aspect: Version and CRID
        before: "SPL3SMP V8, SPL3SMP_E V5 (based on L1B/L1C V5)"
        after: "SPL3SMP V9, SPL3SMP_E V6 (based on L1B/L1C V6; file names carry CRID R19xxx)"
      - aspect: What changed
        before: "Previous brightness-temperature processing"
        after: "Improved processing applied to the input L2 radiometer brightness temperatures (algorithms, structure, content and processor code unchanged)"
      - aspect: Availability
        before: "V8 and V5 retired on 2024-12-16"
        after: "Only V9 and V6 available, 2015-03-31 to present"
    impacts:
      - Replace time series built from the old versions by downloading the full record again; values for the same date differ slightly.
      - Update the version value in earthaccess calls and scripts to '009' (SPL3SMP) and '006' (SPL3SMP_E).
    sources:
      - name: NSIDC notice — Data set updates SMAP Level-1, Level-2, and Level-3 (2024-10-30)
        url: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-1-level-2-and-level-3-data-sets-0
      - name: SPL3SMP V9 user guide
        url: https://nsidc.org/sites/default/files/documents/user-guide/spl3smp-v009-userguide.pdf
  - from: SMAP L4 Version 7
    to: SMAP L4 Version 8
    status: completed
    date: "2025-04"
    summary: >-
      The L4 soil moisture and carbon products were reprocessed from 2015 as Version 8, and Version 7 was retired on 30 June 2025. Precipitation forcing, the radiative transfer model and snow albedo changed,
      input brightness temperatures were standardised on R19 (SPL1CTB V6), and the carbon model was recalibrated against a new flux-tower network.
    changes:
      - aspect: Precipitation forcing (SPL4SMGP)
        before: "Previous precipitation correction scheme"
        after: "IMERG Version 07 outside North America and high latitudes"
      - aspect: Assimilation input
        before: "Brightness temperatures from earlier versions"
        after: "Only SPL1CTB Version 6 (R19) brightness temperatures; scaling parameters recalibrated with April 2015 – March 2024 data"
      - aspect: Model physics (SPL4SMGP)
        before: "Previous microwave radiative transfer model and snow albedo"
        after: "Updated microwave radiative transfer model (mwRTM), changed snow albedo parameterization, bug fixes"
      - aspect: Carbon model (SPL4CMDL)
        before: "Calibration on La Thuile/FLUXNET2015; litterfall allocated as a fixed fraction of mean annual NPP"
        after: "BPLUT recalibrated with 410 eddy-covariance towers, seasonal litterfall allocation from satellite LAI, SOC decay recalibrated with ISCN data and SOC re-initialized"
      - aspect: Science version ID
        before: "Vv7xxx"
        after: "Vv8xxx (as of October 2026 files: SPL4SMGP Vv8011, SPL4CMDL Vv8041)"
    impacts:
      - Do not mix V7 and V8; download the full record again as V8. The new precipitation forcing changes root-zone soil moisture climatologies as well.
      - "The user guide notes that the SPL4SMGP V8 variable `depth_to_water_table_from_surface` is, despite its name, the water table depth in peat."
    sources:
      - name: NSIDC notice — SMAP Level-4 Version 8 Release (2025-04-15)
        url: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-4-version-8-release
      - name: NSIDC SPL4SMGP Version 8 page
        url: https://nsidc.org/data/spl4smgp/versions/8
      - name: NSIDC SPL4CMDL Version 8 page
        url: https://nsidc.org/data/spl4cmdl/versions/8

notices:
  - date: "2026-08-11"
    level: warning
    title: Geolocation issue from 14 May to 28 July 2026 — standard products being reprocessed
    body: >-
      SMAP Standard and Near Real-Time data sets had a geolocation issue from 14 May to 28 July 2026. Standard products for this period are being reprocessed and will be replaced in the coming weeks;
      Near Real-Time products will not be replaced. If you already downloaded data for this period, download the reprocessed files.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-reprocessing
  - date: "2025-08-05"
    level: critical
    title: Retirement of the NSIDC legacy on-premises archive (2025-10-28) — move to Earthdata Cloud
    body: >-
      Access to SMAP data in the NSIDC DAAC legacy on-premises archive (HTTPS File System, Earthdata Search orders, ESI and EGI transformation services) ended on 28 October 2025.
      NASA Earthdata Cloud is now the primary archive, so scripts must be switched to CMR, earthaccess or the cloud HTTPS paths.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-retirement-legacy-data-archive-smap-data
  - date: "2025-04-15"
    level: info
    title: SMAP L4 Version 8 released — Version 7 retired on 2025-06-30
    body: >-
      The L4 soil moisture (SPL4SMGP, SPL4SMAU, SPL4SMLM) and carbon (SPL4CMDL) products were updated to Version 8, with the full record from 2015-03-31.
      Version 7 was retired on 30 June 2025.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-4-version-8-release
  - date: "2025-01-08"
    level: warning
    title: SMAP data processing halted by wildfires near JPL (resumed 2025-01-14)
    body: >-
      Wildfire activity near JPL in Pasadena, California closed the SMAP Science Data System facility and halted data processing. NSIDC announced on 14 January 2025 that processing had resumed.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-outage
  - date: "2024-10-30"
    level: info
    title: L1–L3 reprocessing complete — SPL3SMP V9, SPL3SMP_E V6 (previous versions retired 2024-12-16)
    body: >-
      Reprocessing of the new SMAP L1, L2 and L3 versions back to 2015 is complete. L3 soil moisture is now SPL3SMP V9 and SPL3SMP_E V6; the previous versions were retired on 16 December 2024.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-1-level-2-and-level-3-data-sets-0
  - date: "2022-08-22"
    level: warning
    title: SMAP in safe mode (data gap 2022-08-06 to 09-20)
    body: >-
      SMAP entered safe mode in August 2022, halting science data acquisition. The NSIDC notice gives the entry date as 8 August, while the user guides give the gap as 6 August to 20 September.
      L3 has no data for this period; L4 continued without SMAP observations (model only). Post-recovery data are described as consistent with earlier data.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-safe-mode
  - date: "2019-06-24"
    level: warning
    title: SMAP in safe mode (data gap 2019-06-19 to 07-23)
    body: >-
      SMAP entered safe mode on the evening of 19 June 2019 and all instruments were shut down. There are no observations until 23 July; L4 was produced without observations during this period.
    source: https://nsidc.org/data/user-resources/data-announcements/smap-safe-mode
  - date: "2015-07"
    level: critical
    title: SMAP radar failure — radiometer-only operations since
    body: >-
      The SMAP radar stopped in July 2015, ending the radar and combined active-passive soil moisture products. All SMAP products since then rely on the L-band radiometer alone.
    source: https://nsidc.org/data/smap

