# ─────────────────────────────────────────────────────────────
# NASA SMAP soil moisture — dataset information file
# Listed under the Land tab, 'Soil moisture'. L3 (SPL3SMP, SPL3SMP_E) and L4 (SPL4SMGP, SPL4CMDL) are covered on one page.
# Same-page version changes (L3 V8→V9 and V5→V6, L4 V7→V8) are in transitions (no to_id).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: smap
name: "SMAP (L3·L4)"
full_name: Soil Moisture Active Passive (SMAP) — L3 radiometer soil moisture (SPL3SMP V9, SPL3SMP_E V6) and L4 assimilated soil moisture and carbon (SPL4SMGP V8, SPL4CMDL V8)
category: satellite
domain: land
group: 토양수분
order: 20
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사, 수문]
provider: NASA JPL/GSFC SMAP Science Team (distributed by NSIDC DAAC)

status: active
status_note: >-
  SMAP has continued with its L-band radiometer alone since the radar failed in July 2015, and the L3 and L4 products are updated daily (on 2026-10-13, SPL3SMP_E ran to 9 October, SPL4SMGP to 5 October and SPL4CMDL to 29 September).
  Standard products for 14 May to 28 July 2026 had a geolocation issue and are being reprocessed; Near Real-Time (NRT) products will not be replaced.
  Current versions are L1–L3 CRID R19 (SPL3SMP V9, SPL3SMP_E V6) and L4 Version 8.

period:
  start: "2015-03"
  end: present
  note: >-
    All four products run from 2015-03-31 to the present. Safe-mode events interrupted observations on 2019-06-19 to 07-23 and 2022-08-06 to 09-20; L3 has no data then,
    and L4 continued but without SMAP observations (model only). Files for the geolocation-issue period (2026-05-14 to 07-28) are being replaced with reprocessed versions;
    on 2026-10-13 the SPL3SMP file for 2026-06-01 already carried a higher file counter (_004) and was updated on 2026-09-23.

resolution:
  spatial_short: "9 km (0.083°)"
  temporal_short: "3시간"
  spatial: >-
    SPL3SMP: 36 km EASE-Grid 2.0 Global (EPSG:6933, 964 × 406). SPL3SMP_E: 9 km EASE-Grid 2.0 Global (3856 × 1624) and North Polar grid (EPSG:6931, 2000 × 2000) —
    the radiometer footprint is about 36 km and is resampled to the 9 km grid by Backus-Gilbert interpolation. SPL4SMGP and SPL4CMDL: 9 km EASE-Grid 2.0 Global (EPSG:6933).
  vertical: "L3 surface (about 0–5 cm) / L4 surface 0–5 cm average, root zone 0–100 cm average, full model soil profile (sm_profile)"
  temporal: L3 daily (6 a.m. descending and 6 p.m. ascending passes kept separately) / SPL4SMGP 3-hourly averages / SPL4CMDL daily

coverage:
  short: 전지구
update: "Daily (on 2026-10-13 CMR showed the latest data as 9 October for SPL3SMP_E, 5 October for SPL4SMGP and 29 September for SPL4CMDL — see the NSIDC latency FAQ for official latencies)"
license: NASA Earth science open data — free. Free NASA Earthdata Login required; citation of the dataset DOI requested
account_required: true

summary: >-
  NASA's SMAP satellite measures soil moisture in roughly the top 5 cm globally with an L-band (1.4 GHz) microwave radiometer. Its radar failed in July 2015,
  so all products since then are radiometer-based. The L3 products (SPL3SMP at 36 km, SPL3SMP_E at 9 km) composite a day of half-orbit retrievals into separate morning and evening fields,
  while L4 assimilates SMAP brightness temperatures into the NASA GEOS land model to give gap-free 3-hourly surface and root-zone soil moisture (SPL4SMGP) and daily net ecosystem carbon exchange (SPL4CMDL).

time_convention:
  summary: >-
    L3 values are instantaneous retrievals at the satellite overpass, composited over a day: descending passes (about 6 a.m. local solar time) are in the AM group and ascending passes (about 6 p.m.)
    in the PM group (variable names end in `_pm`). SPL4SMGP fields are 3-hourly averages, and the time in the file name is the centre of the interval (e.g. T013000 = 00–03 UTC average). SPL4CMDL gives daily mean carbon fluxes (g C m-2 d-1).
  points:
    - "The actual L3 observation time is in `tb_time_utc` (UTC string). Where swaths overlap at high latitudes (poleward of about 65°), the observation nearest 6 a.m. or 6 p.m. local solar time is kept."
    - "The L3 file date is the date of the first data element, and a grid cell can be observed twice a day (AM and PM). The two values are snapshots at different times, so consider the time difference before averaging them."
    - "There are eight SPL4SMGP files per day (T013000, T043000 … T223000), each value being the average over that 3-hour interval. Average the eight for a daily mean."
    - "SPL4SMGP runoff and evapotranspiration fluxes are mean rates in kg m-2 s-1 (= mm s-1); multiply by 10800 for a 3-hour total in mm."
    - "SPL4CMDL GPP, NEE and Rh are daily mean fluxes (g C m-2 d-1), while soil organic carbon (SOC) is a stock in g C m-2."
  source: https://nsidc.org/data/spl4smgp/versions/8
  source_name: NSIDC user guides for SPL3SMP V9, SPL3SMP_E V6, SPL4SMGP V8 and SPL4CMDL V8; L4_SM Product Specification Document (PSD v17)

variables:
  note: >-
    Main variables per the NSIDC user guides and the L4_SM Product Specification Document. Files are HDF5 and variables sit inside groups
    (L3: `Soil_Moisture_Retrieval_Data_AM`/`_PM`, with `..._Polar_AM`/`_Polar_PM` for the SPL3SMP_E polar grid; SPL4SMGP: `Geophysical_Data`; SPL4CMDL: `NEE`, `GPP`, `RH`, `SOC`, `QA`).
    The fill value for floating-point fields is -9999.0; for L3 integer (uint16) flags it is 65534.
  full_list: https://nsidc.org/sites/default/files/documents/technical-reference/smap_l4_sm_psd_v17_for_l4sm_version_8.pdf
  groups:
    - name: L3 radiometer soil moisture (SPL3SMP 36 km / SPL3SMP_E 9 km, daily)
      kind: instant
      items:
        - text: "Surface soil moisture, morning descending pass — `soil_moisture` (m3/m3)"
          note: Value at the overpass. Baseline algorithm is DCA since V8
        - text: "Surface soil moisture, evening ascending pass — `soil_moisture_pm` (m3/m3)"
          note: PM-group variables carry the _pm suffix
        - "Retrieval quality flag — `retrieval_qual_flag` (16-bit; 0 or 8 = recommended quality)"
        - "Observation time — `tb_time_utc` (UTC string)"
        - "Effective soil temperature — `surface_temperature` (K)"
        - "Vegetation opacity — `vegetation_opacity` (unitless)"
    - name: L4 soil moisture and land surface (SPL4SMGP, 3-hourly averages)
      kind: mean
      period: 3-hourly
      items:
        - "Surface soil moisture, 0–5 cm — `sm_surface` (m3 m-3)"
        - "Root-zone soil moisture, 0–100 cm — `sm_rootzone` (m3 m-3)"
        - "Profile soil moisture — `sm_profile` (m3 m-3)"
        - "Surface and root-zone wetness — `sm_surface_wetness`, `sm_rootzone_wetness` (dimensionless)"
        - "Surface temperature — `surface_temp` (K)"
        - "Soil temperature, layer 1 — `soil_temp_layer1` (K)"
        - "Snow mass (water equivalent) — `snow_mass` (kg m-2)"
        - "Snow depth — `snow_depth` (m)"
        - "Evapotranspiration — `land_evapotranspiration_flux` (kg m-2 s-1)"
        - "Overland runoff and baseflow — `overland_runoff_flux`, `baseflow_flux` (kg m-2 s-1)"
    - name: L4 carbon (SPL4CMDL, daily means)
      kind: mean
      period: Daily
      items:
        - "Net ecosystem CO2 exchange (NEE) — `NEE/nee_mean` (g C m-2 d-1)"
        - "Gross primary production (GPP) — `GPP/gpp_mean` (g C m-2 d-1)"
        - "Heterotrophic respiration (Rh) — `RH/rh_mean` (g C m-2 d-1)"
        - text: "Soil organic carbon — `SOC/soc_mean` (g C m-2)"
          note: A stock, not a flux
        - "NEE error estimate — `QA/nee_rmse_mean` (g C m-2 d-1)"

access:
  - name: NSIDC DAAC — SPL3SMP V9
    url: https://nsidc.org/data/spl3smp/versions/9
    method: Earthdata Search / earthaccess / HTTPS (CMR virtual directory) / NSIDC Data Access Tool / Harmony
    note: A free NASA Earthdata Login is required. The legacy on-premises access routes closed on 2025-10-28; NASA Earthdata Cloud is now the primary archive.
  - name: NSIDC DAAC — SPL3SMP_E V6
    url: https://nsidc.org/data/spl3smp_e/versions/6
    method: Earthdata Search / earthaccess / HTTPS / Harmony
    note: The 9 km global and North Polar grids are in the same file.
  - name: NSIDC DAAC — SPL4SMGP V8
    url: https://nsidc.org/data/spl4smgp/versions/8
    method: Earthdata Search / earthaccess / HTTPS / Harmony / AppEEARS
    note: Eight files per day (3-hourly averages). Analysis updates (SPL4SMAU) and land model constants (SPL4SMLM) are separate collections. AppEEARS can extract points or areas.
  - name: NSIDC DAAC — SPL4CMDL V8
    url: https://nsidc.org/data/spl4cmdl/versions/8
    method: Earthdata Search / earthaccess / HTTPS / Harmony / AppEEARS / Worldview
    note: Each daily file holds NEE, GPP, Rh and SOC, plus per-plant-functional-type (PFT) means.
  - name: NASA Earthdata Cloud (AWS S3, us-west-2)
    url: https://nsidc.org/data/user-resources/help-center/nasa-earthdata-cloud-data-access-guide
    method: Direct cloud access (S3, from us-west-2 only)
    note: Requires temporary S3 credentials. Useful for bulk processing on compute in the same region.

example:
  lang: python
  note: >-
    Uses earthaccess to download a week of SPL3SMP_E V6 in July 2024 and read morning (AM) soil moisture, keeping only recommended-quality values. You will be asked for your Earthdata username and password on first use.
    EASE-Grid 2.0 files have no 1-D latitude/longitude coordinates, so use the latitude/longitude arrays in the same group (or EASE-Grid 2.0 coordinate files) for mapping.
  code: |
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="SPL3SMP_E", version="006",
        temporal=("2024-07-01", "2024-07-07"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "smap_l3e")

    with h5py.File(files[0], "r") as f:
        g = f["Soil_Moisture_Retrieval_Data_AM"]
        sm = g["soil_moisture"][:]               # (1624, 3856), m3/m3
        qf = g["retrieval_qual_flag"][:]
    sm = np.where((sm == -9999.0) | ~np.isin(qf, [0, 8]), np.nan, sm)
    print(np.nanmean(sm))

    # L4 3-hourly data: short_name="SPL4SMGP", version="008", group "Geophysical_Data", variable "sm_rootzone"

tips:
  - "For L3, keep only values whose `retrieval_qual_flag` is 0 or 8, which the user guide defines as recommended quality. Without this filter, lower-quality retrievals get mixed in."
  - The 9 km SPL3SMP_E grid is interpolated from ~36 km observations. The scale actually resolved is still tens of kilometres, so do not treat individual 9 km cells as independent observations.
  - During the safe-mode periods (2019-06-19 to 07-23, 2022-08-06 to 09-20) L3 has no data and L4 was filled by the model without observations. A data-quality caution was issued for a period after the 2019 recovery.
  - "If you downloaded data for 2026-05-14 to 07-28 before reprocessing, those files have the geolocation error. Download them again once the reprocessed files appear (a higher counter at the end of the file name marks the new file)."
  - "L4 values are model estimates constrained by assimilated SMAP brightness temperatures, so they exist at depths (root zone) and on days without observations. Root-zone soil moisture is a GEOS land model estimate, not an observation."
  - "SPL4SMGP file times are the centre of the 3-hour averaging interval (T013000 = 00–03 UTC). For a Korean-time daily mean, group the eight files using a 15 UTC day boundary."
  - "Each new version reprocesses the whole record and the old version is retired (L3 V8 on 2024-12-16, L4 V7 on 2025-06-30). In your paper give the short_name and version, plus the CRID (R19…) or science version (Vv80…) from the file name."

