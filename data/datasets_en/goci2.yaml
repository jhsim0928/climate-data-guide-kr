notices:
  - date: "2026-10-07"
    level: info
    title: GEO-KOMPSAT-2B observation schedule change (6 October)
    body: >-
      Part of the 17:15 KST acquisition on 6 October 2026 was skipped because of station keeping. The previous day's notice (2026-10-06) announced the cancellation of the 04:15 UTC acquisition on 1 October.
      Several such schedule-change notices appear every month, so check the operational notices for missing acquisitions before time-series work.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0005.do?BOARD_SNO=235&boardSelectPage=1
  - date: "2025-06-25"
    level: info
    title: Five L2 algorithm documents (ATBDs) updated
    body: >-
      Updated ATBDs were posted for Aerosol Retrieval, Red Tide Index (RI), Low Sea Surface Salinity, Chlorophyll(-a) Front and Sea Surface Current. If you use these products, check the updated algorithms and quality criteria.
    source: https://www.nosc.go.kr/eng/board/actionBoardListBoard0011.do
  - date: "2025-02-28"
    level: warning
    title: Past L2 basic products reprocessed and re-released
    body: >-
      NOSC announced that the basic L2 products produced in the past by GEO-KOMPSAT-2B were reprocessed and are now served, and posted the "GOCI-II Level-2 OCR data format (v04)", atmospheric correction (v31) and IOP (v20) documents.
      The post does not state the reprocessed period. Re-check results made from L2 files downloaded earlier.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0009.do?BOARD_SNO=34&boardSelectPage=2
  - date: "2024-04-15"
    level: info
    title: Algorithm update for the GOCI-II remote-sensing reflectance product
    body: >-
      NOSC posted "Algorithm update for GOCI-II remote-sensing reflectance product". According to KIOST, the updated atmospheric correction has been implemented in the GOCI-II ground segment since October 2023.
    source: https://www.nosc.go.kr/eng/board/actionBoardViewBoard0011.do?BOARD_SNO=32&boardSelectPage=1
  - date: "2023-12-12"
    level: warning
    title: GEO-KOMPSAT-2B service temporarily suspended (11 December)
    body: >-
      The satellite entered safe mode and the geolocation of the observations became erroneous, so the ocean satellite image service was suspended on 11 December 2023.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0005.do?BOARD_SNO=83&boardSelectPage=15
  - date: "2022-10-21"
    level: warning
    title: Some images withheld after safe-mode recovery (September 2022)
    body: >-
      GEO-KOMPSAT-2B switched to safe hold mode at about 21:00 KST on 3 September 2022, and images from 08:15 to 15:15 KST that failed during recovery were excluded from the service.
      The English notice dates the affected window to 3 September while the Korean notice gives 4 September; check this notice if data for those days are missing.
    source: https://www.nosc.go.kr/eng/board/actionBoardViewBoard0012.do?BOARD_SNO=8&boardSelectPage=18

