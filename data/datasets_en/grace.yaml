# ─────────────────────────────────────────────────────────────
# GRACE / GRACE-FO — dataset information file (English edition)
# Land tab (terrestrial water storage). Monthly mass change grids from GRACE (2002–2017) and GRACE-FO (2018–):
# JPL, CSR and GSFC mascons and JPL Tellus Level-3 (1° land grids from spherical harmonics). The GRACE → GRACE-FO transition is in this file (no to_id).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: grace
name: "GRACE / GRACE-FO"
full_name: GRACE and GRACE Follow-On monthly terrestrial water storage (TWS) anomaly grids — JPL, CSR and GSFC mascons, JPL Tellus Level-3
category: satellite
domain: land
group: 육수저장량
order: 10
also_in:
  - domain: satellite
    group: 지면
  - domain: satellite
    group: 빙하·빙상
domains: [육지, 수문, 빙상, 원격탐사]
provider: NASA JPL / PO.DAAC (missions by NASA, Germany's DLR and GFZ; analysis centres JPL, UT Austin CSR, GFZ and NASA GSFC)

status: active
status_note: >-
  GRACE-FO completed its five-year prime mission in May 2023 and is operating in its extended mission, with monthly solutions delivered at a latency of about 40–60 days (when checked on 2026-10-13:
  JPL mascons through 2026-07, JPL Tellus land grids and CSR mascons through 2026-08). The current release is RL06.3, which uses the ACX2 accelerometer transplant data for GF2.
  GRACE Level-2 RL07 was published in May 2026, so the Level-3 and mascon products are expected to move to RL07, and the successor mission GRACE-C is targeted for launch in December 2028.

transitions:
  - from: GRACE
    to: GRACE-FO
    status: completed
    date: "2018-06"
    summary: >-
      GRACE ended science operations in October 2017, and GRACE-FO, which continues the same design, launched on 22 May 2018 and resumed the record from June 2018. There is a gap of about
      11 months (2017-07 to 2018-05) between the missions, but the GRACE-FO team reported no biases across the gap and precision on a par with GRACE.
    changes:
      - aspect: Operating period
        before: "Monthly solutions 2002-04 to 2017-06. A battery failure on GRACE-2 in 2017-09 ended the science mission in 2017-10"
        after: "Launched 2018-05-22, monthly solutions 2018-06 to present (extended mission since completing the prime mission in 2023-05)"
      - aspect: Inter-satellite ranging
        before: "K/Ka-band microwave ranging (KBR)"
        after: "KBR + Laser Ranging Interferometer (LRI, technology demonstration)"
      - aspect: Accelerometer
        before: "From 2016-11, 'accelerometer transplant' months using only one satellite's accelerometer have higher noise (2016-11, 2016-12, 2017-01, 2017-03, 2017-04, 2017-06)"
        after: "Unexpected noise in the GF2 accelerometer from the start (2018-06), replaced with data derived from GF1 (ACT → RL06.1 hybrid ACX → RL06.3 hybrid ACX2)"
      - aspect: Missing months
        before: "From 2011, battery management stopped observations for 4–5 weeks roughly every 5–6 months — no solutions for 2002-06/07, 2003-06, 2011-01/06, 2012-05/10, 2013-03/08/09, 2014-02/07/12, 2015-06/10/11, 2016-04/09/10, 2017-02"
        after: "Microwave Instrument Processing Unit (IPU) failure on 2018-07-19 → switched to the backup unit and resumed in 2018-10; no solutions for 2018-08/09"
      - aspect: Current Level-2/3 release
        before: "RL06 (Tellus land grids RL06 v04, released 2021-06)"
        after: "RL06.3 (Tellus land grids RL06.3 v04; mascons RL06.3Mv04 joining GRACE and GRACE-FO in one file)"
    impacts:
      - "2017-07 to 2018-05 has no observations. Interpolated or reconstructed values are not GRACE data; if you use them, state the method."
      - The Tellus Level-3 land grids come in separate GRACE (RL06) and GRACE-FO (RL06.3) collections, so you must join them yourself. The mascons contain everything from 2002 in one file.
      - "No bias across the gap was reported, but when estimating trends use methods that account for the gap and the missing months (for instance, regression that skips missing months)."
    sources:
      - name: Landerer et al. (2020) GRACE-FO instrument and science data performance, GRL
        url: https://doi.org/10.1029/2020GL088306
      - name: JPL News — Prolific Earth Gravity Satellites End Science Mission (2017-10-27)
        url: https://www.jpl.nasa.gov/news/prolific-earth-gravity-satellites-end-science-mission/
      - name: GRACE-FO Level-3 Data Product User Handbook (JPL)
        url: https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/gracefo/open/docs/GRACE-FO_L3_Handbook_JPL.pdf
      - name: NASA — GRACE-FO Satellite Switching to Backup Instrument Processing Unit (2018-09-17)
        url: https://sealevel.nasa.gov/news/142/grace-fo-satellite-switching-to-backup-instrument-processing-unit
  - from: GRACE / GRACE-FO RL06.x
    to: RL07
    status: planned
    date: "2026"
    summary: >-
      The full GRACE and GRACE-FO record is being reprocessed to new standards (Release 07). GRACE Level-2 RL07 (CSR and JPL) was published at PO.DAAC on 2026-05-01, but when checked on
      2026-10-13 there were no public collections yet for GRACE-FO RL07 or for the Tellus Level-3 and mascon RL07 products. CMR does, however, already hold variable records for the JPL mascon RL07
      (TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL07_v01) dated 2026-07-17, which suggests a release is being prepared.
    changes:
      - aspect: Level-1 input
        before: "GRACE-FO Level-1B v04"
        after: "Level-1 v05"
      - aspect: Background models
        before: "RL06 standards (e.g. FES2014 ocean tides)"
        after: "Updated static field, atmosphere/ocean de-aliasing (AOD), ocean tides (GOT5.6 under test), atmospheric tides and ocean pole tide (JPL, 2025-10)"
      - aspect: Observation weighting
        before: "Diagonal white-noise assumption"
        after: "Stochastic noise models for KBR, LRI and GPS with variance component estimation — more realistic formal errors"
      - aspect: Release status
        before: "RL06.3 (GRACE-FO), RL06 (GRACE)"
        after: "GRACE L2 RL07 published 2026-05-01 / GRACE-FO RL07 was targeted for spring 2026 but was not yet public as of 2026-10-13"
    impacts:
      - When RL07 mascons and Level-3 grids appear, every value from 2002 onward will change, so do not mix them with trends or climatologies computed from RL06.x — download the full period again.
      - "Only GRACE L2 RL07 is out so far, so joining GRACE (RL07) directly with GRACE-FO (RL06.3) would mix releases. Take care if you work with Level-2 coefficients."
    sources:
      - name: NASA CMR — GRACE Level-2 JPL RL07 (GRACE_L2_JPL_MONTHLY_0070)
        url: https://cmr.earthdata.nasa.gov/search/collections.umm_json?short_name=GRACE_L2_JPL_MONTHLY_0070
      - name: Level-2 Status from JPL (GRACE-FO Science Team Meeting, 2025-10-07)
        url: https://cpaess.ucar.edu/sites/default/files/grace-fo-2025-presentation/wiese-david.pdf
      - name: GRACE-FO project status (2025-10)
        url: https://cpaess.ucar.edu/sites/default/files/grace-fo-2025-presentation/landerer-felix.pdf
  - from: GRACE-FO
    to: GRACE-C
    status: planned
    date: "2028-12"
    summary: >-
      The NASA–DLR follow-on mission GRACE-C (GRACE-Continuity) is in development for a Falcon 9 launch targeted for December 2028 (it passed its System Integration Review in October 2025).
      The plan is to extend GRACE-FO operations into 2029 to overlap for about a year for cross-calibration.
    changes:
      - aspect: Inter-satellite ranging
        before: "KBR (primary) + LRI (demonstration)"
        after: "Laser Ranging Interferometer (LRI) only, no KBR"
      - aspect: Launch and lifetime
        before: "Launched 2018-05-22, in extended mission (GSOC operations secured through 2029-12)"
        after: "Launch targeted for 2028-12, nominal lifetime 5 years, polar orbit at about 500 km"
      - aspect: Overlap
        before: "About 11-month gap between GRACE and GRACE-FO"
        after: "Planned overlap with GRACE-FO of at least 6 months to about 1 year (2029)"
    impacts:
      - If GRACE-FO stops before GRACE-C launches, another gap could open. Long-term trend studies should state the mission boundaries.
    sources:
      - name: GFZ — GRACE-C
        url: https://www.gfz.de/en/grace-c
      - name: GRACE-C status (Landerer, 2025-10)
        url: https://cpaess.ucar.edu/sites/default/files/grace-fo-2025-presentation/landerer-felix-GRACE-C.pdf
      - name: EGU26-16387 — GRACE-FO extended mission phase and GRACE-C developments
        url: https://meetingorganizer.copernicus.org/EGU26/EGU26-16387.html

period:
  start: "2002-04"
  end: present
  note: >-
    GRACE 2002-04 to 2017-06 (the last monthly solution spans 2017-05-23 to 06-29) and GRACE-FO 2018-06 to present, with nothing for 2017-07 to 2018-05.
    GRACE has no solutions for 2002-06/07, 2003-06, 2011-01/06, 2012-05/10, 2013-03/08/09, 2014-02/07/12, 2015-06/10/11, 2016-04/09/10 and 2017-02; GRACE-FO has none for 2018-08/09 (based on the JPL Tellus land grids).
    When checked on 2026-10-13, the latest months were 2026-07 for the JPL mascons, 2026-08 for the JPL Tellus land grids, 2026-08 for the CSR mascons (updated 2026-10-07) and 2026-03 for the GSFC mascons.

resolution:
  spatial_short: "56 km (0.5°)"
  temporal_short: "1개월"
  spatial: >-
    JPL mascons: solution on 4,551 equal-area 3° spherical cap mascons, represented on a 0.5° × 0.5° latitude–longitude grid (720 × 360) / CSR mascons: solution on a geodesic equal-area grid of about 1° × 1° at the equator (about 120 km),
    resampled to a 0.25° grid / GSFC mascons: 1-arc-degree equal-area mascons (a 0.5° equal-angle NetCDF is also provided) / JPL Tellus Level-3 land grids: 1° × 1° (360 × 180),
    from spherical harmonics to degree and order 60 with a destriping filter and a 300 km Gaussian filter. The actual resolution (hundreds of km) is much coarser than the grid spacing.
  vertical: Vertically integrated (total mass of surface water, soil moisture, groundwater, snow and ice)
  temporal: Monthly (the actual days used differ from month to month and are recorded in `time_bounds`)

coverage:
  short: 전지구
update: "Monthly (about 40–60 days latency, RL06.3)"
license: NASA Earth science open data — free and unrestricted. Users are asked to cite the dataset DOIs; CSR asks users to acknowledge that the mascons were downloaded from the CSR GRACE website
account_required: true

summary: >-
  Gridded monthly changes in surface mass, expressed as equivalent water thickness, derived from month-to-month changes in Earth's gravity field measured through the distance between the twin satellites of
  GRACE (2002–2017) and its successor GRACE-FO (2018–). Over land they show changes in terrestrial water storage (TWS) — surface water, soil moisture, groundwater and snow combined — and are widely used
  for drought, groundwater depletion and ice sheet mass loss studies. There are mascon solutions (solved directly for regional mass concentrations) from JPL, CSR and GSFC, and JPL Tellus 1° land grids
  from filtered spherical harmonics; all values are anomalies relative to the 2004.0–2009.999 mean.

time_convention:
  summary: >-
    Each value is the mean mass state from a gravity field solved with a little over a month of observations (about 30 days), expressed as an anomaly (cm or m of equivalent water) relative to the
    2004.0–2009.999 baseline mean. A "month" may not match the calendar month exactly; the days actually used are given in `time_bounds`.
  points:
    - "All values are anomalies relative to the 2004.0–2009.999 mean (JPL and CSR; GSFC uses 2004.0–2010.0). When comparing with groundwater observations or models, put them on the same baseline."
    - "Some solutions do not line up with calendar months. For example, the GRACE-FO 2018-10 solution uses 2018-10-22 to 11-09 and the 2019-02 solution 2019-01-26 to 03-04. JPL recommends averaging model values only over the days GRACE used."
    - "Because of battery management (from 2011) and instrument problems, some months have few observation days or none at all. July–December 2004 and January–February 2015 have larger errors because the orbit was near an exact repeat."
    - "GRACE-FO quality was degraded in September–November 2024 by a 4/61 repeat orbit with poor ground-track coverage, and a 3/46 repeat orbit was expected from July 2026 to February 2027 (Science Team Meeting, 2025-10)."
  source: https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/gracefo/open/docs/GRACE-FO_L3_Handbook_JPL.pdf
  source_name: GRACE-FO Level-3 Data Product User Handbook (JPL) + JPL Tellus mascon and land grid pages + PO.DAAC collection metadata

variables:
  note: >-
    Variable names in the JPL mascon (RL06.3Mv04) and JPL Tellus Level-3 (RL06 v04, RL06.3 v04) files, as listed in the PO.DAAC collection information.
    The CSR and GSFC mascons are organised differently (CSR NetCDF; GSFC HDF5, ASCII and NetCDF), so see their own pages.
  full_list: https://podaac.jpl.nasa.gov/dataset/TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4
  groups:
    - name: JPL mascons (RL06.3Mv04, CRI-filtered and unfiltered versions)
      kind: mean
      period: Month (time_bounds interval)
      items:
        - text: "Equivalent water thickness mass anomaly (land water storage, ocean, ice) — `lwe_thickness` (cm)"
          note: Anomaly relative to the 2004.0–2009.999 mean. The CRI version separates land and ocean signals in coastal mascons and is recommended for most hydrology, ocean and land ice applications
        - "Uncertainty — `uncertainty` (cm)"
        - text: "Ocean–atmosphere de-aliasing model (GAD) — `GAD` (cm)"
          note: For ocean bottom pressure studies; not used for terrestrial water storage
    - name: JPL Tellus Level-3 land grids (1°, GRACE RL06 v04 / GRACE-FO RL06.3 v04)
      kind: mean
      period: Month (time_bounds interval)
      items:
        - text: "Land equivalent water thickness mass anomaly — `lwe_thickness` (m, per PO.DAAC metadata)"
          note: "The Tellus website describes the grids in cm, so check the units attribute in your files. To restore signal removed by the filters, multiply by the CLM4-based gain factor grid"
        - "Uncertainty — `uncertainty` (m)"
    - name: Fixed fields
      kind: static
      items:
        - text: "Gain (scale) factor, CRI — `scale_factor` (dimensionless)"
          note: Restores land hydrology signals below mascon resolution. Time-invariant; apply to land hydrology only
        - text: "Land mask — `land_mask` (0/1)"
        - text: "Mascon identifier — `mascon_ID` (dimensionless)"

