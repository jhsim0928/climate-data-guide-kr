  - name: PO.DAAC (NASA Earthdata Cloud) — JPL mascon CRI RL06.3Mv04
    url: https://podaac.jpl.nasa.gov/dataset/TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4
    method: HTTPS / earthaccess / OPeNDAP / AWS S3 (us-west-2) — Earthdata Login required
    note: >-
      A single NetCDF file from 2002 to the latest month (e.g. GRCTellus.JPL.200204_202607.GLO.RL06.3M.MSCNv04CRI.nc). It is replaced by a new file every month, so download again for the newest month.
      The unfiltered version is TELLUS_GRAC-GRFO_MASCON_GRID_RL06.3_V4. The podaac-data-subscriber tool is also recommended for bulk downloads.
  - name: PO.DAAC — JPL, CSR and GFZ Tellus Level-3 land grids
    url: https://podaac.jpl.nasa.gov/dataset/TELLUS_GRFO_L3_JPL_RL06.3_LND_v04
    method: HTTPS / earthaccess — Earthdata Login required
    note: >-
      Split into GRACE collections TELLUS_GRAC_L3_{JPL,CSR,GFZ}_RL06_LND_v04 and GRACE-FO collections TELLUS_GRFO_L3_{JPL,CSR,GFZ}_RL06.3_LND_v04, one file per month.
      Ocean bottom pressure grids (_OCN_) are separate collections.
  - name: CSR GRACE/GRACE-FO RL06.3 mascons (UT Austin)
    url: https://www2.csr.utexas.edu/grace/RL06_mascons.html
    method: Direct HTTPS download (no account)
    note: >-
      One file, CSR_GRACE_GRACE-FO_RL0603_Mascons_all-corrections.nc (0.25°), plus land and ocean masks and grids of each correction component. Updated 2026-10-07, through 2026-08.
  - name: NASA GSFC mascons (RL06v2.0)
    url: https://earth.gsfc.nasa.gov/geo/data/grace-mascons
    method: Direct HTTPS download (HDF5, ASCII, NetCDF)
    note: 2002-04 to 2026-03 as of the 2026-09-30 page update. A 0.5° NetCDF version is also available.
  - name: JPL GRACE Tellus website (data guides and news)
    url: https://grace.jpl.nasa.gov/data/get-data/jpl_global_mascons/
    method: Web guides / visualisation
    note: Data release news is posted at https://grace.jpl.nasa.gov/data/data-updates/.

example:
  lang: python
  note: >-
    Downloads the JPL mascon CRI RL06.3Mv04 file with earthaccess and builds a terrestrial water storage anomaly series for the North China Plain (113–120°E, 34–40°N). The first run asks for
    Earthdata credentials. Longitudes are 0–360°; for land hydrology, multiply by the gain factor (`scale_factor`) and then take an area-weighted (cos latitude) mean.
  code: |
    import earthaccess
    import numpy as np
    import xarray as xr

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="TELLUS_GRAC-GRFO_MASCON_CRI_GRID_RL06.3_V4",
        version="RL06.3Mv04",
    )
    files = earthaccess.download(results, "grace_mascon")   # the whole record since 2002 is one file

    ds = xr.open_dataset(files[0])
    tws = ds["lwe_thickness"] * ds["scale_factor"]           # cm, relative to 2004.0-2009.999 mean
    tws = tws.where(ds["land_mask"] == 1)
    box = tws.sel(lat=slice(34, 40), lon=slice(113, 120))
    w = np.cos(np.deg2rad(box.lat))
    series = box.weighted(w).mean(["lat", "lon"])
    print(series.to_series().tail())                         # missing months have no time step at all

tips:
  - "All values are anomalies relative to the 2004.0–2009.999 mean. They are not absolute storage; when comparing with other data, subtract a common baseline again."
  - "Missing months (20 GRACE months, GRACE-FO 2018-08 and 2018-09) and the 2017-07 to 2018-05 gap have no time steps in the files. Code that assumes a regular monthly sequence (e.g. grouping every 12 steps into a year) will give wrong results."
  - "The real resolution of the JPL mascons is the 3° mascon (about 300 km). Do not read a single 0.5° cell as a point value; use averages over sufficiently large basins."
  - "The gain factor (`scale_factor`) is for land hydrology. Do not apply it to ice sheets or oceans. JPL notes that the CLM4 gain factors for the Tellus 1° land grids are dominated by annual cycles and may not suit trend analysis."
  - "For the Tellus 1° land grids (from spherical harmonics), JPL recommends averaging the JPL, CSR and GFZ solutions, and advises using mascons for Greenland, Antarctica and glacier mass studies."
  - "The late-GRACE 'accelerometer transplant' months (2016-11, 2016-12, 2017-01, 2017-03, 2017-04, 2017-06) are noisier. GRACE-FO also replaces the GF2 accelerometer with data derived from GF1, and values for January–February 2023 and from July 2023 onward (wide-deadband pointing) changed between RL06.1 and RL06.3."
  - "September–November 2024 has lower quality because of poor repeat-orbit sampling, and similar degradation was expected from July 2026 to February 2027. Check whether abrupt changes in these periods are real signals."
  - "The JPL, CSR and GSFC mascons differ in regularisation, grid and corrections (e.g. when C30 replacement starts), so the same month gives different values. Compare several solutions to gauge uncertainty, but do not mix them within one time series."

