notices:
  - date: "2026-05-01"
    level: info
    title: GRACE Level-2 RL07 (CSR, JPL) published — Level-3, mascons and GRACE-FO RL07 not yet
    body: >-
      GRACE (2002-04 to 2017-06) monthly spherical harmonic coefficients RL07 from CSR and JPL were registered at PO.DAAC with a release date of 2026-05-01. When checked on 2026-10-13,
      there were no public GRACE-FO RL07 or Tellus Level-3/mascon RL07 collections, so RL06.x remains the current release for water storage grids.
    source: https://cmr.earthdata.nasa.gov/search/collections.umm_json?short_name=GRACE_L2_JPL_MONTHLY_0070
  - date: "2025-10-07"
    level: warning
    title: GRACE-FO quality degraded by repeat orbits — September–November 2024, and expected July 2026 to February 2027
    body: >-
      According to the GRACE-FO science operations report, a 4/61 repeat orbit (about 470 km) left about 60 days of poor monthly ground-track coverage in September–November 2024, degrading the gravity fields,
      and a 3/46 repeat orbit (about 445 km) was expected from July 2026 to February 2027 (time spent there could range from about 2 to 18 months depending on solar activity).
    source: https://cpaess.ucar.edu/sites/default/files/grace-fo-2025-presentation/save-himanshu-som.pdf
  - date: "2024-09-12"
    level: info
    title: GRACE-FO JPL RL06.3 released — Level-2, Level-3 and mascons updated
    body: >-
      JPL Level-2, Tellus Level-3 (land and ocean bottom pressure) and the mascons (CRI and unfiltered) moved to RL06.3. It differs from RL06.1 only in the Level-1B accelerometer transplant data used
      for GF2 (ACX2, combining GF1 and GF2 observations); in the JPL mascons only January–February 2023 and the months from July 2023 (wide-deadband pointing) change.
    source: https://podaac.jpl.nasa.gov/announcements/2024-09-12-Release-of-GRACE-FO-JPL-RL06.3-for-L2-3-and-MASCON-Data-Sets
  - date: "2022-05-12"
    level: info
    title: GRACE-FO RL06.1 released — hybrid accelerometer transplant (ACX) introduced
    body: >-
      Level-2 and Level-3 were regenerated with a new transplant product (ACX) that uses observations from both the GF1 and GF2 accelerometers. Because ACX needs more validation, it is delivered in delayed mode
      together with the monthly Level-2/3 data, with a latency of about 40 days at the time.
    source: https://grace.jpl.nasa.gov/data/data-updates/
  - date: "2018-09-17"
    level: warning
    title: GRACE-FO instrument processing unit failure halts science data — no solutions for August and September 2018
    body: >-
      On 2018-07-19 the primary Microwave Instrument Processing Unit (IPU) on GRACE-FO 2 powered down and science data collection stopped in mid-July; the team planned to switch to the redundant unit in September.
      As a result there are no GRACE-FO solutions for 2018-08 and 2018-09, and the 2018-07 solution uses only 1–18 July.
    source: https://sealevel.nasa.gov/news/142/grace-fo-satellite-switching-to-backup-instrument-processing-unit
  - date: "2017-10-27"
    level: critical
    title: GRACE science mission ends — about 11-month gap to GRACE-FO
    body: >-
      An age-related battery problem on GRACE-2 in September 2017 left it unable to operate its science instruments by mid-October, ending the GRACE science mission. The last monthly solution is 2017-06,
      and 2017-07 to 2018-05 is empty until the first GRACE-FO solution (2018-06).
    source: https://www.jpl.nasa.gov/news/prolific-earth-gravity-satellites-end-science-mission/

