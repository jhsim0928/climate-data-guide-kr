transitions:
  - from: GSMaP v7 (product version V04)
    to: GSMaP v8 (product version V05)
    status: completed
    date: "2021-12"
    summary: >-
      Distribution of algorithm v8 began on 1 December 2021, and the July 2023 reprocessing produced a record from 1998. Microwave retrievals were extended to the poles,
      and the input sensors, database, orographic-rain detection and gauge adjustment all changed. Updates to v7 ended in 2026.
    changes:
      - aspect: Period
        before: "v7 standard 2014-03 to 2026-05-31, near-real-time 2017-04 to 2026-06-29 (updates ended)"
        after: "v8 1998-01 to present (operational from 2021-12-01; 1998 to 2021-11 reprocessed)"
      - aspect: Spatial coverage
        before: "60°S–60°N"
        after: "Extended to the poles with microwave-only values (sea ice and Greenland missing). NetCDF uses a 90°S–90°N grid"
      - aspect: Microwave algorithm
        before: "Precipitation profile database from 2 years of KuPR V04A"
        after: "Database from 5 years of DPR V06A, frozen precipitation depth added, improved snowfall and sea-ice screening, new normalization module across sensors"
      - aspect: Input sensors
        before: "GMI, AMSR2, SSMIS, AMSU/MHS and others"
        after: "Metop-C MHS and Suomi NPP / NOAA-20 ATMS added"
      - aspect: Orographic rain
        before: "Orographic scheme switched off in strong-lightning regions, underestimating warm orographic rain"
        after: "Warm orographic rain detected using low-level static stability"
      - aspect: Gauge adjustment
        before: "v7 scheme (artificial patterns appeared)"
        after: "Adjustment based on the NOAA CPC global daily gauge analysis, with fewer artificial patterns"
      - aspect: File formats
        before: "Binary and text (FTP), HDF (G-Portal)"
        after: "Same binary and text formats + NetCDF for real-time and near-real-time products"
    impacts:
      - Do not splice v7 and v8 into one time series; download the whole period again as v8. Values in the v7 period (2014 onward) also differ from v8.
      - Change v7 to v8 in FTP paths (/standard/v8/, /realtime_ver/v8/). On G-Portal, product version V05 is v8.
      - The reprocessed standard data first released in July 2023 (V8.0000.0) were regenerated as V8.0000.1 in September 2023, so files downloaded in between must be fetched again.
    sources:
      - name: GSMaP version05 / Algorithm version8 summary (JAXA)
        url: https://www.eorc.jaxa.jp/GPM/doc/product_info/release_note_gsmapv05-v8_en.pdf
      - name: GSMaP V05/v8 Release Note (2023-11-10)
        url: https://www.eorc.jaxa.jp/GPM/doc/product/ReleaseNote/08_note_GPM-GSMaP_20231110.pdf
      - name: GSMaP reprocessing note (2023-07)
        url: https://www.eorc.jaxa.jp/GPM/doc/reprocessing_note/GSMaP_reprocessing_note202307A.pdf
      - name: JAXA EORC GPM news (end of v7 updates, 2026-06-16 and 07-29)
        url: https://www.eorc.jaxa.jp/GPM/en/news.html
  - from: GSMaP product version V05 (algorithm v8)
    to: GSMaP product version V06
    status: planned
    date: "2026-10"
    summary: >-
      JAXA announced that a new version V06 of the GSMaP hourly and monthly products will be released on G-Portal on 19 October 2026. The format changes from HDF5 to NetCDF4,
      V06 will be offered only on the new G-Portal system, and V05 will continue to be provided. When checked on 2026-10-13, details of the algorithm changes and of any change on the FTP (Global Rainfall Watch) side had not yet been published.
    changes:
      - aspect: File format
        before: "HDF5 (.h5)"
        after: "NetCDF4 (.nc)"
      - aspect: Where to get it
        before: "Old G-Portal (gportal.jaxa.jp/gpr) and the new G-Portal"
        after: "Only the new G-Portal opened in October 2026 (new account required)"
      - aspect: Products
        before: "GSMaP L3 Hourly and Monthly V05"
        after: "GSMaP Precipitation (Hourly) and (Monthly) V06; V05 continues"
    impacts:
      - When V06 appears, read the algorithm and format documents, and do not mix V05 and V06.
      - HDF5 reading code needs to change to NetCDF4. Check the new specification for file naming as well.
    sources:
      - name: Plan for the GSMaP product version up (V06) (G-Portal, 2026-10-09)
        url: https://gportal.jaxa.jp/gpr/notice/notice/view/1510
      - name: Notice Regarding G-Portal System Renewal
        url: https://gportal.jaxa.jp/gpr/notice/case/view/1502

notices:
  - date: "2026-10-09"
    level: warning
    title: "Plan for the GSMaP product version up (V06) — release on G-Portal on 2026-10-19 (NetCDF4)"
    body: >-
      JAXA plans to release a new version (V06) of the GSMaP hourly and monthly precipitation products on G-Portal on 19 October 2026. The format will be NetCDF4 rather than HDF5,
      V06 will be available only through the new G-Portal system that began service in October 2026 (account required), and V05 will continue to be provided. Algorithm improvements are to be described on the JAXA EORC GPM website.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1510
  - date: "2026-09-15"
    level: warning
    title: "New G-Portal system released on 2026-10-01 — account re-registration, new SFTP address and authentication, old system to close at the end of October"
    body: >-
      G-Portal switched to a new system (www.gportal.jaxa.jp) on 1 October 2026, with the current system planned to shut down at the end of October after about a month of parallel operation.
      Continued use requires registering a new account (settings and public keys are not carried over), and SFTP moves to sftp.gportal.jaxa.jp (port 22) with public-key authentication only. Update automated download scripts.
    source: https://gportal.jaxa.jp/gpr/notice/case/view/1502
  - date: "2026-06-16"
    level: info
    title: "Termination of updates for GSMaP algorithm version 7 (standard 2026-05-31, near-real-time 2026-06-29)"
    body: >-
      Updates to the v7 standard products on the FTP site (MVK and Gauge, /standard/v7) ended with data for 31 May 2026, and the near-real-time products (NRT and Gauge_NRT, /realtime_ver/v7) with data for 29 June (notice updated 29 July).
      Past v7 data, as well as v6 and v8, remain available. G-Portal also ended distribution of the V04 (v7) standard products on 31 May.
    source: https://www.eorc.jaxa.jp/GPM/en/news.html
  - date: "2025-06-17"
    level: info
    title: NOAA-19 AMSU-A/MHS no longer used as input
    body: >-
      According to the list of input satellite changes in the JAXA Global Rainfall Watch guide, GSMaP has not used NOAA-19 AMSU-A/MHS data since 17 June 2025.
      Microwave sampling changes accordingly, so quality characteristics may differ before and after this date.
    source: https://sharaku.eorc.jaxa.jp/GSMaP/guide.html
  - date: "2024-11-29"
    level: info
    title: "GSMaP_NOW algorithm revision (from 2024-12-01)"
    body: >-
      From 1 December 2024, GSMaP_NOW and GSMaP_Gauge_NOW are produced with a revised v8 algorithm: GSMaP_NOW has an improved processing algorithm and bugs in GSMaP_Gauge_NOW were fixed.
    source: https://www.eorc.jaxa.jp/GPM/en/news.html
  - date: "2023-09-15"
    level: warning
    title: "Reprocessed v8 standard products regenerated (V8.0000.0 → V8.0000.1) — download again"
    body: >-
      Issues were found in the reprocessed GSMaP_MVK and Gauge v8 data released in July 2023, so the data were reprocessed and the product version changed from V8.0000.0 to V8.0000.1.
      Users who downloaded the earlier files were asked to download them again.
    source: https://sharaku.eorc.jaxa.jp/GSMaP/document/20230915_GSMaP_STD_v8_repro_list.pdf
  - date: "2023-07-10"
    level: info
    title: Reprocessed v8 data available from January 1998
    body: >-
      Reprocessed v8 data covering the TRMM era were released, so v8 can now be downloaded from January 1998. Before March 2000, gaps in IR input were filled with GridSat-B1 data.
    source: https://www.eorc.jaxa.jp/GPM/doc/reprocessing_note/GSMaP_reprocessing_note202307A.pdf
  - date: "2021-12-01"
    level: info
    title: Distribution of GSMaP algorithm version 8 begins
    body: >-
      JAXA started distributing GSMaP algorithm version 8. Binary and text formats are unchanged, and NetCDF was added for the real-time and near-real-time v8 products. v6 and v7 remained available at the time.
    source: https://www.eorc.jaxa.jp/GPM/en/news.html

