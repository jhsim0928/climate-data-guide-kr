notices:
  - date: "2023-06-01"
    level: critical
    title: Decommissioning of ECMWF Public Datasets service — no more ERA-20C downloads from ECMWF
    body: >-
      As announced on 2 March 2023, the ECMWF Public Datasets service, including access via the Web API client, stopped on 1 June 2023,
      so ERA-20C daily and monthly data and the ERA-20C observation feedback are no longer publicly available from ECMWF. ECMWF's table lists no alternative for ERA-20C; use NCAR GDEX.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2015-05-13"
    level: info
    title: "New Public Dataset: ERA-20C Daily, ERA-20C Wave, ERA-20C Observations"
    body: ERA-20C daily data, wave data and observations were first released through the ECMWF Public Datasets service (decommissioned in 2023).
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2015/05/13/65223836/New+Public+Dataset+ERA-20C+Daily+ERA-20C+Wave+ERA-20C+Observations

