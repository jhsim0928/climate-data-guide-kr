# ─────────────────────────────────────────────────────────────
# GFED (Global Fire Emissions Database) — dataset information file
# Listed under the Land tab, 'Fire'. The current release is GFED5.1 (1997–2022) + GFED5.1NRT (2023 onward, beta); the earlier GFED4.1s is still distributed.
# The GFED4.1s → GFED5 comparison is a same-page transition (no to_id).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gfed
name: "GFED"
full_name: Global Fire Emissions Database version 5 (GFED5.1 / GFED5.1NRT — global fire emissions at 0.25° derived from satellite burned area)
category: analysis
domain: land
group: 산불
order: 20
domains: [육지, 대기, 에어로졸]
provider: GFED team at Wageningen University & Research, UC Irvine, University of Maryland and NASA GSFC (globalfiredata.org)

status: active
status_note: >-
  The current version is GFED5: GFED5.1 covers 1997–2022 and was finalised with its papers, and from 2023 onward the near-real-time extension GFED5.1NRT, which estimates burned area
  and emissions from VIIRS active fires, is updated daily. The official site labels data from 2023 onward as beta, subject to change until the accompanying paper (Chen et al., ESSD) is accepted.
  The previous GFED4.1s (beta files based on MODIS active fires after 2016) can still be downloaded, but the team recommends GFED5 wherever possible.

period:
  start: "1997-01"
  end: present
  note: >-
    GFED5.1 covers 1997–2022 (1997–2000 at 1°, estimated from ATSR and TRMM VIRS active fires; 0.25° from 2001), and GFED5.1NRT continues from 2023
    (the reprocessed Zenodo release covers 2023–2024; later data are updated daily on the site's SFTP). GFED4.1s is burned-area based for 1997–2016 with beta files for 2017–2023
    (on 2026-10-13 the latest file in the web directory was GFED4.1s_2023_beta, updated 2024-01-26).

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: >-
    Global 0.25° × 0.25° latitude-longitude grid (720 × 1440, cell centres from -89.875 to 89.875° and -179.875 to 179.875°) from 2001.
    1997–2000 is provided only on a 1° × 1° grid because of its larger uncertainty. GFED4.1s is also on a 0.25° grid.
  vertical: Surface emissions (no vertical distribution)
  temporal: >-
    Monthly (burned area and emissions) / daily (GFED5.1 daily emission files; GFED5.1NRT daily and monthly). For GFED4.1s, daily and 3-hourly values are obtained by multiplying
    the monthly fields by daily fractions (daily_fraction) and the 3-hourly diurnal cycle (diurnal_cycle), available from 2003.

coverage:
  short: 전지구
update: "GFED5.1 (1997–2022) is fixed / GFED5.1NRT (2023 onward) is updated daily and reprocessed episodically once science-quality VIIRS data are available / GFED4.1s has not been updated since 2024-01"
license: GFED5.1 and GFED5.1NRT are CC BY 4.0 (Zenodo records and file attributes). Free of charge, co-authorship is not expected, and the FAQ citation guidance applies
account_required: false

summary: >-
  GFED estimates global fire emissions of carbon, trace gases and aerosols on a 0.25° grid by multiplying satellite burned area by fuel consumption from a biogeochemical model and by emission factors.
  GFED5 builds on MODIS MCD64A1 C6.1 with omission and commission corrections constrained by Landsat and Sentinel-2, small fires from active fire detections and cropland burning from GloCAB,
  which substantially increases burned area, and it also revises emission factors and fuel consumption. It is widely used as fire emission input for atmospheric chemistry and air quality models,
  in carbon budgets such as the Global Carbon Project, and in IPCC assessments.

time_convention:
  summary: >-
    Monthly fields are totals (accumulations) of burned area and emissions over the month, and GFED5.1 daily files hold the emission total for each day (UTC date).
    From 2023, GFED5.1NRT converts counts of instantaneous VIIRS active fire detections (Suomi NPP and NOAA-20, overpasses around 13:30) into daily burned area and emissions
    using biome- and region-specific lookup tables; no sub-daily resolution is provided.
  points:
    - "GFED4.1s `C` and `DM` are monthly emissions per unit area (g C m-2 month-1, kg DM m-2 month-1); multiply by `grid_cell_area` (m2) and sum for regional totals."
    - "GFED4.1s daily and 3-hourly values are monthly emissions × `daily_fraction` (share for that day) × `diurnal_cycle` (shares for eight 3-hour UTC windows), from 2003. The diurnal shape is the same throughout the month."
    - "In GFED5.1 daily files the units attribute reads 'g <species> per day' (e.g. `CO2` = 'g CO2 per day'). Check the attributes and README of the files you download to confirm whether values are per unit area or per grid cell."
    - "In the GFED5.0 burned area files (BAYYYYMM.nc), values are burned area per grid cell for the month (km2). Divide the global sum by 1e6 for Mha."
    - "From 2023 (GFED5.1NRT), fuel consumption is fixed at the 2013–2022 mean and land cover is static. The method differs from the earlier period."
  source: https://www.globalfiredata.org/index.html
  source_name: "GFED website + GFED4s Readme + GFED5 Zenodo README + van der Werf et al. (2025) and Chen et al. (2026) papers"

variables:
  note: >-
    GFED5.1 daily emission files (GFED5.1_daily_YYYY-MM.nc) contain variables for 40 species following the same naming scheme. Variable names in the GFED5.1 monthly files
    could not be confirmed from public documentation, so the verified GFED5.0 burned area files and GFED4.1s (HDF5, with group paths) variables are listed as well.
  full_list: https://doi.org/10.1038/s41597-025-06127-w
  groups:
    - name: GFED5.1 daily emissions (GFED5.1_daily_YYYY-MM.nc, 0.25°)
      kind: accum
      period: Daily
      items:
        - text: "Dry matter burned — `DM` (g DM per day)"
          std: []
        - text: "Carbon emissions — `C` (g C per day)"
          std: []
        - text: "Carbon dioxide emissions — `CO2` (g CO2 per day)"
          std: []
        - text: "Carbon monoxide emissions — `CO` (g CO per day)"
          std: []
        - text: "Methane emissions — `CH4` (g CH4 per day)"
          std: []
        - text: "Nitrogen oxides emissions (as NO) — `NOx` (g NOx per day)"
          std: []
        - text: "PM2.5 emissions — `PM2.5` (g PM2.5 per day)"
          std: []
        - text: "Black carbon, organic carbon and total particulate carbon — `BC`, `OC`, `TPC` (g per day)"
          std: []
        - text: "Other trace gases — `N2O`, `NH3`, `SO2`, `H2`, `NMOC_g`, `HCN`, `CH2O`, `C2H6`, `C5H8`, `C10H16`, etc. (g per day)"
          std: []
    - name: GFED5.0 burned area (BAYYYYMM.nc, Chen et al. 2023 Zenodo, 2001–2020 at 0.25°)
      kind: accum
      period: Monthly
      items:
        - text: "Total burned area — `Total` (km2 per grid cell)"
          note: The only variable provided for 1997–2000 (1°)
          std: []
        - text: "Normal burned area by 17 land cover types — `Norm` (km2)"
          note: "Dimensions (time, iLCT, lat, lon). 17 of iLCT 0–19 are in use"
          std: []
        - text: "Cropland, deforestation and peatland burned area — `Crop`, `Defo`, `Peat` (km2)"
          std: []
    - name: GFED4.1s (GFED4.1s_YYYY.hdf5, monthly groups 01–12)
      kind: accum
      period: Monthly
      items:
        - text: "Burned fraction — `burned_area/MM/burned_fraction` (fraction, of grid-cell area)"
          note: Includes small-fire burned area (experimental estimate)
          std: []
        - text: "Carbon emissions — `emissions/MM/C` (g C m-2 month-1)"
          std: []
        - text: "Dry matter burned — `emissions/MM/DM` (kg DM m-2 month-1)"
          std: []
        - text: "Small-fire fraction of emissions — `emissions/MM/small_fire_fraction` (unitless)"
          kind: mean
          std: []
        - text: "Emission partitioning by fire type — `emissions/MM/partitioning/C_SAVA` etc. for SAVA, BORF, TEMF, DEFO, PEAT, AGRI (unitless)"
          kind: mean
          std: []
        - text: "Daily fraction — `emissions/MM/daily_fraction`, 3-hourly diurnal cycle — `diurnal_cycle` (unitless, 2003 onward)"
          kind: mean
          std: []
        - text: "Fire carbon, net primary production, heterotrophic respiration — `biosphere/MM/BB`, `NPP`, `Rh` (g C m-2 month-1)"
          std: []
    - name: Invariant fields (GFED4.1s ancill group)
      kind: static
      items:
        - text: "Grid cell area — `ancill/grid_cell_area` (m2)"
          std: []
        - text: "14 GFED basis regions — `ancill/basis_regions`"
          std: []

access:
  - name: GFED website — GFED5 gridded files (SFTP)
    url: https://www.globalfiredata.org/data.html
    method: SFTP (server ftp.prd.dip.wur.nl, port 1022)
    note: >-
      Holds GFED5.1 (1997–2022) and GFED5.1NRT (2023 onward, in reprocessed and update directories) as netCDF4 files. Public login details are at
      https://www.globalfiredata.org/ancill/GFED5_SFTP_info.txt (note port 1022).
  - name: Zenodo — GFED5.1 (paper data)
    url: https://doi.org/10.5281/zenodo.16794692
    method: HTTPS download (four zip files, about 20.5 GB)
    note: GFED5.1_monthly (1.7 GB, 1997–2022 monthly burned area and emissions), GFED5.1_daily (18.4 GB, daily emissions), GFED5.1_ecosystem (2002–2022 burned area and carbon emissions by category), GFED5.1_code
  - name: Zenodo — GFED5NRT (near-real-time extension, reprocessed)
    url: https://doi.org/10.5281/zenodo.18702700
    method: HTTPS download
    note: Daily and monthly data for 2023–2024, split into Species and Ecosystem files for each sensor combination (CMB combined, VNP Suomi NPP, VJ1 NOAA-20).
  - name: GFED summary tables (global and regional annual emissions)
    url: https://www.globalfiredata.org/tables
    method: Text table download
  - name: GFED4.1s (previous version, HDF5)
    url: https://www.geo.vu.nl/~gwerf/GFED/GFED4/
    method: HTTPS directory download
    note: Contains GFED4.1s_1997–2016.hdf5, GFED4.1s_2017–2023_beta.hdf5, Readme.pdf and ancill (emission factor tables).
  - name: ORNL DAAC — GFED4.1 (1997–2016)
    url: https://doi.org/10.3334/ORNLDAAC/1293
    method: Download after Earthdata login
    note: NASA archive copy with GFED4 monthly and daily burned area without small fires (HDF) and GFED4.1s annual files (1997–2015).

example:
  lang: python
  note: >-
    Downloads a GFED4.1s HDF5 file to compute annual global carbon emissions, then opens a GFED5.1 daily file obtained from SFTP or Zenodo with xarray.
    Check file names and variables against the README of the GFED5.1 release you download.
  code: |
    # pip install h5py numpy requests xarray netCDF4
    import h5py
    import numpy as np
    import requests
    import xarray as xr

    # 1) GFED4.1s: global carbon emissions in 2015
    url = "https://www.geo.vu.nl/~gwerf/GFED/GFED4/GFED4.1s_2015.hdf5"
    with open("GFED4.1s_2015.hdf5", "wb") as out:
        out.write(requests.get(url, timeout=600).content)

    with h5py.File("GFED4.1s_2015.hdf5", "r") as f:
        area = f["ancill/grid_cell_area"][:]                          # m2
        c = sum(f[f"emissions/{m:02d}/C"][:] for m in range(1, 13))   # g C m-2 (sum of monthly totals)
        print("2015 global carbon emissions:", (c * area).sum() / 1e15, "Pg C")

    # 2) GFED5.1 daily emissions file (from SFTP or GFED5.1_daily.zip on Zenodo)
    ds = xr.open_dataset("GFED5.1_daily_2020-01.nc")
    co2 = ds["CO2"]                        # (time, lat, lon), 0.25°
    print(co2.attrs.get("units"))          # 'g CO2 per day' — check whether per area or per cell
    print(co2.sel(lat=slice(33, 39), lon=slice(124, 132)).sum(("lat", "lon")))

tips:
  - "GFED5 burned area is about 61% and carbon emissions about 65% higher than GFED4s (mostly small fires, omission corrections and cropland burning). Do not mix the two versions or drop GFED5 straight into model setups tuned to GFED4s."
  - "From 2023 (GFED5.1NRT), burned area is not observed directly but converted from VIIRS active fire counts, and the official site labels it beta. State this change in method when extending pre-2023 trends."
  - "The GFED5NRT combined (CMB) product is designed to fall back to the remaining instrument when Suomi NPP or NOAA-20 is missing. With Suomi NPP data delivery ending on 1 November 2026, later values will effectively be NOAA-20 only."
  - "1997–2000 is at 1° and estimated from ATSR and VIRS active fires, with large uncertainty. The README warns of discontinuities in 1998 (VIRS introduced), 2001 (Terra MODIS) and 2003 (Aqua MODIS)."
  - "Cropland burning emissions are the most uncertain component (very few field measurements of fuel consumption). State this uncertainty when analysing agricultural burning in Korea, China and elsewhere."
  - "GFED4.1s _beta files from 2017 onward are estimated from MODIS active fires using 2003–2016 relationships and contain only `DM` and `C`. Compute species emissions yourself as `DM` × emission factor (tables in the ancill folder) × fire-type share (partitioning)."
  - "GFED4.1s HDF5 arrays run from north (89.875°) to south. Check latitude order when overlaying other datasets."
  - "The team notes that uncertainty grows at small scales such as individual 0.25° cells or sub-national regions. Aggregates over large regions and long periods are the safest use."

