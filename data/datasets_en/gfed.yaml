transitions:
  - from: GFED4.1s
    to: GFED5 (GFED5.1 + GFED5.1NRT)
    status: completed
    date: "2025-10"
    summary: >-
      GFED5 is the largest overhaul since GFED4, replacing both the burned area input and the emission factors; global burned area rises by about 61% and carbon emissions by about 65%.
      Burned area was published in 2023 (ESSD, Chen et al.) and emissions in 2025 (Scientific Data, van der Werf et al.), with a VIIRS active-fire-based near-real-time extension from 2023.
      Because the magnitudes differ so much, the two versions must not be mixed within one study.
    changes:
      - aspect: Burned area input
        before: "MODIS MCD64A1 Collection 5.1 + small fires estimated statistically from active fires (Randerson et al. 2012)"
        after: "MCD64A1 C6.1 + omission/commission corrections constrained by Landsat and Sentinel-2 + small fires from active fires + cropland burning from GloCAB (Hall et al. 2023)"
      - aspect: Global burned area
        before: "GFED5 exceeds GFED4s by about 61% (2002–2016 overlap)"
        after: "774 ± 63 Mha per year (2001–2020, Chen et al. 2023), about 93% more than MCD64A1"
      - aspect: Global carbon emissions
        before: "2.04 Pg C per year (comparison value in van der Werf et al. 2025, Table 7)"
        after: "3.4 Pg C per year (2002–2022 mean, +65%)"
      - aspect: Emission factors
        before: "Fire-type values based mainly on Akagi et al. (2011)"
        after: "NEIVA v1.1 means for six fire categories + dynamic CO2, CO, CH4 and N2O factors for savanna and grassland driven by weather and vegetation"
      - aspect: Period and handling of recent years
        before: "1997–2016 burned-area based / 2017–2023 beta from MODIS active fires (DM and C only)"
        after: "1997–2022 GFED5.1 / 2023 onward GFED5.1NRT from VIIRS active fires (updated daily, beta)"
      - aspect: Resolution
        before: "0.25° throughout, monthly + daily and 3-hourly fractions"
        after: "0.25° from 2001, 1° for 1997–2000 / monthly and daily files"
      - aspect: File format and variables
        before: "Annual HDF5 (GFED4.1s_YYYY.hdf5) with per-area `C` and `DM` under monthly groups; species emissions computed by the user from emission factors"
        after: "netCDF4 with 40 species variables provided directly (`CO2`, `CO`, `CH4`, `PM2.5`, etc.)"
      - aspect: Distribution and licence
        before: "geo.vu.nl web directory, ORNL DAAC (1997–2016)"
        after: "globalfiredata.org SFTP (port 1022) + Zenodo, CC BY 4.0"
    impacts:
      - Switching atmospheric chemistry model emissions or carbon budgets tuned to GFED4s over to GFED5 substantially increases fire emissions; re-evaluate model results accordingly.
      - Do not combine GFED4.1s post-2016 beta values with GFED5.1 in a single time series. Use one version for the whole period.
      - GFED5.1 (through 2022) and GFED5.1NRT (from 2023) use different methods; when joining them, cite both papers and describe the change in method.
    sources:
      - name: van der Werf et al. (2025), Scientific Data
