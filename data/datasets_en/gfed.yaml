notices:
  - date: "2026-09-04"
    level: info
    title: GFED website redesigned — current fire situation by region, country and state
    body: >-
      The site was rebuilt to make it easier to compare the current fire situation with previous years. Emission graphs are available by basis region, country and continent, and in some cases
      by province or state, with the underlying text files and PDF figures available for download.
    source: https://www.globalfiredata.org/news.html
  - date: "2026-02-19"
    level: warning
    title: GFED5NRT 2023–2024 reprocessed data released — data from 2023 are beta and may change until the paper is accepted
    body: >-
      Emissions from 2023 onward come from the near-real-time extension (GFED5NRT), which converts VIIRS active fire detections into burned area and emissions using 2012–2022 relationships;
      a reprocessed 2023–2024 release is on Zenodo. The official site labels this period as beta, subject to change until the accompanying ESSD paper is accepted.
    source: https://doi.org/10.5281/zenodo.18702700
  - date: "2025-11-28"
    level: info
    title: GFED5 emissions paper published — GFED5.1 (1997–2022) released
    body: >-
      With the GFED5 emissions paper in Scientific Data, monthly and daily emissions for 1997–2022 and burned area and carbon emissions by category (GFED5.1) were released on Zenodo (data posted 2025-10-01).
      A publisher correction followed on 15 January 2026.
    source: https://doi.org/10.1038/s41597-025-06127-w

