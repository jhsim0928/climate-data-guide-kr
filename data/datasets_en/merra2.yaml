# ─────────────────────────────────────────────────────────────
# MERRA-2 — dataset information file (English edition)
# ─────────────────────────────────────────────────────────────
id: merra2
name: MERRA-2
full_name: Modern-Era Retrospective analysis for Research and Applications, Version 2
category: reanalysis
domain: atmosphere
group: 재분석
order: 50
domains: [대기, 육지, 에어로졸]
provider: NASA Global Modeling and Assimilation Office (GMAO); distributed by the Goddard Earth Sciences Data and Information Services Center (GES DISC)

status: active
status_note: >-
  Production is nominal. The GMAO production status page shows processing completed to early October 2026, with data through August 2026 delivered to GES DISC.
  No end of MERRA-2 production or official successor has been announced. GMAO is producing MERRA-21C, a new ~25 km reanalysis beginning in 1998, but describes it only as
  "building on MERRA-2", not as a replacement. Separately, GES DISC announced that HTTPS access on its on-premises servers (goldsmr4, goldsmr5, etc.) would end by September 30, 2026.
  Some of these servers still responded on October 11, but they may disappear at any time, so move scripts that use the old addresses to Earthdata Cloud URLs.

period:
  start: "1980-01"
  end: present
  note: Processed one month at a time and usually released around the 15th–20th of the following month (about a three-week lag); observation or computing issues can cause delays.

resolution:
  spatial_short: "56 km (0.5°×0.625°)"
  temporal_short: "1시간"
  spatial: "Output grid 0.5° latitude × 0.625° longitude, 576 × 361 points (the model runs on a cubed-sphere grid of about 50 km × 50 km)"
  vertical: "72 model layers / 42 pressure levels (1000–0.1 hPa)"
  temporal: Hourly (2D fields), 3-hourly (3D fields), daily and monthly means, monthly diurnal means

coverage:
  short: 전지구
update: Monthly (about three weeks after the end of each month)
license: NASA open data with no restrictions on use (CC BY 4.0 per the AWS Open Data Registry entry); citing the DOI of each collection used is requested
account_required: true

summary: >-
  MERRA-2 is NASA GMAO's global reanalysis from 1980 onward, produced with the GEOS data assimilation system; it replaces the original MERRA.
  It assimilates newer hyperspectral infrared and microwave radiances and GPS radio occultation data, and is the first long-term global reanalysis to assimilate space-based observations of aerosols,
  so aerosol concentrations and optical depths are provided alongside the meteorology. Files are organised in collections (e.g. M2T1NXSLV), each with its own citable DOI.

time_convention:
  summary: >-
    The collection name says how each field is defined in time: inst is instantaneous at the time stamp, tavg is a time average over the interval, and const is time-invariant.
    Hourly averages (tavg1) are time-stamped at the centre of the averaging interval (00:30, 01:30, …), half an hour off from instantaneous fields stamped on the hour.
  points:
    - "inst1, inst3, inst6: instantaneous. inst3 at 00, 03, 06, …, 21 UTC; inst6 at 00, 06, 12 and 18 UTC; inst1 every hour on the hour"
    - "tavg1: hourly averages centred on the half hour (00:30 = 00–01 UTC mean). tavg3: 3-hourly averages centred on 01:30, 04:30, … (01:30 = 00–03 UTC mean)"
    - "Monthly means (tavgM), monthly diurnal means (tavgU) and daily statistics (statD) are separate collections (e.g. M2TMNXSLV). Monthly files cover one calendar month, accounting for leap years"
    - "Precipitation and fluxes (`PRECTOT`, `HFLUX`, etc.) are mean rates, not accumulations. In kg m-2 s-1, multiply by 3600 for hourly precipitation in mm"
    - "Aerosol concentrations and optical depths (M2T1NXAER) are also hourly averages"
  source: https://gmao.gsfc.nasa.gov/media/publications/zbly36ziNFDFbmYmvhQeVqPhUo/Bosilovich785.pdf
  source_name: "MERRA-2: File Specification (GMAO Office Note No. 9), Sections 3 and 5.1"

variables:
  note: Main variables from the GES DISC collection pages and the File Specification. Names are the netCDF variable names; the collection is given in each group name.
  full_list: https://gmao.gsfc.nasa.gov/media/publications/zbly36ziNFDFbmYmvhQeVqPhUo/Bosilovich785.pdf
  groups:
    - name: Single-level diagnostics (M2T1NXSLV, hourly average)
      kind: mean
      period: 1 hour
      items:
        - "2-meter air temperature — `T2M` (K)"
        - "Dew point temperature at 2 m — `T2MDEW` (K)"
        - "2-meter specific humidity — `QV2M` (kg kg-1)"
        - "10-meter eastward and northward wind — `U10M`, `V10M` (m s-1)"
        - "Sea level pressure — `SLP` (Pa)"
        - "Surface pressure — `PS` (Pa)"
        - "Surface skin temperature — `TS` (K)"
        - "Total precipitable water vapor — `TQV` (kg m-2)"
        - "Height at 500 hPa — `H500` (m)"
        - "Omega at 500 hPa — `OMEGA500` (Pa s-1)"
        - "Total column ozone — `TO3` (Dobsons)"
    - name: Surface flux diagnostics (M2T1NXFLX, hourly average)
      kind: mean
      period: 1 hour
      items:
        - "Total precipitation from atmospheric model physics — `PRECTOT` (kg m-2 s-1)"
        - "Bias-corrected total precipitation — `PRECTOTCORR` (kg m-2 s-1)"
        - "Sensible heat flux from turbulence — `HFLUX` (W m-2)"
        - "Total latent energy flux — `EFLUX` (W m-2)"
        - "Eastward surface stress — `TAUX` (N m-2)"
        - "Planetary boundary layer height — `PBLH` (m)"
        - "Ice-covered fraction of tile — `FRSEAICE` (1)"
    - name: Pressure levels (M2I3NPASM, 3-hourly instantaneous, 42 levels)
      kind: instant
      items:
        - "Air temperature — `T` (K)"
        - "Eastward and northward wind — `U`, `V` (m s-1)"
        - "Edge heights / layer heights — `H` (m)"
        - "Specific humidity — `QV` (kg kg-1)"
        - "Relative humidity after moist processes — `RH` (1)"
        - "Vertical pressure velocity — `OMEGA` (Pa s-1)"
        - "Ozone mass mixing ratio — `O3` (kg kg-1)"
        - "Ertel's potential vorticity — `EPV` (K m2 kg-1 s-1)"
    - name: Aerosol diagnostics (M2T1NXAER, hourly average)
      kind: mean
      period: 1 hour
      items:
        - "Dust surface mass concentration, PM2.5 — `DUSMASS25` (kg m-3)"
        - "Black carbon surface mass concentration — `BCSMASS` (kg m-3)"
        - "SO4 surface mass concentration — `SO4SMASS` (kg m-3)"
        - "Dust extinction AOT at 550 nm — `DUEXTTAU` (1)"

access:
  - name: NASA GES DISC — MERRA-2 datasets
    url: https://disc.gsfc.nasa.gov/datasets?project=MERRA-2
    method: Web download / Subset / OPeNDAP
    note: >-
      Requires a NASA Earthdata Login account with the "NASA GESDISC DATA ARCHIVE" application approved in the account profile.
      On-premises servers are being shut down from September 30, 2026; use Earthdata Cloud URLs (data.gesdisc.earthdata.nasa.gov).
  - name: NASA Earthdata — MERRA-2 project page
    url: https://www.earthdata.nasa.gov/data/projects/merra-2
    method: Collection information / Earthdata Search / earthaccess
    note: Collects per-collection descriptions, citation formats and reprocessing records. File lists are best obtained through CMR searches or earthaccess.
  - name: Earthdata Cloud (AWS us-west-2 S3)
    url: https://registry.opendata.aws/nasa-m2i3nvasm/
    method: Direct S3 access
    note: Best for computing inside the AWS us-west-2 region. Temporary S3 credentials are obtained with Earthdata Login.
  - name: GMAO — MERRA-2 data access
    url: https://gmao.gsfc.nasa.gov/gmao-products/merra-2/data-access_merra-2/
    method: Information page (links to tools such as the FLUID visualisation)

example:
  lang: python
  note: "earthaccess prompts for Earthdata Login credentials or reads ~/.netrc. Specify both the collection short name and the version (5.12.4)."
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()  # Earthdata Login
    results = earthaccess.search_data(
        short_name="M2T1NXSLV",
        version="5.12.4",
        temporal=("2024-01-01", "2024-01-02"),
    )
    files = earthaccess.download(results, "./merra2")
    ds = xr.open_mfdataset(files)
    print(ds["T2M"])

tips:
  - "The file-name prefix (MERRA2_100/200/300/400) is the production stream (1980–1991, 1992–2000, 2001–2010, 2011 onward). Reprocessed months get a higher number (e.g. September 2020 is MERRA2_401), so scripts that build file names from a fixed pattern can break."
  - "Precipitation comes in two versions: `PRECTOT` from the atmospheric model physics and the observation-corrected `PRECTOTCORR`. The corrected precipitation is what forces the land surface model; choose the one that fits your purpose and state which you used."
  - Pressure levels that lie below the surface (e.g. 1000 or 850 hPa over high terrain) are undefined. Area means that include mountains can differ from other reanalyses depending on how these missing values are handled, so check.
  - "GES DISC on-premises THREDDS was discontinued on July 31, 2026, on-premises OPeNDAP was turned off between August 20 and September 30, and on-premises HTTPS is being retired after September 30. Move scripts that rely on goldsmr4/goldsmr5 URLs or recursive wget of whole directories to earthaccess, CMR queries or opendap.earthdata.nasa.gov."

