notices:
  - date: "2026-10-21"
    level: warning
    title: Ingest & Archive Migration to interrupt GES DISC data ingestion (Oct. 28-30)
    body: >-
      As part of NASA's planned Consolidated Ingest and Archive (I&A) system migration, GES DISC will experience temporary interruptions to new data ingestion and availability from October 28, 5:00 p.m. to October 30, 9:00 a.m. ET.
      Existing data search and download services are expected to remain operational. New data ingestion will resume and newly ingested data will become available once migration is complete.
    source: https://disc.gsfc.nasa.gov/information/alerts
  - date: "2026-05-11"
    level: warning
    title: GES DISC Migration to Earthdata Website and Earthdata Cloud
    body: >-
      HTTPS access to data on GES DISC on-premises servers will no longer be available by September 30, 2026; on-premises OPeNDAP is turned off between August 20 and September 30,
      and the THREDDS Data Server was discontinued as of July 31. Free HTTPS downloads continue from URLs beginning data.gesdisc.earthdata.nasa.gov, but recursive download of entire directories
      is not available — build file lists from CMR or with earthaccess. The GES DISC website redirects to earthdata.nasa.gov after November 2026. (Last updated 2026-09-01.)
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2026-04-20"
    level: info
    title: Giovanni System Maintenance for MERRA-2 Variables Has Been Completed
    body: GES DISC has finished moving the OPeNDAP service for 34 MERRA-2 collections to Earthdata Cloud, and Giovanni variables from those collections are available again.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/giovanni-system-maintenance-merra-2-variables-has-been-completed
  - date: "2026-01-15"
    level: warning
    title: GrADS Data Server (GDS) Service Will Be Discontinued No Earlier Than March 27, 2026
    body: >-
      The GDS, which served around 90 MERRA-2 collections, will be discontinued no earlier than March 27, 2026. The same data remain available from Earthdata Cloud
      through HTTPS and subsetting services.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-discontinued-earlier-than-march-27-2026
  - date: "2025-05-06"
    level: info
    title: Additional MERRA-2 data collections added to Earthdata Cloud OPeNDAP
    body: OPeNDAP services for 53 more MERRA-2 collections have moved to Earthdata Cloud, for better performance with large downloads and many simultaneous requests.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=22904

