# ─────────────────────────────────────────────────────────────
# CLMS (formerly Copernicus Global Land Service) LAI, FAPAR, FCover — dataset information file (English edition)
# Land tab, 'Vegetation'. The 300 m V2.0 entered near-real-time operations in January 2026 and V1.1 ended in February 2026. The 1 km V2 is a 1999–2020 archive.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: cgls-lai
name: "CLMS LAI/FAPAR/FCOVER"
full_name: Copernicus Land Monitoring Service global vegetation biophysical variables LAI, FAPAR and FCover (300 m V2.0 / 1 km V2, 10-daily) — formerly Copernicus Global Land Service (CGLS) products
category: satellite
domain: land
group: 식생
order: 20
domains: [육지, 원격탐사]
provider: EU Copernicus Land Monitoring Service (CLMS; global component managed by the JRC) / produced by VITO / distributed via the Copernicus Data Space Ecosystem (CDSE)

status: active
status_note: >-
  The 300 m Version 2.0 (file version V2.0.1) entered near-real-time (NRT) operations in the second dekad of January 2026, and the historical record from 2014 was reprocessed and released with the same version.
  The previous V1.1 (Sentinel-3) was produced only until the end of February 2026 and has been fully replaced by V2.0 since March (on 2026-10-13 the latest CDSE file was the RT0 for the 2026-10-10 dekad).
  The former 'Copernicus Global Land Service' brand and the VITO distribution portal have been folded into the CLMS website and CDSE, so update download scripts. The 1 km V2 (SPOT-VGT, PROBA-V) is an archive that ended in June 2020.

period:
  start: "1999-01"
  end: present
  note: >-
    The 300 m V2.0 runs from January 2014 to the present, using PROBA-V for 2014–2018 and Sentinel-3 OLCI from January 2019 (in CDSE file names the last PROBAV product is 2018-12-31 and the first OLCI product is 2019-01-10).
    The 1 km V2 (SPOT-VGT, then PROBA-V) is an archive from January 1999 to June 2020; the earlier 300 m V1 series (V1.0 PROBA-V 2014-01 to 2020-06, V1.1 Sentinel-3 2020-07 to 2026-02) also remain on CDSE.
    On 2026-10-13 the newest V2.0 file on CDSE was the RT0 for the nominal date 2026-10-10.

resolution:
  spatial_short: "0.3 km (0.003°)"
  temporal_short: "10일"
  spatial: >-
    300 m products: 1/336° regular latitude–longitude grid (WGS84, EPSG:4326, pixel size 0.0029761905°, referenced to pixel centres), 80°N–60°S (only 75°N–60°S is valid in the PROBA-V period) /
    1 km products: 1/112° regular latitude–longitude grid
  vertical: Vegetation canopy (single layer)
  temporal: >-
    10-daily (dekads) with nominal dates on the 10th, 20th and last day of each month. Each nominal date is issued as RT0 (near real time), then updated as RT1 and RT2 (one and two dekads later) and RT6 (final, six dekads later)

update: "Every dekad — RT0 within about 2 days after the end of the synthesis period; RT1, RT2 and RT6 after 1, 2 and 6 dekads (no updates for the 1 km V2)"
license: "Full, open and free access under the Copernicus data policy (credit the source, state any modifications, do not imply EU endorsement). Downloading from CDSE requires a free account"
account_required: true

summary: >-
  Global vegetation variables from the EU Copernicus Land Monitoring Service (CLMS): leaf area index (LAI), fraction of absorbed photosynthetically active radiation (FAPAR)
  and fraction of green vegetation cover (FCover), every 10 days. Neural networks trained per vegetation type turn satellite surface reflectances into instantaneous estimates,
  which are then fitted in time and gap-filled to give dekadal values. The flagship is the 300 m V2.0, which joins PROBA-V (2014–2018) and Sentinel-3 OLCI (2019 onwards) in a single version;
  the 1999–2020 period is covered by the 1 km V2 (GEOV2) record. These products used to be distributed by VITO under the 'Copernicus Global Land Service (CGLS)' name and are now obtained from the CLMS website and CDSE.

time_convention:
  summary: >-
    Each value is an estimate for the dekad's nominal date (the 10th, 20th or last day of the month, as in the file name). For most vegetation a first- or second-degree polynomial
    is fitted to the instantaneous estimates in a window around the nominal date (60 days before, 0–60 days after) and evaluated on that date; for evergreen broadleaf forest (EBF)
    the mean of the 10 closest instantaneous estimates is used. The value is therefore neither a dekadal mean nor a maximum value composite.
  points:
    - "In c_gls_LAI300-RT6_202407310000_GLOBE_OLCI_V2.0.1 the date (2024-07-31) is the nominal date; the CDSE ContentDate (2024-07-21 to 31) is the dekad it belongs to."
    - "RT0 uses past observations only (zero-day forward window) and is least stable at the end of the series; RT1 and RT2 add 10 and 20 days of later observations, and RT6 adds up to 60 days and is final. The reprocessed historical period has RT6 only."
    - "In the V2.0 historical release, RT6 starts in January 2014, while the RT2, RT1 and RT0 series start on 2025-08-20, 2025-08-31 and 2025-09-10."
    - "LENGTH_BEFORE and LENGTH_AFTER give the actual window lengths (days) and NOBS the number of valid instantaneous observations in that window, which shows how much gap filling was involved."
    - "FAPAR is defined as black-sky FAPAR for the sun position around 10:15 (between 10:00 and 10:30), taken as an approximation of the daily integrated value. Sentinel-3 crosses the equator at 10:00; PROBA-V had drifted to about 09:30 by the end of its mission."
  source: https://land.copernicus.eu/en/technical-library/product-user-manual-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
  source_name: "CLMS Product User Manual — LAI, FAPAR, FCover 300 m Version 2.0 (CGLOPS1_PUM_LAI300m-V2.0, I1.20, 2026-07-16)"

variables:
  note: >-
    netCDF4 (CF-1.6) layers from the 300 m V2.0 Product User Manual (PUM). LAI, FAPAR and FCover come in separate files (LAI300, FAPAR300, FCOVER300) carrying the same auxiliary layers.
    Everything is stored as 8-bit integers: physical value = stored value × scale_factor (LAI 1/30, FAPAR and FCover 1/250, others 1), with 255 as missing. Water pixels are not processed and are set to 255.
    The CDSE STAC metadata list the same layers in lower case (lai, rmse, ...), so check the names in an actual file.
  full_list: https://land.copernicus.eu/en/technical-library/product-user-manual-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
  groups:
    - name: 300 m V2.0 vegetation variables (estimates for the nominal date)
      kind: instant
      items:
        - text: "Leaf area index (green LAI) — `LAI` (m2 m-2, 0–7)"
          note: "Half the green leaf area per unit ground area, understorey included. Stored value × 1/30"
        - text: "Fraction of absorbed photosynthetically active radiation — `FAPAR` (0–0.94)"
          note: "Black-sky FAPAR at about 10:15. Stored value × 1/250"
        - text: "Fraction of green vegetation cover — `FCOVER` (0–1)"
          note: "Fraction of ground covered by green vegetation seen from nadir. Stored value × 1/250"
    - name: 300 m V2.0 auxiliary layers
      kind: instant
      items:
        - "Estimated uncertainty (RMSE) — `RMSE` (units of the variable)"
        - text: "Number of valid instantaneous observations — `NOBS` (count, 0–60)"
          kind: accum
          note: Counted within the fitting window (LENGTH_BEFORE to LENGTH_AFTER)
        - "Length of the window before the nominal date — `LENGTH_BEFORE` (days, 0–210)"
        - "Length of the window after the nominal date — `LENGTH_AFTER` (days, 0–60)"
        - text: "Quality flag — `QFLAG` (bit field)"
          note: "Bit 1 land/water, bit 2 non-EBF/EBF, bits 6–7 fitting method (2nd-degree or linear fit, interpolation within 15 days, nearest value within 5 days or missing)"
    - name: 1 km V2 (1999-01 to 2020-06, archive)
      kind: instant
      items:
        - text: "Leaf area index — `LAI` (m2 m-2, 0–7)"
          note: "Matching FAPAR and FCOVER files exist separately. Stored value × 1/30"
        - "LAI uncertainty — `RMSE` (m2 m-2)"
        - text: "Number of valid observations — `NOBS` (count, 0–120)"
          kind: accum
        - "Window length before and after the nominal date — `LENGTH_BEFORE`, `LENGTH_AFTER` (days, 5–60)"
        - "Quality flag — `QFLAG` (16-bit)"

