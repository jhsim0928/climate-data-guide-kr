transitions:
  - from: CLMS LAI, FAPAR, FCover 300 m V1 (V1.0 PROBA-V / V1.1 Sentinel-3)
    to: CLMS LAI, FAPAR, FCover 300 m V2.0
    status: completed
    date: "2026-03"
    summary: >-
      V2.0 rebuilds the separate V1.0 (PROBA-V) and V1.1 (Sentinel-3) records as one version. The Sentinel-3 period uses the same neural networks, so values barely change,
      but the PROBA-V period (2014–2018) uses new input reflectances and FCover and, to a lesser extent, FAPAR were adjusted. NRT operations began in January 2026 and V1.1 ended at the end of February 2026.
    changes:
      - aspect: Period and sensors
        before: "V1.0 PROBA-V 2014-01 to 2020-06 and V1.1 Sentinel-3 OLCI 2020-07 to 2026-02 (two records of different versions joined)"
        after: "Single V2.0 — PROBA-V 2014-01 to 2018-12 + Sentinel-3A/3B OLCI 2019-01 to present"
      - aspect: Input reflectance
        before: "V1.0 top-of-atmosphere (TOA) reflectance, PROBA-V Collection 1, SMAC atmospheric correction inside the retrieval / V1.1 OLCI top-of-canopy (TOC) v1.0 (to 2022-06-30), then v1.1"
        after: "Top-of-canopy (TOC) reflectance — PROBA-V Collection 2 and OLCI TOC v2.3; no water vapour, ozone or pressure inputs needed"
      - aspect: Algorithm
        before: "V1.0 vegetation classes from GLOBCOVER; V1.1 retrained neural networks"
        after: "Sentinel-3 period uses the same networks and parameters as V1.1 (marginal differences, better identification of EBF pixels); CCI-LC land cover"
      - aspect: NRT latency
        before: "RT0 within 5 days after the end of the synthesis period"
        after: "RT0 within 2 days (48 hours) after the end of the synthesis period, then RT1, RT2 and RT6 updates"
      - aspect: Files and identifiers
        before: "c_gls_LAI300-RT6_..._GLOBE_OLCI_V1.1.x_nc / datasetIdentifier lai_global_300m_10daily_v1 / DOI 10.2909/219fdc9f-616b-444b-a495-198f527b4722"
        after: "c_gls_LAI300-RT6_..._GLOBE_OLCI_V2.0.1_nc (_PROBAV_ in the PROBA-V period) / lai_global_300m_10daily_v2 / DOI 10.2909/a696fab4-c3dc-4dcc-b1d8-6fcd9a2ce1eb"
      - aspect: Known limitations
        before: "Discontinuity between the PROBA-V (V1.0) and Sentinel-3 (V1.1) versions"
        after: "One version, but the validation report still finds a level shift and lower inter-annual precision across the PROBA-V to OLCI transition (2018–2019)"
    impacts:
      - Do not mix climatologies or trends computed from V1 with V2.0 results; re-download the full record from 2014 as V2.0.
      - Change datasetIdentifier and file-name patterns in scripts from _v1 and V1.1 to _v2 and V2.0. V1 remains on CDSE as an archive.
      - Cite the V2.0 DOI in papers and state whether only RT6 was used.
    sources:
      - name: Version 2.0 of LAI, FAPAR and FCover 300 m in NRT operations (CLMS, 2026-01-16)
        url: https://land.copernicus.eu/en/production-updates/version-2-0-of-lai-fapar-and-fcover-300-m-in-nrt-operations
      - name: CLMS PUM LAI, FAPAR, FCover 300 m V2.0 (I1.20, 2026-07-16)
        url: https://land.copernicus.eu/en/technical-library/product-user-manual-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
      - name: CLMS Validation Report LAI, FAPAR, FCover 300 m V2.0 (2026-03-09)
        url: https://land.copernicus.eu/en/technical-library/validation-report-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
  - from: CLMS LAI, FAPAR, FCover 1 km V2 (GEOV2, SPOT-VGT and PROBA-V)
    to: CLMS LAI, FAPAR, FCover 300 m series
    status: completed
    date: "2020-06"
    summary: >-
      The 1 km V2 record, running since 1999, stopped when the PROBA-V mission ended in June 2020 and is now an archive. Only the 300 m series (currently V2.0) is updated since then.
      The two series differ in resolution, inputs and compositing windows and cannot be joined as one time series.
    changes:
      - aspect: Period
        before: "1999-01 to 2020-06 (no updates)"
        after: "2014-01 to present"
      - aspect: Grid
        before: "1/112° regular latitude–longitude"
        after: "1/336° regular latitude–longitude, 80°N–60°S"
      - aspect: Sensors
        before: "SPOT/VEGETATION (1999–2014), then PROBA-V (to 2020-06)"
        after: "PROBA-V (2014–2018), then Sentinel-3 OLCI (2019 onwards)"
      - aspect: Auxiliary layer ranges
        before: "NOBS 0–120, LENGTH_BEFORE/AFTER 5–60 days, 16-bit QFLAG"
        after: "NOBS 0–60, LENGTH_BEFORE 0–210 days (EBF), LENGTH_AFTER 0–60 days, 8-bit QFLAG"
    impacts:
      - To combine the 1 km V2 and 300 m V2.0 for analyses starting in 1999, first assess their differences over the 2014–2020 overlap.
      - The 1 km V2 will not be corrected any more, so any known issues remain.
    sources:
