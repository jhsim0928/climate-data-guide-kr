  - name: CLMS product page — LAI 300 m V2.0
    url: https://land.copernicus.eu/en/products/vegetation/leaf-area-index-v2-0-300m
    method: Product description, DOI and access routes; CLMS Data viewer
    note: "FAPAR (fraction-of-absorbed-photosynthetically-active-radiation-v2-0-300m) and FCover (fraction-of-green-vegetation-cover-v2-0-300m) have their own pages. CDSE download options are recommended for large volumes."
  - name: Copernicus Data Space Ecosystem — OData, S3, STAC
    url: https://documentation.dataspace.copernicus.eu/Data/CopernicusServices/CLMS.html
    method: OData API / S3 (EODATA) / STAC / Copernicus Browser (free CDSE account)
    note: >-
      The OData datasetIdentifier values are lai_global_300m_10daily_v2, fapar_global_300m_10daily_v2 and fcover_global_300m_10daily_v2 (and lai_global_1km_10daily_v2 etc. for 1 km);
      the S3 path is /eodata/CLMS/bio-geophysical/vegetation_properties/lai_global_300m_10daily_v2/YYYY/MM/DD/. Both netCDF (_nc) and COG (_cog) products are available.
  - name: CDSE openEO / Sentinel Hub
    url: https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/clms/bio-geophysical-parameters/vegetation/vegetation-properties/fapar_global_300m_10daily_v2.html
    method: openEO (CLMS_LAI_GLOBAL_300M_10DAILY_V2 etc.) / Sentinel Hub BYOC collections (separate RT0, RT1, RT2, RT6)
    note: Each global file is several GB, so these are handy for cutting out an area of interest. CDSE openEO applies scale and offset automatically.
  - name: WEkEO (unified CLMS dataset)
    url: https://help.wekeo.eu/en/articles/12397018-new-unified-clms-dataset-available
    method: HDA API / web viewer
    note: WEkEO says it serves CLMS data moved to CDSE through a unified dataset (EO:JRC:DAT:CLMS), but the help article checked on 2026-10-13 does not name LAI, FAPAR or FCover. CDSE is the primary distribution point.

example:
  lang: python
  note: >-
    Finds and downloads the final (RT6, netCDF) LAI 300 m V2.0 product for the last dekad of July 2024 through the CDSE OData API. Put a free CDSE account in the CDSE_USERNAME and CDSE_PASSWORD environment variables.
    One global netCDF is about 2.8 GB, so for a small area the COG (_cog) products or openEO are better choices.
  code: |
    import os
    import requests
    import xarray as xr

    token = requests.post(
        "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token",
        data={"client_id": "cdse-public", "grant_type": "password",
              "username": os.environ["CDSE_USERNAME"], "password": os.environ["CDSE_PASSWORD"]},
    ).json()["access_token"]

    odata = "https://catalogue.dataspace.copernicus.eu/odata/v1"
    flt = ("Collection/Name eq 'CLMS' and "
           "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'datasetIdentifier' and "
           "att/OData.CSC.StringAttribute/Value eq 'lai_global_300m_10daily_v2') and "
           "contains(Name,'RT6_20240731') and endswith(Name,'_nc')")
    prod = requests.get(f"{odata}/Products", params={"$filter": flt}).json()["value"][0]
    name = prod["Name"]                       # c_gls_LAI300-RT6_202407310000_GLOBE_OLCI_V2.0.1_nc
    ncfile = name[:-3] + ".nc"                # actual file inside the product folder

    s = requests.Session()
    s.headers["Authorization"] = f"Bearer {token}"
    url = f"{odata}/Products({prod['Id']})/Nodes({name})/Nodes({ncfile})/$value"
    r = s.get(url, allow_redirects=False)
    while r.status_code in (301, 302, 303, 307):   # keep the auth header across the redirect to the download server
        url = r.headers["Location"]
        r = s.get(url, allow_redirects=False)
    with s.get(url, stream=True) as resp, open(ncfile, "wb") as f:
        for chunk in resp.iter_content(1 << 20):
            f.write(chunk)

    ds = xr.open_dataset(ncfile)              # xarray applies scale_factor and the 255 fill value
    lai = ds["LAI"].sel(lat=slice(39, 33), lon=slice(124, 132))   # latitude runs north to south
    print(float(lai.mean()))

tips:
  - "RT0, RT1, RT2 and RT6 give different values for the same nominal date. Use RT6 only for research time series and say so if the last few dekads were filled with RT0–RT2. RT0 is known to show spatial noise such as stripes and unrealistically high values."
  - "Do not mix V1 (V1.0, V1.1) with V2.0 in one time series. The 2014–2018 PROBA-V values in particular changed in V2.0, so re-download the whole record as V2.0."
  - "V2.0 still shows a moderate level shift (OLCI slightly higher) across the PROBA-V to Sentinel-3 OLCI transition in 2018–2019. Check this boundary when computing trends from 2014."
  - "Multiply LAI by 1/30 and FAPAR or FCover by 1/250 to get physical values. xarray does this automatically, but reading the COGs with GDAL or rasterio returns the stored values (0–250). 255 means missing or water."
  - "Nominal dates fall on the 10th, 20th and last day, so the third dekad is 8–11 days long. Consider weighting by dekad length rather than taking a plain mean when building monthly values."
  - "Unrealistic values can occur over wetlands and near water, and evergreen broadleaf forest (QFLAG bit 2) uses a simplified treatment (mean of 10 instantaneous values, or the previous dekad when too few are available)."
  - "The C3S Climate Data Store dataset 'satellite-lai-fapar' has a similar name but is a different line (produced for C3S, with effective LAI from V2 onwards). Cite the exact product name and DOI you used."

