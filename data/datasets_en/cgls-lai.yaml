notices:
  - date: "2026-06-17"
    level: info
    title: VITO Terrascope openEO retires its CGLS collections by end of August 2026 — move to CDSE openEO
    body: >-
      VITO announced that the 16 Global Land collections on Terrascope openEO, including CGLS_LAI300_V1_GLOBAL, will be phased out by the end of August 2026.
      Their replacements are CDSE openEO collections such as CLMS_LAI_GLOBAL_300M_10DAILY_V2 (the 300 m products move from V1 to V2); the connection URL and authentication (CDSE account) change, and scale and offset are applied automatically.
    source: https://terrascope.be/en/news-events/phase-out-copernicus-global-land-service-collections-terrascope-openeo
  - date: "2026-01-16"
    level: warning
    title: LAI, FAPAR, FCover 300 m V2.0 in NRT operations — V1.1 ends at the end of February 2026
    body: >-
      V2.0 entered near-real-time operations in the second dekad of January 2026, together with the historical V2.0 record from 2014.
      V1.1 continued with degraded timeliness only until the end of February 2026, and V2.0 permanently replaces it from March.
    source: https://land.copernicus.eu/en/production-updates/version-2-0-of-lai-fapar-and-fcover-300-m-in-nrt-operations
  - date: "2025-05-21"
    level: warning
    title: Global CLMS data moved to CDSE — former Global Land access routes change
    body: >-
      The global datasets of the former Global Land component have been migrated to the Copernicus Data Space Ecosystem (CDSE), which is now the central access point.
      On its former Global Land page CLMS said the alternative access modes for global data would be fully migrated to CDSE as of 1 September 2025, so update scripts that used the VITO routes (OpenSearch, manifests).
    source: https://land.copernicus.eu/en/news/global-data-now-available-on-the-copernicus-data-space-ecosystem
  - date: "2025-03-31"
    level: info
    title: 300 m V1.1 file version rolled back from 1.1.2 to 1.1.1 (from the first dekad of April 2025)
    body: >-
      To align with dissemination through CDSE, the V1.1 run number was reset to 1, so files from the first dekad of April 2025 (released on 12 April) are labelled V1.1.1 instead of V1.1.2.
      The algorithm and processing chain are unchanged and the two labels are fully compatible.
    source: https://land.copernicus.eu/en/production-updates/lai-fapar-fcover-300-m-version-1-1-roll-back-product-version-number

