notices:
  - date: "2025-05-31"
    level: warning
    title: v2.0 tech note posted — corrections across all nine variables
    body: >-
      A v2 tech note describes "the updates applied to the various v1.x GDDP variables to create the v2 output" (date is the document's "Latest update").
      Changes include an upper bound of 105% for hurs; a lower bound of 0.0 for huss, rlds and sfcWind; adjustment of anomalously large pr and rsds values in
      cells with very small daily climatology; full reprocessing of tasmax and tasmin with the adjusted GMFD (values swapped where tx<tn); and new tas files.
      The document does not say where v2 files are hosted or how they are suffixed.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2025/06/NEX-GDDP-CMIP6-v2-Tech_Note.pdf
  - date: "2024-02-01"
    level: warning
    title: pr reprocessed (v1.1); tasmin and tas fully reprocessed (v1.2)
    body: >-
      pr was reprocessed to fix an overcorrection in climatologically dry areas and added as "_v1.1.nc" files. The August 2023 tasmin fix for SSP1-2.6
      and SSP3-7.0 had not been applied to enough grid cells, so those tasmin fields and tas were reprocessed in full and released as "_v1.2.nc" files.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf
  - date: "2023-08-27"
    level: warning
    title: Fixes for tasmin (SSP1-2.6, SSP3-7.0), TaiESM1 and hurs added (v1.1)
    body: >-
      tasmin for SSP1-2.6 and SSP3-7.0, which had incorrect values in a limited number of grid cells primarily along coasts, was reprocessed; TaiESM1
      historical tasmax and tasmin were replaced after their CMIP6 retraction and tas, tasmax and tasmin reprocessed; and hurs was reprocessed with a more
      realistic upper bound. Fixed files carry "_v1.1.nc", and all version 1.0 files remain in the archive.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf
  - date: "2022-09-20"
    level: info
    title: Licence changed to CC0; AWS copy available
    body: >-
      Following the CMIP6 licence update, as of September 2022 all NEX-GDDP-CMIP6 outputs are made available under a blanket CC0 licence instead of
      CC BY-SA 4.0 (citation guidance still applies). A cache copy of the data is also available on AWS (s3://nex-gddp-cmip6/) as of September 2022.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf
  - date: "2022-03-18"
    level: info
    title: SSP1-2.6 and SSP3-7.0 added
    body: Revision 2 of the tech note reflects the addition of the SSP1-2.6 and SSP3-7.0 scenarios.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf

