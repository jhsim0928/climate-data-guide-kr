# ─────────────────────────────────────────────────────────────
# CHIRPS — dataset information file (English edition)
# Satellite tab (precipitation). UCSB Climate Hazards Center's blend of IR satellite estimates and station data. v3.0 is current; v2.0 production ends after December 2026.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: chirps
name: "CHIRPS"
full_name: Climate Hazards Center Infrared Precipitation with Stations, Version 3
category: analysis
domain: satellite
group: 강수
order: 40
also_in:
  - domain: atmosphere
    group: 강수 자료
domains: [대기, 육지, 수문]
provider: UC Santa Barbara Climate Hazards Center (CHC), in partnership with USGS and USAID FEWS NET (distributed via the CHC data repository, Google Earth Engine and USGS EWX)

status: active
status_note: >-
  CHIRPS v3.0 is the current version, with the preliminary product (Prelim) updated every pentad and the final product (Final) every month. CHC states that v3.0 replaces v2.0,
  and that v2.0, kept running through 2026 to support the transition, will end production after December 2026. When checked on 2026-10-13, the v3 daily collections in Google Earth Engine ran through 2026-08-31.

period:
  start: "1981-01"
  end: present
  note: >-
    v3 Final runs from 1981-01 to the present and v3 Prelim from 2025-01. Among the daily products, the IMERG-based (sat) archive starts in 2001 and the ERA5-based (rnl) archive in 1981, according to the Sci Data paper.
    v2.0 also starts in 1981; when checked on 2026-10-13 the v2 daily collection in Earth Engine ran through 2026-08-31.

resolution:
  spatial_short: "6 km (0.05°)"
  temporal_short: "1일"
  spatial: >-
    0.05° latitude–longitude grid. The v3 global domain covers 60°N–60°S at all longitudes (7200×2400), with separate Africa (1500×1600) and Latin America (1720×1900) domains.
    Station data are blended over land only. v2.0 covers 50°S–50°N.
  vertical: Surface precipitation (single level)
  temporal: >-
    Pentads (5-day) and months are the base products; dekads (10-day), 2–6-month and annual totals and daily data are derived from them. Daily values split pentad totals using daily ratios from ERA5 (rnl) or IMERG Late V07 (sat).

coverage:
  short: 준전지구
  note: "v3 60°N–60°S, v2.0 50°S–50°N; land only"
update: "Prelim 2 days after each pentad ends (the 2nd, 7th, 12th, 17th, 22nd and 27th of each month) / Final monthly (typically in the third week of the following month)"
license: CC BY 4.0 (CHC states that it has waived copyright to the extent possible under law). Free, no account needed
account_required: false

summary: >-
  CHIRPS is a 0.05° quasi-global precipitation dataset that calibrates satellite precipitation estimated from geostationary IR cold cloud duration (CHIRP) to a high-resolution climatology (CHPclim)
  and blends in station precipitation from many sources. Developed with USGS and FEWS NET for drought monitoring and seasonal rainfall trend analysis in data-sparse developing regions, it runs from 1981.
  v3.0 uses nearly four times as many gauge sources as v2, introduces gauge-undercatch correction, a new climatology (CHPclim v2) and a new IR algorithm (CHIRP3), and extends coverage to 60°.

time_convention:
  summary: >-
    All values are accumulations over their period (daily mm/day, pentad mm/pentad, monthly mm/month). CHIRPS is fundamentally a pentad and monthly product: each month has six pentads,
    covering days 1–5, 6–10, 11–15, 16–20, 21–25 and the 26th to the end of the month (so the last pentad varies in length). Daily values are pentad totals split by another product's daily ratios,
    and CHC explains that the date of a daily value "should be interpreted as a consistent date label assigned during the disaggregation process", not a uniform observation window (such as 00–24 UTC).
  points:
    - "A pentad is not always five days (the 26th to month end spans 3–6 days). Divide by the actual number of days when converting pentad totals to daily means."
    - "Daily rnl (split with ERA5) and sat (split with IMERG Late V07) divide the same pentad totals with different daily distributions. Use only one of them within a study."
    - "Daily values are regenerated in batches at each pentad update and are not independent daily observations. Be careful with analyses that depend on daily extremes or exact dates."
    - "Prelim uses only the stations that arrive quickly, 2 days after the pentad ends; Final is rebuilt with more stations around the third week of the following month. The two give different values for the same period."
    - "ERA5 arrives about 5 days late, so Prelim daily data exist only in the IMERG-based (sat) version."
  source: https://www.chc.ucsb.edu/data/chirps3
  source_name: "CHC CHIRPS v3 page + Funk et al. (2026) Scientific Data + CHIRPS FAQ (pentad definition)"

variables:
  note: >-
    Precipitation is the only published variable, distributed as GeoTIFF, NetCDF, BIL and COG. The names below are Google Earth Engine band names; the variable name inside CHC NetCDF files could not be confirmed from official documents.
    Missing or erroneous values are -9999 (including missing IR data from 2023 onward).
  full_list: https://www.chc.ucsb.edu/data/chirps3
  groups:
    - name: Pentad and monthly (base products)
      kind: accum
      period: Pentad (5-day) and monthly
      items:
        - text: "Precipitation — `precipitation` (mm/pentad, mm/month)"
          note: "Earth Engine UCSB-CHC/CHIRPS/V3/PENTAD. Dekad, 2–6-month and annual totals follow the same convention"
    - name: Daily (rnl and sat)
      kind: accum
      period: Daily
      items:
        - text: "Daily precipitation — `precipitation` (mm/d)"
          note: "Earth Engine UCSB-CHC/CHIRPS/V3/DAILY_RNL (split with ERA5) and DAILY_SAT (split with IMERG Late V07). Dates are labels assigned during disaggregation"
    - name: Diagnostics
      kind: static
      items:
        - text: "Legates-Willmott gauge-undercatch correction factor grids"
          note: "Monthly correction-factor maps, in the CHC diagnostics/legates-willmott_corrections folder and in EWX. The CHC diagnostics page does not give the file format or variable name"
        - text: "Locations where missing IR data were filled with ERA5 (fill maps)"
          kind: instant
          note: "Marks where 1981–2022 IR gaps were filled with ERA5. GeoTIFF masks (no variable name) for several periodicities, also viewable in EWX as the 'Fill Map' layer under 'CHIRP v3.0'. diagnostics/fillmaps folder"

access:
  - name: CHC data repository (CHIRPS v3.0)
    url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/
    method: HTTPS download (no account)
    note: >-
      Folders for pentads, dekads, daily, monthly and multi-month aggregates, split into Africa, Latin America and global domains. The daily product is described in daily/readme.txt and station sources are listed in README-CHIRPSv3.0.txt.
  - name: Google Earth Engine
    url: https://developers.google.com/earth-engine/datasets/catalog/UCSB-CHC_CHIRPS_V3_PENTAD
    method: Cloud analysis (UCSB-CHC/CHIRPS/V3/PENTAD, DAILY_RNL, DAILY_SAT)
    note: v2 is UCSB-CHG/CHIRPS/DAILY and PENTAD. When checked on 2026-10-13, v3 pentads ran through 2026-08-26 and v3 daily data through 2026-08-31.
  - name: USGS and CHC Early Warning Explorer (EWX)
    url: https://ewx3.chc.ucsb.edu/ewx/index.html
    method: Web maps and time series
  - name: CHC data repository (CHIRPS v2.0, through 2026)
    url: https://data.chc.ucsb.edu/products/CHIRPS-2.0/
    method: HTTPS download
    note: The 50°S–50°N version. Production ends after December 2026, so start new work with v3.

example:
  lang: python
  note: >-
    Uses the Google Earth Engine Python API to compute the July 2023 precipitation total over the Korean Peninsula from CHIRPS v3 daily data (IMERG-split version). An Earth Engine account and
    a cloud project are required; run ee.Authenticate() the first time. Replace the project name with your own.
  code: |
    import ee

    ee.Initialize(project="my-gee-project")   # your cloud project name

    col = (ee.ImageCollection("UCSB-CHC/CHIRPS/V3/DAILY_SAT")   # ERA5-split version: DAILY_RNL
           .filterDate("2023-07-01", "2023-08-01")
           .select("precipitation"))                            # mm/d
    total = col.sum()                                           # July total (mm)

    korea = ee.Geometry.Rectangle([124, 33, 132, 39])
    stat = total.reduceRegion(ee.Reducer.mean(), korea, scale=5566)
    print(stat.getInfo())   # values over the sea are satellite-only estimates without stations

tips:
  - "Because of the gauge-undercatch correction (Legates-Willmott), v3 is modestly wetter than v2 in most areas. Do not splice v2 and v3 into one series, and when comparing with stations, use gauge-corrected station data as CHC recommends."
  - "CHIRPS is fundamentally a pentad and monthly product. Daily values borrow ERA5 or IMERG daily distributions to split pentads, which limits daily extremes and wet-day statistics."
  - "IR gaps in 1981–2022 were filled with ERA5 precipitation (about 20% of land in the 1980s), while missing IR from 2023 onward is left as -9999. Check the fill maps to see where filling occurred."
  - "The paper reports ERA5-related biases of up to about 30% in Central Africa and Central Asia, making decadal variations and trends there uncertain. Station networks are also declining over time in all archives."
  - "Station data are blended over land only. Ocean values are satellite-only estimates and are not suitable for ocean precipitation studies."
  - "Being based on IR cold cloud duration, it may handle orographic rain, warm-cloud rain and winter snowfall poorly. Where networks are dense, as in Korea, compare first with KMA gridded analyses."
  - "Mixing Prelim and Final means recent months will change later. Use Final in papers, and say so if you used Prelim."

