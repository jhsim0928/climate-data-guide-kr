transitions:
  - from: CHIRPS v2.0
    to: CHIRPS v3.0
    status: completed
    date: "2025-01"
    summary: >-
      v3.0 was released in January 2025 and replaces v2.0. The IR algorithm, climatology, station count, gauge correction and spatial coverage all changed; v2.0 continues in parallel only through the end of 2026.
    changes:
      - aspect: Spatial coverage
        before: "50°S–50°N"
        after: "60°S–60°N (plus separate Africa and Latin America domains)"
      - aspect: Satellite estimation algorithm
        before: "CHIRP2 — IR regression with an intercept term that absorbed variance"
        after: "CHIRP3 — variance-preserving: cold cloud duration (hours below 235 K) times a climatology-based slope; GridSat-B1 for 1981–2000; IR gaps filled with ERA5"
      - aspect: Climatology
        before: "CHPclim v1"
        after: "CHPclim v2 (1991–2020, using IMERG v6 Final and undercatch-corrected station normals)"
      - aspect: Stations
        before: "About 11,500 stations from 12 sources (2019); about 7,000 for Prelim (GTS and Mexico)"
        after: "About 21,500 stations from 29 sources (Final, late 2024); about 12,000 for Prelim"
      - aspect: Gauge-undercatch correction
        before: "None"
        after: "Legates-Willmott correction applied — modestly wetter in most areas"
      - aspect: Daily data
        before: "Daily product (global, and 0.25° for Africa)"
        after: "Two versions splitting pentad totals by daily ratios from ERA5 (rnl, from 1981) or IMERG Late V07 (sat, including Prelim)"
      - aspect: Production status
        before: "Produced in parallel through 2026; ends after December 2026"
        after: "Current version — Prelim every pentad, Final every month"
    impacts:
      - Do not splice v2 and v3 into one series; download the whole period again as v3. Because v3 is generally wetter, recompute climatologies and trends.
      - The 50°–60° latitude bands are new in v3, so results there cannot be compared with v2.
      - Earth Engine collection IDs change (UCSB-CHG/CHIRPS/DAILY → UCSB-CHC/CHIRPS/V3/DAILY_RNL or DAILY_SAT).
    sources:
      - name: CHC CHIRPS v3 page
        url: https://www.chc.ucsb.edu/data/chirps3
      - name: Funk et al. (2026), Scientific Data
        url: https://doi.org/10.1038/s41597-026-07096-4
      - name: CHC CHIRPS v2 page (end of v2 production)
        url: https://www.chc.ucsb.edu/data/chirps

notices:
  - date: "2026-09-20"
    level: warning
    title: "Production of CHIRPS v2.0 will end after December 2026 — move to v3"
    body: >-
      CHC states that "production of CHIRPS v2 will end after December 2026" and encourages users to transition to CHIRPS v3 to ensure continuity of operations. If monitoring or forecasting systems run on v2,
      switch to the v3 paths and Earth Engine IDs before 2027. The banner on the CHIRPS v2 page carries no posting date, so the date used here is when CHC added its v2 production-change note (parallel production through 2026) to the CHIRPS FAQ (2026-09-20, per the wiki revision history).
    source: https://www.chc.ucsb.edu/data/chirps
  - date: "2026-06-10"
    level: info
    title: "CHC's CHIRPS3 dataset now available for all — Scientific Data paper published"
    body: >-
      CHC announced that the CHIRPS3 dataset is "now available for all". The improvements are described in the data descriptor published in Scientific Data on 11 April 2026 (Funk et al., 2026).
    source: https://www.chc.ucsb.edu/news/announcement/534
  - date: "2025-01"
    level: info
    title: "CHIRPS v3 publicly available — v2 produced in parallel through 2026"
    body: >-
      According to the CHIRPS FAQ, CHIRPS v3 has been publicly available since January 2025, and v2 production continues in parallel through 2026 to support the transition. The v3 data DOI (10.15780/G2JQ0P) was also registered in January 2025.
    source: https://wiki.chc.ucsb.edu/CHIRPS_FAQ

