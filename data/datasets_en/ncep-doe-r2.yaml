    level: warning
    title: "NWS SCN 26-12 — Upgrading CDAS to CORe effective March 9, 2026; CDAS data files, including the cdas2 paths, no longer available"
    body: >-
      The notice states that "the data files for CDAS will no longer be available as of March 9, 2026", listing the NOMADS and FTP /com/cdas2/ directories.
      It does not mention R2 by name, but the R2 data at PSL and NCAR stop just before then, on 28 February 2026 (checked 2026-10-11).
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf

