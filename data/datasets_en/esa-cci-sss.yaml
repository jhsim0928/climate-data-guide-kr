    level: info
    title: CEDA v5.5 downloads restored
    body: >-
      CEDA made the SSS CCI v5.5 datasets (global and polar, weekly and monthly) temporarily unavailable for download from 2025-11-20 and announced on each record that online access was restored on 2025-11-30.
    source: https://catalogue.ceda.ac.uk/uuid/4321d9b540fe48f8943179aa3ef06c79/
  - date: "2025-03-03"
    level: info
    title: SSS CCI v5.5 released (2010–2023)
    body: >-
      Version 5.5, one year longer than v4.41, was published at CEDA (individual datasets on 2025-02-24, collection DOI on 2025-03-03). SMOS L2 salinity was reprocessed with a new dielectric constant model,
      SMAP v5.3 is used, SMOS RFI mitigation was extended globally and absolute calibration north of 65°N was improved. ESA states that the 2010 underestimation and the April–August issue linked to SMAP v5.0 were resolved.
    source: https://climate.esa.int/en/news-events/Sea-Surface-Salinity-Record-Extended/
  - date: "2024-03-20"
    level: info
    title: SSS CCI v4.41 released (2010–2022)
    body: >-
      Version 4.41 extended the record by two years and improved seasonal bias correction, high-latitude stability and polar coverage (published at CEDA on 2024-02-16).
      Weekly and monthly products are provided on a 0.25° global grid and on 25 km polar EASE grids.
    source: https://climate.esa.int/en/news-events/new-sea-surface-salinity-record-released/
  - date: "2021-10-08"
    level: info
    title: SSS CCI v3.21 released (2010–2020)
    body: Weekly and monthly v3.21 salinity products were published at CEDA. They were later superseded by v04.41 (2024-02-16).
    source: https://catalogue.ceda.ac.uk/uuid/5920a2c77e3c45339477acd31ce62c3c

transitions:
  - from: SSS CCI v4.41
    to: SSS CCI v5.5
    status: completed
    date: "2025-02"
    summary: >-
      Extends the record by one year to 2023 and brings in reprocessed SMOS data (new dielectric model), a newer SMAP input version and global RFI mitigation.
      The 2010 underestimation and the April–August 2015 salty error in the North Atlantic found in v4.41 were fixed, and the Northern Hemisphere seasonal bias was reduced.
    changes:
      - aspect: Period
        before: "2010-01 to 2022 (published at CEDA 2024-02-16)"
        after: "2010-01 to 2023-12 (published at CEDA 2025-02-24)"
      - aspect: SMOS input
        before: ESA L2OS v700 reprocessing
        after: "CCI's own L2OS reprocessing (from DPGS L1C v7), new dielectric constant model, RFI mitigation extended globally"
      - aspect: SMAP input
        before: RSS L2 v5.0
        after: RSS L2 v5.3
      - aspect: Known errors
        before: "About 0.1 pss underestimation in 2010 (SMOS commissioning), North Atlantic more than 0.2 pss too salty in April–August 2015 (SMAP v5.0)"
        after: Both resolved (PVIR v5.1)
      - aspect: Northern Hemisphere seasonal bias
        before: Below 0.1 pss
        after: Below 0.05 pss (peak to peak)
      - aspect: High-latitude absolute calibration
        before: v4 approach
        after: Improved absolute calibration north of 65°N
      - aspect: Dataset DOI
        before: 10.5285/f2ca631f29a24c47a7e98654ddf2c7d9
        after: 10.5285/7294d93479654c139770f13fae4142d1
    impacts:
      - Do not splice the two versions into one series; download the whole period again as v5.5. Values differ especially in 2010 and in the North Atlantic in 2015.
      - The PVIR reports similar overall performance against Argo, with v5.5 better near coasts and at high salinity and slightly worse in water colder than 5°C.
      - The citation DOI has changed, and the CEDA path moves from the v04.41 folder to v05.5.
    sources:
      - name: ESA CCI — Sea Surface Salinity Record Extended (v5.5)
        url: https://climate.esa.int/en/news-events/Sea-Surface-Salinity-Record-Extended/
      - name: SSS CCI PVIR v5.1 (2025-02-25)
        url: https://climate.esa.int/documents/2953/SSS_cci_PHASE02_D4.1_PVIR_v5.1.pdf
      - name: SSS CCI PUG v4.1 (known issues in v4.41)
        url: https://climate.esa.int/documents/2489/SSS_cci_PHASE02_D4.3-PUG-v4.1_final_signed.pdf

