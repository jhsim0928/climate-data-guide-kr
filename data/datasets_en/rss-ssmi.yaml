notices:
  - date: "2026-10-01"
    level: info
    title: Follow-on microwave data released — RSS MWI (WSF-M1) V6.1
    body: >-
      RSS released the first public version (V6.1) of data from the MWI sensor on the US Space Force WSF-M1 satellite: 0.25° daily and multi-day gridded netCDF, intercalibrated with the existing RSS microwave climate record.
      It is meant to fill the gap after DMSP SSMIS, but continuity with the SSMIS record has to be checked separately.
    source: https://www.remss.com/announcement/RSS-MWI-V6.1-released/
  - date: "2025-08-06"
    level: warning
    title: DMSP SSMIS delivery to continue only until DMSP retirement (expected September 2026)
    body: >-
      NSIDC reported that the US Department of Defense would continue SSMIS processing and delivery through the retirement of the DMSP mission, expected in September 2026.
      NOAA and EUMETSAT OSI SAF likewise described the data as available on a best-effort basis.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-noaansidc-sea-ice-concentration-near-real-time-cdr-version-3-will-continue-ssmis-data
  - date: "2025-06-26"
    level: critical
    title: DMSP SSMIS discontinuation announced (later postponed)
    body: >-
      RSS relayed notice that DMSP and the US Navy's FNMOC would permanently stop ingesting, processing and distributing DMSP data by 30 June 2025. On 30 June, at NASA's request, this was postponed to 31 July,
      and it was later extended until the end of the DMSP mission (expected September 2026). RSS said it would prepare MWI data for release.
    source: https://www.remss.com/announcement/DMSP-SSMIS-discontinued/

