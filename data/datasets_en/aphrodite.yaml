notices:
  - date: "2026-10-12"
    level: warning
    title: AphroTemp (temperature V1204R1) currently unavailable for download from DIAS
    body: >-
      When checked, the DIAS dataset page stated that "Data download from DIAS is currently unavailable for this dataset" and that the latest version is released
      from the APHRODITE website. Use V1808 from the Hirosaki University website for temperature.
    source: http://search.diasjp.net/en/dataset/AphroTemp
  - date: "2019-03"
    level: info
    title: V1901 (EOD-adjusted to 00–24 UTC) released; APHRODITE-2 funding ended
    body: >-
      Monsoon Asia daily precipitation V1901 (1998–2015), with gauge end-of-day times adjusted to 00–24 UTC using satellite precipitation (CMORPH), and a 0.05° climatology were released.
      The website later announced that APHRODITE-2 funding had ended and that support would be less frequent. The site gives no exact release date, so the project end (March 2019) is used here.
    source: http://aphrodite.st.hirosaki-u.ac.jp/index.html
  - date: "2018-10-05"
    level: info
    title: V1101EX replaced by V1101EX_R1 (fixes over India and Taiwan)
    body: Problems found over India and Taiwan in V1101EX, the 2007–2015 extension using the V1101 algorithm, were fixed, and V1101EX_R1 replaced V1101EX. The year 2007 overlaps with V1101.
    source: http://aphrodite.st.hirosaki-u.ac.jp/product_readme/V1101EX_R1_readme.html
  - date: "2018-09-27"
    level: info
    title: APHRODITE-2 products released — V1801_MA, V1101EX_R1, V1808_MA (temperature), APHRO_JP V1207R3
    body: The new-algorithm Monsoon Asia daily precipitation V1801, temperature V1808 and a revised Japan product were released, and on 9 October the APHRODITE-2 products were published on the Hirosaki University APHRODITE-2 website.
    source: https://www.chikyu.ac.jp/precip/english/

