        APHRODITE (Asian Precipitation – Highly-Resolved Observational Data Integration Towards Evaluation of Water Resources), APHRO_MA V1901
        (End-of-the-day adjusted version), Hirosaki University. http://aphrodite.st.hirosaki-u.ac.jp/ (Accessed DD Month YYYY)
