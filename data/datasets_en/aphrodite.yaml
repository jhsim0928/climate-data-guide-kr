# ─────────────────────────────────────────────────────────────
# APHRODITE — dataset information file (English edition)
# Atmosphere tab (precipitation). Classified as 'ended' because no new version has appeared since V1901 (2019).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: aphrodite
name: APHRODITE
full_name: Asian Precipitation – Highly-Resolved Observational Data Integration Towards Evaluation of Water Resources
category: analysis
domain: atmosphere
group: 강수 자료
order: 30
domains: [대기, 육지]
provider: APHRODITE project — Research Institute for Humanity and Nature (RIHN) and MRI/JMA (APHRODITE-1); Prof. Akiyo Yatagai's group, Hirosaki University (APHRODITE-2). Some versions are also distributed by DIAS (JAMSTEC)

status: ended
status_note: >-
  APHRODITE-2 funding (June 2016 – March 2019) has ended, and no new version has been released since V1901 (2019; Monsoon Asia daily precipitation, 1998–2015).
  The data remain downloadable from the Hirosaki University APHRODITE website and DIAS, but nothing after 2015 is available.
  The website still welcomes comments and questions but warns that support "will not be as frequent as we were".

successor:
  name: None
  url: http://aphrodite.st.hirosaki-u.ac.jp/
  note: >-
    No official successor has been announced. For 2016 onwards, use another gauge-based gridded precipitation product or a satellite
    product (e.g. IMERG), but do not splice it onto APHRODITE as one time series.

period:
  start: "1951-01"
  end: "2015-12"
  note: >-
    V1101 (Monsoon Asia, Middle East, Russia) covers 1951-01-01 to 2007-12-31; V1101EX_R1, an extension with the same algorithm, covers 2007–2015 (2007 overlaps);
    the new-algorithm V1801_R1 and the EOD-adjusted (00–24 UTC) V1901 cover 1998–2015. The temperature product AphroTemp V1204R1 covers 1961–2007;
    the later temperature product V1808 (APHRO_TAVE_MA_V1808) covers 1961–2015 according to the NCAR Climate Data Guide (not confirmed in an official README).
    As checked on 2026-10-12, the last date with data is 2015-12-31.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: >-
    Released on 0.25° and 0.5° latitude–longitude grids (computed internally on a 0.05° grid; station values are not preserved in the regridding for release).
    Monsoon Asia (MA) 60.0°E–150.0°E, 15.0°S–55.0°N (0.5°: 180 × 140; 0.25°: 360 × 280); Middle East (ME) 20.0°E–65.0°E, 15.0°N–45.0°N;
    Russia (RU) 15.0°E–165.0°W, 34.0°N–84.0°N. Japan (APHRO_JP) on a 0.05° grid (123°E–146°E, 24°N–46°N).
  vertical: Surface only (daily precipitation, daily mean temperature)
  temporal: >-
    Daily. In V1901 a "day" is the 24-hour accumulation through 00–24 UTC (the end-of-day time of gauge reports was judged using the CMORPH satellite product);
    V1801 uses local day boundaries by region or country (e.g. 15 UTC for Japan); V1101 keeps each country's gauge day boundary as reported (e.g. 03 UTC for India).
    V1901 also comes with a 0.05° daily climatology.

update: Ended — last release V1901 (2019), data through December 2015
license: >-
  Non-commercial use by academic institutions and researchers only. No redistribution of the data, in whole or in part, to the general public; releasing
  secondary products requires permission from the APHRODITE project; publications must acknowledge APHRODITE (DIAS terms of use). Email registration required
account_required: true

summary: >-
  APHRODITE is a set of gauge-based daily gridded precipitation datasets for Asia. It is built primarily from rain-gauge data collected directly from
  meteorological and hydrological agencies and researchers across Asia, supplemented by GTS, GHCN and other public data, and interpolated with
  topography taken into account. It covers Monsoon Asia, the Middle East and Russia at 0.25° and 0.5° from 1951, and is distinguished by including
  more gauges than other global products in data-sparse regions such as the Himalayas. Each grid cell comes with the ratio of 0.05° boxes containing
  stations (RSTN), which indicates how reliable the value is. A daily mean temperature dataset (AphroTemp, V1808) and a 0.05° product for Japan (APHRO_JP) are also available.

time_convention:
  summary: >-
    All precipitation values are 24-hour accumulated amounts (mm/day). The day boundary differs between versions: V1901 adjusts each gauge's end-of-day
    time using satellite data so that every grid cell represents 00–24 UTC, whereas V1101, V1101EX_R1 and V1801_R1 keep each country's (or region's) gauge reporting day.
  points:
    - "00–24 UTC in V1901 corresponds to 09 KST to 09 KST the next day — nine hours offset from KMA daily precipitation (00–24 KST)."
    - "In the V1101 family the day boundary differs by country (README examples: 03 UTC for India; 15 UTC for Japan in V1801), so same-day maps over large areas can be shifted by a day. For this reason the APHRODITE team asks users to cite V1901 explicitly as the \"End-of-the-day adjusted version\"."
    - "The released 0.25° and 0.5° grids are averages of 0.05° values, so they do not reproduce station values exactly."
    - "Temperature (AphroTemp, V1808) is the daily mean temperature."
  source: http://aphrodite.st.hirosaki-u.ac.jp/product_readme/Readme_V1901.pdf
  source_name: APHRO_MA_V1901 README + V1101EX_R1 README

variables:
  note: >-
    Variables as described in the official READMEs. In the binary files, each daily field holds the precipitation array followed by the station-ratio array
    (4-byte floats, little-endian, no record markers); netCDF files are also provided. The netCDF variable names are not given in the READMEs, so check them by opening a file.
    The missing value is -99.9.
  full_list: http://aphrodite.st.hirosaki-u.ac.jp/products.html
  groups:
    - name: Daily precipitation (APHRO_MA/ME/RU V1101, V1101EX_R1, V1801_R1, V1901)
      kind: accum
      period: Day
      items:
        - text: "Daily precipitation (mm/day)"
          note: "00–24 UTC in V1901; station day boundaries in the other versions"
        - text: "Ratio of 0.05° grid boxes containing stations, RSTN (%)"
          kind: instant
          note: >-
            The fraction of 0.05° boxes within the cell that contain a station — a daily reliability indicator (the observation density on that day, not a time statistic).
            The V1901 README mixes % and fractions when describing its units
    - name: Daily mean temperature (AphroTemp V1204R1, APHRO_TAVE_MA_V1808)
      kind: mean
      period: Day
      items:
        - text: "Daily mean temperature"
          note: Units and variable names not confirmed in official documents. Monsoon Asia at 0.25° and 0.5°
    - name: Japan high resolution (APHRO_JP)
      kind: accum
      period: Day
      items:
        - text: "Daily precipitation, 0.05° (mm/day)"
          note: "Latest version V1207R3 (released 2018). Period 1900–2011 per the earlier V1207; the period of R3 has not been confirmed"

access:
  - name: APHRODITE website (Hirosaki University, latest versions)
    url: http://aphrodite.st.hirosaki-u.ac.jp/download/
    method: Web download (email registration)
    note: >-
      Provides V1901, V1801_R1, V1101EX_R1, V1808 (temperature), APHRO_JP and the APHRODITE-1 products (V1101 etc.). For older versions, the site asks you to
      write to aphrodite.precinfo@gmail.com. Binary files come with GrADS control files (.ctl), Fortran sample code and netCDF versions.
  - name: DIAS — APHRO_MA V1101 (Monsoon Asia)
    url: http://search.diasjp.net/en/dataset/APHRO_MA
    method: Web download (DIAS email registration)
    note: The V1101 edition for 1951–2007. As checked on 2026-10-12, the AphroTemp (temperature V1204R1) page on the same DIAS site says download is currently unavailable.

example:
  lang: python
  note: >-
    Reads one yearly Monsoon Asia 0.5° file using the binary layout given in the README (per day: [precipitation, RSTN] arrays, 4-byte little-endian floats, no record markers).
    Adjust the file name and the grid origin and orientation from the accompanying .ctl file (XDEF, YDEF).
  code: |
    import numpy as np

    nx, ny = 180, 140                      # Monsoon Asia 0.5° (0.25°: 360, 280)
    fname = "APHRO_MA_050deg_V1101.2005"   # replace with the file you downloaded

    raw = np.fromfile(fname, dtype="<f4")
    nday = raw.size // (2 * nx * ny)       # 0.5° non-leap-year file = 73,584,000 bytes = 365 days
    raw = raw.reshape(nday, 2, ny, nx)

    precip = np.where(raw[:, 0] <= -99.0, np.nan, raw[:, 0])   # mm/day
    rstn = np.where(raw[:, 1] <= -99.0, np.nan, raw[:, 1])     # ratio of boxes containing stations

    # Cells with no station (rstn == 0) are purely interpolated, so flag them separately
    print(nday, np.nanmean(precip), np.mean(rstn == 0))

tips:
  - "Day boundaries differ between versions. For extreme precipitation and date-specific case studies, V1901 (aligned to 00–24 UTC) is the right choice; do not compare V1101 and V1901 values for the same date directly."
  - "Always look at RSTN (ratio of boxes containing stations). Cells without a station are interpolated from surrounding gauges, so reliability varies strongly by region and period. The NCAR Climate Data Guide also notes that changes in the number of input gauges over space and time limit trend analysis."
  - "The record is not homogenized for station relocations or gauge changes. It is better suited to climatologies and case studies than to long-term trends."
  - "The Korean Peninsula lies within the Monsoon Asia (MA) domain (60–150°E, 15°S–55°N). However, the source and number of Korean gauges could not be confirmed in official documents, so for Korean studies check the gauge density per cell with RSTN and compare against KMA ASOS observations. APHRO_JP covers land areas of Japan."
  - "The 0.05° station grids are mostly not released because of data-provider restrictions (exceptions: APHRO_JP for Japan and the V1901 climatology)."
  - "V1101 binary files are direct-access files without record markers, so Fortran sequential reads or generic numpy reads must use the right record length and byte order. Check the number of days against the file size."
  - "Commercial use and redistribution are prohibited. Publishing processed data requires permission from the APHRODITE team."

