notices:
  - date: "2024-07-22"
    level: info
    title: PO.DAAC releases CCMP V3.1 6-hourly and monthly datasets
    body: >-
      NASA PO.DAAC publicly released the RSS CCMP Level 4 Version 3.1 datasets (6-hourly CCMP_WINDS_10M6HR_L4_V3.1 and monthly CCMP_WINDS_10MMONTHLY_L4_V3.1) from 1993 onward.
      They are available through Earthdata Cloud, OPeNDAP and Harmony, and each has its own DOI.
    source: https://podaac.jpl.nasa.gov/announcements
  - date: "2023-08-25"
    level: info
    title: CCMP V3.1 released (1993 to present)
    body: >-
      V3.1 uses the same processing system as V3.0, but from January 2021 adjusts ERA5 with the near-real-time OSCAR, and ingests AMSR2 V8.2 and ASCAT-B (from 2012-12-13).
      These changes allow low-latency production to continue, and values before 2012-07-02 are identical to V3.0.
    source: https://www.remss.com/announcement/New-Version-3.1-Cross-Calibrated-Multi-Platform/
  - date: "2023-02-13"
    level: info
    title: CCMP V3.0 released — background changed from ERA-Interim to ERA5
    body: >-
      With ERA-Interim production having ended in July 2019, V3.0 switched the background to ERA5 neutral-stability winds and added current, wind-speed-distribution and seasonal vector adjustments plus regional radiometer corrections.
      RSS reports better accuracy above 15 m/s and more reliable long-term trends; the record starts in 1993, when the OSCAR current dataset begins.
    source: https://www.remss.com/announcement/New-Version-3.0-Cross-Calibrated-Multi-Platform/

transitions:
  - from: CCMP V2.0
    to: CCMP V3.0
    status: completed
    date: "2023-02"
    summary: >-
      The background changed from ERA-Interim to adjusted ERA5 neutral winds, buoy assimilation was dropped, GMI was added, and radiometer winds and ERA5 were adjusted before the analysis.
      The record now starts in 1993 instead of 1987, with better high-wind accuracy and long-term stability.
    changes:
      - aspect: Background field
        before: ERA-40 and ERA-Interim 10 m winds (no adjustment)
        after: "ERA5 10 m neutral-stability winds + OSCAR current adjustment, wind-speed distribution matched to scatterometers, seasonal and regional vector corrections"
      - aspect: Period
        before: "1987-07 onward (the v02.0 folder on the RSS server stops in 2019)"
        after: "1993-01 onward (start of the OSCAR current record)"
      - aspect: Satellite inputs
        before: "Radiometers SSM/I, SSMIS, AMSR-E, WindSat, TMI, AMSR2; scatterometers QuikSCAT, ASCAT-A"
        after: "V2.0 inputs + GMI"
      - aspect: Buoy data
        before: Moored buoy winds (TAO, TRITON, PIRATA, RAMA, NDBC and others) assimilated
        after: Not assimilated; kept for independent validation
      - aspect: Radiometer wind adjustment
        before: None
        after: Small regional corrections, largest for 19 GHz instruments (SSM/I, SSMIS)
      - aspect: Monthly anomaly baseline
        before: V2.0 climatology
        after: 1995–2014 climatology
    impacts:
      - Do not splice V2.0 and V3.x into one time series. Where there are no observations, values differ by the difference between backgrounds.
      - V2.0 assimilated buoys, which left artificial structures around buoy sites that stood out in derivatives such as stress curl. V3.x does not have this problem, but buoy comparisons are no longer comparisons with assimilated data.
      - Only V2.0 covers the years before 1993, so studies using that period should state the version clearly and check differences from V3.x separately.
    sources:
      - name: RSS — CCMP V3.0 release announcement (2023-02-13)
        url: https://www.remss.com/announcement/New-Version-3.0-Cross-Calibrated-Multi-Platform/
      - name: Mears et al. (2022), Remote Sensing
        url: https://doi.org/10.3390/rs14174230
      - name: Mears et al. (2019), JGR Oceans (V2.0 and NRT comparison)
        url: https://doi.org/10.1029/2019JC015367
      - name: CCMP V3.1 User Guide (version comparison table)
        url: https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/ccmp/open/L4_V3.1/docs/User_Guide_3.1.r1.pdf
  - from: CCMP V3.0
    to: CCMP V3.1
    status: completed
    date: "2023-08"
    summary: >-
      Same processing system, with inputs changed only from July 2012 onward. Adding AMSR2 V8.2 and ASCAT-B improves winds after that date, and using near-real-time OSCAR lets the record be extended continuously with low latency.
    changes:
      - aspect: Period
        before: "1993-01 to 2019 (planned to be extended, but superseded by V3.1)"
        after: "1993-01 to present (updated roughly monthly)"
      - aspect: ERA5 pre-adjustment
        before: OSCAR currents
        after: "OSCAR025-nrt (near-real-time) from 2021-01"
      - aspect: Scatterometer inputs
        before: QuikSCAT, ASCAT-A
        after: "QuikSCAT, ASCAT-A (V2.1.1 after 2016, ended 2021-11), ASCAT-B (full mission from 2012-12-13)"
      - aspect: AMSR2
        before: V8.0
        after: "V8.2 (full mission from 2012-07-02)"
      - aspect: Values before 2012-07-02
        before: V3.0
        after: Identical to V3.0
    impacts:
      - Values from July 2012 onward differ from V3.0, so do not mix results produced with V3.0 and V3.1. Earlier values are the same.
      - "The citation DOIs on the RSS page are still labelled Version 3.0. In papers, state the version you actually used (V03.1 in the file names)."
    sources:
      - name: RSS — CCMP V3.1 release announcement (2023-08-25)
        url: https://www.remss.com/announcement/New-Version-3.1-Cross-Calibrated-Multi-Platform/
      - name: RSS CCMP product page
        url: https://www.remss.com/measurements/ccmp/

