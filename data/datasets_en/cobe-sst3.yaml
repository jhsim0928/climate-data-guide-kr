# ─────────────────────────────────────────────────────────────
# COBE-SST3 — dataset information file
# After editing, update last_verified to the date you checked the official pages.
# Variable names and units inside the files could not be confirmed from official documents as of 2026-10-12, so they are not listed.
# Once the 00README and ctl files on the server can be read, add the variable names to the variables section.
# ─────────────────────────────────────────────────────────────
id: cobe-sst3
name: COBE-SST3
full_name: Centennial in situ Observation-Based Estimates, version 3 (COBE-SST3)
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 35
domains: [해양, 해빙]
provider: Meteorological Research Institute, Japan Meteorological Agency (MRI/JMA)

status: active
status_note: >-
  A research dataset freely available from the MRI research data server. JMA's operational long-term SST analysis is still COBE-SST2,
  and COBE-SST3 is not updated on a regular schedule. Daily and monthly files through 2024 were added in September 2025 (according to the server listing),
  but the perturbation ensemble and the satellite-blended COBE-SST3H still end in 2020, and the developer guidance (September 2025) describes extension to recent years
  and a near-operational version only as plans.

period:
  start: "1850-01"
  end: "2024-12"
  note: >-
    According to the MRI server listing on 2026-10-12, yearly daily (daily/) and monthly (monthly/, 1x1/monthly/) files exist for 1850–2024 (the 2021–2024 files were uploaded on 2025-09-22).
    The paper (Ishii et al. 2025) and the NCAR Climate Data Guide still describe the period as 1850–2020, and we have not opened the 2024 file to confirm its last date.
    The perturbation ensemble has files only for 1890–2020 (0.25° daily) and 1870–2024 (1° monthly); COBE-SST3H covers 1982–2020.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: "0.25° × 0.25° grid (global oceans, seas and large lakes; spatially complete) / separate 1° × 1° monthly version (1x1 folder)"
  vertical: Single sea-surface level (representative of temperature within several metres of the surface, not skin temperature)
  temporal: Daily (monthly files provided separately)

coverage:
  short: 전지구
update: Irregular research releases — no published update schedule (2021–2024 added in September 2025)
license: >-
  No separate terms of use are shown on the MRI server. The MRI website follows the JMA website terms of use (Public Data License, version 1.0), which require attribution.
  Cite Ishii et al. (2025) when using the data
account_required: false

summary: >-
  A daily 0.25° sea surface temperature analysis developed by the JMA Meteorological Research Institute (MRI) as the successor to COBE-SST2, reconstructed from 1850 using in situ observations such as ICOADS Release 3.0.
  Biases are re-estimated for each observation type, and SST is analysed monthly together with land surface air temperature (COBE-LSAT3) for consistency between ocean and land;
  uncertainty is provided by a 300-member perturbation ensemble. It is a research dataset released with the 2025 paper; JMA's operational SST analysis remains COBE-SST2.

time_convention:
  summary: >-
    Daily files hold one analysis per day and monthly files one value per month. The final SST is the sum of a low-frequency component (31-year running mean for the same calendar month, on a 1° grid),
    interannual variations (monthly) and daily changes (deviations from the interannual variations). We found no official statement that the daily values are daily means.
  points:
    - "From the paper: 'The final product of COBE-SST3 is a sum of low-frequency components, inter-annual variations, and daily changes.'"
    - "Daily changes are analysed from in situ observations only; satellite SST enters only through the EOFs (spatial patterns) used for spatial interpolation. As a result, daily variability is smaller than in the satellite-blended COBE-SST3H."
    - "The SST represents temperatures within several metres of the surface, not satellite skin SST (NCAR CDG developer guidance)."
    - "SST in sea-ice areas is set by blending, according to the ice concentration, a proxy derived from the sea ice concentration–SST relationship."
    - "We could not confirm from the official documents which time of day the time coordinate refers to. Open a file and check the time values first."
  source: https://doi.org/10.2151/jmsj.2025-002
  source_name: Ishii et al. (2025) / NCAR Climate Data Guide developer guidance

variables:
  note: >-
    According to the NCAR Climate Data Guide, the variables provided are sea surface temperature (SST) and sea ice concentration (SIC). Variable names and units inside the files are not given in official documents,
    so open a file (print(ds)) to check them. The file names below were confirmed from the MRI server listing.
  full_list: https://climatedataguide.ucar.edu/climate-data/sst-data-cobev3-centennial-situ-observation-based-estimates-version-3
  groups:
    - name: Sea surface temperature
      kind: mean
      period: Daily
      items:
        - text: "Daily sea surface temperature (0.25°) — file cobe-sst3.YYYY.nc (daily/)"
          kind: mean
          period: Daily
          note: One analysis value per day. The official documents do not explicitly call it a daily mean
        - text: "Monthly sea surface temperature (0.25°) — file cobe-sst3.monthly.YYYY.nc (monthly/)"
          kind: mean
          period: Monthly
        - text: "Monthly sea surface temperature (1°) — file cobe-sst3.monthly.YYYY.nc (1x1/monthly/)"
          kind: mean
          period: Monthly
    - name: Sea ice
      kind: mean
      period: Daily
      items:
        - text: "Sea ice concentration (SIC)"
          kind: mean
          period: Daily
          note: >-
            Listed as a provided variable by the NCAR CDG. We could not confirm which file holds it, under what name, or how time is treated.
            Before October 1978 it is based on Walsh et al. (2017), and Antarctic sea ice is a climatology, so reliability is low
    - name: Uncertainty (perturbation ensemble)
      kind: mean
      period: Daily
      items:
        - text: "Perturbed SST, 300 members (0.25° daily) — file cobe-sst3.mNNN.YYYY.nc, folder perturb/m001–m300"
          kind: mean
          period: Daily
          note: Files for 1890–2020 on the server. According to the paper, SIC perturbations are computed consistently with the SST perturbations
        - text: "Perturbed SST, 300 members (1° monthly) — file cobe-sst3.monthly.mNNN.YYYY.nc, folder 1x1/perturb/m001–m300"
          kind: mean
          period: Monthly
          note: Files for 1870–2024 on the server
    - name: Ancillary files
      kind: static
      items:
        - "Ocean mask — files ocean-mask_0.25x0.25.nc, ocean-mask_1x1.nc (mask/)"
        - "Land mask — file land-mask_1x1.nc (mask/)"
        - text: "Global-mean SST time series — files gm_cobe-sst3 (monthly), annual_gm_cobe-sst3 (annual) (gm/)"
          kind: mean
          period: Monthly / annual
          note: Updated 2026-05-28. Global-mean files for COBE-LSAT3, COBE-STEMP3 and COBE-SST3H are in the same folder

access:
  - name: MRI research data server — COBE-SST3 archive
    url: https://climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/
    login: false
    method: Direct HTTPS directory download (wget / curl), NetCDF
    note: >-
      Under cobe-sst3/ are daily/ (0.25° daily, one file per year), monthly/ (0.25° monthly), 1x1/ (1° monthly and perturbations) and perturb/ (300-member daily perturbations).
      The same parent folder holds COBE-SST3H (satellite-blended daily, 1982–2020), COBE-LSAT3 (land air temperature), COBE-STEMP3 (global surface temperature), mask/ and gm/.
      GrADS ctl files and a 00README are included. There is no OPeNDAP or THREDDS, and each yearly daily file is large, so download only the years you need.

example:
  lang: python
  note: There is no OPeNDAP, so download the file first and then open it. Variable and coordinate names are not documented officially — check them with print(ds) before use.
  code: |
    import urllib.request
    import xarray as xr

    base = "https://climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/cobe-sst3"
    fn = "cobe-sst3.monthly.2020.nc"                 # 0.25° monthly file (daily: daily/cobe-sst3.2020.nc)
    urllib.request.urlretrieve(f"{base}/monthly/{fn}", fn)

    ds = xr.open_dataset(fn)
    print(ds)                                         # check variable names, units, latitude order and time values
    sst = ds[list(ds.data_vars)[0]]                   # replace with the SST variable name shown by print(ds)

tips:
  - "JMA's operational product is COBE-SST2. If you need recent months updated monthly, use COBE-SST2 (1°, monthly) or an operational daily product such as OISST, and keep COBE-SST3 for high-resolution and uncertainty analysis of past periods."
  - "Changes from COBE-SST2: resolution 1° → 0.25°; in situ input from ICOADS Release 3.0 (JMA operational data after 2015); biases re-estimated per observation type, with night marine air temperature (HadNMAT2) used in the bias correction; joint monthly analysis with land air temperature (COBE-LSAT3). The abrupt shift in the early 1940s is reduced, so mid-20th-century trends can differ from COBE-SST2."
  - "The climatology used in the analysis is 1985–2015 (31 years). We have not confirmed whether the distributed files contain an anomaly variable, so compute anomalies yourself against the base period you need (e.g. 1991–2020)."
  - "If uncertainty matters, use the 300 members in perturb/. Note that the server has 0.25° daily perturbations only for 1890–2020 and 1° monthly perturbations for 1870–2024, which differ from the main analysis period (1850–2024)."
  - "COBE-SST3H (1982–2020), which blends satellite SST directly, captures daily variability better. The paper finds COBE-SST3H statistics against buoys and Argo very close to OISST v2.1, while COBE-SST3, without direct satellite input, shows somewhat damped signals."
  - "The developer notes that reliability is low in periods and regions with sparse observations and that early 20th-century bias corrections are probably still insufficient. Pre-satellite sea ice concentration has low accuracy, and Antarctic sea ice is a climatology."
  - "The 2021–2024 extension appeared on the server in September 2025 but is not yet described in the paper or the NCAR CDG. If you use it, check the file contents and the server 00README, and record your download date."

