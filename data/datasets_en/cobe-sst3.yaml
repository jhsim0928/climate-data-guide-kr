notices:
  - date: "2026-02-13"
    level: info
    title: JMA reports tests of COBE-SST3H as a candidate ocean boundary condition for its next long-term reanalysis
    body: >-
      Material for JMA's long-term reanalysis advisory meeting introduced COBE-SST3 as the successor to COBE-SST2 and reported a summer-2014 test in which the satellite-blended COBE-SST3H replaced MGDSST
      (e.g. improved representation of SST cooling along typhoon tracks). No decision on adoption or an operational schedule is recorded.
    source: https://www.jma.go.jp/jma/kishou/shingikai/kondankai/reanalysis_kondankai/R07/r7-siryo3-2.pdf
  - date: "2025-09-22"
    level: info
    title: Daily and monthly files added through 2024 (per the server listing)
    body: >-
      Files for 2021–2024 appeared in the daily/, monthly/ and 1x1/monthly/ folders on the MRI server, and the 2011–2020 files were re-uploaded the same day.
      We found no separate official announcement; the 0.25° perturbation ensemble and COBE-SST3H still end in 2020.
    source: https://climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/cobe-sst3/daily/
  - date: "2025-09"
    level: info
    title: Developer guidance — plans to extend to recent years and develop a near-operational version
    body: >-
      The expert developer guidance in the NCAR Climate Data Guide (Masayoshi Ishii, September 2025) states that the data currently end in 2020, will be extended to recent years when possible,
      and that a near-operational version is in development. No schedule is given.
    source: https://climatedataguide.ucar.edu/climate-data/sst-data-cobev3-centennial-situ-observation-based-estimates-version-3
  - date: "2024-10-25"
    level: info
    title: COBE-SST3 paper published online in advance (JMSJ)
    body: >-
      The COBE-SST3 paper by Ishii et al. was published online in advance in the Journal of the Meteorological Society of Japan (final publication in 2025, vol. 103, no. 1).
      The paper states that the analyses are available in NetCDF from the MRI research data server.
    source: https://www.jstage.jst.go.jp/article/jmsj/103/1/103_2025-002/_article

