notices:
  - date: "2026-09-18"
    level: info
    title: HadCRUT.5.2.0.0 released — land input updated to CRUTEM.5.2.0.0
    body: >-
      The dataset version was updated to HadCRUT.5.2.0.0. In CRUTEM.5.2.0.0, 380 Chinese series were updated with values derived from CMA TMAX and TMIN data,
      data for 1,218 contiguous US stations were replaced with USHCN values, and one Canadian station series was removed. Values change over the whole record, so do not mix results with earlier versions.
    source: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/versions/HadCRUT.5.2.0.0_release_notes.html
  - date: "2025-09"
    level: info
    title: Ocean input HadSST.4.2.0.0 released (reduced anomalous warmth before 1950)
    body: >-
      The new HadSST4 version refines the pre-1950 engine room intake (ERI) bias estimates, "leading to a reduction in anomalous warmth".
      The HadCRUT.5.2.0.0 release notes link to this document but state that HadSST.4.1.1.0 was used, so it is unclear whether HadCRUT5 includes it.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-09"
    level: info
    title: HadCRUT.5.1.0.0 released — with CRUTEM.5.1.0.0 and HadSST.4.1.1.0
    body: >-
      The land input moved to CRUTEM.5.1.0.0 (station series updated for a number of countries), the ocean input to HadSST.4.1.1.0, and the sea-ice dataset used for
      air/sea temperature weighting to HadISST.2.2.2.0. Non-infilled file names now state clearly that they hold non-infilled data. The official page gives no exact release date,
      so the release-notes update date (2025-09-05) is used.
    source: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/versions/HadCRUT.5.1.0.0_release_notes.html
  - date: "2025-02"
    level: info
    title: HadSST.4.1.0.0 released — processing system reimplemented, global mean differences of order 0.01°C
    body: >-
      The HadSST4 system was rewritten from IDL in Python and several bugs were fixed. The local pattern of post-1945 bias corrections changed,
      but median differences in global annual means are of order 0.01°C. Version 4.1.0.0 was available only briefly before HadSST.4.1.1.0 followed.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.1.0.0_release_notes.pdf

