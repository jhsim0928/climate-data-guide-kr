# ─────────────────────────────────────────────────────────────
# HadCRUT5 — dataset information file
# Listed under the atmosphere tab (temperature). A blend of CRUTEM5 (land) and HadSST4 (ocean).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: hadcrut5
name: HadCRUT5
full_name: HadCRUT5 — Met Office Hadley Centre / Climatic Research Unit global surface temperature anomalies
category: analysis
domain: atmosphere
group: 기온 자료
order: 10
domains: [대기, 해양]
provider: Met Office Hadley Centre and Climatic Research Unit (CRU), University of East Anglia

status: active
status_note: >-
  Actively maintained. The dataset version was updated to HadCRUT.5.2.0.0 on 18 September 2026 (land input CRUTEM.5.2.0.0).
  Each new version recalculates the whole record back to 1850, so always report the version number you used.
  The CRU (UEA) web page still lists 5.0.2.0 (data to May 2024); download from the Met Office pages.

period:
  start: "1850-01"
  end: present
  note: >-
    As checked on 2026-10-12, the HadCRUT.5.2.0.0 annual summary files include a (partial) 2026 value, and the accompanying CRUTEM.5.2.0.0 release notes state
    "2026 based on data for the first seven months of the year only", so data appear to run through July 2026. The last row of the monthly files was not checked directly.

resolution:
  spatial_short: "555 km (5°)"
  temporal_short: "1개월"
  spatial: "5° latitude × 5° longitude global grid. The non-infilled version leaves cells without observations empty; the analysis version fills them by statistical infilling"
  vertical: Surface only (a blend of near-surface air temperature over land and sea surface temperature over the ocean)
  temporal: Monthly mean anomalies (summary series provided as separate monthly and annual files)

coverage:
  short: 전지구
update: >-
  Updated regularly (no interval is stated on the HadCRUT5 pages; CRU gives one to two months, and the HadSST4 input is updated monthly).
  A new version recalculates the full record
license: Crown copyright — Open Government Licence v3. Attribution including the version number and download date is required
account_required: false

summary: >-
  A gridded dataset of global historical surface temperature anomalies from January 1850, produced jointly by the Met Office Hadley Centre and the
  Climatic Research Unit at the University of East Anglia. It blends the CRUTEM5 land air temperature and HadSST4 sea surface temperature datasets on a 5° grid,
  with anomalies relative to 1961–1990. It comes in a non-infilled form, holding only cells with observations, and a statistically infilled analysis;
  both are presented as an ensemble of 200 realisations that sample the uncertainty. It is one of the main global temperature datasets used in IPCC and WMO assessments.

time_convention:
  summary: >-
    Every grid value and time series is a monthly mean temperature anomaly (°C, relative to 1961–1990). Values are not instantaneous;
    the time stamp simply labels the month. Annual files are averages of the monthly values for that year.
  points:
    - "In the CSV summary series, the Time column is year-month in monthly files (e.g. \"1956-06\") and the year in annual files (e.g. \"2025\")."
    - "Summary series give the ensemble central estimate together with the 95% confidence range (2.5% and 97.5%)."
    - "The latest year is a partial year (in 5.2.0.0, 2026 covers January–July). Take care when ranking annual means."
    - "A new version changes past values too. Do not compare values for the same month across versions."
  source: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/download.html
  source_name: HadCRUT.5.2.0.0 download page / CRUTEM.5.2.0.0 release notes

variables:
  note: >-
    Products as listed on the official download page. CSV column names are as they appear in the files.
    Variable names inside the gridded NetCDF files were not checked for this page and are not listed (inspect them with ncdump -h after download).
  full_list: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/download.html
  groups:
    - name: Gridded data (analysis and non-infilled)
      kind: mean
      period: month
      items:
        - "Surface temperature anomaly — 200 ensemble members (°C, relative to 1961–1990), in 20 zip files of 10 members each"
        - "Surface temperature anomaly, ensemble mean — `tas_mean` (°C), ensemble_mean.nc"
        - text: "Land-ocean weights — `weights` (0-1), weights.nc"
          kind: static
          note: The land air temperature contribution used when blending each grid cell
        - text: "Non-infilled measurement and sampling uncertainties — `tas_unc` (°C), uncorrelated.nc and decadal error_covariance zip files"
          kind: mean
          period: month
          note: Non-infilled version only. Uncorrelated uncertainties and error covariances that are not represented in the ensemble members
    - name: Summary series (global (NH+SH)/2, Northern and Southern Hemisphere)
      kind: mean
      period: month
      items:
        - "Anomaly (central estimate) — `Anomaly (deg C)` (°C)"
        - "95% confidence limits — `Lower confidence limit (2.5%)`, `Upper confidence limit (97.5%)` (°C)"
        - text: "Annual mean anomaly — same columns in the annual files (°C)"
          kind: mean
          period: year
        - "Series for each of the 200 members — ensemble_series files (°C)"
        - "Series for each uncertainty component — component_series files (°C)"

access:
  - name: Met Office Hadley Centre download page (HadCRUT.5.2.0.0)
    url: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/download.html
    login: false
    method: HTTPS (web / wget / curl)
    note: >-
      Separate sections for the analysis and the non-infilled data, each with summary, ensemble and uncertainty component series (CSV and NetCDF, monthly and annual),
      gridded ensemble members (NetCDF zip files), and ensemble mean and weights files. File names include the version (HadCRUT.5.2.0.0), so URLs change with each new version.
  - name: Previous versions (5.0.0.0 to 5.1.0.0)
    url: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/versions/versions.html
    login: false
    method: HTTPS
    note: Use these to reproduce published results. Each version has release notes describing what changed.
  - name: CEDA Archive (HadCRUT.5.0.0.0)
    url: https://catalogue.ceda.ac.uk/uuid/b9698c5ecf754b1d981728c37d3a9f02/
    method: CEDA web download / OPeNDAP
    note: Archive of the first version (1850–2018). Get current data from the Met Office pages.

example:
  lang: python
  note: Reads the analysis global monthly summary series (CSV) and re-expresses it relative to 1850–1900. Update the version number in the URL to the current version.
  code: |
    import pandas as pd

    ver = "HadCRUT.5.2.0.0"
    url = (f"https://www.metoffice.gov.uk/hadobs/hadcrut5/data/{ver}/analysis/diagnostics/"
           f"{ver}.analysis.summary_series.global.monthly.csv")
    df = pd.read_csv(url)
    df["Time"] = pd.PeriodIndex(df["Time"], freq="M")
    s = df.set_index("Time")["Anomaly (deg C)"]           # °C, relative to 1961-1990

    # Subtract the 1850-1900 mean to get anomalies relative to pre-industrial
    s_pi = s - s["1850":"1900"].mean()
    print(s_pi.tail(12).round(2))

tips:
  - The analysis and non-infilled versions give different global means. The non-infilled version leaves out empty cells such as the sparsely observed Arctic, so do not mix or splice the two.
  - Anomalies are relative to 1961–1990, while GISTEMP and Berkeley Earth use 1951–1980. Re-baseline to a common period before comparing datasets.
  - To carry the uncertainty properly, compute your statistic for all 200 members and look at the spread rather than using the ensemble mean alone. For the non-infilled data, also add the measurement and sampling errors held outside the ensemble (uncorrelated and error_covariance files).
  - The Open Government Licence requires attribution. Include the version number, the download date and "© British Crown Copyright, Met Office" (see the citation guidance below).
  - The HadCRUT.5.2.0.0 release notes say the ocean input changed "from HadSST.4.1.0.0 to HadSST.4.1.1.0" but link to HadSST.4.2.0.0 documents. If the exact HadSST version matters, ask the Met Office.
  - As of October 2026 the CRU (UEA) data page still points to 5.0.2.0 (data to May 2024). Download the latest version from the Met Office pages.
  - Land station data are updated country by country (in 5.2.0.0, for example, Chinese and US stations were replaced), so regional averages can shift noticeably between versions.

