transitions:
  - from: MODIS Land Cover C6 (V006)
    to: MODIS Land Cover C6.1 (V061)
    status: completed
    date: "2022"
    summary: >-
      A full reprocessing from 2001 that keeps the science algorithm and picks up the improved MODIS L1B calibration. The file format and layers are unchanged,
      and two faulty classes in the UMD legend were cleaned up.
    changes:
      - aspect: Input calibration
        before: C6 L1B
        after: Updated Terra and Aqua MODIS L1B calibration (corrected Terra forward look-up table for 2012–2017, revised polarization correction)
      - aspect: UMD legend (LC_Type2)
        before: Included the erroneous cropland/natural vegetation mosaic class introduced in C6, and a wetlands class
        after: Both classes removed and their pixels reassigned to appropriate UMD classes
      - aspect: Snow screening
        before: C6 method
        after: Minor improvement to snow filtering in the vegetation index spline fitting
      - aspect: File format and layers
        before: HDF4, 13 layers (MCD12Q1)
        after: Unchanged (only the DOI suffix changes from .006 to .061)
    impacts:
      - Do not mix C6 and C6.1 maps in one time series; download the whole period again as V061.
      - Cropland or wetland areas computed from the UMD legend (LC_Type2) will differ in C6.1.
    sources:
      - name: MODIS C6.1 Land Cover Type Product User Guide (2022-04-20)
        url: https://lpdaac.usgs.gov/documents/1409/MCD12_User_Guide_V61.pdf
      - name: NASA Earthdata — MCD12Q1 V061 product page
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd12q1-061

notices:
  - date: "2026-03-26"
    level: info
    title: Terra anomaly put MODIS in standby for about a day — data in that window flagged
    body: >-
      At about 20:00 UTC on 26 March 2026 a Terra spacecraft anomaly sent MODIS into standby; the instrument returned to science mode on 27 March.
      The calibration team flagged data from that window as questionable or bad, and the notice lists both Terra-only (MOD) and combined Terra+Aqua (MCD) products as affected.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: Terra science operations projected to end February 2027, Aqua September 2027
    body: >-
      NASA projects that fuel and power limits will end Terra science activities in February 2027 and Aqua in September 2027.
      Both keep observing until then; afterwards no new years of combined MODIS products, MCD12 included, can be produced.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool stops distributing MODIS data (30 June 2025) — move to Earthdata Cloud
    body: >-
      The LP DAAC announced that Data Pool access to all MODIS data, including Collection 6.1, would be retired on 30 June 2025.
      Earthdata Cloud is now the primary archive, so scripts using the old host must be updated. Earthdata Search and AppEEARS users are not affected.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — MODIS collection to stop after a final reprocessing
    body: >-
      NASA said Terra and Aqua will begin shutting down in late 2026 or early 2027 and that a final reprocessing will follow the end of MODIS data collection.
      Both platforms are drifting from their designed orbits, changing crossing times, and users are encouraged to explore similar VIIRS products. No VIIRS counterpart to MCD12 land cover exists yet.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2024-09-10"
    level: warning
    title: Use MCD12Q1 C6.1 maps for 2021 and later with caution
    body: >-
      Lack of funding meant the science team could not keep the training sample database up to date, so land cover at some training sites may have changed.
      LDOPE found large year-to-year changes in grassland, shrubland and forest classes across latitude zones and tiles, and urges caution with the 2021-and-later layers.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=781

