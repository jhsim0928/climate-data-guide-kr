# ─────────────────────────────────────────────────────────────
# FLDAS — dataset information file
# Listed under the Land tab, 'Land reanalyses & data assimilation'. Covers the global Noah 0.1° monthly products (final and preliminary) and the Central Asia Noah-MP 0.01° daily product.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: fldas
name: "FLDAS"
full_name: FEWS NET Land Data Assimilation System (FLDAS — NASA land modelling system for the Famine Early Warning Systems Network; global 0.1° monthly and Central Asia 0.01° daily)
category: reanalysis
domain: land
group: 육상 재분석·자료동화
order: 21
domains: [육지, 수문]
provider: NASA GSFC Hydrological Sciences Laboratory (HSL) / GES DISC (in support of FEWS NET)

status: active
status_note: >-
  The global Noah 0.1° monthly product is updated every month in a final version (MERRA-2 and CHIRPS, 1982 onward) and a preliminary version (GDAS and CHIRPS-Prelim, 2019 onward),
  and the Central Asia Noah-MP 0.01° daily product is produced every day with a one-day lag. On 2026-10-13 the final version reached August 2026, the preliminary version September 2026,
  and the Central Asia daily data 11 October 2026. The African regional products (retired in 2019) and the Central Asia Noah 3.6 daily product (production stopped 2023-10-01) are no longer offered,
  and the GES DISC on-premises server that hosts the files (hydro1) may close after 30 September 2026.

period:
  start: "1982-01"
  end: present
  note: >-
    The global final version (FLDAS_NOAH01_C_GL_M) and the anomalies (MA) start in 1982-01, the preliminary version (FLDAS_NOAH01_CP_GL_M) in 2019-01, and the monthly climatology (MC) averages 1982–2016.
    The Central Asia daily product (FLDAS_NOAHMP001_G_CA_D) starts on 2000-10-01. On 2026-10-13 the data extended to 2026-08 (final), 2026-09 (preliminary) and 2026-10-11 (Central Asia daily).

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "1일"
  spatial: >-
    Global: 0.1° × 0.1° latitude-longitude grid, 60°S–90°N, 180°W–180°E (quasi-global land). Central Asia: 0.01° × 0.01° grid (3500 × 7000), 21–56°N, 30–100°E
    (cell centres from 21.005°N, 30.005°E to 55.995°N, 99.995°E).
  vertical: Single surface level + 4 soil layers (0–10, 10–40, 40–100, 100–200 cm)
  temporal: "Monthly (global final and preliminary, monthly anomalies, 1982–2016 monthly climatology) / daily (Central Asia Noah-MP)"

coverage:
  short: 전지구
  note: "Global version: land 60°S–90°N; Central Asia version: 21–56°N, 30–100°E"
update: "Global preliminary version typically by the 5th of the following month, final version by the 20th (two runs per month) / Central Asia daily product every day with about a one-day lag"
license: NASA Earth science open data — free of charge. Downloading from GES DISC requires a free NASA Earthdata Login; please cite the product DOI
account_required: true

summary: >-
  FLDAS is a land surface modelling system that NASA GSFC runs with its Land Information System (LIS) for the USAID-funded Famine Early Warning Systems Network (FEWS NET).
  It produces soil moisture, evapotranspiration, runoff and snow to support food and water security decisions in data-sparse developing countries. The main public product is
  a global 0.1° monthly record from 1982, made by driving Noah 3.6.1 with CHIRPS precipitation and MERRA-2 (final) or GDAS (preliminary) meteorology; Central Asia, including Afghanistan,
  has a 0.01° daily product from Noah-MP 4.0.1. Despite the name, the public products are open-loop simulations without data assimilation.

time_convention:
  summary: >-
    Variable suffixes indicate the time meaning. `_tavg` is the average over the output interval (the month in monthly files, the day in the Central Asia daily files), and `_inst` is an
    instantaneous value. Water fluxes such as precipitation, evapotranspiration and runoff are stored as mean rates (kg m-2 s-1), not totals, so multiply by the number of seconds to get amounts.
  points:
    - "In monthly files, `Rainf_f_tavg`, `Evap_tavg`, `Qs_tavg`, `Qsb_tavg` and similar fields are monthly mean rates in kg m-2 s-1 (= mm s-1). Monthly total (mm) = value × 86400 × days in the month."
    - "Soil moisture `SoilMoi*_tavg` is the period mean of volumetric water content (m3 m-3), unlike GLDAS, which uses kg m-2."
    - "Only the snow fields `SWE_inst`, `SnowDepth_inst` and `SnowCover_inst` are instantaneous (`_inst`). The README does not say at which time within the period they are taken, so be careful when interpreting within-month changes."
    - "The Central Asia daily product is written once per day and `_tavg` fields are daily means. The README does not define the day window; granule metadata give 00 UTC of the date to 00 UTC of the next day."
    - "`RadT_tavg_max` and `RadT_tavg_min` in the Central Asia daily files are the daily maximum and minimum surface radiative temperature."
    - "Monthly anomalies (MA) are each month minus the 1982–2016 climatology for that month (MC). The NASA LDAS web maps state a 1991–2020 baseline for their anomalies, so the reference periods differ."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf
  source_name: "README for FLDAS (last revised 2026-06-12) + README for FLDAS2 Noah-MP Central Asia (2024-08-13) + CMR collection and granule metadata"

variables:
  note: >-
    Main variables from the GES DISC README tables (Tables 5a and 5c; FLDAS2 Table 6). Names are the netCDF variable names; variables with `_f` are forcing, not model output.
    Some README entries differ between tables (e.g. the unit of `Qs_tavg`, or `Snowcover_inst` capitalisation in the Central Asia product), so check them in a downloaded file.
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf
  groups:
    - name: Water fluxes (global monthly, monthly mean rates)
      kind: mean
      period: Monthly
      items:
        - text: "Total precipitation rate (forcing, CHIRPS) — `Rainf_f_tavg` (kg m-2 s-1)"
          note: Outside 50°S–50°N, MERRA-2 (final) or GDAS (preliminary) precipitation
        - "Snowfall rate — `Snowf_tavg` (kg m-2 s-1)"
        - "Evapotranspiration — `Evap_tavg` (kg m-2 s-1)"
        - "Surface runoff — `Qs_tavg` (kg m-2 s-1)"
        - "Subsurface (baseflow) runoff — `Qsb_tavg` (kg m-2 s-1)"
    - name: Energy fluxes and surface (global monthly)
      kind: mean
      period: Monthly
      items:
        - "Latent heat flux — `Qle_tavg` (W m-2)"
        - "Sensible heat flux — `Qh_tavg` (W m-2)"
        - "Ground heat flux — `Qg_tavg` (W m-2)"
        - "Net shortwave and longwave radiation — `Swnet_tavg`, `Lwnet_tavg` (W m-2)"
        - "Surface radiative temperature — `RadT_tavg` (K)"
    - name: Soil (global monthly, 4 layers)
      kind: mean
      period: Monthly
      items:
        - "Soil moisture, 4 layers — `SoilMoi00_10cm_tavg`, `SoilMoi10_40cm_tavg`, `SoilMoi40_100cm_tavg`, `SoilMoi100_200cm_tavg` (m3 m-3)"
        - "Soil temperature, 4 layers — `SoilTemp00_10cm_tavg`, `SoilTemp10_40cm_tavg`, `SoilTemp40_100cm_tavg`, `SoilTemp100_200cm_tavg` (K)"
    - name: Snow (global monthly, instantaneous)
      kind: instant
      items:
        - "Snow water equivalent — `SWE_inst` (kg m-2)"
        - "Snow depth — `SnowDepth_inst` (m)"
        - "Snow cover — `SnowCover_inst`"
    - name: Forcing (global monthly, monthly means)
      kind: mean
      period: Monthly
      items:
        - "Near-surface air temperature (forcing) — `Tair_f_tavg` (K)"
        - "Specific humidity (forcing) — `Qair_f_tavg` (kg kg-1)"
        - "Surface pressure (forcing) — `Psurf_f_tavg` (Pa)"
        - "Near-surface wind speed (forcing) — `Wind_f_tavg` (m s-1)"
        - "Downward shortwave and longwave radiation (forcing) — `SWdown_f_tavg`, `LWdown_f_tavg` (W m-2)"
    - name: Central Asia Noah-MP daily (FLDAS_NOAHMP001_G_CA_D)
      kind: mean
      period: Daily
      items:
        - "Total precipitation rate — `Rainf_tavg` (kg m-2 s-1)"
        - "Evapotranspiration — `Evap_tavg` (kg m-2 s-1)"
        - "Surface and subsurface runoff — `Qs_tavg`, `Qsb_tavg` (kg m-2 s-1)"
        - "Snowmelt — `Qsm_tavg` (kg m-2 s-1)"
        - "Soil moisture, 4 layers — `SoilMoi00_10cm_tavg` to `SoilMoi100_200cm_tavg` (m3 m-3)"
        - "Terrestrial water storage — `TWS_tavg` (mm)"
        - text: "Daily maximum surface radiative temperature — `RadT_tavg_max` (K)"
          kind: max
        - text: "Daily minimum surface radiative temperature — `RadT_tavg_min` (K)"
          kind: min
        - text: "Snow water equivalent — `SWE_inst` (kg m-2)"
          kind: instant
    - name: Monthly anomalies and climatology (FLDAS_NOAH01_C_GL_MA, MC)
      kind: mean
      period: Monthly
      items:
        - text: "Total runoff — `Qtotal_tavg` (kg m-2 s-1)"
          note: Only in the anomaly and climatology files
        - "Evapotranspiration, precipitation, air temperature, 4-layer soil moisture — `Evap_tavg`, `Rainf_f_tavg`, `Tair_f_tavg`, `SoilMoi*_tavg`"

