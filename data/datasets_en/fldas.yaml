example:
  lang: python
  note: >-
    Uses earthaccess to download the 2024 global final monthly files and compute monthly precipitation and evapotranspiration (mm) over Korea. You will be asked for your Earthdata credentials on the first run.
    Check the coordinate names in the downloaded file (lon and lat are assumed below).
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="FLDAS_NOAH01_C_GL_M", version="001",
        temporal=("2024-01-01", "2024-12-31"),
        bounding_box=(124, 33, 132, 39),   # (west, south, east, north)
    )
    files = earthaccess.download(results, "fldas_global_monthly")

    ds = xr.open_mfdataset(files, combine="by_coords")
    print(ds)                                   # check coordinate and variable names
    sub = ds.sel(lon=slice(124, 132), lat=slice(33, 39))
    days = sub["time"].dt.days_in_month

    precip_mm = sub["Rainf_f_tavg"] * 86400 * days   # monthly mean rate (kg m-2 s-1) -> monthly total (mm)
    et_mm = sub["Evap_tavg"] * 86400 * days          # monthly evapotranspiration (mm)
    print((precip_mm - et_mm).mean(["lat", "lon"]).values)

tips:
  - "The preliminary (CP: GDAS, CHIRPS-Prelim) and final (C: MERRA-2, CHIRPS) versions use different forcing and give different values for the same month. The preliminary run restarts each month from the previous month's final state, so if you filled the latest months with preliminary data, replace them once the final data appear and state which version you used."
  - "CHIRPS covers only 50°S–50°N; poleward of that, MERRA-2 (final) or GDAS (preliminary) precipitation is used. Precipitation characteristics can change near the 50° latitude lines."
  - "Soil moisture is in m3 m-3 (volumetric). Convert units before comparing with GLDAS (kg m-2)."
  - "Water fluxes are rates in kg m-2 s-1. Monthly totals are × 86400 × days in the month; summing the raw values without converting gives numbers hundreds of thousands of times too small."
  - "The anomaly files (MA) use the 1982–2016 climatology (MC). Anomalies on the NASA LDAS web maps or FEWS NET products may use other baselines (e.g. 1991–2020), so state your baseline when you compute your own."
  - "In November 2020, invalid model values over inland water were masked with the MODIS (MOD44W) land mask. Re-download data obtained before then (forcing variables `_f` were not affected)."
  - "NASA LDAS reports reprocessing of the global preliminary run for May 2023, Central Asia Noah 3.6 for 2023-05-22 to 06-25, and Central Asia Noah-MP for 2021-10-01 to 2023-03-25 and 2023-05-22 to 06-21 (no posting date shown). Re-download these periods if you obtained them earlier."
  - "The NASA LDAS FAQ still lists East, Southern and West Africa regional domains, but according to the GES DISC README the regional products were retired in 2019 and replaced by the global product."

