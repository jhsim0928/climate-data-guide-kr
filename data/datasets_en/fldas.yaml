    note: >-
      Global final FLDAS_NOAH01_C_GL_M, preliminary FLDAS_NOAH01_CP_GL_M, anomalies FLDAS_NOAH01_C_GL_MA, climatology FLDAS_NOAH01_C_GL_MC, and Central Asia daily FLDAS_NOAHMP001_G_CA_D,
      all version 001. A free Earthdata Login is required. The old server (hydro1.gesdisc.eosdis.nasa.gov) may close after 30 September 2026, so switch to data.gesdisc.earthdata.nasa.gov or earthaccess.
