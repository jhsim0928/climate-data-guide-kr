transitions:
  - from: FLDAS Central Asia Noah 3.6 daily (FLDAS_NOAH001_G_CA_D)
    to: FLDAS2 Central Asia Noah-MP daily (FLDAS_NOAHMP001_G_CA_D)
    status: completed
    date: "2023-10"
    summary: >-
      An FLDAS2 product rebuilt with Noah-MP 4.0.1 over the same domain, resolution and period (2000-10 onward) was released in November 2023; the Noah 3.6 daily product stopped updating
      on 1 October 2023 and was announced for decommissioning in March 2024. On 2026-10-13 the Noah 3.6 collection no longer appears in NASA CMR.
    changes:
      - aspect: Land surface model
        before: Noah 3.6
        after: Noah-MP 4.0.1 (FLDAS2, LIS-based)
      - aspect: Short name and DOI
        before: "FLDAS_NOAH001_G_CA_D (10.5067/VQ4CD3Y9YC0R)"
        after: "FLDAS_NOAHMP001_G_CA_D (10.5067/C4IOYF41EEZB)"
      - aspect: Variables
        before: "23"
        after: "27 — adds daily maximum and minimum surface radiative temperature (`RadT_tavg_max`, `RadT_tavg_min`), terrestrial water storage (`TWS_tavg`) and snow cover"
      - aspect: Domain, resolution, forcing
        before: "21–56°N, 30–100°E, 0.01°, GDAS"
        after: "Unchanged"
    impacts:
      - "Because the model differs, soil moisture and runoff differ even for the same dates. Do not splice the two into one series; download Noah-MP data from October 2000 instead."
      - "Anomaly indices for Central Asia are stated to use a 2000-10-01 to 2022-09-30 baseline (water years 2001–2022)."
    sources:
      - name: NASA LDAS — FLDAS Central Asia
        url: https://ldas.gsfc.nasa.gov/fldas/models/central-asia
      - name: README for FLDAS2 Noah-MP Central Asia
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS2.pdf
  - from: FLDAS Africa regional products (East, Southern, West Africa)
    to: FLDAS global product (0.1° monthly)
    status: completed
    date: "2019-11"
    summary: >-
      The separate East, Southern and West Africa monthly and daily products were retired in September–November 2019 and replaced by a quasi-global monthly product with the same Noah 0.1° configuration.
    changes:
      - aspect: Domain
        before: "East, Southern and West Africa regional grids"
        after: "Quasi-global, 60°S–90°N"
      - aspect: Products
        before: "Regional 'C' monthly (retired 2019-09-16); regional 'A' Noah and VIC daily and monthly (retired 2019-11-01)"
        after: "FLDAS_NOAH01_C_GL_M, MA, MC (Noah, monthly)"
      - aspect: Time step
        before: "Daily and monthly (regional 'A' at 0.1° and 0.25°)"
        after: "Monthly only (no African daily product)"
    impacts:
      - "Daily data for Africa are not available from the public GES DISC products. Work with the monthly data or contact FEWS NET or NASA LDAS."
    sources:
      - name: README for FLDAS
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf

notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC on-premises servers closing — FLDAS users must move to Earthdata Cloud
    body: >-
      GES DISC announced that HTTPS access to its on-premises servers ends by 30 September 2026 and that on-premises OPeNDAP is switched off between 20 August and 30 September.
      The hydro1.gesdisc.eosdis.nasa.gov server that hosts FLDAS states that access will end 'no earlier than 30 September 2026' (still responding on 2026-10-13).
      Point scripts to data.gesdisc.earthdata.nasa.gov or use earthaccess.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2023-11-07"
    level: warning
    title: Central Asia daily product replaced by Noah-MP (FLDAS2) — Noah 3.6 production ended
    body: >-
      Updates of the Central Asia Noah 3.6 daily product (FLDAS_NOAH001_G_CA_D) stopped on 1 October 2023, and it was announced for decommissioning in March 2024.
      The Noah-MP 4.0.1 daily product for the same domain (FLDAS_NOAHMP001_G_CA_D) was released on 7 November 2023; switch to it.
    source: https://ldas.gsfc.nasa.gov/fldas/models/central-asia
  - date: "2020-11"
    level: warning
    title: Inland-water mask post-processing — re-download data obtained before November 2020
    body: >-
      Some inland-water cells contained invalid model values, so all output was post-processed with the MODIS MOD44W land mask. Forcing variables (_f) were unchanged.
      Users who downloaded FLDAS data before November 2020 are asked to download it again.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf
  - date: "2019-11-01"
    level: info
    title: African regional products retired — replaced by the global product
    body: >-
      The regional 'C' monthly data were retired on 16 September 2019 and the regional 'A' Noah and VIC daily and monthly data on 1 November 2019. The README directs users to the global 0.1° monthly data.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf

