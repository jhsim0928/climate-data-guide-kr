transitions:
  - from: VIIRS LST V1 (VNP21 Collection 1)
    to: VIIRS LST V2
    status: completed
    date: "2023-06"
    summary: >-
      Calibration coefficients and geolocation were improved for the whole Suomi NPP mission, and NOAA-20 (VJ121), NOAA-21 (VJ221) and 0.05° CMG products were added. The atmospheric input changed from MERRA-2 to GEOS-5,
      and inland water bodies are now retrieved. Distribution of V1 ended on 8 April 2025.
    changes:
      - aspect: Calibration and geolocation
        before: V1 calibration
        after: "Improved calibration algorithm and coefficients for the whole Suomi NPP mission, better geolocation accuracy and fixes for outliers around manoeuvres"
      - aspect: Inputs
        before: "MERRA-2 atmospheric input, earlier cloud and land/water masks"
        after: "GEOS-5 atmospheric input, improved cloud mask (including coastline fixes), 8-class land/water mask from VNP03, corrected aerosol quantity flag over bright surfaces"
      - aspect: Retrieval coverage
        before: Land
        after: Inland water bodies included
      - aspect: Product set
        before: "Suomi NPP L2 and L3 tiles"
        after: "Suomi NPP, NOAA-20 (VJ1) and NOAA-21 (VJ2) + daily, 8-day and monthly 0.05° CMG"
    impacts:
      - Do not mix V1 and V2; download the full period again in V2 (V1 has not been distributed since 2025-04-08).
    sources:
      - name: VNP21A1D V002 collection description (version description)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp21a1d-002
      - name: VIIRS Version 1 SR, VI, LAI/FPAR, LST, Active Fires Data Products Decommissioned (2025-04-08)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned

notices:
  - date: "2026-08-03"
    level: critical
    title: Suomi NPP science data delivery ends 2 November 2026 — switch from VNP21 to VJ221 or VJ121
    body: >-
      NOAA NESDIS announced that delivery of all remaining Suomi NPP science data, including VIIRS, will permanently stop at 13:00 UTC on 2 November 2026 (the NASA Earthdata notice title says 1 November; the date may change).
      LP DAAC's VNP21 collection descriptions give the same end date and advise moving to the NOAA-21 (VJ221, primary) or NOAA-20 (VJ121, secondary) products.
    source: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
  - date: "2026-04-14"
    level: info
    title: NOAA-21 VIIRS land surface temperature (VJ221) V2 released
    body: >-
      LP DAAC expanded the VIIRS V2 land surface temperature and emissivity products to NOAA-21 (formerly JPSS-2). The VJ221 series covers data from 10 February 2023.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/additional-viirs-version-2-land-surface-temperature-emissivity-data-products
  - date: "2025-05-02"
    level: info
    title: Transition from MODIS to VIIRS — users encouraged to use similar VIIRS products
    body: >-
      NASA announced that Terra and Aqua will begin shutting down in late 2026 or early 2027 and encouraged MODIS users to explore similar VIIRS products. This VIIRS LST is the product that continues MODIS MOD21 land surface temperature.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2025-04-08"
    level: info
    title: VIIRS V1 land surface temperature products decommissioned — move to V2
    body: >-
      LP DAAC stopped distributing the VIIRS V1 surface reflectance, LAI/FPAR, land surface temperature and active fire products. They are no longer available in Earthdata Search, Data Pool or AppEEARS; user guides and ATBDs remain on the DOI landing pages.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned

