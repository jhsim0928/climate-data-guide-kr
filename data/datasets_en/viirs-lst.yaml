# ─────────────────────────────────────────────────────────────
# VIIRS land surface temperature and emissivity VNP21, VJ121 and VJ221 V2 — dataset information file
# Land tab (Land surface temperature & albedo). Successor to MODIS MOD21 (TES); the MODIS → VIIRS comparison lives in the transitions of modis-lst.yaml.
# Suomi NPP (VNP21) data delivery ends on 2026-11-02, so users need to move to NOAA-21 (VJ221) or NOAA-20 (VJ121).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: viirs-lst
name: "VIIRS LST (VNP21)"
full_name: VIIRS Land Surface Temperature and Emissivity VNP21 (Suomi NPP), VJ121 (NOAA-20) and VJ221 (NOAA-21) Version 2 (VIIRS TES 1 km day and night land surface temperature and 3-band emissivity)
category: satellite
domain: land
group: 지표면온도·알베도
order: 11
domains: [육지, 원격탐사]
provider: NASA JPL (Hulley, Hook) / NASA VIIRS Land Team / NASA LP DAAC

status: active
status_note: >-
  NOAA-20 (VJ121) and NOAA-21 (VJ221) data are produced normally every day (on 2026-10-13 VJ221A1D reached 11 October).
  However, NOAA has announced that delivery of all Suomi NPP science data ends at 13:00 UTC on 2 November 2026, so the VNP21 series will receive no new data after that.
  LP DAAC advises moving to the NOAA-21 (VJ221, primary) or NOAA-20 (VJ121, secondary) products. Maturity is Stage 1 Validation.

period:
  start: "2012-01"
  end: present
  note: >-
    Suomi NPP (VNP21) from 2012-01-17 (delivery scheduled to end on 2026-11-02), NOAA-20 (VJ121) from 2018-01-01, NOAA-21 (VJ221) from 2023-02-10 (monthly CMG from the 2023-02 period).
    VJ221 LST was released on 14 April 2026. The V2 collection was released on 29 June 2023, and distribution of the earlier V1 ended on 8 April 2025.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    L3 tiles: MODIS Sinusoidal (SIN) grid at 1 km (resampled from 750 m, 1200×1200 pixels per tile) — VNP21A1D/A1N/A2 /
    CMG: global 0.05° grid — VNP21C1/C2/C3 / L2 swath: 750 m at nadir (VNP21, 6-minute granules). NOAA-20 and NOAA-21 use the same grids (VJ121, VJ221)
  vertical: Single surface (skin) temperature layer + emissivity in the VIIRS thermal infrared bands M14 (8.55 µm), M15 (10.76 µm) and M16 (12 µm)
  temporal: >-
    Each satellite gives one daytime overpass (13:30 ascending orbit) and one nighttime overpass per day (several at high latitudes) / daily (A1D, A1N, C1) / 8-day (A2, C2) / monthly (C3)

update: Daily (1–2 days after observation); 8-day and monthly products after each period ends. No new Suomi NPP (VNP21) data after 2026-11-02
license: Openly shared without restriction under the NASA EOSDIS Data Use and Citation Guidance. Downloading requires a free NASA Earthdata Login; citation of the dataset DOI is requested.
account_required: true

summary: >-
  NASA's VIIRS land surface temperature product, which retrieves clear-sky land surface (skin) temperature together with emissivity from the VIIRS thermal infrared bands M14, M15 and M16.
  It uses the same temperature/emissivity separation (TES) algorithm, atmospheric inputs and water vapour scaling as MODIS MOD21 so as to continue the MODIS record, and the developers report agreement between the two sensors' LST within about ±0.5 K.
  There are Suomi NPP (VNP21), NOAA-20 (VJ121) and NOAA-21 (VJ221) versions, all on afternoon orbits crossing around 13:30, so they mainly take over from MODIS Aqua.
  Products come as daily and 8-day 1 km tiles and as daily, 8-day and monthly 0.05° global grids.

time_convention:
  summary: >-
    Daily products (A1D day, A1N night) are clear-sky observations at the overpass, computed as the coverage-weighted average of clear, good-quality observations that overlap the grid cell by more than 15% that day.
    The 8-day (A2) and monthly (C3) products average the clear-sky daily values in the period, leaving out cloudy days. Observation time varies by pixel and is given in the `View_Time` layers.
  points:
    - "Suomi NPP, NOAA-20 and NOAA-21 are all afternoon orbits crossing the equator around 13:30 local time ascending (day); night observations come from the opposite orbit leg. There is no observation at the time of MODIS Terra's morning (10:30) overpass."
    - "Even on the same afternoon orbit, the satellites' overpass times differ by 50 minutes to an hour. The VNP21 User's Guide reports a difference of about 0.5 K between VNP21 and VJ121 in August 2018 attributed to this timing difference (with negligible bias in January)."
    - "The 8-day product (A2) is a simple average of the daily A1D and A1N values; LST, QC, view angle and view time are averaged separately for day and night, and emissivity over day and night together."
    - "The User's Guide gives the view time in the CMG products (C1, C3) as UTC but does not state the time reference of `View_Time` in the 1 km tiles (A1, A2). Check the file attributes."
    - "Suomi NPP data stop after 2026-11-02. To extend a VNP21 time series, compare it with VJ121 or VJ221 over an overlap period before switching."
  source: https://lpdaac.usgs.gov/documents/1662/VNP21_User_Guide_V2.pdf
  source_name: "VNP21 Collection 2 User's Guide + VNP21A1D and VNP21A2 V002 collection descriptions (CMR)"

variables:
  note: >-
    Variables from the LP DAAC data catalog and the VNP21 Collection 2 User's Guide. Files are HDF-EOS5 (HDF5); physical value = stored value × scale_factor (+ offset).
    LST uses scale 0.02 (K) and stored value 0 is fill. VJ121 and VJ221 files use the same names. As with MOD21, contaminated pixels are not removed, so you must screen them with QC yourself.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp21a1d-002
  groups:
    - name: Daily 1 km (VNP21A1D day / VNP21A1N night; same for VJ121 and VJ221)
      kind: instant
      period: overpass time
      items:
        - text: "Land surface temperature — `LST_1KM` (K, scale 0.02)"
          std: [tskin]
          note: Separate day (A1D) and night (A1N) files. Coverage-weighted average of clear, good-accuracy observations overlapping the grid cell by more than 15%
        - "Band M14, M15 and M16 emissivity — `Emis_14`, `Emis_15`, `Emis_16` (dimensionless, scale 0.002, offset 0.49)"
        - text: "View time — `View_Time` (hours, scale 0.1)"
          note: Observation time of each pixel
        - "View zenith angle — `View_Angle` (degrees, offset -65)"
        - "Quality bits — `QC` (16 bits: mandatory QA, L1B data quality, cloud, TES iterations, atmospheric opacity, emissivity contrast, emissivity and LST accuracy)"
    - name: 8-day 1 km (VNP21A2, VJ121A2, VJ221A2)
      kind: mean
      period: 8 days (clear days only)
      items:
        - text: "8-day day and night land surface temperature — `LST_Day_1KM`, `LST_Night_1KM` (K, scale 0.02)"
          std: [tskin]
          note: Simple average of clear-sky A1D and A1N values
        - text: "8-day emissivity — `Emis_14`, `Emis_15`, `Emis_16` (dimensionless, scale 0.002, offset 0.49)"
          note: Averaged over day and night together
        - "Day and night view time — `View_Time_Day`, `View_Time_Night` (hours, scale 0.1)"
        - "Day and night view zenith angle — `View_Angle_Day`, `View_Angle_Night` (degrees)"
        - "Day and night quality bits — `QC_Day`, `QC_Night` (8-bit field)"
    - name: 0.05° global grid (VNP21C1 daily / C2 8-day / C3 monthly)
      kind: mean
      period: daily, 8-day, monthly
      items:
        - text: "Day and night land surface temperature — `LST_Day`, `LST_Night` (K, scale 0.02)"
          std: [tskin]
          note: C1 averages the qualifying L2 pixels of the day; C2 and C3 average the C1 daily values over 8 days or a month
        - "Day and night LST uncertainty — `LST_Day_err`, `LST_Night_err` (K, scale 0.04)"
        - text: "Day and night observation counts — `Count_Day`, `Count_Night`"
          kind: accum
          note: Number of observations that entered the average
    - name: Static information
      kind: static
      items:
        - "Land fraction in grid cell (CMG) — `Percent_land_in_grid` (%)"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2545314555-LPCLOUD
    method: HTTPS download / earthaccess / Earthdata Search
    note: >-
      Example short names: VNP21A1D, VNP21A1N, VNP21A2, VNP21C1, VNP21C2, VNP21C3, VNP21 (L2); replace VNP with VJ1 for NOAA-20 and VJ2 for NOAA-21. All are version 002.
      Files are served over HTTPS from data.lpdaac.earthdatacloud.nasa.gov and need a free Earthdata Login.
  - name: AppEEARS (area and point subsetting)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: Web / API — point time series and area extracts as GeoTIFF or NetCDF4
    note: Lets you request only the area, period and layers you need and reproject to geographic coordinates.
  - name: Direct access in AWS us-west-2 (S3)
    url: https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials
    method: Cloud storage (S3, from within us-west-2 only)
    note: Stored in Earthdata Cloud and readable directly from within us-west-2 with temporary credentials.

example:
  lang: python
  note: >-
    Downloads NOAA-20 VJ121A1D (daytime) daily files with earthaccess and opens them with h5py, locating variables by name rather than hard-coding the HDF-EOS5 path.
    Keeps only pixels whose mandatory QA (bits 0–1) is 00 (best) or 01 (nominal).
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="VJ121A1D", version="002",
        temporal=("2024-08-01", "2024-08-03"),
        bounding_box=(126.5, 37.0, 127.5, 38.0),   # (west, south, east, north) around Seoul
    )
    files = earthaccess.download(results, "vj121")

    def find(h5, name):
        hits = []
        h5.visititems(lambda path, obj: hits.append(path) if path.endswith("/" + name) else None)
        return h5[hits[0]][()]

    with h5py.File(files[0], "r") as f:
        lst = find(f, "LST_1KM").astype("float64")
        qc = find(f, "QC")

    good = (lst > 0) & ((qc & 0b11) <= 1)          # drop fill + keep mandatory QA 00 or 01
    lst_k = np.where(good, lst * 0.02, np.nan)      # K
    print(np.nanmean(lst_k) - 273.15)

tips:
  - "Suomi NPP data delivery ends at 13:00 UTC on 2 November 2026 (NOAA notice; the Earthdata notice title says 1 November). Start new analyses with NOAA-21 (VJ221) or NOAA-20 (VJ121)."
  - "VIIRS LST uses the same method as MOD21 (TES), so it continues MOD21 well, but it differs in algorithm from MOD11 (split-window) and can differ by several K over arid land."
  - "Like MOD21, contaminated pixels are not set to fill. Dust and undetected cloud over deserts can produce hot outliers, so screen with the QC bits, emissivity and error estimates together."
  - "Low emissivity does not always mean cloud. The User's Guide notes that real surfaces such as mafic rocks can have M15/M16 emissivity below 0.9."
  - "Mandatory QA bits 01 (nominal) mean 'usable with caution'. The 'poor' boundary of the LST accuracy bits differs by product: 2.5 K for L2 and 2 K for A1 and A2."
  - "The 1 km tiles are resampled from 750 m data. If you need the native 750 m resolution, use the L2 swath products (VNP21, VJ121, VJ221)."
  - "The three satellites' overpass times differ slightly, which can produce differences of around 0.5 K in summer. When combining satellites, process each one separately and then compare."
  - "LST is surface (skin) temperature, not 2 m air temperature. It is much higher than air temperature at midday and lower on clear nights."
  - "Files are HDF-EOS5 (HDF5). pyhdf code written for MODIS (HDF4) will not work; read them with h5py or xarray (h5netcdf)."

