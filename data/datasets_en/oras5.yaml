notices:
  - date: "2026-06-08"
    level: info
    title: New ORAS6 ocean reanalysis supporting forecasting and climate monitoring
    body: >-
      ECMWF announced ORAS6, its next ocean and sea-ice reanalysis (NEMO4/SI3, ensemble-based data assimilation, direct SST assimilation). Hourly 2D and daily 3D fields for
      1993 onward will be made available shortly to Member States and external collaborators, while the stream from 1950 is still in production. ORAS6 provides the ocean and
      sea-ice initial conditions for ERA6. No public release date or end of ORAS5 has been announced.
    source: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
  - date: "2026-04-27"
    level: info
    title: "New dataset published in CDS: ORAS5 global ocean reanalysis monthly time-series data from 1958 to present"
    body: >-
      The reanalysis-oras5-timeseries dataset is a post-processed version of CDS ORAS5 in Analysis Ready Cloud Optimised (ARCO, Zarr) format, designed for retrieving long
      time series at a single point efficiently. It is offered as a beta service.
    source: https://forum.ecmwf.int/t/new-dataset-published-in-cds-oras5-global-ocean-reanalysis-monthly-time-series-data-from-1958-to-present/14863
  - date: "2025-07-02"
    level: info
    title: CC-BY licence replaces the Licence to use Copernicus Products
    body: The "Licence to use Copernicus Products" on the CDS, ADS and EWDS was replaced by the Creative Commons Attribution licence (CC-BY). Downloads require acceptance of the new terms.
    source: https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464
  - date: "2024-09-26"
    level: critical
    title: Goodbye legacy Climate Data Store, hello new CDS — new account and API key required
    body: >-
      The legacy CDS was decommissioned and CDS-Beta became the new CDS. Existing ORAS5 download scripts need pip install --upgrade cdsapi and a new url and key in .cdsapirc to work.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380

