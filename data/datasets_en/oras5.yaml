# ─────────────────────────────────────────────────────────────
# ORAS5 — dataset information file
# After editing, update last_verified to the date checked on the official page.
# ─────────────────────────────────────────────────────────────
id: oras5
name: ORAS5
full_name: ECMWF Ocean Reanalysis System 5 (ORAS5)
category: reanalysis
domain: ocean
group: 재분석
order: 20
domains: [해양, 해빙]
provider: ECMWF / Copernicus Climate Change Service (C3S)

status: active
status_note: >-
  Updated monthly on the CDS and in regular production. Its successor, ORAS6, has been developed and provides the ocean and sea-ice initial conditions for ERA6,
  and in June 2026 ECMWF announced that ORAS6 data would be made available shortly. As of October 2026, however, no CDS release date for ORAS6 and no end date
  for ORAS5 updates have been announced.

transitions:
  - from: ORAS5
    to: ORAS6
    to_id: oras6
    status: planned
    summary: >-
      ECMWF's next ensemble reanalysis system for ocean and sea ice keeps the resolution (¼°, 75 levels) but changes the model (NEMO4/SI3), the atmospheric forcing
      (hourly ERA5) and the data assimilation (ensemble-based 3D-Var with direct SST assimilation). It provides the ocean and sea-ice boundary conditions for ERA6.
      As of June 2026 the 1993-onward period was to go first to ECMWF Member States and external collaborators; no CDS release date has been announced.
    changes:
      - aspect: Period
        before: "1958-01 to present (CDS)"
        after: "1950 to present (produced in parallel streams; the 1993-onward period completed first)"
      - aspect: Ocean and sea-ice model
        before: "NEMO v3.4 with the LIM2 sea-ice model"
        after: "NEMO v4 with SI3 (multi-category sea ice, prognostic ice salinity)"
      - aspect: Horizontal and vertical resolution
        before: "¼°, 75 levels"
        after: "¼°, 75 levels (unchanged)"
      - aspect: Atmospheric forcing
        before: "ERA-40/ERA-Interim (daily, 24-hour intervals); ECMWF operational analyses from 2015"
        after: "Hourly ERA5, with a new bulk flux formulation closer to the operational IFS"
      - aspect: Sea surface temperature
        before: "SST nudging"
        after: "Direct assimilation of reprocessed OSTIA L4 SST (much smaller SST biases, diurnal cycle captured)"
      - aspect: Sea-ice concentration observations
        before: "Gridded OSTIA L4 sea-ice concentration"
        after: "EUMETSAT OSI SAF sea-ice concentration climate data record (L3, OSI-450-a), with joint ocean–sea-ice minimization"
      - aspect: Altimetry assimilation
        before: "SLA limited to 50°S–50°N, excluding near-coastal data"
        after: "Reprocessed DUACS SLA, including high-latitude and coastal data"
      - aspect: Data assimilation
        before: "NEMOVAR 3D-Var FGAT"
        after: "Ensemble-based 3D-Var (hybrid background error covariance with flow-dependent errors from the ensemble)"
      - aspect: Ensemble
        before: "5 members (only 1 published on the CDS)"
        after: "11 members of ocean and sea-ice analyses"
      - aspect: Output format and frequency
        before: "Monthly mean NetCDF on the CDS"
        after: "GRIB2; hourly 2D and daily 3D fields planned first for the 1993-onward period (CDS format not yet decided)"
    impacts:
      - Even once ORAS6 is released, do not join it to ORAS5 as one time series. Forcing, model and assimilation all differ, so climatologies and trends may differ.
      - If you plan to analyse alongside ERA6, ORAS6 is the natural choice because it is consistent with ERA6's ocean boundary conditions.
      - The ECMWF Newsletter notes that Arctic sea ice can be biased thin in some regions, so validate against observations before using ORAS6 sea-ice thickness.
      - Release dates, distribution channels and variable names are not yet fixed, so do not assume existing ORAS5 download scripts will work unchanged.
    sources:
      - name: ECMWF Newsletter 180 — ECMWF's next ensemble reanalysis system for ocean and sea ice (2024)
        url: https://www.ecmwf.int/en/newsletter/180/earth-system-science/ecmwfs-next-ensemble-reanalysis-system-ocean-and-sea-ice
      - name: ECMWF news — New ORAS6 ocean reanalysis (2026-06-08)
        url: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
      - name: Browne et al. (2026) Sea ice data assimilation in ORAS6, The Cryosphere
        url: https://tc.copernicus.org/articles/20/3299/2026/
      - name: Zuo et al. (2019) ORAS5 system paper
        url: https://doi.org/10.5194/os-15-779-2019

period:
  start: "1958-01"
  end: present
  note: >-
    1958–2014 is the Consolidated product, forced by reanalysis atmospheric fields (ERA-40, ERA-Interim); 2015 onward is the Operational product, forced by ECMWF
    operational analyses. When checked on 2026-10-11, data were available through August 2026.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1개월"
  spatial: "Tripolar model grid, about 0.25° (about 25 km in the tropics and 9 km in the Arctic)"
  vertical: "75 ocean model levels (surface to about 5,500 m; about 1 m spacing near the surface)"
  temporal: Monthly mean

coverage:
  short: 전지구
update: Monthly, on about the 15th (Operational product, about 15 days behind real time)
license: CC-BY licence (Creative Commons Attribution 4.0)
account_required: true

summary: >-
  A global ocean and sea-ice reanalysis produced with ECMWF's OCEAN5 system, which couples the NEMO ocean model with the NEMOVAR (3D-Var FGAT) assimilation system to
  ingest subsurface temperature and salinity, sea-level anomalies and sea-ice concentration. The same system provides the ocean initial conditions for ECMWF seasonal
  forecasts. The CDS publishes monthly means from one of the five ensemble members.

time_convention:
  summary: >-
    The CDS provides only monthly mean ORAS5 data, so every ocean and sea-ice variable is the mean over the month. Heat and freshwater fluxes and wind stress are likewise
    monthly mean fluxes (per-second units), not accumulations.
  points:
    - "The CDS dataset description introduces the data as \"monthly mean data\"; there are no daily or 5-day means on the CDS."
    - "Fluxes are in W m-2, kg m-2 s-1 and N m-2, so multiply by the number of seconds in the month to get monthly totals."
    - "The CDS documentation does not state where in the month (first day or mid-month) the time stamp falls. Treat it as a label for the month and check the file attributes if you need day-level alignment."
    - "The official documentation does not say whether mixed layer depth, isotherm depths and heat content are computed from the monthly mean temperature field or averaged from higher-frequency values."
  source: https://cds.climate.copernicus.eu/datasets/reanalysis-oras5?tab=overview
  source_name: CDS ORAS5 dataset Overview

variables:
  note: >-
    Main variables from the CDS download form. Names in backticks are those used in CDS API requests; the variable names inside the downloaded NetCDF files may differ,
    so open a file to check.
  full_list: https://cds.climate.copernicus.eu/datasets/reanalysis-oras5?tab=overview
  groups:
    - name: 3D ocean (75 levels, vertical_resolution=all_levels)
      kind: mean
      period: Monthly
      items:
        - "Potential temperature — `potential_temperature` (°C)"
        - "Salinity — `salinity` (PSU)"
        - "Zonal velocity (model grid x-axis) — `zonal_velocity` (m/s)"
        - "Meridional velocity (model grid y-axis) — `meridional_velocity` (m/s)"
        - "Rotated zonal velocity (eastward) — `rotated_zonal_velocity` (m/s)"
        - "Rotated meridional velocity (northward) — `rotated_meridional_velocity` (m/s)"
    - name: Ocean single level (vertical_resolution=single_level)
      kind: mean
      period: Monthly
      items:
        - "Sea surface temperature — `sea_surface_temperature` (°C)"
        - "Sea surface salinity — `sea_surface_salinity` (PSU)"
        - "Sea surface height — `sea_surface_height` (m)"
        - "Mixed layer depth 0.01 — `mixed_layer_depth_0_01` (m)"
        - "Mixed layer depth 0.03 — `mixed_layer_depth_0_03` (m)"
        - "Depth of 20°C isotherm — `depth_of_20_c_isotherm` (m)"
        - "Ocean heat content for the upper 300 m — `ocean_heat_content_for_the_upper_300m` (J m-2)"
        - "Ocean heat content for the upper 700 m — `ocean_heat_content_for_the_upper_700m` (J m-2)"
        - "Ocean heat content for the total water column — `ocean_heat_content_for_the_total_water_column` (J m-2)"
    - name: Surface fluxes
      kind: mean
      period: Monthly
      items:
        - "Net downward heat flux — `net_downward_heat_flux` (W m-2)"
        - "Net upward water flux — `net_upward_water_flux` (kg m-2 s-1)"
        - "Zonal wind stress — `zonal_wind_stress` (N m-2)"
        - "Meridional wind stress — `meridional_wind_stress` (N m-2)"
    - name: Sea ice
      kind: mean
      period: Monthly
      items:
        - "Sea ice concentration — `sea_ice_concentration` (dimensionless)"
        - "Sea ice thickness — `sea_ice_thickness` (m)"
        - "Sea ice zonal velocity (model grid x-axis) — `sea_ice_zonal_velocity` (m/s)"
        - "Sea ice meridional velocity (model grid y-axis) — `sea_ice_meridional_velocity` (m/s)"

access:
  - name: Copernicus Climate Data Store (CDS) — reanalysis-oras5
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-oras5
    method: Web download / CDS API (cdsapi)
    note: Requires an ECMWF account and acceptance of the dataset licence (CC-BY).
  - name: CDS — ORAS5 monthly time-series (ARCO) dataset
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-oras5-timeseries
    method: Web download / CDS API / Zarr (beta)
    note: >-
      An experimental dataset released in April 2026, restructured for fast retrieval of long time series at a single point; it contains a subset of variables and can
      output CSV. Use the original dataset when you need full spatial fields.
  - name: Universität Hamburg ICDC (EASY-Init ORAS5 mirror)
    url: https://cen.uni-hamburg.de/icdc/data/ocean/easy-init-ocean/ecmwf-oras5.html
    method: Web download
    note: A separate mirror covering only some periods (e.g. 1979–2018). ICDC notes masking errors near coasts and the sea floor in the files interpolated to 1°, so use the native-resolution data.

example:
  lang: python
  note: "Put the CDS API URL and your personal key in ~/.cdsapirc before running. Request keys and values are taken from the CDS download form."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    request = {
        "product_type": ["consolidated"],   # use "operational" for 2015 onward
        "vertical_resolution": "single_level",
        "variable": ["sea_surface_temperature", "sea_surface_height"],
        "year": ["2010"],
        "month": ["01", "02", "03"],
    }

    client = cdsapi.Client()
    client.retrieve("reanalysis-oras5", request).download()  # saved under the server-assigned file name

tips:
  - 1958–2014 (Consolidated) and 2015 onward (Operational) use different atmospheric forcing and observations. For long records you must request both product_types, and allow for a possible discontinuity around 2015.
  - The data are on the tripolar model grid, so they cannot be overlaid directly on a latitude–longitude grid. Velocities come both along the model axes and rotated; use the rotated variables when you need eastward and northward components.
  - Post-2015 ORAS5 on the CDS uses different forcing and observations from the ORAS5 distributed by Copernicus Marine, so values can differ. State in your paper which source you used.

