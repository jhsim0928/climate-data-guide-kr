    url: https://catalogue.ceda.ac.uk/uuid/eade27004395466aaa006135e1b2ad1a/
    method: HTTP / OPeNDAP / FTP
    note: 1991-01-07 to 2020-12-31, both hemispheres. About 21,800 files (78 GB).
  - name: CEDA — CryoSat-2 Northern Hemisphere monthly thickness L3C v4.0
    url: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
    method: HTTP / OPeNDAP
    note: >-
      2010-10 to 2024-04, 99 files. The ERS-2, Envisat, Sentinel-3A/B, Southern Hemisphere and L2P records of v4.0 can be found in the CEDA author listing (Stefan Hendricks).
      The anonymous FTP link on the v4.0 record points to a different path (L2P/envisat/v3.0), so use the HTTP path.
  - name: ESA CCI Sea Ice project page (documents and products)
    url: https://climate.esa.int/en/projects/sea-ice/
    method: Web documentation
    note: PUGs, ATBDs and validation reports are on the Key Documents page. As of 2026-10-12, no v4.0 thickness documents have been posted.
  - name: C3S Climate Data Store — Sea ice thickness (operational data based on the CCI algorithm)
    url: https://cds.climate.copernicus.eu/datasets/satellite-sea-ice-thickness
    method: Web download / CDS API (ECMWF account required)
    note: >-
      The L3 thickness uses the algorithm developed in the ESA CCI Sea Ice project to join ERS-2, Envisat, CryoSat-2 and Sentinel-3 (October–April). The AMSR products of the concentration dataset
      (satellite-sea-ice-concentration) also originate from ESA CCI Phase 2 and are updated operationally. For recent years, use these or OSI SAF.

example:
  lang: python
  note: >-
    Assumes an HR-SIC v3 daily concentration file and a v4.0 monthly thickness file downloaded from CEDA. The concentration file name follows the pattern given in the PUG;
    the thickness file is found by the end of its name (…-YYYYMM-fv4p0.nc).
  code: |
    import glob
    import xarray as xr

    # Sea ice concentration HR-SIC v3 (12.5 km EASE2, Northern Hemisphere)
    sic = xr.open_dataset("ESACCI-SEAICE-L4-SICONC-RE_SSMI_12.5kmEASE2-NH-20200315-fv3.0.nc")
    c = sic["ice_conc"].squeeze()                      # %
    unc = sic["total_standard_uncertainty"].squeeze()  # %, 1 sigma

    # Sea ice thickness L3C v4.0 (CryoSat-2, Northern Hemisphere, monthly)
    f = sorted(glob.glob("ESACCI-SEAICE-L3C-SITHICK-*CRYOSAT2*-202003-fv4p0.nc"))[0]
    sit = xr.open_dataset(f)
    ok = sit["quality_flag"] <= 1                      # 0 nominal, 1 intermediate
    print(float(sit["sea_ice_thickness"].where(ok).mean()))
    print(float(sit["snow_depth"].where(ok).mean()))   # snow depth used in the retrieval (climatology)

tips:
  - >-
    The CCI concentration records are research records that end in 2017-05 (AMSR v2.1) and 2020-12 (HR-SIC v3). OSI SAF has taken over the AMSR-based record (SICCI-25km) as OSI-458
    (v3.0, "Research to Operations from ESA CCI") and extends it with OSI-438 and OSI-438-a, so if you need a series continued to recent years, use the data on the OSI SAF sea ice concentration page.
  - >-
    HR-SIC v3 is a pan-sharpened version of OSI-450-a (25 km) using the high-resolution near-90 GHz imagery. Four of its cells align exactly with one OSI-450-a cell, which makes the two easy to compare,
    but the usual limitations remain: melt ponds are seen as open water and the concentration of thin ice (under 30 cm) is underestimated, and this error is not included in the uncertainty variables (PUG).
  - >-
    The file attributes describe the v4.0 Southern Hemisphere thickness as an experimental record. Because the algorithm does not properly consider the impact of the complex snow morphology,
    thickness should be considered biased high in areas with deep snow and during the southern summer months, so do not use it directly for trend analysis.
  - >-
    CryoSat-2 thickness is available from AWI (v2.6), CCI (v4.0), CPOM and C3S, all from the same source data but with different processing and hence different values.
    Use one product and one version per analysis and record the version. The differences are summarized on this site's "CryoSat-2" page.
  - >-
    DOIs differ by product. Concentration (SICCI-25km/50km v2.1, HR-SIC v3, ESMR v1.1) and drift-aware thickness v1.0 have dataset DOIs, but the thickness v3.0 and v4.0 records do not,
    so cite them with the CEDA record's citation text and URL. Southern Hemisphere drift-aware thickness has only a CEDA record and is not yet published (checked 2026-10-12).

