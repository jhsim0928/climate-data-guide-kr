# ─────────────────────────────────────────────────────────────
# ESA CCI Sea Ice — dataset information file (English edition)
# ESA Sea Ice Climate Change Initiative (Sea_Ice_cci): sea ice concentration CDRs (SICCI-25km/50km v2.1, HR-SIC v3, ESMR v1.1) and
# sea ice thickness CDRs (L2P/L3C v4.0, drift-aware thickness v1.0)
# ─────────────────────────────────────────────────────────────
id: esa-cci-seaice
name: ESA CCI Sea Ice
full_name: ESA Sea Ice Climate Change Initiative (Sea_Ice_cci) — Sea Ice Concentration and Sea Ice Thickness Climate Data Records
category: satellite
domain: seaice
group: 위성 관측 자료
order: 50
domains: [해빙]
provider: European Space Agency (ESA) Climate Change Initiative (CCI) Sea Ice project — led by the Norwegian Meteorological Institute (MET Norway); thickness produced by AWI (Germany); distributed by CEDA (UK)

status: active
status_note: >-
  The project continues in the CCI+ phase. On 2025-11-20 sea ice thickness v4.0 (ERS-2, Envisat, CryoSat-2, Sentinel-3A/B, through 2024-04) was published at CEDA, superseding v3.0.
  The v4.0 records, however, are still in "Pending" status at CEDA, with no dataset DOI and no v4.0 user documentation (checked 2026-10-12).
  CCI releases research climate data records (CDRs) as versions rather than on a regular schedule; the operational continuation of the AMSR sea ice concentration record (SICCI-25km) has been taken over by EUMETSAT OSI SAF (OSI-458).

transitions:
  - from: ESA CCI sea ice thickness v3.0 (released 2024-04)
    to: ESA CCI sea ice thickness v4.0 (released 2025-11)
    status: completed
    date: "2025-11"
    summary: >-
      The sea ice thickness climate data record moved from v3.0 to v4.0, adding ERS-2 (Northern Hemisphere) and Sentinel-3A/B and extending the record to 2024-04.
      The v3.0 CEDA records are now marked "This dataset has been superseded", while v4.0 has been published with "Pending" status and as yet no DOI or documentation.
    changes:
      - aspect: Satellites (altimeters)
        before: "Envisat, CryoSat-2"
        after: "ERS-2 (Northern Hemisphere only), Envisat, CryoSat-2, Sentinel-3A, Sentinel-3B"
      - aspect: Northern Hemisphere monthly grids (L3C), periods
        before: "Envisat 2002-10 to 2012-03, CryoSat-2 2010-11 to 2020-04"
        after: "ERS-2 1995-10 to 2003-04, Envisat 2002-10 to 2012-03, CryoSat-2 2010-10 to 2024-04, Sentinel-3A 2016-10 to 2024-04, Sentinel-3B 2018-11 to 2024-04"
      - aspect: Southern Hemisphere monthly grids (L3C)
        before: "Envisat 2002-10 to 2012-03, CryoSat-2 2010-11 to 2020-04"
        after: "Envisat 2002-10 to 2012-03, CryoSat-2 2010-11 to 2024-04, Sentinel-3A and 3B added"
      - aspect: Version tag in file names
        before: "…-fv3p0.nc"
        after: "…-fv4p0.nc (per the v4.0 output definitions in AWI's production code pysiral)"
      - aspect: Documentation
        before: "PUG and ATBD Issue 3.2 (Zenodo DOIs 10.5281/zenodo.10605998, 10.5281/zenodo.10605840)"
        after: "No public location found for a v4.0 PUG or ATBD (not on the CEDA records or the ESA Key Documents page)"
      - aspect: CEDA record status and citation
        before: "Completed (now superseded), no dataset DOI — cite via the CEDA catalogue URL"
        after: "Pending, no dataset DOI — cite via the CEDA catalogue URL"
    impacts:
      - Do not mix v3.0 and v4.0 in one time series. If you need CryoSat-2 data after 2020-05, the safest option is to download the whole period again as v4.0.
      - Until v4.0 has formal documentation and a DOI, give the download date, the CEDA catalogue URL and the file's product_version attribute in papers, and check again whether a DOI has been issued.
      - Sentinel-3 and CryoSat-2 differ in orbit and sensor, so values differ even for the same month. Before combining satellites, check their differences over the overlap period (from 2016-10).
    sources:
      - name: CEDA — CryoSat-2 Northern Hemisphere L3C v4.0
        url: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
      - name: CEDA — CryoSat-2 Northern Hemisphere L3C v3.0 (superseded)
        url: https://catalogue.ceda.ac.uk/uuid/45b5b1e556da448089e2b57452f277f5/
      - name: CEDA — ERS-2 Northern Hemisphere L3C v4.0
        url: https://catalogue.ceda.ac.uk/uuid/dfc03980decc4e50b111d5981358930e/
      - name: CEDA — records by Stefan Hendricks (all of v2.0–v4.0)
        url: https://catalogue.ceda.ac.uk/record/party/2383
      - name: CCI+ Sea Ice Thickness PUG Issue 3.2 (v3.0)
        url: https://doi.org/10.5281/zenodo.10605998

period:
  start: "1972-12"
  end: "2024-04"
  note: >-
    Periods differ by product (whole CEDA collection 1972-12-11 to 2024-04-30). Sea ice concentration: Nimbus-5 ESMR v1.1 1972-12-11 to 1977-05-11;
    HR-SIC v3 (SSM/I, SSMIS) 1991-01-07 to 2020-12-31; AMSR v2.1 (SICCI-25km, 50km) 2002-06-01 to 2017-05-15 (gap between the end of AMSR-E in 2011-10 and the start of AMSR2 in 2012-07).
    Sea ice thickness v4.0 Northern Hemisphere monthly grids run from ERS-2 in 1995-10 to CryoSat-2 and Sentinel-3 in 2024-04 (Northern Hemisphere October–April only);
    the Southern Hemisphere CryoSat-2 monthly grids cover 2010-11 to 2024-04. Drift-aware thickness v1.0 covers the Northern Hemisphere: Envisat 2002-10 to 2012-03 and CryoSat-2 2010-11 to 2020-04.
    As checked on 2026-10-12, the most recent data are thickness v4.0 for 2024-04.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    Sea ice concentration: AMSR v2.1 on EASE2 grids (Lambert Azimuthal Equal Area, WGS 84, central meridian 0°, separate Northern and Southern Hemisphere grids) — SICCI-25km 25 km, 432 × 432; SICCI-50km 50 km, 216 × 216 /
    HR-SIC v3 on a 12.5 km EASE2 grid (extent ±5400 km, exactly aligned within the 25 km grid of OSI-450-a, four cells per OSI-450-a cell) / ESMR v1.1 on a 25 km EASE2 daily grid.
    Sea ice thickness: monthly grids (L3C) on the 25 km EASE-Grid 2.0 North (EPSG:6931, 432 × 432) for the Northern Hemisphere and EASE-Grid 2.0 South (EPSG:6932; grid spacing not stated in the official records) for the Southern Hemisphere /
    trajectory data (L2P) at satellite measurement points / drift-aware thickness on EASE-Grid 2.0 North (25 km according to the paper)
  vertical: Not applicable (two-dimensional surface fields)
  temporal: Sea ice concentration daily / sea ice thickness monthly (L3C) and daily trajectory files (L2P) / drift-aware thickness daily (October–April)

update: >-
  No regular updates — new versions of the climate data records are released in each project phase (CEDA update frequency "Not Planned").
  The latest release is sea ice thickness v4.0 (2025-11-20). For concentration continued to recent years, use OSI SAF (OSI-458, OSI-438) or the C3S CDS; for thickness, use the C3S CDS.
license: >-
  ESA CCI Sea Ice Terms and Conditions — the data can be used by anyone for any purpose (CEDA permitted use "Any"). Publications must acknowledge "the ESA Climate Change Initiative and the Sea Ice CCI project"
  and the data providers, and cite the dataset DOI (or the CEDA citation where there is none). No Creative Commons licence is specified
account_required: false

summary: >-
  A set of research climate data records (CDRs) from the ESA Climate Change Initiative (CCI) Sea Ice project. Sea ice concentration comes as SICCI-25km and SICCI-50km (v2.1) from AMSR-E/AMSR2;
  HR-SIC (v3), a 12.5 km record that sharpens SSM/I and SSMIS data with their near-90 GHz imagery; and Nimbus-5 ESMR (v1.1) from the 1970s.
  Sea ice thickness comes as trajectory (L2P) and monthly gridded (L3C) data (v4.0) derived from ERS-2, Envisat, CryoSat-2 and Sentinel-3 radar altimeter freeboard, plus daily drift-aware thickness (v1.0) that accounts for ice motion.
  The concentration records have been developed jointly with EUMETSAT OSI SAF using the same algorithms and formats (OSI-450, OSI-458), and the thickness algorithm, coordinated with C3S, underlies the C3S CDS sea ice thickness product.

time_convention:
  summary: >-
    Sea ice concentration fields are daily composites of passive microwave observations (the file-name date is the central date of the analysis), and sea ice thickness monthly grids (L3C) are averages of all trajectory measurements
    that passed through each grid cell during the month. Only the trajectory data (L2P) are values at the time of measurement.
  points:
    - "HR-SIC v3 files are named by the central date of the analysis (e.g. …-NH-19911202-fv3.0.nc). Days with no product fall mostly in 1991, when only one SSM/I mission with near-90 GHz imagery (F10) was available (PUG Appendix A)."
    - "Use `status_flag` in the concentration files to identify spatially or temporally interpolated cells. Interpolated values should be used with caution, and the uncertainty variables are not interpolated where data were missing (HR-SIC PUG)."
    - "ESMR v1.1 has files only for days with observations. There is a large gap from 1975-06-03 to 1975-08-25, after which observations are available only about every second day (ESMR PUG)."
    - "Thickness L3C averages one month of L2P measurements per grid cell (at least two valid measurements). The Northern Hemisphere covers October–April only; the Southern Hemisphere is produced for every month but is an experimental record."
    - "The snow depth used for thickness is a climatology, not an observation — the Warren climatology (reduced by 50% over first-year ice) in the Northern Hemisphere and an AMSR-E/AMSR2-based snow depth climatology in the Southern Hemisphere (pysiral v4.0 output definitions)."
    - "Drift-aware thickness v1.0 consists of daily maps made by moving a month of altimeter measurements along with the sea ice drift each day, so it differs in nature from an ordinary L3C monthly mean for the same date."
  source: https://climate.esa.int/documents/2133/SeaIce_CCI_P1_PUG-HRSIC_D4.2_Issue_3.0.pdf
  source_name: HR-SIC PUG Issue 3.0 · ESMR PUG Issue 1.1 · CEDA catalogue records · AWI pysiral v4.0 L3C output and processing definitions

variables:
  note: >-
    Concentration variable names are from the CEDA catalogue (AMSR v2.1, HR-SIC v3) and the HR-SIC PUG; thickness names are from the variable list of the CEDA v4.0 L3C records.
    Uncertainty variables are named `*_standard_error` in AMSR v2.1 and ESMR v1.1 but `*_standard_uncertainty` in HR-SIC v3.
  full_list: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
  groups:
    - name: Sea ice concentration (AMSR v2.1, HR-SIC v3)
      kind: mean
      period: Day
      items:
        - text: "Sea ice concentration (filtered) — `ice_conc` (%)"
          note: Main variable
        - text: "Unfiltered concentration — `raw_ice_conc_values` (%)"
          note: Present only where the filters changed the value; can contain values below 0% or above 100%
        - text: "Total standard uncertainty (1 sigma) — `total_standard_uncertainty` (HR-SIC v3) / `total_standard_error` (AMSR v2.1) (%)"
          note: The algorithm (`algorithm_standard_*`) and smearing (`smearing_standard_*`) components are also provided
        - text: "Status flag (bit array: land/lake, open-water filter, interpolation, etc.) — `status_flag` (code)"
    - name: Sea ice thickness monthly grids (L3C v4.0)
      kind: mean
      period: Month
      items:
        - "Sea ice thickness — `sea_ice_thickness` (m)"
        - "Uncertainty associated with sea ice thickness — `sea_ice_thickness_uncertainty` (m)"
        - "Sea ice freeboard — `sea_ice_freeboard` (m)"
        - text: "Radar freeboard — `radar_freeboard` (m)"
          note: Before the snow propagation correction. Uncertainty in `radar_freeboard_uncertainty`
        - text: "Thickness of the snow layer — `snow_depth` (m)"
          note: Monthly mean of the climatology used in the thickness retrieval. Uncertainty in `snow_depth_uncertainty`
        - "Sea ice concentration — `sea_ice_concentration` (percent)"
        - text: "Sea Ice Thickness Quality Flag (0 nominal, 1 intermediate, 2 low quality, 3 no data) — `quality_flag` (1)"
        - text: "Sea Ice Thickness Status Flag (0 nominal retrieval, 1 no data, 2 open ocean, 3 satellite pole hole, 4 land/lake/land ice, 5 retrieval failed) — `status_flag` (1)"
    - name: Fixed information
      kind: static
      items:
        - text: "Region code — `region_code` (1)"
          note: Northern Hemisphere uses the NSIDC regional mask (Stewart and Meier); Southern Hemisphere uses Antarctic seas defined by longitude range (Parkinson and Cavalieri 2012)

