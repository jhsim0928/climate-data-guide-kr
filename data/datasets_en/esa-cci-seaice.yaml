notices:
  - date: "2025-12-02"
    level: info
    title: Online access to sea ice thickness v3.0 restored
    body: >-
      Sea ice thickness v3.0 (Envisat and CryoSat-2 L2P/L3C), which had been temporarily unavailable for download from the CEDA archive since the v4.0 release on 2025-11-20, became available online again on 2025-12-02.
      v3.0 has been superseded by v4.0.
    source: https://catalogue.ceda.ac.uk/uuid/45b5b1e556da448089e2b57452f277f5/
  - date: "2025-11-20"
    level: warning
    title: Sea ice thickness v4.0 published — supersedes v3.0; no DOI or documentation yet (Pending)
    body: >-
      L2P and L3C v4.0 data for both hemispheres from ERS-2, Envisat, CryoSat-2 and Sentinel-3A/B were published at CEDA, and the v3.0 records were marked as superseded.
      CryoSat-2 and Sentinel-3 data run to 2024-04. The v4.0 records are in "Pending" status, with no dataset DOI or v4.0 user documentation yet (checked 2026-10-12).
    source: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
  - date: "2025-05-21"
    level: info
    title: Drift-aware sea ice thickness v1.0 published (Northern Hemisphere, Envisat and CryoSat-2)
    body: >-
      Daily drift-aware freeboard and thickness maps for the Northern Hemisphere, made by moving altimeter measurements over a month with passive-microwave sea ice drift, were published —
      CryoSat-2 2010-11 to 2020-04 (DOI 10.5285/c7cd8115391340638bdd9adb0fbf28e9) and Envisat 2002-10 to 2012-03 (DOI 10.5285/97791d46330b42838af744301c74a9fb).
      The method paper appeared in The Cryosphere on 2025-09-16 (doi:10.5194/tc-19-3785-2025).
    source: https://catalogue.ceda.ac.uk/uuid/c7cd8115391340638bdd9adb0fbf28e9/
  - date: "2025-03-10"
    level: info
    title: Nimbus-5 ESMR sea ice concentration v1.1 published (supersedes v1.0)
    body: >-
      The second version (v1.1, 25 km) of the 1972-12 to 1977-05 Nimbus-5 ESMR single-channel (19.35 GHz) sea ice concentration was published with DOI 10.5285/8978580336864f6d8282656d58771b32,
      replacing v1.0 (10.5285/34a15b96f1134d9e95b9e486d74e49cf). ESA reports that algorithm improvements substantially increased the quality and quantity of the data.
    source: https://catalogue.ceda.ac.uk/uuid/8978580336864f6d8282656d58771b32/
  - date: "2023-05-11"
    level: info
    title: HR-SIC v3 (12.5 km SSM/I and SSMIS sea ice concentration) published
    body: >-
      A 1991–2020 sea ice concentration climate data record at 12.5 km, pan-sharpening OSI-450-a with near-90 GHz imagery, was published with DOI 10.5285/eade27004395466aaa006135e1b2ad1a.
    source: https://catalogue.ceda.ac.uk/uuid/eade27004395466aaa006135e1b2ad1a/

