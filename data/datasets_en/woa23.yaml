notices:
  - date: "2026-10-02"
    level: warning
    title: "NCEI Data Access Delays (cloud migration, planned through 2026-10-30)"
    body: >-
      NCEI is moving its data and applications to the cloud, which may result in temporary data access delays. The same notice appears on the
      World Ocean Atlas product page. If a download fails, try the THREDDS catalogue and the HTTPS directory in turn.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2024-05-30"
    level: info
    title: Dissolved oxygen, AOU and percent oxygen saturation updated to version 1.1
    body: >-
      The WOA23 oxygen climatologies were updated from v1.0 (February 2024) to version 1.1 after a small adjustment to the profiling float O2 data.
      The Volume 3 document (Garcia et al. 2024) was updated with an errata (the NCEI archive metadata records the revision as published on 2024-06-15). Re-download any oxygen files obtained earlier.
    source: https://www.ncei.noaa.gov/products/world-ocean-atlas
  - date: "2024-02-14"
    level: info
    title: Full WOA23 released (replaces WOA18)
    body: >-
      The full WOA23 was released: temperature and salinity for each decade, the three climate normals and the 1955–2022 average, plus oxygen fields and nutrients (1965–2022).
      The 1991–2020 temperature and salinity normals first released in October 2022 were updated at the same time, so re-download them if you have the preliminary version.
    source: https://www.ncei.noaa.gov/products/world-ocean-atlas
  - date: "2022-10"
    level: info
    title: Initial WOA23 release — 1991–2020 temperature and salinity normals
    body: WOA23 was initially released in October 2022 with 1991–2020 climate normals for global ocean temperature and salinity, ahead of the full release. This preliminary release was updated with the full release in February 2024.
    source: https://www.ncei.noaa.gov/products/world-ocean-atlas

