# ─────────────────────────────────────────────────────────────
# WOA23 — dataset information file (English edition)
# NOAA NCEI World Ocean Atlas 2023 (temperature, salinity, dissolved oxygen and nutrient climatologies)
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: woa23
name: WOA23
full_name: World Ocean Atlas 2023
category: analysis
domain: ocean
group: 수온·염분 분석장
order: 20
domains: [해양]
provider: NOAA National Centers for Environmental Information (NCEI) Ocean Climate Laboratory

status: active
status_note: >-
  The current version, fully released on February 14, 2024. It is a set of fixed-period climatologies, not a monthly-updated product;
  only the oxygen fields were revised (to v1.1) in May–June 2024. As of October 2026, NCEI has posted a notice of temporary data access delays due to its cloud migration.

transitions:
  - from: WOA18
    to: WOA23
    status: completed
    date: "2024-02"
    summary: >-
      The successor to WOA18, built from the observations added to the World Ocean Database since then and updated quality control. Temperature and salinity now extend
      to 2022 instead of 2017, 1971–2000 and 1991–2020 climate normals were added, and new objectively analyzed standard deviation and standard error of the analysis fields are included.
      Density, conductivity and mixed layer depth, which were on the WOA18 data page, are not in the WOA23 variable list.
    changes:
      - aspect: Temperature and salinity decades
        before: "Five decades 1955–1964 to 1995–2004, plus 2005–2017 (A5B7)"
        after: "Six decades 1955–1964 to 2005–2014, plus 2015–2022 (B5C2, an 8-year \"decade\")"
      - aspect: Climate normals
        before: "1981–2010 (per WOA18 Product Documentation)"
        after: "1971–2000 (decav71A0), 1981–2010 (decav81B0), 1991–2020 (decav91C0)"
      - aspect: All-decade average (decav)
        before: "1955–2017 (average of six decadal climatologies; NCEI FAQ)"
        after: "1955–2022 (average of seven decadal climatologies)"
      - aspect: Oxygen and nutrient period
        before: "all (all available years)"
        after: "all = 1965–2022; oxygen fields also provided for 1971–2000 (decav71A0)"
      - aspect: Variables provided
        before: "Temperature, salinity, density, conductivity, mixed layer depth, dissolved oxygen, percent oxygen saturation, AOU, silicate, phosphate, nitrate (WOA18 data page)"
        after: "Temperature, salinity, dissolved oxygen, percent oxygen saturation, AOU, silicate, phosphate, nitrate (WOA23 data page — no density, conductivity or mixed layer depth)"
      - aspect: Statistical fields
        before: "an, mn, dd, sd, se, oa, gp, ma, etc."
        after: "Adds objectively analyzed standard deviation and standard error of the analysis (using a second radius of influence of 669 km at 1° and 267 km at 0.25°)"
    impacts:
      - "Periods with the same name (e.g. decav) cover different years in WOA18 and WOA23. Check the years before switching a model initial state or an anomaly baseline."
      - "WOA23 has no density, conductivity or mixed layer depth files. Compute them from WOA23 temperature and salinity, or keep using WOA18 for those fields."
      - "Added observations and QC changes mean values can differ even for the same period. Do not mix the two versions and read the difference as a real change."
    sources:
      - name: NCEI World Ocean Atlas product page
        url: https://www.ncei.noaa.gov/products/world-ocean-atlas
      - name: WOA23 Product Documentation (Reagan et al. 2023)
        url: https://doi.org/10.25923/a78k-gq49
      - name: WOA18 Product Documentation
        url: http://www.ncei.noaa.gov/sites/default/files/2020-04/woa18documentation.pdf
      - name: WOA18 data access page
        url: https://www.ncei.noaa.gov/access/world-ocean-atlas-2018/

period:
  start: "1955-01"
  end: "2022-12"
  note: >-
    This is the period of the input observations. Temperature and salinity climatologies (by decade and by climate normal) use 1955–2022; dissolved oxygen
    and nutrient climatologies use all data for 1965–2022. The product is a static set of fixed-period mean states, not a continuous time series;
    the NCEI metadata gives the temporal extent as 1955-01-01 to 2022-12-31.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1개월"
  spatial: >-
    Temperature and salinity: one-degree (360 × 180) and quarter-degree (1440 × 720) latitude–longitude grids / dissolved oxygen, AOU, percent oxygen saturation
    and inorganic nutrients: one-degree only / five-degree (72 × 36) all-data statistical fields (not objectively analyzed climatologies)
  vertical: >-
    102 standard depth levels (0–5500 m). Monthly fields extend to 1500 m (57 levels) for temperature, salinity and oxygen, and to 800 m (43 levels) for nutrients.
    Seasonal fields: temperature and salinity 0–5500 m (102 levels), oxygen 0–1500 m (57 levels), nutrients 0–800 m (43 levels)
  temporal: >-
    Climatologies — annual (00), monthly (01–12) and seasonal (13 Northern Hemisphere winter, January–March; 14 spring, April–June; 15 summer, July–September; 16 autumn, October–December).
    Quarter-degree monthly fields exist only for 2005–2014, 2015–2022 and the three climate normals (decav71A0, decav81B0, decav91C0)

coverage:
  short: 전지구
update: No regular updates (new editions every few years — WOA18 on 2018-09-30, WOA23 on 2024-02-14)
license: >-
  US Government public data — freely available with no separate licence statement (the NCEI metadata only disclaims any warranty of accuracy).
  Please cite the dataset DOI and the Atlas volume for each variable you use
account_required: false

summary: >-
  The World Ocean Atlas 2023 (WOA23) is a set of objectively analyzed, quality-controlled climatological fields of temperature, salinity, oxygen, phosphate,
  silicate and nitrate, built by NOAA NCEI from profile data in the World Ocean Database 2023 (WOD23). Temperature and salinity are provided on 0.25° and 1° grids
  for seven decades in 1955–2022 and for the 1971–2000, 1981–2010 and 1991–2020 climate normals; oxygen, AOU, percent oxygen saturation and nutrients are on a 1° grid.
  It is the most widely used reference for ocean model initial and boundary conditions, anomaly baselines, and the verification of models and satellite products.

time_convention:
  summary: >-
    Every value is a climatological mean over a fixed multi-year period (a decade or a 30-year normal). A monthly field is the mean of that calendar month over all years
    in the period, a seasonal field covers a three-month block, and an annual field represents the whole year; none of them is a value for a specific year or time.
  points:
    - "Each file has a single time step, with time as a nominal value in \"months since 1955-01-01 00:00:00\". The actual averaging period is given by `climatology_bounds` and by the period code in the file name (e.g. decav91C0 = 1991–2020) (Product Documentation)."
    - "Below 1500 m, the annual field is defined as the average of the four seasonal analyses (Volume 1). Monthly fields only go down to 1500 m (800 m for nutrients)."
    - "Seasons 13–16 are Northern Hemisphere seasons (13 = January–March). In Southern Hemisphere work, remember that the season names are reversed."
    - "decav (no suffix) is the average of the seven decadal climatologies for 1955–2022, which is not the same as averaging all 1955–2022 observations together."
  source: https://doi.org/10.25923/a78k-gq49
  source_name: WOA23 Product Documentation (Reagan et al. 2023) · WOA23 Volume 1

variables:
  note: >-
    Based on the WOA23 data access page and the Product Documentation. File names follow woa23_[period]_[variable code][time code]_[grid].nc (e.g. woa23_decav91C0_t00_01.nc),
    and in-file variables follow `[variable code]_[field code]` (e.g. `t_an`). Variable codes: temperature t, salinity s, dissolved oxygen o, nitrate n, phosphate p, silicate i.
    Percent oxygen saturation uses code O and AOU uses code A (e.g. `O_an`, `A_an`).
  full_list: https://www.ncei.noaa.gov/access/world-ocean-atlas-2023/
  groups:
    - name: Objectively analyzed climatologies (main fields, `*_an`)
      kind: mean
      period: Climatological (annual, seasonal, monthly)
      items:
        - "Temperature — `t_an` (°C)"
        - "Salinity (practical salinity) — `s_an` (unitless)"
        - "Dissolved oxygen — `o_an` (µmol/kg)"
        - text: "Percent oxygen saturation and apparent oxygen utilization (AOU) — `O_an` (%), `A_an` (µmol/kg)"
          note: "Files woa23_all_O… (oxygen saturation) and woa23_all_A… (AOU)"
        - "Nitrate, phosphate and silicate — `n_an`, `p_an`, `i_an` (µmol/kg)"
    - name: Statistical fields (temperature shown; other variables follow the same pattern)
      kind: mean
      period: Climatological (annual, seasonal, monthly)
      items:
        - text: "Statistical mean (simple mean of values passing QC) — `t_mn` (°C)"
          note: "Shown for temperature (t_); other variables use their own units"
        - text: "Number of observations — `t_dd` (count)"
          note: Number of observations passing QC in that period and grid box. Zero means the grid-box value was filled from surrounding observations
        - text: "Standard deviation and standard error of the statistical mean — `t_sd`, `t_se` (°C)"
          note: "Shown for temperature (t_); other variables use their own units"
        - text: "Difference from the objective analysis and from the annual climatology — `t_oa`, `t_ma` (°C)"
          note: "`t_oa` = statistical mean minus objectively analyzed climatology; `t_ma` = seasonal or monthly minus annual climatology (seasonal and monthly files only). Shown for temperature (t_)"
        - "Number of 1° grid squares with statistical means within the smallest radius of influence — `t_gp` (count)"
    - name: Masks (WOA23/MASKS)
      kind: static
      items:
        - "Basin, land–sea and mixnumber masks — *.msk text files, 1° and 0.25° (code)"

