example:
  lang: python
  note: Downloads the 1° annual temperature file for the 1991–2020 normal (about 80 MB) and looks at the surface values.
  code: |
    # pip install xarray netCDF4 requests
    import requests
    import xarray as xr

    url = ("https://www.ncei.noaa.gov/data/oceans/woa/WOA23/DATA/temperature/netcdf/"
           "decav91C0/1.00/woa23_decav91C0_t00_01.nc")
    with open("woa23_decav91C0_t00_01.nc", "wb") as f:
        f.write(requests.get(url, timeout=600).content)

    # time is in 'months since 1955-01-01', which may not decode automatically, so turn decoding off
    ds = xr.open_dataset("woa23_decav91C0_t00_01.nc", decode_times=False)
    sst_clim = ds["t_an"].isel(time=0).sel(depth=0)
    print(sst_clim.sel(lat=slice(30, 45), lon=slice(120, 135)).mean().values)

tips:
  - >-
    Always check the period code in the file name. decav (average of the seven 1955–2022 decades), decav71A0/decav81B0/decav91C0 (30-year normals),
    5564 to B5C2 (individual decades) and all (1965–2022 for oxygen and nutrients) are different products. For anomaly baselines, a climate normal such as decav91C0 is the usual choice.
  - >-
    `t_an` is filled where there are no observations, using nearby data and the first-guess field. In data-sparse regions, at depth and in the early decades,
    read it together with `t_dd` (number of observations). The new objectively analyzed standard deviation and standard error of the analysis fields are also useful here.
  - >-
    Monthly fields stop at 1500 m (800 m for nutrients); use seasonal or annual fields below that. Quarter-degree monthly fields exist only for the decades from 2005 and the three normals.
  - >-
    The temperature data include the Cheng et al. (2014) XBT corrections and MBT corrections following Levitus et al. (2009) (Volume 1).
    Keep this in mind when comparing with products that use other bias corrections, such as EN4.
  - >-
    The density, conductivity and mixed layer depth climatologies available in WOA18 are not on the WOA23 data page. If you need them, compute them from WOA23
    temperature and salinity, or use WOA18 and cite it as the source.

