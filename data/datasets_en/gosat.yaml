notices:
  - date: "2026-10-14"
    level: info
    title: "Announcement of Service Downtime (November 2, 2026) — GOSAT-GW TANSO-3 Product Archive (G3PA), 01:00–05:30 UTC"
    body: >-
      The G3PA service will be down from 1:00 to 5:30 UTC on Monday, 2 November 2026, and you will not be able to access G3PA during this period.
      The downtime may change; users will be informed separately if urgent maintenance occurs.
    source: https://product.gosat-gw.nies.go.jp/en/news/detail/?newsid=21
  - date: "2026-10-13"
    level: warning
    title: GOSAT-GW TANSO-3 Band 3 maintenance — new L1B paused from 2026-10-19, resuming around February 2027
    body: >-
      Because of TANSO-3 Band 3 maintenance (about 19 October to 19 November 2026), delivery of new L1B products stops from about 00:40 UTC on 19 October 2026 and is scheduled to resume around February 2027.
      A service-downtime notice for the TANSO-3 Product Archive (22–29 October) was posted the same day.
    source: https://product.gosat-gw.nies.go.jp/en/news/detail/?newsid=19
  - date: "2026-09-29"
    level: info
    title: GOSAT-2 FTS-2 observations suspended (2026-09-22 to 09-27)
    body: >-
      GOSAT-2 FTS-2 stopped observing during the 15:00 UT hour on 22 September 2026 and resumed at 00:37 UT on 27 September. No products are provided for 2026-09-22 15:32:30 to 09-27 00:37:12 UT.
    source: https://www.eorc.jaxa.jp/GOSAT/index.html
  - date: "2026-08"
    level: warning
    title: GOSAT-2 FTS-2 SWIR L2 V02.30 released to general users — Band 1 bias after 2024 not corrected
    body: >-
      V02.30 keeps the algorithm and file format and updates the input TANSO-CAI-2 L2 cloud-discrimination product to V01.30/V01.31 (released to RA users in March 2026 and to general users in August 2026).
      Band 1 sensitivity, which had degraded exponentially since launch, recovered by about 10% in 2024–2026; this version does not correct it, so Xgas after 2024 has a time-varying positive bias.
    source: https://prdct.gosat-2.nies.go.jp/documents/pdf/ReleaseNote_FTS-2_L2_SWFP_ver0230_en_01.pdf
  - date: "2026-07-09"
    level: info
    title: GOSAT-GW TANSO-3 L1B (V101.101) released from 2026-07-23
    body: >-
      After one postponement (notice of 2026-06-18), the general-user release of TANSO-3 L1B began on 23 July 2026 with V101.101. L2 (XCO2, XCH4, NO2) is planned for spring 2027.
    source: https://gosat-gw.nies.go.jp/en/news/
  - date: "2026-07-03"
    level: info
    title: GOSAT-2 FTS-2 observations suspended (2026-06-26 to 07-01)
    body: >-
      GOSAT-2 FTS-2 stopped observing at 14:49 UTC on 26 June 2026 and resumed on 1 July. All observations from 2026-06-26 14:49:41 to 07-01 01:07:56 UTC were cancelled.
    source: https://www.eorc.jaxa.jp/GOSAT/index.html
  - date: "2026-02-17"
    level: warning
    title: GOSAT TANSO-FTS data delivery resumed — gap from 2025-12-18 to 2026-02-04
    body: >-
      Data delivery, stopped since 18 December 2025 by an unidentified TANSO-FTS event, resumed with observations from 4 February 2026 after an FTS restart.
      The confirmed FTS gap is 2025-12-18 06:02:14 to 2026-02-04 02:45:58 UT, and the TANSO-CAI gap is 2026-01-26 23:43:19 to 2026-02-03 02:42:13 UT.
    source: https://www.eorc.jaxa.jp/GOSAT/index.html
  - date: "2026-01-08"
    level: info
    title: First TANSO-3 focus-mode analysis — L1B planned for spring 2026, L2 for spring 2027
    body: >-
      NIES reported XCO2, XCH4 and NO2 slant columns imaged within a single field of view from a 5 September 2025 focus-mode observation of Los Angeles (a simplified retrieval, to be interpreted with caution).
      It stated plans to release L1B in spring 2026 and L2 (XCO2, XCH4, NO2) in spring 2027.
    source: https://www.nies.go.jp/en/pr/news-and-updates/2026/20260122/20260122.html
  - date: "2025-07-01"
    level: info
    title: GOSAT-GW launched successfully (2025-06-29, H-IIA F50)
    body: >-
      GOSAT-GW (IBUKI GW), the third GOSAT-series satellite, was launched from Tanegashima Space Center on 29 June 2025 on H-IIA F50, the vehicle's final flight. It carries TANSO-3 and AMSR3;
      after about three months of initial checkout, the first TANSO-3 observations were announced in August 2025.
    source: https://www.nies.go.jp/en/pr/news-and-updates/2025/20250701/20250701.html
  - date: "2025-04-30"
    level: info
    title: GOSAT products resumed after Light Load Mode (2025-03-29 to 04-25)
    body: >-
      GOSAT entered Light Load Mode (LLM) on 29 March 2025 and stopped observing; product delivery resumed on 21 April for CAI and 25 April for FTS.
    source: https://www.eorc.jaxa.jp/GOSAT/index.html

