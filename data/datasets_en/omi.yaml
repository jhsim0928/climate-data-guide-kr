notices:
  - date: "2026-09-18"
    level: warning
    title: Legacy GES DISC data servers to close (no earlier than 2026-09-30) — move to Earthdata Cloud
    body: >-
      The notice on aura.gesdisc.eosdis.nasa.gov says access to this and all other GES DISC data servers will end no earlier than 30 September 2026 and that users must move to
      Earthdata Cloud to keep access (anonymous FTP has already stopped). GES DISC posted the same message as an urgent alert on 18 September 2026. Point scripts to data.gesdisc.earthdata.nasa.gov or use earthaccess.
    source: https://aura.gesdisc.eosdis.nasa.gov/data/
  - date: "2026-09-08"
    level: warning
    title: Aura orbit drift — about one hour of crossing-time change; daily yaw manoeuvres for OMI solar calibration
    body: >-
      NASA reports the shift in Aura's mean crossing time at about one hour by mid-2026 and projects about 150 minutes by August 2028. With OMI's solar port no longer facing the Sun,
      daily yaw manoeuvres for solar irradiance calibration run from July 2026 to August 2027. Power is conservatively expected to become limiting in mid-2028.
    source: https://science.nasa.gov/missions/potential-evolution-of-the-aura-mission/
  - date: "2026-03-20"
    level: info
    title: Aura science operations projected to end in August 2028
    body: >-
      The editor's note on the NASA Science article 'Terra: The End of An Era' projects end of science operations for Terra in February 2027, Aqua in September 2027 and Aura in
      August 2028 because of fuel and power limits, with operations continuing until then.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-11-21"
    level: info
    title: OMHCHO V004 (Collection 4) released in netCDF4
    body: >-
      The HCHO L2 product was reprocessed as Collection 4 and released as V004. Files are netCDF4, with the main variables in the `key_science_data` group.
      As checked in 2026-10, the latest file in CMR is for 30 April 2025.
    source: https://cmr.earthdata.nasa.gov/search/concepts/C3828870481-GES_DISC.html
  - date: "2025-02-06"
    level: info
    title: Ozone OMTO3 and OMTO3d V004 released
    body: >-
      The TOMS-type total ozone L2 (OMTO3) and 1° daily product (OMTO3d) were reprocessed with Collection 4 input and released as V004. SO2 followed in June (OMSO2) and December 2025 (OMSO2e).
    source: https://cmr.earthdata.nasa.gov/search/concepts/C3377057241-GES_DISC.html
  - date: "2024-12-17"
    level: warning
    title: NO2 standard product Collection 4 (v5.0, V004) released
    body: >-
      OMNO2 and OMNO2d were reprocessed for the full record as v5.0, with new L1B, high-resolution a priori profiles, de-striping and fill values for row-anomaly pixels.
      Values differ from V003, so use V004 consistently for trend analysis.
    source: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aura_OMI_Level3/OMNO2d.004/doc/README.OMNO2.c4v5.pdf
  - date: "2007-06-25"
    level: critical
    title: OMI row anomaly began
    body: >-
      On 25 June 2007 something began partly blocking OMI's nadir port, lowering or raising radiances at particular cross-track positions (rows); the affected area grew in
      May and December 2008, January 2009 and July 2011. Affected pixels cannot be used for retrievals and must be screened out with the L2 flags.
    source: https://projects.knmi.nl/omi/research/product/rowanomaly-background.php

