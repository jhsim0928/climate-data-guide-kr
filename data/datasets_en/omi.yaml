example:
  lang: python
  note: >-
    Downloads OMNO2d V004 daily files with earthaccess and reads them with h5py. The code looks up the HDF-EOS5 internal path by variable name.
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="OMNO2d", version="004",
        temporal=("2024-01-01", "2024-01-31"),
    )
    files = earthaccess.download(results[:1], "./omi")

    with h5py.File(files[0], "r") as h:
        paths = []
        h.visit(lambda n: paths.append(n) if n.endswith("ColumnAmountNO2TropCloudScreened") else None)
        no2 = h[paths[0]][:].astype(float)          # (720 lat, 1440 lon), molecules cm-2
    no2[no2 < -1e29] = np.nan                       # fill value -1.26765e30
    print(paths[0], no2.shape, np.nanmean(no2))

tips:
  - "The row anomaly began on 25 June 2007 and spread in steps (May 2008, January 2009 and later); a substantial part of the swath (up to about 50% in some periods) is still affected. Always screen L2 with the row-anomaly flags (for NO2 keep pixels where `XTrackQualityFlagsModified` is 0 or fill; for SO2 require `Flag_RowAnomaly` = 0)."
  - "Because of the row anomaly, daily global coverage has gaps since 2009. Missing cells in daily grids may be due to the anomaly rather than clouds, so check how sample counts change when building monthly means."
  - "The NO2 README recommends using only L2 pixels whose `VcdQualityFlags` least significant bit is zero. Keep negative values when averaging to avoid a systematic bias."
  - "For SO2 PBL columns the recommended conditions are cloud radiance fraction below 0.3, solar zenith angle below 65°, excluding edge rows (0 and 59) and excluding the South Atlantic Anomaly (`Flag_SAA`). Use `ColumnAmountSO2_PBL` or `ColumnAmountSO2` for non-volcanic sources, and pick TRL, TRM, TRU or STL to match plume height for eruptions."
  - "The HCHO README says not to use pixels whose `main_data_quality_flag` is 'bad', and to take particular care with solar zenith angles above 70°, cloud fractions above 0.4, and snow or ice. Single pixels are noisy, so HCHO is usually averaged over days to a month."
  - "For OMTO3 (ozone) only error flags 0 (good) and 1 (glint corrected) are recommended; this screening also removes row-anomaly pixels. Flagging was tightened for the Hunga Tonga eruption period, 11–28 January 2022."
  - "OMI gives one early-afternoon observation. When comparing NO2, with its strong diurnal cycle, against daily means from ground monitors, match the observation time."
  - "The V004 collection metadata describe the data as not yet fully validated. Before trend studies, check the known issues on the GES DISC product pages and the READMEs."

