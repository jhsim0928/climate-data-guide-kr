transitions:
  - from: GLDAS-1
    to: GLDAS-2.1
    status: completed
    date: "2020-06"
    summary: >-
      GLDAS-1 production ended with March 2020 data and all GLDAS-1 products were removed from GES DISC on 30 June 2020. GLDAS-2.1, with new forcing and upgraded land surface models, replaces it.
    changes:
      - aspect: Production status
        before: "Production ended with March 2020 data; removed from GES DISC on 2020-06-30"
        after: "GLDAS-2.1 from 2000-01 to the present, still updated (1948–2014 covered by GLDAS-2.0)"
      - aspect: Known forcing problems
        before: "Unnatural shortwave gradient lines in the Northern Hemisphere, precipitation shift from 2009, high radiation bias vs SRB and low precipitation bias vs GPCP"
        after: "Addressed with bias-corrected AGRMET radiation, GPCP-based precipitation and a GDAS-based temporal disaggregation"
      - aspect: Land surface models
        before: "GLDAS-1 model versions"
        after: "Noah 3.6, CLSM-F2.5, VIC 4.1.2 (upgraded LIS software)"
      - aspect: Processing history
        before: "-"
        after: "Noah 2.1 reprocessed January–February 2020; inland-water mask applied October 2020"
    impacts:
      - "GLDAS-1 data can no longer be downloaded. Reproducing older studies requires recomputing with GLDAS-2.0/2.1, and the numbers may differ."
      - "Do not mix GLDAS-1 and GLDAS-2 values in one time series."
    sources:
      - name: GLDAS-1 products will be decommissioned on 6/30/2020 (NASA LDAS)
        url: https://ldas.gsfc.nasa.gov/gldas/news/gldas-1-products-will-be-decomissioned-6302020
      - name: README for NASA GLDAS Version 2 Data
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_GLDAS2.pdf

notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC on-premises servers closing — GLDAS users must move to Earthdata Cloud
    body: >-
      GES DISC announced that HTTPS access to its on-premises servers ends by 30 September 2026 and that on-premises OPeNDAP is switched off between 20 August and 30 September.
      The hydro1.gesdisc.eosdis.nasa.gov server that hosts GLDAS states that access will end 'no earlier than 30 September 2026' and asks users to move to Earthdata Cloud
      (still responding on 2026-10-13). Point scripts to data.gesdisc.earthdata.nasa.gov or use earthaccess.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2026-04-16"
    level: info
    title: GrADS Data Server (GDS) discontinued — GLDAS included
    body: >-
      The GES DISC GDS, which served GLDAS (Noah, CLSM, VIC 3-hourly, daily and monthly), was discontinued on 6 April 2026 (announced on 15 January).
      The same data are available from Earthdata Cloud over HTTPS and through subsetting services.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-has-been-discontinued
  - date: "2025-08-13"
    level: info
    title: GLDAS-2.1 radiation forcing switched to GALWEM from 2025-06-09
    body: >-
      As the US Air Force weather service moved from WWMCA to GALWEM, WWMCA became unavailable on 8 June 2025, and GLDAS-2.1 uses GALWEM radiation fields from 9 June onward.
      This was recorded in the README revision of 2025-08-13, which does not discuss any discontinuity across the switch.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_GLDAS2.pdf
  - date: "2020-10"
    level: warning
    title: Inland-water mask post-processing — re-download data obtained before 2020-11-01
    body: >-
      Routing added in the reprocessing left invalid values over inland-water cells, so all 2.0 and 2.1 3-hourly and monthly model output was post-processed with the MODIS MOD44W land mask.
      Forcing variables (_f) were unchanged. Users who downloaded data before 1 November 2020 are asked to download it again.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_GLDAS2.pdf
  - date: "2020-06-30"
    level: info
    title: GLDAS-1 products decommissioned
    body: GLDAS-1 production ended with March 2020 data and the products were removed from GES DISC on 30 June 2020. GLDAS-2.1 is the successor.
    source: https://ldas.gsfc.nasa.gov/gldas/news/gldas-1-products-will-be-decomissioned-6302020
  - date: "2020-02"
    level: info
    title: Reprocessed GLDAS-2.1 Noah released; new CLSM, VIC and 2.2 products added
    body: >-
      The GLDAS-2.1 Noah 3-hourly and monthly data reprocessed in January–February 2020 (GES DISC release 2020-01-30) replaced the previous version, and CLSM and VIC 2.1 products,
      the GRACE-assimilating GLDAS-2.2 and the Early Products were newly released (README revision 2020-02-27). GLDAS-2.0 Noah had been reprocessed with Princeton forcing V2.2 in late 2019,
      and 2.0 CLSM and VIC 1° products were added in September 2020.
    source: https://ldas.gsfc.nasa.gov/gldas/news/new-and-reprocessed-gldas-2-simulations-released

