transitions:
  - from: VIIRS Deep Blue V2.0 / Dark Target V2.0
    to: VIIRS Deep Blue V2.1 / Dark Target V2.1
    status: completed
    date: "2026-09"
    summary: >-
      Dark Target V2.1 was released in December 2025 and Deep Blue V2.1 in September 2026, adding NOAA-21 versions. Both add cross-calibration between satellites to reduce AOD differences between them.
      DT V2.0 was decommissioned on 2026-08-31; DB V2.0 remains available alongside until 2027-03-31.
    changes:
      - aspect: Satellites
        before: Suomi NPP, NOAA-20
        after: Suomi NPP, NOAA-20, NOAA-21
      - aspect: Calibration
        before: No cross-calibration between satellites
        after: "DB: Dome C (Antarctica) cross-calibration of SNPP and NOAA-21 / DT: cross-calibration coefficients for SNPP, NOAA-20 and NOAA-21"
      - aspect: Deep Blue algorithm
        before: V2.0
        after: "Improved AOD distribution over North Africa and South Asia, adjusted aerosol models (single-scattering albedo) over North America, the Sahel, southern Africa and India, stricter sun-glint screening over water, cloud screening revised to keep heavy dust and remove thin cloud and sea fog"
      - aspect: Dark Target algorithm
        before: "V2.0 (GEOS-FPIT ancillary meteorology)"
        after: "Improved ocean cloud mask, dust detection (`Dust_Flag_Ocean`) added, revised surface reflectance and urban correction, ancillary meteorology switched to GEOS-IT, fixed a bug that put land values into `Optical_Depth_Land_And_Ocean`"
      - aspect: Version labels
        before: "CMR version 2, file name .002, archive 5200"
        after: "CMR version 2.1, file name .021, archive 5201"
    impacts:
      - Do not mix V2.0 and V2.1 in one time series; download the whole record again as V2.1.
      - DB V2.1 has less ocean coverage than V2.0 in some places (stricter sun-glint screening).
    sources:
      - name: Version 2.1 VIIRS Deep Blue Aerosol Data Products Released (LAADS, 2026-09-14)
        url: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199512
      - name: AERDT_L2_VIIRS_SNPP V2.1 collection description (CMR metadata)
        url: https://cmr.earthdata.nasa.gov/search/collections.umm_json?concept_id=C3702902851-LAADS
      - name: V2.1 Level-2 Dark Target Aerosol Data Products Released (LAADS, 2025-12-18)
        url: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199536

notices:
  - date: "2026-10-30"
    level: warning
    title: "Update #3: Cessation of S-NPP data to users on November 02, 2026 1540 UTC and decommissioning"
    body: >-
      NOAA NESDIS Update #3 (issued October 30, 2026 1400 UTC): delivery of Suomi National Polar-orbiting Partnership (S-NPP) data to users will cease on November 02, 2026 15:40 UTC
      (previously 13:00 UTC) for ATMS, CERES, OMPS Nadir and Limb, VIIRS and HRD Direct Broadcast; the outage is permanent.
      Starting December 1st 2026, S-NPP will be lowered incrementally through approximately December 12th for reentry over the South Pacific Ocean. Users should transition to NOAA-21 (primary) and NOAA-20 (secondary) products.
    source: https://www.nesdis.noaa.gov/news/update-3-cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-november-02-2026-1540-utc-and-decommissioning-issued-october-30-2026-1400-utc
  - date: "2026-10-06"
    level: critical
    title: Suomi NPP data delivery ends 2 November 2026 — switch from the SNPP versions of AERDB and AERDT to NOAA-20 and NOAA-21
    body: >-
      LAADS DAAC announced that, following the NOAA NESDIS decision (announced 2026-08-03), delivery of Suomi NPP science data ends at 13:00 UTC on 2 November 2026 (day 2026/306), with the date subject to change.
      AERDB_L2, D3 and M3_VIIRS_SNPP and AERDT_L2_VIIRS_SNPP are included, and users are directed to the NOAA-20 (…_NOAA20) and NOAA-21 (…_NOAA21) versions. Historical SNPP data remain available.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199516
  - date: "2026-09-14"
    level: info
    title: VIIRS Deep Blue aerosol V2.1 released — NOAA-21 added, V2.0 kept until 2027-03-31
    body: >-
      LAADS DAAC released Deep Blue V2.1 (L2, D3, M3) for Suomi NPP, NOAA-20 and NOAA-21. It adds Dome C cross-calibration, improved AOD over North Africa and South Asia, adjusted aerosol models,
      stricter sun-glint screening over water and revised cloud screening; V2.0 remains available until 31 March 2027.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199512
  - date: "2026-09-01"
    level: info
    title: VIIRS Dark Target V2.0 decommissioned — use V2.1
    body: >-
      LAADS DAAC decommissioned the Suomi NPP and NOAA-20 Dark Target V2.0 collections (2026-08-31). Users should now use the SNPP, NOAA-20 and NOAA-21 V2.1 products (AERDT_L2_VIIRS_*).
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199514
  - date: "2026-08-11"
    level: warning
    title: Suomi NPP anomaly (2026-08-02) — data from 3 to 6 August excluded from processing
    body: >-
      A Suomi NPP spacecraft anomaly at 02:05 UTC on 2 August cut off science data; near-real-time processing resumed on 4 August and standard processing on 10 August. Data from 02:00 UTC on 3 August to 16:24 UTC on 6 August
      will not be processed because of the day/night flag setting and other concerns.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199518
  - date: "2026-07-27"
    level: warning
    title: Suomi NPP anomaly (2026-07-10 to 17) — data from 1 May onward regenerated with new calibration tables
    body: >-
      Suomi NPP entered a non-nominal state on 10 July and no science data were produced until 17 July; data from this period may not be recoverable. Standard processing waited for new calibration tables from the VIIRS calibration team,
      and data from 04:00 UTC on 1 May 2026 onward are being regenerated with them.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199520
  - date: "2026-03-23"
    level: info
    title: Suomi NPP data delay — data from 2026-03-09 to 13 missing
    body: >-
      Suomi NPP science data stopped around 17:45 UTC on 9 March; the satellite was restored on 12 March and data were declared safe to use from 16 March. VIIRS data from 18:00 UTC on 9 March through 13 March
      will not be processed because of unrecoverable geolocation errors.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199535
  - date: "2025-12-18"
    level: info
    title: VIIRS Dark Target V2.1 L2 released — NOAA-21 added
    body: >-
      LAADS DAAC released Suomi NPP, NOAA-20 and NOAA-21 Dark Target V2.1 L2 (6-minute swath, 6 km) and said V2.0 would be decommissioned on 30 June 2026 (the actual decommissioning was announced on 2026-08-31).
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199536
  - date: "2025-05-02"
    level: info
    title: Transition from MODIS to VIIRS — use similar VIIRS products
    body: >-
      NASA LAADS DAAC said Terra and Aqua will begin shutting down in late 2026 or early 2027 and encouraged MODIS users to move to similar VIIRS products. AERDB and AERDT are the products that continue MODIS MOD04 aerosol.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2025-02-27"
    level: info
    title: Suomi NPP Deep Blue V1.1 decommissioned (2025-02-28)
    body: >-
      LAADS DAAC announced that the Suomi NPP VIIRS Deep Blue V1.1 collections (L2, daily and monthly) would be removed on 28 February 2025. If you have V1.1 data, download it again as V2.1.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199546

