  acknowledgement: >-
    RSS asks users to cite the paper for each layer (TLT Mears & Wentz 2017, TMT and TTT 2016, TTS and TLS Mears & Wentz 2009 in JTECH).
    UAH gives no dataset DOI or citation text on its official pages, so cite Spencer et al. (2017) together with the version (v6.1), file name and download date.
    For NOAA STAR v5.0, cite both the NCEI CDR DOI and Zou et al. (2023).

notices:
  - date: "2024-11-02"
    level: warning
    title: UAH changes to v6.1 — NOAA-19 dropped from 2021, Metop-B only
    body: >-
      UAH said NOAA-19 had drifted too far through the diurnal cycle to be corrected, dropped its data from 2021 onward and renamed the dataset v6.1.
      The October 2024 lower-troposphere anomaly fell from +0.94 °C to +0.73 °C and the global trend by 0.01 °C per decade. Since 2021 UAH is based on Metop-B alone.
    source: https://www.drroyspencer.com/2024/11/uah-global-temperature-update-for-october-2024-truncation-of-the-noaa-19-satellite-record/
  - date: "2023-12-07"
    level: warning
    title: NOAA STAR v5.0 replaces V3.0, V4.0 and V4.1 (backward merging, new diurnal adjustment)
    body: >-
      From January 2023 STAR directs climate users to v5.0, which merges MSU, AMSU-A and ATMS by backward merging from stable-orbit satellites, applies a new diurnal drift adjustment
      and removes calibration drift in NOAA-11, 12, 14 and 15; the anomaly baseline is 2000–2019. Missing data in the January–May 2023 release were fixed after June 2023.
    source: https://www.star.nesdis.noaa.gov/data/mscat/MSU_AMSU_v5.0/Monthly_Atmospheric_Layer_Mean_Temperature/Readme_STAR_V5.0_Mean_Layer_Temperature_CDR.pdf
  - date: "2016-06-28"
    level: info
    title: RSS TLT V4.0 released (TMT and TTT V4.0 on 2016-03-02)
    body: >-
      RSS released lower-troposphere TLT V4.0 with an optimised diurnal adjustment and separate land and ocean intersatellite offsets. TMT and TTT V4.0 had appeared on 2 March, adding NOAA-19 and Metop-B.
      RSS notes that the uncertainty analysis has not yet been completed for V4.0.
    source: https://www.remss.com/measurements/upper-air-temperature/

