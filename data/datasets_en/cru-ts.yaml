notices:
  - date: "2026-06-07"
    level: info
    title: CRU TS v4.10 released (1901–2025) — not yet on CEDA, no version DOI yet
    body: >-
      v4.10, extended to 2025, is available on the CRU website. No changes in the process have been made since v4.09 (the interpolation method is as in
      v4.03); 2025 CLIMAT observations come from MCDW and Australian Tmin/Tmax from BoM. CRU will list the version DOIs once available on CEDA. Ian "Harry"
      Harris has retired and Andrew Friedman now maintains the dataset under the guidance of Tim Osborn.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/Release_Notes_CRU_TS_4.10.txt
  - date: "2026-06-07"
    level: warning
    title: Licence change from v4.10 — Open Government Licence → Open Database License
    body: >-
      Up to v4.09 the CRU website and CEDA used the Open Government Licence; the v4.10 page now uses the Open Database License (individual contents under
      the Database Contents License) with the attribution "Climatic Research Unit, University of East Anglia". If you redistribute derived data, check the
      Share-Alike conditions.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/
  - date: "2025-03-19"
    level: info
    title: CRU TS v4.09 released (1901–2024); archived at CEDA on 2025-04-17
    body: >-
      As planned, the 'cohort' station selection introduced in v4.08 was extended to DTR; for PRE the cohort process was dropped because it created
      anomalous patterns in sparsely supported regions. Gaps in the MCDW December 2024 CLIMAT data were filled with raw DWD CLIMAT observations, which then
      went through CRU quality control.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.09/Release_Notes_CRU_TS_4.09.txt
  - date: "2024-06-27"
    level: info
    title: CRU TS v4.08 released — cohort station selection, new MAE and MAEA quality measures
    body: >-
      For TMP and PRE, interpolant stations are now chosen as a 'cohort' of similarly behaving stations rather than simply the nearest ones, reducing some
      periodic excessive variability; MAE and MAEA quality measures were added for most variables. After a partial release on 24 June a problem was found in
      DTR and its dependent variables, and the full dataset was recalculated.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.08/Release_Notes_CRU_TS_4.08.txt

