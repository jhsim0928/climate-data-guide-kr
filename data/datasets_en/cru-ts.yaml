# ─────────────────────────────────────────────────────────────
# CRU TS — dataset information file (English edition)
# Atmosphere tab (temperature datasets). A new version (4.xx) is released once a year.
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: cru-ts
name: CRU TS v4.10
full_name: Climatic Research Unit gridded Time Series (CRU TS) version 4.10
category: analysis
domain: atmosphere
group: 기온 자료
order: 40
domains: [대기, 육지]
provider: University of East Anglia Climatic Research Unit (CRU) / archived and distributed by CEDA (NERC EDS Centre for Environmental Data Analysis)

status: active
status_note: >-
  A new version extending the record by one year is released annually. The latest, v4.10 (1901–2025), was released on the CRU website on 7 June 2026;
  as of 2026-10-12 CEDA still lists v4.09 (1901–2024) as its latest. From v4.10 the CRU website licence changed from the Open Government Licence to the
  Open Database License. Ian "Harry" Harris has retired, and Andrew Friedman now maintains the CRU-TS family under the guidance of Tim Osborn.

period:
  start: "1901-01"
  end: "2025-12"
  note: >-
    v4.10 covers 1901-01 to 2025-12; v4.09 on CEDA covers 1901-01 to 2024-12. No date has been announced for the next version.
    As of 2026-10-12 the last month of data is December 2025.

resolution:
  spatial_short: "56 km (0.5°)"
  temporal_short: "1개월"
  spatial: >-
    0.5° × 0.5° latitude-longitude grid, land only (excluding Antarctica); CEDA gives the extent as 180°W–180°E, 60°S–90°N. Station anomalies are
    interpolated by angular-distance weighting (ADW) and added to the CRU CL v1.0 (1961–1990) climatology, so all output files are actual values, not anomalies.
  vertical: Single level (near-surface)
  temporal: Monthly (from January 1901); files are provided both as decadal blocks and for the full period

update: Annual new version (v4.08 2024-06-27, v4.09 2025-03-19, v4.10 2026-06-07)
license: >-
  v4.10 (CRU website): Open Database License, with rights in individual contents under the Database Contents License — attribution "Climatic Research Unit,
  University of East Anglia" and Share-Alike. v4.09 and earlier (CEDA): UK Open Government Licence v3.0, permitted use "Any", with the CEDA citation
account_required: false

summary: >-
  CRU TS provides month-by-month variations in climate from 1901 to the recent past on a high-resolution (0.5° × 0.5°) land grid, interpolated from
  monthly observations at more than 4,000 weather stations worldwide. Ten variables are provided together — mean, maximum and minimum temperature, diurnal
  temperature range, precipitation, wet day frequency, vapour pressure, cloud cover, frost day frequency and potential evapotranspiration — and the dataset
  has long been used in climate impact, ecological, agricultural and hydrological studies and for model evaluation. Grid cells without nearby stations are
  filled with the climatology, so there are no gaps, but each file also gives the number of stations used for interpolation (`stn`).

time_convention:
  summary: >-
    All values are monthly. Temperature, diurnal range, vapour pressure and cloud cover are monthly means; precipitation is the monthly total (mm/month);
    wet days and frost days are counts of days in the month; potential evapotranspiration is the mean daily rate for the month (mm/day). Maximum and
    minimum temperature are monthly averages of daily maximum and minimum temperature, not monthly extremes.
  points:
    - "`tmx` and `tmn` are derived variables: `tmx` = `tmp` + 0.5 × `dtr` and `tmn` = `tmp` − 0.5 × `dtr`."
    - "To convert `pet` (mm/day) to a monthly total, multiply by the number of days in the month. `pre` is already a monthly total (mm/month)."
    - "`wet` counts days with at least 0.1 mm of precipitation."
    - "Cells with no stations (`stn` = 0) take the 1961–1990 climatology, i.e. a zero anomaly. Having no missing values does not mean the cell was observed."
    - "The official documentation does not say which day of the month the netCDF time coordinate refers to; treat the data at monthly resolution only."
  source: https://doi.org/10.1038/s41597-020-0453-3
  source_name: Harris et al. (2020), Scientific Data + CEDA CRU TS variable list

variables:
  note: >-
    Variable names and units as in the CEDA dataset records. Each netCDF file holds one variable plus `stn`, the number of stations used in the
    interpolation (integer, 0–8; not in `pet`); the ASCII version has separate `stn` files. From v4.08 most variables also come with interpolation quality
    measures MAE and MAEA (*.mae.gz, *.maea.gz). TMP, DTR and PRE are primary variables built from observations only; VAP, WET and CLD are secondary variables
    that blend in synthetic values derived from other variables where observations are sparse; TMN, TMX, FRS and PET are derived from other variables.
  full_list: https://catalogue.ceda.ac.uk/uuid/9cf07e92afaa405da4f40b6733f362d3/
  groups:
    - name: Temperature (monthly means)
      kind: mean
      period: Monthly
      items:
        - "Near-surface temperature — `tmp` (degrees Celsius)"
        - text: "Near-surface temperature maximum — `tmx` (degrees Celsius)"
          note: Monthly average of daily maximum temperature, computed as tmp + 0.5 × dtr.
        - text: "Near-surface temperature minimum — `tmn` (degrees Celsius)"
          note: Monthly average of daily minimum temperature, computed as tmp − 0.5 × dtr.
        - "Near-surface temperature diurnal range — `dtr` (degrees Celsius)"
    - name: Precipitation and moisture (monthly totals and day counts)
      kind: accum
      period: Monthly
      items:
        - "Precipitation — `pre` (mm/month)"
        - text: "Wet day frequency — `wet` (days)"
          note: Number of days with at least 0.1 mm of precipitation.
        - text: "Vapour pressure — `vap` (hPa)"
          kind: mean
    - name: Cloud, frost and evapotranspiration
      kind: mean
      period: Monthly
      items:
        - "Cloud cover — `cld` (percentage)"
        - text: "Ground frost frequency — `frs` (days)"
          kind: accum
          note: A derived variable, calculated empirically from gridded minimum temperature.
        - text: "Potential evapotranspiration — `pet` (mm/day)"
          note: "Mean daily rate for the month, calculated with the FAO-56 Penman-Monteith formula (tmp, vap, cld and wind)."

access:
  - name: CEDA Archive (CRU TS archive)
    url: https://catalogue.ceda.ac.uk/uuid/9cf07e92afaa405da4f40b6733f362d3/
    method: Web download (free CEDA account login)
    note: >-
      The official archive, and CRU's preferred route. v4.09 has 586 files (about 14 GB) under data.ceda.ac.uk/badc/cru/data/cru_ts/cru_ts_4.09/.
      As of 2026-10-12 v4.10 is not yet on CEDA.
  - name: CRU website — CRU TS v4.10
    url: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/
    login: false
    method: Direct HTTPS download (no login)
    note: >-
      A local copy, to be used only when access via CEDA is not possible or the version is not yet on CEDA. Each variable folder has netCDF (*.dat.nc.gz)
      and ASCII files plus stn, mae and maea files, as decadal blocks and for the full period (1901–2025). Read Release_Notes_CRU_TS_4.10.txt first.
      Country averages (CRU CY) are available alongside.
  - name: CRU high-resolution gridded datasets (version index)
    url: https://crudata.uea.ac.uk/cru/data/hrg/
    method: Web documentation
    note: Starting page for earlier version folders (cru_ts_4.09/, cru_ts_4.08/, …) and the Google Earth interface.

example:
  lang: python
  note: >-
    Downloads the full-period mean temperature netCDF (gzip-compressed) from the CRU website and computes annual means over the Korean Peninsula. The file
    name follows the 'cru_ts4.xx.1901.YYYY.var.dat.nc.gz' pattern used up to v4.08; check the actual name in the folder listing.
  code: |
    import gzip, shutil, urllib.request
    import xarray as xr

    base = "https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/cruts.2604091129.v4.10/tmp/"
    name = "cru_ts4.10.1901.2025.tmp.dat.nc"
    urllib.request.urlretrieve(base + name + ".gz", name + ".gz")
    with gzip.open(name + ".gz", "rb") as fi, open(name, "wb") as fo:
        shutil.copyfileobj(fi, fo)

    ds = xr.open_dataset(name)
    kor = ds.sel(lat=slice(33, 39), lon=slice(124, 132))
    tmp = kor["tmp"].where(kor["stn"] > 0)   # drop cells filled with climatology (no stations)
    print(tmp.groupby("time.year").mean().mean(["lat", "lon"]).sel(year=slice(1991, 2025)))

tips:
  - "There are no gaps because cells without stations are filled with the 1961–1990 climatology (zero anomaly). For trend or variability analyses, exclude cells with `stn` = 0 or report their fraction — especially in the early 20th century and in sparsely observed regions."
  - "`tmx` and `tmn` are monthly averages of daily maxima and minima. Use daily data for extremes such as heatwaves and cold spells."
  - "Past values change slightly with every version (new stations, quality control, interpolation changes). 'Cohort' station selection was introduced for TMP and PRE in v4.08 and extended to DTR in v4.09, while PRE reverted to the previous method in v4.09. Do not mix versions, and state the version in publications."
  - "The most recent months rely mainly on CLIMAT reports and have fewer stations. For v4.09, CRU states that some December 2024 observations came from raw (not QC'd) DWD CLIMAT data."
  - "VAP, WET and CLD include synthetic values derived from temperature and diurnal range where observations are sparse, and FRS and PET are entirely derived. Long-term trends in these variables may partly reflect temperature trends."
  - "Terms differ between v4.09 and earlier on CEDA and v4.10 on the CRU website (OGL v3.0 → ODbL). If you redistribute derived data, check the attribution and Share-Alike conditions of v4.10."
  - "Superseded decadal files may not be archived once a new version appears. Keep a copy of the files you used for reproducibility."

