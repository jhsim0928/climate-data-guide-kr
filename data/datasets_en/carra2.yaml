# ─────────────────────────────────────────────────────────────
# CARRA2 — dataset information file (English edition)
# Second-generation C3S pan-Arctic regional reanalysis: one 2.5 km domain, 1985-09 to 2025-12 released (2026-05-27),
# regular monthly updates planned from late 2026 / early 2027. The previous generation (CARRA1) is in carra.yaml.
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: carra2
name: CARRA2
full_name: Copernicus pan-Arctic Regional Reanalysis (second-generation CARRA)
category: reanalysis
domain: atmosphere
group: 지역 재분석
order: 5
domains: [대기, 육지, 해빙]
provider: Copernicus Climate Change Service (C3S) — produced by a consortium led by the Norwegian Meteorological Institute (MET Norway), distributed through the ECMWF CDS

status: active
status_note: >-
  After a first release of 24 years of data in December 2025, the full record from September 1985 to December 2025 was
  published on the CDS on 27 May 2026. As of 2026-10-12 the data end on 2025-12-31 and are not yet updated monthly. The CDS
  says monthly timely updates are planned from 2027 onwards, and C3S has stated that CARRA1 and CARRA2 will be updated in
  parallel each month from November 2026 to March 2027, after which only CARRA2 continues.

period:
  start: "1985-09"
  end: "2025-12"
  note: >-
    The CDS dataset titles say "from 1986 to present", but the sub-daily data start on 1985-09-01 and the daily and monthly
    statistics (reanalysis-pan-carra-means) on 1985-10-01 (per the CDS catalogue; the request form also offers 1985). As of
    2026-10-12 both datasets end on 2025-12-31. Once monthly updates (2–3 months behind real time) begin, the end date will move forward.

resolution:
  spatial_short: "2.5 km (0.023°)"
  temporal_short: "1시간"
  spatial: >-
    Single pan-Arctic domain on a 2.5 km polar stereographic grid with 2869 x 2869 grid points (Data User Guide and CDS), from south
    of Greenland to south of Alaska, covering the Arctic Ocean, surrounding land and part of northern Europe. Some surface variables
    (e.g. SST and sea ice fraction) come on 2880 x 2880 points; the extra 11 rows and columns contain only NaN and should be discarded
    (the C3S service page and General Assembly slides give 2880 x 2880). The delivered grid is the model grid, and the CDS can
    subset it by a latitude-longitude area
  vertical: >-
    65 hybrid model levels (level 1 at about 10 hPa to level 65 at about 12 m above the surface) / 20 pressure levels (1000–50 hPa) /
    18 height levels (15–3000 m above the surface) / soil levels 1, 2, 3, 5 and 8 (0–100 cm) to be published later. C3S General
    Assembly and workshop slides list 23 pressure levels and 11 height levels; we follow the Data User Guide and the CDS request form (20 and 18)
  temporal: >-
    3-hourly analyses (00, 03, …, 21 UTC) / hourly forecasts — forecasts from 00 and 12 UTC run hourly from +1 to +18 h, forecasts
    from the other analysis times (03, 06, 09, 15, 18, 21 UTC) from +1 to +3 h. Model levels at analysis times only. Daily and monthly
    statistics in a separate dataset (reanalysis-pan-carra-means)

coverage:
  short: 북극
  note: "Single pan-Arctic domain: from south of Greenland to south of Alaska, the Arctic Ocean and surrounding land, and part of northern Europe"
update: No updates yet (data to 2025-12) — monthly timely updates planned from late 2026 / early 2027, 2–3 months behind real time
license: CC-BY licence (CC BY 4.0)
account_required: true

summary: >-
  The second-generation C3S Arctic regional reanalysis. It replaces CARRA1's two European-sector domains (West and East) with a
  single 2.5 km polar stereographic grid covering the whole pan-Arctic. Based on an adapted HARMONIE-AROME cy46h1 system
  (hydrostatic) with 3D-Var upper-air assimilation in 3-hourly cycles, SEKF surface assimilation and ERA5 lateral boundary conditions,
  it provides 3-hourly analyses, hourly forecasts and daily and monthly statistics from September 1985. Surface processes use the
  multi-layer SURFEX scheme with a 12-layer explicit snow scheme and multi-energy balance (MEB) for the forest canopy. Single, pressure,
  height and model levels are all in one CDS entry, with spatial subsetting.

time_convention:
  summary: >-
    Analysis fields are instantaneous values at 00, 03, …, 21 UTC. Forecast fields are selected by base time (time) and lead time
    (leadtime_hour). Precipitation, radiation, heat fluxes, evaporation and runoff are accumulated from the forecast base time to the
    lead time, and maximum/minimum temperature and gusts are extremes over all 75-second model time steps since the previous post-processing (output).
  points:
    - "Forecast valid time = base time + leadtime_hour. Example: tp at +6 h from 00 UTC is the 6-hour precipitation from 00 to 06 UTC."
    - "Hourly values are the difference of two consecutive accumulations. To avoid spin-up, the Data User Guide recommends the 12-hour accumulation between the +6 and +18 h forecasts from 00 and 12 UTC, and building 24-hour totals from two successive 12-hour accumulations."
    - "Where timing matters, you can chain the +1 to +3 h forecasts from all eight analysis times, but some spin-up effects remain (Data User Guide)."
    - "Accumulated fields (precipitation in kg m-2, radiation and heat fluxes in J m-2) exist only in the forecast data, not at analysis times. For a mean flux in W m-2, take the difference of consecutive hourly accumulations and divide by 3600."
    - "Daily and monthly statistics: daily means of instantaneous fields average the 3-hourly samples from 00 to 21 UTC (analysis where available, otherwise forecast); daily sums are built per UTC calendar day from the previous day's 12 UTC forecast (+18 − +12 h), the same day's 00 UTC forecast (+18 − +6 h) and the same day's 12 UTC forecast (+12 − +6 h)."
    - "Monthly statistics of accumulated fields are monthly means of daily sums (monthly total ÷ days in the month), not monthly totals; multiply by the number of days if you need the total. A monthly value is produced only with data for at least 27 days, and a daily value only when all its samples exist."
    - "The comparison table on the C3S service page says output is, as in CARRA1, '3h after the 6h forecast range', but the Data User Guide and the CDS request form provide hourly output from +1 to +18 h for the 00 and 12 UTC forecasts."
  source: https://confluence.ecmwf.int/display/CKB/Copernicus+pan-Arctic+Regional+Reanalysis+%28CARRA2%29%3A+Data+User+Guide
  source_name: "Copernicus pan-Arctic Regional Reanalysis (CARRA2): Data User Guide"

variables:
  note: >-
    Key parameters from the parameter tables in the CARRA2 Data User Guide. Names in backticks are GRIB short names; CDS requests use
    long names such as `2m_temperature` and `total_precipitation`. The CDS sub-daily dataset lists 75 variable names.
  full_list: https://confluence.ecmwf.int/display/CKB/Copernicus+pan-Arctic+Regional+Reanalysis+%28CARRA2%29%3A+Data+User+Guide
  groups:
    - name: Surface and single levels (analysis and forecast, instantaneous)
      kind: instant
      items:
        - "2 metre temperature — `2t` (K)"
        - "2 metre relative humidity — `2r` (%)"
        - "2 metre specific humidity — `2sh` (kg kg-1)"
        - text: "10 metre U and V wind components — `10u`, `10v` (m s-1)"
          note: Relative to the polar stereographic model grid (not eastward/northward)
        - text: "10 metre wind speed and direction — `10si` (m s-1), `10wdir` (degrees)"
          note: Direction relative to true north
        - "Mean sea level pressure — `msl` (Pa)"
        - "Surface pressure — `sp` (Pa)"
        - "Skin temperature — `skt` (K)"
        - "Total cloud cover — `tcc` (%)"
        - "Snow depth water equivalent — `sd` (kg m-2)"
        - "Snow depth — `sde` (m)"
        - text: "Sea surface temperature — `sst` (K)"
          note: Interpolated from input data and updated only once a day
        - text: "Sea ice area fraction — `ci` (0-1)"
          note: Interpolated from input data and updated only once a day
        - text: "Sea ice thickness — `sithick` (m)"
          note: The guide says to treat it as a rough estimate
        - "Sea ice surface temperature — `sist` (K)"
        - text: "Total column integrated water vapour — `tciwv` (kg m-2)"
          note: Analysis only
    - name: Surface and single levels (forecast-only accumulations and extremes)
      kind: accum
      period: Since forecast start
      items:
        - "Total precipitation — `tp` (kg m-2)"
        - "Time integral of rain flux — `tirf` (kg m-2)"
        - "Time integral of total solid precipitation flux — `titspf` (kg m-2)"
        - "Evaporation — `eva` (kg m-2)"
        - "Surface runoff — `surfro` (kg m-2)"
        - "Surface short-wave (solar) and long-wave (thermal) radiation downwards — `ssrd`, `strd` (J m-2)"
        - "Surface net short-wave (solar) and long-wave (thermal) radiation — `ssr`, `str` (J m-2)"
        - "Top net short-wave (solar) and long-wave (thermal) radiation — `tsr`, `ttr` (J m-2)"
        - "Surface sensible heat flux — `sshf` (J m-2)"
        - "Time-integrated surface latent heat evaporation and sublimation fluxes — `tislhef`, `tislhsf` (J m-2)"
        - text: "Maximum temperature at 2 metres — `mx2t` (K)"
          kind: max
          period: Since previous post-processing
        - text: "Minimum temperature at 2 metres — `mn2t` (K)"
          kind: min
          period: Since previous post-processing
        - text: "Instantaneous 10 metre wind gust — `i10fg` (m s-1)"
          kind: max
          period: Since previous post-processing
          note: Not yet in the daily and monthly statistics dataset
    - name: Pressure levels (20 levels, 1000–50 hPa, analysis and forecast)
      kind: instant
      items:
        - "Temperature — `t` (K)"
        - "Relative humidity — `r` (%)"
        - "Wind speed and direction — `ws` (m s-1), `wdir` (degrees)"
        - text: "Geopotential — `z` (m2 s-2)"
          note: "divide by 9.80665 for geopotential height (m)"
        - "Geometric vertical velocity — `wz` (m s-1)"
        - "Potential vorticity — `pv` (K m2 kg-1 s-1)"
        - "Specific cloud liquid and ice water content — `clwc`, `ciwc` (kg kg-1)"
    - name: Height levels (18 levels, 15–3000 m) and model levels (65 levels, analysis only)
      kind: instant
      items:
        - "Temperature and relative humidity on height levels — `t` (K), `r` (%)"
        - "Wind speed and direction on height levels — `ws` (m s-1), `wdir` (degrees)"
        - "Pressure on height levels — `pres` (Pa)"
        - "Temperature and specific humidity on model levels — `t` (K), `q` (kg kg-1)"
        - "Turbulent kinetic energy on model levels — `tke` (J kg-1)"
    - name: Invariant fields
      kind: static
      items:
        - "Orography — `orog` (m)"
        - "Land-sea mask — `lsm` (0-1)"

access:
  - name: CDS — pan-Arctic regional reanalysis sub-daily data (reanalysis-pan-carra)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-pan-carra
    method: Web download / CDS API (cdsapi)
    note: >-
      Requires an ECMWF account and acceptance of the dataset licence (CC-BY). Choose the level type (level_type: single_levels /
      pressure_levels / height_levels / model_levels), the levels (level_location) and analysis or forecast; use area to subset a region.
      GRIB2 is the native format; NetCDF is an experimental conversion.
  - name: CDS — daily and monthly statistics (reanalysis-pan-carra-means)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-pan-carra-means
    method: Web download / CDS API
    note: >-
      Pre-computed daily and monthly means, extremes and totals. Choose time_aggregation (daily/monthly) and product_type
      (analysis_based/forecast_based). Per the CDS warning of 2026-05-15, gusts are not yet available, surface runoff and fog are missing
      for many periods, and maximum/minimum temperature and sea ice surface temperature also have gaps, which are being back-filled.
  - name: MET Norway example notebooks (metno/carra2_cds)
    url: https://github.com/metno/carra2_cds
    method: Python examples (cdsapi, Jupyter)
    note: Examples from the CARRA2 producer for downloading, regional subsetting, time series and sea ice maps.

example:
  lang: python
  note: "Put the CDS API url and your key in ~/.cdsapirc before running. Request keys and values were taken from the CDS request form (API definition) and the MET Norway examples."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()

    # 1) Forecast: total precipitation (accumulated since forecast start) — +18h minus +6h gives 12-hour precipitation
    client.retrieve(
        "reanalysis-pan-carra",
        {
            "level_type": "single_levels",
            "product_type": "forecast",
            "variable": ["total_precipitation"],
            "year": ["2020"], "month": ["01"], "day": ["01"],
            "time": ["00:00", "12:00"],
            "leadtime_hour": ["6", "18"],
            "area": [80, -30, 60, 30],        # north, west, south, east — only the region you need
            "data_format": "grib",
        },
        "carra2_tp_fc_20200101.grib",
    )

    # 2) Monthly statistics: monthly mean 2 m temperature (analysis based)
    client.retrieve(
        "reanalysis-pan-carra-means",
        {
            "time_aggregation": "monthly",
            "level_type": "single_levels",
            "variable": ["2m_temperature"],
            "product_type": "analysis_based",
            "year": ["1986"],
            "month": [f"{m:02d}" for m in range(1, 13)],
            "data_format": "netcdf",
        },
        "carra2_t2m_monthly_1986.nc",
    )

tips:
  - "`10u` and `10v` are components relative to the polar stereographic grid, not eastward and northward (Data User Guide). For geographic winds, rotate them yourself or use the true-north wind direction `10wdir` with the wind speed `10si`."
  - "Some surface variables (users report SST and sea ice fraction among them) come on 2880 x 2880 points. As the guide says, drop the extra 11 rows and columns (all NaN) to match the 2869 x 2869 grid."
  - "2 m temperature is too warm over forests (e.g. Siberia and the Sahtu region of Canada, sometimes more than 10 K warmer than ERA5). This is an official known issue; 2 m temperature per forest tile is to be provided later."
  - "Within about 100 km of the domain edge, precipitation is generally too low because of the ERA5 lateral boundaries; beyond about 200 km the effect is negligible. Exclude the edge band from analyses."
  - "Near some Greenland ice-sheet stations (NASA-SE 2012–2019, Petermann ELA 2011–2014 and others) 2 m temperature is badly biased, and the guidance is that these data should not be trusted. For ice-sheet work, check the list of sites and periods on the Known issues page first."
  - "Melt on glaciers is not represented, so glacier surface runoff is unrealistically low, and glacier extent is fixed at mid-period values. Do not use these fields as they are for glacier mass-balance work."
  - "Do not join CARRA2 to CARRA1 as one time series: domain, grid, model (non-hydrostatic Cy40h1 → hydrostatic Cy46h1), surface scheme and forecast length (30 → 18 h) all differ. If you downloaded roughness length from the CDS before 2026-09-01, you may actually have received surface runoff; download it again."

