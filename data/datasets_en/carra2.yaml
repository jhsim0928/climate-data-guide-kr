notices:
  - date: "2026-09-07"
    level: warning
    title: Surface runoff mislabelled as roughness in the CDS form (fixed 2026-09-01)
    body: >-
      The Known issues page reports that selecting surface roughness in the CDS form returned surface runoff data, and that as of
      01-Sep-2026 surface runoff is correctly labelled. The same page says the daily/monthly statistics of some parameters are missing
      for some periods — surface net solar radiation (October 2011), maximum/minimum temperature, surface runoff and wind gust (entire period) — and are being back-filled.
    source: https://confluence.ecmwf.int/spaces/CKB/pages/583771254/Copernicus+pan-Arctic+Regional+Reanalysis+CARRA2+Known+issues
  - date: "2026-06-03"
    level: info
    title: Timely monthly updates — CARRA1 and CARRA2 in parallel until March 2027
    body: >-
      According to the C3S General Assembly presentation, CARRA1 and CARRA2 will be updated monthly in parallel at least from November 2026
      until March 2027; CARRA1 will not be prolonged beyond March 2027, while CARRA2 will be updated further. The CDS pages say "Monthly timely
      updates are planned from 2027 onwards", and the C3S service page says timely updates will be produced "from January 2027".
    source: https://climate.copernicus.eu/sites/default/files/custom-uploads/9th%20C3S%20GA/Day1/Day%201.7_Block%20I_SCHYBERG.pdf
  - date: "2026-05-27"
    level: info
    title: Full historical CARRA2 data release (1986–2025) on the CDS
    body: >-
      Following the partial release in December 2025, the full 40-year CARRA2 dataset is available on the CDS in two entries: sub-daily data
      (reanalysis-pan-carra) and daily and monthly means, extremes and totals (reanalysis-pan-carra-means). C3S says regular timely updates are planned from late 2026 onwards.
    source: https://climate.copernicus.eu/full-historical-carra2-data-release-offers-new-insights-arctic-extremes
  - date: "2026-05-15"
    level: warning
    title: Some variables missing from the daily and monthly statistics dataset
    body: >-
      According to the warning on the CDS daily and monthly dataset, wind gusts are not yet provided, surface runoff and fog are missing for
      many periods, and maximum/minimum temperature and sea ice surface temperature also have gaps. The missing data are being back-filled.
    source: https://cds.climate.copernicus.eu/datasets/reanalysis-pan-carra-means
  - date: "2025-12-10"
    level: info
    title: New datasets family published in CDS — CARRA2 first release (24 years in eight 3-year blocks)
    body: >-
      1986–1988, 1991–1993, 1996–1998, 2001–2003, 2006–2008, 2011–2013, 2016–2018 and 2021–2023 were published on the CDS first.
      The new layout puts all four level types in one entry and offers spatial subsetting.
    source: https://forum.ecmwf.int/t/new-datasets-family-published-in-cds-copernicus-pan-arctic-regional-reanalysis-carra2/14483

