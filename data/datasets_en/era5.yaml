notices:
  - date: "2026-10-22"
    level: warning
    title: Data Stores Service protection measures affecting data downloads and account access (CDS/ADS/EWDS/ECDS)
    body: >-
      ECMWF detected suspicious and abusive activity originating from certain public domains and is adding protections across the CDS, ADS, EWDS and ECDS.
      Users flagged as potentially non-compliant may have their access temporarily suspended while it is reviewed, and repeated invalid requests may result in the account being disabled.
      Users are asked to submit requests sequentially rather than in parallel or in large batches, to submit only valid requests, to keep profile information accurate and to register with an institutional email address where possible.
    source: https://forum.ecmwf.int/t/data-stores-service-protection-measures-affecting-data-downloads-and-account-access-cds-ads-ewds-ecds/15481
  - date: "2026-08-26"
    level: warning
    title: ERA6 reanalysis is in production — will replace ERA5T
    body: >-
      ECMWF has started producing ERA6, with a 14 km horizontal resolution and a new ocean component.
      The first production streams, covering 2007 onwards, are expected to be published towards the end of 2027,
      and ERA6 will replace ERA5T (timely updates) after sufficient data have been published. Further timing
      details will follow as part of the transition plan.
    source: https://www.ecmwf.int/en/newsletter/188/news/era6-reanalysis-production
  - date: "2025-07-02"
    level: info
    title: CC-BY licence replaces the Licence to use Copernicus Products
    body: The "Licence to use Copernicus Products" has been replaced by the CC-BY licence (CC BY 4.0). Attribution is still required.
    source: https://forum.ecmwf.int/c/announcements/5
  - date: "2025-01-09"
    level: warning
    title: ERA5 data from 1 January 2025 degraded and corrected (resolved)
    body: >-
      A technical problem in production meant that many satellite observations were not used, causing small but
      systematic errors mainly in tropical humidity. Resolved on 2025-01-14 by overwriting ERA5T. If you downloaded
      hourly or daily ERA5T/ERA5-Land-T data for 1–6 January 2025 before then, download them again. Monthly data were not affected.
    source: https://forum.ecmwf.int/t/era5-data-from-1st-january-2025-was-degraded-and-is-being-corrected/10689
  - date: "2024-09-26"
    level: critical
    title: Goodbye legacy Climate Data Store, hello new CDS — new account and API key required
    body: >-
      The legacy CDS has been decommissioned and requests sent to it fail. Register an ECMWF account,
      run pip install --upgrade cdsapi, and update the url and key in your .cdsapirc file.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380

