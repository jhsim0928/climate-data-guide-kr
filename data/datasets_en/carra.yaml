notices:
  - date: "2026-06-03"
    level: warning
    title: CARRA1 timely updates end in March 2027
    body: >-
      C3S states that monthly CARRA1 updates are operational until the end of March 2027 and will not be extended; CARRA2 will continue to be updated.
      CARRA1 and CARRA2 monthly updates will run in parallel at least from November 2026 to March 2027.
      A machine-learning approach for updating a subset of CARRA1 variables is in preparation.
    source: https://climate.copernicus.eu/copernicus-arctic-regional-reanalysis-service
  - date: "2026-05-27"
    level: info
    title: CARRA2 full historical period from 1986 to 2025 now available on the CDS
    body: >-
      The complete 40-year CARRA2 record, covering the whole Arctic (south of Greenland to south of Alaska, the Arctic Ocean and parts of northern Europe) on a single 2.5 km grid, is now on the CDS.
      Sub-daily data are in reanalysis-pan-carra and daily and monthly data in reanalysis-pan-carra-means. Timely updates are due to start from late 2026.
    source: https://forum.ecmwf.int/t/carra2-full-historical-period-from-1986-to-2025-now-available-on-the-cds/14998
  - date: "2025-12-10"
    level: info
    title: "New datasets family published in CDS: Copernicus pan-Arctic regional reanalysis (CARRA2)"
    body: The first CARRA2 batch, 24 years of intermittent data (eight 3-year blocks between 1986 and 2023), was published on the CDS. All level types are in one entry, and spatial subsetting is available.
    source: https://forum.ecmwf.int/t/new-datasets-family-published-in-cds-copernicus-pan-arctic-regional-reanalysis-carra2/14483
  - date: "2025-10-02"
    level: info
    title: "New dataset published in CDS: Arctic regional reanalysis daily and monthly data from 1991 to present"
    body: >-
      A new entry, reanalysis-carra-means, provides daily and monthly CARRA data including means, extremes and some totals.
      It brings all level types together in a single entry, complementing the four existing CARRA entries.
    source: https://forum.ecmwf.int/t/new-dataset-published-in-cds-arctic-regional-reanalysis-daily-and-monthly-data-from-1991-to-present/14206
  - date: "2025-02-19"
    level: warning
    title: "CARRA East — grid change in 2023 and after (metadata change from July 2022)"
    body: >-
      ECMWF confirmed that when production moved to the Bologna HPC on 1 July 2022, the GRIB shapeOfTheEarth changed from 6 to 0, shifting latitude/longitude values by typically less than a km,
      and the level type of snow depth water equivalent changed from surface to heightAboveGround. The meteorological data are unaffected; the grid used before 1 July 2022 is the correct one.
    source: https://forum.ecmwf.int/t/carra-east-grid-change-in-2023-and-after/10133

