# ─────────────────────────────────────────────────────────────
# CARRA — dataset information file (English edition)
# C3S Arctic Regional Reanalysis, first generation (CARRA1). 2.5 km, West and East domains. Monthly updates until end of March 2027;
# the successor CARRA2 (single pan-Arctic domain, from September 1985) released its full historical period in May 2026.
# After editing, set last_verified to the date the official pages were checked.
# ─────────────────────────────────────────────────────────────
id: carra
name: CARRA
full_name: Copernicus Arctic Regional Reanalysis (CARRA1)
category: reanalysis
domain: atmosphere
group: 지역 재분석
order: 10
domains: [대기, 육지, 해빙]
provider: Copernicus Climate Change Service (C3S), implemented by a consortium of Nordic meteorological services; distributed through the ECMWF Climate Data Store (CDS)

status: deprecated
status_note: >-
  CARRA1 is still updated monthly on the CDS (last update 2026-09-26, data to the end of July 2026), but C3S has stated that the monthly updates are operational
  only until the end of March 2027 and will not be extended. The full 1985–2025 record of the successor, CARRA2 (one pan-Arctic domain at 2.5 km), was released on the CDS in May 2026,
  and its timely updates are due to start in late 2026 or early 2027, so both systems will be updated in parallel until March 2027. New studies should consider CARRA2.

transitions:
  - from: CARRA
    to: CARRA2
    to_id: carra2
    status: planned
    date: "2027-03"
    summary: >-
      The second-generation pan-Arctic regional reanalysis, CARRA2, released its full historical period (September 1985 to 2025) on the CDS in May 2026; timely CARRA1 updates stop at the end of March 2027.
      Grid spacing stays at 2.5 km, but a single grid now covers the whole Arctic instead of two domains, and the model cycle, land-surface scheme, output levels, forecast length and CDS layout all change.
    changes:
      - aspect: Period
        before: "September 1990 to present (timely updates end March 2027)"
        after: "September 1985 to present (CDS titles say \"from 1986\"; timely updates due to start late 2026 to early 2027)"
      - aspect: Domain and grid
        before: "Two domains, West and East, on Lambert conformal grids — West 1069 × 1269, East 789 × 989 grid points"
        after: "One pan-Arctic domain (from south of Greenland to south of Alaska, the Arctic Ocean and parts of northern Europe), polar stereographic grid of 2869 × 2869 points (2880 × 2880 for a few surface variables)"
      - aspect: Horizontal resolution
        before: 2.5 km
        after: 2.5 km (unchanged)
      - aspect: Model
        before: "HARMONIE-AROME Cy40h1, non-hydrostatic dynamics"
        after: "Adapted HARMONIE-AROME Cy46h1, hydrostatic dynamics"
      - aspect: Land surface, snow and assimilation
        before: "3D-Var upper-air assimilation on a 3-hourly cycle"
        after: "3D-Var upper-air assimilation plus Simplified Extended Kalman Filter (SEKF) surface assimilation; SURFEX diffusive scheme with 14 soil and 12 snow layers, explicit forest canopy (MEB), ECOCLIMAP Second Generation physiography"
      - aspect: Vertical levels
        before: "65 model levels, 23 pressure levels (1000–10 hPa), 11 height levels (15–500 m)"
        after: "65 model levels, 20 pressure levels (1000–50 hPa), 18 height levels (15–3000 m)"
      - aspect: Forecast length
        before: "Up to 30 h from 00 and 12 UTC"
        after: "Up to 18 h from 00 and 12 UTC"
      - aspect: CDS layout
        before: "Separate catalogue entries for single, pressure, height and model levels, plus a daily/monthly statistics entry"
        after: "One sub-daily entry holding all level types, plus a daily/monthly entry; geographic subsetting supported"
      - aspect: File format
        before: GRIB2 and NetCDF
        after: "GRIB2 is native; NetCDF comes from a converter that is still experimental (GRIB2 recommended)"
    impacts:
      - Do not join the two products into one time series. Different model physics and land-surface schemes can give different climatologies; ECMWF staff have said on the forum that each system is better in some respects and that a full comparative evaluation is in preparation.
      - The grid is entirely new (two Lambert domains replaced by one polar stereographic domain), so grid-point indices, masks and orography files must all be regenerated.
      - CARRA2 pressure levels stop at 50 hPa; 30, 20 and 10 hPa are only in CARRA1. Height levels above 500 m (up to 3000 m) are only in CARRA2.
      - The CARRA1 recipe for 24-hour precipitation (+30 h minus +6 h) does not work with CARRA2's 18-hour forecasts. Follow the accumulation guidance in the CARRA2 user guide or use the daily/monthly entry.
      - Any workflow that needs data after March 2027 must switch to CARRA2 before then.
    sources:
      - name: C3S — Copernicus Arctic Regional Reanalysis service (CARRA1 and CARRA2 comparison)
        url: https://climate.copernicus.eu/copernicus-arctic-regional-reanalysis-service
      - name: "Copernicus pan-Arctic Regional Reanalysis (CARRA2): Data User Guide"
        url: https://confluence.ecmwf.int/display/CKB/Copernicus+pan-Arctic+Regional+Reanalysis+%28CARRA2%29%3A+Data+User+Guide
      - name: 9th C3S General Assembly (June 2026), CARRA presentation (Schyberg) — CARRA1 not extended beyond March 2027
        url: https://climate.copernicus.eu/sites/default/files/custom-uploads/9th%20C3S%20GA/Day1/Day%201.7_Block%20I_SCHYBERG.pdf
      - name: ECMWF Forum — CARRA2 full historical period from 1986 to 2025 now available on the CDS
        url: https://forum.ecmwf.int/t/carra2-full-historical-period-from-1986-to-2025-now-available-on-the-cds/14998

period:
  start: "1990-09"
  end: present
  note: >-
    The CDS entries are titled "from 1991 to present", but the reanalysis starts in September 1990, so the WMO reference period 1991–2020 is fully covered.
    As of 2026-10-12, the sub-daily data run to 2026-07-31 and the daily and monthly data (reanalysis-carra-means) to 2026-02-28.
    Updated monthly with a 2–3 month latency; timely updates end in March 2027.

resolution:
  spatial_short: "2.5 km (0.023°)"
  temporal_short: "1시간"
  spatial: >-
    2.5 km × 2.5 km on Lambert conformal grids, two domains: CARRA-West (Greenland, the Labrador Sea, Davis Strait, Baffin Bay, Denmark Strait, Iceland, Jan Mayen, the Greenland Sea and Svalbard), 1069 × 1269 grid points;
    CARRA-East (Svalbard, Jan Mayen, Franz Josef Land, Novaya Zemlya, the Barents Sea and the northern parts of the Norwegian Sea and Scandinavia), 789 × 989 grid points. Data are delivered on the model grid
  vertical: "65 hybrid model levels (level 1 at 10 hPa, level 65 about 12 m above the surface) / 23 pressure levels (1000–10 hPa) / 11 height levels (15–500 m above the surface) / 2 soil levels"
  temporal: >-
    3-hourly analyses (00, 03, …, 21 UTC) and hourly short-range forecasts: forecasts from 00 and 12 UTC are output at +1 to +6 h and then every 3 h from +9 to +30 h; forecasts from the other analysis times run +1 to +3 h.
    Daily and monthly statistics are a separate CDS entry

update: Monthly (on the CDS around the 27th of each month, 2–3 months behind real time; until end of March 2027)
license: CC-BY licence (CC BY 4.0)
account_required: true

summary: >-
  The C3S Arctic Regional Reanalysis (CARRA) provides 3-hourly analyses and hourly short-range forecasts of atmospheric, surface and sea-ice variables at 2.5 km resolution for two Arctic domains:
  CARRA-West (Greenland and Iceland) and CARRA-East (Svalbard, the Barents Sea and Arctic Scandinavia). It is built on the non-hydrostatic HARMONIE-AROME model (cycle 40h1) with 3D-Var data assimilation on a 3-hourly cycle and ERA5 as lateral boundary conditions.
  Compared with ERA5 it offers finer resolution of orography, coastlines and glaciers, more local observations, and better surface characterisation from satellite and physiographic data. It will be superseded by the second-generation pan-Arctic reanalysis, CARRA2.

time_convention:
  summary: >-
    Analyses are instantaneous fields at 00, 03, …, 21 UTC. Forecast fields are identified by the initialisation time (time) and the lead time (leadtime_hour).
    Precipitation, radiation and heat fluxes are accumulated from the start of the forecast; maximum/minimum 2 m temperature and wind gust are extremes since the previous post-processing step.
  points:
    - "Valid time = initialisation time + leadtime_hour. For example, tp at +6 h from the 00 UTC forecast is the precipitation accumulated over 00–06 UTC."
    - "Hourly values are obtained by differencing two accumulations one hour apart. To avoid spin-up, the user guide recommends 12-hour precipitation as +18 h minus +6 h, and 24-hour precipitation as +30 h minus +6 h, from the 00 and 12 UTC forecasts."
    - "Accumulated parameters (precipitation in kg m-2, radiation and heat fluxes in J m-2) exist only in the forecast data, not at analysis times. Divide J m-2 by the accumulation period in seconds to get W m-2."
    - "mx2t, mn2t and 10fg are extremes over the 75 s model time steps within the output interval, which is 1 h up to +6 h and 3 h afterwards; check stepRange in the GRIB message."
    - "In the daily and monthly entry, daily means of instantaneous variables use 3-hourly sampling and daily sums combine forecasts from three base times. Daily values are given only when all samples are available, monthly values only when at least 27 days are complete; monthly accumulations are the mean of the daily accumulations."
    - "Albedo and roughness lengths at analysis times are incorrect and not used by the model; take them from the forecast data."
  source: https://confluence.ecmwf.int/display/CKB/Copernicus+Arctic+Regional+Reanalysis+(CARRA)%3A+Data+User+Guide
  source_name: "Copernicus Arctic Regional Reanalysis (CARRA): Data User Guide"

variables:
  note: >-
    Main parameters from the tables in the CARRA Data User Guide. Names in backticks are GRIB short names; CDS requests use long names such as
    `2m_temperature` and `total_precipitation`. The CDS single-levels entry offers about 67 variables.
  full_list: https://confluence.ecmwf.int/display/CKB/Copernicus+Arctic+Regional+Reanalysis+(CARRA)%3A+Data+User+Guide
  groups:
    - name: Surface and single levels (analysis and forecast, instantaneous)
      kind: instant
      items:
        - "2 metre temperature — `2t` (K)"
        - "2 metre relative humidity — `2r` (%)"
        - "2 metre specific humidity — `2sh` (kg kg-1)"
        - "10 metre U and V wind components — `10u`, `10v` (m s-1)"
        - "10 metre wind speed and wind direction — `10si` (m s-1), `10wdir` (degrees)"
        - "Mean sea level pressure — `msl` (Pa)"
        - "Surface pressure — `sp` (Pa)"
        - "Skin temperature — `skt` (K)"
        - "Total cloud cover — `tcc` (%)"
        - "Snow depth water equivalent — `sd` (kg m-2)"
        - text: "Sea surface temperature — `sst` (K)"
          note: Analysis only
        - text: "Sea ice area fraction — `ci` (0-1)"
          note: Analysis only
        - text: "Sea ice thickness — `sithick` (m)"
          note: Analysis only; the user guide describes it as a rough estimate
    - name: Surface and single levels (forecast only, accumulations and extremes)
      kind: accum
      period: Since forecast start
      items:
        - "Total precipitation — `tp` (kg m-2)"
        - "Time integral of rain flux — `tirf` (kg m-2)"
        - "Time integral of total solid precipitation flux — `titspf` (kg m-2)"
        - "Surface solar radiation downwards — `ssrd` (J m-2)"
        - "Surface thermal radiation downwards — `strd` (J m-2)"
        - "Surface sensible heat flux — `sshf` (J m-2)"
        - "Surface latent heat flux — `slhf` (J m-2)"
        - text: "Maximum 2 metre temperature — `mx2t` (K)"
          kind: max
          period: Since previous post-processing
        - text: "Minimum 2 metre temperature — `mn2t` (K)"
          kind: min
          period: Since previous post-processing
        - text: "10 metre wind gust — `10fg` (m s-1)"
          kind: max
          period: Since previous post-processing
    - name: Pressure levels (23 levels, 1000–10 hPa; analysis and forecast)
      kind: instant
      items:
        - "Temperature — `t` (K)"
        - "U and V components of wind — `u`, `v` (m s-1)"
        - "Relative humidity — `r` (%)"
        - text: "Geopotential — `z` (m2 s-2)"
          note: "divide by 9.80665 for geopotential height (m)"
        - "Geometric vertical velocity — `wz` (m s-1)"
        - "Potential vorticity — `pv` (K m2 kg-1 s-1)"
        - "Specific cloud liquid water and ice water content — `clwc`, `ciwc` (kg kg-1)"
    - name: Height levels (11 levels, 15–500 m above the surface; CDS request names)
      kind: instant
      items:
        - "Temperature — `temperature`"
        - "Wind speed and wind direction — `wind_speed`, `wind_direction`"
        - "Relative humidity — `relative_humidity`"
        - "Pressure — `pressure`"
    - name: Invariant fields
      kind: static
      items:
        - "Orography — `orog` (m)"
        - "Land-sea mask — `lsm` (0-1)"

access:
  - name: CDS — Arctic regional reanalysis on single levels (reanalysis-carra-single-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-single-levels
    method: Web download / CDS API (cdsapi)
    note: Requires an ECMWF account and acceptance of the dataset licence (CC-BY). A request selects the domain (west_domain or east_domain), the product type (analysis or forecast) and the level type (surface_or_atmosphere or soil).
  - name: CDS — pressure levels (reanalysis-carra-pressure-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-pressure-levels
    method: Web download / CDS API
  - name: CDS — height levels (reanalysis-carra-height-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-height-levels
    method: Web download / CDS API
  - name: CDS — model levels (reanalysis-carra-model-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-model-levels
    method: Web download / CDS API
  - name: CDS — daily and monthly data (reanalysis-carra-means)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-means
    method: Web download / CDS API
    note: Released October 2025. A single entry with daily and monthly means, extremes and some totals for all level types; it lags behind the sub-daily data.

example:
  lang: python
  note: "Put the CDS API URL and your personal key in ~/.cdsapirc first. Request keys and values are taken from the CDS download form (API request)."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()

    # 1) Analysis: instantaneous 2 m temperature (00 and 12 UTC of the 3-hourly analyses)
    client.retrieve(
        "reanalysis-carra-single-levels",
        {
            "domain": "west_domain",              # or "east_domain"
            "level_type": "surface_or_atmosphere",
            "product_type": "analysis",
            "variable": ["2m_temperature"],
            "year": ["2024"], "month": ["01"], "day": ["01"],
            "time": ["00:00", "12:00"],
            "data_format": "grib",
        },
        "carra_west_t2m_an_20240101.grib",
    )

    # 2) Forecast: total precipitation accumulated from forecast start; (+18 h) - (+6 h) = 12-hour total
    client.retrieve(
        "reanalysis-carra-single-levels",
        {
            "domain": "west_domain",
            "level_type": "surface_or_atmosphere",
            "product_type": "forecast",
            "variable": ["total_precipitation"],
            "year": ["2024"], "month": ["01"], "day": ["01"],
            "time": ["00:00", "12:00"],
            "leadtime_hour": ["6", "18"],
            "data_format": "grib",
        },
        "carra_west_tp_fc_20240101.grib",
    )

tips:
  - The West and East domains overlap around Svalbard. The user guide recommends taking Svalbard from the East domain and Jan Mayen from the West domain; uncertainty estimates in the overlap also follow the East domain.
  - Since production moved from Reading to Bologna on 2022-07-01, GRIB files carry a different shapeOfTheEarth, so latitudes and longitudes appear shifted by typically less than 1 km. ECMWF says the pre-July-2022 grid is the correct one; when combining periods, match by grid-point index or reuse the earlier coordinates. On the same date the level type of snow depth water equivalent (`sd`) changed from surface to heightAboveGround.
  - The Lambert conformal grids do not overlay directly on a latitude–longitude grid. We could not confirm in the documentation whether `10u`/`10v` are grid-relative or earth-relative; if direction matters, also download `10wdir` and `10si` and check against them.
  - Grid points near the domain edges are influenced by the ERA5 lateral boundaries. ECMWF staff agreed in a forum reply that boundary effects deserve clearer documentation; dropping a few rows along the edges is the safe choice.
  - The user guide warns that runoff over glaciers is often low and unrealistic because glacial ice melt is not represented. Do not use it directly for glacier mass-balance work.

