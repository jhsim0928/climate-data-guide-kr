example:
  lang: python
  note: >-
    Downloads a month of RSS V6.0 8-day L3 files with earthaccess and selects the standard salinity (`sss_smap`) around the Korean Peninsula. Run earthaccess.login() once with a NASA Earthdata account.
    For JPL CAP, change short_name to SMAP_JPL_L3_SSS_CAP_8DAY-RUNNINGMEAN_V5, the variable to `smap_sss`, and the coordinates to latitude and longitude.
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="SMAP_RSS_L3_SSS_SMI_8DAY-RUNNINGMEAN_V6",  # monthly: SMAP_RSS_L3_SSS_SMI_MONTHLY_V6
        temporal=("2025-08-01", "2025-08-31"),
    )
    files = earthaccess.download(results, "./smap_sss")

    ds = xr.open_dataset(files[0])
    box = (ds.lat >= 25) & (ds.lat <= 40) & (ds.lon >= 120) & (ds.lon <= 135)  # Korea and the East China Sea
    sss = ds["sss_smap"].where(box, drop=True)
    print(float(sss.mean()), int(ds["nobs"].where(box, drop=True).sum()))

tips:
  - "RSS treats the ~70 km smoothed salinity (`sss_smap`) as the official product and the 40 km salinity (`sss_smap_40km`) as experimental, and advises using the much less noisy 70 km fields for most open-ocean work."
  - "RSS notes that undetected radio-frequency interference (RFI) near Japan, China and Taiwan during certain periods can make salinity too fresh. Treat unusually low values in East Asian coastal seas with suspicion."
  - Cells near the coast are dropped or degraded by land contamination. RSS provides no salinity where land contamination is strong and excludes moderate contamination from the standard smoothed product, so narrow seas such as the Yellow Sea and East China Sea have many gaps.
  - Right after rain the surface layer stratifies, and SMAP reads fresher than Argo (about 5 m depth) or HYCOM. This can be a difference in measurement depth rather than an error; compare with the rain-filtered `sss_smap_RF`.
  - "RSS reports an increasing salty bias near 60°S since 2020, so be careful with long-term trends in the Southern Ocean. Waters colder than 5°C are also flagged as degraded."
  - RSS and JPL values differ for the same SMAP observations because their algorithms and ancillary data differ. Do not mix them in one time series, and state in papers which line you used (RSS V6.0 or JPL CAP V5.0).
  - "Besides the 2019-06 to 07 and 2022-08 to 09 safe-mode gaps, RSS lists days with no L2 files (2015-12-03 and 04, 2016-04-15 and 16, 2017-09-27 and 28, 2017-11-25, 2018-12-16) and days without retrievals because CCMP winds were missing (2017-05-25 and 26, 2020-10-22 and 23). 8-day files that include these days have fewer observations."
  - "When checked on 2026-10-13, the RSS V6.0 8-day L3 files on PO.DAAC centred between early May and early September 2026 had been regenerated on 2026-09-12, and the May to August 2026 monthly files on 09-29 (overlapping the reprocessing of the SMAP 2026-05-14 to 07-28 geolocation error). If you downloaded these periods earlier, downloading them again is the safe choice."

