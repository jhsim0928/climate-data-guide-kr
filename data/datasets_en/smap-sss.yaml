notices:
  - date: "2026-08-11"
    level: warning
    title: SMAP geolocation error from 2026-05-14 to 07-28 — standard products being reprocessed
    body: >-
      NSIDC announced that SMAP standard and near-real-time data had a geolocation error from 14 May to 28 July 2026, and that standard products would be reprocessed and replaced (near-real-time products will not be).
      The notice comes from NSIDC, the soil moisture archive, and does not mention salinity products. When checked on 2026-10-13, RSS V6.0 8-day L3 files on PO.DAAC centred between early May and early September 2026 had been reposted on 2026-09-12
      and the May to August 2026 monthly files on 09-29, but neither PO.DAAC nor RSS has said whether this replacement relates to the geolocation error.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-reprocessing
  - date: "2024-09-23"
    level: info
    title: Back-fill of RSS SMAP salinity V6.0 completed
    body: >-
      PO.DAAC announced that back-fill processing of the RSS SMAP sea surface salinity V6.0 validated datasets was complete (the notice says "from May 25, 2015, to the present", although the PO.DAAC listing starts in April 2015).
      The V5.3 evaluation datasets were an interim release meant to be used until this back-processing was finished.
    source: https://podaac.jpl.nasa.gov/announcements/2024-09-23-Back-fill-completion-of-SMAP-RSS-Sea-Surface-Salinity-V6.0-Validated-Datasets
  - date: "2024-03-26"
    level: info
    title: RSS SMAP salinity V6.0 released
    body: >-
      L2C, L2C near-real-time, and L3 8-day and monthly V6.0 products were released on PO.DAAC. Changes include removal of biases from the radar operation period (April to August 2015), reduced look-angle-dependent biases,
      reduced excessive salinity at high northern latitudes, and a small revision of the sun-glint flag. Latencies are 4 days for L2C, 5 hours for L2C NRT and 7 days for L3.
    source: https://podaac.jpl.nasa.gov/announcements/2024-03-26-SMAP-RSS-Sea-Surface-Salinity-V6.0-Validated-Dataset-Release
  - date: "2022-08-22"
    level: warning
    title: SMAP safe mode (entered 2022-08-08) — gap in salinity data
    body: >-
      SMAP entered safe mode on 8 August 2022 and science data collection stopped. The SMAP master events log records an antenna spin-down at that time; the radiometer was powered on again on 19 September, and an orbit manoeuvre on 6 October returned SMAP to nominal science operations.
      RSS has no monthly files for August or September 2022.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-safe-mode
  - date: "2019-06-24"
    level: warning
    title: SMAP safe mode (no data 2019-06-19 to 07-23)
    body: >-
      SMAP entered safe mode on the evening of 19 June 2019 and all instruments were shut down; there are no observations until the radiometer was powered on again on 23 July. There are no salinity L2 or 8-day L3 files for this period, and no RSS monthly file for July 2019.
    source: https://nsidc.org/data/user-resources/data-announcements/smap-safe-mode

transitions:
  - from: RSS SMAP SSS V5.0
    to: RSS SMAP SSS V6.0
    status: completed
    date: "2024-03"
    summary: >-
      Switches the input antenna temperatures to SMAP L1B Version 6 (Piepmeier et al., 2023) and refines several bias corrections. Released in March 2024, with back-processing of the full record finished in September 2024.
      Until then, users were told to use the V5.3 evaluation release (through the end of 2023), which is identical to V6.0 apart from its V5 L1B input.
    changes:
      - aspect: Input L1B
        before: SMAP L1B Version 5 antenna temperatures
        after: "SMAP L1B Version 6 antenna temperatures (lower RFI exclusion threshold removes more potential interference)"
      - aspect: Early-mission (2015-04 to 08) bias
        before: A ~0.25 K difference between high-rate and low-rate antenna temperatures during radar operation caused salty halos near continental shelves
        after: Bias removed manually
      - aspect: Reflected galaxy and reflector temperature corrections
        before: Look-direction-dependent fresh biases and salty biases at high northern latitudes
        after: Adjusted galaxy correction and reflector physical-temperature model reduce both
      - aspect: Sun-glint flag
        before: Negative glint angles were also flagged
        after: "Negative angles no longer flagged; new flags for low winds at high latitudes and sidelobe or backscatter cases"
      - aspect: Dataset DOIs
        before: "10.5067/SMP50-… (V5.0)"
        after: "10.5067/SMP60-2SOCS (L2C), 3SPCS (L3 8-day), 3SMCS (L3 monthly)"
    impacts:
      - Replace any V5.0 time series by downloading the full V6.0 record. Values change most in April to August 2015 and at high northern latitudes.
      - "V6.0 filters RFI more aggressively, so the observation count (`nobs`) can drop in some cells."
      - "V6.0 still has unresolved issues: the salty bias near 60°S since 2020 and undetected RFI in East Asia, the Arabian Sea and the Mediterranean."
