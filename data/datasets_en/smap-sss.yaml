# ─────────────────────────────────────────────────────────────
# NASA SMAP sea surface salinity (RSS V6.0 and JPL CAP V5.0) — dataset information file (English edition)
# Satellite tab (sea surface salinity), also listed in the Ocean tab (satellite observations). Two L3 product lines that RSS and JPL derive from the same SMAP L-band radiometer data with different algorithms.
# When checked on 2026-10-13, PO.DAAC held JPL CAP V5.0 8-day L3 files through the one centred on 2026-10-06, and RSS V6.0 8-day L3 files through the one centred on 2026-09-19.
# The version change within this page (RSS V5.0 → V6.0) is recorded under transitions (no to_id). Soil moisture products are on the ../smap/ page.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: smap-sss
name: "SMAP sea surface salinity (RSS and JPL)"
full_name: >-
  Soil Moisture Active Passive (SMAP) Sea Surface Salinity — RSS SMAP Level 2C/Level 3 SSS V6.0 and JPL SMAP CAP Level 2B/Level 3 SSS V5.0 (distributed by NASA PO.DAAC)
category: satellite
domain: satellite
group: 해면 염분
order: 10
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 원격탐사]
provider: Remote Sensing Systems (RSS, V6.0) and the NASA JPL SMAP salinity team (CAP V5.0) / distributed by NASA PO.DAAC, sponsored by the NASA Ocean Salinity Science Team

status: active
status_note: >-
  SMAP continues to observe with its L-band radiometer, and both product lines are updated normally. When checked on 2026-10-13, PO.DAAC held JPL CAP V5.0 8-day L3 files through the one centred on 2026-10-06 (2 to 10 October)
  and monthly files through September 2026, RSS V6.0 8-day L3 files through the one centred on 2026-09-19 (15 to 23 September) and monthly files through August 2026, and RSS L2C near-real-time swaths through 2026-10-11.
  The current versions are RSS V6.0 (released 2024-03, back-processing of the full record completed 2024-09) and JPL CAP V5.0.

period:
  start: "2015-04"
  end: present
  note: >-
    SMAP science observations began in April 2015. The first RSS V6.0 8-day L3 file is centred on 2015-04-01 (28 March to 5 April 2015) and monthly files start in April 2015; JPL CAP V5.0 8-day L3 files start with the one centred on 2015-05-04.
    Safe-mode events left no data from 2019-06-19 to 07-23 and from early August to late September 2022 (return to the nominal orbit on 10-06). The RSS release notes give the gaps as 2019-06-17 to 07-25 and 2022-08-06 to 09-21 (no 8-day files),
    while the PO.DAAC announcements give 2019-06-19 to 07-23 and 2022-08-09 to 10-06, so the documents differ slightly. RSS has no monthly files for July 2019 or August and September 2022.

resolution:
  spatial_short: "70 km (0.25°)"
  temporal_short: "8일"
  spatial: >-
    Both L3 lines use a regular 0.25° × 0.25° latitude–longitude grid. RSS V6.0 carries the standard salinity smoothed to about 70 km (`sss_smap`) and salinity at the original resolution of about 40 km (`sss_smap_40km`, experimental);
    JPL describes CAP V5.0 as having a spatial resolution of about 60 km. The L2 products (RSS L2C, JPL L2B) are swath data from a 1000 km wide swath
  vertical: Sea surface (single level) — the near-surface salinity sensed by the L-band (1.41 GHz) radiometer
  temporal: >-
    L3 8-day running mean (one file per day, file date at the centre of the 8-day window) / L3 monthly mean. Swath products are separate: RSS L2C (4-day latency) and L2C near-real-time (about 5 hours),
    JPL L2B and L2B near-real-time (including a 2-hour version)

coverage:
  short: 전지구
  note: "Global ocean. Cells over sea ice or close to land are empty or flagged; RSS drops salinity or excludes it from the standard smoothed product according to the sea-ice contamination zone (sea_ice_zones)"
update: >-
  Daily (one 8-day running-mean file per day). PO.DAAC lists latencies of about 7 days after the end of the averaging window for both RSS L3 products, about 7 days for JPL 8-day files and about a month for JPL monthly files.
  When checked in October 2026, JPL 8-day files appeared about 3 days after the window ended, JPL monthly files around the 2nd of the next month, RSS 8-day files about a week after the window ended, and RSS monthly files about a month later
license: >-
  NASA Earth science open data — openly shared without restriction (PO.DAAC and Earthdata). Downloading from PO.DAAC needs a free NASA Earthdata Login; the RSS HTTPS server needs no login.
  RSS asks users to cite the dataset DOI and include its acknowledgement statement
account_required: false

summary: >-
  Sea surface salinity (SSS) from the L-band (1.41 GHz) radiometer on NASA's SMAP satellite. SMAP is a soil moisture mission, but after Aquarius ended in June 2015 it took over NASA's satellite salinity record,
  and two teams process the same brightness temperatures with different algorithms. The Remote Sensing Systems (RSS) V6.0 product uses an algorithm from the Aquarius family with CCMP winds for the roughness correction,
  while JPL's CAP (Combined Active-Passive) V5.0 uses a combined algorithm developed for Aquarius that retrieves salinity and wind speed together. Both provide 8-day running-mean and monthly L3 fields on a 0.25° grid through PO.DAAC.

time_convention:
  summary: >-
    An L3 8-day file averages all valid observations within ±3.5 days (8 days) of its date, and a new file is produced every day. Monthly files average the whole month.
    In both lines the time stored in the file is the centre of the averaging interval. The actual observations are instantaneous overpasses around 6 a.m. (descending) and 6 p.m. (ascending) local time, and a grid cell is seen several times within 8 days.
  points:
    - "The day of year in an RSS 8-day file name (e.g. RSS_smap_SSS_L3_8day_running_2026_262_FNL_v06.0 → day 262 of 2026 = 19 September) is the centre of the window, and observations within ±3.5 days of it are averaged."
    - "The date in a JPL 8-day file name (e.g. SMAP_L3_SSS_20261006_8DAYS_V5.0) is also the window centre. PO.DAAC lists this file as covering 2 October 12 UTC to 10 October 12 UTC, and JPL uses Gaussian weights (the `weight` variable)."
    - "8-day files are produced daily, but neighbouring files overlap by 7 days and are not independent samples. For an independent series, take every eighth file or use the monthly product."
    - "The time reference differs — RSS uses 'seconds since 2000-01-01T00:00:00Z', JPL uses 'seconds since 2015-1-1 00:00:00 UTC'."
    - "RSS L3 averages fore and aft looks and ascending and descending passes together. For instantaneous swath values, use L2C (RSS) or L2B (JPL)."
  source: https://data.remss.com/smap/SSS/V06.0/documents/Release_V6.0.pdf
  source_name: RSS SMAP Salinity V6.0 Release Notes + PO.DAAC and Earthdata variable tables

variables:
  note: >-
    Variable names and units follow the NASA Earthdata catalogue (PO.DAAC) variable tables. Salinity in 1e-3 is practical salinity (same magnitude as psu). RSS and JPL use different file structures and variable names, so take care when combining them.
  full_list: https://www.earthdata.nasa.gov/data/catalog/pocloud-smap-rss-l3-sss-smi-8day-runningmean-v6-6.0
  groups:
    - name: RSS SMAP L3 V6.0 (8-day running mean and monthly, 0.25°)
      kind: mean
      period: 8-day running or monthly
      items:
        - text: "Sea surface salinity (smoothed to about 70 km, standard) — `sss_smap` (1e-3)"
          note: Recommended by RSS as the official product
        - text: "Sea surface salinity (original resolution of about 40 km, experimental) — `sss_smap_40km` (1e-3)"
          note: Noisier
        - text: "Rain-filtered sea surface salinity (about 70 km) — `sss_smap_RF` (1e-3)"
        - text: "Total formal salinity uncertainty — `sss_smap_unc`, `sss_smap_40km_unc`, `sss_smap_RF_unc` (1e-3)"
          std: []
        - text: "HYCOM reference salinity — `sss_ref` (1e-3)"
          std: []
        - text: "Number of observations in the average — `nobs`, `nobs_40km`, `nobs_RF` (1)"
          kind: accum
          std: []
        - text: "Ancillary wind speed (CCMP NRT, used in the roughness correction) — `winspd` (m s-1)"
          std: []
        - text: "Ancillary sea surface temperature (CMC) — `surtep` (K)"
          std: []
        - text: "Estimated sea-ice fraction (weighted by antenna gain) — `gice_est` (1)"
          std: []
        - text: "Land fraction — `gland`, `fland` (1)"
          std: []
    - name: JPL SMAP CAP L3 V5.0 (8-day running mean and monthly, 0.25°)
      kind: mean
      period: 8-day running or monthly
      items:
        - "Sea surface salinity — `smap_sss` (1e-3)"
        - text: "Salinity uncertainty — `smap_sss_uncertainty` (1e-3)"
          std: []
        - text: "SMAP 10 m wind speed — `smap_spd` (m s-1)"
          note: Retrieved from SMAP together with salinity
        - text: "SMAP 10 m wind speed (using ancillary salinity) — `smap_high_spd` (m s-1)"
          std: [wind10]
        - text: "HYCOM salinity — `anc_sss` (1e-3)"
          std: []
        - text: "Ancillary sea surface temperature — `anc_sst` (K)"
          std: []
        - text: "Sea-ice and land fractions — `ice_fraction`, `land_fraction` (1)"
          std: []
        - text: "Sum of Gaussian weights — `weight` (1)"
          kind: accum
          std: []

