transitions:
  - from: CLDMSK V1 (MVCM continuity cloud mask)
    to: CLDMSK V2
    status: completed
    date: "2026-04"
    summary: >-
      Continuity cloud mask V2 (Suomi NPP and NOAA-20 VIIRS, Aqua MODIS) was released on 28 April 2026, along with two new masks that combine an imager with a sounder (AIRS, CrIS).
      V2 takes calibration-adjusted VIIRS L1B as input and adds a daytime 375 m I-band mask. As of 2026-10-13 the NOAA-21 mask exists only as V1, and no decommissioning date has been announced for the V1 collections.
    changes:
      - aspect: Input
        before: Existing VIIRS L1B
        after: Calibration-adjusted VIIRS L1B
      - aspect: Resolution
        before: VIIRS 750 m, MODIS 1 km
        after: Same, plus a daytime 375 m VIIRS I-band cloud mask
      - aspect: Product layout
        before: "CLDMSK_L2_VIIRS_SNPP, NOAA20, NOAA21, CLDMSK_L2_MODIS_Aqua"
        after: "V2: SNPP, NOAA20, MODIS_Aqua + sounder-combined CLDMSK_L2_MODIS-AIRS_Aqua and CLDMSK_L2_VIIRS-CRIS_SNPP (NOAA-21 stays at V1)"
      - aspect: Version labels
        before: "CMR version 1, DOI .001"
        after: "CMR version 2, DOI .002"
    impacts:
      - Do not mix V1 and V2 masks in one analysis. Check the file attributes to see which mask version CLDPROP V1.1 used as input.
    sources:
      - name: Release of MODIS-VIIRS Cloud Mask Version 2.0 Collection Products (LAADS, 2026-04-28)
        url: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199528
      - name: CLDMSK_L2_VIIRS_SNPP V2 collection description (CMR metadata)
        url: https://cmr.earthdata.nasa.gov/search/collections.umm_json?concept_id=C3860045339-LAADS

notices:
  - date: "2026-10-30"
    level: warning
    title: "Update #3: Cessation of S-NPP data to users on November 02, 2026 1540 UTC and decommissioning"
    body: >-
      NOAA NESDIS Update #3 (issued October 30, 2026 1400 UTC): delivery of Suomi National Polar-orbiting Partnership (S-NPP) data to users will cease on November 02, 2026 15:40 UTC
      (previously 13:00 UTC) for ATMS, CERES, OMPS Nadir and Limb, VIIRS and HRD Direct Broadcast; the outage is permanent.
      Starting December 1st 2026, S-NPP will be lowered incrementally through approximately December 12th for reentry over the South Pacific Ocean. Users should transition to NOAA-21 (primary) and NOAA-20 (secondary) products.
    source: https://www.nesdis.noaa.gov/news/update-3-cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-november-02-2026-1540-utc-and-decommissioning-issued-october-30-2026-1400-utc
  - date: "2026-10-06"
    level: critical
    title: Suomi NPP data delivery ends 2 November 2026 — switch from the SNPP versions of CLDPROP and CLDMSK to NOAA-20
    body: >-
      LAADS DAAC announced that, following the NOAA NESDIS decision (announced 2026-08-03), delivery of Suomi NPP science data ends at 13:00 UTC on 2 November 2026, with the date subject to change.
      CLDPROP_L2, D3 and M3_VIIRS_SNPP, CLDPROPCOSP_D3 and M3_VIIRS_SNPP, and CLDMSK_L2_VIIRS_SNPP and CLDMSK_L2_VIIRS-CRIS_SNPP are affected, and users are directed to the NOAA-20 versions (a NOAA-21 cloud mask also exists). Historical SNPP data remain available.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199516
  - date: "2026-08-11"
    level: warning
    title: Suomi NPP anomaly (2026-08-02) — data from 3 to 6 August excluded from processing
    body: >-
      A Suomi NPP spacecraft anomaly at 02:05 UTC on 2 August cut off science data; near-real-time processing resumed on 4 August and standard processing on 10 August. Data from 02:00 UTC on 3 August to 16:24 UTC on 6 August will not be processed.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199518
  - date: "2026-07-27"
    level: warning
    title: Suomi NPP anomaly (2026-07-10 to 17) — data from 1 May onward regenerated with new calibration tables
    body: >-
      Suomi NPP entered a non-nominal state on 10 July and no science data were produced until 17 July; data from this period may not be recoverable. Standard processing waited for new calibration tables from the VIIRS calibration team,
      and data from 04:00 UTC on 1 May 2026 onward are being regenerated with them.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199520
  - date: "2026-04-28"
    level: info
    title: MODIS-VIIRS cloud mask V2 released — sounder-combined masks added
    body: >-
      LAADS DAAC released V2 of the MODIS-VIIRS Cloud Mask (MVCM), descended from MOD35, for Suomi NPP and NOAA-20 VIIRS and for Aqua MODIS. New CLDMSK_L2_MODIS-AIRS_Aqua and CLDMSK_L2_VIIRS-CRIS_SNPP products combine imager resolution
      with sounder (AIRS, CrIS) absorption channels to improve detection at night and over the poles.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199528
  - date: "2026-03-20"
    level: warning
    title: Aqua science operations expected to end in September 2027 — Aqua MODIS continuity cloud products end with them
    body: >-
      The editor's note on the NASA Science article 'Terra: The End of An Era' (updated 2026-03-20) projects that fuel and power limits will end Aqua science operations in September 2027.
      After that the Aqua MODIS versions of CLDPROP and CLDMSK will get no new data, so the MODIS–VIIRS overlap period runs until then.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2024-10-09"
    level: info
    title: NOAA-21 VIIRS cloud mask released
    body: >-
      LAADS DAAC released the NOAA-21 VIIRS continuity cloud mask (CLDMSK_L2_VIIRS_NOAA21, V1.0), with a record starting on 10 February 2023. NOAA-21 cloud properties (CLDPROP) were still not available as of 2026-10-13.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199558
  - date: "2023-10-10"
    level: info
    title: Continuity cloud mask algorithm upgraded — data from 2023-01-01 reprocessed
    body: >-
      The Atmosphere SIPS upgraded the continuity cloud mask with a bug fix and switched it to the latest VIIRS L1B and to OISST (replacing the weekly Reynolds SST). The collection number stayed the same while the product_version attribute became 1.0.5,
      and the SNPP, NOAA-20 and Aqua MODIS cloud masks and cloud properties (L2 and daily and monthly L3) were reprocessed from 2023-01-01. Differences in clear-sky confidence are mostly very small.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199591
  - date: "2023-02-07"
    level: info
    title: Aqua MODIS continuity cloud products reprocessed (2022-04-17 to 07-26, crosstalk correction)
    body: >-
      To fix L1B crosstalk drift in bands 27–30 after the Aqua safe mode (2022-03-31 to 04-14), CLDMSK_L2_MODIS_Aqua and CLDPROP_L2, D3 and M3_MODIS_Aqua for 2022-04-17 to 07-26 were reprocessed.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199620

