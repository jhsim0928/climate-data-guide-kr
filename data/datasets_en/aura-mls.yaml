# ─────────────────────────────────────────────────────────────
# Aura MLS (Microwave Limb Sounder) Version 6 / Version 5 — dataset information file
# Satellite tab (Temperature and water vapour). Version 6, released in March 2026, is recommended for new work; v5 is still produced for now.
# Key caveats: intermittent 190 GHz radiometer operation since May 2024 (gaps in H2O, N2O) and the projected end of Aura science operations (August 2028).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: aura-mls
name: "Aura MLS"
full_name: EOS Aura Microwave Limb Sounder (MLS) Level 2 and Level 3 Version 6
category: satellite
domain: satellite
group: 기온·수증기
order: 50
domains: [대기, 원격탐사]
provider: NASA JPL Aura MLS Team / NASA GES DISC

status: active
status_note: >-
  Version 6, a reprocessing of the full record since August 2004, was released in March 2026, and the MLS team recommends it for all new studies. Version 5 forward processing continues for now
  so that ongoing work is not disrupted (as checked on 2026-10-13, both L2 v6 and v5 run through 11 October). Because the ageing 190 GHz radiometer has been switched on only a few days a month since May 2024,
  water vapour, N2O and related products are missing for most of each month, and NASA projects the end of Aura science operations in August 2028 because of power limits.

transitions:
  - from: MLS v5.0x
    to: MLS v6.0x
    status: completed
    date: "2026-03"
    summary: >-
      v6 corrects the calibration drift of the 190 GHz radiometer and revises the 118 GHz temperature channel shapes, and reprocesses the whole record. N2O and temperature change the most;
      v5 forward processing continues for the time being.
    changes:
      - aspect: Release date
        before: "v5 (L2 temperature V005 citation release date 2020-06-11)"
        after: "v6 (L2 temperature, ozone and water vapour V006 citation release date 2026-03-30; quality document v6.0-1.0 dated 2026-03-26)"
      - aspect: Processing software
        before: v5.0x (current file names v05-04)
        after: "v6.0x — most of the record processed with v6.01, recent data with v6.03 (file names v06-01, v06-03)"
      - aspect: N2O
        before: "190 GHz radiometer calibration drift (about 1.3% per decade from around 2010) left in place"
        after: Drift corrected — values up to 20% larger in the lower stratosphere (100–10 hPa), especially in the tropics
      - aspect: Temperature
        before: Only part of the 118 GHz channels used
        after: "Revised 118 GHz channel shapes allow all Band 1 radiances to be used — up to 20% better precision and up to 30% better vertical resolution at 10–0.1 hPa"
      - aspect: Water vapour
        before: "190 GHz drift correction already applied in v5.0x — drift against ACE-FTS removed"
        after: "Same family of correction in v6; a drift relative to frost-point sondes remains"
      - aspect: Meaning of Status cloud flags
        before: Indicate that clouds were present
        after: Indicate that specific radiances were avoided in the retrieval because of clouds
    impacts:
      - Do not mix v5 and v6 in one time series. N2O, temperature (upper stratosphere to mesosphere), water vapour, HCN and upper-stratospheric HNO3 in particular differ between versions.
      - Screening rules (Quality and Convergence thresholds, useful pressure ranges) differ by version. Re-check the tables in the v6 quality document when switching.
      - The team only says v5 forward processing continues "for the foreseeable future", so starting new analyses with v6 is the safer choice.
    sources:
      - name: Aura MLS v6.0x Level 2 and 3 data quality and description document (v6.0-1.0, 2026-03-26)
        url: https://mls.jpl.nasa.gov/data/v6-0_data_quality_document.pdf
      - name: Aura MLS home page (v6 release and 190 GHz operations)
        url: https://mls.jpl.nasa.gov/

period:
  start: "2004-08"
  end: present
  note: >-
    Standard L2 products start on 2004-08-02, one file per day. As checked on 2026-10-13, both L2 v6 (ML2T 006) and v5 (ML2T 005) run through 2026-10-11.
    L3 v6 (netCDF4) is still being populated at GES DISC (as of September 2026 only the 2005 file was present for the monthly binned temperature), while L3 v5 remains available.
    Since May 2024, water vapour, N2O, HCN and upper-stratospheric HNO3 exist only on the days the 190 GHz radiometer is on (a few days a month).

resolution:
  spatial_short: "165 km (1.5°)"
  temporal_short: "1일"
  spatial: >-
    L2: profiles every 1.5° (about 165 km) along the orbit track, about 15 orbits per day, 82°S–82°N /
    L3: daily and monthly binned grids (4° latitude × 5° longitude for the V005 monthly binned temperature, ML3MBT) and zonal means
  vertical: >-
    Fixed pressure grid: temperature, water vapour, ozone and relative humidity use 12 surfaces per decade of pressure from 1000 to 1 hPa; most products use 6 per decade (about 2.5 km), thinning to 3 per decade above 0.1 hPa.
    Useful range: temperature 261–0.00046 hPa (vertical resolution 3–6 km), ozone 261–0.001 hPa (2.5–6 km), water vapour 316–0.001 hPa (about 1.5 km at 316 hPa, 15 km above 0.1 hPa)
  temporal: >-
    L2: profiles at their observation times along the orbit within a daily file (one UTC day) / L3: daily and monthly. Near-real-time L2 (NRT, V005) within about 3 hours, in roughly 15-minute files kept online for 7 days

coverage:
  short: 전지구
  note: "82°S–82°N"
update: "Daily (standard L2 usually reaches GES DISC within 1–3 days of observation; NRT within about 3 hours)"
license: Open NASA Earth science data, free and unrestricted. File downloads need a free NASA Earthdata Login; citation of the dataset DOI is requested
account_required: true

summary: >-
  Vertical profiles of temperature, geopotential height, water vapour, ozone and some 20 other species (ClO, HCl, HNO3, N2O, CO and more) from the upper troposphere to the mesosphere,
  retrieved since 2004 from thermal emission measured by the Microwave Limb Sounder on NASA's Aura satellite as it views the edge of the atmosphere.
  Because it is little affected by clouds and aerosols and observes day and night, it is a core record for stratospheric ozone chemistry, the polar vortex,
  stratospheric water vapour change and the effects of volcanic eruptions.

time_convention:
  summary: >-
    L2 values are instantaneous profiles at the time the satellite passed each measurement location, and each file holds one UTC day. L3 values are averages of quality-screened L2 data
    collected into grids or latitude bands over a day or a month.
  points:
    - "The L2 time variable is seconds since 00:00 UT on 1 January 1993 (including leap seconds). About 15 orbits a day of ascending (day) and descending (night) profiles share one file, so split species with a diurnal cycle (such as ClO or mesospheric temperature) by local time."
    - "Daily L2 files break at UTC midnight. For regional daily means, local calendar days may not match, so split by the time variable yourself."
    - "Since May 2024 the 190 GHz radiometer is switched on only a few days each month (the MLS team describes about six days around mid-month; the v6 quality document says about four days). On other days H2O, N2O, HCN and HNO3 below 20 hPa are not measured, and CH3Cl, CH3CN, ClO, HCl and cloud ice assume climatological water vapour, making quantitative comparison difficult."
    - "Near-real-time (NRT) L2 uses a simplified forward model, is less accurate than the standard product and is kept for only 7 days. Use the standard products for research."
  source: https://mls.jpl.nasa.gov/data/v6-0_data_quality_document.pdf
  source_name: Aura MLS v6.0x data quality and description document + MLS home page + ML2T_NRT V005 CMR description

variables:
  note: >-
    L2 comes as one file per product (species), for example ML2T temperature, ML2H2O water vapour and ML2O3 ozone; the values sit at `HDFEOS/SWATHS/<swath>/Data Fields/L2gpValue`.
    The standard swath has the same name as the product (Temperature, H2O, O3, GPH, RHI and so on), so the variable column below reads `swath/L2gpValue`. Each file also holds an a priori swath ending in `-APriori`,
    and the temperature file holds the WMO tropopause pressure swath `WMOTPPressure`, so always name the swath when reading. The precision and quality fields sit under the same swath's `Data Fields`.
    Units and useful ranges below follow the GES DISC V006 collection descriptions. Always apply the v6 quality document screening (precision > 0, even Status, Quality and Convergence thresholds, useful pressure range).
    L3 (netCDF4) has one group per species and grid (for example `O3 PressureGrid`, `O3 PressureZM`), each holding statistics variables with the same names.
  full_list: https://mls.jpl.nasa.gov/data/v6-0_data_quality_document.pdf
  groups:
    - name: L2 profiles (HDF-EOS5 file per species, variables as `swath/L2gpValue`)
      kind: instant
      period: overpass time
      items:
        - text: "Temperature — `Temperature/L2gpValue` (K)"
          note: "ML2T collection, 118 and 240 GHz, 261–0.00046 hPa. `WMOTPPressure/L2gpValue` in the same file is the WMO tropopause pressure (hPa)"
        - text: "Water vapour mixing ratio — `H2O/L2gpValue` (volume mixing ratio)"
          note: "ML2H2O collection, 190 GHz, 316–0.001 hPa"
        - text: "Ozone mixing ratio — `O3/L2gpValue` (volume mixing ratio)"
          note: "ML2O3 collection, 240 GHz, 261–0.001 hPa. The same file also has an `O3 column` swath with the ozone column above the tropopause"
        - text: "Geopotential height — `GPH/L2gpValue` (m)"
          note: "ML2GPH collection"
        - text: "Relative humidity with respect to ice — `RHI/L2gpValue` (%)"
          note: "ML2RHI collection"
        - text: "Other species — `ClO/L2gpValue`, `HCl/L2gpValue`, `HNO3/L2gpValue`, `N2O/L2gpValue`, `CO/L2gpValue`, `HCN/L2gpValue`, `SO2/L2gpValue`, `OH/L2gpValue`, `HO2/L2gpValue`, `BrO/L2gpValue` (volume mixing ratio)"
          note: "Collections ML2CLO, ML2HCL, ML2HNO3, ML2N2O, ML2CO, ML2HCN, ML2SO2, ML2OH, ML2HO2, ML2BRO and more. Useful range and screening differ by species"
    - name: L2 quality fields (common to all species)
      kind: instant
      period: overpass time
      items:
        - text: "1σ precision — `L2gpPrecision`"
          note: "Same units as the value; discard if zero or negative"
        - "Status bits — `Status` (discard if odd; use non-zero even values with caution)"
        - text: "Quality — `Quality`"
          note: "Must exceed the threshold"
        - text: "Convergence — `Convergence`"
          note: "Must be below the threshold"
    - name: L3 (netCDF4, averages after screening)
      kind: mean
      period: Daily / monthly
      items:
        - text: "Monthly binned mean, minimum, maximum and standard deviation per species — `value`, `minimum`, `maximum`, `std_dev` (units of the species)"
          note: "ML3MBT temperature, ML3MBO3 ozone, ML3MBH2O water vapour and more. Found in the groups `<species> PressureGrid` and `ThetaGrid` (lat-lon grids) and `PressureZM`, `ThetaZM`, `EqLZM` (zonal means) and `VortexAvg`, together with the measurement uncertainty `rms_uncertainty` and sample count `nvalues`"
        - text: "Daily binned and daily zonal means — `value`, `minimum`, `maximum`, `std_dev` (units of the species)"
          note: "Daily binned is ML3DB* (including lat-lon grids); daily zonal means are ML3DZ* (groups `<species> PressureZM`, `ThetaZM`, `EqLZM`, `VortexAvg`, with separate ascending, descending, day and night groups). `rms_uncertainty` and `nvalues` are included too"

