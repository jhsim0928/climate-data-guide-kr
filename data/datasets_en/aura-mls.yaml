example:
  lang: python
  note: "Run earthaccess.login() once with a NASA Earthdata account first. The screening thresholds are examples; take the actual values for each species and pressure range from the v6 quality document tables."
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="ML2T", version="006",               # MLS L2 temperature v6
        temporal=("2025-01-15", "2025-01-15"),
    )
    files = earthaccess.download(results[:1], "./mls")

    with h5py.File(files[0], "r") as f:
        print(list(f["HDFEOS/SWATHS"]))                  # 'Temperature', 'Temperature-APriori', ...
        g = f["HDFEOS/SWATHS/Temperature"]
        val = g["Data Fields/L2gpValue"][:]              # (profiles, levels), K
        prec = g["Data Fields/L2gpPrecision"][:]
        status = g["Data Fields/Status"][:]
        quality = g["Data Fields/Quality"][:]
        conv = g["Data Fields/Convergence"][:]

    good = (status % 2 == 0) & (quality > 0.9) & (conv < 1.03)   # example thresholds — check the quality document
    val = np.where(good[:, None] & (prec > 0), val, np.nan)
    print(val.shape, np.nanmean(val, axis=0)[:5])

tips:
  - "Do not remove negative values. The quality document warns that masking negatives biases averages of low-abundance species high (v6 water vapour is interpolated in log space and has no negatives)."
  - "Screening has four steps: use only the useful pressure range, discard points with `L2gpPrecision` ≤ 0, discard profiles with odd `Status`, and apply the `Quality` and `Convergence` thresholds. Thresholds differ by species and pressure range."
  - "Since May 2024, monthly water vapour and N2O means are built from only a few days of observations. Do not treat them as the same sampling as earlier years, and report the number of observing days per month."
  - "The team says cloud ice (IWC, IWP) should not be used on days when the 190 GHz radiometer is off, but L2 files do not yet flag those days. Filter them by date yourself."
  - "A limb profile averages over a long stretch along the line of sight. When comparing with models or reanalyses, apply the averaging kernels that the MLS team archives separately."
  - "v4 data are no longer available from GES DISC (per the MLS team). Re-check older v4-based results with v5 or v6."

