notices:
  - date: "2026-03-30"
    level: warning
    title: MLS Version 6 released — v6 recommended for new studies, v5 forward processing continues for now
    body: >-
      Version 6, a reprocessing of the whole record from the start of the mission with v6 software, was released at GES DISC (L2 citation release date 2026-03-30; quality document 2026-03-26).
      N2O (up to 20% larger in the lower stratosphere) and temperature (better precision and vertical resolution at 10–0.1 hPa) change the most. The MLS team recommends v6 for new work and keeps producing v5 for ongoing studies.
    source: https://mls.jpl.nasa.gov/
  - date: "2026-03-20"
    level: warning
    title: NASA projects the end of Aura science operations in August 2028
    body: >-
      The editor's note in the NASA Science article 'Terra: The End of An Era' (published 2025-12-29, updated 2026-03-20) projects the end of science operations, because of fuel and power limits,
      in February 2027 for Terra, September 2027 for Aqua and August 2028 for Aura. The MLS v6 quality document likewise notes that Aura operations may continue to August 2028 but other factors could bring that date forward.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2024-05-13"
    level: critical
    title: 190 GHz radiometer duty cycling begins — H2O, N2O and HCN missing most of each month
    body: >-
      Since May 2024 the 190 GHz radiometer, which has limited remaining life, is switched on only a few days a month (first period 13–20 May). On off days, H2O, N2O, HCN and HNO3 below 20 hPa are not measured,
      cloud ice (IWC, IWP) should not be used, and CH3Cl, CH3CN, ClO and HCl assume climatological water vapour and are only qualitatively useful. Ozone, CO and others are unaffected.
    source: https://mls.jpl.nasa.gov/

