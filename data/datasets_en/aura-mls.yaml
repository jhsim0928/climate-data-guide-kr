    note: Each species has its own collection, such as ML2H2O_006 for water vapour and ML2O3_006 for ozone. A free NASA Earthdata Login is required.
  - name: GES DISC HTTPS data directory (Aura MLS L2)
    url: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aura_MLS_Level2/
    method: HTTPS (wget, curl with Earthdata Login)
