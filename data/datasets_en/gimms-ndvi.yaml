# ─────────────────────────────────────────────────────────────
# GIMMS NDVI (NDVI3g → GIMMS-3G+ V1.2, PKU GIMMS NDVI) — dataset information file (English edition)
# Land tab, 'Vegetation'. Classed as 'ended': the official NDVI3g v1 successor GIMMS-3G+ and the Peking University recalibration PKU GIMMS NDVI both stop in December 2022.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gimms-ndvi
name: "GIMMS NDVI"
full_name: Global Inventory Modeling and Mapping Studies (GIMMS) AVHRR NDVI — NDVI3g v1 (1981–2015), its successor GIMMS-3G+ V1.2 (1982–2022) and the Peking University recalibration PKU GIMMS NDVI (1982–2022) (1/12°, half-monthly maximum value composites)
category: satellite
domain: land
group: 식생
order: 40
domains: [육지, 원격탐사]
provider: NASA GSFC GIMMS group (Pinzon, Tucker) / distributed by NASA ORNL DAAC (PKU GIMMS NDVI by the Piao and Zhu group, Peking University, via Zenodo)

status: ended
status_note: >-
  NDVI3g v1 ended in December 2015, and both the GIMMS team's successor GIMMS-3G+ V1.2 (ORNL DAAC, released 2023-08-24) and Peking University's recalibrated PKU GIMMS NDVI V1.2 (Zenodo, 2023) end with December 2022.
  On 2026-10-13 the NASA CMR record for GIMMS-3G+ still ended on 2022-12-31 with no newer year or version registered, and neither dataset has announced an extension, so the page is classed as 'ended'.
  It remains a standard long-term NDVI record from the 1980s, but 2023 onwards must come from other data.
successor:
  name: None (no official successor announced)
  url: https://daac.ornl.gov/cgi-bin/dsviewer.pl?ds_id=2187
  note: >-
    The GIMMS team has not released a version extending beyond 2022. For NDVI from 2023 onwards use an operational satellite NDVI such as the VIIRS vegetation indices (viirs-vi),
    but because sensor, compositing and resolution differ, do not splice it directly onto the GIMMS record; calibrate and check over an overlap period first.

period:
  start: "1982-01"
  end: "2022-12"
  note: >-
    GIMMS-3G+ V1.2 covers 1982-01-01 to 2022-12-31 according to NASA CMR (the ORNL dataset title says '1981-2022', but files start in 1982).
    PKU GIMMS NDVI has an AVHRR-only version for 1982-01 to 2015-12 and a MODIS-consolidated version for 1982-01 to 2022-12.
    The discontinued NDVI3g v1 covered 1981-07 to 2015-12 (per the NCAR Climate Data Guide), and the earlier NDVI3g (v0) ran to 2013-12.

resolution:
  spatial_short: "9 km (0.083°)"
  temporal_short: "15일"
  spatial: "1/12° (0.0833°) global latitude–longitude grid (WGS84, pixel-centre coordinates, 4320 × 2160) — common to GIMMS-3G+, NDVI3g and PKU GIMMS NDVI"
  vertical: Land surface (single level)
  temporal: "Half-monthly (two per month) maximum value composites — days 1–15 and 16 to month end for GIMMS-3G+. GIMMS-3G+ files bundle six months (12 composites) each (file names _0106, _0712)"

update: Ended (both GIMMS-3G+ and PKU end with 2022-12; no extension announced)
license: "GIMMS-3G+: openly shared without restriction under the NASA EOSDIS data use and citation guidance (download needs a free NASA Earthdata Login) / PKU GIMMS NDVI: CC BY 4.0"
account_required: true

summary: >-
  GIMMS NDVI is a global 1/12°, half-monthly NDVI record built since 1981 by joining AVHRR observations from NOAA and MetOp satellites and correcting for sensor differences,
  orbital drift and volcanic aerosols; it has been a reference dataset for more than four decades of vegetation greenness trends and phenology. The third-generation NDVI3g stopped at v1 (through 2015),
  and in 2023 NASA's GIMMS team released GIMMS-3G+ V1.2 at the ORNL DAAC, extended to 2022 with corrections. Separately, a Peking University group recalibrated NDVI3g against Landsat
  and continued it with MODIS from 2003 as PKU GIMMS NDVI (1982–2022). None of these has been extended beyond 2022.

time_convention:
  summary: >-
    Each value is a maximum value composite (MVC): the largest daily NDVI within the half-month (days 1–15 or day 16 to month end). The method suppresses cloud and atmospheric effects,
    so values are higher than the mean for the period. In GIMMS-3G+, `time` is the middle day of the compositing period (days since 1982-01-01) and `time_bnds` holds its start and end days.
  points:
    - "Each GIMMS-3G+ file holds six months, i.e. 12 composites (e.g. ndvi3g_geo_v1_2_2021_0712.nc4 = July–December 2021). In CMR, file names read v1_1 through 2014 and v1_2 from 2015."
    - "The record chains AVHRR instruments on several NOAA satellites and MetOp, so observation times and solar zenith angles differ between platforms and shift with orbital drift. The official user guide says sensor calibration, orbital drift and solar zenith biases were reduced but not eliminated."
    - "Missing or cloudy pixels are filled by spline interpolation or an average seasonal profile; the `percentile` variable carries a flag (integer quotient of the value by 2000) telling which."
    - "PKU GIMMS NDVI also follows the half-monthly maximum-composite scheme; from 2003 the consolidated version uses MODIS 16-day composites (MOD13C1) distributed to half-months by time weighting and resampled to 1/12°."
  source: https://daac.ornl.gov/VEGETATION/guides/Global_Veg_Greenness_GIMMS_3G.html
  source_name: "ORNL DAAC — Global Vegetation Greenness (NDVI) from AVHRR GIMMS-3G+, 1981-2022 (user guide) + Li et al. (2023) ESSD"

variables:
  note: >-
    GIMMS-3G+ follows the netCDF4 variable table in the ORNL DAAC user guide; the integer variables use −32768 as fill. PKU GIMMS NDVI is distributed as unnamed GeoTIFF (uint16) bands,
    so only their content is listed (from the Zenodo description). The variable layout of NDVI3g v1 could not be confirmed in official documentation and is not listed.
  full_list: https://daac.ornl.gov/VEGETATION/guides/Global_Veg_Greenness_GIMMS_3G.html
  groups:
    - name: GIMMS-3G+ V1.2 (NASA, 1982–2022)
      kind: max
      period: Half-month (days 1–15, 16 to month end)
      items:
        - text: "Normalized difference vegetation index NDVI — `ndvi` (dimensionless, stored value ÷ 10000)"
          note: "Valid range −0.03 to 1.0. −5000 marks pixels where NDVI could not be computed"
        - text: "Percentile and quality flag — `percentile` (encoded integer)"
          kind: instant
          note: "Value = percentile×10 + flag×2000. Flag 0 good, 1 spline interpolation, 2 average seasonal profile (possible snow or cloud), 3 missing. Percentile baseline 1982–2021"
        - text: "Number of contributing satellites — `satellites` (count)"
          kind: instant
          note: Number of platforms used in the compositing period
    - name: PKU GIMMS NDVI V1.2 (Peking University; AVHRR-only 1982–2015 / MODIS-consolidated 1982–2022)
      kind: max
      period: Half-month
      items:
        - text: "NDVI recalibrated to Landsat (dimensionless, stored value × 0.001)"
          note: "GeoTIFF uint16, valid 0–1000, fill 65535. In the consolidated version, values from 2003 are based on MODIS MOD13C1"
        - text: "Quality control (QC) layer"
          kind: instant
          note: The Zenodo description recommends using the QC layer, but its value definitions are only in the bundled Readme and could not be confirmed here

