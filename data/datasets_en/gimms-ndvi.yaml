transitions:
  - from: GIMMS NDVI3g v1
    to: GIMMS-3G+ V1.2
    status: completed
    date: "2023-08"
    summary: >-
      The successor released at the ORNL DAAC by the same NASA GIMMS team, extending the NDVI3g record to 2022 with corrections. The grid (1/12°) and half-monthly maximum-composite scheme are unchanged,
      but distribution moved to the ORNL DAAC with a DOI, MetOp AVHRR data were added, and some corrections were revised. This version also stops in December 2022.
    changes:
      - aspect: Period
        before: "1981-07 to 2015-12"
        after: "1982-01 to 2022-12 (per CMR)"
      - aspect: Input satellites
        before: "AVHRR on NOAA satellites (NOAA-7, 9, 11, 14, 16, 17, 18, etc.)"
        after: "AVHRR on NOAA satellites plus EUMETSAT MetOp satellites"
      - aspect: Corrections (the three fixes listed in the ORNL user guide)
        before: "The earlier version (called 'Version 0' in the guide) masked negative NDVI over snow-covered northern winter regions to zero, creating phenology artefacts / NDVI drops after 2006 from calibration issues / missing coastline pixels"
        after: "Negative NDVI restored / whole-mission SeaWiFS land products reprocessed to reduce post-2006 drops / coastline pixel time series adjusted"
      - aspect: Distribution and identifiers
        before: "Distributed from NASA NEX project servers, no dataset DOI"
        after: "NASA ORNL DAAC (Earthdata Cloud) — DOI 10.3334/ORNLDAAC/2187, CMR short name Global_Veg_Greenness_GIMMS_3G_2187"
      - aspect: File layout
        before: "Half-yearly netCDF4 not following CF conventions (NCAR Climate Data Guide)"
        after: "Half-yearly netCDF4 ndvi3g_geo_v1_2_YYYY_0106/0712.nc4 (file names v1_1 for 1982–2014), variables ndvi, percentile, satellites, time_bnds"
    impacts:
      - Do not mix NDVI3g v1 and GIMMS-3G+ in one time series; re-download from 1982 as GIMMS-3G+. Winter high-latitude NDVI and post-2006 values differ most.
      - File names say v1_1 up to 2014 and v1_2 from 2015, but ORNL distributes them as one dataset (V1.2). Do not split the record by this label.
      - GIMMS-3G+ cannot extend the record beyond 2022 either.
    sources:
      - name: ORNL DAAC user guide — Global Vegetation Greenness (NDVI) from AVHRR GIMMS-3G+, 1981-2022
        url: https://daac.ornl.gov/VEGETATION/guides/Global_Veg_Greenness_GIMMS_3G.html
      - name: Pinzon & Tucker (2014), NDVI3g
        url: https://doi.org/10.3390/rs6086929
      - name: NCAR Climate Data Guide — NDVI3g
        url: https://climatedataguide.ucar.edu/climate-data/ndvi-normalized-difference-vegetation-index-3rd-generation-nasagfsc-gimms
  - from: GIMMS NDVI3g v1
    to: PKU GIMMS NDVI V1.2 (Peking University)
    status: completed
    date: "2023-08"
    summary: >-
      Not an official NASA release but a recalibration by a Peking University group. NDVI3g v1 was recalibrated with biome-specific neural networks (BPNN) trained on about 3.6 million Landsat NDVI samples,
      reducing orbital drift and sensor degradation artefacts, and extended to 2022 with MODIS NDVI from 2003. It appeared as an alternative after NDVI3g updates stopped in 2015, and it too stops in 2022.
    changes:
      - aspect: Period and composition
        before: "1981-07 to 2015-12, AVHRR only"
        after: "AVHRR-only version 1982-01 to 2015-12 / MODIS-consolidated version 1982-01 to 2022-12 (1982–2002 AVHRR-based, 2003–2022 MODIS MOD13C1 V6.1-based, linked with pixel-wise random forests over the 2003–2015 overlap)"
      - aspect: Calibration reference
        before: "AVHRR inter-sensor calibration (Pinzon & Tucker 2014 approach)"
        after: "Biome-specific neural-network recalibration to Landsat 5, 7 and 8 NDVI (cross-calibrated to the Landsat 7 level)"
      - aspect: Accuracy against Landsat (1984–2015)
        before: "R² 0.94, RMSE 0.09, MAPE 20%"
        after: "R² 0.97, RMSE 0.05, MAPE 9% — tropical evergreen broadleaf forest R² 0.16 → 0.47"
      - aspect: File format and licence
        before: "netCDF4, NASA open data"
        after: "GeoTIFF (uint16, ×0.001, fill 65535), CC BY 4.0, Zenodo DOI 10.5281/zenodo.8253971"
    impacts:
      - The PKU version is a derived product separate from NASA's GIMMS-3G+. Trends can differ between the two, so compare them rather than resting conclusions on one.
      - The consolidated version uses MODIS values from 2003, carrying Terra MODIS characteristics (including orbital drift). Use the AVHRR-only version (to 2015) if AVHRR-only consistency is needed.
      - No extension beyond 2022 has been announced (V1.2 was the latest Zenodo version on 2026-10-13).
    sources:
      - name: Li et al. (2023), ESSD — PKU GIMMS NDVI
        url: https://doi.org/10.5194/essd-15-4181-2023
      - name: Zenodo — PKU GIMMS NDVI V1.2
        url: https://doi.org/10.5281/zenodo.8253971

