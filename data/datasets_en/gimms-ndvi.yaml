    note: The older NDVI3g (v0) for 1981-07 to 2013-12. It is neither v1 nor GIMMS-3G+ and should not be used for new analyses.

example:
  lang: python
  note: >-
    Downloads the GIMMS-3G+ file for the second half of 2021 with earthaccess and decodes NDVI and the quality flag over Korea. On first run you will be asked for your Earthdata username and password.
    The file is opened without automatic scaling so the storage rules (÷10000, −32768 fill, −5000 not computable) can be applied explicitly.
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # free NASA Earthdata account
    results = earthaccess.search_data(
        short_name="Global_Veg_Greenness_GIMMS_3G_2187", version="1",
        temporal=("2021-07-01", "2021-12-31"),
    )
    files = earthaccess.download(results, "gimms3g_plus")

    ds = xr.open_dataset(files[0], mask_and_scale=False)
    sub = ds.sel(lon=slice(124, 132))
    sub = sub.sel(lat=slice(33, 39)) if sub.lat[0] < sub.lat[-1] else sub.sel(lat=slice(39, 33))

    raw = sub["ndvi"]
    ndvi = (raw.where((raw != -32768) & (raw != -5000)) / 10000.0)
    pct = sub["percentile"]
    flag = pct // 2000                      # 0 good, 1 spline, 2 seasonal profile, 3 missing
    ndvi_good = ndvi.where(flag == 0)
    print(ndvi_good.mean(dim=("lat", "lon")).values)   # area mean of the 12 half-month composites

tips:
  - "Half-monthly maximum value composites are higher than the mean NDVI for the same period. When building monthly values, state in the paper whether you took the maximum or the mean of the two composites."
  - "NDVI3g v1 (to 2015), GIMMS-3G+ (to 2022) and PKU GIMMS NDVI come from the same AVHRR raw data but are calibrated differently, so their values differ. Do not mix versions, and cite the exact version name and DOI."
  - "The official user guide states that atmospheric effects such as Mt. Pinatubo (1991) and sensor calibration, orbital drift and solar zenith biases were not completely removed. Check long-term trends against satellite changeover dates."
  - "The PKU authors report that orbital drift and sensor degradation artefacts in NDVI3g were largest over tropical evergreen broadleaf forest. For tropical forest trends, compare the PKU version with GIMMS-3G+."
  - "The PKU consolidated version uses MODIS values from 2003, so its source differs before and after. If AVHRR-only consistency matters for 1982–2015, use the AVHRR-only (solely) version. The Zenodo description recommends removing sparse vegetation (NDVI below 0.1) in trend analyses."
  - "There are no GIMMS-family data from 2023 onwards. If you continue with VIIRS or MODIS NDVI, first check their differences over an overlap period (e.g. 2012–2022)."

