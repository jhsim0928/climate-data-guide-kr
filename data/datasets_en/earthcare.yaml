notices:
  - date: "2026-09-08"
    level: info
    title: ATLID L2 profile processor (A-PRO) released at baseline BD
    body: >-
      A-PRO 11.70 (baseline BD), which produces ATL_AER_2A, ATL_EBD_2A, ATL_ICE_2A and ATL_TC__2A, was released together with BMA_FLX_2B (BMA-FLX 11.60, BD).
      ESA's data quality page says a CA baseline fixing the BD stratospheric ATLID issue will follow.
    source: https://earth.esa.int/eogateway/missions/earthcare/data
  - date: "2026-09-08"
    level: info
    title: No data during parts of 1–4 and 8–11 September 2026 because of orbit manoeuvres
    body: >-
      Two series of four maintenance manoeuvres were carried out, and no data are available during each window (about 50 minutes). The notice gives the 8–11 September windows in UTC.
    source: https://earth.esa.int/eogateway/news/earthcare-data-unavailability-due-to-planned-orbit-manoeuvres-8-11-september-2026
  - date: "2026-07-15"
    level: info
    title: ATLID, MSI and BBR L1 released at baseline CA
    body: >-
      ATL_NOM_1B (ATLID L1 5.50), MSI_NOM_1B and MSI_RGR_1C (MSI L1 5.20), BBR_NOM_1B and BBR_SNG_1B (BBR L1 5.00) and the joint standard grid AUX_JSG_1D moved to baseline CA.
    source: https://earth.esa.int/eogateway/missions/earthcare/data
  - date: "2026-06-25"
    level: info
    title: ECMWF assimilating EarthCARE CPR operationally since 10 June 2026
    body: >-
      ESA reported that ECMWF began assimilating EarthCARE cloud profiling radar (CPR) data in its Integrated Forecasting System (IFS) on 10 June, a first for spaceborne cloud radar data in operations.
    source: https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/A_first_EarthCARE_cloud_data_sharpen_weather_forecasts
  - date: "2026-04-23"
    level: warning
    title: ATLID BD baseline — negative stratospheric cross-polar values and laser-energy normalisation bug
    body: >-
      Since 23 April 2026 an L1C processor issue has produced negative cross-polar signals in the stratosphere; it is to be fixed in the CA baseline with reprocessing.
      Separately, from 21 April to 19 May, normalisation went wrong when laser energy fell below 30 mJ, producing low-backscatter bands; this has been fixed.
    source: https://earth.esa.int/eogateway/missions/earthcare/data/data-quality
  - date: "2025-01-16"
    level: info
    title: EarthCARE L1 data opened to all users
    body: >-
      After commissioning ended in late 2024, L1 data from ATLID, MSI and BBR (ESA) and CPR (JAXA) became freely available to everyone.
      ESA said single-instrument L2 would follow in March 2025 and multi-instrument L2 in phases over the following months.
    source: https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/EarthCARE_goes_live_with_data_now_available_to_all

