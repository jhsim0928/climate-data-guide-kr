notices:
  - date: "2026-09-16"
    level: info
    title: ASCAT winds interrupted by a Metop-C out-of-plane manoeuvre (OSI-102-c, OSI-104-c)
    body: >-
      OSI SAF service message 3579 announced that a Metop-C out-of-plane manoeuvre around 12:00 UTC on 2026-09-16 might cause a considerable outage of the OSI SAF and EARS Metop-C ASCAT winds.
      Manoeuvres and anomalies like this leave gaps of several hours, so check for missing data around such times.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/metop-c-ascat-wind-products-planned-outage-16-september-out
  - date: "2026-06-18"
    level: info
    title: ASCAT-B L1b calibration updated — small across-swath variations since July 2024 corrected
    body: >-
      According to the KNMI ASCAT-B product history, the ASCAT-B level 1b calibrations were updated to correct small across-swath variations present since July 2024.
      Take care with this period (2024-07 to 2026-06) if you compare or average near-real-time ASCAT-B winds by WVC position.
    source: https://scatterometer.knmi.nl/ascat_b_osi_25_prod/
  - date: "2026-02-25"
    level: info
    title: MetOp-SG-B1, carrying the successor scatterometer SCA, scheduled for launch in October 2026 (ESA)
    body: >-
      ESA said that MetOp Second Generation B1, whose scatterometer will measure ocean-surface wind vectors and land-surface soil moisture, was scheduled for launch from Kourou, French Guiana, in October 2026.
      WMO OSCAR (updated 2026-09-23) lists November 2026, so check EUMETSAT announcements for the exact date and for when SCA data will be released.
    source: https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp_Second_Generation/First_MetOp_Second_Generation-B_satellite_spreads_its_wing
  - date: "2021-11-15"
    level: warning
    title: Metop-A mission ends — ASCAT-A wind production stops and deorbiting begins
    body: >-
      After fifteen years in service, Metop-A began deorbiting manoeuvres on 2021-11-15, and the OSI SAF Metop-A ASCAT winds (OSI-102, OSI-104) ended on the same day.
      Since then only Metop-B and Metop-C provide ASCAT winds, so daily coverage dropped from that date.
    source: https://www.eumetsat.int/europes-first-meteorological-satellite-polar-orbit-ends-its-run
  - date: "2019-10-02"
    level: info
    title: Metop-C ASCAT winds become operational
    body: >-
      Metop-C ASCAT 25 km and coastal winds, produced as demonstration products since February 2019, gained operational status and were made available to all users on EUMETCast from 2019-11-28.
    source: https://scatterometer.knmi.nl/ascat_c_osi_25_prod/
  - date: "2018-09-25"
    level: warning
    title: OSI SAF ASCAT winds switch to CMOD7 and stress-equivalent winds
    body: >-
      The geophysical model function changed from CMOD5.n to CMOD7, and stress-equivalent ECMWF winds replaced real 10 m ECMWF winds as the background (AWDP 3_2_01).
      The wind definition and values differ before and after this date, so take care in long-term analyses that splice the near-real-time record.
    source: https://scatterometer.knmi.nl/ascat_b_osi_25_prod/

transitions:
  - from: Metop-A ASCAT (ASCAT-A)
    to: Metop-B/C ASCAT (ASCAT-B, ASCAT-C)
    status: completed
    date: "2021-11"
    summary: >-
      Metop-A ASCAT winds, available since 2007, ended on 2021-11-15. The record continues with Metop-B, flying alongside since 2012, and Metop-C, operational since 2019.
      The three ASCATs share the same design but differ slightly in calibration, which is why RSS produced a separate inter-calibrated A/B/C climate record (V2.1/V2.1.1).
    changes:
      - aspect: Satellites
        before: "Metop-A (launched 2006-10-19, retired 2021-11-30)"
        after: "Metop-B (launched 2012-09-17), Metop-C (launched 2018-11-07)"
      - aspect: Near-real-time wind period
        before: "Demonstration from 2007-03-28, operational from 2008-12-03 to 2021-11-15"
        after: "ASCAT-B: development version 2012-11, operational 2013-05-27 onward; ASCAT-C: demonstration 2019-02, operational 2019-10 onward"
      - aspect: Orbit
        before: "Drifting orbit from June 2017 to extend its life — ascending-node local time moved earlier from 21:30 (June 2017) to 19:30 (2021)"
        after: "Sun-synchronous orbits with a fixed equator crossing time (per WMO OSCAR, Metop-B 09:00 and Metop-C 09:31 descending)"
      - aspect: Calibration stability (RSS analysis)
        before: "Two small calibration steps (each under 0.1 m/s) in mid-2016 and late 2019 — corrected in RSS V2.1.1"
        after: "Stable after the first six months; ASCAT-C about 0.05 m/s lower than ASCAT-B"
      - aspect: PO.DAAC collections
        before: "ASCATA-L2-25km, ASCATA-L2-Coastal, ASCATA_L2_25KM_CDR"
        after: "ASCATB-L2-25km and ASCATC-L2-25km, ASCATB-L2-Coastal and ASCATC-L2-Coastal"
    impacts:
      - "After 2021-11-15 the number of ASCATs dropped from three to two, changing daily coverage and sampling. Split statistics that are sensitive to sampling at this date."
      - "Calibration differences of around 0.1 m/s may exist when switching satellites, so use an inter-calibrated climate record such as RSS V2.1/V2.1.1 or check the differences over overlap periods."
      - "Metop-A flew in a drifting orbit from June 2017, so its overpass time moved about 2 hours earlier by 2021. Keep this in mind for winds with a diurnal cycle, such as sea breezes."
    sources:
      - name: OSI SAF — Metop-C ASCAT 25 km Winds (OSI-102-c) product history
        url: https://osi-saf.eumetsat.int/products/osi-102-c
      - name: EUMETSAT — Metop-A end of mission (2021-11-15)
        url: https://www.eumetsat.int/europes-first-meteorological-satellite-polar-orbit-ends-its-run
      - name: EUMETSAT — decision to operate Metop-A in a drifting orbit
        url: https://www.eumetsat.int/eumetsat-council-agreed-ageing-still-healthy-metop-satellite-will-be-exploited-drifting-orbit-june
      - name: RSS — ASCAT-A, -B and -C ocean surface wind CDR announcement (2021-08-16)
        url: https://www.remss.com/announcement/ASCAT-ABC-ocean-surface-wind-CDR
      - name: Ricciardulli & Manaster (2021), Remote Sensing
        url: https://doi.org/10.3390/rs13183678
  - from: OSI SAF ASCAT winds (CMOD5.n, 10 m neutral winds)
    to: OSI SAF ASCAT winds (CMOD7, 10 m stress-equivalent winds)
    status: completed
    date: "2018-09"
    summary: >-
      On 2018-09-25 the KNMI processor changed (AWDP 3_2_01): the model function became CMOD7, the winds became 10 m stress-equivalent winds, and the ECMWF background winds became stress-equivalent as well.
      The near-real-time record was not reprocessed, so values with different definitions sit on either side of this date.
    changes:
      - aspect: Geophysical model function (GMF)
        before: CMOD5.n
        after: CMOD7
      - aspect: Wind definition
        before: "10 m equivalent neutral wind (+0.2 m/s at the switch to neutral winds in November 2008)"
        after: "10 m stress-equivalent wind (accounts for atmospheric stability and air density)"
      - aspect: Background model winds (model_speed, model_dir)
        before: Real 10 m ECMWF winds
        after: Stress-equivalent ECMWF winds
      - aspect: Processor
        before: AWDP 2.x
        after: "AWDP 3_2_01 (upgraded to 3_3_01 on 2022-10-04)"
    impacts:
      - "Using near-real-time values from before and after 2018-09-25 as one time series mixes definitions. Use reprocessed data for long-term analyses."
      - "For a fair comparison with buoys, convert buoy winds to the same stress-equivalent definition (KNMI CMOD7 guidance)."
      - "Some PO.DAAC descriptions (coastal products) still mention CMOD5.n, so rely on the KNMI and OSI SAF histories for version information."
    sources:
      - name: KNMI — OSI SAF ASCAT-B 25 km product history
        url: https://scatterometer.knmi.nl/ascat_b_osi_25_prod/
      - name: KNMI — CMOD7 description
        url: https://scatterometer.knmi.nl/cmod7/
      - name: ASCAT Wind Product User Manual v1.17
        url: https://scatterometer.knmi.nl/publications/pdf/ASCAT_Product_Manual.pdf
  - from: Metop ASCAT
    to: Metop-SG-B SCA (Scatterometer)
    status: planned
    date: "2026"
    summary: >-
      SCA, a C-band scatterometer on the B-type satellites of EUMETSAT's second-generation polar system Metop-SG, will succeed ASCAT. The first, B1, is due to launch in October 2026 according to ESA and November 2026 according to WMO OSCAR;
      when checked on 2026-10-13 there was no official schedule for SCA data release. Wider swaths and cross-polarised measurements are meant to improve resolution and extend the range of measurable high winds.
    changes:
      - aspect: Satellites
        before: "Metop-B (2012 onward), Metop-C (2018 onward)"
        after: "Metop-SG-B1 (launch planned 2026), B2 (planned 2033), B3 (planned 2040)"
      - aspect: Frequency
        before: C-band 5.255 GHz
        after: "C-band, about 5.355 GHz"
      - aspect: Swath
        before: "Two swaths of about 550 km (separated by about 700 km; effective width 525 km)"
        after: "Two 660 km swaths with a 525 km gap, three azimuth looks (45°, 90°, 135°), near-global coverage in about 1.5 days"
      - aspect: Resolution
        before: "25 km spacing (effective about 50 km); coastal product 12.5 km spacing (effective 25 km)"
        after: "Nominal 25 km sampled every 12.5 km; high-resolution mode 15–20 km sampled every 6.25 km (WMO OSCAR)"
      - aspect: Polarisation and high winds
        before: "VV polarisation; winds above 25 m/s less reliable"
        after: "VV plus cross-polarisation (VH) on the mid beam — expected to measure winds up to about 40 m/s or more (SCA Science Plan)"
    impacts:
      - "Once SCA data are released, check inter-calibration results over the overlap with ASCAT before joining the records. Different model functions and resolution can create steps if they are simply spliced."
      - "Confirm the launch date and the data release (demonstration and operational) schedule through EUMETSAT and OSI SAF announcements."
    sources:
      - name: ESA — First MetOp Second Generation-B satellite spreads its wing (2026-02-25)
        url: https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp_Second_Generation/First_MetOp_Second_Generation-B_satellite_spreads_its_wing
      - name: WMO OSCAR — Metop-SG-B1
        url: https://space.oscar.wmo.int/satellites/view/metop_sg_b1
      - name: WMO OSCAR — SCA scatterometer
        url: https://space.oscar.wmo.int/instruments/view/sca_scatterometer
      - name: ESA/EUMETSAT SCA Science Plan (2019)
        url: https://user.eumetsat.int/s3/eup-strapi-media/pdf_science_epssg_sca_plan_b35ccedaa8.pdf
      - name: ESA — MetOp-SG facts and figures
        url: https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp_Second_Generation/MetOp-SG_facts_and_figures

