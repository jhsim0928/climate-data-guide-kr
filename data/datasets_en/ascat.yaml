# ─────────────────────────────────────────────────────────────
# Metop ASCAT ocean surface winds — dataset information file (English edition)
# Satellite tab (ocean surface wind), also listed in the Ocean tab (satellite observations). Centred on the EUMETSAT OSI SAF (produced by KNMI) Metop-B/C ASCAT L2 swath winds
# (25 km OSI-102, 12.5 km coastal OSI-104), with the Metop-A climate data record (OSI-150), Copernicus Marine L3 daily grids and the RSS V2.1 climate record also covered.
# When checked on 2026-10-13, PO.DAAC held Metop-B/C L2 data up to orbits on the morning of 2026-10-13. The follow-on Metop-SG-B1 (scatterometer SCA) is due to launch in late 2026.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: ascat
name: Metop ASCAT ocean winds
full_name: Metop Advanced Scatterometer (ASCAT) ocean surface winds — EUMETSAT OSI SAF L2 wind products
category: satellite
domain: satellite
group: 해상풍
order: 20
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 대기, 원격탐사]
provider: EUMETSAT OSI SAF (produced by KNMI) / NASA PO.DAAC (redistribution) / Copernicus Marine (L3 grids) / Remote Sensing Systems (V2.1 climate record)

status: active
status_note: >-
  ASCAT winds from Metop-B (since 2012) and Metop-C (since 2019) are produced continuously in near real time; Metop-A wind production ended on 2021-11-15, when the satellite began its deorbiting.
  When checked on 2026-10-13, PO.DAAC held Metop-B and Metop-C 25 km and coastal L2 files up to orbits starting at 10–11 UTC on 2026-10-13 (about 2–3 hours behind), Copernicus Marine L3 NRT ran through 2026-10-12, and RSS V2.1 gridded files through 2026-09-08.
  ESA said on 2026-02-25 that Metop-SG-B1, which carries the successor scatterometer SCA, was scheduled to launch in October 2026; WMO OSCAR (updated 2026-09-23) lists November 2026. No official schedule for SCA data release has been announced yet.

period:
  start: "2007-01"
  end: present
  note: >-
    Near-real-time Metop-A ASCAT winds started as a demonstration product on 2007-03-28, became operational on 2008-12-03 and ended on 2021-11-15. Metop-B followed with a first development version on 2012-11-14 and operational status on 2013-05-27,
    and Metop-C with a demonstration on 2019-02-12 and operational status in October 2019. The reprocessed Metop-A climate data record OSI-150 starts on 2007-01-01; its end date is given as 2014-12-31 on the OSI SAF page but as March 2014 (2014-04-01) on the KNMI page and at PO.DAAC.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    L2 swath: wind vector cells (WVCs) every 25 km (42 per row = 21 per swath on each side; effective swath width 525 km). PO.DAAC gives the effective resolution as 50 km.
    Coastal L2 (OSI-104): 12.5 km spacing (82 per row), averaging backscatter within 15 km of each WVC centre, effective resolution 25 km. A 6 km demonstration product (OSI-AW5.7, Metop-B) is on the KNMI FTP site only.
    Copernicus Marine L3: 0.125° (from 12.5 km coastal input) and 0.25° (from 25 km input) latitude–longitude grids.
  vertical: "10 m wind over the sea surface. Stress-equivalent wind since 2018-09-25; 10 m equivalent neutral wind before that"
  temporal: >-
    L2: one file per orbit (about 100 minutes); each WVC is an instantaneous observation at overpass. A single satellite passes a given location at most twice a day (morning descending, evening ascending), leaving gaps between swaths.
    L3 (Copernicus Marine, RSS): daily files with ascending and descending passes gridded separately (not averages).

coverage:
  short: 전지구
  note: "Global ice-free oceans. No retrievals over land; the 25 km product misses about 35 km nearest the coast (the coastal product reaches about 15 km), and values over sea ice must be removed with flags. Gaps remain between daily swaths"
update: "L2 near real time: every orbit, about 2 hours after sensing (OSI SAF target within 2 h 45 min). Copernicus Marine L3 NRT: daily (12 UTC next day, again at 00 UTC two days later). Copernicus Marine L3 reprocessed (MY): monthly. RSS V2.1: irregular (when checked on 2026-10-13, through 2026-09-08, posted 2026-09-11)"
license: >-
  OSI SAF wind products are CC BY 4.0 with attribution to EUMETSAT OSI SAF. KNMI asks for the credit "copyright (year) EUMETSAT" on each product used.
  RSS ASCAT data follow the RSS terms of use (product-specific acknowledgement; tell support@remss.com about publications)
account_required: true

summary: >-
  ASCAT is a C-band (5.255 GHz) scatterometer on Europe's Metop weather satellites. Beams pointing in three azimuth directions illuminate two swaths, each about 550 km wide, on either side of the ground track,
  and the 10 m wind speed and direction are retrieved from sea-surface roughness. EUMETSAT OSI SAF produces 25 km (OSI-102) and 12.5 km coastal (OSI-104) L2 winds at KNMI about 2 hours after sensing,
  and NASA PO.DAAC and Copernicus Marine redistribute or grid them. The record, which began with Metop-A in 2007, is widely assimilated in reanalyses and weather forecasting, used to evaluate ocean-model wind forcing
  and to study wind stress and curl, and is a key input to multi-satellite wind analyses such as CCMP.

time_convention:
  summary: >-
    Values in the L2 swath files are instantaneous observations taken as the satellite passed over each wind vector cell (WVC), and each WVC carries its observation time (time, seconds since 1990-01-01 00:00:00). Each file covers one orbit (about 100 minutes).
    Copernicus Marine L3 daily files are not daily means either: instantaneous observations are gridded separately for ascending and descending passes, and each grid cell keeps its actual observation time (measurement_time).
  points:
    - "In NetCDF (L2 and L3) the wind direction follows the oceanographic convention (direction the wind blows toward; 0° = blowing toward north), while BUFR uses the meteorological convention (direction the wind comes from). Watch for the 180° difference when comparing with meteorological directions."
    - "Metop-B and Metop-C are in sun-synchronous orbits crossing the equator southbound at about 09:00–09:30 local solar time, so they usually pass a location in the morning (descending) and evening (ascending). The data cannot be used as they are for daily means or diurnal cycles."
    - "Since 2018-09-25 the winds are 10 m stress-equivalent winds (which account for atmospheric stability and air density so that they relate directly to surface stress). They are defined differently from real 10 m winds, so use the same definition when comparing with buoys or models."
    - "model_speed and model_dir are ECMWF model winds interpolated to the observation as background values used for ambiguity removal; they are not observations."
    - "Copernicus Marine L3 NRT daily files appear at 12 UTC the next day and are refreshed once more at 00 UTC two days later."
  source: https://scatterometer.knmi.nl/publications/pdf/ASCAT_Product_Manual.pdf
  source_name: ASCAT Wind Product User Manual v1.17 (OSI SAF/EARS, KNMI) + Copernicus Marine WIND_GLO_PHY_L3 product user manual

variables:
  note: >-
    L2 variable names follow Appendix B (NetCDF) of the ASCAT Wind Product User Manual and match the PO.DAAC variable list. NetCDF files hold only the selected wind solution (no ambiguities or sigma0), in swath-shaped (NUMROWS, NUMCELLS) arrays.
    L3 variable names follow the Copernicus Marine product user manual.
  full_list: https://scatterometer.knmi.nl/publications/pdf/ASCAT_Product_Manual.pdf
  groups:
    - name: L2 swath (OSI SAF 25 km and 12.5 km coastal NetCDF, same at PO.DAAC)
      kind: instant
      items:
        - text: "10 m wind speed — `wind_speed` (m s-1)"
          note: Stress-equivalent wind since 2018-09-25
        - text: "10 m wind direction — `wind_dir` (degree)"
          note: Oceanographic convention (direction blowing toward)
        - text: "ECMWF model 10 m wind speed — `model_speed` (m s-1)"
          note: Background model wind (not an observation)
          std: []
        - text: "ECMWF model 10 m wind direction — `model_dir` (degree)"
          note: Background model wind (not an observation)
          std: []
        - text: "Ice probability — `ice_prob` (1)"
          std: []
        - text: "Ice age (a-parameter) — `ice_age` (dB)"
          std: []
        - text: "WVC quality flag — `wvc_quality_flag` (bits)"
          note: "Do not use WVCs with bit 16 (VarQC), 17 (KNMI QC) or 18 (monitoring) set (user manual)"
          std: []
        - text: "Backscatter distance (from the model function) — `bs_distance` (1)"
          std: []
        - text: "Observation time — `time` (seconds since 1990-01-01 00:00:00)"
          std: []
    - name: L3 daily grids (Copernicus Marine, per satellite and pass direction)
      kind: instant
      items:
        - text: "10 m eastward wind (stress-equivalent) — `eastward_wind` (m s-1)"
          std: [wind10]
        - text: "10 m northward wind (stress-equivalent) — `northward_wind` (m s-1)"
          std: [wind10]
        - text: "10 m wind speed (stress-equivalent) — `wind_speed` (m s-1)"
          std: [wind10]
        - text: "10 m wind direction (blowing toward) — `wind_to_dir` (degree)"
        - "Wind stress magnitude — `wind_stress_magnitude` (N m-2)"
        - "Eastward and northward wind stress — `eastward_stress`, `northward_stress` (N m-2)"
        - "Wind stress curl and divergence — `stress_curl`, `stress_divergence` (N m-3)"
        - text: "10 m wind curl and divergence — `wind_curl`, `wind_divergence` (s-1)"
          std: []
        - text: "Air density — `air_density` (kg m-3)"
          std: []
        - text: "Per-cell observation time — `measurement_time` (seconds since 1990-01-01 00:00:00)"
          std: []

access:
  - name: NASA PO.DAAC — Metop-C ASCAT L2 25 km (ASCATC-L2-25km)
    url: https://podaac.jpl.nasa.gov/dataset/ASCATC-L2-25km
    method: Earthdata Search / earthaccess / OPeNDAP / Harmony subsetting / podaac-data-subscriber
    note: >-
      Metop-B is ASCATB-L2-25km (from 2012-10-29), the coastal products are ASCATB-L2-Coastal and ASCATC-L2-Coastal, the ended Metop-A records are ASCATA-L2-25km and ASCATA-L2-Coastal (to 2021-11-15),
      and the Metop-A climate data record is ASCATA_L2_25KM_CDR. Each NetCDF file holds one orbit. A free NASA Earthdata Login is required.
  - name: EUMETSAT Data Store (original OSI SAF archive, full record)
    url: https://data.eumetsat.int/
    method: Web search and download, EUMETSAT Data Access API (BUFR and NetCDF)
    note: >-
      For example, OSI-102-c is collection EO:EUM:DAT:0760, OSI-104-b is EO:EUM:DAT:0192, OSI-104-c is EO:EUM:DAT:0202 and the Metop-A climate record OSI-150-a is EO:EUM:DAT:METOP:OSI-150-A.
      A free EUMETSAT account is required. The data are also broadcast in real time via EUMETCast.
  - name: OSI SAF / KNMI FTP (last 3 days)
    url: https://osi-saf.eumetsat.int/products/osi-102-b
    method: FTP (ftppro.knmi.nl; directories ascat_b_osi and ascat_c_osi, 6 km demonstration product in ascat_b_osi_057)
    note: Credentials are provided on request after registration. Only the last 3 days are kept, so get older data from the Data Store or PO.DAAC.
  - name: Copernicus Marine — L3 daily grids NRT (WIND_GLO_PHY_L3_NRT_012_002)
    url: https://data.marine.copernicus.eu/product/WIND_GLO_PHY_L3_NRT_012_002/description
    method: copernicusmarine toolbox (Python and command line) / web subsetting
    note: >-
      Metop-B and Metop-C (0.125° and 0.25°) and the HY-2, Oceansat-3 and FY-3E scatterometers, as separate datasets per satellite and pass direction (from 2016-01-01; e.g. cmems_obs-wind_glo_phy_nrt_l3-metopc-ascat-des-0.125deg_P1D-i).
      A reprocessed product, WIND_GLO_PHY_L3_MY_012_005 (1991-08 to 2026-06; Metop-A/B, QuikSCAT, ERS, Oceansat-2), is also available. A free Copernicus Marine account is required.
  - name: RSS ASCAT V2.1 (C-2015 model function; inter-calibrated A/B/C climate record)
    url: https://data.remss.com/ascat/
    method: Direct HTTPS download (metopa, metopb and metopc folders; daily 0.25° grids in bmaps_v02.1, swaths in ascat*_wind_vectors_v02.1)
    note: RSS's own processing, separate from OSI SAF. Daily grids hold separate morning (descending) and evening (ascending) maps.
    login: false

example:
  lang: python
  note: >-
    Downloads Metop-C 25 km L2 files from PO.DAAC with earthaccess, applies the quality flags recommended in the user manual (VarQC, KNMI QC, monitoring) around the Korean Peninsula and prints the mean wind speed.
    Run earthaccess.login() once with your NASA Earthdata account first. Files from the KNMI FTP site (.nc.gz) need to be decompressed first.
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="ASCATC-L2-25km",            # Metop-B: ASCATB-L2-25km, coastal: ASCATC-L2-Coastal
        temporal=("2025-08-01", "2025-08-01T23:59:59"),
        bounding_box=(120, 30, 135, 40),        # west, south, east, north (around Korea)
    )
    files = earthaccess.download(results, "./ascat")

    REJECT = (1 << 16) | (1 << 17) | (1 << 18)  # VarQC failed, KNMI QC failed, monitoring flag
    for f in files:
        ds = xr.open_dataset(f)
        lon = ds["lon"] % 360                    # works whether longitudes are 0–360 or ±180
        flag = ds["wvc_quality_flag"].fillna(0).astype("int64")
        box = (ds["lat"] >= 30) & (ds["lat"] <= 40) & (lon >= 120) & (lon <= 135)
        ws = ds["wind_speed"].where(box & ((flag & REJECT) == 0))
        if ws.count() > 0:
            print(f, int(ws.count()), float(ws.mean()))  # valid WVCs and mean wind speed (m/s) per orbit

tips:
  - "The user manual stresses that WVCs with the KNMI QC flag (wvc_quality_flag bit 17) set must be rejected, and recommends not using values with the variational QC flag (bit 16) or the monitoring flag (bit 18) set either."
  - "C-band is fairly insensitive to rain, but in heavy rain the measurements no longer fit the model function (large inversion residual) and are rejected by KNMI QC. RSS notes that ASCAT can be less accurate in heavy rain, especially at low winds. Check flags and gaps around monsoon fronts and typhoon rain bands."
  - "Wind solutions are also present over sea ice (bogus winds), marked by both the KNMI QC flag and the ice flag (bit 14). The Bayesian ice screening sometimes mistakes rainy WVCs for ice, and cells with model SST above 5 °C are always treated as open water. In seas that freeze in winter, such as the Sea of Okhotsk and the Bohai Sea, check the ice flag together with ice_prob."
  - "No winds are retrieved when the land fraction of a WVC exceeds 0.02. The 25 km and standard 12.5 km products miss about 35 km nearest the coast because of land contamination, so along complex coastlines with many islands, such as Korea's west and south coasts, use the coastal product (OSI-104, PO.DAAC *-L2-Coastal), which reaches about 15 km from the coast."
  - The user manual notes that wind speeds above 25 m/s are generally less reliable, and winds above 30 m/s are flagged (bit 12). Do not use them as they are for typhoon peak winds.
  - "Although WVCs are spaced 25 km apart, PO.DAAC gives the effective resolution as 50 km (25 km for the coastal product). Curl and divergence at grid-spacing scales are noisy, so interpret them at the effective resolution."
  - There are gaps between the two swaths (below the satellite) and between orbits, so one satellite cannot cover all oceans in a day. Combining Metop-B and Metop-C reduces the gaps, but for daily means a gridded analysis such as CCMP is better.
  - "Processing changed during the near-real-time record (a +0.2 m/s step with the switch to neutral winds in November 2008; CMOD7 and stress-equivalent winds from 2018-09-25). Use reprocessed data (Copernicus Marine L3 MY, OSI-150, RSS V2.1) for long-term work."
  - "According to the RSS inter-calibration study, ASCAT-C is about 0.05 m/s lower than ASCAT-B, and ASCAT-A had calibration steps in mid-2016 and late 2019 (corrected in RSS V2.1.1). Check for these when mixing satellites."
  - "The PO.DAAC description of the coastal products still mentions CMOD5.n, but according to the KNMI product history CMOD7 has been used since 2018-09-25. Rely on the KNMI and OSI SAF product pages for version information."
  - "Gaps of several hours due to orbit manoeuvres or instrument anomalies are common (e.g. the Metop-C out-of-plane manoeuvre on 2026-09-16). Missing periods are listed in the anomaly history on the KNMI product pages and in OSI SAF service messages."

