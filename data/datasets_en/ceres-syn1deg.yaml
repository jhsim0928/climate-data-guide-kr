notices:
  - date: "2026-03-20"
    level: info
    title: Terra (February 2027) and Aqua (September 2027) science operations projected to end — SYN1deg already relies on NOAA-20
    body: >-
      NASA projects that fuel and power limits will end Terra science operations in February 2027 and Aqua in September 2027.
      SYN1deg Ed4B has used only NOAA-20 CERES since April 2022, so current production is not directly affected, but the record before April 2022 comes from those two satellites.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-12-29"
    level: info
    title: Edition 5 development update — no release date yet
    body: >-
      A summary of recent CERES Science Team meetings reports that the Edition 5 Fu-Liou model increases the number of bands from 18 to 29 and cuts the TOA longwave bias from about 2 W m-2 to under 0.5 W m-2,
      and that nighttime cloud retrievals are being improved. The DQS lists better GEO scan synchronization, more consistent GEO clouds and improved surface fluxes for Edition 5, but gives no release date.
    source: https://science.nasa.gov/science-research/earth-science/the-state-of-ceres-updates-and-highlights
  - date: "2025-05-08"
    level: warning
    title: SYN1deg Edition4B released on 2025-05-07 — NOAA-20 only with MERRA-2 inputs from April 2022
    body: >-
      Edition4B (Edition4.2 in the ordering tool), built from Terra, Aqua, NOAA-20 and GEO data, was released. From April 2022 it drops Terra and Aqua and uses NOAA-20 only,
      switches cloud retrievals and flux calculations to MERRA-2 inputs, and improves GEO cloud retrievals and twilight handling.
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_SYN1deg_Ed4A_DQS_V1.pdf

