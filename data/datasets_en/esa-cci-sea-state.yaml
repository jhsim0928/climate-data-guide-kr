example:
  lang: python
  note: "Downloads an L4 monthly file from the Ifremer server and prints monthly mean significant wave height around Korea. No login is needed."
  code: |
    # pip install xarray netCDF4 requests
    import requests, xarray as xr

    base = "https://data-cersat.ifremer.fr/data/ocean-waves/cci-seastate/v4/data/satellite/altimeter/l4/"
    fname = "ESACCI-SEASTATE-L4-SWH-MULTI_1M-202001-fv01.nc"      # monthly file under a year folder
    with open(fname, "wb") as f:
        f.write(requests.get(base + "2020/" + fname, timeout=120).content)

    ds = xr.open_dataset(fname)
    box = ds.where((ds.lat >= 30) & (ds.lat <= 42) & (ds.lon >= 120) & (ds.lon <= 135), drop=True)  # around Korea
    print(box["swh_mean"].values.round(2))
    print("passes per cell:", box["swh_count"].values)               # be careful where samples are few

tips:
  - "The guide recommends `swh_denoised` for most uses. `swh` has no cross-mission bias correction, so mixing missions with it can create steps when the satellite changes."
  - "L4 is a monthly statistic built only from the moments satellites passed. In small regions such as the seas around Korea, where the number of missions changes over time, treat means and maxima from cells and months with a small swh_count with caution."
  - "Cross-mission bias correction is less certain at high sea states (5–10 m, where comparison pairs are sparse; above 10 m it is extrapolated). For typhoon extremes, check against buoys and models."
  - "Measurements with sea ice concentration above 10% get quality level 1 and those with 0–10% level 2, so they drop out of L3 and L4. Seas that freeze in winter, such as the Sea of Okhotsk and the Bohai Sea, have gaps or few samples in that season."
  - "The 1990s (ERS-1, ERS-2, TOPEX) have few missions, and the guide notes that TOPEX cycles up to 16 are excluded, Sides A and B are treated separately, and recorder degradation left gaps. For long-term trends, check how sample numbers change over time."
  - "Retrackers differ by mission — WHALES for Jason-1/2/3, Envisat, CryoSat-2 and SARAL; MLE3 for ERS and TOPEX; MLE4 for Sentinel-3A/B and Sentinel-6A. Keep this in mind when comparing missions."
  - "L2P carries ERA5 and WAVEWATCH III wave heights colocated with each measurement (era5_swh, ww3_swh), so model validation can be done without downloading model data separately."
  - "Version 3 (2002-06 to 2021-01) and version 4 differ in retracker versions, bathymetry and land masking, so do not mix them. When comparing with earlier results based on v1.1 or v3, recompute with v4."

