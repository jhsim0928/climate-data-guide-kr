# ─────────────────────────────────────────────────────────────
# ESA Sea State CCI — dataset information file (English edition)
# Satellite tab (sea surface height and waves), also listed in the ocean tab (satellite observations). Intercalibrated multi-mission altimeter significant wave height (L2P along-track, L3 daily, L4 monthly 1°) plus Sentinel-1 SAR wave products.
# As checked on 2026-10-13, version 4 (1991-08 to 2023-12) is the latest, registered at CEDA with DOIs on 2026-07-08 (no further updates planned).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: esa-cci-sea-state
name: ESA Sea State CCI v4
full_name: >-
  ESA Sea State Climate Change Initiative (Sea_State_cci) version 4 — multi-mission altimeter significant wave height L2P, L3 and L4, and Sentinel-1 SAR wave L2P (satellite sea state climate data record)
category: satellite
domain: satellite
group: 해면고도·파랑
order: 30
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 해양파랑, 원격탐사]
provider: European Space Agency (ESA) Climate Change Initiative (CCI) Sea State project — produced and distributed by Ifremer (France) / archived at CEDA (UK)

status: active
status_note: >-
  Version 4 is the latest. Ifremer first made it available as an interim release in August 2025, and on 2026-07-08 the formal records (altimeter L2P, L3, L4 and SAR L2P) were published at CEDA with DOIs.
  CCI products are research climate data records released by version, with no routine updates (CEDA status "Completed", update frequency "Not Planned"); as checked on 2026-10-13 the altimeter record ends on 2023-12-31.
  The project continues in Phase 2, and its page says it has fed the Copernicus Climate Change Service (C3S) since 2026, but no date for a next version has been announced.

period:
  start: "1991-08"
  end: "2023-12"
  note: >-
    Altimeter L2P and L3 cover 1991-08-03 to 2023-12-31 and the L4 monthly product 1992-01 to 2023-12 (CEDA). Version 4 adds ERS-1, ERS-2 and TOPEX/Poseidon to reach back into the 1990s (version 3 covered 2002-06 to 2021-01).
    Sentinel-1 SAR Wave Mode significant wave height runs from 2015-03-19 to 2025-06-11, and the Sentinel-1 WV Integrated Sea State Parameters (ISSP, DLR) from 2014-12-01 to 2024-12-30.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1일"
  spatial: >-
    Altimeter L2P and L3 — 1 Hz along-track values (about 6 km according to the CEDA L3 record, 7 km in the user guide summary) /
    L4 — global 1° × 1° regular cylindrical (latitude–longitude) grid / Sentinel-1 SAR Wave Mode — imagettes of about 20 km every 100 km along track
  vertical: Single level (significant wave height)
  temporal: >-
    L2P — one file per satellite pass, instantaneous 1 Hz measurements / L3 — daily multi-mission files (still along-track) / L4 — monthly statistics (mean, maximum, RMS, counts)
coverage:
  short: 준전지구
  note: "Only ocean under altimeter tracks is sampled. L3 spans 80°S–80°N (CEDA). Measurements contaminated by sea ice get a lower quality level and are excluded from L3 and L4"
update: No routine updates — reprocessed releases by version (v1.1 in 2020-01, v3 in 2022-10, v4 registered at CEDA in 2026-07)
license: >-
  ESA CCI Sea State terms and conditions (any use permitted). Users must acknowledge the ESA CCI, the Sea State CCI project and the data providers, cite the dataset DOIs, and send copies of reports or publications that use the data to the CCI
account_required: false

summary: >-
  A satellite sea state climate data record from the ESA Climate Change Initiative. Waveforms from twelve altimeters, from ERS-1 to Sentinel-6A, are retracked (WHALES and others),
  intercalibrated against Jason-3, calibrated against buoys and denoised with empirical mode decomposition (EMD). The resulting significant wave height comes as along-track data (L2P),
  daily merged along-track files (L3) and 1° monthly gridded statistics (L4). Version 4 spans 1991–2023 and also provides significant wave height and sea state parameters from Sentinel-1 SAR imagery (L2P).
  It is used for wave climate change studies, validation of wave models and reanalyses, and coastal engineering.

time_convention:
  summary: >-
    L2P and L3 values are 1 Hz measurements taken as the satellite passed (the median of the full-resolution samples), and each L3 file gathers one day of good-quality measurements from all missions.
    For L4, the median of each pass crossing a 1° cell is computed first, and the monthly statistics (mean, maximum, RMS, counts) are then computed from those per-pass medians.
  points:
    - "File name examples — L2P ESACCI-SEASTATE-L2P-SWH-Jason-2-20170130T145103-fv01.nc (time of the first measurement), L3 ESACCI-SEASTATE-L3-SWH-MULTI_1D-20170130-fv01.nc, L4 ESACCI-SEASTATE-L4-SWH-MULTI_1M-201701-fv01.nc"
    - "Each 1 Hz value is the median of the valid full-resolution samples at 20 Hz (18 Hz for Envisat and TOPEX, 40 Hz for SARAL). It is flagged bad when fewer than 6 valid samples (12 for SARAL) are available."
    - "The L4 swh_mean is not an even average over all days; it is the mean of the medians of the passes that crossed the cell that month. Wave conditions when no satellite passed are not represented."
    - "The L4 swh_max is the largest of the observed per-pass medians, so the peak of a storm that no satellite overflew is missing."
    - "L4 includes swh_sum, swh_squared_sum and swh_count, so means and variances over several months or cells can be recomputed with count weighting."
  source: https://umr-lops.github.io/cci-seastate-pum/v4.0/altimetry/l4.html
  source_name: CCI Sea State Product User Guide v4.0 (L2P, L3, L4 and processing details)

variables:
  note: >-
    Variable names follow the CCI Sea State Product User Guide v4.0 and the CEDA v4 catalogue records. The guide recommends `swh_denoised` (cross-mission bias corrected and denoised) for most applications.
    L3 and L4 use only L2P measurements with quality level 3 (good), from the Ku band (Ka band for SARAL only).
  full_list: https://umr-lops.github.io/cci-seastate-pum/v4.0/altimetry/l2p.html
  groups:
    - name: Altimeter L2P and L3 (1 Hz along-track)
      kind: instant
      items:
        - text: "Significant wave height, bias corrected and denoised (recommended) — `swh_denoised` (m)"
          note: swh_adjusted with EMD denoising applied
        - text: "Significant wave height, cross-mission bias corrected — `swh_adjusted` (m)"
        - text: "Significant wave height from the retracker, no bias correction — `swh` (m)"
        - "Significant wave height uncertainty — `swh_uncertainty` (m)"
        - text: "SWH quality level (0 undefined, 1 bad, 2 acceptable, 3 good; L2P) — `swh_quality_level`"
          std: []
        - text: "Satellite code, cycle and relative pass number (L3) — `satellite`, `cycle`, `relative_pass`"
          std: []
        - text: "Distance to coast — `distance_to_coast` (m)"
          kind: static
          std: []
        - text: "Bathymetry (GEBCO 2024) — `bathymetry` (m)"
          kind: static
          std: []
    - name: Altimeter L2P ancillary fields (model and sea ice values at the measurement)
      kind: instant
      items:
        - text: "Sea ice fraction — `sea_ice_fraction` (1)"
          std: []
        - text: "ERA5 significant height of combined wind waves and swell — `era5_swh` (m)"
          note: Model value (not a measurement)
        - text: "WAVEWATCH III hindcast significant wave height — `ww3_swh` (m)"
          note: Model value independent of altimetry
    - name: Altimeter L4 (1° monthly statistics)
      kind: mean
      period: Monthly
      items:
        - text: "Monthly mean significant wave height — `swh_mean` (m)"
          note: Mean of the per-pass cell medians
        - text: "Monthly maximum significant wave height — `swh_max` (m)"
          kind: max
          note: Largest per-pass cell median
        - text: "Root mean square of significant wave height — `swh_rms` (m)"
        - text: "Number of per-pass medians — `swh_count` (count)"
          std: []
        - text: "Counts above thresholds (0.5–10 m) — `swh_count_greater_than_0.50` … `swh_count_greater_than_10.00` (count)"
          kind: accum
          std: []
        - text: "Sum and sum of squares (for re-averaging) — `swh_sum`, `swh_squared_sum` (m, m2)"
          kind: accum
          std: []

