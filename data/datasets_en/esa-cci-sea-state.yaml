notices:
  - date: "2026-07-08"
    level: info
    title: Version 4 records published at CEDA with DOIs
    body: >-
      Version 4 altimeter L2P and L3 (1991-08 to 2023-12) and L4 (1992-01 to 2023-12), together with Sentinel-1 SAR L2P (Wave Mode SWH 2015-03 to 2025-06, ISSP and others), were published at CEDA with DOIs.
      All are marked "Completed", with no further updates planned.
    source: https://catalogue.ceda.ac.uk/uuid/315d8e013696420192f1ea1d9191ca9c/
  - date: "2025-08"
    level: info
    title: Version 4 released — extended to 1991–2023, new Sentinel-1 IW and EW SAR products
    body: >-
      ERS-1, ERS-2 and TOPEX/Poseidon extend the record back to the early 1990s, three more years were added for Jason-3, SARAL and CryoSat-2, and Sentinel-3A/B and Sentinel-6A bring it to December 2023.
      Bathymetry moved to GEBCO 2024, the land mask is now based on distance to coast, and Sentinel-1 IW and EW mode SAR products are new. The release first appeared as an interim version on the Ifremer server.
    source: https://umr-lops.github.io/cci-seastate-pum/v4.0/intro.html
  - date: "2022-10-10"
    level: info
    title: Version 3 released (2002-06 to 2021-01)
    body: >-
      Version 3 altimeter L2P, L3 and L4 and the Envisat and Sentinel-1 SAR products were published at CEDA. The record was extended to the end of 2020, with Sentinel-3 SAR altimetry and additional ancillary variables.
    source: https://catalogue.ceda.ac.uk/uuid/9c350d4ff7ee438f9f1fc7252cbb2282
  - date: "2020-01-30"
    level: info
    title: Version 1.1 released (1991-07 to 2018-12)
    body: >-
      The first climate data record release (L2P, L3, L4), inheriting the processing of the GlobWave project, was published at CEDA. It has since been superseded by versions 3 and 4.
    source: https://catalogue.ceda.ac.uk/uuid/47140d618dcc40309e1edbca7e773478

transitions:
  - from: Sea State CCI v3
    to: Sea State CCI v4
    status: completed
    date: "2025-08"
    summary: >-
      Extends the record to 1991–2023 (previously 2002–2021) by adding three 1990s missions and three recent ones. Bathymetry, the land mask and the Jason-3 retracked files were updated, and Sentinel-1 IW and EW SAR products were added.
    changes:
      - aspect: Period
        before: "L4 2002-06 to 2021-01 (L2P and L3 2002–2021)"
        after: "L2P and L3 1991-08 to 2023-12, L4 1992-01 to 2023-12"
      - aspect: Altimeter missions
        before: "Jason-1/2/3, Envisat, CryoSat-2, SARAL, Sentinel-3 and others"
        after: "Adds ERS-1, ERS-2, TOPEX/Poseidon, Sentinel-3A/B and Sentinel-6A — twelve missions in all"
      - aspect: Bathymetry and land mask
        before: Previous bathymetry and land mask
        after: "GEBCO 2024 bathymetry; land mask computed from distance to coast"
      - aspect: Jason-3 input
        before: Earlier retracked files
        after: Updated version of the retracked files
      - aspect: SAR products
        before: "Envisat and Sentinel-1 Wave Mode"
        after: "Sentinel-1 IW and EW modes added; Wave Mode record extended into 2024–2025"
      - aspect: DOI
        before: "L4 10.5285/9c350d4ff7ee438f9f1fc7252cbb2282"
        after: "L4 10.5285/315d8e013696420192f1ea1d9191ca9c"
    impacts:
      - Do not mix v3 and v4 files in one time series. Download v4 for 2002–2020 as well so the whole record shares the same processing.
      - "The 1990s are now included, but with fewer missions and a different retracker (MLE3), so check sample numbers by period when analysing long-term trends."
    sources:
      - name: CCI Sea State Product User Guide v4.0 — Changes
        url: https://umr-lops.github.io/cci-seastate-pum/v4.0/changes.html
      - name: CEDA — v4 L4 record
        url: https://catalogue.ceda.ac.uk/uuid/315d8e013696420192f1ea1d9191ca9c/
      - name: CEDA — v3 L4 record
        url: https://catalogue.ceda.ac.uk/uuid/9c350d4ff7ee438f9f1fc7252cbb2282

