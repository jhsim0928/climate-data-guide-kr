notices:
  - date: "2026-06-11"
    level: warning
    title: OCI ocean products reprocessed to V3.2
    body: >-
      AOP, IOP, BGC and PAR (Level-2), AOP, KD, IOP, BGC and PAR (Level-3 mapped) and MOANA (Level-4) were reprocessed to V3.2 and are in Earthdata Search. A fix to the BRDF correction's handling of relative azimuth
      substantially improves Rrs accuracy and cross-track stability; polarization correction, gas absorption (HITRAN) and vicarious calibration gains were updated; Level-2 gained a coccolithophore flag;
      and the Level-3 AOP products were consolidated into a single file.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/pace-ocean-color-products-have-been-reprocessed-v3.2
  - date: "2026-03-24"
    level: info
    title: Safe hold on 2026-02-09 leaves a gap on 2026-02-10
    body: >-
      OB.DAAC User Services replied that the spacecraft entered a safe hold on 2026-02-09, taking the instruments offline for a while; data are missing for 2026-02-10 and the instruments came back online on 2026-02-11.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=25222
  - date: "2025-08-26"
    level: warning
    title: OCI V3.1 processing starts, V3.0 forward stream stops, new products released
    body: >-
      All OCI Level-1B data were reprocessed with a minor correction, NRT Level-2 and Level-3 processing moved to V3.1 from 2025-07-02 data onward, and V3.0 forward-stream processing stopped. A full-mission V3.1
      reprocessing followed, and new OCI aerosol (UAA), SPEXone (RemoTAP, FastMAPOL) and HARP2 (GPC cloud, FastMAPOL) products began to appear.
    source: https://pace.oceansciences.org/news_more.htm?id=92
  - date: "2025-02-04"
    level: warning
    title: PACE OCI V3 reprocessing starts, V2 processing halted
    body: >-
      OCI V3 reprocessing began and V2 processing was halted. According to PACE, the V2 time series will not be extended beyond 2025-02-04, and all OCI data back to 2024-03-05 are being reprocessed to V3.
      V3 Level-1B came first, from 2025-01-01 onward, followed by Level-2 and Level-3.
    source: https://oceancolor.gsfc.nasa.gov/
  - date: "2024-05-29"
    level: info
    title: Safe hold on 2024-05-24 stops science collection
    body: >-
      The observatory entered safe hold at 22:40 UTC on 2024-05-24, halting science data collection, and instrument recovery began on 28 May. No science data exist for that interval.
    source: https://pace.oceansciences.org/blog.htm?id=23
  - date: "2024-04-11"
    level: info
    title: First public PACE data release (V1)
    body: >-
      Distribution of data from PACE, launched on 2024-02-08, began. The first release (V1) contained Level-1 data and a limited set of derived products from OCI, HARP2 and SPEXone, described as highly preliminary.
    source: https://www.nasa.gov/earth/nasas-pace-data-on-ocean-atmosphere-climate-now-available/

transitions:
  - from: PACE OCI V2
    to: PACE OCI V3.0
    status: completed
    date: "2025-02"
    summary: >-
      A full-mission reprocessing that recalibrated OCI using only on-orbit solar diffuser data and applied system vicarious calibration (SVC) gains for the first time. Rrs atmospheric correction changed in several ways,
      some wavelengths were removed, and several products were raised to Provisional.
    changes:
      - aspect: L1B calibration
        before: Absolute calibration from the solar diffuser and pre-launch GLAMR data
        after: "Absolute calibration from on-orbit solar diffuser data only (larger UV radiance increases), diffuser reflectance degradation included, better dark subtraction (less striping), definitive ephemerides for geolocation"
      - aspect: Rrs atmospheric correction
        before: No vicarious calibration gains
        after: "First SVC gains, polarization and NO2 corrections, improved gas transmittance, extreme glint masking, BRDF table regenerated for hyperspectral wavelengths"
      - aspect: Rrs wavelengths
        before: Included 340–345 nm and 590–610 nm
        after: 340–345 nm and 590–610 nm removed
      - aspect: Product maturity
        before: "avw, carbon_phyto, poc, Kd and PAR at Test"
        after: "avw, carbon_phyto, poc and PAR Provisional; nflh added"
      - aspect: Period
        before: "From instrument first light in February 2024; not extended beyond 2025-02-04"
        after: From 2024-03-05, ongoing
    impacts:
      - V2 and V3-or-later files use different calibrations, so Rrs and chlorophyll differ. Do not mix them in one time series.
      - Rrs at 340–345 nm and 590–610 nm, present in V2, is gone from V3. Re-check wavelength lists in code that used them.
    sources:
      - name: OBPG — PACE Science Data Reprocessing Version 3
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/V3.0/pace/
      - name: PACE — OCI Version 3 (V3) Reprocessing announcement
        url: https://pace.oceansciences.org/news_more.htm?id=90
      - name: PACE Science Data V2 Release Notes
        url: https://oceandata.sci.gsfc.nasa.gov/files/reprocessing/PACE_Science_Data_V2_Release_Notes.pdf
  - from: PACE OCI V3.0
    to: PACE OCI V3.1
    status: completed
    date: "2025-08"
    summary: >-
      Level-2 and Level-3 remade after adding a 650–900 nm ghosting correction to Level-1B (V3.0.1) and fixing the vicarious gains (red over-calibration). NRT switched to V3.1 from 2025-07-02 data and the full mission was reprocessed.
    changes:
      - aspect: L1B
        before: V3.0
        after: "V3.0.1 — ghosting correction for 650–900 nm, pixels 680–800"
      - aspect: Atmospheric correction
        before: V3.0 vicarious gains and earlier humidity and glint handling
        after: "Updated vicarious gains (red over-calibration fixed), relative humidity from MERRA2 at 925 hPa, seawater refractive index in glint correction, adjusted nflh algorithm"
      - aspect: IOP
        before: Output at all wavelengths, Kd at Test
        after: Output limited to 400–720 nm, Kd Provisional
    impacts:
      - "V3.0 and V3.1 differ in red Rrs and nflh. Check for V3_0 or V3_1 in file names and do not mix them."
    sources:
      - name: PACE — OCI V3.1 Reprocessing and New Product Release (2025-08-26)
        url: https://pace.oceansciences.org/news_more.htm?id=92
      - name: PACE OCI V3 Release Notes
        url: https://oceandata.sci.gsfc.nasa.gov/files/data/reprocessing/V3/PACE_OCI_V3_Release_Notes.pdf
  - from: PACE OCI V3.1
    to: PACE OCI V3.2
    status: completed
    date: "2026-04"
    summary: >-
      An ocean-product reprocessing that fixed a BRDF implementation error in spectral Rrs. Cross-scan artifacts dropped, the Level-3 AOP, IOP and BGC suites each became one file, and pic was added.
    changes:
      - aspect: BRDF correction
        before: Ignored changes in relative azimuth across the scan
        after: Accounts for relative azimuth, substantially improving Rrs accuracy and cross-track stability
      - aspect: L1B calibration
        before: "Calibration table error causing a date offset of about 22 days"
        after: V3.0.2 calibration (date error fixed) applied for the first time
      - aspect: Atmospheric correction
        before: V3.1
        after: "Polarization correction computed correctly across the scan, gas absorption recomputed with the latest HITRAN, updated vicarious gains (adding HyperNAV SVC site match-ups)"
      - aspect: Flags
        before: None
        after: Coccolithophore flag in Level-2 (BGC may be biased); coccolithophore masking not applied to Level-3 AOP
      - aspect: Level-3 file layout
        before: Separate Level-3 files per product
        after: "One file per suite for AOP, IOP and BGC (e.g. …L3m.DAY.AOP.V3_2.4km.nc)"
      - aspect: Products
        before: "BGC had chlor_a, carbon_phyto and poc"
        after: "pic added (CI2 algorithm), IOP model fit sampled about every 10 nm in the visible, NPP_CAFE driven by V3.2 IOP and PAR"
    impacts:
      - Rrs before V3.2 has cross-scan artifacts, so download V3.2 again.
      - "Level-3 file names and layout changed (per-product files to per-suite files), so update the file name patterns in automated download scripts."
    sources:
      - name: Earthdata — PACE ocean color products have been reprocessed (V3.2)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/pace-ocean-color-products-have-been-reprocessed-v3.2
      - name: PACE OCI V3 Release Notes (V3.2 changes)
        url: https://oceandata.sci.gsfc.nasa.gov/files/data/reprocessing/V3/PACE_OCI_V3_Release_Notes.pdf

