notices:
  - date: "2026-07-20"
    level: info
    title: Merged-stream data folders posted (SODA4.15.2_OR, _REG and .0)
    body: >-
      Folders with the four streams merged on the original grid (SODA4.15.2_OR) and regridded (SODA4.15.2_REG), and the no-assimilation run (SODA4.15.2.0),
      appeared on the UMD server between 14 and 20 July 2026 (server file dates). Data for 2024 end in late June.
    source: https://dsrs.atmos.umd.edu/DATA/
  - date: "2026-04-16"
    level: info
    title: SODA4 preprint discussion closed
    body: >-
      On EGUsphere, the authors' final responses to the three referee reports (October–December 2025) were posted on 2026-04-16 and the discussion is closed.
      As of 2026-10-12 there is no link to a final journal paper. One referee asked for the file descriptions to be moved to a web page with a DOI.
    source: https://egusphere.copernicus.org/preprints/2025/egusphere-2025-3810/
  - date: "2025-10-01"
    level: warning
    title: Some original-grid output files permanently missing
    body: >-
      Supplement Table S6 states that the original-grid files for the first three years of Stream 1 (1980–1982) and some 5-day and 10-day original-grid files (ocean, ice and transport) are missing and cannot be recovered;
      the gaps have not been filled. The regridded files are reported as not affected in the same way.
    source: https://egusphere.copernicus.org/preprints/2025/egusphere-2025-3810/egusphere-2025-3810-supplement.pdf
  - date: "2025-10-01"
    level: info
    title: "SODA4: a mesoscale ocean/sea ice reanalysis 1980–2024 — preprint published"
    body: >-
      The SODA4 reference paper (soda4.15.2, MOM5/SIS1, ERA5 forcing, 0.1° and 75 levels, 1980–2024) was published as an EGUsphere preprint (received 2025-08-05).
      The SODA project designates it as the citation for SODA4.
    source: https://doi.org/10.5194/egusphere-2025-3810

