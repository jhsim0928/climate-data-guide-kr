# ─────────────────────────────────────────────────────────────
# SODA4 — dataset information file (English edition)
# University of Maryland SODA version 4 (soda4.15.2): MOM5/SIS1, ERA5 forcing, eddy-resolving 1/10°, 75-level ocean/sea-ice reanalysis, 1980 to 2024-06.
# The previous version, SODA3, is in soda3.yaml (its transitions section compares SODA3 and SODA4).
# After editing, set last_verified to the date the official pages were checked.
# ─────────────────────────────────────────────────────────────
id: soda4
name: SODA4
full_name: Simple Ocean Data Assimilation version 4 (SODA4.15.2)
category: reanalysis
domain: ocean
group: 재분석
order: 35
domains: [해양, 해빙]
provider: SODA project, Department of Atmospheric and Oceanic Science, University of Maryland (Gennady Chepurin, James Carton and colleagues; funded by the National Science Foundation)

status: active
status_note: >-
  The current version is SODA4.15.2 with ERA5 forcing; the UMD data server holds 1980 to late June 2024 (reorganised and posted in July 2026).
  The data are released in batches rather than monthly, and no date for the next extension has been announced.
  The reference paper is an EGUsphere preprint whose open discussion has closed (final author responses April 2026); as of 2026-10-12 no final journal version was listed.

period:
  start: "1980"
  end: "2024-06"
  note: >-
    The model starts on 1980-01-01 from initial conditions interpolated from SODA3.15.2. As of 2026-10-12, the 5-day files start on 1980_02_02 for the regridded data and the original-grid sea ice,
    and on 1983_01_02 for the original-grid ocean (original-grid files for 1980–1982 are permanently missing). The last files are 2024_06_20 for the regridded ocean and 2024_06_25 for the original-grid ocean and regridded sea ice.
    The portal and paper say "1980–2024", but 2024 covers only the first half of the year, and the 2024 monthly files are half the size of other years.

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "5일"
  spatial: >-
    Original grid: GFDL MOM5.1 tripolar Arakawa B-grid, 3600 × 2700, nominal 0.1° (preprint: about 11 km at the equator and 5.5 km at ±60°) /
    Regridded: 0.1° × 0.1°, 3600 × 1700 (supplement; the portal and README call it a 1/10° Mercator grid, the preprint a uniform lon-lat grid) /
    Analysis increments: 1° × 1° grid
  vertical: >-
    75 z* levels (about 1.1 m thick near the surface, up to 200 m in the deep ocean, with partial bottom cells). Documents describe the regridded levels differently —
    portal: every other z* level of the original grid; README: 75 levels; preprint: regridded state variables cover only 0–1017 m before 2005 and 0–2006 m from 2005
  temporal: 5-day averages (original and regridded, ocean and sea ice), calendar-monthly averages (original and regridded), 10-day average transports (original grid), 10-day and monthly analysis increments (1°)

update: Irregular batch releases (most recent July 2026, by server file dates) — no extension announced
license: No data licence is stated on the UMD portal or README; users are asked to state the version used and cite Chepurin et al. (2025) / model and assimilation code on Zenodo is CC BY 4.0
account_required: false

summary: >-
  SODA4 is the fourth version of the University of Maryland Simple Ocean Data Assimilation global ocean/sea-ice reanalysis. It keeps the GFDL MOM5/SIS1 numerics and ERA5 forcing (COARE bulk formulae) of SODA3
  but raises the resolution to 1/10° with 75 levels, making it eddy-resolving over most of the globe and eddy-permitting in the Arctic.
  World Ocean Database 2023 temperature and salinity profiles (including Argo and gliders) and NOAA satellite SST calibrated with ICOADS are assimilated by optimal interpolation on a 10-day cycle with incremental analysis updates,
  and the sea ice is constrained by relaxing the surface heat flux toward GIOMAS thickness. The 1980–2024 record (on the server, to June 2024) was produced as four roughly decade-long streams.

time_convention:
  summary: >-
    All SODA4 files hold averages: each `5dy` file is one 5-day mean, each `mn` file holds one year of calendar-monthly means, and the `10dy` transport files are 10-day means.
    The README, preprint and supplement do not say whether the date in the file name (YYYY_MM_DD) marks the start, middle or end of the averaging period.
  points:
    - "5-day file dates step by 5 days (1980_02_02, 1980_02_07, …) and 10-day transport file dates by 10 days (1980_02_05, 1980_02_15, …). Check the time coordinate and its bounds attributes in the file for the exact interval."
    - "Monthly (mn) files are calendar-monthly averages (README), with all months of a year in one file (…_mn_ocean_reg_YYYY.nc). The 2024 file appears to hold only the first half of the year (it is half the usual size), so check the length of time after opening."
    - "Heat fluxes (W/m²) and freshwater flux (kg m-2 s-1) are mean fluxes over the averaging period, not accumulations."
    - "Analysis increments (`tcor`, `scor`) are given as rates per 10-day assimilation cycle (deg-C/10dy, PSU/10dy) and are added to the model over 10 days by incremental analysis update (IAU)."
  source: https://www.soda.umd.edu/soda4/soda4_readme.htm
  source_name: "SODA4 README (UMD) + Chepurin et al. (2025) preprint and supplement + UMD server file listings"

variables:
  note: >-
    Main variables from Tables S2–S5 of the Chepurin et al. (2025) supplement and the SODA4 README. Names are the netCDF variable names.
    The README and supplement sometimes disagree (`w`/`wt`, `aice`/`cn`, `mx`·`my`/`tx_trans`·`ty_trans`), so check the actual files.
    Variables without a note are in both the original and regridded files.
  full_list: https://egusphere.copernicus.org/preprints/2025/egusphere-2025-3810/egusphere-2025-3810-supplement.pdf
  groups:
    - name: 3-D ocean (ocean, 75 levels)
      kind: mean
      period: 5-day / monthly
      items:
        - "Potential temperature — `temp` (°C)"
        - "Practical salinity — `salt` (PSU)"
        - text: "Zonal and meridional velocity — `u`, `v` (m s-1)"
          note: Grid-oriented components on the original grid
        - text: "Vertical velocity — `wt` (m s-1)"
          note: Listed as `w` in the README
        - text: "Potential density (TEOS-10) — `prho` (kg m-3)"
          note: Original grid only
    - name: 2-D ocean (ocean)
      kind: mean
      period: 5-day / monthly
      items:
        - "Sea surface height (eta_t + patm/(rho0·g)) — `ssh` (m)"
        - "Mixed layer depth (temperature, density and salinity criteria) — `mlt`, `mlp`, `mls` (m)"
        - text: "Wind stress — `taux`, `tauy` (N/m²)"
          note: Original grid only
        - text: "Net surface heating — `net_heating` (W/m²)"
          note: Original grid only
        - text: "Total surface heat flux (coupler + restoring) — `hflux_total` (W/m²)"
          note: Original grid only
        - text: "Longwave, latent and sensible heat flux — `lw_heat`, `evap_heat`, `sens_heat` (W/m²)"
          note: Original grid only
        - text: "Freshwater flux (precipitation − evaporation + river runoff) — `pme_river` (kg m-2 s-1)"
          note: Original grid only
    - name: Sea ice (ice, SIS1 with 5 categories)
      kind: mean
      period: 5-day / monthly
      items:
        - text: "Sea ice concentration — `cn` (0-1)"
          note: Listed as `aice` (total fractional ice concentration) in the README; check in the file whether it has a category dimension
        - "Sea ice thickness — `hi` (m)"
        - "Snow thickness — `hs` (m)"
        - "Sea ice mass — `mi` (kg/m²)"
        - "Sea ice velocity — `ui`, `vj` (m/s)"
        - "Ocean-to-ice heat flux — `bheat` (W/m²)"
        - text: "Sensible, latent, shortwave and longwave heat flux over sea ice — `sh`, `lh`, `sw`, `lw` (W/m²)"
          note: Original grid only
    - name: Transports (transport, original grid only)
      kind: mean
      period: 10-day
      items:
        - "Mass transport across cell faces — `tx_trans`, `ty_trans` (10⁹ kg/s)"
        - "Vertically integrated mass transport — `tx_int`, `ty_int` (10⁹ kg/s)"
    - name: Analysis increments (1°, upper 33 z* levels)
      kind: mean
      period: 10-day / monthly
      items:
        - "Temperature increment — `tcor` (deg-C/10dy)"
        - "Salinity increment — `scor` (PSU/10dy)"

access:
  - name: SODA4 portal (UMD)
    url: https://www.soda.umd.edu/soda4
    method: Information page (file links and wget examples)
    note: Version description, links to yearly monthly-mean files, wget commands for bulk download, and how to cite.
  - name: UMD data server — SODA4.15.2 regridded (0.1°)
    url: https://dsrs.atmos.umd.edu/DATA/SODA4.15.2_REG/
    login: false
    method: Direct HTTP(S) download
    note: >-
      5-day and monthly netCDF files in ocean/ and ice/. A 5-day ocean file is about 1.5–1.6 GB, a yearly monthly-mean ocean file 17–19 GB,
      and a yearly monthly-mean ice file about 0.4 GB. On 2026-10-12 the 2021 monthly ice file was missing.
  - name: UMD data server — SODA4.15.2 original grid (tripolar 3600 × 2700)
    url: https://dsrs.atmos.umd.edu/DATA/SODA4.15.2_OR/
    login: false
    method: Direct HTTP(S) download
    note: >-
      Folders ocean/, ice/ and transport/. A 5-day ocean file is about 5.2–5.4 GB, a yearly monthly-mean ocean file about 65 GB, a 5-day ice file about 145 MB and a 10-day transport file about 2.2 GB.
      Original-grid ocean files start in 1983. The portal recommends computing basin-integrated transports (e.g. AMOC) on the original grid, because remapping can introduce truncation errors.
  - name: UMD data server — companion run without data assimilation (SODA4.15.2.0)
    url: https://dsrs.atmos.umd.edu/DATA/SODA4.15.2.0/
    login: false
    method: Direct HTTP(S) download
    note: Folders ORIGINAL/ and REGRIDED/. Same forcing and bulk formulae with no assimilation, intended for closed-budget diagnostics.
  - name: UMD data server — per-stream output and analysis increments (soda4.15.2_s1 to _s4)
    url: https://dsrs.atmos.umd.edu/DATA/
    login: false
    method: Direct HTTP(S) download
    note: >-
      The per-stream folders named in the preprint's data availability statement (e.g. soda4.15.2_s1/ with ORIGINAL/, REGRIDED/ and SODA/).
      The portal's analysis-increment link (DATA/soda4.15.2/SODA) pointed to a path not present in the server listing on 2026-10-12.

example:
  lang: python
  note: "Downloads one 0.1° regridded 5-day file from the UMD server and opens it with xarray. Ice files are tens of MB; ocean files about 1.6 GB."
  code: |
    import urllib.request
    import xarray as xr

    base = "https://dsrs.atmos.umd.edu/DATA/SODA4.15.2_REG/"
    fname = "soda4.15.2_5dy_ice_reg_2024_06_25.nc"         # 5-day sea-ice mean (small file)
    urllib.request.urlretrieve(base + "ice/" + fname, fname)

    ds = xr.open_dataset(fname)
    print(ds)            # check variable names (cn/aice etc.) and the time coordinate first
    print(ds["hi"])      # sea ice thickness (m)

    # 5-day ocean mean (~1.6 GB): base + "ocean/soda4.15.2_5dy_ocean_reg_2024_06_20.nc"
    # Check how deep the depth coordinate goes (~1017 m before 2005).

tips:
  - "Regridded files may not cover the full depth. The preprint states that regridded state variables span only 0–1017 m before 2005 and 0–2006 m from 2005, so for deep-ocean work use the original grid or check the depth coordinate first."
  - "Supplement Table S6 lists original-grid files that are permanently missing: 1980–1982 and some 5-day and 10-day files (1986-06-15, 1993-12-23, part of 1994-12, 2000-02-10, part of 2009-01, part of 2016-07, 2021-09-27, among others). The regridded 5-day listing also lacks 1980-07-21 and 07-26, so check date continuity before building time series."
  - "The record joins four roughly decade-long streams (starting around 1980, 1990, 2000 and 2010), and the authors note it is \"not quite continuous\". Treat trends and change points that straddle 1990, 2000 or 2010 with care."
  - "In the version name, 15 stands for ERA5 forcing and the final 2 for the COARE bulk formulae. SODA4.15.2.0 (with the extra .0) is the run without data assimilation; do not mix it with the reanalysis."
  - "The original grid is tripolar, with the Arctic cap split into two poles over Eurasia and North America, and its velocities are grid-oriented rather than east/north. Use the regridded files for maps and regional means, and the original grid for section transports."
  - "The full dataset is about 46 TB. One year of monthly ocean means alone is 17–19 GB regridded and about 65 GB on the original grid, so decide on years and variables first and subset by region and depth right after download."
  - "Known limitations from the preprint: an artificial zonal temperature gradient near the equator from slightly weak ERA5 trade winds; 300–1000 m salinity differing from EN4.2.2 by about 0.04 PSU; insufficient resolution and no Argo in the Arctic; and Fram Strait inflow and outflow about 20% smaller than observational estimates."

