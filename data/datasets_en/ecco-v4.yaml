notices:
  - date: "2026-08-28"
    level: info
    title: ECCO Drive accessible again
    body: >-
      ECCO Drive went offline in early July 2026 because of a technical issue and, after a mount problem affecting some paths (ECCO2) in late August, the ECCO team announced on 28 August that it is accessible again.
      The V4r4 page on the ECCO website may still show the old "temporarily offline" notice.
    source: https://mailman.mit.edu/pipermail/ecco-support/2026-August/000865.html
  - date: "2026-05-14"
    level: info
    title: V4r6 (1992–2025) in preparation — will supersede V4r5
    body: >-
      The ECCO team said that "ECCO Version 4 Release 6 (V4r6), which will supersede ECCO V4r5", covers 1 January 1992 to 31 December 2025 and will be officially released through PO.DAAC.
      Monthly means are to be posted on ECCO Drive first, but this is taking longer than planned; as of 2026-10-12 no release date has been announced.
    source: https://mailman.mit.edu/pipermail/ecco-support/2026-May/000851.html
  - date: "2025-05"
    level: info
    title: V4r5 native-grid monthly means released in the AWS cloud
    body: >-
      Some V4r5 (1992–2019) monthly-mean llc90 datasets were made available in the requester-pays S3 bucket s3://ecco-model-granules/ (file creation date 2025-05-02).
      As of October 2025 they can only be read with ecco_access inside the AWS cloud, and daily, snapshot and 0.5° fields are not yet available.
    source: https://ecco-access.readthedocs.io/en/latest/ECCO_access_v4r5.html
  - date: "2024-10-13"
    level: info
    title: Synopsis of the ECCO V4r5 Global Ocean and Sea-Ice State Estimate published
    body: >-
      The synopsis, published on Zenodo, states that V4r5 "extends the previous solution (V4r4) to Jan 1, 2020", uses the adjoint of the thermodynamic sea-ice model to better fit satellite sea-ice concentration,
      and adds a representation of Antarctic ice shelves and glaciers via a thermodynamic ice-shelf and tidewater model.
    source: https://doi.org/10.5281/zenodo.13926715
  - date: "2021-06"
    level: warning
    title: "ECCO Version 4, Release 4b: an errata for atmospheric pressure forcing in V4r4"
    body: >-
      Atmospheric pressure forcing fields for April and December 2014 were inadvertently swapped and those for May–November 2014 shifted by one day, affecting daily sea level and bottom pressure in 2013–2015.
      Corrected daily and monthly SSH and OBP fields and the SBO time series were re-released as the V4R4B datasets; at monthly or longer time scales the difference is negligible for most purposes, apart from April and December 2014.
    source: https://ecco-group.org/docs/ECCO_V4r4_errata.pdf

