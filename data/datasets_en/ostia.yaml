notices:
  - date: "2026-04-28"
    level: info
    title: "[MDSOP-377] Application of retention periods to ARCO datacubes — start dates may change"
    body: >-
      Copernicus Marine has begun applying the retention periods defined in the product manuals to ARCO-based services (web subset, Toolbox subset, MyOcean Viewer),
      so the start date and length of some time series may change. Original files (File Browser, copernicusmarine get) are not affected.
    source: https://marine.copernicus.eu/user-corner/user-notification-service
  - date: "2025-06-24"
    level: warning
    title: NRT product (010_001) dataset length reduced to the most recent two years
    body: >-
      The change history of the product user manual records "Updated dataset length to be the most recent two years" for the NRT dataset.
      For NRT data older than two years use NASA PO.DAAC (OSTIA-UKMO-L4-GLOB-v2.0); for long-term analyses use the REP product.
    source: https://documentation.marine.copernicus.eu/PUM/CMEMS-SST-PUM-010-001.pdf
  - date: "2025-05-28"
    level: info
    title: Ingestion of VIIRS on NOAA-21 observations (NRT)
    body: The NRT analysis started assimilating VIIRS SST observations from NOAA-21. Small changes in the product's characteristics are possible around this date.
    source: https://documentation.marine.copernicus.eu/PUM/CMEMS-SST-PUM-010-001.pdf

