notices:
  - date: "2026-04-28"
    level: info
    title: "[MDSOP-377] Application of retention periods to ARCO datacubes"
    body: >-
      Copernicus Marine is applying the retention periods stated in the Product User Manuals to some ARCO datacubes. In the Subset GUI, Toolbox subset and MyOcean Viewer,
      the start date or temporal extent of some time series may change; original files (File Browser, copernicusmarine get) are not affected. The notice does not list the products concerned.
    source: https://marine.copernicus.eu/user-corner/user-notification-service
  - date: "2025-07"
    level: warning
    title: Copernicus Marine Toolbox 1.x end of support
    body: Toolbox v1 is no longer supported and should be replaced with v2. Version 2.4.0 dropped support for Python 3.9.
    source: https://toolbox-docs.marine.copernicus.eu/en/stable/end-of-life.html
  - date: "2025-06-25"
    key_date: "2025-06"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: New AI-corrected sea ice thickness variable (sithick_corr)
    body: >-
      The reanalysis assimilates CryoSat-2 and SMOS sea ice thickness from 2010, which creates a discontinuity. A new variable, sithick_corr, corrects the pre-2010 thin bias
      with an AI technique (dataset version 202506); it equals the model-based sithick from 2010 onward.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=ARCTIC_MULTIYEAR_PHY_002_003
  - date: "2024-11-26"
    key_date: "2024-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: Surface momentum and heat flux datasets added
    body: >-
      Four new datasets provide wind stress (cmems_mod_arc_phy_my_mflux_P1D-m, _P1M-m) and total heat fluxes (cmems_mod_arc_phy_my_hflux_P1D-m, _P1M-m).
      Pre-existing datasets remain unchanged.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=ARCTIC_MULTIYEAR_PHY_002_003
  - date: "2023-11-30"
    key_date: "2023-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: Arctic forecasting system upgraded to TOPAZ5 — reanalysis stays on TOPAZ4b
    body: >-
      The analysis and forecast product (ARCTIC_ANALYSISFORECAST_PHY_002_001) was upgraded from TOPAZ4 to TOPAZ5, doubling the horizontal and vertical resolution.
      The reanalysis (002_003) is still produced with TOPAZ4b, so appending recent forecast-product data to it mixes two model systems.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=ARCTIC_ANALYSISFORECAST_PHY_002_001

