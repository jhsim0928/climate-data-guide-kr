# ─────────────────────────────────────────────────────────────
# TOPAZ4b — dataset information file
# Copernicus Marine Arctic Ocean Physics Reanalysis (ARCTIC_MULTIYEAR_PHY_002_003, produced by NERSC)
# Listed under the ocean tab (reanalysis) and cross-listed under the sea ice tab.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: topaz4b
name: TOPAZ4b
full_name: >-
  Copernicus Marine Arctic Ocean Physics Reanalysis — TOPAZ4b (ARCTIC_MULTIYEAR_PHY_002_003)
category: reanalysis
domain: ocean
group: 재분석
order: 60
also_in:
  - domain: seaice
    group: 재분석
domains: [해양, 해빙]
provider: Nansen Environmental and Remote Sensing Center (NERSC), Arctic Monitoring and Forecasting Centre / distributed by the Copernicus Marine Service (CMEMS)

status: active
status_note: >-
  Active, extended twice a year. In June 2025 an AI-corrected sea ice thickness variable (sithick_corr) was added to remove the thin bias before 2010.
  The Arctic analysis and forecast system from the same centre (ARCTIC_ANALYSISFORECAST_PHY_002_001) moved to TOPAZ5 in November 2023, but the reanalysis is still TOPAZ4b.
  As of October 2026 we found no official plan to move this reanalysis to TOPAZ5 or TOPAZ6.

period:
  start: "1991-01"
  end: present
  note: >-
    1990 is used for spin-up, and data start in 1991. As checked on 2026-10-12, the Copernicus Marine catalogue ends at 2026-06-30 for daily data
    and 2026-06 for monthly data. Per the PUM, the previous year is updated each July (near-real-time inputs) and again each November (reprocessed inputs),
    so the most recent period may later be regenerated with different inputs.

resolution:
  spatial_short: "12.5 km (0.11°)"
  temporal_short: "1일"
  spatial: >-
    Model grid: HYCOM 880 × 800 Arakawa C-grid, about 12–16 km spacing (Arctic Ocean and North Atlantic).
    Original output grid (originalGrid): 12.5 km polar stereographic, 609 × 881 (x −38 to 38, y −55 to 55 in units of 100 km;
    +proj=stere +lon_0=-45 +lat_0=90 +k=1 +R=6378273, not WGS84).
    Default product: interpolated to a 0.125° latitude-longitude grid, 2880 × 321 (50°N–90°N)
  vertical: >-
    The model uses 50 hybrid layers. Output is interpolated to 40 fixed depths from 0 to 4000 m (0, 2, 4, 6, 10, 15, 20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 125, 150, 175, 200,
    250, 300, 350, 400, 450, 500, 600, 700, 800, 900, 1000, 1200, 1400, 1600, 1800, 2000, 2500, 3000, 3500, 4000 m)
  temporal: Daily, monthly and yearly means (surface momentum and heat fluxes — daily and monthly means)

coverage:
  short: 북극·북대서양
  note: "Arctic Ocean and North Atlantic; the default product covers 50°N–90°N"
update: Twice a year (extended in July and November)
license: Copernicus Marine Service licence — free of charge, including commercial use; attribution and citation of the product DOI required
account_required: true

summary: >-
  A coupled ocean and sea-ice reanalysis of the Arctic Ocean and North Atlantic produced by NERSC for Copernicus Marine. It couples the HYCOM ocean model
  with the CICE sea-ice model and assimilates, in a weekly cycle with a 100-member Deterministic Ensemble Kalman Filter (DEnKF), satellite sea level anomalies,
  SST, sea ice concentration, sea ice drift and sea ice thickness (from 2010), plus in situ temperature and salinity profiles. From 1991 it provides daily,
  monthly and yearly temperature, salinity, currents, and sea ice concentration, thickness and drift on a 12.5 km grid, and is used to study Arctic sea-ice change,
  Atlantic Water inflow and freshwater storage.

time_convention:
  summary: >-
    All variables are means, not instantaneous values. Daily fields are daily means (centred at 12:00 UTC per the PUM), monthly fields are monthly means
    (centred mid-month per the PUM), and yearly fields are averages of the daily files; every value is the mean of the 100 ensemble members.
    Only the bathymetry (model_depth) is time-invariant.
  points:
    - "The PUM describes daily means as centred at 12:00 UTC and monthly means as centred mid-month, but the Copernicus Marine catalogue stamps daily data at 00:00 on the day and monthly data at 00:00 on the 1st. Read the time value only as a label for 'the mean of this day (month)'."
    - "Yearly means (…_P1Y) are computed from the daily files rather than the monthly ones, to avoid errors in nonlinear variables such as mixed layer depth."
    - "Data assimilation (DEnKF, 100 members) runs on a 7-day cycle; daily means average the model integration between analyses."
    - "Atmospheric forcing is 6-hourly ERA5."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-003.pdf
  source_name: CMEMS-ARC-PUM-002-003 (TOPAZ4b Product User Manual)

variables:
  note: >-
    Variable names as given in the Copernicus Marine Product User Manual (PUM) and the dataset metadata. The daily, monthly and yearly datasets
    (cmems_mod_arc_phy_my_topaz4_P1D-m, _P1M, _P1Y) contain the same variables. On the original (polar stereographic) grid, vector components follow the grid
    x and y axes and must be rotated when converting to latitude-longitude.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-003.pdf
  groups:
    - name: 3D ocean (40 depths)
      kind: mean
      period: day / month / year
      items:
        - "Sea water potential temperature — `thetao` (°C)"
        - "Sea water salinity — `so` (1e-3)"
        - "Eastward sea water velocity — `vxo` (m/s)"
        - "Northward sea water velocity — `vyo` (m/s)"
    - name: 2D ocean
      kind: mean
      period: day / month / year
      items:
        - "Sea surface height above geoid — `zos` (m)"
        - "Ocean mixed layer thickness defined by sigma theta — `mlotst` (m)"
        - text: "Sea water potential temperature at sea floor — `bottomT` (°C)"
          note: Interpolated 10 m above the seabed, so it can look discontinuous where layers meet
        - "Ocean barotropic streamfunction — `stfbaro` (m3 s-1)"
    - name: Sea ice
      kind: mean
      period: day / month / year
      items:
        - "Sea ice area fraction — `siconc` (fraction, 0–1)"
        - text: "Sea ice thickness — `sithick` (m)"
          note: Model value (uncorrected). Biased thin before 2010, when no thickness observations were assimilated
        - text: "AI-corrected sea ice thickness — `sithick_corr` (m)"
          note: Pre-2010 period corrected by machine learning (Edel et al. 2025). Equal to sithick from 2010 onward
        - "Surface snow thickness — `sisnthick` (m)"
        - "Eastward sea ice velocity — `vxsi` (m/s)"
        - "Northward sea ice velocity — `vysi` (m/s)"
    - name: Surface fluxes (separate datasets)
      kind: mean
      period: day / month
      items:
        - text: "Surface downward eastward and northward stress — `tauuo`, `tauvo` (N m-2)"
          note: cmems_mod_arc_phy_my_mflux_P1D-m / _P1M-m (added 2024-11)
        - text: "Net downward shortwave flux at sea water surface — `rsntds` (W m-2)"
          note: cmems_mod_arc_phy_my_hflux_P1D-m / _P1M-m
        - text: "Surface downward heat flux in sea water — `hfds` (W m-2)"
          note: cmems_mod_arc_phy_my_hflux_P1D-m / _P1M-m
    - name: Static fields
      kind: static
      items:
        - "Sea floor depth below sea level — `model_depth` (m)"

access:
  - name: Copernicus Marine Data Store — ARCTIC_MULTIYEAR_PHY_002_003
    url: https://data.marine.copernicus.eu/product/ARCTIC_MULTIYEAR_PHY_002_003/description
    method: Web download (Subset, File Browser) / Copernicus Marine Toolbox (copernicusmarine)
    note: >-
      Requires a free Copernicus Marine account. Dataset IDs — daily means cmems_mod_arc_phy_my_topaz4_P1D-m, monthly cmems_mod_arc_phy_my_topaz4_P1M,
      yearly cmems_mod_arc_phy_my_topaz4_P1Y (current version 202506); fluxes cmems_mod_arc_phy_my_mflux_P1D-m and _P1M-m, cmems_mod_arc_phy_my_hflux_P1D-m and _P1M-m.
      Each dataset is offered both interpolated to 0.125° latitude-longitude (default) and on the original 12.5 km polar stereographic grid (originalGrid).
  - name: Copernicus Marine Toolbox documentation
    url: https://toolbox-docs.marine.copernicus.eu/en/stable/
    method: Python / command line (CLI)
    note: Version 2.x is the supported release.

example:
  lang: python
  note: "Install with pip install copernicusmarine, then run login() once to store your credentials."
  code: |
    import copernicusmarine

    # Once only: copernicusmarine.login()

    # Daily Arctic sea ice concentration and thickness (incl. AI-corrected) — default 0.125° lat-lon grid
    copernicusmarine.subset(
        dataset_id="cmems_mod_arc_phy_my_topaz4_P1D-m",
        variables=["siconc", "sithick", "sithick_corr", "vxsi", "vysi"],
        minimum_longitude=-180, maximum_longitude=180,
        minimum_latitude=65, maximum_latitude=90,
        start_datetime="2005-03-01", end_datetime="2005-03-31",
        output_filename="topaz4b_seaice_200503.nc",
    )
    # For the original 12.5 km polar stereographic grid, add dataset_part="originalGrid"
    # and give the area as minimum_x/maximum_x, minimum_y/maximum_y (units of 100 km).

tips:
  - >-
    sithick jumps around 2010, when CryoSat-2 and SMOS thickness assimilation begins. For sea ice thickness or volume trends from 1991, use sithick_corr
    and state in your paper which variable you used.
  - >-
    On the original grid, vectors (currents, ice velocity, wind stress) are aligned with the polar stereographic grid, and the PUM says they must be rotated when reprojecting
    to latitude-longitude. When loading original-grid files into GIS, convert the x and y coordinates from 100 km to metres and use the projection's sphere (radius 6378273 m).
  - The default 0.125° interpolated product is slightly smoother than the original grid and has a slightly larger land mask. For straits and coastal transports, prefer the original grid.
  - "At about 12 km spacing the model cannot resolve Arctic mesoscale eddies (Rossby radius 1–2 km). Compare eddy-scale features with higher-resolution model output."
  - Vertical interpolation (cubic splines) can overshoot where temperature and salinity gradients are strong, and a few cells near the seabed may be intermittently masked.
  - GLORYS12 (global 1/12°) also covers the Arctic, but TOPAZ4b is an Arctic-specific reanalysis that assimilates sea ice drift and thickness directly. Comparing the two gives a sense of the uncertainty in sea ice analyses.

