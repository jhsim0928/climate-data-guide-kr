# ─────────────────────────────────────────────────────────────
# SODA3 — dataset information file (English edition)
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: soda3
name: SODA3
full_name: Simple Ocean Data Assimilation version 3 (SODA3; current flagship release SODA3.15.2)
category: reanalysis
domain: ocean
group: 재분석
order: 40
domains: [해양, 해빙]
provider: SODA project, Department of Atmospheric and Oceanic Science, University of Maryland (James Carton, Gennady Chepurin and colleagues)

status: active
status_note: >-
  The current flagship release is SODA3.15.2, forced by ERA5. It is not updated monthly but extended in multi-year batches. On 2026-10-12 the last
  5-day file on the UMD server was 2024-12-02 (uploaded 2025-08-06), and no 2025 data were available yet. The same team has released the 1/10° successor
  SODA4 (1980 to June 2024), but no end date for SODA3 or schedule for the next extension has been announced.

transitions:
  - from: SODA3 (3.15.2)
    to: SODA4 (4.15.2)
    to_id: soda4
    status: completed
    date: "2025-10"
    summary: >-
      An eddy-resolving reanalysis that uses the same GFDL MOM5/SIS1 model and ERA5 forcing but raises the resolution from 1/4° and 50 levels to 1/10° and
      75 levels. Data for 1980 to June 2024 are on the UMD server (native-grid ocean from 1983), and the description paper appeared as an EGUsphere preprint
      in October 2025 (journal publication not confirmed as of October 2026).
    changes:
      - aspect: Horizontal resolution
        before: "About 1/4° displaced-pole native grid; 1/2° Mercator regridded"
        after: "About 1/10° displaced-pole native grid; 1/10° Mercator regridded"
      - aspect: Vertical levels
        before: "50 z* levels"
        after: "75 z* levels (regridded product keeps every other level)"
      - aspect: Period
        before: "1980–2024 (3.15.2)"
        after: "1980 to 2024-06 (native-grid ocean data from 1983; 1980–82 lost)"
      - aspect: Model and forcing
        before: "MOM5/SIS1, ERA5"
        after: "MOM5/SIS1, ERA5 (unchanged)"
      - aspect: Data location
        before: "dsrs.atmos.umd.edu/DATA/soda3.15.2/"
        after: "dsrs.atmos.umd.edu/DATA/SODA4.15.2_OR/ (native grid), SODA4.15.2_REG/ (0.1° regridded, 3600 × 1700) — folders reorganised in July 2026"
    impacts:
      - The two products differ in resolution and level structure; do not splice them into one time series or compare grid points directly.
      - SODA4 files are much larger for the same period. Plan to download only the regions and variables you need.
      - The SODA4 paper is still a preprint; when citing it, give the EGUsphere DOI and check whether it has since been published.
    sources:
      - name: SODA4 portal (UMD)
        url: https://www.soda.umd.edu/soda4
      - name: Chepurin et al. (2025), SODA4 preprint, EGUsphere
        url: https://doi.org/10.5194/egusphere-2025-3810

period:
  start: "1980-01"
  end: "2024-12"
  note: >-
    SODA3.15.2 starts in January 1980. On 2026-10-12 the regridded 5-day files ran from 1980_01_03 to 2024_12_02 and the regridded monthly files
    covered 1980–2024 (one file per year). Earlier releases (3.3.2, 3.4.2, e.g. 1980–2019) cover different periods depending on their forcing.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "5일"
  spatial: >-
    Native: tripolar Arakawa B-grid, 1440 × 1070 (README: 0.1° × 0.25° at high latitudes to 1/4° × 1/4° in the tropics) /
    Regridded: uniform 1/2° × 1/2° Mercator grid, 720 × 330 (starting at 74.75°S) / Analysis increments: 1° × 1° grid, upper 33 levels
  vertical: "50 z* levels (README: about 5 m to about 5,395 m)"
  temporal: 5-day averages (native and 1/2° regridded), calendar-month averages (1/2° regridded), 10-day analysis increments and transports

coverage:
  short: 전지구
update: Irregular batch extensions (latest August 2025 — 2020–2024 added)
license: No licence stated on the UMD pages; users are asked to give the version used and cite Carton et al. (2018) / NCAR GDEX ensemble copy under CC BY 4.0
account_required: false

summary: >-
  SODA3 is the University of Maryland's ocean/sea ice reanalysis. It couples the MOM5 ocean model (about 1/4°, 50 levels) from GFDL CM2.5 with the SIS
  sea ice model and assimilates WOD temperature and salinity profiles, ICOADS in situ SST and satellite SST by optimal interpolation. A distinctive
  feature is a correction that reduces biases in the surface heat and freshwater fluxes. The same system has been run as an ensemble with different
  atmospheric forcings (MERRA-2, ERA-Interim, JRA-55, JRA55-do, ERA5 and others); the current flagship release is SODA3.15.2, forced by ERA5.

time_convention:
  summary: >-
    All SODA3 files contain averages. A `5dy` file holds one 5-day average frame; an `mn` file holds 12 calendar-month averages (one year). The dates in
    5-day file names (YYYY_MM_DD) start at 1980_01_03 and step by 5 days, and the APDRC copy stamps them at 1980-01-03 00:00, which suggests the date is
    the middle of the 5-day period (the official documentation does not say).
  points:
    - "The SODA README describes a 5-day file only as one 5-day average frame identified by the date in its name; it does not say whether that date is the start, middle or end of the period."
    - "Monthly means (mn) are calendar-month averages computed during the model integration; one yearly file (…_mn_ocean_reg_YYYY.nc) holds 12 months."
    - "5-day frames do not line up with calendar months or leap years, so recomputing monthly means from 5-day data means splitting frames that straddle month boundaries. Using the monthly files directly is safer."
    - "Heat fluxes (W/m²) and freshwater fluxes ((kg/m³)(m/s)) are mean fluxes, not accumulations."
  source: https://www2.atmos.umd.edu/~carton/soda/soda3_readme.htm
  source_name: "SODA3 README (UMD) + time axis of the APDRC ERDDAP SODA 3.15.2 5-day dataset"

variables:
  note: >-
    Main variables from the SODA3 README and the APDRC ERDDAP copy; names are as in the netCDF files. Ocean (ocean) and sea ice (ice) fields are in
    separate files.
  full_list: https://www2.atmos.umd.edu/~carton/soda/soda3_readme.htm
  groups:
    - name: 3-D ocean (ocean, 50 levels)
      kind: mean
      period: 5-day / Monthly
      items:
        - "Potential temperature — `temp` (°C)"
        - "Practical salinity — `salt` (psu)"
        - "Zonal, meridional and vertical velocity — `u`, `v`, `w` (m/s)"
        - "Potential density — `prho` (kg/m³)"
    - name: 2-D ocean (ocean)
      kind: mean
      period: 5-day / Monthly
      items:
        - "Dynamic sea surface height (sea level + Pa/(rho0·g)) — `ssh` (m)"
        - "Mixed layer depth by temperature (0.2 K), potential density (0.03 kg/m³) and salinity (0.01 psu) criteria — `mlt`, `mlp`, `mls` (m)"
        - "Bottom pressure offset — `anompb` (dbar)"
        - "Wind stress — `taux`, `tauy` (N/m²)"
        - "Surface heat flux from coupler plus restore — `hflux_total` (W/m²)"
        - "Surface ocean heat flux coming through coupler and mass transfer — `net_heating` (W/m²)"
        - "Shortwave, longwave, latent and sensible heat flux into ocean — `swflx`, `lw_heat`, `evap_heat`, `sens_heat` (W/m²)"
        - "Water flux into sea water (P − E + runoff) — `pme_river` ((kg/m³)(m/s))"
    - name: Sea ice (ice)
      kind: mean
      period: 5-day / Monthly
      items:
        - "Ice thickness — `hi` (m)"
        - "Ice mass — `mi` (kg/m²)"
        - "Snow thickness — `hs` (m)"
        - "Ice concentration in each of five thickness categories — `cn1`–`cn5` (0–1)"
    - name: Transports (transp, native grid, 10-day)
      kind: mean
      period: 10-day
      items:
        - "Column-integrated mass transport — `mxvint`, `myvint` (10⁹ kg/s, about Sv)"
        - "Mass transport across cell faces — `mx`, `my` (10⁹ kg/s)"

access:
  - name: SODA project home page (UMD)
    url: https://www.soda.umd.edu/
    method: Information page (SODA3 and SODA4 portals)
    note: Version guide, how to cite, and links to the SODA3 and SODA4 portals.
  - name: UMD data server — SODA3.15.2
    url: https://dsrs.atmos.umd.edu/DATA/soda3.15.2/
    login: false
    method: Direct HTTP(S) download
    note: >-
      netCDF files in REGRIDED/ (1/2° regridded: ocean, ice) and ORIGINAL/ (native grid: ocean, ice, transport). A regridded monthly file for one year is
      about 2.7 GB and a 5-day file about 286 MB (about 630 MB on the native grid). The no-assimilation control run is in soda3.15.2.0/.
  - name: UMD data server — earlier releases (soda3.3.2, soda3.4.2, etc.)
    url: https://dsrs.atmos.umd.edu/DATA/
    login: false
    method: Direct HTTP(S) download
    note: Folders for earlier releases remain, e.g. MERRA-2 forcing (3.3.2) and ERA-Interim forcing (3.4.2).
  - name: APDRC ERDDAP — SODA 3.15.2 5-day 2-D variables
    url: https://apdrc.soest.hawaii.edu/erddap/griddap/hawaii_soest_65c6_e6c0_c600.html
    login: false
    method: ERDDAP subsetting / OPeNDAP
    note: University of Hawaii APDRC copy. As of October 2026 it covers only 1980-01-03 to 2022-12-23, shorter than the UMD original.
  - name: NSF NCAR GDEX — SODA3 Ensemble Means and Standard Deviations (d650000)
    url: https://gdex.ucar.edu/datasets/d650000/
    method: Web download
    note: 5-day 0.5° ensemble mean and standard deviation across forcing runs, 1980-01-03 to 2016-12-24. A different product from the individual releases.

example:
  lang: python
  note: "Downloads one year of 1/2° regridded monthly means (about 2.7 GB) from the UMD server and opens it with xarray. Variable names follow the README."
  code: |
    import urllib.request
    import xarray as xr

    url = ("https://dsrs.atmos.umd.edu/DATA/soda3.15.2/REGRIDED/ocean/"
           "soda3.15.2_mn_ocean_reg_2020.nc")
    fname = "soda3.15.2_mn_ocean_reg_2020.nc"
    urllib.request.urlretrieve(url, fname)   # about 2.7 GB

    ds = xr.open_dataset(fname)
    print(ds["temp"])   # potential temperature (°C), 12 months × 50 levels
    print(ds["ssh"])

tips:
  - "Always give the release number in publications (e.g. SODA3.15.2, SODA3.4.2): releases differ in forcing and period and give different results. A trailing .0 (e.g. 3.15.2.0) denotes the control run without data assimilation."
  - "The second number in the release name identifies the forcing: 3.3 MERRA-2, 3.4 ERA-Interim, 3.7 JRA-55, 3.12 JRA55-do, 3.15 ERA5, etc."
  - "The native grid is tripolar, so it is not a lat-lon grid near the Arctic. The 1/2° Mercator regridded files are easier for maps and regional means; note that temperature and salinity were remapped conservatively and velocities non-conservatively."
  - "There are two SODA READMEs (soda.umd.edu and www2.atmos.umd.edu/~carton) whose release lists and bulk formula descriptions differ. Confirm the forcing and period of each release from the server folders and file attributes."
  - "The APDRC and NCAR copies are either shorter than the UMD original (APDRC to 2022-12) or a different product (NCAR ensemble mean). Get the most recent period from the UMD server."

