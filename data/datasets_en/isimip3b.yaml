notices:
  - date: "2026-08-28"
    level: info
    title: CMIP7-based ISIMIP4b kicked off — first input data released
    body: >-
      The first package of ISIMIP4b input data, based on the first CMIP7-ScenarioMIP simulations from EC-Earth (picontrol, historical, High and Very Low
      scenarios), has been released. UKESM and other GCMs will be added as soon as possible, working towards the AR7 submission deadline expected in May 2027.
    source: https://www.isimip.org/news/isimip4b-kicked-off
  - date: "2022-01-10"
    level: info
    title: Secondary climate input data now available
    body: >-
      Bias-adjusted data for extra experiments of the five primary GCMs (hist-nat, ssp119, ssp245, ssp460) and for five secondary GCMs (CNRM-CM6-1,
      CNRM-ESM2-1, CanESM5, EC-Earth3, MIROC6) were released (DOI 10.48364/ISIMIP.581124). They are not part of the protocol, so modellers are asked to
      prioritise the protocol experiments.
    source: https://www.isimip.org/newsletter/isimip3b-secondary-climate-input-data-now-available
  - date: "2021-05-17"
    level: critical
    title: ISIMIP3b bias-adjusted climate input data completely replaced (ISIMIP3BASD v2.5.0, W5E5 v2.0)
    body: >-
      "The ISIMIP3b bias-adjusted climate input data have been completely replaced." ISIMIP3BASD was updated from v2.4.1 to v2.5.0 and the reference W5E5
      from v1.0 to v2.0. Any new ISIMIP3b simulation should use the new data; whether simulations based on the old input must be replaced was not yet decided.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3-replaced-bias-adjusted-climate-input-data
  - date: "2021-04-19"
    level: critical
    title: Faulty ISIMIP3 climate input data retracted
    body: >-
      The faulty version of the ISIMIP3b bias-adjusted climate input data (and of the ISIMIP3a observational inputs) was retracted from the ESGF and ISIMIP
      servers. Users were asked not to use it and to wait for the revised release.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3-climate-input-data-retracted-isimip-servers
  - date: "2021-02-18"
    level: warning
    title: Discontinuities found in bias-adjusted climate input data
    body: Statistics of the ISIMIP3b bias-adjusted climate input data were found to be discontinuous at the turn of each month, because the bias adjustment was applied calendar month by calendar month.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3b-discontinuities-found-bias-adjusted-climate-input-data
  - date: "2020-06-19"
    level: warning
    title: Bias-adjusted GCM data replaced after ISIMIP3BASD v2.3.1 flaw
    body: >-
      A flaw in ISIMIP3BASD v2.3.1 gave poor bias adjustments for all variables except ps, rlds and tas, particularly severe for precipitation. The data were
      redone with v2.4.1 and replaced on 19 June 2020. All climate models and climate scenarios were affected.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3b-bias-adjusted-gcm-data-replaced/

