notices:
  - date: "2026-10-16"
    level: warning
    title: "Delay in the provision of GCOM-W products due to system maintenance (2026-10-20 00:30 to 10-21 09:00 UTC)"
    body: >-
      JAXA G-Portal announced that, due to system maintenance, the provision of GCOM-W Standard Products is expected to be delayed from 00:30 UTC on 20 October to 09:00 UTC on 21 October 2026, and that products will be provided in sequence after the system recovers.
      ASI sea ice concentration is derived from GCOM-W AMSR2 data, so daily files for this period may appear late.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1512
  - date: "2026-09-04"
    level: warning
    title: "JAXA: some AMSR2 standard L1 and L2 products since 2026-09-02 contain less than one scene of data"
    body: >-
      JAXA G-Portal reported that some GCOM-W standard products delivered since 00:00 UTC on 2026-09-02 may contain less than one scene of data, with the cause under investigation.
      A 4 September update narrowed this to AMSR2 standard L1 and L2 products, said L3 is not affected, and said the affected products will be overwritten with good products at the next delivery. ASI daily files for this period may be updated later.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1500
  - date: "2026-08-21"
    level: info
    title: ASI sea ice concentration climate record from SSM/I and SSMIS (1991–2024, 6.25 km) posted
    body: >-
      The SeaIceConcentration/ASI_CDR/ folder on the University of Bremen server now holds 1991–2024 daily 6.25 km EASE2 sea ice concentration (netCDF and PNG) with ASI adapted to SSM/I and SSMIS using AMSR2 as reference,
      plus an area and extent table and a report (v1.0, 2026-04-30). It is separate from the AMSR2 v5.4 product on this page.
    source: https://data.seaice.uni-bremen.de/SeaIceConcentration/readme.txt
  - date: "2026-08-19"
    level: info
    title: Preliminary AMSR3-based ASI sea ice concentration folder released
    body: >-
      An amsr3/ folder on the University of Bremen server provides preliminary ASI sea ice concentration (asi_daygrid_swath) and daily gridded brightness temperatures (tb_daygrid_swath) from GOSAT-GW AMSR3.
      The AMSR3 readme (modified 2026-08-19; on the server it sits in the amsr2/ folder) says the preliminary concentration record starts on 2026-06-09, and gridded brightness temperature files go back to 2025-08-11. There is no website notice yet and no statement that it replaces the AMSR2 product.
    source: https://data.seaice.uni-bremen.de/amsr3/
  - date: "2026-06-30"
    level: info
    title: JAXA releases GOSAT-GW AMSR3 standard products (including sea ice concentration)
    body: >-
      JAXA began distributing AMSR3 brightness temperatures and geophysical products on G-Portal, including sea ice concentration, high-resolution sea ice concentration and sea ice motion vectors.
      AMSR3 started observing on 2025-08-11 and, as AMSR2's successor, aims at continuity of use with AMSR2 data.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1473
  - date: "2026-06-01"
    level: warning
    title: "NOAA notice on AMSR2 product decommissioning and AMSR3 transition — JAXA AMSR2 standard near-real-time data provision ends in September 2026"
    body: >-
      NOAA NESDIS announced that, because JAXA will discontinue AMSR2 data, its operational AMSR2 products (sea ice included) would be decommissioned on 2026-08-31 and replaced by AMSR3 versions.
      The notice states that provision of AMSR2 standard near-real-time data ends in September 2026, and during the July–August 2026 transition AMSR2 global data was received on all passes at the Svalbard ground station. When checked on 2026-10-13, Bremen's AMSR2 ASI was still being updated.
    source: https://ospo.noaa.gov/data/messages/2026/06/MSG_20260601_1400.html
  - date: "2025-09-23"
    level: info
    title: Some days incomplete after JAXA AMSR2 data outage (22–24 September 2025)
    body: >-
      JAXA AMSR2 data delivery stopped from 22 to 24 September, leaving the 22 September maps incomplete and no data on 24 September. Delivery resumed on 24 September and the incomplete data were to be reprocessed.
    source: https://seaice.uni-bremen.de/news-archive/

transitions:
  - from: ASI AMSR2 v5.4
    to: ASI AMSR3 (preliminary)
    status: planned
    date: "2026-08"
    summary: >-
      With the AMSR2 host GCOM-W in its latter phase and JAXA releasing products from the successor AMSR3 (GOSAT-GW) since 2026-06-30, the University of Bremen has started posting preliminary AMSR3-based ASI concentrations in an amsr3/ folder.
      As of 2026-10-13, AMSR2 v5.4 is still being updated, and no official version name, switch-over date or reprocessing plan for the AMSR3 product has been announced.
    changes:
      - aspect: Input sensor
        before: "GCOM-W1 AMSR2 (2012-07 onward)"
        after: "GOSAT-GW AMSR3 (observing since 2025-08-11)"
      - aspect: Period
        before: "2012-07 to present (2002-06 onward including AMSR-E)"
        after: "Preliminary concentration record from 2026-06-09 (readme); gridded brightness temperatures from 2025-08-11"
      - aspect: Server folder
        before: "amsr2/asi_daygrid_swath/ (n6250, s6250, n3125, s3125, swath)"
        after: "amsr3/asi_daygrid_swath/, amsr3/tb_daygrid_swath/ (n6250, n12500, n25000, s6250, s12500, s25000)"
      - aspect: File names
        before: "asi-AMSR2-n6250-YYYYMMDD-v5.4.nc"
        after: "Gridded brightness temperatures as amsr3-n6250-YYYYMMDD-89h.hdf. Concentration file names could not be checked on 2026-10-13 because the folder listing is closed to automated reading"
      - aspect: Version and status
        before: "v5.4 (2018 reprocessing, operational)"
        after: "Preliminary data, no version label or validation document"
    impacts:
      - AMSR2 and the preliminary AMSR3 product differ in calibration and swath width, so values for the same day may differ. Do not splice them into one series before an official comparison is published.
      - Make automated download scripts check the date of the newest file in amsr2/ so that you notice if AMSR2 updates stop.
      - Preliminary data may be reprocessed or changed later; state the download date and that the data are preliminary in publications.
    sources:
      - name: University of Bremen data server, amsr3/ folder
        url: https://data.seaice.uni-bremen.de/amsr3/
      - name: JAXA G-Portal — GOSAT-GW/AMSR3 Products Now Available (2026-06-30)
        url: https://gportal.jaxa.jp/gpr/notice/notice/view/1473
      - name: JAXA — GCOM-W satellite page (Latter Phase In Operation)
        url: https://global.jaxa.jp/projects/sat/gcom_w/
      - name: OSI SAF — Implications of AMSR2 being replaced by AMSR3 on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-amsr2-being-replaced-amsr3-osi-saf-products
  - from: ASI v5.2 and v5.3 (near real time)
    to: ASI v5.4
    status: completed
    date: "2018"
    summary: >-
      In 2018 all AMSR-E and AMSR2 data for both poles were reprocessed with the same parameters, settings and software as v5.4. Near-real-time data produced before that are v5.3 (from 2017-05-02) and v5.2.
    changes:
      - aspect: Processing
        before: "Near-real-time processing by period (v5.2; v5.3 from 2017-05-02)"
        after: "Whole period 2002 to present reprocessed with identical settings"
      - aspect: Regional 3.125 km maps
        before: "Produced in near real time"
        after: "Still produced, but not reprocessed in v5.4"
      - aspect: Value encoding
        before: "Older files: concentration 0–200, land/missing 255"
        after: "Concentration 0–100, land/missing 120"
    impacts:
      - Replace any v5.2 or v5.3 files you downloaded earlier with v5.4; the version string at the end of the file name tells them apart.
      - Code written for the older files uses a different value range (0–200, 255) and would read concentrations twice as high if applied unchanged.
    sources:
      - name: ASI Version 5 Sea Ice Concentration User Guide (V0.9.4)
        url: https://data.seaice.uni-bremen.de/amsr2/ASIuserguide.pdf
      - name: University of Bremen data archive page (value encoding)
        url: https://seaice.uni-bremen.de/data-archive/

