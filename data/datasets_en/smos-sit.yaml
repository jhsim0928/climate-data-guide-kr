    method: Anonymous FTP
    note: >-
      AWI states that access is anonymous. The v3.3 quicklook path on the AWI wiki (smos/v3.3/nh/) suggests a smos/<version>/<nh|sh> layout, but the v3.6 folder path is not confirmed on the official pages, so check the FTP listing.
    login: false
  - name: University of Bremen data server — SMOS and SMOS/SMAP thin ice thickness
    url: https://data.seaice.uni-bremen.de/
    method: HTTPS / anonymous FTP (data.seaice.uni-bremen.de, user anonymous)
    note: The products are in the smos/ (SMOS only) and smos_smap/ (SMOS/SMAP) folders. Subfolder layout and file format are not documented on the official pages, so check them directly.
    login: false
  - name: ESA Earth Online — SMOS L3 Sea Ice Thickness catalogue
    url: https://earth.esa.int/eogateway/catalog/smos-l3-sea-ice-thickness
    method: Web information (DOI, product description, ATBD, read-me note)

example:
  lang: python
  note: >-
    Opens an AWI v3.6 Northern Hemisphere daily file (SMOS_Icethickness_v3.6_north_<date>.nc), applies the checks recommended in the read-me note (uncertainty above 1 m, saturation ratio above 95%), and looks at thickness in the Sea of Okhotsk.
  code: |
    import glob
    import xarray as xr

    f = sorted(glob.glob("SMOS_Icethickness_v3.6_north_*.nc"))[-1]
    ds = xr.open_dataset(f).squeeze()

    sit = ds["sea_ice_thickness"]                       # m, daily mean
    ok = (ds["ice_thickness_uncertainty"] <= 1.0) & (ds["saturation_ratio"] <= 95) & (ds["land"] == 0)
    sit = sit.where(ok)

    # Sea of Okhotsk (roughly 44–60°N, 135–160°E) — latitude/longitude are 2-D variables
    box = (ds["latitude"] > 44) & (ds["latitude"] < 60) & (ds["longitude"] > 135) & (ds["longitude"] < 160)
    print(str(ds["time"].values), "mean thin-ice thickness (m):", float(sit.where(box).mean()))
    print("cells with RFI ratio above 50%:", int((ds["RFI_ratio"].where(box) > 50).sum()))

tips:
  - >-
    CS2SMOS (../cs2smos/) and CS3SMOS (../cs3smos/) in the same tab merge this SMOS L3 thickness with CryoSat-2 (and Sentinel-3) altimeter thickness by optimal interpolation into weekly (7-day) L4 fields.
    Use the merged products for the full thickness range in one map, and this daily L3 for day-to-day changes during freeze-up or for thin ice itself. CS2SMOS v206 used SMOS v3.3 as input, and CS3SMOS v300 uses v3.6.
  - >-
    CryoSat-2-only thickness (../cryosat2-sit/) has large relative errors over thin ice (below roughly 1 m), whereas SMOS saturates over thick ice. The AWI product description says thickness information can be derived up to about 1.5 m,
    but the maximum retrievable thickness depends on ice salinity and temperature, so read values with `saturation_ratio` above 95% as "at least this thick".
  - >-
    The retrieval assumes 100% ice concentration, so cells containing open water (ice edges, leads) are biased thin, and this effect is not included in the uncertainty. In seasonal ice zones with lower concentration such as the Sea of Okhotsk,
    interpret the thickness together with a concentration product (e.g. ../amsr2-asi/, ../osisaf-sic/).
  - >-
    Radio-frequency interference (RFI) is still a problem in the Arctic, especially along the Russian coast (Barents, Kara and Laptev Seas) since 2023. Use `RFI_ratio` and `nPair` to find poorly sampled cells. RFI is negligible in the Antarctic.
  - >-
    Because v3.6 uses an ERA5 climatology instead of daily weather, it is robust to outages of auxiliary data servers but cannot capture inter-annual variability in air temperature and wind; the average effect is about 5 cm.
    Do not mix results from v3.3, and even though the ESA catalogue citation still reads "Version 3.3", state the version you actually used (v3.6 in the file name) in publications.
  - >-
    Antarctic thickness is more uncertain because snow is handled with Arctic parameterizations and Southern Hemisphere bulk salinity has not been fully evaluated. Iceberg A-23A in the Weddell Sea (about 75.3°S, 37.3°W) appears as anomalously thin ice, which is not yet corrected.
  - >-
    The University of Bremen products use different algorithms from AWI (the empirical method of Huntemann et al. 2014, and the SMAP-combined method of Paţilea et al. 2019). Bremen recommends the RFI-filtered SMOS version or the SMOS/SMAP product
    over the raw SMOS one, and notes that with about 40 km resolution only larger areas of thin ice are retrieved correctly. Do not mix values from the two institutes in one series.

