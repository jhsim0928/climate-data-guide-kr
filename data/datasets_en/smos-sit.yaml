# ─────────────────────────────────────────────────────────────
# SMOS thin sea ice thickness (AWI/ESA SMOS L3 Sea Ice Thickness v3.6 + University of Bremen SMOS and SMOS/SMAP) — dataset information file (English edition)
# Satellite tab (sea ice), cross-listed in the sea ice tab (satellite observations). Daily thickness of thin ice from L-band radiometry, produced only in the freezing season.
# When checked on 2026-10-13, the AWI product was v3.6 (since 2025-10-15) and the ESA dissemination index ran to October 2026 (end of the Southern Hemisphere season; Northern Hemisphere due to start on 10-15).
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: smos-sit
name: SMOS thin sea ice thickness
full_name: SMOS L3 Sea Ice Thickness (AWI/ESA, v3.6) and University of Bremen SMOS and SMOS/SMAP Thin Sea Ice Thickness
category: satellite
domain: satellite
group: 해빙
order: 45
also_in:
  - domain: seaice
    group: 위성 관측 자료
domains: [해빙, 원격탐사]
provider: Alfred Wegener Institute (AWI) — ESA CS2SMOS-PDS project, distributed by ESA / Institute of Environmental Physics, University of Bremen (SMOS and SMOS/SMAP products) — based on ESA SMOS and NASA SMAP data

status: active
status_note: >-
  The AWI product moved from v3.3 to v3.6 with the 2025/26 winter on 2025-10-15, ended Arctic production on 2026-04-15 and has since produced Southern Hemisphere winter fields (15 April–15 October).
  When checked on 2026-10-13, the ESA L3_SIT_Open index ran to October 2026 (generated 2026-10-12), and the AWI wiki had not yet announced the start of the 2026/27 Arctic season (normally 15 October).
  The University of Bremen says its SMOS and SMOS/SMAP products (v300) continue on a "best effort" basis, but its data folders are closed to automated reading, so the latest file date could not be checked.

period:
  start: "2010-10"
  end: present
  note: >-
    The AWI v3.6 Arctic record starts on 2010-10-15, with 2010–2024 fully reprocessed in v3.6. Southern Hemisphere data also go back to 2010 (v3.3 operational since April 2024, v3.6 operational from April 2026);
    commissioning-phase data from January to May 2010 are available on request only. Northern Hemisphere fields exist only from 15 October to 15 April and Southern Hemisphere fields from 15 April to 15 October.
    The University of Bremen products are retrieved from October to April in the Arctic and from March to September in the Antarctic.

resolution:
  spatial_short: "12.5 km (0.11°)"
  temporal_short: "1일"
  spatial: >-
    AWI v3.6 — 12.5 km NSIDC polar stereographic grid (Northern Hemisphere EPSG:3413, Southern Hemisphere EPSG:3976, x 608 × y 896). A 12.5 km EASE2 version (EPSG:6931/6932, 864 × 864) is also produced, but only the polar stereographic version is disseminated.
    The spatial resolution of SMOS itself is about 40 km (University of Bremen, for the incidence angles used), much coarser than the grid spacing
  vertical: Not applicable (single thickness value)
  temporal: Daily mean (one field per day; time_coverage 00:00:00–23:59:59, P1D). Freezing season only

coverage:
  short: 양극
  note: "Freezing season only — Northern Hemisphere 15 Oct–15 Apr, Southern Hemisphere 15 Apr–15 Oct (AWI). Thick ice saturates the signal and is underestimated"
update: >-
  Daily during the freezing season (AWI). The University of Bremen SMOS product is processed twice a day (about 7 hours after observation and again 23 hours later); the SMOS/SMAP product after about 8 hours, then reprocessed after 24 hours and after one week
license: >-
  ESA distribution under the ESA Earth Observation Terms and Conditions (free, ESA EO Sign In account required). The AWI distribution has no licence statement but asks for paper citations and an acknowledgement.
  The University of Bremen products carry no licence statement and are offered as research products without warranty
account_required: false

summary: >-
  Daily thickness of thin sea ice derived from ESA SMOS L-band (1.4 GHz) brightness temperatures, which are sensitive to the thickness of thin ice (the AWI product description says thickness information can be derived up to about 1.5 m).
  Radar altimeters such as CryoSat-2 have large relative errors over thin ice with small freeboard, so SMOS complements them over newly forming ice, ice edges and polynyas.
  The main product is AWI's L3 (v3.6), produced under an ESA project, which is also the SMOS input to the merged CS2SMOS and CS3SMOS thickness products.
  The University of Bremen produces separate products with a different empirical method: a SMOS-only product and a SMOS/SMAP product that adds NASA SMAP (v300).

time_convention:
  summary: >-
    Each AWI file is a daily mean. In v3.6 thickness is first computed per swath and the swath thicknesses of the day are then averaged into the daily mean thickness;
    the global attributes time_coverage_start and time_coverage_end span 00:00:00 to 23:59:59 of that day. Values are averages of several overpasses, not instantaneous values.
  points:
    - "`time` holds one date in 'hours since 2010-01-01 00:00:00'. The product description document (PDD v5.0) does not state the time zone of the day boundary (whether UTC)."
    - "Instead of the near-real-time JRA-55/JRA-3Q used in v3.3, v3.6 uses an ERA5 climatology for 2010–2023 (2 m air temperature, 10 m wind speed) as auxiliary data, so the values for that calendar day enter, not the actual weather of the day."
    - "`TB_uncertainty` is the standard deviation of the day's brightness temperatures divided by the square root of the number of pairs (`nPair`), i.e. the uncertainty of the daily mean."
    - "The University of Bremen products are also daily files of the previous day, and the same date may be reprocessed and change later (the SMOS/SMAP product is reprocessed after 24 hours and after one week)."
  source: https://spaces.awi.de/download/attachments/297634432/AWI_ESA_SMOS_PDD_v5.pdf?version=1&modificationDate=1760692666142&api=v2
  source_name: AWI SMOS Sea Ice Thickness PDD v5.0 (2025-04-24) / ReadMe-first Technical Note v4.0 (2025-10-15) / University of Bremen Thin Ice Thickness page

variables:
  note: >-
    Variables from the AWI v3.6 product description document (PDD v5.0, Table 6). Variable names in the University of Bremen SMOS and SMOS/SMAP files are not given on the official pages, so they are not listed.
  full_list: https://spaces.awi.de/download/attachments/297634432/AWI_ESA_SMOS_PDD_v5.pdf?version=1&modificationDate=1760692666142&api=v2
  groups:
    - name: Thickness (AWI v3.6 daily files)
      kind: mean
      period: Daily
      items:
        - text: "SMOS sea ice thickness — `sea_ice_thickness` (m)"
          note: Daily mean of the swath thicknesses. Assumes 100% ice concentration, so it is underestimated where concentration is lower
        - text: "Total sea ice thickness uncertainty — `ice_thickness_uncertainty` (m)"
          note: Use with caution above 1 m. Underestimation from concentrations below 100% is not included
        - text: "Ratio of retrieved to maximum retrievable thickness — `saturation_ratio` (%)"
          note: Above 95% the signal is saturated over thick ice; use with caution
          std: []
    - name: Brightness temperature and auxiliary quantities
      kind: mean
      period: Daily
      items:
        - text: "Brightness temperature intensity (TBh+TBv)/2 — `TB` (K)"
          std: []
        - text: "Brightness temperature uncertainty — `TB_uncertainty` (K)"
          std: []
        - text: "SMOS-derived snow surface temperature — `Tsurf` (K)"
          std: []
        - text: "Bulk ice salinity — `Sice` (psu)"
          note: Not yet fully evaluated for the Southern Hemisphere
          std: []
    - name: Data counts and quality indicators
      kind: accum
      period: Daily
      items:
        - text: "Number of TBh and TBv pairs used — `nPair` (count)"
          std: []
        - text: "Percentage of RFI-contaminated measurements — `RFI_ratio` (%)"
          kind: mean
          std: []
        - text: "Land mask — `land` (0/1)"
          kind: static
          std: []

