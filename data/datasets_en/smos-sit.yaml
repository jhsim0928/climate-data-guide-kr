notices:
  - date: "2026-04-17"
    level: info
    title: Arctic 2025/26 season ends; L3 production switched to the Southern Hemisphere
    body: >-
      AWI ended Arctic L3 SMOS thickness processing and dissemination on 2026-04-15 and has provided Southern Hemisphere winter L3 data from the same day. This is the normal seasonal switch for a freezing-season product;
      the 2026/27 Arctic season usually starts on 15 October (no start notice as of 2026-10-13).
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2026/04/17/624499172/The+L3+product+has+been+switched+from+the+Arctic+to+the+Antarctic.
  - date: "2025-10-17"
    level: warning
    title: "Product version changes from v3.3 to v3.6 with the 2025/26 winter"
    body: >-
      When L3 SMOS sea ice thickness processing and dissemination resumed on 2025-10-15, the product version changed from v3.3 to v3.6. The key changes are swath-based processing, an improved RFI filter and an ERA5 climatology as auxiliary weather data,
      and 2010–2024 were reprocessed in v3.6. File names and values change, so check download scripts and existing analyses.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/17/595263548/L3+SMOS+sea+ice+thickness+processing+started+for+2025+26+winter+season.
  - date: "2025-06-06"
    level: info
    title: "v3.3 production suspended from 2025-06-02 — v3.6 not affected"
    body: >-
      Maintenance of the NSF NCAR computing systems used to obtain the auxiliary JRA-3Q data stopped v3.3 production from 2 June. v3.6, which uses an ERA5 climatology, was produced normally;
      v3.3 returned to normal on 6 June and the missing 3–5 June data were reprocessed (notice of 2025-06-10).
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/06/06/565587944/Update+on+SMOS+L3+Sea+Ice+Thickness+Data+Production+v3.3
  - date: "2025-02-06"
    level: warning
    title: "v3.3 production stopped (2025-02-03 to 03-03) — data for 4–16 February missing"
    body: >-
      Downtime of the JMA JRA-3Q data server stopped production of L3 v3.3 and of CS2SMOS v206, which uses it as input, until 2025-03-03. L3 v3.3 has no data for 2025-02-04 to 16.
      The new version based on an ERA5 climatology was not affected.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/02/06/543621383/SMOS+L3+v3.3+data+production+stopped+2025-02-03
  - date: "2022-10-08"
    level: info
    title: "University of Bremen SMOS/SMAP thin sea ice thickness v300 released"
    body: >-
      The University of Bremen released version 300 of its SMOS/SMAP thin sea ice thickness product, with updated projection information, a corrected grid shift (aligned with the official NSIDC north polar stereographic coordinates),
      a fix for missing SMAP data after September 2021 and newer SMAP L1B input. SMAP data were unavailable from 2022-08-06 to 10-05, so the near-real-time product then used SMOS only.
    source: https://seaice.uni-bremen.de/news-archive/

transitions:
  - from: SMOS L3 SIT v3.3
    to: SMOS L3 SIT v3.6
    status: completed
    date: "2025-10"
    summary: >-
      AWI changed the SMOS L3 sea ice thickness processing to compute thickness per swath first, and improved the RFI filter and auxiliary weather data. The whole period 2010–2024 was reprocessed;
      v3.6 became the operational version with the Arctic season starting on 2025-10-15, and the Southern Hemisphere has been processed with v3.6 since April 2026.
    changes:
      - aspect: Processing unit
        before: "Thickness computed directly from daily mean brightness temperatures"
        after: "Thickness computed from swath data (L2, internal use only) and then averaged per day; brightness temperatures weighted by radiometric resolution when averaged (about 0.3 K mean difference)"
      - aspect: RFI filtering
        before: "v3.3 filter"
        after: "Pixel-based border flag added; the 300 K threshold applied only within 0–40° incidence and radiometric accuracy below 5 K (about 0.5 K mean difference) — more Arctic coverage"
      - aspect: Auxiliary weather data
        before: "Near-real-time JRA-55/JRA-3Q reanalysis"
        after: "ERA5 2010–2023 climatology (2 m air temperature, 10 m wind speed) — about 5 cm mean thickness difference"
      - aspect: Grid and distribution
        before: "12.5 km polar stereographic (EPSG:3413), NetCDF4"
        after: "12.5 km polar stereographic (north EPSG:3413, south EPSG:3976) and EASE2 produced, only polar stereographic disseminated"
      - aspect: Period
        before: "Arctic from 2010-10 (Southern Hemisphere v3.3 operational from 2024-04)"
        after: "Arctic from 2010-10-15 fully reprocessed; Southern Hemisphere from 2010 (v3.6 operational from 2026-04)"
      - aspect: File names
        before: "SMOS_Icethickness_v3.3_north_<date>.nc"
        after: "SMOS_Icethickness_v3.6_north_<date>.nc / …_south_… (EASE2 versions end in _ease2)"
      - aspect: Documents and citation
        before: "PDD and read-me note Issue 3.1 (2023-10-15)"
        after: "PDD v5.0 (2025-04-24), read-me note Issue 4.0 (2025-10-15). ESA catalogue DOI 10.57780/sm1-5ebe10b unchanged (citation text still says Version 3.3)"
    impacts:
      - Do not mix v3.3 and v3.6 in one series. The whole period has been reprocessed in v3.6, so the safest option is to download again from 2010.
      - With an ERA5 climatology, inter-annual variations in air temperature and wind are no longer included. Keep this limitation in mind when interpreting thickness changes in anomalous winters.
      - The differences between CS2SMOS v206 (SMOS v3.3 input) and CS3SMOS v300 (SMOS v3.6 input) include this change of SMOS version.
    sources:
      - name: AWI — SMOS Sea Ice Thickness product page (version history, v3.6 improvements)
        url: https://spaces.awi.de/spaces/CS2SMOS/pages/297634432/SMOS+Sea+Ice+Thickness
      - name: AWI SMOS ReadMe-first Technical Note v4.0 (2025-10-15)
        url: https://spaces.awi.de/download/attachments/297634432/%5BDT4-1%5D-AWI_ESA_SMOS_RM_TN_v4.0_20251015.pdf?version=1&modificationDate=1760948153123&api=v2
      - name: AWI SMOS PDD v5.0 (2025-04-24)
        url: https://spaces.awi.de/download/attachments/297634432/AWI_ESA_SMOS_PDD_v5.pdf?version=1&modificationDate=1760692666142&api=v2
      - name: AWI notice — 2025/26 season start and switch to v3.6 (2025-10-17)
        url: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/17/595263548/L3+SMOS+sea+ice+thickness+processing+started+for+2025+26+winter+season.

