    url: https://smos-diss.eo.esa.int/oads/meta/L3_SIT_Open/index/
    method: HTTPS / FTPS (ftps://smos-diss.eo.esa.int/), with monthly index files
    note: Download requires a free ESA EO Sign In account. When checked on 2026-10-13, monthly indexes covered 2010-04 to 2026-10.
