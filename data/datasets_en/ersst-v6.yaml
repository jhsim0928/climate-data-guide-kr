    If you obtained the data from NOAA PSL, also include the acknowledgement requested on the PSL page.

notices:
  - date: "2026-10-02"
    level: warning
    title: "NCEI Data Access Delays — cloud migration (through 2026-10-30)"
    body: >-
      "NCEI is currently moving its data and applications to the cloud", so downloads may be intermittently slow or fail. NESDIS expects the migration to run through spring 2027.
      If the NCEI servers are unavailable, use the PSL copy.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2026-08-03"
    level: info
    title: ERSST v6 becomes NOAA's official SST dataset for determining the ENSO phase
    body: "NOAA ERSSTv6 is the new official SST dataset used by NOAA to determine the current ENSO phase, and the Relative Oceanic Niño Index (RONI), NOAA's official ENSO monitoring and prediction product, has also been updated to use ERSSTv6."
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-04-26"
    level: info
    title: ERSST v5 to be discontinued (June 2026)
    body: >-
      NOAA PSL announced that "the NOAA ERSSTv5 dataset will be discontinued by NOAA/NCEI in June 2026" and replaced by ERSSTv6.
      When checked in October 2026, v5 files were still being updated, but if you work with v5, prepare to move to v6.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-04-13"
    level: info
    title: NOAAGlobalTemp 6.1.0 switches its ocean component to ERSST v6
    body: Starting with the January 2026 Global Temperature and Precipitation Analysis, NOAA's global temperature dataset (NOAAGlobalTemp) version 6.1.0 uses the most recent release of ERSST version 6.
    source: https://www.ncei.noaa.gov/news/ai-supercharges-key-noaa-dataset-ensuring-peak-accuracy
  - date: "2026-03-06"
    level: info
    title: ERSST v6 added to NOAA PSL
    body: PSL added NOAA ERSST V6 (monthly, from 1850) to its data collection and began updating it monthly.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-12-04"
    level: info
    title: "Key NOAA Dataset Upgraded Using AI — ERSST v6 released"
    body: >-
      NCEI released ERSST v6, which uses artificial neural network interpolation. Compared with ERSSTv5 over 1850–2021, the spatial correlation coefficient increases by about 5%
      and the RMSD decreases by 0.03°C, with the largest improvements in the tropical Pacific, the Southern Hemisphere oceans between 60°S and 30°S, and ice-covered regions.
    source: https://www.ncei.noaa.gov/news/key-noaa-dataset-upgraded-using-ai

