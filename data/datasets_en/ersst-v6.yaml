# ─────────────────────────────────────────────────────────────
# ERSST v6 — dataset information file (English edition)
# Successor to ERSST v5. The v5→v6 comparison table is in the transitions of ersst.yaml.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: ersst-v6
name: ERSST v6
full_name: NOAA Extended Reconstructed Sea Surface Temperature (ERSST), Version 6
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 15
domains: [해양]
provider: NOAA National Centers for Environmental Information (NCEI)

status: active
status_note: >-
  The current version of ERSST, released by NCEI in December 2025 and updated monthly. Since 2026, NOAA's ENSO determination and the RONI index,
  as well as the NOAA global temperature dataset (NOAAGlobalTemp 6.1.0), use v6, and the previous version, v5, has been announced for discontinuation.
  Gridded uncertainty estimates have not yet been formally released.

period:
  start: "1850-01"
  end: present
  note: >-
    When checked on 2026-10-12, the NCEI monthly files ran through ersst.v6.202609.nc (September 2026), and the NOAA PSL single file also included September 2026.
    NCEI notes that the data are more reliable after the 1940s.

resolution:
  spatial_short: "222 km (2°)"
  temporal_short: "1개월"
  spatial: "2° × 2° latitude–longitude grid with statistically enhanced spatial completeness. NOAA PSL files: 180 longitudes × 89 latitudes, grid centres 88°S–88°N, 0°–358°E"
  vertical: Sea surface (single level)
  temporal: Monthly means

update: Monthly
license: U.S. Government public data — no use restrictions (CC0 1.0 per the data.gov catalog); NCEI asks users to cite the dataset DOI and the journal articles
account_required: false

summary: >-
  ERSST is a global monthly analysis of SST derived from the International Comprehensive Ocean–Atmosphere Dataset (ICOADS Release 3.0.2) ship and buoy observations
  plus Argo profiling floats, starting in 1850. Version 6 fills gaps with artificial neural network (ANN) interpolation to give a spatially complete 2° grid; no satellite data are used.
  It also upgrades ship-observation quality control (nearest-neighbour check), the large-scale filter and the proxy SST in ice-covered regions, and anomalies are computed against a 1991–2020 climatology.
  Since 2026 it has been NOAA's official SST dataset for ENSO monitoring and for the ocean component of NOAAGlobalTemp.

time_convention:
  summary: >-
    A monthly analysis: every value is the mean SST (or its anomaly) for the month. The time value only labels the month; it is not an instantaneous value at a specific time.
  points:
    - "The NOAA PSL file (sst.mnmean.nc) gives statistic 'Mean' and a one-month averaging period (avg_period); time is 00 UTC on the 1st of each month (e.g. 1850-01-01 to 2026-09-01), with time_bnds included."
    - "The NCEI originals are one file per month, named ersst.v6.YYYYMM.nc. We did not open them to check how time is encoded inside, so when combining files from different distributors, match on year and month rather than on the date."
    - "Anomalies are relative to the 1991–2020 monthly climatology (v5 used 1971–2000)."
  source: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
  source_name: NCEI ERSST product page / NOAA PSL THREDDS file metadata

variables:
  note: >-
    The NCEI original files (ersst.v6.YYYYMM.nc) contain both the SST `sst` and the anomaly `ssta` (both °C); the NOAA PSL file (sst.mnmean.nc) contains only `sst`.
  full_list: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01737
  groups:
    - name: Sea surface temperature
      kind: mean
      period: Monthly
      items:
        - "Monthly mean sea surface temperature — `sst` (°C)"
        - text: "Sea surface temperature anomaly (relative to the 1991–2020 climatology) — `ssta` (°C)"
          kind: mean
          period: Monthly
          note: "Monthly mean SST minus the 1991–2020 monthly climatology. Only in the NCEI original files (ersst.v6.YYYYMM.nc), not in the PSL file"
    - name: Climatology (separate PSL files)
      kind: mean
      period: Monthly
      items:
        - text: "Monthly long-term mean — `sst` (°C), sst.mon.ltm.1991-2020.nc and sst.mon.ltm.1981-2010.nc"
          note: A multi-year average for each calendar month, not a specific year

access:
  - name: NCEI direct download (monthly NetCDF)
    url: https://www.ncei.noaa.gov/data/sea-surface-temperature-extended-reconstructed/v6/access/
    login: false
    method: HTTPS (wget / curl)
    note: The official location given on the NCEI product page. One file per month, named ersst.v6.YYYYMM.nc (about 164 KB each).
  - name: NCEI pub directory (monthly files + full record in one file)
    url: https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/v6/
    login: false
    method: HTTPS (wget / curl)
    note: >-
      Holds the same monthly files (ersst.v6.185001.nc onward), plus ersst.v6.1850-last.nc in netcdf.one/ (1850 to the latest month in one file, about 272 MB)
      and v6-based climate index files in index/ (ersst.v6.el_nino.dat, pdo, amo, iod, atl3). Note that it sits under the v5 directory.
  - name: NOAA PSL (full record in one file)
    url: https://psl.noaa.gov/data/gridded/data.noaa.ersst.v6.html
    login: false
    method: Web download / THREDDS / OPeNDAP
    note: >-
      The full SST record is in a single file, sst.mnmean.nc, which is convenient to use directly. Monthly long-term mean files (1981–2010, 1991–2020) are also provided.
      The THREDDS catalog is at https://psl.noaa.gov/thredds/catalog/Datasets/noaa.ersst.v6/catalog.html.

example:
  lang: python
  note: Open the full-record file through the NOAA PSL OPeNDAP URL and compute the Niño 3.4 area-mean anomaly relative to 1991–2020.
  code: |
    import xarray as xr

    url = "https://psl.noaa.gov/thredds/dodsC/Datasets/noaa.ersst.v6/sst.mnmean.nc"
    sst = xr.open_dataset(url)["sst"]          # °C, monthly mean; lat runs 88 → -88 (north to south)

    # 1991–2020 monthly climatology and anomalies
    clim = sst.sel(time=slice("1991-01-01", "2020-12-01")).groupby("time.month").mean("time")
    ssta = sst.groupby("time.month") - clim

    # Niño 3.4 (5°S–5°N, 170°W–120°W = 190–240°E) area mean
    nino34 = ssta.sel(lat=slice(5, -5), lon=slice(190, 240)).mean(["lat", "lon"])
    print(nino34.sel(time=slice("2025-01-01", None)).round(2).to_series())

tips:
  - v5 and v6 use different anomaly base periods (v5 1971–2000, v6 1991–2020). Do not compare or splice anomalies from the two versions as they are.
  - v6 changes the interpolation method (EOT to ANN) and drops v5's 3-month running mean. Values and spatial patterns differ from v5 even for the same month, and month-to-month variability can be larger, so do not mix the versions in one time series.
  - Latitude in the PSL file runs north to south (88 → -88). Selecting with sel(lat=slice(south, north)) returns an empty result; put the northern bound first, e.g. slice(5, -5).
  - The PSL file's global attributes (summary, source, etc.) still carry v5-era text such as a '1971–2000 climatology' and 'NCEP GTS'. Follow the NCEI documentation for the base period and input data.
  - A Niño 3.4 anomaly you compute yourself will not match NOAA's official ENSO indices (RONI, etc.), which use different definitions and smoothing. If you need to agree with the official ENSO status, use the index values NOAA distributes.
  - Gridded uncertainty (ensemble) estimates have not yet been formally released. The developer guidance on the NCAR Climate Data Guide (August 2025) said they were expected in 2026; in October 2026 RONI uncertainty files appeared in the unc/ folder of the NCEI pub directory, but we have not found documentation for them.
  - Before 1945, when observations are sparse — especially before 1900, during the two World Wars and south of 40°S — uncertainties are large and spurious variability is possible (NCAR Climate Data Guide). Check trends in these periods against other datasets such as HadSST or COBE-SST.
  - Being 2° monthly means, the data cannot represent extremes or daily variability. When comparing with models, regrid the model to the 2° grid; the developers recommend comparing absolute SST rather than anomalies, because climatologies differ between products.
  - The dataset DOI for v6 is 10.25921/z7cw-es89. Some catalogues (data.gov, and the 'landing page' link in the NCEI metadata) still show the v5 DOI (10.7289/V5T72FNM); do not use it to cite v6.

