notices:
  - date: "2026-03-20"
    level: warning
    title: NASA projects end of science operations for Terra in February 2027 and Aqua in September 2027
    body: >-
      An editor's note on the NASA Science article "Terra: The End of An Era" (published 2025-12-29, updated 2026-03-20) says that, because of fuel and power limits, science operations are projected to end in February 2027 for Terra and September 2027 for Aqua,
      and that both will keep operating until then. MODIS ocean color and SST production ends with the satellites.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-12-09"
    level: warning
    title: OBPG — next MODIS Aqua ocean color reprocessing only after end of mission; post-2022 data less reliable
    body: >-
      Asked about MODIS reprocessing plans, OB.DAAC user services replied that the next Aqua ocean color reprocessing will not happen until the mission ends and that no date can be given because budgets are not settled.
      Orbit changes and on-orbit calibration challenges will likely not be fully correctable, so post-2022 data will probably be of lower reliability for long-term change, and VIIRS or PACE OCI should be considered for recent years.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=24652
  - date: "2025-05-02"
    level: warning
    title: Transition from MODIS to VIIRS — Terra and Aqua to begin decommissioning in late 2026 to early 2027
    body: >-
      NASA announced that Terra and Aqua are expected to cease operations in late 2026 or early 2027 and that their drift from the design orbits is changing equator crossing times, which may affect the data.
      A final reprocessing will follow the end of MODIS collection, and users are advised to consider comparable VIIRS products.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2022-10-27"
    level: info
    title: Aqua MODIS ocean color R2022.0 files released — new file names and folder layout
    body: >-
      OB.DAAC posted the R2022.0 Aqua MODIS L3 binned and mapped files on Direct Data Access and said the old versions were being deleted. The new files follow a new naming pattern, and on OPeNDAP
      old files sit in three-digit day-of-year folders while new files sit in four-digit MMDD folders. Terra reprocessing began in November 2022.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=12936
  - date: "2021-11-10"
    level: info
    title: Aqua stops orbit maintenance — equator crossing time drifting later
    body: >-
      According to LP DAAC, Aqua completed its final orbit-maintenance maneuvers on 2021-03-18; its crossing time began drifting later in July 2021, was expected to pass 13:45 in February 2023 and reach about 15:50 around August 2026.
      Later afternoon observations mean lower sun angles and more shadows, and the lower orbit changes swath width and the 16-day repeat cycle.
    source: https://lpdaac.usgs.gov/news/aqua-modis-acquisition-plan-through-august-2026/

transitions:
  - from: MODIS ocean color R2018.0
    to: MODIS ocean color R2022.0
    status: completed
    date: "2022-10"
    summary: >-
      A multi-mission reprocessing covering SeaWiFS through VIIRS and OLCI. It updated instrument calibration and vicarious calibration (MOBY), ancillary meteorology and ozone, chlorophyll coefficients and the land/water mask,
      while keeping product formats and suites as in R2014.0 (the file naming did change). SST was not part of this reprocessing and stays at R2019.0.
    changes:
      - aspect: Instrument calibration
        before: Solar and lunar calibration data up to R2018.0
        after: Solar diffuser and lunar data collected since R2018.0 plus improved degradation modelling
      - aspect: Ancillary meteorology and ozone
        before: NCEP meteorology; OMI, TOMS, TOVS and TOAST ozone
        after: "MERRA-2 (GEOS-IT for NRT processing)"
      - aspect: SST used in atmospheric correction
        before: NOAA OI SST V2
        after: "GHRSST L4 CMC SST (used since SST R2019)"
      - aspect: Chlorophyll algorithm
        before: Earlier OCx coefficients
        after: "O'Reilly & Werdell (2019) OCx coefficients"
      - aspect: Land/water mask and bathymetry
        before: Previous bathymetry and land-mask files
        after: Modified GEBCO_2020 grid (including water surface height of large lakes)
      - aspect: Inherent optical properties
        before: No Raman correction
        after: "Raman scattering correction of Rrs for IOP retrieval (Westberry et al., 2013)"
      - aspect: File names
        before: "A2020001.L3m_DAY_CHL_chlor_a_4km style"
        after: "AQUA_MODIS.20200101.L3m.DAY.CHL.chlor_a.4km.nc style (convention introduced in October 2019)"
    impacts:
      - Do not mix R2018.0 and R2022.0 values; download the whole period again from the R2022 series.
      - "Chlorophyll coefficients and ancillary data changed, so values differ for the same date. Check the version when comparing with earlier publications."
    sources:
      - name: OBPG — Reprocessing 2022.0 General Description
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/
      - name: OBPG — MODIS-Aqua R2022.0
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/aqua/
      - name: OBPG — MODIS-Terra R2022.0
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/terra
  - from: MODIS ocean color R2022.0
    to: MODIS ocean color R2022.0.1 to R2022.0.3 (mini-reprocessings)
    status: completed
    summary: >-
      Mini-reprocessings to fix calibration problems after the orbits began drifting. R2022.0.1 revised the temporal calibration of Aqua data since 2021-07-01; R2022.0.2 cross-calibrated Aqua to NOAA-20 VIIRS after the
      second yaw maneuver in August 2024 degraded quality, and cross-calibrated Terra to Aqua. On 2026-10-13 the latest Aqua standard files carry the attribute R2022.0.3.
    changes:
      - aspect: Aqua calibration (R2022.0.1)
        before: R2022.0 calibration
        after: "Revised temporal calibration for data since 2021-07-01 (orbit drift changed desert-site viewing geometry and the solar diffuser incidence angle)"
      - aspect: Aqua calibration (R2022.0.2)
        before: R2022.0.1
        after: "Cross-calibration with NOAA-20 VIIRS (LUT transition date 2022-01-01)"
      - aspect: Terra calibration
        before: R2022.0
        after: "Cross-calibrated to Aqua in R2022.0.1 and 0.2, for data since 2021-07-01"
      - aspect: Latest processing version
        before: R2022.0
        after: "Aqua standard R2022.0.3 (file attribute); NRT R2022.0.2 (June 2026 file attribute)"
    impacts:
      - "Values after July 2021 changed with each mini-reprocessing. Do not mix files downloaded at different times; check the processing_version attribute."
      - Even after these fixes, OBPG considers post-2022 Aqua ocean color hard to use for long-term change.
    sources:
      - name: OBPG — MODIS-Aqua R2022.0.1
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.1/aqua/
      - name: OBPG — MODIS-Aqua R2022.0.2
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.2/aqua/
      - name: OBPG — MODIS-Terra R2022.0.2
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.2/terra
  - from: MODIS Ocean (Aqua and Terra; ocean color R2022.0, SST R2019.0)
    to: VIIRS Ocean (Suomi NPP, NOAA-20, NOAA-21)
    to_id: viirs-ocean
    status: planned
    summary: >-
      NASA advises moving to comparable VIIRS products as Terra and Aqua end. OBPG produces VIIRS ocean color L3 with the same processing system (l2gen, OCI chlorophyll, GIOP)
      and reports that VIIRS (Suomi NPP and NOAA-20) and Aqua chlorophyll and Rrs agree within 10% over global deep water. VIIRS has fewer bands, though, so some products such as fluorescence and 4 µm SST have no VIIRS counterpart.
    changes:
      - aspect: Rrs wavelengths
        before: "Ten (412, 443, 469, 488, 531, 547, 555, 645, 667, 678 nm)"
        after: "Five (Suomi NPP 410, 443, 486, 551, 671; NOAA-20 and -21 411, 445, 489, 556, 667 nm)"
      - aspect: Fluorescence and instantaneous PAR
        before: "`nflh` and `ipar` (FLH files)"
        after: None (no FLH files in the L3 listings)
      - aspect: Sea surface temperature
        before: "11 µm daytime (SST) and nighttime (NSST), 4 µm SST4 (R2019.0)"
        after: "SST, NSST and triple-window SST3 `sst_triple` (Suomi NPP 2016.2, NOAA-20 2024.0); no OB.DAAC SST for NOAA-21"
      - aspect: Overpass time
        before: "Terra 10:30 (morning) and Aqua 13:30 (afternoon), both drifting"
        after: "All three in afternoon orbits (within about 50 minutes of each other); no VIIRS continues Terra's morning observations"
      - aspect: Period
        before: "Terra 2000-02~ / Aqua 2002-07~"
        after: "Suomi NPP 2012-01~ (data delivery ends 2026-11-02) / NOAA-20 2017-11~ / NOAA-21 2022-11~"
      - aspect: File name prefix
        before: "AQUA_MODIS, TERRA_MODIS"
        after: "SNPP_VIIRS, JPSS1_VIIRS (NOAA-20), JPSS2_VIIRS (NOAA-21)"
    impacts:
      - "Rrs wavelengths differ, so band values cannot be joined directly. OBPG reports, for example, that NOAA-20 Rrs(667) differs from Suomi NPP Rrs(671) by about 20% and from Aqua Rrs(667) by about 16%."
      - "MODIS `nflh` (fluorescence) and SST4 series do not continue in VIIRS. Look at PACE OCI for fluorescence."
      - Compare the two records over the overlap (2012 onward) before switching, and do not simply splice MODIS and VIIRS into one series.
    sources:
      - name: OBPG — VIIRS-NOAA20 R2022.0 (cross-sensor comparison)
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/noaa20
      - name: OBPG — VIIRS-SNPP R2022.0
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/snpp
      - name: Transition from MODIS to VIIRS (Earthdata, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

