notices:
  - date: "2026-10-22"
    level: warning
    title: Data Stores Service protection measures affecting data downloads and account access (CDS/ADS/EWDS/ECDS)
    body: >-
      ECMWF detected suspicious and abusive activity originating from certain public domains and is adding protections across the CDS, ADS, EWDS and ECDS.
      Users flagged as potentially non-compliant may have their access temporarily suspended while it is reviewed, and repeated invalid requests may result in the account being disabled.
      Users are asked to submit requests sequentially rather than in parallel or in large batches, to submit only valid requests, to keep profile information accurate and to register with an institutional email address where possible.
    source: https://forum.ecmwf.int/t/data-stores-service-protection-measures-affecting-data-downloads-and-account-access-cds-ads-ewds-ecds/15481
  - date: "2026-10-05"
    level: info
    title: Upcoming CDS Terms of use change (effective 2026-10-28)
    body: >-
      Article 1 (products and services) of the CDS Terms of use changes on 28 October 2026. Continued use of the CDS after that date will be considered acceptance of the updated terms.
      Users who do not accept should contact ECMWF Support by 27 October; their access to Copernicus Products will then end.
    source: https://forum.ecmwf.int/t/upcoming-cds-terms-of-use-change/15374
  - date: "2025-09-25"
    level: warning
    title: ERA5-Land data pre-1978 derived from the deprecated ERA5.P
    body: >-
      ECMWF confirmed that ERA5-Land before 1979 was based on the preliminary ERA5 back-extension (ERA5.P) and was not rerun.
      Warm/dry anomalies absent from the final ERA5 have been reported in central Africa and South America in some years (e.g. 1951, 1961, 1965),
      and the C3S Interactive Climate Atlas has removed ERA5-Land trends before 1978. No recalculation has been announced.
    source: https://forum.ecmwf.int/t/era5-land-data-pre-1978-seems-to-be-derived-from-long-deprecated-and-removed-era5-p-data/14180
  - date: "2025-07-02"
    level: info
    title: CC-BY licence replaces the Licence to use Copernicus Products
    body: The former "Licence to use Copernicus Products" has been replaced by CC BY 4.0. Attribution is still required.
    source: https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464
  - date: "2025-01-09"
    level: warning
    title: ERA5 data from 1–6 January 2025 degraded (resolved)
    body: >-
      A technical problem in ERA5T production also affected the ERA5-Land-T hourly data and daily statistics. All degraded data were replaced by 2025-01-14;
      if you downloaded data for 1–6 January 2025 before then, download it again. Monthly data were not affected.
    source: https://forum.ecmwf.int/t/era5-data-from-1st-january-2025-was-degraded-and-is-being-corrected/10689
  - date: "2024-09-26"
    level: critical
    title: Goodbye legacy Climate Data Store, hello new CDS — new account and API key required
    body: >-
      The legacy CDS has been decommissioned and replaced by the new CDS. API requests with old credentials all fail.
      Create a new ECMWF account, run pip install --upgrade cdsapi, and update the url and key in .cdsapirc.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380
  - date: "2024-04-02"
    level: critical
    title: Issue affecting ERA5-Land monthly averaged reanalysis for September 2022 to February 2024 — not replaced
    body: >-
      All accumulated variables (precipitation, evaporation, runoff, radiation, heat fluxes, etc.) in the monthly averaged reanalysis are wrong for September 2022 to February 2024.
      Data from March 2024 onward have been corrected, but the incorrect data will not be replaced on CDS discs nor MARS tapes.
      ECMWF recommends using the 00:00 value of the monthly averaged reanalysis by hour of day instead.
    source: https://forum.ecmwf.int/t/issue-affecting-era5-land-monthly-averaged-reanalysis-for-the-period-september-2022-to-february-2024/2370

