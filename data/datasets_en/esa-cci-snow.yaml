      and MODIS SCFG v4.0 at esacci.SNOW.day.L3C.SCFG.MODIS.Terra.MODIS_TERRA.4-0.r1. A single MODIS day is 36000 × 18000, so always subset by region.
  - name: ESA CCI Open Data Portal
    url: https://climate.esa.int/en/odp/#/dashboard
    method: Web search and download (links to the CEDA data)
  - name: GlobSnow v3.0 (predecessor SWE record)
    url: https://www.globsnow.info/
    method: HTTP download (daily at https://www.globsnow.info/swe/archive_v3.0/ ) / PANGAEA (monthly, doi:10.1594/PANGAEA.911944)
    note: The GlobSnow-2 project has ended and its products remain archived on the website. When checked on 2026-10-13, the globsnow.info data folder did not respond.

example:
  lang: python
  note: >-
    Opens the aggregated SWE v4.0 address on the CCI THREDDS server via OPeNDAP and reads only the West Siberian Plain (60–80°E, 55–65°N) for winter 2020 (no account needed). Because of the mountain mask,
    mountainous areas have almost no values, so a lowland region is used. Negative mask codes are set to missing before computing, and the latitude order is checked because it may be descending.
  code: |
    import xarray as xr

    url = ("https://data.cci.ceda.ac.uk/thredds/dodsC/"
           "esacci.SNOW.day.L3C.SWE.multi-sensor.multi-platform.MERGED.4-0.r1")
    ds = xr.open_dataset(url)

    lat_slice = slice(65, 55) if ds.lat[0] > ds.lat[-1] else slice(55, 65)
    swe = ds["swe"].sel(time=slice("2020-01-01", "2020-03-31"),
                        lat=lat_slice, lon=slice(60, 80))
    swe = swe.where(swe >= 0)          # -1 no retrieval, -10 water, -20 mountain, -30 glacier -> NaN
    print(swe.mean(["lat", "lon"]).values)   # mm, daily area mean

    # In MODIS snow cover daily files only 0-100 are valid values.
    # scf = xr.open_dataset("20200115-ESACCI-L3C_SNOW-SCFG-MODIS_TERRA-fv4.0.nc")["scfg"]
    # scf = scf.where(scf <= 100)      # drops 205 cloud, 210 water, 215 permanent snow, etc.

tips:
  - "Values such as 205 (cloud), 206 (polar night), 210 (water), 215 (permanent snow and ice) and 254 (no acquisition) in snow cover files are status codes, not percentages. Keep only 0–100, or averages will be grossly inflated."
  - "Negative SWE values (-1, -10, -20, -30) are mask codes. In particular, -20 (mountain) removes every grid cell with large sub-grid elevation variability, so mountainous regions (including the Korean Peninsula) can be largely missing. Do not use this record for mountain snow."
  - "SWE is reliable only for dry snow up to about 1 m depth. It can underestimate during spring melt (wet snow) and for very deep snow."
  - "SWE is available only every second day in 1979–1987 and daily from October 1987. Daily statistics spanning this boundary have different sample counts."
  - "SCFV (viewable snow) and SCFG (snow on ground) differ only in forests. Use SCFG to compare with ground snow cover in models, and SCFV for satellite reflectance or albedo studies."
  - "Some MODIS v4.0 files were replaced or removed on 2025-12-12 and 2026-02-12. If you downloaded MODIS files before December 2025, download the affected dates again (see notices)."
  - "The AVHRR record joins many NOAA and MetOp satellites with different overpass times. CEDA files are split by satellite, so the same day can have several files."
  - "GlobSnow v3.0, CCI v3.1 and CCI v4.0 all use 'the same method' but give different values. State the exact version and DOI in your paper."

