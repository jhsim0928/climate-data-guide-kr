# ─────────────────────────────────────────────────────────────
# ESA CCI Snow — dataset information file (English edition)
# Land tab (snow). ESA Snow_cci snow water equivalent (SWE v4.0) and snow cover fraction (SCFG/SCFV — MODIS and AVHRR v4.0, ATSR-2 v1.0),
# together with its predecessor ESA GlobSnow (SWE v3.0, SE v2.0), on one page.
# After editing, update last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: esa-cci-snow
name: "ESA CCI Snow"
full_name: ESA Snow Climate Change Initiative (Snow_cci) — Snow Water Equivalent (SWE) and Snow Cover Fraction (SCF) climate data records (including the predecessor ESA GlobSnow)
category: satellite
domain: land
group: 적설
order: 20
domains: [육지, 수문, 원격탐사]
provider: European Space Agency (ESA) Climate Change Initiative (CCI) Snow project — led by ENVEO (Austria); SWE produced by the Finnish Meteorological Institute (FMI) with Environment and Climate Change Canada (ECCC), AVHRR snow cover by the University of Bern / distributed by CEDA (UK)

status: active
status_note: >-
  The project continues in CCI+ Phase 2. Its fourth Climate Research Data Package (CRDP v4) was archived at CEDA in the second half of 2025 — SWE and AVHRR snow cover v4.0 on 2025-09-04,
  MODIS snow cover v4.0 on 2025-12-03, all running to December 2023. CCI products are research climate data records released as versions, so there are no routine updates (CEDA: "Not Planned").
  From 2023 onward, snow cover is to be continued with Sentinel-3 SLSTR by the Copernicus Climate Change Service (C3S) for Cryosphere, with Climate Data Store publication in preparation.
  Terra, which carries the MODIS instrument used here, is expected to end operations in late 2026 or early 2027, so the MODIS record is unlikely to be extended much further.

transitions:
  - from: ESA GlobSnow SWE v3.0
    to: ESA CCI Snow SWE v4.0
    status: completed
    summary: >-
      The Northern Hemisphere snow water equivalent (SWE) record that FMI built in the ESA GlobSnow project continued in ESA CCI Snow. It keeps the GlobSnow approach — Bayesian assimilation of
      passive microwave radiometer data and ground-based snow depth observations — but the grid, period and algorithm details have changed, so do not splice the two into one time series.
    changes:
      - aspect: Project and archive
        before: "ESA DUE GlobSnow (FMI) — globsnow.info (daily), PANGAEA (monthly)"
        after: "ESA CCI Snow_cci (SWE produced by FMI with ECCC) — CEDA"
      - aspect: Period
        before: "1979–2018 (Luojus et al. 2021); the PANGAEA monthly record covers 1980–2018"
        after: "1979-01 to 2023-12 (v3.1 ran to 2022-05; v4.0 extends to 2023-12)"
      - aspect: Grid
        before: "EASE-Grid 25 km × 25 km (Northern Hemisphere azimuthal equal-area projection)"
        after: "0.1° × 0.1° latitude–longitude grid (resampled from the 12.5 km EASE-Grid 2.0 processing grid, 3600 × 1800)"
      - aspect: Time steps provided
        before: "Daily (Level A) + monthly mean (Level B) + bias-corrected monthly"
        after: "Daily only (every second day in 1979–1987)"
      - aspect: Snow density
        before: "Up to CCI v2.0 and v3.0, density variation was applied during post-processing"
        after: "From CCI v3.1, snow density varies in space and time inside the retrieval itself"
      - aspect: CCI v3.1 → v4.0 (2025-09)
        before: "v3.1: 1979-01 to 2022-05, earlier overpass handling"
        after: "v4.0: extended to 2023-12, morning overpasses prioritised over evening ones, updated post-processing snow mask and North American uncertainty model (validation results similar to the previous version)"
      - aspect: File format and naming
        before: "GlobSnow NetCDF (CF)"
        after: "YYYYMMDD-ESACCI-L3C_SNOW-SWE-<sensor>_<platform>-fv4.0.nc (e.g. 19910501-ESACCI-L3C_SNOW-SWE-SSMI_DMSP-fv4.0.nc)"
    impacts:
      - Do not mix GlobSnow v3.0 and CCI SWE in one time series. Grids and algorithms differ, so values differ even on the same day.
      - The GlobSnow "bias-corrected monthly" product is a separate product corrected with snow course data for the underestimation of deep snow. Do not compare it directly with monthly means of CCI daily data.
      - Like GlobSnow, CCI SWE excludes mountains, Greenland and glaciers. It cannot be used for mountain snow studies.
    sources:
      - name: CEDA — Snow_cci SWE v4.0 (1979–2023)
        url: https://catalogue.ceda.ac.uk/uuid/edf8abd23f4a40aabd4d52e48dec06ea/
      - name: CEDA — Snow_cci SWE v3.1 (1979–2022)
        url: https://catalogue.ceda.ac.uk/uuid/9d9bfc488ec54b1297eca2c9662f9c81/
      - name: Luojus et al. (2021) GlobSnow v3.0, Scientific Data
        url: https://doi.org/10.1038/s41597-021-00939-2
      - name: Snow_cci Product User Guide v5.1 (2025-12)
        url: https://climate.esa.int/documents/3136/Snow_cci_D4.3_PUG_v5.1.pdf
  - from: ESA GlobSnow Snow Extent v2.0
    to: ESA CCI Snow snow cover fraction (SCFG, SCFV)
    status: completed
    date: "2021-05"
    summary: >-
      Building on the method behind GlobSnow's optical Snow Extent (SE; ATSR-2 and AATSR, 1995–2012; Metsämäki et al. 2015), CCI Snow produced global daily snow cover fraction from
      MODIS (2000 onward), AVHRR (1979 onward) and ATSR-2 (first release v1.0 on 2021-05-10). With v4.0 in 2025, both the MODIS and AVHRR records run to December 2023.
    changes:
      - aspect: Coverage
        before: "Northern Hemisphere (GlobSnow SE v2.0)"
        after: "Global land (excluding Antarctica, the Greenland ice sheet and permanent snow and ice; coastal Greenland included)"
      - aspect: Sensors and period
        before: "ERS-2 ATSR-2 and Envisat AATSR, 1995–2012"
        after: "Terra MODIS 2000-02-24 to 2023-12-31 (v4.0), NOAA/MetOp AVHRR 1979-01-01 to 2023-12-31 (v4.0), ATSR-2 1995-08-01 to 2003-06-22 (v1.0)"
      - aspect: Retrieved variables
        before: "Snow extent (SE)"
        after: "Separate viewable snow on canopy (SCFV) and snow on ground corrected for forest canopy (SCFG), each with per-pixel uncertainty (unbiased RMSE)"
      - aspect: MODIS v3.0 → v4.0 (2025-12)
        before: "v3.0: 2000-02-24 to 2022-12-31"
        after: "More permissive pre-classification, correction for low solar illumination, updated snow-free ground and forest reflectance layers, updated uncertainty, improved daily global merging, updated salt lake mask, extended to 2023-12"
    impacts:
      - "SCFV and SCFG differ only in forests and are identical elsewhere. For forested regions, always state which one you used."
      - MODIS (1 km) and AVHRR (5 km) differ in resolution and sensor, so values differ even on the same day. Pick one to suit the purpose, e.g. AVHRR for long-term trends and MODIS for regional detail.
      - Earlier versions (MODIS v1.0–v3.0, AVHRR v1.0 and v2.0) are marked "superseded" at CEDA. Download the whole period again in v4.0.
    sources:
      - name: CEDA — MODIS SCFG v4.0 (list of improvements)
        url: https://catalogue.ceda.ac.uk/uuid/375ffdb8f0a445e380b4b9548655f5f9/
      - name: CEDA — MODIS SCFG v1.0 (2000–2019, superseded)
        url: https://catalogue.ceda.ac.uk/uuid/3b3fd2daf3d34c1bb4a09efeaf3b8ea9/
      - name: Metsämäki et al. (2015) GlobSnow Snow Extent, Remote Sensing of Environment
        url: https://doi.org/10.1016/j.rse.2014.09.018
      - name: GlobSnow website (SE v2.0, SWE v2.0/v3.0)
        url: https://www.globsnow.info/

period:
  start: "1979-01"
  end: "2023-12"
  note: >-
    Periods differ by product. SWE v4.0 covers 1979-01-02 to 2023-12-31 (CEDA record; the PUG gives a 6 January 1979 start), every second day until May 1987 and daily from October 1987,
    with values only in the Northern Hemisphere winter season (roughly November–May). Snow cover fraction: AVHRR v4.0 1979-01-01 to 2023-12-31 (gaps concentrated in 1979–1986, about 99% coverage overall),
    MODIS v4.0 2000-02-24 to 2023-12-31, ATSR-2 v1.0 1995-08-01 to 2003-06-22. Sentinel-3 SLSTR v1.0 (2020–2022) is listed on the ESA project page, but its CEDA records were still
    unpublished (preview only) when checked on 2026-10-13. The predecessor GlobSnow SWE v3.0 covers 1979–2018.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    Snow cover fraction: MODIS, ATSR-2 and SLSTR on a 0.01° × 0.01° latitude–longitude grid (WGS 84, pixel-centre coordinates; MODIS files are 36000 × 18000); AVHRR on a 0.05° × 0.05° grid (about 5 km) —
    global land excluding Antarctica and the Greenland ice sheet. Snow water equivalent: 0.10° × 0.10° latitude–longitude grid (3600 × 1800), resampled from processing on the 12.5 km EASE-Grid 2.0,
    with values only over Northern Hemisphere land outside mountains, glaciers and Greenland. GlobSnow SWE v3.0 uses the 25 km EASE-Grid (Northern Hemisphere azimuthal equal-area projection).
  vertical: Not applicable (two-dimensional surface fields)
  temporal: Daily (SWE every second day in 1979–1987, Northern Hemisphere winter only) / GlobSnow v3.0 daily, monthly and bias-corrected monthly

update: >-
  No routine updates — a new version of the climate data records is released in each project phase (CEDA update frequency "Not Planned"). The latest is CRDP v4 (SWE and AVHRR 2025-09-04, MODIS 2025-12-03).
  Snow cover after 2023 is to continue as SLSTR-based data from the C3S Cryosphere service.
license: >-
  ESA CCI Snow Terms and Conditions — free for any user and any purpose (CEDA "Any"). Publications must acknowledge "the ESA Climate Change Initiative and the Snow CCI project" together with
  the individual data providers and cite the dataset DOIs. The GlobSnow v3.0 monthly data on PANGAEA are CC BY 4.0
account_required: false

summary: >-
  A set of research climate data records produced by the snow project (Snow_cci) of ESA's Climate Change Initiative. Snow water equivalent (SWE) is a daily 0.1° Northern Hemisphere record (1979–2023)
  that combines SMMR, SSM/I and SSMIS passive microwave observations with snow depth from synoptic weather stations through Bayesian assimilation. Snow cover fraction (SCF) is a global daily record
  from optical MODIS (1 km, 2000–2023) and AVHRR (5 km, 1979–2023) data, with separate layers for snow visible from above, including on the forest canopy (SCFV), and snow on the ground beneath it (SCFG).
  Both build on the methods of ESA GlobSnow (SWE v3.0, Snow Extent v2.0) and carry per-pixel uncertainty estimates.

time_convention:
  summary: >-
    Every file is a daily product named by date (YYYYMMDD), built from that day's satellite observations by selecting one observation per pixel (not an average). Snow cover fraction comes from
    Terra MODIS (an orbit designed for a 10:30 local equator crossing) or the individual AVHRR satellites, and the per-pixel acquisition time is stored in `scanline_time`. From v4.0, SWE prioritises
    morning overpasses, and in 1979–1987 it is available only every second day.
  points:
    - "MODIS snow cover files merge several swaths into one daily map depending on solar and viewing zenith angle. The viewing zenith angle (`satzen`) and scanline time (`scanline_time`, 0.00–23.59 h) of the selected observation are included. The PUG does not say whether this time is UTC or local, so check the attributes of the files you download."
    - "MODIS snow cover uses Terra only; Aqua was not used to fill gaps. Cloud (205) and polar night (206) pixels are left empty, and no temporal interpolation is applied."
    - "AVHRR files at CEDA are daily files per satellite (file names contain AVHRR_NOAA18, AVHRR_METOPB, etc.). A separate gap-filled daily composite that combines morning and afternoon satellites and neighbouring days is on Zenodo (doi:10.5281/zenodo.16746237, GeoTIFF)."
    - "SWE is retrieved only in the Northern Hemisphere winter season (roughly November–May) and is valid only for dry snow. Wet snow makes retrieval impossible, and the signal saturates above about 1 m of snow depth (PUG)."
    - "GlobSnow v3.0 monthly data (Level B) are the mean of the month's daily estimates; the bias-corrected monthly product adds a time-invariant correction to them."
  source: https://climate.esa.int/documents/3136/Snow_cci_D4.3_PUG_v5.1.pdf
  source_name: Snow_cci Product User Guide v5.1 (2025-12) + CEDA catalogue records + Luojus et al. (2021)

variables:
  note: >-
    Names checked against the CEDA catalogue records and the CCI THREDDS (OPeNDAP) variable listings. The PUG text writes the SWE variables in capitals (`SWE`, `SWE_STD`) and in one place calls the
    uncertainty `SWE_VAR`, but the actual v4.0 files use lower-case `swe` and `swe_std`. Snow cover values outside 0–100 are status codes, so always filter them out before computing.
  full_list: https://climate.esa.int/documents/3136/Snow_cci_D4.3_PUG_v5.1.pdf
  groups:
    - name: Snow water equivalent (SWE v4.0, Northern Hemisphere 0.1°)
      kind: instant
      period: Day
      items:
        - text: "Snow water equivalent — `swe` (mm)"
          note: "Estimated from that day's overpasses (v4.0 prioritises morning). 0 = snow free, 1–500 mm. Negative values are mask codes (-1 no retrieval, -10 water, -20 mountain, -30 glacier/permanent ice)"
        - text: "Standard deviation of the SWE estimate — `swe_std` (mm)"
          note: "1–250 mm; negative codes as in `swe`"
    - name: Snow cover fraction (SCFG, SCFV — MODIS and AVHRR v4.0, ATSR-2 v1.0)
      kind: instant
      period: Day
      items:
        - text: "Snow cover fraction on ground (corrected for forest canopy) — `scfg` (%)"
          note: "Value of the observation selected for that day. 0 snow free, 1–100 %, 205 cloud, 206 polar night, 210 water, 213 salt lake (MODIS), 215 permanent snow and ice, 252 classification failed, 253 input data error, 254 no satellite acquisition, 255 not valid"
        - text: "Snow cover fraction viewable (including snow on canopy) — `scfv` (%)"
          note: Identical to `scfg` outside forests; same status codes
        - "Snow cover fraction uncertainty (unbiased RMSE) — `scfg_unc`, `scfv_unc` (%)"
        - text: "Sensor zenith angle — `satzen` (degrees)"
          note: "MODIS and AVHRR v4.0. MODIS uses scale_factor 0.01; angles above 65° are flagged as classification failed"
        - text: "Scanline acquisition time — `scanline_time` (hours, 0.00–23.59)"
          note: "MODIS and AVHRR v4.0. MODIS uses scale_factor 0.001"

