notices:
  - date: "2026-02-12"
    level: info
    title: MODIS snow cover v4.0 — erroneous file removed and another file replaced
    body: >-
      During the 2025-12-12 update an SCFG file (20130603-ESACCI-L3C_SNOW-SCFG-MODIS_TERRA-fv4.0.nc) was wrongly added to the SCFV folder and has been removed;
      the SCFG file for the same date was replaced on 2026-02-12. If you downloaded these files between December 2025 and February 2026, download them again.
    source: https://catalogue.ceda.ac.uk/uuid/bc13bb02a958449aac139853c4638f32/
  - date: "2025-12-12"
    level: info
    title: MODIS snow cover v4.0 — files missing metadata and variables replaced
    body: >-
      A small number of files were found to be missing some metadata and variables and were replaced — SCFV 2002-02-04, 2006-02-06, 2022-02-08 and 2023-02-09, and SCFG 2012-06-01.
    source: https://catalogue.ceda.ac.uk/uuid/bc13bb02a958449aac139853c4638f32/
  - date: "2025-12-03"
    level: info
    title: MODIS snow cover fraction SCFG and SCFV v4.0 released (2000–2023) — supersedes v3.0
    body: >-
      The Terra MODIS global daily snow cover fraction v4.0 was released, extended to 2023-12-31, and v3.0 was marked "superseded".
      Changes include a more permissive pre-classification, a low-illumination correction, updated reflectance layers, uncertainty and salt lake mask, and improved daily merging.
    source: https://catalogue.ceda.ac.uk/uuid/375ffdb8f0a445e380b4b9548655f5f9/
  - date: "2025-10-13"
    level: info
    title: AVHRR snow cover fraction v4.0 — corrupted file replaced, missing file added
    body: >-
      On 2025-09-08 the SCFG file 20170720-ESACCI-L3C_SNOW-SCFG-AVHRR_METOPB-fv4.0.nc was found to be corrupted and was replaced the same day;
      on 2025-10-13 the SCFV file 20071108-ESACCI-L3C_SNOW-SCFV-AVHRR_NOAA18-fv4.0.nc, accidentally left out of the original archiving, was added.
    source: https://catalogue.ceda.ac.uk/uuid/3c71c04cf08a410fac2c680cbf88cfd7/
  - date: "2025-09-04"
    level: info
    title: SWE v4.0 and AVHRR snow cover fraction v4.0 released (1979–2023)
    body: >-
      Snow water equivalent v4.0 was released, extended by one year to 2023-12 and now prioritising morning overpasses.
      AVHRR-based SCFG and SCFV v4.0 were released the same day for 1979-01 to 2023-12 (the previous AVHRR v2.0 covered 1982–2018).
    source: https://catalogue.ceda.ac.uk/uuid/edf8abd23f4a40aabd4d52e48dec06ea/
  - date: "2025-05-02"
    level: info
    title: Terra and Aqua expected to end operations in late 2026 to early 2027 — MODIS-based record cannot be extended
    body: >-
      NASA announced that the Terra and Aqua platforms carrying MODIS are expected to shut down in late 2026 or early 2027 and are drifting out of their designed orbits, which affects equator crossing times and may affect data quality.
      The CCI Snow MODIS snow cover uses Terra only, so it is unlikely to continue; the project documents state that snow cover from 2023 onward continues with Sentinel-3 SLSTR within C3S.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

