# ─────────────────────────────────────────────────────────────
# Berkeley Earth — dataset information file
# Listed under the atmosphere tab (temperature data). Combines land station data with a reinterpolation of HadSST4 over the ocean.
# The transition from the old 1° product to the high-resolution (0.25°) product is in this file's transitions.
# After editing, update last_verified to the date checked on the official page.
# ─────────────────────────────────────────────────────────────
id: berkeley-earth
name: Berkeley Earth
full_name: Berkeley Earth Land/Ocean Surface Temperature
category: analysis
domain: atmosphere
group: 기온 자료
order: 30
domains: [대기, 해양]
provider: Berkeley Earth (independent U.S. non-profit research organization)

status: active
status_note: >-
  Since Q2 2025 the 0.25° high-resolution product (Berkeley Earth Surface Temperature – High-Resolution, BEST-HR) has been the operational record and is updated monthly;
  the long-standing 1° products (Land_and_Ocean_*, Complete_* and the daily land files) are no longer updated. The high-resolution product is still labelled
  "PRELIMINARY DATA", and its description paper has been in open review at ESSD since September 2026.

period:
  start: "1850-01"
  end: present
  note: >-
    Global land + ocean TAVG starts in 1850, land-only TAVG in 1750, and high-resolution land TMAX and TMIN in 1850.
    When checked on 2026-10-12, the headers of the high-resolution global monthly files gave analysis run dates of 2026-09-11 (land) and 2026-08-13 (ocean); the last row
    (latest month) was not checked directly. The old 1° product was last run on 2025-01-04 and has not been updated since.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1개월"
  spatial: >-
    High-resolution (current) product: 0.25° × 0.25° latitude–longitude grid (full-resolution files on request or from the Zenodo archive); 1° × 1° and 5° × 5°
    latitude–longitude grids available for direct download. Old product (no longer updated): 1° × 1° latitude–longitude grid and Equal Area grid
  vertical: Single surface level (land surface air temperature blended with sea surface temperature over the ocean)
  temporal: Monthly mean anomalies (the old product also has experimental daily land TAVG, TMAX and TMIN from 1880, no longer updated)

update: Monthly (high-resolution product). The old 1° product has not been updated since Q2 2025
license: Creative Commons BY-NC 4.0 International (non-commercial use only) — contact Berkeley Earth for commercial licensing; attribution required
account_required: false

summary: >-
  A global surface temperature record from Berkeley Earth, an independent U.S. non-profit, combining air temperatures from about 58,000 land stations with HadSST4 sea surface
  temperatures from 1850 onward. Its hallmarks are a statistical homogenization that splits station records at discontinuities ("scalpel") and Kriging interpolation; the land
  record extends back to 1750. Since 2025 the flagship product is the 0.25° high-resolution record built with regression Kriging on physically informed predictors, with anomalies
  relative to 1951–1980. The gridded files include a monthly climatology, so absolute temperatures can be reconstructed.

time_convention:
  summary: >-
    All gridded values and time series are monthly mean temperature anomalies (°C) relative to the January 1951 – December 1980 average. Times in the high-resolution gridded
    files are decimal years, "each value corresponding to the midpoint of the respective month" (e.g. 1981.125 = February 1981).
  points:
    - "`climatology` in the gridded files is the estimated true surface temperature (°C) for each calendar month over 1951–1980 (12 values). Add the climatology for the same month to the `temperature` anomaly to get absolute temperature."
    - "In the high-resolution grids, a value is reported as NaN where observations provide less than a 20% constraint on the anomaly."
    - "The 'annual' column in the global text files is a 12-month moving average centred on that month (e.g. the January–December 1950 mean appears in the June 1950 row). The five-, ten- and twenty-year columns are also centred moving averages."
    - "Where sea ice is present, anomalies are extrapolated from land air temperatures; where it is absent, from ocean temperatures (sea ice extent from HadISST v2). The old product also offered an 'Alternate' version that extrapolates from water temperatures under sea ice."
    - "The data are preliminary, so past values may change without notice at each monthly update."
  source: https://berkeley-earth-temperature-hr.s3.amazonaws.com/Gridded/High-Res_Gridded_README.txt
  source_name: Berkeley Earth High-Resolution Gridded README / Global_TAVG_monthly.txt header

variables:
  note: >-
    Variable names from the high-resolution gridded NetCDF files (per the README). Variable names in the old 1° product files were not checked directly this time.
  full_list: https://berkeleyearth.org/data/
  groups:
    - name: High-resolution grids (NetCDF, 0.25°, 1°, 5°)
      kind: mean
      period: Monthly
      items:
        - "Surface air temperature anomaly — `temperature` (°C, relative to 1951–1980)"
        - text: "Monthly climatology (absolute temperature) — `climatology` (°C)"
          kind: mean
          period: Monthly
          note: Mean of each calendar month over 1951–1980; 12 values (January–December), not tied to a specific year
        - text: "Land fraction — `land_mask` (0–1)"
          kind: static
    - name: Summary time series (text)
      kind: mean
      period: Monthly
      items:
        - "Global land + ocean TAVG anomaly with 95% uncertainty — Global_TAVG_monthly.txt (°C)"
        - "Land TAVG, TMAX and TMIN anomalies — Land_TAVG/TMAX/TMIN_monthly.txt (°C)"
        - "50-member ensemble time series — *_ensemble.txt (°C)"
        - text: "Annual mean anomaly — *_annual.txt (°C)"
          kind: mean
          period: Annual
    - name: Old product daily land data (experimental, no longer updated)
      kind: mean
      period: Daily
      items:
        - "Daily mean temperature anomaly — Complete_TAVG_Daily_* (°C)"
        - text: "Daily maximum temperature anomaly — Complete_TMAX_Daily_* (°C)"
          kind: max
          period: Daily
        - text: "Daily minimum temperature anomaly — Complete_TMIN_Daily_* (°C)"
          kind: min
          period: Daily

access:
  - name: Berkeley Earth data page
    url: https://berkeleyearth.org/data/
    login: false
    method: HTTPS (web / wget / curl)
    note: >-
      Lists the high-resolution global and land time series and 1° and 5° gridded files (storage.googleapis.com/berkeley-earth-temperature-hr/), the old 1° products
      (no longer updated) and station data. The full 0.25° grids and high-resolution country and city series are provided through a request form.
  - name: High-resolution 1° grid (global TAVG)
    url: https://storage.googleapis.com/berkeley-earth-temperature-hr/global/gridded/Global_TAVG_Gridded_1deg.nc
    login: false
    method: HTTPS (about 400 MB)
    note: The 5° grid is Global_TAVG_Gridded_5deg.nc (about 8 MB) in the same folder.
  - name: Zenodo archive (April 2026 release, includes 0.25°)
    url: https://doi.org/10.5281/zenodo.20428381
    login: false
    method: HTTPS (about 55 GB, 21 files)
    note: >-
      Contains monthly, annual and ensemble time series for global TAVG and land TAVG/TMAX/TMIN, 1° ensemble NetCDF files and 0.25° gridded NetCDF files.
      As a frozen release it suits reproducible publications; get the latest months from the data page files.
  - name: Old 1° product (no longer updated, January 2025 run)
    url: https://berkeley-earth-temperature.s3.us-west-1.amazonaws.com/Global/Gridded/Land_and_Ocean_LatLong1.nc
    login: false
    method: HTTPS (about 400 MB)
    note: The Equal Area version (Land_and_Ocean_EqualArea.nc), the Alternate version (water temperatures under sea ice), land Complete_TAVG/TMAX/TMIN and the daily land files are in the same location.

example:
  lang: python
  note: Downloads the high-resolution 5° grid, reconstructs absolute temperature from anomaly plus climatology, and computes the area-weighted global mean anomaly.
  code: |
    import urllib.request
    import numpy as np
    import xarray as xr

    url = ("https://storage.googleapis.com/berkeley-earth-temperature-hr/"
           "global/gridded/Global_TAVG_Gridded_5deg.nc")
    urllib.request.urlretrieve(url, "be_5deg.nc")
    ds = xr.open_dataset("be_5deg.nc")
    print(ds)                                  # check dimension and coordinate names

    anom = ds["temperature"]                   # °C, anomaly relative to 1951–1980
    tdim = ds["time"].dims[0]
    ydim, xdim = ds["latitude"].dims[0], ds["longitude"].dims[0]
    t = ds["time"].values                      # decimal year, mid-month (e.g. 1981.125)
    month = np.floor((t % 1) * 12).astype(int) # 0 = January … 11 = December

    # Area-weighted global mean anomaly
    w = np.cos(np.deg2rad(ds["latitude"]))
    glob = anom.weighted(w).mean([ydim, xdim])
    print(glob.isel({tdim: slice(-12, None)}).values.round(2))

    # Absolute temperature = anomaly + climatology for the same month (last month shown)
    clim = ds["climatology"]
    mdim = [d for d in clim.dims if d not in (ydim, xdim)][0]
    absolute_last = anom.isel({tdim: -1}) + clim.isel({mdim: month[-1]})

tips:
  - The old 1° products (Land_and_Ocean_complete.txt, Land_and_Ocean_LatLong1.nc, etc.) have not been updated since Q2 2025. If your scripts still point to them, switch to the high-resolution files. The two products use different methods, so do not splice them into one series.
  - The high-resolution product is labelled "PRELIMINARY DATA - SUBJECT TO CHANGE WITHOUT NOTICE - NOT YET PEER REVIEWED". In papers, record the download date or use the frozen Zenodo release (DOI).
  - The CC BY-NC 4.0 licence means commercial use, including paid services and products, needs permission from Berkeley Earth.
  - The ocean component is a reinterpolation of HadSST4, the same ocean input as HadCRUT5, so agreement between the two is not an independent confirmation.
  - Anomalies are relative to 1951–1980 (as in GISTEMP), whereas HadCRUT5 uses 1961–1990. Align the baselines before comparing.
  - The high-resolution gridded files carry no uncertainty information. Use the 95% ranges in the text time series or the 50-member ensemble files instead.
  - A 0.25° grid can be finer than the station network. In data-sparse regions and early decades, small-scale structure may come from the statistical predictors rather than observations, so interpret it with care.

transitions:
  - from: Berkeley Earth Land/Ocean
    to: Berkeley Earth BEST-HR
    status: completed
    date: "2025 Q2"
    summary: >-
      From Q2 2025 the 0.25° high-resolution product became the operational record and the 1° time series and gridded products stopped updating. The description paper
      (in review at ESSD) presents it as version 2 of the Berkeley Earth surface temperature record.
    changes:
      - aspect: Horizontal resolution
        before: "1° × 1° latitude–longitude grid and Equal Area grid"
        after: "0.25° × 0.25° (public files at 1° and 5°; 0.25° on request or from Zenodo)"
      - aspect: Interpolation method
        before: "Kriging"
        after: "Regression Kriging with physically informed predictors; improved coastal blending"
      - aspect: Ocean input
        before: "Reinterpolated HadSST4 (HadSST3 at the time of the original paper)"
        after: "HadSST4, with spatial detail improved using ORAS5 ocean reanalysis predictors"
      - aspect: Treatment under sea ice
        before: "Two versions — extrapolation from land air temperatures (default) or from water temperatures (Alternate)"
        after: "Single approach: extrapolation from land air temperatures where ice is present"
      - aspect: Uncertainty
        before: "95% uncertainty in the time series files"
        after: "50-member ensemble added (time series and 1° grids)"
      - aspect: Updates and status
        before: "Last run January 2025, no longer updated / peer reviewed in ESSD (2020)"
        after: "Updated monthly / preliminary data; description paper in review at ESSD (since September 2026)"
      - aspect: Daily data
        before: "Experimental daily land TAVG, TMAX and TMIN (from 1880)"
        after: "No daily data in the high-resolution product (monthly only)"
    impacts:
      - Do not splice values from the two products into one series; recompute the full period with a single product.
      - File names, URLs and variable layout have changed, so automated download scripts need updating.
      - Daily data exist only in the discontinued old product, so recent periods require another dataset.
    sources:
      - name: Berkeley Earth data page
        url: https://berkeleyearth.org/data/
      - name: Rohde et al. (2026, in review at ESSD) BEST-HR paper
        url: https://doi.org/10.5194/essd-2026-412

