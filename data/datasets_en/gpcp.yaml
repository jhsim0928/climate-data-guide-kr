notices:
  - date: "2026-10-02"
    level: warning
    title: "NCEI Data Access Delays (cloud migration, planned through 2026-10-30)"
    body: >-
      NCEI is moving its data and applications to the cloud, which may cause temporary data access delays and intermittent degraded
      order fulfillment services. If an NCEI route fails, use the AWS or Google Cloud copies or GES DISC.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2026-05-01"
    level: info
    title: V3.3 extended through December 2025 — October–December 2025 Daily based on IMERG Late
    body: >-
      The 2025 V3.3 Monthly and Daily data were added at GES DISC. According to the Daily ATBD, October–December 2025 was computed
      with IMERG V07 Late instead of IMERG V07 Final because processing of the latter ended in September 2025, and for December 2025
      the scaling to the Monthly used 2A GPROF V07 rather than 2A-CLIM.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/MEaSUREs/GPCP/GPCP_ATBD_V3.3_Daily.pdf
  - date: "2025-12-02"
    level: info
    title: New GPCP v3.3 dataset now available on CDS
    body: The GPCP data on the CDS were upgraded to v3.3 (monthly 1983-01 to 2024-09, daily 1998-01 to 2024-09). Coverage is shorter than at GES DISC.
    source: https://forum.ecmwf.int/t/new-gpcp-v3-3-dataset-now-available-on-cds/14469
  - date: "2025-08-05"
    level: warning
    title: NOAA CDR moves to V3.3 — V2.3 and Daily V1.3 superseded
    body: >-
      NOAA NCEI released the GPCP Monthly and Daily CDR Version 3.3 (0.5°) and marked V2.3 (monthly) and V1.3 (daily) as superseded,
      advising that the old versions should not be used except in rare cases such as reproducing earlier studies. V2.3 files were still being added as of October 2026.
    source: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01725
  - date: "2025-02-12"
    level: info
    title: V3.3 released, replacing V3.2
    body: >-
      GES DISC released the V3.3 Monthly and Daily products, replacing V3.2. Inputs were upgraded (GPROF2021, 3-hourly PERSIANN-CDR, GPCC V2022, among others),
      an absolute bias error field was added, and the Daily now covers January 1998 onward. V3.3 has higher average values over most of the oceans than V3.2.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/MEaSUREs/GPCP/Release_Notes.GPCPV3.3.pdf

