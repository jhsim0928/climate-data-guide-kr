    url: https://disc.gsfc.nasa.gov/datacollection/GPCPMON_3.3.html
    method: HTTPS / OPeNDAP / Earthdata Search / earthaccess
    note: Requires a free NASA Earthdata Login. Files are named GPCPMON_L3_yyyymm_V3.3.nc4.
  - name: NASA GES DISC — GPCPDAY V3.3 (daily)
    url: https://disc.gsfc.nasa.gov/datacollection/GPCPDAY_3.3.html
    method: HTTPS / OPeNDAP / Earthdata Search / earthaccess
    note: Files are named GPCPDAY_L3_yyyymmdd_V3.3.nc4.
  - name: NOAA NCEI — GPCP Monthly CDR (V3.3 / previous V2.3)
    url: https://www.ncei.noaa.gov/products/climate-data-records/precipitation-gpcp-monthly
    login: false
    method: HTTPS / THREDDS / AWS and Google Cloud
    note: No account needed. As of 2026-10, the NCEI direct-download directory and the AWS bucket (noaa-cdr-precip-gpcp-monthly-pds) contain only V2.3 (v02r03) files.
  - name: NOAA NCEI — GPCP Daily CDR (V3.3 / previous V1.3)
    url: https://www.ncei.noaa.gov/products/climate-data-records/precipitation-gpcp-daily
    login: false
    method: HTTPS / AWS and Google Cloud
    note: As of 2026-10, the AWS bucket (noaa-cdr-precip-gpcp-daily-pds) holds V1.3 (v01r03, 1°) files.
  - name: Copernicus CDS — GPCP v3.3 redistribution
    url: https://cds.climate.copernicus.eu/datasets/satellite-precipitation
    method: Web download / CDS API
    note: A copy redistributed by C3S (v3.3 added in 2025-12). As of 2026-10 the catalogue lists coverage to 2025-12. Requires an ECMWF account.

example:
  lang: python
  note: "Run earthaccess.login() once with your NASA Earthdata account first. For recent months without an account, download V2.3 from NOAA's AWS bucket as shown in the comment below."
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="GPCPMON", version="3.3", temporal=("2024-01", "2024-12")
    )
    files = earthaccess.download(results, "./gpcp")
    ds = xr.open_mfdataset(files, combine="by_coords")
    pr = ds["sat_gauge_precip"]          # mm/day, monthly mean precipitation rate
    print(pr.sel(lat=slice(33, 39), lon=slice(124, 132)).mean(("lat", "lon")).values)

    # V2.3 (2.5°) without an account: https://noaa-cdr-precip-gpcp-monthly-pds.s3.amazonaws.com/data/2026/
    #   gpcp_v02r03_monthly_dYYYYMM_cYYYYMMDD.nc (preliminary files: gpcp_v02r03-preliminary_...)

tips:
  - V2.3 (2.5°) and V3.3 (0.5°) have different climatologies and trends. Use the same version as the studies you compare against, and always state the version (V2.3 or V3.3) in your paper.
  - NOAA states that the accuracy of individual daily estimates at fine resolution is limited. Use V3.3 Daily for large-scale and statistical analyses rather than single extreme-rainfall events.
  - Because V3.3 Daily depends on IMERG, extensions into 2026 may lag until IMERG Final moves to V08. For recent daily precipitation, also look at IMERG Early and Late.
  - V2.3 preliminary files are later replaced by final files for the same month, so re-download the last few months before finalizing results.
  - V3.3 values are at grid-box centres on a 0.5° grid. Do not reuse region definitions built for the 2.5° grid (e.g. the 1.25° offset) unchanged.

