# ─────────────────────────────────────────────────────────────
# GPCP — dataset information file (English edition)
# Atmosphere tab (precipitation). Main product is V3.3 (0.5°, monthly and daily); the older V2.3 (2.5°, monthly) and Daily V1.3 (1°) are also covered.
# After editing, set last_verified to the date you checked the official pages.
# ─────────────────────────────────────────────────────────────
id: gpcp
name: GPCP V3.3
full_name: Global Precipitation Climatology Project (GPCP) Version 3.3 Satellite-Gauge Combined Precipitation
category: analysis
domain: atmosphere
group: 강수 자료
order: 10
domains: [대기, 육지, 해양]
provider: NASA GSFC and University of Maryland ESSIC GPCP team (distributed by NASA GES DISC and the NOAA NCEI Climate Data Record (CDR) Program)

status: delayed
status_note: >-
  V3.3 (0.5°, monthly and daily) is the current version; both NASA and the NOAA CDR Program list V2.3 (monthly) and V1.3 (daily) as superseded.
  V3.3 is extended in irregular multi-month batches, and as of 2026-10-12 it ends in December 2025. The V3.3 release notes still say production
  was paused while NCEI developed a new calibration procedure for the GridSat IR input, and IMERG V07 Final, on which the Daily product is built, ended in September 2025.
  If you need the most recent months, V2.3 (2.5°) is still released monthly and can serve as a stopgap.

transitions:
  - from: GPCP V2.3
    to: GPCP V3.3
    status: completed
    date: "2025-08"
    summary: In August 2025 the NOAA CDR Program released V3.3 as the new Climate Data Record and marked V2.3 and V1.3 as superseded. The grid goes from 2.5° (1° for daily) to 0.5°, and every input dataset has been replaced.
    changes:
      - aspect: Grid
        before: Monthly 2.5° (144×72), daily 1°
        after: Monthly and daily 0.5° (720×360)
      - aspect: Period
        before: Monthly 1979-01–present, daily 1996-10–present
        after: Monthly 1983-01–present, daily 1998-01–present
      - aspect: Infrared (IR) satellite input
        before: Geostationary and polar-orbiter IR brightness temperatures (1986–); OPI for 1979–1985
        after: 3-hourly PERSIANN-CDR (from GridSat IR) calibrated to SSM/I and SSMIS, then ratio-adjusted to the MCTG climatology
      - aspect: High latitudes
        before: TOVS (1987-08–2002-12) and AIRS (2003-01–) precipitation
        after: TOVS (1983–2002-08) and AIRS (2002-09–) precipitation
      - aspect: Gauge analysis
        before: GPCC Full Data Reanalysis V7 + Monitoring
        after: GPCC V2022 Final + Monitoring
      - aspect: Daily method
        before: Daily V1.3 (1°, 1996-10–)
        after: IMERG Final half-hourly data accumulated to daily and averaged to 0.5° within 55°N–55°S; TOVS/AIRS poleward of 55°; days ratio-adjusted to sum to the monthly value
      - aspect: New variables
        before: Precipitation and random error
        after: Adds absolute bias error, probability of liquid phase and gauge relative weight
      - aspect: Latency
        before: Interim (ICDR) about 10 days; final about 2 months
        after: About 3 months or more, released in multi-month batches
    impacts:
      - Do not splice the two versions into one time series. V3.3 is generally wetter, especially over the oceans.
      - V3.3 monthly starts in 1983, so for 1979–1982 only V2.3 is available. If you use it, state the version mix in your paper.
      - Climatology and index code written for the 2.5° grid must be adapted to the 0.5° grid, including the grid-centre positions.
      - NOAA advises against using V2.3 except in rare cases, such as reproducing earlier studies.
    sources:
      - name: NOAA NCEI — GPCP Monthly CDR Version 3.3 (C01725)
        url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01725
      - name: NOAA NCEI — GPCP Daily CDR Version 3.3 (C01726)
        url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01726
      - name: GES DISC — GPCP V3.3 Release Notes
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/MEaSUREs/GPCP/Release_Notes.GPCPV3.3.pdf
      - name: NCEI GPCP Monthly CDR V2.3 Climate Algorithm Theoretical Basis Document (CDRP-ATBD-0848)
        url: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation_GPCP-Monthly/AlgorithmDescription_01B-34.pdf
      - name: Huffman et al. (2023), The New Version 3.2 GPCP Monthly and Daily Precipitation Products, J. Climate
        url: https://doi.org/10.1175/JCLI-D-23-0123.1

period:
  start: "1983-01"
  end: present
  note: >-
    V3.3 Monthly starts in 1983-01 and V3.3 Daily in 1998-01; as of 2026-10-12 both run to 2025-12 at GES DISC (extended on 2026-05-01).
    At NOAA, V2.3 Monthly (from 1979-01) is available through the 2026-09 preliminary file, and Daily V1.3 (from 1996-10) through 2026-07.
    V3.3 Daily for October–December 2025 was computed with IMERG V07 Late because IMERG V07 Final processing ended in September 2025.

resolution:
  spatial_short: "56 km (0.5°)"
  temporal_short: "1일"
  spatial: "V3.3: 0.5° × 0.5° global latitude–longitude grid (720 × 360, values at grid-box centres) / V2.3 Monthly: 2.5° grid (144 × 72, first box centred at 88.75°N, 1.25°E) / Daily V1.3: 1° × 1°"
  vertical: Surface precipitation (single level)
  temporal: Monthly (V3.3 1983–, V2.3 1979–) / daily (V3.3 1998–, V1.3 1996-10–)

update: V3.3 is extended irregularly in multi-month batches (target is quarterly) / V2.3 Monthly is updated every month (preliminary files about 10 days after month end)
license: US Government public-domain data — no restrictions on use; please cite the dataset DOI
account_required: true

summary: >-
  GPCP is a global precipitation analysis coordinated by the WCRP GEWEX Data and Assessment Panel (GDAP). It merges passive-microwave
  and infrared satellite estimates with the GPCC rain-gauge analysis to give globally complete precipitation over land and ocean.
  The current version, V3.3, provides 0.5° monthly (1983–) and daily (1998–) fields; the Daily is built from IMERG and "adds up" to the Monthly.
  The older V2.3 (2.5°, monthly, 1979–) has been the reference in a large body of literature and is still updated monthly, but it is officially superseded by V3.3.

time_convention:
  summary: >-
    Monthly values are the mean precipitation rate for the month (mm/day); daily values are the daily total (mm/day). In V3.3 files, time holds
    the begin and end times of the month (or day) in minutes since 1979-01-01 00:00:00.
  points:
    - "Monthly values are in mm/day: multiply by the number of days in the month to get a monthly total (mm)."
    - "V3.3 Daily accumulates IMERG Final half-hourly data to daily, then for each grid box ratio-adjusts all days to approximately sum to the V3.3 Monthly (ratios capped at 0.2–4)."
    - "The README and ATBD do not state the daily boundary (e.g. 00–24 UTC); check the begin and end times in each file's time variable."
    - "In the Monthly files, probability_liquid_phase is the precipitation-weighted average of the 3-hourly probabilities."
    - "NCEI V2.3 files appear first as preliminary versions (\"preliminary\" in the file name) and are later replaced by final versions."
  source: https://measures.gesdisc.eosdis.nasa.gov/data/GPCP/GPCPMON.3.3/doc/README.GPCPV3.3_Monthly.pdf
  source_name: GES DISC GPCP V3.3 Monthly and Daily READMEs + V3.3 ATBDs

variables:
  note: >-
    V3.3 names are the in-file variable names from the GES DISC README (Table 3); V2.3 names are from the NCEI THREDDS aggregation.
    The V3.3 Monthly quality index (equivalent number of gauges) is listed in the README with a space in its name, so check the exact name in a downloaded file.
  full_list: https://measures.gesdisc.eosdis.nasa.gov/data/GPCP/GPCPMON.3.3/doc/README.GPCPV3.3_Monthly.pdf
  groups:
    - name: V3.3 Monthly (GPCPMON, 0.5°)
      kind: mean
      period: Monthly
      items:
        - "Combined satellite-gauge precipitation estimate — `sat_gauge_precip` (mm/day)"
        - "Combined satellite-gauge precipitation random error estimate — `sat_gauge_error`, `sat_gauge_random_error` (mm/day)"
        - text: "Combined satellite-gauge precipitation absolute bias error estimate — `sat_gauge_absolute_bias_error` (mm/day)"
          note: New in V3.3
        - "Satellite-only precipitation estimate — `satellite_precip` (mm/day)"
        - "Wind-loss adjusted gauge precipitation — `gauge_precip` (mm/day)"
        - text: "Probability of liquid phase precipitation — `probability_liquid_phase` (percent)"
          note: Precipitation-weighted monthly mean of 3-hourly probabilities
        - "Relative weighting of gauges in sat_gauge_precip — `gauge_relative_weight` (percent)"
    - name: V3.3 Daily (GPCPDAY, 0.5°)
      kind: accum
      period: Daily
      items:
        - text: "Daily precipitation — `precip` (mm/day)"
          note: Daily total, equivalently the mean daily rate; days are scaled to sum to the monthly value
        - text: "Probability of liquid phase precipitation — `probability_liquid_phase` (percent)"
          kind: mean
          period: Daily
    - name: V2.3 Monthly (NCEI CDR, 2.5°)
      kind: mean
      period: Monthly
      items:
        - "Combined satellite-gauge precipitation — `precip` (mm/day)"
        - "Combined precipitation error — `precip_error` (mm/day)"

