notices:
  - date: "2025-09-02"
    level: warning
    title: MUR severely degraded on 2025-08-25 and 08-26 (provided as is until reprocessed)
    body: >-
      A break in the input-data production chain meant inputs were progressively missing after 2025-08-24; on 25 and 26 August most high-resolution satellite data were absent,
      leaving very low-resolution fields, a PO.DAAC expert explained on the Earthdata Forum. Production has been normal since about 27 August; the 25–26 August files will need reprocessing at some point but are currently provided as is.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=23994
  - date: "2024-10-14"
    level: warning
    title: Hurricanes Helene and Milton reduce MUR and MUR25 quality
    body: >-
      Hurricanes Helene and Milton had major impacts on NOAA data centres, leaving gaps in several SST datasets including RSS AMSR2 L2P.
      PO.DAAC announced that MUR v4.1 and MUR25 v4.2 quality was affected because they use AMSR2 microwave SST as a key input layer.
    source: https://podaac.jpl.nasa.gov/announcements/2024-10-14-Impacts-to-recent-PODAAC-SST-datasets
  - date: "2024-09-04"
    level: info
    title: MUR v4.1 posting outage caused by an ingest error resolved
    body: >-
      New files had stopped appearing after 2024-08-29 because of an internal PO.DAAC problem ingesting MUR v4.1; it was fixed on 4 September and the backlog was posted,
      PO.DAAC User Services said on the Earthdata Forum. Such outages may not reach the announcements page, so PO.DAAC suggested joining its mailing list.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=20284
  - date: "2023-03-31"
    level: warning
    title: AMSR2 gap (2022-12-17 to 2023-02-27) and switch to cloud inputs
    body: >-
      Reprocessing of AMSR2 from v8a to v8.2 left a gap at PO.DAAC, so MUR (1 km) and MUR25 were produced without AMSR2 from 2022-12-17 to 2023-02-27,
      with some possible loss of SST fidelity. From 2023-03-13 MUR production also takes its L2P inputs from NASA Earthdata Cloud, which PO.DAAC said does not affect users.
    source: https://podaac.jpl.nasa.gov/announcements/2023-03-31-Update-to-the-MUR-SST-processing-chain-and-recent-timeline
  - date: "2019-10-18"
    level: info
    title: Release of the 0.25° MUR25 v4.2
    body: >-
      PO.DAAC released MUR25 v4.2 (from 2002-09-01), a daily 0.25° analysis using the same method and inputs as MUR.
      It has a much more compact data volume and includes SST anomalies relative to a MUR climatology, aimed at long-term climate studies.
    source: https://podaac.jpl.nasa.gov/announcements/2019-10-18_GHRSST_L4_MUR_0.25deg_Global_Foundation_SST_Analysis_v4.2_Dataset_Release

