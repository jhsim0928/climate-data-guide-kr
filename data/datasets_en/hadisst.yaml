# ─────────────────────────────────────────────────────────────
# HadISST — dataset information file (English edition)
# Met Office Hadley Centre HadISST1.1 (sea surface temperature + sea ice concentration)
# ─────────────────────────────────────────────────────────────
id: hadisst
name: HadISST
full_name: Hadley Centre Sea Ice and Sea Surface Temperature data set, version 1.1
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 40
also_in:
  - domain: seaice
    group: 관측 기반 분석장
    label: HadISST (sea ice concentration)
domains: [해양, 해빙]
provider: Met Office Hadley Centre (UK)

status: deprecated
status_note: >-
  Still updated monthly, but the Met Office has announced on the official page that within 2026 it will replace HadISST1 with a new dataset. The name
  and release date of the successor have not been announced; regular HadISST1 users can ask the Met Office for a preview. If you are starting a new
  long-term analysis, watch for the replacement announcement.

period:
  start: "1870-01"
  end: present
  note: >-
    Updated at the start of each month with data typically for the month before last (a delay of about 1–2 months). The whole record from 1870 is
    provided as a single version, but the inputs (in situ observations, satellites, sea ice charts) change over time, which introduces discontinuities
    within the series.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1개월"
  spatial: 1 degree latitude-longitude grid (global, globally complete fields)
  vertical: Sea surface only
  temporal: Monthly

coverage:
  short: 전지구
update: Monthly (delay of about 1–2 months)
license: >-
  © Crown Copyright, Met Office — Open Government Licence (version 2, per the terms and conditions page). The home page states the data are available
  without charge for the purposes of private study and scientific research; commercial and media enquiries go to the Met Office Customer Centre.
  A credit line and citation of the reference paper are required.
account_required: false

summary: >-
  The Met Office Hadley Centre's sea ice and sea surface temperature (SST) data set, HadISST1, is a combination of monthly globally complete fields of
  SST and sea ice concentration on a 1 degree latitude-longitude grid from 1870 to date — one of the standard long-term records. Ship and buoy
  observations and satellite SSTs are combined by reduced-space optimal interpolation to give complete fields, and sea ice is based on digitised sea ice
  charts and passive microwave satellite data. It is widely used as the lower boundary condition for AMIP-style atmospheric model experiments and in
  studies of ENSO and long-term variability.

time_convention:
  summary: >-
    All values are monthly values representing the whole month, not instantaneous values. SST is an analysis based on monthly mean observations, and sea
    ice concentration is based mainly on monthly medians of daily satellite or weekly chart values.
  points:
    - "The time coordinate is stamped mid-month (around the 16th), but each value represents the whole month, not that day (as seen in the time coordinate of the NOAA ERDDAP mirror)."
    - "SST inputs are monthly means (monthly medians for some historical in situ COADS data), and weekly satellite SSTs are averaged to monthly values (Rayner et al. 2003)."
    - "In the satellite era (from late 1978) sea ice concentration uses the monthly median of daily concentrations, and the historical Walsh data (end-of-month values) were adjusted to be consistent with monthly medians. Values can differ slightly from an arithmetic mean."
    - "The series runs from 1870 as one record, but in some periods the sea ice is filled with climatology, so a monthly value may not reflect observations from that month."
  source: https://www.metoffice.gov.uk/hadobs/hadisst/HadISST_paper.pdf
  source_name: Rayner et al. (2003), HadISST paper (PDF provided by the Met Office)

variables:
  note: >-
    Based on the official NetCDF files (HadISST_sst.nc, HadISST_ice.nc); SST and sea ice concentration come as separate files. Units were
    cross-checked against the metadata of the same files on NOAA ERDDAP.
  full_list: https://www.metoffice.gov.uk/hadobs/hadisst/data/download.html
  groups:
    - name: Sea surface temperature (HadISST_sst.nc)
      kind: mean
      period: Monthly
      items:
        - "Sea surface temperature (standard_name sea_surface_temperature) — `sst` (°C, written as `C` in the file)"
    - name: Sea ice (HadISST_ice.nc)
      kind: mean
      period: Monthly
      items:
        - text: "Monthly 1 degree resolution sea ice concentration (sea_ice_area_fraction) — `sic` (fraction 0–1, written as `1` in the file)"
          note: Strictly, a monthly value based on the monthly median of daily satellite concentrations (or weekly charts) (Rayner et al. 2003).

access:
  - name: Met Office Hadley Centre download page
    url: https://www.metoffice.gov.uk/hadobs/hadisst/data/download.html
    login: false
    method: Web download (NetCDF .nc.gz / ASCII .txt.gz)
    note: >-
      Full-period CF-compliant NetCDF files (HadISST_sst.nc.gz about 240 MB, HadISST_ice.nc.gz about 17 MB) and update files holding only the most
      recent available month. ASCII files are split by period and by year, with the format described in the read instructions. No account needed.
  - name: NOAA CoastWatch ERDDAP — HadISST SST (erdHadISST)
    url: https://coastwatch.pfeg.noaa.gov/erddap/info/erdHadISST/index.html
    login: false
    method: ERDDAP (subset by region and time, OPeNDAP)
    note: A NOAA mirror of the Met Office files. It may lag behind the original, so check the Met Office page for the latest month.
  - name: NOAA CoastWatch ERDDAP — HadISST sea ice (erdHadISSTIce)
    url: https://coastwatch.pfeg.noaa.gov/erddap/griddap/erdHadISSTIce
    login: false
    method: ERDDAP (subset by region and time, OPeNDAP)

example:
  lang: python
  note: Download HadISST_sst.nc.gz from the download page and decompress it before running.
  code: |
    # pip install xarray netCDF4
    import xarray as xr

    ds = xr.open_dataset("HadISST_sst.nc")
    sst = ds["sst"]
    # Handle unphysically low values (e.g. under sea ice) as appropriate for your analysis
    sst = sst.where(sst > -2)
    nino34 = sst.sel(latitude=slice(5, -5), longitude=slice(-170, -120)).mean(["latitude", "longitude"])
    print(nino34.sel(time="2025"))

tips:
  - >-
    Sea ice observations before the satellite era are very sparse. In the Antarctic in particular, 1871–1939 and 1947–1962 are filled with climatology,
    so sea ice variability or trends in those periods should not be read as real signals. For sea ice studies from 1979, compare with a single-algorithm
    satellite record.
  - >-
    According to the official service notes, the 2009 switch of satellite sea ice source introduced a discontinuity in Arctic and Antarctic sea ice;
    satellite SST input moved to METOP from June 2020, and in situ input moved to unadjusted HadSST4 from January 2021. Allow for these input changes when
    computing recent trends.
  - >-
    In the ASCII files temperatures are stored as integers in °C × 100, grid boxes fully covered by sea ice are marked -1000 and land -32768. In the
    NetCDF files, too, check for and mask unphysical values in ice-covered areas first.
  - >-
    HadISST.2 (HadISST2) provides sea ice concentration only, on a separate page that shows no updates since 2016. Do not mix it with HadISST1, and do
    not assume it is the HadISST1 successor announced for 2026.

citations:
  dataset: []
  papers:
    - label: HadISST reference paper (required citation)
      text: >-
        Rayner, N. A., Parker, D. E., Horton, E. B., Folland, C. K., Alexander, L. V., Rowell, D. P., Kent, E. C., Kaplan, A. (2003):
        Global analyses of sea surface temperature, sea ice, and night marine air temperature since the late nineteenth century.
        Journal of Geophysical Research, 108(D14), 4407.
      doi: 10.1029/2002JD002670
      bibtex: |
        @article{rayner2003hadisst,
          author  = {Rayner, N. A. and Parker, D. E. and Horton, E. B. and Folland, C. K. and Alexander, L. V. and Rowell, D. P. and Kent, E. C. and Kaplan, A.},
          title   = {Global analyses of sea surface temperature, sea ice, and night marine air temperature since the late nineteenth century},
          journal = {Journal of Geophysical Research: Atmospheres},
          volume  = {108},
          number  = {D14},
          pages   = {4407},
          year    = {2003},
          doi     = {10.1029/2002JD002670}
        }
  acknowledgement: >-
    The terms and conditions require citation of Rayner et al. (2003) plus a credit line: "HadISST data were obtained from
    https://www.metoffice.gov.uk/hadobs/hadisst/ and are © Crown Copyright, Met Office, [year of first publication], provided under an Open Government
    Licence, https://www.nationalarchives.gov.uk/doc/open-government-licence/version/2/". Outside the UK, write "© British Crown Copyright, Met Office".
    Copy the exact wording from the terms and conditions page.

notices:
  - date: "2026-06-07"
    level: warning
    title: HadISST1 to be replaced with a new dataset within 2026
    body: >-
      The HadISST home page states: "Within the next year (2026), we will replace HadISST1 with a new dataset." (The date is the page's last-updated date;
      the original posting date is not shown.) The name and release date of the new dataset are not yet known, and regular HadISST1 users can request a preview.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/
  - date: "2025-06-05"
    level: warning
    title: January 2025 SST field replaced because it contained an error — re-download needed
    body: >-
      The sea-surface temperature field originally released for January 2025 contained an error and has been replaced. If you downloaded January 2025
      data before 5 June 2025, download it again.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/
  - date: "2021-04-26"
    level: info
    title: In situ updates now based on unadjusted HadSST4
    body: From January 2021 data onwards, the in situ updates use unadjusted HadSST4 (for continuity with the HadSST2 data previously used).
    source: https://www.metoffice.gov.uk/hadobs/hadisst/servicenotes.html
  - date: "2020-10-22"
    level: warning
    title: Satellite SST source changed to METOP; cool bias in recent years
    body: >-
      From June 2020 onwards the satellite SST source changed from NOAA satellites to METOP. Changes of source can have unexpected effects, and because
      no adjustment is made for ship biases or the buoy–ship offset, HadISST1 has a cool bias in recent years.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/servicenotes.html
  - date: "2011-03-08"
    level: warning
    title: Sea ice discontinuity from the early-2009 change of input source
    body: The switch of satellite sea ice data source in early 2009 introduced a discontinuity in the fields of sea ice in both the Arctic and Antarctic.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/servicenotes.html

