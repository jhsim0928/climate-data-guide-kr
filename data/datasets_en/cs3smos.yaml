notices:
  - date: "2026-10-11"
    level: info
    title: Antarctic 2026 winter data updating on Copernicus Marine — 2026/27 Arctic season not yet announced
    body: >-
      The AWI wiki has no separate announcement of Southern Hemisphere L4 processing, but the Copernicus Marine Antarctic dataset is updated to the
      2026-10-06 reference day (metadata updated 2026-10-11). Southern Hemisphere production runs to 15 October; as of 2026-10-12 the AWI wiki has not
      announced the start of the 2026/27 Arctic season.
    source: https://stac.marine.copernicus.eu/metadata/SEAICE_GLO_PHY_L4_NRT_011_014/esa_obs-si_ant_phy-sit_nrt_l4-multi_P1D-m_202411/dataset.stac.json
  - date: "2026-04-21"
    level: info
    title: L4 CryoSat-2/Sentinel-3/SMOS (CS3SMOS) near real-time sea ice thickness processing ends for the Arctic 2025/26 winter season
    body: >-
      Arctic CS3SMOS near-real-time processing has concluded for the 2025/26 winter. The final map covers 9–15 April 2026, and Southern Hemisphere
      operational processing is expected to begin soon. This is the normal end of a seasonal product, not an interruption.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2026/04/21/624500204/L4+CryoSat-2+Sentinel-3+SMOS+CS3SMOS+near+real-time+sea+ice+thickness+processing+ends+for+the+Arctic+2025+26+winter+season
  - date: "2025-10-23"
    level: warning
    title: Degraded quality in the Barents, Kara and Laptev Seas due to SMOS radio-frequency interference (RFI)
    body: >-
      Frequent and persistent RFI in these seas removes SMOS thin-ice measurements. Thickness there depends on radar altimetry alone and may be higher than
      SMOS-based estimates. Check cells with `quality_flag` = 1 (altimetry only).
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/23/596052016/L4+CryoSat-2+Sentinel-3+SMOS+CS3SMOS+near+real-time+sea+ice+thickness+processing+has+started+for+the+Arctic+2025+26+winter+season
  - date: "2025-10-23"
    level: info
    title: L4 CryoSat-2/Sentinel-3/SMOS near real-time sea ice thickness processing has started for the Arctic 2025/26 winter season (v300 replaces v206)
    body: >-
      From the 2025/26 Arctic winter the merged thickness product changes from v206 (CS2SMOS) to v300 (CS3SMOS). Key changes are added Sentinel-3
      altimetry, a 12.5 km grid instead of 25 km, Antarctic winter thickness from April to October, and a new file format and content. The first weekly
      field covers 15–21 October 2025.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/23/596052016/L4+CryoSat-2+Sentinel-3+SMOS+CS3SMOS+near+real-time+sea+ice+thickness+processing+has+started+for+the+Arctic+2025+26+winter+season
  - date: "2025-10-16"
    level: info
    title: Sea ice concentration input switched from SSMIS (OSI-401) to AMSR2 (OSI-408)
    body: >-
      SSMIS data access became unreliable in summer 2025, so the auxiliary sea ice concentration input was switched on short notice to the AMSR2-based
      OSI-408. The impact analysis found a negligible change in sea ice thickness, about 4 mm on average over one winter (Copernicus Marine QUID issue 2.2).
    source: https://documentation.marine.copernicus.eu/QUID/CMEMS-SEAICE-QUID-011-014.pdf

