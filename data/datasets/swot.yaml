notices:
  - date: "2026-10"
    level: info
    title: AVISO SWOT L3 LR Wind Wave v3.0 공개 (Light·Extended)
    body: >-
      AVISO가 SWOT L3_LR_WIND_WAVE(유의파고·풍속 L3) Light·Extended v3.0의 생산·배포를 시작했습니다. 과학 단계 사이클 1~51과 보정(Calval) 단계 사이클 474~578이 들어 있습니다.
      이전 v2.0은 과학 단계 사이클 2~16만 담았습니다.
    source: https://www.aviso.altimetry.fr/en/missions/current-missions/swot/swot-ocean-data-access.html
  - date: "2025-11"
    level: info
    title: AVISO L3 LR SSH v3.0 공개, L2 지연 단축
    body: >-
      AVISO가 SWOT L3 LR SSH Basic·Expert v3.0(2 km, 보정 단계 사이클 474~578과 과학 단계)을 공개했고, 12월에는 대체 모델·알고리즘을 담은 Technical v3.0을 더했습니다.
      같은 달 L2_LR_SSH 전달 지연이 6시간 줄었고, L3는 목표 지연 48시간으로 운영됩니다. 250 m Unsmoothed는 아직 v2.0.1이 최신입니다.
    source: https://www.aviso.altimetry.fr/en/missions/current-missions/swot/swot-ocean-data-access.html
  - date: "2025-11-25"
    key_date: "2025-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: Copernicus Marine에 SWOT KaRIn 병합 L4 시범 데이터셋 추가
    body: >-
      직하 고도계와 SWOT KaRIn을 합친 NRT L4 해수면 지도(cmems_obs-sl_glo_phy-ssh_nrt_demo-allsat-swos-l4-duacs-0.125deg_P1D-i)가 시범(demo) 데이터셋으로 추가되었습니다.
      L3 KaRIn 입력이 아직 운영 단계가 아니어서 별도 데이터셋이며, 공식 운영 제품은 계속 직하 고도계만 쓴 DUACS 지도입니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
  - date: "2025-05-21"
    level: warning
    title: KaRIn 자료 Version C → Version D 전환 완료
    body: >-
      Version C 마지막 순처리는 2025-05-05 무렵, Version D 첫 순처리는 2025-05-06 무렵 관측분입니다. 2023-03-30~2025-05 구간은 Version D로 재처리 중이라고 안내했고(2026년 초 완료 예정),
      Version C 컬렉션은 계속 남아 있습니다. 2025-05-06 직후 3~5일은 이상 파일이 생성되어 더 큰 counter로 다시 만들었으므로 counter가 가장 큰 파일을 쓰라고 당부했습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2025-05-21-SWOT-Science-Data-Products-Transition-from-Version-C-to-Version-D-complete
  - date: "2024-08-14"
    level: warning
    title: 2024-07-31~08-07 SWOT 자료 품질 저하
    body: >-
      원격 측정 자료가 늦게 도착해 이 기간 PIC0 산출물 품질이 떨어졌습니다. KaRIn LR 산출물은 재처리를 마쳤으니 이 기간은 counter가 가장 큰 파일을 쓰라고 안내했습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2024-08-14-Degraded-SWOT-data-quality-from-July-31-to-August-7
  - date: "2024-03-06"
    level: info
    title: KaRIn 과학 자료(Version C) 정식 공개
    body: >-
      LR 해양 산출물(SWOT_L2_LR_SSH_2.0, DOI 10.5067/SWOT-SSH-2.0)이 사이클 7(2023-11-23)부터 순처리로 공개되었습니다.
      2023-03-30~2024-01-25 구간은 차례로 재처리해 공개하며, 사이클 7~9 순처리본은 재처리본으로 대체된다고 밝혔습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2024-03-06-SWOT-KaRIn-Science-Data-Products-Release
  - date: "2023-12-01"
    level: info
    title: KaRIn 베타(사전 검증) 자료 공개
    body: >-
      실제 KaRIn 자료에 익숙해지도록 베타 사전 검증 산출물이 공개되었습니다. LR 해양 자료는 보정 단계(1일 궤도, 2023-03-30~07-10) 재처리본(SWOT_L2_LR_SSH_1.1)과
      과학 단계(21일 궤도, 2023-09-07부터) 순처리본(SWOT_L2_LR_SSH_1.0)입니다.
    source: https://podaac.jpl.nasa.gov/announcements/2023-12-01-SWOT-KaRIn-Beta-Pre-Validated-Data-Products

transitions:
  - from: SWOT KaRIn Version C
    to: SWOT KaRIn Version D
    status: completed
    date: "2025-05"
    summary: >-
      Version C의 알려진 문제를 고치려고 처리 알고리즘·보정 계수·일부 지구물리 모델을 바꾼 판입니다. 조석 모델, 평균 해수면, MDT가 새것으로 바뀌고
      지오이드 오류(10 cm 규모)가 고쳐졌으며, 2023-03 이후 전 구간이 Version D로 다시 처리되었습니다.
    changes:
      - aspect: 컬렉션·DOI
        before: "SWOT_L2_LR_SSH_2.0 (10.5067/SWOT-SSH-2.0)"
        after: "SWOT_L2_LR_SSH_D (10.5067/SWOT-SSH-D)"
      - aspect: 파일명 CRID
        before: "PGC0(재처리, 2023-03-30~2024-01-25), PIC0(2024-01-25~10-15), PIC2(2024-10-16~2025-05 초)"
        after: "PGD0(재처리, 2023-03~2025-05), PID0(순처리, 2025-05-06~)"
      - aspect: 해양·하중 조석 모델
        before: FES2014
        after: "FES2022b, 비평형 장주기 해양 조석을 SSHA에 새로 적용"
      - aspect: 평균 해수면(MSS)
        before: "CNES/CLS 2022, DTU 2018"
        after: "CNES/CLS/SIO/DTU Hybrid 2023, DTU2021"
      - aspect: 평균 역학 지형(MDT)
        before: CNES/CLS 2022
        after: CNES/CLS 2024
      - aspect: 보정
        before: "-"
        after: "KaRIn 높이 보정 정밀화(짧은 파장 5 mm 규모 변화), sigma0 약 2.5 dB 낮아짐, 복사계(AMR) 보정 갱신으로 좌·우 상대 편차 0.2 mm 미만"
      - aspect: 기타
        before: "-"
        after: "지오이드 오류(10 cm 규모) 수정, 교차점 처리 갱신, Unsmoothed SSHA·도플러 완화·위성 사건 플래그(Expert) 등 새 변수"
    impacts:
      - Version C와 D 파일을 한 시계열에 섞지 마세요. 조석·MSS·MDT가 바뀌어 SSHA·ADT 평균장이 다릅니다.
      - "sigma0가 약 2.5 dB 낮아졌으므로 sigma0로 만든 경험식(풍속·해빙 판별 등)은 다시 맞춰야 합니다."
      - "PID0와 PGD0가 모두 있는 기간은 PGD0를, 같은 pass에 counter가 여러 개면 가장 큰 counter를 쓰세요."
    sources:
      - name: PO.DAAC — Version C → D 전환 완료 공지 (2025-05-21)
        url: https://podaac.jpl.nasa.gov/announcements/2025-05-21-SWOT-Science-Data-Products-Transition-from-Version-C-to-Version-D-complete
      - name: PO.DAAC — Version C → D 전환 예고 (2025-04-24)
        url: https://podaac.jpl.nasa.gov/announcements/2025-04-24-SWOT-Science-Data-Products-Transitioning-from-Version-C-to-Version-D-on-April-28-2025
      - name: SWOT Version D KaRIn Products Release Note (2025-12-19)
        url: https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/web-misc/swot_mission_docs/releases/SWOT_VersionD_KaRIn_Products_Release_Note_20251219.pdf
      - name: Major Changes to SWOT Products from Version C to D (2025-05-19)
        url: https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/web-misc/swot_mission_docs/KaRIn_VersionD_Summary20250519.pdf

