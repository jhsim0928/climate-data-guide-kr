notices:
  - date: "2026-08-26"
    level: info
    title: 생산 현황 — 2007년 이후 구간 2027년 말 첫 공개, 이후 ERA5T 대체
    body: >-
      ECMWF 뉴스레터 188호에 따르면 2007·2017년 구간이 생산 중이고 1987·1997년 구간이 곧 시작되어 4개 구간이 병렬로 진행됩니다.
      2007년 이후 구간이 2027년 말경 처음 공개되고, 충분한 자료가 공개되면 ERA6가 ERA5T를 대체합니다.
      ERA6T 지연 시간과 세부 일정은 추후 전환 계획으로 안내됩니다.
    source: https://www.ecmwf.int/en/newsletter/188/news/era6-reanalysis-production
  - date: "2026-06-03"
    level: info
    title: C3S 총회 발표 — ERA5T는 당분간 유지
    body: >-
      ECMWF의 C3S 총회 발표(2026년 6월)는 2007년 이후 구간을 2027년 말 공개 목표로 제시하고, 해양 3·2차원 변수, 고도면 11개,
      청천난류 등 새 산출물과 Polytope 기반 빠른 조회를 소개했습니다. 같은 발표에서 ERA5T는 당분간 유지된다고 밝혔습니다.
    source: https://climate.copernicus.eu/sites/default/files/custom-uploads/9th%20C3S%20GA/Day1/Day%201.6_Block%20I_HERSBACH.pdf
  - date: "2026-05-08"
    level: info
    title: ERA6 프로토타입 시험 자료 공개 (출판 사용 금지)
    body: >-
      ECMWF가 2022년 6~8월과 2019년 10월~2020년 9월의 ERA6 프로토타입 시험 자료를 공개했습니다.
      생산본이 아니며 응용·출판에 쓰지 말고 의견 제출과 작업 흐름 점검에만 쓰도록 안내되어 있습니다.
    source: https://www.ecmwf.int/en/forecasts/datasets/era6-prototype-1-sample-data-testing-only-june-august-2022
  - date: "2026-03-06"
    level: info
    title: ERA6 생산 시작
    body: >-
      Copernicus가 ERA6 생산 시작을 발표했습니다. 처음 두 10년 구간을 먼저 공개한 뒤 과거로 넓혀 가며,
      첫 40년 자료를 2028년 초까지 받을 수 있게 할 계획입니다. ERA5 생산은 필요한 기간 동안 중단 없이 계속됩니다.
    source: https://climate.copernicus.eu/copernicus-climates-era6-reanalysis-production-starts

