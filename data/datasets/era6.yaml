# ─────────────────────────────────────────────────────────────
# ERA6 — 데이터셋 정보 파일 (공개 전)
# ECMWF가 C3S를 위해 생산 중인 6세대 전지구 재분석. 2026-03 생산 시작, 2007년 이후 구간 2027년 말 첫 공개 예정.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: era6
name: ERA6
full_name: ECMWF Reanalysis v6 (6세대 ECMWF 전지구 재분석, 해양 결합)
category: reanalysis
domain: atmosphere
group: 재분석
order: 12
domains: [대기, 육지, 해양, 해양파랑]
provider: ECMWF / Copernicus Climate Change Service (C3S)

status: upcoming
status_note: >-
  아직 공개 전입니다. 2026년 3월 생산이 시작되어 2007년·2017년부터의 10년 구간이 병렬로 만들어지고 있으며,
  2007년 이후 구간이 2027년 말경 처음 공개될 예정입니다. 시험용 프로토타입 자료만 공개되어 있고,
  공개 후 배포처(데이터셋 이름)와 ERA5T 대체 시점은 아직 발표되지 않았습니다.

period:
  start: "1950"
  end: present
  note: >-
    ECMWF 계획상 최소 1950년부터 현재까지입니다(Copernicus는 "75년 이상", C3S 총회 발표는 "75년, 아마 80년"이라고 소개).
    10년 단위 구간을 병렬 생산하며 각 구간은 1년의 준비(spin-up) 기간을 둡니다. 2026-08 ECMWF 뉴스레터 기준 2007·2017년 구간이 생산 중이고,
    1987·1997년 구간이 이어서 시작될 예정입니다. 2026-10-12 확인 시 공개된 ERA6 자료는 없습니다(프로토타입 시험 자료 제외).

resolution:
  spatial_short: "14 km (0.13°)"
  temporal_short: "1시간"
  spatial: >-
    대기·지면·해양 파랑 모두 TCo799(약 14 km) / 결합 해양 모델 NEMO 0.25° /
    불확실성 앙상블(EDA)은 10개 멤버 + 통제 1개, 28 km. CDS 등 공개 제공 격자는 아직 발표되지 않음
  vertical: "대기 137층(최상층 1 Pa), 지상 15~500 m 고도면 11개 추가 / 해양 75층"
  temporal: 1시간 (일별 자료와 미리 계산한 월 통계도 제공 예정)

coverage:
  short: 전지구
update: >-
  공개 전. 충분한 자료가 공개되면 ERA5T(준실시간 갱신)를 ERA6가 대체할 예정이며, ERA6T 지연 시간은 미정(TBC)입니다.
license: 미정 (공개 시 발표 예정. 현재 C3S 자료인 ERA5는 CC BY 4.0)
account_required: true

summary: >-
  ECMWF가 Copernicus 기후변화 서비스(C3S)를 위해 생산 중인 ERA5의 후속 전지구 재분석입니다. IFS CY49r2 모델로
  수평 해상도를 약 14 km(ERA5 약 31 km)로 높였고, ECMWF 대표 재분석 최초로 NEMO-4 해양·SI3 해빙 모델을 결합했습니다(해양 초기장은 ORAS6).
  복원·재처리한 과거 관측과 성층권 약한 구속 4D-Var를 도입해 ERA5의 상부 성층권 문제 등을 줄이는 것이 목표이며,
  모든 자료를 WMO 단위 GRIB2로 제공할 예정입니다.

variables:
  note: >-
    공개 전이라 변수 목록이 확정되지 않았습니다. ECMWF가 발표한 새 산출물은 3차원·2차원 해양 변수, 지상 15~500 m 고도면 11개,
    다층 적설 변수, 3차원 청천난류(clear-air turbulence), 2 m 상대습도 같은 새 지표 변수, 1시간 자료와 일별 자료·월 통계입니다.
    변수 이름·단위는 공개 때 정리하겠습니다.
  groups: []

access:
  - name: Copernicus 공지 — ERA6 생산 시작 (공개 일정·배포 계획)
    url: https://climate.copernicus.eu/copernicus-climates-era6-reanalysis-production-starts
    method: 안내 페이지
    note: >-
      공개 자료의 배포처와 데이터셋 이름은 아직 발표되지 않았습니다. Copernicus는 Polytope를 통한 시계열·단면 빠른 조회와
      ARCO 형식 제공을 함께 언급했습니다. 공개 시 이 페이지를 갱신하겠습니다.
  - name: ECMWF — ERA6 prototype 1 시험 자료 (2022년 6~8월)
    url: https://www.ecmwf.int/en/forecasts/datasets/era6-prototype-1-sample-data-testing-only-june-august-2022
    method: IFS Experiments 포털 / MARS 형식 요청 (GRIB·NetCDF)
    note: >-
      ERA6 생산본이 아닌 시험용 프로토타입이며, ECMWF는 "어떤 응용이나 출판에도 쓰지 말라"고 명시합니다.
      GRIB2 전환 등 작업 흐름 점검과 의견 제출용입니다. DOI 10.21957/gmf0-rw02
  - name: ECMWF — ERA6 prototype 시험 자료 2 (2019년 10월~2020년 9월)
    url: https://www.ecmwf.int/en/forecasts/datasets/era6-prototype-test-sample-dataset-2-oct-2019-sept-2020
    method: IFS Experiments 포털 / MARS 형식 요청 (GRIB·NetCDF)
    note: 마찬가지로 시험 전용입니다(빠진 구성 요소가 있다고 안내). DOI 10.21957/1qyd-ep25

example:
  lang: text
  note: >-
    ECMWF 프로토타입 1 페이지에 실린 MARS 형식 요청 예시를 그대로 옮겼습니다(시간별 2 m 기온 분석장, 0.25° NetCDF).
    어떤 도구·계정으로 보내는지는 그 페이지에 적혀 있지 않습니다. 시험 자료이므로 연구·논문에 쓰지 마세요.
  code: |
    retrieve,
    class=rd,
    stream=lwda,
    expver=ibpb,
    type=an,
    levtype=sfc,
    param=2t,
    date=2022-08-01,
    time=00/TO/23/BY/1,
    grid=0.25/0.25,format=netcdf,
    target='output2.nc'

tips:
  - 공개 초기에는 2007년 이후 구간만 있습니다. 1940~2006년이 필요한 장기 분석은 당분간 ERA5로 하고, ERA5와 ERA6를 한 시계열로 이어 붙이지 마세요.
  - 모든 자료가 GRIB2(WMO 단위)로 바뀝니다. GRIB1 전용 도구, ERA5의 변수 이름·단위를 가정한 스크립트는 프로토타입 자료로 미리 점검해 두면 좋습니다.
  - ERA5T 대체 시점과 ERA6T 지연 시간은 아직 정해지지 않았습니다. ERA5를 최근까지 이어 받는 작업 흐름이 있다면 ECMWF가 예고한 전환 계획(transition plan) 공지를 지켜보세요.
  - 해양은 관측을 직접 동화하지 않고 ORAS6 초기장에서 출발하는 결합 모델입니다. 해양 변수를 쓸 때는 해양 재분석(ORAS6)과의 차이를 염두에 두세요.

