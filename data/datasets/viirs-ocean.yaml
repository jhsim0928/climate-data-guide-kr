notices:
  - date: "2026-08-03"
    level: critical
    title: Suomi NPP 과학 자료 전달 2026년 11월 2일 13:00 UTC 종료 — NOAA-21·NOAA-20 판으로 전환
    body: >-
      NOAA NESDIS는 VIIRS·ATMS·CERES·OMPS를 포함한 Suomi NPP의 남은 모든 과학 자료 전달을 2026년 11월 2일 13:00 UTC에 영구 중단한다고 공지했고, NOAA-21(1순위)·NOAA-20(2순위)으로 옮기라고 안내했습니다.
      위성 운용 종료가 아니라 자료 전달 중단이며, NASA는 이미 만든 Suomi NPP 자료를 계속 보관·배포합니다. NASA Earthdata 공지(2026-08-07)는 11월 1일로 적었으나 GES DISC 재공지(2026-10-07)는 11월 2일(2026/306)이고, 날짜는 바뀔 수 있습니다.
    source: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
  - date: "2025-10"
    level: info
    title: NOAA-21 VIIRS 해색 R2025.0 컬렉션 공개
    body: >-
      OBPG가 NOAA-21 VIIRS 해색을 보정만 다시 한 'VIIRS-NOAA21 Ocean Color Reprocessing 2025.0'으로 처리해 L2·L3·L4 컬렉션(version 2025.0)을 냈습니다. 대리 보정 계수를 HyperNAV 현장 복사 측정으로 다시 구해
      빈영양 해역의 Rrs 편향을 줄였고 줄무늬도 줄었다고 설명합니다. 공지 페이지에 날짜가 없어 DOI 등록일(2025-10-06)을 기준으로 적었습니다.
    source: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2025/noaa21
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 시작
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어가고 궤도 표류로 자료가 영향을 받을 수 있다며 VIIRS 유사 산출물을 검토하라고 공지했습니다. MODIS 해색 사용자는 이 자료로 옮겨 오게 됩니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2022-10"
    level: info
    title: Suomi NPP·NOAA-20 VIIRS 해색 R2022.0 전 기간 재처리 시작
    body: >-
      OBPG가 Suomi NPP와 NOAA-20 VIIRS 해색의 전 기간 재처리(R2022.0)를 2022년 10월에 시작했습니다. VIIRS L1 코드 v3.2(JPSS-2 지원)로 바꾸며 기하 보정을 다시 만들었고,
      기기·대리 보정, 엽록소 계수, 보조자료를 고쳤습니다. 심해역 평균으로 두 위성과 MODIS Aqua의 엽록소·Rrs 차이는 10% 안이라고 밝혔습니다.
    source: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/snpp

transitions:
  - from: VIIRS 해색 R2022.0 (Suomi NPP)
    to: VIIRS 해색 R2022.0.1·R2022.0.2 (Suomi NPP 부분 재처리)
    status: completed
    summary: >-
      R2022 보정에 남은 시간 표류를 없애 Suomi NPP를 NOAA-21 VIIRS·Aqua MODIS에 더 가깝게 맞춘 부분 재처리입니다. 2020년 말 자료의 작은 보정 오류도 함께 고쳤고, 2020-08-01 이후 자료를 다시 처리했습니다.
    changes:
      - aspect: Suomi NPP 보정
        before: R2022.0 궤도상 보정(시간 표류 남음)
        after: "표류를 없앤 새 보정(R2022.0.1), 2022년 이후 품질 문제 보정 반영(R2022.0.2)"
      - aspect: 다시 처리한 기간
        before: "-"
        after: 2020-08-01 이후
    impacts:
      - "2020-08 이후 Suomi NPP 값이 바뀌었으니 예전에 받은 파일과 섞지 말고 다시 받으세요."
    sources:
      - name: OBPG — VIIRS-SNPP R2022.0.1
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.1/snpp
      - name: OBPG — VIIRS-SNPP R2022.0.2
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.2/snpp
  - from: Suomi NPP VIIRS 해양
    to: NOAA-21·NOAA-20 VIIRS 해양
    status: planned
    date: "2026-11"
    summary: >-
      NOAA가 Suomi NPP 자료 전달을 2026-11-02 13:00 UTC에 끝내면 Suomi NPP판은 그 뒤 새 자료가 없습니다. 같은 VIIRS 센서·같은 OBPG 처리로 만든 NOAA-21(1순위)·NOAA-20(2순위) 판으로 옮기면 되지만,
      처리 버전·밴드 중심 파장·제공 산출물이 조금씩 다릅니다.
    changes:
      - aspect: 기간
        before: "2012-01-02~2026-11-02(전달 종료)"
        after: "NOAA-20 2017-11-29~ / NOAA-21 2022-11-10~"
      - aspect: 해색 처리 버전
        before: R2022.0(부분 재처리 R2022.0.2)
        after: "NOAA-20 R2022.0(R2022.0.2) / NOAA-21 R2025.0"
      - aspect: 원격 반사도 파장
        before: "`Rrs_410`·`Rrs_443`·`Rrs_486`·`Rrs_551`·`Rrs_671`"
        after: "`Rrs_411`·`Rrs_445`·`Rrs_489`·`Rrs_556`·`Rrs_667`"
      - aspect: 해수면온도
        before: "SST·NSST·SST3 (version 2016.2)"
        after: "NOAA-20 SST·NSST·SST3 (version 2024.0, 2026년 이후 NRT만 확인) / NOAA-21은 OB.DAAC SST 없음"
      - aspect: 파일 이름 접두
        before: SNPP_VIIRS
        after: "JPSS1_VIIRS(NOAA-20)·JPSS2_VIIRS(NOAA-21)"
    impacts:
      - "Rrs 변수 이름이 바뀌므로 스크립트의 변수명을 고쳐야 합니다. 적색 밴드(671 → 667 nm)는 값 차이가 커서(OBPG 보고 약 20%) 그대로 이을 수 없습니다."
      - "Suomi NPP와 NOAA-20·21의 엽록소는 심해역 평균으로 10% 안에서 맞지만 지역 차이는 더 클 수 있으니 겹치는 기간에 비교한 뒤 바꾸세요."
      - "Suomi NPP 해수면온도(2016.2)를 이어 쓰려면 NOAA-20 SST(2024.0)뿐이며, 처리 버전이 달라 단순 연결은 피하세요."
    sources:
      - name: NOAA NESDIS — Cessation of S-NPP data to users on/after November 2, 2026
        url: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
      - name: NASA Earthdata — Suomi NPP Data Product Delivery to Cease (2026-08-07)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
