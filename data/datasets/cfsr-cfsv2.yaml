tips:
  - "NCAR 설명에 따르면 2 m 기온과 10 m 바람 같은 일부 변수는 분석되지 않은 예보값입니다. 분석·예보 단계(+00, +01~+06)를 구분해 고르세요."
  - "NCEI 공지(2010-02-18): 2010년 2월 18일 22 UTC 이전에 받은 CFSR 시간별 시계열 파일 일부(73종 중 28종)는 GRIB 메타데이터가 잘못되어 평균값이 순간값처럼 읽힙니다. 그 전에 받은 파일은 다시 받으세요."
  - "CFSR 시계열의 f00 레코드는 모델 스핀업 값이지 분석값이 아닙니다(NCEI 알려진 문제 문서). 또 ipv 파일의 `tmpsfc`는 쓰지 말고 flx 파일 값을 쓰라고 안내되어 있습니다."
  - 2011년 경계에서 해상도와 데이터셋이 바뀌므로 장기 분석 전 NCAR·NCEI 중 한 곳의 구분을 기준으로 기간을 맞추세요.

