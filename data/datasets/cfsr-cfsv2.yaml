# ─────────────────────────────────────────────────────────────
# CFSR / CFSv2 — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: cfsr-cfsv2
name: CFSR / CFSv2
full_name: NCEP Climate Forecast System Reanalysis (CFSR) + CFS Version 2 Operational Analysis (미국 NCEP 기후예측시스템 재분석·현업 분석)
category: reanalysis
domain: atmosphere
group: 재분석
order: 80
domains: [대기, 해양, 해빙, 육지]
provider: NOAA NCEP 환경모델링센터(EMC) (배포 NOAA NCEI, NSF NCAR GDEX)

status: active
status_note: >-
  CFSR 재분석(1979~2011년 3월)은 고정 기간 자료이고, 그 뒤는 2011년 3월 30일부터 현업 운영 중인 CFSv2의 분석장이 이어 갑니다.
  2026-10-11 현재 NCAR GDEX의 CFSv2 6시간 자료는 매일 갱신되어 10월 11일까지 들어와 있습니다. NOAA는 CFSv2를 대체할
  새 결합 계절예측체계(SFS)를 개발 중이지만, 2026-10-11까지 운영 전환일이나 CFSv2 분석 종료일은 공식 발표되지 않았습니다.

transitions:
  - from: CFSR (재분석)
    to: CFSv2 현업 분석
    status: completed
    date: "2011-04"
    summary: >-
      CFSR 재분석은 2011년 3월까지만 생산되었고, 이후 기간은 2011년 3월 30일 현업에 들어간 CFSv2의 실시간 분석장이 이어 받았습니다.
      NCAR는 CFSv2 자료가 CFSR과 같은 모델을 쓰며 CFSR 기록을 연장하는 용도라고 설명하지만, 대기 분석 해상도가 T382에서 T574로 높아지는 등
      생산 방식이 달라졌습니다. 1979년부터 현재까지 이어 쓸 수는 있으나 2011년을 경계로 한 균질한 재분석은 아닙니다.
    changes:
      - aspect: 기간
        before: "1979-01-01 ~ 2011-03-31 (NCEI 기준, NCAR d093000은 2010-12까지)"
        after: "2011-04-01 ~ 현재 (NCEI 기준, NCAR d094000은 2011-01부터)"
      - aspect: 생산 방식
        before: "과거 기간을 한 번에 계산한 재분석"
        after: "CFSv2 예보 초기조건을 만드는 현업 실시간 분석 (NCAR 매일 갱신)"
      - aspect: 대기 분석 수평 해상도
        before: "T382 (약 38 km)"
        after: "T574 (약 27 km)"
      - aspect: 연직 층수
        before: "64층"
        after: "64층(혼합 시그마–기압) 그대로"
      - aspect: 최고 해상도 출력 격자
        before: "가우시안 약 0.312° (1152 × 576)"
        after: "가우시안 약 0.204° (1760 × 880)"
      - aspect: 지표·복사 플럭스(FLX) 격자
        before: "가우시안 T382"
        after: "가우시안 T574"
      - aspect: 모델
        before: "CFS 결합 모델 (대기·해양·지면·해빙)"
        after: "CFSR과 같은 모델 (NCAR GDEX 설명). 해양은 MOM4·GODAS"
      - aspect: 재예보(reforecast)
        before: "CFSRR 재분석·재예보 제공"
        after: "NCEP는 CFSRR을 2011년 3월 이후로 연장하지 않는다고 공지. 이후 예보는 현업 산출물만 있음"
      - aspect: 초기조건·관측 입력 보관
        before: "고·저해상도 초기조건과 전체 관측 입력(dumps)을 전 기간 제공"
        after: "고해상도 초기조건·관측 입력은 2011-04 ~ 2014-12만 NCEI에 보관, 저해상도 초기조건은 현재까지"
      - aspect: 제공 데이터셋·DOI
        before: "NCAR d093000(6시간, doi:10.5065/D69K487J)·d093002(월별, doi:10.5065/D6DN438J) / NCEI CFS Reanalysis"
        after: "NCAR d094000(6시간, doi:10.5065/D61C1TXF)·d094002(월별, doi:10.5065/D69021ZF) / NCEI CFS Operational Analysis"
    impacts:
      - 2011년 1~4월 부근에서 해상도와 생산 체계가 바뀌므로, 1979년부터 현재까지 한 시계열로 이어 붙일 때는 이 시점의 계단형 변화를 먼저 점검하세요. 특히 해상도에 민감한 강수·지표 플럭스·극값 지표는 조심해서 다뤄야 합니다.
      - "NCAR와 NCEI의 경계가 다릅니다. NCAR은 CFSR을 2010년 12월로 끊고 2011년 1월부터 CFSv2 데이터셋(d094000)에 넣었고, NCEI는 CFSR을 2011년 3월까지, 현업 분석을 4월부터로 나눕니다. 두 곳 자료를 섞으면 2011년 1~3월이 겹치거나 빠질 수 있습니다."
      - 현업 분석은 재분석처럼 장기 균질성을 목표로 다시 계산된 자료가 아닙니다. 2011년 이후 추세 연구라면 ERA5·JRA-3Q 등 장기 재분석과 비교해 결과를 확인하세요.
      - 고해상도 출력 격자가 바뀌어(1152 × 576 → 1760 × 880) 같은 이름의 파일이라도 격자 정의가 다릅니다. 두 기간을 함께 쓸 때는 공통 격자(0.5° 등)로 맞추세요.
    sources:
      - name: Saha et al. (2010), The NCEP Climate Forecast System Reanalysis, BAMS, 91, 1015–1057
        url: https://doi.org/10.1175/2010BAMS3001.1
      - name: Saha et al. (2014), The NCEP Climate Forecast System Version 2, J. Climate, 27, 2185–2208
        url: https://doi.org/10.1175/JCLI-D-12-00823.1
      - name: NWS Technical Implementation Notice 10-55 Amended (CFSv2 현업화, 2011-03-30)
        url: https://www.weather.gov/media/notification/tins/tin10-55cfs_aad.pdf
      - name: NOAA NCEI — Climate Forecast System (CFSR·CFSv2 제품표)
        url: https://www.ncei.noaa.gov/products/weather-climate-models/climate-forecast-system
      - name: NSF NCAR GDEX — CFSR 6-hourly (d093000)
        url: https://gdex.ucar.edu/datasets/d093000/
      - name: NSF NCAR GDEX — CFSv2 6-hourly (d094000)
        url: https://gdex.ucar.edu/datasets/d094000/
      - name: NCEP CFS version 2 정보 페이지 (CFSRR 연장 없음 공지)
        url: https://cfs.ncep.noaa.gov/cfsv2/

period:
  start: "1979-01"
  end: present
  note: >-
    CFSR 1979년 1월 ~ 2011년 3월 + CFSv2 현업 분석 2011년 4월 ~ 현재(NCEI 구분). NCAR GDEX는 CFSR을 2010년 12월까지(d093000),
    CFSv2를 2011년 1월부터(d094000) 나눠 제공합니다.

resolution:
  spatial_short: "38 km (0.31°)"
  temporal_short: "1시간"
  spatial: "대기 분석 CFSR T382(약 38 km) → CFSv2 T574(약 27 km) / 출력 0.5°·1.0°·2.5° 위경도와 가우시안 격자 / 해양 적도 0.25°~열대 밖 0.5°"
  vertical: "대기 64층 / 해양 40층 / 토양 4층 / 해빙 3층"
  temporal: 6시간 분석(00·06·12·18 UTC)과 1~6(9)시간 예보, 시간별 시계열, 월평균
update: CFSv2 분석 매일 갱신(NCAR GDEX d094000 기준)
