notices:
  - date: "2011-08"
    level: info
    title: CFSRR 알려진 문제 기술 문서 공개
    body: >-
      NCEI가 CFSR·재예보 파일의 알려진 문제(시계열 f00은 분석값 아님, 월평균 정밀도 문제, ipv 파일 `tmpsfc` 사용 금지, 해양 등온면 층 표기 오류 등)를
      정리한 2011년 8월판 문서를 제공합니다.
    source: https://www.ncei.noaa.gov/sites/default/files/2023-10/CFSRR-Known-Issues-Technical-Document-August-2011%20%282%29.pdf
  - date: "2011-04-18"
    level: info
    title: CFSv2 현업화 확정 (TIN 10-55 수정본)
    body: >-
      NWS가 2011년 3월 30일 12 UTC부터 CFSv2가 운영되었음을 알리고 CFS 1판 종료 시점을 2012년 6월로 조정했습니다.
      분석 해상도는 T574(약 27 km)·64층, 예보 모델은 T126(약 100 km), 해양은 MOM4로 바뀌었습니다.
    source: https://www.weather.gov/media/notification/tins/tin10-55cfs_aad.pdf
  - date: "2010-02-18"
    level: warning
    title: CFSR 시계열 파일 GRIB2 메타데이터 오류 수정
    body: >-
      GRIB1→GRIB2 변환 과정에서 CFSR 시계열 28종 파일의 평균·누적 구간 정보가 순간값처럼 기록되었습니다. 2010년 2월 18일 22 UTC에
      고친 파일로 교체되었으므로 그 이전에 받은 파일은 다시 받으라는 안내입니다(자료 값 자체는 정상).
    source: https://www.ncei.noaa.gov/products/weather-climate-models/climate-forecast-system

