    method: 웹 검색·HTTPS 직접 받기(archive/allData/61/<short name>/) / LAADS API-V2 / OPeNDAP
    note: >-
      short name 예: MOD04_L2·MYD04_L2·MOD04_3K·MYD04_3K·MOD08_D3·MOD08_E3·MOD08_M3(Aqua는 MYD). 모두 C6.1(아카이브 61, CMR version "6.1")입니다.
      2026-04-30부터 OPeNDAP도 Earthdata 로그인이 필요하고, 옛 LAADS Classic API는 2026-08-31 폐지되어 API-V2로 바꿔야 합니다.
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search/granules?p=C1443727145-LAADS
    method: 웹 검색 / earthaccess(파이썬)
    note: 링크는 MOD08_D3 C6.1입니다. 다른 제품은 short name으로 검색하세요. 파일은 Earthdata Cloud(s3://prod-lads)에서도 제공됩니다.
  - name: LANCE 준실시간(NRT) MOD04_L2
    url: https://search.earthdata.nasa.gov/search/granules?p=C1426436561-LANCEMODIS
    method: 웹 검색 / HTTPS
    note: 준실시간판(version 6.1NRT, DOI 10.5067/MODIS/MOD04_L2.NRT.061, 2017-10-11부터)입니다. 재해 감시처럼 빠른 자료가 필요할 때 쓰고, 연구용 시계열에는 확정판을 쓰세요.

example:
  lang: python
  note: >-
    earthaccess로 Terra MOD08_D3 일자료를 받아 pyhdf로 결합 AOD 일평균을 읽는 예입니다. MODIS 대기 산출물은 '저장값에서 add_offset을 뺀 뒤 scale_factor를 곱하는' 방식이라 직접 변환해야 합니다.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="MOD08_D3", version="6.1",
        temporal=("2024-04-01", "2024-04-03"),
    )
    files = earthaccess.download(results, "mod08")

    hdf = SD(files[0], SDC.READ)
    sds = hdf.select("AOD_550_Dark_Target_Deep_Blue_Combined_Mean")
    raw = sds.get().astype("float64")
    att = sds.attributes()
    aod = np.where(raw == att["_FillValue"], np.nan,
                   att["scale_factor"] * (raw - att["add_offset"]))  # 1° 격자 180×360
    # 행 0 = 89~90°N, 열 0 = 180~179°W
    lat = 89.5 - np.arange(180); lon = -179.5 + np.arange(360)
    j = np.argmin(abs(lat - 37.5)); i = np.argmin(abs(lon - 127.0))
    print("서울 부근 1° 칸 AOD:", aod[j, i])

tips:
  - "결합 AOD(`AOD_550_Dark_Target_Deep_Blue_Combined`)는 지역·계절마다 DT와 DB 중 어느 쪽을 썼는지가 바뀝니다(`_Algorithm_Flag`). 한 지역의 장기 분석에서는 알고리즘 전환이 값의 불연속으로 보일 수 있으니, 필요하면 DT나 DB 한쪽만 쓰세요."
  - "정량 분석에는 `Optical_Depth_Land_And_Ocean`(해양 QA≥1, 육지 QA=3)이나 DB `_Best_Estimate`(QA 2·3)를 쓰고, `Image_Optical_Depth_Land_And_Ocean`처럼 모든 품질을 담은 필드는 쓰지 마세요."
  - "HDF4 파일의 실제 값은 scale_factor × (저장값 − add_offset)입니다. 일반적인 '저장값 × scale + offset'과 부호가 반대이므로 pyhdf 등으로 직접 읽을 때 조심하세요. 유효 범위(valid_range) 밖 값도 걸러지지 않은 채 들어 있습니다."
  - "Terra와 Aqua는 관측 시각과 보정이 달라 AOD 수준이 조금 다릅니다(Sawyer et al., 2025는 DT에서 Terra가 Aqua보다 약 0.015 높다고 보고). 두 위성을 섞어 평균하기보다 한 위성을 기준으로 쓰고, 2020년(Terra)·2021년(Aqua) 이후 궤도 표류 구간은 통과 시각 변화를 함께 확인하세요."
  - "3 km 제품(MOD04_3K)은 DT 알고리즘·조견표를 그대로 쓰되 화소 선택·최소 유효 화소 수·품질 처리를 바꾼 대기질용 자료입니다. 결합 AOD·DB 필드는 없고 DT 값만 들어 있습니다."
  - "MODIS 대기팀 문제 목록에 따르면 C6.1 DB의 하층운(층운) 오염을 줄인 구름 선별 개선은 2019년 가을 이후 생산분에만 들어가 있고, 그 이전 기간은 다음 재처리 때 반영될 예정입니다. 해양 층운 지역의 DB 시계열에서 이 시점 전후를 비교할 때 주의하세요."
  - "L3 일평균(`_Mean`)은 맑은 화소만 모은 값이라 구름이 많은 날·지역은 표본이 적습니다. `_Pixel_Counts`를 함께 보고, 월평균은 유효 일수가 적은 칸을 해석할 때 조심하세요."
  - "AOD는 지상 PM2.5와 같은 양이 아닙니다. 기주 전체 소광량이므로 경계층 높이·습도에 따라 지상 농도와의 관계가 달라집니다."

