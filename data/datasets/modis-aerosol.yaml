# ─────────────────────────────────────────────────────────────
# MODIS 에어로졸 MOD04_L2·MYD04_L2(10 km)·MOD04_3K(3 km)·MOD08 L3 에어로졸 C6.1 — 데이터셋 정보 파일
# 위성 탭(에어로졸·대기 성분). Dark Target·Deep Blue 두 알고리즘과 결합 AOD를 한 페이지에서 다룹니다.
# Terra·Aqua 궤도 표류(통과 시각 변화)와 위성 종료가 핵심 주의사항입니다. 후속 VIIRS 에어로졸은 viirs-aerosol.yaml.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: modis-aerosol
name: "MODIS Aerosol (MOD04·MOD08)"
full_name: MODIS/Terra·Aqua Aerosol 5-Min L2 Swath 10km·3km (MOD04_L2·MYD04_L2·MOD04_3K·MYD04_3K) 및 MOD08/MYD08 L3 1° 에어로졸 Collection 6.1 (MODIS Dark Target·Deep Blue 에어로졸 광학두께)
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 10
domains: [대기, 에어로졸, 원격탐사]
provider: NASA GSFC MODIS 대기팀(Dark Target·Deep Blue 알고리즘 팀) / NASA LAADS DAAC (MODAPS)

status: deprecated
status_note: >-
  Collection 6.1이 지금도 매일 생산되고 있지만(2026-10-13 확인 시 MOD08_D3는 10월 9일 자료까지), Terra·Aqua가 연료 한계로 궤도를 벗어나 통과 시각이 바뀌고 있고
  NASA는 Terra 과학 운용이 2027년 2월, Aqua가 2027년 9월에 끝날 것으로 내다봅니다. LAADS DAAC는 VIIRS 유사 제품(Deep Blue AERDB·Dark Target AERDT)으로 옮기라고 권고하며,
  운용이 끝난 뒤 최종 보정(v8.0)으로 마지막 재처리를 하겠다고 밝혔습니다. 2026-10-13 기준 MODIS 대기 산출물은 CMR에 Version 6.1만 있습니다.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra(MOD04·MOD08)는 2000-02-24부터, Aqua(MYD04·MYD08)는 2002-07-04부터입니다. 2026-10-13 확인 시 LAADS에는 2026년 10월 초 자료(MOD08_D3 A2026282)까지 있습니다.
    C6.1은 Terra가 2017년 9~12월, Aqua가 2018년 1~3월에 전 기간 재처리되었고, 2018년 4월 30일 이후로는 C6.1만 생산됩니다. Terra·Aqua 운용이 끝나면 새 자료는 나오지 않습니다.

resolution:
  spatial_short: "10 km (0.09°)"
  temporal_short: "1일"
  spatial: >-
    L2 스와스: 직하점 10 km(10×10 화소 묶음, MOD04_L2·MYD04_L2), 직하점 3 km(Dark Target 전용, MOD04_3K·MYD04_3K) — 직하에서 멀어질수록 커짐 /
    L3: 전지구 1°×1° 등위경도 격자(360×180, MOD08_D3·E3·M3)
  vertical: 기주(column) 전체 적분값(에어로졸 광학두께) — 연직 분포 정보 없음
  temporal: >-
    L2는 5분 단위 그래뉼(궤도 스와스), 위성마다 하루 1회 주간 관측(고위도는 여러 번) / L3 일(D3)·8일(E3)·월(M3).
    설계상 적도 통과 시각은 Terra 10:30(하강), Aqua 13:30(상승) 지방시이지만 궤도 표류로 바뀌었습니다.

coverage:
  short: 전지구
  note: "주간 맑은 하늘만, 눈·얼음 위 제외"
update: 매일 (L3 일자료는 관측 다음 날 무렵), 8일·월 자료는 구간 종료 후. 준실시간(NRT)판은 LANCE에서 별도 제공
license: NASA EOSDIS 자료 이용 정책에 따라 제한 없이 공개된 무료 자료입니다. 내려받기(HTTPS·OPeNDAP 포함)에는 무료 NASA Earthdata 로그인이 필요하며, 데이터셋 DOI 인용을 요청합니다.
account_required: true

summary: >-
  MODIS 가시·근적외 반사도로 구한 맑은 하늘 에어로졸 광학두께(AOD) 자료로, 알고리즘이 다른 두 계열을 한 파일에 함께 담습니다.
  Dark Target(DT)은 해양과 식생으로 어두운 육지에서, Deep Blue(DB)는 사막처럼 밝은 지면을 포함한 모든 육지에서 산출하며, 두 결과를 합친 결합 AOD(`AOD_550_Dark_Target_Deep_Blue_Combined`)도 제공합니다.
  Collection 6.1에서는 DT의 도시 지역 지표 반사도 처리와 DB의 화소별 불확실성 추정이 개선되었습니다. 10 km 표준 L2, 대기질 연구용 3 km DT L2, 1° 격자 L3(일·8일·월)가 있으며,
  Terra(오전)·Aqua(오후) 판이 따로 있습니다.

time_convention:
  summary: >-
    L2(MOD04)는 위성이 지나간 순간의 맑은 하늘 관측값이며, 반사광을 쓰므로 주간에만 값이 있습니다. 파일 이름의 시각(AYYYYDDD.HHMM)은 5분 그래뉼의 시작 시각(UTC)입니다.
    L3 일자료(MOD08_D3)는 그날 L2 화소를 1° 칸마다 모은 통계(평균·표준편차·QA 가중 평균 등)이고, 8일(E3)·월(M3)은 일자료 평균값들의 평균(`_Mean_Mean`)입니다.
  points:
    - "설계상 Terra는 지방시 10:30에 하강, Aqua는 13:30에 상승하며 적도를 지나는 주간 관측입니다. 같은 위성이라도 스와스 안 위치와 위도에 따라 화소별 관측 시각이 다르며, `Scan_Start_Time` 변수로 확인할 수 있습니다."
    - "궤도 표류: Terra는 2020년 2월 27일 마지막 경사각 조정 뒤 점점 이른 시각으로 옮겨 2022년 가을 10:15에 이르렀고, Aqua는 2021년 3월 8일 마지막 조정 뒤 늦어져 2026년 8월 무렵 약 15:50으로 예상되었습니다. 에어로졸은 하루 중 변화와 태양 고도(반사 기하)의 영향을 받으므로 장기 추세에 주의하세요."
    - "L3 일자료는 UTC 날짜 기준이지만, C6부터 날짜변경선 부근의 빈틈·중복을 줄이려고 앞뒤 최대 3시간까지 그래뉼을 넓혀 넣습니다(L3 ATBD)."
    - "8일(E3)은 1월 1일부터 시작하는 연속 8일 일자료로 만들며 연말 마지막 구간은 다음 해 1월 초로 넘어갈 수 있습니다. 월(M3)은 그달 일자료 전체로 만들고, C6.1 에어로졸 월값은 유효한 날이 3일 이상인 칸만 남깁니다."
    - "`_Mean`은 모든 L2 화소를 같은 가중치로 평균한 값이고, `_QA_Mean`은 L2 신뢰도 플래그(3=3배, 2=2배, 1=1배, 0=제외)로 가중한 평균입니다. L3 ATBD 표에 따르면 에어로졸의 8일·월 값(`_Mean_Mean`)은 각 일평균에 같은 가중치를 줍니다(구름·수증기는 화소 수 가중)."
    - "준실시간(NRT, LANCE)판은 확정판보다 빨리 나오는 대신 확정판(LAADS) 처리와 별도로 만들어지므로 값이 다를 수 있습니다. 연구용 시계열에는 확정판을 쓰세요."
  source: https://atmosphere-imager.gsfc.nasa.gov/sites/default/files/ModAtmo/L3_ATBD_C6_C61_2019_02_20.pdf
  source_name: "MODIS Atmosphere L3 Global Gridded Product User's Guide & ATBD (C6·C6.1) + MOD04_L2 컬렉션 설명(CMR) + NASA Terra 기사·LP DAAC Aqua 궤도 계획"

variables:
  note: >-
    CMR 변수 목록(UMM-Var)과 C6.1 문서 기준 SDS 이름입니다. 파일은 HDF-EOS2(HDF4)이고 정수로 저장되므로 실제 값 = scale_factor × (저장값 − add_offset)입니다(MODIS 대기 L3 ATBD 정의, add_offset을 '뺍니다').
    AOD는 무차원이며 550 nm(0.55 µm) 기준입니다. MYD(Aqua) 파일도 변수 이름이 같습니다.
  full_list: https://atmosphere-imager.gsfc.nasa.gov/products/aerosol
  groups:
    - name: L2 스와스 10 km (MOD04_L2·MYD04_L2) · 3 km (MOD04_3K, DT만)
      kind: instant
      period: 통과 시각
      items:
        - text: "DT 해양·육지 에어로졸 광학두께 550 nm(권장 품질만) — `Optical_Depth_Land_And_Ocean` (무차원)"
          std: [aerosol]
          note: 해양은 QA 1~3, 육지는 QA 3인 값만 담은 과학 분석용 필드. 3 km 파일에도 같은 이름으로 있음
        - text: "DT 해양·육지 에어로졸 광학두께 550 nm(모든 품질) — `Image_Optical_Depth_Land_And_Ocean` (무차원)"
          std: [aerosol]
          note: QA 0~3을 모두 담은 영상 표출용 필드. 정량 분석에는 쓰지 않음
        - text: "DT·DB 결합 에어로졸 광학두께 550 nm — `AOD_550_Dark_Target_Deep_Blue_Combined` (무차원)"
          std: [aerosol]
          note: 해양은 DT, 육지는 DT·DB·둘의 혼합 중 하나를 고른 값(알고리즘 표시 변수로 확인). 10 km 파일에만 있음
        - "결합 AOD 알고리즘 표시 — `AOD_550_Dark_Target_Deep_Blue_Combined_Algorithm_Flag` (0=DT, 1=DB, 2=혼합)"
        - "결합 AOD 신뢰도 플래그 — `AOD_550_Dark_Target_Deep_Blue_Combined_QA_Flag` (0=신뢰 없음·채움, 1=보통, 2=좋음, 3=매우 좋음)"
        - text: "DB 육지 에어로졸 광학두께 550 nm(QA 2·3) — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Best_Estimate` (무차원)"
          std: [aerosol]
        - "DB 육지 AOD 추정 불확실성(1σ) — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Estimated_Uncertainty` (무차원)"
        - "DB 신뢰도 플래그 — `Deep_Blue_Aerosol_Optical_Depth_550_Land_QA_Flag` (0~3)"
        - "DB 육지 옹스트롬 지수 — `Deep_Blue_Angstrom_Exponent_Land` (무차원)"
        - "DT 해양 옹스트롬 지수 550/860 nm — `Angstrom_Exponent_1_Ocean` (무차원)"
        - "DT 해양·육지 품질 플래그 — `Land_Ocean_Quality_Flag` (0=나쁨, 1=보통, 2=좋음, 3=매우 좋음)"
        - text: "주사 시작 시각 — `Scan_Start_Time` (초, TAI 시간 기준)"
          note: 화소별 관측 시각. 3 km 파일은 그래뉼 안에서 값이 최대 약 12분까지 어긋나는 알려진 오류가 있음
    - name: L3 일자료 1° (MOD08_D3·MYD08_D3)
      kind: mean
      period: 일 (UTC 날짜, 앞뒤 최대 3시간 확장)
      items:
        - text: "DT·DB 결합 에어로졸 광학두께 550 nm 일평균 — `AOD_550_Dark_Target_Deep_Blue_Combined_Mean` (무차원)"
          std: [aerosol]
        - text: "DT 해양·육지 에어로졸 광학두께 550 nm 일평균 — `Aerosol_Optical_Depth_Land_Ocean_Mean` (무차원)"
          std: [aerosol]
        - text: "DB 육지 에어로졸 광학두께 550 nm 일평균 — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Mean` (무차원)"
          std: [aerosol]
        - text: "DT 육지 에어로졸 광학두께 QA 가중 일평균(470·550·660 nm) — `Aerosol_Optical_Depth_Land_QA_Mean` (무차원)"
          std: [aerosol]
          note: L2 신뢰도 플래그로 가중한 평균
        - text: "결합 AOD 일최댓값 — `AOD_550_Dark_Target_Deep_Blue_Combined_Maximum` (무차원)"
          kind: max
        - text: "DT 해양·육지 AOD 화소 수 — `Aerosol_Optical_Depth_Land_Ocean_Pixel_Counts` (개)"
          kind: accum
    - name: L3 8일·월 자료 1° (MOD08_E3 8일 / MOD08_M3 월)
      kind: mean
      period: 8일 또는 월 (일평균의 평균)
      items:
        - text: "DT·DB 결합 에어로졸 광학두께 550 nm — `AOD_550_Dark_Target_Deep_Blue_Combined_Mean_Mean` (무차원)"
          std: [aerosol]
          note: 일자료 평균값들을 다시 평균한 값
        - text: "DT 해양·육지 에어로졸 광학두께 550 nm — `Aerosol_Optical_Depth_Land_Ocean_Mean_Mean` (무차원)"
          std: [aerosol]
        - text: "DB 육지 에어로졸 광학두께 550 nm — `Deep_Blue_Aerosol_Optical_Depth_550_Land_Mean_Mean` (무차원)"
          std: [aerosol]
        - text: "결합 AOD 일평균의 기간 최댓값 — `AOD_550_Dark_Target_Deep_Blue_Combined_Mean_Max` (무차원)"
          kind: max

access:
  - name: LAADS DAAC (검색·주문·직접 받기)
