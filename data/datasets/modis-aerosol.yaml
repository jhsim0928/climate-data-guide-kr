transitions:
  - from: MODIS 에어로졸 C6 (MOD04·MOD08)
    to: MODIS 에어로졸 C6.1
    status: completed
    date: "2018-03"
    summary: >-
      입력 L1B 보정 문제를 고치고 L2·L3 일부를 개선한 판입니다. Terra는 2017년 9~12월(10월 15일 공개), Aqua는 2018년 1~3월에 전 기간 재처리되었고,
      2018년 4월 30일 이후로는 C6.1만 생산됩니다. DT는 도시 지역 지표 반사도 처리가, DB는 화소별 불확실성 추정이 새로 들어갔습니다.
    changes:
      - aspect: 입력 L1B 보정
        before: C6 L1B
        after: 입력 L1B의 문제를 고친 C6.1 L1B
      - aspect: Dark Target
        before: C6 DT
        after: 도시 지역 산출 개선
      - aspect: Deep Blue
        before: C6 DB (불확실성 없음)
        after: 화소별 추정 불확실성(`Deep_Blue_Aerosol_Optical_Depth_550_Land_Estimated_Uncertainty`) 추가
      - aspect: 생산
        before: C6 (2018-04-30까지 병행 생산)
        after: C6.1 단독 생산
    impacts:
      - C6과 C6.1을 한 시계열에 섞지 말고 전 기간을 C6.1로 다시 받으세요.
    sources:
      - name: MODIS Atmosphere — Data Versions (컬렉션 개요)
        url: https://atmosphere-imager.gsfc.nasa.gov/collections/overview
      - name: C6.1 Dark Target 변경 문서
        url: https://modis-atmos.gsfc.nasa.gov/sites/default/files/ModAtmo/C061_Aerosol_Dark_Target_v2.pdf
      - name: C6.1 Deep Blue 변경 문서
        url: https://modis-atmos.gsfc.nasa.gov/sites/default/files/ModAtmo/modis_deep_blue_c61_changes2.pdf
  - from: MODIS 에어로졸 MOD04·MOD08 C6.1
    to: VIIRS Deep Blue AERDB·Dark Target AERDT
    to_id: viirs-aerosol
    status: planned
    summary: >-
      같은 Deep Blue·Dark Target 알고리즘을 VIIRS(Suomi NPP·NOAA-20·NOAA-21)에 적용한 연속성 제품이 후속입니다. 두 알고리즘이 별도 제품(AERDB·AERDT)으로 나뉘고,
      DB에는 해양 알고리즘(SOAR)이 붙어 육지·해양을 함께 산출하며, 결합 AOD와 8일 L3는 없습니다. 같은 오후 궤도인 Aqua를 주로 잇고, Terra 오전 관측을 잇는 VIIRS는 없습니다.
      Terra·Aqua가 2027년 운용을 마치면 전환이 완료됩니다.
    changes:
      - aspect: 제품 구성
        before: "한 파일(MOD04_L2)에 DT·DB·결합 AOD / L3 MOD08 D3·E3·M3"
        after: "AERDB_L2·D3·M3(DB 육지 + SOAR 해양), AERDT_L2(DT 육지·해양, 2026-10 기준 LAADS에 L3 없음). 결합 AOD 없음"
      - aspect: 화소 크기
        before: "직하 10 km(10×10 화소) / 3 km(DT)"
        after: "직하 6 km(VIIRS M밴드 750 m 화소 8×8)"
      - aspect: 그래뉼·스와스
        before: 5분 그래뉼
        after: 6분 그래뉼, 스와스가 MODIS보다 넓음
      - aspect: 통과 시각
        before: "Terra 10:30 하강, Aqua 13:30 상승 (2020~2021년 이후 표류)"
        after: "13:30 상승 (Suomi NPP·NOAA-20·NOAA-21 모두 오후 궤도)"
      - aspect: 단파적외 밴드
        before: MODIS 2.13 µm
        after: VIIRS 2.25 µm (파장 차이로 지표 반사도 관계가 달라짐)
      - aspect: 변수 이름·형식
        before: "`Optical_Depth_Land_And_Ocean`, `AOD_550_Dark_Target_Deep_Blue_Combined` 등, HDF-EOS2(HDF4)"
        after: "`Aerosol_Optical_Thickness_550_Land_Ocean_Best_Estimate`(DB), `geophysical_data/Optical_Depth_Land_And_Ocean`(DT), NetCDF-4"
      - aspect: 기간
        before: "Terra 2000-02~ / Aqua 2002-07~"
        after: "Suomi NPP 2012-03~(2026-11-02 전달 종료) / NOAA-20 2018~ / NOAA-21 2023-02~"
    impacts:
      - "MODIS와 VIIRS AOD 사이에는 대체로 일정한 차이(오프셋)가 있습니다. Sawyer et al. (2025)에 따르면 DT에서 NOAA-20은 Aqua와 거의 같고, Terra는 약 0.015 높으며, Suomi NPP가 가장 높습니다. 이어 붙일 때는 겹치는 기간에 차이를 확인하세요."
      - Sawyer et al. (2020)은 DT 차이의 상당 부분이 보정보다 표본(화소 크기·구름 마스크·스와스 폭) 차이에서 온다고 보고했습니다. 같은 날 두 센서가 모두 산출한 칸만 비교하는 것이 안전합니다.
      - "MODIS 결합 AOD를 쓰던 분석은 VIIRS에서 DB(AERDB)나 DT(AERDT) 중 하나를 골라야 합니다. 일·월 L3가 필요하면 현재 AERDB D3·M3만 있습니다."
      - Terra 오전 관측의 후속은 없으므로, Terra 기반 시계열은 Aqua·VIIRS 오후 관측과 하루 중 시각이 다르다는 점을 고려하세요.
    sources:
      - name: Sawyer et al. (2020), Remote Sensing — Continuing the MODIS Dark Target Aerosol Time Series with VIIRS
        url: https://doi.org/10.3390/rs12020308
      - name: Sawyer et al. (2025), Frontiers in Environmental Science — 갱신된 VIIRS DT와 MODIS 연속성
        url: https://doi.org/10.3389/fenvs.2025.1602145
      - name: Sayer et al. (2019), JGR — MODIS C6.1·VIIRS Deep Blue 일관성
        url: https://doi.org/10.1029/2018JD029598
      - name: LAADS DAAC — MODIS to VIIRS Transition
        url: https://ladsweb.modaps.eosdis.nasa.gov/learn/modis-to-viirs-transition

notices:
  - date: "2026-08-03"
    level: info
    title: LAADS Classic API 2026-08-31 폐지 — API-V2로 전환
    body: >-
      LAADS DAAC는 예전 웹 서비스 Classic API를 2026년 8월 31일에 폐지한다고 공지했습니다. 자동 내려받기 스크립트·프로그램은 JSON/REST 방식의 LAADS API-V2로 옮겨야 합니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199517
  - date: "2026-04-30"
    level: info
    title: LAADS OPeNDAP 접속에 Earthdata 로그인 필요
    body: >-
      2026년 4월 30일부터 LAADS OPeNDAP 서비스도 NASA Earthdata 로그인 인증을 거쳐야 쓸 수 있습니다. 인증 없이 OPeNDAP 주소로 읽던 스크립트는 자격 증명을 추가해야 합니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199527
  - date: "2026-03-31"
    level: info
    title: Terra 이상으로 MODIS 대기(standby) 모드 전환 — 2026-03-26~27 자료 의심·불량
    body: >-
      2026년 3월 26일 20:00 UTC께 Terra 위성 이상으로 MODIS가 대기 모드로 바뀌었다가 27일 오후 과학 모드로 돌아왔습니다. 보정팀은 3월 26일 20:00 UTC부터
      27일 19:30 UTC까지의 자료를 의심 또는 불량으로 표시했고, 그 이후 자료는 써도 된다고 밝혔습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199533
  - date: "2026-03-20"
    level: warning
    title: NASA, Terra 과학 운용 종료를 2027년 2월·Aqua를 2027년 9월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월에
      과학 운용이 끝날 것으로 전망하며, 그때까지는 운용을 계속한다고 밝혔습니다. 그 뒤에는 MOD04·MYD04·MOD08·MYD08 새 자료가 나오지 않습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2026-03-18"
    level: info
    title: MODIS L1B·지오로케이션 Version 7.0 공개 — 대기 산출물은 아직 C6.1
    body: >-
      LAADS DAAC가 MODIS 보정 복사량(L1B)·지오로케이션 V7.0을 공개하고, V6.1 L1 자료는 2026-09-30에 내린다고 공지했습니다. 2026-10-13 확인 시
      MOD04·MOD08 대기 산출물은 CMR에 Version 6.1만 있으며, V7 L1B로 만든 에어로졸 산출물의 공개 일정은 공식 공지로 확인되지 않았습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 시작
    body: >-
      NASA LAADS DAAC는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어가며, 두 위성이 설계 궤도를 벗어나 통과 시각이 바뀌고 있어 자료에 영향을 줄 수 있다고 공지했습니다.
      MODIS 자료 수집이 멈추면 마지막 재처리를 하며, 사용자는 VIIRS 유사 산출물을 쓰라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

