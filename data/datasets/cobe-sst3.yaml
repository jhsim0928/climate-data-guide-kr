notices:
  - date: "2026-02-13"
    level: info
    title: JMA, 차기 장기재분석 해면 경계조건 후보로 COBE-SST3H 시험 결과 발표
    body: >-
      JMA 장기재분석 추진 간담회 자료에서 COBE-SST3를 'COBE-SST2의 후계'로 소개하고, 위성 결합판 COBE-SST3H를 MGDSST 대신 넣은
      2014년 여름 시험 결과(태풍 통과 시 SST 하강 표현 개선 등)를 보고했습니다. 채택이나 현업화 일정은 결정 사항으로 적혀 있지 않습니다.
    source: https://www.jma.go.jp/jma/kishou/shingikai/kondankai/reanalysis_kondankai/R07/r7-siryo3-2.pdf
  - date: "2025-09-22"
    level: info
    title: 일별·월별 파일 2024년까지 추가 (서버 목록 기준)
    body: >-
      MRI 서버의 daily/·monthly/·1x1/monthly/ 폴더에 2021~2024년 파일이 올라왔고, 2011~2020년 파일도 같은 날 다시 올라왔습니다.
      별도의 공식 공지 문서는 찾지 못했으며, 0.25° 섭동 앙상블과 COBE-SST3H는 여전히 2020년까지입니다.
    source: https://climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/cobe-sst3/daily/
  - date: "2025-09"
    level: info
    title: 개발자 안내 — 최근 연도 연장과 준현업판 개발 계획
    body: >-
      NCAR Climate Data Guide의 개발자 안내(Masayoshi Ishii, 2025년 9월)는 자료가 2020년까지이며 가능할 때 최신 연도로 연장하고
      준현업(near-operational)판을 개발 중이라고 밝혔습니다. 구체적인 일정은 없습니다.
    source: https://climatedataguide.ucar.edu/climate-data/sst-data-cobev3-centennial-situ-observation-based-estimates-version-3
  - date: "2024-10-25"
    level: info
    title: COBE-SST3 논문 온라인 선공개 (JMSJ)
    body: >-
      Ishii et al.의 COBE-SST3 논문이 J. Meteor. Soc. Japan에 온라인 선공개되었습니다(정식 게재 2025년 103권 1호).
      논문은 분석 자료를 MRI 연구 자료 서버에서 NetCDF로 제공한다고 밝혔습니다.
    source: https://www.jstage.jst.go.jp/article/jmsj/103/1/103_2025-002/_article

