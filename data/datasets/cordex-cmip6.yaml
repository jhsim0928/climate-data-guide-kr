# ─────────────────────────────────────────────────────────────
# CORDEX-CMIP6 — 데이터셋 정보 파일
# WCRP CORDEX: CMIP6 전지구 모델을 지역기후모델(RCM)로 역학 다운스케일링한 대륙별 영역 시뮬레이션
# 2026-10-16 확인: ESGF STAC 색인에 일부 영역(유럽·북미 등) 공개, 동아시아(EAS)는 아직 없음
# ─────────────────────────────────────────────────────────────
id: cordex-cmip6
name: CORDEX-CMIP6
full_name: Coordinated Regional Climate Downscaling Experiment driven by CMIP6 (CMIP6 기반 WCRP 지역기후 다운스케일링 국제 공동실험)
category: model_output
domain: model
group: 지역 다운스케일링
order: 10
domains: [대기, 육지, 극지]
provider: WCRP CORDEX (각 지역 모델링 그룹 생산, ESGF 배포)

status: active
status_note: >-
  2026-10-16 확인 시 ESGF STAC 색인(discovery.west.esgf.io, 컬렉션 CORDEX-CMIP6)에 EUR-12·NAM-12·CEUX-3·CAM-25·AUS-25·MED-12·NAM-25
  영역 자료(약 3만 1천 개 데이터셋)가 올라와 있어 일부 영역은 내려받을 수 있습니다. 그러나 동아시아(EAS-12·EAS-25) 자료는 아직 색인에 없고,
  CORDEX 시뮬레이션 현황 페이지에는 "CORDEX-CMIP6 data are not yet available on ESGF"라는 안내가 그대로 남아 있습니다.
  공개는 영역·모델링 그룹별로 순차 진행 중입니다.

period:
  start: "1950"
  end: "2100"
  note: >-
    실험 설계(2021-05-18)에 따라 과거 실험(historical)은 1950–2014년(최소 1960–2014년), 미래 시나리오는 2015–2100년(SSP3-7.0·SSP1-2.6 우선,
    SSP2-4.5·SSP5-8.5 권장), ERA5 구동 평가 실험(evaluation)은 1979–2020년 이상입니다. 실제 기간은 시뮬레이션마다 다르니 현황표에서 확인하세요.

resolution:
  spatial_short: "모델마다 다름"
  temporal_short: "1시간"
  spatial: >-
    영역별 CORDEX 표준 격자 — 회전극 위경도 0.11°(EAS-12 등)·0.22°(EAS-25 등)·0.44°(EAS-50 등)와 정규 위경도 i-격자(EAS-50i 0.5° 등).
    영역 이름의 숫자는 CORDEX에서 쓰는 세 해상도(50·25·12 km) 중 가장 가까운 격자 간격입니다. 회전극 격자를 쓰는 RCM은 CORDEX 격자를 그대로 따르도록
    강력 권장되며, Lambert 등 투영 격자나 비정형 격자(ICON 등) 원격자를 쓰는 모델도 있습니다. 실험 설계의 주 목표 격자 간격은 25 km와 12.5 km이고,
    대류허용(CPRCM) 실험은 약 3 km(예: CEUX-3, 0.0275° 회전극 격자)입니다.
  vertical: 지표·단일면 변수 + 기압면 변수(Tier 1은 기압면 10개 권장, 기본 6시간 간격)
  temporal: "1시간·3시간·6시간·일·월 + 고정장(fx). CORE 변수는 1시간 보관이 권장되지만 필수가 아니어서 일·월 평균만 내는 그룹도 있습니다"

coverage:
  short: 대륙별 영역
  note: >-
    CORDEX 14개 영역 — 남미(SAM)·중미(CAM)·북미(NAM)·유럽(EUR)·지중해(MED)·중동·북아프리카(MNA)·아프리카(AFR)·남아시아(WAS)·
    중앙아시아(CAS)·동아시아(EAS)·동남아시아(SEA)·오스트랄라시아(AUS)·북극(ARC)·남극(ANT). 한반도는 동아시아(EAS, CORDEX Region 7) 영역에 들어가며,
    EAS 회전극 격자의 북극점은 경도 -64.78°, 위도 77.61°입니다(EAS-12 812×668, EAS-25 396×251 격자점). 전지구 자료가 아닙니다.
update: 모델링 그룹이 시뮬레이션을 마치고 보관 규격 점검을 통과하는 대로 ESGF에 순차 공개 (정해진 주기 없음)
license: >-
  CORDEX-CMIP6 이용 약관은 CC BY 4.0 사용을 강력 권장하며, 그룹에 따라 더 제한적인 라이선스가 있을 수 있어 모델별 라이선스는 등록 모델 목록(source_id)에서 확인합니다.
  2026-10-16 확인 시 등록 모델 54개 모두 CC BY 4.0입니다. 논문에는 사사(acknowledgement) 문장이 필요합니다.
account_required: false

summary: >-
  CORDEX-CMIP6는 WCRP 지역기후 다운스케일링 공동실험(CORDEX)이 CMIP6 전지구 기후모델(GCM)과 ERA5 재분석을 경계조건으로
  여러 지역기후모델(RCM)을 돌려 만든 대륙별 영역의 고해상도 기후 시뮬레이션입니다. 영역마다 지역 연구 공동체가 구동 GCM과 RCM 조합(GCM–RCM 행렬)을 정해
  과거(1950–2014)와 SSP 시나리오(2015–2100)를 수행하며, 지역 기후변화 전망·영향평가·적응 연구에 쓰입니다.
  CMIP5 기반 CORDEX(CORDEX-CMIP5)의 후속 세대이며, 한국 연구자는 주로 동아시아 영역(EAS-12·EAS-25)을 씁니다.

time_convention:
  summary: >-
    평균·최대·최소·합처럼 구간을 대표하는 변수는 시간 좌표가 구간의 가운데(중간점)에 찍히고 time_bnds로 구간 경계를 줍니다.
    1시간·6시간 순간값 변수(예: 1시간 기온, 6시간 기압면 변수)는 정시 값입니다. 모든 시각은 UTC입니다.
  points:
    - "구간 변수의 시각은 중간점입니다 (예: 1시간 자료 0.5Z·1.5Z…, 일 자료 12Z, 월 자료 1월 16일 12Z·2월 15일 0Z). 일·월 구간은 UTC 00:00에 시작·끝납니다."
    - "모든 시간 의존 변수에 cell_methods 속성이 있습니다. 같은 tas라도 1시간 자료는 'time: point'(순간값), 일·월 자료는 'time: mean'입니다."
    - "일 값은 1시간 이하 출력을 평균한 것이고(최대·최소 변수와 일조시간 제외), 월 값은 일 값을 평균한 것입니다. 월 tasmax·tasmin은 '일 최고(최저)의 월평균'입니다."
    - "시간 단위는 'days since 1950-01-01'(1950년 이전 구간은 1850-01-01 허용). 달력은 proleptic_gregorian 또는 standard를 강력 권장하지만, 구동 GCM에서 물려받은 360_day·365_day도 허용됩니다."
  source: https://wcrp-cordex.github.io/archive-specifications/CORDEX-CMIP6_archiving_specifications_DD/
  source_name: CORDEX-CMIP6 Archiving Specifications for Dynamical Downscaling (v4) + CORDEX-CMIP6 data request

variables:
  note: >-
    CORDEX-CMIP6 데이터 요청표(기본 영역용) 기준입니다. CORE(필수)는 가장 많이 쓰는 15개 변수와 고정장 2개이고, Tier 1(강력 권장)·Tier 2(선택)는
    영역 공동체가 정합니다. 변수명은 파일 속 이름(out_name), 단위는 요청표 표기입니다.
  full_list: https://wcrp-cordex.github.io/data-request-table/dreq_default.html
  groups:
    - name: 일 (day) — CORE
      kind: mean
      period: 일
      items:
        - {text: "지상 기온 — `tas` (K)", std: [t2m]}
        - text: "일 최고기온 — `tasmax` (K)"
          kind: max
        - text: "일 최저기온 — `tasmin` (K)"
          kind: min
        - "강수 — `pr` (kg m-2 s-1)"
        - "증발(승화·증산 포함) — `evspsbl` (kg m-2 s-1)"
        - "지상 비습 — `huss` (1)"
        - "지상 상대습도 — `hurs` (%)"
        - "해면기압 — `psl` (Pa)"
        - {text: "지상 풍속 — `sfcWind` (m s-1)", std: [wind10]}
        - {text: "지상 동서 바람 — `uas` (m s-1)", std: [wind10]}
        - {text: "지상 남북 바람 — `vas` (m s-1)", std: [wind10]}
        - "지표 하향 단파복사 — `rsds` (W m-2)"
    - name: 월 (mon) — CORE
      kind: mean
      period: 월
      items:
        - {text: "지상 기온 — `tas` (K)", std: [t2m]}
        - text: "일 최고기온의 월평균 — `tasmax` (K)"
          note: "cell_methods 'time: maximum within days time: mean over days'"
        - text: "일 최저기온의 월평균 — `tasmin` (K)"
          note: "cell_methods 'time: minimum within days time: mean over days'"
        - "강수 — `pr` (kg m-2 s-1)"
        - "지표 기압 — `ps` (Pa)"
        - "전운량 — `clt` (%)"
        - "지표 하향 단파복사 — `rsds` (W m-2)"
        - "지표 하향 장파복사 — `rlds` (W m-2)"
    - name: 1시간 (1hr) — CORE
      kind: instant
      period: 1시간
      items:
        - {text: "지상 기온 — `tas` (K)", std: [t2m]}
        - text: "강수 — `pr` (kg m-2 s-1)"
          kind: mean
        - "지상 비습 — `huss` (1)"
        - "해면기압 — `psl` (Pa)"
        - {text: "지상 동서 바람 — `uas` (m s-1)", std: [wind10]}
        - {text: "지상 남북 바람 — `vas` (m s-1)", std: [wind10]}
        - text: "지표 하향 단파복사 — `rsds` (W m-2)"
          kind: mean
    - name: 6시간 기압면 (6hr) — Tier 1
      kind: instant
      period: 6시간
      items:
        - "850 hPa 기온 — `ta850` (K)"
        - "500 hPa 기온 — `ta500` (K)"
        - "850 hPa 지위고도 — `zg850` (m)"
        - "500 hPa 지위고도 — `zg500` (m)"
        - "850 hPa 비습 — `hus850` (1)"
        - "850 hPa 동서 바람 — `ua850` (m s-1)"
        - "850 hPa 남북 바람 — `va850` (m s-1)"
    - name: 고정장 (fx) — CORE
      kind: static
      items:
        - "지표 고도 — `orog` (m)"
        - "육지 비율 — `sftlf` (%)"

access:
  - name: ESGF STAC 색인 — CORDEX-CMIP6 컬렉션 (discovery.west.esgf.io)
    url: https://discovery.west.esgf.io/collections/CORDEX-CMIP6
    method: STAC API 검색(pystac-client 등) → 항목마다 연결된 HTTPS 파일(NetCDF) 다운로드
    note: >-
      2026-10-16 확인 시 컬렉션 이름은 대문자 "CORDEX-CMIP6"으로 검색해야 항목이 나옵니다(소문자 cordex-cmip6 컬렉션은 비어 있음).
      파일은 DKRZ(esgf1.dkrz.de)·Ouranos(esgf.ouranos.ca) 등 데이터 노드의 HTTPS 주소로 연결되며, 항목 정보에는 접근 제한 표시가 없습니다(직접 내려받아 보지는 못함).
      동아시아(EAS) 자료는 아직 없습니다.

example:
  lang: python
  note: >-
    ESGF STAC 색인에서 영역·변수로 항목을 찾아 첫 파일을 받는 예시입니다. 필터의 속성 이름은 컬렉션 queryables(cordex-cmip6:domain_id 등)를 따릅니다.
    EAS 자료가 공개되면 domain_id만 'EAS-12'·'EAS-25'로 바꾸면 됩니다.
  code: |
    # pip install pystac-client xarray netCDF4
    import urllib.request
    from pystac_client import Client
    import xarray as xr

    client = Client.open("https://discovery.west.esgf.io")
    search = client.search(
        collections=["CORDEX-CMIP6"],
        filter="\"cordex-cmip6:domain_id\" = 'NAM-12' AND \"cordex-cmip6:variable_id\" = 'tas'",
        filter_lang="cql2-text",
        max_items=5,
    )
    items = list(search.items())
    for item in items:
        print(item.id)

    # 항목의 asset 이름이 파일 이름입니다 (globus 등 .nc가 아닌 asset은 건너뜀)
    url = next(a.href for k, a in items[0].assets.items() if k.endswith(".nc"))
    fname = url.split("/")[-1]
    urllib.request.urlretrieve(url, fname)
    ds = xr.open_dataset(fname)
    print(ds["tas"])

tips:
  - >-
    영역 이름 표기가 바뀌었습니다. CORDEX-CMIP5의 EAS-44·EAS-22·EAS-11(격자 간격 °)이 CORDEX-CMIP6에서는 EAS-50·EAS-25·EAS-12(가까운 km)로 불리며
    격자 정의는 같습니다(CORDEX 도메인 표). 같은 동아시아라도 EAS-25와 EAS-50은 격자 수와 남서쪽 기준점이 달라 영역 범위가 같지 않습니다.
  - >-
    동아시아 현황(2026-10-16 시뮬레이션 현황표): EAS-25는 한국 5개 기관(POSTECH COSMO-CLM5-0-9, KNU GRIMs3-2, NIMS-KMA HadGEM3-RA, UNIST RegCM4-6,
    PNU WRF400)이 UKESM1-0-LL(r15i1p1f2) 하나로 historical·SSP1-2.6·2-4.5·3-7.0·5-8.5를 완료(2022-12·2024-12)했고, EAS-12는 CORDEX-CORE로
    MOHC HadREM3-GA7-05·ICTP RegCM5-0·UNIST/IUM-FDU WRF461U가 EC-Earth3-Veg·MPI-ESM1-2-HR·NorESM2-MM과 ERA5 평가 실험을 진행 중입니다
    (ICTP RegCM5-0의 평가·historical은 2026-07 완료, SSP3-7.0은 진행 중, 나머지는 진행 중 또는 계획 단계 — 현황 CSV 기준).
    EAS-25는 구동 GCM이 하나라서 GCM 간 불확실성은 담지 못합니다.
  - >-
    파일은 영역·기관·구동 GCM·실험·구동 멤버·RCM·version_realization(vN-rM)·빈도·변수·버전(vYYYYMMDD) 단위로 나뉘고, 파일 하나에 변수 하나가 1년(1시간·일 자료) 등
    구간별로 들어 있습니다. 파일 이름 예: tas_EUR-12_<구동GCM>_<실험>_<멤버>_<기관>_<RCM>_v1-r1_day_<기간>.nc. STAC 항목의 latest·retracted 값으로
    최신 버전인지, 철회되지 않았는지 확인하세요.
  - >-
    대부분 RCM 원격자(회전극 위경도 rlat·rlon, 또는 Lambert 투영 x·y)로 제공되고 2차원 lat·lon 좌표가 함께 들어 있습니다. 투영 격자는 grid_mapping 변수(crs)를
    읽어야 하고, 바람은 격자 방향이 아니라 실제 동서·남북 성분입니다. 여러 RCM을 한 격자로 모을 때는 보존적 보간 등으로 다시 격자화하세요(완화 경계 구역은 이미 잘려 있음).
  - >-
    달력은 proleptic_gregorian·standard가 권장되지만 구동 GCM을 따라 360_day·365_day인 시뮬레이션도 있습니다. 여러 GCM–RCM 조합을 섞어 일 단위로 비교할 때 날짜 정렬에 주의하세요.
  - >-
    ESGF 정식 공개 전에 일부 그룹이 임시 서버(NCI THREDDS의 호주 영역, Ouranos의 NAM-12, DKRZ STAC의 EUR-12, DMI의 북극·남극 등)에 자료를 올려 두었습니다.
    목록은 CORDEX 시뮬레이션 현황 페이지의 데이터 서버 표에 있으며, 2026-10-16 확인 시 EAS용 임시 서버는 없습니다.

