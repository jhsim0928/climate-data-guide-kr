    CORDEX-CMIP6 이용 약관은 CORDEX-CMIP6을 가능하게 한 이들을 인용·사사하도록 요구합니다. 사사 문장은 WCRP, CORDEX 과학자문팀(SAT),
    CMIP6 담당 패널인 WGCM, 모델 출력을 만든 CORDEX 모델링 그룹, 구동 자료를 낸 CMIP6, 자료 보관·제공을 맡은 ESGF, 후원 기관에 감사하는 내용이며,
    ERA5 구동 실험을 쓰면 ECMWF ERA5/ERA5.1(CC BY 4.0) 문장도 넣습니다. 정확한 문구는 이용 약관 페이지에서 복사하세요. 데이터셋 단위 DOI는 아직 없고,
    ESGF 항목에는 PID(hdl:21.14103/…)가 붙어 있습니다.

notices:
  - date: "2026-09-11"
    level: info
    title: 역학 다운스케일링 보관 규격 v4 공개
    body: >-
      보관 규격 v4(DOI 10.5281/zenodo.22711462)가 나왔습니다. 품질 점검 도구(esgf-qa) 권장, CMOR 처리된 파일 예시 연결, CF title 속성 작성 규칙 제안이 추가되었습니다.
    source: https://wcrp-cordex.github.io/archive-specifications/CORDEX-CMIP6_archiving_specifications_DD/
  - date: "2026-05-27"
    level: info
    title: ESGF-NG 공개용 보관 규격 v3 공개
    body: >-
      곧 있을 ESGF Next Generation(ESGF-NG) 공개를 위한 CORDEX-CMIP6 역학 다운스케일링 보관 규격 v3가 나왔습니다. 공동체가 찾은 불일치를 고치고,
      해양 등 모델 구성요소별로 다른 격자로 공개하는 것을 허용했으며, 모든 출력 파일의 내부 구조를 마지막 단계에서 재압축(repack)하도록 강력 권장합니다.
    source: https://cordex.org/2026/05/27/new-version-v3-of-archiving-specifications-for-cordex-cmip6-dynamical-downscaling-released/
  - date: "2025-03-21"
    level: info
    title: 보관 규격 v2 공개 — project_id가 CORDEX-CMIP6로 바뀜
    body: >-
      ESGF 공개를 가능하게 하는 보관 규격 개정판이 나왔고, ESGF 규칙에 맞추어 project_id가 "CORDEX"에서 "CORDEX-CMIP6"로 바뀌었습니다.
    source: https://cordex.org/2025/03/21/new-version-of-archiving-specifications-for-cordex-cmip6-dynamical-downscaling-released/

