example:
  lang: python
  note: >-
    earthaccess로 OMNO2d V004 일자료를 받아 h5py로 읽는 예입니다. HDF-EOS5 내부 경로는 파일에서 이름으로 찾아 쓰도록 했습니다.
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="OMNO2d", version="004",
        temporal=("2024-01-01", "2024-01-31"),
    )
    files = earthaccess.download(results[:1], "./omi")

    with h5py.File(files[0], "r") as h:
        paths = []
        h.visit(lambda n: paths.append(n) if n.endswith("ColumnAmountNO2TropCloudScreened") else None)
        no2 = h[paths[0]][:].astype(float)          # (720 위도, 1440 경도), molecules cm-2
    no2[no2 < -1e29] = np.nan                       # 결측값 -1.26765e30
    print(paths[0], no2.shape, np.nanmean(no2))

tips:
  - "행 이상(row anomaly)은 2007년 6월 25일 시작해 2008년 5월, 2009년 1월 등 단계적으로 넓어졌고, 지금도 궤도 폭의 상당 부분(시기에 따라 최대 약 50%)이 영향을 받습니다. L2는 반드시 행 이상 플래그로 거르세요(NO2는 `XTrackQualityFlagsModified`가 0 또는 결측값인 화소만, SO2는 `Flag_RowAnomaly` = 0)."
  - "행 이상 때문에 2009년 이후 하루 전지구 덮임에 빈틈이 생겼습니다. 일자료 격자 결측은 구름이 아니라 행 이상 때문일 수 있으니, 월평균을 만들 때 표본 수 변화를 확인하세요."
  - "NO2 L2는 `VcdQualityFlags`의 최하위 비트가 0인 화소만 쓰라고 README가 권장합니다. 평균을 낼 때 음수 값도 빼지 말아야 계통 편향이 생기지 않습니다."
  - "SO2 PBL 컬럼은 구름 복사 비율 0.3 미만, 태양 천정각 65° 미만, 가장자리 행(0·59) 제외, 남대서양 이상대(`Flag_SAA`) 제외가 권장 조건입니다. 화산이 아니면 `ColumnAmountSO2_PBL`·`ColumnAmountSO2`를, 화산 분출은 높이에 맞는 TRL·TRM·TRU·STL을 고르세요."
  - "HCHO는 `main_data_quality_flag`가 'bad'인 화소는 쓰지 말고, 태양 천정각 70° 초과·구름 비율 0.4 초과·눈과 얼음 위 화소는 특히 조심하라고 README가 안내합니다. 단일 화소는 잡음이 커서 보통 며칠~한 달 평균으로 씁니다."
  - "OMTO3(오존)는 오류 플래그 0(양호)·1(태양 반사 보정)만 쓰라고 권고하며, 이렇게 거르면 행 이상 화소도 함께 빠집니다. 2022년 1월 11~28일 훙가 통가 분화 기간은 플래그가 강화되어 있습니다."
  - "OMI 값은 이른 오후 한 번의 관측입니다. 일변화가 큰 NO2를 지상 측정소 일평균과 비교할 때는 관측 시각을 맞추세요."
  - "V004 컬렉션 메타데이터는 아직 완전히 검증되지 않은 자료라고 밝히고 있습니다. 추세 연구 전에는 GES DISC 제품 페이지의 알려진 문제와 README를 확인하세요."

