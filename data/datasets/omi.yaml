notices:
  - date: "2026-09-18"
    level: warning
    title: GES DISC 기존 데이터 서버 접근 종료 예정(빨라야 2026-09-30) — Earthdata Cloud로 전환
    body: >-
      aura.gesdisc.eosdis.nasa.gov 서버 안내문은 이 서버와 다른 모든 GES DISC 데이터 서버의 접근이 '빨라야 2026년 9월 30일' 이후 끝나며, 계속 쓰려면 Earthdata Cloud로
      옮겨야 한다고 밝히고 있습니다(익명 FTP는 이미 중단). GES DISC는 같은 내용을 2026년 9월 18일 긴급 공지로 게시했습니다. 스크립트 주소를 data.gesdisc.earthdata.nasa.gov나 earthaccess로 바꾸세요.
    source: https://aura.gesdisc.eosdis.nasa.gov/data/
  - date: "2026-09-08"
    level: warning
    title: Aura 궤도 표류 — 통과 시각 약 1시간 변화, OMI 태양 보정용 매일 자세 기동
    body: >-
      NASA는 Aura의 평균 통과 시각 변화가 2026년 중반 약 1시간이며 2028년 8월 약 150분까지 커질 것으로 내다봤습니다. OMI의 태양 관측 창이 해를 향하지 않게 되어
      2026년 7월부터 2027년 8월까지 매일 자세(yaw) 기동으로 태양 조도 보정을 합니다. 전력 한계 시점은 보수적으로 2028년 중반으로 봅니다.
    source: https://science.nasa.gov/missions/potential-evolution-of-the-aura-mission/
  - date: "2026-03-20"
    level: info
    title: Aura 과학 운용 2028년 8월 종료 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월, Aura는 2028년 8월에 과학 운용이 끝날 것으로
      전망하며, 그때까지는 운용을 계속한다고 밝혔습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-11-21"
    level: info
    title: OMHCHO V004(Collection 4) 공개 — netCDF4 형식
    body: >-
      HCHO L2가 Collection 4로 다시 처리되어 V004로 공개되었습니다. 파일은 netCDF4이고 주요 변수는 `key_science_data` 그룹에 있습니다.
      2026-10 확인 시 CMR의 최신 파일은 2025년 4월 30일 자료입니다.
    source: https://cmr.earthdata.nasa.gov/search/concepts/C3828870481-GES_DISC.html
  - date: "2025-02-06"
    level: info
    title: 오존 OMTO3·OMTO3d V004 공개
    body: >-
      TOMS 방식 오존 전량 L2(OMTO3)와 1° 일자료(OMTO3d)가 Collection 4 입력으로 다시 처리되어 V004로 공개되었습니다. SO2는 2025년 6월(OMSO2), 12월(OMSO2e)에 뒤따랐습니다.
    source: https://cmr.earthdata.nasa.gov/search/concepts/C3377057241-GES_DISC.html
  - date: "2024-12-17"
    level: warning
    title: NO2 표준 산출 Collection 4(v5.0, V004) 공개
    body: >-
      OMNO2·OMNO2d가 새 L1B, 고해상도 사전 연직 분포, 줄무늬 제거, 행 이상 화소 결측 처리 등을 반영한 v5.0으로 전 기간 다시 처리되었습니다.
      값이 V003과 달라지므로 추세 분석은 V004로 통일하세요.
    source: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aura_OMI_Level3/OMNO2d.004/doc/README.OMNO2.c4v5.pdf
  - date: "2007-06-25"
    level: critical
    title: OMI 행 이상(row anomaly) 시작
    body: >-
      OMI 직하 관측 창을 무언가가 일부 가려 특정 횡단 위치(행)의 복사량이 줄거나 늘어나는 현상이 2007년 6월 25일 시작되었고, 2008년 5월·12월, 2009년 1월, 2011년 7월에
      영향 범위가 넓어졌습니다. 영향 받은 화소는 산출에 쓸 수 없어 L2 플래그로 걸러야 합니다.
    source: https://projects.knmi.nl/omi/research/product/rowanomaly-background.php

