account_required: true

summary: >-
  OMI는 네덜란드·핀란드가 만들어 NASA Aura 위성에 실은 자외·가시 분광 영상기로, 2004년부터 오존 전량, 이산화질소(NO2), 이산화황(SO2), 포름알데히드(HCHO),
  자외 에어로졸 지수 등을 매일 거의 전지구로 관측해 왔습니다. 궤도를 따라 나오는 L2 스와스 자료와 이를 0.25°·1° 격자에 모은 L3 일자료가 GES DISC에서 배포되며,
  20년이 넘는 기록 덕분에 대기질 추세, 배출량 추정, 오존층 감시의 기준 자료로 쓰입니다. 2024~2025년 다시 처리한 Collection 4(V004)가 현행판입니다.

time_convention:
  summary: >-
    L2 값은 위성이 지나간 순간의 관측으로, Aura는 상승 궤도에서 적도를 지방시 약 13:45에 지나며 같은 지점은 하루 한 번 이른 오후에 봅니다.
    L3 일자료는 그 UTC 하루 동안의 품질 좋은 화소를 격자마다 평균(OMNO2d·OMTO3d)하거나 가장 좋은 화소 하나를 골라(OMSO2e) 만든 값입니다.
  points:
    - "13:45 통과 시각은 설계값입니다. Aura는 2023년 1월(고도)·4월(경사각) 마지막 궤도 기동 이후 표류해 평균 통과 시각이 2024년 말 15분 미만, 2025년 중반 약 30분, 2026년 중반 약 1시간 달라졌고, 2027년 9월 약 105분, 2028년 8월 약 150분까지 커질 전망입니다."
    - "NASA는 표류가 자료 품질에 주는 영향은 작고 산출 알고리즘이 태양 각도 변화를 반영한다고 밝혔지만, 일변화가 큰 NO2·HCHO의 장기 추세에는 관측 시각 변화가 섞일 수 있습니다."
    - "궤도가 틀어져 OMI 태양 관측 창이 해를 향하지 않게 되어, 2026년 7월부터 2027년 8월까지 매일 자세(yaw) 기동으로 태양 조도 보정을 하고 있습니다."
    - "OMSO2e는 평균이 아니라 격자에 걸친 '좋은' L2 화소 중 하나를 고른 값(best pixel)입니다. 0~24 UTC 사이 관측에서 골라지므로 날짜변경선 부근은 인접 격자의 관측일이 다를 수 있습니다."
    - "L3 일자료의 하루는 UTC 기준입니다. 한국은 이른 오후(KST 약 13~14시) 관측이 같은 UTC 날짜 파일에 들어갑니다."
  source: https://science.nasa.gov/missions/potential-evolution-of-the-aura-mission/
  source_name: NASA Potential Evolution of the Aura Mission (2026-09-08) + OMI Data User's Guide + OMSO2e V004 CMR 설명

variables:
  note: >-
    GES DISC README·파일 명세(.fs)에서 확인한 이름입니다. L2·L3 대부분은 HDF-EOS5(.he5)라 변수가 `HDFEOS/SWATHS/…/Data Fields` 또는 `HDFEOS/GRIDS/…/Data Fields`
    아래에 있고, OMHCHO V004는 netCDF4입니다. OMNO2d의 결측값은 −1.26765×10^30입니다.
  full_list: https://disc.gsfc.nasa.gov/datasets?keywords=OMI&project=Aura
  groups:
    - name: L3 NO2 (OMNO2d, 0.25° 일자료)
      kind: mean
      period: 일 (UTC)
      items:
        - text: "대류권 NO2 컬럼(구름 선별, 구름 비율 30% 미만) — `ColumnAmountNO2TropCloudScreened` (molecules cm-2)"
        - text: "NO2 총 컬럼(구름 선별) — `ColumnAmountNO2CloudScreened` (molecules cm-2)"
        - text: "대류권·총 NO2 컬럼(전 조건) — `ColumnAmountNO2Trop`, `ColumnAmountNO2` (molecules cm-2)"
    - name: L3 오존·에어로졸 지수 (OMTO3d, 1° 일자료)
      kind: mean
      period: 일 (UTC)
      items:
        - "오존 전량 — `ColumnAmountO3` (DU)"
        - text: "자외 에어로졸 지수 — `UVAerosolIndex` (무차원)"
          std: [aerosol]
        - text: "복사 구름 비율 — `RadiativeCloudFraction` (0~1)"
    - name: L2 NO2·SO2·HCHO 스와스 (OMNO2·OMSO2·OMHCHO)
      kind: instant
      period: 관측 시각
      items:
        - text: "대류권 NO2 컬럼 — `ColumnAmountNO2Trop` (molecules cm-2), 품질 `VcdQualityFlags`, 행 이상 `XTrackQualityFlagsModified`"
          std: [no2]
        - text: "SO2 컬럼(대기질용 / 경계층 1 km 가정) — `ColumnAmountSO2`, `ColumnAmountSO2_PBL` (DU)"
        - text: "화산 SO2 컬럼(하층 3 km·중층 8 km·상층 13 km·성층권 18 km 가정) — `ColumnAmountSO2_TRL`, `_TRM`, `_TRU`, `_STL` (DU)"
        - text: "HCHO 컬럼 — `key_science_data/column_amount` (molecules cm-2), 품질 `key_science_data/main_data_quality_flag`"
          std: [hcho]

