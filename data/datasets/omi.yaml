# ─────────────────────────────────────────────────────────────
# Aura OMI — 데이터셋 정보 파일
# 위성 탭(에어로졸·대기 성분). 오존 전량·NO2·SO2·HCHO·자외 에어로졸 지수의 대표 장기 기록입니다.
# Collection 4(V004)가 현행판이며, 2007년부터의 행 이상(row anomaly)과 Aura 궤도 표류·임무 종료 전망(2028년)이 핵심 주의사항입니다.
# 후속 비교(OMI → Sentinel-5P TROPOMI)는 이 파일의 transitions에 있습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: omi
name: "Aura OMI"
full_name: Ozone Monitoring Instrument (OMI) on Aura — Level 2·Level 3 Collection 4 (V004) 미량기체·에어로졸 산출물 (오존 전량, NO2, SO2, HCHO 등)
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 50
domains: [대기, 에어로졸, 원격탐사]
provider: NASA GSFC·KNMI(네덜란드)·FMI(핀란드) OMI 과학팀 / NASA GES DISC

status: active
status_note: >-
  Aura와 OMI는 2026-10-13 현재 정상 관측 중이며, GES DISC는 V004 L2·L3를 매일 갱신합니다(확인 시 OMNO2d·OMTO3d는 10월 10~11일분까지).
  다만 Aura는 연료를 아끼려 2023년부터 궤도 유지 기동을 멈춰 적도 통과 시각이 2026년 중반까지 약 1시간 표류했고, NASA는 전력 한계로 Aura의 과학 운용이
  2028년 8월께 끝날 것으로 내다봅니다. 2007년부터 이어진 행 이상(row anomaly) 때문에 궤도 폭의 상당 부분은 쓸 수 없습니다.

transitions:
  - from: OMI Collection 3 (V003)
    to: OMI Collection 4 (V004)
    status: completed
    date: "2024-12"
    summary: >-
      다시 보정한 Collection 4 L1B 복사량을 입력으로 전 기간(2004년 10월~)을 다시 처리한 판입니다. 제품마다 공개 시점이 달라 NO2가 2024년 12월로 가장 먼저 나왔고,
      오존·SO2·HCHO가 2025년에 뒤따랐습니다. 판이 바뀌면 값이 달라지므로 V003과 섞지 마세요.
    changes:
      - aspect: 공개 시점 (CMR 인용 정보)
        before: V003 (Collection 3)
        after: "OMNO2·OMNO2d 2024-12-17, OMTO3·OMTO3d 2025-02-06, OMSO2 2025-06-10, OMHCHO 2025-11-21, OMSO2e 2025-12-02"
      - aspect: 입력 L1B
        before: Collection 3 L1B
        after: Collection 4 L1B 복사량·태양 조도
      - aspect: NO2 알고리즘 (OMNO2 v5.0)
        before: "이전 NO2 표준 산출(v4)"
        after: "고해상도(약 25 km) GMI 모의 사전 연직 분포, 새 줄무늬 제거·플래그 방식, 기하 의존 지표 반사도(GLER), 새 O2-O2 구름 산출, 눈·얼음 처리 개선"
      - aspect: 행 이상 처리 (NO2)
        before: "`XTrackQualityFlags`로 표시만 함"
        after: "영향 받은 화소는 연직 컬럼 산출을 포기하고 결측값을 넣음, `XTrackQualityFlagsModified` 추가"
      - aspect: SO2 (OMSO2 v2.1)
        before: "PCA v2 알고리즘 + Collection 3 L1B"
        after: "같은 PCA v2 알고리즘 + Collection 4 L1B, 적합 잔차 `RootMeanSquareFittingResiduals` 추가"
      - aspect: V003 생산
        before: 계속 생산
        after: "OMNO2d V003은 2026-03-15 자료가 CMR의 마지막 파일 (OMTO3d V003은 2026-10 현재도 생산)"
    impacts:
      - "추세·기후값은 전 기간을 V004로 다시 받으세요. NO2 README는 v02.06·02.07처럼 판이 바뀔 때 생긴 불연속을 경고하며 판을 섞은 추세 연구에 주의하라고 합니다(OMI도 같은 원칙)."
      - V004 NO2·오존·SO2 컬렉션 메타데이터는 '아직 완전히 검증되지 않음'이라고 밝히고, 추세 분석 전에는 알고리즘 책임자에게 알려진 문제를 확인하라고 권합니다.
      - "V003 코드에서 HCHO를 읽던 경로는 바꿔야 합니다. V004 OMHCHO는 netCDF4 파일이고 변수는 `key_science_data` 그룹 아래에 있습니다."
    sources:
      - name: OMNO2 Collection 4 v5.0 README (2024-12)
        url: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aura_OMI_Level3/OMNO2d.004/doc/README.OMNO2.c4v5.pdf
      - name: OMSO2 V004 README (v2.1.0, 2025-06-17)
        url: https://aura.gesdisc.eosdis.nasa.gov/data/Aura_OMI_Level2/OMSO2.004/doc/README.OMSO2_004.pdf
      - name: OMHCHO V004 README (2026-02-28)
        url: https://aura.gesdisc.eosdis.nasa.gov/data/Aura_OMI_Level2/OMHCHO.004/doc/README.OMHCHO_004.pdf
      - name: CMR — OMTO3d V004 컬렉션 정보
        url: https://cmr.earthdata.nasa.gov/search/concepts/C3377057241-GES_DISC.html
  - from: Aura OMI
    to: Sentinel-5P TROPOMI
    to_id: tropomi
    status: planned
    date: "2028-08"
    summary: >-
      TROPOMI는 2018년 4월부터 같은 오후 궤도(적도 13:30 통과)에서 OMI보다 화소가 십수 배 작은 관측을 내고 있어, 사실상 OMI의 후속 기록입니다.
      두 자료가 2018년 이후 겹치므로 그 기간으로 차이를 보정한 뒤 이어 쓰는 것이 일반적이며, Aura 과학 운용은 2028년 8월께 끝날 전망입니다.
    changes:
      - aspect: 기간
        before: "2004-10 ~ 현재 (Aura 과학 운용 2028-08 종료 전망)"
        after: "2018-04-30 ~ 현재"
      - aspect: 직하점 화소
        before: "13 × 24 km (UV2·VIS, 진행 × 횡단)"
        after: "NO2·SO2·HCHO 등 5.5 × 3.5 km (2019-08-06 이전 7 × 3.5 km), CO·CH4 5.5 × 7 km"
      - aspect: 관측 폭·궤도
        before: "약 2,600 km, Aura 705 km 궤도 상승 노드 13:45 (2023년 이후 표류)"
        after: "2,600 km, 고도 약 824 km 상승 노드 13:30 (궤도 유지)"
      - aspect: 분광 범위
        before: "자외·가시 270~500 nm"
        after: "자외·가시에 근적외·단파적외(SWIR) 추가 — CO·CH4 산출 가능"
      - aspect: 행 이상
        before: "2007년부터 궤도 폭 일부가 막혀(행 이상) 해당 화소 사용 불가"
        after: 해당 문제 없음
      - aspect: 컬럼 단위·파일 형식
        before: "molecules cm-2 또는 DU, HDF-EOS5(.he5, HCHO는 netCDF4)"
        after: "mol m-2(SI), netCDF-4 (`PRODUCT` 그룹)"
      - aspect: 제공처
        before: NASA GES DISC
        after: "Copernicus Data Space Ecosystem(ESA), NASA GES DISC 재배포"
    impacts:
      - "단위가 다릅니다. TROPOMI mol m-2 값에 6.02214×10^19를 곱하면 molecules cm-2가 됩니다(파일 속성 `multiplication_factor_to_convert_to_molecules_percm2`)."
      - 알고리즘·사전 연직 분포·구름 처리가 달라 같은 날 같은 곳이라도 NO2·HCHO 값에 계통 차이가 있습니다. 2018년 이후 겹치는 기간으로 편차를 확인한 뒤 이어 붙이세요.
      - 일관된 다중위성 NO2 기록이 필요하면 OMI 알고리즘을 TROPOMI 등에 똑같이 적용한 NASA MEaSUREs MINDS NO2(OMI_MINDS_NO2, TROPOMI_MINDS_NO2)도 검토하세요.
    sources:
      - name: Levelt et al. (2018) The Ozone Monitoring Instrument — overview of 14 years in space, ACP
        url: https://doi.org/10.5194/acp-18-5699-2018
      - name: Veefkind et al. (2012) TROPOMI on the ESA Sentinel-5 Precursor, RSE
        url: https://doi.org/10.1016/j.rse.2011.09.027
      - name: NASA — Potential Evolution of the Aura Mission (2026-09-08 갱신)
        url: https://science.nasa.gov/missions/potential-evolution-of-the-aura-mission/
      - name: CMR — OMI_MINDS_NO2 V2 (MEaSUREs 다중위성 NO2)
        url: https://cmr.earthdata.nasa.gov/search/concepts/C4128585682-GES_DISC.html

period:
  start: "2004-10"
  end: present
  note: >-
    과학 관측은 2004년 10월 1일부터입니다(Aura 발사 2004-07-15). 2026-10-13 확인 시 V004 OMNO2d·OMTO3d·OMSO2e는 2026년 10월 10~11일분까지 있습니다.
    OMHCHO V004는 CMR 최신 파일이 2025년 4월 30일 자료라 HCHO의 최근 기간은 아직 비어 있습니다. OMNO2d V003은 2026-03-15에서 멈췄습니다.

resolution:
  spatial_short: "24 km (0.22°)"
  temporal_short: "1일"
  spatial: >-
    L2: 궤도 폭 약 2,600 km, 횡단 방향 60개 화소(행). 직하점 화소 13 × 24 km(UV2·VIS, 진행 × 횡단), UV1은 13 × 48 km, 가장자리로 갈수록 커짐 /
    L3: OMNO2d 0.25° × 0.25°, OMSO2e 0.25° × 0.25°(최적 화소 1개), OMTO3d 1° × 1° 위경도 격자
  vertical: 기둥 총량(대류권·성층권 컬럼 구분 포함). 연직 분포 산출물은 이 페이지에서 다루지 않습니다
  temporal: >-
    L2: 궤도마다 주간 부분(약 53분) 한 파일, 하루 약 14~15궤도, 하루에 거의 전지구를 덮음. Aura 궤도 16일 반복 /
    L3: 일 (UTC 하루에 걸친 L2 화소를 격자화)

coverage:
  short: 전지구
  note: "주간 관측만, 행 이상(row anomaly)으로 일부 횡단 위치 결측"
update: "매일 (L3는 관측 후 약 2일 — CMR 파일 생성 시각 기준)"
