    - label: CLARA-A3 소개 논문
      text: >-
        Karlsson, K.-G., Stengel, M., Meirink, J. F., Riihelä, A., Trentmann, J., Akkermans, T., Stein, D., Devasthale, A., Eliasson, S., Johansson, E.,
        Håkansson, N., Solodovnik, I., Benas, N., Clerbaux, N., Selbach, N., Schröder, M., and Hollmann, R. (2023): CLARA-A3: The third edition of the
        AVHRR-based CM SAF climate data record on clouds, radiation and surface albedo covering the period 1979 to 2023. Earth System Science Data, 15, 4901–4926.
      doi: 10.5194/essd-15-4901-2023
      bibtex: |
        @article{karlsson2023claraa3,
          author  = {Karlsson, Karl-G{\"o}ran and Stengel, Martin and Meirink, Jan Fokke and Riihel{\"a}, Aku and Trentmann, J{\"o}rg and Akkermans, Tom and Stein, Diana and Devasthale, Abhay and Eliasson, Salomon and Johansson, Erik and H{\aa}kansson, Nina and Solodovnik, Irina and Benas, Nikos and Clerbaux, Nicolas and Selbach, Nathalie and Schr{\"o}der, Marc and Hollmann, Rainer},
          title   = {{CLARA-A3}: The third edition of the {AVHRR}-based {CM SAF} climate data record on clouds, radiation and surface albedo covering the period 1979 to 2023},
          journal = {Earth System Science Data},
          volume  = {15},
          pages   = {4901--4926},
          year    = {2023},
          doi     = {10.5194/essd-15-4901-2023}
        }
  acknowledgement: >-
    CM SAF는 EUMETSAT의 저작권 표기와 함께 "The work performed was done (i.a.) by using data from EUMETSAT's Satellite Application Facility on Climate Monitoring (CM SAF)."
    같은 문구로 출처를 밝히고, 쓴 산출물의 판(Edition 3, CDR/ICDR)을 적어 달라고 요청합니다.

notices:
  - date: "2026-03-10"
    level: info
    title: 대기 상단 복사(RSF·OLR) 파일의 위성 이름 속성 오류 수정 (Service Message 167)
    body: >-
      CLARA-A3 CDR·ICDR의 대기 상단 반사 단파·방출 장파 일·월평균 파일에서 전역 속성 'platforms'에 Metop-B(2013년 1월~)·Metop-C(2019년 7월~)가 빠져 있었습니다.
      2026년 3월 1일부터 바르게 채워지며, 자료 값과 다른 속성은 정상입니다.
    source: https://www.cmsaf.eu/EN/Products/Service_Messages/_serviceMessages/sm_167.html
  - date: "2025-08-01"
    level: info
    title: ICDR 해빙 보조자료를 AMSR2 기반으로 교체 (Service Message 165)
    body: >-
      미 DMSP 위성의 SSMIS 자료 제공이 '최선 노력' 수준으로 바뀌면서, CLARA-A3·CLAAS-3 ICDR이 쓰는 해빙 농도 입력을 SSMIS 기반 OSI-401-d에서
      AMSR2 기반 OSI-408-a로 바꿨습니다. CM SAF 평가로는 해빙 가장자리 격자에서만 작은 차이가 있습니다.
    source: https://www.cmsaf.eu/EN/Products/Service_Messages/_serviceMessages/sm_165.html
  - date: "2025-06-06"
    level: warning
    title: ICDR이 Metop만으로 전환, 수액·빙정 경로와 JCH 생산 종료 (Service Message 164)
    body: >-
      NOAA-18은 2025년 5월 31일, NOAA-19는 6월 1일부터 처리에서 빠졌고(두 위성 자료 제공은 6월 16일 종료), ICDR은 Metop-B·C만으로 만듭니다.
      NOAA 위성 채널 조합이 필요한 CWP 월 히스토그램, IWP·LWP 일·월평균, JCH 월 히스토그램은 더 이상 생산하지 않으며 NOAA 단일 위성 산출물도 끊겼습니다.
      위성 수와 주간 관측 시각이 바뀌어 특히 일평균 품질에 영향이 있습니다.
    source: https://www.cmsaf.eu/EN/Products/Service_Messages/_serviceMessages/sm_164.html

