# ─────────────────────────────────────────────────────────────
# OSTIA — 데이터셋 정보 파일
# Met Office OSTIA 일별 0.05° foundation SST + 해빙 (Copernicus Marine 배포)
# ─────────────────────────────────────────────────────────────
id: ostia
name: OSTIA
full_name: Operational Sea Surface Temperature and Sea Ice Analysis (영국 기상청 현업 해수면온도·해빙 분석)
category: analysis
domain: ocean
group: 관측 기반 분석장
order: 50
domains: [해양, 해빙]
provider: Met Office / Copernicus Marine Service (CMEMS)

status: active
status_note: >-
  준실시간(NRT) 분석과 재처리(REP) 자료 모두 정상 제공 중입니다. 다만 2025년부터 Copernicus Marine의 NRT 제품은
  최근 약 2년만 보관하는 방식으로 바뀌었으므로, 장기 분석에는 재처리 자료(SST_GLO_SST_L4_REP_OBSERVATIONS_010_011)를 쓰세요.

period:
  start: "1981-10"
  end: present
  note: >-
    재처리(REP)는 1981-10-01~2026-03-31(약 6개월 이상 늦게 묶음으로 연장), 준실시간(NRT)은 매일 갱신되며
    Copernicus Marine에서는 최근 약 2년 구간만 제공합니다. NRT 2007년 이후 전체 기록은 NASA PO.DAAC에서 받을 수 있습니다.

resolution:
  spatial: 0.05° 위경도 격자 (약 5~6 km, 7200×3600)
  vertical: 해면만 (foundation SST — 일변화 영향을 뺀 표층 온도)
  temporal: 일평균 (정오 기준)

update: NRT 매일 (UTC 12시 이전) / REP 비정기 연장 (연 1~2회)
license: >-
  Copernicus Marine Service 라이선스 — 무료, 재배포·가공 가능, 출처 표시와 제품 DOI 명시 의무.
  PO.DAAC 미러는 NASA Earthdata 이용 조건을 따릅니다.
account_required: true

summary: >-
  영국 기상청(Met Office)이 매일 운영하는 전지구 해수면온도·해빙 농도 분석 시스템 OSTIA의 L4(빈칸 없이 채운) 산출물입니다.
  여러 적외·마이크로파 위성 SST와 부이·선박 관측을 NEMOVAR 기반 자료동화로 합쳐 0.05° 일별 foundation SST를 만들고,
  해빙 농도는 EUMETSAT OSI SAF 자료를 씁니다. 수치예보 모델의 하부 경계조건과 해양 모니터링에 널리 쓰이며,
  같은 시스템으로 1981년부터 다시 계산한 재처리 자료도 함께 제공됩니다.

time_convention:
  summary: >-
    하루에 한 장씩 만드는 일 단위 분석장이며, 제품 매뉴얼은 각 파일을 그날 0시~24시(UTC)를 대표하고 정오에 시각을 찍은 일평균으로 설명합니다.
    SST는 일변화(낮 동안 표층 가열)를 뺀 foundation SST라서, 하루 중 특정 시각의 순간 수온과도, 낮까지 포함한 단순 일평균 수온과도 다릅니다.
  points:
    - "파일 이름과 time 좌표는 해당 날짜 12:00 UTC로 찍혀 있지만, 그 시각의 순간값이 아니라 그날 하루(00~24 UTC)를 대표하는 값입니다"
    - "foundation SST는 일변화가 자라나기 시작하는 기준 수온입니다. 낮 시간 가열 영향을 줄이려고 낮 위성 관측 중 풍속 6 m/s 미만인 자료는 제외하고, 밤 관측과 바람이 센 낮 관측만 씁니다 (Good et al. 2020)"
    - "한 날짜의 분석에는 전날 18 UTC부터 다음날 06 UTC까지(36시간) 들어온 SST 관측이 쓰입니다 (Good et al. 2020)"
    - "해빙 농도는 해당 날짜의 OSI SAF 일별 해빙 농도 자료를 그대로 쓰며, 앞뒤 날짜 자료는 섞지 않습니다 (Good et al. 2020)"
    - "NRT는 다음날 새벽(05:50 UTC 실행)에 전날 분석을 만들고, REP는 같은 정의로 과거를 다시 계산한 것입니다"
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-SST-PUM-010-001.pdf
  source_name: Copernicus Marine PUM (SST-010-001) 및 Good et al. (2020)

variables:
  note: >-
    Copernicus Marine 제품 사용자 매뉴얼(PUM) 기준 파일 속 변수명입니다. NRT와 REP의 변수 구성은 같습니다.
    REP 원본 파일은 정수로 압축 저장되어 있어(scale_factor·add_offset) 라이브러리가 자동 변환하는지 확인하세요.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-SST-PUM-010-001.pdf
  groups:
    - name: 해수면온도
      kind: mean
      period: 일
      items:
        - text: "분석 해수면온도(foundation SST) — `analysed_sst` (K)"
          note: 매뉴얼상 일평균(00~24 UTC)이지만, 일변화를 제거한 foundation SST라 낮 가열이 포함된 실제 일평균 수온과는 다릅니다.
        - text: "분석 오차 표준편차 — `analysis_error` (K)"
          note: 같은 날 analysed_sst의 추정 오차(표준편차)이며, 시간 특성은 analysed_sst를 따릅니다.
    - name: 해빙·마스크
      items:
        - text: "해빙 면적 비율 — `sea_ice_fraction` (0~1)"
          kind: mean
          period: 일
          note: 해당 날짜의 OSI SAF 일별 해빙 농도를 사용합니다. OSI SAF 일별 값의 내부 시간 정의는 이 매뉴얼에서 확인하지 못했습니다.
        - text: "해양·육지·호수·해빙 구분 플래그 — `mask` (비트 플래그)"
          kind: static
          note: 해양·육지·호수 구분은 고정이지만, 해빙 비트(8)는 그날 해빙 분석에 따라 날마다 바뀔 수 있습니다.

access:
  - name: Copernicus Marine — NRT 분석 (SST_GLO_SST_L4_NRT_OBSERVATIONS_010_001)
    url: https://data.marine.copernicus.eu/product/SST_GLO_SST_L4_NRT_OBSERVATIONS_010_001/description
    method: 웹 Subset / Copernicus Marine Toolbox (copernicusmarine) / 파일 브라우저
    note: >-
      Copernicus Marine 무료 계정 필요. 데이터셋 ID는 METOFFICE-GLO-SST-L4-NRT-OBS-SST-V2 입니다.
      최근 약 2년치만 제공되므로 과거 자료는 REP나 PO.DAAC를 이용하세요.
  - name: Copernicus Marine — 재처리 (SST_GLO_SST_L4_REP_OBSERVATIONS_010_011)
    url: https://data.marine.copernicus.eu/product/SST_GLO_SST_L4_REP_OBSERVATIONS_010_011/description
    method: 웹 Subset / Copernicus Marine Toolbox (copernicusmarine) / 파일 브라우저
    note: 데이터셋 ID는 METOFFICE-GLO-SST-L4-REP-OBS-SST 입니다. 1981년 10월부터의 일관된 기후 분석용 자료입니다.
  - name: NASA PO.DAAC — OSTIA NRT 전체 기록 (OSTIA-UKMO-L4-GLOB-v2.0)
    url: https://podaac.jpl.nasa.gov/dataset/OSTIA-UKMO-L4-GLOB-v2.0
    method: Earthdata Search / OPeNDAP / AWS S3 (us-west-2) / podaac-data-subscriber
    note: GHRSST 형식의 같은 NRT 분석을 2006-12-31부터 제공합니다. NASA Earthdata 계정 필요.
  - name: NASA PO.DAAC — OSTIA 재처리 (OSTIA-UKMO-L4-GLOB-REP-v2.0)
    url: https://podaac.jpl.nasa.gov/dataset/OSTIA-UKMO-L4-GLOB-REP-v2.0
    method: Earthdata Search / OPeNDAP / AWS S3 (us-west-2)
    note: PO.DAAC 미러는 확인 시점 기준 1982-01-01~2024-01-01까지만 있어 Copernicus Marine REP보다 짧습니다.

example:
  lang: python
  note: "처음 한 번 터미널에서 copernicusmarine login 으로 Copernicus Marine 계정을 등록한 뒤 실행합니다."
  code: |
    # pip install copernicusmarine xarray
    import copernicusmarine

    copernicusmarine.subset(
        dataset_id="METOFFICE-GLO-SST-L4-REP-OBS-SST",
        variables=["analysed_sst", "sea_ice_fraction"],
        minimum_longitude=120, maximum_longitude=135,
        minimum_latitude=30, maximum_latitude=45,
        start_datetime="2020-01-01T00:00:00",
        end_datetime="2020-01-31T23:59:59",
        output_filename="ostia_rep_korea_202001.nc",
    )

tips:
  - >-
    NRT 제품(010_001)과 재처리 제품(010_011)은 입력 자료와 처리 버전이 달라 같은 날짜라도 값이 다릅니다.
    기후값·추세 분석은 재처리 자료로 통일하고, 최근 몇 달만 NRT로 이어 붙일 때는 겹치는 기간으로 차이를 먼저 확인하세요.
  - >-
    OSTIA의 SST는 foundation SST(일변화가 없는 수심의 온도)라 낮 시간 위성 피부온도(skin SST)나 부이 관측보다 낮게 나올 수 있습니다.
    관측값과 비교할 때 이 정의 차이를 고려하세요.
  - >-
    0.05° 격자이지만 실제로 분해되는 규모는 관측 밀도에 따라 이보다 큽니다. 특히 구름이 많은 해역과 위성 마이크로파 자료가 적은 연안은
    분석 오차(analysis_error)를 함께 보세요.
  - >-
    기후 연구용으로는 ESA SST CCI·C3S 기반 L4 분석(CEDA, 1980년~)도 있습니다. OSTIA REP와 입력 자료가 상당 부분 겹치지만 별도 제품이므로
    인용과 버전을 구분해 적으세요.

