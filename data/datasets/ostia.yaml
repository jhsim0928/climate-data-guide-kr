notices:
  - date: "2026-04-28"
    level: info
    title: ARCO 데이터큐브에 보관 기간 적용 — 시작일이 바뀔 수 있음
    body: >-
      Copernicus Marine이 제품 매뉴얼에 정한 보관 기간을 ARCO 기반 서비스(Subset 화면, Toolbox subset, MyOcean Viewer)에 적용하기 시작했습니다.
      일부 시계열의 시작일·기간이 달라질 수 있습니다. 원본 파일(File Browser, copernicusmarine get)은 영향이 없다고 안내되었습니다.
    source: https://marine.copernicus.eu/user-corner/user-notification-service
  - date: "2025-06-24"
    level: warning
    title: NRT 제품(010_001) 제공 기간을 최근 2년으로 축소
    body: >-
      제품 사용자 매뉴얼 변경 이력에 NRT 데이터셋 길이를 "최근 2년"으로 바꾼다고 기록되었습니다.
      2년보다 오래된 NRT 자료가 필요하면 NASA PO.DAAC(OSTIA-UKMO-L4-GLOB-v2.0)를, 장기 분석에는 REP 제품을 쓰세요.
    source: https://documentation.marine.copernicus.eu/PUM/CMEMS-SST-PUM-010-001.pdf
  - date: "2025-05-28"
