transitions:
  - from: CLMS LAI·FAPAR·FCover 300 m V1 (V1.0 PROBA-V / V1.1 Sentinel-3)
    to: CLMS LAI·FAPAR·FCover 300 m V2.0
    status: completed
    date: "2026-03"
    summary: >-
      두 센서로 나뉘어 있던 V1.0(PROBA-V)·V1.1(Sentinel-3)을 하나의 판으로 다시 만든 것입니다. Sentinel-3 구간은 같은 신경망이라 값이 거의 같지만,
      PROBA-V 구간(2014~2018)은 입력 반사도가 바뀌어 주로 FCover·FAPAR가 조정되었습니다. 2026년 1월 준실시간 운영을 시작했고 V1.1은 2026년 2월 말로 끝났습니다.
    changes:
      - aspect: 기간·센서 구성
        before: "V1.0 PROBA-V 2014-01~2020-06, V1.1 Sentinel-3 OLCI 2020-07~2026-02 (판이 다른 두 기록을 이어 씀)"
        after: "V2.0 한 판 — PROBA-V 2014-01~2018-12 + Sentinel-3A·3B OLCI 2019-01~현재"
      - aspect: 입력 반사도
        before: "V1.0 대기 상단(TOA) 반사도, PROBA-V Collection 1, SMAC 대기보정을 산출 안에서 처리 / V1.1 OLCI 지표(TOC) 반사도 v1.0(2022-06-30까지)→v1.1"
        after: "지표(TOC) 반사도 — PROBA-V Collection 2, OLCI TOC v2.3. 수증기·오존·기압 보조 자료 불필요"
      - aspect: 알고리즘
        before: "V1.0 GLOBCOVER 기반 식생 구분, V1.1 신경망 재학습"
        after: "Sentinel-3 구간은 V1.1과 같은 신경망·매개변수(차이 미미, EBF 화소 식별 개선), CCI-LC 토지피복 사용"
      - aspect: 준실시간 지연
        before: "RT0 합성 기간 끝 5일 이내"
        after: "RT0 합성 기간 끝 2일(48시간) 이내, 이후 RT1·RT2·RT6 갱신"
      - aspect: 파일·식별자
        before: "c_gls_LAI300-RT6_..._GLOBE_OLCI_V1.1.x_nc / datasetIdentifier lai_global_300m_10daily_v1 / DOI 10.2909/219fdc9f-616b-444b-a495-198f527b4722"
        after: "c_gls_LAI300-RT6_..._GLOBE_OLCI_V2.0.1_nc (PROBA-V 구간은 _PROBAV_) / lai_global_300m_10daily_v2 / DOI 10.2909/a696fab4-c3dc-4dcc-b1d8-6fcd9a2ce1eb"
      - aspect: 알려진 한계
        before: "PROBA-V(V1.0)와 Sentinel-3(V1.1) 판 사이 불연속"
        after: "같은 판이지만 PROBA-V→OLCI 전환기(2018~2019) 수준 이동·연간 정밀도 저하가 검증 보고서에 남아 있음"
    impacts:
      - V1 자료로 계산한 기후값·추세를 V2.0 결과와 섞지 말고, 2014년부터 전 기간을 V2.0으로 다시 받으세요.
      - 스크립트의 datasetIdentifier·파일 이름 패턴(_v1, V1.1)을 _v2, V2.0으로 바꿔야 합니다. V1 자료는 CDSE에 보관 자료로 남아 있습니다.
      - 논문에는 V2.0의 DOI를 인용하고, RT6만 썼는지 밝히세요.
    sources:
      - name: Version 2.0 of LAI, FAPAR and FCover 300 m in NRT operations (CLMS, 2026-01-16)
        url: https://land.copernicus.eu/en/production-updates/version-2-0-of-lai-fapar-and-fcover-300-m-in-nrt-operations
      - name: CLMS PUM LAI·FAPAR·FCover 300 m V2.0 (I1.20, 2026-07-16)
        url: https://land.copernicus.eu/en/technical-library/product-user-manual-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
      - name: CLMS Validation Report LAI·FAPAR·FCover 300 m V2.0 (2026-03-09)
        url: https://land.copernicus.eu/en/technical-library/validation-report-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
  - from: CLMS LAI·FAPAR·FCover 1 km V2 (GEOV2, SPOT-VGT·PROBA-V)
    to: CLMS LAI·FAPAR·FCover 300 m 계열
    status: completed
    date: "2020-06"
    summary: >-
      1999년부터 이어 온 1 km V2는 PROBA-V 임무가 끝난 2020년 6월로 생산이 멈추고 보관 자료가 되었습니다. 그 뒤로는 300 m 계열(현재 V2.0)만 갱신됩니다.
      두 계열은 해상도·입력·처리 창이 달라 한 시계열로 이어 붙일 수 없습니다.
    changes:
      - aspect: 기간
        before: "1999-01~2020-06 (갱신 없음)"
        after: "2014-01~현재"
      - aspect: 격자
        before: "1/112° 정규 위경도"
        after: "1/336° 정규 위경도, 80°N–60°S"
      - aspect: 센서
        before: "SPOT/VEGETATION(1999~2014) → PROBA-V(~2020-06)"
        after: "PROBA-V(2014~2018) → Sentinel-3 OLCI(2019~)"
      - aspect: 보조 변수 범위
        before: "NOBS 0–120, LENGTH_BEFORE·AFTER 5–60일, QFLAG 16비트"
        after: "NOBS 0–60, LENGTH_BEFORE 0–210일(EBF)·LENGTH_AFTER 0–60일, QFLAG 8비트"
    impacts:
      - 1999년부터의 장기 분석에 1 km V2와 300 m V2.0을 이어 쓰려면 겹치는 2014~2020년으로 두 자료의 차이를 먼저 평가하세요.
      - 1 km V2는 더 이상 고쳐지지 않으므로 알려진 문제가 있어도 그대로입니다.
    sources:
      - name: CLMS 제품 페이지 — Leaf Area Index 1999-2020 (1 km) V2
        url: https://land.copernicus.eu/en/products/vegetation/leaf-area-index-v2-0-1km
      - name: CDSE 문서 — lai_global_1km_10daily_v2 밴드 정보
        url: https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/clms/bio-geophysical-parameters/vegetation/vegetation-properties/lai_global_1km_10daily_v2.html
      - name: Verger et al. (2023), GEOV2
        url: https://doi.org/10.1016/j.jag.2023.103479

notices:
  - date: "2026-06-17"
    level: info
    title: VITO Terrascope openEO의 CGLS 컬렉션 2026년 8월 말까지 폐지 — CDSE openEO로 이전
    body: >-
      VITO는 Terrascope openEO의 CGLS_LAI300_V1_GLOBAL 등 Global Land 컬렉션 16개를 2026년 8월 말까지 없앤다고 알렸습니다.
      대체 컬렉션은 CDSE openEO의 CLMS_LAI_GLOBAL_300M_10DAILY_V2 등이며(300 m는 V1에서 V2로 바뀜), 접속 주소·인증(CDSE 계정)을 바꿔야 하고 scale·offset이 자동 적용됩니다.
    source: https://terrascope.be/en/news-events/phase-out-copernicus-global-land-service-collections-terrascope-openeo
  - date: "2026-01-16"
    level: warning
    title: LAI·FAPAR·FCover 300 m V2.0 준실시간 운영 시작 — V1.1은 2026년 2월 말 종료
    body: >-
      2026년 1월 둘째 dekad부터 V2.0이 준실시간 운영에 들어가고 2014년부터의 과거 V2.0 기록이 함께 공개되었습니다.
      V1.1은 지연된 상태로 2026년 2월 말까지만 생산되고, 3월부터 V2.0이 영구히 대체합니다.
    source: https://land.copernicus.eu/en/production-updates/version-2-0-of-lai-fapar-and-fcover-300-m-in-nrt-operations
  - date: "2025-05-21"
    level: warning
    title: 전지구 CLMS 자료 CDSE 이전 완료 — 옛 Global Land 접근 경로 변경
    body: >-
      옛 Global Land 부문의 전지구 자료가 Copernicus Data Space Ecosystem(CDSE)으로 옮겨져 그곳이 중심 배포처가 되었습니다.
      CLMS는 옛 Global Land 페이지 안내에서 전지구 자료의 대체 접근 방식이 2025년 9월 1일부로 CDSE로 완전히 옮겨진다고 밝혔으니, VITO 경로(OpenSearch·manifest 등)를 쓰던 스크립트는 바꾸세요.
    source: https://land.copernicus.eu/en/news/global-data-now-available-on-the-copernicus-data-space-ecosystem
  - date: "2025-03-31"
    level: info
    title: 300 m V1.1 파일 버전 번호 1.1.2 → 1.1.1로 되돌림 (2025년 4월 첫 dekad부터)
    body: >-
      CDSE 배포에 맞추려고 V1.1 파일의 실행 번호를 1로 되돌려 2025년 4월 첫 dekad(4월 12일 공개)부터 버전 표기가 V1.1.2에서 V1.1.1로 바뀌었습니다.
      알고리즘·처리 체인은 같아 두 표기의 자료는 완전히 호환됩니다.
    source: https://land.copernicus.eu/en/production-updates/lai-fapar-fcover-300-m-version-1-1-roll-back-product-version-number

