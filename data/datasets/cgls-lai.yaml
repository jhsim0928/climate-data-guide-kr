# ─────────────────────────────────────────────────────────────
# CLMS(구 Copernicus Global Land Service) LAI·FAPAR·FCover — 데이터셋 정보 파일
# 지면 탭 '식생'. 300 m V2.0이 2026년 1월 준실시간 운영에 들어가고 V1.1은 2026년 2월로 끝났습니다. 1 km V2는 1999~2020년 보관 자료입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: cgls-lai
name: "CLMS LAI/FAPAR/FCOVER"
full_name: Copernicus Land Monitoring Service 전지구 식생 생물물리 변수 LAI·FAPAR·FCover (300 m V2.0 / 1 km V2, 10일 간격) — 구 Copernicus Global Land Service(CGLS) 제품
category: satellite
domain: land
group: 식생
order: 20
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: EU Copernicus 육상 감시 서비스(CLMS, 전지구 부문은 JRC 관리) / VITO 생산 / Copernicus Data Space Ecosystem(CDSE) 배포

status: active
status_note: >-
  300 m Version 2.0(V2.0.1)이 2026년 1월 둘째 순(dekad)부터 준실시간(NRT) 운영에 들어갔고, 2014년부터의 과거 기록도 같은 판으로 다시 만들어 공개되었습니다.
  이전 판 V1.1(Sentinel-3)은 2026년 2월 말까지만 생산되고 3월부터 V2.0으로 완전히 바뀌었습니다(2026-10-13 확인 시 CDSE 최신 파일은 2026-10-10 RT0).
  예전 'Copernicus Global Land Service' 이름과 VITO 배포 포털은 CLMS 누리집과 CDSE로 통합되었으니 스크립트의 받는 곳을 바꾸세요. 1 km V2(SPOT-VGT·PROBA-V)는 2020년 6월에 끝난 보관 자료입니다.

period:
  start: "1999-01"
  end: present
  note: >-
    300 m V2.0은 2014년 1월부터 현재까지이며, 2014~2018년은 PROBA-V, 2019년 1월부터는 Sentinel-3 OLCI 자료로 만들었습니다(CDSE 파일 이름 기준 PROBAV 마지막 2018-12-31, OLCI 첫 2019-01-10).
    1 km V2(SPOT-VGT → PROBA-V)는 1999년 1월부터 2020년 6월까지의 보관 자료이고, 이전 300 m V1(V1.0 PROBA-V 2014-01~2020-06, V1.1 Sentinel-3 2020-07~2026-02)도 CDSE에 남아 있습니다.
    2026-10-13 CDSE 확인 시 V2.0 최신 파일은 2026-10-10 명목일의 RT0입니다.

resolution:
  spatial_short: "0.3 km (0.003°)"
  temporal_short: "10일"
  spatial: >-
    300 m 제품: 1/336° 정규 위경도 격자(WGS84, EPSG:4326, 화소 크기 0.0029761905°, 화소 중심 기준), 80°N–60°S(PROBA-V 구간은 75°N–60°S만 유효) /
    1 km 제품: 1/112° 정규 위경도 격자
  vertical: 지표(식생 군락) 단일층
  temporal: >-
    10일(dekad) — 매달 10일·20일·말일이 명목일. 같은 명목일에 대해 RT0(준실시간) → RT1·RT2(1·2 dekad 뒤 갱신) → RT6(6 dekad 뒤 최종) 순으로 다시 나옵니다

coverage:
  short: 전지구
  note: "80°N–60°S (PROBA-V 구간은 75°N–60°S)"
update: "10일마다 — RT0는 합성 기간 끝 약 2일 안, RT1·RT2·RT6는 1·2·6 dekad 뒤 갱신 (1 km V2는 갱신 없음)"
license: "Copernicus 자료 정책에 따른 완전·무료·공개 이용(출처 표시, 변형 시 명시, EU 보증 암시 금지). CDSE 내려받기는 무료 계정 필요"
account_required: true

summary: >-
  EU Copernicus 육상 감시 서비스(CLMS)가 만드는 전지구 식생 변수로, 엽면적지수(LAI), 흡수 광합성유효복사 비율(FAPAR), 녹색 식생 피복률(FCover)을
  10일 간격으로 제공합니다. 식생 유형별로 학습한 신경망으로 위성 지표 반사도에서 순간값을 추정한 뒤, 시간 맞춤·결측 채움으로 10일 간격 값을 만듭니다.
  현재 주력은 PROBA-V(2014~2018)와 Sentinel-3 OLCI(2019~)를 한 판으로 이은 300 m V2.0이며, 1999~2020년은 1 km V2(GEOV2) 기록이 있습니다.
  예전에는 'Copernicus Global Land Service(CGLS)' 이름으로 VITO 포털에서 배포했지만 지금은 CLMS 누리집과 CDSE에서 받습니다.

time_convention:
  summary: >-
    각 값은 dekad '명목일'(매달 10일·20일·말일, 파일 이름의 날짜) 시점의 추정값입니다. 일반 식생은 명목일 앞뒤 창(과거 60일, 미래 0~60일)의 순간 추정값에
    1·2차 다항식을 맞춰 그 날 값을 구하고, 상록활엽수림(EBF)은 가장 가까운 순간 추정값 10개의 평균을 씁니다. 따라서 10일 평균도, 최대값 합성도 아닙니다.
  points:
    - "파일 이름 c_gls_LAI300-RT6_202407310000_GLOBE_OLCI_V2.0.1의 날짜(2024-07-31)는 명목일이며, CDSE의 ContentDate(2024-07-21~31)는 해당 dekad 구간을 가리킵니다."
    - "RT0은 과거 관측만 써서(미래 창 0일) 끝부분이 불안정하고, RT1·RT2는 10·20일 뒤 관측을, RT6는 60일 뒤 관측까지 넣은 최종값입니다. 과거 재처리 구간은 RT6만 있습니다."
    - "V2.0 과거 기록은 RT6가 2014년 1월부터, RT2·RT1·RT0은 각각 2025-08-20·08-31·09-10부터 있습니다."
    - "LENGTH_BEFORE·LENGTH_AFTER는 실제로 쓴 창의 앞뒤 길이(일)이고, NOBS는 그 창 안 유효 순간 관측 수입니다. 창 길이를 보면 결측 채움 정도를 알 수 있습니다."
    - "FAPAR는 오전 10시 15분경(10:00~10:30) 태양 조건의 흑공(black-sky) 값으로 정의되며, 하루 적분값의 근사로 봅니다. Sentinel-3 적도 통과는 오전 10시, PROBA-V는 임무 말기 약 09:30이었습니다."
  source: https://land.copernicus.eu/en/technical-library/product-user-manual-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
  source_name: "CLMS Product User Manual — LAI, FAPAR, FCover 300 m Version 2.0 (CGLOPS1_PUM_LAI300m-V2.0, I1.20, 2026-07-16)"

variables:
  note: >-
    300 m V2.0 제품 사용자 안내서(PUM) 기준 netCDF4(CF-1.6) 변수입니다. LAI·FAPAR·FCover는 각각 별도 파일(LAI300·FAPAR300·FCOVER300)이며 같은 보조 변수가 함께 들어 있습니다.
    모두 8비트 정수로 저장되고 물리값 = 저장값 × scale_factor(LAI 1/30, FAPAR·FCover 1/250, 나머지 1), 결측 255입니다. 물 화소는 계산하지 않고 255로 채웁니다.
    CDSE STAC 메타데이터는 같은 변수를 소문자(lai, rmse 등)로 표기하니, 파일에서 실제 이름을 한 번 확인하세요.
  full_list: https://land.copernicus.eu/en/technical-library/product-user-manual-fraction-of-green-vegetation-cover-300m-version-2/@@download/file
  groups:
    - name: 300 m V2.0 식생 변수 (명목일 시점 추정값)
      kind: instant
      items:
        - text: "엽면적지수(녹색 LAI) — `LAI` (m2 m-2, 0–7)"
          note: "녹색 잎 면적의 절반 / 지표 면적. 하층 식생 포함. 저장값 × 1/30"
        - text: "흡수 광합성유효복사 비율 — `FAPAR` (0–0.94)"
          note: "10:15경 흑공(black-sky) FAPAR. 저장값 × 1/250"
        - text: "녹색 식생 피복률 — `FCOVER` (0–1)"
          note: "연직(천정) 방향에서 본 녹색 식생 면적 비율. 저장값 × 1/250"
    - name: 300 m V2.0 보조 변수
      kind: instant
      items:
        - "추정 불확실성(RMSE) — `RMSE` (해당 변수 단위)"
        - text: "유효 순간 관측 수 — `NOBS` (개, 0–60)"
          kind: accum
          note: 맞춤 창(LENGTH_BEFORE~LENGTH_AFTER) 안에서 센 값
        - "맞춤 창 앞쪽 길이 — `LENGTH_BEFORE` (일, 0–210)"
        - "맞춤 창 뒤쪽 길이 — `LENGTH_AFTER` (일, 0–60)"
        - text: "품질 플래그 — `QFLAG` (비트)"
          note: "비트1 육지/물, 비트2 비EBF/EBF, 비트6·7 맞춤 방식(2차·1차 다항식, 15일 내 보간, 5일 내 최근접 또는 결측)"
    - name: 1 km V2 (1999-01~2020-06, 보관 자료)
      kind: instant
      items:
        - text: "엽면적지수 — `LAI` (m2 m-2, 0–7)"
          note: "같은 구성의 FAPAR·FCOVER 파일이 따로 있습니다. 저장값 × 1/30"
        - "LAI 불확실성 — `RMSE` (m2 m-2)"
        - text: "유효 관측 수 — `NOBS` (개, 0–120)"
          kind: accum
        - "맞춤 창 앞·뒤 길이 — `LENGTH_BEFORE`, `LENGTH_AFTER` (일, 5–60)"
        - "품질 플래그 — `QFLAG` (16비트)"

access:
  - name: CLMS 제품 페이지 — LAI 300 m V2.0
    url: https://land.copernicus.eu/en/products/vegetation/leaf-area-index-v2-0-300m
    method: 제품 설명·DOI·접근 경로 안내, CLMS Data viewer
    note: "FAPAR(fraction-of-absorbed-photosynthetically-active-radiation-v2-0-300m)·FCover(fraction-of-green-vegetation-cover-v2-0-300m) 페이지가 따로 있습니다. 대용량은 CDSE 내려받기를 권장합니다."
  - name: Copernicus Data Space Ecosystem — OData·S3·STAC
    url: https://documentation.dataspace.copernicus.eu/Data/CopernicusServices/CLMS.html
    method: OData API / S3(EODATA) / STAC / Copernicus Browser (무료 CDSE 계정)
    note: >-
      OData의 datasetIdentifier는 lai_global_300m_10daily_v2, fapar_global_300m_10daily_v2, fcover_global_300m_10daily_v2(1 km는 lai_global_1km_10daily_v2 등)이고,
      S3 경로는 /eodata/CLMS/bio-geophysical/vegetation_properties/lai_global_300m_10daily_v2/YYYY/MM/DD/ 입니다. netCDF(_nc)와 COG(_cog) 두 형식이 함께 있습니다.
  - name: CDSE openEO / Sentinel Hub
    url: https://documentation.dataspace.copernicus.eu/APIs/SentinelHub/Data/clms/bio-geophysical-parameters/vegetation/vegetation-properties/fapar_global_300m_10daily_v2.html
    method: openEO(CLMS_LAI_GLOBAL_300M_10DAILY_V2 등) / Sentinel Hub BYOC 컬렉션(RT0·RT1·RT2·RT6 별도)
    note: 전지구 파일 하나가 수 GB이므로 관심 영역만 잘라 받을 때 유용합니다. CDSE openEO는 scale·offset을 자동 적용합니다.
  - name: WEkEO (CLMS 통합 데이터셋)
    url: https://help.wekeo.eu/en/articles/12397018-new-unified-clms-dataset-available
    method: HDA API / 웹 뷰어
    note: WEkEO도 CDSE로 옮긴 CLMS 자료를 통합 데이터셋(EO:JRC:DAT:CLMS)으로 제공한다고 안내하지만, 2026-10-13 확인한 안내문에는 LAI·FAPAR·FCover가 명시되어 있지 않습니다. 공식 1차 배포처는 CDSE입니다.

example:
  lang: python
  note: >-
    CDSE OData로 2024년 7월 마지막 dekad의 LAI 300 m V2.0 최종본(RT6, netCDF)을 찾아 받는 예입니다. 환경변수 CDSE_USERNAME·CDSE_PASSWORD에 무료 CDSE 계정을 넣으세요.
    전지구 netCDF 한 개가 약 2.8 GB이므로, 작은 영역만 필요하면 COG(_cog)나 openEO를 쓰는 편이 낫습니다.
  code: |
    import os
    import requests
    import xarray as xr

    token = requests.post(
        "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token",
        data={"client_id": "cdse-public", "grant_type": "password",
              "username": os.environ["CDSE_USERNAME"], "password": os.environ["CDSE_PASSWORD"]},
    ).json()["access_token"]

    odata = "https://catalogue.dataspace.copernicus.eu/odata/v1"
    flt = ("Collection/Name eq 'CLMS' and "
           "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'datasetIdentifier' and "
           "att/OData.CSC.StringAttribute/Value eq 'lai_global_300m_10daily_v2') and "
           "contains(Name,'RT6_20240731') and endswith(Name,'_nc')")
    prod = requests.get(f"{odata}/Products", params={"$filter": flt}).json()["value"][0]
    name = prod["Name"]                       # c_gls_LAI300-RT6_202407310000_GLOBE_OLCI_V2.0.1_nc
    ncfile = name[:-3] + ".nc"                # 폴더 안의 실제 파일 이름

    s = requests.Session()
    s.headers["Authorization"] = f"Bearer {token}"
    url = f"{odata}/Products({prod['Id']})/Nodes({name})/Nodes({ncfile})/$value"
    r = s.get(url, allow_redirects=False)
    while r.status_code in (301, 302, 303, 307):   # 다운로드 서버로 넘어갈 때 인증 헤더 유지
        url = r.headers["Location"]
        r = s.get(url, allow_redirects=False)
    with s.get(url, stream=True) as resp, open(ncfile, "wb") as f:
        for chunk in resp.iter_content(1 << 20):
            f.write(chunk)

    ds = xr.open_dataset(ncfile)              # scale_factor·결측(255)은 xarray가 자동 적용
    lai = ds["LAI"].sel(lat=slice(39, 33), lon=slice(124, 132))   # 위도는 북→남 순서
    print(float(lai.mean()))

tips:
  - "같은 명목일이라도 RT0·RT1·RT2·RT6 값이 다릅니다. 연구용 시계열은 RT6만 쓰고, 최근 몇 dekad를 RT0~RT2로 채웠다면 그 사실을 밝히세요. RT0에는 줄무늬·과대값 같은 공간 잡음이 보고되어 있습니다."
  - "V1(V1.0·V1.1)과 V2.0을 한 시계열로 섞지 마세요. 특히 2014~2018년 PROBA-V 구간 값이 V2.0에서 바뀌었으므로 전 기간을 V2.0으로 다시 받는 것이 안전합니다."
  - "V2.0도 PROBA-V → Sentinel-3 OLCI 전환(2018~2019년) 전후로 OLCI 쪽이 약간 높은 수준 이동이 남아 있습니다. 2014년부터의 추세를 계산할 때는 이 경계를 확인하세요."
  - "LAI는 1/30, FAPAR·FCover는 1/250을 곱해야 물리값이 됩니다. xarray는 자동 적용하지만 GDAL·rasterio로 COG를 직접 읽으면 저장값(0–250)이 그대로 나옵니다. 255는 결측·물입니다."
  - "명목일은 10일·20일·말일이므로 셋째 dekad는 8~11일입니다. 월평균을 만들 때 단순 평균 대신 dekad 길이 가중을 고려하세요."
  - "습지·물 주변에서는 비현실적인 값이 나올 수 있고, 상록활엽수림(QFLAG 비트2)은 단순화된 처리(10개 순간값 평균, 부족하면 이전 dekad 값)를 씁니다."
  - "C3S Climate Data Store의 'satellite-lai-fapar'는 이름이 비슷하지만 다른 계열(C3S용, V2 이후 유효 LAI)입니다. 논문에 쓴 제품 이름과 DOI를 정확히 적으세요."

