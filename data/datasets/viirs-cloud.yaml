# ─────────────────────────────────────────────────────────────
# MODIS-VIIRS 연속 구름 제품 CLDPROP(L2·D3·M3) V1.1·CLDMSK(L2) V2 — 데이터셋 정보 파일
# 위성 탭(구름·복사). VIIRS(Suomi NPP·NOAA-20·NOAA-21)와 Aqua MODIS에 같은 알고리즘을 적용한 연속 구름 마스크·구름 특성 자료입니다.
# MODIS 표준 구름(MOD06·MOD35) → 연속 제품 비교는 modis-cloud.yaml의 transitions에 있습니다. Suomi NPP 자료 전달은 2026-11-02에 끝납니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: viirs-cloud
name: "VIIRS Cloud (CLDPROP·CLDMSK)"
full_name: MODIS-VIIRS Continuity Cloud Properties (CLDPROP_L2·D3·M3, V1.1) 및 Cloud Mask (CLDMSK_L2, V2) — Suomi NPP·NOAA-20·NOAA-21 VIIRS와 Aqua MODIS (공통 밴드 기반 연속 구름 자료)
category: satellite
domain: satellite
group: 구름·복사
order: 61
domains: [대기, 원격탐사]
provider: NASA GSFC·위스콘신대 SSEC MODIS-VIIRS 구름 팀(Platnick 등) / NASA VIIRS Atmosphere SIPS / NASA LAADS DAAC

status: active
status_note: >-
  NOAA-20 판 CLDPROP(V1.1)과 CLDMSK(V2)가 정상 생산되고 있습니다(2026-10-13 확인 시 CLDPROP_D3_VIIRS_NOAA20은 10월 9일 자료까지). 구름 마스크는 NOAA-21 판도 있지만,
  구름 특성(CLDPROP)의 NOAA-21 판은 2026-10-13 기준 공개되지 않았습니다. Suomi NPP 판은 NOAA의 자료 전달 종료(2026-11-02 15:40 UTC)로 그 뒤 새 자료가 없고,
  Aqua MODIS 판은 Aqua 과학 운용 종료(2027년 9월 전망)와 함께 끝납니다. 그 뒤로는 NOAA-20(및 마스크는 NOAA-21) 판만 남습니다.

period:
  start: "2002-07"
  end: present
  note: >-
    Aqua MODIS 판(CLDPROP_*_MODIS_Aqua·CLDMSK_L2_MODIS_Aqua)은 2002-07-04부터, Suomi NPP 판은 2012-03-01부터(2026-11-02 전달 종료 예정), NOAA-20 판은 2018-02-17부터(L3 일 2018-03-17·월 2018-04),
    NOAA-21 구름 마스크는 2023-02-10부터입니다. LAADS 전환 안내 표에는 Aqua MODIS 판이 2012년부터로 적혀 있지만, CMR에는 2002년 7월부터의 자료가 있습니다(2026-10-13 확인).

resolution:
  spatial_short: "0.75 km (0.007°)"
  temporal_short: "1일"
  spatial: >-
    L2 스와스(직하점): VIIRS 750 m(M밴드), MODIS 1 km — CLDPROP_L2·CLDMSK_L2. CLDMSK V2 VIIRS에는 주간 375 m I밴드 구름 마스크 추가 /
    L3: 전지구 1°×1° 격자 — CLDPROP_D3(일)·CLDPROP_M3(월)
  vertical: 구름 상단 기압·온도·높이와 기주 적분 구름 특성(광학두께·유효 반경·수액량)
  temporal: >-
    L2는 VIIRS 6분·MODIS 5분 단위 그래뉼(궤도 스와스). 구름 마스크·구름 상단은 주간·야간, 광학 특성은 주간만 / L3 일(D3)·월(M3).
    Suomi NPP·NOAA-20·NOAA-21과 Aqua 모두 지방시 13:30 무렵 상승(주간) 통과하는 오후 궤도입니다(Aqua는 2021년 이후 늦어지는 쪽으로 표류).

coverage:
  short: 전지구
update: 매일 (L2·일자료는 관측 후 수일 안), 월자료는 달이 끝난 뒤 약 1개월
license: NASA EOSDIS 자료 이용 정책에 따라 제한 없이 공개된 무료 자료입니다. 내려받기(HTTPS·OPeNDAP 포함)에는 무료 NASA Earthdata 로그인이 필요하며, 데이터셋 DOI 인용을 요청합니다.
account_required: true

summary: >-
  MODIS와 VIIRS 구름 기록을 하나로 잇기 위해 NASA가 만든 연속성 구름 자료입니다. VIIRS에는 MODIS의 CO2 흡수(13 µm대)·수증기(6.7·7.3 µm) 밴드가 없고 단파적외 밴드 파장도 달라(2.13 µm 대 2.25 µm)
  MODIS 표준 알고리즘을 그대로 옮길 수 없으므로, 두 센서에 공통으로 있는 밴드만 쓰는 같은 알고리즘을 VIIRS와 Aqua MODIS 모두에 적용했습니다.
  구름 마스크(CLDMSK)는 MOD35를 계승한 MODIS-VIIRS 구름 마스크(MVCM)이고, 구름 특성(CLDPROP)은 NOAA CLAVR-x의 구름 상단·상 알고리즘과 MOD06 계승 광학 특성(광학두께·유효 반경·수액량)을 담으며,
  1° 일·월 격자 통계도 제공합니다. Aqua MODIS판이 있어 2002년부터 같은 알고리즘으로 이어진 오후 관측 시계열을 만들 수 있다는 점이 핵심입니다.

time_convention:
  summary: >-
    L2(CLDPROP_L2·CLDMSK_L2)는 위성이 지나간 순간의 관측값이며, 파일 이름의 시각(AYYYYDDD.HHMM)은 그래뉼 시작 시각(UTC)입니다. 구름 마스크·구름 상단 특성은 주간·야간 모두,
    광학 특성은 주간에만 있습니다. L3 일자료(CLDPROP_D3)는 그날 L2를 1° 칸마다 모은 통계(평균·표준편차·화소 수·합·제곱합·히스토그램)이고, 월자료(CLDPROP_M3)는 일자료를 모아 만듭니다.
  points:
    - "Aqua·Suomi NPP·NOAA-20·NOAA-21 모두 지방시 13:30 무렵 상승 통과하는 주간 관측입니다. 같은 오후 궤도라도 위성마다 통과 시각이 조금씩 다르고, Aqua는 2021년 3월 마지막 궤도 조정 뒤 늦어져 2026년 8월 무렵 약 15:50으로 예상되었으므로 최근 Aqua MODIS 값에는 관측 시각 차이가 섞입니다."
    - "Terra(오전 10:30)를 잇는 연속 구름 제품은 없습니다. MODIS 표준 제품(MOD06)의 Terra 값과 이 자료를 섞지 마세요."
    - "L3는 주간(`_Day`)·야간(`_Night`)·전체 통계가 따로 있습니다. 구름 면적비 같은 변수는 주간·야간 표본 시각이 달라 일주기 영향을 받으므로 어느 통계를 썼는지 밝히세요."
    - "L3 변수는 그룹 구조(`Cloud_Fraction/Mean`, `Cloud_Optical_Thickness_Liquid/Mean`처럼 변수 이름 아래 통계)로 되어 있어, MODIS MOD08(`Cloud_Fraction_Mean`)과 이름 체계가 다릅니다."
  source: https://atmosphere-imager.gsfc.nasa.gov/sites/default/files/ModAtmo/L3_CLDPROP_User_Guide_v2.0.pdf
  source_name: "Level-3 Continuity Cloud Properties (CLDPROP_L3) User Guide + CLDPROP·CLDMSK 컬렉션 설명(CMR) + LAADS MODIS to VIIRS Transition"

variables:
  note: >-
    CMR 변수 목록(UMM-Var) 기준 이름입니다. 파일은 NetCDF-4이며 L2 과학 변수는 `geophysical_data/` 그룹 안에 있습니다. Aqua MODIS·SNPP·NOAA-20 파일의 변수 이름이 같습니다.
    일부 변수는 정수로 저장되어 scale_factor·add_offset 속성이 붙어 있으므로(예: 구름 상단 온도 scale 약 0.0079, offset 100) xarray처럼 자동 변환하는 도구로 읽으세요.
  full_list: https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/archives/Document%20Archive/Science%20Data%20Product%20Documentation/L2_Cloud_Properties_UG_v1.2_March_2021.pdf
  groups:
    - name: 구름 마스크 L2 (CLDMSK_L2_VIIRS_NOAA20·NOAA21·SNPP, CLDMSK_L2_MODIS_Aqua)
      kind: instant
      period: 통과 시각
      items:
        - text: "정수 구름 마스크 — `geophysical_data/Integer_Cloud_Mask` (0=구름, 1=구름 가능, 2=맑음 가능, 3=맑음 확신, -1=결과 없음)"
          std: [cloud_phase_mask]
        - "맑은 하늘 신뢰도 — `geophysical_data/Clear_Sky_Confidence` (0~1, 클수록 맑음)"
        - text: "구름 마스크·분광 검사 비트 — `geophysical_data/Cloud_Mask` (바이트 배열)"
          std: [cloud_phase_mask]
    - name: 구름 특성 L2 — 구름 상단·상 (CLDPROP_L2_VIIRS_NOAA20·SNPP, CLDPROP_L2_MODIS_Aqua)
      kind: instant
      period: 통과 시각
      items:
        - "구름 상단 기압(NOAA CLAVR-x AWG) — `geophysical_data/Cloud_Top_Pressure` (hPa)"
        - "구름 상단 높이(CLAVR-x AWG) — `geophysical_data/Cloud_Top_Height` (m)"
        - "구름 상단 온도(CLAVR-x AWG) — `geophysical_data/Cloud_Top_Temperature` (K)"
        - "구름 상단 상(CLAVR-x) — `geophysical_data/Cloud_Phase_Cloud_Top_Properties`"
        - "11 µm 구름 유효 방출률 — `geophysical_data/Cloud_Effective_Emissivity` (무차원)"
    - name: 구름 특성 L2 — 광학 특성, 주간 (CLDPROP_L2_*)
      kind: instant
      period: 통과 시각 (주간)
      items:
        - "구름 광학두께(2.2 µm 밴드 조합) — `geophysical_data/Cloud_Optical_Thickness` (무차원, scale 0.01)"
        - "구름 유효 입자 반경(2.2 µm) — `geophysical_data/Cloud_Effective_Radius` (µm, scale 0.01)"
        - text: "구름 수액량(2.2 µm) — `geophysical_data/Cloud_Water_Path` (g m-2)"
          std: [cloud_water]
        - "광학 산출에 쓴 구름 상 — `geophysical_data/Cloud_Phase_Optical_Properties` (0~4)"
        - text: "1.6 µm·3.7 µm 광학두께 — `geophysical_data/Cloud_Optical_Thickness_16`, `geophysical_data/Cloud_Optical_Thickness_37` (무차원)"
          std: [cloud_optical]
        - "광학두께 상대 불확실성 — `geophysical_data/Cloud_Optical_Thickness_Uncertainty` (상대값)"
    - name: 구름 특성 L3 일·월 1° (CLDPROP_D3·CLDPROP_M3 _VIIRS_NOAA20·SNPP, _MODIS_Aqua)
      kind: mean
      period: 일 또는 월
      items:
        - text: "구름 면적비 평균 — `Cloud_Fraction/Mean` (무차원)"
          std: [cloud]
        - text: "주간·야간 구름 면적비 평균 — `Cloud_Fraction_Day/Mean`, `Cloud_Fraction_Night/Mean` (무차원)"
          std: [cloud]
        - "구름 상단 기압 평균 — `Cloud_Top_Pressure/Mean` (hPa)"
        - "구름 상단 온도 평균 — `Cloud_Top_Temperature/Mean` (K)"
        - "물·얼음 구름 광학두께 평균(1.6/2.2 µm) — `Cloud_Optical_Thickness_1621_Liquid/Mean`, `Cloud_Optical_Thickness_1621_Ice/Mean` (무차원)"
        - "물 구름 광학두께 평균 — `Cloud_Optical_Thickness_Liquid/Mean` (무차원)"
        - "물 구름 유효 반경 평균 — `Cloud_Effective_Radius_Liquid/Mean` (µm)"
        - text: "물 구름 수액량 평균 — `Cloud_Water_Path_Liquid/Mean` (g m-2)"
          std: [cloud_water]
        - text: "구름 면적비 화소 수 — `Cloud_Fraction/Pixel_Counts` (개)"
          kind: accum

access:
  - name: LAADS DAAC (검색·주문·직접 받기)
    url: https://ladsweb.modaps.eosdis.nasa.gov/search/order/2/CLDPROP_L2_VIIRS_SNPP--5111
    method: 웹 검색·HTTPS 직접 받기(CLDPROP V1.1은 archive/allData/5111/, CLDMSK V2는 5200/) / LAADS API-V2 / OPeNDAP
    note: >-
      short name 예: CLDPROP_L2_VIIRS_NOAA20·CLDPROP_D3_VIIRS_NOAA20·CLDPROP_M3_VIIRS_NOAA20·CLDPROP_*_MODIS_Aqua·CLDMSK_L2_VIIRS_NOAA20·CLDMSK_L2_VIIRS_NOAA21·CLDMSK_L2_MODIS_Aqua
      (Suomi NPP는 SNPP). CMR version은 CLDPROP "1.1", CLDMSK V2 "2"(NOAA-21 마스크는 "1")입니다. 2026-04-30부터 OPeNDAP도 Earthdata 로그인이 필요합니다.
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search?q=CLDPROP
    method: 웹 검색 / earthaccess(파이썬)
    note: CLDPROP·CLDMSK로 검색하면 센서·위성·버전별 컬렉션이 나옵니다. COSP 시뮬레이터 비교용 L3(CLDPROPCOSP_D3·M3)도 따로 있습니다.

example:
  lang: python
  note: >-
    earthaccess로 NOAA-20 CLDPROP 월자료를 받아 xarray로 구름 면적비 월평균을 읽는 예입니다. L3 변수는 NetCDF 그룹 안에 있으므로 group 인자를 씁니다. 그룹·좌표 이름은 파일에서 다시 확인하세요.
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="CLDPROP_M3_VIIRS_NOAA20", version="1.1",
        temporal=("2024-07-01", "2024-07-31"),
    )
    files = earthaccess.download(results[:1], "cldprop")

    import netCDF4
    with netCDF4.Dataset(files[0]) as nc:
        print(list(nc.groups))                   # 변수 그룹 목록 확인
    cf = xr.open_dataset(files[0], group="Cloud_Fraction")["Mean"]
    print(float(cf.mean()))

tips:
  - "MODIS 표준 구름(MOD06·MOD08)과 이 연속 제품은 같은 Aqua 관측이어도 값이 다릅니다(구름 상단 알고리즘, 액체 굴절률, QA, 다층운 검출 여부가 다름). MODIS-VIIRS 장기 분석에는 MOD06 대신 Aqua MODIS CLDPROP을 쓰세요."
  - "Platnick et al. (2021)에 따르면 VIIRS 2.25 µm와 MODIS 2.13 µm 밴드 차이로 2.x µm 유효 반경이 센서마다 체계적으로 다르고, 이 차이가 센서 간 보정 차이와 완전히 분리되지는 않았습니다. 1.6 µm(`_16`) 산출은 두 센서 차이가 상대적으로 작은지 함께 확인하세요."
  - "VIIRS는 MODIS의 CO2·수증기 흡수 밴드가 없어 극야 지역 구름 검출이 약합니다. MVCM 사용자 가이드는 13.3 µm 검사가 빠졌고 6.7·7.3 µm 손실을 새 검사로 일부만 보완했다고 밝힙니다. 극지 겨울 구름 마스크는 조심해서 쓰세요."
  - "Suomi NPP 판은 2026-11-02 이후 끊기고, NOAA-21의 CLDPROP은 아직 없습니다(마스크만 있음). VIIRS 시계열을 이어 가려면 NOAA-20 판으로 옮기세요."
  - "Aqua MODIS 판은 Aqua 궤도 표류(2021년 이후 통과 시각이 늦어짐)의 영향을 받습니다. 2021년 이후 Aqua와 VIIRS 차이에는 관측 시각 차이가 들어 있습니다."
  - "2023년 10월 연속 구름 마스크 알고리즘이 버그 수정과 함께 OISST 입력으로 바뀌었고(버전 번호는 그대로, product_version 1.0.5), 2023-01-01 이후 자료가 재처리되었습니다. 2026년 4월에는 375 m 마스크를 더한 CLDMSK V2가 나왔으니 마스크 버전을 확인하세요."
  - "구름 특성 L3는 NetCDF 그룹 구조라 `xr.open_dataset(path)`만으로는 변수가 보이지 않습니다. `group=` 인자나 netCDF4로 그룹을 열어야 합니다."

