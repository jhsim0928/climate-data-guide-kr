transitions:
  - from: CLDMSK V1 (MVCM 연속 구름 마스크)
    to: CLDMSK V2
    status: completed
    date: "2026-04"
    summary: >-
      2026년 4월 28일 연속 구름 마스크 V2(Suomi NPP·NOAA-20 VIIRS, Aqua MODIS)가 공개되었고, 영상기와 사운더(AIRS·CrIS)를 결합한 마스크 2종이 새로 나왔습니다.
      V2는 보정 조정된 VIIRS L1B를 입력으로 쓰고 주간 375 m I밴드 마스크를 더했습니다. NOAA-21 마스크는 2026-10-13 기준 V1만 있고, V1 컬렉션의 배포 종료 일정은 공지되지 않았습니다.
    changes:
      - aspect: 입력
        before: 기존 VIIRS L1B
        after: 보정 조정된 VIIRS L1B
      - aspect: 해상도
        before: VIIRS 750 m·MODIS 1 km
        after: 같음 + VIIRS 주간 375 m I밴드 구름 마스크 추가
      - aspect: 제품 구성
        before: "CLDMSK_L2_VIIRS_SNPP·NOAA20·NOAA21, CLDMSK_L2_MODIS_Aqua"
        after: "V2: SNPP·NOAA20·MODIS_Aqua + 사운더 결합 CLDMSK_L2_MODIS-AIRS_Aqua·CLDMSK_L2_VIIRS-CRIS_SNPP (NOAA-21은 V1 유지)"
      - aspect: 버전 표기
        before: "CMR version 1, DOI .001"
        after: "CMR version 2, DOI .002"
    impacts:
      - 한 분석 안에서 V1과 V2 마스크를 섞지 마세요. CLDPROP V1.1이 어느 마스크 버전을 입력으로 쓰는지는 파일 속성으로 확인하세요.
    sources:
      - name: Release of MODIS-VIIRS Cloud Mask Version 2.0 Collection Products (LAADS, 2026-04-28)
        url: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199528
      - name: CLDMSK_L2_VIIRS_SNPP V2 컬렉션 설명 (CMR 메타데이터)
        url: https://cmr.earthdata.nasa.gov/search/collections.umm_json?concept_id=C3860045339-LAADS

notices:
  - date: "2026-10-30"
    level: warning
    title: Suomi NPP 자료 전달 종료 시각 변경 — 2026년 11월 2일 15:40 UTC (한국 시간 11월 3일 00:40)
    body: >-
      NOAA NESDIS가 10월 30일 세 번째 갱신 공지에서 Suomi NPP 자료 전달 종료 시각을 2026년 11월 2일 13:00 UTC에서 15:40 UTC로 바꿨습니다(VIIRS·ATMS·CERES·OMPS·HRD 직접 수신 모두, 영구 종료).
      위성은 2026년 12월 1일부터 약 12일까지 고도를 낮춰 남태평양 상공에서 대기권에 재진입시킬 예정입니다. 이어 쓸 자료는 NOAA-21(1순위)·NOAA-20(2순위) 판입니다.
    source: https://www.nesdis.noaa.gov/news/update-3-cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-november-02-2026-1540-utc-and-decommissioning-issued-october-30-2026-1400-utc
  - date: "2026-10-06"
    level: critical
    title: Suomi NPP 자료 전달 2026년 11월 2일 종료 — CLDPROP·CLDMSK SNPP 판 대신 NOAA-20으로
    body: >-
      LAADS DAAC는 NOAA NESDIS 결정(2026-08-03 발표)에 따라 Suomi NPP 과학 자료 전달이 2026년 11월 2일 13:00 UTC에 끝난다고 공지했습니다(일정은 바뀔 수 있음).
      CLDPROP_L2·D3·M3_VIIRS_SNPP, CLDPROPCOSP_D3·M3_VIIRS_SNPP, CLDMSK_L2_VIIRS_SNPP·CLDMSK_L2_VIIRS-CRIS_SNPP가 대상이며 NOAA-20 판으로 옮기라고 안내합니다(구름 마스크는 NOAA-21 판도 있음). 과거 SNPP 자료는 계속 받을 수 있습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199516
  - date: "2026-08-11"
    level: warning
    title: Suomi NPP 이상(2026-08-02) — 8월 3~6일 자료 처리 제외
    body: >-
      8월 2일 02:05 UTC Suomi NPP 위성 이상으로 과학 자료가 끊겼다가 8월 4일 준실시간 처리가, 10일 확정판 처리가 재개되었습니다. 8월 3일 02:00 UTC~6일 16:24 UTC 자료는 처리하지 않습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199518
  - date: "2026-07-27"
    level: warning
    title: Suomi NPP 이상(2026-07-10~17) — 5월 1일 이후 자료를 새 보정표로 재생산
    body: >-
      7월 10일 Suomi NPP가 비정상 상태에 들어가 7월 17일까지 과학 자료가 생산되지 않았고, 이 기간 자료는 복구되지 않을 수 있다고 밝혔습니다. 확정판 처리는 VIIRS 보정팀의 새 보정표를 기다려 재개되었고,
      2026년 5월 1일 04:00 UTC 이후 자료를 새 보정표로 다시 만든다고 공지했습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199520
  - date: "2026-04-28"
    level: info
    title: MODIS-VIIRS 구름 마스크 V2 공개 — 사운더 결합 마스크 추가
    body: >-
      LAADS DAAC가 MOD35를 계승한 MODIS-VIIRS 구름 마스크(MVCM) V2를 Suomi NPP·NOAA-20 VIIRS와 Aqua MODIS용으로 공개했습니다. 영상기의 해상도와 사운더(AIRS·CrIS)의 흡수 밴드를 결합해
      야간·극지 검출을 높인 CLDMSK_L2_MODIS-AIRS_Aqua와 CLDMSK_L2_VIIRS-CRIS_SNPP도 새로 나왔습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199528
  - date: "2026-03-20"
    level: warning
    title: Aqua 과학 운용 2027년 9월 종료 전망 — Aqua MODIS 연속 구름 제품도 함께 종료
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Aqua의 과학 운용이 2027년 9월에 끝날 것으로 전망했습니다.
      그 뒤에는 CLDPROP·CLDMSK의 Aqua MODIS 판도 새 자료가 나오지 않으므로, MODIS-VIIRS 겹침 기간은 그때까지입니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2024-10-09"
    level: info
    title: NOAA-21 VIIRS 구름 마스크 공개
    body: >-
      LAADS DAAC가 NOAA-21 VIIRS 연속 구름 마스크(CLDMSK_L2_VIIRS_NOAA21, V1.0)를 공개했습니다. 기록은 2023년 2월 10일부터입니다. NOAA-21 구름 특성(CLDPROP)은 2026-10-13 기준 아직 없습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199558
  - date: "2023-10-10"
    level: info
    title: 연속 구름 마스크 알고리즘 갱신 — 2023-01-01 이후 재처리
    body: >-
      Atmosphere SIPS가 버그를 고치고 최신 VIIRS L1B와 OISST(기존 Reynolds 주간 SST 대신)를 쓰도록 연속 구름 마스크를 갱신했습니다. 컬렉션 번호는 그대로이고 product_version 속성이 1.0.5로 바뀌었으며,
      SNPP·NOAA-20·Aqua MODIS 구름 마스크와 구름 특성(L2와 일·월 L3)을 2023-01-01부터 재처리했습니다. 맑은 하늘 신뢰도 차이는 대부분 매우 작습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199591
  - date: "2023-02-07"
    level: info
    title: Aqua MODIS 연속 구름 제품 재처리(2022-04-17~07-26, 혼선 보정)
    body: >-
      Aqua 안전 모드(2022-03-31~04-14) 뒤 밴드 27~30 L1B 혼선 보정이 표류한 문제를 고치기 위해 CLDMSK_L2_MODIS_Aqua와 CLDPROP_L2·D3·M3_MODIS_Aqua의 2022-04-17~07-26 자료를 재처리했습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199620

