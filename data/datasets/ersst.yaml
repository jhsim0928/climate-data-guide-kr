# ─────────────────────────────────────────────────────────────
# ERSST v5 — 데이터셋 정보 파일
# 후속 버전 ERSST v6가 나와 v5는 대체 예정 상태입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: ersst
name: ERSST v5
full_name: NOAA Extended Reconstructed Sea Surface Temperature, Version 5 (NOAA 확장 재구성 해수면온도 5판)
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 20
domains: [해양]
provider: NOAA National Centers for Environmental Information (NCEI)

status: deprecated
status_note: >-
  후속 버전 ERSST v6가 공개되어 NOAA의 공식 SST 자료가 v6로 바뀌었습니다. NOAA PSL은 2026년 4월에
  "NCEI가 2026년 6월 v5를 중단할 예정"이라고 공지했지만, 2026년 10월 확인 시 NCEI·PSL의 v5 파일은 아직 2026년 9월분까지 갱신되고 있습니다.
  언제든 갱신이 멈출 수 있으니 새 연구는 v6로 시작하고, v5는 기존 결과 재현용으로만 쓰는 것을 권장합니다.

successor:
  name: ERSST v6
  url: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
  note: >-
    기간 1850년 1월~현재, 2° 월별(v5와 같은 형식). 인공신경망(ANN) 내삽, 품질관리 강화, 해빙역 대리 SST 개선이 적용됐고
    편차 기준 기후값이 1991~2020년으로 바뀌었습니다. 인용: Huang et al. (2025), J. Climate, 38(4), 1105–1121,
    doi:10.1175/JCLI-D-23-0707.1 및 Part II, 1123–1136, doi:10.1175/JCLI-D-24-0185.1.
    데이터셋 DOI는 10.25921/z7cw-es89 입니다(v5의 10.7289/V5T72FNM과 다름).

transitions:
  - from: ERSST v5
    to: ERSST v6
    to_id: ersst-v6
    status: completed
    date: "2025-12"
    summary: >-
      격자(2° 월별)와 관측 기반이라는 성격은 그대로 두고, 빈 곳을 채우는 내삽 방법을 EOT에서 인공신경망(ANN)으로 바꾼 개정판입니다.
      선박 관측 품질관리, 대규모 필터, 해빙역 대리 SST도 함께 고쳐 관측이 드문 시기·해역과 1970년대 이후 관측과의 일치도가 좋아졌습니다.
      편차 기준 기후값이 1991~2020년으로 바뀌었고, 2026년에 NOAA의 ENSO 판정과 NOAAGlobalTemp가 v6로 옮겨갔습니다.
    changes:
      - aspect: 기간
        before: "1854-01 ~ 현재"
        after: "1850-01 ~ 현재"
      - aspect: 격자·시간 해상도
        before: "2° × 2°, 월평균"
        after: "2° × 2°, 월평균 (변화 없음)"
      - aspect: 현장 관측 입력
        before: "ICOADS Release 3.0 + Argo"
        after: "ICOADS Release 3.0.2 + Argo"
      - aspect: 빈 곳 채우는 방법(재구성)
        before: "경험적 직교 원격상관(EOT) 함수로 재구성 (v5에서 공간 필터 축소, 북극 EOT 추가)"
        after: "인공신경망(ANN) 내삽으로 교체"
      - aspect: 시간 평활
        before: "3개월 이동평균 적용"
        after: "3개월 이동평균 제거"
      - aspect: 선박 관측 품질관리
        before: "기존 품질관리"
        after: "근처 부이·Argo 값과 비교하는 최근접 이웃 검사(nearest neighbor check) 추가"
      - aspect: 대규모 필터
        before: "없음"
        after: "SST 슈퍼관측에 200 km 이상 규모 필터(LS200) 적용"
      - aspect: 해빙 자료·해빙역 SST
        before: "해빙 농도 HadISST2(~2015) + NCEP(2016~)"
        after: "같은 해빙 농도 자료 사용, 시공간적으로 변하는 해빙-SST 대리값 알고리즘으로 개선 (ANN만 쓴 판 대비 해빙역 편향 0.67°C, RMSD 0.29°C 감소)"
      - aspect: 편차(ssta) 기준 기후값
        before: "1971~2000년"
        after: "1991~2020년"
      - aspect: 배포 형식·위치
        before: "NetCDF + ASCII, ersst.v5.YYYYMM.nc (/pub/data/cmb/ersst/v5/netcdf/)"
        after: "NetCDF, ersst.v6.YYYYMM.nc (/pub/data/cmb/ersst/v5/v6/, /data/.../v6/access/). 파일 구성 규칙은 v5와 같음. NCEI 메타데이터에는 ASCII도 적혀 있으나 공개 폴더에서는 확인되지 않음"
      - aspect: NOAA 현업 활용
        before: "NOAA ENSO 판정, NOAAGlobalTemp 6.0.0까지의 해양 부분"
        after: "2026년부터 NOAA ENSO 판정·RONI, NOAAGlobalTemp 6.1.0(2026년 1월 분석~)"
      - aspect: 정확도 (관측 대비)
        before: "기준"
        after: "1850~2021년 공간 상관 약 5% 상승, RMSD 0.03°C 감소. 열대 태평양과 남반구 60°S~30°S에서 개선이 큼"
    impacts:
      - v5와 v6를 한 시계열로 이어 붙이지 마세요. 내삽 방법이 달라 같은 달이라도 값과 공간 패턴이 다릅니다.
      - 기후값 기준이 달라 두 버전의 ssta는 직접 비교할 수 없습니다. 비교하려면 같은 기간으로 기후값을 다시 계산하세요.
      - v6를 쓰는 NOAA ENSO 지수(RONI 등)는 v5로 계산한 과거 ONI와 값이 달라질 수 있습니다. 엘니뇨·라니냐 사례 목록을 다시 확인하세요.
      - 3개월 이동평균이 빠져 v6의 월별 변동이 더 클 수 있습니다. 평활 여부를 고려해 분산·극값을 비교하세요.
      - v6의 불확실성 자료는 아직 개발 중(2026년 공개 예정으로 안내)이므로, 불확실성이 필요한 분석은 공개 상황을 확인하세요.
    sources:
      - name: Huang et al. (2025) ERSSTv6 Part I
        url: https://doi.org/10.1175/JCLI-D-23-0707.1
      - name: Huang et al. (2025) ERSSTv6 Part II
        url: https://doi.org/10.1175/JCLI-D-24-0185.1
      - name: NCEI ERSST 제품 페이지
        url: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
      - name: NCEI 뉴스 — Key NOAA Dataset Upgraded Using AI (2025-12-04)
        url: https://www.ncei.noaa.gov/node/8486
      - name: NCEI 뉴스 — NOAAGlobalTemp 6.1.0 (2026-04-13)
        url: https://www.ncei.noaa.gov/node/8841
      - name: NOAA PSL Data Notices
        url: https://psl.noaa.gov/data/notices/
      - name: NCAR Climate Data Guide — ERSSTv6
        url: https://climatedataguide.ucar.edu/climate-data/sst-data-noaa-extended-reconstruction-ssts-version-6-ersstv6

period:
  start: "1854-01"
  end: present
  note: >-
    2026-10-11 확인 시 NOAA PSL의 v5 파일은 2026년 9월까지 들어 있습니다. 중단 예고가 있었으므로 갱신이 멈출 수 있습니다.
    초기(관측이 드문 시기) 값은 불확실성이 크며, 공식 문서는 1940년대 이후가 더 신뢰할 만하다고 안내합니다.

resolution:
  spatial_short: "222 km (2°)"
  temporal_short: "1개월"
  spatial: "2° × 2° 위경도 격자 (88°S~88°N)"
  vertical: 해수면 단일층
  temporal: 월평균

coverage:
  short: 전지구
update: 매월 (중단 예고 상태)
license: 미국 정부 공공 자료 — 이용 제한 없음, 데이터셋 DOI와 논문 인용 요청
account_required: false

summary: >-
  NOAA NCEI가 ICOADS 선박·부이 관측과 Argo 자료를 바탕으로 만든 전지구 월별 해수면온도 재구성 자료입니다.
  관측이 빈 곳은 통계적 재구성으로 채워 1854년부터 공간적으로 완전한 2° 격자를 제공합니다. 위성 자료는 쓰지 않는 현장 관측 기반이며,
  NOAA의 ENSO 지수(ONI)와 전지구 기온 자료(NOAAGlobalTemp)의 해양 부분으로 오랫동안 쓰였습니다.

time_convention:
  summary: >-
    월별 분석 자료로, 모든 값은 해당 달의 평균 해수면온도(또는 그 편차)입니다. 시간 값은 그 달을 가리키는 표시일 뿐 특정 시각의 순간값이 아닙니다.
  points:
    - "NOAA PSL 파일(sst.mnmean.nc)은 statistic을 'Mean', 평균 구간(avg_period)을 1개월로 표기합니다."
    - "NCEI 원본 파일(ersst.v5.YYYYMM.nc)은 한 달에 한 파일이며, 시간 표기 위치(1일 또는 15일)는 배포처마다 다릅니다. 예: ERDDAP 미러는 time을 'Start Time'으로 표기하지만 시작 값은 1854-01-01, 마지막 값은 2026-08-15로 일자가 일정하지 않습니다. 날짜가 아니라 연·월로 맞추세요."
    - "편차(ssta)는 1971~2000년 월별 기후값 기준입니다. 후속 v6는 1991~2020년 기준입니다."
  source: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
  source_name: NCEI ERSST 제품 페이지 / NOAA PSL·ERDDAP 파일 메타데이터

variables:
  note: NCEI 원본 NetCDF 파일 기준 변수명입니다. NOAA PSL 묶음 파일(sst.mnmean.nc)에는 sst만 들어 있습니다.
  full_list: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C00927
  groups:
    - name: 해수면온도
      kind: mean
      period: 월
      items:
        - "월평균 해수면온도 — `sst` (°C)"
        - text: "해수면온도 편차(1971~2000년 기후값 기준) — `ssta` (°C)"
          kind: mean
          period: 월
          note: 월평균 SST에서 1971~2000년 월별 기후값을 뺀 편차

access:
  - name: NCEI 직접 다운로드 (월별 NetCDF)
    url: https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/netcdf/
    login: false
    method: HTTPS (wget / curl)
    note: ersst.v5.YYYYMM.nc 처럼 한 달에 한 파일입니다. ASCII 형식은 같은 위치의 ascii/ 폴더에 있습니다.
  - name: NOAA PSL (전 기간 한 파일)
    url: https://psl.noaa.gov/data/gridded/data.noaa.ersst.v5.html
    login: false
    method: 웹 다운로드 / THREDDS / OPeNDAP
    note: 전 기간이 sst.mnmean.nc 한 파일에 들어 있어 바로 쓰기 편합니다. 1991~2020년 등 기후값 파일도 함께 있습니다.
  - name: NOAA CoastWatch ERDDAP (nceiErsstv5)
    url: https://coastwatch.pfeg.noaa.gov/erddap/info/nceiErsstv5/index.html
    login: false
    method: ERDDAP (영역·기간 선택 후 NetCDF/CSV 등)
    note: NCEI 파일을 매달 받아 다시 배포하는 미러라 며칠 늦게 반영됩니다.

tips:
  - 새 연구라면 ERSST v6를 쓰세요. NOAA의 ENSO 판정과 RONI 지수, NOAAGlobalTemp가 이미 v6 기반으로 바뀌었습니다.
  - v5와 v6는 편차 기준 기후값이 다릅니다(v5 1971~2000, v6 1991~2020). 두 버전의 ssta를 그대로 비교하면 안 됩니다.
  - v5와 v6를 한 시계열로 이어 붙이지 마세요. 내삽 방법이 달라 같은 달에도 값이 다릅니다.
  - 논문 재현 등으로 v5가 꼭 필요하다면 지금 전 기간을 받아 두세요. 갱신 중단 뒤 배포 위치가 바뀔 수 있습니다.

