notices:
  - date: "2026-10-02"
    level: warning
    title: NCEI 클라우드 이전으로 자료 접근 지연 (2026-11-30까지 예정)
    body: NCEI 서버에서 다운로드가 느리거나 실패할 수 있습니다. 안 될 때는 PSL이나 ERDDAP 사본을 이용하세요.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2026-08-03"
    level: info
    title: ERSST v6가 NOAA ENSO 판정의 공식 SST 자료로 전환
    body: NOAA가 현재 ENSO 상태를 판정할 때 ERSST v6를 쓰도록 바꿨고, RONI(상대 해양 엘니뇨 지수)도 v6 기반으로 갱신했습니다.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-04-26"
    level: critical
    title: ERSST v5 중단 예고 (2026년 6월)
    body: >-
      NOAA PSL이 "NCEI가 2026년 6월 ERSST v5를 중단하고 v6로 대체할 예정"이라고 공지했습니다.
      2026년 10월 확인 시점에는 v5 파일이 아직 갱신되고 있으나, 언제든 멈출 수 있습니다.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-04-13"
    level: info
    title: NOAAGlobalTemp 6.1.0, 해양 부분을 ERSST v6로 교체
    body: 2026년 1월 분석부터 NOAA 전지구 기온 자료(NOAAGlobalTemp) 6.1.0이 ERSST v6를 사용합니다.
    source: https://www.ncei.noaa.gov/node/8841
  - date: "2026-03-06"
    level: info
    title: NOAA PSL에 ERSST v6 추가
    body: PSL이 ERSST v6(1850년~, 월별)를 자료 목록에 추가하고 매달 갱신하기 시작했습니다.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-12-04"
    level: warning
    title: ERSST v6 공개
    body: >-
      NCEI가 인공신경망 내삽을 적용한 ERSST v6를 공개했습니다. v5보다 공간 상관이 약 5% 높아지고 오차가 줄었으며,
      특히 열대 태평양과 남반구 중위도, 해빙역에서 개선이 크다고 밝혔습니다.
    source: https://www.ncei.noaa.gov/node/8486

