# ─────────────────────────────────────────────────────────────
# SODA4 — 데이터셋 정보 파일
# 메릴랜드대 SODA 4판(soda4.15.2): MOM5/SIS1, ERA5 강제력, 1/10°·75층 중규모 소용돌이 분해 해양·해빙 재분석, 1980~2024-06.
# 이전 판 SODA3는 soda3.yaml (SODA3 → SODA4 비교는 그 파일의 transitions).
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: soda4
name: SODA4
full_name: Simple Ocean Data Assimilation version 4 (메릴랜드대 1/10° 해양·해빙 재분석 4판, SODA4.15.2)
category: reanalysis
domain: ocean
group: 재분석
order: 35
domains: [해양, 해빙]
provider: 미국 메릴랜드대(University of Maryland) 대기해양과학과 SODA 프로젝트 (Gennady Chepurin·James Carton 등, NSF 지원)

status: active
status_note: >-
  현재 판은 ERA5 강제력의 SODA4.15.2이며, UMD 서버에 1980년부터 2024년 6월 하순까지의 자료가 있습니다(2026-07 서버 정리·공개).
  매달 갱신되는 자료가 아니라 묶어서 공개되며, 다음 연장 일정은 발표되지 않았습니다.
  기술 논문은 EGUsphere 프리프린트로 공개 토론이 끝났고(2026-04 저자 최종 답변), 2026-10-12 확인 시 학술지 게재본은 확인되지 않았습니다.

period:
  start: "1980"
  end: "2024-06"
  note: >-
    모델은 1980-01-01에 SODA3.15.2에서 보간한 초기장으로 출발합니다. 2026-10-12 확인 시 5일 평균 파일은 재격자·원 격자 해빙이 1980_02_02부터,
    원 격자 해양은 1983_01_02부터(1980~1982년 원 격자 파일은 복구 불가 누락)이고, 마지막 파일은 재격자 해양 2024_06_20, 원 격자 해양·재격자 해빙 2024_06_25입니다.
    포털·논문 제목은 "1980–2024"이지만 2024년은 상반기까지만 있으며, 2024년 월평균 파일도 다른 해의 절반 크기입니다.

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "5일"
  spatial: >-
    원 격자: GFDL MOM5.1 삼극(tripolar) Arakawa B 격자 3600 × 2700, 명목 0.1°(프리프린트: 적도 약 11 km, 위도 60°에서 약 5.5 km) /
    재격자: 0.1° × 0.1°, 3600 × 1700(보충자료 표기 — 포털·README는 Mercator 격자, 프리프린트는 균일 위경도 격자로 적음) /
    분석 증분: 1° × 1° 격자
  vertical: >-
    75개 z* 층(표층 약 1.1 m ~ 심층 최대 약 200 m 두께, 부분 바닥 셀). 재격자 파일의 층 구성은 문서마다 설명이 다릅니다 —
    포털: 원 격자 z* 층을 하나 건너 하나씩, README: 75층, 프리프린트: 재격자 상태 변수는 2005년 이전 0~1017 m, 2005년 이후 0~2006 m만
  temporal: 5일 평균(원 격자·재격자, 해양·해빙), 달력월 평균(원 격자·재격자), 10일 평균 수송량(원 격자), 10일·월 분석 증분(1°)

update: 비정기 일괄 공개 (최근 2026-07, 서버 파일 날짜 기준) — 연장 계획 미발표
license: UMD 포털·README에 자료 라이선스 표기 없음, 사용 판(version)을 밝히고 Chepurin et al. (2025) 인용 요청 / 모델·동화 코드(Zenodo)는 CC BY 4.0
account_required: false

summary: >-
  SODA4는 메릴랜드대 SODA 프로젝트의 4판 전지구 해양·해빙 재분석으로, SODA3와 같은 GFDL MOM5/SIS1 모델과 ERA5 강제력(COARE 벌크 공식)을 쓰되
  해상도를 1/10°·75층으로 높여 대부분 해역에서 중규모 소용돌이를 분해합니다(북극은 소용돌이 일부 표현 수준).
  WOD23 수온·염분 프로파일(Argo·글라이더 포함)과 ICOADS로 보정한 NOAA 위성 SST를 10일 주기 최적내삽(OI)·점진 분석 갱신(IAU)으로 동화하고,
  해빙은 GIOMAS 두께 쪽으로 열속을 완화합니다. 1980~2024년(서버 자료는 2024년 6월까지)을 네 개의 약 10년 스트림으로 나눠 생산했습니다.

time_convention:
  summary: >-
    SODA4 파일은 모두 평균값입니다. `5dy` 파일은 5일 평균 한 장, `mn` 파일은 달력월 평균 1년치, 수송량 `10dy` 파일은 10일 평균입니다.
    파일 이름의 날짜(YYYY_MM_DD)가 평균 구간의 시작·가운데·끝 중 어디인지는 README·프리프린트·보충자료 어디에도 적혀 있지 않습니다.
  points:
    - "5일 파일 날짜는 1980_02_02, 1980_02_07, …처럼 5일 간격이고, 10일 수송량 파일은 1980_02_05, 1980_02_15, …입니다. 정확한 구간은 파일 안의 time 좌표와 구간 속성을 확인하세요."
    - "월평균(mn)은 달력월 평균이며(README), 연 단위 파일(…_mn_ocean_reg_YYYY.nc) 하나에 그해의 달이 모두 들어 있습니다. 2024년 파일은 상반기분만 담긴 것으로 보이니(파일 크기 절반) 열어서 time 길이를 확인하세요."
    - "열플럭스(W/m²)와 담수 플럭스(kg m-2 s-1)는 평균 구간의 평균 플럭스이며 누적량이 아닙니다."
    - "분석 증분(`tcor`, `scor`)은 10일 동화 주기당 변화율(deg-C/10dy, PSU/10dy)로 주어지며, 점진 분석 갱신(IAU)으로 10일에 걸쳐 모델에 더해집니다."
  source: https://www.soda.umd.edu/soda4/soda4_readme.htm
  source_name: "SODA4 README (UMD) + Chepurin et al. (2025) 프리프린트·보충자료 + UMD 서버 파일 목록"

variables:
  note: >-
    Chepurin et al. (2025) 보충자료 표 S2~S5와 SODA4 README 기준 주요 변수입니다. 변수명은 netCDF 파일 안의 이름이며,
    README와 보충자료의 이름이 다른 경우(`w`/`wt`, `aice`/`cn`, `mx`·`my`/`tx_trans`·`ty_trans`)가 있어 실제 파일로 확인하세요.
    표시가 없는 변수는 원 격자·재격자 모두에 있습니다.
  full_list: https://egusphere.copernicus.org/preprints/2025/egusphere-2025-3810/egusphere-2025-3810-supplement.pdf
  groups:
    - name: 3차원 해양 (ocean, 75층)
      kind: mean
      period: 5일 / 월
      items:
        - "잠재수온 — `temp` (°C)"
        - "염분 — `salt` (PSU)"
        - text: "동서·남북 유속 — `u`, `v` (m s-1)"
          note: 원 격자에서는 수치 격자 방향 성분
        - text: "연직 유속 — `wt` (m s-1)"
          note: README 표기는 `w`
        - text: "잠재밀도 — `prho` (kg m-3)"
          note: 원 격자만
    - name: 2차원 해양 (ocean)
      kind: mean
      period: 5일 / 월
      items:
        - "해수면 높이(eta_t + patm/(rho0·g)) — `ssh` (m)"
        - "혼합층 깊이(수온·밀도·염분 기준) — `mlt`, `mlp`, `mls` (m)"
        - text: "바람 응력 — `taux`, `tauy` (N/m²)"
          note: 원 격자만
        - text: "순 해면 열플럭스 — `net_heating` (W/m²)"
          note: 원 격자만
        - text: "해면 총 열플럭스(결합기+복원) — `hflux_total` (W/m²)"
          note: 원 격자만
        - text: "장파·잠열·현열 — `lw_heat`, `evap_heat`, `sens_heat` (W/m²)"
          note: 원 격자만
        - text: "담수 플럭스(P−E+하천) — `pme_river` (kg m-2 s-1)"
          note: 원 격자만
    - name: 해빙 (ice, SIS1 5범주)
      kind: mean
      period: 5일 / 월
      items:
        - text: "해빙 농도 — `cn` (0-1)"
          note: README 표기는 `aice`, 범주별 차원 여부는 파일에서 확인
        - "해빙 두께 — `hi` (m)"
        - "적설 두께 — `hs` (m)"
        - "해빙 질량 — `mi` (kg/m²)"
        - "해빙 속도 — `ui`, `vj` (m/s)"
        - "해양→해빙 열플럭스 — `bheat` (W/m²)"
        - text: "해빙 위 현열·잠열·단파·장파 — `sh`, `lh`, `sw`, `lw` (W/m²)"
          note: 원 격자만
    - name: 수송량 (transport, 원 격자만)
      kind: mean
      period: 10일
      items:
        - "격자면 질량 수송 — `tx_trans`, `ty_trans` (10⁹ kg/s)"
        - "연직 합산 질량 수송 — `tx_int`, `ty_int` (10⁹ kg/s)"
    - name: 분석 증분 (1°, 상층 33개 z* 층)
      kind: mean
      period: 10일 / 월
      items:
        - "수온 증분 — `tcor` (deg-C/10dy)"
        - "염분 증분 — `scor` (PSU/10dy)"

access:
  - name: SODA4 포털 (UMD)
    url: https://www.soda.umd.edu/soda4
    method: 안내 페이지 (파일 링크·wget 예시)
    note: 판 설명, 연도별 월평균 파일 링크, 일괄 내려받기용 wget 명령 예시, 인용 방법이 있습니다.
  - name: UMD 데이터 서버 — SODA4.15.2 재격자 (0.1°)
    url: https://dsrs.atmos.umd.edu/DATA/SODA4.15.2_REG/
    method: HTTP(S) 직접 다운로드
    note: >-
      ocean/·ice/ 폴더에 5일·월평균 netCDF가 있습니다. 해양 5일 파일 하나 약 1.5~1.6 GB, 해양 월평균 1년 파일 17~19 GB,
      해빙 월평균 1년 파일 약 0.4 GB입니다. 2026-10-12 확인 시 해빙 월평균 2021년 파일이 없습니다.
  - name: UMD 데이터 서버 — SODA4.15.2 원 격자 (삼극 3600×2700)
    url: https://dsrs.atmos.umd.edu/DATA/SODA4.15.2_OR/
    method: HTTP(S) 직접 다운로드
    note: >-
      ocean/·ice/·transport/ 폴더가 있습니다. 해양 5일 파일 하나 약 5.2~5.4 GB, 해양 월평균 1년 파일 약 65 GB, 해빙 5일 약 145 MB, 10일 수송량 약 2.2 GB입니다.
      원 격자 해양은 1983년부터입니다. 유역 적분 수송(AMOC 등)은 재격자 대신 원 격자로 계산하라고 포털이 권합니다.
  - name: UMD 데이터 서버 — 자료동화 없는 대조 실험 (SODA4.15.2.0)
    url: https://dsrs.atmos.umd.edu/DATA/SODA4.15.2.0/
    method: HTTP(S) 직접 다운로드
    note: ORIGINAL/·REGRIDED/ 폴더. 같은 강제력·벌크 공식으로 동화 없이 돌린 실험으로, 수지(budget) 진단 비교용입니다.
  - name: UMD 데이터 서버 — 스트림별 원자료·분석 증분 (soda4.15.2_s1 ~ _s4)
    url: https://dsrs.atmos.umd.edu/DATA/
    method: HTTP(S) 직접 다운로드
    note: >-
      프리프린트의 자료 공개 문구가 가리키는 스트림별 폴더입니다(예: soda4.15.2_s1/ 안에 ORIGINAL/·REGRIDED/·SODA/).
      포털의 분석 증분 링크(DATA/soda4.15.2/SODA)는 2026-10-12 서버 목록에 없는 경로였습니다.

example:
  lang: python
  note: "UMD 서버의 0.1° 재격자 5일 평균 파일을 받아 xarray로 엽니다. 해빙 파일은 수십 MB, 해양 파일은 약 1.6 GB입니다."
  code: |
    import urllib.request
    import xarray as xr

    base = "https://dsrs.atmos.umd.edu/DATA/SODA4.15.2_REG/"
    fname = "soda4.15.2_5dy_ice_reg_2024_06_25.nc"         # 해빙 5일 평균 (작은 파일)
    urllib.request.urlretrieve(base + "ice/" + fname, fname)

    ds = xr.open_dataset(fname)
    print(ds)            # 변수 이름(cn/aice 등)과 time 좌표를 먼저 확인
    print(ds["hi"])      # 해빙 두께 (m)

    # 해양 5일 평균(약 1.6 GB): base + "ocean/soda4.15.2_5dy_ocean_reg_2024_06_20.nc"
    # 깊이 좌표가 몇 m까지인지(2005년 이전 ~1017 m) 꼭 확인하세요.

tips:
  - "재격자 파일은 깊이 전체가 아닐 수 있습니다. 프리프린트는 재격자 상태 변수가 2005년 이전 0~1017 m, 2005년 이후 0~2006 m만 담는다고 적었으니, 심층 분석은 원 격자 파일을 쓰거나 깊이 좌표를 먼저 확인하세요."
  - "원 격자 1980~1982년 파일과 일부 5일·10일 파일(1986-06-15, 1993-12-23, 1994-12 일부, 2000-02-10, 2009-01 일부, 2016-07 일부, 2021-09-27 등)은 복구할 수 없게 빠져 있다고 보충자료 표 S6에 적혀 있습니다. 재격자 5일 목록에도 1980-07-21·07-26 파일이 없으니, 시계열을 만들 때 날짜 연속성을 직접 점검하세요."
  - "약 10년씩 네 스트림(1980·1990·2000·2010년 무렵 시작)을 이어 붙인 자료로, 저자들도 이음매에서 '완전히 연속적이지는 않다'고 밝혔습니다. 1990·2000·2010년 전후를 가로지르는 추세·변화점 분석은 조심하세요."
  - "판 이름의 15는 ERA5 강제력, 끝의 2는 COARE 벌크 공식을 뜻합니다. 이름 끝에 .0이 붙은 SODA4.15.2.0은 자료동화를 하지 않은 대조 실험이니 섞어 쓰지 마세요."
  - "원 격자는 북극에서 두 개의 극(유라시아·북미 대륙 위)으로 나뉜 삼극 격자이고, 원 격자 유속은 동서·남북이 아니라 수치 격자 방향입니다. 지도·지역 평균은 재격자, 단면 수송량은 원 격자를 쓰세요."
  - "전체 자료가 약 46 TB입니다. 해양 월평균 1년 파일만 재격자 17~19 GB, 원 격자 약 65 GB이니 필요한 해·변수를 먼저 정하고, 받은 뒤 바로 지역·깊이를 잘라 저장하세요."
  - "프리프린트 기준 알려진 한계: 적도 부근 무역풍이 약간 약한 ERA5 탓에 인위적 동서 수온 경도, 300~1000 m 염분이 EN4.2.2와 약 0.04 PSU 차이, 북극은 해상도 부족·Argo 부재, 프람 해협 유출입 수송이 관측 추정보다 약 20% 작음."

