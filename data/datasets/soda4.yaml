        }
  acknowledgement: >-
    SODA 프로젝트는 사용한 판(SODA4.15.2 등)을 밝히고 Chepurin et al. (2025)를 인용하라고 요청합니다. UMD 서버 자료에는 별도 데이터셋 DOI가 없습니다.
    프리프린트가 학술지에 게재되면 인용 정보가 바뀔 수 있으니 투고 전에 EGUsphere 페이지에서 최종 논문 링크를 확인하세요.
    모델·동화 코드는 Zenodo(doi:10.5281/zenodo.16878109, CC BY 4.0)에 공개되어 있습니다.

notices:
  - date: "2026-07-20"
    level: info
    title: 스트림 합본 자료 폴더 공개 (SODA4.15.2_OR·_REG·.0)
    body: >-
      UMD 서버에 네 스트림을 이어 붙인 원 격자(SODA4.15.2_OR)·재격자(SODA4.15.2_REG) 폴더와 자료동화 없는 대조 실험(SODA4.15.2.0) 폴더가
      2026년 7월 14~20일(서버 파일 날짜) 올라왔습니다. 2024년 자료는 6월 하순까지입니다.
    source: https://dsrs.atmos.umd.edu/DATA/
  - date: "2026-04-16"
    level: info
    title: SODA4 프리프린트 공개 심사 토론 종료
    body: >-
      EGUsphere에서 심사자 3명의 의견(2025-10~12)에 대한 저자 최종 답변이 2026-04-16 게시되었고 토론은 종료되었습니다.
      2026-10-12 확인 시 학술지 게재본(최종 논문) 링크는 아직 없습니다. 한 심사자는 파일 설명을 DOI가 있는 웹 페이지로 옮기라고 요청했습니다.
    source: https://egusphere.copernicus.org/preprints/2025/egusphere-2025-3810/
  - date: "2025-10-01"
    level: warning
    title: 원 격자 일부 출력 파일 영구 누락
    body: >-
      보충자료 표 S6에 따르면 스트림 1의 처음 3년(1980~1982) 원 격자 파일과 일부 5일·10일 원 격자 파일(해양·해빙·수송량)이 복구할 수 없게 빠져 있고,
      빈 곳은 채우지 않았습니다. 재격자 파일은 같은 방식으로 영향받지 않았다고 적혀 있습니다.
    source: https://egusphere.copernicus.org/preprints/2025/egusphere-2025-3810/egusphere-2025-3810-supplement.pdf
  - date: "2025-10-01"
    level: info
    title: SODA4 기술 논문 프리프린트 공개
    body: >-
      SODA4(soda4.15.2, MOM5/SIS1, ERA5 강제력, 0.1°·75층, 1980~2024)의 기술 논문이 EGUsphere 프리프린트로 공개되었습니다(2025-08-05 접수).
      SODA 프로젝트는 이 논문을 SODA4 인용 문헌으로 지정했습니다.
    source: https://doi.org/10.5194/egusphere-2025-3810

