notices:
  - date: "2023-06-01"
    level: critical
    title: ECMWF Public Datasets 서비스 종료 — ECMWF 웹·Web API 다운로드 중단
    body: >-
      2023년 3월 2일 예고대로 ECMWF Public Datasets 서비스(웹 인터페이스와 Web API)가 종료되어 ERA-40을 ECMWF에서 공개적으로 받을 수 없게 되었습니다.
      ECMWF 안내 표에는 ERA-40의 대체 접근 경로가 적혀 있지 않습니다. NCAR GDEX나 CEDA 사본을 이용하세요.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2022-06"
    level: info
    title: ECMWF 아카이브(MARS) 볼로냐 이전 기간 접근 장애
    body: ECMWF 데이터센터의 볼로냐 이전으로 2022년 6월~10월 사이 ERA-40 접근이 중단되거나 느려질 수 있다고 안내되었습니다(이미 종료된 일정).
    source: https://www.ecmwf.int/en/forecasts/dataset/ecmwf-reanalysis-40-years

