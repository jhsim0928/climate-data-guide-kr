    url: https://gdex.ucar.edu/datasets/d117000/
    method: 웹 다운로드(HTTPS) / Globus / 부분 추출·형식 변환
    note: 6시간 지표·플럭스 자료(가우시안 격자). 부분 추출·형식 변환은 NCAR 로그인이 필요합니다.
  - name: NSF NCAR GDEX — ERA-40 2.5° 기압면 월평균 (d120001)
    url: https://gdex.ucar.edu/datasets/d120001/
    method: 웹 다운로드(HTTPS) / Globus / 부분 추출
  - name: NSF NCAR GDEX — ERA-40 2.5° 지표·플럭스 월평균 (d120000)
    url: https://gdex.ucar.edu/datasets/d120000/
    method: 웹 다운로드(HTTPS) / Globus / 부분 추출
  - name: NSF NCAR GDEX — ERA-40 기압면 6시간 분석 (d117001)
    url: https://gdex.ucar.edu/datasets/d117001/
    method: 요청 후 제공
    note: >-
      2026-10-11 확인 시 "현재 공개되지 않은 파일이 포함됨"으로 표시되어, GDEX 문의(Contact Us)로 요청해야 합니다.
      2.5° 6시간 기압면(d118001)·지표(d118000) 자료도 같은 상태입니다.
  - name: CEDA Archive — ERA-40 모델 자료
    url: https://catalogue.ceda.ac.uk/uuid/775634f7e339b5262067e28a5d7b679d
    method: 웹 다운로드
    note: CEDA 계정 필요. 가우시안 격자와 2.5° 격자 자료를 보관하고 있으며, ECMWF 자료 이용 조건이 적용됩니다.

tips:
  - "NCAR Climate Data Guide는 1991년 이후 열대 수분(강수·가강수량)이 관측보다 많고, 강수가 증발을 크게 웃돌며, Brewer-Dobson 순환이 지나치게 강하고, 북극 기온 추세가 비현실적이라는 점을 주요 한계로 꼽습니다. 물순환·성층권·북극 추세 연구에는 쓰지 마세요."
  - 1979년 전후로 위성 자료가 들어오면서 관측 체계가 크게 바뀝니다. 1957~2002년 전체 추세를 계산하면 이 불연속이 섞일 수 있습니다.
  - 기압면이 23층이라 ERA-Interim·ERA5(37층)와 비교할 때는 공통 기압면만 골라 쓰세요.

