# ─────────────────────────────────────────────────────────────
# 브레멘대학 ASI 해빙 농도 (AMSR-E/AMSR2, v5.4) — 데이터셋 정보 파일
# 위성 탭(해빙), 해빙 탭(위성 관측 자료) 교차 수록. 89 GHz 채널을 쓰는 ASI 알고리즘으로 만든 6.25 km 일별 해빙 농도(준실시간).
# 2026-10-13 확인 시 AMSR2 v5.4 일 파일은 2026-10-12분까지 올라와 있고, 서버에 AMSR3 기반 예비(preliminary) 폴더(amsr3/)가 새로 생겼습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: amsr2-asi
name: "ASI AMSR2 (브레멘대학)"
full_name: University of Bremen ASI (ARTIST Sea Ice) Sea Ice Concentration from AMSR-E/AMSR2, version 5.4 (브레멘대학 89 GHz 기반 고해상도 해빙 농도)
category: satellite
domain: satellite
group: 해빙
order: 25
also_in:
  - domain: seaice
    group: 위성 관측 자료
domains: [해빙, 원격탐사]
provider: 독일 브레멘대학 환경물리연구소(IUP) 극지원격탐사 그룹 — 원자료 JAXA GCOM-W1 AMSR2(이전 NASA Aqua AMSR-E)

status: active
status_note: >-
  준실시간 생산이 계속되고 있습니다. 2026-10-13 확인 시 북극(n6250)·남극(s6250) v5.4 netCDF가 2026-10-12분까지 올라와 있고, 보통 다음 날 아침(서버 표시 시각 06시 무렵) 게시됩니다.
  다만 입력 위성 GCOM-W(2012년 발사)는 JAXA가 '후기 운용 단계'로 분류하고 있고, 2026년 9월부터 AMSR2 표준 자료 제공 방식이 바뀌었으며(제공 횟수 축소, 일부 장면 불완전),
  브레멘대학은 후속 센서 GOSAT-GW AMSR3로 만든 예비 ASI 산출물을 amsr3/ 폴더에 올리기 시작했습니다. AMSR3 판으로의 공식 전환 일정은 아직 공지되지 않았습니다.

period:
  start: "2002-06"
  end: present
  note: >-
    v5.4 기록은 AMSR-E 2002-06~2011-09, AMSR2 2012-07~현재입니다(2011-10~2012-07은 두 센서 사이 공백). 2018년에 AMSR-E·AMSR2 전 기간을 같은 설정으로 재처리해 v5.4가 되었고,
    그 이전 준실시간 자료는 v5.3(2017-05-02부터)·v5.2입니다. PANGAEA에 묶어 올린 연도별 자료는 AMSR2가 2019년까지이고, 그 뒤는 브레멘대학 서버에서 받습니다.

resolution:
  spatial_short: "6.25 km (0.06°)"
  temporal_short: "1일"
  spatial: >-
    NSIDC 극 평사도법 격자 — 북극 n6250 6.25 km(EPSG:3411, 기준위도 70°N, 1216×1792), 남극 s6250 6.25 km(EPSG:3412, 기준위도 70°S, 1264×1328).
    해역별 지도용 3.125 km 격자(n3125·s3125, Arctic3125 등)도 있으나 v5.4로 재처리되지 않았습니다. 89 GHz 채널 관측 지점 크기는 약 6×4 km²입니다
  vertical: 해당 없음 (지표면 자료)
  temporal: 일 격자(UTC 달력일 하루 동안의 모든 궤도를 합침) / 궤도별 스와스 자료(반궤도 파일)

coverage:
  short: 양극
  note: "북극·남극 각각의 극 평사도 격자. 해안에서 약 20 km 안쪽은 육지 오염으로 거짓 농도가 생길 수 있음"
update: 매일(준실시간). 2026-10 기준 하루치 파일이 다음 날 아침(서버 표시 시각 06시 무렵)에 게시됨. 해역별 3.125 km 지도·PNG도 같은 시각 갱신
license: >-
  PANGAEA에 올린 AMSR2 v5.4 연도별 자료는 CC BY 4.0(AMSR-E 북극 자료는 CC BY-SA 4.0). 브레멘대학 서버 자료는 별도 라이선스 표기 없이
  '책임을 지지 않는 연구용 산출물'로 공개되며, 논문에 쓰면 알고리즘 논문을 인용하고 출처를 밝혀 달라고 요청합니다
account_required: false

summary: >-
  브레멘대학이 AMSR-E·AMSR2의 89 GHz 편광차를 이용하는 ASI(ARTIST Sea Ice) 알고리즘으로 만든 북극·남극 일별 해빙 농도입니다.
  25 km 격자인 NOAA/NSIDC CDR나 OSI SAF 기후자료보다 네 배 촘촘한 6.25 km 격자로, 해빙 가장자리·폴리냐·수로 같은 작은 구조를 보는 데 강점이 있습니다.
  매일 아침 갱신되는 준실시간 자료라 쇄빙선 운항, 현장 관측 계획, 일기도 같은 업무에 널리 쓰이며, HDF4·GeoTIFF·netCDF·PNG 지도로 로그인 없이 받을 수 있습니다.
  다만 기후자료(CDR)로 설계된 것은 아니어서 장기 추세 분석에는 25 km 기후자료와 함께 비교해 쓰는 것이 좋습니다.

time_convention:
  summary: >-
    일 격자 파일은 UTC 기준 하루(달력일) 동안 지나간 모든 궤도의 관측을 격자에 모아 계산한 하루 대표값입니다(같은 서버의 격자 밝기온도 안내는 하루 약 14회 궤도를 합친다고 설명).
    특정 시각의 순간값이 아니며, 궤도별 스와스 파일만 관측 시각이 붙은 순간값입니다.
  points:
    - "파일 이름의 날짜(예 asi-AMSR2-n6250-20261012-v5.4.nc)는 UTC 달력일입니다. 한국 시간 기준 하루와는 9시간 어긋납니다."
    - "위성이 하루에 여러 번 지나가는 고위도에서는 한 격자 값에 그날 여러 시각의 관측이 함께 들어갑니다."
    - "스와스 자료(swath/asiYYYYMMDD/ 폴더, 예 GW1AM2-20200101-073D-asi.nc)는 반궤도마다 파일 하나이고, 주사선별 관측 시각이 `Scan_Time`(1992-01-01 00:00 UTC 기준 초)에 들어 있습니다."
  source: https://data.seaice.uni-bremen.de/amsr2/ASIuserguide.pdf
  source_name: ASI Version 5 Sea Ice Concentration User Guide (V0.9.4, 2024-08-09) / 스와스 자료 읽어보기(Readme_AMSR_ASI_swath.txt)

variables:
  note: >-
    사용자 안내서는 일 파일에 '해빙 농도 2차원 장 하나(%)'가 들어 있다고만 적고 netCDF 안의 변수 이름은 밝히지 않아, 이름은 적지 않았습니다(xarray로 열어 확인하세요).
    자료 보관 페이지 안내에 따르면 농도는 0~100으로 저장되고 육지·결측은 120입니다(옛 파일은 농도 0~200, 육지·결측 255). HDF4 파일의 위경도는 grid_coordinates/ 폴더에 따로 있습니다.
  full_list: https://data.seaice.uni-bremen.de/amsr2/ASIuserguide.pdf
  groups:
    - name: 일 격자 (n6250·s6250, HDF4·GeoTIFF·netCDF)
      kind: mean
      period: 일
      items:
        - text: "해빙 농도 (%)"
          note: "UTC 하루 동안의 모든 궤도로 만든 하루 대표값. 0~100, 육지·결측 120. 변수 이름 미기재: 사용자 안내서는 netCDF가 GDAL로 만든 '해빙 농도 2차원 장'이라고만 적고, 서버 readme·PANGAEA 기록에도 이름이 없음"
    - name: 궤도별 스와스 (swath, netCDF)
      kind: instant
      items:
        - text: "해빙 농도 — A·B 주사 배열 (%)"
          note: "89 GHz A·B 두 주사선(약 5 km 간격) 각각의 관측 지점 값. 위경도 배열 4개가 함께 들어 있음. 스와스 readme(Readme_AMSR_ASI_swath.txt)는 시각 배열 이름(Scan_Time)만 밝히고 농도·위경도 배열 이름은 적지 않음"
        - text: "주사선 관측 시각 — `Scan_Time` (s, 1992-01-01 00:00 UTC 기준)"
          std: []

