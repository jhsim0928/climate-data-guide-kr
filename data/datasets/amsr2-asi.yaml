example:
  lang: python
  note: >-
    브레멘대학 서버에서 북극 6.25 km netCDF 하나를 받아 여는 예입니다. 안내서에 변수 이름이 없어, 파일 안에서 가장 큰 2차원 변수를 농도로 골랐습니다. 먼저 print(ds)로 이름을 확인하세요.
  code: |
    import urllib.request
    import xarray as xr

    day = "20261012"
    url = f"https://data.seaice.uni-bremen.de/amsr2/asi_daygrid_swath/n6250/netcdf/{day[:4]}/asi-AMSR2-n6250-{day}-v5.4.nc"
    urllib.request.urlretrieve(url, "asi.nc")

    ds = xr.open_dataset("asi.nc")
    print(ds)                                                   # 변수 이름·투영 정보 확인

    sic = max(ds.data_vars.values(), key=lambda v: v.size)      # 해빙 농도 2차원 장 (%)
    sic = sic.where(sic <= 100)                                 # 육지·결측(120) 제외
    print("농도 15% 이상 격자 수:", int((sic >= 15).sum()))

tips:
  - >-
    같은 탭의 NOAA/NSIDC CDR(../nsidc-cdr-sic/)·OSI SAF(../osisaf-sic/)와 다른 점은 해상도와 목적입니다. 두 기후자료는 25 km 격자에서 센서 간 일관성을 맞춘 장기 기록이고
    격자별 불확실성(OSI SAF)이나 알고리즘 간 표준편차(NSIDC)를 함께 주지만, ASI는 89 GHz를 써서 6.25 km로 촘촘한 대신 센서 간 상호 보정된 장기 기록이 아니고 격자별 불확실성 변수도 없습니다.
    면적·범위의 장기 추세는 기후자료로, 가장자리·수로·폴리냐 같은 세부 구조는 ASI로 보는 식으로 나눠 쓰세요.
  - >-
    안내서에 따르면 오차는 농도 0%에서 약 25%, 100%에서 약 5.7%로, 65%를 넘으면 10% 아래입니다. 낮은 농도 값의 상대오차가 크므로 15% 경계 위치를 정밀하게 다룰 때는 주의하세요.
  - >-
    대기 수증기·구름에 따른 거짓 해빙을 없애려고 경사비(GR37V/18V > 0.045, GR23V/18V > 0.04) 기준과 Bootstrap 농도 5% 이하 조건에서 농도를 0으로 만들고,
    지난 40년 그 달의 최대 해빙 범위 밖도 0으로 둡니다. 따라서 0%는 이 필터·마스크를 거친 판정 결과이기도 합니다.
  - >-
    해안에서 약 20 km 안쪽은 육지 복사가 섞여 바다인데도 농도가 나올 수 있습니다. 오호츠크해처럼 해안선이 복잡한 동아시아 결빙 해역이나 좁은 만에서는 이 띠를 걸러 내세요.
    오호츠크해는 해역별 3.125 km 지도(n3125 아래 SeaOfOkhotsk 폴더)도 매일 나오지만 이 격자는 v5.4로 재처리되지 않았습니다.
  - >-
    AMSR-E(2002~2011)와 AMSR2(2012~) 사이에 약 9개월 공백이 있고, AMSR2 밝기온도는 AMSR-E와 같게 환산해 씁니다. 두 센서를 이은 시계열을 만들 때는 공백 처리와 센서 경계를 밝히세요.
  - >-
    서버의 SeaIceConcentration/ASI_CDR/ 폴더에 SSM/I·SSMIS에 ASI를 맞춘 별도의 1991~2024년 6.25 km EASE2 해빙 농도 기록(v1, 2026-08 게시)이 있습니다. 격자·센서가 달라
    이 페이지의 AMSR2 v5.4와는 다른 자료이니 섞지 마세요. 아직 DOI와 공식 인용 방식은 안내되지 않았습니다.
  - >-
    AMSR3로 바뀌는 시기에는 같은 날짜라도 amsr2/와 amsr3/ 폴더 값이 다를 수 있습니다. 2026-10-13 확인 시 amsr2/·amsr3/ 폴더의 readme 내용이 서로 뒤바뀌어 있으니,
    어느 센서 자료인지는 폴더 이름이 아니라 파일 이름(asi-AMSR2-…, amsr3-…)으로 확인하세요.

