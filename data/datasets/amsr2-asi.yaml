notices:
  - date: "2026-09-04"
    level: warning
    title: "JAXA, 2026-09-02 이후 AMSR2 표준 L1·L2 일부가 한 장면보다 적은 자료로 제공"
    body: >-
      JAXA G-Portal은 2026-09-02 00 UTC 이후 제공된 GCOM-W 표준 산출물 일부가 한 장면보다 적은 자료를 담고 있을 수 있다고 알렸고(원인 조사 중), 9월 4일 갱신에서
      영향 범위를 AMSR2 표준 L1·L2로 밝히며 L3는 영향이 없고 문제 산출물은 다음 전송 때 정상본으로 덮어쓴다고 했습니다. 이 시기 ASI 일 파일은 나중에 갱신될 수 있습니다.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1500
  - date: "2026-08-21"
    level: info
    title: SSM/I·SSMIS 기반 ASI 해빙 농도 기후 기록(1991~2024, 6.25 km) 게시
    body: >-
      브레멘대학 서버의 SeaIceConcentration/ASI_CDR/ 폴더에 AMSR2를 기준으로 SSM/I·SSMIS에 ASI 알고리즘을 맞춘 1991~2024년 6.25 km EASE2 일별 해빙 농도(netCDF·PNG)와
      면적·범위 표, 보고서(v1.0, 2026-04-30)가 올라왔습니다. 이 페이지의 AMSR2 v5.4와 별개 자료입니다.
    source: https://data.seaice.uni-bremen.de/SeaIceConcentration/readme.txt
  - date: "2026-08-19"
    level: info
    title: AMSR3 기반 예비(preliminary) ASI 해빙 농도 폴더 공개
    body: >-
      브레멘대학 서버에 amsr3/ 폴더가 생겨 GOSAT-GW AMSR3로 만든 예비 ASI 해빙 농도(asi_daygrid_swath)와 일별 격자 밝기온도(tb_daygrid_swath)를 제공합니다.
      AMSR3 설명 readme(2026-08-19 수정, 서버에서는 amsr2/ 폴더에 들어 있음)는 예비 농도 기록이 2026-06-09에 시작한다고 적고 있고, 격자 밝기온도 파일은 2025-08-11부터 있습니다. 홈페이지 공지나 AMSR2 판을 대체한다는 안내는 아직 없습니다.
    source: https://data.seaice.uni-bremen.de/amsr3/
  - date: "2026-06-30"
    level: info
    title: JAXA, GOSAT-GW AMSR3 표준 산출물 공개 (해빙 농도 포함)
    body: >-
      JAXA가 G-Portal에서 AMSR3 밝기온도와 해빙 농도·고해상도 해빙 농도·해빙 이동 벡터 등 물리량 산출물 공개를 시작했습니다. AMSR3는 2025-08-11 관측을 시작했으며,
      AMSR2의 후속 센서로 AMSR2 자료와의 이용 연속성을 목표로 합니다.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1473
  - date: "2026-06-01"
    level: warning
    title: "NOAA, AMSR2 산출물 퇴역·AMSR3 전환 공지 — JAXA의 AMSR2 표준 준실시간 자료 제공 2026년 9월 종료"
    body: >-
      NOAA NESDIS는 JAXA가 AMSR2 자료 제공을 중단할 예정이라 AMSR2 기반 운영 산출물(해빙 포함)을 2026-08-31 퇴역시키고 AMSR3로 바꾼다고 알렸습니다.
      공지에 따르면 2026년 9월부터 AMSR2 표준 준실시간 자료 제공이 끝나며, 전환 기간인 7~8월에는 스발바르 지상국에서 AMSR2 전 궤도를 수신했습니다. 2026-10-13 확인 시 브레멘대학 AMSR2 ASI는 계속 갱신되고 있습니다.
    source: https://ospo.noaa.gov/data/messages/2026/06/MSG_20260601_1400.html
  - date: "2025-09-23"
    level: info
    title: JAXA AMSR2 자료 중단(2025-09-22~24)으로 일부 날짜 불완전
    body: >-
      JAXA의 AMSR2 자료 공급이 9월 22~24일 멈춰 22일 지도가 불완전하고 24일에는 자료가 들어오지 않았습니다. 9월 24일 공급이 재개되었고 22일 불완전 자료는 다시 처리한다고 안내했습니다.
    source: https://seaice.uni-bremen.de/news-archive/

transitions:
  - from: ASI AMSR2 v5.4
    to: ASI AMSR3 (예비판)
    status: planned
    date: "2026-08"
    summary: >-
      AMSR2를 실은 GCOM-W가 후기 운용 단계에 들어가고 JAXA가 후속 AMSR3(GOSAT-GW) 산출물을 2026-06-30부터 공개하면서, 브레멘대학도 AMSR3로 만든 예비 ASI 농도를 amsr3/ 폴더에 올리기 시작했습니다.
      2026-10-13 현재 AMSR2 v5.4는 계속 갱신되고 있으며, AMSR3 판의 정식 버전 이름·전환 시점·재처리 계획은 공지되지 않았습니다.
    changes:
      - aspect: 입력 센서
        before: "GCOM-W1 AMSR2 (2012-07~)"
        after: "GOSAT-GW AMSR3 (2025-08-11 관측 시작)"
      - aspect: 기간
        before: "2012-07~현재 (AMSR-E 포함 2002-06~)"
        after: "예비 농도 기록 2026-06-09~ (readme), 격자 밝기온도 2025-08-11~"
      - aspect: 서버 폴더
        before: "amsr2/asi_daygrid_swath/ (n6250, s6250, n3125, s3125, swath)"
        after: "amsr3/asi_daygrid_swath/, amsr3/tb_daygrid_swath/ (n6250·n12500·n25000, s6250·s12500·s25000)"
      - aspect: 파일 이름
        before: "asi-AMSR2-n6250-YYYYMMDD-v5.4.nc"
        after: "격자 밝기온도는 amsr3-n6250-YYYYMMDD-89h.hdf 형식. 농도 파일 이름은 2026-10-13 확인 시 목록을 볼 수 없어 확인 못함"
      - aspect: 버전·상태
        before: "v5.4 (2018 재처리, 운영)"
        after: "예비(preliminary) 자료, 버전 표기·검증 문서 없음"
    impacts:
      - AMSR2와 AMSR3 예비판은 센서 보정·관측 폭이 달라 같은 날 값이 다를 수 있습니다. 공식 비교·검증이 나오기 전에는 한 시계열로 이어 붙이지 마세요.
      - 자동 다운로드 스크립트는 AMSR2 갱신이 멈출 때를 대비해 amsr2/ 폴더의 최신 파일 날짜를 점검하도록 해 두세요.
      - 예비 자료는 나중에 다시 처리되거나 바뀔 수 있으니 논문에는 받은 날짜와 '예비판'임을 밝히세요.
    sources:
      - name: 브레멘대학 자료 서버 amsr3/ 폴더
        url: https://data.seaice.uni-bremen.de/amsr3/
      - name: JAXA G-Portal — GOSAT-GW/AMSR3 Products Now Available (2026-06-30)
        url: https://gportal.jaxa.jp/gpr/notice/notice/view/1473
      - name: JAXA — GCOM-W 위성 페이지 (Latter Phase In Operation)
        url: https://global.jaxa.jp/projects/sat/gcom_w/
      - name: OSI SAF — Implications of AMSR2 being replaced by AMSR3 on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-amsr2-being-replaced-amsr3-osi-saf-products
  - from: ASI v5.2·v5.3 (준실시간)
    to: ASI v5.4
    status: completed
    date: "2018"
    summary: >-
      2018년에 AMSR-E·AMSR2의 남북극 자료 전체를 같은 매개변수·설정·소프트웨어로 다시 처리해 v5.4로 통일했습니다. 그 전에 준실시간으로 만든 자료는 v5.3(2017-05-02부터)과 v5.2입니다.
    changes:
      - aspect: 처리 방식
        before: "시기별 준실시간 처리(v5.2, 2017-05-02부터 v5.3)"
        after: "2002~현재 전 기간을 같은 설정으로 재처리"
      - aspect: 해역별 3.125 km 지도
        before: "준실시간 생산"
        after: "계속 생산되지만 v5.4로 재처리하지 않음"
      - aspect: 값 저장 방식
        before: "옛 파일 농도 0~200, 육지·결측 255"
        after: "농도 0~100, 육지·결측 120"
    impacts:
      - 예전에 받아 둔 v5.2·v5.3 파일은 v5.4로 다시 받아 쓰세요. 파일 이름 끝의 버전 문자열로 구분됩니다.
      - 옛 파일을 읽던 코드는 값 범위(0~200, 255)가 달라 그대로 쓰면 농도가 두 배로 읽힙니다.
    sources:
      - name: ASI Version 5 Sea Ice Concentration User Guide (V0.9.4)
        url: https://data.seaice.uni-bremen.de/amsr2/ASIuserguide.pdf
      - name: 브레멘대학 자료 보관 안내 (값 저장 방식)
        url: https://seaice.uni-bremen.de/data-archive/

