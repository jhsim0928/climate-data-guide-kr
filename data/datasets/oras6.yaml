# ─────────────────────────────────────────────────────────────
# ORAS6 — 데이터셋 정보 파일 (공개 전)
# ECMWF 6세대 해양·해빙 앙상블 재분석. ERA6의 해양·해빙 초기장. 2026-06 공개 준비 발표, 일반 공개 일정 미발표.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: oras6
name: ORAS6
full_name: ECMWF Ocean ReAnalysis System 6 (ECMWF 6세대 해양·해빙 앙상블 재분석)
category: reanalysis
domain: ocean
group: 재분석
order: 22
domains: [해양, 해빙]
provider: ECMWF (C3S·Copernicus Marine 지원 과제로 개발)

status: upcoming
status_note: >-
  아직 일반 공개 전입니다. ECMWF는 2026년 6월 1993년 이후(위성 고도계 시기) 구간의 생산을 마쳤고 곧 회원국과 외부 협력 기관에
  먼저 제공한다고 발표했습니다. 2026-10-12 확인 기준으로 CDS나 ECMWF 재분석 데이터셋 목록에는 ORAS6가 없고,
  일반 공개 일정과 배포처는 발표되지 않았습니다.

period:
  start: "1950"
  end: present
  note: >-
    계획상 1950년~현재이며, 여러 구간을 병렬 생산해 앞 구간 분석으로 이어 붙입니다. 2026-06 ECMWF 발표 기준 1993년 이후 구간은 생산 완료,
    1950년부터의 초기 구간은 2026년 8월 완료 예정이었습니다(완료 공지는 아직 확인되지 않음). 2024년 7월 뉴스레터는 1950년까지의 전체 기록을
    2024년 말까지 완성한다고 예고했지만 일정이 늦어졌습니다. 2026-10-12 현재 일반 공개된 자료는 없습니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1시간"
  spatial: >-
    NEMO v4 eORCA025 삼극(tripolar) 격자, ¼° (적도 약 27 km, 북극 약 12 km; Browne et al. 2026) — ORAS5와 같은 수평 해상도.
    공개 제공 격자는 아직 발표되지 않음
  vertical: 75층 (ORAS5와 같음)
  temporal: >-
    1993년 이후 구간은 2차원 변수 1시간, 3차원 변수 1일 간격으로 제공 예정(ECMWF 2026-06 발표). 그 밖의 구간·통계 제공 형태는 미발표

coverage:
  short: 전지구
update: 공개 전 (일반 공개 후 갱신 주기는 미발표)
license: 미정 (공개 시 발표 예정)
account_required: true

summary: >-
  ORAS5를 잇는 ECMWF의 6세대 전지구 해양·해빙 재분석입니다. NEMO v4.0.6 해양 모델과 SI3 다범주 해빙 모델을 쓰고,
  시간별 ERA5 대기 강제력과 앙상블 기반 3D-Var(NEMOVAR) 자료동화로 수온·염분 프로파일, 재처리 DUACS 해수면 고도 편차,
  OSI SAF 해빙 농도, 재처리 OSTIA SST를 동화합니다. ECMWF 해양 재분석 최초로 SST를 직접 동화하며, 해양·해빙 분석 11개 앙상블 멤버를 GRIB2로 만듭니다.
  ERA6의 해양·해빙 초기장으로 쓰입니다.

variables:
  note: >-
    공개 전이라 변수 목록이 확정되지 않았습니다. ECMWF 발표에 따르면 해양·해빙 상태(수온·염분·해류·해수면 높이·해빙 농도와 두께 등)를
    1993년 이후 구간에서 2차원 시간별·3차원 일별 자료로 제공할 예정입니다. 변수 이름·단위는 공개 때 정리하겠습니다.
  groups: []

access:
  - name: ECMWF 뉴스 — New ORAS6 ocean reanalysis (2026-06-08)
    url: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
    method: 안내 페이지 (회원국·협력 기관 우선 제공 예정)
    note: 1993년 이후 구간을 ECMWF 회원국과 외부 협력 기관에 먼저 제공한다고 밝혔습니다. 일반 사용자용 배포처는 아직 발표되지 않았습니다.
  - name: ECMWF 재분석 데이터셋 목록 (공개 예정 위치)
    url: https://www.ecmwf.int/en/forecasts/datasets/browse-reanalysis-datasets
    method: ECMWF 데이터 배포 서비스
    note: >-
      Browne et al. (2026)의 자료 공개 문구는 ORAS6가 이곳(ECMWF 데이터 배포 서비스)을 통해 공개될 예정이라고 적고 있습니다.
      2026-10-12 확인 시 목록에 ORAS6는 아직 없습니다. 뉴스레터 180호는 MARS 아카이브에 GRIB2로 저장된다고 밝혔습니다.

tips:
  - 공개되더라도 ORAS5와 한 시계열로 이어 붙이지 마세요. 대기 강제력(ERA5 시간별), 모델(NEMO4·SI3), 자료동화(앙상블 3D-Var, SST 직접 동화)가 모두 다릅니다.
  - ERA6의 해양 성분은 ORAS6 초기장에서 출발하지만 해양 관측을 직접 동화하지 않습니다. ERA6 해양 변수와 ORAS6를 같은 것으로 취급하지 마세요.
  - ECMWF 뉴스레터 180호는 북극 일부 해역에서 ORAS6 해빙이 얇게 나오는 편향이 있다고 밝혔습니다. 해빙 두께 연구는 위성 두께 자료 등과 비교해 쓰세요.
  - 앙상블 11개 멤버가 만들어지므로, 공개 형태가 정해지면 불확실성(멤버 간 퍼짐) 제공 여부를 확인해 두면 좋습니다.

