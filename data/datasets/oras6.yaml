notices:
  - date: "2026-06-08"
    level: info
    title: ORAS6 공개 준비 발표 — 1993년 이후 구간 먼저 제공
    body: >-
      ECMWF가 ORAS6 공개를 준비 중이라고 발표했습니다. 1993년 이후 구간은 생산을 마쳐 곧 회원국·외부 협력 기관에 제공하고(2차원 시간별, 3차원 일별),
      1950년부터의 초기 구간은 2026년 8월 완료 예정이라고 밝혔습니다. 일반 공개 일정과 배포처, ORAS5 갱신 종료 여부는 발표되지 않았습니다.
    source: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
  - date: "2026-06-03"
    level: info
    title: ORAS6 해빙 자료동화 논문 출판 (The Cryosphere)
    body: >-
      SI3 다범주 해빙 모델에서 해빙 농도 증분을 두께 범주에 나누는 방법과 해빙–해수 온도 관계를 다룬 Browne et al. (2026)이 출판되었습니다.
      eORCA025 격자, 1개 통제 + 10개 섭동 멤버 앙상블, OSI SAF L3 해빙 농도 동화 등 ORAS6 설정을 확인할 수 있습니다.
    source: https://doi.org/10.5194/tc-20-3299-2026
  - date: "2026-03-06"
    level: info
    title: ORAS6 초기장을 쓰는 ERA6 생산 시작
    body: >-
      Copernicus가 ERA6 생산 시작을 발표했습니다. ERA6의 결합 해양은 Copernicus Marine Service와 함께 준비한 ORAS6에서 초기 조건을 받습니다.
    source: https://climate.copernicus.eu/copernicus-climates-era6-reanalysis-production-starts
  - date: "2024-07"
    level: info
    title: ECMWF 뉴스레터 180호 — ORAS6 시스템 소개
    body: >-
      NEMO v4.0.6·SI3, 시간별 ERA5 강제력, 앙상블 기반 3D-Var, OSTIA SST 직접 동화, 11개 멤버 GRIB2 출력 등 ORAS6 구성을 처음 자세히 소개했습니다.
      당시 1950년까지의 전체 기록을 2024년 말까지 만든다고 예고했으나 일정이 늦어졌습니다.
    source: https://www.ecmwf.int/en/newsletter/180/earth-system-science/ecmwfs-next-ensemble-reanalysis-system-ocean-and-sea-ice

