# ─────────────────────────────────────────────────────────────
# 천리안위성 2B호 GOCI-II — 데이터셋 정보 파일
# 위성 탭(해색), 해양 탭(위성 관측 자료) 교차 수록. 국립해양조사원 국가해양위성센터(NOSC)가 배포하는 정지궤도 해색 L1B·L2 자료입니다.
# 한반도 주변(LA) 하루 10회(1시간 간격) + 전구(FD) 하루 1회, 250 m. 누리집에서 로그인 없이 받을 수 있고, NASA OBPG에는 GOCI-II 자료가 없습니다.
# 2026-10-14 확인 시 첫 화면 최신 GOCI-II RGB는 2026-10-13 17:15(KST), 마지막 운영공지는 2026-10-07입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: goci2
name: "GOCI-II (천리안 2B호)"
full_name: Geostationary Ocean Color Imager II (GOCI-II) on GEO-KOMPSAT-2B (천리안위성 2B호 정지궤도 해양관측 탑재체 — 한반도 주변 시간별·전구 일별 해색 관측)
category: satellite
domain: satellite
group: 해색
order: 70
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 에어로졸, 육지, 원격탐사]
provider: 국립해양조사원 국가해양위성센터(NOSC) / 한국해양과학기술원 해양위성센터(KIOST KOSC, 알고리즘 개발)

status: active
status_note: >-
  2020년 2월 발사된 천리안위성 2B호의 GOCI-II가 한반도 주변(LA)을 하루 10회, 전구(FD)를 하루 1회 관측하고 있으며, 국가해양위성센터가 L1B와 L2 산출물을 배포합니다.
  2026-10-14 확인 시 누리집 첫 화면의 최신 GOCI-II RGB 영상은 2026-10-13 17:15(KST)이고, 마지막 운영공지는 2026-10-07(10월 6일 궤도유지기동으로 17:15 촬영 일부 취소)입니다.
  2025년 2월 과거 L2 산출물을 재처리해 다시 서비스했으므로, 그 전에 받은 L2 파일은 새로 받아 쓰는 것이 좋습니다.

period:
  start: "2020-10"
  end: present
  note: >-
    천리안위성 2B호는 2020년 2월 발사되었고, 국가해양위성센터 연혁은 2020년 10월을 '천리안위성 2B호 서비스 개시'로 적고 있습니다(궤도상 시험은 2020년 9월까지).
    KIOST는 L1 자료를 2020년 10월부터, L2 산출물 26종을 2021년 1월부터 공개했다고 밝혔습니다. 임무 수명은 10년(2020~2029)으로 계획되어 있습니다.

resolution:
  spatial_short: "0.25 km (0.0023°)"
  temporal_short: "1시간"
  spatial: >-
    한반도 주변(Local Area, LA)과 전구(Full Disk, FD) 모두 공간해상도 250 m × 250 m입니다. LA 영역은 2,500 km × 2,500 km이며 12개 슬롯(S000~S011)으로 나눠 찍어 합칩니다.
    FD는 슬롯 0~235로 나뉘어 있습니다. 관측 밴드는 380~865 nm의 12개 분광 밴드(폭 10~40 nm)와 기하보정용 광대역 밴드(B13) 하나입니다.
  vertical: 해수면(해색·원격반사도), 대기 기둥(에어로졸 광학 두께), 지표면(육상 산출물)
  temporal: >-
    LA는 1시간 간격 하루 10회(UTC 23:15~08:15, 한국 시간 08:15~17:15), FD는 하루 1회입니다. 궤도·자세 유지 기동과 달 촬영이 있는 날은 LA가 8~9회로 줄어듭니다.
    파일은 관측 회차(시각)별 L1B·L2이며, 별도의 일·월 합성 L3는 누리집 다운로드 메뉴에 없습니다.

coverage:
  short: 아시아
  note: "LA는 한반도 중심 2,500 km × 2,500 km(동아시아 연안·황해·동중국해·동해), FD는 천리안위성 2B호에서 보이는 전구(아시아·오세아니아). 낮 시간에만 관측"
update: "LA 매일 10회 관측 후 1시간 이내 갱신을 목표로 함(센터 FAQ). FD는 하루 1회. 궤도유지기동·안전모드 등으로 빠지는 회차는 운영공지로 안내"
license: >-
  누리집에 공공누리 유형 같은 이용 허락 범위는 따로 밝혀져 있지 않고 'Copyright ⓒ 2022 국립해양조사원 국가해양위성센터. All rights reserved.' 표기만 있습니다.
  운영 근거는 '천리안 해양위성 운영규정(국립해양조사원 예규 제217호)'입니다. Open API 결과를 화면에 쓸 때는 '국립해양조사원 OPEN API' 출처 표기가 약관상 의무입니다.
  재배포·상업 이용 범위는 위성자료팀(nosc@korea.kr, 051-400-4432)에 확인하세요
account_required: false

summary: >-
  GOCI-II는 2010~2021년 운영된 세계 최초 정지궤도 해색 센서 GOCI(천리안 1호)의 후속으로, 천리안위성 2B호에 실려 2020년 2월 발사되었습니다.
  한반도 주변 바다를 낮 동안 1시간마다(하루 10회) 250 m 해상도로 찍고, GOCI에는 없던 전구(FD) 관측을 하루 1회 더합니다. 밴드는 GOCI의 8개에서 12개(380~865 nm)로 늘었습니다.
  국가해양위성센터가 원격반사도·엽록소·부유물질·용존유기물 같은 기본 해색 산출물과 적조·부유조류·해무·표층해류·저염분수·에어로졸·육상 산출물 등 L2 산출물을 NetCDF로 배포합니다.
  같은 위성에 대기환경 탑재체 GEMS가 함께 실려 있습니다.

time_convention:
  summary: >-
    L1B·L2 파일은 관측 회차 하나의 영상(순간값)입니다. 파일명의 날짜·시각은 UTC 관측 시각이고, LA는 매일 UTC 23:15부터 08:15까지 정시 15분에 한 번씩 찍습니다.
    파일명에 슬롯 번호(S000~S011)가 붙은 것은 영역 일부, 슬롯 번호가 없는 것은 모든 슬롯을 합친 영상입니다.
  points:
    - "파일명 예 GK2B_GOCI2_L2_20211221_001530_LA_S002_AC.nc — 위성(GK2B)·센서(GOCI2)·레벨·관측일(UTC)·관측시각(UTC)·영역(LA/FD)·슬롯·산출물 코드 순입니다(센터는 순서가 바뀔 수 있다고 안내)."
    - "UTC 날짜와 한국 날짜가 다릅니다. 한국 시간 08:15 첫 관측은 전날 UTC 23:15 파일이므로, 한국 날짜 하루치를 모으려면 전날 UTC 23:15 파일부터 받아야 합니다."
    - "궤도유지기동(매주 화·목요일 임의 시각), 자세유지기동(1년 3회), 복사보정용 달 촬영 때는 해당 회차가 빠집니다. 센터 FAQ는 이런 날 LA가 8~9회라고 안내합니다."
    - "일평균·월평균 같은 합성장은 기본 다운로드에 없으므로, 시간 평균이 필요하면 회차별 L2를 직접 합성해야 합니다."
  source: https://www.nosc.go.kr/boardContents/actionBoardContentsCons0017.do
  source_name: 국가해양위성센터 위성자료 파일명 규칙 + 자주 묻는 질문(FAQ)

variables:
  note: >-
    산출물 이름과 코드는 국가해양위성센터 다운로드 메뉴·Open API 안내에 적힌 것이고, 코드는 L2 파일명 끝에 붙는 산출물 구분자입니다(예 …_LA_Chl.nc).
    파일 안 NetCDF 변수명과 단위는 센터 '알고리즘 기술문서' 게시판의 'GOCI-II Level-2 OCR 자료 형식(v04, 2025-02-28)'에 있으며, 이 문서를 확인하지 못해 여기에는 적지 않았습니다.
    이 밖에 해빙(SI), 해양 일차 생산력(PP), 어장환경지수(FGI), 육상 산출물(육상지표반사도 SRL, 육상 알베도 LSAB·LSAN, 식생지수 VI, 토지피복 LCC)도 있습니다.
