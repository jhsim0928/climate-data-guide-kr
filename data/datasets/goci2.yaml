notices:
  - date: "2026-10-07"
    level: info
    title: 천리안위성 2B호 관측 스케줄 변경(10월 6일)
    body: >-
      궤도유지기동(station keeping) 때문에 2026년 10월 6일 17:15(KST) 촬영 일부가 취소(SKIP)되었습니다. 하루 전 공지(2026-10-06)에서는 10월 1일 04:15 UTC 관측 취소를 알렸습니다.
      이런 관측 스케줄 변경 공지가 매달 여러 건 올라오므로, 시계열 분석 전에 빠진 회차를 운영공지로 확인하세요.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0005.do?BOARD_SNO=235&boardSelectPage=1
  - date: "2025-06-25"
    level: info
    title: L2 알고리즘 기술문서(ATBD) 5종 갱신
    body: >-
      에어로졸 광학 두께, 적조 지수, 저염분수, 해양 전선(엽록소 전선), 표층 해류 ATBD가 갱신본으로 다시 게시되었습니다. 이 산출물을 쓴다면 갱신된 문서의 알고리즘·품질 기준을 확인하세요.
    source: https://www.nosc.go.kr/board/actionBoardListBoard0009.do
  - date: "2025-02-28"
    level: warning
    title: 과거 L2 기본산출물 재처리 서비스
    body: >-
      센터가 천리안위성 2B호에서 과거에 생산한 기본산출물(L2)을 재처리해 서비스한다고 알리며 'GOCI-II Level-2 OCR 자료 형식(v04)', 대기보정(v31), 고유광특성(v20) 기술문서를 함께 올렸습니다.
      재처리 대상 기간은 게시글에 적혀 있지 않습니다. 그 전에 받은 L2로 만든 결과는 새 자료로 다시 확인하세요.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0009.do?BOARD_SNO=34&boardSelectPage=2
  - date: "2024-04-15"
    level: info
    title: GOCI-II 원격반사도 산출 개선 설명 자료 게시
    body: >-
      대기보정 업데이트 설명 자료(GOCI-II_대기보정업데이트_설명자료_20240409.pdf)가 게시되었습니다. KIOST 발표에 따르면 개선된 대기보정은 2023년 10월부터 지상국 운영에 반영되었습니다.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0009.do?BOARD_SNO=33&boardSelectPage=2
  - date: "2023-12-12"
    level: warning
    title: 천리안위성 2B호 서비스 일시 중단(12월 11일)
    body: >-
      위성이 안전모드(safe mode)에 들어가 관측 자료의 위치 정보에 오류가 생겨, 2023년 12월 11일 해양위성영상 자료 서비스가 중단되었습니다.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0005.do?BOARD_SNO=83&boardSelectPage=15
  - date: "2022-10-21"
    level: warning
    title: 안전모드 복구 중 일부 영상 서비스 제외(2022년 9월)
    body: >-
      2022년 9월 3일 21시경 천리안위성 2B호가 안전모드에 들어갔고, 정상 상태로 복구하는 과정에서 장애가 생긴 9월 4일 08:15~15:15(KST) 영상을 서비스에서 제외했습니다.
      영문 공지는 날짜를 9월 3일로 적고 있어, 해당 날짜 자료가 비어 있으면 이 공지를 참고하세요.
    source: https://www.nosc.go.kr/board/actionBoardViewBoard0005.do?BOARD_SNO=19&boardSelectPage=21

