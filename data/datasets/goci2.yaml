access:
  - name: 국가해양위성센터 — 한반도 주변(LA) 다운로드
    url: https://www.nosc.go.kr/program/actionGociDownload.do
    method: 웹 검색·다운로드 (레벨·산출물·관측일·슬롯 선택, NetCDF·JPG)
    note: >-
      회원가입·로그인 없이 바로 받을 수 있습니다. 관측일을 KST/UTC로 고를 수 있고, 슬롯(S000~S011) 또는 합성(Mosaic)을 선택합니다. NetCDF는 PC에서만 받을 수 있습니다.
      같은 페이지에서 센터가 만든 활용산출물(해수면온도, 괭생이모자반 일·시간)도 받을 수 있습니다.
    login: false
  - name: 국가해양위성센터 — 전구(FD) 다운로드
    url: https://www.nosc.go.kr/program/actionGociFdDownload.do
    method: 웹 검색·다운로드 (L1B·L2)
    note: FD L2는 대기보정·고유 광특성·하향 확산 감쇠 계수·세키 깊이·엽록소·부유물·용존유기물·부유조류 등 해색 산출물 위주입니다.
    login: false
  - name: 국가해양위성센터 웹디렉토리
    url: https://www.nosc.go.kr/wd/zTreeView.do
    method: 폴더 탐색 다운로드 (레벨·산출물 그룹 AC·IOP·AERO·OC·OCEAN·LAND, 영역 LA/FD, NetCDF/JPG)
    note: 센터 FAQ가 대용량 자료를 받을 때 OPeNDAP과 함께 권하는 방법입니다.
    login: false
  - name: 국가해양위성센터 OPeNDAP
    url: https://nosc.go.kr/opendap/
    method: OPeNDAP (검색 페이지 https://www.nosc.go.kr/program/opendapSearch.do — 한 번에 최대 90일)
    note: >-
      사용자 매뉴얼(PDF·동영상, 2026-06-04)과 대량 내려받기 프로그램 noscCollector(2024-06-21)가 일반자료실에 있습니다.
      2026-10-14 자동 접속으로는 서버 목록이 열리지 않아 로그인 여부를 확인하지 못했습니다.
  - name: 국가해양위성센터 OPEN API
    url: https://www.nosc.go.kr/openapi/actionOpenApiIssue.do
    method: REST (JSON·XML) — 메타정보·위성영상정보·위성 NetCDF 정보 API
    note: >-
      약관 동의 후 발급 요청(사용 유형·소속·서비스 URL·목적 입력)을 하면 센터 승인 뒤 인증키가 나옵니다. 하루 20,000건 제한이 있고, 키를 잃어버리면 새로 받아야 합니다.
      NetCDF 정보 API(openapi/GK2BNcMedia/search.do)는 startDate·endDate·slot(0~11, 한반도 전체 13)으로 파일 경로·파일명을 돌려줍니다.

example:
  lang: python
  note: >-
    국가해양위성센터에서 받은 L2 NetCDF 파일 하나의 그룹·변수 구조를 먼저 확인하는 예입니다. 파일 안 변수명은 'GOCI-II Level-2 OCR 자료 형식' 문서와 대조하세요.
    파일명은 센터 Open API 안내의 예시이므로 받은 파일 이름으로 바꾸세요.
  code: |
    # pip install netCDF4 xarray
    import netCDF4
    import xarray as xr

    fname = "GK2B_GOCI2_L2_20211221_001530_LA_S002_AC.nc"   # 받은 파일 이름으로 바꾸기

    # 1) 그룹과 변수 구조 확인 (L2 파일은 그룹으로 나뉘어 있을 수 있음)
    with netCDF4.Dataset(fname) as nc:
        print(nc.ncattrs())                       # 관측 시각 등 전역 속성
        for gname, g in nc.groups.items():
            print(gname, list(g.variables))

    # 2) 원하는 그룹을 xarray로 열기 — 위에서 확인한 그룹 이름을 넣으세요
    # ds = xr.open_dataset(fname, group="<그룹 이름>")
    # print(ds)

tips:
  - "파일명의 날짜·시각은 UTC입니다. 한국 시간 08:15 관측은 전날 날짜(UTC 23:15) 파일이라, 한국 날짜 기준 일 합성을 만들 때 하루 치가 두 UTC 날짜에 걸칩니다."
  - "2025-02-28 센터가 과거 L2 산출물을 재처리해 다시 서비스한다고 알렸습니다(대기보정 v31, 고유광특성 v20, 자료 형식 v04 문서). 그 전에 받은 L2로 만든 시계열은 다시 받아 맞추세요."
  - "원격반사도 산출 알고리즘이 2023년 10월 지상국에 반영되었고(KIOST, IOCS 2023), 2024-04-15 개선 설명 자료가 게시되었습니다. 기간에 따라 처리 판이 섞이지 않았는지 파일의 처리 정보를 확인하세요."
  - "궤도유지기동은 매주 화·목요일 임의 시각에 있어 그 회차가 빠집니다(센터 FAQ). 하루 10회가 다 있다고 가정하고 일평균을 내면 빠진 시각이 날마다 달라 편향이 생길 수 있습니다."
  - "춘분·추분 무렵에는 태양전파간섭 안내 공지가 올라옵니다. 이 기간과 안전모드 공지가 난 날(예 2022-09-04, 2023-12-11)은 자료가 빠지거나 서비스에서 제외되었습니다."
  - "NASA OBPG(oceancolor)와 NASA CMR에는 GOCI-II 자료가 없습니다(2026-10-14 확인, OBPG Level-2 목록에는 이전 GOCI만 있음). GOCI-II는 국가해양위성센터에서 받아야 합니다."
  - "GOCI(2011~2021)와 이어 쓰려면 GOCI는 NASA OBPG에서, GOCI-II는 국가해양위성센터에서 받아야 해 처리 체계가 다릅니다. 겹치는 2020-10~2021-03 기간으로 두 자료의 차이를 먼저 확인하세요."
  - "같은 위성의 GEMS(국립환경과학원)도 낮 동안 시간마다 동아시아를 관측합니다. KIOST는 GEMS·GK-2A 오존 칼럼을 GOCI-II 대기보정에 쓰는 방안을 평가했습니다(Lee et al., 2025, 대한원격탐사학회지 41(6))."

