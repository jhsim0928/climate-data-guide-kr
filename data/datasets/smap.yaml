# ─────────────────────────────────────────────────────────────
# NASA SMAP 토양수분 — 데이터셋 정보 파일
# 지면 탭 '토양수분'에 싣습니다. L3(SPL3SMP·SPL3SMP_E)와 L4(SPL4SMGP·SPL4CMDL)를 한 페이지에 정리했습니다.
# 같은 페이지 안 버전 변경(L3 V8→V9·V5→V6, L4 V7→V8)은 transitions(to_id 없음)에 적었습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: smap
name: "SMAP (L3·L4)"
full_name: Soil Moisture Active Passive (SMAP) — L3 복사계 토양수분(SPL3SMP V9·SPL3SMP_E V6)과 L4 동화 토양수분·탄소(SPL4SMGP V8·SPL4CMDL V8)
category: satellite
domain: land
group: 토양수분
order: 20
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사, 수문]
provider: NASA JPL·GSFC SMAP 과학팀 (배포 NSIDC DAAC)

status: active
status_note: >-
  SMAP는 2015년 7월 레이더 고장 이후 L밴드 복사계만으로 계속 관측 중이며, L3·L4 제품이 매일 정상 갱신되고 있습니다(2026-10-13 확인 시 SPL3SMP_E는 10월 9일, SPL4SMGP는 10월 5일, SPL4CMDL은 9월 29일분까지).
  2026년 5월 14일~7월 28일 표준 제품에 위치(geolocation) 오류가 있어 재처리 중이며, 근실시간(NRT) 제품은 교체되지 않습니다.
  현재 버전은 L1~L3 CRID R19(SPL3SMP V9, SPL3SMP_E V6)와 L4 Version 8입니다.

period:
  start: "2015-03"
  end: present
  note: >-
    네 제품 모두 2015-03-31부터 현재까지입니다. 위성 안전모드로 2019-06-19~07-23, 2022-08-06~09-20에 관측이 끊겨 L3는 비어 있고,
    L4는 이 기간에도 만들어지지만 SMAP 관측 없이 모델만으로 계산된 값입니다. 2026-05-14~07-28의 위치 오류 구간은 재처리본으로 교체되는 중이며,
    2026-10-13 확인 시 SPL3SMP 2026-06-01 파일은 재처리 번호(_004)가 붙어 2026-09-23에 갱신되어 있습니다.

resolution:
  spatial_short: "9 km (0.083°)"
  temporal_short: "3시간"
  spatial: >-
    SPL3SMP: 36 km EASE-Grid 2.0 전지구(EPSG:6933, 964 × 406). SPL3SMP_E: 9 km EASE-Grid 2.0 전지구(3856 × 1624)와 북극 극 격자(EPSG:6931, 2000 × 2000) —
    복사계 원 관측 해상도는 약 36 km이며 Backus-Gilbert 보간으로 9 km 격자에 다시 표본화한 것입니다. SPL4SMGP·SPL4CMDL: 9 km EASE-Grid 2.0 전지구(EPSG:6933).
  vertical: "L3 표층(약 0~5 cm) / L4 표층 0~5 cm 평균, 근권 0~100 cm 평균, 모델 전체 토양 단면(sm_profile)"
  temporal: L3 일(오전 6시 하강·오후 6시 상승 통과 따로) / SPL4SMGP 3시간 평균 / SPL4CMDL 일

coverage:
  short: 전지구
update: "매일 (2026-10-13 CMR 확인 시 최신 자료는 SPL3SMP_E 10월 9일, SPL4SMGP 10월 5일, SPL4CMDL 9월 29일분 — 공식 지연 시간은 NSIDC 지연 FAQ 참고)"
license: NASA 지구과학 공개 자료 — 무료. 무료 NASA Earthdata 로그인 필요, 데이터셋 DOI 인용 요청
account_required: true

summary: >-
  NASA SMAP 위성은 L밴드(1.4 GHz) 마이크로파 복사계로 지표 약 5 cm의 토양수분을 전지구에서 관측합니다. 함께 실린 레이더는 2015년 7월 고장 나서
  그 뒤 제품은 모두 복사계 기반입니다. L3(SPL3SMP 36 km, SPL3SMP_E 9 km)는 하루치 궤도 관측을 오전·오후로 나눠 모은 위성 산출물이고,
  L4는 SMAP 밝기온도를 NASA GEOS 지면 모델에 동화해 빈틈 없는 3시간 표층·근권 토양수분(SPL4SMGP)과 일 탄소 순생태계교환(SPL4CMDL)을 만든 값입니다.

time_convention:
  summary: >-
    L3는 위성이 지나간 순간의 관측값을 하루치 모은 것으로, 하강 궤도(현지 태양시 약 오전 6시)는 AM 그룹, 상승 궤도(약 오후 6시)는 PM 그룹(변수 이름 끝 `_pm`)에 따로 들어 있습니다.
    SPL4SMGP는 3시간 평균이며 파일 이름 시각이 구간의 '가운데'입니다(예 T013000 = 00~03 UTC 평균). SPL4CMDL은 일평균 탄소 플럭스(g C m-2 d-1)입니다.
  points:
    - "L3 실제 관측 시각은 `tb_time_utc`(UTC 문자열)에 있습니다. 궤도가 겹치는 고위도(약 65° 이상)에서는 오전 6시·오후 6시에 가장 가까운 관측을 골라 넣습니다."
    - "L3 파일 날짜는 그 안의 첫 관측 날짜이며, 한 격자가 하루 안에 AM·PM 두 번 관측될 수 있습니다. 두 값은 서로 다른 시각의 순간값이므로 평균하기 전에 시각 차이를 고려하세요."
    - "SPL4SMGP 파일은 하루 8개(T013000, T043000 … T223000)이고, 각 값은 그 3시간 구간의 평균입니다. 일평균은 8개를 평균하면 됩니다."
    - "SPL4SMGP의 유출·증발 플럭스는 kg m-2 s-1(= mm s-1) 평균 속도라서, 3시간 합계(mm)는 값 × 10800입니다."
    - "SPL4CMDL의 GPP·NEE·Rh는 하루 평균 플럭스(g C m-2 d-1)이고, 토양 유기탄소(SOC)는 g C m-2 저장량입니다."
  source: https://nsidc.org/data/spl4smgp/versions/8
  source_name: NSIDC SPL3SMP V9·SPL3SMP_E V6·SPL4SMGP V8·SPL4CMDL V8 사용자 안내서, L4_SM 제품 명세서(PSD v17)

variables:
  note: >-
    NSIDC 사용자 안내서와 L4_SM 제품 명세서 기준 주요 변수입니다. 파일은 HDF5이며 변수는 그룹 안에 있습니다
    (L3: `Soil_Moisture_Retrieval_Data_AM`/`_PM`, SPL3SMP_E 극 격자는 `..._Polar_AM`/`_Polar_PM`; SPL4SMGP: `Geophysical_Data`; SPL4CMDL: `NEE`·`GPP`·`RH`·`SOC`·`QA`).
    부동소수점 결측값은 -9999.0이고, L3의 정수형(uint16) 플래그 결측값은 65534입니다.
  full_list: https://nsidc.org/sites/default/files/documents/technical-reference/smap_l4_sm_psd_v17_for_l4sm_version_8.pdf
  groups:
    - name: L3 복사계 토양수분 (SPL3SMP 36 km / SPL3SMP_E 9 km, 일)
      kind: instant
      items:
        - text: "표층 토양수분(오전 하강 궤도) — `soil_moisture` (m3/m3)"
          note: 위성 통과 순간 값. V8부터 기본 알고리즘은 DCA
        - text: "표층 토양수분(오후 상승 궤도) — `soil_moisture_pm` (m3/m3)"
          note: PM 그룹 변수는 이름 끝에 _pm
        - "검색 품질 플래그 — `retrieval_qual_flag` (16비트, 0 또는 8이면 고품질)"
        - "관측 시각 — `tb_time_utc` (UTC 문자열)"
        - "유효 토양 온도 — `surface_temperature` (K)"
        - "식생 광학 두께 — `vegetation_opacity` (무차원)"
    - name: L4 토양수분·지면 (SPL4SMGP, 3시간 평균)
      kind: mean
      period: 3시간
      items:
        - "표층 토양수분 0~5 cm — `sm_surface` (m3 m-3)"
        - "근권 토양수분 0~100 cm — `sm_rootzone` (m3 m-3)"
        - "전체 단면 토양수분 — `sm_profile` (m3 m-3)"
        - "표층·근권 습윤도 — `sm_surface_wetness`, `sm_rootzone_wetness` (무차원)"
        - "지표 온도 — `surface_temp` (K)"
        - "토양 온도 1층 — `soil_temp_layer1` (K)"
        - text: "적설 질량(수당량) — `snow_mass` (kg m-2)"
          std: [snow]
        - text: "적설 깊이 — `snow_depth` (m)"
          std: [snow]
        - "증발산 — `land_evapotranspiration_flux` (kg m-2 s-1)"
        - "지표 유출·기저 유출 — `overland_runoff_flux`, `baseflow_flux` (kg m-2 s-1)"
    - name: L4 탄소 (SPL4CMDL, 일평균)
      kind: mean
      period: 일
      items:
        - "순생태계 CO2 교환(NEE) — `NEE/nee_mean` (g C m-2 d-1)"
        - "총일차생산(GPP) — `GPP/gpp_mean` (g C m-2 d-1)"
        - "종속영양 호흡(Rh) — `RH/rh_mean` (g C m-2 d-1)"
        - text: "토양 유기탄소 — `SOC/soc_mean` (g C m-2)"
          note: 플럭스가 아니라 저장량
        - "NEE 오차 추정 — `QA/nee_rmse_mean` (g C m-2 d-1)"

