example:
  lang: python
  note: >-
    earthaccess로 2024년 7월 한 주의 SPL3SMP_E V6 파일을 받아 오전(AM) 토양수분을 고품질 값만 남겨 읽는 예입니다. 처음 실행 때 Earthdata 아이디·비밀번호를 묻습니다.
    EASE-Grid 2.0 격자라 위경도 1차원 좌표가 없으므로, 지도로 그리려면 같은 그룹의 위경도 배열이나 EASE-Grid 2.0 좌표 파일을 함께 쓰세요.
  code: |
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="SPL3SMP_E", version="006",
        temporal=("2024-07-01", "2024-07-07"),
        bounding_box=(124, 33, 132, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "smap_l3e")

    with h5py.File(files[0], "r") as f:
        g = f["Soil_Moisture_Retrieval_Data_AM"]
        sm = g["soil_moisture"][:]               # (1624, 3856), m3/m3
        qf = g["retrieval_qual_flag"][:]
    sm = np.where((sm == -9999.0) | ~np.isin(qf, [0, 8]), np.nan, sm)
    print(np.nanmean(sm))

    # L4 3시간 자료: short_name="SPL4SMGP", version="008", 그룹 "Geophysical_Data"의 "sm_rootzone"

tips:
  - "L3는 사용자 안내서가 고품질로 정의한 `retrieval_qual_flag` 0 또는 8인 값만 남기고 쓰세요. 플래그를 거르지 않으면 품질이 낮은 검색값이 섞입니다."
  - SPL3SMP_E의 9 km는 36 km 관측을 보간한 격자입니다. 실제로 구분되는 공간 규모는 여전히 수십 km이므로 9 km 개별 격자를 독립 관측처럼 다루지 마세요.
  - 2019-06-19~07-23, 2022-08-06~09-20 안전모드 기간은 L3가 비어 있고 L4는 관측 없이 모델로만 채워졌습니다. 2019년 복구 직후 일정 기간은 품질 주의 공지가 있었습니다.
  - "2026-05-14~07-28 자료를 그 전에 받았다면 위치 오류가 있는 판입니다. 재처리본이 올라오면 다시 받으세요(파일 이름 끝 번호가 커진 것이 새 판)."
  - "L4는 SMAP 밝기온도를 동화한 모델 값이라 관측이 없는 깊이(근권)와 날에도 값이 있습니다. 근권 토양수분은 관측이 아니라 GEOS 지면 모델 추정입니다."
  - "SPL4SMGP 파일 시각은 3시간 평균 구간의 가운데입니다(T013000 = 00~03 UTC). 한국 시간 일평균을 만들려면 UTC 15시 경계로 8개 파일을 묶으세요."
  - "버전이 바뀌면 과거 기간 전체가 다시 처리되고 옛 버전은 내려갑니다(L3 V8은 2024-12-16, L4 V7은 2025-06-30 폐기). 논문에는 short_name과 버전, 파일 이름의 CRID(R19…) 또는 과학 버전(Vv80…)을 적으세요."

