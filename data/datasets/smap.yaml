transitions:
  - from: SMAP L3 SPL3SMP V8 · SPL3SMP_E V5
    to: SMAP L3 SPL3SMP V9 · SPL3SMP_E V6 (CRID R19)
    status: completed
    date: "2024-10"
    summary: >-
      입력 L1B·L1C 밝기온도의 처리 방법을 개선한 재처리로, 토양수분 알고리즘·파일 구조·변수는 그대로입니다. 2023년 12월 전방 처리를 시작해
      2024년 10월 30일 2015년부터의 전 기간 재처리가 끝났고, 이전 버전은 2024년 12월 16일 내려갔습니다.
    changes:
      - aspect: 버전·CRID
        before: "SPL3SMP V8, SPL3SMP_E V5 (L1B·L1C V5 기반)"
        after: "SPL3SMP V9, SPL3SMP_E V6 (L1B·L1C V6 기반, 파일 이름 CRID R19xxx)"
      - aspect: 바뀐 점
        before: "이전 밝기온도 처리"
        after: "입력 L2 복사계 밝기온도에 개선된 처리 방법 적용 (알고리즘·구조·내용·처리 코드는 동일)"
      - aspect: 제공
        before: "V8·V5는 2024-12-16 폐기"
        after: "V9·V6만 제공, 2015-03-31~현재"
    impacts:
      - 옛 버전으로 만든 시계열은 새 버전으로 전 기간을 다시 받아 바꾸세요. 같은 날짜도 값이 조금씩 다릅니다.
      - earthaccess·스크립트의 version 값을 '009'(SPL3SMP)·'006'(SPL3SMP_E)으로 고쳐야 합니다.
    sources:
      - name: NSIDC 공지 — Data set updates SMAP Level-1, Level-2, and Level-3 (2024-10-30)
        url: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-1-level-2-and-level-3-data-sets-0
      - name: SPL3SMP V9 사용자 안내서
        url: https://nsidc.org/sites/default/files/documents/user-guide/spl3smp-v009-userguide.pdf
  - from: SMAP L4 Version 7
    to: SMAP L4 Version 8
    status: completed
    date: "2025-04"
    summary: >-
      L4 토양수분·탄소 제품이 Version 8로 2015년부터 재처리되었고, Version 7은 2025년 6월 30일 내려갔습니다. 강수 강제력·복사 전달 모델·눈 알베도가 바뀌고
      입력 밝기온도가 R19(SPL1CTB V6)로 통일되었으며, 탄소 모델은 새 플럭스 관측망으로 다시 보정되었습니다.
    changes:
      - aspect: 강수 강제력 (SPL4SMGP)
        before: "이전 강수 보정 체계"
        after: "북미·고위도 밖은 IMERG Version 07 사용"
      - aspect: 동화 입력
        before: "이전 버전 밝기온도"
        after: "SPL1CTB Version 6(R19) 밝기온도만 사용, 척도 매개변수를 2015-04~2024-03 자료로 재보정"
      - aspect: 모델 물리 (SPL4SMGP)
        before: "이전 마이크로파 복사 전달 모델·눈 알베도"
        after: "마이크로파 복사 전달 모델(mwRTM) 갱신, 눈 알베도 매개변수화 변경, 버그 수정"
      - aspect: 탄소 모델 (SPL4CMDL)
        before: "La Thuile/FLUXNET2015 기반 보정, 낙엽 유입을 연평균 NPP의 고정 비율로 배분"
        after: "410개 에디 공분산 관측탑으로 BPLUT 재보정, 위성 LAI 기반 계절 낙엽 배분, ISCN 자료로 SOC 분해 재보정·SOC 재초기화"
      - aspect: 과학 버전 ID
        before: "Vv7xxx"
        after: "Vv8xxx (2026-10 파일 기준 SPL4SMGP Vv8011, SPL4CMDL Vv8041)"
    impacts:
      - V7과 V8을 섞지 말고 전 기간을 V8로 다시 받으세요. 강수 강제력이 바뀌어 근권 토양수분 기후값도 달라집니다.
      - "SPL4SMGP V8의 `depth_to_water_table_from_surface` 변수는 이름과 달리 이탄지(peat) 지하수위 깊이라고 안내서가 밝힙니다."
    sources:
      - name: NSIDC 공지 — SMAP Level-4 Version 8 Release (2025-04-15)
        url: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-4-version-8-release
      - name: NSIDC SPL4SMGP Version 8 페이지
        url: https://nsidc.org/data/spl4smgp/versions/8
      - name: NSIDC SPL4CMDL Version 8 페이지
        url: https://nsidc.org/data/spl4cmdl/versions/8

notices:
  - date: "2026-10-15"
    level: info
    title: 2026-05-14~07-28 위치 오류 재처리 완료 — 이 기간 표준 제품 다시 받기 권고
    body: >-
      NSIDC DAAC는 2026년 8월 발견된 위치(geolocation) 오류를 바로잡기 위해 SMAP 표준 제품의 2026년 5월 14일~7월 28일 자료를 재처리했다고 알렸습니다.
      이 기간 자료를 이미 받았다면 수정된 파일로 다시 받으라고 권고합니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-reprocessing-complete
  - date: "2026-08-11"
    level: warning
    title: 2026-05-14~07-28 위치(geolocation) 오류 — 표준 제품 재처리 중
    body: >-
      SMAP 표준·근실시간 제품에 2026년 5월 14일~7월 28일 위치 오류가 있었습니다. 이 기간 표준 제품은 재처리해 몇 주 안에 교체하며,
      근실시간(NRT) 제품은 교체하지 않습니다. 이 기간 자료를 이미 받았다면 재처리본으로 다시 받으세요.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-reprocessing
  - date: "2025-08-05"
    level: critical
    title: NSIDC 옛 온프레미스 보관소 접근 종료(2025-10-28) — Earthdata Cloud로 전환
    body: >-
      NSIDC DAAC의 옛(온프레미스) 보관소에서 SMAP 자료를 받는 경로(HTTPS 파일 시스템, Earthdata Search 주문, ESI·EGI 변환 서비스)가 2025년 10월 28일 닫혔습니다.
      이제 NASA Earthdata Cloud가 주 보관소이므로 스크립트를 CMR·earthaccess·클라우드 HTTPS 경로로 바꿔야 합니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-retirement-legacy-data-archive-smap-data
  - date: "2025-04-15"
    level: info
    title: SMAP L4 Version 8 공개 — Version 7은 2025-06-30 폐기
    body: >-
      L4 토양수분(SPL4SMGP·SPL4SMAU·SPL4SMLM)과 탄소(SPL4CMDL)가 Version 8로 갱신되어 2015-03-31부터 전 기간이 제공됩니다.
      Version 7은 2025년 6월 30일 내려갔습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-4-version-8-release
  - date: "2025-01-08"
    level: warning
    title: JPL 주변 산불로 SMAP 자료 처리 일시 중단 (2025-01-14 재개)
    body: >-
      캘리포니아 패서디나 JPL 주변 산불로 SMAP 과학자료 처리 시스템이 닫혀 자료 생산이 멈췄습니다. NSIDC는 2025년 1월 14일 처리가 재개되었다고 알렸습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-outage
  - date: "2024-10-30"
    level: info
    title: L1~L3 재처리 완료 — SPL3SMP V9, SPL3SMP_E V6 (이전 버전 2024-12-16 폐기)
    body: >-
      SMAP L1·L2·L3 새 버전의 2015년부터 재처리가 끝났습니다. L3 토양수분은 SPL3SMP V9, SPL3SMP_E V6이며 이전 버전은 2024년 12월 16일 내려갔습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-smap-level-1-level-2-and-level-3-data-sets-0
  - date: "2022-08-22"
    level: warning
    title: SMAP 안전모드 (2022-08-06~09-20 관측 공백)
    body: >-
      SMAP가 2022년 8월 안전모드에 들어가 과학 관측이 멈췄습니다. NSIDC 공지는 진입일을 8월 8일로, 사용자 안내서는 공백을 8월 6일~9월 20일로 적고 있습니다.
      L3는 이 기간 자료가 없고 L4는 SMAP 관측 없이 모델로만 계속 만들어졌으며, 복구 뒤 자료는 이전과 일관된다고 안내합니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-safe-mode
  - date: "2019-06-24"
    level: warning
    title: SMAP 안전모드 (2019-06-19~07-23 관측 공백)
    body: >-
      SMAP가 2019년 6월 19일 저녁 안전모드에 들어가 모든 기기가 꺼졌습니다. 7월 23일까지 관측이 없으며 L4는 이 기간 관측 없이 만들어졌습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/smap-safe-mode
  - date: "2015-07-07"
    key_date: "2015-07"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: critical
    title: SMAP 레이더 고장 — 이후 복사계 단독 운용
    body: >-
      2015년 7월 SMAP 레이더가 멈춰 레이더·결합(능동-수동) 토양수분 제품 생산이 끝났습니다. 그 뒤 SMAP 제품은 모두 L밴드 복사계 관측으로만 만들어집니다.
    source: https://nsidc.org/data/smap

