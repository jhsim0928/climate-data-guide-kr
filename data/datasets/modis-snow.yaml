transitions:
  - from: MODIS 적설 C6.1 (MOD10·MYD10)
    to: VIIRS 적설 C2 (VNP10·VJ110)
    to_id: viirs-snow
    status: planned
    date: "2026"
    summary: >-
      VIIRS 적설 제품은 MODIS Collection 6 알고리즘과 함께 개발되어 거의 같은 방식(NDSI + 검사)으로 만들어지며, MODIS 기록을 잇도록 설계되었습니다.
      해상도(500 m → 375 m), 구름 마스크, 관측 시각, 제공 제품 종류가 달라 그대로 이어 붙이면 안 됩니다.
    changes:
      - aspect: 위성·관측 시각
        before: "Terra(오전, 2000-02~)·Aqua(오후, 2002-07~) 따로 제공"
        after: "Suomi NPP(VNP10, 2012-01~, 2026-11-02 전달 종료)·NOAA-20(VJ110, 2018-01~)·NOAA-21(VJ210, 2023-02~), 모두 오후 궤도. Terra 같은 오전 관측 후속은 없음"
      - aspect: 해상도
        before: "500 m Sinusoidal 타일(2400×2400) / 0.05° CMG"
        after: "375 m Sinusoidal 타일(3000×3000) / 0.05° CMG / 375 m 전지구 위경도 구름 채움(D1F)"
      - aspect: NDSI 밴드
        before: "MODIS 가시 밴드와 6번 밴드(1.6 µm, Aqua는 QIR 복원)"
        after: "VIIRS I1(0.64 µm)과 I3(1.61 µm)"
      - aspect: 구름 마스크
        before: "MOD35/MYD35"
        after: "VNP35 등(750 m 구름 신뢰도를 375 m 화소 4개에 적용)"
      - aspect: 제공 제품
        before: "일(A1), 구름 채움 일(A1F), 8일(A2·C2), 일 CMG(C1), 월 CMG(CM), 적설 알베도 층"
        after: "일(A1), 구름 채움 일(A1F), 일 CMG(C1), 375 m CMG 구름 채움(D1F)만 — 8일·월 제품과 적설 알베도 없음"
      - aspect: 변수·코드
        before: "`NDSI_Snow_Cover_Basic_QA`, `NDSI_Snow_Cover_Algorithm_Flags_QA`, NDSI scale 0.0001, 200 결측·254 포화"
        after: "`Basic_QA`, `Algorithm_bit_flags_QA`, NDSI scale 0.001, 251 L1B 결측·252 보정 실패·253 보타이 잘림 추가"
      - aspect: 파일 형식
        before: "HDF-EOS2 (HDF4)"
        after: "HDF-EOS5 (HDF5, CF-1.6)"
    impacts:
      - "Hall et al. (2024)은 미국 그레이트베이슨에서 VIIRS(VNP10A1F)가 MODIS(MOD10A1F)보다 눈을 약간 더 많이 잡는다고 보고했습니다(덜 보수적인 구름 마스크·관측 시각 차이). 2023 물년도 하루 적설 면적 차이는 평균 0.69%였고, 그레이트솔트레이크 유역의 적설 기간은 VIIRS가 약 2일 길었습니다."
      - "MODIS 8일·월 제품을 쓰던 분석은 VIIRS 일자료로 직접 합성해야 합니다. 합성 방식(최대 범위, 평균)을 MODIS와 맞추세요."
      - "Terra(오전)와 VIIRS(오후)는 관측 시각이 달라 융설기 하루 변화나 오전 구름 차이가 값에 반영됩니다. 이어 붙일 때는 Aqua와 VIIRS를 겹치는 기간(2012년 이후)에 먼저 비교하세요."
      - "Suomi NPP 자료(VNP10) 전달은 2026년 11월 2일 끝나므로 앞으로는 VJ110(NOAA-20)·VJ210(NOAA-21)을 씁니다."
    sources:
      - name: Riggs, Hall, Román (2017) — MODIS·VIIRS 적설 ESDR 개요
        url: https://doi.org/10.5194/essd-9-765-2017
      - name: Hall, Riggs, DiGirolamo (2024) — MODIS·VIIRS 적설 제품 비교 (Great Basin)
        url: https://doi.org/10.3390/rs16163029
      - name: Román et al. (2024) — MODIS C6.1과 VIIRS C2 지면 제품의 연속성
        url: https://doi.org/10.1016/j.rse.2023.113963
      - name: NASA Earthdata — Transition from MODIS to VIIRS (2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - from: MODIS 적설 Collection 6.1 (V61)
    to: MODIS 적설 Collection 7
    status: planned
    summary: >-
      MODIS 적설팀은 마지막 재처리판인 Collection 7 사용자 안내서(2025년 2월, Version 1.0)를 공개했습니다. 적설 알고리즘은 C6.1과 같고 Level 1B 보정만 개선되며,
      2026-10-13 확인 시 NSIDC·CMR에는 아직 C7 자료가 없습니다.
    changes:
      - aspect: 파일 형식
        before: "HDF-EOS2 (HDF4)"
        after: "HDF-EOS5 (HDF5 기반)"
      - aspect: 제공 제품
        before: "L2, A1, A1F, A2(8일), C1, C2(8일 CMG), CM(월 CMG)"
        after: "L2, A1, A1F, C1 — 8일(A2·C2)·월(CM) 제품 중단"
      - aspect: 적설 알베도
        before: "MOD10A1에 `Snow_Albedo_Daily_Tile` 포함"
        after: "삭제"
      - aspect: 알고리즘
        before: "C6.1 적설 알고리즘"
        after: "변경 없음 (입력 L1B 보정만 개선, Aqua 6번 밴드는 계속 QIR 복원)"
    impacts:
      - C7이 나오면 전 기간 값이 바뀌므로 C6.1과 섞지 마세요.
      - "8일·월 제품이나 적설 알베도를 쓰는 코드는 C7에서 대안을 마련해야 합니다(일자료로 직접 합성 등)."
    sources:
      - name: MODIS Snow Products Collection 7 User Guide (Riggs·Hall, 2025-02)
        url: https://nsidc.org/sites/default/files/documents/technical-reference/modis_c7_snow_userguide.pdf
      - name: MODIS Land News (Collection 7 계획)
        url: https://modis-land.gsfc.nasa.gov/news.html

notices:
  - date: "2026-03-26"
    level: warning
    title: Terra MODIS 대기 모드 전환 — 2026년 3월 26~27일 자료 품질 불량
    body: >-
      3월 26일 약 20:00 UTC 위성 이상으로 Terra MODIS가 대기 모드로 들어갔다가 27일 과학 모드로 복귀했습니다.
      보정팀은 2026년 085일 20:00 UTC부터 086일 19:23 UTC까지의 자료를 의심·불량으로 표시했습니다. 해당 날짜 MOD10 값은 쓰지 않는 것이 안전합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2025-08-19"
    level: warning
    title: NSIDC DAAC 기존 MODIS 자료 저장소 접근 종료 — Earthdata Cloud로 이전
    body: >-
      NSIDC는 2025년 5월 22일 공지에서 MODIS C6.1과 관련 자료의 기존 온프레미스 저장소(n5eil01u.ecs.nsidc.org HTTPS, Earthdata Search 'Stage for Delivery' 주문)를
      8월 19일에 닫는다고 밝혔습니다. 이제 NASA Earthdata Cloud가 주 저장소이므로 다운로드 스크립트의 주소를 바꿔야 합니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-retirement-legacy-data-archive-modis-collection-61-and-modis-related-data-sets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 권고 — Terra·Aqua 2026년 말~2027년 초 종료 예정
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초에 종료 절차에 들어가면 MODIS 수집이 멈추고 그 전에 마지막 재처리를 하겠다고 밝혔습니다.
      궤도 표류가 통과 시각과 자료에 영향을 준다며 VIIRS 유사 제품으로 옮기라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2025-03-18"
    level: info
    title: MODIS V6.1 적설·해빙 자료 22종 Earthdata Cloud 제공 시작
    body: >-
      NSIDC가 MODIS V6.1 자료 22종을 NASA Earthdata Cloud(AWS)에 올렸습니다. 새 HTTPS 주소는 각 자료 페이지의 'HTTPS File System' 링크에 있으며,
      기존 주소는 곧 없어진다며 스크립트를 바꾸라고 안내했습니다(2025년 3월 4일 공지).
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-updates-new-nasa-earthdata-cloud-access-option-modis-version-61-collections-available-18
  - date: "2023-07-07"
    level: info
    title: Terra·Aqua MODIS 야간 무인 운용(LOOps) 전환 — 관측 결손 증가 가능
    body: >-
      비행운영팀이 야간 상주 근무를 없애고 기록장치 재전송으로 결손을 메우지 않게 되어, 이날 이후 모든 MODIS V6.1 자료에서 복구할 수 없는 결손이 더 잦을 수 있습니다.
      NSIDC MODIS 자료 페이지에도 같은 안내가 걸려 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/modis-light-out-operations-potential-data-loss
  - date: "2021-10-28"
    level: warning
    title: Terra·Aqua 궤도 변화가 MODIS 적설·해빙 제품에 영향
    body: >-
      Terra는 2020년 2월, Aqua는 2021년 3월 마지막 궤도 유지 기동 뒤 표류하고 있어, Terra 통과 시각은 2025년 12월 무렵 오전 9시로 앞당겨지고
      Aqua는 2026년 8월 무렵 오후 3시 50분 안팎으로 늦어질 것으로 예측되었습니다. 태양 고도가 낮아져 그림자가 늘고, 저고도화로 관측 범위가 줄며 16일 반복 관측이 지켜지지 않습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/ongoing-changes-terra-and-aqua-orbits-impacting-modis-snow-and-sea-ice-products

