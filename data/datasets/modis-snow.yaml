# ─────────────────────────────────────────────────────────────
# MODIS 적설 (MOD10·MYD10) C6.1 — 데이터셋 정보 파일
# 지면 탭(적설). Terra·Aqua 종료를 앞둔 대체 예정 자료이며, 후속 VIIRS 적설(viirs-snow.yaml)로 전환 정보를 연결합니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: modis-snow
name: "MODIS Snow (MOD10)"
full_name: MODIS/Terra·Aqua Snow Cover (MOD10·MYD10) Version 61 (MODIS 정규화 적설 지수(NDSI) 기반 적설 면적 — 일·8일·월, 500 m 타일·0.05° 기후모델격자, 구름 채움판 포함)
category: satellite
domain: land
group: 적설
order: 10
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 수문, 원격탐사]
provider: NASA GSFC MODIS 적설팀(Hall·Riggs) / NASA NSIDC DAAC

status: deprecated
status_note: >-
  Version 61(Collection 6.1)이 현재 판으로 Terra(MOD10)·Aqua(MYD10) 모두 매일 갱신되고 있습니다(2026-10-13 확인 시 MOD10A1·MYD10A1 최신 파일 2026년 10월 11일자).
  그러나 두 위성은 연료가 떨어져 궤도가 표류 중이며, NASA는 2026년 말~2027년 초 종료와 함께 MODIS 수집이 멈출 것이라며 VIIRS 적설(VNP10·VJ110)로 옮기라고 권고했습니다.
  처음 계획(Terra 2025년 12월, Aqua 2026년 8월 종료)보다 운용이 길어지고 있으나 공식 종료일은 아직 발표되지 않았습니다.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra(MOD10A1·A1F·C1)는 2000-02-24, 8일 제품(MOD10A2·C2)은 2000-02-18, 월 제품(MOD10CM)은 2000-03부터이고, Aqua(MYD10) 제품은 모두 2002-07-04부터입니다.
    2026-10-13 확인 시 두 위성 일자료 모두 2026-10-11까지 있습니다.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1일"
  spatial: >-
    MODIS Sinusoidal 타일 격자 500 m(MOD10A1·A1F·A2, 10°×10° 타일 하나 2400×2400 화소) / 0.05° 기후모델격자(CMG, MOD10C1·C2·CM, 3600×7200) /
    원본 스와스 500 m(MOD10_L2, 5분 단위)
  vertical: 지표면 단일층
  temporal: 일(A1·A1F·C1) / 8일(A2·C2, 매년 1월 1일 기준으로 끊음) / 월(CM)

coverage:
  short: 전지구
update: 매일 (관측 후 며칠 지연, 위성 기동 시 더 늦어질 수 있음) / 8일·월 제품은 기간이 끝난 뒤
