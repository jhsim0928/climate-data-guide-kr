account_required: true

summary: >-
  NASA MODIS 적설팀이 Terra(MOD10)와 Aqua(MYD10) MODIS 관측에서 정규화 적설 지수(NDSI)와 여러 오류 걸러내기 검사로 만든 전지구 적설 면적 자료입니다.
  500 m 타일 일자료(MOD10A1)는 화소마다 0~100의 NDSI 적설값을 주고, 구름 아래를 이전 맑은 날 값으로 채운 일자료(MOD10A1F),
  8일 최대 적설 범위(MOD10A2), 0.05° 격자의 일·8일·월 적설 비율(MOD10C1·C2·CM)이 함께 제공됩니다.
  2000년부터 이어진 기록이라 적설 기후, 융설 시기, 수문 모델 검증에 널리 쓰이며, 후속 기록은 VIIRS 적설 제품이 잇습니다.

time_convention:
  summary: >-
    일자료(MOD10A1)는 그날 화소 위를 지나간 여러 관측 가운데 '가장 좋은' 하나(현지 정오에 가장 가깝고, 궤도 직하점에 가깝고, 격자를 가장 많이 덮는 관측)를 골라 담은 값이라 순간값입니다.
    Terra는 오전, Aqua는 오후 위성이므로 같은 날이라도 두 자료의 관측 시각이 다릅니다. 8일 제품은 기간 중 '한 번이라도 눈이면 눈'인 최대 범위, 월 제품은 일자료의 월평균입니다.
  points:
    - "각 화소가 어느 스와스(관측 시각)에서 왔는지는 `granule_pnt`·`orbit_pnt`와 파일 메타데이터로 추적할 수 있습니다. 그날 다른 관측은 버려지므로 같은 날짜라도 화소마다 관측 시각이 다릅니다."
    - "Terra는 원래 적도 통과 오전 10시 30분, Aqua는 오후 1시 30분 궤도였지만 연료 소진 뒤 표류해 Terra는 2025년 12월 무렵 오전 9시, Aqua는 2026년 8월 무렵 오후 3시 50분 안팎까지 옮겨 갈 것으로 예측되었습니다. 태양 고도가 낮아져 그림자·조도 부족 영향이 커집니다."
    - "MOD10A1F(구름 채움)는 오늘 구름인 화소에 '가장 최근 맑은 날'의 값을 넣습니다. `Cloud_Persistence`가 1 이상이면 그 화소 값은 오늘 관측이 아니라 그만큼 전의 관측입니다(0 = 오늘 맑음)."
    - "MOD10A2(8일)는 기간 중 하루라도 눈이 관측되면 눈으로, 8일 내내 구름일 때만 구름으로 표시합니다. 8일 구간은 매년 1월 1일에서 새로 시작해 연말 마지막 구간은 짧을 수 있습니다."
    - "MOD10C1(일 CMG)의 적설 비율은 그 칸 안 모든 육지 관측 중 눈 비율이고, 구름 비율은 따로 줍니다. 남극은 일부러 100% 눈으로 처리되어 남극 적설 연구에는 쓸 수 없습니다."
    - "MOD10CM(월)은 MOD10C1 일자료에서 만든 월평균 적설 범위입니다."
  source: https://nsidc.org/sites/default/files/c61_modis_snow_user_guide.pdf
  source_name: "MODIS Snow Products Collection 6.1 User Guide (Riggs·Hall·Román, 2019) + NSIDC 자료 페이지"

variables:
  note: >-
    MODIS Snow Products C6.1 사용자 안내서(NSIDC)의 자료층 이름입니다. 파일 형식은 HDF-EOS2(HDF4)입니다.
    `NDSI_Snow_Cover` 값 0~100은 NDSI×100(적설 '면적비'가 아님)이고 200 결측, 201 판단 불가, 211 밤, 237 내륙 수면, 239 바다, 250 구름, 254 검출기 포화, 255 채움값입니다.
  full_list: https://nsidc.org/sites/default/files/c61_modis_snow_user_guide.pdf
  groups:
    - name: 일 적설 500 m (MOD10A1 / MYD10A1)
      kind: instant
      period: 하루 중 선택된 관측 1회
      items:
        - text: "NDSI 적설값 — `NDSI_Snow_Cover` (0~100, 무차원)"
          note: 그날 가장 좋은 관측 하나의 값. 적설 면적비(FSC)는 C6부터 제공하지 않음
        - "원시 NDSI — `NDSI` (scale_factor 0.0001)"
        - "기본 품질 — `NDSI_Snow_Cover_Basic_QA` (0 최상, 1 양호, 2 보통)"
        - "알고리즘 검사 비트 — `NDSI_Snow_Cover_Algorithm_Flags_QA` (비트 0~7: 내륙 수면, 저반사·저NDSI·온도/고도·고SWIR 검사, 구름 가능성, 태양 천정각 70° 초과)"
        - text: "적설 알베도 — `Snow_Albedo_Daily_Tile` (0~100, %)"
          note: 눈 화소에만 계산. 이상적 조건에서 현장 관측과 10% 이내, 급경사 산지에서는 오차가 매우 클 수 있음. Collection 7에서는 빠질 예정
        - "관측 출처 포인터 — `orbit_pnt`, `granule_pnt`"
    - name: 구름 채움 일 적설 500 m (MOD10A1F / MYD10A1F)
      kind: instant
      period: 가장 최근 맑은 날의 관측
      items:
        - text: "구름 채움 NDSI 적설값 — `CGF_NDSI_Snow_Cover` (0~100)"
          note: 구름 화소는 이전 맑은 날 값으로 채움. 거의 구름 없는 지도가 되려면 보통 5~7일 필요
        - text: "연속 구름 일수 — `Cloud_Persistence` (일)"
          kind: accum
          note: 0 = 오늘 맑음, n = n일 연속 구름(값이 n일 전 관측이라는 뜻)
        - text: "당일 MOD10A1 값 사본 — `MOD10A1_NDSI_Snow_Cover`, `MYD10A1_NDSI_Snow_Cover`"
          note: "앞은 Terra, 뒤는 Aqua 파일의 이름"
        - "품질 — `Basic_QA`, `Algorithm_Flags_QA`"
    - name: 8일 적설 500 m (MOD10A2 / MYD10A2)
      kind: max
      period: 8일
      items:
        - text: "8일 최대 적설 범위 — `Maximum_Snow_Extent` (분류: 25 눈 없음, 37 호수, 39 바다, 50 구름, 100 호수 얼음, 200 눈 등)"
          note: 기간 중 하루라도 눈이면 눈
        - text: "8일 날짜별 눈 여부 비트 — `Eight_Day_Snow_Cover`"
          kind: instant
          note: 비트 0 = 기간 첫날. 어느 날 눈이 보였는지 확인용
    - name: 0.05° CMG 적설 비율 (MOD10C1 일 / MOD10C2 8일 / MOD10CM 월)
      items:
        - text: "일 적설 비율 — `Day_CMG_Snow_Cover` (%)"
          kind: instant
          period: 하루 중 선택된 관측
          note: MOD10C1. 칸 안 육지 관측 중 눈 비율
        - text: "일 구름 비율 — `Day_CMG_Cloud_Obscured` (%), 맑음 지수 — `Day_CMG_Clear_Index` (%)"
          kind: instant
          period: 하루 중 선택된 관측
        - text: "8일 적설 비율 — `Eight_Day_CMG_Snow_Cover` (%)"
          kind: max
          period: 8일
          note: MOD10C2. 8일 동안의 최대 적설 비율(MOD10A2 기반)
        - text: "8일 구름 비율 — `Eight_Day_CMG_Cloud_Obscured` (%), 맑음 지수 — `Eight_Day_CMG_Clear_Index` (%)"
          kind: max
          period: 8일
          note: 8일 내내 구름인 지속 구름 비율
        - text: "월 적설 비율 — `Snow_Cover_Monthly_CMG` (%)"
          kind: mean
          period: 월
          note: MOD10C1 일자료의 월평균 적설 범위
        - text: "칸별 품질 — `Snow_Spatial_QA`"
          kind: instant

access:
  - name: NSIDC DAAC 자료 페이지 (MOD10A1 V61)
    url: https://nsidc.org/data/mod10a1/versions/61
    method: NSIDC Data Access Tool(날짜·영역 선택, 파이썬 스크립트 생성) / HTTPS / 문서
    note: Terra는 MOD10*, Aqua는 MYD10* 페이지입니다. 22개 MODIS V61 자료 목록은 https://nsidc.org/data/modis/data 에 있습니다.
  - name: NASA Earthdata Search · earthaccess (Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2565093311-NSIDC_CPRD
    method: 웹 검색·다운로드 / earthaccess / AWS S3(us-west-2 안에서만)
    note: >-
      2025년 8월 19일부터 NSIDC 기존 저장소(n5eil01u.ecs.nsidc.org) 접근이 끝나고 Earthdata Cloud가 주 저장소가 되었습니다.
      CMR 짧은 이름은 MOD10A1, 버전은 61입니다(MCD43의 '061'과 달리 앞자리 0이 없음).
  - name: NASA AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: 지점·영역 추출, 재투영
  - name: NASA Worldview
    url: https://worldview.earthdata.nasa.gov/
    method: 웹 지도 시각화
    note: 받기 전에 날짜별 적설·구름 분포를 눈으로 확인하기 좋습니다.

example:
  lang: python
  note: >-
    earthaccess로 2024년 1월 한반도 영역의 Terra 구름 채움 일 적설(MOD10A1F)을 받아 읽는 예입니다. HDF4 파일이라 pyhdf로 엽니다(pip install earthaccess pyhdf numpy).
  code: |
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="MOD10A1F", version="61",
        temporal=("2024-01-15", "2024-01-15"),
        bounding_box=(124, 33, 132, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "mod10a1f")

    for f in files:
        sd = SD(f, SDC.READ)
        ndsi = sd.select("CGF_NDSI_Snow_Cover")[:].astype("float32")
        cp = sd.select("Cloud_Persistence")[:]
        ndsi[ndsi > 100] = np.nan          # 200 이상은 결측·밤·물·구름 등 코드값
        snow = ndsi > 0                     # 예시로 NDSI 적설값 1~100을 눈으로 봄 (연구 목적에 맞게 임계값 조정)
        fresh = cp == 0                     # 오늘 맑아서 오늘 관측인 화소
        print(f, np.nanmean(snow), fresh.mean())

tips:
  - "`NDSI_Snow_Cover`의 0~100은 NDSI 값(×100)이지 적설 면적비가 아닙니다. Collection 6부터 적설 면적비(FSC)와 이진 적설 지도를 주지 않으므로, 연구 지역과 목적에 맞는 NDSI 임계값을 직접 정하고 논문에 밝혀야 합니다."
  - "200 이상 값(200 결측, 201 판단 불가, 211 밤, 237 내륙 수면, 239 바다, 250 구름, 254 포화, 255 채움)을 먼저 걸러내지 않으면 평균이 크게 틀어집니다."
  - "Aqua MODIS 6번 밴드(1.6 µm)는 검출기의 약 75%가 동작하지 않습니다. Collection 6·6.1은 정량 영상 복원(QIR)으로 6번 밴드를 되살려 Terra와 같은 알고리즘을 쓰지만, Collection 5 Aqua 자료는 7번 밴드를 써서 Terra와 결과가 다릅니다. 옛 Aqua 자료와 섞지 마세요."
  - "구름 채움판(MOD10A1F)의 값은 `Cloud_Persistence`일 전 관측일 수 있습니다. 융설기처럼 빠르게 변하는 시기에는 구름 지속 일수가 긴 화소를 빼고 분석하세요."
  - "구름과 눈 혼동(구름 가장자리, 얇은 눈을 구름으로 판단), 남극(오류가 잦아 권장하지 않음), 탁한 호수의 가짜 호수 얼음, 염전 같은 밝은 지표의 가짜 눈이 알려진 문제입니다. 날마다 위치가 조금씩 흔들려 호수·해안선 경계가 번질 수 있습니다."
  - "Terra·Aqua 궤도 표류로 통과 시각이 바뀌어 태양 고도가 낮은 관측이 늘었습니다. 특히 고위도 겨울·이른 봄 자료와 2020년대 이후 추세에 영향이 있을 수 있습니다."
  - "2023년 7월 7일부터 야간 무인 운용(LOOps)으로 복구 불가능한 결손이 전보다 잦습니다. 빠진 타일은 구름 채움판에서도 '구름'처럼 처리되어 이전 값이 이어집니다."
  - "MODIS 적설팀은 Collection 7 사용자 안내서(2025년 2월)를 내놓았습니다. C7은 알고리즘이 같지만 HDF-EOS5 형식이고, 8일(A2·C2)·월(CM) 제품과 적설 알베도 층이 빠집니다. 2026-10-13 확인 시 NSIDC에는 아직 V61만 있습니다."

