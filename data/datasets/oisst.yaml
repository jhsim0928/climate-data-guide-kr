notices:
  - date: "2026-10-02"
    level: warning
    title: NCEI 클라우드 이전으로 자료 접근 지연 (2026-10-30까지 예정)
    body: >-
      NCEI가 자료와 서비스를 클라우드로 옮기는 중이라 일시적으로 다운로드가 느리거나 실패할 수 있다고 공지했습니다.
      주문형 서비스도 같은 기간 결과가 비거나 불완전할 수 있습니다. 안 될 때는 PSL이나 AWS·Google Cloud 사본을 이용하세요.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2023-04-01"
    level: info
    title: v2.1b — 선박 SST 편향 보정을 월별 시간변화 방식으로 변경
    body: 선박 관측의 편향이 시간에 따라 변하는 점을 반영해 보정을 매달 갱신하도록 바꿨습니다. 이 날짜 이후 생산분에만 적용됩니다.
    source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
  - date: "2021-10-01"
    level: info
    title: v2.1a — 위성 입력을 NOAA ACSPO SST로 교체
    body: METOP-A 퇴역에 따라 위성 입력 자료를 ACSPO SST로 바꿨습니다. 이 날짜 이후 생산분에만 적용됩니다.
    source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
  - date: "2020-04-01"
    level: info
    title: v2.1 공개, v2.0 대체
    body: v2.1이 v2.0을 대체했고 v2.0 생산은 2020년 4월 26일에 끝났습니다. 2016년 이후 구간이 개선되었습니다.
    source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst

