# ─────────────────────────────────────────────────────────────
# OISST — 데이터셋 정보 파일
# 해양 탭(관측 기반 분석장)에 싣고, 해빙 탭에도 교차 수록합니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: oisst
name: OISST v2.1
full_name: NOAA 0.25° Daily Optimum Interpolation Sea Surface Temperature (DOISST/OISST) v2.1 (일별 최적내삽 해수면온도 분석장)
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 10
also_in:
  - domain: seaice
    group: 관측 기반 분석장
    label: OISST (해빙 농도)
domains: [해양, 해빙]
provider: NOAA National Centers for Environmental Information (NCEI)

status: active
status_note: >-
  매일 갱신되며 정상 제공 중입니다. 2021년 10월(위성 입력 ACSPO로 교체, v2.1a)과 2023년 4월(선박 편향 보정 월별화, v2.1b)에
  생산 방식이 바뀌었지만 이름은 v2.1로 유지됩니다. 2026년 10월 현재 NCEI 클라우드 이전 작업으로 일시적인 접근 지연이 공지되어 있습니다.

period:
  start: "1981-09"
  end: present
  note: >-
    예비(preliminary) 자료는 약 1일 뒤 나오고, 약 2주 뒤 최종(final) 자료로 교체됩니다.
    2016년 1월 1일 이전 자료는 v2.0과 같습니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: "0.25° 정규 위경도 격자 (전지구)"
  vertical: 해수면 단일층
  temporal: 일평균 (월평균은 NOAA PSL에서 별도 제공)

update: 매일 (예비 약 1일, 최종 약 2주 지연)
license: 미국 정부 공공 자료 — 이용 제한 없음, 데이터셋 DOI와 논문 인용 요청
account_required: false

summary: >-
  NOAA NCEI가 만드는 일별 0.25° 해수면온도(SST) 분석장으로, AVHRR 위성 SST와 선박·부이·Argo 현장 관측을 최적내삽(OI)으로 합쳤습니다.
  위성 SST는 현장 관측에 맞춰 편향을 보정하고, 해빙 가장자리에서는 해빙 농도로 만든 대리 SST를 사용합니다.
  1981년 9월부터 끊김 없이 이어지는 매일 자료라 해양 열파, ENSO 감시, 기후값 계산 등에 폭넓게 쓰입니다.

time_convention:
  summary: >-
    하루치 관측을 모아 만든 일별 분석장으로, 각 값은 그날의 대표값(일평균)입니다. NCEI 원본 파일의 시간 값은
    그날 12:00 UTC('하루의 중심 시각')로 표기되며, 특정 시각의 순간값이 아닙니다.
  points:
    - "NCEI는 '하루 동안의 위성 관측을 0.25° 격자에 평균해' 쓴다고 설명합니다. 일변화(주간·야간 차이)는 담지 않습니다."
    - "NCEI 원본·ERDDAP의 time은 'Center time of the day'(예: 1981-09-01T12:00:00Z)입니다. NOAA PSL 연도별 파일은 같은 날짜를 00:00으로 표기하므로 두 출처를 섞을 때 날짜만 맞추세요."
    - "편차(anom)는 1971~2000년 일별 기후값을 뺀 값입니다. PSL 파일은 1991~2020년 기후값 파일을 따로 제공합니다."
    - "해빙 근처 대리 SST에는 일별 해빙 농도의 7일 중앙값이 쓰입니다. 파일 속 ice 값의 정확한 시간 처리(당일 값인지 7일 중앙값인지)는 공식 문서에 명시되어 있지 않습니다."
    - "예비본은 약 1일 뒤, 최종본은 약 2주 뒤 나오며 같은 날짜 값이 바뀔 수 있습니다."
  source: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
  source_name: NCEI OISST 제품 페이지 / ERDDAP ncdcOisst21Agg 메타데이터

variables:
  note: 파일 안의 변수명(short name) 기준입니다. NCEI 원본 일별 파일(oisst-avhrr-v02r01.YYYYMMDD.nc) 하나에 네 변수가 모두 들어 있습니다.
  full_list: https://www.ncei.noaa.gov/products/optimum-interpolation-sst
  groups:
    - name: 해수면온도
      kind: mean
      period: 일
      items:
        - "일평균 해수면온도 — `sst` (°C)"
        - text: "해수면온도 편차 — `anom` (°C)"
          kind: mean
          period: 일
          note: 일평균 SST에서 1971~2000년 일별 기후값을 뺀 편차
        - text: "추정 오차 표준편차 — `err` (°C)"
          kind: mean
          period: 일
          note: 그날 분석값(sst)에 대한 오차 추정치. 별도의 시간 통계가 아니라 일별 분석에 딸린 값
    - name: 해빙
      kind: mean
      period: 일
      items:
        - text: "해빙 농도 — `ice` (비율, 0~1)"
          kind: mean
          period: 일
          note: PSL 파일(icec, 단위 percent)은 statistic을 'Mean', 평균 구간을 1일로 표기. NCEI 원본의 시간 처리 방식은 공식 문서에 명시되지 않음

access:
  - name: NCEI 직접 다운로드 (일별 NetCDF)
    url: https://www.ncei.noaa.gov/data/sea-surface-temperature-optimum-interpolation/v2.1/access/avhrr/
    login: false
    method: HTTPS (wget / curl)
    note: 월별 폴더 안에 하루 한 파일입니다. 예비 자료 파일은 최종본이 나오면 교체되므로 주기적으로 다시 받으세요.
  - name: NCEI THREDDS
    url: https://www.ncei.noaa.gov/thredds/catalog/OisstBase/NetCDF/V2.1/AVHRR/catalog.html
    login: false
    method: OPeNDAP / NetCDF Subset
  - name: NOAA PSL (연도별 묶음 파일)
    url: https://psl.noaa.gov/data/gridded/data.noaa.oisst.v2.highres.html
    login: false
    method: 웹 다운로드 / THREDDS / OPeNDAP
    note: >-
      sst.day.mean.YYYY.nc, sst.day.anom.YYYY.nc, sst.day.err.YYYY.nc, icec.day.mean.YYYY.nc처럼 변수·연도별로 묶여 있어
      긴 기간을 받기 편합니다. PSL 파일의 해빙 변수명은 icec 입니다.
  - name: AWS 오픈데이터 (NOAA CDR)
    url: https://noaa-cdr-sea-surface-temp-optimum-interpolation-pds.s3.amazonaws.com/index.html
    login: false
    method: 클라우드 저장소(S3)
  - name: Google Cloud (NOAA CDR)
    url: https://console.cloud.google.com/storage/browser/noaa-cdr-sea-surface-temp-optimum-interpolation
    method: 클라우드 저장소(GCS)

tips:
  - 같은 날짜 파일이 처음엔 예비본으로, 2주 뒤 최종본으로 교체됩니다. 최근 몇 주를 쓰는 분석은 최종본으로 다시 받아 결과를 확인하세요.
  - NCEI 원본의 anom은 1971~2000년 기후값 기준입니다. 1991~2020년 기준 편차가 필요하면 PSL의 기후값 파일(sst.day.mean.ltm.1991-2020.nc)로 직접 계산하세요.
  - "ice 변수는 위성 해빙 농도를 넣은 입력값으로, SST 분석을 위한 보조 자료입니다. 해빙 자체를 연구한다면 전용 해빙 농도 자료와 함께 비교하세요."
  - 1982년 이후 추세가 다른 SST 분석장보다 크게 나온다는 평가가 있습니다. 추세 연구에서는 다른 자료와 비교해 보는 것이 안전합니다.

