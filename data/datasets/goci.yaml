notices:
  - date: "2021-03"
    level: warning
    title: GOCI 임무 종료
    body: >-
      천리안위성 1호 GOCI가 2021년 3월 공식 임무를 마쳤습니다. 원래 설계 수명(2017년까지)보다 약 4년 더 운영되었고, 해양 관측은 천리안위성 2B호 GOCI-II가 이어받았습니다.
      OB.DAAC 자료는 2021-03-31이 마지막입니다.
    source: https://koreascience.or.kr/article/JAKO202131452697681.pdf
  - date: "2020-10"
    level: info
    title: 후속 GOCI-II 자료 서비스 시작
    body: >-
      국가해양위성센터가 2020년 10월 천리안위성 2B호(GOCI-II) 자료 서비스를 시작했습니다. 2020-10~2021-03에는 GOCI와 GOCI-II가 함께 관측해 두 자료를 비교할 수 있습니다.
    source: https://www.nosc.go.kr/boardContents/actionBoardContentsCons0015.do
  - date: "2016-05"
    level: info
    title: NASA OBPG GOCI 재처리 R2014.0 완료 — L1B·L2 배포 시작
    body: >-
      NASA OBPG가 GOCI 전 기간 재처리(R2014.0)를 마치고 OB.DAAC에서 L1B(HDF5)와 L2 해색 산출물 배포를 시작했습니다. VIIRS 기준 교차 보정을 적용해 MODIS-Aqua 대비 엽록소 비가 약 0.6에서 약 0.9로 바뀌었고,
      위성 궤도 정보 해석과 슬롯 시각 처리를 개선했습니다.
    source: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2014/goci

transitions:
  - from: GOCI (천리안위성 1호)
    to: GOCI-II (천리안위성 2B호)
    to_id: goci2
    status: completed
    date: "2021-03"
    summary: >-
      GOCI-II는 해상도를 500 m에서 250 m로, 분광 밴드를 8개에서 12개로 늘리고, 한반도 주변 관측을 하루 8회에서 10회로 늘리며 전구(FD) 관측을 새로 더했습니다.
      GOCI는 2021년 3월 임무를 마쳤고, 2020-10~2021-03에는 두 센서가 함께 관측했습니다.
    changes:
      - aspect: 기간
        before: "2011-04~2021-03 (OB.DAAC L2 기준)"
        after: "2020-10~현재 (임무 수명 계획 2020~2029)"
      - aspect: 공간 해상도
        before: 500 m
        after: 250 m
      - aspect: 분광 밴드
        before: "8개 (412~865 nm, 가시 6·근적외 2)"
        after: "12개 (380~865 nm) + 기하보정용 광대역 밴드"
      - aspect: 관측 횟수·영역
        before: "한반도 주변 2,500 km × 2,500 km, 하루 8회(현지 09~16시)"
        after: "한반도 주변(LA) 같은 크기 하루 10회(한국 시간 08:15~17:15) + 전구(FD) 하루 1회"
      - aspect: 산출물
        before: "OB.DAAC L2 — Rrs, chlor_a, Kd_490, poc, aot_865 등 NASA 표준 해색 산출물"
        after: "NOSC L2 26종 — 원격반사도·엽록소·부유물·용존유기물에 적조·부유조류·해무·표층해류·저염분수·에어로졸·육상 산출물 추가"
      - aspect: 제공처·계정
        before: "NASA OB.DAAC (Earthdata 로그인), KIOST 해양위성센터"
        after: "국립해양조사원 국가해양위성센터 (로그인 없이 웹·웹디렉토리·OPeNDAP). NASA OB.DAAC에는 없음"
    impacts:
      - 두 센서는 해상도·밴드·대기보정·처리 체계가 달라 같은 시계열로 이어 붙이기 전에 겹치는 기간(2020-10~2021-03)의 같은 해역 값을 비교해야 합니다.
      - GOCI는 OB.DAAC(NASA 처리), GOCI-II는 NOSC(국내 처리)에서 받으므로 산출물 이름·변수명·파일 구조가 다릅니다. 읽기 코드를 따로 준비하세요.
      - GOCI-II는 관측 시각이 한 시간 이르게 시작해 늦게 끝나므로(08:15~17:15 KST), 하루 변화 분석에서 시각을 맞춰 비교하세요.
    sources:
