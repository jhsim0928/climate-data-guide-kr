transitions:
  - from: VIIRS LAI/FPAR V1 (VNP15A2H V001)
    to: VIIRS LAI/FPAR V2 (VNP15A2H·VJ115A2H·VJ215A2H V002)
    status: completed
    date: "2023-08"
    summary: >-
      2023년 8월 Version 2(Suomi NPP·NOAA-20)가 나왔고, V1은 2024년 6월 17일 생산이 멈춘 뒤 2025년 4월 8일 배포가 끝났습니다.
      V2에는 2026년 2월 NOAA-21 제품(VJ215A2H)이 더해졌습니다.
    changes:
      - aspect: 위성
        before: "Suomi NPP만 (VNP15A2H V001)"
        after: "Suomi NPP(VNP15A2H)·NOAA-20(VJ115A2H, 2018~)·NOAA-21(VJ215A2H, 2023-02~) — V002"
      - aspect: 제공 상태
        before: "2024-06-17 생산 종료, 2025-04-08 배포 종료 (사용자 안내서·ATBD는 DOI 페이지에 남음)"
        after: "현재 유일한 판"
      - aspect: 파일 형식·변수 이름
        before: "HDF-EOS5, `Lai`·`Fpar` 등"
        after: "같음"
    impacts:
      - V1로 만든 결과는 V2로 다시 확인하세요. V1 파일은 Earthdata Search·Data Pool·AppEEARS에서 더 이상 받을 수 없습니다.
    sources:
      - name: VIIRS Version 2 LAI/FPAR 제품 공개 (Earthdata 공지, 2023-08-21)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-leaf-area-index-fpar-products-released
      - name: VIIRS V1 SR·VI·LAI/FPAR·LST·산불 제품 배포 종료 (Earthdata 공지, 2025-04-08)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned

notices:
  - date: "2026-08-07"
    level: warning
    title: Suomi NPP 자료 전달 2026년 11월 종료 — VNP15A2H 대신 VJ215A2H·VJ115A2H로 전환
    body: >-
      NOAA는 2026년 8월 3일 Suomi NPP의 VIIRS 등 모든 과학 자료 전달을 2026년 11월 2일 13:00 UTC에 영구히 끝낸다고 알렸고, NASA Earthdata는 8월 7일 공지에서
      종료일을 11월 1일 13:00 UTC(변경 가능)로 안내했습니다. LP DAAC의 VNP15A2H 설명은 VJ215A2H(주)·VJ115A2H(보조)로 옮기라고 권합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
  - date: "2026-02-20"
    level: info
    title: NOAA-21 VIIRS LAI/FPAR V2(VJ215A2H) 공개
    body: >-
      LP DAAC가 NOAA-21(옛 JPSS-2) VIIRS로 만든 Version 2 LAI/FPAR 제품을 추가로 공개했습니다. CMR 기준 자료 시작일은 2023-02-10입니다.
    source: https://earthdata.nasa.gov/data/alerts-outages/additional-viirs-version-2-leaf-area-index-fraction-photosynthetically-active
  - date: "2025-04-08"
    level: info
    title: VIIRS Version 1 LAI/FPAR 배포 종료
    body: >-
      LP DAAC가 VIIRS V1 지표 반사도·LAI/FPAR·지표면온도·산불 제품의 배포를 2025년 4월 8일 끝냈습니다. V1 생산은 2024년 6월 17일 이미 멈췄으며,
      사용자 안내서·ATBD는 DOI 페이지에 남습니다. Suomi NPP·NOAA-20 V2로 옮기라고 안내했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned
  - date: "2023-08-21"
    level: info
    title: VIIRS Version 2 LAI/FPAR(VNP15A2H·VJ115A2H) 공개
    body: >-
      Suomi NPP와 NOAA-20(옛 JPSS-1)의 Version 2 LAI/FPAR 8일 500 m 제품이 공개되었습니다. 공개 당시 Suomi NPP V1도 한동안 함께 생산되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-leaf-area-index-fpar-products-released

