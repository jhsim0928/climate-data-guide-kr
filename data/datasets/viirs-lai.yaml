example:
  lang: python
  note: >-
    earthaccess로 2024년 7월 NOAA-20 VJ115A2H를 받아 한반도 중부 타일(h28v05)의 LAI를 읽는 예입니다. HDF-EOS5 파일 안 경로를 외우지 않도록
    h5py로 이름이 `Lai`·`FparLai_QC`인 변수를 찾아 읽습니다. 품질 비트는 MODIS와 달리 0~2번이 SCF_QC입니다.
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="VJ115A2H", version="002",
        temporal=("2024-07-01", "2024-07-31"),
        bounding_box=(126.5, 35.5, 128.5, 37.5),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "./vj115a2h")

    def find(h5, name):
        hits = []
        h5.visititems(lambda k, v: hits.append(k) if isinstance(v, h5py.Dataset) and k.endswith("/" + name) else None)
        return h5[hits[0]][()]

    for f in sorted(map(str, files)):
        if ".h28v05." not in f:
            continue
        with h5py.File(f, "r") as h5:
            raw = find(h5, "Lai").astype("float32")
            qc = find(h5, "FparLai_QC")
        lai = np.where(raw <= 100, raw * 0.1, np.nan)   # 249~255 = 비식생·결측
        scf = qc & 0b111                                 # 0·1 = 주(RT) 알고리즘 (MODIS와 비트 위치 다름)
        lai[scf > 1] = np.nan
        print(f.split("/")[-1], "평균 LAI:", np.nanmean(lai))

tips:
  - "`FparLai_QC`의 비트 배치가 MODIS와 다릅니다. VIIRS는 0~2번이 SCF_QC(0 주 알고리즘, 1 주 알고리즘·포화, 2·3 NDVI 백업, 4 생산 안 됨), 3번이 고장 검출기, 4~7번이 생물군계입니다. MODIS용 `(qc >> 5) & 7` 코드를 그대로 쓰면 품질 선별이 엉망이 됩니다."
  - "저장값 249~255(255 결측, 254 내륙 물, 253 나지·희소 식생, 252 만년설·빙하, 251 습지, 250 도시, 249 미분류)는 반드시 지우고 척도 인수(LAI × 0.1, FPAR × 0.01)를 곱하세요."
  - "VNP15A2H(Suomi NPP)는 2026년 11월에 끝납니다. 2018년 이후는 VJ115A2H, 2023년 이후는 VJ215A2H로 이어 쓸 수 있으니 장기 분석의 기준 위성을 미리 정하고, 위성이 바뀌는 지점을 밝히세요."
  - 보스턴대 비교 연구(VIIRS V1 기준)에서 VIIRS는 열대림처럼 반사도가 포화되는 곳에서 MODIS와 차이가 컸고, 입력 반사도 문제로 주 알고리즘 성공률의 연변동이 컸습니다. 울창한 숲의 연변동 해석은 품질 플래그와 함께 보세요.
  - 생물군계 유형(4~7번 비트)이 들어 있어, 토지피복 자료 없이도 숲·초지·농경지 등으로 나눠 통계를 낼 수 있습니다. 다만 이 분류는 알고리즘 입력용 8개 생물군계라 일반 토지피복과 다릅니다.
  - 파일이 HDF5(HDF-EOS5)라 MODIS용 pyhdf 코드로는 열리지 않습니다. h5py·xarray(h5netcdf)나 GDAL을 쓰세요.

