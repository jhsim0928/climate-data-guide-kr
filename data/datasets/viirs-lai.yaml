# ─────────────────────────────────────────────────────────────
# VIIRS LAI/FPAR V2 (VNP15A2H·VJ115A2H·VJ215A2H) — 데이터셋 정보 파일
# 지면 탭 '식생'. MODIS LAI/FPAR(modis-lai.yaml)의 후속 자료입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: viirs-lai
name: "VIIRS LAI/FPAR (VNP15)"
full_name: VIIRS Leaf Area Index / FPAR (VNP15A2H·VJ115A2H·VJ215A2H) Version 2 (VIIRS 엽면적지수·광합성유효복사 흡수율, 500 m·8일)
category: satellite
domain: land
group: 식생
order: 11
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA VIIRS 육상팀(보스턴대 Myneni 연구실) / LP DAAC

status: active
status_note: >-
  Version 2(002)가 Suomi NPP(VNP15A2H)·NOAA-20(VJ115A2H)·NOAA-21(VJ215A2H) 세 위성별로 8일마다 나오고 있습니다(2026-10-13 확인 시 2026-09-14 시작 합성까지).
  다만 NOAA는 Suomi NPP 자료 전달을 2026년 11월 2일(NASA 공지는 11월 1일) 13:00 UTC에 끝낸다고 밝혔고, LP DAAC는 VNP15A2H 대신
  VJ215A2H(주)·VJ115A2H(보조)로 옮기라고 안내하고 있습니다. Version 1은 2025년 4월 배포가 끝났습니다.

period:
  start: "2012-01"
  end: present
  note: >-
    VNP15A2H(Suomi NPP)는 2012년 1월부터(한반도 타일 첫 파일은 2012-01-17 시작 합성), VJ115A2H(NOAA-20)는 2018-01-01부터, VJ215A2H(NOAA-21)는 2023-02-10부터입니다.
    2026-10-13에 CMR로 한반도 타일(h28v05)을 확인했을 때 세 제품 모두 2026-09-14~21 합성이 최신이었습니다. VNP15A2H는 2026년 11월 Suomi NPP 자료 전달 종료와 함께 멈출 예정입니다.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "8일"
  spatial: "MODIS와 같은 Sinusoidal 타일 격자(가로 0~35, 세로 0~17 타일), 500 m"
  vertical: 식생 캐노피(지표) 단일층
  temporal: 8일 합성 (파일 날짜는 합성 기간 첫날의 연중일, 예 A2026257. 해마다 1월 1일에 다시 시작)

coverage:
  short: 전지구
update: 합성 기간이 끝나고 대략 1~3주 뒤 8일 단위로 추가 (VNP15A2H는 2026년 11월 종료 예정)
license: NASA 지구과학 공개 자료 — 제한 없이 무료 이용(EOSDIS 자료 이용·인용 지침), 파일 다운로드에는 무료 NASA Earthdata 로그인 필요, 데이터셋 DOI 인용 요청
account_required: true

summary: >-
  NASA가 MODIS LAI/FPAR 기록을 잇기 위해 같은 알고리즘을 VIIRS 센서에 옮겨 만든 전지구 엽면적지수(LAI)·광합성유효복사 흡수율(FPAR) 자료입니다.
  VIIRS 적색(I1)·근적외(I2) 반사도를 센서에 맞춘 3차원 복사전달 조견표로 역산하고, 실패하면 NDVI 경험식을 씁니다.
  MODIS와 같은 500 m Sinusoidal 타일·8일 합성이라 바로 비교할 수 있으며, Suomi NPP·NOAA-20·NOAA-21 위성별로 따로 제공됩니다.

time_convention:
  summary: >-
    매일 계산한 LAI·FPAR 가운데 8일 동안 FPAR가 가장 큰 날을 골라 그날의 FPAR·LAI·품질 정보를 기록합니다(VNP15 ATBD 3.3.2절).
    FPAR는 8일 최대값이고, LAI는 기간 평균이 아닌 선택된 하루의 값입니다. 파일 날짜는 합성 기간 시작일입니다.
  points:
    - "세 위성 모두 오후 13:30(현지 평균시) 상승 통과 궤도라 MODIS Aqua의 원래 관측 시각과 가깝고, MODIS Terra의 오전 관측을 잇는 VIIRS 제품은 없습니다."
    - "위성별로 따로 만든 제품이라 VNP15A2H·VJ115A2H·VJ215A2H는 같은 날짜라도 값이 조금씩 다릅니다. 시계열을 이을 때는 한 위성 제품을 기준으로 정하세요."
    - "파일 이름의 A2026257은 2026년 257일(9월 14일)에 시작한 8일 합성입니다. 선택된 관측일 자체는 파일에 기록되지 않습니다."
    - "합성은 해마다 1월 1일에 다시 시작하므로 그해 마지막 합성은 다음 해 첫 합성과 기간이 겹칩니다."
  source: https://lpdaac.usgs.gov/documents/125/VNP15_ATBD.pdf
  source_name: "VNP15 ATBD V1.1(2018) + VNP15 사용자 안내서 V1.2(2018) + LP DAAC/CMR 컬렉션 설명"

variables:
  note: >-
    LP DAAC 컬렉션 정보와 VNP15 사용자 안내서 기준입니다. 세 위성 제품 모두 같은 이름을 쓰며, MODIS와 달리 이름 끝에 `_500m`이 없습니다.
    값은 부호 없는 8비트 정수로 저장되어 척도 인수를 곱해야 하고, 249~255는 비식생·결측 코드입니다.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp15a2h-002
  groups:
    - name: LAI·FPAR (500 m, 8일 합성)
      kind: instant
      period: 합성 기간 중 선택일
      items:
        - text: "광합성유효복사 흡수율(FPAR) — `Fpar` (비율 0~1, 저장값 × 0.01)"
          kind: max
          period: 8일
          note: 8일 중 FPAR가 가장 큰 날의 값
        - text: "엽면적지수(LAI) — `Lai` (m² m-2, 저장값 × 0.1)"
          note: 합성 기간 중 선택된 관측일(FPAR 최대인 날)의 값
        - "FPAR 표준편차 — `FparStdDev` (비율, 저장값 × 0.01, 248=백업 알고리즘이라 없음)"
        - "LAI 표준편차 — `LaiStdDev` (m² m-2, 저장값 × 0.1, 248=백업 알고리즘이라 없음)"
        - text: "LAI·FPAR 품질 플래그 — `FparLai_QC` (비트 필드)"
          note: "0~2번 SCF_QC(알고리즘 경로), 3번 고장 검출기, 4~7번 생물군계 유형 — MODIS와 비트 배치가 다름"
        - "보조 품질 플래그 — `FparExtra_QC` (비트 필드)"

