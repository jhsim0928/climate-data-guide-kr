    - label: 바렌츠해 운영 활용·검증 (AWI 권장 인용)
      text: >-
        Kaleschke, L., Tian-Kunze, X., Maaß, N., Beitsch, A., Wernecke, A., Miernecki, M., Müller, G., Fock, B. H., Gierisch, A. M. U., Schlünzen, K. H., et al. (2016):
        SMOS sea ice product: Operational application and validation in the Barents Sea marginal ice zone. Remote Sensing of Environment, 180, 264–273.
      doi: 10.1016/j.rse.2016.03.009
    - label: 남극 얇은 해빙 두께 (남반구 자료 사용 시, AWI 권장 인용)
      text: >-
        Kaleschke, L., Tian-Kunze, X., Hendricks, S., and Ricker, R. (2024): SMOS-derived Antarctic thin sea ice thickness: data description and validation in the Weddell Sea.
        Earth System Science Data, 16, 3149–3170.
      doi: 10.5194/essd-16-3149-2024
    - label: 브레멘대학 SMOS 판 방법
      text: >-
        Huntemann, M., Heygster, G., Kaleschke, L., Krumpen, T., Mäkynen, M., and Drusch, M. (2014): Empirical sea ice thickness retrieval during the freeze-up period
        from SMOS high incident angle observations. The Cryosphere, 8, 439–451.
      doi: 10.5194/tc-8-439-2014
    - label: 브레멘대학 SMOS/SMAP 병합판 방법
      text: >-
        Paţilea, C., Heygster, G., Huntemann, M., and Spreen, G. (2019): Combined SMAP–SMOS thin sea ice thickness retrieval. The Cryosphere, 13, 675–691.
      doi: 10.5194/tc-13-675-2019
  acknowledgement: >-
    AWI는 위 세 논문(Tian-Kunze et al. 2014, Kaleschke et al. 2016, 남극 자료는 Kaleschke et al. 2024)을 인용하고, "SMOS 해빙 두께 생산은 ESA 과제
    SMOS & CryoSat-2 Sea Ice Data Product Processing and Dissemination Service의 지원을 받았으며, DATE~DATE 자료를 AWI에서 받았다"는 취지의 감사 문구를 넣도록 요청합니다.
    정확한 영문 문구는 읽어보기 문서(ReadMe-first Technical Note)에서 복사하세요. 브레멘대학 판을 썼다면 Huntemann et al. (2014) 또는 Paţilea et al. (2019)을 인용합니다.

notices:
  - date: "2026-04-17"
    level: info
    title: 북극 2025/26 시즌 종료, L3 산출을 남반구로 전환
    body: >-
      AWI가 2026-04-15 북극 L3 SMOS 두께 처리·배포를 마치고, 같은 날부터 남반구 겨울 L3 자료를 제공한다고 알렸습니다. 결빙기만 만드는 자료의 정상적인 계절 전환이며,
      2026/27 북극 시즌은 10-15 시작이 관례입니다(2026-10-13 현재 시작 공지 없음).
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2026/04/17/624499172/The+L3+product+has+been+switched+from+the+Arctic+to+the+Antarctic.
  - date: "2025-10-17"
    level: warning
    title: "2025/26 겨울부터 제품 버전 v3.3 → v3.6"
    body: >-
      2025-10-15 L3 SMOS 해빙 두께 처리·배포가 재개되면서 버전이 v3.3에서 v3.6으로 바뀌었습니다. 스와스 기반 처리, RFI 필터 개선, 보조 기상 자료를 ERA5 기후값으로 바꾼 것이 핵심이며
      2010~2024년도 v3.6으로 재처리되었습니다. 파일 이름과 값이 달라지므로 다운로드 스크립트와 기존 분석을 점검하세요.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/17/595263548/L3+SMOS+sea+ice+thickness+processing+started+for+2025+26+winter+season.
  - date: "2025-06-06"
    level: info
    title: "v3.3 생산 일시 중단(2025-06-02~) — v3.6은 영향 없음"
    body: >-
      보조 자료(JRA-3Q)를 내려받는 NSF NCAR 계산 시스템 점검으로 v3.3 생산이 6월 2일부터 멈췄습니다. ERA5 기후값을 쓰는 v3.6은 정상 생산되었고,
      v3.3은 6월 6일 정상화되어 6월 3~5일 결측분을 다시 처리했습니다(2025-06-10 공지).
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/06/06/565587944/Update+on+SMOS+L3+Sea+Ice+Thickness+Data+Production+v3.3
  - date: "2025-02-06"
    level: warning
    title: "v3.3 생산 중단(2025-02-03~03-03) — 2월 4~16일 자료 결측"
    body: >-
      일본 기상청 JRA-3Q 자료 서버 중단으로 v3.3 L3와 이를 입력으로 쓰는 CS2SMOS v206 생산이 멈췄다가 2025-03-03 재개되었습니다. L3 v3.3은 2025-02-04~16 자료가 빠져 있습니다.
      ERA5 기후값을 쓰는 새 판은 영향을 받지 않았습니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/02/06/543621383/SMOS+L3+v3.3+data+production+stopped+2025-02-03
  - date: "2022-10-08"
    level: info
    title: "브레멘대학 SMOS/SMAP 얇은 해빙 두께 v300 공개"
    body: >-
      브레멘대학이 SMOS/SMAP 병합 얇은 해빙 두께 v300을 공개했습니다. 투영 정보 갱신, 격자 위치 어긋남 수정(NSIDC 북극 극 평사도 좌표에 맞춤), 2021년 9월 이후 SMAP 자료 누락 수정,
      새 SMAP L1B 입력이 바뀐 점입니다. 2022-08-06~10-05에는 SMAP 자료가 없어 준실시간판이 SMOS만으로 만들어졌습니다.
    source: https://seaice.uni-bremen.de/news-archive/

transitions:
  - from: SMOS L3 SIT v3.3
    to: SMOS L3 SIT v3.6
    status: completed
    date: "2025-10"
    summary: >-
      AWI가 SMOS L3 해빙 두께를 스와스 단위로 먼저 계산하도록 바꾸고 RFI 필터와 보조 기상 자료를 개선한 판입니다. 2010~2024년 전체를 재처리했고,
      2025-10-15 북극 시즌부터 운영판이 되었으며 남반구는 2026년 4월부터 v3.6으로 운영됩니다.
    changes:
      - aspect: 처리 단위
        before: "일평균 밝기온도로 바로 두께 계산"
        after: "스와스(L2, 내부용)에서 두께를 계산한 뒤 일평균. 밝기온도 평균 때 복사 분해능 가중(평균 약 0.3 K 차이)"
      - aspect: RFI 필터
        before: "v3.3 기준 필터"
        after: "화소 단위 경계 플래그 추가, 300 K 문턱값은 입사각 0~40°·복사 정확도 5 K 미만일 때만 적용(평균 약 0.5 K 차이) — 북극 자료 범위 확대"
      - aspect: 보조 기상 자료
        before: "준실시간 JRA-55/JRA-3Q 재분석"
        after: "ERA5 2010~2023년 기후값(2 m 기온, 10 m 풍속) — 두께 평균 약 5 cm 차이"
      - aspect: 격자·배포
        before: "12.5 km 극 평사도(EPSG:3413), NetCDF4"
        after: "12.5 km 극 평사도(북 EPSG:3413, 남 EPSG:3976)와 EASE2를 만들지만 극 평사도판만 배포"
      - aspect: 기간
        before: "북극 2010-10~ (남반구 v3.3은 2024-04 운영 시작)"
        after: "북극 2010-10-15~ 전 기간 재처리, 남반구 2010~ (v3.6 운영 2026-04~)"
      - aspect: 파일 이름
        before: "SMOS_Icethickness_v3.3_north_<날짜>.nc"
        after: "SMOS_Icethickness_v3.6_north_<날짜>.nc / …_south_… (EASE2판은 끝에 _ease2)"
      - aspect: 문서·인용
        before: "PDD·읽어보기 문서 Issue 3.1 (2023-10-15)"
        after: "PDD v5.0 (2025-04-24), 읽어보기 문서 Issue 4.0 (2025-10-15). ESA 카탈로그 DOI 10.57780/sm1-5ebe10b는 그대로(인용 문구는 Version 3.3 표기)"
    impacts:
      - v3.3과 v3.6을 한 시계열로 섞지 마세요. 전 기간이 v3.6으로 재처리되었으므로 2010년부터 다시 받는 것이 안전합니다.
      - ERA5 기후값을 쓰면서 해마다 다른 기온·바람 영향이 빠졌습니다. 이상 기온이 있었던 겨울의 두께 변화를 해석할 때 이 한계를 고려하세요.
      - CS2SMOS v206(SMOS v3.3 입력)과 CS3SMOS v300(SMOS v3.6 입력)의 차이에는 이 SMOS 판 교체도 들어 있습니다.
    sources:
      - name: AWI — SMOS Sea Ice Thickness 제품 페이지 (버전 이력, v3.6 개선점)
        url: https://spaces.awi.de/spaces/CS2SMOS/pages/297634432/SMOS+Sea+Ice+Thickness
      - name: AWI SMOS ReadMe-first Technical Note v4.0 (2025-10-15)
        url: https://spaces.awi.de/download/attachments/297634432/%5BDT4-1%5D-AWI_ESA_SMOS_RM_TN_v4.0_20251015.pdf?version=1&modificationDate=1760948153123&api=v2
      - name: AWI SMOS PDD v5.0 (2025-04-24)
        url: https://spaces.awi.de/download/attachments/297634432/AWI_ESA_SMOS_PDD_v5.pdf?version=1&modificationDate=1760692666142&api=v2
      - name: AWI 공지 — 2025/26 시즌 시작, v3.6 전환 (2025-10-17)
        url: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/17/595263548/L3+SMOS+sea+ice+thickness+processing+started+for+2025+26+winter+season.

