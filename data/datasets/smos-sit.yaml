# ─────────────────────────────────────────────────────────────
# SMOS 얇은 해빙 두께 (AWI/ESA SMOS L3 Sea Ice Thickness v3.6 + 브레멘대학 SMOS·SMOS/SMAP) — 데이터셋 정보 파일
# 위성 탭(해빙), 해빙 탭(위성 관측 자료) 교차 수록. L-band 복사계로 재는 약 1 m 이하 얇은 얼음의 일별 두께. 결빙기에만 생산.
# 2026-10-13 확인 시 AWI 판은 v3.6(2025-10-15부터), ESA 배포 서버 색인은 2026년 10월분까지 갱신(남반구 시즌 마무리, 북반구 10-15 시작 예정).
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: smos-sit
name: SMOS 얇은 해빙 두께
full_name: SMOS L3 Sea Ice Thickness (AWI/ESA, v3.6) 및 브레멘대학 SMOS·SMOS/SMAP Thin Sea Ice Thickness (L-band 복사계 기반 얇은 해빙 두께)
category: satellite
domain: satellite
group: 해빙
order: 45
also_in:
  - domain: seaice
    group: 위성 관측 자료
domains: [해빙, 원격탐사]
provider: 독일 알프레드 베게너 연구소(AWI) — ESA CS2SMOS-PDS 과제, ESA 배포 / 독일 브레멘대학 환경물리연구소(IUP, SMOS·SMOS/SMAP 판) — 원자료 ESA SMOS, NASA SMAP

status: active
status_note: >-
  AWI 판은 2025-10-15 2025/26 겨울부터 v3.3에서 v3.6으로 바뀌었고, 2026-04-15 북극 산출을 마친 뒤 남반구 겨울(4/15~10/15) 산출을 이어 왔습니다.
  2026-10-13 확인 시 ESA 배포 서버 L3_SIT_Open 색인은 2026년 10월분까지(2026-10-12 생성) 올라와 있고, 2026/27 북극 시즌 시작(10-15 예정) 공지는 아직 AWI 위키에 없습니다.
  브레멘대학 SMOS·SMOS/SMAP 판(v300)은 '최선 노력(best effort)'으로 계속 생산된다고 안내하지만, 자료 폴더 목록이 자동 읽기를 막고 있어 최신 파일 날짜는 확인하지 못했습니다.

period:
  start: "2010-10"
  end: present
  note: >-
    AWI v3.6 북극 기록은 2010-10-15부터이며 2010~2024년을 v3.6으로 모두 재처리했습니다. 남반구도 2010년부터 있고(v3.3은 2024년 4월부터 운영, v3.6은 2026년 4월부터 운영),
    2010-01~05 시험 운용기 자료는 요청 시에만 제공합니다. 북반구는 10/15~4/15, 남반구는 4/15~10/15만 있고 그 밖의 달은 비어 있습니다.
    브레멘대학 판은 북극 10월~4월, 남극 3월~9월에 산출합니다.

resolution:
  spatial_short: "12.5 km (0.11°)"
  temporal_short: "1일"
  spatial: >-
    AWI v3.6 — 12.5 km NSIDC 극 평사도법 격자(북반구 EPSG:3413, 남반구 EPSG:3976, x 608 × y 896). 12.5 km EASE2 격자(EPSG:6931/6932, 864×864) 판도 만들지만 배포하는 것은 극 평사도판뿐입니다.
    SMOS 자체의 공간 해상도는 약 40 km(브레멘대학 안내, 사용 입사각 범위 기준)로 격자 간격보다 훨씬 거칩니다
  vertical: 해당 없음 (두께 단일 값)
  temporal: 일평균(하루 한 장, time_coverage 00:00:00~23:59:59, P1D). 결빙기에만 생산

coverage:
  short: 양극
  note: "결빙기에만 — 북반구 10/15~4/15, 남반구 4/15~10/15(AWI). 두꺼운 얼음은 신호가 포화되어 과소 추정"
update: >-
  결빙기 동안 매일(AWI). 브레멘대학 SMOS 판은 하루 두 번(약 7시간 뒤, 다시 23시간 뒤), SMOS/SMAP 판은 약 8시간 뒤 처리하고 24시간 뒤·1주 뒤 다시 처리
license: >-
  ESA 배포본은 ESA 지구관측 자료 이용약관(무료, ESA EO Sign In 계정 필요). AWI 배포본은 별도 라이선스 표기 없이 논문 인용과 감사 문구를 요청.
  브레멘대학 판은 라이선스 표기 없이 '보증 없는 연구용 산출물'로 공개
account_required: false

summary: >-
  ESA SMOS 위성의 L-band(1.4 GHz) 밝기온도가 얇은 해빙 두께에 민감하다는 점을 이용해, 얇은 얼음의 두께를 매일 추정한 자료입니다(AWI 설명서 기준 약 1.5 m까지 두께 정보를 얻을 수 있음).
  레이더 고도계(CryoSat-2)는 프리보드가 작은 얇은 얼음에서 상대오차가 커서, SMOS는 결빙 초기·가장자리·폴리냐의 얇은 얼음을 보완하는 역할을 합니다.
  AWI가 ESA 과제로 만드는 L3 판(v3.6)이 대표이며, 병합 두께 CS2SMOS·CS3SMOS의 SMOS 입력으로도 쓰입니다.
  브레멘대학은 다른 경험적 방법으로 SMOS 단독 판과 NASA SMAP을 합친 SMOS/SMAP 판(v300)을 따로 만듭니다.

time_convention:
  summary: >-
    AWI 파일 하나는 하루치 일평균장입니다. v3.6은 궤도(스와스) 단위로 먼저 두께를 계산한 뒤 그날의 스와스 두께를 평균해 일평균 두께를 만들며,
    전역 속성 time_coverage_start·end가 그날 00:00:00~23:59:59로 적혀 있습니다. 순간값이 아니라 하루 동안 지나간 여러 궤도의 평균입니다.
  points:
    - "`time` 변수는 'hours since 2010-01-01 00:00:00' 단위의 날짜 하나입니다. 제품 설명서(PDD v5.0)에는 하루 경계의 시간대(UTC 여부)가 명시되어 있지 않습니다."
    - "v3.6은 v3.3에서 쓰던 준실시간 JRA-55/JRA-3Q 대신 ERA5 2010~2023년 기후값(2 m 기온, 10 m 풍속)을 보조 자료로 씁니다. 그날의 실제 날씨가 아니라 같은 날짜의 기후값이 들어갑니다."
    - "`TB_uncertainty`는 그날 밝기온도 표준편차를 자료 쌍 수(`nPair`)의 제곱근으로 나눈 값이라 하루 평균의 불확실성입니다."
    - "브레멘대학 판도 전날 하루치를 처리하는 일 자료이며, 같은 날짜 파일이 나중에 다시 처리되어 바뀔 수 있습니다(SMOS/SMAP 판은 24시간 뒤·1주 뒤 재처리)."
  source: https://spaces.awi.de/download/attachments/297634432/AWI_ESA_SMOS_PDD_v5.pdf?version=1&modificationDate=1760692666142&api=v2
  source_name: AWI SMOS Sea Ice Thickness PDD v5.0 (2025-04-24) / ReadMe-first Technical Note v4.0 (2025-10-15) / 브레멘대학 Thin Ice Thickness 페이지

variables:
  note: >-
    AWI v3.6 제품 설명서(PDD v5.0, 표 6) 기준 변수입니다. 브레멘대학 SMOS·SMOS/SMAP 파일의 변수 이름은 공식 페이지에 없어 적지 않았습니다.
  full_list: https://spaces.awi.de/download/attachments/297634432/AWI_ESA_SMOS_PDD_v5.pdf?version=1&modificationDate=1760692666142&api=v2
  groups:
    - name: 두께 (AWI v3.6 일 파일)
      kind: mean
      period: 일
      items:
        - text: "SMOS 해빙 두께 — `sea_ice_thickness` (m)"
          note: 그날 스와스 두께의 일평균. 해빙 농도 100%를 가정한 값이라 농도가 낮은 곳은 과소 추정
        - text: "해빙 두께 총불확실성 — `ice_thickness_uncertainty` (m)"
          note: 1 m를 넘으면 주의. 해빙 농도 100% 미만에 따른 과소 추정은 불확실성에 들어 있지 않음
        - text: "두께 포화 비율(최대 산출 가능 두께 대비) — `saturation_ratio` (%)"
