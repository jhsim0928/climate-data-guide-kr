example:
  lang: python
  note: >-
    AWI v3.6 북반구 일 파일(SMOS_Icethickness_v3.6_north_<날짜>.nc)을 열어, 읽어보기 문서가 권하는 기준(불확실성 1 m 초과, 포화 비율 95% 초과)으로 거른 뒤 오호츠크해 두께를 보는 예입니다.
  code: |
    import glob
    import xarray as xr

    f = sorted(glob.glob("SMOS_Icethickness_v3.6_north_*.nc"))[-1]
    ds = xr.open_dataset(f).squeeze()

    sit = ds["sea_ice_thickness"]                       # m, 일평균
    ok = (ds["ice_thickness_uncertainty"] <= 1.0) & (ds["saturation_ratio"] <= 95) & (ds["land"] == 0)
    sit = sit.where(ok)

    # 오호츠크해 (대략 44–60°N, 135–160°E) — 위경도는 2차원 변수
    box = (ds["latitude"] > 44) & (ds["latitude"] < 60) & (ds["longitude"] > 135) & (ds["longitude"] < 160)
    print(str(ds["time"].values), "평균 얇은 얼음 두께(m):", float(sit.where(box).mean()))
    print("RFI 비율 50% 넘는 격자 수:", int((ds["RFI_ratio"].where(box) > 50).sum()))

tips:
  - >-
    같은 탭의 CS2SMOS(../cs2smos/)·CS3SMOS(../cs3smos/)는 이 SMOS L3 두께를 CryoSat-2(·Sentinel-3) 고도계 두께와 최적 내삽으로 합친 주간(7일) L4 자료입니다.
    두께 전 범위를 한 장으로 보려면 병합 자료를, 결빙 초기의 하루 단위 변화나 얇은 얼음 자체를 보려면 이 일별 L3를 쓰세요. CS2SMOS v206은 SMOS v3.3, CS3SMOS v300은 v3.6을 입력으로 씁니다.
  - >-
    CryoSat-2 단독 두께(../cryosat2-sit/)는 대략 1 m 미만 얇은 얼음에서 상대오차가 크고, SMOS는 반대로 두꺼운 얼음에서 신호가 포화됩니다. AWI 제품 설명서는 약 1.5 m까지
    두께 정보를 얻을 수 있다고 하지만, 최대 산출 가능 두께는 얼음 염도·온도에 따라 달라지므로 `saturation_ratio`가 95%를 넘는 값은 '그 이상 두꺼움'으로 해석하세요.
  - >-
    해빙 농도 100%를 가정하므로 바다가 섞인 격자(가장자리, 리드)는 두께가 낮게 나오고, 이 효과는 불확실성에도 들어 있지 않습니다. 오호츠크해처럼 농도가 낮은 계절 해빙역에서는
    해빙 농도 자료(예 ../amsr2-asi/, ../osisaf-sic/)를 함께 보며 해석하세요.
  - >-
    북극에서는 전파 간섭(RFI)이 여전히 문제이며 특히 2023년 이후 러시아 연안(바렌츠·카라·랍테프해)에서 심합니다. `RFI_ratio`와 `nPair`로 관측이 적은 격자를 확인하세요. 남극에서는 RFI가 거의 없습니다.
  - >-
    v3.6은 그날 기상장 대신 ERA5 기후값을 쓰므로 보조 자료 서버 장애에는 강해졌지만 해마다 다른 기온·바람의 영향은 반영하지 못합니다. 이 차이는 평균 약 5 cm입니다.
    v3.3으로 만든 결과와 섞지 말고, ESA 카탈로그 인용 문구가 아직 'Version 3.3'으로 되어 있어도 논문에는 실제로 쓴 판(파일 이름의 v3.6)을 적으세요.
  - >-
    남극 두께는 눈 처리에 북극식 매개변수를 쓰고 남반구 염도가 충분히 평가되지 않아 불확실성이 큽니다. 웨델해 빙산 A-23A(약 75.3°S, 37.3°W)가 비정상적으로 얇은 얼음으로 나타나는 문제도 아직 고쳐지지 않았습니다.
  - >-
    브레멘대학 판은 AWI 판과 알고리즘이 다릅니다(Huntemann et al. 2014의 경험적 방법, SMAP을 섞은 Paţilea et al. 2019). 브레멘대학은 SMOS 단독보다 RFI를 거른 판이나
    SMOS/SMAP 병합판을 쓰라고 권하며, 해상도가 약 40 km라 그보다 넓은 얇은 얼음 구역만 제대로 잡힌다고 안내합니다. 두 기관 값을 한 시계열로 섞지 마세요.

