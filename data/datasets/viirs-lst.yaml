  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2545314555-LPCLOUD
    method: HTTPS 다운로드 / earthaccess / Earthdata Search
    note: >-
      short name 예: VNP21A1D·VNP21A1N·VNP21A2·VNP21C1·VNP21C2·VNP21C3·VNP21(L2), NOAA-20은 VNP→VJ1, NOAA-21은 VNP→VJ2이며 version은 모두 002입니다.
      파일은 data.lpdaac.earthdatacloud.nasa.gov 아래 HTTPS로 받으며 무료 Earthdata 로그인이 필요합니다.
  - name: AppEEARS (영역·지점 부분 추출)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: 웹 / API — 지점 시계열·영역을 GeoTIFF·NetCDF4로 추출
    note: 필요한 영역·기간·변수만 골라 받을 수 있고 위경도 투영으로 바꿔 받을 수 있습니다.
  - name: AWS us-west-2 직접 접근 (S3)
    url: https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials
