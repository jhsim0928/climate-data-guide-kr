transitions:
  - from: VIIRS LST V1 (VNP21 Collection 1)
    to: VIIRS LST V2
    status: completed
    date: "2023-06"
    summary: >-
      Suomi NPP 전 기간의 보정 계수·지오로케이션이 개선되고 NOAA-20(VJ121)·NOAA-21(VJ221) 제품과 0.05° CMG 제품이 추가되었습니다. 대기 입력은 MERRA-2에서 GEOS-5로 바뀌고
      내륙 수면도 산출 대상에 들어갔습니다. V1은 2025년 4월 8일 배포가 끝났습니다.
    changes:
      - aspect: 보정·지오로케이션
        before: V1 보정
        after: "Suomi NPP 전 기간 보정 알고리즘·계수 개선, 지오로케이션 정확도 향상과 기동(maneuver) 기간 이상값 수정"
      - aspect: 입력
        before: "MERRA-2 대기 입력, 기존 구름 마스크·해륙 마스크"
        after: "GEOS-5 대기 입력, 개선된 구름 마스크(해안선 수정 포함), VNP03의 8분류 해륙 마스크, 밝은 지표의 에어로솔 양 플래그 수정"
      - aspect: 산출 범위
        before: 육지
        after: 내륙 수면 포함
      - aspect: 제품 구성
        before: "Suomi NPP L2·L3 타일"
        after: "Suomi NPP·NOAA-20(VJ1)·NOAA-21(VJ2) + 일·8일·월 0.05° CMG"
    impacts:
      - V1과 V2를 섞지 말고 전 기간을 V2로 다시 받으세요(V1은 2025-04-08 이후 배포되지 않습니다).
    sources:
      - name: VNP21A1D V002 컬렉션 설명(버전 설명)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp21a1d-002
      - name: VIIRS Version 1 SR, VI, LAI/FPAR, LST, Active Fires Data Products Decommissioned (2025-04-08)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned

notices:
  - date: "2026-10-30"
    level: warning
    title: Suomi NPP 자료 전달 종료 시각 변경 — 2026년 11월 2일 15:40 UTC (한국 시간 11월 3일 00:40)
    body: >-
      NOAA NESDIS가 10월 30일 세 번째 갱신 공지에서 Suomi NPP 자료 전달 종료 시각을 2026년 11월 2일 13:00 UTC에서 15:40 UTC로 바꿨습니다(VIIRS·ATMS·CERES·OMPS·HRD 직접 수신 모두, 영구 종료).
      위성은 2026년 12월 1일부터 약 12일까지 고도를 낮춰 남태평양 상공에서 대기권에 재진입시킬 예정입니다. 이어 쓸 자료는 NOAA-21(1순위)·NOAA-20(2순위) 판입니다.
    source: https://www.nesdis.noaa.gov/news/update-3-cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-november-02-2026-1540-utc-and-decommissioning-issued-october-30-2026-1400-utc
  - date: "2026-08-03"
    level: critical
    title: Suomi NPP 과학 자료 전달 2026년 11월 2일 종료 — VNP21 대신 VJ221·VJ121로 전환
    body: >-
      NOAA NESDIS는 VIIRS를 포함한 Suomi NPP의 남은 모든 과학 자료 전달을 2026년 11월 2일 13:00 UTC에 영구 중단한다고 공지했습니다(NASA Earthdata 공지 제목은 11월 1일, 일정은 바뀔 수 있음).
      LP DAAC의 VNP21 컬렉션 설명도 같은 날 전달이 끝난다며 NOAA-21(VJ221, 1순위)이나 NOAA-20(VJ121, 2순위) 제품으로 옮기라고 안내합니다.
    source: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
  - date: "2026-04-14"
    level: info
    title: NOAA-21 VIIRS 지표면온도(VJ221) V2 공개
    body: >-
      LP DAAC가 VIIRS V2 지표면온도·방출률 제품을 NOAA-21(옛 JPSS-2) 자료로 넓혀 공개했습니다. VJ221 계열은 2023년 2월 10일부터의 자료를 담고 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/additional-viirs-version-2-land-surface-temperature-emissivity-data-products
  - date: "2025-05-02"
    level: info
    title: MODIS에서 VIIRS로 전환 안내 — VIIRS 유사 산출물 사용 권고
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어간다며 MODIS 사용자에게 VIIRS 유사 산출물을 검토하라고 권고했습니다. MODIS MOD21 지표면온도를 잇는 제품이 이 VIIRS LST입니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2025-04-08"
    level: info
    title: VIIRS V1 지표면온도 제품 배포 종료 — V2로 전환
    body: >-
      LP DAAC가 VIIRS V1 지표면반사도·LAI/FPAR·지표면온도·산불 제품의 배포를 끝냈습니다. Earthdata Search·Data Pool·AppEEARS에서 더 이상 받을 수 없고, 사용자 가이드·ATBD는 DOI 페이지에 남아 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-sr-vi-lai-fpar-lst-active-fires-data-products-decommissioned

