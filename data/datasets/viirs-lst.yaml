example:
  lang: python
  note: >-
    earthaccess로 NOAA-20 VJ121A1D(주간) 일자료를 받아 h5py로 여는 예입니다. HDF-EOS5 안의 경로를 직접 적지 않고 변수 이름으로 찾습니다.
    필수 QA(비트 0~1)가 00(최상) 또는 01(보통)인 화소만 남깁니다.
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="VJ121A1D", version="002",
        temporal=("2024-08-01", "2024-08-03"),
        bounding_box=(126.5, 37.0, 127.5, 38.0),   # (서, 남, 동, 북) 서울 주변
    )
    files = earthaccess.download(results, "vj121")

    def find(h5, name):
        hits = []
        h5.visititems(lambda path, obj: hits.append(path) if path.endswith("/" + name) else None)
        return h5[hits[0]][()]

    with h5py.File(files[0], "r") as f:
        lst = find(f, "LST_1KM").astype("float64")
        qc = find(f, "QC")

    good = (lst > 0) & ((qc & 0b11) <= 1)          # 채움값 제거 + 필수 QA 00·01
    lst_k = np.where(good, lst * 0.02, np.nan)      # K
    print(np.nanmean(lst_k) - 273.15)

tips:
  - "Suomi NPP 자료 전달은 2026년 11월 2일 15:40 UTC에 끝납니다(NOAA 공지, Earthdata 공지 제목은 11월 1일). 새 분석은 NOAA-21(VJ221) 또는 NOAA-20(VJ121)으로 시작하세요."
  - "VIIRS LST는 MOD21(TES)과 같은 방식이라 MOD21과는 잘 이어지지만, MOD11(분할창)과는 알고리즘이 달라 건조지에서 수 K 차이가 날 수 있습니다."
  - "MOD21처럼 오염 화소를 채움값으로 지우지 않습니다. 사막의 먼지·감지되지 않은 구름 때문에 이상 고온값이 나올 수 있으니 QC 비트·방출률·오차를 함께 써서 걸러 내세요."
  - "방출률이 낮다고 무조건 구름은 아닙니다. 사용자 가이드는 고철질 암석(mafic rock)처럼 M15·M16 방출률이 0.9 아래로 내려가는 실제 지표도 있다고 설명합니다."
  - "필수 QA 비트 01(보통)은 '주의해서 쓸 수 있음'입니다. LST 정확도 비트의 '나쁨' 경계는 L2가 2.5 K, A1·A2가 2 K로 제품마다 다릅니다."
  - "1 km 타일은 750 m 원자료를 재표본한 것입니다. 750 m 원해상도가 필요하면 L2 스와스(VNP21·VJ121·VJ221)를 쓰세요."
  - "세 위성의 통과 시각이 조금씩 달라 여름철 0.5 K 안팎 차이가 날 수 있습니다. 여러 위성을 섞을 때는 위성별로 따로 처리한 뒤 비교하세요."
  - "LST는 2 m 기온이 아니라 지표(피부) 온도입니다. 한낮에는 기온보다 훨씬 높고 맑은 밤에는 더 낮습니다."
  - "파일은 HDF-EOS5(HDF5)입니다. MODIS(HDF4)용 pyhdf 코드는 그대로 쓸 수 없고 h5py·xarray(h5netcdf)로 읽어야 합니다."

