# ─────────────────────────────────────────────────────────────
# VIIRS 지표면온도·방출률 VNP21·VJ121·VJ221 V2 — 데이터셋 정보 파일
# 지면 탭(지표면온도·알베도). MODIS MOD21(TES)의 후속이며, MODIS → VIIRS 비교는 modis-lst.yaml의 transitions에 있습니다.
# Suomi NPP(VNP21) 자료 전달이 2026-11-02 끝나므로 NOAA-21(VJ221)·NOAA-20(VJ121)로 옮겨야 합니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: viirs-lst
name: "VIIRS LST (VNP21)"
full_name: VIIRS Land Surface Temperature and Emissivity VNP21(Suomi NPP)·VJ121(NOAA-20)·VJ221(NOAA-21) Version 2 (VIIRS TES 1 km 주간·야간 지표면온도와 3밴드 방출률)
category: satellite
domain: land
group: 지표면온도·알베도
order: 11
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA JPL(Hulley·Hook) / NASA VIIRS 육상팀 / NASA LP DAAC

status: active
status_note: >-
  NOAA-20(VJ121)과 NOAA-21(VJ221) 자료는 매일 정상 생산되고 있습니다(2026-10-13 확인 시 VJ221A1D는 10월 11일 자료까지).
  다만 NOAA가 Suomi NPP의 모든 과학 자료 전달을 2026년 11월 2일 15:40 UTC에 끝낸다고 공지해, VNP21 계열은 그 뒤로 새 자료가 나오지 않습니다.
  LP DAAC는 NOAA-21(VJ221, 1순위)이나 NOAA-20(VJ121, 2순위) 제품으로 옮기라고 안내합니다. 성숙도는 1단계 검증(Stage 1 Validation)입니다.

period:
  start: "2012-01"
  end: present
  note: >-
    Suomi NPP(VNP21)는 2012-01-17부터(2026-11-02 전달 종료 예정), NOAA-20(VJ121)은 2018-01-01부터, NOAA-21(VJ221)은 2023-02-10부터(월 CMG는 2023-02 구간부터)입니다.
    VJ221 LST는 2026년 4월 14일 공개되었습니다. V2 컬렉션은 2023년 6월 29일 공개되었고, 이전 V1은 2025년 4월 8일 배포가 끝났습니다.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    L3 타일: MODIS Sinusoidal(SIN) 격자 1 km(750 m 원자료를 재표본, 1200×1200 화소/타일) — VNP21A1D·A1N·A2 /
    CMG: 전지구 0.05° 격자 — VNP21C1·C2·C3 / L2 스와스: 직하점 750 m(VNP21, 6분 단위 그래뉼). NOAA-20·21도 같은 격자(VJ121·VJ221)
  vertical: 지표 피부(skin) 온도 단일층 + VIIRS 열적외 밴드 M14(8.55 µm)·M15(10.76 µm)·M16(12 µm) 방출률
  temporal: >-
    위성마다 하루 주간 1회(13:30 상승 궤도)·야간 1회 통과(고위도는 여러 번) / 일(A1D·A1N·C1) / 8일(A2·C2) / 월(C3)

coverage:
  short: 전지구
update: 매일 (관측 후 1~2일 지연), 8일·월 자료는 구간 종료 후. Suomi NPP(VNP21)는 2026-11-02 이후 새 자료 없음
license: NASA EOSDIS 자료 이용·인용 지침에 따라 제한 없이 공개된 무료 자료입니다. 내려받기에는 무료 NASA Earthdata 로그인이 필요하며, 데이터셋 DOI 인용을 요청합니다.
account_required: true

summary: >-
  VIIRS 열적외 밴드 M14·M15·M16으로 맑은 날의 지표면(피부) 온도와 방출률을 함께 구하는 NASA의 VIIRS 지표면온도 자료입니다.
  MODIS MOD21과 같은 온도·방출률 분리(TES) 알고리즘과 같은 대기 입력·수증기 보정 방식을 써서 MODIS 기록을 잇도록 만들었으며, 개발진은 두 센서의 지표면온도가 약 ±0.5 K 안에서 일치한다고 보고했습니다.
  Suomi NPP(VNP21)·NOAA-20(VJ121)·NOAA-21(VJ221) 세 위성 판이 있고, 모두 오후 1시 30분 무렵 지나는 궤도라 MODIS Aqua 관측을 주로 대신합니다.
  일·8일 1 km 타일과 일·8일·월 0.05° 전지구 격자로 제공됩니다.

time_convention:
  summary: >-
    일자료(A1D 주간·A1N 야간)는 위성 통과 순간의 맑은 하늘 관측값으로, 같은 날 격자 칸과 15% 넘게 겹치는 맑은·양호 관측을 겹침 비율로 가중 평균한 값입니다.
    8일(A2)·월(C3) 자료는 그 기간 맑은 날 일자료의 평균이며 흐린 날은 빠집니다. 관측 시각은 화소마다 다르므로 `View_Time` 계열 변수로 확인합니다.
  points:
    - "Suomi NPP·NOAA-20·NOAA-21은 모두 적도를 지방시 13:30 무렵 상승(주간) 통과하는 오후 궤도입니다. 야간 관측은 반대 방향 궤도에서 이뤄집니다. MODIS Terra(오전 10:30)와 같은 시각대 관측은 없습니다."
    - "같은 오후 궤도라도 위성끼리 통과 시각이 50분~1시간 다릅니다. VNP21 사용자 가이드는 이 시각 차이 때문에 2018년 8월 VNP21과 VJ121 사이에 약 0.5 K 차이가 났다고 보고합니다(1월에는 편차가 거의 없음)."
    - "8일 자료(A2)는 일자료 A1D·A1N의 단순 평균이며 LST·QC·관측각·관측 시각은 주간·야간을 따로, 방출률은 주간·야간을 함께 평균합니다."
    - "CMG(C1·C3)의 관측 시각은 사용자 가이드에 UTC로 적혀 있지만, 1 km 타일(A1·A2) `View_Time`의 시간 기준은 가이드에 명시되어 있지 않습니다. 파일 속성을 확인하세요."
    - "Suomi NPP 자료는 2026-11-02 이후 끊깁니다. VNP21로 만든 시계열을 이어 가려면 겹치는 기간에 VJ121·VJ221과 비교한 뒤 바꾸세요."
  source: https://lpdaac.usgs.gov/documents/1662/VNP21_User_Guide_V2.pdf
  source_name: "VNP21 Collection 2 User's Guide + VNP21A1D·VNP21A2 V002 컬렉션 설명(CMR)"

variables:
  note: >-
    LP DAAC 데이터 카탈로그와 VNP21 Collection 2 사용자 가이드 기준 변수입니다. 파일은 HDF-EOS5(HDF5)이며 실제 값 = 저장값 × scale_factor (+ offset)입니다.
    LST는 scale 0.02(K), 저장값 0은 채움값입니다. VJ121·VJ221 파일도 변수 이름이 같습니다. MOD21과 마찬가지로 오염 화소를 지우지 않으므로 QC로 직접 걸러야 합니다.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp21a1d-002
  groups:
    - name: 일자료 1 km (VNP21A1D 주간 / VNP21A1N 야간, VJ121·VJ221 동일)
      kind: instant
      period: 통과 시각
      items:
        - text: "지표면온도 — `LST_1KM` (K, scale 0.02)"
          std: [tskin]
          note: 주간 파일(A1D)과 야간 파일(A1N)이 따로 있음. 격자 칸과 15% 넘게 겹치는 맑은·양호 관측을 겹침 비율로 가중 평균
        - "밴드 M14·M15·M16 방출률 — `Emis_14`, `Emis_15`, `Emis_16` (무차원, scale 0.002, offset 0.49)"
        - text: "관측 시각 — `View_Time` (시, scale 0.1)"
          note: 화소별 관측 시각
        - "관측 천정각 — `View_Angle` (도, offset -65)"
        - "품질 비트 — `QC` (16비트: 필수 QA, L1B 자료 품질, 구름, TES 반복, 대기 불투명도, 방출률 대비, 방출률·LST 정확도)"
    - name: 8일 자료 1 km (VNP21A2·VJ121A2·VJ221A2)
      kind: mean
      period: 8일 (맑은 날만)
      items:
        - text: "8일 주간·야간 지표면온도 — `LST_Day_1KM`, `LST_Night_1KM` (K, scale 0.02)"
          std: [tskin]
          note: 맑은 날 A1D·A1N 값의 단순 평균
        - text: "8일 방출률 — `Emis_14`, `Emis_15`, `Emis_16` (무차원, scale 0.002, offset 0.49)"
          note: 주간·야간을 함께 평균
        - "주간·야간 관측 시각 — `View_Time_Day`, `View_Time_Night` (시, scale 0.1)"
        - "주간·야간 관측 천정각 — `View_Angle_Day`, `View_Angle_Night` (도)"
        - "주간·야간 품질 비트 — `QC_Day`, `QC_Night` (8비트 비트값)"
    - name: 0.05° 전지구 격자 (VNP21C1 일 / C2 8일 / C3 월)
      kind: mean
      period: 일·8일·월
      items:
        - text: "주간·야간 지표면온도 — `LST_Day`, `LST_Night` (K, scale 0.02)"
          std: [tskin]
          note: C1은 그날 조건에 맞는 L2 화소의 평균, C2·C3는 C1 일자료의 8일·월 평균
        - "주간·야간 LST 불확실성 — `LST_Day_err`, `LST_Night_err` (K, scale 0.04)"
        - text: "주간·야간 관측 수 — `Count_Day`, `Count_Night` (개)"
          kind: accum
          note: 평균에 들어간 관측 수
    - name: 고정 정보
      kind: static
      items:
        - "격자 내 육지 비율(CMG) — `Percent_land_in_grid` (%)"

