transitions:
  - from: WorldCover 2020 v100
    to: WorldCover 2021 v200
    status: completed
    date: "2022-10"
    summary: >-
      2021년 지도는 개선된 알고리즘(v200)으로 새로 만든 것으로, 2020년 지도를 v200으로 다시 만들지는 않았습니다. 형식·범례는 같지만 두 지도는 서로 다른 판입니다.
    changes:
      - aspect: 학습 자료·특징
        before: "학습 지점 259,734개, 특징 131개"
        after: "학습 지점 319,415개, 특징 115개"
      - aspect: 전체 정확도(독립 검증)
        before: "74.4%"
        after: "76.7% (±0.5%)"
      - aspect: 파일 형식·범례
        before: "COG, 3°×3° 타일, 11등급"
        after: "변경 없음"
      - aspect: 배포 경로
        before: "s3://esa-worldcover/v100/2020/, Zenodo 단일 tar.gz"
        after: "s3://esa-worldcover/v200/2021/, Zenodo 60°×60° 묶음"
    impacts:
      - 두 지도의 차이를 실제 토지피복 변화로 해석하지 마세요(대부분 알고리즘 차이).
      - 한 해만 필요하면 정확도가 더 높은 2021년 v200을 쓰는 것이 일반적입니다.
    sources:
      - name: ESA WorldCover Product User Manual v2.0
        url: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/docs/WorldCover_PUM_V2.0.pdf
      - name: ESA WorldCover — Data access (버전 안내)
        url: https://esa-worldcover.org/en/data-access
  - from: ESA WorldCover (2020–2021)
    to: Copernicus LCFM 10 m Global Land Cover (2020–2026)
    status: completed
    date: "2026-02"
    summary: >-
      ESA 시범 사업이 끝나고, EU Copernicus 육상 모니터링 서비스(CLMS)의 LCFM 사업이 10 m 전지구 토지피복 지도를 2020~2026년 해마다 운영 제품으로 내는 체제로 바뀌었습니다.
      2026-10-13 기준 LCFM 10 m 지도는 2020년만 공개되어 있습니다.
    changes:
      - aspect: 운영 주체
        before: "ESA 시범 사업(VITO 주관 컨소시엄)"
        after: "EU Copernicus 육상 모니터링 서비스(CLMS) — LCFM 사업"
      - aspect: 기간
        before: "2020, 2021 두 해"
        after: "2020~2026 연간 계획 (2026-10 기준 2020년만 공개, 2021년 이후는 2026년 공개 예정으로 안내)"
      - aspect: 입력 위성
        before: "Sentinel-1 + Sentinel-2"
        after: "Sentinel-2 MSI (CLMS 제품 설명 기준)"
      - aspect: 배포처
        before: "AWS, Zenodo, Terrascope, GEE"
        after: "Copernicus Data Space Ecosystem(브라우저·OData API·S3), CLMS 제품 페이지"
    impacts:
      - LCFM은 별도 제품이므로 WorldCover와 한 시계열로 잇기 전에 범례·정의·정확도를 확인하세요.
      - 2022년 이후 10 m 전지구 지도가 필요하면 LCFM 공개 일정을 확인해야 합니다.
    sources:
      - name: ESA WorldCover 소식 (2026-02-25, Copernicus LCFM operational successor)
        url: https://esa-worldcover.org/en/news
      - name: "CLMS — LCFM: a new chapter in global land cover monitoring (2025-06-26)"
        url: https://land.copernicus.eu/en/news/lcfm-a-new-chapter-in-global-land-cover-monitoring
      - name: CDSE 포럼 — LCM 10 m 2021년 이후 공개 일정 답변(2025-10)
        url: https://forum.dataspace.copernicus.eu/t/timeline-of-availability-for-lcm-global-10m-2021-onwards/4051

notices:
  - date: "2026-02-25"
    level: warning
    title: WorldCover 사업 종료 — 운영 후속은 Copernicus LCFM
    body: >-
      WorldCover 누리집은 ESA WorldCover 사업이 끝났으며, 10 m 전지구 토지피복 지도는 이제 Copernicus LCFM 제품군으로 이용할 수 있다고 안내했습니다.
      WorldCover는 2020·2021년 두 지도로 마감됩니다.
    source: https://esa-worldcover.org/en/news
  - date: "2025-06-26"
    level: info
    title: Copernicus LCFM 10 m 전지구 토지피복 지도(2020년) 공개
    body: >-
      CLMS가 LCFM 제품군의 첫 결과로 10 m 전지구 토지피복 지도와 범열대 수관 밀도 지도(모두 2020년)를 공개했고, 2020~2026년을 해마다 제공할 계획이라고 밝혔습니다.
    source: https://land.copernicus.eu/en/news/lcfm-a-new-chapter-in-global-land-cover-monitoring
  - date: "2022-10-28"
    level: info
    title: WorldCover 2021(v200) 공개
    body: >-
      개선된 알고리즘으로 만든 2021년 지도가 공개되었습니다. 전체 정확도는 76.7%이며, 2020년(v100) 지도와의 차이는 대부분 알고리즘 차이라고 안내되었습니다.
    source: https://esa-worldcover.org/en/about/about

