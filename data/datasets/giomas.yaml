# ─────────────────────────────────────────────────────────────
# GIOMAS — 데이터셋 정보 파일
# UW Polar Science Center 전지구(남극 포함) 해빙-해양 모델-자료동화 추정치
# ─────────────────────────────────────────────────────────────
id: giomas
name: GIOMAS
full_name: Global Ice-Ocean Modeling and Assimilation System (전지구 해빙-해양 모델링·자료동화 시스템)
category: reanalysis
domain: seaice
group: 재분석
order: 20
domains: [해빙, 해양]
provider: University of Washington Applied Physics Laboratory, Polar Science Center (APL/PSC)

status: delayed
status_note: >-
  서버의 최신 파일이 2026년 1월분(월평균 1개월, 일평균 약 보름)에서 멈춰 있습니다. GIOMAS도 PIOMAS와 같이 NCEP/NCAR R1 재분석을
  대기 강제력으로 쓰는데, R1이 2026년 3월 종료되어 갱신이 중단된 것으로 보입니다. GIOMAS 페이지에 별도 공지는 없으므로
  재개 여부는 PIOMAS 공지와 서버 디렉터리를 함께 확인하세요.

period:
  start: "1979-01"
  end: "2026-01"
  note: >-
    공식 페이지는 "1979년 1월~현재"로 안내하지만, 확인 시점(2026-10-11) 서버에는 2026년 파일이 1월분까지만 있습니다.
    2025년 일부 파일(heff, area 등)은 2026년 3~4월에 다시 올라왔으므로 이전에 받은 2025년 자료와 다를 수 있습니다.

resolution:
  spatial_short: "60 km (0.8°)"
  temporal_short: "1일"
  spatial: "곡선 직교 격자 360×276, 평균 약 0.8°, 전지구"
  vertical: "해빙 두께 8범주 (Liao et al. 2022 기준) / 해양 표층 변수는 2.5 m 층"
  temporal: 월평균 + 일부 변수 일평균

coverage:
  short: 전지구
update: 사실상 중단 (2026년 1월 자료가 마지막, 공식 공지 없음)
license: >-
  별도 라이선스 문구 없음. 누구나 계정 없이 받을 수 있으며, PSC는 Zhang and Rothrock (2003) 인용과
  자료를 받은 사용자의 이메일 연락(갱신·오류 안내용)을 요청합니다.
account_required: false

summary: >-
  워싱턴대 극지과학센터(PSC)가 PIOMAS와 같은 해빙-해양 모델(두께·엔탈피 분포 모델 + Parallel Ocean Program)을 전지구 격자로 돌려 만든
  해빙 두께·농도·해양 표층 자료입니다. 위성 해빙 농도(SSM/I 계열)를 넛징으로 동화하고 NCEP/NCAR 재분석으로 강제하며, 두께 관측은
  동화하지 않으므로 관측이 아닌 모델 추정치입니다. 장기 관측이 거의 없는 남극 해빙 두께·부피 연구에서 자주 쓰입니다.

time_convention:
  summary: >-
    격자 자료는 월 자료(파일 하나에 1년 12개월)와 이름에 day가 붙은 일 자료로 나뉩니다. 월 자료는 그 달을 대표하는 값이지만,
    GIOMAS 페이지 자체는 "월평균"이라고 명시하지 않아 같은 모델인 PIOMAS의 설명(heff 월평균, hiday 일평균)에 기대어 분류했습니다.
  points:
    - "월 파일(heff.H연도 등)에는 1월~12월 12개 2차원 필드가 순서대로 들어 있고 별도 시간 좌표가 없습니다 (벡터 변수는 u 다음 v)"
    - "GIOMAS 공식 페이지는 시간 해상도를 '월 자료'로만 적고 있어, 평균인지 특정 시점 값인지 명시되어 있지 않습니다. 같은 팀의 PIOMAS 변수표는 heff를 월평균, hiday를 일평균으로 밝힙니다"
    - "일 파일(hiday, aiday, uiday, snowday)은 GIOMAS 페이지에 설명이 없고 서버에만 있습니다. 날짜 수와 윤년 처리는 파일 크기로 먼저 확인하세요"
    - "iceprod·oflux_ocn은 m/s 단위의 변화율이라 기간 동안의 총량은 초 수를 곱해 구합니다"
  source: https://psc.apl.uw.edu/data/global-sea-ice-giomas-data-sets/
  source_name: PSC GIOMAS 자료 안내 페이지 (+ PIOMAS model grid 변수표)

variables:
  note: >-
    변수마다 연도별 파일(이름.H연도)로 따로 제공되는 머리말 없는 단정밀도 이진 파일이며, 한 파일에 12개월이 들어 있습니다.
    월평균 변수 이름과 단위는 PSC GIOMAS 페이지 표 기준이고, 일평균 파일은 서버 디렉터리에서 확인한 파일명입니다.
    heff, area, otemp1은 NetCDF(.nc.gz) 파일도 함께 있습니다.
  full_list: https://psc.apl.uw.edu/data/global-sea-ice-giomas-data-sets/
  groups:
    - name: 해빙 (월평균)
      kind: mean
      period: 월
      items:
        - text: "해빙 두께(단위 면적당 부피) — `heff` (m)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "해빙 농도 — `area` (비율)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "해빙 속도 u·v — `icevel` (m/s)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "해빙 성장률(순 생산) — `iceprod` (m/s)"
          note: "m/s 단위의 변화율입니다. 월 총 성장량은 기간(초)을 곱해 구합니다. PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "적설 깊이(물 환산) — `snow` (m)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
    - name: 해양 표층 (월평균, 2.5 m)
      kind: mean
      period: 월
      items:
        - text: "해양 열속에 의한 융해 경향 — `oflux_ocn` (m/s)"
          note: "m/s 단위의 변화율입니다. PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "표층 수온 — `otemp1` (°C)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "표층 염분 — `osali1` (psu)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
        - text: "표층 해류 u·v — `ouv1` (cm/s)"
          note: "PSC GIOMAS 페이지는 '월 자료(파일당 12개월)'로만 안내하고 평균이라고 명시하지 않습니다. 같은 모델의 PIOMAS heff가 월평균으로 명시되어 있어 월평균으로 분류했습니다."
    - name: 일평균 파일 (서버 디렉터리 기준)
      kind: mean
      period: 일
      items:
        - text: "일평균 해빙 두께 — `hiday` (m)"
          note: "서버 디렉터리에서 확인한 일별 파일입니다. GIOMAS 페이지에 설명이 없어 일평균인지 순간값인지 확인하지 못했습니다(PIOMAS hiday가 일평균으로 명시된 것에 맞춰 분류). 단위는 PIOMAS hiday 기준"
        - text: "일평균 해빙 농도 — `aiday` (0-1)"
          note: "서버 디렉터리에서 확인한 일별 파일로, GIOMAS 페이지에 설명이 없습니다. 단위는 같은 변수의 월자료(area) 기준"
        - text: "일평균 해빙 속도 — `uiday` (m s-1)"
          note: "서버 디렉터리에서 확인한 일별 파일로, GIOMAS 페이지에 설명이 없습니다. 단위는 같은 변수의 월자료(icevel) 기준"
        - text: "일평균 적설 깊이(물 환산) — `snowday` (m)"
          note: "서버 디렉터리에서 확인한 일별 파일로, GIOMAS 페이지에 설명이 없습니다. 단위는 같은 변수의 월자료(snow, 물 환산) 기준"

access:
  - name: PSC GIOMAS 자료 안내 페이지
    url: https://psc.apl.uw.edu/data/global-sea-ice-giomas-data-sets/
    login: false
    method: 웹 다운로드 / sftp·rsync (사용자명·비밀번호 anonymous)
    note: 변수표, 격자·마스크 파일(grid.dat, grid.dat.pop, io.dat_360_276.output), Fortran·IDL 읽기 프로그램 링크가 있습니다.
  - name: pscfiles 서버 — Global_seaice 디렉터리
    url: https://pscfiles.apl.washington.edu/zhang/Global_seaice/
    login: false
    method: HTTPS 디렉터리
    note: 모든 변수·연도 파일이 한 디렉터리에 있습니다. 일평균 파일은 해마다 100 MB가 넘으니 필요한 변수만 받으세요.

example:
  lang: python
  note: heff.H2020(압축 해제)와 같은 디렉터리의 grid.dat를 받아 둡니다.
  code: |
    import numpy as np

    nx, ny = 360, 276
    # 머리말 없는 단정밀도 이진 파일, 12개월 연속 (빅엔디언이면 ">f4")
    heff = np.fromfile("heff.H2020", dtype="<f4").reshape(12, ny, nx)
    if np.nanmax(np.abs(heff)) > 100:  # 값이 이상하면 바이트 순서를 바꿔 다시 읽기
        heff = np.fromfile("heff.H2020", dtype=">f4").reshape(12, ny, nx)
    print("9월 최대 두께(m):", heff[8].max())

tips:
  - >-
    남극 해빙 두께 평가 논문(Liao et al. 2022)에 따르면 GIOMAS는 남극 해빙 부피 변동(상관 0.83)과 2013년 전후 추세 전환은 잘 재현하지만,
    Envisat·CryoSat-2 대비 부피를 평균 약 38% 작게 내고 웨델해 북서부 등 변형 얼음이 많은 곳에서 특히 얇게 냅니다.
    절대값보다 변동성·추세 비교에 쓰는 편이 안전합니다.
  - >-
    해빙 농도를 동화할 때 두께도 함께 조정되어 평균 두께가 얇아지는 경향이 있습니다. 두께 관측은 동화하지 않으므로 "관측 두께"로 부르지 마세요.
  - >-
    GIOMAS 페이지의 인용 문구는 Zhang and Rothrock (2003)의 쪽수를 681–697로 적고 있지만, 실제 논문은 Monthly Weather Review 131(5), 845–861입니다.
    인용할 때는 아래 DOI 기준 서지정보를 쓰세요.
  - >-
    oflux_ocn에 -3.02×10⁸을 곱하면 혼합층으로 들어가는 해양 열속(W/m²)이 되고, snow에 (물 밀도/눈 밀도)를 곱하면 실제 적설 깊이가 됩니다.

