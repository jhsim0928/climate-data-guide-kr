notices:
  - date: "2026-03-24"
    level: warning
    title: 대기 강제력(NCEP/NCAR R1) 종료 — GIOMAS 갱신도 멈춘 상태
    body: >-
      GIOMAS 전용 공지는 없지만, 같은 PSC의 PIOMAS 페이지에 NCEP/NCAR R1 재분석이 2026년 3월 18일 종료되어 대체 강제력이 필요하다는 공지가
      올라왔습니다. GIOMAS도 R1로 강제되며, 확인 시점 서버의 2026년 파일은 1월분까지만 있습니다.
    source: https://psc.apl.uw.edu/research/projects/arctic-sea-ice-volume-anomaly/

