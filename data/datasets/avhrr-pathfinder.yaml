notices:
  - date: "2025-09-03"
    level: critical
    title: AVHRR Pathfinder SST 제품·CDR 중단 (2023-12-31 이후 갱신 없음)
    body: >-
      NCEI가 NOAA NESDIS 변경 공지로 AVHRR Pathfinder SST 제품과 기후자료기록(CDR)을 중단한다고 알렸습니다. 2023-12-31 이후 자료는 만들지 않으며,
      이미 보관된 자료는 공식 자료로 남아 제품·CDR 페이지에서 계속 받을 수 있습니다. 후속 자료는 언급하지 않았습니다.
    source: https://www.nesdis.noaa.gov/news/avhrr-pathfinder-sst
  - date: "2019-08-29"
    level: info
    title: PO.DAAC에서 Pathfinder v5.0·v5.1 배포 종료
    body: >-
      NASA PO.DAAC가 NOAA AVHRR Pathfinder SST v5.0·v5.1 자료 지원을 끝내고, 이 자료와 새 판은 NOAA NCEI에서 받도록 안내했습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2019-08-29_NOAA_AVHRR_PATHFINDER_SST_v5.0_and_v5.1_datasets_retired
  - date: "2016-08-27"
    level: info
    title: Pathfinder v5.3 L3C 공개
    body: >-
      SeaDAS 6.4 기반으로 다시 처리한 v5.3 L3C가 NCEI에 공개되었습니다. 품질 등급 0 자료 포함, 태양 반사 처리 개선, NOAA-7·NOAA-19 구름 판별 일관화, 육지 마스크 갱신 등이 v5.2와 달라졌습니다.
    source: https://www.ncei.noaa.gov/archive/accession/AVHRR_Pathfinder-NCEI-L3C-v5.3
  - date: "2016-07-20"
    level: warning
    title: v5.2·v5.3 고위도 SST 오류 (하지·동지 무렵)
    body: >-
      NCEI 기술 노트(CDRP-RPT-0831)가 Pathfinder v5.2·v5.3의 50° 이상 고위도 SST가 6월·12월 하지·동지 무렵 자주 틀린다고 밝혔습니다.
      주간·야간이 섞인 그래뉼을 나누는 처리 오류 때문이며 L3C에 영향이 있고, NCEI는 다음 판에서 고치겠다고 했지만 후속 판 없이 갱신이 끝났습니다.
    source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Sea_Surface_Temperature_Pathfinder/TechnicalNote_01B-08.pdf

transitions:
  - from: AVHRR Pathfinder v5.2
    to: AVHRR Pathfinder v5.3
    status: completed
    date: "2016-08"
    summary: >-
      처리 체계를 SeaDAS 6.4로 새로 만들어 품질 등급 0 자료를 넣고, 태양 반사·육지 경계 처리와 메타데이터 규격을 개선한 판입니다.
      기간도 2012년까지에서 2023년까지로 늘었습니다.
    changes:
      - aspect: 기간
        before: "1981-09-01~2012-12-31"
        after: "1981-08-25~2023-12-31"
      - aspect: DOI
        before: 10.7289/v5wd3xhb
        after: 10.7289/v52j68xx
      - aspect: 품질 등급
        before: 품질 등급 0 자료 제외
        after: "품질 등급 0 자료 포함, 39.8°C 넘는 주간 SST를 l2p_flags 비트 6으로 표시"
      - aspect: 구름·태양 반사 처리
        before: NOAA-7·NOAA-19 구름 판별이 다른 센서와 달랐음
        after: "구름 판별 트리 일관화, 태양 반사(sun glint) 처리 개선, 육지·물 경계 고온점 표시 개선"
      - aspect: 마스크
        before: 이전 육지 마스크
        after: "Global Lakes and Wetlands Database 기반 육지 마스크, 남극 빙붕을 해빙 100%로 표시"
      - aspect: 파일 형식
        before: netCDF-4
        after: "netCDF-4 classic, CF·ACDD 규약 준수 개선"
    impacts:
      - v5.2와 v5.3은 화소 값과 결측 화소가 다르므로 한 시계열에 섞지 말고 전체 기간을 v5.3으로 받으세요.
      - "품질 등급 0이 새로 들어가 있으므로 v5.2 때와 같은 기준으로 거르려면 quality_level·pathfinder_quality_level 조건을 다시 확인하세요."
      - 하지·동지 무렵 고위도 오류는 v5.3에서도 고쳐지지 않았습니다.
    sources:
      - name: NCEI — AVHRR Pathfinder SST 제품 페이지 (v5.3 변경 사항, 버전 기록)
        url: https://www.ncei.noaa.gov/products/avhrr-pathfinder-sst
