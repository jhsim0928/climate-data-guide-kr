notices:
  - date: "2026-10-01"
    level: info
    title: 후속 마이크로파 자료 RSS MWI(WSF-M1) V6.1 공개
    body: >-
      RSS가 미 우주군 WSF-M1 위성 MWI 센서 자료의 첫 공개판(V6.1)을 내놓았습니다. 0.25° 일·다일 격자 netCDF이며 기존 RSS 마이크로파 기후자료와 상호 보정했다고 밝혔습니다.
      DMSP SSMIS 공백 이후를 메울 자료이지만, SSMIS 기록과의 연속성은 따로 확인해야 합니다.
    source: https://www.remss.com/announcement/RSS-MWI-V6.1-released/
  - date: "2025-08-06"
    level: warning
    title: DMSP SSMIS 자료 전달은 DMSP 임무 종료(2026년 9월 예상)까지
    body: >-
      미 국방부가 SSMIS 자료 처리·전달을 DMSP 임무 종료 때까지 이어 가기로 했고, 임무 종료 시점은 2026년 9월로 예상된다고 NSIDC가 전했습니다.
      NOAA·EUMETSAT OSI SAF도 이후 자료를 '가능한 범위(best effort)' 제공으로 안내했습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-noaansidc-sea-ice-concentration-near-real-time-cdr-version-3-will-continue-ssmis-data
  - date: "2025-06-26"
    level: critical
    title: DMSP SSMIS 자료 중단 예고 (이후 연기)
    body: >-
      DMSP와 미 해군 FNMOC가 2025년 6월 30일까지 DMSP 자료 수신·처리·배포를 영구 중단한다는 통보를 RSS가 전했습니다. 6월 30일 NASA 요청으로 7월 31일까지 연기되었고,
      이후 DMSP 임무 종료(2026년 9월 예상)까지 계속 제공하는 것으로 바뀌었습니다. RSS는 MWI 자료 공개를 준비하겠다고 밝혔습니다.
    source: https://www.remss.com/announcement/DMSP-SSMIS-discontinued/

