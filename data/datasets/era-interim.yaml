notices:
  - date: "2024-09-26"
    level: warning
    title: 구 CDS 종료 — ERA-Interim CDS API 스크립트도 새 계정·key 필요
    body: >-
      구(legacy) CDS가 폐쇄되고 신규 CDS로 전환되었습니다. ERA-Interim은 CDS API로만 받을 수 있으므로,
      예전 .cdsapirc(url·key)를 쓰던 스크립트는 새 ECMWF 계정 정보로 갱신해야 합니다.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380
  - date: "2023-06-01"
    level: critical
    title: ECMWF Public Datasets(Web API) 경로 종료
    body: >-
      2023년 3월 2일 예고대로 ECMWF Public Datasets 서비스가 종료되어 Web API(ecmwfapi)로 ERA-Interim을 받을 수 없게 되었습니다.
      이후 ECMWF는 ERA5로 이전할 것을 강하게 권고하며, 필요한 경우에 한해 CDS API 접근을 열어 두었습니다.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2019-08-31"
    level: info
    title: ERA-Interim 생산 종료
    body: 2019년 8월 31일 자료를 끝으로 ERA-Interim 생산이 중단되었습니다. 후속 자료는 ERA5입니다.
    source: https://confluence.ecmwf.int/spaces/CKB/pages/155337848/ERA-Interim+documentation

