# ─────────────────────────────────────────────────────────────
# PERSIANN-CDR — 데이터셋 정보 파일
# 위성 탭(강수). UC Irvine CHRS가 만들고 NOAA NCEI가 기후자료기록(CDR) v01r01로 배포하는 적외 기반 일강수(1983~)입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: persiann-cdr
name: "PERSIANN-CDR"
full_name: Precipitation Estimation from Remotely Sensed Information using Artificial Neural Networks – Climate Data Record (적외 위성 신경망 일강수 기후자료기록, 0.25°·1983~)
category: satellite
domain: satellite
group: 강수
order: 30
also_in:
  - domain: atmosphere
    group: 강수 자료
domains: [대기, 육지, 해양, 원격탐사]
provider: UC Irvine 수문기상·원격탐사센터(CHRS, 책임연구자 Soroosh Sorooshian) / NOAA NCEI CDR 프로그램 (배포 NCEI, AWS·Google Cloud, CHRS Data Portal)

status: active
status_note: >-
  NOAA CDR로 분기마다 갱신되고 있습니다. 2026-10-13 확인 시 NCEI THREDDS와 AWS 버킷의 최신 파일은 2026-03-31 자료(2026-07-09 생성)로,
  입력 자료가 갖춰지는 대로 약 3~4개월 늦게 이어집니다. 현재 버전은 v01r01(Version 1 Revision 1)입니다.

period:
  start: "1983-01"
  end: present
  note: >-
    NCEI 메타데이터는 1983-01-01부터라고 적고(제품 페이지는 '1982년~'), 사용자 안내서는 1980~1982년이 GridSat-B1 품질 작업 중이라 불완전하다고 설명합니다.
    1992년 2월은 입력 자료 불량(2월 11~25일)으로 쓸 수 없습니다. 2026-10-13 확인 시 마지막 자료는 2026-03-31입니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: >-
    0.25° 위경도 격자, 60°S–60°N·0°–360°E (일 파일 하나가 1440×480 격자).
  vertical: 지표 강수 단일층
  temporal: >-
    일(00~24 UTC 누적). 내부적으로는 3시간 간격 적외 자료로 추정한 강수를 일 단위로 합칩니다.

coverage:
  short: 준전지구
  note: "60°S–60°N"
update: 분기마다 (입력 GridSat-B1·GPCP 월자료가 갖춰지면 약 3~4개월 지연)
license: NOAA CDR 공개 자료 — 이용·접근 제한 없음(파일 속성 license), 계정 없이 무료. 데이터셋 DOI와 Ashouri et al. (2015) 인용 요청
account_required: false

summary: >-
  PERSIANN-CDR은 정지궤도 위성의 적외(약 11 µm) 휘도온도를 인공신경망(PERSIANN)으로 강수 강도로 바꾼 뒤, 월별 GPCP 강수에 맞춰 편향을 보정한
  0.25° 일강수 기후자료기록입니다. 마이크로파 관측이 드물던 1980년대부터 같은 방식으로 이어지는 30년 이상의 고해상도 위성 강수라서
  극한 강수의 장기 변화나 가뭄·홍수 연구에 많이 쓰입니다. CHRS는 실시간 PERSIANN·PERSIANN-CCS·PDIR-Now와 4 km 3시간 기록 PERSIANN-CCS-CDR도 함께 운영합니다.

time_convention:
  summary: >-
    변수 `precipitation`은 하루(00:00~23:59 UTC) 동안 누적한 강수량(mm, cell_methods는 sum)입니다. 파일 하나가 하루치이며,
    파일 이름의 첫 날짜가 자료 날짜, c로 시작하는 둘째 날짜가 파일 생성일입니다. `time` 단위는 'days since 1979-01-01 00:00:00'입니다.
  points:
    - "하루는 UTC 기준이므로 한국 시간으로는 09시~다음날 09시입니다. 사용자 안내서도 현지 시각 기준 우량계 일합계와 비교할 때(특히 호우 때) 어긋날 수 있다고 경고합니다."
    - "3시간 적외 추정을 GPCP 월강수에 맞춰 비율로 조정하므로, 월합계는 GPCP와 비슷하지만 날짜별 분포는 적외 신호에 따릅니다."
    - "갱신은 분기 단위이고 확정판만 나옵니다. 실시간이 필요하면 CHRS의 PERSIANN·PDIR-Now를 쓰되 다른 자료라는 점을 밝히세요."
  source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/PERSIANN/UserGuide_01B-16.pdf
  source_name: "PERSIANN-CDR 사용자 안내서(01B-16, 2025) + NCEI THREDDS 파일 속성(v01r01)"

variables:
  note: >-
    NCEI 파일(netCDF4, CF-1.6)의 변수입니다. 결측은 `missing_value` -9999.0, `_FillValue` -1.0으로 표시되고 척도 인수(scale_factor)는 없습니다.
    파일 속성의 청크 크기(1, 1440, 480)로 보아 배열이 (time, lon, lat) 순서로 저장되어 있으니, 지도를 그릴 때는 축 순서를 확인하세요.
  full_list: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/PERSIANN/UserGuide_01B-16.pdf
  groups:
    - name: 일자료 (PERSIANN-CDR_v01r01_YYYYMMDD_cYYYYMMDD.nc)
      kind: accum
      period: 일 (00~24 UTC)
      items:
        - text: "일강수량 — `precipitation` (mm)"
          note: "00:00~23:59 UTC 하루 합계"
    - name: 좌표
      kind: static
      items:
        - "위도·경도 경계 — `lat_bnds`, `lon_bnds` (degrees)"

access:
  - name: NOAA NCEI (HTTPS 직접 다운로드)
    url: https://www.ncei.noaa.gov/data/precipitation-persiann/access/
    method: HTTPS 다운로드 (계정 없음)
    note: 연도별 폴더에 하루 한 파일입니다. NCEI는 2026년 10월 클라우드 이전으로 접속 지연이 있을 수 있다고 안내합니다.
  - name: NCEI THREDDS (OPeNDAP·집계)
    url: https://www.ncei.noaa.gov/thredds/catalog/satellite/persiann.html
    method: THREDDS / OPeNDAP — 영역·기간 부분 추출, 전 기간 집계(Best Time Series)
  - name: AWS S3 공개 버킷 (NOAA Open Data Dissemination)
    url: https://noaa-cdr-precip-persiann-pds.s3.amazonaws.com/index.html
    method: S3 (us-east-1, 익명 접근) / HTTPS
    note: s3://noaa-cdr-precip-persiann-pds/data/YYYY/PERSIANN-CDR_v01r01_YYYYMMDD_cYYYYMMDD.nc 구조입니다.
  - name: Google Cloud Storage
    url: https://console.cloud.google.com/storage/browser/noaa-cdr-precip-persiann
    method: GCS 공개 버킷
  - name: CHRS Data Portal (UC Irvine)
    url: https://chrsdata.eng.uci.edu/
    method: 웹 지도에서 영역·기간을 골라 내려받기 (1시간~연 단위 합계)
    note: PERSIANN, PERSIANN-CCS, PERSIANN-CDR, PDIR-Now, PERSIANN-CCS-CDR을 같은 화면에서 고를 수 있습니다.

example:
  lang: python
  note: >-
    AWS 공개 버킷에서 계정 없이 2023년 7월 일자료를 받아 한반도 영역 월합계를 구하는 예입니다(s3fs·xarray·h5netcdf 필요). 경도는 0–360°입니다.
  code: |
    import s3fs
    import xarray as xr

    fs = s3fs.S3FileSystem(anon=True)
    paths = sorted(fs.glob("noaa-cdr-precip-persiann-pds/data/2023/PERSIANN-CDR_v01r01_202307*.nc"))
    ds = xr.open_mfdataset([fs.open(p) for p in paths], engine="h5netcdf", combine="by_coords")

    pr = ds["precipitation"].transpose("time", "lat", "lon")     # mm/day (00~24 UTC)
    pr = pr.where(pr >= 0)                                        # -1, -9999 결측 제거
    box = pr.sel(lat=slice(33, 39), lon=slice(124, 132))          # 위도 순서가 반대면 slice(39, 33)
    print(box.sum("time").mean(["lat", "lon"]).values, "mm (2023년 7월)")

tips:
  - "적외(구름 꼭대기 온도) 기반이라 따뜻한 비(구름 꼭대기가 따뜻한 강수)는 놓치고, 비가 오지 않는 권운을 비로 잡을 수 있습니다. 안내서도 이 한계를 명시합니다."
  - "마이크로파 자료는 GPCP 월 보정을 통해 간접적으로만 들어갑니다. 날짜별 강수 패턴은 적외 신호를 따르므로 짧은 호우 사례의 시각·위치 오차가 클 수 있습니다."
  - "편향 보정에 쓰는 GPCP 월자료는 파일 속성상 GPCP v2.3입니다. NOAA는 2025년 GPCP V3.3을 새 CDR로 내고 V2.3을 '대체된 판'으로 바꿨으니, GPCP 갱신 상황이 PERSIANN-CDR 지연에 영향을 줄 수 있습니다."
  - "1992년 2월은 쓸 수 없는 달이고, 1997년 이전에는 바탕 자료(ISCCP B1)의 인도양 공백이 있습니다. 1980년대 초반도 GridSat-B1 품질 작업 중이라 장기 추세를 볼 때 이 시기를 따로 점검하세요."
  - "파일마다 결측값이 두 가지(-9999 missing_value, -1 _FillValue)입니다. xarray가 하나만 자동으로 가리므로 음수를 모두 결측으로 처리하세요."
  - "가족 제품과 혼동하지 마세요. PERSIANN(0.25°, 실시간)·PERSIANN-CCS(4 km)·PDIR-Now(준실시간, 적외 기반 동적 강수율)·PERSIANN-CCS-CDR(0.04°·3시간 기후기록)은 CHRS Data Portal에서 받는 별개 자료입니다."
  - "일 경계가 UTC라 한국 관측소 일강수(KST 기준)와 하루가 9시간 어긋납니다. 일 단위 검증은 날짜를 맞추거나 월 단위로 비교하세요."

