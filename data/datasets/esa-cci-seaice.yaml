# ─────────────────────────────────────────────────────────────
# ESA CCI — 데이터셋 정보 파일
# ESA Sea Ice Climate Change Initiative (Sea_Ice_cci): 해빙 농도 CDR(SICCI-25km·50km v2.1, HR-SIC v3, ESMR v1.1)과
# 해빙 두께 CDR(L2P·L3C v4.0, 표류 고려 두께 v1.0)
# ─────────────────────────────────────────────────────────────
id: esa-cci-seaice
name: ESA CCI
full_name: ESA Sea Ice Climate Change Initiative (Sea_Ice_cci) — 해빙 농도·두께 기후자료(CDR)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 50
domains: [해빙]
provider: 유럽우주국(ESA) 기후변화 이니셔티브(CCI) Sea Ice 과제 — 주관 노르웨이 기상청(MET Norway), 두께는 독일 AWI 생산 / 배포 영국 CEDA

status: active
status_note: >-
  과제는 CCI+ 단계로 계속되고 있으며, 2025-11-20 해빙 두께 v4.0(ERS-2·Envisat·CryoSat-2·Sentinel-3A/B, 2024-04까지)이 CEDA에 올라와 v3.0을 대체했습니다.
  다만 v4.0 기록은 CEDA에서 아직 'Pending' 상태이고 데이터셋 DOI와 v4.0 사용자 문서가 없습니다(2026-10-12 확인).
  CCI 자료는 연구용 기후자료(CDR)를 버전 단위로 내는 것이라 정기 갱신은 없으며, AMSR 해빙 농도 기록(SICCI-25km)의 운영 연장은 EUMETSAT OSI SAF(OSI-458)가 넘겨받았습니다.

transitions:
  - from: ESA CCI 두께 v3.0
    to: ESA CCI 두께 v4.0
    status: completed
    date: "2025-11"
    summary: >-
      해빙 두께 기후자료가 v3.0에서 v4.0으로 바뀌었습니다. 사용 위성이 ERS-2(북반구)와 Sentinel-3A/B까지 늘었고 기록이 2024-04까지 길어졌습니다.
      v3.0 CEDA 기록에는 '대체됨(superseded)' 표시가 붙었고, v4.0은 아직 DOI·문서 없이 'Pending' 상태로 공개되어 있습니다.
    changes:
      - aspect: 사용 위성(고도계)
        before: "Envisat·CryoSat-2"
        after: "ERS-2(북반구만)·Envisat·CryoSat-2·Sentinel-3A·Sentinel-3B"
      - aspect: 북반구 월별 격자(L3C) 기간
        before: "Envisat 2002-10 ~ 2012-03, CryoSat-2 2010-11 ~ 2020-04"
        after: "ERS-2 1995-10 ~ 2003-04, Envisat 2002-10 ~ 2012-03, CryoSat-2 2010-10 ~ 2024-04, Sentinel-3A 2016-10 ~ 2024-04, Sentinel-3B 2018-11 ~ 2024-04"
      - aspect: 남반구 월별 격자(L3C)
        before: "Envisat 2002-10 ~ 2012-03, CryoSat-2 2010-11 ~ 2020-04"
        after: "Envisat 2002-10 ~ 2012-03, CryoSat-2 2010-11 ~ 2024-04, Sentinel-3A·3B 추가"
      - aspect: 파일 이름 버전 표기
        before: "…-fv3p0.nc"
        after: "…-fv4p0.nc (AWI 생산 코드 pysiral의 v4.0 출력 정의 기준)"
      - aspect: 문서
        before: "PUG·ATBD Issue 3.2 (Zenodo DOI 10.5281/zenodo.10605998, 10.5281/zenodo.10605840)"
        after: "v4.0 전용 PUG·ATBD는 공개 위치 확인되지 않음 (CEDA 기록·ESA Key Documents 페이지에 없음)"
      - aspect: CEDA 기록 상태·인용
        before: "Completed(현재 superseded), 데이터셋 DOI 없음 — CEDA 카탈로그 URL로 인용"
        after: "Pending, 데이터셋 DOI 없음 — CEDA 카탈로그 URL로 인용"
    impacts:
      - v3.0과 v4.0을 한 시계열로 섞지 마세요. 2020-05 이후 CryoSat-2 자료가 필요하면 전 기간을 v4.0으로 다시 받는 것이 안전합니다.
      - v4.0은 정식 문서·DOI가 나오기 전이므로 논문에는 받은 날짜와 CEDA 카탈로그 URL, 파일의 product_version 속성을 함께 적고, DOI 발급 여부를 다시 확인하세요.
      - Sentinel-3와 CryoSat-2는 궤도·센서가 달라 같은 달이라도 값이 다릅니다. 여러 위성을 이어 쓸 때는 겹치는 기간(2016-10 이후)으로 차이를 먼저 확인하세요.
    sources:
      - name: CEDA — CryoSat-2 북반구 L3C v4.0
        url: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
      - name: CEDA — CryoSat-2 북반구 L3C v3.0 (superseded)
        url: https://catalogue.ceda.ac.uk/uuid/45b5b1e556da448089e2b57452f277f5/
      - name: CEDA — ERS-2 북반구 L3C v4.0
        url: https://catalogue.ceda.ac.uk/uuid/dfc03980decc4e50b111d5981358930e/
      - name: CEDA — Stefan Hendricks 저자 기록 목록 (v2.0~v4.0 전체)
        url: https://catalogue.ceda.ac.uk/record/party/2383
      - name: CCI+ Sea Ice Thickness PUG Issue 3.2 (v3.0)
        url: https://doi.org/10.5281/zenodo.10605998

period:
  start: "1972-12"
  end: "2024-04"
  note: >-
    제품마다 기간이 다릅니다(CEDA 컬렉션 전체 1972-12-11 ~ 2024-04-30). 해빙 농도는 Nimbus-5 ESMR v1.1 1972-12-11 ~ 1977-05-11,
    HR-SIC v3(SSM/I·SSMIS) 1991-01-07 ~ 2020-12-31, AMSR v2.1(SICCI-25km·50km) 2002-06-01 ~ 2017-05-15(AMSR-E 종료 2011-10 ~ AMSR2 시작 2012-07 공백)입니다.
    해빙 두께 v4.0 북반구 월별 격자는 ERS-2 1995-10부터 CryoSat-2·Sentinel-3 2024-04까지이며(북반구는 10~4월만),
    남반구 CryoSat-2 월별 격자는 2010-11 ~ 2024-04입니다. 표류 고려(drift-aware) 두께 v1.0은 북반구 Envisat 2002-10 ~ 2012-03, CryoSat-2 2010-11 ~ 2020-04입니다.
    2026-10-12 확인 시점에 가장 최근 자료는 두께 v4.0의 2024-04입니다.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    해빙 농도: AMSR v2.1은 EASE2 격자(Lambert 정적 방위 등적도, WGS 84, 중앙 경선 0°, 북·남반구 별도) — SICCI-25km 25 km 432×432, SICCI-50km 50 km 216×216 /
    HR-SIC v3는 12.5 km EASE2 격자(범위 ±5400 km, OSI-450-a 25 km 격자 한 칸에 정확히 4칸이 겹치도록 정렬) / ESMR v1.1은 25 km EASE2 일별 격자.
    해빙 두께: 월별 격자(L3C) 북반구는 25 km EASE-Grid 2.0 North(EPSG:6931, 432×432), 남반구는 EASE-Grid 2.0 South(EPSG:6932, 격자 간격은 공식 기록에서 확인되지 않음) /
    궤도 자료(L2P)는 위성 측정 지점 단위 / 표류 고려 두께는 EASE-Grid 2.0 North(논문 기준 25 km)
  vertical: 해당 없음 (지표면 2차원 자료)
  temporal: 해빙 농도 일별 / 해빙 두께 월별(L3C)·일별 궤도 파일(L2P) / 표류 고려 두께 일별(10~4월)

coverage:
  short: 양극
update: >-
  정기 갱신 없음 — 과제 단계마다 새 버전 기후자료를 냅니다(CEDA 기록 update frequency 'Not Planned').
  최신은 해빙 두께 v4.0(2025-11-20). 최근 연도까지 이어진 농도는 OSI SAF(OSI-458·OSI-438)와 C3S CDS, 두께는 C3S CDS에서 받습니다.
license: >-
  ESA CCI Sea Ice Terms and Conditions — 누구나 어떤 목적으로든 무료 사용(CEDA 'Any'). 발표물에 'ESA Climate Change Initiative and the Sea Ice CCI project'와
  자료 제공자를 밝히고 데이터셋 DOI(없으면 CEDA 인용문)를 인용해야 함. 별도 Creative Commons 라이선스는 명시되지 않음
account_required: false

summary: >-
  ESA 기후변화 이니셔티브(CCI)의 해빙 과제가 만든 연구용 기후자료(CDR) 묶음입니다. 해빙 농도는 AMSR-E/AMSR2 기반 SICCI-25km·50km(v2.1),
  SSM/I·SSMIS 자료에 89 GHz 대역을 더해 12.5 km로 선명하게 만든 HR-SIC(v3), 1970년대 Nimbus-5 ESMR(v1.1)이 있고,
  해빙 두께는 ERS-2·Envisat·CryoSat-2·Sentinel-3 레이더 고도계 프리보드로 구한 궤도(L2P)·월별 격자(L3C) 자료(v4.0)와 해빙 이동을 고려한 일별 두께(v1.0)가 있습니다.
  해빙 농도는 EUMETSAT OSI SAF와 같은 알고리즘·형식으로 함께 개발해 왔고(OSI-450·OSI-458), 해빙 두께는 C3S와 조율해 C3S CDS 두께 자료의 알고리즘이 되었습니다.

time_convention:
  summary: >-
    해빙 농도는 하루치 수동마이크로파 관측을 모은 일별장(파일 이름 날짜 = 분석 중심 날짜)이고, 해빙 두께 월별 격자(L3C)는 그달 격자 칸을 지난
    모든 궤도 측정값의 평균입니다. 궤도 자료(L2P)만 측정 시각의 값입니다.
  points:
    - "HR-SIC v3 파일은 분석 중심 날짜로 이름을 붙입니다(예: …-NH-19911202-fv3.0.nc). 결측일은 대부분 1991년(SSM/I F10만 있던 시기)에 몰려 있습니다(PUG 부록 A)."
    - "농도 파일의 `status_flag`로 시간·공간 보간된 격자를 구분할 수 있습니다. 보간된 값은 주의해서 쓰고, 불확실성은 보간되지 않습니다(HR-SIC PUG)."
    - "ESMR v1.1은 관측이 있는 날만 파일이 있습니다. 1975-06-03 ~ 1975-08-25에 큰 공백이 있고, 그 뒤로는 대략 이틀에 한 번만 관측되었습니다(ESMR PUG)."
    - "두께 L3C는 한 달 동안의 L2P 측정을 격자별로 평균합니다(유효 측정 2개 이상). 북반구는 10~4월만 있고, 남반구는 모든 달을 만들지만 실험적 자료입니다."
    - "두께 계산에 쓴 눈 깊이는 관측이 아니라 기후값입니다 — 북반구 Warren 기후값(일년빙 50% 감소), 남반구 AMSR-E/AMSR2 기반 눈 깊이 기후값(pysiral v4.0 출력 정의)."
    - "표류 고려(drift-aware) 두께 v1.0은 한 달 동안의 고도계 측정 묶음을 해빙 이동에 따라 매일 옮겨 만든 일별 지도라, 같은 날짜의 일반 L3C 월평균과 성격이 다릅니다."
  source: https://climate.esa.int/documents/2133/SeaIce_CCI_P1_PUG-HRSIC_D4.2_Issue_3.0.pdf
  source_name: HR-SIC PUG Issue 3.0 · ESMR PUG Issue 1.1 · CEDA 카탈로그 기록 · AWI pysiral v4.0 L3C 출력·처리 정의

variables:
  note: >-
    해빙 농도는 CEDA 카탈로그(AMSR v2.1, HR-SIC v3)와 HR-SIC PUG, 해빙 두께는 CEDA v4.0 L3C 기록의 변수 목록에서 확인한 이름입니다.
    AMSR v2.1·ESMR v1.1의 불확실성 변수 이름은 `*_standard_error`, HR-SIC v3는 `*_standard_uncertainty`로 다릅니다.
  full_list: https://catalogue.ceda.ac.uk/uuid/887ebbe3aa4345f3bbcbe2dd1834d955/
  groups:
    - name: 해빙 농도 (AMSR v2.1, HR-SIC v3)
      kind: mean
      period: 일
      items:
        - text: "해빙 농도(필터 적용) — `ice_conc` (%)"
          note: 주 변수
        - text: "필터 전 농도 — `raw_ice_conc_values` (%)"
          note: 필터가 값을 바꾼 격자만 들어 있으며 0% 미만·100% 초과 값이 있을 수 있음
        - text: "총 불확실성(1 표준편차) — `total_standard_uncertainty`, `total_standard_error` (%)"
          note: "앞은 HR-SIC v3, 뒤는 AMSR v2.1 파일의 이름. 알고리즘(`algorithm_standard_*`)과 번짐(`smearing_standard_*`) 성분도 따로 제공"
        - text: "상태 플래그(육지·호수, 개빙 필터, 보간 등 비트값) — `status_flag` (코드값)"
    - name: 해빙 두께 월별 격자 (L3C v4.0)
      kind: mean
      period: 월
      items:
        - "해빙 두께 — `sea_ice_thickness` (m)"
        - "해빙 두께 불확실성 — `sea_ice_thickness_uncertainty` (m)"
        - "해빙 프리보드 — `sea_ice_freeboard` (m)"
        - text: "레이더 프리보드 — `radar_freeboard` (m)"
          note: 눈 속 전파 지연 보정 전 값. 불확실성 `radar_freeboard_uncertainty`
        - text: "눈 깊이 — `snow_depth` (m)"
          note: 두께 계산에 쓴 기후값의 월평균. 불확실성 `snow_depth_uncertainty`
        - "해빙 농도 — `sea_ice_concentration` (percent)"
        - text: "품질 플래그(0 정상, 1 중간, 2 낮음, 3 자료 없음) — `quality_flag` (1)"
        - text: "상태 플래그(0 정상 산출, 1 자료 없음, 2 개빙, 3 위성 극 공백, 4 육지·호수·육상 빙하, 5 산출 실패) — `status_flag` (1)"
    - name: 고정 정보
      kind: static
      items:
        - text: "해역 코드 — `region_code` (1)"
          note: 북반구는 NSIDC 해역 마스크(Stewart·Meier), 남반구는 경도 구간 기준 해역 구분(Parkinson·Cavalieri 2012)

