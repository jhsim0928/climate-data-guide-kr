example:
  lang: python
  note: >-
    CEDA에서 받은 HR-SIC v3 일별 농도 파일과 v4.0 두께 월별 파일을 연다고 가정합니다. 농도 파일 이름은 PUG에 적힌 형식이고,
    두께 파일은 이름 끝(…-YYYYMM-fv4p0.nc)으로 찾습니다.
  code: |
    import glob
    import xarray as xr

    # 해빙 농도 HR-SIC v3 (12.5 km EASE2, 북반구)
    sic = xr.open_dataset("ESACCI-SEAICE-L4-SICONC-RE_SSMI_12.5kmEASE2-NH-20200315-fv3.0.nc")
    c = sic["ice_conc"].squeeze()                      # %
    unc = sic["total_standard_uncertainty"].squeeze()  # %, 1 표준편차

    # 해빙 두께 L3C v4.0 (CryoSat-2 북반구 월별)
    f = sorted(glob.glob("ESACCI-SEAICE-L3C-SITHICK-*CRYOSAT2*-202003-fv4p0.nc"))[0]
    sit = xr.open_dataset(f)
    ok = sit["quality_flag"] <= 1                      # 0 정상, 1 중간
    print(float(sit["sea_ice_thickness"].where(ok).mean()))
    print(float(sit["snow_depth"].where(ok).mean()))   # 두께 계산에 쓴 눈 깊이(기후값)

tips:
  - >-
    CCI 해빙 농도는 2017-05(AMSR v2.1)·2020-12(HR-SIC v3)에서 끝나는 연구용 기록입니다. AMSR 기반 기록(SICCI-25km)은 OSI SAF가
    OSI-458(v3.0, 'ESA CCI에서 운영으로 이전')로 넘겨받아 OSI-438·OSI-438-a로 연장하고 있으므로, 최근까지 이어진 시계열이 필요하면 OSI SAF (해빙 농도) 페이지의 자료를 쓰세요.
  - >-
    HR-SIC v3는 OSI-450-a(25 km)를 89 GHz 대역 고해상도 자료로 '팬샤프닝'한 자료입니다. 격자 4칸이 OSI-450-a 한 칸과 정확히 겹치므로
    두 자료를 비교하기 쉽지만, 융해 연못을 개빙으로 보고 얇은 얼음(30 cm 미만) 농도를 낮게 추정하는 한계는 그대로이며 이 오차는 불확실성 변수에 들어 있지 않습니다(PUG).
  - >-
    두께 v4.0 남반구 자료는 파일 속성에서 '실험적(experimental)' 기록으로 밝히고 있습니다. 눈 구조의 영향을 제대로 반영하지 못해
    눈이 깊은 해역과 남반구 여름철에는 두께가 높게 치우친다고 경고하므로 추세 분석에 바로 쓰지 마세요.
  - >-
    CryoSat-2 기반 두께는 같은 원자료로 만든 AWI(v2.6), CCI(v4.0), CPOM, C3S 자료가 있으며 처리 방식이 달라 값이 다릅니다.
    한 분석에는 한 산출물·한 버전만 쓰고 버전을 기록하세요. 이 사이트의 'CryoSat-2' 페이지에 차이가 정리되어 있습니다.
  - >-
    DOI는 제품마다 다릅니다. 농도(SICCI-25km·50km v2.1, HR-SIC v3, ESMR v1.1)와 표류 고려 두께 v1.0은 데이터셋 DOI가 있지만,
    두께 v3.0·v4.0 기록에는 DOI가 없어 CEDA 카탈로그 기록의 인용문과 URL로 인용합니다. 남반구 표류 고려 두께는 CEDA 기록만 만들어졌고 아직 공개 전입니다(2026-10-12 확인).

