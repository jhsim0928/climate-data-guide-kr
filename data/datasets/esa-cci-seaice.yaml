      1972-12 ~ 1977-05 Nimbus-5 ESMR 19.35 GHz 단일 채널 해빙 농도의 두 번째 버전(v1.1, 25 km)이 DOI 10.5285/8978580336864f6d8282656d58771b32로 공개되어
