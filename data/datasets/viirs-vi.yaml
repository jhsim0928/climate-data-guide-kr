  acknowledgement: >-
    LP DAAC는 EOSDIS 자료 이용·인용 지침에 따라 실제로 쓴 제품(위성·해상도·주기별)의 데이터셋 DOI를 인용해 달라고 요청합니다.
    DOI는 10.5067/VIIRS/<짧은 이름>.002 형식입니다(예: VNP13A3 1 km 월은 10.5067/VIIRS/VNP13A3.002). 알고리즘 설명에는 VNP13 사용자 안내서·ATBD를 인용하세요.

transitions:
  - from: VIIRS 식생지수 V1 (VNP13 V001)
    to: VIIRS 식생지수 V2 (VNP13·VJ113·VJ213 V002)
    status: completed
    date: "2023-07"
    summary: >-
      2023년 7월 Version 2(Suomi NPP·NOAA-20)가 나왔고, V1은 2024년 6월 17일 생산이 멈춘 뒤 2025년 배포가 끝났습니다(마지막 V1 제품 2025-07-31).
      V2에는 2026년 3월 NOAA-21 제품(VJ213)이 더해졌습니다.
    changes:
      - aspect: 위성
        before: "Suomi NPP만 (VNP13 V001)"
        after: "Suomi NPP(VNP13)·NOAA-20(VJ113, 2018~)·NOAA-21(VJ213, 2023-02~) — V002"
      - aspect: 입력·처리 개선
        before: "V1 입력"
        after: "보정 개선, 지리위치 개선, 에어로졸 양 플래그 수정, 구름 마스크 갱신, 새 육지·물 마스크, VI Quality 유용성 비트 개정"
      - aspect: 제공 상태
        before: "2024-06-17 생산 종료, 2025년 배포 종료 (사용자 안내서·ATBD는 DOI 페이지에 남음)"
        after: "현재 유일한 판"
    impacts:
      - V1로 만든 결과는 V2로 다시 확인하세요. V1 파일은 Earthdata Search·Data Pool·AppEEARS에서 더 이상 받을 수 없습니다.
      - VI Quality 유용성 비트의 정의가 바뀌었으니 V1용 품질 필터는 다시 점검하세요.
    sources:
      - name: VIIRS Version 2 식생지수 제품 공개 (Earthdata 공지, 2023-07-19)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-vegetation-indices-products-released
      - name: Earthdata 카탈로그 — VNP13A1 V002 (V2 변경 사항)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
      - name: VIIRS Version 1 제품 배포 종료 (Earthdata 공지, 2025-07-08)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-data-products-decommissioned

notices:
  - date: "2026-08-07"
    level: warning
    title: Suomi NPP 자료 전달 2026년 11월 종료 — VNP13 대신 VJ213·VJ113으로 전환
    body: >-
      NOAA는 2026년 8월 3일 Suomi NPP의 VIIRS 등 모든 과학 자료 전달을 2026년 11월 2일 13:00 UTC에 영구히 끝낸다고 알렸고, NASA Earthdata는 8월 7일 공지에서
      종료일을 11월 1일 13:00 UTC(변경 가능)로 안내했습니다. LP DAAC의 VNP13 제품 설명은 같은 종류의 VJ213(주)·VJ113(보조)으로 옮기라고 권합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
  - date: "2026-03-17"
    level: info
    title: NOAA-21 VIIRS 식생지수 V2(VJ213) 공개
    body: >-
      LP DAAC가 NOAA-21(옛 JPSS-2) VIIRS로 만든 Version 2 식생지수 제품을 추가로 공개했습니다. CMR 기준 16일 제품은 2023-02-10, 월 제품은 2023-02-01부터입니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/additional-viirs-version-2-vegetation-indices-data-products-released
  - date: "2025-07-08"
    level: info
    title: VIIRS Version 1 제품 배포 완전 종료(2025-07-31) — 식생지수 포함
    body: >-
      LP DAAC는 남아 있던 VIIRS V1 제품(열 이상·토지피복 변화·식생지수·연소 면적·BRDF/알베도)의 배포를 2025년 7월 31일 끝내 V1 정리를 마친다고 공지했습니다.
      앞서 4월 8일에는 지표 반사도·LAI/FPAR 등 V1 제품이 먼저 내려갔습니다. 사용자 안내서·ATBD는 DOI 페이지에 남습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-data-products-decommissioned
  - date: "2023-07-19"
    level: info
    title: VIIRS Version 2 식생지수(VNP13·VJ113) 공개
    body: >-
      Suomi NPP와 NOAA-20(옛 JPSS-1)의 Version 2 식생지수 10개 제품(500 m·1 km 16일, 1 km 월, 0.05° 16일·월)이 공개되었습니다.
      공개 당시 Suomi NPP V1도 한동안 함께 생산되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-vegetation-indices-products-released

