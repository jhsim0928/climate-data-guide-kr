notices:
  - date: "2026-09-08"
    level: info
    title: ATLID L2 프로파일(A-PRO) 기준선 BD 처리기 공개
    body: >-
      ATL_AER_2A·ATL_EBD_2A·ATL_ICE_2A·ATL_TC__2A를 만드는 A-PRO 11.70(기준선 BD)과 BMA_FLX_2B(BMA-FLX 11.60, BD)가 공개되었습니다.
      ESA 품질 페이지는 BD의 ATLID 성층권 문제를 고친 CA 기준선이 뒤따를 예정이라고 밝히고 있습니다.
    source: https://earth.esa.int/eogateway/missions/earthcare/data
  - date: "2026-09-08"
    level: info
    title: 궤도 조정 기동으로 2026년 9월 1~4일·8~11일 일부 시간대 자료 없음
    body: >-
      정비용 궤도 기동이 두 차례(각 4회) 있었고, 기동 시간대(1회 약 50분)에는 자료가 없습니다. 9월 8~11일 기동 시각은 공지에 UTC로 나와 있습니다.
    source: https://earth.esa.int/eogateway/news/earthcare-data-unavailability-due-to-planned-orbit-manoeuvres-8-11-september-2026
  - date: "2026-07-15"
    level: info
    title: ATLID·MSI·BBR L1 기준선 CA 공개
    body: >-
      ATL_NOM_1B(ATLID L1 5.50), MSI_NOM_1B·MSI_RGR_1C(MSI L1 5.20), BBR_NOM_1B·BBR_SNG_1B(BBR L1 5.00)와 공통 격자 AUX_JSG_1D가 기준선 CA로 올라갔습니다.
    source: https://earth.esa.int/eogateway/missions/earthcare/data
  - date: "2026-06-25"
    level: info
    title: ECMWF, 2026년 6월 10일부터 EarthCARE CPR 관측을 현업 예보에 동화
    body: >-
      ESA는 ECMWF가 6월 10일부터 EarthCARE 구름 레이더(CPR) 자료를 통합예보시스템(IFS)에 동화하기 시작했다고 밝혔습니다. 우주 구름 레이더 자료의 첫 현업 동화 사례입니다.
    source: https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/A_first_EarthCARE_cloud_data_sharpen_weather_forecasts
  - date: "2026-04-23"
    level: warning
    title: ATLID BD 기준선 — 성층권 교차 편광 음수 값, 레이저 에너지 정규화 오류
    body: >-
      2026년 4월 23일부터 L1C 처리 문제로 성층권 교차 편광 신호가 음수로 나오는 현상이 이어지고 있으며 CA 기준선과 재처리로 고칠 예정입니다.
      또 4월 21일~5월 19일에는 레이저 에너지가 30 mJ 아래일 때 정규화가 잘못되어 후방산란이 낮은 띠가 생겼다가 수정되었습니다.
    source: https://earth.esa.int/eogateway/missions/earthcare/data/data-quality
  - date: "2025-01-16"
    level: info
    title: EarthCARE L1 자료 일반 공개
    body: >-
      2024년 말 시운전을 마친 뒤 ATLID·MSI·BBR(ESA)과 CPR(JAXA) L1 자료가 누구나 무료로 받을 수 있게 공개되었습니다.
      ESA는 단일 측기 L2를 2025년 3월, 여러 측기 결합 L2를 그 뒤 몇 달에 걸쳐 단계적으로 공개한다고 밝혔습니다.
    source: https://www.esa.int/Applications/Observing_the_Earth/FutureEO/EarthCARE/EarthCARE_goes_live_with_data_now_available_to_all

