example:
  lang: python
  note: "NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행합니다. 선별 문턱은 예시이며, 실제 값은 v6 품질 문서 표에서 성분·기압 범위별로 확인하세요."
  code: |
    # pip install earthaccess h5py numpy
    import earthaccess
    import h5py
    import numpy as np

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="ML2T", version="006",               # MLS L2 기온 v6
        temporal=("2025-01-15", "2025-01-15"),
    )
    files = earthaccess.download(results[:1], "./mls")

    with h5py.File(files[0], "r") as f:
        print(list(f["HDFEOS/SWATHS"]))                  # 'Temperature', 'Temperature-APriori' 등
        g = f["HDFEOS/SWATHS/Temperature"]
        val = g["Data Fields/L2gpValue"][:]              # (연직 분포 수, 기압면 수), K
        prec = g["Data Fields/L2gpPrecision"][:]
        status = g["Data Fields/Status"][:]
        quality = g["Data Fields/Quality"][:]
        conv = g["Data Fields/Convergence"][:]

    good = (status % 2 == 0) & (quality > 0.9) & (conv < 1.03)   # 예시 문턱 — 품질 문서 표로 확인
    val = np.where(good[:, None] & (prec > 0), val, np.nan)
    print(val.shape, np.nanmean(val, axis=0)[:5])

tips:
  - "값에서 음수를 지우지 마세요. 품질 문서는 낮은 농도의 성분에서 음수 값을 걸러 내면 평균이 높게 치우친다고 경고합니다(v6 수증기는 로그 보간이라 음수가 없음)."
  - "선별은 네 단계입니다: 유효 기압 범위 안만 사용, `L2gpPrecision` ≤ 0인 점 버림, `Status`가 홀수인 연직 분포 버림, `Quality`·`Convergence` 문턱 적용. 문턱은 성분과 기압 범위마다 다릅니다."
  - "2024년 5월 이후 수증기·N2O 월평균은 한 달 중 며칠의 관측만으로 만들어집니다. 이전 기간과 같은 표본으로 보지 말고, 월별 관측일 수를 함께 보고하세요."
  - "190 GHz 수신기가 꺼진 날의 구름 얼음(IWC·IWP)은 쓰지 말라고 안내하지만, L2 파일에는 아직 그 날이 따로 표시되지 않습니다. 날짜로 직접 걸러야 합니다."
  - "림 관측 자료라 한 연직 분포는 시선 방향으로 넓은 구간을 평균한 값입니다. 모델·재분석과 비교할 때는 MLS 팀이 따로 보관·배포하는 평균화 커널(averaging kernel)을 적용하는 것이 원칙입니다."
  - "v4 자료는 GES DISC에서 더 이상 받을 수 없습니다(MLS 팀 안내). 예전 v4 기반 결과는 v5·v6로 다시 확인하세요."

