notices:
  - date: "2026-03-30"
    level: warning
    title: MLS Version 6 공개 — 새 연구는 v6 권장, v5 전방 처리는 당분간 계속
    body: >-
      임무 초기(2004년)부터의 전 기록을 v6 소프트웨어로 다시 처리한 Version 6가 GES DISC에 공개되었습니다(L2 인용 정보 공개일 2026-03-30, 품질 문서 2026-03-26).
      N2O(하부 성층권 최대 20% 증가)와 기온(10~0.1 hPa 정밀도·연직 해상도 개선)이 크게 바뀌었습니다. MLS 팀은 새 연구에 v6를 권장하며, 진행 중인 연구를 위해 v5도 당분간 계속 생산합니다.
    source: https://mls.jpl.nasa.gov/
  - date: "2026-03-20"
    level: warning
    title: NASA, Aura 과학 운용 종료를 2028년 8월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra 2027년 2월, Aqua 2027년 9월,
      Aura 2028년 8월에 과학 운용이 끝날 것으로 전망했습니다. MLS v6 품질 문서도 Aura 운용이 2028년 8월까지 이어질 수 있지만 다른 요인으로 앞당겨질 수 있다고 적고 있습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2024-05-13"
    level: critical
    title: 190 GHz 수신기 간헐 운용 시작 — 수증기·N2O·HCN 매달 대부분 기간 공백
    body: >-
      남은 수명이 짧은 190 GHz 수신기를 2024년 5월부터 한 달에 며칠만 켜고 있습니다(첫 운용 5월 13~20일). 꺼진 날에는 수증기·N2O·HCN·20 hPa 아래 HNO3가 측정되지 않고,
      구름 얼음(IWC·IWP)은 쓰면 안 되며, CH3Cl·CH3CN·ClO·HCl은 기후값 수증기를 가정해 정성적으로만 써야 합니다. 오존·CO 등은 영향을 받지 않습니다.
    source: https://mls.jpl.nasa.gov/

