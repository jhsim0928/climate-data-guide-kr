    method: 웹·HTTPS·OPeNDAP (HDF-EOS5)
    note: 수증기는 ML2H2O_006, 오존은 ML2O3_006처럼 성분마다 컬렉션이 따로 있습니다. NASA Earthdata 로그인(무료)이 필요합니다.
  - name: GES DISC HTTPS 자료 디렉터리 (Aura MLS L2)
    url: https://acdisc.gesdisc.eosdis.nasa.gov/data/Aura_MLS_Level2/
    method: HTTPS (wget·curl, Earthdata 로그인)
  - name: NASA Earthdata Search — ML2T V006
    url: https://search.earthdata.nasa.gov/search/granules?p=C3127198472-GES_DISC
    method: Earthdata Search / earthaccess
  - name: Zenodo Aura MLS 커뮤니티 (일부 산출물)
    url: https://zenodo.org/communities/aura-mls
