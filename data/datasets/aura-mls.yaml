account_required: true

summary: >-
  NASA Aura 위성의 마이크로파 림 탐측기(MLS)가 대기 가장자리를 비스듬히 보며 측정한 열복사로 상부 대류권~중간권의 기온, 지오퍼텐셜 고도, 수증기, 오존,
  ClO·HCl·HNO3·N2O·CO 등 20여 개 성분의 연직 분포를 2004년부터 제공하는 자료입니다. 구름·에어로졸의 영향을 덜 받고 밤낮 관측이 가능해
  성층권 오존 화학, 극 소용돌이, 성층권 수증기 변화, 화산 분출 영향 연구의 핵심 관측으로 쓰입니다.

time_convention:
  summary: >-
    L2 값은 위성이 각 관측 지점을 지나간 시각의 순간 연직 분포이며, 파일 하나는 UTC 하루치입니다. L3는 품질 선별을 거친 L2를 날·달 단위로 격자나 위도대에 모아 평균한 값입니다.
  points:
    - "L2 파일의 시각 변수는 1993-01-01 00:00 UT부터의 초(윤초 포함)입니다. 하루 약 15개 궤도의 상승(주간)·하강(야간) 관측이 함께 들어 있으므로, 일주기가 있는 성분(예: ClO, 중간권 기온)은 지방 시각으로 나눠 보세요."
    - "L2 하루 파일 경계는 UTC 자정입니다. 지역 분석에서 하루 평균을 만들 때는 지방 시각 기준 날짜와 어긋날 수 있으니 시각 변수로 직접 나누세요."
    - "2024년 5월부터 190 GHz 수신기는 한 달에 며칠(MLS 팀 안내: 대략 월 중순 6일 안팎, v6 품질 문서: 약 4일)만 켭니다. 그 밖의 날에는 수증기·N2O·HCN·20 hPa 아래 HNO3가 없고, CH3Cl·CH3CN·ClO·HCl·구름 얼음은 기후값 수증기를 가정해 정량 비교가 어렵습니다."
    - "준실시간(NRT) L2는 간단한 전방 모델을 써서 표준 산출보다 덜 정확하고 7일만 보관됩니다. 연구에는 표준 산출을 쓰세요."
  source: https://mls.jpl.nasa.gov/data/v6-0_data_quality_document.pdf
  source_name: Aura MLS v6.0x data quality and description document + MLS 홈페이지 + ML2T_NRT V005 CMR 설명

variables:
  note: >-
    L2는 산출물(성분)마다 파일이 따로 있으며(예: ML2T 기온, ML2H2O 수증기, ML2O3 오존), 값은 파일 안 `HDFEOS/SWATHS/<스와스>/Data Fields/L2gpValue`에 있습니다.
    표준 스와스 이름은 산출물 이름과 같고(Temperature, H2O, O3, GPH, RHI 등), 그래서 아래 변수명 칸은 `스와스/L2gpValue`로 적었습니다. 같은 파일에 `-APriori`로 끝나는 사전값 스와스가 함께 있고,
    기온 파일에는 WMO 대류권계면 기압 스와스 `WMOTPPressure`가 있어 스와스 이름을 꼭 지정해 읽어야 합니다. 정밀도·품질 필드도 같은 스와스의 `Data Fields` 아래에 있습니다.
    아래 단위·유효 범위는 GES DISC V006 컬렉션 설명 기준입니다. 반드시 v6 품질 문서의 선별 규칙(정밀도 > 0, Status 짝수, Quality·Convergence 문턱, 유효 기압 범위)을 적용하세요.
    L3(netCDF4)는 성분·격자마다 그룹(예: `O3 PressureGrid`, `O3 PressureZM`)이 있고 그 안에 같은 이름의 통계 변수가 들어 있습니다.
  full_list: https://mls.jpl.nasa.gov/data/v6-0_data_quality_document.pdf
  groups:
    - name: L2 연직 분포 (성분별 HDF-EOS5 파일, 변수명은 `스와스/L2gpValue`)
      kind: instant
      period: 관측 시각
      items:
        - text: "기온 — `Temperature/L2gpValue` (K)"
          note: "ML2T 컬렉션, 118·240 GHz, 261~0.00046 hPa. 같은 파일의 `WMOTPPressure/L2gpValue`는 WMO 대류권계면 기압(hPa)"
        - text: "수증기 혼합비 — `H2O/L2gpValue` (부피 혼합비)"
          std: [q]
          note: "ML2H2O 컬렉션, 190 GHz, 316~0.001 hPa"
        - text: "오존 혼합비 — `O3/L2gpValue` (부피 혼합비)"
          note: "ML2O3 컬렉션, 240 GHz, 261~0.001 hPa. 같은 파일에 대류권계면 위 오존 기둥량 스와스 `O3 column`도 있음"
        - text: "지오퍼텐셜 고도 — `GPH/L2gpValue` (m)"
          std: [z]
          note: "ML2GPH 컬렉션"
        - text: "얼음 기준 상대습도 — `RHI/L2gpValue` (%)"
          note: "ML2RHI 컬렉션"
        - text: "기타 성분 — `ClO/L2gpValue`, `HCl/L2gpValue`, `HNO3/L2gpValue`, `N2O/L2gpValue`, `CO/L2gpValue`, `HCN/L2gpValue`, `SO2/L2gpValue`, `OH/L2gpValue`, `HO2/L2gpValue`, `BrO/L2gpValue` (부피 혼합비)"
          note: "컬렉션 ML2CLO·ML2HCL·ML2HNO3·ML2N2O·ML2CO·ML2HCN·ML2SO2·ML2OH·ML2HO2·ML2BRO 등. 성분마다 유효 범위·선별 기준이 다름"
    - name: L2 품질 필드 (모든 성분 공통)
      kind: instant
      period: 관측 시각
      items:
        - "1σ 정밀도 — `L2gpPrecision` (값과 같은 단위, 0 이하이면 버림)"
        - "상태 비트 — `Status` (홀수면 버림, 짝수라도 0이 아니면 주의)"
        - "품질 지표 — `Quality` (문턱보다 커야 사용)"
        - "수렴 지표 — `Convergence` (문턱보다 작아야 사용)"
    - name: L3 (netCDF4, 품질 선별 후 평균)
      kind: mean
      period: 일/월
      items:
        - text: "월 binned 성분별 평균·최소·최대·표준편차 — `value`, `minimum`, `maximum`, `std_dev` (성분별 단위)"
          std: [t_air, ozone, q]
          note: "ML3MBT 기온, ML3MBO3 오존, ML3MBH2O 수증기 등. 그룹 `<성분> PressureGrid`·`ThetaGrid`(경위도 격자)와 `PressureZM`·`ThetaZM`·`EqLZM`(동서 평균)·`VortexAvg` 안에 있고, 측정 불확도 `rms_uncertainty`와 표본 수 `nvalues`도 함께 있음"
        - text: "일 binned·일 동서 평균 — `value`, `minimum`, `maximum`, `std_dev` (성분별 단위)"
          note: "일 binned는 ML3DB*(경위도 격자 포함), 일 동서 평균은 ML3DZ*(`<성분> PressureZM`·`ThetaZM`·`EqLZM`·`VortexAvg` 그룹, 상승·하강·주간·야간 그룹 따로). `rms_uncertainty`·`nvalues`도 함께 있음"

