# ─────────────────────────────────────────────────────────────
# Aura MLS (Microwave Limb Sounder) Version 6 / Version 5 — 데이터셋 정보 파일
# 위성 탭(기온·수증기). 2026년 3월 공개된 v6가 새 연구 권장판이고, v5도 당분간 함께 생산됩니다.
# 190 GHz 수신기 간헐 운용(2024-05~, 수증기·N2O 공백)과 Aura 과학 운용 종료 전망(2028년 8월)이 핵심 주의사항입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: aura-mls
name: "Aura MLS"
full_name: EOS Aura Microwave Limb Sounder (MLS) Level 2·Level 3 Version 6 (Aura 위성 마이크로파 림 탐측기 성층권·중간권 기온·오존·수증기 등 연직 분포)
category: satellite
domain: satellite
group: 기온·수증기
order: 50
domains: [대기, 원격탐사]
provider: NASA JPL Aura MLS 팀 / NASA GES DISC

status: active
status_note: >-
  2004년 8월부터 이어진 기록을 전부 다시 처리한 Version 6가 2026년 3월 공개되었고, MLS 팀은 새 연구에 v6를 쓰라고 권장합니다. v5도 기존 연구가 끊기지 않도록 당분간 함께 생산됩니다
  (2026-10-13 확인 시 L2 v6·v5 모두 10월 11일 자료까지). 다만 수명이 다해 가는 190 GHz 수신기를 2024년 5월부터 한 달에 며칠만 켜고 있어 수증기·N2O 등은 매달 대부분 기간이 비며,
  NASA는 전력 한계로 Aura의 과학 운용이 2028년 8월 끝날 것으로 내다봅니다.

transitions:
  - from: MLS v5.0x
    to: MLS v6.0x
    status: completed
    date: "2026-03"
    summary: >-
      v6는 190 GHz 수신기 보정 표류를 바로잡고 118 GHz 기온 채널 모양을 고쳐 전 기간을 다시 처리한 판입니다. N2O와 기온이 가장 크게 바뀌었고,
      v5 전방 처리(forward processing)는 당분간 계속됩니다.
    changes:
      - aspect: 공개 시점
        before: "v5 (L2 기온 V005 인용 정보 기준 2020-06-11)"
        after: "v6 (L2 기온·오존·수증기 V006 인용 정보 기준 2026-03-30, 품질 문서 v6.0-1.0은 2026-03-26)"
      - aspect: 처리 소프트웨어
        before: v5.0x (현재 파일 이름 v05-04)
        after: "v6.0x — 대부분 기록은 v6.01, 최근 자료는 v6.03 (파일 이름 v06-01·v06-03)"
      - aspect: N2O
        before: "190 GHz 수신기 보정 표류(2010년 무렵부터 10년에 약 1.3%)가 그대로 남음"
        after: 표류 보정 — 하부 성층권(100~10 hPa), 특히 열대에서 값이 최대 20% 커짐
      - aspect: 기온
        before: 118 GHz 채널 일부만 사용
        after: "118 GHz 채널 모양을 고쳐 Band 1 복사량을 모두 사용 — 10~0.1 hPa에서 정밀도 최대 20%, 연직 해상도 최대 30% 개선"
      - aspect: 수증기
        before: "190 GHz 표류 보정을 이미 적용(v5.0x) — ACE-FTS 대비 표류 제거"
        after: "v6에서도 같은 계열 보정. 서리점 존데 대비 표류는 아직 남아 있음"
      - aspect: Status 구름 플래그 의미
        before: 구름이 있었음을 표시
        after: 구름 때문에 특정 복사량을 retrieval에서 뺐음을 표시
    impacts:
      - v5와 v6를 한 시계열로 섞지 마세요. 특히 N2O, 기온(중상층 성층권~중간권), 수증기·HCN·상층 HNO3는 판에 따라 값이 다릅니다.
      - 자료 선별 규칙(Quality·Convergence 문턱, 유효 기압 범위)이 판마다 다릅니다. v6를 쓸 때는 v6 품질 문서의 표를 다시 확인하세요.
      - v5 전방 처리는 '당분간' 계속된다고만 밝혔으므로, 새 분석은 v6로 시작하는 것이 안전합니다.
    sources:
      - name: Aura MLS v6.0x Level 2 and 3 data quality and description document (v6.0-1.0, 2026-03-26)
        url: https://mls.jpl.nasa.gov/data/v6-0_data_quality_document.pdf
      - name: Aura MLS 홈페이지 (v6 공개·190 GHz 운용 안내)
        url: https://mls.jpl.nasa.gov/

period:
  start: "2004-08"
  end: present
  note: >-
    L2 표준 산출은 2004-08-02부터 매일 하나의 파일로 나옵니다. 2026-10-13 확인 시 L2 v6(ML2T 006)과 v5(ML2T 005) 모두 2026-10-11 자료까지 있습니다.
    L3 v6(netCDF4)은 GES DISC에 채워지는 중이며(2026-09 기준 월 binned 기온은 2005년 파일만 확인), L3 v5는 그대로 제공됩니다.
    2024년 5월 이후 수증기·N2O·HCN·상층 HNO3는 190 GHz 수신기를 켠 날(한 달에 며칠)에만 있습니다.

resolution:
  spatial_short: "165 km (1.5°)"
  temporal_short: "1일"
  spatial: >-
    L2: 궤도를 따라 1.5° 간격(약 165 km)의 연직 분포, 하루 약 15궤도, 82°S–82°N /
    L3: 월·일 binned 격자(V005 월 binned 기온 ML3MBT 기준 위도 4° × 경도 5°)와 동서 평균
  vertical: >-
    고정 기압 격자: 기온·수증기·오존·상대습도는 1000~1 hPa에서 기압 10배당 12개 면, 대부분 산출물은 10배당 6개 면(약 2.5 km), 0.1 hPa 위는 3개 면.
    유효 범위 기온 261~0.00046 hPa(연직 해상도 3~6 km), 오존 261~0.001 hPa(2.5~6 km), 수증기 316~0.001 hPa(316 hPa에서 약 1.5 km, 0.1 hPa 위 15 km)
  temporal: >-
    L2: 하루 파일(UTC 하루) 안에 궤도를 따라 관측 시각별 연직 분포 / L3: 일·월. 준실시간 L2(NRT, V005)는 약 3시간 안, 15분 단위 파일로 7일간 보관

coverage:
  short: 전지구
  note: "82°S–82°N"
update: "매일 (L2 표준 산출은 보통 관측 후 1~3일 안에 GES DISC에 올라옴, NRT는 약 3시간)"
