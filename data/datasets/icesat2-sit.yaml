# ─────────────────────────────────────────────────────────────
# ICESat-2 — 데이터셋 정보 파일
# 격자: IS2SITMOGR4 v4(월 해빙 두께, 북극) · ATL20 v5(일·월 프리보드) / 궤도: ATL07 v7(해빙 높이) · ATL10 v7(프리보드) — NSIDC DAAC 배포
# ─────────────────────────────────────────────────────────────
id: icesat2-sit
name: ICESat-2
full_name: >-
  ICESat-2 L4 Monthly Gridded Sea Ice Thickness (IS2SITMOGR4, Version 4) · ATLAS/ICESat-2 L3B Daily and Monthly Gridded Sea Ice Freeboard (ATL20, Version 5)
  외 궤도 자료 ATL07(L3A Sea Ice Height)·ATL10(L3A Sea Ice Freeboard) Version 7 (NASA ICESat-2 레이저 고도계 기반 해빙 프리보드·두께)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 60
domains: [해빙]
provider: >-
  NASA ICESat-2 사업·과학팀(ATL07·ATL10·ATL20, Kwok 외) / IS2SITMOGR4는 Petty 외 연구팀(CMR 표기 기관 UMD/ESSIC) — 배포 NASA NSIDC DAAC(Earthdata Cloud)

status: active
status_note: >-
  궤도 자료 ATL07·ATL10은 2025-10-07 공개된 Version 7(Release 007)이 최신이며, v6는 2026-04-07 내려졌습니다. 격자 프리보드 ATL20은 v5(2025-11-04 공개),
  월 두께 IS2SITMOGR4는 v4(2025-11-25 공개, ATL10 v7 기반)이고 2026-08-27 2025/26 겨울분(2025-09~2026-04)이 추가되었습니다.
  2026-10-12 현재 정규 ATL10은 2026-07-20, ATL20은 2026-02, IS2SITMOGR4는 2026-04까지 있으며, 최근 며칠은 Quick Look 자료로만 있습니다.

period:
  start: "2018-10"
  end: present
  note: >-
    ICESat-2 과학 자료는 2018-10-14부터입니다. 확인 시점(2026-10-12, NASA CMR 기준) 마지막 자료는 ATL07·ATL10 v7 2026-07-20, ATL20 v5 2026-02(월),
    IS2SITMOGR4 v4 2026-04(월), Quick Look ATL10QL 2026-10-08입니다. IS2SITMOGR4는 북극 겨울만 있어 첫 겨울은 2018-11~2019-04, 이후는 매년 9월~4월입니다.
    위성 안전 모드로 2022-04-04 ~ 04-16, 2024-05-10 ~ 06-21에 과학 자료가 없습니다(2019년 6~7월도 일부 공백).

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    격자(ATL20·IS2SITMOGR4): 25 km NSIDC Sea Ice Polar Stereographic 격자 — 북반구 EPSG:3411(ATL20 기준 448행 × 304열), 남반구 EPSG:3412(332 × 316, ATL20만).
    ATL20은 해빙 농도 50% 이상이고 해안에서 25 km 이상 떨어진 곳(북 37~89°N, 남 53~79°S), IS2SITMOGR4는 88°N 이남 북극해와 주변 바다.
    궤도(ATL07·ATL10): 측정 구간 단위 — ATL07은 신호 광자 약 150개가 모이는 길이의 가변 구간(강한 빔은 10 m 고정 구간도 제공),
    ATL10은 그 구간마다 10 km 구간의 리드(lead) 기준 수면에서 잰 프리보드. 위경도는 WGS 84
  vertical: 해당 없음 (프리보드·두께·눈 깊이 단일 값)
  temporal: >-
    ATL20 일 합성장(그날 궤도)·월 합성장(달력 월), IS2SITMOGR4 월평균(9~4월), ATL07·ATL10 측정 시각별 궤도 자료(같은 궤도 91일 반복)

update: >-
  정규 ATL07·ATL10은 수개월 지연으로 갱신(확인 시점 마지막 2026-07-20). Quick Look(ATL07QL·ATL10QL)은 3~5일 지연이며 정규 자료가 나오면 삭제됩니다.
  ATL20은 "1년에 몇 차례", IS2SITMOGR4는 겨울 전체분을 이듬해 늦봄~초여름에 한꺼번에 공개(ATL10 생산이 늦으면 지연, 2025/26 겨울은 2026-08-27)
