account_required: true

summary: >-
  NASA ICESat-2의 광자 계수 레이저 고도계(ATLAS)로 해빙과 리드(얼음 사이 수면)의 높이를 재어 총 프리보드(눈 포함, 수면 위 높이)를 구하고,
  눈 깊이·밀도를 가정해 해빙 두께로 바꾼 자료입니다. 연구용으로는 월 25 km 격자 두께 IS2SITMOGR4(북극 겨울, NESOSIM 눈 모델 사용)와
  일·월 25 km 격자 프리보드 ATL20(남·북극, 사계절)을 주로 쓰며, 궤도 단위 해빙 높이 ATL07과 프리보드 ATL10이 그 원자료입니다.
  레이저라 레이더 고도계(CryoSat-2)와 달리 눈 표면을 재므로, 두께로 바꿀 때 눈 깊이 가정이 결과를 크게 좌우합니다.

time_convention:
  summary: >-
    격자 자료는 기간 평균입니다. ATL20의 일 합성장은 그날, 월 합성장은 달력 월(1일~말일) 동안 격자 칸을 지난 프리보드 구간을 구간 길이로 가중 평균한 값이고,
    IS2SITMOGR4는 같은 달의 궤도 두께를 25 km 격자로 모은 월평균입니다. 궤도 자료(ATL07·ATL10)는 측정 시각의 순간값입니다.
  points:
    - "궤도가 듬성듬성 지나가므로 월평균 격자 칸이 실제로는 하루 이틀의 관측만 담는 경우가 흔합니다(ATL20 Known Issues: 최소 관측 일수 조건 없음). IS2SITMOGR4의 `mean_day_of_month`, ATL20의 `n_segs`·`delta_time_beg`/`delta_time_end`로 확인하세요."
    - "ATL20 파일 이름의 날짜·시각(예: ATL20-01_20260201003450_…)은 그달 처음 쓴 ATL10 파일의 시각이지 월말이나 월 중앙이 아닙니다. IS2SITMOGR4 파일 이름(IS2SITMOGR4_01_202604_007_004.nc)은 연월·ATL10 버전·제품 버전 순입니다."
    - "궤도 자료의 `delta_time`은 2018-01-01(ATLAS SDP epoch) 기준 GPS 초입니다. GPS 기준 초로 바꾸려면 `/ancillary_data/atlas_sdp_gps_epoch`를 더하며, GPS 시각과 UTC는 윤초만큼 다릅니다."
    - "IS2SITMOGR4의 눈 깊이·밀도는 하루 단위 NESOSIM 값을 ICESat-2 관측 위치·날짜에서 뽑은 뒤 월평균한 것이고, `sea_ice_conc`는 ICESat-2로 추출하지 않은 월 평균 농도(NOAA/NSIDC CDR v4)입니다."
  source: https://nsidc.org/sites/default/files/documents/user-guide/is2sitmogr4-v004-userguide.pdf
  source_name: NSIDC 사용자 안내서 IS2SITMOGR4 v4 · ATL20 v5 · ATL07/ATL10 v7, ATL20/ATL21 Known Issues

variables:
  note: >-
    NSIDC 사용자 안내서와 데이터 사전(IS2SITMOGR4 v4, ATL20 v5, ATL07·ATL10 v7)에서 확인한 이름입니다. IS2SITMOGR4는 netCDF-4 변수,
    ATL 제품은 HDF5 경로(`gtx`는 6개 빔 gt1l~gt3r)입니다.
  full_list: https://nsidc.org/sites/default/files/documents/technical-reference/icesat2_atl20_data_dict_v005.pdf
  groups:
    - name: 월 격자 해빙 두께 (IS2SITMOGR4, 북극 9~4월)
      kind: mean
      period: 월
      items:
        - text: "해빙 두께 — `ice_thickness` (m)"
          note: 기본 변수. NESOSIM v1.1 눈 적재와 해빙 밀도 916 kg m-3로 계산
        - text: "해빙 두께 총 불확실성 — `ice_thickness_unc` (m)"
          note: 계통 오차만 포함(무작위 오차는 25 km 격자에서 상쇄된다고 가정, 대표성·표본 오차 제외). 프리보드·눈 깊이·눈 밀도·해빙 밀도별 성분 변수도 있음
        - text: "내삽·평활 해빙 두께 — `ice_thickness_int` (m)"
          note: 들로네 선형 내삽 + 가우시안 필터, 자료에서 50 km 넘게 떨어진 곳과 농도 50% 미만은 가림. 안내서는 '아직 거칠다'며 주의 당부
        - text: "다른 가정의 해빙 두께 — `ice_thickness_mw99`, `ice_thickness_sm_e5`, `ice_thickness_sm_m2`, `ice_thickness_j22` (m)"
          note: 수정 Warren 눈 기후값, SnowModel-LG(ERA5·MERRA-2 강제), Jutila et al. (2022) 실험적 해빙 밀도. 기본 변수보다 주의해서 사용
    - name: 월 격자 프리보드·눈·보조 정보 (IS2SITMOGR4)
      kind: mean
      period: 월
      items:
        - text: "총 프리보드 — `freeboard` (m)"
          note: ATL10 v7 프리보드(눈 표면 기준)의 월평균. 내삽본 `freeboard_int`
        - "눈 깊이 — `snow_depth` (m)"
        - "눈 밀도 — `snow_density` (kg m-3)"
        - text: "해빙 밀도 — `ice_density` (kg m-3)"
          kind: static
          note: 916 kg m-3 고정값
        - text: "해빙 농도 — `sea_ice_conc` (0–1)"
          note: NOAA/NSIDC CDR v4 월평균, 0.15 미만은 가림
        - text: "격자 칸의 유효 두께 구간 수 — `num_segments` (개)"
        - text: "격자 칸 관측일의 평균 날짜 — `mean_day_of_month` (일)"
        - text: "격자 칸 면적 — `grid_cell_area` (m2)"
          kind: static
    - name: 일·월 격자 프리보드 (ATL20, 남·북극)
      kind: mean
      period: 일·월
      items:
        - text: "월평균 프리보드 — `/monthly/mean_fb` (m)"
          period: 월
          note: 구간 길이 가중 평균. 같은 그룹에 `n_segs`(구간 수), `length_sum`(구간 길이 합, m), `sigma`(표준편차, m)
        - text: "일평균 프리보드 — `/daily/dayxx/mean_fb` (m)"
          period: 일
          note: 그달 날짜별 하위 그룹(dayxx). 실제 하위 그룹 이름은 파일에서 확인
        - text: "격자 좌표·육지 마스크 — `/grid_x`, `/grid_y` (m), `/grid_lat`, `/grid_lon` (도), `/land_mask_map` (0/1)"
          kind: static
          note: "land_mask_map은 1 육지, 0 바다·해빙"
    - name: 궤도 자료 (ATL07 해빙 높이 · ATL10 프리보드)
      kind: instant
      items:
        - text: "해빙·수면 높이 — `gtx/sea_ice_segments/heights/height_segment_height` (m)"
          note: ATL07. 해양 조석·역기압 보정 후 조석 없는(tide-free) 평균 해수면(MSS) 기준 높이
        - text: "구간 표면 종류·수면 후보 플래그 — `height_segment_type`, `height_segment_ssh_flag` (코드값)"
          note: ATL07. ssh_flag 1 = ATL10 기준 수면 후보(리드), 0 = 해빙
        - text: "빔별 프리보드 — `gtx/freeboard_segment/beam_fb_height` (m)"
          note: ATL10. 같은 빔의 리드로 만든 기준면(`gtx/reference_surface_section/beam_refsurf_height`)과의 높이 차. 불확실성 `beam_fb_unc`, 품질 `beam_fb_quality_flag`(1 최상 ~ 5 나쁨)
        - text: "리드 수면 높이 — `gtx/leads/lead_height` (m)"
          note: ATL10. 연속 수면 구간의 가중 평균, tide-free MSS 기준

access:
  - name: NSIDC — IS2SITMOGR4 v4 (월 격자 해빙 두께)
    url: https://nsidc.org/data/is2sitmogr4/versions/4
    method: Earthdata Search / earthaccess(Python) / HTTPS / NASA Earthdata Cloud(AWS us-west-2)
    note: >-
      무료 NASA Earthdata Login 계정이 필요합니다. 파일은 netCDF-4로 달마다 하나(IS2SITMOGR4_01_YYYYMM_007_004.nc, 01 = 북반구)이고
      미리보기 PNG가 함께 있습니다. CMR 버전 표기는 "4"입니다. 남반구(02)는 아직 없습니다.
  - name: NSIDC — ATL20 v5 (일·월 격자 프리보드)
    url: https://nsidc.org/data/atl20/versions/5
    method: Earthdata Search / earthaccess / HTTPS / NASA Earthdata Cloud
    note: >-
      HDF5, 반구별(01 북, 02 남) 월 파일 하나에 월 합성장과 날짜별 일 합성장이 함께 들어 있습니다. 같은 이름의 파일이 재처리되면 끝의 revision 번호가 큰 것을 쓰세요.
      최근 30일 이동 격자 Quick Look(ATL20QL v5, ATL10QL 기반)도 2026-06-16 공개되었습니다.
  - name: NSIDC — ATL10 v7 (궤도 프리보드) · ATL07 v7 (궤도 해빙 높이)
    url: https://nsidc.org/data/atl10/versions/7
    method: Earthdata Search / earthaccess / NSIDC Data Access Tool(잘라 받기) / Harmony
    note: >-
      하루 최대 32개 HDF5 파일(반구별 궤도 구간)입니다. ATL07은 https://nsidc.org/data/atl07/versions/7 에 있습니다.
      3~5일 지연 Quick Look(ATL07QL·ATL10QL v7)은 정규 파일이 나오면 지워지므로 연구 기록에는 정규 자료를 쓰세요.
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search/granules?p=C3878683537-NSIDC_CPRD
    method: 웹 검색·다운로드
    note: 링크는 IS2SITMOGR4 v4 컬렉션(C3878683537-NSIDC_CPRD)입니다. ATL20 v5는 C3825009052-NSIDC_CPRD입니다.

example:
  lang: python
  note: >-
    pip install earthaccess xarray h5py netCDF4 로 설치합니다. 처음 login()에서 Earthdata 계정을 입력하면 ~/.netrc에 저장할 수 있습니다.
    월 두께(IS2SITMOGR4)는 xarray로, ATL20은 HDF5 그룹 구조라 h5py로 읽습니다.
  code: |
    import earthaccess
    import h5py
    import numpy as np
    import xarray as xr

    earthaccess.login()  # NASA Earthdata Login

    # 1) 월 격자 해빙 두께 (IS2SITMOGR4 v4) — 2026년 3월
    res = earthaccess.search_data(short_name="IS2SITMOGR4", version="4",
                                  temporal=("2026-03-01", "2026-03-31"))
    files = earthaccess.download(res, "./is2sitmogr4")
    nc = [f for f in files if str(f).endswith(".nc")][0]
    ds = xr.open_dataset(nc)
    sit = ds["ice_thickness"].squeeze()            # m, NESOSIM 눈 적재 기준
    print(float(sit.mean()), float(ds["mean_day_of_month"].mean()))

    # 2) 월 격자 프리보드 (ATL20 v5) — 2026년 2월, 북반구(01)
    res = earthaccess.search_data(short_name="ATL20", version="005",
                                  temporal=("2026-02-01", "2026-02-28"))
    files = earthaccess.download(res, "./atl20")
    h5 = [f for f in files if "ATL20-01_" in str(f) and str(f).endswith(".h5")][0]
    with h5py.File(h5, "r") as h:
        v = h["monthly/mean_fb"]
        fb = v[:].astype(float)
        fill = v.attrs.get("_FillValue")
        if fill is not None:
            fb[fb == fill] = np.nan
        nseg = h["monthly/n_segs"][:]
        print(list(h["daily"].keys())[:3])        # 날짜별 일 합성장 그룹
    print(np.nanmean(fb))

tips:
  - >-
    ICESat-2 프리보드는 눈 표면까지의 '총 프리보드'입니다. 두께로 바꾸는 식에서 눈 깊이·밀도 가정이 가장 큰 오차 원인이므로, CryoSat-2(레이더, 얼음 표면 기준) 두께와
    비교할 때는 같은 눈 자료를 썼는지부터 맞추세요. IS2SITMOGR4 개발자는 NESOSIM 기반 기본 변수 `ice_thickness`를 권장하고, 다른 가정의 두께 변수는 주의해서 쓰라고 안내합니다.
  - >-
    IS2SITMOGR4의 SnowModel-LG 기반 변수(`*_sm_e5`, `*_sm_m2`)는 안내서 각주상 2021년 7월까지만 값이 있습니다. 최근 겨울에 이 변수를 쓰면 비어 있으니 기본 변수와 섞지 마세요.
  - >-
    9월 해빙 종류는 OSI SAF가 제공하지 않아 모두 다년빙으로 처리합니다. 또 2022년 4월은 안전 모드로 초순(Known Issues 표기 4월 4~11일) 입력이 빠져 월평균이 그달 후반 쪽으로 치우칩니다.
    격자 칸마다 관측일이 달라 지역 비교 시 `mean_day_of_month`를 꼭 보세요.
  - >-
    해빙 가장자리에서는 파도의 골이 기준 수면을 수십 cm 낮춰 프리보드가 과대 추정되는 10 km 구간이 남아 있습니다(ATL07/ATL10·ATL20 Known Issues).
    ATL10의 여러 빔 합성(swath) 프리보드는 빔 정렬 문제로 꺼져 있어 빔별 값(`beam_fb_height`)만 유효합니다.
  - >-
    버전을 섞지 마세요. v7에서 ATL10 기준면 계산 방식(10 km 기준면 고정값 → 이웃 기준면 보간)이 바뀌어 v6과 프리보드가 다르고, v6·ATL20 v4·IS2SITMOGR4 v3 파일은 더 이상 받을 수 없습니다.
    또 2026-01-15부터 ATL07·ATL10의 해빙 농도 입력이 AMSR2 기반 NRT CDR(G10016 v4)로 바뀌어 가장자리에서 아주 작은(0.4% 이하) 불연속이 있습니다.
  - >-
    ATL20은 여름 월도 만들지만 구름 때문에 자료가 크게 줄고, 표면 융해는 ATL10 산출을 어렵게 합니다(IS2SITMOGR4 Known Issues). IS2SITMOGR4는 9~4월만 있으며, 여름 두께는 Petty, Cabaj & Landy (2025)의
    '초기 평가' 연구 단계입니다. 88°N 이북은 궤도가 지나지 않는 극 구멍입니다.

transitions:
  - from: ICESat-2 Release 006
    to: ICESat-2 Release 007
    status: completed
    date: "2025-10"
    summary: 궤도 자료가 v7로 바뀌며 프리보드 기준면 계산이 달라졌고, 격자 프리보드·두께 제품도 차례로 새 버전으로 교체되어 이전 버전은 2026년에 내려졌습니다.
    changes:
      - aspect: 공개일
        before: ATL07·ATL10 v6 2023-08-03, ATL20 v4 2023-08-24, IS2SITMOGR4 v3 2023-12
        after: ATL07·ATL10 v7 2025-10-07, ATL20 v5 2025-11-04, IS2SITMOGR4 v4 2025-11-25
      - aspect: ATL10 기준 수면
        before: 10 km 기준면의 고정값으로 프리보드 계산
        after: 이웃 기준면이 있으면 기준면 높이를 보간해 계산, lognormal 분포 높이 선택 사용, `oc_depth` 오류(항상 0.0) 수정
      - aspect: ATL07 처리
        before: 약 150 광자 가변 구간만
        after: 강한 빔 10 m 고정 구간(`sea_ice_segments_10m`), DDA-Bifurcation 독립 높이, lognormal 기대 파형표, 동적 대기 보정(DAC) 추가
      - aspect: ATL20
        before: v4
        after: v5 — NetCDF 호환을 위한 grid_mapping·좌표계(crs) 변수 수정
      - aspect: IS2SITMOGR4
        before: v3 — ATL10 v6, SnowModel-LG는 ERA5 강제만
        after: v4 — ATL10 v7, SnowModel-LG MERRA-2 강제 추가, `grid_cell_area`·`time` 변수 추가
      - aspect: 이전 버전 제공 종료
        before: 제공
        after: IS2SITMOGR4 v3 2026-01, ATL07·ATL10 v6 2026-04-07, ATL20 v4 2026-05-11 내려짐
    impacts:
      - v6 이하로 만든 프리보드·두께 시계열을 v7 자료와 이어 붙이지 말고, 전체 기간을 v7로 다시 계산하세요.
      - v6 파일 이름(…_006_xx.h5)이나 IS2SITMOGR4 v3 파일 이름을 가정한 스크립트는 버전 번호를 고쳐야 합니다.
    sources:
      - name: NSIDC 공지 — ATL07·ATL10·ATL12 v7 공개 (2025-10-07)
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-atlasicesat-2-v7-along-track-products-atl07-atl10-and-atl12
      - name: ATL10 v7 사용자 안내서 (버전 이력)
        url: https://nsidc.org/sites/default/files/documents/user-guide/atl10-v007-userguide.pdf
      - name: ATL07 v7 사용자 안내서 (버전 이력)
        url: https://nsidc.org/sites/default/files/documents/user-guide/atl07-v007-userguide_0.pdf
      - name: ATL20 v5 사용자 안내서 (버전 이력)
        url: https://nsidc.org/sites/default/files/documents/user-guide/atl20-v005-userguide.pdf
      - name: IS2SITMOGR4 v4 사용자 안내서 (버전 이력)
        url: https://nsidc.org/sites/default/files/documents/user-guide/is2sitmogr4-v004-userguide.pdf

