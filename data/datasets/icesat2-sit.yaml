notices:
  - date: "2026-08-27"
    level: info
    title: IS2SITMOGR4 v4에 2025/26 겨울(2025-09 ~ 2026-04) 추가
    body: >-
      월 격자 해빙 두께 IS2SITMOGR4 Version 4에 2025년 9월 ~ 2026년 4월 월 파일이 추가되었습니다. 버전은 그대로 v4(ATL10 v7 기반)입니다.
      다음 겨울(2026/27)분은 관례상 2027년 늦봄~여름에 한꺼번에 나옵니다.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-update-icesat-2-l4-monthly-gridded-sea-ice-thickness-version-4
  - date: "2026-04-07"
    level: warning
    title: ATL07·ATL10 v6 제공 종료 (ATL20 v4는 2026-05-11 종료)
    body: >-
      NSIDC가 ATL07·ATL10·ATL12 Version 6을 2026-04-07 내렸고, 이후 ATL20 v4·ATL21 v3도 2026-05-11 내렸습니다. 문서는 각 자료 페이지에 남지만 파일은 받을 수 없습니다.
      v6로 만든 분석을 재현하려면 v7(ATL20은 v5)로 다시 계산해야 합니다.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-retirements-version-6-atlasicesat-2-sea-ice-and-ocean-surface-along-track-products
  - date: "2026-01-15"
    level: info
    title: ATL07·ATL10 해빙 농도 입력을 AMSR2 기반 NRT CDR(G10016 v4)로 교체
    body: >-
      입력으로 쓰던 SSM/I 계열 해빙 농도 자료가 종료되어 2026-01-15부터 AMSR2 기반 NOAA/NSIDC 준실시간 CDR(G10016 Version 4)로 바꿨습니다.
      한 달 겹침 비교에서 ATL07(농도 0.15)·ATL10(0.5) 기준선 차이는 해빙 가장자리에서 0.4% 이하였지만, 기록에 작은 불연속이 생깁니다.
    source: https://nsidc.org/sites/default/files/documents/technical-reference/icesat2_atl07_10_known_issues_v007_0.pdf
  - date: "2025-11-25"
    level: info
    title: IS2SITMOGR4 Version 4 공개 (ATL10 v7 기반)
    body: >-
      월 격자 해빙 두께가 ATL10 v7을 쓰는 Version 4로 바뀌었습니다. SnowModel-LG 눈 적재에 MERRA-2 강제가 더해졌고 `grid_cell_area`·`time` 변수가 추가되었습니다.
      v3는 2026년 1월 내려졌습니다. 앞서 2025-11-04에는 ATL20 v5가 공개되었습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-icesat-2-l4-monthly-gridded-sea-ice-thickness-version-4
  - date: "2025-10-07"
    level: warning
    title: ATL07·ATL10 Version 7(Release 007) 공개 — 프리보드 기준면 계산 변경
    body: >-
      궤도 해빙 높이·프리보드가 v7로 바뀌었습니다. ATL10은 기준 수면을 이웃 기준면 사이에서 보간해 프리보드를 계산하고, ATL07에는 10 m 고정 구간,
      DDA-Bifurcation 높이, 동적 대기 보정이 추가되었습니다. v6과 값이 다르므로 버전을 섞지 마세요.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-atlasicesat-2-v7-along-track-products-atl07-atl10-and-atl12
  - date: "2025-10-06"
    level: info
    title: ATL07·ATL10 Quick Look 중단 후 재개 (2025-09-30 ~ 11-14)
    body: >-
      미국 연방 예산 공백으로 입력 SSMIS(DMSP) 자료가 끊겨 Quick Look 자료(ATL07QL·ATL10QL)가 2025-09-30부터 나오지 않았고, 2025-11-14 재개되었습니다(2025-11-20 공지).
      정규 ATL07·ATL10 자료와는 별개입니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-atl07-and-atl10-quick-look-data-outage

