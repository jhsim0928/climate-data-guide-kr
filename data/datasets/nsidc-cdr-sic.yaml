  - name: NOAA NCEI Sea Ice Concentration CDR 페이지
    url: https://www.ncei.noaa.gov/products/climate-data-records/sea-ice-concentration
    method: 웹 안내 (문서·소스코드·성숙도 평가표)
  - name: NOAA PolarWatch에서 NSIDC 자료 받기 (도움말)
    url: https://nsidc.org/data/user-resources/help-center/how-access-noaansidc-data-sets-polarwatch
    method: ERDDAP (부분 추출·형식 변환)
    note: PolarWatch에 올라간 버전이 V6인지 데이터셋 ID에서 먼저 확인하세요.

example:
  lang: bash
  note: 로그인 없이 HTTPS로 받습니다. 파일명 규칙은 sic_ps<n|s>25_<YYYYMMDD>_<위성코드>_<vXXrXX>.nc 형식(위성코드 예 F17, am2)이므로 정확한 이름은 디렉터리 목록에서 확인하세요.
  code: |
    # 북반구 V6 일자료 디렉터리를 통째로 내려받기 (필요한 연도 폴더만 지정 권장)
    wget -r -np -nH --cut-dirs=3 -A "*.nc" -e robots=off \
      https://noaadata.apps.nsidc.org/NOAA/G02202_V6/north/daily/

    # Python에서 열 때는 보조 변수 그룹을 따로 지정
    # xr.open_dataset(f)                               -> cdr_seaice_conc 등
    # xr.open_dataset(f, group="cdr_supplementary")    -> raw_bt_seaice_conc 등

tips:
  - >-
    같은 날짜를 최종 CDR(G02202)과 준실시간 CDR(G10016) 양쪽에서 받으면 값이 다를 수 있습니다. 준실시간판은 일부 품질 관리와 시간 보간이
    빠진 예비 자료이므로, 논문 분석은 최종 CDR로 하고 최근 몇 주만 준실시간판으로 채운 뒤 나중에 교체하세요.
  - >-
    2025년 1월 1일부터 입력 센서가 SSMIS(F17)에서 AMSR2로 바뀌었습니다. NSIDC는 AMSR2를 SSMIS에 맞춰 보정해 차이가 자료 불확실성 범위 안이라고
    밝혔지만, 2025년 전후를 비교하는 추세·이상치 분석에서는 센서 교체 시점을 명시해 두는 것이 안전합니다.
  - >-
    북극점 관측 공백(pole hole)은 보간으로 채워져 있고 surface_type_mask에서 100으로 표시됩니다. 센서마다 크기가 달라(SMMR 84.1°N, SSM/I 86.7°N,
    SSMIS 89.0°N, AMSR2 88.5°N 이북) 늦여름·초가을 추세나 기후값 계산에 영향을 줄 수 있습니다.
  - >-
    이 극 평사도 격자는 등적 격자가 아니어서 셀마다 실제 면적이 다릅니다. 해빙 면적을 직접 계산할 때 25 km × 25 km를 그대로 곱하지 말고
    위도에 따른 셀 면적을 반영하세요.

