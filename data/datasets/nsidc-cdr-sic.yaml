# ─────────────────────────────────────────────────────────────
# NOAA/NSIDC 해빙 농도 CDR — 데이터셋 정보 파일
# G02202(최종 CDR) + G10016(준실시간 CDR)
# ─────────────────────────────────────────────────────────────
id: nsidc-cdr-sic
name: NOAA/NSIDC 해빙 농도 CDR
full_name: NOAA/NSIDC Climate Data Record of Passive Microwave Sea Ice Concentration (G02202, Version 6) / Near-Real-Time (G10016, Version 4)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 20
domains: [해빙, 해양]
provider: NOAA NCEI 기후자료기록(CDR) 프로그램 / 미국 국립빙설자료센터(NSIDC)

status: active
status_note: >-
  정상 제공 중입니다. 2026년 1월 15일 Version 6이 나오면서 2025년 1월 1일 이후 입력이 DMSP SSMIS에서 JAXA AMSR2로 바뀌었습니다.
  이전 버전(CDR V5, 준실시간 V3)은 2026년 6월 접근이 종료되었으니, 예전 경로를 쓰는 스크립트는 V6/V4 경로로 바꿔야 합니다.
  DMSP 임무 종료(2026년 9월 예정)는 V6 이후 갱신에 직접 영향을 주지 않습니다.

transitions:
  - from: NOAA/NSIDC CDR Version 5 (G02202 V5) / 준실시간 V3 (G10016 V3)
    to: NOAA/NSIDC CDR Version 6 (G02202 V6) / 준실시간 V4 (G10016 V4)
    status: completed
    date: "2026-01"
    summary: >-
      DMSP SSMIS의 노후화와 자료 공급 불안에 대비해 2025-01-01 이후 입력 밝기온도를 JAXA AMSR2로 바꾼 버전입니다.
      격자·변수 구성은 V5와 거의 같지만, V5에 따로 들어 있던 AMSR2 시험 그룹이 사라지고 해안 오염 보정 오류가 고쳐졌습니다.
      1978~2024년 값의 차이는 매우 작으나 V5는 2026년 6월 접근이 종료되어 전체 기록을 V6로 다시 받아야 합니다.
    changes:
      - aspect: 기간
        before: "1978-10-25 ~ 2024-12-31 (V5 최종 갱신은 2024년 말 구간까지)"
        after: "1978-10-25 ~ 현재 (최종 CDR 약 3주 지연, 그 이후는 준실시간 V4)"
      - aspect: 2025년 이후 입력 센서
        before: "DMSP-F17 SSMIS (2008-01-01부터)"
        after: "GCOM-W1 AMSR2 (2025-01-01부터). 18.7·23.8·36.5 GHz 채널 사용, 원래 12.5 km 자료를 25 km 격자로 재격자"
      - aspect: 센서 간 맞춤
        before: "SSMIS 기준 tie-point·회귀식으로 이전 센서와 상호 보정"
        after: "AMSR2에 위치별로 달라지는 해빙/바다 판정 문턱값(Seki et al. 2024 방법 응용)을 적용해 남은 반구 범위 편향 제거. 2023~2024 중복 기간 SSMIS와의 차이는 자료 불확실성 범위 안"
      - aspect: 알고리즘 오류 수정
        before: "해안 육지 오염(land spillover) 보정 때 10% 미만 농도 값도 계산에 포함되는 오류"
        after: "오류 수정 — 해빙 범위가 약간 늘며 주로 SMMR 구간(1978~1987)에서 나타남. Python 라이브러리(NumPy, Xarray) 갱신에 따른 미세한 반올림 차이도 있음"
      - aspect: 1978~2024년 값 차이 (V6 − V5 해빙 범위)
        before: "V5 값"
        after: "평균 차이 북반구 0.00066, 남반구 0.0010 백만 km² / 일 최대 차이 북반구 0.022, 남반구 0.078 백만 km² (NSIDC Special Report 29)"
      - aspect: AMSR2 시험 자료
        before: "prototype_am2 그룹(2013년~)에 `am2_seaice_conc`, `am2_seaice_conc_stdev`, `am2_seaice_conc_qa_flag` 등 별도 제공"
        after: "prototype_am2 그룹 삭제 — AMSR2는 2025년부터 본 CDR 변수(`cdr_seaice_conc` 등)에 직접 들어감"
      - aspect: 변수 이름·그룹 구조
        before: "V5에서 정리된 구조: 기본 그룹 `cdr_seaice_conc`·`cdr_seaice_conc_stdev`·QA·보간 플래그, cdr_supplementary 그룹 `raw_bt_seaice_conc`·`raw_nt_seaice_conc`·`surface_type_mask`·`cdr_melt_onset_day` (V4의 `nsidc_bt_seaice_conc`·`nsidc_nt_seaice_conc`는 V5에서 이 구조로 바뀜)"
        after: "V5와 같은 이름·그룹 구조 유지 (prototype_am2 그룹만 삭제)"
      - aspect: 북극점 관측 공백
        before: "SSMIS F17 — 89.02°N 이북, 0.0292 백만 km²"
        after: "2025년 이후 AMSR2 — 88.5°N 이북, 0.064 백만 km² (보간으로 채움)"
      - aspect: 파일 이름
        before: "sic_ps[n|s]25_[날짜]_F17_[버전].nc (2008~2024)"
        after: "2025년 이후 위성 코드가 am2로 바뀜: sic_ps[n|s]25_[날짜]_am2_[버전].nc"
      - aspect: 받는 곳·DOI
        before: "G02202 V5, DOI 10.7265/rjzb-pf78 / 준실시간 V3, DOI 10.7265/j0z0-4h87"
        after: "https://noaadata.apps.nsidc.org/NOAA/G02202_V6/, DOI 10.7265/b18j-z797 / 준실시간 V4 https://noaadata.apps.nsidc.org/NOAA/G10016_V4/, DOI 10.7265/tm2n-1m33"
      - aspect: 준실시간 판 입력
        before: "V3 — SSMIS 기반 + AMSR2 시험 그룹(2025-09-01 AMSR2 시험 자료 중단)"
        after: "V4 — 2025-01-01부터 AMSR2 입력, V6와 같은 코드 사용"
      - aspect: 이전 버전 지원
        before: "V5·준실시간 V3 — 2026-01-15부터 갱신 중단"
        after: "2026-06-17 V5·V3 접근 종료, V6·V4만 제공"
    impacts:
      - 예전에 받은 V5 파일은 더 이상 공식 배포되지 않으므로, 새 분석은 1978년부터 전체 기록을 V6로 다시 받아 쓰세요. V5와 V6를 한 시계열에 섞지 마세요.
      - 2025-01-01을 경계로 입력 센서가 SSMIS에서 AMSR2로 바뀝니다. NSIDC는 차이가 불확실성 범위 안이라고 밝혔지만, 2025년 전후를 비교하는 이상치·추세 분석에서는 센서 교체 시점을 명시하고 민감도를 점검하세요.
      - "`prototype_am2` 그룹을 읽던 스크립트와 파일명에 `F17`을 고정해 둔 스크립트는 2025년 이후 자료에서 실패합니다. 기본 CDR 변수와 `am2` 위성 코드로 바꾸세요."
      - SMMR 구간(1978~1987)은 해안 보정 오류 수정으로 해빙 범위가 V5보다 조금 커졌습니다. 1980년대 기준 기후값이나 장기 추세를 V5 결과와 비교할 때 이 차이를 감안하세요.
      - 인용 DOI가 바뀌었습니다. 논문에는 V6(10.7265/b18j-z797)와, 최근 기간을 준실시간판으로 채웠다면 V4(10.7265/tm2n-1m33)를 함께 적으세요.
    sources:
      - name: NSIDC 공지 — CDR Version 6·준실시간 Version 4 공개 (2026-01-15)
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-concentration-data-records-cdr-version-6-and-near-real-time
      - name: NSIDC Special Report 29 — CDR Version 6 Updates (Windnagel, Meier, Fetterer, 2026)
        url: https://nsidc.org/sites/default/files/documents/other/nsidc-special-report-29.pdf
      - name: G02202 V6 사용자 가이드
        url: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v006-userguide.pdf
      - name: G02202 V5 사용자 가이드
        url: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v005-userguide.pdf
      - name: G10016 V4 사용자 가이드
        url: https://nsidc.org/sites/default/files/documents/user-guide/g10016-v004-userguide.pdf
      - name: NOAA@NSIDC 자료 갱신 내역 (V5·V3 퇴역 2026-06-17)
        url: https://nsidc.org/data/data-programs/noaa-nsidc/data-updates

period:
  start: "1978-10"
  end: present
  note: >-
    일자료는 1978-10-25, 월자료는 1978-11부터 시작합니다. 최종 CDR(G02202)은 약 3주 늦게 따라오며, 그 사이와 최근 약 3개월은
    준실시간 CDR(G10016)이 채웁니다. 1987년 12월 초~1988년 1월 중순은 위성 문제로 자료가 없습니다.

resolution:
  spatial: "25 km NSIDC 극 평사도법 격자(북반구 EPSG:3411, 448×304 / 남반구 EPSG:3412), 70° 위도에서 실제 축척"
  vertical: 해당 없음 (지표면 자료)
  temporal: 일·월

update: 최종 CDR은 자료가 쌓이는 대로 갱신(약 3주 지연), 준실시간 CDR은 매일 갱신(최근 약 3개월분 제공)
license: 공개 자료(NOAA). 데이터셋 인용이 이용 조건이며, 사용한 부분(기간·반구)을 인용문에 함께 적도록 권고
account_required: false

summary: >-
  NOAA CDR 프로그램의 일환으로 NSIDC가 만드는 1978년 이후 북·남반구 해빙 농도 기후자료입니다.
  NASA Team과 Bootstrap 두 알고리즘 결과를 결합해 CDR 농도를 만들고, 두 알고리즘의 차이를 불확실성 지표(표준편차)로 함께 제공합니다.
  SMMR, SSM/I, SSMIS에 이어 2025년부터는 AMSR2 밝기온도를 입력으로 써서, 같은 25 km 극 평사도 격자 위에서 기록을 이어 갑니다.
  NSIDC Sea Ice Index의 기반 자료와 같은 계열이라 북극·남극 해빙 면적·범위 연구에 널리 쓰입니다.

time_convention:
  summary: >-
    일자료는 하루 동안 지나간 위성 궤도의 밝기온도를 격자마다 합산 평균(drop-in-the-bucket)한 일별 밝기온도로 계산한 하루 대표값(일평균 성격)입니다.
    월자료는 같은 격자의 일별 농도를 평균한 값이며, 특정 시각의 순간값이 아닙니다.
  points:
    - "일별 입력 밝기온도는 NSIDC 극 격자 밝기온도 자료(NSIDC-0001 등)에서 24시간 궤도 자료를 격자별로 단순 평균해 만듭니다. CDR 사용자 가이드는 하루 경계(UTC 여부)를 따로 밝히지 않습니다."
    - "관측이 빈 날·격자는 앞뒤 날짜로 선형 보간(양쪽 방식)하고, 안 되면 3일 이내 가장 가까운 날 값을 복사합니다. 보간 여부는 cdr_seaice_conc_interp_temporal_flag·_spatial_flag와 QA 플래그로 확인하세요."
    - "월평균은 일별 값의 격자별 평균이며 최소 20일(SMMR 시기 10일) 자료가 있어야 만들어집니다. 월 표준편차는 그 달 일별 값들의 표준편차입니다."
    - "SMMR 시기(1978-10 ~ 1987-07)도 날짜별 파일은 있지만 자료가 없는 날은 채움값(fill value)이 들어 있습니다. 1987-12-03 ~ 1988-01 중순은 파일 자체가 없습니다."
    - "일자료의 time은 'days since 1970-01-01 00:00:00' 형식의 날짜이며, 하루 중 특정 시각을 뜻하지 않습니다."
  source: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v006-userguide.pdf
  source_name: G02202 V6 사용자 가이드 / NSIDC-0001 V6 데이터셋 페이지

variables:
  note: >-
    V6 사용자 가이드 기준 일자료 변수입니다. 농도는 0~100 바이트로 저장되며 scale_factor 0.01이 적용되어 보통 0~1 비율로 읽힙니다.
    보조 변수는 cdr_supplementary 그룹 안에 있습니다. 월자료는 `cdr_seaice_conc_monthly`, `cdr_seaice_conc_monthly_stdev`, `cdr_seaice_conc_monthly_qa` 이름을 씁니다.
    V4의 `nsidc_bt_seaice_conc`·`nsidc_nt_seaice_conc`는 V5부터 `raw_bt_seaice_conc`·`raw_nt_seaice_conc`로 바뀌었습니다.
  full_list: https://nsidc.org/sites/default/files/documents/user-guide/g02202-v006-userguide.pdf
  groups:
    - name: 해빙 농도 (기본 그룹)
      kind: mean
      period: 일
      items:
        - text: "CDR 해빙 농도 — `cdr_seaice_conc` (무차원, 0–1)"
          note: 일별 평균 밝기온도로 계산한 하루 대표값. 월자료의 `cdr_seaice_conc_monthly`는 일별 값의 월평균
        - text: "CDR 농도 표준편차(불확실성 지표) — `cdr_seaice_conc_stdev` (무차원, 0–1)"
          note: 그날 일별 장에서 주변 3×3 격자의 NASA Team·Bootstrap 값 18개로 구한 공간 표준편차(시간 통계 아님). 월자료의 `cdr_seaice_conc_monthly_stdev`는 그 달 일별 값의 표준편차
    - name: 품질·보간 플래그 (기본 그룹)
      kind: mean
      period: 일
      items:
        - text: "QA 비트 플래그(기상 필터, 해안 보정, 결측, 보간, 융빙 시작 등) — `cdr_seaice_conc_qa_flag` (비트값)"
          note: 그날 일별 농도에 적용된 처리를 날짜별로 표시하는 플래그. 시간 통계값이 아니라 일별 장에 딸린 정보
        - text: "공간 보간 플래그 — `cdr_seaice_conc_interp_spatial_flag` (비트값)"
          note: 그날 일별 장에서 공간 보간된 격자 표시
        - text: "시간 보간 플래그 — `cdr_seaice_conc_interp_temporal_flag` (비트값)"
          note: 그날 값이 앞뒤 날짜에서 시간 보간되었는지 표시
    - name: 보조 변수 (cdr_supplementary 그룹)
      kind: mean
      items:
        - text: "Bootstrap 알고리즘 원시 농도 — `raw_bt_seaice_conc` (무차원, 0–2.54)"
          period: 일
          note: CDR 농도와 같은 일별 밝기온도로 계산, 기상 필터·해안 보정·마스크 미적용
        - text: "NASA Team 알고리즘 원시 농도 — `raw_nt_seaice_conc` (무차원, 0–2.54)"
          period: 일
          note: CDR 농도와 같은 일별 밝기온도로 계산, 기상 필터·해안 보정·마스크 미적용
        - text: "융빙 시작일(북반구) — `cdr_melt_onset_day` (연중 일수)"
          kind: instant
          note: 그 해 융빙기에 처음 융빙이 감지된 날(연중 일수 60~244). 한 번 감지되면 그 시즌 끝까지 같은 값이 유지되므로 '그날까지의 누적 판정 상태'로 읽어야 함
        - text: "지표 유형 마스크(바다 50, 호수 75, 극 관측공백 100, 해안 200, 육지 250) — `surface_type_mask` (코드값)"
          kind: static
          note: 고정 지표 마스크. 파일에 time 차원은 있으나 가이드에 시간 변화 언급은 없음. 센서별로 달라지는 극 관측공백 크기는 별도 보조 자료(polehole_bitmask)로 관리

