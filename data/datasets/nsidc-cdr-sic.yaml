notices:
  - date: "2026-06-17"
    level: critical
    title: CDR V5·준실시간 V3 접근 종료
    body: >-
      해빙 농도 CDR Version 5와 준실시간 CDR Version 3이 퇴역해 다운로드가 막혔습니다. 예전 경로(G02202_V5, G10016_V3)를 쓰는
      스크립트는 V6(G02202_V6)·V4(G10016_V4)로 바꿔야 합니다.
    source: https://nsidc.org/data/data-programs/noaa-nsidc/data-updates
  - date: "2026-01-15"
    level: warning
    title: CDR Version 6·준실시간 Version 4 공개 — 2025년부터 AMSR2 입력
    body: >-
      2025-01-01부터 AMSR2 밝기온도를 입력으로 추가했고, V5에 있던 AMSR2 시험 그룹(prototype_am2)을 없앴으며,
      해안 오염 보정 때 10% 미만 값이 섞이던 오류를 고쳤습니다. 수정으로 V6 해빙 범위가 V5보다 약간 커졌으며 주로 SMMR 구간에서 나타납니다.
      V5·V3은 이날부터 갱신이 멈췄습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-concentration-data-records-cdr-version-6-and-near-real-time
  - date: "2025-08-06"
    level: info
    title: 준실시간 V3, SSMIS 처리 계속 (DMSP 임무 종료 예정 2026년 9월까지)
    body: >-
      미 국방부가 DMSP 임무 종료(2026년 9월 예상) 때까지 SSMIS 자료 전달을 이어 가기로 하면서 준실시간 V3 갱신이 재개·유지되었습니다.
      다만 2025년 봄부터 생긴 SSMIS 자료 공백은 계속될 수 있다고 안내되었고, 이후 V6/V4에서 AMSR2로 전환되었습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-noaansidc-sea-ice-concentration-near-real-time-cdr-version-3-will-continue-ssmis-data
  - date: "2025-06-25"
    level: warning
    title: SSMIS 자료 중단 예고 — 준실시간 CDR·Sea Ice Index 처리 중단 (이후 철회)
    body: >-
      미 국방부가 2025-06-30까지 SSMIS 처리·배포를 멈춘다고 통보해, 준실시간 CDR과 Sea Ice Index가 그 이후 처리 중단될 예정이라고 공지되었습니다.
      직후(6-30) 제공이 7월 말까지 연장되었고, 8월에는 DMSP 임무 종료 때까지 계속 제공하기로 바뀌었습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-ssmis-data-discontinuation-affecting-sea-ice-index-and-sea-ice-cdr-effective-30-june
  - date: "2025-06-04"
    level: info
    title: SSMIS 자료 전달 불안정 — 일별 결측 가능
    body: >-
      미 해군의 SSMIS 자료 전달이 불규칙해져 SSMIS를 입력으로 쓰는 여러 NSIDC 산출물에 일별 결측이 생길 수 있다고 안내되었습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-degraded-ssmis-data-delivery-affecting-data-products

