# ─────────────────────────────────────────────────────────────
# CARRA — 데이터셋 정보 파일
# C3S 북극 지역 재분석 1세대(CARRA1). 2.5 km, West/East 두 영역. 2027-03까지 월 갱신 후 종료 예정,
# 후속 CARRA2(범북극 단일 영역, 1985-09~)는 2026-05 전체 과거 기간 공개.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: carra
name: CARRA
full_name: Copernicus Arctic Regional Reanalysis (C3S 북극 지역 재분석, 1세대 CARRA1)
category: reanalysis
domain: atmosphere
group: 지역 재분석
order: 10
domains: [대기, 육지, 해빙]
provider: Copernicus Climate Change Service (C3S) — 북유럽 기상청 컨소시엄 생산, ECMWF CDS 배포

status: deprecated
status_note: >-
  CDS에서 매달 갱신되고 있지만(2026-09-26 갱신, 2026년 7월까지), C3S는 CARRA1 정기 갱신을 2027년 3월 말까지만 하고 연장하지 않는다고 밝혔습니다.
  후속 CARRA2(범북극 단일 영역, 2.5 km)는 2026년 5월 1985~2025년 전체가 CDS에 공개되었고, 2026년 말~2027년 초부터 정기 갱신이 시작되어
  2027년 3월까지는 두 자료가 함께 갱신될 예정입니다. 새로 시작하는 연구라면 CARRA2를 함께 검토하세요.

transitions:
  - from: CARRA
    to: CARRA2
    to_id: carra2
    status: planned
    date: "2027-03"
    summary: >-
      2세대 범북극 지역 재분석 CARRA2는 2026년 5월 과거 전체 기간(1985-09~2025)이 CDS에 공개되었고, CARRA1 정기 갱신은 2027년 3월 말에 끝납니다.
      해상도(2.5 km)는 같지만 두 영역 대신 북극 전체를 한 격자로 덮고, 모델 버전·지면 체계·연직층·예보 길이·CDS 구성이 바뀌었습니다.
    changes:
      - aspect: 기간
        before: "1990-09 ~ 현재 (정기 갱신 2027-03 종료 예정)"
        after: "1985-09 ~ 현재 (CDS 제목은 1986년부터, 정기 갱신은 2026년 말~2027년 초 시작 예정)"
      - aspect: 영역·격자
        before: "West·East 두 영역, Lambert conformal — West 1069×1269, East 789×989 격자점"
        after: "범북극 단일 영역(그린란드 남쪽~알래스카 남쪽, 북극해·북유럽 일부), 극 평사도법 2869×2869 격자점(일부 지표 변수 2880×2880)"
      - aspect: 수평 해상도
        before: 2.5 km
        after: 2.5 km (변화 없음)
      - aspect: 모델
        before: "HARMONIE-AROME Cy40h1, 비정역학(non-hydrostatic)"
        after: "HARMONIE-AROME Cy46h1 기반, 정역학(hydrostatic)"
      - aspect: 지면·적설·자료동화
        before: "3D-Var 상층 동화(3시간 주기)"
        after: "3D-Var 상층 동화 + 단순화 확장 칼만 필터(SEKF) 지면 동화, SURFEX 14층 토양·12층 적설, 숲 캐노피(MEB), ECOCLIMAP Second Generation 지표 자료"
      - aspect: 연직층
        before: "모델면 65층, 기압면 23층(1000~10 hPa), 고도면 11층(15~500 m)"
        after: "모델면 65층, 기압면 20층(1000~50 hPa), 고도면 18층(15~3000 m)"
      - aspect: 예보 길이
        before: "00·12 UTC 예보 최대 30시간"
        after: "00·12 UTC 예보 최대 18시간"
      - aspect: CDS 구성
        before: "단일면·기압면·고도면·모델면이 각각 별도 데이터셋 + 일·월 통계 데이터셋"
        after: "시간별(sub-daily) 하나에 모든 층 종류 포함 + 일·월 통계 데이터셋, 지역 잘라 받기(subsetting) 지원"
      - aspect: 파일 형식
        before: GRIB2·NetCDF
        after: "GRIB2가 원본, NetCDF는 실험적 변환기 사용(GRIB2 권장)"
    impacts:
      - 두 자료를 한 시계열로 이어 붙이지 마세요. 모델·지면 체계가 달라 기후값이 다를 수 있습니다. ECMWF 담당자는 포럼에서 "어떤 면은 CARRA1, 어떤 면은 CARRA2가 낫다"며 전체 비교 평가를 준비 중이라고 밝혔습니다.
      - 격자가 완전히 바뀌므로(Lambert 두 영역 → 극 평사도법 단일 영역) 격자점 인덱스·마스크·지형 파일을 새로 받아야 합니다.
      - CARRA2 기압면은 50 hPa까지라 10~30 hPa가 필요하면 CARRA1만 해당합니다. 반대로 500 m보다 높은 고도면(최대 3000 m)은 CARRA2에만 있습니다.
      - CARRA1 안내서가 권하는 "+30시간 − +6시간 예보 차분"으로 24시간 강수를 만드는 방식은 예보가 18시간까지인 CARRA2에서는 그대로 쓸 수 없습니다. CARRA2 안내서의 누적량 계산법이나 일·월 통계 데이터셋을 쓰세요.
      - 2027년 4월 이후 최신 자료가 필요한 작업 흐름은 그 전에 CARRA2로 옮겨야 합니다.
    sources:
      - name: C3S — Copernicus Arctic Regional Reanalysis service (CARRA1·CARRA2 비교)
        url: https://climate.copernicus.eu/copernicus-arctic-regional-reanalysis-service
      - name: "Copernicus pan-Arctic Regional Reanalysis (CARRA2): Data User Guide"
        url: https://confluence.ecmwf.int/display/CKB/Copernicus+pan-Arctic+Regional+Reanalysis+%28CARRA2%29%3A+Data+User+Guide
      - name: C3S 총회(2026-06) CARRA 발표 자료 (Schyberg) — CARRA1 2027년 3월 이후 연장 없음
        url: https://climate.copernicus.eu/sites/default/files/custom-uploads/9th%20C3S%20GA/Day1/Day%201.7_Block%20I_SCHYBERG.pdf
      - name: ECMWF 포럼 — CARRA2 full historical period from 1986 to 2025 now available on the CDS
        url: https://forum.ecmwf.int/t/carra2-full-historical-period-from-1986-to-2025-now-available-on-the-cds/14998

period:
  start: "1990-09"
  end: present
  note: >-
    CDS 데이터셋 제목은 "1991 to present"이지만 자료는 1990년 9월부터 있습니다(WMO 기준 기간 1991~2020 포함).
    2026-10-12 확인 시 시간별 자료는 2026-07-31까지, 일·월 통계(reanalysis-carra-means)는 2026-02-28까지 있습니다.
    매달 갱신되며 지연은 2~3개월이고, 정기 갱신은 2027년 3월 말에 끝날 예정입니다.

resolution:
  spatial_short: "2.5 km (0.023°)"
  temporal_short: "1시간"
  spatial: >-
    2.5 km Lambert conformal 격자, 두 영역 — CARRA-West(그린란드·래브라도해·배핀만·아이슬란드·스발바르 주변) 1069×1269 격자점,
    CARRA-East(스발바르·프란츠요제프 제도·노바야제믈랴·바렌츠해·노르웨이해 일부·스칸디나비아 북부) 789×989 격자점. 제공 격자 = 모델 격자
  vertical: "모델면 65층(최상층 약 10 hPa, 최하층 지상 약 12 m) / 기압면 23층(1000~10 hPa) / 고도면 11층(지상 15~500 m) / 토양 2층"
  temporal: >-
    분석 3시간(00·03·…·21 UTC) / 예보 1시간 — 00·12 UTC 시작 예보는 +1~6시간 매시, 이후 +9~30시간 3시간 간격, 그 밖의 분석 시각 시작 예보는 +1~3시간.
    일·월 통계는 별도 데이터셋

update: 매월 (CDS 매월 27일경, 2~3개월 지연 — 2027년 3월 말까지)
license: CC BY 4.0
account_required: true

summary: >-
  Copernicus 기후변화 서비스(C3S)가 만든 유럽 쪽 북극의 2.5 km 지역 재분석입니다. HARMONIE-AROME(Cy40h1) 비정역학 모델과 3D-Var를 3시간 주기로 돌리고,
  ERA5를 측면 경계로 써서 그린란드·아이슬란드 쪽(West)과 스발바르·바렌츠해 쪽(East) 두 영역의 대기·지표·해빙 변수를 3시간 분석과 1시간 예보로 제공합니다.
  ERA5보다 지형·해안·빙하를 훨씬 잘게 표현하고 북유럽·그린란드 지역 관측을 더 많이 동화했습니다. 2세대 범북극 재분석 CARRA2로 대체될 예정입니다.

time_convention:
  summary: >-
    분석(analysis) 자료는 00·03·…·21 UTC의 순간값입니다. 예보(forecast) 자료는 시작 시각(time)과 선행 시간(leadtime_hour)으로 지정하며,
    강수·복사·열속은 예보 시작 시각부터 그 선행 시간까지 누적한 값이고, 최고·최저 기온과 돌풍은 직전 후처리(출력) 시점 이후의 최댓값·최솟값입니다.
  points:
    - "예보 자료의 유효 시각 = 시작 시각 + leadtime_hour 입니다. 예: 00 UTC 시작 +6시간 tp = 00~06 UTC 6시간 누적 강수."
    - "1시간 강수는 1시간 간격의 두 누적값을 빼서 구합니다. 공식 안내서는 12시간 강수로 00·12 UTC 예보의 +18시간 − +6시간, 24시간 강수로 +30시간 − +6시간을 권합니다(초기 적응(spin-up) 영향 회피)."
    - "누적 변수(강수 kg m-2, 복사·열속 J m-2)는 분석 시각 자료에는 없고 예보 자료에만 있습니다. J m-2를 W m-2로 바꾸려면 누적 시간(초)으로 나눕니다."
    - "최고·최저 기온과 돌풍은 75초 모델 시간 간격마다의 값에서 구한 극값입니다. 구간 길이는 예보 출력 간격(초반 1시간, +6시간 이후 3시간)에 따르므로 GRIB의 stepRange로 확인하세요."
    - "일·월 통계 데이터셋에서 일평균(순간 변수)은 3시간 표본으로, 일합계는 세 개의 예보 시작 시각을 조합해 계산합니다. 월평균은 일평균의 평균이며, 그 달 27일 이상 자료가 있어야 만들어집니다."
    - "알베도는 분석 시각 값이 잘못되어 있으므로 예보 자료만 쓰라고 안내되어 있습니다(거칠기 길이도 예보 자료만)."
  source: https://confluence.ecmwf.int/display/CKB/Copernicus+Arctic+Regional+Reanalysis+(CARRA)%3A+Data+User+Guide
  source_name: "Copernicus Arctic Regional Reanalysis (CARRA): Data User Guide"

variables:
  note: >-
    CARRA 사용자 안내서(Data User Guide)의 파라미터 표 기준 주요 변수입니다. 백틱 안은 GRIB short name이며,
    CDS 요청에는 `2m_temperature`, `total_precipitation`처럼 긴 이름을 씁니다. CDS 단일면 데이터셋에는 약 67개 변수가 있습니다.
  full_list: https://confluence.ecmwf.int/display/CKB/Copernicus+Arctic+Regional+Reanalysis+(CARRA)%3A+Data+User+Guide
  groups:
    - name: 지표·단일면 (분석·예보, 순간값)
      kind: instant
      items:
        - "2m 기온 — `2t` (K)"
        - "2m 상대습도 — `2r` (%)"
        - "2m 비습 — `2sh` (kg kg-1)"
        - "10m 동서·남북 바람 — `10u`, `10v` (m s-1)"
        - "10m 풍속·풍향 — `10si` (m s-1), `10wdir` (degrees)"
        - "평균 해면기압 — `msl` (Pa)"
        - "지표 기압 — `sp` (Pa)"
        - "지표(skin) 온도 — `skt` (K)"
        - "전운량 — `tcc` (%)"
        - "적설 물당량 — `sd` (kg m-2)"
        - text: "해수면온도 — `sst` (K)"
          note: 분석 자료만
        - text: "해빙 면적비 — `ci` (0-1)"
          note: 분석 자료만
        - text: "해빙 두께 — `sithick` (m)"
          note: 분석 자료만, 안내서는 대략적 추정치로 다루라고 권함
    - name: 지표·단일면 (예보 전용 누적·극값)
      kind: accum
      period: 예보 시작 이후
      items:
        - "총강수량 — `tp` (kg m-2)"
        - "비(액체 강수) 누적 — `tirf` (kg m-2)"
        - "고체 강수(눈 등) 누적 — `titspf` (kg m-2)"
        - "지표 하향 단파복사 — `ssrd` (J m-2)"
        - "지표 하향 장파복사 — `strd` (J m-2)"
        - "지표 현열 플럭스 — `sshf` (J m-2)"
        - "지표 잠열 플럭스 — `slhf` (J m-2)"
        - text: "2m 최고기온 — `mx2t` (K)"
          kind: max
          period: 직전 후처리 이후
        - text: "2m 최저기온 — `mn2t` (K)"
          kind: min
          period: 직전 후처리 이후
        - text: "10m 돌풍 — `10fg` (m s-1)"
          kind: max
          period: 직전 후처리 이후
    - name: 기압면 (23층, 1000~10 hPa, 분석·예보)
      kind: instant
      items:
        - "기온 — `t` (K)"
        - "동서·남북 바람 — `u`, `v` (m s-1)"
        - "상대습도 — `r` (%)"
        - text: "지위(geopotential) — `z` (m2 s-2)"
          note: "9.80665로 나누면 지위고도(m)"
        - "기하 연직속도 — `wz` (m s-1)"
        - "잠재와도 — `pv` (K m2 kg-1 s-1)"
        - "구름 액체수·얼음 함량 — `clwc`, `ciwc` (kg kg-1)"
    - name: 고도면 (지상 15~500 m 11층, CDS 요청 이름)
      kind: instant
      items:
        - "기온 — `temperature` (K)"
        - "풍속·풍향 — `wind_speed` (m s-1), `wind_direction` (degrees)"
        - "상대습도 — `relative_humidity` (%)"
        - "기압 — `pressure` (Pa)"
    - name: 불변장
      kind: static
      items:
        - "지형 고도 — `orog` (m)"
        - "해륙 마스크 — `lsm` (0-1)"

access:
  - name: CDS — Arctic regional reanalysis on single levels (reanalysis-carra-single-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-single-levels
    method: 웹 다운로드 / CDS API (cdsapi)
    note: ECMWF 계정과 데이터셋 이용약관(CC BY) 동의가 필요합니다. 영역(west_domain/east_domain), 분석/예보, 지표·대기(surface_or_atmosphere)/토양층을 골라 요청합니다.
  - name: CDS — 기압면 (reanalysis-carra-pressure-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-pressure-levels
    method: 웹 다운로드 / CDS API
  - name: CDS — 고도면 (reanalysis-carra-height-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-height-levels
    method: 웹 다운로드 / CDS API
  - name: CDS — 모델면 (reanalysis-carra-model-levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-model-levels
    method: 웹 다운로드 / CDS API
  - name: CDS — 일·월 통계 (reanalysis-carra-means)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-carra-means
    method: 웹 다운로드 / CDS API
    note: 2025년 10월 공개. 모든 층 종류의 일·월 평균, 극값, 일부 합계를 한 데이터셋에 담았고, 시간별 자료보다 갱신이 늦습니다.

example:
  lang: python
  note: "~/.cdsapirc 에 CDS API 주소와 본인 key를 넣은 뒤 실행합니다. 요청 키와 값은 CDS 다운로드 양식(API 정의)에서 확인한 것입니다."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()

    # 1) 분석: 2m 기온 순간값 (3시간 간격 중 00·12 UTC)
    client.retrieve(
        "reanalysis-carra-single-levels",
        {
            "domain": "west_domain",              # 또는 "east_domain"
            "level_type": "surface_or_atmosphere",
            "product_type": "analysis",
            "variable": ["2m_temperature"],
            "year": ["2024"], "month": ["01"], "day": ["01"],
            "time": ["00:00", "12:00"],
            "data_format": "grib",
        },
        "carra_west_t2m_an_20240101.grib",
    )

    # 2) 예보: 총강수량 (예보 시작 이후 누적, +6·+18시간 → 차분하면 12시간 강수)
    client.retrieve(
        "reanalysis-carra-single-levels",
        {
            "domain": "west_domain",
            "level_type": "surface_or_atmosphere",
            "product_type": "forecast",
            "variable": ["total_precipitation"],
            "year": ["2024"], "month": ["01"], "day": ["01"],
            "time": ["00:00", "12:00"],
            "leadtime_hour": ["6", "18"],
            "data_format": "grib",
        },
        "carra_west_tp_fc_20240101.grib",
    )

tips:
  - West와 East 영역은 스발바르 주변에서 겹칩니다. 공식 안내서는 스발바르는 East, 얀마옌은 West 자료를 쓰라고 권합니다(불확실성 추정치도 겹치는 곳은 East 기준).
  - 2022-07-01 생산 컴퓨터 이전(레딩→볼로냐) 이후 파일은 GRIB의 지구 모양 메타데이터(shapeOfTheEarth)가 달라 좌표가 1 km 안팎 어긋나 보입니다. ECMWF는 2022년 6월 이전 격자 정보가 맞다고 안내했으니, 기간을 이어 붙일 때는 격자점 인덱스 기준으로 합치거나 이전 격자 정보를 쓰세요. 같은 날부터 적설 물당량(`sd`)의 층 종류도 surface에서 heightAboveGround로 바뀌었습니다.
  - Lambert 격자라 위경도 격자와 바로 겹쳐 그릴 수 없습니다. 또 `10u`·`10v`가 격자 기준인지 동서·남북 기준인지 공식 문서에서 확인하지 못했으니, 방향이 중요하면 풍향 `10wdir`과 풍속 `10si`를 함께 받아 비교해 보세요.
  - 영역 가장자리 격자점은 측면 경계(ERA5)의 영향을 받습니다. 사용자 보고에 ECMWF 담당자도 경계 영향을 더 분명히 안내할 필요가 있다고 답했으니, 가장자리 몇 줄은 분석에서 빼는 편이 안전합니다.
  - 빙하 위 지표 유출(runoff)은 낮고 비현실적인 경우가 많다고 안내서에 적혀 있습니다. 빙하 질량수지 연구에는 그대로 쓰지 마세요.

