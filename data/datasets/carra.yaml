notices:
  - date: "2026-06-03"
    level: warning
    title: CARRA1 정기 갱신 2027년 3월 종료 예정
    body: >-
      C3S 총회 발표와 C3S 서비스 페이지에 따르면 CARRA1 월별 갱신은 2027년 3월 말까지 이어지고 그 뒤로는 연장되지 않습니다.
      2026년 11월(또는 2027년 초)부터 2027년 3월까지는 CARRA1과 CARRA2가 함께 매달 갱신될 예정이며, 이후 최신 자료는 CARRA2로만 나옵니다.
      CARRA1 일부 변수를 기계학습으로 갱신하는 방안도 준비 중이라고 소개되었습니다.
    source: https://climate.copernicus.eu/copernicus-arctic-regional-reanalysis-service
  - date: "2026-05-27"
    level: info
    title: 후속 CARRA2 과거 전체 기간(1986~2025) CDS 공개
    body: >-
      북극 전체(그린란드 남쪽~알래스카 남쪽, 북극해, 북유럽 일부)를 2.5 km 단일 격자로 덮는 CARRA2의 40년 전체 자료가 CDS에 공개되었습니다.
      시간별 자료는 reanalysis-pan-carra, 일·월 통계는 reanalysis-pan-carra-means 데이터셋입니다. 정기 갱신은 2026년 말부터 시작할 예정입니다.
    source: https://forum.ecmwf.int/t/carra2-full-historical-period-from-1986-to-2025-now-available-on-the-cds/14998
  - date: "2025-12-10"
    level: info
    title: CARRA2 첫 자료 공개 (24년, 띄엄띄엄)
    body: CARRA2의 첫 자료(3년 단위 8개 구간, 1986~2023 사이 24년)가 CDS에 공개되었습니다. 지역 잘라 받기와 모든 층 종류를 한 데이터셋에 담은 구성이 도입되었습니다.
    source: https://forum.ecmwf.int/t/new-datasets-family-published-in-cds-copernicus-pan-arctic-regional-reanalysis-carra2/14483
  - date: "2025-10-02"
    level: info
    title: CARRA 일·월 통계 데이터셋 공개
    body: >-
      CARRA의 일·월 평균, 극값, 일부 합계를 미리 계산한 reanalysis-carra-means 데이터셋이 CDS에 추가되었습니다.
      모든 층 종류를 한 데이터셋에 담아 기존 4개 데이터셋을 보완합니다.
    source: https://forum.ecmwf.int/t/new-dataset-published-in-cds-arctic-regional-reanalysis-daily-and-monthly-data-from-1991-to-present/14206
  - date: "2025-02-19"
    level: warning
    title: 2022년 7월 이후 파일의 격자 메타데이터 변경 확인
    body: >-
      2022-07-01 생산 이전 과정에서 GRIB의 지구 모양 정보(shapeOfTheEarth)가 바뀌어 좌표가 1 km 안팎 어긋나 보이고,
      적설 물당량의 층 종류도 바뀐 사실을 ECMWF가 포럼에서 확인했습니다. 모델 결과 자체의 변화는 아니며, 2022년 6월 이전 격자 정보가 올바른 값입니다.
    source: https://forum.ecmwf.int/t/carra-east-grid-change-in-2023-and-after/10133

