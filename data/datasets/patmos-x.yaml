notices:
  - date: "2026-08-14"
    level: warning
    title: NOAA-20 자료의 구름 광학 특성 과대 문제 — Version 7.0에서 수정 예정
    body: >-
      NCEI PATMOS-x 안내 페이지(2026-08-14 개정)에 따르면 NOAA-20 자료 상당 부분이 비스듬한 태양 각도에서 반사도가 높게 처리되어 일부 지역 구름 광학 특성이 높게 나옵니다.
      2018년 7월, 2019년 1월, 2026년 1월 13일 이후 자료는 영향이 없으며, 수정은 Version 7.0에 반영될 예정입니다.
    source: https://www.ncei.noaa.gov/products/climate-data-records/avhrr-hirs-cloud-properties-patmos

