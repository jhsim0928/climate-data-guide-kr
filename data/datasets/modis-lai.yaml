transitions:
  - from: MODIS LAI/FPAR C6.1 (MCD15A2H 등)
    to: VIIRS LAI/FPAR V2 (VNP15A2H·VJ115A2H·VJ215A2H)
    to_id: viirs-lai
    status: planned
    date: "2027"
    summary: >-
      같은 보스턴대 알고리즘(3차원 복사전달 조견표 + NDVI 백업)을 VIIRS 적색·근적외 채널에 맞춰 옮긴 후속 자료입니다. 2012~2016년 비교에서 전지구 평균 차이는
      LAI −0.006, FPAR −0.002 수준으로 작았지만, 변수 이름·품질 비트 배치·파일 형식이 달라 코드는 고쳐야 합니다. MODIS 수집은 Terra·Aqua 종료(2026년 말~2027년)와 함께 끝납니다.
    changes:
      - aspect: 위성·통과 시각
        before: "Terra(원래 10:30 하강)·Aqua(원래 13:30 상승) — 2020·2021년부터 궤도 표류 중"
        after: "Suomi NPP(2012~, 2026년 11월 배포 종료 예정)·NOAA-20(2018~)·NOAA-21(2023~), 오후 13:30 상승 통과 궤도"
      - aspect: 제품과 시간 간격
        before: "8일(MOD15A2H·MYD15A2H·MCD15A2H) + 4일(MCD15A3H)"
        after: "8일만(VNP15A2H·VJ115A2H·VJ215A2H) — 위성별 단독 제품, 결합 제품 없음"
      - aspect: 입력 채널
        before: "MODIS 적색(648 nm)·근적외(858 nm) 반사도, MOD09GA 500 m 입력"
        after: "VIIRS I1(640 nm)·I2(865 nm), VNP09GA 입력. 센서에 맞춘 별도 조견표(LUT)"
      - aspect: 합성 방식
        before: "8일(4일) 중 FPAR 최대인 날 선택"
        after: "같음 — 8일 중 FPAR 최대인 날을 고르고 그날의 LAI·QA를 기록"
      - aspect: 변수 이름
        before: "`Lai_500m`, `Fpar_500m`, `LaiStdDev_500m`, `FparStdDev_500m`, `FparLai_QC`, `FparExtra_QC`"
        after: "`Lai`, `Fpar`, `LaiStdDev`, `FparStdDev`, `FparLai_QC`, `FparExtra_QC` (척도 인수·249~255 코드는 같음)"
      - aspect: 품질 비트(FparLai_QC)
        before: "0번 MODLAND, 1번 위성, 2번 고장 검출기, 3~4번 구름, 5~7번 SCF_QC"
        after: "0~2번 SCF_QC, 3번 고장 검출기, 4~7번 생물군계(biome) 유형 — 같은 비트 연산을 쓰면 엉뚱한 값을 고르게 됨"
      - aspect: 파일 형식
        before: "HDF-EOS2(HDF4, .hdf)"
        after: "HDF-EOS5(HDF5, .h5)"
      - aspect: 일관성 (2012~2016, VIIRS − MODIS)
        before: "기준"
        after: "평균 차이 LAI −0.006 ± 0.013, FPAR −0.002 ± 0.002. 열대림(반사도 포화)에서 차이가 크고, VIIRS는 주 알고리즘 성공률의 연변동이 컸음(Xu et al. 2018, VIIRS V1 기준)"
    impacts:
      - 두 기록을 이을 때는 겹치는 기간(2012년 이후, NOAA-20은 2018년 이후)에서 화소·계절별 차이를 확인하고, 이음매가 있음을 논문에 밝히세요.
      - QC 비트 배치가 달라 MODIS용 품질 필터 코드를 VIIRS에 그대로 쓰면 안 됩니다. 변수 이름의 `_500m`도 빠졌습니다.
      - MODIS 4일 제품(MCD15A3H)에 맞춘 분석은 VIIRS에서 8일로만 이어갈 수 있습니다.
      - Suomi NPP 제품(VNP15A2H)은 2026년 11월 배포가 끝나므로, 앞으로 이어 쓸 기준 위성은 NOAA-21(VJ215A2H, 주)·NOAA-20(VJ115A2H, 보조)입니다.
    sources:
      - name: Transition from MODIS to VIIRS (NASA Earthdata 공지, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: VNP15 사용자 안내서 V1.2 (2018)
        url: https://lpdaac.usgs.gov/documents/126/VNP15_User_Guide.pdf
      - name: Xu et al. (2018) — VIIRS·MODIS LAI/FPAR 일관성 분석 (Forests)
        url: https://doi.org/10.3390/f9020073
      - name: Román et al. (2024) — MODIS C6.1과 VIIRS C2 육상 제품 연속성 (RSE)
        url: https://doi.org/10.1016/j.rse.2023.113963
  - from: MODIS LAI/FPAR C6
    to: MODIS LAI/FPAR C6.1
    status: completed
    date: "2023-07"
    summary: >-
      과학 알고리즘은 그대로 두고 Terra·Aqua L1B 보정 방식과 편광 보정만 바꿔 전 기간을 다시 만든 판입니다. 형식·변수 이름은 C6과 같습니다.
      C6(006) 육상 제품은 2023년 7월 31일 배포가 끝났습니다.
    changes:
      - aspect: 알고리즘
        before: "C6 (500 m MOD09GA 입력, 일별 중간 산출물 MOD15IP, 개선된 다년 토지피복)"
        after: "변경 없음"
      - aspect: 입력 보정
        before: "C6 L1B 보정"
        after: "Terra·Aqua L1B 보정 방식 변경, 편광 보정 변경"
      - aspect: 제공 상태
        before: "006 — 2023-07-31 배포 종료"
        after: "061 — 현재 유일한 판"
    impacts:
      - 006으로 만든 결과는 061로 다시 확인하세요. 006 파일은 더 이상 받을 수 없습니다.
    sources:
      - name: MOD15 C6.1 사용자 안내서 (2020)
        url: https://lpdaac.usgs.gov/documents/926/MOD15_User_Guide_V61.pdf
      - name: MODIS Version 6.0 육상 제품 배포 종료 최종 공지 (2023-07-25)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS 대기 모드 진입 — 2026년 85~86일 일부 자료 '의심/불량' 처리
    body: >-
      2026년 3월 26일 약 20시(UTC) Terra 이상으로 MODIS가 대기(standby) 모드에 들어갔다가 3월 27일 과학 모드로 돌아왔습니다.
      보정팀은 2026년 85일 20:00 UTC부터 86일 19:23 UTC까지의 자료를 의심/불량으로 표시했으며, 그 이후 자료는 써도 된다고 밝혔습니다.
      이 구간이 포함된 8일·4일 합성(Terra 기반 MOD15·MCD15)은 품질 플래그를 확인하세요.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: Terra 2027년 2월, Aqua 2027년 9월 과학 운영 종료 전망
    body: >-
      NASA Earth Observer의 Terra 특집(2025-12-29 게재, 2026-03-20 갱신) 편집자 주는 과학 활동 종료 예상 시점을 Terra 2027년 2월, Aqua 2027년 9월로 밝혔습니다.
      그때까지는 운영을 이어가며, Terra는 배터리 노화로 전력이 부족해 2025년 4월 9일 MOPITT를 꺼 나머지 4개 센서의 전력을 아꼈고, ASTER 단파적외(SWIR)는 이미 동작하지 않습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-01-08"
    level: warning
    title: MODIS 품질팀 공지 — Terra·Aqua 궤도 표류가 화소 크기·주사 틈·일주기 표집에 영향
    body: >-
      LDOPE는 궤도 유지를 멈춘 Terra(마지막 조정 2022년)·Aqua(2021년)의 표류로 화소 크기와 간격, 주사 틈, 보타이(bowtie) 겹침, 일주기 표집이 바뀌었고
      2024년 말부터 영향이 크게 늘었다고 알렸습니다. 산불 제품을 비롯한 각 제품에 미치는 영향은 조사 중입니다.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool의 MODIS 배포 종료(2025-06-30) — Earthdata Cloud로 전환
    body: >-
      LP DAAC는 C6.1을 포함한 모든 MODIS 자료의 Data Pool 접근을 2025년 6월 30일 끝내고 NASA Earthdata Cloud를 주 저장소로 쓴다고 공지했습니다.
      Earthdata Search와 AppEEARS 사용자는 바뀌는 점이 없지만, Data Pool 주소를 직접 쓰던 스크립트는 고쳐야 합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 예정
    body: >-
      NASA는 Terra·Aqua가 2026년 말이나 2027년 초에 운영을 멈출 것으로 보고, 그때 MODIS 자료 수집이 끝나며 마지막 재처리가 이어진다고 공지했습니다.
      두 위성의 궤도 표류가 통과 시각과 자료 품질에 영향을 줄 수 있으니 비슷한 VIIRS 제품으로 옮기라고 권합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 육상 제품 배포 종료(2023-07-31) — V6.1만 제공
    body: >-
      LP DAAC가 Terra·Aqua·결합 MODIS V6.0 육상 제품(MOD44W·MCD43GF 제외)의 배포를 2023년 7월 31일 끝냈습니다.
      사용자 안내서·ATBD는 DOI 페이지에 남아 있으며, V6.1로 옮기라고 안내했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

