transitions:
  - from: VIIRS BRDF/Albedo Collection 1 (V001)
    to: VIIRS BRDF/Albedo Collection 2 (V002)
    status: completed
    date: "2024-10"
    summary: >-
      Suomi NPP 전 기간 보정과 위치 정확도, 구름·해륙 마스크를 개선해 다시 만든 판입니다. NOAA-20(VJ143) 제품이 C2에서 처음 생겼고,
      NOAA-21(VJ243) 제품도 추가되었습니다. C1(VNP43 V001)은 2025년 초 생산을 멈췄습니다.
    changes:
      - aspect: 공개
        before: "V001 (Suomi NPP만)"
        after: "타일 제품 2024-10-31, CMG 2025-01-31 공개 / NOAA-21(VJ243) 제품 2026년 DOI 등록"
      - aspect: 위성
        before: "Suomi NPP(VNP43)"
        after: "Suomi NPP(VNP43) + NOAA-20(VJ143) + NOAA-21(VJ243)"
      - aspect: 보정·위치
        before: "C1 보정 계수"
        after: "Suomi NPP 전 기간 보정 알고리즘·계수 개선, 위치 정확도 향상(기동 기간 이상값 수정)"
      - aspect: 입력 마스크
        before: "C1 구름 마스크, 해륙 마스크"
        after: "구름 마스크 입력 개선(해안선 오류·조잡한 기후값 흔적 감소), 에어로졸 양 플래그 수정(중·고위도 밝은 지표), VNP03 8분류 해륙 마스크로 교체(MODIS와 더 잘 맞음)"
      - aspect: 기간
        before: "2012-01~2025-02 (V001 마지막)"
        after: "2012-01~현재"
    impacts:
      - C1과 C2를 섞지 말고 전 기간을 C2로 다시 받으세요.
      - 해안선·고위도 밝은 지표 근처 값이 C1과 달라질 수 있습니다.
    sources:
      - name: LP DAAC VNP43MA4 V002 컬렉션 설명(버전 변경 사항, CMR)
        url: https://doi.org/10.5067/VIIRS/VNP43MA4.002
      - name: VIIRS Version 2 Albedo, BRDF, and NBAR Tiled Data Products Released (Earthdata)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-tiled-data-products-released
      - name: VIIRS Version 2 Albedo, BRDF, and NBAR CMG Data Products Released (Earthdata)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-cmg-data-products-released

notices:
  - date: "2026-08-03"
    level: critical
    title: Suomi NPP 자료 전달 2026년 11월 2일 종료 — VNP43 신규 자료 중단
    body: >-
      NOAA는 2026년 11월 2일 13:00 UTC에 Suomi NPP의 남은 과학 산출물(VIIRS 포함) 전달을 영구히 끝낸다고 공지했고, NOAA-21(1순위)·NOAA-20(2순위)으로 옮기라고 권고했습니다.
      LP DAAC의 VNP43 컬렉션 설명에도 같은 날짜와 함께 VJ243(1순위)·VJ143(2순위) 제품을 쓰라는 안내가 붙었습니다. 이미 공개된 과거 자료는 계속 받을 수 있습니다.
    source: https://www.nesdis.noaa.gov/news/cessation-of-suomi-national-polar-orbiting-partnership-s-npp-data-users-onafter-november-2-2026
  - date: "2026-07-13"
    level: warning
    title: Suomi NPP 위성 이상 — 2026년 7월 10일부터 VIIRS 산출물 생산 중단
    body: >-
      Suomi NPP가 7월 10일 14:50 UTC께 비정상 상태에 들어가 11일 01:30 UTC부터 모든 과학 산출물 생산이 멈췄습니다(VNP43 포함).
      NSIDC 안내에 따르면 7월 21일 위성은 정상으로 돌아왔고 이후 생산이 재개되었지만, 이 기간 관측은 복구되지 않을 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-viirs-data-outage-anomaly-july-10-2026
  - date: "2025-03-28"
    level: info
    title: AppEEARS에서 VIIRS BRDF/Albedo V2 제품 제공 시작
    body: >-
      AppEEARS 3.76에 Suomi NPP·NOAA-20 VIIRS BRDF/Albedo V2 제품 16종(500 m·1 km Sinusoidal 격자)이 추가되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-brdf-albedo-version-2-products-available-appeears
  - date: "2025-01-31"
    level: info
    title: VIIRS V2 BRDF/Albedo/NBAR 0.05° CMG 제품 공개
    body: >-
      BRDF 매개변수·무적설 매개변수·알베도·NBAR의 0.05° 기후모델격자 제품 8종(VNP43C1~C4, VJ143C1~C4)이 공개되었습니다.
      V1 BRDF/알베도 제품의 정방향 생산은 2025년 1월 31일까지 이어졌습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-cmg-data-products-released
  - date: "2024-10-31"
    level: info
    title: VIIRS V2 BRDF/Albedo/NBAR 타일 제품 공개 (Suomi NPP·NOAA-20)
    body: >-
      VNP43IA1~4·VJ143IA1~4(500 m), VNP43MA1~4·VJ143MA1~4(1 km) V2 제품이 공개되었습니다. 전환 기간 동안 Suomi NPP V1도 함께 제공되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-albedo-brdf-nbar-tiled-data-products-released

