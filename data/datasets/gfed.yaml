    url: https://www.globalfiredata.org/data.html
    method: SFTP (서버 ftp.prd.dip.wur.nl, 포트 1022)
    note: >-
      GFED5.1(1997~2022)과 GFED5.1NRT(2023~, reprocessed·update 디렉터리) netCDF4 파일이 있습니다. 공개 접속 정보는
      https://www.globalfiredata.org/ancill/GFED5_SFTP_info.txt 에 있습니다(포트 1022 주의).
  - name: Zenodo — GFED5.1 (논문 자료)
    url: https://doi.org/10.5281/zenodo.16794692
    method: HTTPS 다운로드 (zip 4개, 약 20.5 GB)
    note: GFED5.1_monthly(1.7 GB, 1997~2022 월 연소 면적·배출), GFED5.1_daily(18.4 GB, 일 배출), GFED5.1_ecosystem(2002~2022 유형별 연소 면적·탄소 배출), GFED5.1_code
  - name: Zenodo — GFED5NRT (근실시간 확장, 재처리본)
    url: https://doi.org/10.5281/zenodo.18702700
    method: HTTPS 다운로드
    note: 2023~2024년 일·월 자료. 물질별(Species)·생태계별(Ecosystem) 파일을 위성 조합별(CMB 결합, VNP Suomi NPP, VJ1 NOAA-20)로 나눠 제공합니다.
  - name: GFED 요약표 (전지구·권역별 연 배출량)
    url: https://www.globalfiredata.org/tables
    method: 텍스트 표 다운로드
  - name: GFED4.1s (이전 판, HDF5)
    url: https://www.geo.vu.nl/~gwerf/GFED/GFED4/
    method: HTTPS 디렉터리 다운로드
    note: GFED4.1s_1997~2016.hdf5와 GFED4.1s_2017~2023_beta.hdf5, Readme.pdf, ancill(배출계수 표)가 있습니다.
  - name: ORNL DAAC — GFED4.1 (1997~2016)
    url: https://doi.org/10.3334/ORNLDAAC/1293
    method: Earthdata 로그인 후 다운로드
    note: 소규모 화재를 뺀 GFED4 월·일 연소 면적(HDF)과 GFED4.1s 연 파일(1997~2015)을 보관한 NASA 보관본입니다.

example:
  lang: python
  note: >-
    GFED4.1s HDF5를 받아 연간 전지구 탄소 배출량을 계산하고, SFTP나 Zenodo에서 받은 GFED5.1 일별 파일을 xarray로 여는 예입니다.
    GFED5.1 파일 이름과 변수는 받은 판의 README로 다시 확인하세요.
  code: |
    # pip install h5py numpy requests xarray netCDF4
    import h5py
    import numpy as np
    import requests
    import xarray as xr

    # 1) GFED4.1s: 2015년 전지구 탄소 배출량
    url = "https://www.geo.vu.nl/~gwerf/GFED/GFED4/GFED4.1s_2015.hdf5"
    with open("GFED4.1s_2015.hdf5", "wb") as out:
        out.write(requests.get(url, timeout=600).content)

    with h5py.File("GFED4.1s_2015.hdf5", "r") as f:
        area = f["ancill/grid_cell_area"][:]                          # m2
        c = sum(f[f"emissions/{m:02d}/C"][:] for m in range(1, 13))   # g C m-2 (월 합계를 더함)
        print("2015 전지구 탄소 배출:", (c * area).sum() / 1e15, "Pg C")

    # 2) GFED5.1 일별 배출 파일 (SFTP 또는 Zenodo GFED5.1_daily.zip에서 받은 파일)
    ds = xr.open_dataset("GFED5.1_daily_2020-01.nc")
    co2 = ds["CO2"]                        # (time, lat, lon), 0.25°
    print(co2.attrs.get("units"))          # 'g CO2 per day' — 면적당/칸당 여부 확인
    print(co2.sel(lat=slice(33, 39), lon=slice(124, 132)).sum(("lat", "lon")))

tips:
  - "GFED5는 GFED4s보다 연소 면적이 약 61%, 탄소 배출이 약 65% 많습니다(대부분 소규모 화재·누락 보정·농경지 연소 반영). 두 판의 값을 섞거나, GFED4s 기준으로 만든 모델 설정에 GFED5를 그대로 넣지 마세요."
  - "2023년 이후(GFED5.1NRT)는 연소 면적을 직접 관측한 것이 아니라 VIIRS 활성 화재 개수로 환산한 값이고, 공식 사이트가 베타로 표시합니다. 2022년 이전과 이어 붙여 추세를 볼 때 이 방식 변화를 밝히세요."
  - "GFED5NRT의 결합(CMB) 자료는 Suomi NPP·NOAA-20 중 하나가 없으면 남은 위성만으로 계산하도록 설계되어 있습니다. Suomi NPP 자료 공급이 2026년 11월 1일 끝나므로 그 뒤 값은 NOAA-20 단독에 가까워집니다."
  - "1997~2000년은 1° 자료이며 ATSR·VIRS 활성 화재로 추정한 값이라 불확실성이 큽니다. 1998년(VIRS 도입)·2001년(Terra MODIS)·2003년(Aqua MODIS)에 자료 불연속이 있다고 README가 경고합니다."
  - "농경지 연소 배출은 가장 불확실한 부분입니다(연료 소비 현장 자료가 매우 적음). 한국·중국 등 농경지 소각 배출을 따로 볼 때는 불확실성을 꼭 언급하세요."
  - "GFED4.1s 2017년 이후 _beta 파일은 MODIS 활성 화재와 2003~2016년 관계로 추정한 값이며 `DM`·`C`만 들어 있습니다. 물질별 배출은 `DM` × 배출계수(ancill 폴더 표) × 유형별 비율(partitioning)로 직접 계산합니다."
  - "GFED4.1s HDF5는 위도가 북쪽(89.875°)에서 남쪽으로 내려가는 순서입니다. 다른 자료와 겹칠 때 위도 방향을 확인하세요."
  - "연구진은 0.25° 격자 하나하나나 국가 단위 이하의 작은 규모로 갈수록 불확실성이 커진다고 안내합니다. 넓은 지역·긴 기간의 합계로 쓰는 것이 안전합니다."

