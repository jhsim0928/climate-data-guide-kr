transitions:
  - from: GFED4.1s
    to: GFED5 (GFED5.1 + GFED5.1NRT)
    status: completed
    date: "2025-10"
    summary: >-
      GFED5는 GFED4 이후 가장 큰 개편으로, 연소 면적 입력과 배출계수를 모두 바꿔 전지구 연소 면적은 약 61%, 탄소 배출은 약 65% 커졌습니다.
      연소 면적은 2023년(ESSD, Chen et al.), 배출량은 2025년(Scientific Data, van der Werf et al.)에 출판되었고, 2023년 이후는 VIIRS 활성 화재 기반 근실시간판이 이어집니다.
      두 판은 크기가 크게 달라 같은 연구 안에서 섞으면 안 됩니다.
    changes:
      - aspect: 연소 면적 입력
        before: "MODIS MCD64A1 Collection 5.1 + 활성 화재로 통계 추정한 소규모 화재(Randerson et al. 2012)"
        after: "MCD64A1 C6.1 + Landsat·Sentinel-2로 보정한 누락·오탐 보정 + 활성 화재 기반 소규모 화재 + 농경지 연소 GloCAB(Hall et al. 2023)"
      - aspect: 전지구 연소 면적
        before: "GFED5가 GFED4s보다 약 61% 큼(2002–2016 겹치는 기간 비교)"
        after: "연 774 ± 63 Mha(2001–2020, Chen et al. 2023), MCD64A1보다 약 93% 많음"
      - aspect: 전지구 탄소 배출
        before: "연 2.04 Pg C (van der Werf et al. 2025 표 7 비교값)"
        after: "연 3.4 Pg C (2002–2022 평균, +65%)"
      - aspect: 배출계수
        before: "Akagi et al. (2011) 중심의 화재 유형별 값"
        after: "NEIVA v1.1 6개 화재 유형 평균 + 사바나·초지의 CO2·CO·CH4·N2O는 기상·식생에 따라 변하는 동적 배출계수"
      - aspect: 기간·최신 연도 처리
        before: "1997–2016 연소 면적 기반 / 2017–2023 MODIS 활성 화재 기반 베타(DM·C만)"
        after: "1997–2022 GFED5.1 / 2023~ VIIRS 활성 화재 기반 GFED5.1NRT(매일 갱신, 베타)"
      - aspect: 해상도
        before: "전 기간 0.25°, 월 + 일·3시간 비율"
        after: "2001~ 0.25°, 1997–2000은 1° / 월·일 파일"
      - aspect: 파일 형식·변수
        before: "연도별 HDF5(GFED4.1s_YYYY.hdf5), 월 그룹 아래 `C`·`DM`(면적당), 물질별 배출은 사용자가 배출계수로 계산"
        after: "netCDF4, 40종 물질별 변수(`CO2`, `CO`, `CH4`, `PM2.5` 등)를 바로 제공"
      - aspect: 배포처·라이선스
        before: "geo.vu.nl 웹 디렉터리, ORNL DAAC(1997–2016)"
        after: "globalfiredata.org SFTP(포트 1022) + Zenodo, CC BY 4.0"
    impacts:
      - GFED4s로 맞춘 대기화학 모델 배출이나 탄소 수지를 GFED5로 바꾸면 화재 배출이 크게 늘어나므로, 모델 결과를 다시 평가하세요.
      - GFED4.1s의 2017년 이후 베타 값과 GFED5.1을 한 시계열로 섞지 마세요. 전 기간을 한 판으로 통일하세요.
      - 2022년까지(GFED5.1)와 2023년 이후(GFED5.1NRT)는 산출 방식이 달라, 이어 쓸 때 두 논문을 모두 인용하고 방식 변화를 밝히세요.
    sources:
      - name: van der Werf et al. (2025), Scientific Data
        url: https://doi.org/10.1038/s41597-025-06127-w
      - name: Chen et al. (2023), ESSD
        url: https://doi.org/10.5194/essd-15-5227-2023
      - name: GFED Data 페이지 (GFED4s 설명·GFED5 권장)
        url: https://www.globalfiredata.org/data.html
      - name: Chen et al. (2026), ESSD 토론 원고 (GFED5NRT)
        url: https://doi.org/10.5194/essd-2026-158

notices:
  - date: "2026-09-04"
    level: info
    title: GFED 웹사이트 개편 — 지역·국가·주 단위 현재 화재 상황 비교
    body: >-
      현재 화재 상황을 예년과 비교하기 쉽도록 사이트를 새로 만들었습니다. 권역·국가·대륙, 일부는 주(州) 단위까지 배출량 그래프를 볼 수 있고,
      그래프의 바탕 자료(텍스트)와 PDF 그림을 내려받을 수 있습니다.
    source: https://www.globalfiredata.org/news.html
  - date: "2026-02-19"
    level: warning
    title: GFED5NRT 2023~2024 재처리본 공개 — 2023년 이후 자료는 베타, 논문 승인 전까지 바뀔 수 있음
    body: >-
      2023년 이후 배출량은 VIIRS 활성 화재 탐지를 2012~2022년 관계로 연소 면적·배출량에 환산한 근실시간 확장판(GFED5NRT)이며, 2023~2024년 재처리본이 Zenodo에 공개되었습니다.
      공식 사이트는 이 기간 자료를 베타로 표시하고, 동반 논문(ESSD)이 승인될 때까지 값이 바뀔 수 있다고 안내합니다.
    source: https://doi.org/10.5281/zenodo.18702700
  - date: "2025-11-28"
    level: info
    title: GFED5 배출량 논문 출판 — GFED5.1(1997~2022) 확정 공개
    body: >-
      GFED5 배출량 논문이 Scientific Data에 실리면서 1997~2022년 월·일 배출량과 유형별 연소 면적·탄소 배출 자료(GFED5.1)가 Zenodo에 함께 공개되었습니다(자료 공개 2025-10-01).
      2026년 1월 15일 출판사 정정이 나왔습니다.
    source: https://doi.org/10.1038/s41597-025-06127-w

