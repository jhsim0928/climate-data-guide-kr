# ─────────────────────────────────────────────────────────────
# GFED (Global Fire Emissions Database) — 데이터셋 정보 파일
# 지면 탭 '산불'에 싣습니다. 현재 판은 GFED5.1(1997~2022) + GFED5.1NRT(2023~, 베타)이고, 이전 판 GFED4.1s도 아직 배포됩니다.
# GFED4.1s → GFED5 비교는 같은 페이지 안 transitions(to_id 없음)에 적었습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: gfed
name: "GFED"
full_name: Global Fire Emissions Database version 5 (GFED5.1 / GFED5.1NRT, 위성 연소 면적 기반 전지구 화재 배출량 자료, 0.25°)
category: analysis
domain: land
group: 산불
order: 20
domains: [육지, 대기, 에어로졸]
provider: 바헤닝언대학교(WUR)·UC 어바인·메릴랜드대학교·NASA GSFC GFED 연구진 (globalfiredata.org)

status: active
status_note: >-
  현재 판은 GFED5로, 1997~2022년은 논문과 함께 확정된 GFED5.1, 2023년 이후는 VIIRS 활성 화재로 연소 면적·배출량을 추정하는 근실시간 확장판
  GFED5.1NRT가 매일 갱신됩니다. 공식 사이트는 2023년 이후 자료를 '베타'로 표시하며 관련 논문(Chen et al., ESSD)이 승인될 때까지 바뀔 수 있다고 안내합니다.
  이전 판 GFED4.1s(2017년 이후는 MODIS 활성 화재 기반 베타)도 내려받을 수 있지만, 연구진은 가능하면 GFED5를 쓰라고 권합니다.

period:
  start: "1997-01"
  end: present
  note: >-
    GFED5.1은 1997~2022년(1997~2000년은 ATSR·TRMM VIRS 활성 화재로 추정한 1° 자료, 2001년부터 0.25°)이고, 2023년부터는 GFED5.1NRT가 이어집니다
    (Zenodo 재처리본은 2023~2024년, 그 이후는 사이트 SFTP에서 매일 갱신). GFED4.1s는 1997~2016년이 연소 면적 기반, 2017~2023년이 베타 파일입니다
    (2026-10-13 웹 디렉터리 기준 최신 GFED4.1s_2023_beta, 2024-01-26 갱신).

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: >-
    전지구 0.25° × 0.25° 위경도 격자(720 × 1440, 격자 중심 -89.875~89.875°, -179.875~179.875°), 2001년부터.
    1997~2000년은 불확실성이 커서 1° × 1° 격자로만 제공합니다. GFED4.1s도 0.25° 격자입니다.
  vertical: 지표 배출(연직 분포 없음)
  temporal: >-
    월(연소 면적·배출량) / 일(GFED5.1 일별 배출량 파일, GFED5.1NRT 일·월). GFED4.1s는 월자료에 일별 비율(daily_fraction)과
    3시간 일변화 비율(diurnal_cycle, 2003년~)을 곱해 일·3시간 값을 만듭니다.

update: "GFED5.1(1997~2022)은 고정 / GFED5.1NRT(2023~)는 매일 갱신, 과학 품질 VIIRS 자료가 나오면 비정기적으로 재처리 / GFED4.1s는 2024-01 이후 갱신 없음"
license: GFED5.1·GFED5.1NRT는 CC BY 4.0(Zenodo 기록·파일 속성). 무료이며 공동저자 요구는 없고, FAQ의 인용 안내를 따르면 됩니다
account_required: false

summary: >-
  GFED는 위성 연소 면적에 생지화학 모델로 계산한 연료 소비량과 배출계수를 곱해, 전지구 화재의 탄소·미량기체·에어로졸 배출량을 0.25° 격자로 만든 자료입니다.
  GFED5는 MODIS MCD64A1 C6.1에 Landsat·Sentinel-2로 보정한 누락·오탐 보정, 활성 화재 기반 소규모 화재, 농경지 연소(GloCAB)를 더해 연소 면적을 크게 늘렸고,
  배출계수와 연료 소비도 새로 정리했습니다. 대기화학·대기질 모델의 화재 배출 입력, 탄소순환 수지(Global Carbon Project 등), IPCC 평가에 널리 쓰입니다.

time_convention:
  summary: >-
    월자료는 그달 전체의 연소 면적·배출량 합계(누적)이고, GFED5.1 일별 파일은 그날 하루(UTC 기준 날짜)의 배출 합계입니다.
    2023년 이후 GFED5.1NRT는 VIIRS(Suomi NPP·NOAA-20, 오후 1시 30분 무렵 통과) 활성 화재의 '순간' 탐지 개수를 생물군계·지역별 환산표로
    하루 연소 면적·배출량으로 바꾼 값이며, 하루보다 짧은 시간 해상도는 제공하지 않습니다.
  points:
    - "GFED4.1s의 `C`·`DM`은 단위 면적당 월 배출(g C m-2 month-1, kg DM m-2 month-1)이므로, 지역 합계는 `grid_cell_area`(m2)를 곱해 더합니다."
    - "GFED4.1s의 일·3시간 값은 월 배출 × `daily_fraction`(그날 비율) × `diurnal_cycle`(8개 3시간 UTC 구간 비율)로 계산합니다(2003년부터). 일변화는 한 달 내내 같은 모양입니다."
    - "GFED5.1 일별 파일의 단위 속성은 'g <물질> per day' 형식입니다(예: `CO2` = 'g CO2 per day'). 면적당 값인지 격자 칸 합계인지는 받은 파일의 속성과 README로 확인하세요."
    - "GFED5.0 연소 면적 파일(BAYYYYMM.nc)의 값은 격자 칸당 그달 연소 면적(km2)입니다. 전지구 합계(Mha)는 합을 1e6으로 나눕니다."
    - "2023년 이후(GFED5.1NRT)는 연료 소비량을 2013~2022년 평균으로 고정하고 토지피복도 바꾸지 않습니다. 그 전 기간과 산출 방식이 다릅니다."
  source: https://www.globalfiredata.org/index.html
  source_name: "GFED 공식 사이트 + GFED4s Readme + GFED5 Zenodo README + van der Werf et al. (2025)·Chen et al. (2026) 논문"

variables:
  note: >-
    GFED5.1 일별 배출 파일(GFED5.1_daily_YYYY-MM.nc)에는 40종의 물질별 변수가 같은 이름 규칙으로 들어 있습니다. GFED5.1 월별 파일의 변수 이름은
    공개 문서에서 확인하지 못해, 확인된 GFED5.0 연소 면적 파일과 GFED4.1s(HDF5, 그룹 경로 포함) 변수를 함께 적었습니다.
  full_list: https://doi.org/10.1038/s41597-025-06127-w
  groups:
    - name: GFED5.1 일별 배출량 (GFED5.1_daily_YYYY-MM.nc, 0.25°)
      kind: accum
      period: 일
      items:
        - text: "건물질(dry matter) 연소량 — `DM` (g DM per day)"
          std: [fire_emissions]
        - text: "탄소 배출 — `C` (g C per day)"
          std: [fire_emissions]
        - text: "이산화탄소 배출 — `CO2` (g CO2 per day)"
          std: [fire_emissions]
        - text: "일산화탄소 배출 — `CO` (g CO per day)"
          std: [fire_emissions]
        - text: "메탄 배출 — `CH4` (g CH4 per day)"
          std: [fire_emissions]
        - text: "질소산화물 배출(NO 기준) — `NOx` (g NOx per day)"
          std: [fire_emissions]
        - text: "PM2.5 배출 — `PM2.5` (g PM2.5 per day)"
          std: [fire_emissions]
        - text: "블랙카본·유기탄소·총 탄소입자 배출 — `BC`, `OC`, `TPC` (g per day)"
          std: [fire_emissions]
        - text: "기타 미량기체 — `N2O`, `NH3`, `SO2`, `H2`, `NMOC_g`, `HCN`, `CH2O`, `C2H6`, `C5H8`, `C10H16` 등 (g per day)"
          std: [fire_emissions]
    - name: GFED5.0 연소 면적 (BAYYYYMM.nc, Chen et al. 2023 Zenodo, 2001~2020 0.25°)
      kind: accum
      period: 월
      items:
        - text: "총 연소 면적 — `Total` (km2, 격자 칸당)"
          note: 1997~2000년(1°)은 이 변수만 제공
          std: [burned_area]
        - text: "일반 연소 면적(토지피복 17종별) — `Norm` (km2)"
          note: "차원 (time, iLCT, lat, lon). iLCT 0~19 중 17종 사용"
          std: [burned_area]
        - text: "농경지·삼림 벌채·이탄지 연소 면적 — `Crop`, `Defo`, `Peat` (km2)"
          std: [burned_area]
    - name: GFED4.1s (GFED4.1s_YYYY.hdf5, 월 그룹 01~12)
      kind: accum
      period: 월
      items:
        - text: "연소 비율 — `burned_area/MM/burned_fraction` (격자 칸 대비 비율)"
          note: 소규모 화재 연소 면적(시험적 추정) 포함
          std: [burned_area]
        - text: "탄소 배출 — `emissions/MM/C` (g C m-2 month-1)"
          std: [fire_emissions]
        - text: "건물질 연소량 — `emissions/MM/DM` (kg DM m-2 month-1)"
          std: [fire_emissions]
        - text: "소규모 화재 배출 비율 — `emissions/MM/small_fire_fraction` (무차원)"
          kind: mean
          std: []
        - text: "화재 유형별 배출 비율 — `emissions/MM/partitioning/C_SAVA` 등 SAVA·BORF·TEMF·DEFO·PEAT·AGRI (무차원)"
          kind: mean
          std: []
        - text: "일별 배출 비율 — `emissions/MM/daily_fraction`, 3시간 일변화 비율 — `diurnal_cycle` (무차원, 2003~)"
          kind: mean
          std: []
        - text: "화재 탄소·순1차생산량·종속영양 호흡 — `biosphere/MM/BB`, `NPP`, `Rh` (g C m-2 month-1)"
          std: [fire_emissions, carbon_flux]
    - name: 고정 자료 (GFED4.1s ancill 그룹)
      kind: static
      items:
        - text: "격자 칸 면적 — `ancill/grid_cell_area` (m2)"
          std: []
        - text: "GFED 14개 기본 권역 — `ancill/basis_regions`"
          std: []

