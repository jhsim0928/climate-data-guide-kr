# ─────────────────────────────────────────────────────────────
# ESA CCI Snow — 데이터셋 정보 파일
# 지면 탭 '적설'. ESA Snow_cci 적설수당량(SWE v4.0)과 적설 면적비(SCFG·SCFV — MODIS·AVHRR v4.0, ATSR-2 v1.0),
# 그리고 전신인 ESA GlobSnow(SWE v3.0, SE v2.0)를 한 페이지에서 다룹니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: esa-cci-snow
name: "ESA CCI Snow"
full_name: ESA Snow Climate Change Initiative (Snow_cci) — 적설수당량(SWE)·적설 면적비(SCF) 기후자료 (전신 ESA GlobSnow 포함)
category: satellite
domain: land
group: 적설
order: 20
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 수문, 원격탐사]
provider: 유럽우주국(ESA) 기후변화 이니셔티브(CCI) Snow 과제 — 주관 ENVEO(오스트리아), SWE는 핀란드 기상청(FMI)·캐나다 환경기후변화부(ECCC), AVHRR 적설 면적은 베른대 생산 / 배포 영국 CEDA

status: active
status_note: >-
  과제는 CCI+ 2단계로 계속되고 있으며, 4번째 기후연구자료 묶음(CRDP v4)이 2025년 하반기에 CEDA에 올라왔습니다 — SWE·AVHRR 적설 면적 v4.0은 2025-09-04,
  MODIS 적설 면적 v4.0은 2025-12-03 공개(모두 2023-12까지). CCI 자료는 버전 단위로 내는 연구용 기후자료라 정기 갱신은 없고(CEDA 'Not Planned'),
  2023년 이후 적설 면적은 Sentinel-3 SLSTR 기반으로 C3S(Copernicus 기후변화 서비스) 설빙권 서비스가 이어 만들 예정입니다(CDS 공개 준비 중).
  MODIS 자료를 낸 Terra 위성은 2026년 말~2027년 초 운영 종료 예정이라 MODIS 기록은 더 길어지기 어렵습니다.

transitions:
  - from: ESA GlobSnow SWE v3.0
    to: ESA CCI Snow SWE v4.0
    status: completed
    summary: >-
      FMI가 ESA GlobSnow 과제에서 만든 북반구 적설수당량(SWE) 기록이 ESA CCI Snow 과제로 이어졌습니다. 같은 GlobSnow 방식(위성 수동마이크로파 + 지상 적설 깊이 관측의
      베이즈 동화)을 쓰지만 격자·기간·알고리즘 세부가 바뀌었으므로 두 자료를 한 시계열로 이어 붙이면 안 됩니다.
    changes:
      - aspect: 과제·배포처
        before: "ESA DUE GlobSnow (FMI) — globsnow.info(일자료), PANGAEA(월자료)"
        after: "ESA CCI Snow_cci (SWE는 FMI·ECCC 생산) — CEDA"
      - aspect: 기간
        before: "1979–2018 (Luojus et al. 2021), PANGAEA 월자료는 1980–2018"
        after: "1979-01 ~ 2023-12 (v3.1은 2022-05까지, v4.0에서 2023-12까지 연장)"
      - aspect: 격자
        before: "EASE-Grid 25 km × 25 km (북반구 방위 등적 투영)"
        after: "0.1° × 0.1° 위경도 격자 (12.5 km EASE-Grid 2.0에서 다시 표집, 3600 × 1800)"
      - aspect: 제공 시간 단위
        before: "일자료(Level A) + 월평균(Level B) + 편향 보정 월자료"
        after: "일자료만 (1979~1987은 이틀에 한 번)"
      - aspect: 눈 밀도 처리
        before: "CCI v2.0·v3.0까지는 밀도 변화를 후처리 단계에서 반영"
        after: "CCI v3.1부터 산출 과정 안에서 시공간적으로 변하는 눈 밀도 사용"
      - aspect: CCI v3.1 → v4.0 (2025-09)
        before: "v3.1: 1979-01 ~ 2022-05, 이전 방식의 통과 시각 처리"
        after: "v4.0: 2023-12까지 연장, 저녁 통과보다 아침 통과 관측을 우선 사용, 후처리 적설 마스크·북미 불확실성 모델 갱신 (검증 결과는 이전 버전과 비슷)"
      - aspect: 파일 형식·이름
        before: "GlobSnow NetCDF (CF)"
        after: "YYYYMMDD-ESACCI-L3C_SNOW-SWE-<센서>_<위성>-fv4.0.nc (예: 19910501-ESACCI-L3C_SNOW-SWE-SSMI_DMSP-fv4.0.nc)"
    impacts:
      - GlobSnow v3.0과 CCI SWE를 한 시계열로 섞지 마세요. 격자와 알고리즘이 달라 같은 날에도 값이 다릅니다.
      - GlobSnow의 '편향 보정 월자료'는 적설 조사(snow course) 자료로 깊은 눈의 과소추정을 보정한 별도 제품입니다. CCI 일자료를 월평균한 값과 직접 비교하지 마세요.
      - CCI SWE도 GlobSnow와 마찬가지로 산악 지역·그린란드·빙하는 빠져 있습니다. 산악 적설 연구에는 쓸 수 없습니다.
    sources:
      - name: CEDA — Snow_cci SWE v4.0 (1979–2023)
        url: https://catalogue.ceda.ac.uk/uuid/edf8abd23f4a40aabd4d52e48dec06ea/
      - name: CEDA — Snow_cci SWE v3.1 (1979–2022)
        url: https://catalogue.ceda.ac.uk/uuid/9d9bfc488ec54b1297eca2c9662f9c81/
      - name: Luojus et al. (2021) GlobSnow v3.0, Scientific Data
        url: https://doi.org/10.1038/s41597-021-00939-2
      - name: Snow_cci Product User Guide v5.1 (2025-12)
        url: https://climate.esa.int/documents/3136/Snow_cci_D4.3_PUG_v5.1.pdf
  - from: ESA GlobSnow Snow Extent v2.0
    to: ESA CCI Snow 적설 면적비(SCFG·SCFV)
    status: completed
    date: "2021-05"
    summary: >-
      GlobSnow의 광학 적설 면적(SE, ATSR-2·AATSR, 1995–2012)을 만든 방법(Metsämäki et al. 2015)을 바탕으로, CCI Snow는 MODIS(2000~)·AVHRR(1979~)·ATSR-2로
      범위를 넓힌 전지구 일별 적설 면적비를 냈습니다(첫 공개 v1.0 2021-05-10). 2025년 v4.0에서 MODIS와 AVHRR 모두 2023-12까지 이어졌습니다.
    changes:
      - aspect: 범위
        before: "북반구 (GlobSnow SE v2.0)"
        after: "전지구 육지 (남극·그린란드 빙상·영구 설빙 제외, 그린란드 해안은 포함)"
      - aspect: 센서·기간
        before: "ERS-2 ATSR-2·Envisat AATSR, 1995–2012"
        after: "Terra MODIS 2000-02-24 ~ 2023-12-31 (v4.0), NOAA·MetOp AVHRR 1979-01-01 ~ 2023-12-31 (v4.0), ATSR-2 1995-08-01 ~ 2003-06-22 (v1.0)"
      - aspect: 산출 변수
        before: "적설 면적(SE)"
        after: "숲 위에서 보이는 눈 SCFV와 숲 덮개 효과를 보정한 지면 눈 SCFG를 따로 제공, 화소별 불확실성(unbiased RMSE) 포함"
      - aspect: MODIS v3.0 → v4.0 (2025-12)
        before: "v3.0: 2000-02-24 ~ 2022-12-31"
        after: "사전 분류 완화, 낮은 태양 고도 반사도 보정, 눈 없는 지면·숲 반사도 갱신, 불확실성 산정 갱신, 일별 전지구 합성 방식 개선, 염호 마스크 갱신, 2023-12까지 연장"
    impacts:
      - "SCFV와 SCFG는 숲에서만 다르고 숲 밖에서는 같습니다. 숲 지역 연구라면 어느 쪽을 썼는지 반드시 밝히세요."
      - MODIS(1 km)와 AVHRR(5 km)은 해상도·센서가 달라 같은 날도 값이 다릅니다. 장기 추세는 AVHRR, 지역 상세는 MODIS처럼 목적에 맞게 하나를 고르세요.
      - 이전 버전(MODIS v1.0~v3.0, AVHRR v1.0·v2.0)은 CEDA에서 'superseded'로 표시되었습니다. 전 기간을 v4.0으로 다시 받으세요.
    sources:
      - name: CEDA — MODIS SCFG v4.0 (개선 사항 목록)
        url: https://catalogue.ceda.ac.uk/uuid/375ffdb8f0a445e380b4b9548655f5f9/
      - name: CEDA — MODIS SCFG v1.0 (2000–2019, superseded)
        url: https://catalogue.ceda.ac.uk/uuid/3b3fd2daf3d34c1bb4a09efeaf3b8ea9/
      - name: Metsämäki et al. (2015) GlobSnow Snow Extent, Remote Sensing of Environment
        url: https://doi.org/10.1016/j.rse.2014.09.018
      - name: GlobSnow 누리집 (SE v2.0·SWE v2.0/v3.0)
        url: https://www.globsnow.info/

period:
  start: "1979-01"
  end: "2023-12"
  note: >-
    제품마다 기간이 다릅니다. SWE v4.0은 1979-01-02 ~ 2023-12-31(CEDA 기록, PUG는 1979-01-06 시작)이며 1979~1987-05는 이틀에 한 번, 1987-10 이후는 매일이고,
    북반구 겨울철(대략 11~5월)에만 값이 있습니다. 적설 면적비는 AVHRR v4.0 1979-01-01 ~ 2023-12-31(1979~1986에 결측일이 모여 있어 전체 약 99%),
    MODIS v4.0 2000-02-24 ~ 2023-12-31, ATSR-2 v1.0 1995-08-01 ~ 2003-06-22입니다. Sentinel-3 SLSTR v1.0(2020–2022)은 ESA 과제 페이지에 안내되어 있지만
    CEDA 기록은 2026-10-13 확인 시 아직 미공개(Preview)입니다. 전신 GlobSnow SWE v3.0은 1979–2018입니다.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    적설 면적비: MODIS·ATSR-2·SLSTR는 0.01° × 0.01° 위경도 격자(WGS 84, 화소 중심 좌표, MODIS 파일 36000 × 18000), AVHRR는 0.05° × 0.05° 위경도 격자(약 5 km) —
    전지구 육지(남극·그린란드 빙상 제외). 적설수당량: 0.10° × 0.10° 위경도 격자(3600 × 1800)로, 12.5 km EASE-Grid 2.0에서 처리한 결과를 다시 표집한 것이며
    북반구 육지 중 산악·빙하·그린란드를 뺀 곳만 값이 있습니다. GlobSnow SWE v3.0은 25 km EASE-Grid(북반구 방위 등적 투영)입니다.
  vertical: 해당 없음 (지표 2차원 자료)
  temporal: 일별 (SWE는 1979~1987 이틀 간격, 북반구 겨울철만) / GlobSnow v3.0은 일·월·편향 보정 월자료

coverage:
  short: 전지구
  note: "육지, 남극·그린란드 빙상 제외"
update: >-
  정기 갱신 없음 — 과제 단계마다 새 버전 기후자료를 냅니다(CEDA update frequency 'Not Planned'). 최신은 CRDP v4(SWE·AVHRR 2025-09-04, MODIS 2025-12-03).
  2023년 이후 적설 면적은 C3S 설빙권 서비스의 SLSTR 기반 자료로 이어질 예정입니다.
license: >-
  ESA CCI Snow Terms and Conditions — 누구나 어떤 목적으로든 무료 사용(CEDA 'Any'). 발표물에 'ESA Climate Change Initiative and the Snow CCI project'와
  자료 제공자를 밝히고 데이터셋 DOI를 인용해야 합니다. GlobSnow v3.0 PANGAEA 월자료는 CC BY 4.0
account_required: false

summary: >-
  ESA 기후변화 이니셔티브(CCI)의 적설 과제(Snow_cci)가 만든 연구용 기후자료 묶음입니다. 적설수당량(SWE)은 SMMR·SSM/I·SSMIS 수동마이크로파 관측과 지상 기상관측소의
  적설 깊이를 베이즈 방식으로 동화한 북반구 일별 0.1° 자료(1979–2023)이고, 적설 면적비(SCF)는 MODIS(1 km, 2000–2023)·AVHRR(5 km, 1979–2023) 광학 자료로 구한
  전지구 일별 자료로, 숲 위에서 보이는 눈(SCFV)과 숲 아래 지면의 눈(SCFG)을 따로 제공합니다. 두 제품 모두 ESA GlobSnow 과제(SWE v3.0, 적설 면적 v2.0)의
  방법을 이어받았으며, 화소별 불확실성이 함께 들어 있습니다.

time_convention:
  summary: >-
    모든 파일은 날짜(YYYYMMDD)별 일자료이며, 하루 동안의 위성 관측에서 화소마다 고른 관측으로 구한 값입니다(평균이 아님). 적설 면적비는 Terra MODIS(오전 10:30 적도 통과로 설계된 궤도)
    또는 각 AVHRR 위성의 관측이며 화소별 관측 시각이 `scanline_time`에 들어 있습니다. SWE는 v4.0부터 아침 통과 관측을 우선 쓰고, 1979~1987년은 이틀에 한 번만 있습니다.
  points:
    - "MODIS 적설 면적비 파일은 여러 궤도 관측을 태양 천정각·위성 천정각에 따라 하루 한 장으로 합칩니다. 고른 관측의 위성 천정각(`satzen`)과 주사선 시각(`scanline_time`, 0.00~23.59 시간)이 함께 들어 있습니다. PUG는 이 시각이 UTC인지 지방시인지 밝히지 않으므로 받은 파일의 속성을 확인하세요."
    - "MODIS 적설 면적비는 Terra만 썼고 Aqua로 빈틈을 채우지 않았습니다. 구름(205)·극야(206) 화소는 비어 있고, 시간 방향 보간도 하지 않습니다."
    - "CEDA의 AVHRR 파일은 위성별 일자료입니다(파일 이름에 AVHRR_NOAA18, AVHRR_METOPB 등). 오전·오후 위성과 앞뒤 날짜로 구름 빈틈을 메운 '빈틈 없는' 일별 합성본은 Zenodo(doi:10.5281/zenodo.16746237, GeoTIFF)에 따로 있습니다."
    - "SWE는 북반구 겨울철(대략 11~5월)에만 산출하며, 마른 눈에서만 유효합니다. 젖은 눈이 있으면 산출할 수 없고, 적설 깊이 약 1 m를 넘으면 신호가 포화됩니다(PUG)."
    - "GlobSnow v3.0의 월자료(Level B)는 그달 일자료의 평균이고, 편향 보정 월자료는 여기에 시간 불변 보정을 더한 값입니다."
  source: https://climate.esa.int/documents/3136/Snow_cci_D4.3_PUG_v5.1.pdf
  source_name: Snow_cci Product User Guide v5.1 (2025-12) + CEDA 카탈로그 기록 + Luojus et al. (2021)

variables:
  note: >-
    CEDA 카탈로그 기록과 CCI THREDDS(OPeNDAP) 변수 목록에서 확인한 이름입니다. PUG 본문은 SWE 변수를 대문자(`SWE`, `SWE_STD`)로 적고 한 곳에서 `SWE_VAR`라고도 하지만,
    실제 v4.0 파일은 소문자 `swe`, `swe_std`입니다. 적설 면적비의 0~100 밖 값은 상태 코드이므로 계산 전에 반드시 걸러 내세요.
  full_list: https://climate.esa.int/documents/3136/Snow_cci_D4.3_PUG_v5.1.pdf
  groups:
    - name: 적설수당량 (SWE v4.0, 북반구 0.1°)
      kind: instant
      period: 일
      items:
        - text: "적설수당량 — `swe` (mm)"
          note: "그날 위성 통과 관측으로 추정한 값(v4.0은 아침 통과 우선). 0 = 눈 없음, 1~500 mm. 음수는 마스크 코드(-1 산출 안 함, -10 물, -20 산악, -30 빙하·영구 얼음)"
          std: [snow]
        - text: "적설수당량 추정 표준편차 — `swe_std` (mm)"
          note: "1~250 mm, 음수 코드는 `swe`와 같음"
    - name: 적설 면적비 (SCFG·SCFV — MODIS·AVHRR v4.0, ATSR-2 v1.0)
      kind: instant
      period: 일
      items:
        - text: "지면 적설 면적비(숲 덮개 보정) — `scfg` (%)"
          note: "하루 중 선택된 관측의 값. 0 눈 없음, 1~100 %, 205 구름, 206 극야, 210 물, 213 염호(MODIS), 215 영구 설빙, 252 분류 실패, 253 입력 오류, 254 위성 관측 없음, 255 무효"
        - text: "보이는 적설 면적비(숲 위 눈 포함) — `scfv` (%)"
          note: 숲 밖에서는 `scfg`와 같음. 상태 코드도 같음
        - "적설 면적비 불확실성(편향 제거 RMSE) — `scfg_unc`, `scfv_unc` (%)"
        - text: "위성 천정각 — `satzen` (°)"
          note: "MODIS·AVHRR v4.0. MODIS는 scale_factor 0.01, 65° 초과는 분류 실패로 처리"
        - text: "주사선 관측 시각 — `scanline_time` (시간, 0.00~23.59)"
          note: "MODIS·AVHRR v4.0. MODIS는 scale_factor 0.001"
          std: []

