    level: info
    title: MODIS 적설 면적비 v4.0 — 잘못 들어간 파일 삭제·추가 파일 교체
    body: >-
      2025-12-12 갱신 때 SCFV 폴더에 SCFG 파일(20130603-ESACCI-L3C_SNOW-SCFG-MODIS_TERRA-fv4.0.nc)이 잘못 들어가 삭제되었고,
      SCFG의 같은 날짜 파일은 2026-02-12 교체되었습니다. 해당 날짜 파일을 2025-12~2026-02 사이에 받았다면 다시 받으세요.
    source: https://catalogue.ceda.ac.uk/uuid/bc13bb02a958449aac139853c4638f32/
  - date: "2025-12-12"
    level: info
    title: MODIS 적설 면적비 v4.0 — 메타데이터·변수 빠진 파일 교체
    body: >-
      일부 파일에 메타데이터와 변수가 빠진 것이 확인되어 교체되었습니다 — SCFV 2002-02-04, 2006-02-06, 2022-02-08, 2023-02-09, SCFG 2012-06-01.
    source: https://catalogue.ceda.ac.uk/uuid/bc13bb02a958449aac139853c4638f32/
  - date: "2025-12-03"
    level: info
    title: MODIS 적설 면적비 SCFG·SCFV v4.0 공개 (2000–2023) — v3.0 대체
    body: >-
      Terra MODIS 기반 전지구 일별 적설 면적비 v4.0이 2023-12-31까지 연장되어 공개되었고 v3.0은 'superseded'로 표시되었습니다.
      사전 분류 완화, 낮은 태양 고도 보정, 반사도 기준층·불확실성·염호 마스크 갱신, 일별 합성 방식 개선이 들어갔습니다.
    source: https://catalogue.ceda.ac.uk/uuid/375ffdb8f0a445e380b4b9548655f5f9/
  - date: "2025-10-13"
    level: info
    title: AVHRR 적설 면적비 v4.0 — 손상 파일 교체·누락 파일 추가
    body: >-
      2025-09-08 SCFG 파일 20170720-ESACCI-L3C_SNOW-SCFG-AVHRR_METOPB-fv4.0.nc가 손상된 것으로 확인되어 같은 날 교체되었고,
      2025-10-13 처음 보관 때 빠졌던 SCFV 파일 20071108-ESACCI-L3C_SNOW-SCFV-AVHRR_NOAA18-fv4.0.nc가 추가되었습니다.
    source: https://catalogue.ceda.ac.uk/uuid/3c71c04cf08a410fac2c680cbf88cfd7/
  - date: "2025-09-04"
    level: info
    title: SWE v4.0과 AVHRR 적설 면적비 v4.0 공개 (1979–2023)
    body: >-
      적설수당량 v4.0이 1년 연장(2023-12까지)되고 아침 통과 관측 우선 사용으로 바뀌어 공개되었습니다.
      같은 날 AVHRR 기반 SCFG·SCFV v4.0도 1979-01 ~ 2023-12로 공개되었습니다(이전 AVHRR v2.0은 1982–2018).
    source: https://catalogue.ceda.ac.uk/uuid/edf8abd23f4a40aabd4d52e48dec06ea/
  - date: "2025-05-02"
    level: info
    title: Terra·Aqua 운영 종료 예정(2026년 말~2027년 초) — MODIS 기반 기록 연장 불가
    body: >-
      NASA는 MODIS를 실은 Terra·Aqua가 2026년 말~2027년 초 운영을 끝내고, 궤도 표류로 적도 통과 시각이 바뀌어 품질에 영향이 있을 수 있다고 안내했습니다.
      CCI Snow의 MODIS 적설 면적비는 Terra만 쓰므로 더 이어지기 어렵고, 과제 문서는 2023년 이후를 Sentinel-3 SLSTR 기반 C3S 자료로 잇는다고 밝히고 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

