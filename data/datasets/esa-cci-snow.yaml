    note: GlobSnow-2 과제는 끝났고 자료는 누리집에 계속 보관됩니다. 2026-10-13 확인 시 globsnow.info 자료 폴더는 응답하지 않았습니다.

example:
  lang: python
  note: >-
    CCI THREDDS의 SWE v4.0 집계 주소를 OPeNDAP로 열어 2020년 겨울 서시베리아 평원(60~80°E, 55~65°N)만 읽는 예입니다(계정 불필요). 산악 마스크 때문에
    산지에는 값이 거의 없어 평지 영역을 골랐습니다. 음수 마스크 코드를 결측으로 바꾼 뒤 계산하며, 위도 좌표가 내림차순일 수 있어 순서를 확인해 자릅니다.
  code: |
    import xarray as xr

    url = ("https://data.cci.ceda.ac.uk/thredds/dodsC/"
           "esacci.SNOW.day.L3C.SWE.multi-sensor.multi-platform.MERGED.4-0.r1")
    ds = xr.open_dataset(url)

    lat_slice = slice(65, 55) if ds.lat[0] > ds.lat[-1] else slice(55, 65)
    swe = ds["swe"].sel(time=slice("2020-01-01", "2020-03-31"),
                        lat=lat_slice, lon=slice(60, 80))
    swe = swe.where(swe >= 0)          # -1 산출 안 함, -10 물, -20 산악, -30 빙하 → 결측
    print(swe.mean(["lat", "lon"]).values)   # mm, 일별 영역 평균

    # MODIS 적설 면적비 일 파일은 0~100만 유효값입니다.
    # scf = xr.open_dataset("20200115-ESACCI-L3C_SNOW-SCFG-MODIS_TERRA-fv4.0.nc")["scfg"]
    # scf = scf.where(scf <= 100)      # 205 구름, 210 물, 215 영구 설빙 등 제거

tips:
  - "적설 면적비 파일의 205(구름)·206(극야)·210(물)·215(영구 설빙)·254(관측 없음) 같은 값은 % 값이 아니라 상태 코드입니다. 0~100만 남기지 않으면 평균이 크게 부풀려집니다."
  - "SWE의 음수(-1, -10, -20, -30)는 마스크 코드입니다. 특히 -20(산악)은 격자 안 고도 변화가 큰 곳을 통째로 빼므로 산지가 많은 지역(한반도 포함)은 결측이 많을 수 있습니다. 산악 적설에는 이 자료를 쓰지 마세요."
  - "SWE는 마른 눈, 적설 깊이 약 1 m 이하에서만 믿을 만합니다. 봄철 융설기(젖은 눈)와 아주 깊은 눈은 과소추정될 수 있습니다."
  - "SWE는 1979~1987년에 이틀에 한 번만 있고 1987년 10월부터 매일입니다. 일 단위 통계를 이 경계에 걸쳐 내면 표본 수가 달라집니다."
  - "SCFV(보이는 눈)와 SCFG(지면 눈)는 숲에서만 다릅니다. 모델의 지면 적설과 비교할 때는 SCFG, 위성 반사도·알베도 연구에는 SCFV가 맞습니다."
  - "MODIS v4.0 일부 파일이 2025-12-12과 2026-02-12에 교체·삭제되었습니다. 2025년 12월 이전에 받은 MODIS 파일이 있다면 해당 날짜 파일을 다시 받으세요(공지 참조)."
  - "AVHRR 기록은 여러 NOAA·MetOp 위성을 이어 붙인 것이고 위성마다 관측 시각이 다릅니다. CEDA 파일은 위성별로 나뉘어 있으니 같은 날 여러 파일이 있을 수 있습니다."
  - "GlobSnow v3.0, CCI v3.1, CCI v4.0은 모두 '같은 방식'이지만 값이 다릅니다. 논문에는 사용한 버전과 DOI를 정확히 적으세요."

