example:
  lang: python
  note: >-
    earthaccess로 V5.00 L2 에어로졸 프로파일을 받아 pyhdf로 읽는 예입니다. 처음 실행 때 Earthdata 계정을 묻습니다.
    CALIPSO 파일은 HDF4라 xarray로 바로 열리지 않습니다.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="CAL_LID_L2_05kmAPro-Standard-V5-00", version="V5-00",
        temporal=("2021-03-15", "2021-03-16"),
        bounding_box=(115, 30, 135, 45),          # (서, 남, 동, 북) — 동아시아
    )
    files = earthaccess.download(results[:1], "./calipso")

    f = SD(files[0], SDC.READ)
    ext = f.select("Extinction_Coefficient_532")[:].astype(float)   # (프로파일, 399 고도), km-1
    qc = f.select("Extinction_QC_Flag_532")[:]
    cad = f.select("CAD_Score")[:]
    alt = f.select("Lidar_Data_Altitudes")[:]                       # V5.00부터 데이터셋 (km)
    ext[ext < 0] = np.nan                                          # -9999·-333·-111 등 특수값 제거
    print(ext.shape, alt[:3], np.nanmax(ext))

tips:
  - "소광계수를 그대로 평균하지 마세요. -9999(입자 없음)·-333(산출 실패)·-111(저에너지)·-444(구름 제거 의심) 같은 특수값과, `CAD_Score`가 −20~0 사이인 신뢰 낮은 판정, 거부 대상 `Extinction_QC_Flag_532`를 먼저 걸러야 합니다."
  - "`CAD_Score`는 음수면 에어로졸, 양수면 구름입니다. |점수| ≤ 20이면 판별 신뢰도가 낮습니다."
  - "빛이 완전히 가려지는 두꺼운 구름·먼지층 아래는 신호가 없어, 기둥 광학두께가 '보이는 층 바닥까지'의 값입니다. 불투명 여부를 확인하지 않으면 AOD가 과소평가됩니다."
  - "CALIOP AOD는 532 nm 값이고 라이다비 가정에 따라 달라집니다. MODIS·AERONET(550·500 nm)과 비교할 때는 파장 차이와 라이다비 불확실성을 함께 따지세요."
  - "주간 자료는 잡음이 커서 옅은 에어로졸층을 놓치기 쉽습니다. 기후값·추세는 야간 자료로 먼저 확인하는 경우가 많습니다."
  - "남대서양 이상대(SAA)에서는 방사선 잡음과 저에너지 펄스 때문에 V5.00 L3 표본이 80~100% 줄어 결측 격자가 많습니다."
  - "V4.20 자료 설명서에는 대류권 AOD 이름이 `Column_Optical_Depth_Aerosols_532`로 적혀 있습니다. 옛 판 파일을 함께 쓴다면 판마다 SDS 이름을 확인하세요."
  - "2018년 9월 고도를 705 km에서 688 km로 낮춰 CloudSat과 C-Train을 이룬 뒤로는 A-Train(Aqua·Aura)과 같은 궤적을 지나지 않습니다. 이후 기간 MODIS·OMI와의 동시 관측 짝짓기는 시공간 거리를 다시 확인하세요."

