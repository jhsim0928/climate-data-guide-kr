notices:
  - date: "2025-10-01"
    level: warning
    title: V5.00 공개 — 2006~2023년 전 기간 재처리, V4.51 대신 사용
    body: >-
      CALIPSO 팀이 L1·L2·L3를 모두 다시 처리한 V5.00을 공개했습니다(품질 요약서 기준 공개일 2025-10-01, CMR 인용 정보는 2025-12-12).
      저에너지 펄스 처리 강화와 L3 선별 규칙 변경으로 값이 달라졌으니, 새 분석은 V5.00으로 하고 이전 판과 섞지 마세요.
    source: https://asdc.larc.nasa.gov/documents/calipso/quality_summaries/cal_lid_l2_pro_v5-00_desc_qs.pdf
  - date: "2023-09-26"
    level: critical
    title: CALIPSO 과학 임무 종료 — 마지막 관측 2023-06-30
    body: >-
      NASA와 CNES는 2023년 8월 1일 CALIPSO 과학 임무를 끝냈습니다. 연료가 바닥나 궤도가 낮아지고 전력이 부족해 과학 측기를 계속 켤 수 없었으며,
      표준 자료는 2023년 6월 30일 관측까지입니다. 위성은 2023년 12월 비활성화되었습니다.
    source: https://www.nasa.gov/missions/calipso/first-long-duration-lidar-satellite-mission-calipso-ends/

