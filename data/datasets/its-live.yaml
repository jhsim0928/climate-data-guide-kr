notices:
  - date: "2026-06-09"
    level: info
    title: NSIDC GoLIVE 지도 앱 종료(2026-06-30) — 대안으로 ITS_LIVE 안내
    body: >-
      NSIDC DAAC가 Landsat 8 빙하 유속 자료 GoLIVE(NSIDC-0710)의 지도 앱을 2026년 6월 30일 종료한다고 알렸습니다. GoLIVE 자료 자체는 계속 받을 수 있으며,
      더 폭넓게 재처리된 유속 자료가 필요하면 1984년~현재 전지구 유속을 제공하는 ITS_LIVE를 쓰라고 안내했습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-upcoming-retirement-golive-map-application
  - date: "2025-09-05"
    level: info
    title: ITS_LIVE V2 공식 설명 논문 출판 — Sentinel-1 처리 일시 중단 명시
    body: >-
      Gardner et al. (2025, The Cryosphere)가 V2.0 영상쌍·데이터큐브·모자이크의 처리 방법과 지연 시간, 알려진 오차를 정리했습니다. 논문 작성 시점에는 처리 비용 때문에
      Sentinel-1 처리가 멈춰 2014~2022년만 처리되어 있었고 2025년 중반 재개를 예상한다고 밝혔습니다. 2026-10-13 확인 시 STAC에는 2026년 Sentinel-1C·1D 영상쌍이 올라오고 있습니다.
    source: https://doi.org/10.5194/tc-19-3517-2025
  - date: "2025-07-23"
    level: warning
    title: NSIDC-0776 지역 연평균 모자이크 V2 공개, V1은 2025-08-26 퇴역
    body: >-
      NSIDC DAAC가 Sentinel-1·Sentinel-2·Landsat 4~9를 autoRIFT로 처리한 120 m 지역 연평균 유속(1984~2022)과 2014~2022년 기후값 모자이크 V2를 공개했습니다.
      V1(Landsat만, 1985~2018)은 2025년 8월 26일 NSIDC에서 내려가 더 이상 받을 수 없고 문서만 남습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-measures-its_live-regional-glacier-and-ice-sheet-surface-velocities-version-2

transitions:
  - from: ITS_LIVE V1
    to: ITS_LIVE V2
    status: completed
    date: "2025-07"
    summary: >-
      Landsat만 쓰던 V1을 Sentinel-1·Sentinel-2·Landsat 9까지 넓히고, 격자를 240 m에서 120 m로 줄이며 개선된 autoRIFT 특징 추적과 오차 산정으로 전 기간을 다시 처리한 판입니다.
      AWS의 영상쌍·데이터큐브가 먼저 V2로 바뀌었고, NSIDC 지역 모자이크는 2025-07 V2(NSIDC-0776)가 공개되며 V1이 퇴역했습니다.
    changes:
      - aspect: 입력 위성
        before: Landsat 4·5·7·8 (TM, ETM+, OLI)
        after: "Landsat 4·5·7·8·9, Sentinel-2A/B(/C), Sentinel-1A/B(/C) IW"
      - aspect: 격자 간격
        before: "240 m (NSIDC-0776 V1 일부 120 m)"
        after: 모든 센서 공통 120 m
      - aspect: 지역 모자이크 기간
        before: "1985~2018 (2013년 이전 성김)"
        after: "1984~2022 (NSIDC V2), 기후값 2014~2022. AWS V02.1은 2024년까지"
      - aspect: 투영 왜곡
        before: 지도 투영 축척 왜곡을 보정한 속도
        after: 지도 투영 평면의 속도 그대로(최대 몇 % 축척 오차, 사용자가 보정)
      - aspect: 처리 알고리즘
        before: auto-RIFT 초기판
        after: 개선된 autoRIFT 특징 추적, 안정 지표 기반 편향 보정(stable_shift), 오차 산정 갱신
      - aspect: 제공처
        before: NSIDC(Earthdata 로그인), 2023년 4월 이전 자료
        after: "AWS its-live-data 버킷·STAC(로그인 없음), NSIDC-0776 V2(로그인)"
    impacts:
      - V1과 V2 값을 한 시계열로 이어 붙이지 마세요. 센서 구성·격자·투영 왜곡 보정 여부가 달라 같은 지점도 값이 다릅니다.
      - "V1으로 GPS와 비교하던 분석 절차를 V2에 그대로 쓰면 투영 왜곡만큼(최대 몇 %) 차이가 납니다. V2에서는 비교 전에 축척 보정을 직접 하세요."
      - "NSIDC-0776 V1 파일은 2025-08-26 이후 받을 수 없습니다. 예전 결과를 재현하려면 V2로 다시 계산하고 판 차이를 적으세요."
      - "NSIDC의 Landsat 영상쌍 V1(NSIDC-0775, 240 m, 1985~2018)은 아직 '최신 판'으로 남아 있지만 V2 영상쌍은 AWS·STAC에서만 받을 수 있습니다."
    sources:
      - name: NSIDC — NSIDC-0776 V2 공개·V1 퇴역 공지 (2025-07-23)
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-measures-its_live-regional-glacier-and-ice-sheet-surface-velocities-version-2
      - name: NSIDC-0776 V2 사용자 안내서
        url: https://nsidc.org/sites/default/files/documents/user-guide/nsidc-0776-v002-userguide.pdf
      - name: Gardner et al. (2025), The Cryosphere
        url: https://doi.org/10.5194/tc-19-3517-2025
      - name: Lei et al. (2022), ESSD (Sentinel-1 V2 처리)
        url: https://doi.org/10.5194/essd-14-5111-2022

