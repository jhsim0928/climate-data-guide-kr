notices:
  - date: "2025-09-02"
    level: warning
    title: 2025-08-25·26 MUR 품질 크게 저하 (재처리 전까지 그대로 제공)
    body: >-
      입력 자료 생산 체인이 끊겨 2025-08-24 이후 입력이 점점 빠졌고, 특히 8월 25·26일은 고해상도 위성 관측이 대부분 빠져 해상도가 매우 낮은 장이 되었다고
      PO.DAAC 담당자가 Earthdata 포럼에서 밝혔습니다. 8월 27일 무렵부터 정상 생산 중이며, 25·26일 자료는 언젠가 재처리할 예정이지만 현재는 그대로 제공됩니다.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=23994
  - date: "2024-10-14"
    level: warning
    title: 허리케인 Helene·Milton 영향으로 MUR·MUR25 품질 저하
    body: >-
      허리케인 Helene·Milton이 NOAA 자료 센터에 큰 피해를 주어 AMSR2 L2P(RSS) 등 여러 SST 자료가 빠졌습니다.
      MUR v4.1과 MUR25 v4.2는 AMSR2 마이크로파 SST를 핵심 입력으로 쓰기 때문에 이 기간 품질이 떨어졌다고 PO.DAAC가 공지했습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2024-10-14-Impacts-to-recent-PODAAC-SST-datasets
  - date: "2024-09-04"
    level: info
    title: MUR v4.1 수집 오류로 인한 게시 중단 해소
    body: >-
      2024-08-29 이후 새 파일이 올라오지 않던 문제는 PO.DAAC 내부의 MUR v4.1 수집(ingest) 오류 때문이었고, 9월 4일 고쳐 밀린 파일이 모두 올라왔다고
      PO.DAAC 사용자 지원팀이 Earthdata 포럼에서 알렸습니다. 이런 개별 장애는 공지 페이지에 올라오지 않을 수 있어 메일링 리스트 가입을 권했습니다.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=20284
  - date: "2023-03-31"
    level: warning
    title: AMSR2 빠진 기간(2022-12-17~2023-02-27)과 클라우드 입력 전환
    body: >-
      AMSR2 자료가 v8a에서 v8.2로 재처리되는 과정에서 PO.DAAC에 공백이 생겨, MUR(1 km)과 MUR25가 2022-12-17~2023-02-27에 AMSR2 없이 만들어졌습니다.
      이 기간에는 SST 품질이 다소 떨어졌을 수 있습니다. 또 2023-03-13부터 MUR 생산이 NASA Earthdata Cloud의 L2P 입력을 쓰도록 바뀌었으며 사용자에게는 영향이 없다고 밝혔습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2023-03-31-Update-to-the-MUR-SST-processing-chain-and-recent-timeline
  - date: "2019-10-18"
    level: info
    title: 0.25° 축소판 MUR25 v4.2 공개
    body: >-
      MUR과 같은 분석 방법·입력으로 만든 0.25° 일별 분석장 MUR25 v4.2(2002-09-01~)가 PO.DAAC에 공개되었습니다.
      자료량이 훨씬 작고 MUR 기후값 대비 SST 편차를 함께 담아 장기 기후 연구용으로 내놓았습니다.
    source: https://podaac.jpl.nasa.gov/announcements/2019-10-18_GHRSST_L4_MUR_0.25deg_Global_Foundation_SST_Analysis_v4.2_Dataset_Release

