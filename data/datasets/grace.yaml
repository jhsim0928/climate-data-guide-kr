notices:
  - date: "2026-05-01"
    level: info
    title: GRACE Level-2 RL07(CSR·JPL) 공개 — Level-3·mascon과 GRACE-FO RL07은 아직
    body: >-
      PO.DAAC에 GRACE(2002-04 ~ 2017-06) 월별 구면조화 계수 RL07(CSR·JPL)이 2026-05-01 공개일로 등록되었습니다. 2026-10-13 확인 시 GRACE-FO RL07과
      Tellus Level-3·mascon RL07 컬렉션은 공개되지 않았으며, 육수저장량 격자는 여전히 RL06.x가 현재 판입니다.
    source: https://cmr.earthdata.nasa.gov/search/collections.umm_json?short_name=GRACE_L2_JPL_MONTHLY_0070
  - date: "2025-10-07"
    level: warning
    title: GRACE-FO 반복 궤도로 인한 품질 저하 — 2024년 9~11월, 2026년 7월 ~ 2027년 2월 예상
    body: >-
      GRACE-FO 과학 운영 보고에 따르면 2024년 9~11월 4/61 반복 궤도(고도 약 470 km)로 약 60일간 지상 궤적 표본이 부족해 월별 중력장 품질이 떨어졌고,
      2026년 7월 ~ 2027년 2월에는 3/46 반복 궤도(약 445 km)에 들어갈 것으로 예상되었습니다(태양 활동에 따라 머무는 기간이 2~18개월로 달라질 수 있음).
    source: https://cpaess.ucar.edu/sites/default/files/grace-fo-2025-presentation/save-himanshu-som.pdf
  - date: "2024-09-12"
    level: info
    title: GRACE-FO JPL RL06.3 공개 — Level-2·3과 mascon 갱신
    body: >-
      JPL Level-2, Tellus Level-3(육상·해저압), mascon(CRI·필터 없음)이 RL06.3으로 바뀌었습니다. RL06.1과는 GF2 위성에 쓰는 Level-1B 가속도계 대체 자료만 다르며
      (GF1·GF2 관측을 함께 쓰는 ACX2), JPL mascon에서는 넓은 자세 허용 모드였던 2023년 1·2월과 7월 이후 달만 값이 바뀝니다.
    source: https://podaac.jpl.nasa.gov/announcements/2024-09-12-Release-of-GRACE-FO-JPL-RL06.3-for-L2-3-and-MASCON-Data-Sets
  - date: "2022-05-12"
    level: info
    title: GRACE-FO RL06.1 공개 — 혼합 가속도계 대체 자료(ACX) 도입
    body: >-
      GF1·GF2 가속도계 관측을 함께 쓰는 새 대체 자료(ACX)로 Level-2·3을 다시 만들었습니다. ACX는 검증에 시간이 더 들어 월별 Level-2·3과 함께 지연 공급되며,
      당시 지연은 약 40일이었습니다.
    source: https://grace.jpl.nasa.gov/data/data-updates/
  - date: "2018-09-17"
    level: warning
    title: GRACE-FO 마이크로파 처리 장치 고장으로 관측 중단 — 2018년 8·9월 자료 없음
    body: >-
      2018-07-19 GRACE-FO 2호기의 주 마이크로파 처리 장치(IPU)가 꺼져 7월 중순부터 과학 관측이 멈췄고, 9월에 예비 장치로 전환해 관측을 재개하기로 했습니다.
      그 결과 GRACE-FO 월자료에는 2018-08·09가 없고 2018-07도 7월 1~18일만으로 만들어졌습니다.
    source: https://sealevel.nasa.gov/news/142/grace-fo-satellite-switching-to-backup-instrument-processing-unit
  - date: "2017-10-27"
    level: critical
    title: GRACE 과학 임무 종료 — GRACE-FO까지 약 11개월 공백
    body: >-
      2017년 9월 GRACE-2의 노후 배터리 문제가 생겨 10월 중순 과학 장비를 운용할 수 없게 되면서 GRACE 과학 임무가 끝났습니다. 마지막 월자료는 2017-06이며,
      GRACE-FO 첫 월자료(2018-06)까지 2017-07 ~ 2018-05가 비어 있습니다.
    source: https://www.jpl.nasa.gov/news/prolific-earth-gravity-satellites-end-science-mission/

