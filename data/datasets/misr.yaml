# ─────────────────────────────────────────────────────────────
# MISR (Terra) 에어로졸 — Level 2 V23(4.4 km)·Level 3 — 데이터셋 정보 파일
# 위성 탭(에어로졸·대기 성분). 2022년 10월 Terra 궤도 변경 이후 FINAL L2·L3 생산이 멈추고 FIRSTLOOK L2만 이어지고 있습니다.
# Terra 과학 운용 종료 전망(2027년 2월)과 궤도 표류(통과 시각 변화)가 핵심 주의사항입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: misr
name: "MISR"
full_name: Terra Multi-angle Imaging SpectroRadiometer (MISR) Level 2 Aerosol (V23, 4.4 km)·Level 3 Component Global Aerosol (Terra 위성 9방향 다각도 영상분광계 에어로졸 광학두께·입자 특성)
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 30
domains: [대기, 에어로졸, 원격탐사]
provider: NASA JPL MISR 과학팀 / NASA Langley ASDC

status: delayed
status_note: >-
  표준(FINAL) L2 에어로졸(MIL2ASAE V003, 알고리즘 V23)과 L3 일·월자료는 2022년 10월 12일 자료에서 멈춰 있습니다. Terra 궤도 고도가 바뀌어 처리 체계를 고쳐야 했기 때문이며,
  그 뒤로는 예비판인 FIRSTLOOK L2(MIL2ASAF, 제품 버전 30)만 매일 나옵니다(2026-10-13 확인 시 10월 11일 궤도까지). 2022년 10월 이후 FINAL L2·L3의 재처리 일정은 확인되지 않았고,
  NASA는 연료·전력 한계로 Terra의 과학 운용이 2027년 2월 끝날 것으로 내다봅니다.

transitions:
  - from: MISR L2 Aerosol V22 (17.6 km)
    to: MISR L2 Aerosol V23 (4.4 km)
    status: completed
    date: "2018-02"
    summary: >-
      V23은 에어로졸 산출 해상도를 17.6 km에서 4.4 km로 높이고 파일 형식을 HDF4에서 NetCDF-4로 바꾼 판으로, 전 기간이 V23(MIL2ASAE V003)으로 다시 처리되었습니다.
    changes:
      - aspect: 산출 해상도
        before: 17.6 km
        after: 4.4 km × 4.4 km
      - aspect: 파일 형식
        before: HDF4 블록 쌓기(stacked-block) 형식
        after: NetCDF-4, 산출마다 위경도·시각 정보 포함
      - aspect: 변수 이름
        before: V22 고유 이름
        after: 다른 위성 산출물과 맞춘 간결한 이름(예 `Aerosol_Optical_Depth`)
      - aspect: 알고리즘
        before: V22 알고리즘
        after: "구름 선별 추가, 0.025 미만 광학두께 조견표 격자 추가, L1B2 복사량 veiling light 보정, 어두운 바다의 엽록소(underlight) 보정, MISR 태양 반사광으로 해상풍 추정, 육지 혼합물 선택·불확실성 표준화"
      - aspect: 검증 수준
        before: V22 기준
        after: "`Aerosol_Optical_Depth` Stage 3 검증, 그 밖의 입자 특성 Stage 2"
    impacts:
      - V22 파일·코드를 쓰던 분석은 변수 이름·격자가 모두 바뀌므로 V23으로 다시 짜야 합니다.
      - 품질 문서는 4.4 km 산출로 관측 범위가 늘고 AERONET-DRAGON 집중 관측과의 일치도가 좋아졌다고 밝힙니다. 다만 V23 광학두께의 공식 검증은 문서 작성 당시 진행 중이었습니다.
    sources:
      - name: Data Quality Statement for the MISR Level 2 Aerosol Product (V023, 2018-02-07)
        url: https://asdc.larc.nasa.gov/documents/misr/quality_summaries/DQS_AEROSOL_V023.20180207.pdf
      - name: Garay et al. (2020), AMT — 4.4 km MISR 에어로졸 산출물 소개
        url: https://doi.org/10.5194/amt-13-593-2020

period:
  start: "2000-02"
  end: present
  note: >-
    FINAL L2(MIL2ASAE V003)는 2000-03-01부터 2022-10-12까지, L3 일자료(MIL3DAEN)는 2022-10-12까지, L3 월자료(MIL3MAEN)는 2000-02부터 2022-09까지입니다.
    FIRSTLOOK L2(MIL2ASAF)는 2017-11-01부터 지금까지 이어지며, 2022-10-13 이후 궤도는 새 처리 체계(제품 버전 30)로 만든 파일이고 2026-10-13 확인 시 2026-10-11 궤도까지 있습니다.

resolution:
  spatial_short: "4.4 km (0.04°)"
  temporal_short: "1일"
  spatial: >-
    L2: 4.4 km × 4.4 km 산출 격자(궤도 단위 스와스, MISR 경로·블록 체계) / L3: 0.5° × 0.5° 전지구 위경도 격자 (MISR_AM1_CGAS 파일)
  vertical: 기주 전체(지표~대기 상단) 에어로졸 광학두께 단일층
  temporal: >-
    L2: 궤도 하나당 파일 하나(MISR 경로·궤도 번호가 파일 이름에 들어감), 전지구를 한 번 덮는 데 9일 / L3: 일·월·계절(분기)·연

coverage:
  short: 전지구
  note: "주간 궤도 스와스(폭 약 380 km), 전지구를 덮는 데 9일"
update: "FIRSTLOOK L2 매일(2026-10-13 확인 시 10월 11일 궤도가 12일에 생산됨). FINAL L2·L3는 2022-10-12 이후 생산이 멈춘 상태"
