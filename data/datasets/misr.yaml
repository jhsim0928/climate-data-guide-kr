example:
  lang: python
  note: "NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행합니다. 2022년 10월 이후 자료가 필요하면 short_name을 MIL2ASAF, version을 002로 바꿉니다(예비판)."
  code: |
    # pip install earthaccess xarray netCDF4 numpy
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="MIL2ASAE", version="003",          # FINAL L2 에어로졸 V23, 4.4 km
        temporal=("2020-08-01", "2020-08-02"),
        bounding_box=(124, 33, 131, 39),               # 한반도 주변 (서, 남, 동, 북)
    )
    files = earthaccess.download(results[:1], "./misr")

    ds = xr.open_dataset(files[0], group="4.4_KM_PRODUCTS")
    aod = ds["Aerosol_Optical_Depth"].where(ds["Aerosol_Optical_Depth"] > -9999)
    print(float(aod.mean()), ds["Latitude"].shape)

tips:
  - "2022년 10월 이후 기간은 FIRSTLOOK(예비판)뿐입니다. FIRSTLOOK은 이전 기간 보조 자료로 처리하고, 이후 궤도는 새 처리 체계(제품 버전 30)로 만들어졌습니다. 2022년 전후를 한 시계열로 이을 때는 이 차이를 명시하세요."
  - "품질 문서는 `Aerosol_Optical_Depth`만 Stage 3로 검증되었고 입자 특성(옹스트롬 지수, 흡수·비구형·크기별 광학두께)은 Stage 2라고 밝힙니다. 입자 특성은 중간 가시광 광학두께가 약 0.15를 넘을 때 더 믿을 만합니다."
  - "알려진 문제: 걸러지지 않은 구름에 의한 높은 광학두께, 얇은 권운(광학두께 0.3 미만)이 비구형 입자로 보이는 현상, 짙은 연기 기둥이 구름으로 걸러지는 경우, 눈·얼음 위 비정상적으로 높은 값, 광학두께 3.0 초과는 산출 안 함."
  - "그린란드·남극 위 산출은 사용자용 필드에서 걸러져 있습니다. 필요하면 `AUXILIARY` 그룹의 원시(`_Raw`) 필드를 보라고 안내합니다."
  - "Terra는 2020년 말 이후 궤도가 표류해 적도 통과 시각이 앞당겨지고 고도가 낮아졌습니다. 2022년 10월 이후 궤도는 고정된 233개 WRS-2 경로와 맞지 않아, 경로 번호로 같은 장소를 찾던 방식이 통하지 않을 수 있습니다."
  - "전지구를 덮는 데 9일이 걸리므로 같은 곳을 매일 보지 못합니다. MODIS 등 매일 전지구를 덮는 자료와 월평균을 비교할 때는 표본 수 차이를 고려하세요."

