account_required: true

summary: >-
  NASA Terra 위성의 MISR는 9대의 카메라로 같은 곳을 앞뒤 여러 각도(0°~70.5°)에서 4개 파장(446·558·672·867 nm)으로 촬영해, 육지와 바다 위에서
  에어로졸 광학두께와 입자의 크기·흡수·비구형성 정보를 구합니다. 2000년부터 이어진 20여 년 기록이라 MODIS와 함께 에어로졸 장기 변화, 산불·먼지 연기, 기후모델 검증에 널리 쓰입니다.
  다만 전지구를 한 번 덮는 데 9일이 걸리고, 2022년 10월 이후 표준(FINAL) 산출이 멈춰 최근 자료는 예비판(FIRSTLOOK)뿐입니다.

time_convention:
  summary: >-
    L2 값은 Terra가 지나간 시각(오전 궤도)의 순간값이고, L3는 그 L2 값을 0.5° 격자에 날·달·계절·해 단위로 모은 통계입니다.
  points:
    - "Terra는 설계상 지방시 10:30에 적도를 지나는 오전 궤도 위성이고, MISR는 햇빛이 비치는 낮 쪽만 관측합니다. NASA에 따르면 2020년 말 경사각 조정을 멈춘 뒤 궤도가 표류해 2022년 가을에는 고도가 약 5 km 낮아지고 적도 통과가 10:15로 앞당겨졌습니다."
    - "L2 파일에는 산출마다 관측 시각(`Time`, ±30초)과 연·월·일·시·분 변수가 있습니다. 하루 평균을 만들 때는 UTC 날짜와 지방 날짜를 구분하세요."
    - "FIRSTLOOK은 이전 기간(품질 문서 표현으로는 전년도) 보조 자료로 빨리 처리한 예비판이고, FINAL은 확정판입니다. 파일 이름에 FIRSTLOOK이 있는지 꼭 확인하라고 품질 문서가 안내합니다."
    - "MISR는 전지구를 한 번 덮는 데 9일이 걸립니다. 일자료(L3 일)는 빈 곳이 많고, 월자료도 지역마다 들어간 관측 수가 크게 다릅니다."
  source: https://asdc.larc.nasa.gov/documents/misr/quality_summaries/DQS_AEROSOL_V023.20180207.pdf
  source_name: MISR L2 Aerosol V23 Data Quality Statement + DPS + NASA 'Terra The End of An Era'

variables:
  note: >-
    L2 변수명은 V23 L2 에어로졸 Data Product Specification의 이름이며, 주요 변수는 NetCDF 그룹 `4.4_KM_PRODUCTS` 안에 있습니다(원시 값은 `4.4_KM_PRODUCTS/AUXILIARY`, 각도는 `GEOMETRY`).
    광학두께 필드는 550 nm 기준이고 결측값은 -9999.0입니다. L3 변수명은 CGAS Data Product Specification(F15_0032)의 이름이며, NetCDF 그룹 `Aerosol_Parameter_Average` 안에 있습니다.
  full_list: https://asdc.larc.nasa.gov/documents/misr/DPS_AEROSOL_V023.20180125.pdf
  groups:
    - name: L2 에어로졸 (MIL2ASAE·MIL2ASAF, 4.4 km)
      kind: instant
      period: 통과 시각
      items:
        - text: "에어로졸 광학두께(550 nm) — `Aerosol_Optical_Depth` (무차원)"
          note: Stage 3 검증 — 가장 신뢰도가 높은 변수
        - text: "광학두께 불확실성 — `Aerosol_Optical_Depth_Uncertainty` (무차원)"
          std: [aerosol]
        - text: "옹스트롬 지수(550–860 nm) — `Angstrom_Exponent_550_860nm` (무차원)"
          std: [aerosol]
        - "흡수 에어로졸 광학두께 — `Absorption_Aerosol_Optical_Depth` (무차원)"
        - "비구형 에어로졸 광학두께 — `Nonspherical_Aerosol_Optical_Depth` (무차원)"
        - text: "크기별 광학두께(반경 0.35 µm 미만·0.35~0.7 µm·0.7 µm 초과) — `Small_Mode_Aerosol_Optical_Depth`, `Medium_Mode_Aerosol_Optical_Depth`, `Large_Mode_Aerosol_Optical_Depth` (무차원)"
          std: [aerosol]
        - "관측 시각 — `Time` (초, ±30초)"
    - name: L3 성분 전지구 에어로졸 (MIL3DAEN 일 / MIL3MAEN 월, 0.5°)
      kind: mean
      period: 일/월
      items:
        - text: "기주 에어로졸 광학두께(550 nm) 평균·표준편차·표본 수 — `Aerosol_Optical_Depth`, `Aerosol_Optical_Depth_Standard_Deviation`, `Aerosol_Optical_Depth_Count` (무차원)"
          std: [aerosol]
          note: "차원 Latitude·Longitude·Optical_Depth_Range(0번 = 전체, 1~8번 = 광학두께 구간별). 표본 수는 개수. 흡수 광학두께 `Absorbing_Optical_Depth`, 옹스트롬 지수 `Angstrom_Exponent_550_860`, 밴드별 광학두께 `Aerosol_Optical_Depth_Per_Band`도 있음"
        - text: "크기·형태별 에어로졸 광학두께 평균 — `Small_Mode_Aerosol_Optical_Depth`, `Medium_Mode_Aerosol_Optical_Depth`, `Large_Mode_Aerosol_Optical_Depth`, `Nonspherical_Aerosol_Optical_Depth` (무차원)"
          note: "L2에서 고른 에어로졸 혼합물 유형을 크기(반경 0.35 µm 미만·0.35~0.7 µm·0.7 µm 초과)·비구형으로 요약한 값. 각 변수에 `_Count`·`_Standard_Deviation`이 함께 있음. 컬렉션 설명의 '성분 유형 빈도 히스토그램'은 현재 파일 형식(F15_0032) 명세에 따로 된 변수가 없음"

