notices:
  - date: "2026-03-20"
    level: warning
    title: NASA, Terra 과학 운용 종료를 2027년 2월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra의 과학 운용이 2027년 2월 끝날 것으로 전망했습니다.
      같은 기사는 2020년 말 경사각 조정을 멈춘 뒤 2022년 가을 고도가 약 5 km 낮아지고 적도 통과가 10:30에서 10:15로 앞당겨졌다고 설명합니다. MISR 기록도 이 일정에 묶여 있습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2023-11"
    level: critical
    title: Terra 궤도 고도 변경으로 MISR 처리 체계 개편 — FINAL L2·L3는 2022-10-12에서 멈춤
    body: >-
      ASDC는 2022년 10월 Terra 궤도 고도가 바뀌어 궤도가 고정된 233개 WRS-2 경로와 맞지 않게 되면서 MISR L1·L2 생산 방식을 크게 고쳐야 했다고 밝혔습니다.
      2022-10-14(궤도 121388) 이후 자료는 새 체계로 처리하며, 궤도 126974(2023-11-01)부터 공개하고 그 이전은 채워 넣는다고 안내했습니다(공지 자체에는 날짜가 없음).
      2026-10-13 CMR 확인 시 FINAL L2(MIL2ASAE)와 L3는 2022-10-12 이후 자료가 없고, FIRSTLOOK L2는 2022-10-13부터 빈틈이 채워져 현재까지 이어집니다.
    source: https://asdc.larc.nasa.gov/project/MISR
  - date: "2018-02-07"
    level: info
    title: L2 에어로졸 V23 공개 — 4.4 km 해상도, NetCDF-4
    body: >-
      MISR L2 에어로졸이 V23(파일 버전 F13_0023)으로 바뀌어 산출 해상도가 4.4 km로 높아지고 NetCDF-4 형식이 되었습니다. 전 기간이 MIL2ASAE V003으로 다시 처리되었고,
      광학두께는 Stage 3, 나머지 입자 특성은 Stage 2 검증 수준입니다.
    source: https://asdc.larc.nasa.gov/documents/misr/quality_summaries/DQS_AEROSOL_V023.20180207.pdf

