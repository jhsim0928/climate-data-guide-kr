notices:
  - date: "2026-03-24"
    level: critical
    title: NCEP/NCAR R1 재분석 종료로 PIOMAS 갱신 중단
    body: >-
      PIOMAS의 대기 강제력인 NCEP/NCAR R1 재분석이 2026년 3월 18일부로 종료되었습니다(NOAA는 2월 13일 예고).
      PSC는 대체 강제력으로 다시 생산해야 하지만 예산 여부와 재개 시점을 알 수 없으며, 평소보다 긴 공백이 될 것이라고 공지했습니다.
      확인 시점(2026-10-11)까지 재개 공지는 없습니다.
    source: https://psc.apl.uw.edu/research/projects/arctic-sea-ice-volume-anomaly/

