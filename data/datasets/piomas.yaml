    url: https://psc.apl.uw.edu/research/projects/arctic-sea-ice-volume-anomaly/data/
    login: false
    method: 웹 다운로드 (텍스트·CSV)
    note: 범북극 일별·월별 부피와 일별 평균 두께 시계열(버전 2.1)을 받을 수 있습니다.
  - name: PSC 모델 격자 자료 안내 페이지
    url: https://psc.apl.uw.edu/research/projects/arctic-sea-ice-volume-anomaly/data/model_grid
    login: false
    method: 웹 다운로드 / sftp·rsync (사용자명·비밀번호 anonymous)
    note: 변수표, 격자 파일(grid.dat 등), Fortran·IDL 읽기 프로그램과 커뮤니티 Python 도구 링크가 있습니다.
  - name: pscfiles 서버 — 해빙 두께 (heff)
    url: https://pscfiles.apl.uw.edu/zhang/PIOMAS/data/v2.1/heff/
    login: false
    method: HTTPS 디렉터리
    note: 이진 파일(heff.H연도.gz)과 함께 1979~2025년 NetCDF(heff.H연도.nc.gz)도 있습니다.
  - name: pscfiles 서버 — 해빙 농도 (area, aiday)
    url: https://pscfiles.apl.washington.edu/zhang/PIOMAS/data/v2.1/area/
    login: false
    method: HTTPS 디렉터리
  - name: pscfiles 서버 — 기타 변수 (other)
    url: https://pscfiles.apl.washington.edu/zhang/PIOMAS/data/v2.1/other/
    login: false
    method: HTTPS 디렉터리
    note: 일부 해양 변수(ssh, tice0, uo1_10 등)는 2020년 파일까지만 있습니다.

example:
  lang: python
  note: heff.H2025.gz를 받아 압축을 풀고, 같은 서버 utilities/의 grid.dat를 함께 받아 둡니다.
  code: |
    import numpy as np

    nx, ny = 360, 120
    # 머리말 없는 단정밀도 이진 파일, 1년 12개월이 이어져 있음 (빅엔디언이면 ">f4")
    heff = np.fromfile("heff.H2025", dtype="<f4").reshape(12, ny, nx)
    if np.nanmax(np.abs(heff)) > 100:  # 값이 이상하면 바이트 순서를 바꿔 다시 읽기
        heff = np.fromfile("heff.H2025", dtype=">f4").reshape(12, ny, nx)
    print("9월 평균 두께 최대값(m):", heff[8].max())

tips:
  - >-
    PIOMAS는 두께 관측을 동화하지 않는 모델 추정치입니다. 위성 시대에는 얇은 얼음을 두껍게, 두꺼운 얼음을 얇게 내는 경향이 보고되어 있으므로
    "관측 두께"로 부르지 말고, 가능하면 ICESat·CryoSat-2 두께와 함께 비교하세요.
  - >-
    PSC가 제시한 불확실성은 부피 추세 약 ±1.0×10³ km³/10년, 월 편차 약 ±0.75×10³ km³입니다. 또 어떤 대기 재분석으로 강제했는지에 따라
    장기 추세가 달라지므로, 2026년 이후 강제력이 바뀌어 재개되면 이전 자료와 이어 붙이기 전에 버전과 강제력을 꼭 확인하세요.
  - >-
    모델 영역 남쪽 경계 때문에 오호츠크해, 세인트로렌스만, 래브라도해 일부가 빠집니다. 다른 자료의 북반구 전체 해빙 부피와 비교할 때
    (특히 겨울) 영역을 맞춰야 합니다.
  - >-
    이진 파일은 시스템에 따라 바이트 순서(endianness)를 바꿔 읽어야 할 수 있습니다. heff·area는 NetCDF(.nc.gz) 파일도 있으니 그쪽이 편합니다.

