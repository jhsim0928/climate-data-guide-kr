notices:
  - date: "2026-03-20"
    level: info
    title: Terra 2027년 2월·Aqua 2027년 9월 과학 운영 종료 전망 — SYN1deg는 이미 NOAA-20 기반
    body: >-
      NASA는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월에 과학 운영이 끝날 것으로 내다봤습니다.
      SYN1deg Ed4B는 2022년 4월부터 NOAA-20 CERES만 쓰므로 현재 생산에는 직접 영향이 없지만, 2022년 3월 이전 기록은 두 위성 관측입니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-12-29"
    level: info
    title: Edition 5 개발 현황 공개 — 공개 일정은 미정
    body: >-
      CERES 과학팀 회의 정리 글에 따르면 Edition 5용 Fu-Liou 복사 모델은 대역 수를 18개에서 29개로 늘려 TOA 장파 편차를 약 2 W m-2에서 0.5 W m-2 미만으로 줄였고,
      야간 구름 산출 개선이 진행 중입니다. DQS는 GEO 주사 동기화·GEO 구름 일관성·지표 플럭스 개선을 Edition 5에서 하겠다고 밝혔으나 공개 날짜는 없습니다.
    source: https://science.nasa.gov/science-research/earth-science/the-state-of-ceres-updates-and-highlights
  - date: "2025-05-08"
    level: warning
    title: SYN1deg Edition4B 공개(2025-05-07) — 2022년 4월부터 NOAA-20 단독·MERRA-2 입력
    body: >-
      Terra+Aqua+NOAA-20+GEO를 쓰는 Edition4B(주문 도구 이름 Edition4.2)가 공개되었습니다. 2022년 4월부터 Terra·Aqua 관측을 빼고 NOAA-20만 쓰며,
      구름 산출·플럭스 계산 입력을 MERRA-2로 바꾸고 GEO 구름 산출과 박명 시간 처리를 개선했습니다.
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_SYN1deg_Ed4A_DQS_V1.pdf

