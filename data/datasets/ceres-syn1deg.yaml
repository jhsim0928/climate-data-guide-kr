account_required: true

summary: >-
  CERES 광대역 복사계 관측에 정지궤도(GEO) 위성 영상의 시간별 정보를 결합해, 대기 상단(TOA) 복사를 1시간·1° 단위로 채운 자료입니다.
  같은 시각의 MODIS·VIIRS·GEO 구름 특성, MATCH 에어로졸, 재분석 기온·습도를 Langley Fu-Liou 복사전달 모델에 넣어 지표와 대기 중간 기압면의 단파·장파 플럭스도 계산해 함께 담습니다.
  월평균 에너지 수지에는 EBAF가 표준이고, SYN1deg는 일주기·일변동·극한 사례처럼 시간 해상도가 필요한 연구와 지표 플럭스 검증에 씁니다.

time_convention:
  summary: >-
    모든 값은 해당 시간 구간의 평균입니다. 1시간 자료의 '시간 상자'는 UTC 기준 하루 24개이고, 첫 상자가 00~01 UTC(중앙 0.5 UTC)입니다.
    일·월 자료는 시간 값을 평균한 것이고, MHour는 한 달 동안 같은 시간 상자끼리 평균한 월별 일주기입니다.
  points:
    - "시간 값은 순간 관측이 아니라 CERES 관측과 GEO 영상으로 시간 보간해 만든 시계열입니다. GEO 자료는 관측 순간값을 격자에 넣은 뒤 해당 시간 상자에 배정합니다."
    - "단파 플럭스 시간 상자의 대표 시각은 0.5시간이 아니라 상자 안 태양천정각 코사인 적분으로 정한 시각입니다(DQS)."
    - "CERES 극궤도 관측 시각은 Terra 약 10:30, Aqua·NOAA-20 약 13:30(적도 통과 지방시)입니다. Terra·Aqua는 궤도 표류로 이 시각이 바뀌어 2022년 4월부터 쓰지 않습니다."
    - "GEO 영상은 60°S–60°N만 덮으므로, 그 바깥 고위도의 시간 변화는 극궤도 관측과 보간에 더 의존합니다."
    - "변수 이름의 `obs_`는 관측 TOA, `init_`은 처음 계산값(initial), `adj_`는 TOA 관측에 맞춰 조정한 계산값(adjusted)입니다. Ed4A DQS는 조정 단파·장파 플럭스에 코드 오류가 있어 쓰지 말라고 권고합니다."
    - "월 1회 갱신되는 정규 생산만 있고, 준실시간(NRT)판은 없습니다."
  source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_SYN1deg_Ed4A_DQS_V1.pdf
  source_name: CERES SYN1deg Ed4A/Ed4B Data Quality Summary (V1) + SYN1deg-1Hour Data Products Catalog (R6V1)

variables:
  note: >-
    변수 이름은 Ed4A Data Products Catalog(SYN1deg-1Hour R6V1)의 HDF SDS 이름입니다. Ed4B 파일과 CERES 주문 도구에서 받는 netCDF에서는
    이름이 다를 수 있으니 받은 파일에서 확인하세요. 구름 변수는 5개 층(상층·중상층·중하층·하층·전체) 차원을 가집니다.
  full_list: https://ceres.larc.nasa.gov/documents/DPC/DPC_current/pdfs/DPC_SYN1deg-1Hour_R6V1.pdf
  groups:
    - name: 관측 TOA 복사 (CERES+GEO)
      kind: mean
      period: 1시간
      items:
        - "TOA 반사 단파(전천) — `obs_all_toa_sw` (W m-2)"
        - "TOA 방출 장파(전천) — `obs_all_toa_lw` (W m-2)"
        - "TOA 순복사(전천) — `obs_all_toa_net` (W m-2)"
        - "TOA 단파·장파(청천) — `obs_clr_toa_sw`, `obs_clr_toa_lw` (W m-2)"
        - text: "TOA 알베도(전천·청천) — `obs_all_toa_alb`, `obs_clr_toa_alb` (무차원)"
          std: [toa_rad]
        - "TOA 입사 태양복사 — `toa_sw_insol` (W m-2)"
    - name: 계산 지표 복사 (Fu-Liou, initial)
      kind: mean
      period: 1시간
      items:
        - "지표 하향·상향 단파(전천) — `init_all_sfc_sw_dn`, `init_all_sfc_sw_up` (W m-2)"
        - "지표 하향·상향 장파(전천) — `init_all_sfc_lw_dn`, `init_all_sfc_lw_up` (W m-2)"
        - "지표 하향·상향 단파·장파(청천) — `init_clr_sfc_sw_dn`, `init_clr_sfc_lw_dn` 등 (W m-2)"
        - text: "지표 하향 단파(에어로졸·구름 없는 대기, pristine) — `init_pristine_sfc_sw_dn` (W m-2)"
          std: [sw_sfc]
    - name: 구름 특성 (MODIS·VIIRS·GEO)
      kind: mean
      period: 1시간
      items:
        - text: "구름량(층별) — `obs_cld_amount` (%)"
          std: [cloud]
        - "구름 광학두께 — `obs_cld_od` (무차원)"
        - "구름 액체수량 경로 — `obs_cld_lwp` (g m-2)"
        - text: "구름 얼음수량 경로 — `obs_cld_iwp` (g m-2)"
          std: [cloud_water]
        - "구름 상단 기압 — `obs_cld_top_press` (hPa)"
        - "구름 상단 온도 — `obs_cld_top_temp` (K)"
    - name: 에어로졸
      kind: mean
      period: 1시간
      items:
        - "0.55 µm 에어로졸 광학두께(MATCH) — `init_match_aod55` (무차원)"

access:
  - name: CERES 주문·부분추출 도구 (SYN1deg Ed4.2 = Edition4B)
    url: https://ceres-tool.larc.nasa.gov/ord-tool/jsp/SYN1degEd42Selection.jsp
    method: 웹 주문 (변수·기간·영역 선택 → NetCDF3, 최대 2 GB)
    note: 월·월별 시간대·일·1시간, 지역(1°)·동서 평균·전지구 평균을 골라 받습니다. 필요한 변수만 고를 수 있어 1시간 자료에 특히 편합니다.
  - name: NASA Earthdata Search — CER_SYN1deg-1Hour_Terra-Aqua-NOAA20 Edition4B
    url: https://search.earthdata.nasa.gov/search/granules?p=C3181056140-LARC_CLOUD
    method: Earthdata Search / earthaccess (HDF4, 하루 1파일)
    note: 일자료는 CER_SYN1deg-Day, 월자료는 CER_SYN1deg-Month, 월별 시간대 자료는 CER_SYN1deg-MHour(모두 _Terra-Aqua-NOAA20, Edition4B)입니다. NASA Earthdata 로그인(무료)이 필요합니다.
  - name: CERES 자료 페이지 (SYN1deg 제품 목록·가용 기간)
    url: https://ceres.larc.nasa.gov/data/#syn1deg-level-3
    method: 웹

example:
  lang: python
  note: "NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행합니다. ASDC 원본은 HDF4라 pyhdf로 읽으며, 변수 이름은 먼저 f.datasets()로 확인하세요."
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    from pyhdf.SD import SD, SDC

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="CER_SYN1deg-1Hour_Terra-Aqua-NOAA20",
        version="Edition4B",
        temporal=("2025-07-01", "2025-07-01"),
    )
    files = earthaccess.download(results[:1], "./syn1deg")   # 하루치 1시간 자료

    f = SD(files[0], SDC.READ)
    print(sorted(f.datasets().keys())[:20])                 # 변수(SDS) 이름 확인
    olr = f.select("obs_all_toa_lw")[:]                     # (24 시간, 180 위도, 360 경도) 예상
    print(olr.shape)

tips:
  - "월평균 TOA·지표 복사의 장기 변화에는 SYN1deg가 아니라 EBAF를 쓰세요. SYN1deg Ed4A DQS는 이 자료가 기후 품질이 아니어서 구름·플럭스 장기 추세를 끌어내는 데 쓰지 말라고 밝힙니다."
  - "DQS는 조정(adjusted, `adj_`) 단파·장파 플럭스에 코드 오류가 있어 쓰지 말라고 권고합니다. 지표 플럭스는 initial(`init_`) 값을 쓰고, 월평균만 필요하면 EBAF-Surface를 쓰세요."
  - 정지궤도 위성 교체 시점(예 GOES·Meteosat·Himawari 세대 교체)에 플럭스·구름에 계단형 변화가 생길 수 있습니다. GEO 영역(60°S–60°N) 안 지역 분석에서 특히 확인하세요.
  - "Ed4A 기준 전지구 순복사 불균형이 약 +4.5 W m-2로 해양 열 저장량 추정(약 0.7 W m-2)보다 훨씬 큽니다. 절대 에너지 수지에는 EBAF를 쓰세요."
  - "태양복사(TSI) 정규화 오류로 2019년 8월, 2020년 5~7월 월값이 약 0.2 W m-2 크게 나왔다고 DQS가 밝혔습니다."
  - 1시간 자료 하루 파일 하나가 수백 MB입니다. 필요한 변수·영역만 CERES 주문 도구로 받는 것이 훨씬 가볍습니다.
  - 청천(clear-sky) 관측이 없는 격자에는 기본값을 쓰므로, 구름이 많은 위도대의 청천 동서 평균은 대표성이 낮을 수 있습니다.

