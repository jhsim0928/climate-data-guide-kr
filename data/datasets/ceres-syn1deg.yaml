# ─────────────────────────────────────────────────────────────
# CERES SYN1deg Edition4B — 데이터셋 정보 파일
# 위성 탭(구름·복사), 대기 탭 '복사 자료'에 교차 수록. 월평균 에너지 수지 기록은 ceres-ebaf 페이지를 보세요.
# 2022년 4월부터 NOAA-20 단독 + MERRA-2 입력(Ed4B, 2025-05 공개)이고, Edition 5는 개발 중(공개 일정 미정)입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: ceres-syn1deg
name: "CERES SYN1deg"
full_name: CERES and GEO-Enhanced TOA, Within-Atmosphere and Surface Fluxes, Clouds and Aerosols (SYN1deg) Edition4B (CERES와 정지궤도 위성을 결합한 1시간·1° 복사 플럭스·구름·에어로졸 자료)
category: satellite
domain: satellite
group: 구름·복사
order: 40
also_in:
  - domain: atmosphere
    group: 복사 자료
domains: [대기, 원격탐사]
provider: NASA Langley Research Center (LaRC) CERES 팀 / Atmospheric Science Data Center (ASDC)

status: active
status_note: >-
  Edition4B(주문 도구 이름 Edition4.2)가 현재 판으로 매달 이어지며, 2026-10-13 확인 시 1시간·일·월 자료 모두 2026년 7월분까지 있습니다(2026-10-10 게시).
  2022년 4월부터는 궤도가 표류하는 Terra·Aqua를 빼고 NOAA-20의 CERES FM6만 쓰므로, Terra(2027년 2월)·Aqua(2027년 9월) 과학 운영 종료는 현재 생산에 직접 영향을 주지 않습니다.
  다음 판인 Edition 5는 알고리즘을 개발하고 있지만 공개 일정은 발표되지 않았습니다.

transitions:
  - from: SYN1deg Edition4A (Terra+Aqua)
    to: SYN1deg Edition4B (Terra+Aqua+NOAA-20)
    status: completed
    date: "2025-05"
    summary: >-
      2022년 4월 이후를 NOAA-20 단독·MERRA-2 입력으로 바꾸고, 초기 정지궤도 위성 구름 산출과 박명(twilight) 시간 처리를 고친 개정판입니다.
      Ed4A는 Edition 5가 나올 때까지 재처리하지 않는다고 DQS가 밝히고 있어, 지금 이어지는 기록은 Ed4B입니다.
    changes:
      - aspect: 공개 시점
        before: 2017-09-13 (Terra+Aqua Ed4A)
        after: 2025-05-07
      - aspect: 2022년 4월 이후 CERES 관측
        before: Terra(FM1)+Aqua(FM3) — 두 위성 모두 궤도 표류 중
        after: NOAA-20(FM6) 단독
      - aspect: 구름 산출·플럭스 계산용 대기 입력
        before: GEOS-5.4.1 (2024년 7월 운영 종료)
        after: 2022년 4월부터 MERRA-2
      - aspect: 정지궤도(GEO) 구름 산출
        before: 초기 2채널 위성(GMS-5, Meteosat-5·7)과 Meteosat-8·9의 산출 불일치, 박명 시간대 의심 구름값이 플럭스 계산에 그대로 들어감
        after: 2채널 위성 재처리, Meteosat-8~11 구름 산출 일관화, 박명 시간대 GEO 구름을 빼고 빈 시간은 보간
      - aspect: 제공 시간 단위 (CMR 컬렉션)
        before: 1Hour·3Hour·Day·MHour·M3Hour·Month
        after: 1Hour·Day·MHour·Month (Edition4B 컬렉션 기준)
      - aspect: DOI
        before: "예: 10.5067/Terra+Aqua/CERES/SYN1degDAY_L3.004"
        after: "예: 10.5067/TERRA-AQUA-NOAA20/CERES/SYN1DEGDAY_L3.004B"
    impacts:
      - 2022년 3월 이전과 이후는 관측 위성·대기 입력이 다르므로, 이 경계를 넘는 구름·지표 복사 분석에서는 불연속 가능성을 확인하세요.
      - Ed4A로 낸 결과를 Ed4B로 다시 확인할 때는 같은 Edition 문자열(파일 이름의 Edition4B)인지, 변수 이름이 같은지 파일에서 확인하세요.
      - Edition 5가 나오면 전 기간이 다시 처리될 예정이므로 판 이름을 논문에 꼭 적으세요.
    sources:
      - name: CERES SYN1deg Ed4A/Ed4B Data Quality Summary (V1, 2025-05-08)
        url: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_SYN1deg_Ed4A_DQS_V1.pdf
      - name: NASA CMR — CER_SYN1deg-1Hour_Terra-Aqua-NOAA20 Edition4B
        url: https://cmr.earthdata.nasa.gov/search/concepts/C3181056140-LARC_CLOUD.html

period:
  start: "2000-03"
  end: present
  note: >-
    2026-10-13 확인 시 ASDC(CMR) 기준 1시간·일·월 자료가 2026년 7월까지 있습니다. 2000년 3월~2002년 6월은 Terra 단독,
    2002년 7월~2022년 3월은 Terra+Aqua, 2022년 4월부터는 NOAA-20 단독입니다. 2020년 8월 16~31일 Aqua 공백은 NOAA-20 자료로 채웠고 9월 1~3일은 채우지 못했습니다.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1시간"
  spatial: >-
    1°×1° 등각 위경도 격자(180×360, 지역 자료). 내부 처리는 위도대별로 1°·2°·4°·8°·360° 크기를 바꾸는 중첩 격자(44,012개 지역)로 하고,
    결과를 1° 격자로 복제해 채웁니다. 동서 평균·전지구 평균은 월자료(SYN1deg-Month)에만 있습니다.
  vertical: 대기 상단(TOA)과 지표, 그리고 대기 중간 기압면(계산 플럭스 연직 분포, 지표 포함 5개 층)
  temporal: 1시간(SYN1deg-1Hour, 하루 파일) / 일(SYN1deg-Day) / 월별 시간대 평균(SYN1deg-MHour) / 월(SYN1deg-Month)

coverage:
  short: 전지구
update: 매월 (관측 월 이후 약 2~3개월 뒤 게시 — 2026년 7월분이 2026-10-10 게시)
