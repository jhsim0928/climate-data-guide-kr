# ─────────────────────────────────────────────────────────────
# WOA23 — 데이터셋 정보 파일
# NOAA NCEI World Ocean Atlas 2023 (수온·염분·용존산소·영양염 기후값)
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: woa23
name: WOA23
full_name: World Ocean Atlas 2023 (세계 해양 아틀라스 2023 — 수온·염분·용존산소·영양염 객관분석 기후값)
category: analysis
domain: ocean
group: 수온·염분 분석장
order: 20
domains: [해양]
provider: NOAA National Centers for Environmental Information (NCEI) Ocean Climate Laboratory

status: active
status_note: >-
  2024년 2월 14일 전체 공개된 현재 버전입니다. 정해진 기간의 기후값(climatology)이라 매달 갱신되는 자료가 아니며,
  2024년 5~6월 용존산소 계열만 소폭 갱신되었습니다. 2026년 10월 현재 NCEI 클라우드 이전 작업으로 일시적인 접근 지연이 공지되어 있습니다.

transitions:
  - from: WOA18
    to: WOA23
    status: completed
    date: "2024-02"
    summary: >-
      World Ocean Database에 새로 들어온 관측과 갱신된 품질관리를 반영한 후속판입니다. 수온·염분 기간이 2017년에서 2022년까지 늘었고,
      1971–2000·1991–2020 기후 평년값이 추가되었으며, 분석 표준편차·분석 표준오차 장이 새로 들어갔습니다. 반면 WOA18 페이지에 있던 밀도·전기전도도·혼합층 깊이는
      WOA23 자료 페이지 변수 목록에 없습니다.
    changes:
      - aspect: 수온·염분 10년 구간
        before: "1955–1964 ~ 1995–2004 다섯 구간 + 2005–2017 (A5B7)"
        after: "1955–1964 ~ 2005–2014 여섯 구간 + 2015–2022 (B5C2, 8년 '10년 구간')"
      - aspect: 기후 평년값
        before: "1981–2010 (WOA18 Product Documentation 기준)"
        after: "1971–2000 (decav71A0), 1981–2010 (decav81B0), 1991–2020 (decav91C0)"
      - aspect: 전 기간 평균 (decav)
        before: "1955–2017 (여섯 10년 구간 평균, NCEI FAQ)"
        after: "1955–2022 (일곱 10년 구간 평균)"
      - aspect: 용존산소·영양염 기간
        before: "all (가용한 전 기간)"
        after: "all = 1965–2022, 용존산소 계열은 1971–2000 (decav71A0)도 제공"
      - aspect: 제공 변수
        before: "수온, 염분, 밀도, 전기전도도, 혼합층 깊이, 용존산소, 산소 포화도, AOU, 규산염, 인산염, 질산염 (WOA18 자료 페이지)"
        after: "수온, 염분, 용존산소, 산소 포화도, AOU, 규산염, 인산염, 질산염 (WOA23 자료 페이지 — 밀도·전기전도도·혼합층 깊이 없음)"
      - aspect: 통계장
        before: "an, mn, dd, sd, se, oa, gp, ma 등"
        after: "같은 장에 객관분석 표준편차와 분석 표준오차(두 번째 영향 반경 1° 669 km, 0.25° 267 km 사용)를 새로 추가"
    impacts:
      - "WOA18과 WOA23의 같은 이름 기간(예: decav)은 포함 연도가 다릅니다. 모델 초기장·편차 기준을 바꿀 때 기간을 반드시 확인하세요."
      - "WOA18의 밀도·전기전도도·혼합층 깊이 기후값을 쓰던 작업은 WOA23에서 같은 파일을 찾을 수 없으므로 수온·염분으로 직접 계산하거나 WOA18을 계속 써야 합니다."
      - "관측 추가와 QC 변경으로 같은 기간이라도 값이 다를 수 있으니 두 판을 섞어 차이를 '변화'로 해석하지 마세요."
    sources:
      - name: NCEI World Ocean Atlas 제품 페이지
        url: https://www.ncei.noaa.gov/products/world-ocean-atlas
      - name: WOA23 Product Documentation (Reagan et al. 2023)
        url: https://doi.org/10.25923/a78k-gq49
      - name: WOA18 Product Documentation
        url: http://www.ncei.noaa.gov/sites/default/files/2020-04/woa18documentation.pdf
      - name: WOA18 자료 페이지
        url: https://www.ncei.noaa.gov/access/world-ocean-atlas-2018/

period:
  start: "1955-01"
  end: "2022-12"
  note: >-
    입력 관측 기간입니다. 수온·염분은 1955–2022년(10년 구간별·평년값별 기후값), 용존산소·영양염은 1965–2022년 전체 자료로 만든 기후값입니다.
    시간에 따라 이어지는 시계열이 아니라 '정해진 기간의 평균 상태'를 담은 정적 자료이며, NCEI 메타데이터의 시간 범위는 1955-01-01~2022-12-31입니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1개월"
  spatial: >-
    수온·염분: 0.25° (1440×720) 및 1° (360×180) 위경도 격자 / 용존산소·AOU·산소 포화도·영양염: 1° 격자만 /
    5° (72×36) 격자는 품질관리용 통계장(객관분석 기후값 아님)
  vertical: >-
    표준 깊이 102층(0~5500 m). 월별 장은 수온·염분·용존산소가 0~1500 m(57층), 영양염은 0~800 m(43층)까지만 있습니다.
    계절 장은 수온·염분 0~5500 m(102층), 용존산소 0~1500 m(57층), 영양염 0~800 m(43층)입니다
  temporal: >-
    기후값 — 연(00), 월(01~12), 계절(13 겨울 1~3월, 14 봄 4~6월, 15 여름 7~9월, 16 가을 10~12월, 북반구 기준).
    0.25° 월별 장은 2005–2014, 2015–2022와 세 평년값(decav71A0·81B0·91C0)에만 있습니다

coverage:
  short: 전지구
update: 정기 갱신 없음 (몇 년 간격으로 새 판 공개 — WOA18 2018-09-30, WOA23 2024-02-14)
license: >-
  미국 정부 공공 자료 — 별도 라이선스 표기 없이 무료 공개(NCEI 메타데이터는 정확성 보증 없음만 명시).
  데이터셋 DOI와 해당 변수의 Atlas 문서 인용 요청
account_required: false

summary: >-
  NOAA NCEI가 World Ocean Database 2023(WOD23)의 품질관리된 관측 프로파일을 객관분석해 만든 전지구 해양 기후값입니다.
  수온·염분은 1955–2022년의 10년 구간별, 1971–2000·1981–2010·1991–2020 평년값별 기후값을 0.25°·1° 격자로, 용존산소·AOU·산소 포화도와
  영양염(인산염·질산염·규산염)은 1° 격자로 제공합니다. 해양 모델의 초기장·경계 조건, 편차 계산의 기준 기후값, 모델·위성 자료 검증에 가장 널리 쓰이는 기준 자료입니다.

time_convention:
  summary: >-
    모든 값은 정해진 여러 해(10년 구간 또는 30년 평년값)에 걸친 기후 평균입니다. 월별 장은 '그 기간 모든 해의 같은 달' 평균, 계절 장은 3개월 묶음,
    연 장은 1년 전체를 대표하는 값이며 특정 연도·시각의 값이 아닙니다.
  points:
    - "파일 하나에는 시간 단계가 하나뿐이며, time은 'months since 1955-01-01' 형식의 명목 값입니다. 실제 평균 기간은 `climatology_bounds`와 파일 이름의 기간 코드(예: decav91C0 = 1991–2020)로 확인합니다 (Product Documentation)."
    - "1500 m 아래의 연 장은 네 계절 분석의 평균으로 정의됩니다(Volume 1). 월별 장은 1500 m(영양염은 800 m)까지만 있습니다."
    - "계절 번호 13~16은 북반구 기준(13 = 1~3월)입니다. 남반구 연구에서는 계절 이름이 반대라는 점에 주의하세요."
    - "decav(접미사 없음)는 1955–2022년 일곱 10년 구간 기후값의 평균으로, 단순히 1955–2022년 전체 관측을 평균한 것과는 다릅니다."
  source: https://doi.org/10.25923/a78k-gq49
  source_name: WOA23 Product Documentation (Reagan et al. 2023) · WOA23 Volume 1

variables:
  note: >-
    WOA23 자료 페이지와 Product Documentation 기준입니다. 파일 이름은 woa23_[기간]_[변수 코드][시간 코드]_[격자].nc (예: woa23_decav91C0_t00_01.nc)이고,
    파일 안 변수는 `[변수 코드]_[통계 코드]` 형식(예: `t_an`)입니다. 변수 코드: 수온 t, 염분 s, 용존산소 o, 질산염 n, 인산염 p, 규산염 i.
    산소 포화도는 O, AOU는 A 코드를 씁니다(예: `O_an`, `A_an`).
  full_list: https://www.ncei.noaa.gov/access/world-ocean-atlas-2023/
  groups:
    - name: 객관분석 기후값 (주요 변수, `*_an`)
      kind: mean
      period: 기후값(연·계절·월)
      items:
        - "수온 — `t_an` (°C)"
        - "염분(실용염분) — `s_an` (무차원)"
        - "용존산소 — `o_an` (µmol/kg)"
        - text: "산소 포화도·겉보기 산소 소모량(AOU) — `O_an` (%), `A_an` (µmol/kg)"
          note: "파일은 woa23_all_O…(산소 포화도), woa23_all_A…(AOU)"
        - "질산염·인산염·규산염 — `n_an`, `p_an`, `i_an` (µmol/kg)"
    - name: 통계장 (수온 예, 다른 변수도 같은 구성)
      kind: mean
      period: 기후값(연·계절·월)
      items:
        - text: "관측 통계 평균(품질관리 통과 값의 단순 평균) — `t_mn` (°C)"
          note: "수온(t_) 기준. 다른 변수는 그 변수의 단위"
        - text: "관측 수 — `t_dd` (개)"
          note: 해당 기간·격자에서 품질관리를 통과한 관측 개수. 0이면 그 격자 값은 주변 관측으로 채운 것
        - text: "표준편차·평균의 표준오차 — `t_sd`, `t_se` (°C)"
          note: "수온(t_) 기준. 다른 변수는 그 변수의 단위"
        - text: "객관분석과의 차이·연 기후값과의 차이 — `t_oa`, `t_ma` (°C)"
          note: "`t_oa` = 통계 평균 − 객관분석 값, `t_ma` = 계절·월 기후값 − 연 기후값(계절·월 파일에만). 수온(t_) 기준"
        - "최소 영향 반경 안에서 통계 평균이 있는 1° 격자 수 — `t_gp` (개)"
    - name: 마스크 (WOA23/MASKS)
      kind: static
      items:
        - "해역(basin)·육지·바다·혼합(mixnumber) 마스크 — *.msk 텍스트 파일, 1°·0.25° (코드값)"

access:
  - name: NCEI WOA23 자료 선택 페이지
    url: https://www.ncei.noaa.gov/access/world-ocean-atlas-2023/
    login: false
    method: 웹 (변수·기간·격자·형식 고르기)
    note: NetCDF(CF), CSV, ASCII, ArcGIS shapefile 형식을 고를 수 있습니다. 공식 문서는 깊이 정보가 명시되지 않는 구형 ASCII 형식을 권하지 않습니다.
  - name: NCEI HTTPS 디렉터리
    url: https://www.ncei.noaa.gov/data/oceans/woa/WOA23/DATA/
    login: false
    method: HTTPS (wget / curl)
    note: DATA/[변수]/netcdf/[기간]/[격자]/ 구조입니다. 예) DATA/temperature/netcdf/decav91C0/1.00/woa23_decav91C0_t00_01.nc
  - name: NCEI THREDDS (thredds-ocean)
    url: https://www.ncei.noaa.gov/thredds-ocean/catalog/woa23/DATA/catalog.html
    login: false
    method: THREDDS 카탈로그 (HTTPServer 다운로드)
    note: 2026-10-12 확인 시 파일 페이지에 HTTPServer만 표시되고 OPeNDAP 서비스는 보이지 않았습니다.
  - name: NCEI 아카이브 (Accession 0270533)
    url: https://www.ncei.noaa.gov/archive/accession/0270533
    login: false
    method: HTTPS / FTP (전체 묶음)
  - name: WOA23 그림(Figures)
    url: https://www.ncei.noaa.gov/access/world-ocean-atlas-2023f/
    method: 웹 지도 보기

example:
  lang: python
  note: 1991–2020 평년값의 1° 연평균 수온 파일(약 80 MB)을 받아 표층 값을 봅니다.
  code: |
    # pip install xarray netCDF4 requests
    import requests
    import xarray as xr

    url = ("https://www.ncei.noaa.gov/data/oceans/woa/WOA23/DATA/temperature/netcdf/"
           "decav91C0/1.00/woa23_decav91C0_t00_01.nc")
    with open("woa23_decav91C0_t00_01.nc", "wb") as f:
        f.write(requests.get(url, timeout=600).content)

    # time 단위가 'months since 1955-01-01'이라 자동 변환이 안 될 수 있어 끕니다
    ds = xr.open_dataset("woa23_decav91C0_t00_01.nc", decode_times=False)
    sst_clim = ds["t_an"].isel(time=0).sel(depth=0)
    print(sst_clim.sel(lat=slice(30, 45), lon=slice(120, 135)).mean().values)

tips:
  - >-
    파일 이름의 기간 코드를 꼭 확인하세요. decav(1955–2022 일곱 10년 구간 평균), decav71A0·decav81B0·decav91C0(30년 평년값),
    5564~B5C2(10년 구간), all(용존산소·영양염의 1965–2022 전체)이 서로 다른 자료입니다. 편차 기준으로는 보통 평년값(예: decav91C0)을 씁니다.
  - >-
    `t_an`은 관측이 없는 곳도 주변 관측과 1차 추정장(first guess)으로 채운 값입니다. 관측이 드문 해역·심층·초기 10년 구간에서는 `t_dd`(관측 수)를
    함께 보고 해석하세요. 이번 판에 추가된 분석 표준편차·표준오차 장도 활용할 수 있습니다.
  - >-
    월별 장은 1500 m(영양염 800 m)까지만 있으므로, 그 아래가 필요하면 계절·연 장을 쓰세요. 0.25° 월별 장은 2005년 이후 구간과 세 평년값에만 있습니다.
  - >-
    수온 자료에는 Cheng et al. (2014) XBT 보정과 Levitus et al. (2009) 방식의 MBT 보정이 적용되어 있습니다(Volume 1).
    EN4 등 다른 보정 방식을 쓴 자료와 비교할 때는 이 차이를 염두에 두세요.
  - >-
    WOA18에 있던 밀도·전기전도도·혼합층 깊이 기후값은 WOA23 자료 페이지에 없습니다. 이런 값이 필요하면 WOA23 수온·염분으로 직접 계산하거나
    WOA18을 출처로 명시해 쓰세요.

