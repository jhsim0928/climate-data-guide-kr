notices:
  - date: "2026-10-02"
    level: warning
    title: NCEI 클라우드 이전으로 자료 접근 지연 (2026-10-30까지 예정)
    body: >-
      NCEI가 자료와 서비스를 클라우드로 옮기는 중이라 일시적으로 다운로드가 느리거나 실패할 수 있다고 공지했습니다.
      WOA 제품 페이지에도 같은 안내가 실려 있습니다. 안 될 때는 THREDDS와 HTTPS 디렉터리를 번갈아 시도하세요.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2024-05-30"
    level: info
    title: 용존산소·AOU·산소 포화도 v1.1로 갱신
    body: >-
      프로파일링 플로트 산소 보정 방식을 조금 바꿔 용존산소·AOU·산소 포화도 기후값을 v1.0(2024년 2월)에서 v1.1로 갱신했습니다.
      Volume 3 문서(Garcia et al. 2024)도 정오표와 함께 갱신되었습니다(NCEI 아카이브 메타데이터에는 2024-06-15 게시로 기록). 이전에 받은 산소 계열 파일은 다시 받으세요.
    source: https://www.ncei.noaa.gov/products/world-ocean-atlas
  - date: "2024-02-14"
    level: info
    title: WOA23 전체 공개 (WOA18 대체)
    body: >-
      수온·염분의 10년 구간·세 평년값·1955–2022 평균, 용존산소 계열, 영양염(1965–2022) 기후값이 모두 공개되었습니다.
      2022년 10월 먼저 나온 1991–2020 수온·염분 평년값도 이때 갱신되었으므로, 예비판을 받았다면 다시 받으세요.
    source: https://www.ncei.noaa.gov/products/world-ocean-atlas
  - date: "2022-10"
    level: info
    title: WOA23 예비판 — 1991–2020 수온·염분 평년값 선공개
    body: 전체 공개에 앞서 1991–2020년 수온·염분 기후 평년값이 예비판으로 먼저 공개되었습니다. 이 예비판은 2024년 2월 전체 공개 때 갱신되었습니다.
    source: https://www.ncei.noaa.gov/products/world-ocean-atlas

