notices:
  - date: "2026-09-10"
    level: info
    title: CPC 월간 해양 브리핑, 2026년 8월분까지 GODAS 계속 사용
    body: >-
      CPC의 2026년 8월 해양 브리핑(9월 10일)이 열용량·수온·해류·용승 그림에 계속 GODAS를 쓰고 있습니다.
      같은 자료에서 대기 바람·복사·열플럭스 그림은 NCEP CORe를 출처로 적고 있으나, GODAS 강제력이 CORe로 바뀌었는지는 밝히지 않았습니다.
    source: https://www.cpc.ncep.noaa.gov/products/GODAS/ocean_briefing_gif/global_ocean_monitoring_current.pdf
  - date: "2026-02-28"
    level: warning
    title: PSL — R1 갱신 중단, 다른 영향 자료 확인 중
    body: >-
      PSL이 CDAS→CORe 전환으로 R1 갱신이 끊긴다고 알리면서 "갱신할 수 없게 될 다른 자료도 확인 중"이라고 밝혔습니다.
      공지에 GODAS는 언급되지 않았고, 2026-10-12 현재 PSL GODAS는 계속 갱신되고 있습니다.
    source: https://psl.noaa.gov/news/2026/r1datanotice.html
  - date: "2026-02-09"
    level: warning
    title: NWS SCN 26-12 — GODAS 강제력원(R2/cdas2) 배포 종료
    body: >-
      CDAS를 CORe로 바꾸는 서비스 변경 공지에서 NOMADS·FTP의 /com/cdas2/ 경로가 2026년 3월 9일부터 제공 중단 목록에 올랐고,
      PSL·NCAR의 R2 자료도 2026년 2월 28일에서 멈췄습니다. 공지는 GODAS를 언급하지 않으며, 그 뒤 GODAS 강제력 처리 방식은 공식 확인되지 않았습니다.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf

