# ─────────────────────────────────────────────────────────────
# NCEP GODAS — 데이터셋 정보 파일
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: godas
name: NCEP GODAS
full_name: NCEP Global Ocean Data Assimilation System (미국 NCEP 전지구 해양 자료동화 체계, 현업 해양 분석·재분석)
category: reanalysis
domain: ocean
group: 재분석
order: 50
domains: [해양]
provider: NOAA NCEP (EMC 개발, 기후예측센터 CPC 운영·감시) / 배포 NOAA PSL, NSF NCAR GDEX

status: active
status_note: >-
  NOAA PSL의 월평균 netCDF가 계속 갱신되고 있어(2026-10-12 확인 시 2026년 8월까지, 2026-09-18 갱신) 정상 운영 중인 것으로 판단했습니다.
  다만 GODAS의 대기 강제력이던 NCEP–DOE R2는 2026년 2월 28일 자료에서 멈췄고(cdas2 배포 종료), 2026년 3월 이후 GODAS가 어떤 강제력을 쓰는지는
  CPC·PSL 공식 공지에서 확인되지 않습니다. 2026년 3월 이후 구간은 이전과 생산 조건이 다를 수 있으니 주의하세요.

period:
  start: "1980-01"
  end: present
  note: >-
    PSL 월평균 기준 1980년 1월부터입니다. 2026-10-12 확인 시 pottmp·salt·ucur·sshg 등은 2026년 8월까지, `thflx`(총 하향 열플럭스)는 2026년 6월까지 있습니다.
    NCAR GDEX 사본(d277006)은 2024년 10월까지만 있습니다. CPC 홈페이지는 월·5일(pentad) 자료 다운로드와 최근 3개월 5일 그림을 안내합니다.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "5일"
  spatial: >-
    모델: GFDL MOM v3 준전지구 영역(75°S~65°N), 1° × 1° 격자를 적도 ±10° 안에서 남북 방향 1/3°로 세분 /
    PSL·GDEX 제공 격자: 경도 1° × 위도 1/3°(360 × 418, 경도 0.5~359.5°E, 위도 74.5°S~64.5°N). 유속(u·v)은 다른 수평 격자에 놓임
  vertical: "40층 (상층 200 m는 10 m 간격). PSL 파일 수심 5~4,478 m, 연직속도 `dzdt`는 엇갈린 층 10~4,736 m"
  temporal: 월평균(PSL·GDEX·CPC), 5일(pentad) 평균(CPC GRIB)

update: 매월 (PSL 월평균 약 3주 지연)
license: PSL 배포본은 이용 제한 없음(CC0 1.0, PSL 출처 표기 요청) / NCAR GDEX 사본은 CC BY 4.0
account_required: false

summary: >-
  GODAS는 NCEP이 기후 감시와 계절 예측(CFS) 해양 초기장을 위해 운영해 온 해양 자료동화 체계로, GFDL MOM v3 모델에
  XBT·TAO 계류·Argo 등 수온 프로파일과 수온-염분 관계로 만든 합성 염분을 3D-Var로 동화합니다. 2007년 3월부터는 위성 고도계 해수면도 동화했습니다(NCAR Climate Data Guide).
  해면 운동량·열·담수 플럭스는 NCEP–DOE R2에서 받고, 최상층 수온은 주간 SST 분석장으로, 해면 염분은 연 기후값으로 완화(relaxation)합니다.
  해상도는 낮지만 1980년부터 매월 갱신되어 CPC 월간 해양 브리핑, ENSO 감시의 열용량·수온약층 분석에 널리 쓰입니다.

time_convention:
  summary: >-
    PSL netCDF의 모든 변수는 월평균이며, `time` 값은 평균 구간의 첫날(그달 1일 00 UTC)입니다(time 속성 info "This is the FIRST day of the averaging period.").
    원본 GRIB(CPC/PSL ReadMe)는 반대로 내부 시각이 평균 구간의 마지막 날이라고 안내하므로, 두 형식을 섞어 쓸 때 한 달 어긋나지 않게 주의하세요.
  points:
    - "PSL 파일 속성: statistic 'Monthly Mean', avg_period '0000-01-00 00:00:00'."
    - "열플럭스 `thflx`·운동량 플럭스 `uflx`·`vflx`·염 플럭스 `sltfl`도 누적량이 아니라 그달의 평균 플럭스입니다."
    - "CPC 배경 설명에 따르면 `thflx`(순 해면 열플럭스)는 R2 총 해면 열플럭스에 SST 완화항을 더한 값입니다."
    - "CPC 5일(pentad) 자료의 시각 기준은 공식 문서에서 확인하지 못했습니다. 파일의 GRIB 시간 정보를 직접 확인하세요."
  source: https://psl.noaa.gov/thredds/dodsC/Datasets/godas/pottmp.2026.nc.das
  source_name: "NOAA PSL GODAS netCDF 파일 속성(time info, statistic) + PSL GODAS ReadMe"

variables:
  note: >-
    NOAA PSL netCDF 파일(OPeNDAP 속성) 기준 주요 변수입니다. 변수명은 파일 안의 이름이며 파일 이름은 `<변수>.<연도>.nc`입니다.
    단위가 일반 해양 자료와 다르니(수온 K, 염분 kg/kg, 염 플럭스 g/cm2/s) 꼭 확인하세요.
  full_list: https://psl.noaa.gov/data/gridded/data.godas.html
  groups:
    - name: 3차원 해양 (40층)
      kind: mean
      period: 월
      items:
        - "잠재수온 — `pottmp` (K)"
        - "염분 — `salt` (kg/kg)"
        - "동서·남북 해류 — `ucur`, `vcur` (m/s)"
        - "연직 속도 — `dzdt` (m/s)"
    - name: 2차원 해양
      kind: mean
      period: 월
      items:
        - "지오이드 기준 해수면 높이 — `sshg` (m)"
        - "혼합층 깊이 — `dbss_obml` (m)"
        - "등온층 깊이 — `dbss_obil` (m)"
    - name: 해면 플럭스
      kind: mean
      period: 월
      items:
        - "총 하향 해면 열플럭스(하향 +) — `thflx` (W/m2)"
        - "동서·남북 운동량 플럭스 — `uflx`, `vflx` (N/m^2)"
        - "염 플럭스 — `sltfl` (g/cm2/s)"

access:
  - name: NOAA PSL — GODAS 데이터 페이지
    url: https://psl.noaa.gov/data/gridded/data.godas.html
    login: false
    method: 변수 목록·그림 그리기·부분 추출
    note: 계정 없이 이용할 수 있습니다. 변수·연도별 netCDF4 파일입니다.
  - name: NOAA PSL 다운로드 서버
    url: https://downloads.psl.noaa.gov/Datasets/godas/
    login: false
    method: HTTPS 직접 다운로드
    note: 변수·연도별 파일과 ReadMe, 월별 장기 평균(1991~2020 등) 파일이 든 Derived/ 폴더가 있습니다.
  - name: NOAA PSL THREDDS / OPeNDAP
    url: https://psl.noaa.gov/thredds/catalog/Datasets/godas/catalog.html
    login: false
    method: OPeNDAP 원격 읽기 / NetCDF Subset Service
  - name: NOAA CPC — GODAS 홈페이지
    url: https://www.cpc.ncep.noaa.gov/products/GODAS/
    login: false
    method: 그림·애니메이션, 월·5일 자료 다운로드 안내, 월간 해양 브리핑
    note: CPC 원본 GRIB 자료는 cfs.ncep.noaa.gov의 pub/cfs/godas 경로로 안내되어 있습니다. 페이지 대부분은 2019년 이후 수정되지 않았습니다.
  - name: NSF NCAR GDEX — NCEP GODAS (d277006)
    url: https://gdex.ucar.edu/datasets/d277006/
    method: 웹 다운로드
    note: 월평균 GRIB1, CC BY 4.0, 데이터셋 DOI 10.5065/ZAHZ-3174. 2026-10 확인 시 2024년 10월까지만 있습니다.

example:
  lang: python
  note: PSL OPeNDAP 주소를 xarray로 바로 열 수 있습니다. 수온 단위가 K이고, 시간 값은 그달 1일입니다.
  code: |
    import xarray as xr

    base = "https://psl.noaa.gov/thredds/dodsC/Datasets/godas"
    t = xr.open_dataset(f"{base}/pottmp.2025.nc")["pottmp"] - 273.15   # K → °C
    # 니뇨3.4 해역(5°S~5°N, 170°W~120°W) 상층 300 m 평균 수온
    box = t.sel(lat=slice(-5, 5), lon=slice(190, 240), level=slice(0, 300))
    print(box.mean(["lat", "lon", "level"]).values)

tips:
  - "GODAS의 해면 플럭스는 NCEP–DOE R2(약 2.5°·T62)에서 왔습니다. R2가 2026년 2월 28일 자료로 멈춘 뒤 2026년 3월 이후 GODAS가 어떤 강제력으로 만들어지는지 공식 설명이 없으니, 최근 구간의 플럭스·혼합층 변화를 해석할 때는 다른 해양 재분석과 비교해 보세요."
  - "NCAR Climate Data Guide는 GODAS의 염분 품질이 낮고(합성 염분 동화·기후값 완화) 해류에 큰 편향이 있다고 평가합니다. 염분·해류 연구에는 다른 재분석을 함께 쓰세요."
  - "PSL 파일은 변수마다 마지막 달이 다를 수 있습니다(2026-10 확인 시 `thflx`는 6월, 나머지는 8월까지). 여러 변수를 합칠 때 시간 축을 맞추세요."
  - "영역이 75°S~65°N이라 북극해 대부분이 빠져 있습니다. 해빙 변수도 없습니다."
  - "PSL 파일 속성에는 'THESE ARE THE BIAS CORRECTED GODAS FILES'라는 문구가 있으나, 어떤 보정인지 설명한 공식 문서는 찾지 못했습니다."

