# ─────────────────────────────────────────────────────────────
# MODIS Land Cover Type (MCD12Q1·MCD12C1) C6.1 — 데이터셋 정보 파일
# 지면 탭 '토지피복'에 싣습니다. Terra·Aqua 운영 종료에 따라 '대체 예정'이지만, 2026-10-13 확인 시 VIIRS 토지피복 후속 제품은 공개되지 않았습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: modis-landcover
name: "MODIS Land Cover (MCD12)"
full_name: MODIS/Terra+Aqua Land Cover Type Yearly L3 Global, Collection 6.1 (MODIS 연간 전지구 토지피복 분류, 500 m 타일·0.05° 격자)
category: satellite
domain: land
group: 토지피복
order: 10
domains: [육지, 원격탐사]
provider: NASA MODIS 토지피복 과학팀(Friedl·Sulla-Menashe) / NASA LP DAAC (Earthdata Cloud)

status: deprecated
status_note: >-
  C6.1(버전 061)이 현재 판이며 해마다 한 해씩 추가되고 있습니다(2026-10-13 확인 시 MCD12C1은 2025년, MCD12Q1은 2024년까지 CMR에 등록).
  그러나 NASA는 Terra·Aqua가 연료·전력 한계로 과학 운영을 마칠 예정(Terra 2027년 2월, Aqua 2027년 9월 전망)이라며 VIIRS 유사 제품으로 옮기라고 안내하고 있어 '대체 예정'으로 분류했습니다.
  다만 2026-10-13 기준 NASA CMR·LP DAAC에는 VIIRS 기반 토지피복 분류 제품이 없습니다. 또 과학팀이 학습 자료를 갱신하지 못해 2021년 이후 지도는 주의해서 쓰라는 공식 안내가 있습니다.

period:
  start: "2001-01"
  end: present
  note: >-
    연 단위 지도로 2001년부터 있습니다. 2026-10-13 NASA CMR 확인 시 MCD12C1(0.05°)은 2025년 자료(2026-09-26 생산)까지,
    MCD12Q1(500 m 타일)은 2024년 자료(2025-07 생산)까지 있고 MCD12Q1 2025년 타일은 아직 검색되지 않습니다.
    LP DAAC·Earthdata 제품 페이지에는 기간이 '2001–2022'로 적혀 있으나 실제 파일은 그 뒤 해도 올라와 있습니다.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1년"
  spatial: >-
    MCD12Q1: MODIS 사인곡선(Sinusoidal) 타일 격자, 500 m 화소(타일당 약 1200 km × 1200 km, 2400 × 2400 화소, hXXvYY 타일 번호) /
    MCD12C1: 0.05° 전지구 위경도 기후모델 격자(CMG), 7200 × 3600 화소
  vertical: 지표 단일면
  temporal: 1년 (달력 연도마다 지도 1장)

coverage:
  short: 전지구
update: 연 1회 (해당 연도 이후 약 7~9개월 뒤 생산)
license: NASA EOSDIS 자료 이용·인용 지침에 따라 제한 없이 공개 — 데이터셋 DOI 인용 요청
account_required: true

summary: >-
  Terra·Aqua MODIS 반사도 자료를 감독 분류해 만든 NASA의 연간 전지구 토지피복 지도입니다. 한 파일에 IGBP·UMD·LAI·BIOME-BGC·PFT 다섯 가지
  분류체계와 FAO LCCS 기반의 토지피복·토지이용·지표수문 세 층을 함께 담고 있어, 지면 모델 입력(식생 유형·PFT)이나 지역별 토지피복 통계에 많이 쓰입니다.
  500 m 타일 제품(MCD12Q1)과 이를 0.05° 격자로 모은 제품(MCD12C1, IGBP·UMD·LAI 세 체계와 등급별 피복률)이 있습니다.

time_convention:
  summary: >-
    모든 분류 층은 '해당 연도 분류 결과'입니다. 한 달력 연도의 Terra·Aqua 관측으로 만든 특징을 분류해 그해 지도 한 장을 만들며,
    특정 날짜의 순간 상태가 아닙니다. 파일 이름의 A2024001처럼 연도 뒤 '001'은 그해 1월 1일부터의 연간 자료라는 뜻입니다.
  points:
    - "MCD12Q1과 MCD12C1 모두 시간 축은 연 단위 하나뿐입니다(CMR 기준 2024년 파일의 기간 = 2024-01-01~2024-12-31)."
    - "사용자 안내서는 해마다 분류 결과가 흔들리는 정도(연간 변동)가 커서, 서로 다른 해의 지도를 빼서 토지피복 변화를 찾는 용도로 쓰지 말라고 권고합니다."
    - "QC 값 8은 안정화 처리 전 결과로 채운 화소, 9는 기후 조건으로 산림 유형을 바꾼 화소처럼 후처리 내역을 담고 있습니다."
    - "입력 관측 시각이 바뀌어 왔습니다. Terra(원래 오전 10:30 통과)는 2020년 마지막 궤도 조정 뒤 앞당겨져 2022년 가을에는 10:15경 통과했고, Aqua(원래 13:30)는 2021년 7월부터 늦어져 2023년 2월 13:45를 넘었고 2026년 8월경 15:50 무렵에 이를 것으로 예상되었습니다."
    - "2021년 이후 지도는 학습 표본을 갱신하지 못한 채 만들어져 초지·관목·산림 등급의 연간 변동이 크게 나타난다는 공식 안내가 있습니다."
  source: https://lpdaac.usgs.gov/documents/1409/MCD12_User_Guide_V61.pdf
  source_name: MODIS C6.1 Land Cover Type Product User Guide (2022-04-20) + NASA CMR 그래뉼 정보 + LDOPE 공지(2024-09)

variables:
  note: >-
    LP DAAC 제품 표와 NASA CMR 변수 정보에서 확인한 HDF4(HDF-EOS) 과학자료층(SDS) 이름입니다. 모든 층은 8비트 부호 없는 정수이고 채움값은 255이며 척도 인수는 없습니다.
    분류 층의 값은 등급 번호이므로 평균·보간하지 말고 범례표로 해석하세요(등급표는 사용자 안내서 표 3~10).
  full_list: https://lpdaac.usgs.gov/documents/1409/MCD12_User_Guide_V61.pdf
  groups:
    - name: MCD12Q1 분류체계 (500 m, 해당 연도 분류 결과)
      kind: instant
      items:
        - text: "IGBP 분류(17등급) — `LC_Type1` (등급 1–17)"
          std: [land_cover]
          note: 해당 연도 분류 결과. 17 = 수체, 13 = 도시·건조지역, 12 = 경작지
        - text: "UMD 분류 — `LC_Type2` (등급 0–15)"
          std: [land_cover]
          note: C6.1에서 C6의 잘못된 '경작지·자연식생 혼재' 등급과 습지 등급을 없앴습니다
        - text: "LAI 분류(엽면적지수 산출용 식생 유형) — `LC_Type3` (등급 0–10)"
          std: [land_cover]
        - text: "BIOME-BGC 분류 — `LC_Type4` (등급 0–8)"
          std: [land_cover]
        - text: "식물기능형(PFT) 분류 — `LC_Type5` (등급 0–11)"
          std: [land_cover]
    - name: MCD12Q1 FAO LCCS 층 (500 m, 해당 연도 분류 결과)
      kind: instant
      items:
        - text: "LCCS1 토지피복 층 — `LC_Prop1` (등급 1–43)"
          std: [land_cover]
        - text: "LCCS2 토지이용 층 — `LC_Prop2` (등급 1–40)"
          std: [land_cover]
        - text: "LCCS3 지표수문 층 — `LC_Prop3` (등급 1–51)"
          std: [land_cover]
        - text: "LCCS1·2·3 분류 신뢰도 — `LC_Prop1_Assessment`, `LC_Prop2_Assessment`, `LC_Prop3_Assessment` (%)"
          std: []
    - name: MCD12Q1 품질·마스크 (500 m)
      kind: instant
      items:
        - text: "품질 플래그 — `QC` (값 0–10)"
          note: 0 분류된 육지, 1 미분류 육지(나지로 표기), 2 분류된 물, 4 해빙→물로 전환, 6·7 눈·얼음 재분류, 8 안정화 전 결과로 채움, 10 물 마스크 자료 없음 등
        - text: "육지·물 마스크 — `LW` (1 물, 2 육지)"
          note: MOD44W에서 가져온 마스크
    - name: MCD12C1 0.05° 집계 (IGBP·UMD·LAI 세 체계, 해당 연도 분류 결과)
      kind: instant
      items:
        - text: "주(최빈) 등급 — `Majority_Land_Cover_Type_1`, `Majority_Land_Cover_Type_2`, `Majority_Land_Cover_Type_3` (등급 번호)"
          std: [land_cover]
          note: 끝 번호 1은 IGBP, 2는 UMD, 3은 LAI 분류. MCD12C1의 IGBP 범례는 수체가 0이고 0–16 범위입니다(MCD12Q1은 17이 수체)
        - text: "주 등급 신뢰도 — `Majority_Land_Cover_Type_1_Assessment`~`Majority_Land_Cover_Type_3_Assessment` (%)"
          std: []
        - text: "등급별 피복률 — `Land_Cover_Type_1_Percent`, `Land_Cover_Type_2_Percent`, `Land_Cover_Type_3_Percent` (%)"
          std: [land_cover]
          note: 0.05° 격자 안 500 m 화소 중 각 등급이 차지하는 비율. 등급 수만큼 층이 있는 3차원 배열

access:
  - name: NASA LP DAAC — Earthdata Cloud (MCD12Q1 V061)
    url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd12q1-061
    method: HTTPS 다운로드 / earthaccess / AWS S3 직접 접근(us-west-2)
    note: >-
      파일 주소는 https://data.lpdaac.earthdatacloud.nasa.gov/lp-prod-protected/MCD12Q1.061/ 아래에 있고 무료 NASA Earthdata 로그인이 필요합니다.
      옛 LP DAAC Data Pool(e4ftl01)의 MODIS 배포는 2025년 6월 30일 종료되었습니다.
  - name: NASA LP DAAC — Earthdata Cloud (MCD12C1 V061)
    url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd12c1-061
    method: HTTPS 다운로드 / earthaccess
    note: 전지구 파일 하나가 한 해 분량입니다(2025년 파일 약 1.2 GB, HDF4).
  - name: NASA Earthdata Search
    url: https://search.earthdata.nasa.gov/search/granules?p=C2484079608-LPCLOUD
    method: 웹 검색·다운로드
    note: MCD12C1은 컬렉션 C2484078896-LPCLOUD입니다.
  - name: AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: 웹·API 영역/지점 추출 (GeoTIFF·NetCDF 변환)
    note: MCD12Q1.061을 지원합니다(2026-10 확인). 타일을 이어 붙이고 투영을 바꿔 받을 때 편리합니다.

example:
  lang: python
  note: >-
    earthaccess로 한반도를 덮는 2024년 MCD12Q1 타일(h27v05, h28v05 등)을 받아 pyhdf로 IGBP 층을 읽는 예입니다.
    처음 실행할 때 NASA Earthdata 아이디·비밀번호를 묻습니다.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="MCD12Q1", version="061",
        temporal=("2024-01-01", "2024-12-31"),
        bounding_box=(124, 33, 132, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "mcd12q1_2024")

    for f in files:
        hdf = SD(str(f), SDC.READ)
        igbp = hdf.select("LC_Type1")[:]          # 2400 x 2400, 등급 1–17, 255 = 채움값
        qc = hdf.select("QC")[:]
        valid = igbp != 255
        classes, counts = np.unique(igbp[valid], return_counts=True)
        print(f, dict(zip(classes.tolist(), counts.tolist())))

    # 0.05° 집계 제품: short_name="MCD12C1", version="061"
    # 층 이름 예: "Majority_Land_Cover_Type_1", "Land_Cover_Type_1_Percent"

tips:
  - "MCD12Q1은 사인곡선(Sinusoidal) 투영 타일입니다. 위경도 격자 자료와 겹쳐 보려면 재투영이 필요하고, 등급 자료이므로 반드시 최근린(nearest) 방식으로 바꾸세요. 쌍선형 보간을 쓰면 존재하지 않는 등급 번호가 생깁니다."
  - "IGBP 수체 코드가 제품마다 다릅니다. MCD12Q1 `LC_Type1`은 17, MCD12C1 `Majority_Land_Cover_Type_1`은 0입니다. 두 제품을 섞어 쓸 때 범례를 맞추세요."
  - "2021년 이후 지도는 학습 표본을 갱신하지 못해 연간 변동(특히 초지·관목·산림)이 커졌다는 공식 경고가 있습니다. 최근 연도 사이의 등급 차이를 실제 변화로 해석하지 마세요."
  - "사용자 안내서는 해마다 분류가 흔들리므로 연도별 지도를 빼서 변화를 탐지하는 방식을 권하지 않습니다. 변화 연구에는 여러 해를 묶어 보거나 변화 탐지용으로 설계된 자료를 쓰세요."
  - "알려진 오분류: 영구 해빙·산그늘 빙하가 물로, 열대의 소규모 농경지가 자연식생으로, 일부 온대 상록침엽수림(일본 등)이 상록활엽수림으로 분류되는 사례가 있습니다. 습지는 과소 추정됩니다."
  - "QC 층으로 후처리 내역(물 마스크로 바뀐 화소, 눈·얼음 재분류, 안정화 전 결과로 채운 화소)을 걸러 낼 수 있습니다. 255는 채움값입니다."
  - "Terra·Aqua 궤도 표류로 관측 시각이 바뀌었고 두 위성 모두 2027년 과학 운영 종료가 예정되어 있습니다. 2022년 이후 연도를 장기 추세에 넣을 때는 입력 관측 변화를 함께 고려하세요."
  - "옛 Data Pool 주소(e4ftl01.cr.usgs.gov)를 쓰는 스크립트는 2025년 6월 30일 이후 동작하지 않습니다. earthaccess나 data.lpdaac.earthdatacloud.nasa.gov 주소로 바꾸세요."

