transitions:
  - from: MODIS Land Cover C6 (V006)
    to: MODIS Land Cover C6.1 (V061)
    status: completed
    date: "2022"
    summary: >-
      과학 알고리즘은 그대로 두고 MODIS L1B 보정 개선을 반영해 2001년부터 다시 만든 판입니다. 파일 형식과 층 구성은 같고,
      UMD 범례의 잘못된 등급 두 개를 정리했습니다.
    changes:
      - aspect: 입력 보정
        before: C6 L1B
        after: Terra·Aqua MODIS L1B 보정 갱신(2012~2017년 Terra 전방 조견표 수정, 편광 보정 개정) 반영
      - aspect: UMD 범례(LC_Type2)
        before: C6에서 생긴 잘못된 '경작지·자연식생 혼재' 등급과 습지 등급 포함
        after: 두 등급을 없애고 해당 화소를 알맞은 UMD 등급으로 재배정
      - aspect: 눈 걸러내기
        before: C6 방식
        after: 식생지수 스플라인 맞춤에 쓰는 눈 걸러내기를 소폭 개선
      - aspect: 파일 형식·층
        before: HDF4, 13개 층 (MCD12Q1)
        after: 변경 없음 (DOI 끝자리만 .006 → .061)
    impacts:
      - C6과 C6.1 지도를 한 시계열로 섞지 말고 전 기간을 V061로 다시 받으세요.
      - UMD 분류(LC_Type2)로 경작지·습지 면적을 계산했다면 C6.1에서 값이 달라집니다.
    sources:
      - name: MODIS C6.1 Land Cover Type Product User Guide (2022-04-20)
        url: https://lpdaac.usgs.gov/documents/1409/MCD12_User_Guide_V61.pdf
      - name: NASA Earthdata — MCD12Q1 V061 제품 페이지
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd12q1-061

notices:
  - date: "2026-03-26"
    level: info
    title: Terra 이상으로 MODIS 약 하루 대기 모드 — 해당 구간 자료 품질 의심
    body: >-
      2026년 3월 26일 20시경(UTC) Terra 위성 이상으로 MODIS가 대기(standby) 모드로 바뀌었다가 3월 27일 과학 모드로 돌아왔습니다.
      그 사이 자료는 보정팀이 '의심 또는 불량'으로 표시했으며, 공지는 Terra 단독(MOD)과 Terra+Aqua 결합(MCD) 제품을 함께 영향 대상으로 들고 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: Terra 2027년 2월, Aqua 2027년 9월 과학 운영 종료 전망
    body: >-
      NASA는 연료·전력 한계로 Terra의 과학 활동이 2027년 2월, Aqua는 2027년 9월에 끝날 것으로 내다봤습니다.
      두 위성 모두 과학 운영 종료 때까지 관측을 이어 가며, 그 뒤에는 MODIS 결합 제품(MCD12 포함)도 새 연도가 나오지 않게 됩니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool의 MODIS 배포 종료(2025-06-30) — Earthdata Cloud로 이전
    body: >-
      LP DAAC는 MODIS C6.1을 포함한 모든 MODIS 자료의 Data Pool 접근을 2025년 6월 30일 종료한다고 공지했습니다.
      Earthdata Cloud가 주 보관소가 되었으므로 옛 주소를 쓰는 스크립트는 바꿔야 합니다. Earthdata Search·AppEEARS 이용자는 영향이 없습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — 마지막 재처리 후 MODIS 자료 수집 종료 예정
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초부터 운영을 마치기 시작하고, MODIS 자료 수집이 멈추면 마지막 재처리를 한다고 밝혔습니다.
      두 위성이 설계 궤도에서 벗어나 통과 시각이 바뀌고 있다며 VIIRS 유사 제품을 살펴보라고 권했습니다. 다만 MCD12 토지피복에 대응하는 VIIRS 제품은 아직 없습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2024-09-10"
    level: warning
    title: MCD12Q1 C6.1 2021년 이후 지도 사용 주의
    body: >-
      과학팀이 예산 부족으로 학습 표본 데이터베이스를 갱신하지 못해, 일부 학습 지점의 실제 피복이 바뀌었을 수 있습니다.
      LDOPE 평가에서 위도대·타일별로 초지·관목·산림 등급의 연간 변화가 크게 나타났으며, 2021년 이후 층은 주의해서 쓰라고 안내했습니다.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=781

