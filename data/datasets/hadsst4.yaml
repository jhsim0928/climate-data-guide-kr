notices:
  - date: "2026-04-23"
    level: info
    title: HadSST.4.2.0.0 변경 내용 논문 공개
    body: >-
      4.2.0.0의 제2차 세계대전 기간 고온 보정 방법을 설명한 Sandford & Rayner (2026) 논문이 International Journal of Climatology에 온라인 공개되었습니다.
      공식 이용 약관은 Kennedy et al. (2019)과 함께 이 논문을 인용하도록 요구합니다.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/
  - date: "2025-09"
    level: warning
    title: HadSST.4.2.0.0 공개 — 1941~1945년 값 변경, 전체 재다운로드 필요
    body: >-
      1950년 이전 ERI 편향 추정을 다듬어 제2차 세계대전 기간의 비정상적 고온을 줄였고, 고베 컬렉션 절삭 편향 보정과 ERI 불확실성 항 오류 수정이 들어갔습니다.
      앙상블·오차 공분산 파일 묶음 방식도 바뀌었습니다. 이전 버전으로 받은 자료는 새 버전으로 모두 다시 받으세요.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-08"
    level: info
    title: 계류 부이 입력을 iQuam에서 Copernicus Marine으로 교체
    body: 2025년 8월 자료부터 계류 부이 관측의 출처가 iQuam에서 Copernicus Marine(CMEMS)으로 바뀌었습니다. 표류 부이는 이미 CMEMS 자료를 쓰고 있습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-03"
    level: info
    title: HadSST.4.1.1.0 공개 (작업 효율화 위주)
    body: >-
      주로 내부 작업 흐름 개선을 위한 버전입니다. 외부에서 보이는 변화는 CSV 값 소수 6자리 반올림, NetCDF 결측값(fill value) 재지정,
      단열 양동이(insulated bucket) 보정의 무작위 표집 방식 변경입니다.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-01"
    level: info
    title: HadSST.4.1.0.0이 4.0.1.0을 대체 — 과학적 변경 없음
    body: >-
      HadSST.4.1.0.0이 HadSST.4.0.1.0을 대체했고, 과학적 내용은 Kennedy et al. (2019) 그대로입니다. 4.0.1.0은 2024년 12월 자료로 갱신을 마쳤습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/previous_versions.html

