# ─────────────────────────────────────────────────────────────
# HadSST4 — 데이터셋 정보 파일
# Met Office Hadley Centre HadSST.4.2.0.0 (5° 월별 해수면온도 편차, 내삽하지 않은 앙상블 자료)
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: hadsst4
name: HadSST4
full_name: Met Office Hadley Centre sea surface temperature data set, version HadSST.4.2.0.0 (영국 기상청 해들리센터 5° 월별 해수면온도 편차 앙상블)
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 60
domains: [해양]
provider: Met Office Hadley Centre (영국 기상청)

status: active
status_note: >-
  현재 버전은 HadSST.4.2.0.0(2025년 9월~)이며 매월 갱신됩니다. 이 버전에서 제2차 세계대전 기간(1941~1945년)의 편향 보정이 바뀌어
  그 시기 값이 이전 버전보다 낮아졌습니다. 이전 버전 HadSST.4.1.1.0은 '이전 버전' 페이지에서 계속 받을 수 있지만 갱신 종료 시점이 안내되어 있습니다.

transitions:
  - from: HadSST.4.1.1.0
    to: HadSST.4.2.0.0
    status: completed
    date: "2025-09"
    summary: >-
      과학적 내용이 바뀐 소규모 버전(minor science release)입니다. 1950년 이전 기관 흡입구(ERI) 편향 추정을 다듬어 제2차 세계대전 기간의
      비정상적인 고온을 줄였고, 일본 고베 컬렉션 자료의 절삭(truncation) 편향 보정과 불확실성 계산 오류 수정이 들어갔습니다.
      버전이 바뀌면 전체 자료를 다시 받아야 합니다.
    changes:
      - aspect: 제2차 세계대전 기간(1941~1945년)
        before: "Kennedy et al. (2019) 방식의 1950년 이전 ERI 편향 추정 — 이 기간이 비정상적으로 따뜻함"
        after: "1950년 이전 ERI 편향 추정을 다듬어 이 기간의 비정상적 고온을 줄임 (Sandford & Rayner 2026)"
      - aspect: 일본 고베 컬렉션 (ICOADS deck 118·119)
        before: "절삭 편향 보정 없음"
        after: "절삭(truncation) 편향 보정 추가"
      - aspect: 전지구 ERI 편향 불확실성 항
        before: "계산 오류(의도한 값과 다름)"
        after: "의도한 0.2°C로 수정 (Kennedy et al. 2019, 3.1절 기준)"
      - aspect: 계류 부이 입력
        before: "iQuam"
        after: "2025년 8월부터 Copernicus Marine(CMEMS) — 표류 부이도 CMEMS 자료 사용"
      - aspect: 파일 묶음
        before: "앙상블·오차 공분산을 큰 zip으로 제공"
        after: "앙상블은 50개씩 4개 zip, 오차 공분산은 1850–1899·1900–1949·1950–1999·2000–현재 4개 zip"
      - aspect: 오차 공분산 마스크
        before: "현장 관측이 없는 점과 공분산이 0인 점을 구분할 수 없음"
        after: "마스크를 넣어 두 경우를 구분"
    impacts:
      - "1941~1945년 전후의 전지구·해역 평균 SST가 이전 버전과 달라졌습니다. 이 시기를 포함한 장기 추세·변동 분석은 4.2.0.0으로 다시 계산하세요."
      - "공식 안내는 갱신 때마다 전체 자료를 다시 받고 항상 최신 버전을 쓰라고 권합니다. 논문에는 정확한 버전 번호(HadSST.4.2.0.0)를 적으세요."
    sources:
      - name: HadSST.4.2.0.0 Product User Guide (2025년 9월)
        url: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
      - name: Sandford & Rayner (2026), International Journal of Climatology
        url: https://doi.org/10.1002/joc.70388

period:
  start: "1850-01"
  end: present
  note: >-
    매월 갱신됩니다. 2026-10-12 확인 시 다운로드 페이지의 마지막 갱신일은 2026-09-15이고 연평균 시계열 파일은 2025년까지 들어 있으나,
    가장 최근 월이 언제인지는 직접 확인하지 못했습니다. 19세기·두 세계대전 시기·남극해는 관측이 매우 드물어 빈 격자가 많습니다.

resolution:
  spatial_short: "555 km (5°)"
  temporal_short: "1개월"
  spatial: "5° 위도 × 5° 경도 등간격 격자 (위도 36 × 경도 72, 경도 -180~180), 관측이 없는 격자는 비어 있음(내삽하지 않음)"
  vertical: 해면(표층)만
  temporal: 월평균 (편차 기준 1961~1990년)

update: 매월
license: >-
  Crown Copyright, Open Government Licence v3 — 이용 약관에 상업적 이용 제한 문구는 없고 상업·언론 문의는 Met Office 고객센터로 안내.
  출처 표시(credit line)와 Kennedy et al. (2019)·Sandford & Rayner (2026) 인용 필요
account_required: false

summary: >-
  영국 기상청 해들리센터가 ICOADS 선박·부이 관측과 Copernicus Marine 부이 자료로 만든 1850년 이후 월별 5° 격자 해수면온도(SST) 편차 자료입니다.
  관측 방식(양동이, 기관 흡입구, 부이 등)에 따른 편향을 보정했고, 보정의 불확실성을 200개 앙상블 멤버로, 측정·표집·커버리지 불확실성을 별도 파일로 제공합니다.
  관측이 없는 격자를 채우지 않는(non-infilled) 자료라는 점이 HadISST·ERSST·COBE-SST 같은 빈칸 없는 분석장과 가장 크게 다르며,
  HadCRUT5 같은 전지구 기온 자료의 해양 부분과 장기 SST 변화 연구에 쓰입니다.

time_convention:
  summary: >-
    격자 값은 모두 월평균이며, 1961~1990년 기후값을 뺀 편차입니다. 시간 좌표는 'days since 1850-01-01T00:00:00Z'(표준 달력)이고
    `time_bnds`가 그 달의 범위를 나타냅니다.
  points:
    - "공식 사용자 안내서는 time 값이 달의 중간인지 명시하지 않으므로, 월을 맞출 때는 `time_bnds`를 기준으로 하세요."
    - "기후값(1961~1990)은 관측에 내삽을 더해 빈칸 없이 만든 것이라, 관측이 드문 곳에서는 1961~1990년 편차 평균이 정확히 0이 되지 않습니다."
    - "실제 SST(actuals)가 필요하면 편차에 기후값을 직접 더하지 말고 공식 actuals 파일을 쓰세요. 기후값 자체에도 편향 보정이 필요하기 때문입니다."
    - "연평균 시계열(CSV)의 불확실성은 상관 오차가 한 해 안에서는 완전 상관, 해와 해 사이에는 무상관이라고 가정해 계산되어 있습니다."
  source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  source_name: HadSST.4.2.0.0 Product User Guide

variables:
  note: >-
    HadSST.4.2.0.0 Product User Guide와 다운로드 페이지 기준입니다. 사용자 안내서에 변수 이름이 나와 있지 않은 파일은 파일 이름만 적었습니다.
  full_list: https://www.metoffice.gov.uk/hadobs/hadsst4/data/download.html
  groups:
    - name: SST 편차 (편향 보정)
      kind: mean
      period: 월
      items:
        - text: "앙상블 중앙값 SST 편차 — `tos` (K, HadSST.4.2.0.0_median.nc)"
          note: standard_name sea_water_temperature_anomaly, 1961~1990년 기준. 관측이 없는 격자는 결측
        - text: "앙상블 멤버 200개 — 멤버별 파일의 `tos` (K)"
          note: 편향 보정의 불확실성을 나타내는 서로 바꿔 쓸 수 있는(interchangeable) 실현값. 중앙값 파일과 구조가 같음
        - "실제 SST(편차 + 기후값) 중앙값·앙상블 — HadSST.4.2.0.0_actuals_median.nc, actuals 앙상블 zip"
        - text: "보정하지 않은 SST 편차 — HadSST.4.2.0.0_unadjusted.nc"
          note: 적용된 편향 보정의 크기를 보는 용도로만 조심해서 쓰라고 안내됨
    - name: 불확실성
      kind: mean
      period: 월
      items:
        - "측정·표집 불확실성(격자 간 무상관 성분) — HadSST.4.2.0.0_measurement_and_sampling_uncertainty.nc"
        - text: "전체 불확실성 — HadSST.4.2.0.0_total_uncertainty.nc"
          note: 상관 구조가 다른 성분이 섞여 있어 영역 평균 불확실성 계산에 그대로 전파하면 안 됨
        - text: "오차 공분산 — `tos_cov` (K², 2592×2592, 월별 파일)"
          note: 상관된 측정 오차의 공분산. 영역 평균 불확실성은 w E wᵀ로 계산
    - name: 관측 수
      kind: accum
      period: 월
      items:
        - "격자·월별 관측 수 — HadSST.4.2.0.0_number_of_observations.nc"
        - "격자·월별 슈퍼관측(1°×1°·5일 평균) 수 — HadSST.4.2.0.0_number_of_superobservations.nc"

access:
  - name: Met Office Hadley Centre HadSST4 다운로드 페이지
    url: https://www.metoffice.gov.uk/hadobs/hadsst4/data/download.html
    login: false
    method: 웹 다운로드 (NetCDF / zip / CSV)
    note: >-
      중앙값 파일(HadSST.4.2.0.0_median.nc), 앙상블(50개씩 4개 zip), 불확실성·오차 공분산, 관측 수, 전지구·북반구·남반구·열대 월·연 평균 시계열(CSV)을 받을 수 있습니다.
      계정은 필요 없고 MD5 체크섬이 제공됩니다.
  - name: 이전 버전 (HadSST.4.1.1.0, HadSST.4.0.1.0)
    url: https://www.metoffice.gov.uk/hadobs/hadsst4/previous_versions.html
    login: false
    method: 웹 다운로드
    note: 4.0.1.0은 2024년 12월로 끝났고, 4.1.1.0은 한시적으로만 갱신된다고 안내되어 있습니다. 새 분석에는 최신 버전을 쓰세요.

example:
  lang: python
  note: 중앙값 파일(편차)을 받아 관측이 있는 격자만으로 니뇨3.4 영역 평균을 구합니다. 빈 격자는 채우지 않습니다.
  code: |
    # pip install xarray netCDF4 numpy requests
    import numpy as np
    import requests
    import xarray as xr

    url = "https://www.metoffice.gov.uk/hadobs/hadsst4/data/data/HadSST.4.2.0.0_median.nc"
    with open("HadSST.4.2.0.0_median.nc", "wb") as f:
        f.write(requests.get(url, timeout=600).content)

    ds = xr.open_dataset("HadSST.4.2.0.0_median.nc")
    tos = ds["tos"]                                   # 1961–1990 기준 편차 (K), 관측 없는 칸은 NaN
    box = tos.where((ds.latitude >= -5) & (ds.latitude <= 5) &
                    (ds.longitude >= -170) & (ds.longitude <= -120), drop=True)
    w = np.cos(np.deg2rad(box.latitude))
    nino34 = box.weighted(w).mean(["latitude", "longitude"])   # NaN 칸은 자동으로 빠짐
    n_obs = box.notnull().sum(["latitude", "longitude"])       # 평균에 쓰인 격자 수도 함께 확인
    print(nino34.sel(time="2025").values, n_obs.sel(time="2025").values)

tips:
  - >-
    HadSST4는 빈 격자를 채우지 않은 자료입니다. 같은 영역 평균이라도 달마다 들어간 격자가 다르므로, 관측 격자 수를 함께 보고
    HadISST·ERSST·OISST처럼 빈칸 없는 분석장과 비교할 때는 같은 관측 범위(마스크)로 맞춘 뒤 비교하세요. 영역 평균에는 커버리지 불확실성이 따릅니다.
  - >-
    편향 보정 불확실성은 200개 멤버 각각으로 영역 평균을 계산한 뒤 멤버 간 퍼짐으로 구합니다. 분포가 정규분포가 아니므로 먼저 분포를 확인하세요.
    측정·표집(무상관), 상관 측정 오차(공분산), 편향, 커버리지 네 성분은 서로 독립으로 보고 제곱합의 제곱근으로 합칩니다(Product User Guide).
  - >-
    편차 기준은 1961~1990년입니다. 1991~2020년 기준 편차와 비교하려면 같은 기간 평균을 빼서 기준을 맞추세요.
  - >-
    HadSST.4.2.0.0에서 1941~1945년 값이 크게 바뀌었습니다. 2025년 9월 이전 버전으로 만든 결과(예: 제2차 세계대전 고온 구간)는 새 버전으로 다시 확인하세요.
  - >-
    HadISST는 HadSST4의 '보정 전' 현장 관측을 입력으로 쓰는 별도 제품이고(2021년 1월 자료부터), HadSST4 자체는 해빙 정보를 담지 않습니다.
    빈칸 없는 SST나 해빙 농도가 필요하면 HadISST 등 다른 분석장을 쓰세요.

