# ─────────────────────────────────────────────────────────────
# HadISST — 데이터셋 정보 파일
# Met Office Hadley Centre HadISST1.1 (해수면온도 + 해빙 농도)
# ─────────────────────────────────────────────────────────────
id: hadisst
name: HadISST
full_name: Hadley Centre Sea Ice and Sea Surface Temperature data set, version 1.1 (영국 기상청 해들리센터 해빙·해수면온도 분석장)
category: analysis
domain: ocean
group: 관측 기반 분석장
order: 40
also_in:
  - domain: seaice
    group: 관측 기반 분석장
    label: HadISST (해빙 농도)
domains: [해양, 해빙]
provider: Met Office Hadley Centre (영국 기상청)

status: deprecated
status_note: >-
  현재도 매월 갱신되고 있지만, Met Office가 2026년 안에 HadISST1을 새 데이터셋으로 교체하겠다고 공식 페이지에 예고했습니다.
  후속 자료의 이름과 공개 일정은 아직 발표되지 않았으며, 정기 사용자는 Met Office에 연락해 미리보기를 요청할 수 있습니다.
  장기 분석을 새로 시작한다면 교체 공지를 지켜보세요.

period:
  start: "1870-01"
  end: present
  note: >-
    매달 초에 "지지난달" 자료가 추가됩니다(약 1~2개월 지연). 1870년 이후 전 기간이 하나의 버전으로 제공되지만,
    입력 자료(현장관측·위성·해빙 차트)가 시기마다 달라 시계열 중간에 불연속이 있습니다.

resolution:
  spatial: 1° 위경도 격자 (전지구, 빈칸 없이 채운 분석장)
  vertical: 해면(표층)만
  temporal: 월평균

update: 매월 (약 1~2개월 지연)
license: >-
  Crown Copyright, Open Government Licence v2 (이용 약관 페이지 기준). 메인 페이지는 "개인 연구·과학 연구 목적 무료"로 안내하며,
  상업·언론 이용은 Met Office 고객센터에 문의하도록 되어 있습니다. 출처 표시(credit line)와 논문 인용이 필요합니다.
account_required: false

summary: >-
  영국 기상청 해들리센터가 만드는 월평균 1° 전지구 해수면온도(SST)·해빙 농도 분석장으로, 1870년부터 현재까지 이어지는 대표적인 장기 자료입니다.
  선박·부이 관측과 위성 SST를 축소공간 최적내삽(reduced-space optimal interpolation)으로 결합해 빈 곳 없는 장을 만들고,
  해빙은 디지털화된 해빙 차트와 수동마이크로파 위성 자료를 바탕으로 합니다. AMIP형 대기 모델 실험의 하부 경계조건과
  ENSO·장기 변동 연구에 널리 쓰입니다.

time_convention:
  summary: >-
    모든 값은 한 달을 대표하는 월 단위 값이며, 순간값이 아닙니다. 해수면온도는 월평균 관측을 바탕으로 한 분석값이고,
    해빙 농도는 주로 일별 위성·주별 해빙 차트 값의 월 중앙값(median)을 바탕으로 만들어졌습니다.
  points:
    - "시간 좌표는 각 달의 가운데(약 16일)에 찍혀 있지만, 그날의 값이 아니라 그 달 전체를 대표하는 값입니다 (NOAA ERDDAP 미러의 time 좌표로 확인)"
    - "SST 입력은 월평균(일부 과거 현장관측 COADS는 월 중앙값)이며, 위성 SST는 주별 값을 평균해 월 값을 만듭니다 (Rayner et al. 2003)"
    - "해빙 농도는 위성 시대(1978년 말~)에는 일별 농도의 월 중앙값, 과거 Walsh 자료(월말 값)는 월 중앙값에 맞추도록 변환되었습니다. 산술 평균과 약간 다를 수 있습니다"
    - "1870년부터 하나의 시계열이지만 해빙은 시기에 따라 기후값으로 채운 구간이 있어, 월 값이라도 실제 그 달의 관측을 반영하지 않을 수 있습니다"
  source: https://www.metoffice.gov.uk/hadobs/hadisst/HadISST_paper.pdf
  source_name: Rayner et al. (2003) HadISST 논문 (Met Office 제공 PDF)

variables:
  note: >-
    공식 NetCDF 파일(HadISST_sst.nc, HadISST_ice.nc) 기준입니다. 해수면온도와 해빙 농도가 각각 별도 파일로 제공됩니다.
    단위는 NOAA ERDDAP에 올라온 같은 파일의 메타데이터로 교차 확인했습니다.
  full_list: https://www.metoffice.gov.uk/hadobs/hadisst/data/download.html
  groups:
    - name: 해수면온도 (HadISST_sst.nc)
      kind: mean
      period: 월
      items:
        - "월평균 해수면온도 — `sst` (°C, 파일 표기 `C`)"
    - name: 해빙 (HadISST_ice.nc)
      kind: mean
      period: 월
      items:
        - text: "월평균 해빙 농도 — `sic` (0~1 비율, 파일 표기 `1`)"
          note: 엄밀히는 일별 위성 농도(또는 주별 차트)의 월 중앙값을 바탕으로 한 월 대표값입니다 (Rayner et al. 2003).

access:
  - name: Met Office Hadley Centre 다운로드 페이지
    url: https://www.metoffice.gov.uk/hadobs/hadisst/data/download.html
    method: 웹 다운로드 (NetCDF .nc.gz / ASCII .txt.gz)
    note: >-
      전체 기간 NetCDF(HadISST_sst.nc.gz 약 240 MB, HadISST_ice.nc.gz 약 17 MB)와 최근 1개월만 담은 update 파일이 있습니다.
      ASCII 파일은 기간별·연도별로 나뉘어 있고 형식은 Read_instructions 문서에 설명되어 있습니다. 계정 없이 받을 수 있습니다.
  - name: NOAA CoastWatch ERDDAP — HadISST SST (erdHadISST)
    url: https://coastwatch.pfeg.noaa.gov/erddap/info/erdHadISST/index.html
    method: ERDDAP (영역·기간 잘라 받기, OPeNDAP)
    note: Met Office 파일을 NOAA가 다시 제공하는 미러입니다. 원본보다 늦게 갱신될 수 있으니 최신 달은 원본 페이지를 확인하세요.
  - name: NOAA CoastWatch ERDDAP — HadISST 해빙 (erdHadISSTIce)
    url: https://coastwatch.pfeg.noaa.gov/erddap/griddap/erdHadISSTIce
    method: ERDDAP (영역·기간 잘라 받기, OPeNDAP)

example:
  lang: python
  note: 다운로드 페이지에서 HadISST_sst.nc.gz를 받아 압축을 푼 뒤 실행합니다.
  code: |
    # pip install xarray netCDF4
    import xarray as xr

    ds = xr.open_dataset("HadISST_sst.nc")
    sst = ds["sst"]
    # 해빙 아래 등 비정상적으로 낮은 값은 분석 목적에 맞게 따로 처리하세요
    sst = sst.where(sst > -2)
    nino34 = sst.sel(latitude=slice(5, -5), longitude=slice(-170, -120)).mean(["latitude", "longitude"])
    print(nino34.sel(time="2025"))

tips:
  - >-
    위성 이전 시기의 해빙은 관측이 아주 드뭅니다. 특히 남극은 1871~1939년, 1947~1962년이 기후값(climatology)으로 채워져 있어
    해당 기간의 해빙 변동이나 추세는 실제 신호로 보기 어렵습니다. 1979년 이후 해빙 연구에는 단일 알고리즘 위성 자료를 함께 비교하세요.
  - >-
    공식 서비스 노트에 따르면 2009년 위성 해빙 입력 자료 교체로 남·북극 해빙에 불연속이 생겼고, 2020년 6월부터는 위성 SST 입력이 METOP으로,
    2021년 1월부터는 현장관측 입력이 HadSST4(보정 전)로 바뀌었습니다. 최근 구간의 추세를 계산할 때는 이런 입력 변화를 고려하세요.
  - >-
    ASCII 파일에서는 온도가 °C×100 정수로 저장되고, 해빙으로 100% 덮인 격자는 -1000, 육지는 -32768로 표시됩니다.
    NetCDF 파일도 해빙 영역에 비물리적인 값이 있는지 먼저 확인하고 마스킹하세요.
  - >-
    HadISST.2(HadISST2)는 해빙 농도만 별도 페이지에서 제공되며 그 페이지는 2016년 이후 갱신 표시가 없습니다.
    HadISST1과 섞어 쓰지 말고, 2026년 예고된 HadISST1 후속 자료와도 같은 것으로 단정하지 마세요.

