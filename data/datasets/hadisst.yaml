notices:
  - date: "2026-06-07"
    level: warning
    title: HadISST1을 2026년 안에 새 데이터셋으로 교체 예고
    body: >-
      HadISST 홈페이지에 "2026년 안에 HadISST1을 새 데이터셋으로 교체한다"는 안내가 올라와 있습니다(날짜는 해당 페이지의 마지막 갱신일이며
      정확한 최초 게시일은 표시되어 있지 않음). 새 자료의 이름과 공개일은 아직 밝혀지지 않았고, 정기 사용자는 미리보기를 요청할 수 있습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/
  - date: "2025-06-05"
    level: warning
    title: 2025년 1월 SST 자료 오류로 교체 — 재다운로드 필요
    body: >-
      처음 공개된 2025년 1월 해수면온도 장에 오류가 있어 교체되었습니다. 2025-06-05 이전에 2025년 1월 자료를 받았다면 다시 받아야 합니다.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/
  - date: "2021-04-26"
    level: info
    title: 갱신용 현장관측 입력을 HadSST4(보정 전)로 변경
    body: 2021년 1월 자료부터 현장관측 기반 입력이 HadSST2에서 보정 전 HadSST4로 바뀌었습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/servicenotes.html
  - date: "2020-10-22"
    level: warning
    title: 위성 SST 입력을 METOP으로 교체, 최근 구간 저온 편향 주의
    body: >-
      2020년 6월부터 위성 SST 입력원이 NOAA 위성에서 METOP으로 바뀌었습니다. 입력원 변경으로 예기치 않은 변화가 생길 수 있고,
      선박·부이 편향을 보정하지 않아 최근 몇 년이 다소 차갑게 나타난다고 안내되어 있습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/servicenotes.html
  - date: "2011-03-08"
    level: warning
    title: 2009년 초 해빙 입력 교체에 따른 불연속
    body: 2009년 초 위성 해빙 입력원이 바뀌면서 북극과 남극 해빙 농도 시계열에 불연속이 생겼습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadisst/servicenotes.html

