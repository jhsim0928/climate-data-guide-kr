notices:
  - date: "2023-06-01"
    level: critical
    title: ECMWF Public Datasets 서비스 종료 — ECMWF 웹·Web API 다운로드 중단
    body: >-
      2023년 3월 2일 예고대로 ECMWF Public Datasets 서비스(웹 인터페이스와 Web API)가 종료되어,
      ERA-20C 일·월 자료와 관측 피드백(ERA-20C OFA)을 ECMWF에서 공개적으로 받을 수 없게 되었습니다. ECMWF 안내 표에는 대체 경로가 없으니 NCAR GDEX를 이용하세요.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2015-05-13"
    level: info
    title: ERA-20C 일 자료·파랑·관측 자료 공개
    body: ECMWF Public Datasets 서비스로 ERA-20C 일 자료, 파랑 자료, 관측 자료가 처음 공개되었습니다(이 서비스는 2023년 종료).
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2015/05/13/65223836/New+Public+Dataset+ERA-20C+Daily+ERA-20C+Wave+ERA-20C+Observations

