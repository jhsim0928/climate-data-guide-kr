transitions:
  - from: CMORPH V0.x (CPC 실시간판)
    to: CMORPH CDR V1.0
    status: completed
    date: "2015-10"
    summary: >-
      2002년부터 알고리즘·입력을 바꿔 가며 만들던 V0.x를 고정된 알고리즘·입력으로 1998년부터 다시 만든 V1.0이 대체했습니다.
      위성 단독 추정만 있던 V0.x와 달리 V1.0은 우량계·GPCP로 편향을 보정한 판을 제공하며, NCEI CDR로 2015년 10월 처음 공개되었습니다.
    changes:
      - aspect: 기간
        before: "2002-12~ (NCAR 보관본 2017-10-02까지)"
        after: "1998-01~현재"
      - aspect: 균질성
        before: "알고리즘·입력 버전이 계속 바뀜 — 특히 2003~2006년 불균질"
        after: "고정된 알고리즘과 같은 입력 버전으로 재처리"
      - aspect: 제품
        before: "위성 단독(보정 없음) 추정만"
        after: "위성 단독(RAW), 편향 보정(ADJ), 우량계-위성 결합 판. NCEI 배포본은 편향 보정판(ADJ)"
      - aspect: 편향 보정
        before: "없음"
        after: "육지는 CPC 일 우량계 분석에 확률분포 맞춤, 해양은 GPCP 반순 분석에 비율 맞춤"
      - aspect: 형식·제공처
        before: "CPC FTP 이진 파일(global_CMORPH)"
        after: "NCEI·AWS·Google Cloud의 netCDF4 (30분 8 km, 시간·일 0.25°)"
    impacts:
      - V0.x와 V1.0을 한 시계열로 이어 붙이지 마세요. 장기 분석은 V1.0 전 기간으로 다시 받으세요.
      - 옛 FTP 경로(global_CMORPH)를 쓰는 스크립트는 NCEI·AWS의 V1.0 경로로 바꾸세요.
    sources:
      - name: CMORPH V1.0 README (NCAR GDEX d502002)
        url: https://osdata.gdex.ucar.edu/web/datasets/d502002/docs/CMORPH_V1.0_README.txt
      - name: CMORPH CDR 알고리즘 설명서 (C-ATBD, 2018)
        url: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation-CMORPH/AlgorithmDescription_01B-23.pdf
      - name: Xie et al. (2017)
        url: https://doi.org/10.1175/JHM-D-16-0168.1

notices:
  - date: "2026-10-02"
    level: info
    title: NCEI 클라우드 이전에 따른 자료 접속 지연 (2026-10-30까지)
    body: >-
      NCEI가 자료와 서비스를 클라우드로 옮기는 중이라 접속이 일시적으로 늦어질 수 있고, 현재 영향은 간헐적인 주문 처리 지연이라고 공지했습니다(2026-10-02~10-30).
      CMORPH CDR 제품 페이지에도 같은 안내가 붙어 있습니다. AWS·Google Cloud 버킷으로 받으면 영향을 덜 받습니다.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2022-03-04"
    level: info
    title: 2021년 1월분부터 입력 마이크로파 강수를 NASA GPROF로 교체 (기술 노트)
    body: >-
      NESDIS MSPPS 시스템이 은퇴해 CMORPH CDR v1.0은 2021-01-01 자료부터 NASA GPROF 마이크로파 강수를 씁니다. 보정 전(RAW) 자료 비교에서 시간값 차이는
      대략 ±0.7 mm/h, 2020년 12월 월평균 차이는 ±7 mm/day 이내였고 해양 대류 지역에서 차이가 컸습니다. 편향 보정 절차는 그대로라 최종 CDR에 미치는 영향은 작을 것으로 보았습니다.
    source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation-CMORPH/TechnicalNote_01B-23.pdf

