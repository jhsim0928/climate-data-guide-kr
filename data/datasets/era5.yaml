# ─────────────────────────────────────────────────────────────
# ERA5 — 데이터셋 정보 파일
# 이 파일 하나가 사이트의 ERA5 페이지, 목록 표, 공지 페이지를 모두 만듭니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: era5
name: ERA5
full_name: ECMWF Reanalysis v5 (5세대 ECMWF 대기 재분석)
category: reanalysis
domains: [대기, 육지, 해양파랑]
provider: ECMWF / Copernicus Climate Change Service (C3S)

status: active
status_note: >-
  정상 제공 중입니다. 다만 후속 재분석인 ERA6 생산이 시작되었고,
  ERA6 자료가 충분히 공개되면 ERA5T(준실시간 갱신)를 ERA6가 대체할 예정입니다.
  장기 실시간 갱신이 필요한 연구라면 전환 계획 공지를 지켜보세요.

period:
  start: "1940-01"
  end: present
  note: 준실시간 자료(ERA5T)는 약 5일 지연. 최종본은 2~3개월 뒤 확정되며, 드물게 ERA5T와 달라질 수 있음.

resolution:
  spatial: "원본 약 31 km (TL639) / CDS 제공 격자 0.25° (불확실성 앙상블 0.5°)"
  vertical: "모델면 137층 / 기압면 37층"
  temporal: 1시간 (월평균 별도 제공)

update: 매일 (약 5일 지연)
license: CC BY 4.0 (2025-07-02부터 기존 Copernicus 라이선스를 대체)
account_required: true

summary: >-
  ECMWF가 Copernicus 기후변화 서비스(C3S)를 위해 생산한 5세대 전지구 재분석자료입니다.
  대기, 지면, 해양 파랑 변수를 1시간 간격으로 제공하며, ERA-Interim을 대체했습니다.
  CDS에서 받는 자료는 원본 해상도를 0.25° 위경도 격자로 재격자한 것입니다.

access:
  - name: Copernicus Climate Data Store (CDS) — 단일면(single levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
    method: 웹 다운로드 / CDS API (cdsapi)
    note: ECMWF 계정 필요. 데이터셋별 이용약관에 동의해야 API 요청이 성공합니다.
  - name: Copernicus Climate Data Store (CDS) — 기압면(pressure levels)
    url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-pressure-levels
    method: 웹 다운로드 / CDS API (cdsapi)
  - name: NSF NCAR GDEX (d633000, 0.25° 미러)
    url: https://gdex.ucar.edu/datasets/d633000/
    method: 웹 다운로드 / THREDDS
    note: NCAR 계정 필요. 월 단위로 갱신되어 CDS보다 최근 몇 달이 늦게 들어옵니다. CDS 대기열이 길 때 과거 기간용 대안으로 좋습니다.

example:
  lang: python
  note: "~/.cdsapirc 파일에 url(https://cds.climate.copernicus.eu/api)과 본인 API key를 넣은 뒤 실행합니다."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()
    client.retrieve(
        "reanalysis-era5-single-levels",
        {
            "product_type": ["reanalysis"],
            "variable": ["2m_temperature"],
            "year": ["2024"],
            "month": ["01"],
            "day": ["01"],
            "time": ["00:00", "12:00"],
            "data_format": "netcdf",
            "download_format": "unarchived",
        },
        "era5_t2m_20240101.nc",
    )

tips:
  - 2024년 9월 신규 CDS 전환 이후 예전 API key와 .cdsapirc 주소는 동작하지 않습니다. 오래된 스크립트가 실패하면 이것부터 확인하세요.
  - ERA5T(최근 약 3개월) 구간은 최종본으로 교체될 수 있으므로, 논문용 분석은 다운로드 날짜를 기록해 두는 것이 안전합니다.
  - 인용할 때는 실제로 받은 CDS 데이터셋(단일면/기압면/월평균 등)의 DOI를 각각 적어야 합니다.

