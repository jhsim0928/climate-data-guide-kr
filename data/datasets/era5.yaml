notices:
  - date: "2026-08-26"
    level: warning
    title: ERA6 생산 시작 — ERA5T 대체 예정
    body: >-
      ECMWF가 차세대 재분석 ERA6(수평 해상도 약 14 km, 해양 포함) 생산을 시작했습니다.
      2007년 이후 구간이 2027년 말경 첫 공개 예정이며, 충분한 자료가 공개되면 ERA6가
      ERA5T(준실시간 갱신)를 대체합니다. 구체 일정은 추후 전환 계획으로 안내될 예정입니다.
    source: https://www.ecmwf.int/en/newsletter/188/news/era6-reanalysis-production
  - date: "2025-07-02"
    level: info
    title: 라이선스가 CC BY 4.0으로 변경
    body: 기존 "Licence to use Copernicus Products"가 CC BY 4.0으로 대체되었습니다. 출처 표시 의무는 유지됩니다.
    source: https://forum.ecmwf.int/c/announcements/5
  - date: "2025-01-09"
    level: warning
    title: 2025년 1월 1~6일 ERA5T 품질 저하 (해결됨)
    body: >-
      생산 과정의 기술 문제로 위성 관측 상당수가 동화되지 않아 열대 습도 등이 영향을 받았습니다.
      2025-01-14 수정 완료. 그 이전에 2025년 1월 1~6일 ERA5T/ERA5-Land-T 시간·일 자료를 받았다면
      다시 받아야 합니다. 월평균 자료는 영향 없음.
    source: https://forum.ecmwf.int/t/era5-data-from-1st-january-2025-was-degraded-and-is-being-corrected/10689
  - date: "2024-09-26"
    level: critical
    title: 구 CDS 종료 — 새 계정·API key 필요
    body: >-
      구(legacy) CDS가 폐쇄되고 신규 CDS로 전환되었습니다. 예전 자격 증명으로 보낸 API 요청은 모두 실패합니다.
      ECMWF 계정을 새로 만들고, pip install --upgrade cdsapi 후 .cdsapirc 의 url과 key를 갱신하세요.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380

