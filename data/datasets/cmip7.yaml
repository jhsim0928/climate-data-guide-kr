# ─────────────────────────────────────────────────────────────
# CMIP7 — 데이터셋 정보 파일
# WCRP 결합모델 상호비교 프로젝트 7단계 (DECK + Assessment Fast Track)
# ─────────────────────────────────────────────────────────────
id: cmip7
name: CMIP7
full_name: Coupled Model Intercomparison Project Phase 7 (WCRP 결합모델 상호비교 프로젝트 7단계)
category: model_output
domain: model
group: 전지구 모델 실험
order: 10
domains: [대기, 해양, 해빙, 육지]
provider: WCRP CMIP (CMIP 국제사업단 CMIP-IPO 조정) · 참여 모델링 센터 · ESGF(지구시스템 그리드 연합)

status: active
status_note: >-
  2026-10-16 확인 시 ESGF 새 STAC 색인(discovery.east/west.esgf.io)에 CMIP7 데이터셋 약 7만 8천 개가 올라와 있어 내려받을 수 있습니다.
  다만 아직 초기 공개 단계로, 모델 8개(기관 5곳)와 실험 24개뿐이며 대부분이 CanESM6-0-MR·CanESM5-1 자료입니다.
  Assessment Fast Track 자료가 앞으로 수개월에 걸쳐 계속 추가될 예정이므로, 다중모델 분석에는 모델 수가 충분한지 먼저 확인하세요.

period:
  start: "1850-01"
  end: "2100-12"
  note: >-
    CMIP7 historical 실험은 1850-01-01~2021-12-31(172년), 시나리오(scen7-*)는 2022-01-01~2100-12-31입니다(CMIP7 실험 설정 안내).
    시나리오 연장(-ext)은 2101년부터 최대 2500년까지, piControl·1pctCO2·abrupt-4xCO2 같은 이상화 실험은 모델 연도로 표시됩니다.
    2026-10-16 확인 시 색인에 연장(-ext) 실험 자료는 아직 없습니다.

resolution:
  spatial_short: "모델마다 다름"
  temporal_short: "3시간"
  spatial: >-
    모델마다 다름. 격자는 등록된 번호(grid_label g100 이상, 예: g115·g126)로 표시되며 CMIP6의 gn/gr 표기는 쓰지 않습니다.
    2026-10-16 STAC 색인에 공개된 자료의 nominal_resolution은 25 km·100 km·250 km·500 km입니다(그 밖에 10000 km로 표시된 데이터셋 2개).
  vertical: >-
    변수마다 다름 — 브랜드 변수의 연직 라벨로 구분합니다. 예: 기압면 19층(p19)·39층(p39), 대기 모델층(al)·해양 모델층(ol), 지상 2 m(h2m)·10 m(h10m), 단일면(u).
  temporal: >-
    빈도(frequency)는 변수와 따로 지정됩니다. 2026-10-16 공개 자료는 3hr·6hr·day·mon·yr·fx(고정장)이며,
    컬렉션 정의에는 1hr·subhr(1시간 미만)·dec(10년)도 있으나 해당 빈도의 공개 자료는 아직 없습니다.

coverage:
  short: 전지구
  note: >-
    대부분 전지구(region = glb) 자료입니다. 일부 변수는 남위 30~90도(30S-90S), 북반구(nh), 남반구(sh) 영역으로 제공되며,
    지역 코드에는 남극(ata)·그린란드(grl)도 정의되어 있습니다.
update: 수시 추가 공개 (모델 그룹별로 자료가 준비되는 대로 ESGF에 게시)
license: >-
  데이터셋마다 전역 속성 license_id에 CC-BY-4.0 또는 CC0-1.0 중 하나가 적혀 있습니다(2026-10-16 공개 자료는 모두 CC-BY-4.0).
  CMIP7 이용 안내는 데이터셋 인용, CMIP7 사사 문장, 각 데이터셋의 라이선스 조건 준수를 필수로 요구합니다.
account_required: false

summary: >-
  CMIP7은 세계기후연구프로그램(WCRP)이 조정하는 결합모델 상호비교 프로젝트의 7단계로, 전 세계 모델링 센터가 같은 실험 설계로 돌린
  기후모델 출력을 ESGF를 통해 공개합니다. 모든 모델이 수행하는 기본 실험 묶음(DECK)과, IPCC 7차 평가보고서(AR7) 등 평가를 위해
  여러 MIP에서 고른 58개 우선 실험인 Assessment Fast Track(AFT)으로 이루어지며, CO2 배출량으로 구동하는 실험(esm-*)에 무게를 둡니다.
  미래 시나리오는 SSP 대신 새 ScenarioMIP 시나리오(scen7-h·hl·m·ml·l·ln·vl)를 쓰고, 변수는 '브랜드 변수' 이름으로 구분합니다.

time_convention:
  summary: >-
    CMIP7에서는 같은 물리량이라도 시간 처리 방식이 브랜드 변수 이름의 첫 라벨(시간 라벨)로 구분됩니다. tavg는 시간 평균, tpt는 순간 샘플,
    tmax·tmin은 시간 최댓값·최솟값, ti는 시간에 무관한 고정장이며, 평균 간격(월·일 등)은 이름이 아니라 frequency로 따로 정해집니다.
  points:
    - "tas_tavg-h2m-hxy-u를 월(mon) 빈도로 받으면 CMIP6의 Amon tas, 일(day) 빈도로 받으면 CMIP6의 day tas에 해당합니다"
    - "tavg는 cell_methods에 time: mean, tpt는 time: point, tsum은 time: sum이 들어갑니다. tmaxavg·tminavg는 일 최댓값·최솟값의 평균입니다"
    - "같은 tas라도 tas_tavg(평균), tas_tmax(최댓값), tas_tmin(최솟값), tas_tpt(순간값)는 서로 다른 변수입니다. 변수 이름(variable_id)만으로 검색하면 섞일 수 있습니다"
    - "시간 좌표의 calendar 속성(standard·noleap·360_day·proleptic_gregorian·all_leap 등)이 모델마다 다르므로 꼭 확인하고 cftime으로 읽으세요"
  source: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Branded_Variables/
  source_name: CMIP7 Guidance — Branded Variables / Guidance for users

variables:
  note: >-
    2026-10-16 ESGF STAC 색인(discovery.west.esgf.io)의 CMIP7 항목 속성(variable_branded_name, variable_units)으로 확인한 핵심 변수입니다.
    파일 안의 변수 이름은 variable_id(앞부분, 예: tas)이고, 검색·디렉터리에는 브랜드 변수 이름(예: tas_tavg-h2m-hxy-u)과 빈도·지역이 함께 쓰입니다.
    전체 요청 변수는 CMIP7 Data Request(DR7) v1.2.2.5 데이터베이스에서 볼 수 있습니다.
  full_list: https://wcrp-cmip.org/cmip7-data-request-v1-2-2-5/
  groups:
    - name: 월평균 대기 (atmos, mon)
      kind: mean
      period: 월
      items:
        - "근지표(2 m) 기온 — `tas_tavg-h2m-hxy-u` (K)"
        - "강수량 — `pr_tavg-u-hxy-u` (kg m-2 s-1)"
        - "해면기압 — `psl_tavg-u-hxy-u` (Pa)"
        - "근지표 비습 — `huss_tavg-h2m-hxy-u` (1)"
        - "근지표(10 m) 풍속 — `sfcWind_tavg-h10m-hxy-u` (m s-1)"
        - "지표 하향 단파복사 — `rsds_tavg-u-hxy-u` (W m-2)"
        - "전운량 — `clt_tavg-u-hxy-u` (%)"
        - "기온(기압면 19층) — `ta_tavg-p19-hxy-air` (K)"
        - "동서풍(기압면 19층) — `ua_tavg-p19-hxy-air` (m s-1)"
        - "지위고도(기압면 19층) — `zg_tavg-p19-hxy-air` (m)"
    - name: 일 대기 (atmos, day)
      kind: mean
      period: 일
      items:
        - text: "일평균 근지표 기온 — `tas_tavg-h2m-hxy-u` (K)"
          std: [t2m]
        - text: "일 최고기온 — `tas_tmax-h2m-hxy-u` (K)"
          kind: max
        - text: "일 최저기온 — `tas_tmin-h2m-hxy-u` (K)"
          kind: min
        - "일 강수량 — `pr_tavg-u-hxy-u` (kg m-2 s-1)"
    - name: 월평균 해양 (ocean, mon)
      kind: mean
      period: 월
      items:
        - "해수면온도 — `tos_tavg-u-hxy-sea` (degC)"
        - "해면 염분 — `sos_tavg-u-hxy-sea` (1E-03)"
        - "해수면 높이(지오이드 기준) — `zos_tavg-u-hxy-sea` (m)"
        - "해수 잠재수온 — `thetao_tavg-ol-hxy-sea` (degC)"
        - "해수 염분 — `so_tavg-ol-hxy-sea` (1E-03)"
        - "혼합층 두께 — `mlotst_tavg-u-hxy-sea` (m)"
    - name: 월평균 해빙·지면 (seaIce·land, mon)
      kind: mean
      period: 월
      items:
        - "해빙 면적 비율(해양 격자) — `siconc_tavg-u-hxy-u` (%)"
        - "해빙 두께 — `sithick_tavg-u-hxy-si` (m)"
        - "토양 전체 수분량 — `mrso_tavg-u-hxy-lnd` (kg m-2)"
    - name: 고정장 (fx)
      kind: static
      items:
        - "육지 비율 — `sftlf_ti-u-hxy-u` (%)"
        - "지표 고도 — `orog_ti-u-hxy-u` (m)"
        - "대기 격자 면적 — `areacella_ti-u-hxy-u` (m2)"
        - "해양 격자 면적 — `areacello_ti-u-hxy-u` (m2)"

access:
  - name: ESGF MetaGrid (East 색인, CEDA)
    url: https://metagrid-ceda.east.esgf.io/search
    method: 웹 검색 → HTTP 다운로드·wget 스크립트·OPeNDAP·Globus
    note: >-
      CMIP7 이용 안내가 권하는 웹 검색 화면입니다. 2026-10-07 기준 West 색인에 배치된 MetaGrid에서는 CMIP7이 보이지 않아
      East 색인을 쓰라고 안내되어 있습니다. 적은 양을 받을 때 적합합니다.
  - name: intake-esgf (Python)
    url: https://intake-esgf.readthedocs.io/en/latest/
    method: Python 패키지 (검색 → 내려받아 xarray로 열기)
    note: >-
      기본 프로젝트가 CMIP7이고 STAC 색인(discovery.east/west.esgf.io)을 기본으로 함께 검색합니다. 많은 파일을 자동으로 받을 때 적합합니다.
  - name: ESGF STAC 색인 — CMIP7 컬렉션
    url: https://discovery.east.esgf.io/collections/CMIP7
    method: STAC API (항목마다 파일별 HTTPS 주소 제공)
    note: >-
      discovery.west.esgf.io에도 같은 컬렉션이 있습니다. 항목 속성에 브랜드 변수·단위·버전·라이선스·인용(cite-as) 링크가 들어 있습니다.

example:
  lang: python
  note: >-
    intake-esgf 문서의 ESGFCatalog 검색 방식입니다. 기본 프로젝트가 CMIP7이라 project를 따로 지정하지 않아도 됩니다. intake-esgf 문서에는 아직 CMIP7 검색 예시가 없어,
    variable_branding_suffix·region 같은 검색 항목 이름은 STAC 색인의 CMIP7 항목 속성 이름을 따랐습니다. 검색 결과가 비면 print(cat)로 항목 이름을 확인하세요.
  code: |
    # pip install intake-esgf
    from intake_esgf import ESGFCatalog

    cat = ESGFCatalog()
    cat.search(
        experiment_id="historical",
        variable_id="tas",
        variable_branding_suffix="tavg-h2m-hxy-u",  # 시간 평균 2 m 기온
        frequency="mon",
        region="glb",
    )
    print(cat)                    # 모델·멤버별 검색 결과 확인
    dsd = cat.to_dataset_dict()   # 로컬 캐시(~/.esgf)에 받은 뒤 xarray Dataset 딕셔너리로 반환
    for key, ds in dsd.items():
        print(key, ds["tas"].attrs.get("units"), ds.time.encoding.get("calendar"))

tips:
  - >-
    아직 초기 공개 단계입니다. 2026-10-16 STAC 색인에서 CanESM6-0-MR와 CanESM5-1이 데이터셋의 약 78%를 차지하고, 나머지 모델은 일부 실험·변수만 있습니다(CNRM-ESM2-1e는 데이터셋 1개).
    CMIP7 컬렉션 요약(summaries)에는 source_id가 23개 나오지만 이는 등록된 값 목록이고, 실제 항목을 모델별로 집계(aggregate)하면 자료가 있는 모델은 8개입니다.
    CMIP 평가 체계(REF)도 "현재 공개된 CMIP7 자료가 제한적"이라며 CMIP7 결과를 잠정치로 표시하고 CMIP6와 따로 보여 줍니다. 다중모델 평균·범위를 낼 때는 모델 수부터 확인하세요.
  - >-
    CMIP6와 CMIP7 자료를 한 앙상블로 섞지 마세요. 실험 이름(scen7-* 대 ssp*), historical 종료 연도(2021 대 2014), 강제력 자료가 다르고,
    intake-esgf는 이제 기본으로 CMIP7을 검색하므로 예전 CMIP6 스크립트에는 project="CMIP6"을 꼭 넣어야 합니다.
  - >-
    CMIP6의 테이블(Amon·day 등)이 사라지고 브랜드 변수 + 빈도 + 지역으로 바뀌었습니다. 파일 이름도
    <variable_id>_<branding_suffix>_<frequency>_<region>_<grid_label>_<source_id>_<experiment_id>_<variant_label>[_<기간>].nc 형식이라
    CMIP6용 파일 이름 해석 코드는 고쳐야 합니다.
  - >-
    파일은 모델·실험·멤버(variant_label, 예: r1i1p1f1)·지역·빈도·변수·격자(g###)·버전·시간 구간으로 쪼개져 받아집니다.
    격자 번호는 모델마다 다르므로 여러 모델을 비교하려면 보존적 보간 등으로 공통 격자에 맞추고, 지역(glb와 30S-90S 등)이 다른 파일을 섞지 마세요.
  - >-
    데이터셋 버전은 이름 끝의 vYYYYMMDD로 표시됩니다. 오류가 확인되면 제공 기관이 자료를 철회하고 새 버전으로 다시 올리므로,
    분석 전에 최신 버전인지와 정오표(errata.esgf.io)를 확인하고 논문에는 사용한 버전을 적으세요.
  - >-
    2026-09-23 기준 CMIP7 데이터 DOI는 아직 발급되지 않았습니다. CMIP7 인용 서비스에서 모델·실험별 인용이 만들어지면 DOI로 인용할 수 있으니,
    그때까지는 사용한 데이터셋 ID와 버전을 기록해 두세요.
  - 여러 모델·멤버를 한꺼번에 받고 합치는 방법은 이 사이트의 '모델 자료 받기' 페이지(/model-data/)를 참고하세요.

citations:
  dataset:
    - label: CMIP7 데이터 인용 (모델·실험 단위)
      text: >-
        모델 하나가 한 실험에 제공한 자료 전체(모든 앙상블 멤버와 정오표 포함)를 인용 하나로 씁니다. 형식은 저자(자료 생산자), 연도, 제목,
        "Earth System Grid Federation", DOI 순이며, CMIP7 인용 검색(https://cmip7-citations.ceda.ac.uk/citations/)이나 MetaGrid의 인용 탭에서 찾습니다.
        사용한 모델·기관·인용(가능하면 데이터셋 버전 포함) 표와 ESGF를 밝히는 데이터 가용성 문장도 필요합니다. 2026-09-23 기준 DOI는 아직 발급 전이며,
        CMIP7 Citation Guidance에 따르면 자료 제공 기관이 인용 정보 페이지를 검토·보완해야 DOI가 발급됩니다.
  papers:
    - label: CMIP7 실험 설계 개요 논문 (권장 인용)
      text: >-
        Dunne, J. P., Hewitt, H. T., Arblaster, J. M., Bonou, F., Boucher, O., Cavazos, T., Dingley, B., Durack, P. J., Hassler, B., Juckes, M.,
        Miyakawa, T., Mizielinski, M., Naik, V., Nicholls, Z., O'Rourke, E., Pincus, R., Sanderson, B. M., Simpson, I. R., and Taylor, K. E. (2025):
        An evolving Coupled Model Intercomparison Project phase 7 (CMIP7) and Fast Track in support of future climate assessment.
        Geoscientific Model Development, 18, 6671–6700.
      doi: 10.5194/gmd-18-6671-2025
      bibtex: |
        @article{dunne2025cmip7,
          author  = {Dunne, J. P. and Hewitt, H. T. and Arblaster, J. M. and Bonou, F. and Boucher, O. and Cavazos, T. and Dingley, B. and Durack, P. J. and Hassler, B. and Juckes, M. and Miyakawa, T. and Mizielinski, M. and Naik, V. and Nicholls, Z. and O'Rourke, E. and Pincus, R. and Sanderson, B. M. and Simpson, I. R. and Taylor, K. E.},
          title   = {An evolving Coupled Model Intercomparison Project phase 7 ({CMIP7}) and Fast Track in support of future climate assessment},
          journal = {Geoscientific Model Development},
          volume  = {18},
          number  = {19},
          pages   = {6671--6700},
          year    = {2025},
          doi     = {10.5194/gmd-18-6671-2025}
        }
    - label: CMIP7 Data Request (DR7 v1.2.2.5) 논문
