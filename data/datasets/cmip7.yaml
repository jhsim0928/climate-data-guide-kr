notices:
  - date: "2026-10-07"
    level: warning
    title: West 색인의 MetaGrid에서 CMIP7이 보이지 않음 — East 색인 사용 권장
    body: >-
      West 색인에 배치된 MetaGrid 화면에 CMIP7 자료가 표시되지 않는 문제가 있어, CMIP7 검색에는 East 색인(CEDA)의 MetaGrid를 쓰라고 안내되었습니다.
      ORNL 배치의 주소 변경은 한 달 안에 이루어질 예정이라고 합니다.
    source: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Guidance_for_users/
  - date: "2026-09-23"
    level: info
    title: CMIP7 데이터 DOI 아직 발급 전
    body: >-
      이 날짜까지 CMIP7 데이터 DOI는 하나도 발급되지 않았습니다. 데이터 인용은 모델 하나가 한 실험에 제공한 자료 단위이며,
      DOI가 생기면 인용 검색(Citation Search)에서 찾을 수 있습니다.
    source: https://wcrp-cmip.github.io/cmip7-guidance/docs/CMIP7/Guidance_for_users/
  - date: "2026-09-04"
    level: info
    title: 첫 CMIP7 자료 ESGF 공개
    body: >-
      CMIP7 데이터셋이 ESGF에 게시되기 시작했습니다. 발표 시점에는 모델링 센터 3곳의 모델 5개, 실험 7개 자료가 공개되었고
      앞으로 수개월에 걸쳐 더 추가될 예정입니다. ESGF가 CMIP6 이후 여러 차례 바뀌었으므로 CMIP7 이용 안내를 먼저 읽으라고 권합니다.
    source: https://wcrp-cmip.github.io/cmip7-guidance/docs/Updates_for_Users/
  - date: "2026-07-17"
    level: info
    title: CMIP7 Data Request v1.2.2.5 공개 (Fast Track 최신판)
    body: >-
      Assessment Fast Track용 최신 Data Request가 v1.2.2.5로 공개되었습니다. 일부 지역 변수가 전지구 변수로 대체되었고,
      해빙 변수 4개의 샘플링 시점이 월 중간에서 월 시작으로 바뀌었으며, 앞 버전에서 소문자로 잘못 바뀐 실험 ID가 바로잡혔습니다.
    source: https://wcrp-cmip.org/cmip7-data-request-v1-2-2-5/
  - date: "2025-10-01"
    level: info
    title: CMIP7과 Assessment Fast Track 출범 — 설계 논문 출판
    body: >-
      CMIP7의 실험 설계(필수 DECK와 선택 AFT 실험)를 정리한 Dunne et al. (2025) 논문이 GMD에 출판되며 CMIP7과 Assessment Fast Track 출범이 공지되었습니다.
    source: https://wcrp-cmip.org/cmip7-overview-announcement/

