notices:
  - date: "2026-06-11"
    level: warning
    title: OCI 해양 산출물 V3.2로 재처리 완료
    body: >-
      AOP·IOP·BGC·PAR(L2), AOP·KD·IOP·BGC·PAR(L3m), MOANA(L4)가 V3.2로 재처리되어 Earthdata Search에 올라왔습니다. BRDF 보정의 상대 방위각 오류를 고쳐 Rrs 정확도와 스캔 방향 안정성이 크게 좋아졌고,
      편광 보정·기체 흡수 보정(HITRAN)·대리 보정 계수를 갱신했으며, L2에 원석조류 플래그를 추가하고 L3 AOP 산출물을 한 파일로 합쳤습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/pace-ocean-color-products-have-been-reprocessed-v3.2
  - date: "2026-03-24"
    level: info
    title: 2026-02-09 안전모드로 2026-02-10 자료 공백
    body: >-
      OB.DAAC 사용자 지원팀은 우주선이 2026-02-09 안전모드에 들어가 관측기가 한동안 꺼졌고, 2026-02-10 자료가 비며 2026-02-11에 관측기가 다시 켜졌다고 답했습니다.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=25222
  - date: "2025-08-26"
    level: warning
    title: OCI V3.1 처리 시작, V3.0 정규 처리 중단, 새 산출물 공개
    body: >-
      모든 OCI L1B를 작은 보정을 넣어 다시 처리했고, 2025-07-02 자료부터 L2·L3 NRT를 V3.1로 만들기 시작하며 V3.0 정규 처리를 멈췄습니다. 전 기간 V3.1 재처리가 뒤따랐고,
      OCI 에어로졸(UAA), SPEXone(RemoTAP·FastMAPOL), HARP2(GPC 구름·FastMAPOL) 산출물이 새로 공개되기 시작했습니다.
    source: https://pace.oceansciences.org/news_more.htm?id=92
  - date: "2025-02-04"
    level: warning
    title: PACE OCI V3 재처리 시작, V2 처리 중단
    body: >-
      OCI V3 재처리가 시작되고 V2 처리는 멈췄습니다. PACE 공지에 따르면 V2 시계열은 2025-02-04 이후로 늘어나지 않으며, 2024-03-05 이후 모든 OCI 자료를 V3로 다시 처리해 배포합니다.
      V3 L1B는 2025-01-01 자료부터 먼저 공개되었고 L2·L3가 뒤따랐습니다.
    source: https://oceancolor.gsfc.nasa.gov/
  - date: "2024-05-29"
    level: info
    title: 2024-05-24 안전모드로 과학 관측 중단·복구
    body: >-
      관측소가 2024-05-24 22:40 UTC에 안전모드(safe hold)에 들어가 과학 자료 수집이 멈췄고, 5월 28일 관측기 복구를 시작했습니다. 그 사이 과학 자료는 없습니다.
    source: https://pace.oceansciences.org/blog.htm?id=23
  - date: "2024-04-11"
    level: info
    title: PACE 자료 첫 공개 (V1)
    body: >-
      2024-02-08 발사된 PACE의 자료 배포가 시작되었습니다. 첫 공개판(V1)은 OCI·HARP2·SPEXone의 Level-1 자료와 일부 산출물로, 매우 예비적인 자료로 안내되었습니다.
    source: https://www.nasa.gov/earth/nasas-pace-data-on-ocean-atmosphere-climate-now-available/

transitions:
  - from: PACE OCI V2
    to: PACE OCI V3.0
    status: completed
    date: "2025-02"
    summary: >-
      궤도상 태양 확산판만으로 절대 보정을 다시 하고, 처음으로 대리 보정(SVC) 계수를 적용한 전 기간 재처리입니다. Rrs 대기 보정이 여러 면에서 바뀌고 일부 파장이 빠졌으며 여러 산출물이 Provisional로 올라갔습니다.
    changes:
      - aspect: L1B 보정
        before: 태양 확산판과 발사 전 GLAMR 자료로 절대 보정
        after: "궤도상 태양 확산판만으로 절대 보정(자외선 복사휘도 상승 폭이 큼), 확산판 반사율 열화 반영, 암전류 차감 개선(줄무늬 감소), 확정 궤도력으로 위치 개선"
      - aspect: Rrs 대기 보정
        before: 대리 보정 계수 없음
        after: "대리 보정 계수 첫 적용, 편광·NO2 보정 추가, 기체 투과율 개선, 극단적 태양 반사 마스크, 초분광 파장용 BRDF 표 재생성"
      - aspect: Rrs 파장
        before: 340~345 nm, 590~610 nm 포함
        after: 340~345 nm, 590~610 nm 제외
      - aspect: 산출물 등급
        before: "avw·carbon_phyto·poc·Kd·PAR은 Test"
        after: "avw·carbon_phyto·poc·PAR은 Provisional, nflh 추가"
      - aspect: 기간
        before: "2024-02 공학 첫 관측부터, 2025-02-04 이후로는 늘어나지 않음"
        after: 2024-03-05부터 계속 갱신
    impacts:
      - V2 파일과 V3 이후 파일은 보정이 달라 Rrs·엽록소 값이 다릅니다. 한 시계열에 섞지 마세요.
      - V2에 있던 340~345 nm와 590~610 nm Rrs는 V3부터 없습니다. 이 파장을 쓰던 코드는 파장 목록을 다시 확인하세요.
    sources:
      - name: OBPG — PACE Science Data Reprocessing Version 3
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/V3.0/pace/
      - name: PACE — OCI Version 3 (V3) Reprocessing 공지
        url: https://pace.oceansciences.org/news_more.htm?id=90
      - name: PACE Science Data V2 Release Notes
        url: https://oceandata.sci.gsfc.nasa.gov/files/reprocessing/PACE_Science_Data_V2_Release_Notes.pdf
  - from: PACE OCI V3.0
    to: PACE OCI V3.1
    status: completed
    date: "2025-08"
    summary: >-
      L1B에 650~900 nm 고스트 보정(V3.0.1)을 넣고 대리 보정 계수를 고쳐(적색 과보정 수정) L2·L3를 다시 만든 판입니다. 2025-07-02 자료부터 NRT가 V3.1로 바뀌고 전 기간이 재처리되었습니다.
    changes:
      - aspect: L1B
        before: V3.0
        after: "V3.0.1 — 650~900 nm, 화소 680~800 구간 고스트 보정"
      - aspect: 대기 보정
        before: V3.0 대리 보정 계수, 기존 상대습도·태양 반사 처리
        after: "대리 보정 계수 갱신(적색 과보정 수정), 상대습도를 MERRA2 925 hPa로, 태양 반사 보정에 해수 굴절률 반영, nflh 알고리즘 조정"
      - aspect: IOP
        before: 전 파장 출력, Kd는 Test
        after: 400~720 nm만 출력, Kd는 Provisional
    impacts:
      - "V3.0과 V3.1은 적색 Rrs와 nflh가 다릅니다. 파일 이름의 V3_0·V3_1을 확인하고 섞지 마세요."
    sources:
      - name: PACE — OCI V3.1 Reprocessing and New Product Release (2025-08-26)
        url: https://pace.oceansciences.org/news_more.htm?id=92
      - name: PACE OCI V3 Release Notes
        url: https://oceandata.sci.gsfc.nasa.gov/files/data/reprocessing/V3/PACE_OCI_V3_Release_Notes.pdf
  - from: PACE OCI V3.1
    to: PACE OCI V3.2
    status: completed
    date: "2026-04"
    summary: >-
      스펙트럼 Rrs의 BRDF 구현 오류를 고친 해양 산출물 재처리입니다. 스캔 방향의 인공 변동이 줄었고, L3 AOP·IOP·BGC가 각각 한 파일로 합쳐졌으며 pic이 추가되었습니다.
    changes:
      - aspect: BRDF 보정
        before: 스캔에 따른 상대 방위각 변화를 무시
        after: 상대 방위각을 반영해 Rrs 정확도와 스캔 방향 안정성이 크게 개선
      - aspect: L1B 보정
        before: "보정 표 오류로 약 22일 날짜 어긋남"
        after: V3.0.2 보정(날짜 오류 수정)을 처음 적용
      - aspect: 대기 보정
        before: V3.1
        after: "편광 보정의 스캔 방향 계산 수정, 최신 HITRAN으로 기체 흡수 보정 재계산, 대리 보정 계수 갱신(HyperNAV 대리 보정 지점 매치업 추가)"
      - aspect: 플래그
        before: 없음
        after: L2에 원석조류 플래그(BGC 편향 가능). L3 AOP에는 원석조류 마스크를 쓰지 않음
      - aspect: L3 파일 구성
        before: 산출물마다 따로 나뉜 L3 파일
        after: "AOP·IOP·BGC가 각각 파일 하나에 모든 변수(예 …L3m.DAY.AOP.V3_2.4km.nc)"
      - aspect: 산출물
        before: "BGC는 chlor_a·carbon_phyto·poc"
        after: "pic(CI2 알고리즘) 추가, IOP 모델 맞춤을 가시 영역 약 10 nm 간격으로, NPP_CAFE는 V3.2 IOP·PAR 입력 사용"
    impacts:
      - V3.1 이전 Rrs는 스캔 방향 인공 구조가 있으므로 V3.2로 다시 받으세요.
      - "L3 파일 이름과 구성이 바뀌었으니(제품별 파일 → 묶음 파일) 자동 내려받기 스크립트의 파일 이름 패턴을 고치세요."
    sources:
      - name: Earthdata — PACE ocean color products have been reprocessed (V3.2)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/pace-ocean-color-products-have-been-reprocessed-v3.2
      - name: PACE OCI V3 Release Notes (V3.2 변경 사항)
        url: https://oceandata.sci.gsfc.nasa.gov/files/data/reprocessing/V3/PACE_OCI_V3_Release_Notes.pdf

