# ─────────────────────────────────────────────────────────────
# MERRA (원조) — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: merra
name: MERRA
full_name: Modern-Era Retrospective analysis for Research and Applications (NASA 현대 위성시대 재분석, 1세대)
category: reanalysis
domain: atmosphere
group: 재분석
order: 120
domains: [대기, 육지]
provider: NASA GMAO (Global Modeling and Assimilation Office) / GES DISC 배포

status: ended
status_note: >-
  생산이 2016년 3월에 끝났고, 2016년 2월 29일 분석이 마지막입니다. GMAO는 이 페이지들을 더 이상 갱신하지 않는다고 밝히고 있습니다.
  자료 파일은 2026-10-11 현재 GES DISC 온프레미스 서버(goldsmr1)에 남아 있지만, 이 서버는 2026년 9월 30일 이후 종료 대상으로 공지되어 있고
  Earthdata Cloud 목록(CMR)에서는 원조 MERRA 컬렉션을 찾지 못했습니다. 필요한 파일은 지금 받아 두고, 새 연구는 MERRA-2를 쓰세요.

successor:
  name: MERRA-2
  url: https://gmao.gsfc.nasa.gov/gmao-products/merra-2/
  note: >-
    1980년~현재, 0.5° × 0.625° 격자, 72층. 위성 에어로졸 동화와 관측 보정 강수 강제력이 추가되었습니다.
    인용: Gelaro et al. (2017), J. Climate, 30, 5419–5454, doi:10.1175/JCLI-D-16-0758.1

transitions:
  - from: MERRA
    to: MERRA-2
    to_id: merra2
    status: completed
    date: "2016-02"
    summary: >-
      MERRA는 2008년에 고정된 GEOS-5.2.0 체계라서 2005년 NOAA-18 이후 새로 발사된 위성 관측을 받아들이지 못했고, 그 공백을 메우려고
      GMAO가 GEOS-5.12.4 기반으로 다시 만든 것이 MERRA-2입니다. 큐브구면 격자, 에어로졸 동화, 건조 질량·물 수지 제약,
      관측 보정 강수 강제력이 새로 들어갔고, MERRA 생산은 2016년 2월 29일 분석을 끝으로 멈췄습니다.
    changes:
      - aspect: 기간
        before: "1979-01 ~ 2016-02 (종료)"
        after: "1980-01 ~ 현재 (매월 갱신, 다음 달 15~20일 무렵 공개)"
      - aspect: 시스템 버전
        before: "GEOS-5.2.0 (2008년 고정)"
        after: "GEOS-5.12.4"
      - aspect: 모델 격자·출력 격자
        before: "위경도 격자, 출력 1/2° × 2/3° (540 × 361), 72층(상단 0.01 hPa)"
        after: "큐브구면 격자(극 부근 격자 특이점 해소), 출력 0.5° × 0.625° (576 × 361), 72층"
      - aspect: 관측 입력
        before: "NOAA-18(2005)까지의 위성만 동화 가능, 6시간당 약 150만 개"
        after: "IASI·CrIS·ATMS 복사휘도, GPS 전파엄폐 굴절각, MLS·OMI 오존, AVHRR 대기운동벡터, ASCAT·WindSat 해상풍 등 추가. 6시간당 약 200만 개(2002) → 약 500만 개(2015)"
      - aspect: 복사 전달 모델
        before: "초기형 CRTM(SSU는 GLATOVS)"
        after: "모든 복사휘도에 CRTM 2.1.3"
      - aspect: 에어로졸
        before: "연간 기후값 처방(동화 없음)"
        after: "AVHRR·MODIS·MISR·AERONET 550 nm 광학두께 동화, GOCART 5종 에어로졸이 모델과 결합"
      - aspect: 질량·물 수지
        before: "분석 증분이 크고, 이를 비물리적인 강수−증발 변동이 상쇄"
        after: "건조 공기 질량 보존(983.24 hPa 고정), 전지구 평균 수증기 분석 증분 0으로 설계"
      - aspect: 지면 강수 강제력
        before: "모델 강수 그대로 사용"
        after: "관측 기반 강수로 보정해 지면·습성 침적에 사용(`PRECTOTCORR`로 제공, 위도 62.5° 이상은 보정 없음)"
      - aspect: 해수면온도·해빙 경계조건
        before: "Reynolds et al. (2002) 1° 자료"
        after: "1982년 이전 CMIP 자료 → NOAA OISST(1982~2006-03) → OSTIA(2006-04~)"
      - aspect: 성층권·오존·빙권
        before: "QBO 재현 안 됨, SBUV v8(12층으로 축소) 오존"
        after: "모델이 QBO를 만들어 냄, SBUV 8.6(21층, ~2004) 후 2004년 10월부터 OMI·MLS 오존, MLS 기온(5 hPa 위) 동화, 빙하 지면 표현·계절 변화 해빙 알베도 도입"
      - aspect: 파일 형식·컬렉션 이름
        before: "HDF(.hdf), 예: MAT1NXSLV V5.2.0 (데이터셋 DOI 없음)"
        after: "netCDF4(.nc4), 예: M2T1NXSLV V5.12.4 (컬렉션마다 DOI)"
    impacts:
      - 두 자료를 2016년에서 이어 붙여 한 시계열로 만들지 마세요. 관측 구성·모델·경계조건이 모두 달라 겹치는 기간에도 기후값과 추세가 다릅니다.
      - "변수 이름(`T2M`, `SLP`, `PRECTOT` 등)은 대체로 같지만 컬렉션 이름(MAT… → M2T…), 파일 형식(HDF → netCDF4), 격자(540 → 576 경도점)가 바뀌어 읽기·보간 스크립트를 고쳐야 합니다."
      - "MERRA-2는 1980년부터라서 1979년은 MERRA에만 있습니다. 1979년을 포함한 분석이라면 다른 재분석과 비교하거나 기간을 조정하세요."
      - 강수는 모델값(`PRECTOT`)과 관측 보정값(`PRECTOTCORR`)이 나뉘었으므로 MERRA 결과와 비교할 때는 같은 성격의 모델 강수끼리 비교하세요.
    sources:
      - name: Gelaro et al. (2017), The MERRA-2 reanalysis, J. Climate, 30, 5419–5454
        url: https://doi.org/10.1175/JCLI-D-16-0758.1
      - name: Rienecker et al. (2011), MERRA, J. Climate, 24, 3624–3648
        url: https://doi.org/10.1175/JCLI-D-11-00015.1
      - name: GMAO 공지 — GMAO Terminates MERRA Production (2016-03-14)
        url: https://gmao.gsfc.nasa.gov/geos-system-news/gmao-terminates-merra-production/
      - name: GMAO MERRA 공식 페이지
        url: https://gmao.gsfc.nasa.gov/gmao-products/merra/
      - name: MERRA-2 File Specification (GMAO Office Note No. 9)
        url: https://gmao.gsfc.nasa.gov/media/publications/zbly36ziNFDFbmYmvhQeVqPhUo/Bosilovich785.pdf

period:
  start: "1979-01"
  end: "2016-02"
  note: 2016년 2월 29일 분석을 끝으로 생산 종료(GMAO 공지 2016-03-14).

resolution:
  spatial_short: "55 km (0.5°)"
  temporal_short: "1시간"
  spatial: "기본 격자 1/2°(위도) × 2/3°(경도), 540 × 361 / 축소 격자 1.25° × 1.25°(288 × 144)"
  vertical: "모델면 72층(최상층 0.01 hPa) / 기압면 42층"
  temporal: 1시간(2차원 진단), 3·6시간(3차원), 월평균
update: 종료 (2016년 3월)
license: NASA 공개 데이터(이용 제한 없음). GMAO·GES DISC 출처 표시 요청
account_required: true

summary: >-
  NASA GMAO가 2008년에 고정된 GEOS-5 자료동화 시스템으로 생산한 위성시대 전지구 재분석으로, 2009년에 공개되었습니다.
  물순환 재현 개선을 주요 목표로 삼았고, 1시간 간격 2차원 진단장을 제공해 당시로서는 시간 해상도가 높았습니다.
  지금은 MERRA-2로 대체되었으며, 예전 논문 재현이나 세대 간 비교가 주된 용도입니다.

time_convention:
  summary: >-
    원조 MERRA도 MERRA-2와 같은 규칙을 씁니다. inst 컬렉션은 표시 시각의 순간값, tavg 컬렉션은 구간 평균이며, 평균 자료의 시각은 구간 가운데(00:30, 01:30 …)입니다.
    가강수량(`TQV`)이 들어 있는 inst1_2d_int_Nx는 매 정시의 순간값이라 같은 1시간 간격이어도 tavg1 자료와 30분 어긋납니다.
  points:
    - "tavg1_2d_slv_Nx·tavg1_2d_flx_Nx: 1시간 평균, 시각 00:30·01:30 … (구간 중앙)"
    - "inst1_2d_int_Nx: 매 정시(00:00, 01:00 …) 순간값인 연직 적분량"
    - "inst3_3d_asm_Cp: 00·03·06…21 UTC 순간값(1.25° 격자)"
    - "강수·열속은 kg m-2 s-1, W m-2 단위의 평균 강도이며 누적량이 아닙니다. 월평균 파일은 윤년을 반영한 달력월 평균입니다"
  source: https://gmao.gsfc.nasa.gov/pubs/docs/Lucchesi528.pdf
  source_name: "File Specification for MERRA Products (GMAO Office Note No. 1, v2.3), 3절·부록 D·F"

variables:
  note: MERRA 파일 규격서(GMAO Office Note No. 1) 기준 주요 변수입니다. 변수명은 파일 안의 이름이며, 괄호 앞에 해당 컬렉션을 적었습니다.
  full_list: https://gmao.gsfc.nasa.gov/pubs/docs/Lucchesi528.pdf
  groups:
    - name: 지표·단일면 (tavg1_2d_slv_Nx, 1시간 평균)
      kind: mean
      period: 1시간
      items:
        - "2m 기온 — `T2M` (K)"
        - "2m 비습 — `QV2M` (kg kg-1)"
        - "10m 동서·남북 바람 — `U10M`, `V10M` (m s-1)"
        - "해면기압 — `SLP` (Pa)"
        - "지표기압 — `PS` (Pa)"
    - name: 지표 플럭스 (tavg1_2d_flx_Nx, 1시간 평균)
      kind: mean
      period: 1시간
      items:
        - "총 강수 플럭스 — `PRECTOT` (kg m-2 s-1)"
        - "현열 플럭스(상향 +) — `HFLUX` (W m-2)"
        - "잠열 플럭스(상향 +) — `EFLUX` (W m-2)"
    - name: 연직 적분 (inst1_2d_int_Nx, 1시간 순간값)
      kind: instant
      items:
        - "가강수량 — `TQV` (kg m-2)"
    - name: 기압면 (inst3_3d_asm_Cp, 3시간 순간값, 1.25° 격자 42층)
      kind: instant
      items:
        - "기온 — `T` (K)"
        - "동서·남북 바람 — `U`, `V` (m s-1)"
        - "지위고도 — `H` (m)"
        - "비습 — `QV` (kg kg-1)"
        - "상대습도 — `RH` (fraction)"
        - "연직속도 — `OMEGA` (Pa s-1)"

