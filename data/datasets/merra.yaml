    url: https://disc.gsfc.nasa.gov/datasets?project=MERRA
    method: 웹 검색·다운로드
    note: NASA Earthdata Login 계정 필요. GMAO 데이터 접근 페이지가 안내하는 공식 경로입니다.
  - name: GES DISC 온프레미스 아카이브 (goldsmr1, MERRA 디렉터리)
    url: https://goldsmr1.gesdisc.eosdis.nasa.gov/data/MERRA/
    method: HTTPS 디렉터리 다운로드
    note: >-
      MAT1NXSLV.5.2.0 등 컬렉션별 폴더에 1979~2016년 파일이 있습니다. 서버 배너에 "2026년 9월 30일 이후 접근 종료"가 공지되어 있어
      언제 닫힐지 모릅니다. Earthdata Login 필요.
  - name: GMAO MERRA 데이터 접근 안내
    url: https://gmao.gsfc.nasa.gov/gmao-products/merra/data-access_merra/
    method: 안내 페이지

tips:
  - "MERRA는 세 개의 생산 스트림으로 나눠 계산되었고, 파일명 앞의 MERRA100/200/300이 스트림 번호입니다(예: MERRA100.prod.assim.tavg1_2d_slv_Nx.19790101.hdf). 기간에 따라 접두어가 달라지므로 파일명을 고정 패턴으로 하드코딩하지 말고 디렉터리 목록에서 읽어 오세요."
  - 1000 hPa·850 hPa처럼 지표면 아래에 놓인 기압면 값은 정의되지 않으므로, 산악 지역을 포함한 평균을 낼 때 결측 처리를 확인하세요.
  - "FLX 컬렉션의 `SPEED`는 난류 플럭스 계산에 쓰인 풍속이라 일반적인 지표 풍속이 아닙니다. GMAO FAQ는 지표 바람이 필요하면 2 m 바람(`U2M`·`V2M`)을 받으라고 안내합니다."
  - 에어로졸은 동화하지 않고 연간 기후값을 처방했습니다. 에어로졸·복사 연구라면 MERRA-2를 쓰는 것이 맞습니다.

