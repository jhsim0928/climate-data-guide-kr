notices:
  - date: "2026-05-11"
    level: critical
    title: GES DISC 온프레미스 서버 종료 예정 — 원조 MERRA 접근 경로 불확실
    body: >-
      GES DISC는 온프레미스 HTTPS 서버 접근을 2026년 9월 30일까지 닫고 Earthdata Cloud로 일원화한다고 안내했습니다.
      원조 MERRA가 있는 goldsmr1 서버에도 같은 종료 문구가 붙어 있으나, 클라우드 쪽 MERRA 컬렉션 제공 여부는 공식 확인되지 않았습니다.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2016-03-14"
    level: critical
    title: GMAO, MERRA 생산 종료
    body: >-
      MERRA 생산 스트림이 2016년 2월 29일 분석까지 계산하고 멈췄습니다. 이후 GMAO의 재분석은 MERRA-2로 넘어갔습니다.
    source: https://gmao.gsfc.nasa.gov/geos-system-news/gmao-terminates-merra-production/

