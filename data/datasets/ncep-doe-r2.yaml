notices:
  - date: "2026-02-09"
    level: warning
    title: NWS SCN 26-12 — cdas2 경로 포함 CDAS 자료 제공 종료
    body: >-
      CDAS를 CORe로 바꾸는 서비스 변경 공지에서 NOMADS·FTP의 /com/cdas2/ 경로도 "2026년 3월 9일부터 제공 중단" 목록에 들어 있습니다.
      공지문은 R2를 직접 언급하지 않지만, PSL·NCAR의 R2 자료는 이 무렵 직전인 2026년 2월 28일에서 멈춰 있습니다(2026-10-11 확인).
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf

