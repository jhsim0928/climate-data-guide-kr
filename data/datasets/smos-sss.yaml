notices:
  - date: "2026-08-05"
    level: info
    title: CATDS LOCEAN 편향 보정 L3 v11 공개 (2010-01~2025-12)
    body: >-
      LOCEAN이 만든 편향 보정 SMOS 염분 L3 v11이 CATDS에 올라왔습니다. v10과 같은 편향 보정에 남극해 해빙 주변 편향 보정을 더해 해빙 가장자리에서 약 800 km까지 불확도를 줄였습니다.
      9일·18일 제품이 있고, 실험 제품이라 사용 후기를 요청합니다.
    source: https://www.catds.fr/News/New-version-v11-of-debiased-SSS-L3-maps-from-Locean
  - date: "2026-04-09"
    level: info
    title: CATDS 북극 염분 지도 운영 생산 시작
    body: >-
      CATDS 처리 센터(CPDC)가 연구용 CEC ARCTIC V2를 이어 북극 해면 염분 지도(ARCTIC L3G, 9일)를 운영으로 만들기 시작했습니다. CEC ARCTIC V2는 2023-08-30까지이며,
      CATDS는 연구에는 가능한 기간 V2를 쓰고 최근 기간을 L3G로 보충하라고 권합니다.
    source: https://www.catds.fr/News/Arctic-SSS-Maps-now-produced-operationally
  - date: "2026-01-29"
    level: info
    title: CATDS SMOS/SMAP OI L4 염분 새 판 공개
    body: >-
      LOPS가 만든 SMOS·SMAP 병합 최적 내삽(OI) L4 해면 염분의 새 판이 CATDS에 올라왔습니다. 대규모·시간 변동 편향을 먼저 추정해 제거한 뒤 약 45 km 규모로 다시 매핑하며, 밀도·스파이시니스도 함께 제공합니다.
    source: https://www.catds.fr/News/New-version-of-SSS-SMOS-SMAP-OI-L4-maps
  - date: "2023-03-21"
    level: info
    title: SMOS 임무 2025년 말까지 연장 승인
    body: >-
      ESA는 SMOS·CryoSat·Swarm 임무를 적어도 2025년 말까지 연장했다고 알렸습니다. 이후 2026년 5월 ESA 발표 자료는 SMOS가 '2028년 말까지 연장'되었다고 밝히고 있습니다.
    source: https://earth.esa.int/eogateway/news/esa-s-excellent-earth-explorer-missions-extended-to-2025
  - date: "2021-05-28"
    level: info
    title: SMOS L1·L2 처리 기준판 버전 7 운영 시작, 전 기간 재처리
    body: >-
      2021년 5월 25일부터 SMOS L1·L2 처리기가 버전 7로 바뀌었고, 전체 임무 기간이 버전 7로 재처리되었습니다. ESA는 이전 버전 6 자료를 대체한다고 밝히고 사용 전에 릴리스 노트를 읽으라고 안내했습니다.
    source: https://earth.esa.int/eogateway/news/smos-level-1-and-level-2-products-new-baseline-is-now-available

transitions:
  - from: ESA SMOS L2OS v662
    to: ESA SMOS L2OS v700
    status: completed
    date: "2021-05"
    summary: >-
      3차 전 기간 재처리 기준판입니다. 편차 계산 기준을 SMOS 자체 기후값으로 바꾸고, 해수 유전율 모델을 바꿔 저수온 해역 검색을 개선했으며, 육지-해양 오염 보정 기준장을 ISAS-15로 바꾸었습니다.
    changes:
      - aspect: 염분 편차(SSS_anom) 기준
        before: WOA2009 기후값
        after: "SMOS 자체 기후값(2013~2019), 일부 체계적 편향 보정"
      - aspect: 해수 유전율 모델
        before: Klein-Swift
        after: "Somaraju-Trumpf(ST) — 찬물 검색 개선"
      - aspect: 육지-해양 오염 보정 기준장
        before: WOA
        after: ISAS-15, 더 엄격한 RFI 필터
      - aspect: 입력 L1C
        before: 이전 L1 기준판
        after: L1C 밝기온도 v724
      - aspect: 기간 구분
        before: v662 재처리·운영판
        after: "REPR v700 2010-06-01~2021-05-24, OPER v700 2021-05-25~"
    impacts:
      - v662 자료로 만든 시계열을 v700과 섞지 마세요. 편차 기준장과 유전율 모델이 바뀌어 같은 날짜도 값이 다릅니다.
      - "v700 릴리스 노트는 남반구 고위도의 계절 편향, 상승 궤도의 약 -0.5 pss 이상 음의 편향, 상승·하강 차이를 알려진 문제로 적고 있습니다."
      - "ESA는 다음 전 기간 재처리 기준판 v740(2025년 말 기준)과 해빙 오염 보정을 넣을 v750(2027)을 예고했습니다. 새 판이 배포되면 다시 받아야 합니다."
    sources:
      - name: ESA SMOS L2OS v700 릴리스 노트 (PDF)
        url: https://earth.esa.int/eogateway/documents/d/earth-online/l2osv700_release_note_20220321-pdf
      - name: ESA — SMOS L1·L2 새 기준판 공지 (2021-05-28)
        url: https://earth.esa.int/eogateway/news/smos-level-1-and-level-2-products-new-baseline-is-now-available
      - name: ESA SMOS 현황 발표 (R. Sabia, 2026 Ocean Salinity Science & Technology Meeting)
        url: https://salinity.oceansciences.org/docs/02_Opening_Sabia.pdf
  - from: CATDS LOCEAN 편향 보정 L3 v10
    to: CATDS LOCEAN 편향 보정 L3 v11
    status: completed
    date: "2026-08"
    summary: >-
      v10과 같은 편향 보정 방법에 남극해 해빙 주변 편향 보정을 더하고 기간을 2025년 12월까지 늘린 판입니다. 실험 제품이며 연 1회 갱신합니다.
    changes:
      - aspect: 남극해 해빙 주변 편향
        before: 보정 없음
        after: "해빙 가장자리에서 약 800 km까지 해빙 근접 편향 보정"
      - aspect: 기간
        before: "v10 기간(2025년 이전 공개)"
        after: "2010-01~2025-12"
      - aspect: 인용 DOI
        before: "10.17882/52804#120028 (Boutin et al., 2025, debias V10.0)"
        after: "10.17882/52804#133087 (Boutin et al., 2026, debias V11.0)"
    impacts:
      - v10과 v11을 한 시계열로 섞지 말고 전 기간을 v11로 바꾸세요. 남극해 값이 특히 달라집니다.
      - 논문에는 판 번호와 SEANOE DOI의 판별 번호(#133087)를 함께 적으세요.
    sources:
      - name: CATDS — v11 공개 소식
        url: https://www.catds.fr/News/New-version-v11-of-debiased-SSS-L3-maps-from-Locean
      - name: CATDS — CEC LOCEAN L3 Debiased v11 제품 페이지
        url: https://www.catds.fr/Products/Products-over-Ocean/CEC-Locean-L3-Debiased-v11

