# ─────────────────────────────────────────────────────────────
# ESA SMOS 해면 염분 (ESA L2OS · CATDS L3/L4 · BEC L3/L4) — 데이터셋 정보 파일
# 위성 탭(해면 염분), 해양 탭(위성 관측 자료) 교차 수록. 같은 SMOS L밴드 간섭 복사계(MIRAS) 관측으로 만든 ESA 궤도 자료(L2OS v700)와
# 프랑스 CATDS(운영 L3OS, LOCEAN 편향 보정 L3 v11, SMOS/SMAP OI L4), 스페인 BEC(L3/L4) 격자 자료를 한 페이지에 정리했습니다.
# 2026-10-13 확인 시 CATDS 운영 L3OS 10일 파일은 2026-09-28~10-07 구간까지 올라와 있고, LOCEAN 편향 보정 v11은 2010-01~2025-12입니다.
# 같은 페이지 안 버전 변경(L2OS v662 → v700, LOCEAN v10 → v11)은 transitions(to_id 없음)에 적었습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: smos-sss
name: "SMOS 해면 염분 (ESA·CATDS·BEC)"
full_name: >-
  ESA Soil Moisture and Ocean Salinity (SMOS) Sea Surface Salinity — ESA Level 2 Ocean Salinity(L2OS v700),
  CATDS Level 3/Level 4 염분장(CPDC 운영 L3OS, CEC LOCEAN 편향 보정 L3 v11, CEC LOPS SMOS/SMAP OI L4), BEC 전지구 L3/L4
category: satellite
domain: satellite
group: 해면 염분
order: 20
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 원격탐사]
provider: >-
  ESA(위성 운영·L1/L2 처리) / CATDS(프랑스 CNES·IFREMER 지상 처리 센터, 연구 제품은 LOCEAN·LOPS·ACRI-st) / BEC(스페인 바르셀로나 전문가 센터, ICM-CSIC)

status: active
status_note: >-
  SMOS는 2009년 11월 발사 후 계속 관측 중입니다. ESA 임무 페이지(earth.esa.int)는 아직 '2025년 말까지 연장'으로 적혀 있지만, 2026년 5월 해면 염분 학회의 ESA 발표와 회의 보고서는 '2028년 말까지 연장'을,
  CNES 페이지(2026-01 수정)는 '2026년까지 연장(2028년 검토)'을 적고 있습니다. 2026-10-13 확인 시 CATDS 운영 L3OS 10일 염분장은 2026-09-28~10-07 구간 파일(10-13 게시)까지 올라와 있어 정상 갱신 중입니다.
  ESA L2OS 현재판은 v700(2021-05 운영)이며, ESA는 4차 전 기간 재처리 기준판 v740('2025년 말 기준')과 해빙 오염 보정을 넣을 v750(2027)을 예고했습니다.

period:
  start: "2010-01"
  end: present
  note: >-
    SMOS는 2009-11-02 발사, L1·L2 자료는 2010-01-12부터입니다. ESA는 2010-01-12~05-31 시험 운용(commissioning) 기간 자료를 쓰지 말라고 안내하며, L2OS v700 재처리판(REPR)은 2010-06-01~2021-05-24,
    운영판(OPER)은 2021-05-25부터입니다. CATDS 운영 L3OS는 재처리 RE07(2010-01~2021-05)과 운영판(2021-06~), LOCEAN 편향 보정 v11은 2010-01~2025-12(연 1회 갱신, 다음은 2027년 초 예정),
    BEC 전지구 L3/L4는 2011~2019년에 2020-01~2021-05 연장분이 더해진 기간입니다.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    ESA L2OS: ISEA 4H9(정이십면체 Snyder 등면적) 격자의 궤도(스와스) 자료, 관측 폭 1000 km, L1C 공간 해상도 30~50 km.
    CATDS L3OS: EASE-Grid 2.0 전지구(EPSG:6933) 25 km(A)·50 km(B) 격자, 25 km 격자는 584 × 1388. CATDS LOCEAN 편향 보정 v11: 25 × 25 km² 격자(30 km 안 이웃 격자 평균 적용).
    CATDS SMOS/SMAP OI L4: EASE 25 km 격자 파일, 두 번째 매핑을 SMOS/SMAP 해상도(약 45 km) 규모로 수행. BEC: L3 0.25° 위경도 격자, L4 0.05° 위경도 격자
  vertical: 해면 단일층 — L밴드(1.4 GHz) 복사계가 감지하는 표층 염분
  temporal: >-
    ESA L2OS 궤도별(반궤도 파일, 하루 29개) / CATDS L3OS 일 파일(L2Q 상승·하강 궤도 따로)·10일 이동평균(매일)·월평균 /
    LOCEAN v11 4일 간격 지도, 9일·18일 가우스 평활 / SMOS/SMAP OI L4 7일 / BEC L3 9일 지도(매일)·L4 일

coverage:
  short: 전지구
  note: "전지구 해양. CATDS EASE-Grid 2.0 격자는 83.5°S~83.5°N입니다. 해빙역·해빙 가장자리와 연안은 해빙·육지 오염으로 값이 빠지거나 편향이 남습니다"
update: >-
  ESA L2OS·CATDS 운영 L3OS는 매일(CATDS 운영판은 약 5일 지연, NRT판은 1일 지연). CATDS LOCEAN 편향 보정 L3는 연 1회 재처리(다음 2027년 초 예정), BEC 전지구 L3/L4는 비정기 확장
license: >-
  ESA SMOS 자료는 ESA 지구관측 자료 정책에 따라 무료이며, ESA 배포 서버에서 받으려면 EO Sign In 계정이 필요합니다. CATDS 자료는 무료로 배포되며 데이터셋 인용과 생산 기관 감사 문구를 요청합니다.
  BEC 자료는 무료 등록 후 SFTP로 받습니다
account_required: false

summary: >-
  ESA의 지구탐사 위성 SMOS는 L밴드(1.4 GHz) 간섭 합성개구 복사계(MIRAS)로 토양수분과 해면 염분을 관측하는 위성으로, 2010년부터 가장 긴 위성 염분 기록을 만들고 있습니다.
  ESA는 궤도 단위의 Level 2 염분(L2OS)을 내고, 프랑스 CATDS는 이를 EASE-Grid 2.0 격자로 모은 운영 L3OS(매일 갱신)와 연구용 편향 보정 L3(LOCEAN), SMAP과 합친 OI L4를,
  스페인 BEC는 독자 방법으로 육지·전파 간섭 오염을 줄인 전지구 L3/L4를 만듭니다. 기후 연구에는 편향을 정교하게 보정한 CATDS LOCEAN·BEC 제품이, 최근 감시에는 CATDS 운영 L3OS가 주로 쓰입니다.

time_convention:
  summary: >-
    ESA L2OS는 위성이 지나간 순간의 궤도 관측값이고 상승·하강 궤도의 편향 특성이 서로 다릅니다. CATDS 운영 L3OS의 10일 자료는 매일 만들어지는 10일 이동평균이며 파일 이름에 평균 구간의 시작·끝 날짜가 들어 있고,
    월자료는 달력 한 달 평균입니다. LOCEAN 편향 보정 v11은 4일마다 만든 지도에 반치폭(FWHM) 9일·18일 가우스 가중 평균을 적용한 값입니다.
  points:
    - "CATDS L3OS 10일 파일 이름 예: SM_OPER_MIR_CSQ3A__20260928T000000_20261007T235959_343_002_7.tgz — 2026-09-28~10-07 평균, 343은 처리기 버전, A는 25 km 격자(B는 50 km)입니다. 같은 폴더의 시작~끝이 한 달인 파일이 월자료입니다."
    - "CATDS L3OS 파일은 .tgz 묶음 안에 머리 파일(.HDR)과 자료 파일(.DBL.nc, NetCDF3)이 들어 있습니다. 1일 지연판은 이름의 MIR가 NRT로 바뀝니다."
    - "CATDS L2Q 일 파일(MIR_CSF2QA·MIR_CSF2QD)은 상승(A)·하강(D) 궤도를 따로 담은 그날의 유효 관측값입니다. 두 궤도의 편향이 다르니 섞기 전에 확인하세요."
    - "LOCEAN v11의 9일 제품은 이웃한 지도끼리 구간이 크게 겹쳐 독립 표본이 아닙니다. 18일 제품은 잡음이 더 적지만 시간 해상도가 낮습니다."
    - "ESA L2OS 파일은 극에서 극까지 약 50분 관측을 담은 반궤도 단위(하루 29개)입니다. OPER(현재 기준판으로 처리)와 REPR(재처리) 구분이 파일 이름에 있습니다."
  source: https://archimer.ifremer.fr/doc/00811/92266/98299.pdf
  source_name: CATDS L3/L4 OS ATBD + Sextant 제품 기록 + LOCEAN v11 설명서 + ESA L2OS v700 릴리스 노트

variables:
  note: >-
    ESA L2OS 변수 이름은 L2OS v700 릴리스 노트, CATDS L3OS 이름은 CATDS L3/L4 OS ATBD(표 10), LOCEAN 변수는 v11 설명서 기준입니다. 염분 단위 pss는 실용염분입니다.
    CATDS L3OS 이름 끝 _1은 강수 보정한 '벌크' 염분, _2는 강수 보정하지 않은 염분입니다.
  full_list: https://archimer.ifremer.fr/doc/00811/92266/98299.pdf
  groups:
    - name: ESA L2OS v700 (궤도 자료, ISEA 4H9)
      kind: instant
      items:
        - text: "해면 염분(육지-해양 오염 보정) — `SSS_corr` (pss)"
          note: ESA 권장 필터를 적용해 쓰세요
        - "해면 염분(육지-해양 오염 미보정) — `SSS_uncorr` (pss)"
        - text: "해면 염분 편차(SMOS 기후값 2013~2019 대비) — `SSS_anom` (pss)"
          std: []
        - text: "염분 추정 오차 — `Sigma_SSS_corr`, `Sigma_SSS_uncorr`, `Sigma_SSS_anom` (pss)"
          std: []
        - text: "시야(FOV) 안 위치 지표 — `Dg_af_fov`"
          std: []
          note: ESA는 130 초과만 쓰라고 권장
        - text: "품질·해상 상태 플래그 — `Fg_ctrl_*`, `Fg_sc_*`"
          std: []
    - name: CATDS 운영 L3OS 3Q (EASE-Grid 2.0 25·50 km, 10일 이동평균·월, 상승·하강 합침)
      kind: mean
      period: 10일 이동 또는 월
      items:
        - text: "평균 해면 염분(강수 보정 벌크 염분) — `Mean_Sea_Surface_Salinity_1` (pss)"
        - text: "평균 해면 염분(강수 미보정) — `Mean_Sea_Surface_Salinity_2` (pss)"
        - text: "염분 표준편차 — `SSS_standard_deviation_1` (pss)"
          std: []
        - text: "평균 염분 오차 — `SSS_error_mean_1` (pss)"
          std: []
        - text: "평균에 쓴 관측 수 — `N_Used_Meas_1` (개)"
          kind: accum
          std: []
        - text: "평균 전에 제외한 관측 수 — `N_Rejected_Meas_1` (개)"
          kind: accum
          std: []
    - name: CATDS LOCEAN 편향 보정 L3 v11 (25 km, 4일 간격)
      kind: mean
      period: 9일 또는 18일 (가우스 가중)
      items:
        - text: "편향 보정 해면 염분 (pss)"
          note: 설명서에 파일 속 변수 이름은 적혀 있지 않습니다
        - text: "염분 오차 대략값 — `eSSS` (pss)"
          std: []
          note: 50 km 안 공간 표준편차로 만든 정성적 지표, 연안에서 지나치게 작게 나옴

access:
  - name: CATDS — 운영 L3OS 10일·월 염분장 (HTTPS)
    url: https://data.catds.fr/cpdc/Ocean_products/GRIDDED/L3OS/
    method: HTTPS 직접 다운로드 (OPER/MIR_CSQ3A_ 25 km·MIR_CSQ3B_ 50 km, 재처리 RE07/, 일 L2Q는 MIR_CSF2QA·MIR_CSF2QD)
    note: >-
      .tgz 안에 NetCDF3 파일이 들어 있습니다. 1일 지연 NRT판은 OPER/NRT_* 폴더에 있습니다. 영역·기간을 잘라 받으려면 CATDS SIPAD(https://www.catds.fr/sipad/)를 쓰세요.
      Copernicus Marine(MULTIOBS_GLO_PHY_SSS_L3_MYNRT_015_014)으로도 재배포됩니다.
