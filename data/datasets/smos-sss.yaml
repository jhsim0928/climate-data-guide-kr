    method: HTTPS 직접 다운로드 (L3_DEBIAS_LOCEAN_v11/debiasedSSS_09days_v11.0, debiasedSSS_18days_v11.0)
    note: 설명서(documentation/Doc_L3_DEBIAS_LOCEAN_v11.pdf)와 이용 조건(DataPolicy.txt)이 같은 폴더에 있습니다. 실험 제품이라 사용 후기를 요청합니다.
    login: false
  - name: CATDS — CEC LOPS SMOS/SMAP OI L4 (HTTPS)
    url: https://data.catds.fr/cecos-locean/Ocean_products/SSS_SMOS-SMAP_OI_L4/
