example:
  lang: python
  note: >-
    CATDS 운영 L3OS 25 km 10일 파일 하나를 받아 압축을 풀고 한반도 주변 염분을 읽는 예입니다(로그인 불필요). 변수 이름은 ATBD 표 기준이며, 좌표 변수 이름은 파일에서 확인하세요(ATBD에는 lat·Lon으로 적혀 있음).
  code: |
    # pip install xarray netCDF4 requests
    import tarfile, glob, requests
    import xarray as xr

    base = "https://data.catds.fr/cpdc/Ocean_products/GRIDDED/L3OS/OPER/MIR_CSQ3A_/2026/09/"
    name = "SM_OPER_MIR_CSQ3A__20260901T000000_20260910T235959_343_003_7.tgz"
    with open(name, "wb") as f:
        f.write(requests.get(base + name, timeout=120).content)
    tarfile.open(name).extractall("smos_l3")

    ds = xr.open_dataset(glob.glob("smos_l3/**/*.DBL.nc", recursive=True)[0])
    print(list(ds.data_vars))                      # 변수 이름 확인
    sss = ds["Mean_Sea_Surface_Salinity_1"]        # 강수 보정 벌크 염분 (pss)
    lat = ds["lat"]
    print(float(sss.where((lat > 25) & (lat < 40)).mean()))

tips:
  - "ESA는 L2OS를 그대로 쓰지 말고 릴리스 노트의 필터(Fg_ctrl_ecmwf·Fg_sc_low_wind가 0인 값, 간섭·해빙·햇빛 반사 등 플래그가 1인 값 제외, Dg_af_fov > 130만 사용)를 강하게 권장합니다. 필터를 다 쓰면 유효 격자가 크게 줄어 일부를 완화해도 된다고 적고 있습니다."
  - "L2OS v700은 상승·하강 궤도 사이 차이가 남아 있고, 남위 50° 이남과 해빙 주변에서 편향·잡음이 커집니다. 장기 분석에는 이런 체계적 편향을 보정한 CATDS LOCEAN·BEC 격자 자료가 낫습니다."
  - "2010년 1~5월은 시험 운용 기간이라 ESA가 쓰지 말라고 안내합니다. 2010년 초를 포함한 시계열은 시작 시점을 2010년 6월 이후로 잡으세요."
  - "LOCEAN 설명서는 육지-해양 편향을 보정해도 연안과 변동이 큰 강 하구 플룸 주변에는 잔여 편향이 남는다고 밝힙니다. 동중국해 장강 희석수처럼 연안 플룸을 볼 때는 현장 관측과 꼭 비교하세요."
  - "CATDS 운영 L3OS는 최근 자료가 매일 나오지만 고위도 해빙 보정이 불완전하고 전파 간섭(RFI)이 남을 수 있습니다. 연구용 LOCEAN v11은 2025년 말까지만 있으므로, 최근 기간을 이어 붙일 때는 두 제품의 차이를 먼저 확인하세요."
  - "북극 염분은 CATDS가 2026-04부터 운영으로 만드는 ARCTIC L3G(9일)와 연구용 CEC ARCTIC V2(2023-08-30까지)가 있습니다. CATDS는 가능한 기간은 V2를, 최근은 L3G로 보충하라고 권합니다."
  - "LOCEAN의 eSSS는 정성적 오차 지표일 뿐이며 연안 근처에서는 지나치게 작게 나옵니다. 정량 불확도로 쓰지 마세요."

citations:
  dataset:
