notices:
  - date: "2026-09-08"
    level: info
    title: NSIDC AMSR2 산출물 계속 처리 — Sea Ice Index 입력(NSIDC-0803) 유지
    body: >-
      JAXA가 AMSR2 자료를 내는 동안 NSIDC-0803(AMSR2 일별 극 격자 해빙 농도) 등 AMSR2 산출물을 계속 처리한다고 공지했습니다.
      AMSR3 기반 산출물 개발은 2027년으로 계획되어 있어, 그 전까지 Sea Ice Index 입력은 AMSR2로 유지될 것으로 보입니다(Sea Ice Index 자체 언급은 없음).
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-amsr2-products-continued-forward-processing
  - date: "2025-07-31"
    level: warning
    title: Sea Ice Index Version 4 공개 — 2025년부터 AMSR2 입력, V3 퇴역
    body: >-
      2025-01-01 이후 범위·면적·영상이 AMSR2 기반 NSIDC-0803 농도로 계산됩니다. 준실시간/최종 구분이 없어졌고, 빈 격자를 시간 보간으로 채우며,
      북극점 관측 공백 크기가 조금 바뀌었습니다. 2024년까지 값은 V3와 같습니다. 새 DOI는 10.7265/a98x-0f50입니다.
    source: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-index-version-4
  - date: "2025-07-23"
    level: warning
    title: Version 4 전환 예고 — AMSR2 범위가 SSMIS보다 약간 작음
    body: >-
      AMSR2는 얼음 가장자리를 SSMIS보다 약간 안쪽에 잡아 범위가 북반구 약 0.1, 남반구 약 0.15 백만 km² 이내로 작게 나오며, 그 결과 범위 추세가 조금 더 음으로 기웁니다.
      상호 보정은 예비 단계로 이후 개선 예정이고, V3는 V4 공개와 함께 퇴역한다고 안내되었습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-sea-ice-index-transitioning-version-4-amsr2-data
  - date: "2025-07-03"
    level: info
    title: Version 3의 2023~2024년 값을 최종 자료로 교체
    body: >-
      V3의 2023-01-01 ~ 2024-12-31 구간을 준실시간 입력에서 NASA GSFC 최종 농도 자료로 다시 처리했습니다. V4의 2024년까지 값은 이 V3 값을 그대로 씁니다.
    source: https://nsidc.org/data/user-resources/data-announcements/data-set-update-sea-ice-index-version-3-0
  - date: "2025-06-25"
    level: critical
    title: SSMIS 자료 중단 통보 — Sea Ice Index 처리 중단 예고 (이후 AMSR2 전환으로 해소)
    body: >-
      미 국방부가 2025-06-30까지 SSMIS 처리·배포를 멈춘다고 통보해, SSMIS를 쓰던 Sea Ice Index가 그 뒤 처리 중단될 수 있다고 공지되었습니다.
      당시 북반구 범위의 대안으로 MASIE가 안내되었습니다. 이후 SSMIS 처리가 7월 말까지 연장되었고(2025-06-30 공지), 7월 31일 V4(AMSR2) 공개로 처리가 이어졌습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-ssmis-data-discontinuation-affecting-sea-ice-index-and-sea-ice-cdr-effective-30-june
  - date: "2025-05-06"
    level: warning
    title: 지원 수준 '기본(Basic)'으로 하향
    body: >-
      NOAA NCEI가 관련 눈·얼음 자료 지원을 중단(2025-05-05)하면서 Sea Ice Index가 기본 지원 수준으로 바뀌었습니다. 자료는 계속 자동 갱신되지만
      적극적인 유지·문의 대응·문제 해결은 제한될 수 있습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-level-service-update-data-products

