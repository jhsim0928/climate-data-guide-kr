# ─────────────────────────────────────────────────────────────
# NSIDC Sea Ice Index — 데이터셋 정보 파일
# G02135 Version 4 (2025-07-31 공개, 2025년부터 AMSR2 입력)
# ─────────────────────────────────────────────────────────────
id: sea-ice-index
name: Sea Ice Index
full_name: NOAA/NSIDC Sea Ice Index (G02135, Version 4; 북극·남극 해빙 범위·면적 일·월 지수와 영상)
category: satellite
domain: seaice
group: 해빙 지수
order: 10
domains: [해빙]
provider: NOAA@NSIDC / 미국 국립빙설자료센터(NSIDC)

status: active
status_note: >-
  정상 갱신 중입니다(하루 늦게 매일 갱신). DMSP SSMIS 자료 중단에 대비해 2025-07-31 Version 4가 나오면서 2025-01-01 이후 값은 JAXA AMSR2 기반으로 바뀌었고,
  Version 3는 퇴역했습니다. 2025년 5월부터 예산 문제로 '기본(Basic)' 지원 수준으로 낮아져 자동 갱신은 계속되지만 문제 대응이 느릴 수 있습니다.

transitions:
  - from: Sea Ice Index V3
    to: Sea Ice Index V4
    status: completed
    date: "2025-07"
    summary: >-
      DMSP SSMIS 자료 접근이 끝날 것에 대비해 2025-01-01 이후 입력 해빙 농도를 SSMIS 기반(NSIDC-0081·NSIDC-0051)에서 AMSR2 기반 NSIDC-0803으로 바꾼 버전입니다.
      2024년까지 값은 다시 처리하지 않고 V3 값을 그대로 복사했으며(파일 이름만 v4.0), 준실시간/최종 구분이 없어졌습니다. V3는 V4 공개와 함께 퇴역했습니다.
    changes:
      - aspect: 2025년 이후 입력
        before: "SSMIS 기반 준실시간 농도(NSIDC-0081) → 1년 이상 뒤 최종 농도(NSIDC-0051, NASA GSFC)로 교체"
        after: "AMSR2 일별 극 격자 해빙 농도(NSIDC-0803, NASA Team 알고리즘) — 2025-01-01부터"
      - aspect: 1978~2024년 값
        before: "V3 값 (2023~2024년은 2025-07-03 최종 자료로 갱신)"
        after: "V3 값을 그대로 복사, 파일 이름에 v4.0만 붙음 (2025년 이전 영상에는 여전히 'final' 표기)"
      - aspect: 준실시간/최종 구분
        before: "최근 구간은 준실시간(NRTSI) 값, 최종 자료가 나오면 교체"
        after: "구분 없음 — AMSR2 한 가지 입력으로 바로 생산"
      - aspect: 결측 처리
        before: "결측 격자는 영상에 빈 곳으로 남음"
        after: "NSIDC-0803 농도장의 빈 격자를 전날 값으로 채운 뒤 앞뒤 날 평균으로 다시 채움(시간 보간). 그래서 그날 범위 값이 다음 날 조금 바뀔 수 있음"
      - aspect: 북극점 관측 공백
        before: "SSMIS — 0.029 백만 km², 반지름 94 km 원형 (2008~2024)"
        after: "AMSR2 — 0.064 백만 km², 둥근 사각형 (2025~). 범위 계산에서는 얼음으로 간주"
      - aspect: AMSR2와 SSMIS 범위 차이 (2025-01-01 ~ 06-30 비교)
        before: "SSMIS 기준"
        after: "AMSR2가 대체로 작음 — 북반구 평균 0.05, 최대 0.2 미만 / 남반구 평균 0.04, 최대 0.15 미만 백만 km² (Special Report 28). 얼음 가장자리를 약간 안쪽에 잡기 때문"
      - aspect: DOI·파일 이름
        before: "10.7265/N5K072F8, …_v3.0.csv"
        after: "10.7265/a98x-0f50, …_v4.0.csv (예: N_seaice_extent_daily_v4.0.csv)"
    impacts:
      - 2025년 이후 값이 SSMIS로 계속 만들었을 때보다 약간 작게 나오므로, 1979년부터의 범위 추세가 아주 조금 더 음(감소) 쪽으로 기웁니다. 2025년 이후 '역대 최저'·순위 비교에서는 이 차이(수만~십수만 km²)를 감안하세요.
      - NSIDC는 SSMIS와의 상호 보정이 '예비(preliminary)' 단계라 앞으로 개선할 계획이라고 밝혔습니다. 향후 버전에서 2025년 이후 값이 다시 바뀔 수 있습니다.
      - V3 파일은 더 이상 제공되지 않습니다. 예전에 받은 V3 CSV와 V4 CSV를 섞지 말고 전체를 V4로 다시 받으세요(2024년까지 값은 같음).
      - 일별 값은 다음 날 결측 보간으로 조금 바뀔 수 있으니, 최신 며칠 값은 다시 받아 확인하세요.
    sources:
      - name: NSIDC 공지 — Sea Ice Index Version 4 전환 예고 (2025-07-23)
        url: https://nsidc.org/data/user-resources/data-announcements/user-notice-sea-ice-index-transitioning-version-4-amsr2-data
      - name: NSIDC 공지 — Sea Ice Index Version 4 공개 (2025-07-31)
        url: https://nsidc.org/data/user-resources/data-announcements/new-version-release-noaansidc-sea-ice-index-version-4
      - name: NSIDC Special Report 28 — Sea Ice Index Version 4 Analysis (2025년 7월)
        url: https://nsidc.org/sites/default/files/documents/technical-reference/nsidc-special-report-28.pdf
      - name: G02135 V4 사용자 안내서
        url: https://nsidc.org/sites/default/files/documents/user-guide/g02135-v004-userguide.pdf

period:
  start: "1978-10"
  end: present
  note: >-
    일자료는 1978-10-26, 월자료는 1978-11부터이며 2026-10-12 현재 하루 늦게 매일 갱신됩니다(데이터셋 페이지·Arctic Sea Ice News 기준, 저장소 목록은 직접 열어 보지 못함).
    입력은 1978-10 ~ 2024-12 NSIDC-0051(SMMR·SSM/I·SSMIS), 2025-01 이후 NSIDC-0803(AMSR2)입니다.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    25 km NSIDC 해빙 극 평사도 격자 — 북반구 "NSIDC Sea Ice Polar Stereographic North"(EPSG:3411, 30.98°N 이북), 남반구 "… South"(EPSG:3412, 39.23°S 이남), Hughes 타원체.
    공칭 셀 면적 625 km²이지만 실제 면적은 위도에 따라 북반구 382~664 km², 남반구 443~664 km². 범위·면적 지수는 반구 전체 합계값
  vertical: 해당 없음 (해빙 범위·면적 지수)
  temporal: 일·월 (일별 범위 CSV, 월별 범위·면적 CSV, 일·월 영상·GeoTIFF). 기후값·이상값 기준 기간 1981~2010

update: >-
  일별 CSV·영상은 매일 갱신(전날 AMSR2 자료 사용, 약 1일 지연). 결측 보간 때문에 그날 값은 다음 날 조금 바뀔 수 있음.
  월 파일은 그 달이 끝나면 갱신(사용자 안내서 표현: 월별 파일은 해당 달이 끝날 때 해마다 한 번 갱신)
license: 공개 자료(NOAA@NSIDC). 데이터셋 인용이 이용 조건이며, 사용한 부분과 접근 날짜를 함께 적도록 권고
account_required: false

summary: >-
  NSIDC가 수동마이크로파 위성 해빙 농도로 매일 계산하는 북극·남극 해빙 범위(extent)·면적(area) 지수와 농도·범위 영상 모음입니다.
  1978년 이후 NASA Team 알고리즘 농도(NSIDC-0051)를 쓰고 2025년부터는 AMSR2 기반 NSIDC-0803 농도를 이어 붙이며, 1981~2010년 기후값 대비 이상값·추세 영상과 CSV,
  GeoTIFF, shapefile을 함께 제공합니다. 언론·보고서의 "북극 해빙 역대 최저" 같은 수치가 대부분 이 자료에서 나옵니다.

time_convention:
  summary: >-
    일별 범위·면적은 그날의 일별 해빙 농도장(하루 동안의 위성 관측을 격자마다 모은 일평균 성격의 장)으로 계산한 하루 대표값이며, CSV 값에는 평활을 적용하지 않습니다.
    월 범위는 그 달 일별 범위의 평균이고, 월 농도 영상은 월평균 농도장입니다. 특정 시각의 순간값이 아닙니다.
  points:
    - "범위(extent) = 농도 15% 이상 격자 면적의 합(북극점 관측 공백은 얼음으로 간주해 포함). 면적(area) = 15% 이상 격자의 '셀 면적 × 농도' 합(북극점 공백 제외)."
    - "Charctic 등 일별 범위 그래프에 쓰는 5일 후행 이동평균은 그래프에만 적용되며, CSV 값과 영상에는 적용되지 않습니다."
    - "월 평균 농도는 그 달 20일 이상 자료가 있는 격자만 만들며, 자료가 부족한 달의 월 CSV 값은 -9999입니다."
    - "Version 4(2025년 이후)는 AMSR2 농도장의 빈 격자를 전날 값, 이어서 앞뒤 날 평균으로 채운 뒤 계산합니다. 그날 값이 다음 날 조금 바뀔 수 있습니다."
    - "일별 CSV의 Missing 열은 그날 범위를 계산할 때 자료가 빠졌던 격자 면적의 합(백만 km²)입니다."
  source: https://nsidc.org/sites/default/files/documents/user-guide/g02135-v004-userguide.pdf
  source_name: G02135 V4 사용자 안내서 / NSIDC Special Report 28

variables:
  note: >-
    사용자 안내서 기준 CSV 열 이름과 영상·GeoTIFF 종류입니다. 범위·면적 단위는 백만 km²이며 결측은 -9999입니다. 영상(PNG)과 GeoTIFF는
    h_YYYYMMDD_concentration_vX.x.tif(일), h_YYYYMM_concentration_vX.x.tif(월)처럼 이름 짓고 extent도 같은 규칙입니다(h = N 또는 S).
  full_list: https://nsidc.org/sites/default/files/documents/user-guide/g02135-v004-userguide.pdf
  groups:
    - name: 일별 지수 (h_seaice_extent_daily_v4.0.csv)
      kind: mean
      period: 일
      items:
        - text: "해빙 범위 — `Extent` (백만 km²)"
          note: 그날 일별 농도장에서 계산한 반구 합계. 평활하지 않은 값
        - text: "결측 격자 면적 — `Missing` (백만 km²)"
          note: 그날 범위 계산 때 자료가 없던 격자 면적의 합
        - text: "입력 자료 출처 — `Source Data` (경로 문자열)"
          kind: static
          note: 경로에 NSIDC-0051(GSFC 산출물) 또는 NSIDC-0803(AMSR2 산출물)이 들어 있어 그날 값의 입력을 알 수 있음
    - name: 월별 지수 (h_mm_extent_v4.0.csv, 달마다 한 파일)
      kind: mean
      period: 월
      items:
        - text: "월 해빙 범위 — `extent` (백만 km²)"
          note: 그 달 일별 범위의 평균
        - text: "월 해빙 면적 — `area` (백만 km²)"
          note: 그 달의 해빙 면적(북극점 관측 공백 제외). 자료가 부족한 달은 -9999
    - name: 격자 영상·GeoTIFF
      kind: mean
      period: 일
      items:
        - text: "해빙 농도 — `concentration` GeoTIFF·PNG (%)"
          note: 일 파일은 그날 농도장, 월 파일(period 월)은 월평균 농도장
        - text: "해빙 범위 — `extent` GeoTIFF·PNG (15% 이상 여부)"
          note: 일·월 농도장에서 15% 문턱으로 나눈 범위 영상
    - name: 기후값·중앙 경계 (1981~2010)
      kind: static
      items:
        - text: "일별 범위 기후값 — `Avg Ext`, `Std Deviation`, `10th`·`25th`·`50th`·`75th`·`90th` (백만 km²)"
          note: h_seaice_extent_climatology_1981-2010_v4.0.csv. 연중 날짜(DOY)별 1981~2010 통계값으로 고정된 기준
        - text: "월별 중앙 해빙 경계 — shapefile(shp_median) (선)"
          note: 1981~2010 같은 달 범위의 중앙 경계선. 이상값 영상의 기준선

access:
  - name: NSIDC 데이터셋 페이지 — G02135 Version 4
    url: https://nsidc.org/data/g02135/versions/4
    method: 웹 안내 / 사용자 안내서 / 인용 문구
    note: 사용자 안내서, Special Report 28(V4 분석), 분석 스프레드시트 설명서가 연결되어 있습니다.
  - name: NOAA@NSIDC HTTPS 저장소 — G02135
    url: https://noaadata.apps.nsidc.org/NOAA/G02135/
    method: HTTPS (브라우저, wget, Python/R)
    note: >-
      로그인 없이 받을 수 있습니다. north/·south/ 아래 daily/(data, geotiff, images)와 monthly/(data, geotiff 등) 폴더, 월별 shapefile 폴더(shp_extent, shp_median)가 있고,
      seaice_analysis/에 분석용 스프레드시트가 있습니다. 정확한 구성은 디렉터리 목록에서 확인하세요.
  - name: Sea Ice Index 영상 보기 (Daily and Monthly Image Viewer)
    url: https://nsidc.org/data/seaice_index
    method: 웹 영상 보기 / 비교·애니메이션 도구
    note: 일·월 범위, 농도, 이상값, 추세 영상을 바로 볼 수 있습니다. 자료·영상 보관소는 https://nsidc.org/data/seaice_index/data-and-image-archive 입니다.

example:
  lang: python
  note: 로그인 없이 HTTPS에서 북반구 일별 범위 CSV를 바로 읽습니다. 열 이름 앞뒤 공백과 단위 설명 행이 있을 수 있어 정리 과정을 넣었습니다.
  code: |
    import pandas as pd

    url = "https://noaadata.apps.nsidc.org/NOAA/G02135/north/daily/data/N_seaice_extent_daily_v4.0.csv"
    df = pd.read_csv(url, skipinitialspace=True)
    df.columns = df.columns.str.strip()
    df = df[pd.to_numeric(df["Year"], errors="coerce").notna()]      # 단위 설명 행 제거
    df["date"] = pd.to_datetime(df[["Year", "Month", "Day"]].astype(int))
    df["Extent"] = df["Extent"].astype(float)                         # 백만 km²

    # 2025년 이후는 AMSR2 입력 (Source Data 열에 NSIDC-0803)
    print(df.groupby(df["date"].dt.year)["Extent"].min().tail())

tips:
  - >-
    장기 추세에는 일별 값이 아니라 월별 파일을 쓰라고 NSIDC가 권합니다. 일별 농도는 날씨 영향과 불확실성이 크고, 일별 얼음 가장자리는 항해 같은 실무용으로 쓸 만큼 정확하지 않습니다.
  - >-
    2025-01-01부터 입력이 SSMIS에서 AMSR2로 바뀌어 범위가 대체로 작게 나옵니다(2025년 상반기 비교에서 평균 차이 0.04~0.05, 최대 0.15~0.2 백만 km² 미만). 2025년 이후 '역대 최저' 순위나 1979년 이후 추세를
    다룰 때는 센서 교체 시점을 명시하세요. 같은 이유로 NOAA/NSIDC CDR(G02202 V6) 등 다른 AMSR2 기반 자료와도 2025년 이후 값이 정확히 같지 않습니다.
  - >-
    범위(extent)와 면적(area)은 다릅니다. 범위는 15% 이상 격자 전체 면적을, 면적은 농도를 곱한 실제 얼음 면적을 더하며, 북극점 관측 공백은 범위에는 포함·면적에는 제외됩니다.
    관측 공백 크기가 센서마다 달라(SMMR 1.19, SSM/I 0.31, SSMIS 0.029, AMSR2 0.064 백만 km²) 북극 면적(area) 시계열에는 센서 교체 때 계단이 생길 수 있습니다.
  - >-
    15% 문턱과 NASA Team 알고리즘에 따라 값이 달라지므로 다른 기관(OSI SAF, JAXA 등)의 해빙 범위와 절대값을 바로 비교하지 마세요. 이상값·추세 기준 기간은 1981~2010년입니다.
  - >-
    NSIDC-0051(SSMIS 기반 최종 농도)과 NSIDC-0081(준실시간)은 2026년에 갱신이 끝나거나 퇴역했지만, Sea Ice Index V4는 2025년부터 NSIDC-0803(AMSR2)을 쓰므로 영향이 없습니다.
    다만 이 자료는 2025년 5월부터 '기본' 지원 수준이라 오류 수정·문의 응답이 늦을 수 있습니다.

citations:
  dataset:
    - label: Sea Ice Index Version 4 (G02135)
