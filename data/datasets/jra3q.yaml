notices:
  - date: "2026-08-19"
    level: warning
    title: DIAS 일부 재개 — 2026년 6월 24일 이후 자료만 제공
    body: >-
      장기 점검 중이던 DIAS가 JRA-3Q 다운로드를 일부 재개했습니다. 다만 2026년 6월 24일 이후 자료만 받을 수 있고,
      그 이전 기간의 재공개 일정은 정해지지 않았습니다. 과거 기간은 NCAR GDEX를 이용하세요.
    source: https://diasjp.net/en/information/operation/20260727-resumption/
  - date: "2026-04-28"
    level: warning
    title: DIAS 장기 점검 — 모든 데이터셋 접근 불가
    body: >-
      DIAS가 장기 점검 중이라 웹사이트를 제외한 모든 시스템과 데이터셋을 쓸 수 없고 복구 일정도 정해지지 않았다고 공지했습니다.
      JMA JRA-3Q 페이지도 DIAS 자료에 접근할 수 없다고 안내하고 있습니다.
    source: https://diasjp.net/en/information/operation/20260428-unscheduled-maintenance/
  - date: "2025-12-02"
    level: info
    title: JMA 재분석 홈페이지 주소 변경
    body: JRA 프로젝트 홈페이지가 jra.kishou.go.jp에서 www.data.jma.go.jp/jra/html/ 로 옮겨졌습니다. 옛 주소는 당분간 자동 연결됩니다.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/index_en.html
  - date: "2023-12-05"
    level: info
    title: NCAR에서 준실시간 JRA-3Q 제공 시작
    body: 준실시간 JRA-3Q 자료를 NCAR에서 받을 수 있게 되었습니다. 같은 시기에 JRA-55 준실시간 갱신 종료(2024년 1월 말)가 예고되었습니다.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/information_en.html
  - date: "2023-08-10"
    level: info
    title: 전 기간 공개 및 JRA-3Q-COBE 공개 (DIAS)
    body: 1947년 9월~1990년 12월과 2013년 5월 이후 자료가 DIAS에 추가되어 전 기간이 공개되었고, 부속 제품 JRA-3Q-COBE도 함께 공개되었습니다.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/information_en.html
  - date: "2022-12-09"
    level: warning
    title: 해빙 관련 요소의 국지적 품질 문제 공지
    body: >-
      1985년 6월~2013년 4월 구간에서 해빙 분석을 모델 격자로 옮기는 과정의 오류로, 해빙 가장자리 약 250 km 이내의
      해빙 피복률이 과대(약 0.15)하게 들어갔습니다. 주변의 지표 복사·난류 열플럭스와 2 m 기온·습도도 약간 영향을 받습니다.
      JMA는 영향이 국지적이고 경년변동보다 작다고 설명합니다.
    source: https://www.data.jma.go.jp/jra/html/JRA-3Q/document/JRA-3Q_qualityissue_20221209_en.pdf

