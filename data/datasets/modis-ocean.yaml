notices:
  - date: "2026-03-20"
    level: warning
    title: NASA, Terra 과학 운용 종료를 2027년 2월·Aqua를 2027년 9월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월에 과학 운용이 끝날 것으로 전망하며
      그때까지 운용을 계속한다고 밝혔습니다. 두 위성이 끝나면 MODIS 해색·해수면온도도 더 생산되지 않습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-12-09"
    level: warning
    title: OBPG, 다음 MODIS Aqua 해색 재처리는 임무 종료 뒤 — 2022년 이후 자료 신뢰도 경고
    body: >-
      OB.DAAC 담당자는 MODIS 재처리 계획을 묻는 질문에, 다음 Aqua 해색 재처리는 임무가 끝난 뒤에야 하며 예산 때문에 날짜를 정할 수 없다고 답했습니다.
      궤도 변화와 궤도상 보정 문제가 완전히 고쳐지지 않을 수 있어 2022년 이후 자료는 장기 변화 평가에 신뢰도가 낮을 것이라며, 최근 기간은 VIIRS나 PACE OCI 자료를 고려하라고 권했습니다.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=24652
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 시작
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어가며, 두 위성이 설계 궤도를 벗어나 적도 통과 시각이 바뀌고 있어 자료에 영향을 줄 수 있다고 공지했습니다.
      MODIS 수집이 멈추면 마지막 재처리를 하며 사용자는 VIIRS 유사 산출물을 검토하라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2022-10-27"
    level: info
    title: Aqua MODIS 해색 R2022.0 재처리 자료 배포 — 파일 이름·폴더 구조 변경
    body: >-
      OB.DAAC는 R2022.0으로 재처리한 Aqua MODIS L3 binned·mapped 파일을 Direct Data Access에 올렸고 옛 판은 지우는 중이라고 안내했습니다. 새 파일은 이름 규칙이 바뀌었고,
      OPeNDAP에서는 옛 파일이 연중일 3자리 폴더, 새 파일이 월일 4자리 폴더에 있습니다. Terra 재처리는 2022년 11월에 시작되었습니다.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=12936
  - date: "2021-11-10"
    level: info
    title: Aqua 궤도 유지 중단 — 적도 통과 시각이 점점 늦어짐
    body: >-
      LP DAAC 공지에 따르면 Aqua는 2021-03-18 마지막 궤도 유지 기동을 마쳤고 2021년 7월부터 통과 시각이 늦어지기 시작해 2023년 2월 13:45를 넘고 2026년 8월 무렵 약 15:50에 이를 것으로 예상되었습니다.
      오후 늦은 관측은 태양 고도가 낮아 그림자가 늘고, 고도가 낮아져 관측 폭과 16일 반복 주기가 바뀝니다.
    source: https://lpdaac.usgs.gov/news/aqua-modis-acquisition-plan-through-august-2026/

transitions:
  - from: MODIS 해색 R2018.0
    to: MODIS 해색 R2022.0
    status: completed
    date: "2022-10"
    summary: >-
      SeaWiFS부터 VIIRS·OLCI까지 함께 다시 처리한 다중 위성 재처리입니다. 기기 보정과 대리 보정(MOBY)을 새로 하고 보조 기상·오존 자료와 엽록소 계수, 해륙 마스크를 바꿨으며
      산출물 형식과 구성은 R2014.0과 같게 유지했습니다(파일 이름 규칙은 바뀜). 해수면온도는 이 재처리에 들어가지 않고 R2019.0을 그대로 씁니다.
    changes:
      - aspect: 기기 보정
        before: R2018.0까지의 태양·달 보정 자료
        after: R2018.0 이후 쌓인 태양 확산판·달 관측과 개선된 감쇠 모델 반영
      - aspect: 보조 기상·오존
        before: NCEP 기상장, OMI·TOMS·TOVS·TOAST 오존
        after: "MERRA-2(NRT 처리는 GEOS-IT)"
      - aspect: 대기 보정용 해수면온도
        before: NOAA OI SST V2
        after: "GHRSST L4 CMC 해수면온도(SST R2019부터 사용)"
      - aspect: 엽록소 알고리즘
        before: 이전 OCx 계수
        after: "O'Reilly & Werdell(2019) OCx 계수"
      - aspect: 해륙 마스크·수심
        before: 이전 수심·육지 마스크 파일
        after: 수정한 GEBCO_2020 격자(큰 호수 수면 높이 포함)
      - aspect: 고유 광학 특성
        before: 라만 산란 보정 없음
        after: "IOP 계산 시 Rrs의 라만 산란 보정(Westberry et al., 2013)"
      - aspect: 파일 이름
        before: "A2020001.L3m_DAY_CHL_chlor_a_4km 형식"
        after: "AQUA_MODIS.20200101.L3m.DAY.CHL.chlor_a.4km.nc 형식(2019-10 도입 규칙)"
    impacts:
      - R2018.0과 R2022.0 값을 섞지 말고 전 기간을 R2022 계열로 다시 받으세요.
      - "엽록소 계수와 보조자료가 바뀌어 같은 날짜라도 값이 다릅니다. 이전 논문 값과 비교할 때 판을 확인하세요."
    sources:
      - name: OBPG — Reprocessing 2022.0 General Description
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/
      - name: OBPG — MODIS-Aqua R2022.0
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/aqua/
      - name: OBPG — MODIS-Terra R2022.0
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022/terra
  - from: MODIS 해색 R2022.0
    to: MODIS 해색 R2022.0.1~R2022.0.3 (부분 재처리)
    status: completed
    summary: >-
      궤도 표류 이후의 보정 문제를 고치기 위한 부분 재처리입니다. R2022.0.1은 2021-07-01 이후 Aqua 자료의 시간별 보정을 고쳤고, R2022.0.2는 2024년 8월 두 번째 요(yaw) 기동 뒤
      품질이 떨어진 Aqua를 NOAA-20 VIIRS에 교차 보정했으며 Terra는 Aqua에 교차 보정했습니다. 2026-10-13 확인 시 최신 Aqua 확정판 파일 속성은 R2022.0.3입니다.
    changes:
      - aspect: Aqua 보정 (R2022.0.1)
        before: R2022.0 보정
        after: "2021-07-01 이후 자료의 시간별 보정 수정(궤도 표류로 사막 기준지 관측 기하·태양 확산판 입사각이 바뀐 영향)"
      - aspect: Aqua 보정 (R2022.0.2)
        before: R2022.0.1
        after: "NOAA-20 VIIRS와 교차 보정(보정표 전환일 2022-01-01)"
      - aspect: Terra 보정
        before: R2022.0
        after: "R2022.0.1·0.2에서 Aqua와 교차 보정, 2021-07-01 이후 자료"
      - aspect: 최신 처리 버전
        before: R2022.0
        after: "Aqua 확정판 R2022.0.3(파일 속성), NRT는 R2022.0.2(2026-06 파일 속성)"
    impacts:
      - "2021-07 이후 구간은 부분 재처리마다 값이 바뀌었습니다. 예전에 받은 파일과 새로 받은 파일을 섞지 말고 processing_version 속성을 확인하세요."
      - 부분 재처리 뒤에도 OBPG는 2022년 이후 Aqua 해색을 장기 변화 분석에 쓰기 어렵다고 봅니다.
    sources:
      - name: OBPG — MODIS-Aqua R2022.0.1
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.1/aqua/
      - name: OBPG — MODIS-Aqua R2022.0.2
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.2/aqua/
      - name: OBPG — MODIS-Terra R2022.0.2
        url: https://oceancolor.gsfc.nasa.gov/data/reprocessing/r2022.0.2/terra
  - from: MODIS 해양 (Aqua·Terra, 해색 R2022.0·SST R2019.0)
    to: VIIRS 해양 (Suomi NPP·NOAA-20·NOAA-21)
    to_id: viirs-ocean
    status: planned
    summary: >-
      NASA는 Terra·Aqua 종료에 대비해 VIIRS 유사 산출물로 옮기라고 안내합니다. OBPG는 같은 처리 체계(l2gen·OCI 엽록소·GIOP)로 VIIRS 해색 L3를 만들며,
      심해역 전체 평균으로 VIIRS(Suomi NPP·NOAA-20)와 Aqua의 엽록소·Rrs 차이가 10% 안이라고 밝혔습니다. 다만 밴드 수·파장이 달라 형광·4 µm SST처럼 VIIRS에 없는 산출물이 있습니다.
    changes:
      - aspect: 원격 반사도 파장
        before: "10개(412·443·469·488·531·547·555·645·667·678 nm)"
        after: "5개(Suomi NPP 410·443·486·551·671, NOAA-20·21 411·445·489·556·667 nm)"
      - aspect: 형광·순간 PAR
        before: "`nflh`·`ipar`(FLH 파일)"
        after: 없음(L3 파일 목록에 FLH 없음)
      - aspect: 해수면온도
        before: "11 µm 주간(SST)·야간(NSST), 4 µm SST4 (R2019.0)"
        after: "SST·NSST·삼중창 SST3 `sst_triple`(Suomi NPP 2016.2, NOAA-20 2024.0). NOAA-21은 OB.DAAC SST 없음"
      - aspect: 통과 시각
        before: "Terra 10:30(오전)·Aqua 13:30(오후), 둘 다 표류"
        after: "세 위성 모두 오후 궤도(통과 시각 차 약 50분 이내). Terra 오전 관측을 잇는 VIIRS는 없음"
      - aspect: 기간
        before: "Terra 2000-02~ / Aqua 2002-07~"
        after: "Suomi NPP 2012-01~(2026-11-02 자료 전달 종료) / NOAA-20 2017-11~ / NOAA-21 2022-11~"
      - aspect: 파일 이름 접두
        before: "AQUA_MODIS·TERRA_MODIS"
        after: "SNPP_VIIRS·JPSS1_VIIRS(NOAA-20)·JPSS2_VIIRS(NOAA-21)"
    impacts:
      - "Rrs 파장이 달라 밴드별 값을 바로 이을 수 없습니다. 예로 NOAA-20 Rrs(667)는 Suomi NPP Rrs(671)와 약 20%, Aqua Rrs(667)와 약 16% 다르다고 OBPG가 보고했습니다."
      - "MODIS `nflh`(형광)와 SST4 시계열은 VIIRS에서 이어지지 않습니다. 형광은 PACE OCI를 검토하세요."
      - 겹치는 기간(2012년 이후)에 두 자료를 비교해 차이를 확인한 뒤 바꾸고, MODIS와 VIIRS를 한 시계열로 단순히 이어 붙이지 마세요.
