notices:
  - date: "2026-10-22"
    level: warning
    title: CDS 등 ECMWF 데이터 스토어 보호 조치 — 규칙에 어긋난 요청은 계정 일시 정지·비활성화
    body: >-
      ECMWF가 일부 공개 도메인에서 의심스럽고 과도한 이용을 발견해 CDS·ADS·EWDS·ECDS에 보호 조치를 적용했습니다. 이용 정책에 어긋난다고 판단되면 검토 동안 접근이 일시 정지되고,
      잘못된 요청을 반복하면 계정이 비활성화될 수 있습니다. 요청은 병렬·대량 대신 하나씩 차례로 보내고, 내려받기 양식과 같은 형식의 요청만 보내며, 프로필(거주 국가 등)을 정확히 하고
      가능하면 기관 이메일로 등록하라고 권고했습니다.
    source: https://forum.ecmwf.int/t/data-stores-service-protection-measures-affecting-data-downloads-and-account-access-cds-ads-ewds-ecds/15481
  - date: "2026-10-05"
    level: info
    title: CDS 이용약관 개정 (2026-10-28 시행)
    body: >-
      CDS 이용약관 제1조(제품·서비스 설명)가 2026년 10월 28일부터 바뀝니다. 별도 조치 없이 계속 쓰면 동의한 것으로 봅니다.
      동의하지 않으면 10월 27일까지 ECMWF 지원창구로 알려야 하며, 그 경우 Copernicus 제품 접근이 끊깁니다.
    source: https://forum.ecmwf.int/t/upcoming-cds-terms-of-use-change/15374
  - date: "2025-09-25"
    level: warning
    title: 1950~1978년 구간은 폐기된 ERA5 예비판(ERA5.P)으로 구동된 상태
    body: >-
      ECMWF는 ERA5-Land의 1979년 이전 구간이 ERA5 예비 확장판(ERA5.P)으로 만들어졌고 다시 계산되지 않았다고 확인했습니다.
      일부 해(1951·1961·1965년 등) 중앙아프리카·남미에서 최종 ERA5에 없는 고온·건조 이상치가 보고되었고,
      C3S 기후 아틀라스는 1978년 이전 ERA5-Land 추세를 제외했습니다. 재계산 계획은 발표되지 않았습니다.
    source: https://forum.ecmwf.int/t/era5-land-data-pre-1978-seems-to-be-derived-from-long-deprecated-and-removed-era5-p-data/14180
  - date: "2025-07-02"
    level: info
    title: 라이선스가 CC BY 4.0으로 변경
    body: 기존 "Licence to use Copernicus Products"가 CC BY 4.0으로 대체되었습니다. 출처 표시 의무는 유지됩니다.
    source: https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464
  - date: "2025-01-09"
    level: warning
    title: 2025년 1월 1~6일 ERA5-Land-T 품질 저하 (해결됨)
    body: >-
      ERA5T 생산 문제로 ERA5-Land-T 시간별 자료와 일 통계도 영향을 받았습니다. 2025-01-14에 교체가 끝났으며,
      그 전에 2025년 1월 1~6일 자료를 받았다면 다시 받아야 합니다. 월평균 자료는 영향 없음.
    source: https://forum.ecmwf.int/t/era5-data-from-1st-january-2025-was-degraded-and-is-being-corrected/10689
  - date: "2024-09-26"
    level: critical
    title: 구 CDS 종료 — 새 계정·API key 필요
    body: >-
      구(legacy) CDS가 폐쇄되고 신규 CDS로 전환되었습니다. 예전 자격 증명으로 보낸 API 요청은 모두 실패합니다.
      ECMWF 계정을 새로 만들고, pip install --upgrade cdsapi 후 .cdsapirc 의 url과 key를 갱신하세요.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380
  - date: "2024-04-02"
    level: critical
    title: 월평균 누적 변수 2022-09~2024-02 오류 — 교체되지 않음
    body: >-
      monthly averaged reanalysis의 모든 누적 변수(강수·증발·유출·복사·열속 등)가 2022년 9월~2024년 2월에 잘못 계산되었습니다.
      2024년 3월 이후 자료는 고쳐졌지만, 이 기간 값은 CDS와 MARS에서 교체하지 않는다고 공지되었습니다.
      대신 monthly averaged reanalysis by hour of day의 00:00 값을 쓰라고 안내합니다.
    source: https://forum.ecmwf.int/t/issue-affecting-era5-land-monthly-averaged-reanalysis-for-the-period-september-2022-to-february-2024/2370

