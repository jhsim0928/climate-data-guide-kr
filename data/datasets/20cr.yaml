# ─────────────────────────────────────────────────────────────
# 20CR (v3) — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: 20cr
name: 20CR (v3)
full_name: NOAA-CIRES-DOE Twentieth Century Reanalysis version 3 (미국 NOAA·CIRES·에너지부 20세기 재분석 3판)
category: reanalysis
domain: atmosphere
group: 장기(20세기)·관측 제한 재분석
order: 10
domains: [대기, 육지]
provider: NOAA PSL · 콜로라도대 CIRES · 미국 에너지부(DOE) (배포 NOAA PSL, NSF NCAR GDEX, NERSC)

status: ended
status_note: >-
  1836~2015년(실험 연장 1806~1835년)을 한 번 생산한 고정 기간 자료로, 2015년 이후로는 늘어나지 않습니다. PSL 20CR 페이지에도
  추가 연장이나 4판 계획은 2026-10-11 현재 안내되어 있지 않습니다. 19세기~20세기 초 대기 상태를 앙상블로 다루는 거의 유일한 자료라
  지금도 이 기간 연구의 표준 자료로 쓰입니다.

successor:
  name: "없음 (1940년 이후는 ERA5 권장)"
  url: https://psl.noaa.gov/data/20thC_Rean/
  note: >-
    20CR v3를 잇는 새 판은 공개되지 않았습니다. 지표기압만 동화하는 같은 전략의 다른 장기 재분석으로 ERA-20C·CERA-20C(1900~2010, 모두 종료)가 있어
    비교 자료로 쓸 수 있습니다. 1940년 이후 기간만 필요하다면 전체 관측을 동화한 ERA5가 더 정확합니다.

transitions:
  - from: 20CR v2c
    to: 20CR v3
    status: completed
    date: "2019"
    summary: >-
      3판은 2017년 가을 현업 GFS로 모델을 바꿔 해상도를 T62에서 T254로 높이고, 앙상블을 56개에서 80개로 늘렸으며, ISPD 4.7판으로 지표기압 관측을
      크게 보강했습니다. 적응형 공분산 팽창·국지화를 도입해 불확실성(앙상블 스프레드) 추정이 현실에 가까워졌고, 19세기 중반 해면기압 편향과
      강수 스핀업 문제가 줄었습니다. 기간도 1836년(실험적으로 1806년)까지 앞당겨졌습니다.
    changes:
      - aspect: 기간
        before: "1851 ~ 2014 (2013~2014년은 실험적 연장)"
        after: "1836 ~ 2015 (1806~1835년 실험적 연장, 2021년 공개)"
      - aspect: 예보 모델
        before: "2009년 무렵 NCEP GFS (T62, 28층)"
        after: "2017년 가을 현업 NCEP GFS v14.0.1 + Noah 지면 모델 + 2.5층 열역학 해빙 모델, 건조 공기 질량 고정"
      - aspect: 수평 해상도
        before: "T62 (약 1.9°), 분석 출력 2° × 2°"
        after: "T254 (약 0.7°, 512 × 256 가우시안), PSL은 약 75 km 격자로 소개"
      - aspect: 연직 층수
        before: "28층"
        after: "64층 (PSL 기압면 출력은 1000~1 hPa 28층)"
      - aspect: 앙상블 크기
        before: "56개"
        after: "80개"
      - aspect: 자료동화
        before: "앙상블 칼만 필터, 고정 공분산 국지화(4000 km)·고정 팽창, 디지털 필터 초기화"
        after: "앙상블 제곱근 필터 + 4D 증분 분석 갱신(4D-IAU), 적응형 국지화, 사전 스프레드 완화(RTPS) 방식의 적응형 팽창, 적응형 품질 관리"
      - aspect: 관측 입력
        before: "지표·해상 기압만, ISPD 3.2.9판"
        after: "지표·해상 기압만, ISPD 4.7판(ICOADS 3.0, IBTrACS, OldWeather·WeatherDetective 신규 디지털화 자료 포함). 1870년 이전 해상 기압은 기후값 기준 편향 보정"
      - aspect: 해수면온도·해빙 경계조건
        before: "SST: SODAsi.2 5일 평균(~2012), 2013년부터 일별 고해상도 혼합 분석 / 해빙: COBE-SST2"
        after: "SST: SODAsi.3 8멤버(~1980), HadISST2.2 8멤버(1981~2015) / 해빙: HadISST2.3"
      - aspect: 출력 시간 간격·형식
        before: "분석 6시간, GRIB1(NCAR) / netCDF(PSL)"
        after: "3시간(하루 8회), netCDF4. 변수 약어가 2·2c판과 다름(NERSC 안내)"
      - aspect: 알려진 문제 개선
        before: "19세기 중반 전지구 해면기압 저압 편향(1851~1865년 Maury 해상 관측 영향), 강수장 스핀업, 신뢰도(스프레드) 추정 부정확"
        after: "해면기압 편향과 인위적 추세 감소, 강수 스핀업 제거, 신뢰도 추정 개선, 폭풍 강도·허리케인 세기 재현 향상"
      - aspect: 남은 문제
        before: "—"
        after: "열대 강수의 계통적 편향, 남반구 고위도 기압장의 시기별 편향은 3판에도 남음(Slivinski et al. 2019)"
    impacts:
      - 2c판과 3판은 경계조건·관측·모델이 모두 달라 같은 해에도 값이 다릅니다. 판을 섞지 말고, 2c판으로 낸 결과를 3판으로 재현할 때는 기후값과 추세를 처음부터 다시 계산하세요.
      - 3판은 SST 입력이 1980/1981년 사이에 SODAsi.3에서 HadISST2.2로 바뀌고 파일도 SI(1806~1980)·MO(1981~2015) 폴더로 나뉩니다. 이 경계를 가로지르는 추세 분석에서는 불연속 가능성을 점검하세요.
      - "변수 약어와 폴더 구조가 바뀌어(예: 해면기압 `prmsl`, 3시간 누적 강수 `apcp`) 2c판용 스크립트를 그대로 쓸 수 없습니다."
      - 3판은 앙상블 스프레드이 더 믿을 만해졌으므로, 관측이 드문 19세기 결과를 해석할 때 앙상블 평균만 보지 말고 스프레드(spread) 파일로 불확실성을 함께 제시하세요.
    sources:
      - name: Slivinski et al. (2019), Towards a more reliable historical reanalysis — 20CRv3, QJRMS, 145, 2876–2908
        url: https://doi.org/10.1002/qj.3598
      - name: NSF NCAR GDEX — 20CR Version 3 (d131003)
        url: https://gdex.ucar.edu/datasets/d131003/
      - name: NSF NCAR GDEX — 20CR Version 2c (d131002)
        url: https://gdex.ucar.edu/datasets/d131002/
      - name: reanalyses.org — 20CRv3 system details (20CR 개발진 정리)
        url: https://reanalyses.org/node/3637
      - name: reanalyses.org — New 20CR DA system 발표 자료(기존 체계와 비교)
        url: https://reanalyses.org/sites/default/files/NCRTF/new20CRDA.pdf
      - name: NCAR Climate Data Guide — 20CR Version 2 and 2c
        url: https://climatedataguide.ucar.edu/climate-data/noaa-20th-century-reanalysis-version-2-and-2c
      - name: NOAA PSL 뉴스 — 20CR 3판 공개 예고 (2019-08-16)
        url: https://psl.noaa.gov/news/2019/081619.html

period:
  start: "1836-01"
  end: "2015-12"
  note: >-
    공개 기간은 1836년 1월 ~ 2015년 12월이며, 1806~1835년은 실험적 연장(2021년 공개)입니다. NCAR 메타데이터상 전체 범위는
    1805-12-31 18 UTC ~ 2016-01-01 00 UTC입니다. 관측이 드문 19세기 초는 불확실성이 매우 크니 앙상블 스프레드을 함께 보세요.

resolution:
  spatial_short: "75 km (0.7°)"
  temporal_short: "3시간"
  spatial: "모델 T254(약 0.7°, 512 × 256 가우시안, PSL 표기 약 75 km) / PSL 기압면 출력 1° × 1°(360 × 181)"
  vertical: "모델 64층 / PSL 기압면 28층(1000~1 hPa, 비습은 100 hPa까지)"
  temporal: 3시간(하루 8회), 일평균·월평균, 80개 멤버의 앙상블 평균과 스프레드
update: 종료 (고정 기간 자료)
license: PSL 자료는 이용 제한 없이 공개(출처 표기·논문 사본 송부 요청) / NCAR GDEX 사본은 CC BY 4.0
account_required: false

summary: >-
  지표·해상의 기압 관측만 동화하고 해수면온도·해빙은 경계조건으로 넣어 19세기 초부터 2015년까지 3시간 간격 대기 상태를 다시 만든 재분석입니다.
  관측 종류를 기압 하나로 고정해 위성·고층 관측 도입에 따른 인위적 변화를 피했고, 80개 앙상블로 시점마다 불확실성을 함께 제공합니다.
  과거 극한 기상 사례, 장기 순환 변동, 다른 재분석이 다루지 못하는 1940년 이전 기간 연구에 주로 쓰입니다.

time_convention:
  summary: >-
    20CR v3의 PSL 파일은 3시간 간격(하루 8회) 80개 멤버 앙상블 평균이며, 시각은 구간의 시작으로 정의됩니다(coordinate_defines 'start').
    00·06·12·18 UTC는 자료동화 분석값, 03·09·15·21 UTC는 분석에서 출발한 3시간 예보값으로 채워지고(원본 pgrbensmeananl / +3 파일),
    강수·열속·복사처럼 예보에서만 나오는 변수는 3시간 평균이나 누적입니다.
  points:
    - "원본 GRIB 표기: 분석은 'anl', 중간 시각은 '3 hour fcst', 플럭스는 '0-3 hour ave', 강수량·유출은 '0-3 hour acc', 최고·최저 기온은 '0-3 hour max/min'"
    - "`apcp`는 3시간 누적량(kg/m^2 = mm)이고, `lhtfl`·`dswrf` 등 플럭스는 3시간 평균 강도(W/m^2)입니다"
    - "PSL 파일 속성에는 평균 구간 정보(avg_period·cell_methods)가 없고 statistic이 모두 'Ensemble Mean'입니다. 평균/누적 여부는 long_name('3-hourly accumulated …')과 원본 GRIB 표기로 판단했습니다"
    - "누적·평균 구간이 표시 시각에서 시작하는지 끝나는지는 PSL 파일에 따로 적혀 있지 않습니다. 원본 GRIB는 예보 출발 시각부터 3시간 구간(0~3시간, 3~6시간)으로 표기합니다"
    - "spreads/ 폴더 값은 같은 시각의 앙상블 표준편차이며, Dailies·Monthlies는 3시간 값을 평균한 일·월평균입니다"
  source: https://reanalyses.org/task-forces/pgrbensmeananlyyyymmddhhplus3
  source_name: "20CR 개발진 제공 20CRv3 출력 파일 목록(reanalyses.org: pgrbensmeananl, +3, sflxgrbensmeanfg) + PSL netCDF 파일 속성"

variables:
  note: >-
    NOAA PSL netCDF 파일(OPeNDAP 속성) 기준 주요 변수입니다. 변수명은 파일 안의 이름이고, 괄호 앞에 PSL 폴더 이름을 적었습니다.
    폴더 이름 끝의 SI는 1806~1980년, MO는 1981~2015년 파일입니다(예: prsSI, prsMO). 스프레드 파일은 spreads/ 아래 같은 구조로 있습니다.
  full_list: https://psl.noaa.gov/thredds/catalog/Datasets/20thC_ReanV3/catalog.html
  groups:
    - name: 기압면 (prsSI·prsMO, 3시간, 1000~1 hPa)
      kind: instant
      items:
        - "기온 — `air` (degK)"
        - "지위고도 — `hgt` (m)"
        - "동서·남북 바람 — `uwnd`, `vwnd` (m/s)"
        - "비습(1000~100 hPa) — `shum` (kg/kg)"
    - name: 근지표 (2mSI·2mMO, 10mSI·10mMO)
      kind: instant
      items:
        - "2 m 기온 — `air` (degK, 파일 air.2m)"
        - "10 m 동서 바람 — `uwnd` (m/s, 파일 uwnd.10m)"
    - name: 단일면·연직 적분 (miscSI·miscMO)
      kind: instant
      items:
        - "평균 해면기압 — `prmsl` (Pa)"
        - text: "전운량(대기 전층) — `tcdc` (%, 파일 tcdc.eatm)"
          kind: mean
          period: 3시간
          note: "원본 GRIB에서 대기 전층 전운량은 '0-3 hour ave fcst'"
    - name: 누적·적설 (accumsSI·accumsMO, 3시간 누적)
      kind: accum
      period: 3시간
      items:
        - "총강수량 — `apcp` (kg/m^2)"
        - text: "적설 물당량 — `weasd` (kg/m^2)"
          kind: instant
          note: "폴더는 accums지만 상태량입니다. 원본 GRIB 표기 '3 hour fcst'(순간값)"
    - name: 지표 플럭스 (sfcFlxSI·sfcFlxMO)
      kind: mean
      period: 3시간
      items:
        - "잠열 순플럭스 — `lhtfl` (W/m^2)"
        - "지표 하향 단파복사 — `dswrf` (W/m^2, 파일 dswrf.sfc)"

access:
  - name: NOAA PSL — 20세기 재분석 프로젝트 페이지
    url: https://psl.noaa.gov/data/20thC_Rean/
    method: 안내·버전별 문서·그림 도구 연결
  - name: NOAA PSL 다운로드 서버 (20CR v3)
    url: https://downloads.psl.noaa.gov/Datasets/20thC_ReanV3/
    method: HTTPS 직접 다운로드
    note: 계정 없이 받을 수 있습니다. 변수·연도별 netCDF이며, 일평균은 Dailies/, 월평균은 Monthlies/, 앙상블 스프레드은 spreads/에 있습니다.
  - name: NOAA PSL THREDDS / OPeNDAP (20CR v3)
    url: https://psl.noaa.gov/thredds/catalog/Datasets/20thC_ReanV3/catalog.html
    method: OPeNDAP 원격 읽기
  - name: NSF NCAR GDEX — 20CR Version 3 (d131003)
    url: https://gdex.ucar.edu/datasets/d131003/
    method: 웹 다운로드 / 부분 추출
    note: 앙상블 평균·스프레드, netCDF4, 약 105 TB. 데이터셋 DOI 10.5065/H93G-WS83, CC BY 4.0.
  - name: NERSC 20C Reanalysis 포털 (멤버별 자료)
    url: https://portal.nersc.gov/project/20C_Reanalysis/
    method: 웹 다운로드 (일부는 HPSS 보관)
    note: 80개 멤버 각각의 분석·예보장이 필요할 때 씁니다. 변수·연도별 tar 묶음입니다.

example:
  lang: python
  note: 1981년 이후는 MO 폴더, 1980년 이전은 SI 폴더에 있습니다.
  code: |
    import xarray as xr

    base = "https://psl.noaa.gov/thredds/dodsC/Datasets/20thC_ReanV3"
    slp = xr.open_dataset(f"{base}/miscMO/prmsl.2014.nc")["prmsl"]   # Pa, 3시간 간격 앙상블 평균
    print(slp.sel(lat=37.5, lon=127.0, method="nearest").resample(time="1D").mean())

tips:
  - 같은 시점이라도 관측 밀도에 따라 신뢰도가 크게 다릅니다. 앙상블 평균만 쓰지 말고 spreads/ 폴더의 스프레드 값을 함께 확인해, 스프레드이 기후 변동 폭에 가까운 곳은 해석을 피하세요.
  - "SST 경계조건이 1980년까지는 SODAsi.3, 1981년부터는 HadISST2.2라서 PSL 폴더도 SI·MO로 나뉩니다. 1980/1981년을 넘나드는 분석은 두 폴더를 이어 읽어야 하며, 이 시점의 불연속 가능성을 점검하세요."
  - 3판은 2·2c판과 변수 약어가 다릅니다. NERSC 포털도 이 점을 따로 안내하고 있으니, 옛 스크립트를 쓸 때는 변수 이름부터 확인하세요.
  - 개발진 평가로는 열대 강수에 계통적 편향이 있고 남반구 고위도 기압장 편향이 시기에 따라 변합니다. 이 두 분야는 다른 장기 재분석(ERA-20C 등)과 비교해 결과를 확인하세요.

