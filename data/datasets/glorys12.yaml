notices:
  - date: "2026-04-28"
    level: info
    title: ARCO 데이터큐브에 보존 기간(retention) 적용 예정
    body: >-
      Copernicus Marine가 제품 설명서에 정해진 보존 기간을 일부 ARCO 데이터큐브에 적용한다고 알렸습니다.
      영향을 받는 데이터셋은 Subset 화면, Toolbox subset, MyOcean Viewer에서 시계열 시작일이 늦어질 수 있습니다.
      원본 파일(File Browser, copernicusmarine get)은 영향이 없습니다. 대상 제품 목록은 공지에 나와 있지 않습니다.
    source: https://marine.copernicus.eu/user-corner/user-notification-service
  - date: "2025-11"
    level: warning
    title: interim(myint) 데이터셋 폐지 — my 데이터셋으로 통합
    body: >-
      cmems_mod_glo_phy_myint_0.083deg_P1D-m 과 cmems_mod_glo_phy_myint_0.083deg_P1M-m 이 폐지되고,
      그 자료가 cmems_mod_glo_phy_my_0.083deg_P1D-m / _P1M-m 으로 옮겨졌습니다. myint ID를 쓰는 코드는 수정해야 합니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=GLOBAL_MULTIYEAR_PHY_001_030
  - date: "2025-07"
    level: warning
    title: Copernicus Marine Toolbox 1.x 지원 종료
    body: Toolbox 1.x(마지막 1.3.6)의 지원이 끝났습니다. 2.x로 업그레이드해야 하며, 2.4.0부터 Python 3.9 지원이 빠졌습니다.
    source: https://toolbox-docs.marine.copernicus.eu/en/stable/end-of-life.html
  - date: "2024-11"
    level: info
    title: interim 자료 매월 연장(M-1)으로 변경
    body: interim 자료가 매달 실시간 쪽으로 연장되도록 바뀌었습니다(당시 약 4개월 지연에서 단축).
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=GLOBAL_MULTIYEAR_PHY_001_030
  - date: "2023-11"
    level: info
    title: 2021~2022년 연장, interim 데이터셋 신설, 데이터셋 이름 변경
    body: >-
      정식 multi-year 자료가 2021년 6월까지 연장되고, 2021년 7월 이후는 매달 생산하는 interim 데이터셋으로 제공되기 시작했습니다.
      이때 여러 데이터셋의 이름도 바뀌었습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=GLOBAL_MULTIYEAR_PHY_001_030

