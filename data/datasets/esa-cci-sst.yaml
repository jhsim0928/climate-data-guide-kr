# ─────────────────────────────────────────────────────────────
# ESA SST CCI / C3S — 데이터셋 정보 파일
# 위성 기반 해수면온도 기후자료기록(CDR v3.0, 1980~2021) + 임시 연장(ICDR, 2022~)
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: esa-cci-sst
name: ESA SST CCI CDR v3
full_name: >-
  ESA Sea Surface Temperature Climate Change Initiative (SST_cci) Climate Data Record version 3.0 + Interim CDR
  (위성 전용 해수면온도 기후자료기록 — CEDA 배포, C3S "Global sea surface temperature derived from satellite observations")
category: satellite
domain: ocean
group: 해수면온도 분석장
order: 70
also_in:
  - domain: satellite
    group: 해수면온도
domains: [해양]
provider: >-
  ESA Climate Change Initiative SST 과제(CDR v3.0) / 영국 EOCIS·UKMCAS(2023년 이후 ICDR)·Copernicus Climate Change Service(2022년 ICDR, CDS 배포) /
  CEDA 보관. L4 분석은 Met Office OSTIA 시스템으로 생산

status: active
status_note: >-
  1980~2021년 기후자료기록(CDR v3.0)에 2022년 이후 임시 연장(ICDR)이 매일 붙고 있어 정상 제공 중입니다.
  CEDA에는 2024년 4월, C3S CDS에는 2025년 11월 28일, Copernicus Marine에는 2026년 3월 v3.0이 올라와 v2.1을 대체했습니다.
  Copernicus Marine판은 아직 2021년까지만 있으며, ICDR 연장분을 2026년 11월부터 넣을 계획이라고 공지했습니다(C3S 일정에 따라 바뀔 수 있음).

period:
  start: "1980-01"
  end: present
  note: >-
    L4 분석 CDR은 1980-01-01~2021-12-31이고 2022년부터는 ICDR입니다. C3S CDS 카탈로그의 시간 범위는 1979-07-13(L3C 일자료 시작)~2026-09-23(2026-10-12 확인)이며,
    수준·센서별 마지막 날짜는 따로 확인하지 못했습니다. ICDR 지연은 ESA 자료 페이지가 약 2주, CEDA 기록이 약 1개월로 적고 있습니다.
    1980-01~1981-09는 NOAA-06 AVHRR 하나뿐이라 관측이 드뭅니다.

resolution:
  spatial_short: "6 km (0.05°)"
  temporal_short: "1일"
  spatial: >-
    0.05° 정규 위경도 격자 7200×3600 (격자 중심 179.975°W~179.975°E, 89.975°S~89.975°N) — L3U·L3C·L4 공통.
    L2P는 위성 원래 화소(궤도 좌표)
  vertical: >-
    해면 단일값 — 피부(skin, 약 10 µm 깊이) SST와 20 cm 깊이로 맞춘 SST(depth SST, 표류 부이 관측과 비교 가능한 깊이)를 함께 제공. L4는 20 cm 깊이 SST만
  temporal: 일별(L4 일평균 분석, L3C 주간·야간 일별 묶음). C3S CDS에서는 월평균도 제공
coverage:
  short: 전지구
update: ICDR 매일 (현재보다 약 2주~1개월 지연). CDR 본체는 갱신 없음
license: >-
  CC BY 4.0 — CEDA 기록이 정한 인용 문구로 출처 표시 필수(ESA CCI SST 이용 조건 문서 별도).
  C3S CDS판은 SST CCI 데이터셋 라이선스와 CC BY 4.0, Copernicus Marine판은 Copernicus Marine 이용약관을 따릅니다
account_required: false

summary: >-
  ESA 기후변화 이니셔티브(CCI)가 만든 위성 전용 해수면온도 기후자료기록으로, AVHRR·ATSR·SLSTR 적외선 센서와 AMSR 마이크로파 관측을
  일관된 알고리즘으로 다시 처리했습니다. 선박·부이 관측을 넣지 않아 현장 관측으로 독립 검증할 수 있고, 모든 값에 불확실성 추정치가 붙습니다.
  피부 SST와 20 cm 깊이·일평균에 맞춘 SST를 제공하며, 0.05° 일별 빈칸 없는 L4 분석(1980년~)이 가장 많이 쓰입니다.
  v3.0(Embury et al. 2024)은 1980~2021년 CDR이고, 2022년 이후는 같은 방식의 ICDR로 매일 이어집니다.

time_convention:
  summary: >-
    L4는 20 cm 깊이 SST의 일평균 추정치이며 파일 날짜의 12:00 UTC로 표기합니다. L3C의 depth SST는 각 관측을 가장 가까운 지방 평균 태양시
    10:30 또는 22:30(일변화 편차가 거의 0인 시각)으로 맞춰 일평균에 가깝게 만든 값이고, 피부 SST는 관측 순간의 온도입니다.
  points:
    - "L3C·L4 일별 파일 이름의 시각은 120000(12:00 UTC)입니다. L3C에서는 하루 묶음 창의 중심, L4에서는 그날을 대표하는 시각 표시입니다."
    - "L3C는 주간(day)과 야간(night) 파일이 따로 있습니다. 피부 SST는 낮 시간 일변화(표층 가열)를 그대로 담고 있으므로 일평균으로 쓰려면 depth SST를 쓰세요."
    - "L4는 CCI 위성 SST를 OSTIA 시스템으로 분석해 빈칸을 통계적으로 채운 값입니다. 그날 위성 관측이 없던 칸은 채워 넣은 값이므로 analysed_sst_uncertainty를 함께 보세요."
    - "CDR(2021년까지)과 ICDR(2022년 이후)은 같은 v3 체계로 만들지만 ICDR은 지연 모드 연장분입니다. 두 구간 경계에서 장기 추세가 튀지 않는지 확인하세요."
  source: https://eu-west-1.climate.esa.int/documents/2568/SST_CCI_D4.2_PUG_v1.1.pdf
  source_name: SST CCI Product User Guide (SST_CCI_D4.2_PUG v1.1, CDR v3) / Embury et al. (2024)

variables:
  note: >-
    SST CCI 제품 사용자 안내서(PUG)와 Copernicus Marine 메타데이터의 파일 속 변수명입니다. 값은 정수로 압축 저장되어 있으므로
    add_offset·scale_factor가 적용되는지 확인하세요. 단위는 K입니다.
  full_list: https://eu-west-1.climate.esa.int/documents/2568/SST_CCI_D4.2_PUG_v1.1.pdf
  groups:
    - name: L4 분석 (일별, 빈칸 없음)
      kind: mean
      period: 일
      items:
        - text: "분석 해수면온도(20 cm 깊이) — `analysed_sst` (K)"
          note: 20 cm 깊이 SST의 일평균 추정치
        - text: "분석 오차 표준편차 — `analysed_sst_uncertainty` (K)"
          note: 같은 날 analysed_sst의 불확실성. L4는 불확실성이 하나뿐이라 오차 상관 성분을 나눌 수 없습니다
        - text: "해빙 면적 비율 — `sea_ice_fraction` (0~1)"
          note: OSI SAF 해빙 농도(OSI-450·OSI-430)를 입력으로 사용. 내부 시간 정의는 확인하지 못함
        - text: "해양·육지·호수·해빙 마스크 — `mask` (비트 플래그)"
          kind: static
          note: 해양 화소는 1. 해빙 비트는 날마다 바뀔 수 있음
    - name: L3C 위성별 일별 묶음 (빈칸 있음)
      items:
        - text: "피부 해수면온도 — `sea_surface_temperature` (K)"
          kind: instant
          note: 관측 시각의 피부(약 10 µm) 온도. 주간·야간 파일 분리
        - text: "20 cm 깊이 해수면온도 — `sea_surface_temperature_depth` (K)"
          kind: mean
          period: 일
          note: 관측 시각을 가장 가까운 10:30 또는 22:30 지방시로 맞춰 일평균에 가깝게 조정한 값
        - text: "총 불확실성 — `sea_surface_temperature_total_uncertainty`, `sea_surface_temperature_depth_total_uncertainty` (K)"
          kind: instant
          note: 각 SST 값에 딸린 불확실성. 구성 성분(uncertainty_random·uncertainty_correlated·uncertainty_systematic 등)을 제곱합으로 합친 값
        - text: "품질 등급 — `quality_level` (0~5)"
          kind: instant
          note: 4·5만 정량 분석에 쓰고 2·3은 정성적 용도로만
    - name: 기후값 (별도 제품)
      kind: mean
      period: 일 (1991~2020 평균)
      items:
        - text: "일별 SST 기후값 1991~2020 (0.05°) — Climatology product v3.0"
          note: CEDA 별도 데이터셋(DOI 10.5285/62800d3d2227449085b430b503d36b01). 특정 연도가 아닌 같은 날짜의 30년 평균

access:
  - name: CEDA Archive — L4 분석 v3.0 (ICDR 포함)
    url: https://catalogue.ceda.ac.uk/uuid/4a9654136a7148e39b7feb56f8bb02d2/
    login: false
    method: HTTPS 직접 다운로드 / OPeNDAP
    note: >-
      로그인 없이 받을 수 있는 공개 자료입니다. 자료 경로는
      https://data.ceda.ac.uk/neodc/eocis/data/global_and_regional/sea_surface_temperature/CDR_v3/Analysis/L4/v3.0.1/ 입니다.
      L3C·L3U·L2P는 같은 CDR_v3 폴더 아래 센서별(AVHRR, SLSTR 등)로 있습니다.
  - name: CEDA — SST CCI CDR v3.0 모음
    url: https://catalogue.ceda.ac.uk/uuid/debfbf49823f4eb99ab0a578f8b25136
    login: false
    method: 카탈로그 (수준·센서별 하위 기록)
  - name: C3S Climate Data Store (satellite-sea-surface-temperature)
    url: https://cds.climate.copernicus.eu/datasets/satellite-sea-surface-temperature
    method: 웹 다운로드 / CDS API(cdsapi)
    note: >-
      ECMWF 계정과 이용 조건 동의가 필요합니다. version 3_0, processinglevel level_4 또는 level_3c,
      sensor_on_satellite combined_product(L4) 또는 센서 이름, temporal_resolution daily/monthly를 고릅니다.
  - name: Copernicus Marine — SST_GLO_SST_L4_REP_OBSERVATIONS_010_024
    url: https://data.marine.copernicus.eu/product/SST_GLO_SST_L4_REP_OBSERVATIONS_010_024/description
    method: Copernicus Marine Toolbox / 웹 Subset
    note: >-
      데이터셋 ESACCI-GLO-SST-L4-REP-OBS-SST(product_version 3.0.1)가 L4 CDR v3를 1980-01-01~2021-12-31만 제공합니다.
      같은 제품의 C3S-GLO-SST-L4-REP-OBS-SST는 DMI가 만든 별개의 SST·해빙 표면온도 분석이므로 혼동하지 마세요.
  - name: ESA CCI Open Data Portal
    url: https://climate.esa.int/en/odp
    login: false
    method: 웹 / OPeNDAP 등
  - name: surftemp.net (재격자·시계열·지역 추출)
    url: https://surftemp.net/
    method: 웹 서비스
    note: PUG가 안내하는 재격자·지역 부분 추출 도구입니다.

example:
  lang: python
  note: "~/.cdsapirc 파일에 url(https://cds.climate.copernicus.eu/api)과 본인 API key를 넣고, CDS 웹에서 이 자료의 이용 조건에 동의한 뒤 실행합니다."
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()
    client.retrieve(
        "satellite-sea-surface-temperature",
        {
            "variable": "all",
            "processinglevel": "level_4",
            "sensor_on_satellite": "combined_product",
            "version": "3_0",
            "temporal_resolution": "daily",
            "year": ["2023"],
            "month": ["08"],
            "day": ["01", "02", "03"],
        },
        "sst_cci_l4_202308.zip",   # NetCDF 파일들이 zip으로 묶여 내려옵니다
    )

tips:
  - >-
    이 자료의 SST는 20 cm 깊이·일평균에 맞춘 값이라, foundation SST(OSTIA)나 일평균 bulk SST(OISST)와 정의가 조금씩 다릅니다.
    여러 SST 분석장을 비교할 때 깊이·시각 정의 차이를 먼저 확인하세요.
  - 선박·부이 관측을 넣지 않은 위성 전용 자료라 현장 관측과 비교하면 독립 검증이 됩니다. 현장 관측을 동화한 분석장(OISST·OSTIA 등)과 차이가 날 때 이 설계 차이를 먼저 떠올리세요.
  - "PUG는 1980-01~1981-09(NOAA-06 AVHRR 한 대, 관측 희소)와 1982-10~1983-09(AVHRR 잡음·보정 오류)를 주의 구간으로 꼽습니다. 이 구간을 기후값·추세 시작점으로 쓸 때 조심하세요."
  - "L3C로 직접 계산할 때는 quality_level 4·5만 쓰세요. 불확실성은 random·correlated·systematic 등 상관 특성이 다른 성분으로 나뉘어 있으므로, 격자 평균·시간 평균의 불확실성을 구할 때는 PUG 설명대로 성분별로 따로 다루세요."
  - Copernicus Marine판은 2021년까지라 최근 자료가 필요하면 CEDA나 CDS를 쓰세요. 예전 v2.1 파일(CEDA neodc/esacci/sst 경로, CDS version 2_1)과 v3.0을 한 시계열로 섞지 마세요.

