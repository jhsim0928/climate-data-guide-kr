notices:
  - date: "2026-11"
    level: info
    title: (예정) Copernicus Marine판에 ICDR 연장분 추가
    body: >-
      Copernicus Marine이 ESACCI-GLO-SST-L4-REP-OBS-SST 데이터셋에 C3S/UKMCAS ICDR v3(약 2~4주 지연)을 넣어 2022년 이후로 연장할 계획이라고 밝혔습니다.
      C3S가 자체 공개 일정을 관리하므로 2026년 11월 일정은 바뀔 수 있다고 덧붙였습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SST_GLO_SST_L4_REP_OBSERVATIONS_010_024
  - date: "2026-03"
    level: info
    title: Copernicus Marine에서 L4 CDR v3가 v2.1을 대체
    body: ESACCI-GLO-SST-L4-REP-OBS-SST 데이터셋이 다시 포함되면서 ESA CCI L4 CDR v3가 v2.1을 대체했습니다. 현재 1980~2021년만 있습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SST_GLO_SST_L4_REP_OBSERVATIONS_010_024
  - date: "2026-02-04"
    level: info
    title: CEDA AVHRR L3C v3.0 다운로드 복구
    body: CEDA가 2025년 말 일시적으로 받을 수 없던 AVHRR L3C v3.0 데이터셋이 복구되어 다시 내려받을 수 있다고 알렸습니다.
    source: https://catalogue.ceda.ac.uk/uuid/be418645dfa542df86165a7caad24284/
  - date: "2025-11-28"
    level: warning
    title: C3S CDS에 v3.0 공개
    body: >-
      CDS의 "Global sea surface temperature derived from satellite observations"에 v3.0이 올라왔습니다(요청 시 version 3_0 지정).
      2022년 ICDR은 C3S, 2023~2024년 ICDR은 영국 EOCIS·UKMCAS가 지원했습니다. 예전 2_1 요청 스크립트는 버전을 바꿔야 합니다.
    source: https://forum.ecmwf.int/t/new-version-3-0-of-global-sea-surface-temperature-daily-data-now-available-on-cds/14329
  - date: "2024-04-09"
    level: info
    title: CEDA에 CDR v3.0 L4 분석 공개
    body: SST CCI CDR v3.0 L4 분석(1980~2021)과 ICDR 연장분이 CEDA에 공개되어 v2.1을 대체했습니다. 자료 설명 논문은 Embury et al. (2024)입니다.
    source: https://catalogue.ceda.ac.uk/uuid/4a9654136a7148e39b7feb56f8bb02d2/

