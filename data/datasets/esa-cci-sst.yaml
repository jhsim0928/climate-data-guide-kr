transitions:
  - from: SST CCI CDR v2.1
    to: SST CCI CDR v3.0
    status: completed
    date: "2024-04"
    summary: >-
      CDR v3.0은 기간을 1980~2021년으로 늘리고 편향을 줄이는 새 산출 방법, 사막 먼지 처리 개선, 2016년 이후 SLSTR 이중 관측,
      초기 AVHRR/1, MetOp AVHRR 원해상도 자료를 넣은 버전입니다. CEDA(2024-04), C3S CDS(2025-11-28), Copernicus Marine(2026-03) 순으로 v2.1을 대체했습니다.
    changes:
      - aspect: 기간
        before: "1981~2016 (v2.1 CDR)"
        after: "1980~2021 (v3.0 CDR) + 2022년 이후 ICDR 매일 연장"
      - aspect: 산출 알고리즘
        before: v2.1 알고리즘
        after: 편향을 고려한(bias-aware) 산출로 계통 편향 감소, 사막 먼지 에어로졸 처리 개선
      - aspect: 입력 센서
        before: "AVHRR, ATSR, SLSTR 등 (v2.1 구성)"
        after: "SLSTR 이중 관측(2016~), 초기 AVHRR/1(1980년대), MetOp AVHRR 원해상도, AMSR L2P 추가"
      - aspect: 기후값 제품
        before: 이전 기후값 제품(v2.2)
        after: "Climatology product v3.0 — 1991~2020 일별 기후값(DOI 10.5285/62800d3d2227449085b430b503d36b01)"
      - aspect: CEDA 경로·DOI
        before: "neodc/esacci/sst/… (v2.1)"
        after: "neodc/eocis/data/global_and_regional/sea_surface_temperature/CDR_v3/… , L4 DOI 10.5285/4a9654136a7148e39b7feb56f8bb02d2"
      - aspect: C3S CDS
        before: "version 2_1 / 2_0 / 1_1"
        after: "version 3_0 (2025-11-28 공개)"
      - aspect: 자료 논문
        before: "Merchant et al. (2019), Sci. Data 6, 223"
        after: "Embury et al. (2024), Sci. Data 11, 326"
    impacts:
      - v2.1과 v3.0을 한 시계열에 섞지 말고 전체 기간을 v3.0으로 다시 받으세요. 특히 1980년대와 2016년 이후 값이 바뀌었을 수 있습니다.
      - 기후값 기준 기간을 1991~2020으로 쓰려면 v3.0 기후값 제품을 쓰세요.
      - 인용 DOI와 자료 논문이 바뀌었습니다.
    sources:
      - name: CEDA — SST CCI L4 Analysis v3.0
        url: https://catalogue.ceda.ac.uk/uuid/4a9654136a7148e39b7feb56f8bb02d2/
