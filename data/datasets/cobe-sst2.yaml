# ─────────────────────────────────────────────────────────────
# COBE-SST2 — 데이터셋 정보 파일
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: cobe-sst2
name: COBE-SST2
full_name: Centennial in situ Observation-Based Estimates of SST, version 2 (일본 기상청 장기 현장관측 기반 해수면온도 분석 2판)
category: analysis
domain: ocean
group: 관측 기반 분석장
order: 30
domains: [해양, 해빙]
provider: 일본 기상청 (JMA) / 기상연구소 (MRI)

status: active
status_note: >-
  JMA의 현업 장기 SST 분석으로 정상 갱신 중입니다(2021년 5월 COBE-SST를 대체). 후속 연구판인 COBE-SST3(0.25°, 일별)가
  2025년 논문으로 공개되었지만 1850~2020년 고정 기간 자료이고 아직 현업화되지 않았으므로, 최신 기간까지 필요하면 COBE-SST2를 쓰면 됩니다.
  다만 NOAA PSL이 배포하는 해빙 농도 파일은 2019년 12월에서 멈춰 있습니다.

transitions:
  - from: COBE-SST2
    to: COBE-SST3
    status: planned
    summary: >-
      COBE-SST 계열의 다음 판으로 2025년 논문과 함께 공개된 0.25° 일별 SST 분석입니다. 다만 현재는 1850~2020년만 있는 연구용 자료이고
      JMA 현업 자료는 여전히 COBE-SST2입니다. 개발자 안내(NCAR Climate Data Guide)에는 최근까지 연장해 현업화할 계획과
      준현업판 개발 중이라는 내용이 있으나, JMA가 COBE-SST2를 대체한다고 공식 발표하지는 않았습니다.
    changes:
      - aspect: 기간
        before: "1850-01 ~ 현재 (매월 갱신)"
        after: "1850 ~ 2020 (고정, 최근 연장은 계획 단계)"
      - aspect: 수평·시간 해상도
        before: "1°, 월평균 배포"
        after: "0.25°, 일별 (월평균도 제공)"
      - aspect: 현장 관측 입력
        before: "ICOADS Release 2.5"
        after: "ICOADS Release 3.0 (2015년 이후 JMA 현업 자료), Argo·CTD·XBT 등 표층 근처 수중 관측 추가"
      - aspect: 위성 자료
        before: "사용하지 않음"
        after: "기본판(COBE-SST3)은 현장 관측만 사용. 위성(AVHRR Pathfinder, AMSR-E, AMSR2, WindSat)을 섞은 COBE-SST3H(1982~2020) 별도"
      - aspect: 관측 편향 보정
        before: "버킷·ERI·종류 미상 관측 보정"
        after: "부이·Argo를 기준으로 6개 관측 유형 편향을 변분 최소화로 추정, 야간 해상 기온(HadNMAT2)·육상 기온과의 일관성 고려. 1940년대 초 급변이 완화됨"
      - aspect: 육상 기온과의 동시 분석
        before: "없음"
        after: "육상 기온 분석(COBE-LSAT3)과 함께 분석해 해양-육지 일관성 확보"
      - aspect: 불확실성
        before: "분석 오차 추정 제공 (Hirahara et al. 2014)"
        after: "300개 멤버 섭동 앙상블 제공"
      - aspect: 해빙역 SST
        before: "해빙 농도-SST 관계 + 기후 염분 기반 결빙 온도"
        after: "같은 결빙 온도 정의 유지, 해빙 가장자리에서 대리 SST를 섞는 방식. 1978년 이전 해빙은 Walsh et al. (2017)"
      - aspect: 배포처·형식
        before: "JMA NEAR-GOOS(텍스트 격자), NOAA PSL(NetCDF), MRI 서버(GRIB2)"
        after: "MRI 연구 자료 서버 NetCDF (climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/)"
    impacts:
      - 2021년 이후가 필요하면 COBE-SST3는 아직 쓸 수 없습니다. 최근 기간 분석은 COBE-SST2를 유지하세요.
      - 1940년대 전후 SST 변화가 COBE-SST2보다 완만하게 나오므로, 20세기 중반 추세나 장기 변동 분석 결과가 달라질 수 있습니다.
      - 해상도와 시간 간격이 달라 두 자료를 이어 붙이거나 그대로 차이를 내지 말고, 같은 격자·월평균으로 맞춘 뒤 비교하세요.
      - 논문 저자들은 COBE-SST3의 일별 값이 부이·Argo와 맞는 정도가 OISST v2.1보다 낫지는 않다고 밝혔습니다. 최근 일별 분석에는 OISST 등 위성 기반 자료를 함께 검토하세요.
    sources:
      - name: Ishii et al. (2025) COBE-SST3, J. Meteor. Soc. Japan
        url: https://doi.org/10.2151/jmsj.2025-002
      - name: NCAR Climate Data Guide — COBEv3 (개발자 안내 포함)
        url: https://climatedataguide.ucar.edu/climate-data/sst-data-cobev3-centennial-situ-observation-based-estimates-version-3
      - name: JMA TCC COBE-SST2 설명 페이지
        url: https://www.data.jma.go.jp/tcc/tcc/products/elnino/cobesst2_doc.html
      - name: MRI COBE-SST3 자료 서버
        url: https://climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/

period:
  start: "1850-01"
  end: present
  note: >-
    SST는 2026-10-11 확인 시 PSL 파일 기준 2026년 8~9월까지 들어 있습니다. JMA는 최근 달 값을 잠정치로 먼저 올리고 이후 확정치로 바꿉니다.
    PSL의 해빙 농도(icec) 파일은 1850년~2019년 12월까지만 있습니다.

resolution:
  spatial: "1° × 1° 위경도 격자 (89.5°S~89.5°N)"
  vertical: 해수면 단일층
  temporal: 월평균 (JMA 내부적으로는 일별 분석)

update: 매월 7일경 (잠정치 → 다음 달 7일에 교체)
license: JMA 웹사이트 이용약관(공공데이터 이용규약 1.0, CC BY 4.0 호환) — 출처 표시 필수
account_required: false

summary: >-
  일본 기상청(JMA)이 ICOADS 등 현장 관측을 바탕으로 만든 1850년부터의 전지구 월별 해수면온도 분석입니다.
  여러 시간 규모를 나눠 분석하는 방식(multi-time-scale analysis)과 개선된 관측 편향 보정을 사용하며,
  해빙 영역에서는 해빙 농도와 계절·해역별 결빙 온도를 이용해 SST를 추정합니다.
  HadISST, ERSST와 함께 장기 SST 비교 연구에 자주 쓰이는 세 자료 중 하나입니다.

time_convention:
  summary: >-
    배포되는 자료는 월평균입니다. JMA는 내부적으로 매일 분석을 수행하지만 공개 파일(JMA NEAR-GOOS, NOAA PSL)은
    그 달의 평균 해수면온도(PSL은 해빙 농도 월평균 포함)이며, 시간 값은 해당 월을 가리킵니다.
  points:
    - "NOAA PSL 파일(sst.mon.mean.nc)은 statistic을 'Mean', 평균 구간(avg_period)을 1개월로 표기합니다."
    - "JMA는 최근 달 값을 매월 7일경 잠정치로 올리고, 다음 달 7일에 확정치로 바꿉니다. 최근 1~2개월 값은 바뀔 수 있습니다."
    - "JMA 원본 텍스트 파일은 머리줄에 연·월만 있고 시각 정보가 없습니다. PSL 파일의 시간 값도 '해당 월'의 표시로만 쓰세요."
    - "기후값 파일(1981~2010, 1991~2020 월별 평년값)은 특정 연도가 아니라 같은 달의 다년 평균입니다."
  source: https://ds.data.jma.go.jp/goos/data/pub/JMA-product/cobe2_sst_glb_M/Readme_cobe2_sst_glb_M
  source_name: JMA NEAR-GOOS COBE-SST2 Readme / NOAA PSL 파일 메타데이터

variables:
  note: >-
    NOAA PSL NetCDF 파일 기준 변수명입니다. JMA NEAR-GOOS 원본은 0.1°C 단위 정수로 적힌 텍스트 격자 파일(육지 999)이고,
    MRI 서버 원본은 연도별 GRIB2 파일입니다.
  full_list: https://www.data.jma.go.jp/tcc/tcc/products/elnino/cobesst2_doc.html
  groups:
    - name: 해수면온도
      kind: mean
      period: 월
      items:
        - "월평균 해수면온도 — `sst` (°C)"
    - name: 해빙 (PSL, 2019년까지)
      kind: mean
      period: 월
      items:
        - "월평균 해빙 농도 — `icec` (비율, 0~1)"

access:
  - name: JMA NEAR-GOOS — COBE-SST2 월평균 SST
    url: https://ds.data.jma.go.jp/goos/data/rrtdb/jma-pro/cobe2_sst_glb_M.html
    method: 웹 다운로드 (월별 텍스트 격자 파일)
    note: 파일 형식은 같은 위치의 Readme(Readme_cobe2_sst_glb_M)에 설명되어 있습니다. 1991~2020년 월별 평년값·표준편차도 제공합니다.
  - name: NOAA PSL — COBE-SST2 (NetCDF)
    url: https://psl.noaa.gov/data/gridded/data.cobe2.html
    method: 웹 다운로드 / THREDDS / OPeNDAP
    note: >-
      전 기간 SST가 sst.mon.mean.nc 한 파일에 들어 있어 가장 쓰기 편합니다. 해빙 농도 icec.mon.mean.nc는 2019년 12월까지만 있고,
      기후값 파일(1981~2010, 1991~2020)도 있습니다.
  - name: MRI 연구 자료 서버 (연도별 GRIB2)
    url: https://climate.mri-jma.go.jp/pub/ocean/cobe-sst2/
    method: 웹 다운로드
    note: 기상연구소가 올리는 연도별 GRIB2 파일과 GrADS용 ctl 파일입니다. 1년 단위로 묶여 있어 올해 파일은 몇 달씩 늦게 갱신됩니다.

tips:
  - PSL 파일의 위도는 북→남(89.5 → -89.5) 순서입니다. 다른 자료와 겹쳐 쓸 때 위도 방향을 꼭 맞추세요.
  - COBE-SST2 해빙 농도는 PSL 기준 2019년에서 끝납니다. 최근 기간 해빙이 필요하면 OISST의 ice나 위성 해빙 농도 자료를 쓰세요.
  - COBE-SST3(0.25° 일별, 1850~2020년)는 MRI 서버(climate.mri-jma.go.jp/pub/archives/Ishii-et-al_COBE-SST3/)에 연구용으로 공개되어 있습니다. 과거 기간 고해상도 분석에는 검토해 볼 만하지만, 최근 기간이 없다는 점에 유의하세요.
  - 구판 COBE-SST(1891년~)는 2023년 5월로 끝났습니다. 예전 논문을 따라 할 때 어느 판을 썼는지 확인하세요.

