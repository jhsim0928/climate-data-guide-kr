transitions:
  - from: TerraClimate v1.0
    to: TerraClimate v1.1
    status: completed
    summary: >-
      단종된 JRA-55와 늦어지는 CRU 갱신 문제를 피하려고 시간 변동 입력을 ERA5 월 편차로 바꾸고, 기준 증발산·유출 계산식도 고친 판입니다.
      과거 값까지 모두 다시 계산되었으므로 v1.0 자료와 섞으면 안 됩니다. 공식 페이지는 v1.1 공개 공지를 2025-02-15로, 변경 내용 설명을 2026-02-15 갱신으로 적고 있습니다.
    changes:
      - aspect: 기온·강수·수증기압 입력
        before: "CRU TS4.0 월 편차 (관측소가 없는 곳은 JRA-55) + WorldClim 기후값"
        after: "ERA5 월 편차 + WorldClim v1.4·v2 기후값, VPD는 표준식으로 계산"
      - aspect: 일사·풍속 입력
        before: "JRA-55 (2018년 개정 때 JRA-55·JRA-55C·ERA-Interim 결합으로 편향 보정)"
        after: "ERA5 월 편차"
      - aspect: 기간
        before: "1958년~"
        after: "1950년~ (1950년은 spin-up 영향으로 제외 권장)"
      - aspect: 기준 증발산(pet)
        before: "ASCE Penman-Monteith"
        after: "CO2 증가에 따른 기공 저항 변화를 반영한 수정 Penman-Monteith (Yang et al., 2018)"
      - aspect: 유출(q)
        before: "그달 잉여수만 유출"
        after: "잉여수의 일부를 다음 달로 넘김(r-factor 0.5) — 관측 유량과 계절 변동이 더 잘 맞음"
      - aspect: 기후변화 시나리오
        before: "+2°C·+4°C, 가상 연도 1985–2015 (Qin et al., 2020)"
        after: "+2°C·+4°C를 CMIP6 다중모델 패턴 스케일링으로 갱신(가상 연도 1950–2025), 인위적 기후변화 신호를 뺀 counterfactual 추가"
      - aspect: 제공처
        before: "THREDDS·Earth Engine"
        after: "THREDDS는 v1.1로 교체, v1.0은 FTP(담당자 문의)로 이동. Earth Engine 카탈로그 설명은 v1.0 기준 그대로"
    impacts:
      - v1.0으로 만든 기후값·추세와 v1.1 결과를 섞지 말고 전 기간을 v1.1로 다시 받으세요.
      - 입력이 ERA5로 바뀌었으므로 ERA5와 비교·검증하는 연구는 두 자료가 독립적이지 않다는 점을 고려하세요.
      - Earth Engine 자료와 THREDDS 자료의 버전·기간이 다를 수 있으니 받은 곳을 논문에 밝히세요.
    sources:
      - name: TerraClimate (Climatology Lab) — v1.1 공지·변경 내용
        url: https://www.climatologylab.org/terraclimate.html
      - name: Abatzoglou et al. (2018), Scientific Data
        url: https://doi.org/10.1038/sdata.2017.191
      - name: Google Earth Engine IDAHO_EPSCOR/TERRACLIMATE
        url: https://developers.google.com/earth-engine/datasets/catalog/IDAHO_EPSCOR_TERRACLIMATE

notices:
  - date: "2026-02-15"
    level: warning
    title: TerraClimate v1.1 공개 — ERA5·WorldClim 기반으로 전면 재계산
    body: >-
      v1.1은 ERA5 월 편차와 WorldClim 기후값을 결합해 1950년부터 다시 만든 판으로, 해마다 갱신하기 쉽게 하려는 목적입니다.
      기준 증발산에 CO2 효과를, 유출에 월간 이월을 넣었고 시나리오 자료도 CMIP6 기반으로 바뀌었습니다. v1.0은 FTP로 옮겨졌으며 두 판을 섞지 말라고 안내합니다.
      공식 페이지는 공개 공지를 2025-02-15로, 변경 내용 설명을 '2026-02-15 갱신'으로 적고 있어 정확한 공개일은 분명하지 않습니다.
    source: https://www.climatologylab.org/terraclimate.html
  - date: "2021-02-01"
    level: info
    title: netCDF 라이브러리 갱신으로 원격 접근 오류 — '#fillmismatch'로 해결
    body: >-
      netCDF 소프트웨어 갱신 뒤 OPeNDAP 등 원격 접근에서 _FillValue 형식 불일치 오류가 날 수 있습니다.
      파일 주소 끝에 '#fillmismatch'를 붙이면 피할 수 있다고 안내합니다.
    source: https://www.climatologylab.org/terraclimate.html
  - date: "2019-08-01"
    level: info
    title: 파일 형식을 NetCDF4로 전환 — scale_factor·offset 적용 필요
    body: >-
      파일이 NetCDF4 형식으로 바뀌면서 값이 정수로 저장되고 scale_factor·add_offset 속성이 붙었습니다.
      직접 읽는 프로그램에서는 이 계수를 적용해야 실제 값이 됩니다.
    source: https://www.climatologylab.org/terraclimate.html

