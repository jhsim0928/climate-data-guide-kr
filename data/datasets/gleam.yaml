transitions:
  - from: GLEAM v3 (v3.8a 등)
    to: GLEAM4 (v4.1~4.2)
    status: completed
    date: "2024-07"
    summary: >-
      0.25°에서 0.1°로 해상도를 높이고, 잠재증발·차단 손실·증발 스트레스 계산을 새로 바꾸고, 식생의 지하수 이용을 넣은 4세대 판입니다.
      성분별 증발 비율이 크게 달라졌으므로(전지구 증산 비율 74% → 62%) v3 결과와 직접 비교하거나 이어 쓰면 안 됩니다.
    changes:
      - aspect: 수평 해상도
        before: "0.25°"
        after: "0.1° (1800 × 3600)"
      - aspect: 잠재 증발
        before: "Priestley–Taylor (복사 위주)"
        after: "Penman 식 — 바람·식생 높이·VPD(공기역학 항) 반영"
      - aspect: 차단 손실
        before: "키 큰 식생만"
        after: "van Dijk–Bruijnzeel 기반 모델, 위성 식생 자료로 제약, 키 큰·낮은 식생 따로 계산"
      - aspect: 증발 스트레스
        before: "토양수분·식생 광학 깊이(VOD) 공식"
        after: "에디 공분산·수액류 관측으로 학습한 심층 신경망(4.3에서 XGBoost로 교체)"
      - aspect: 지하수
        before: "없음"
        after: "선형 저수지 모델로 식생의 지하수 이용 반영"
      - aspect: 기간·묶음
        before: "v3a 1980–, v3b 2003–, v3c 2011– (v3 논문 기준)"
        after: "a 1980–, b 2003– (c 묶음 없음)"
      - aspect: 전지구 증산 비율
        before: "약 74%"
        after: "약 62%"
    impacts:
      - v3로 만든 기후값·추세를 GLEAM4와 섞지 마세요. 특히 증산·나지 증발 등 성분별 분석은 결과가 크게 달라집니다.
      - 해상도가 바뀌었으므로 격자 단위 비교 전에 같은 격자로 맞추세요.
    sources:
      - name: Miralles et al. (2025), GLEAM4, Scientific Data
        url: https://doi.org/10.1038/s41597-025-04610-y
      - name: Martens et al. (2017), GLEAM v3, Geoscientific Model Development
        url: https://doi.org/10.5194/gmd-10-1903-2017
      - name: GLEAM 공식 사이트
        url: https://www.gleam.eu/
  - from: GLEAM4.2 (4.2a·4.2b)
    to: GLEAM4.3 (4.3a·4.3b)
    status: completed
    summary: >-
      같은 GLEAM4 틀 안에서 증발 스트레스 학습 방식과 토양층 구성을 바꾸고 관개를 명시적으로 넣은 판입니다. 4.3이 나오면서 4.2는 서버에서 내려갔습니다.
    changes:
      - aspect: 증발 스트레스 모델
        before: "심층 신경망"
        after: "XGBoost, 학습 때 식물 이용 가능 수분(PAW)–스트레스 관계가 단조롭도록 제약"
      - aspect: 토양층
        before: "다층 물수지(층 두께는 논문에 명시되지 않음)"
        after: "1층 5 cm, 2층 95 cm로 설정"
      - aspect: 관개
        before: "없음"
        after: "관개 과정 명시적 반영 (관련 논문 심사 중)"
      - aspect: 제공 기간
        before: "4.2a 1980–2023(논문) → 2024까지 연장, 4.2b 2003–"
        after: "4.3a 1980–2024, 4.3b 2003–2025(2026-09-21 소식 기준)"
    impacts:
      - 4.2와 4.3을 한 시계열로 섞지 말고 전 기간을 4.3으로 다시 받으세요.
      - 관개 지역(예 북중국평원·인도 북부)에서는 4.3의 증발이 4.2보다 크게 달라질 수 있으니 지역 분석은 버전을 명시하세요.
    sources:
      - name: GLEAM 공식 사이트 (Datasets·News)
        url: https://www.gleam.eu/

notices:
  - date: "2026-09-21"
    level: info
    title: GLEAM4.3b 공개 (2025년 말까지)
    body: >-
      GLEAM4.3b가 서버에 올라왔으며 2025년 말까지를 0.1°로 제공한다고 알렸습니다. 다만 같은 페이지의 자료 설명은 4.3b 기간을
      2003-01-01~2024-12-31로 적고 있어, 받은 파일의 마지막 날짜를 확인하세요.
    source: https://www.gleam.eu/
  - date: "2024-07"
    level: info
    title: GLEAM4 공개 — 0.1° 해상도, 새 증발 스트레스·잠재증발 계산
    body: >-
      4세대 GLEAM이 공개되었습니다. 해상도가 0.1°로 높아지고 기록이 1980년부터 최근까지로 늘었으며, 하이브리드 학습 증발 스트레스,
      Penman 잠재증발, 지하수 이용 등이 새로 들어갔습니다. FAQ에 따르면 새 버전이 나오면 이전 버전은 서버에서 지워집니다.
    source: https://www.gleam.eu/

