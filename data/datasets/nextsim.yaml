# ─────────────────────────────────────────────────────────────
id: nextsim
name: neXtSIM
full_name: Arctic Ocean Sea Ice Reanalysis (ARCTIC_MULTIYEAR_PHY_ICE_002_016, neXtSIM-F; 노르웨이 NERSC의 neXtSIM 기반 북극 해빙 재분석)
category: reanalysis
domain: seaice
group: 재분석
order: 30
domains: [해빙]
provider: 노르웨이 난센 환경원격탐사센터(NERSC) — Copernicus Marine Service 북극 해역 센터(ARC MFC) / 배포 Copernicus Marine(Mercator Ocean International)

status: active
status_note: >-
  Copernicus Marine에서 정상 제공 중인 다년(MY) 재분석입니다. 2026-09-21 갱신으로 일자료가 2026-05-31, 월자료가 2026-05까지 늘어났습니다.
  다만 공식 문서(PUM·QUID)에 적힌 동화 입력 가운데 OSI SAF SSMIS 해빙 농도 연장판은 2025-10-17 중단되었고 AWI 병합 두께는 2025/26 겨울부터
  CS2SMOS에서 CS3SMOS로 바뀌었는데, 그 이후 구간에 어떤 입력을 썼는지는 2026-10-12 현재 공식 문서에서 확인되지 않습니다.

period:
  start: "1993-01"
  end: present
  note: >-
    Copernicus Marine 메타데이터(STAC) 기준 일자료 1993-01-01 ~ 2026-05-31(12,204일), 월자료 1993-01 ~ 2026-05(401개월)입니다(2026-09-21 자료 갱신).
    PUM은 기간을 "1993년 1월 ~ Y-1", 갱신을 "매년 11월(물리 재분석 ARCTIC_MULTIYEAR_PHY_002_003 갱신 뒤)"로, QUID는 "6개월마다 연장"으로 적고 있어 문서끼리 다릅니다.
    초기장은 TOPAZ4 재분석에 2년 스핀업을 더한 것입니다(PUM). 해빙 두께 동화는 2010년 10월 이후 겨울(10~4월)에만 들어갑니다.

resolution:
  spatial_short: "3 km (0.03°)"
  temporal_short: "1일"
  spatial: >-
    모델: neXtSIM-F(PUM 표기 "neXtSIM Lagrangian version 2023") 이동(라그랑주) 삼각 격자, 삼각형 한 변 약 10 km(PUM의 정사각 격자 환산 약 7 km),
    모델 영역은 베링 해협~래브라도해 50°N(태평양 쪽 제외). 제공: 모델 격자에서 3 km 극 평사도 격자로 쌍선형 보간
    (originalGrid 부분, x 2467 × y 2367, x −3,600,000 ~ 3,798,000 m, y −4,300,000 ~ 2,798,000 m, 간격 3,000 m,
    "+proj=stere +lat_0=90 +lat_ts=90 +lon_0=-45 +x_0=0 +y_0=0 +R=6378273 +ellps=sphere +units=m +no_defs", WGS 84 타원체 아닌 구면).
    Copernicus Marine 기본 데이터셋은 이를 다시 0.03° 위경도 격자(위도 49.98 ~ 90.03°N, 1336 × 12000)로 보간한 것입니다.
    제품 범위는 PUM 기준 63°N 이북과 결빙된 북대서양(QUID: 63°N 이북, 53°N까지 여유 영역)
  vertical: 해당 없음 (2차원 해빙·눈 변수만)
  temporal: 일평균(PUM 기준 12:00 UTC 중심)·월평균(월 중앙 중심), 1993–2022년 월 기후값 별도 데이터셋

coverage:
  short: 북극
  note: "63°N 이북과 결빙된 북대서양(태평양 쪽 제외)"
update: >-
  공식 갱신 주기는 문서마다 다릅니다(PUM 매년 11월, QUID 6개월마다, 제품 페이지 "Unknown"). 확인 시점의 최근 연장은 2026-09-21(자료 끝 2026-05-31)입니다.
license: Copernicus Marine Service 이용 약관(무료, 출처 표기·DOI 인용). 제품 메타데이터의 license 값은 "proprietary"
account_required: true

summary: >-
  노르웨이 NERSC가 단독 해빙 모델 neXtSIM-F로 만든 북극 해빙 재분석입니다. 해빙을 깨지기 쉬운 물질로 다루는 Brittle-Bingham-Maxwell(BBM) 유변학을
  유한요소법으로 이동(라그랑주) 삼각 격자에서 풀며, 대기 강제력은 ERA5(1시간), 해양 강제력은 TOPAZ4b 물리 재분석(ARCTIC_MULTIYEAR_PHY_002_003, 일)입니다.
  OSI SAF SSMIS 해빙 농도를 매일 동화하고, 2010년 10월부터는 겨울철(10~4월) CS2SMOS 두께도 동화합니다. 해빙 농도·두께·눈 두께·이동 속도뿐 아니라
  다년빙·신생빙 비율, 해빙 나이, 능선(ridge) 비율, 반사도까지 3 km 격자로 제공해 해빙 역학 연구에 쓰기 좋습니다.

time_convention:
  summary: >-
    모든 변수는 모델의 1시간 출력을 평균한 값입니다. 일자료는 그날 24시간 평균(PUM: 12:00 UTC 중심), 월자료는 그달 평균(월 중앙 중심)이며,
    순간값 데이터셋은 없습니다. 기후값 데이터셋은 1993–2022년 같은 달 월평균의 평균입니다.
  points:
    - "파일 메타데이터의 cell_methods가 \"time: mean (interval: 1 hours)\"로, 1시간 간격 모델 출력을 평균했다는 뜻입니다."
    - "원본 파일 시간 단위는 days since 1900-01-01 00:00:00입니다. Copernicus Marine 메타데이터(STAC)는 일자료 시간축을 1993-01-01T00:00:00Z부터 하루 간격, 월자료를 매달 1일로 표기하는데, 이는 그 날·그 달 전체의 평균을 가리킵니다."
    - "동화는 매일 이루어집니다(PUM 본문은 예보와 관측의 가중 함수로 넣는 자료 삽입(data insertion), PUM 표와 QUID는 nudging으로 표기). 일 단위 변화량(예: 두께 성장률)에는 모델 물리와 동화 보정이 함께 섞여 있습니다."
    - "CS2SMOS 두께는 7일 이동 창 자료를 10~4월에만 매일 넣습니다. 5~9월과 2010년 10월 이전 두께는 두께 관측으로 보정되지 않은 모델 값입니다."
    - "기후값 데이터셋(cmems_mod_arc_phy_my_3km-climatology_P1M-m)은 시간축이 2007-01 ~ 2007-12로 표기된 12개 달이며, 실제 의미는 climatology_bounds(1993-01-01 ~ 2023-01-01)로 적힌 1993–2022년 같은 달 평균입니다."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-016.pdf
  source_name: Copernicus Marine PUM (CMEMS-ARC-PUM-002-016, Issue 1.0, 2025-11) · QUID (CMEMS-ARC-QUID-002-016, Issue 1.0)

variables:
  note: >-
    Copernicus Marine 일자료 데이터셋(cmems_mod_arc_phy_my_nextsim_P1D-m_202411, originalGrid 포함) 메타데이터와 PUM의 변수표에서 확인한 이름입니다.
    월자료·기후값 데이터셋도 같은 10개 변수입니다. BBM 유변학의 핵심 상태 변수인 해빙 손상도(damage)와 변형률·응력은 이 제품에 들어 있지 않습니다.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-ARC-PUM-002-016.pdf
  groups:
    - name: 해빙·눈 상태
      kind: mean
      period: 일·월
      items:
        - "해빙 농도 — `siconc` (1)"
        - "해빙 두께 — `sithick` (m)"
        - "해빙 위 눈 두께 — `sisnthick` (m)"
        - text: "능선 얼음 부피 비율 — `si_ridge_ratio` (1)"
          note: 통계적 지표로, 개별 능선 정보는 담고 있지 않음(PUM)
    - name: 해빙 종류·나이
      kind: mean
      period: 일·월
      items:
        - text: "다년빙 면적 비율 — `siconc_my` (1)"
          note: 신생빙 비율과 CF standard_name(sea_ice_classification)이 같으니 변수 이름으로 구분
        - "신생빙 면적 비율 — `siconc_young` (1)"
        - text: "해빙 나이 — `siage` (years)"
          note: 부피 가중 평균 나이라 위성의 표면 기준 해빙 나이보다 대체로 작음. 2000년 무렵까지는 충분히 스핀업되지 않음(QUID)
    - name: 해빙 이동·반사도
      kind: mean
      period: 일·월
      items:
        - text: "해빙 속도 동서·남북 성분 — `vxsi`, `vysi` (m s-1)"
          note: 기본 위경도 데이터셋은 동향·북향 성분, originalGrid 원본은 극 평사도 격자의 x·y 성분(sea_ice_x/y_velocity)
        - text: "해빙 반사도 — `sialb` (1)"
          note: 6~7월에 약 0.1 높게 나옴(QUID — 사용한 모델 버전이 융해 연못을 표현하지 않기 때문일 수 있음)

