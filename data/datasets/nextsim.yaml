      (버전 태그 202411), 월 기후값 cmems_mod_arc_phy_my_3km-climatology_P1M-m(202511)입니다. 3 km 원본 극 평사도 격자는
      각 데이터셋의 originalGrid 부분으로 따로 받습니다.
