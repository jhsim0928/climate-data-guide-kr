example:
  lang: python
  note: >-
    pip install copernicusmarine 으로 설치하고 처음 한 번 login()으로 계정을 저장한 뒤 실행합니다. open_dataset은 기본 위경도(0.03°) 보간본을
    지연 로딩으로 엽니다. 원본 3 km 극 평사도 격자는 dataset_part="originalGrid"로 열고, 범위는 minimum_x 등으로 지정합니다(이 제품은 미터 단위).
  code: |
    import copernicusmarine

    # copernicusmarine.login()  # 처음 한 번만

    ds = copernicusmarine.open_dataset(
        dataset_id="cmems_mod_arc_phy_my_nextsim_P1D-m",
        variables=["siconc", "sithick", "sisnthick", "vxsi", "vysi"],
        minimum_latitude=70, maximum_latitude=90,
        minimum_longitude=-180, maximum_longitude=180,
        start_datetime="2024-03-01", end_datetime="2024-03-31",
    )

    # 3월 평균 두께 (일평균 값을 다시 평균)
    sit_mar = ds["sithick"].mean("time")

    # 해빙 속도 크기(m/s) — 기본 데이터셋은 동향·북향 성분
    speed = (ds["vxsi"] ** 2 + ds["vysi"] ** 2) ** 0.5
    print(float(speed.mean()))

    # 원본 3 km 극 평사도 격자 (x·y 단위 m, 속도는 격자 x·y 성분)
    ds_pol = copernicusmarine.open_dataset(
        dataset_id="cmems_mod_arc_phy_my_nextsim_P1D-m",
        dataset_part="originalGrid",
        variables=["sithick"],
        minimum_x=-1_500_000, maximum_x=1_500_000,
        minimum_y=-1_500_000, maximum_y=1_500_000,
        start_datetime="2024-03-01", end_datetime="2024-03-31",
    )

tips:
  - >-
    2010년 10월 이전과 매년 5~9월의 두께는 두께 관측이 동화되지 않은 모델 값입니다. QUID 검증에서 동화 기간의 CS2SMOS 대비 두께 RMSD는 0.28 m지만,
    PIOMAS와 비교하면 기록 초기 약 0.4 m 얇았다가 동화 기간에는 약 0.1 m 차이로 줄어듭니다. 1993년부터의 두께·부피 추세에는 동화 시작(2010-10)에 따른 불연속 가능성을 고려하세요.
  - >-
    기본 데이터셋(위경도 0.03°)과 subset 결과는 원본 극 평사도 격자를 다시 보간한 것이라 값이 조금 매끄러워지고 육지 마스크가 약간 넓어집니다(PUM).
    작은 규모 구조나 면적·부피 적분을 다룰 때는 originalGrid(3 km 등간격) 자료를 쓰세요. 3 km 격자도 모델 삼각 격자(약 10 km)를 보간한 것이라 실제 분해능은 그보다 거칩니다.
  - >-
    originalGrid 파일의 `vxsi`·`vysi`는 격자 x·y 방향 성분이라 동향·북향이 아닙니다. PUM에 cartopy로 벡터를 회전하는 Python 예시가 있습니다.
    좌표는 미터 단위이며, 투영이 구면(R=6378273 m)이라 WGS 84로 가정하면 위치가 어긋납니다.
  - >-
    동화 입력은 QUID 기준 OSI SAF SSMIS 해빙 농도(1993–2020 기후자료 CDR v3, 2021–2023 연장판 ICDR v3, C3S CDS에서 받음)와 AWI CS2SMOS(QUID 표기 "version 2.6")입니다.
    SSMIS 기반 연장판(OSI SAF OSI-430-a, release 3)은 2025-10-17 중단(suspended)되었고 AWI 병합 두께는 2025/26 겨울부터 CS3SMOS(v300)로 바뀌었으므로,
    2024년 이후 구간은 입력이 문서와 다를 수 있습니다. 최근 구간을 이전 기간과 이어 분석한다면 Copernicus Marine 서비스 데스크에 입력 자료를 확인하세요.
  - >-
    QUID에 따르면 해빙 농도는 위성보다 약 4~8% 높고, 다년빙 면적은 0.5~1백만 km² 과대, 결빙이 진행되는 10~12월 해빙 확장은 관측보다 느리며,
    이동 속도가 큰 사건은 크기를 다 잡지 못합니다(OSI SAF 24시간 이동 대비 궤적 오차 약 4.2 km). 해빙 나이는 1993년부터 쌓이므로 2000년 무렵까지 충분히 스핀업되지 않았습니다.
    같은 neXtSIM-F 체계의 실시간 예측 제품은 ARCTIC_ANALYSISFORECAST_PHY_ICE_002_011입니다.

