    Copernicus Marine 자료이므로 "This study has been conducted using E.U. Copernicus Marine Service Information; https://doi.org/10.48670/mds-00336"
    문장을 넣습니다. 제품 페이지는 정해진 인용문 대신 Copernicus Marine의 "How to cite" 도움말을 안내합니다.

notices:
  - date: "2026-09-21"
    level: info
    title: 일·월 자료 2026-05까지 연장
    body: >-
      Copernicus Marine 메타데이터 기준 일자료(cmems_mod_arc_phy_my_nextsim_P1D-m_202411)가 2026-05-31, 월자료가 2026-05까지 늘어났습니다
      (자료 갱신 시각 2026-09-21). 데이터셋 버전 태그(202411)는 그대로입니다.
    source: https://stac.marine.copernicus.eu/metadata/ARCTIC_MULTIYEAR_PHY_ICE_002_016/cmems_mod_arc_phy_my_nextsim_P1D-m_202411/dataset.stac.json
  - date: "2025-11-25"
    level: info
    title: 제품 설명서(PUM) Issue 1.0 공개와 메타데이터 갱신 — 월 기후값 데이터셋 목록에 포함
    body: >-
      PUM(CMEMS-ARC-PUM-002-016) Issue 1.0이 2025년 11월 승인되어 제품 문서에 올라왔고, 제품 메타데이터가 2025-11-25 갱신되었습니다.
      제품에는 1993–2022년 기준 월 기후값 데이터셋(cmems_mod_arc_phy_my_3km-climatology_P1M-m, 버전 태그 202511)이 함께 들어 있습니다.
    source: https://stac.marine.copernicus.eu/metadata/ARCTIC_MULTIYEAR_PHY_ICE_002_016/product.stac.json
  - date: "2025-10-17"
    level: warning
    title: 문서상 동화 입력(OSI SAF SSMIS 농도·CS2SMOS 두께)이 2025년에 교체됨 — 이후 입력은 미공개
    body: >-
      OSI SAF의 SSMIS 기반 해빙 농도 연장판(OSI-430-a)이 입력 자료 공백 때문에 2025-10-17 중단(suspended)되었고(대체는 AMSR2 기반 OSI-438),
      AWI의 병합 두께는 2025-10-23부터 CS2SMOS(v206)에서 CS3SMOS(v300)로 바뀌었습니다. 이 재분석의 PUM·QUID는 SSMIS 농도와 CS2SMOS 두께 동화만 설명하며,
      2026-05까지 연장된 최근 구간의 대체 입력은 공식 문서에서 확인되지 않습니다.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2024-11-26"
    level: info
    title: neXtSIM 해빙 재분석 첫 공개 (Copernicus Marine)
    body: >-
      ARCTIC_MULTIYEAR_PHY_ICE_002_016이 Copernicus Marine 카탈로그에 새로 공개되었습니다(일·월 데이터셋 공개일 2024-11-26, QUID Issue 1.0).
      첫 공개 당시 동화에 쓴 OSI SAF 연장판은 2021–2023년분이었습니다.
    source: https://data.marine.copernicus.eu/product/ARCTIC_MULTIYEAR_PHY_ICE_002_016/description

