notices:
  - date: "2025-11"
    level: warning
    title: GTSPP 서비스 중단으로 2025년 9월 일부·10월 예비 파일에 비Argo 자료 누락
    body: >-
      GTSPP 서비스가 일시 중단되어 2025년 9월 예비·확정 파일에는 GTSPP 자료가 일부만, 2025년 10월 예비 파일에는 전혀 들어가지 않았습니다.
      서비스는 재개되었고 Met Office가 상황을 지켜보고 있다고 안내했습니다. 공지 게시일은 페이지에 없어, 해당 파일이 공개된 시기(2025년 11월 무렵) 기준으로 적었습니다.
      이 기간 연안·선박 관측이 중요한 분석은 결과를 다시 확인하세요.
    source: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
  - date: "2024-11"
    level: info
    title: 2024년 9월 예비 파일에 태평양 GTSPP 자료 누락 — 확정 파일은 정상
    body: >-
      2024년 9월 예비(p) 파일은 처리 문제로 태평양의 GTSPP 자료 없이 만들어졌습니다. 2024년 11월에 공개된 2024년 9월 확정(f) 파일은 정상 입력(Argo·GTSPP)으로 만들어졌으므로
      예비 파일을 받았다면 확정 파일로 바꾸세요.
    source: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
  - date: "2024-01-29"
    level: warning
    title: 2023년 10~12월 자료 재처리 — 해당 기간 다시 받기 권장
    body: >-
      2023년 10~12월에 GTSPP 자료를 모두 받지 못해 파일이 불완전했고, 이후 새 자료를 넣어 재처리했습니다.
      2023-12-12~2024-01-29 사이에 이 기간 파일을 받았다면 다시 받으라고 안내되어 있습니다.
    source: https://www.metoffice.gov.uk/hadobs/en4/download-en4-2-2.html
  - date: "2021-08-25"
    level: info
    title: EN.4.2.2 — WOD18 입력이 2020년 말 이후 갱신되지 않음
    body: >-
      EN.4.2.2 사용자 안내서(2021-08-25 작성)에 따르면 World Ocean Database(WOD18)는 2020년 10월에 한 번만 받아 이후 갱신하지 않으므로,
      WOD 출처 관측은 2020년 말 이후 들어오지 않습니다. 같은 버전에서 Gouretski & Cheng (2020) MBT 보정 도입, c13·c14 판 추가,
      문제 있는 TAO 부이 8기(2015~2016년)·Argo 플로트 1기 제거가 함께 이루어졌습니다.
    source: https://www.metoffice.gov.uk/hadobs/en4/EN.4.2.2_Product_User_Guide_v1.0.pdf

