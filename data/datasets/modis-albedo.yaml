transitions:
  - from: MODIS MCD43 C6.1 (Terra+Aqua)
    to: VIIRS VNP43·VJ143 C2
    to_id: viirs-albedo
    status: planned
    date: "2026"
    summary: >-
      Terra·Aqua 종료에 대비해 NASA는 같은 알고리즘(RossThick/LiSparse-Reciprocal BRDF, 16일 창·9번째 날 가중)을 VIIRS 관측에 적용한
      VNP43(Suomi NPP)·VJ143(NOAA-20)·VJ243(NOAA-21) 제품을 MODIS 후속으로 내고 있습니다. 해상도·밴드·파일 형식·관측 시각이 달라 그대로 이어 붙일 수는 없습니다.
    changes:
      - aspect: 위성·센서
        before: "Terra(2000-02~)·Aqua(2002-07~) MODIS 두 위성 관측을 합쳐 한 제품(MCD43)"
        after: "Suomi NPP(VNP43, 2012-01~), NOAA-20(VJ143, 2018-01~), NOAA-21(VJ243, 2023-02~) VIIRS. 위성마다 따로 만든 별도 제품"
      - aspect: 관측 시각
        before: "오전(Terra) + 오후(Aqua) 관측 혼합"
        after: "오후 궤도 위성 하나의 관측만 사용. Terra 같은 오전 관측을 잇는 후속은 없음(LAADS 안내)"
      - aspect: 수평 해상도·밴드
        before: "500 m, MODIS 1~7번 밴드 + vis·nir·shortwave 광대역 / 0.05°·30 arc-second CMG"
        after: "500 m(I1~I3 영상 밴드, IA 제품) + 1 km(M1~M5, M7, M8, M10, M11 + vis·nir·shortwave, MA 제품) / 0.05°·30 arc-second CMG"
      - aspect: 변수 이름
        before: "`Albedo_WSA_Band1`~`Band7`, `Albedo_WSA_shortwave` 등"
        after: "`Albedo_WSA_M1`~`M11`, `Albedo_WSA_I1`~`I3`, 광대역은 `Albedo_WSA_shortwave`처럼 같은 이름. scale_factor 0.001은 같음"
      - aspect: 파일 형식
        before: "HDF-EOS2 (HDF4)"
        after: "HDF-EOS5 (HDF5)"
      - aspect: 알고리즘
        before: "16일 창, 9번째 날 가중, 전체/크기 역산"
        after: "같은 방식 (MODIS BRDF/알베도 제품군을 잇도록 설계)"
    impacts:
      - "MODIS와 VIIRS 알베도를 한 시계열로 이을 때는 겹치는 기간(2012년 이후)에 같은 지점·밴드끼리 차이를 먼저 확인하세요. 밴드 중심 파장이 달라 분광 알베도는 1:1로 대응하지 않고, 광대역(vis·nir·shortwave) 값끼리 비교하는 것이 안전합니다."
      - "MCD43은 오전·오후 관측을 합친 값이고 VIIRS 제품은 오후 위성 하나의 값입니다. 관측 수가 줄어 크기 역산 비율이 높아질 수 있으니 품질 플래그 분포를 함께 보세요."
      - "Suomi NPP 자료(VNP43) 전달은 2026년 11월 2일 끝납니다. 앞으로 이어 쓸 자료는 VJ143(NOAA-20)이나 VJ243(NOAA-21)입니다."
      - "HDF4용 코드(pyhdf 등)는 HDF5용(h5py·xarray)으로 바꿔야 합니다."
    sources:
      - name: Liu et al. (2017) — VIIRS BRDF/Albedo/NBAR 평가와 MODIS 장기 기록과의 연속성
        url: https://doi.org/10.1016/j.rse.2017.09.020
      - name: Román et al. (2024) — MODIS C6.1과 VIIRS C2 지면 제품의 연속성
        url: https://doi.org/10.1016/j.rse.2023.113963
      - name: NASA Earthdata — Transition from MODIS to VIIRS (2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: LAADS DAAC — MODIS To VIIRS Transition
        url: https://ladsweb.modaps.eosdis.nasa.gov/learn/modis-to-viirs-transition/
  - from: MCD43 Collection 6
    to: MCD43 Collection 6.1
    status: completed
    date: "2021-02"
    summary: >-
      Level 1B 보정 개선(반사 밴드 응답, Terra 적외 혼선 보정, 편광 보정)을 반영한 재처리판입니다. 알고리즘은 같고, 품질 플래그에 5·6번 밴드 결측 표시가 추가되었습니다.
      Collection 6.0은 2023년 7월 31일 LP DAAC 배포가 끝났습니다(MCD43GF 제외).
    changes:
      - aspect: 입력 보정
        before: "C6 Level 1B"
        after: "반사 밴드 주사각 응답(RVS) 처리 변경, Terra 적외 밴드 광학 혼선 보정, Terra 2012~2017년 보정표 수정, 반사 밴드 편광 보정"
      - aspect: 필수 품질 값
        before: "0 전체 역산 / 1 크기 역산"
        after: "0·1에 더해 2~7(5번·6번 밴드가 검출기 고장·잡음으로 채움값인 경우) 추가"
      - aspect: 제공
        before: "2023-07-31 배포 종료"
        after: "현재 판 (CMR 공개일 2021-02-22)"
    impacts:
      - C6과 C6.1을 섞지 말고 전 기간을 C6.1로 다시 받으세요.
      - "품질 값을 0/1로만 가정한 코드는 2~7을 처리하도록 고쳐야 합니다."
    sources:
      - name: LP DAAC MCD43A3 V061 제품 페이지 (Improvements/Changes)
        url: https://lpdaac.usgs.gov/products/mcd43a3v061/
      - name: MODIS Version 6.0 Land Data Products Decommissioned (Earthdata)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/modis-version-6-0-land-data-products-decommissioned

notices:
  - date: "2026-03-26"
    level: warning
    title: Terra MODIS 대기 모드 전환 — 2026년 3월 26~27일 자료 품질 불량
    body: >-
      3월 26일 약 20:00 UTC 위성 이상으로 Terra MODIS가 대기(standby) 모드로 들어갔다가 27일 과학 모드로 복귀했습니다.
      보정팀은 2026년 085일 20:00 UTC부터 086일 19:23 UTC까지의 자료를 의심·불량으로 표시했으므로, 이 기간이 16일 창에 들어간 MCD43 값은 품질을 확인하세요.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 권고 — Terra·Aqua 2026년 말~2027년 초 종료 예정
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초에 종료 절차에 들어가면 MODIS 자료 수집이 멈추고, 그 전에 마지막 재처리를 하겠다고 밝혔습니다.
      두 위성의 궤도 표류가 통과 시각과 자료에 영향을 준다며, 이용자에게 VIIRS 유사 제품으로 옮기라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2024-11-12"
    level: info
    title: MCD43GF V6.1(무적설 빈칸 채움 30 arc-second) 공개
    body: >-
      알베도·BRDF·NBAR의 빈칸을 채운 무적설 일자료 MCD43GF V6.1이 2013~2021년분부터 공개되었고, 나머지 기간은 차례로 추가됩니다.
      남은 기간이 나올 때까지 V6 MCD43GF도 계속 제공됩니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/gap-filled-modis-version-6-1-albedo-brdf-nbar-data-product-released
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 지면 제품 배포 종료(2023-07-31)
    body: >-
      LP DAAC이 Terra·Aqua·Terra+Aqua MODIS V6.0 지면 제품 배포를 끝냈습니다(MOD44W, MCD43GF 제외). V6.1로 옮겨야 합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/modis-version-6-0-land-data-products-decommissioned
  - date: "2023-07-07"
    level: info
    title: Terra·Aqua MODIS 야간 무인 운용(LOOps) 전환 — 관측 결손 증가 가능
    body: >-
      비행운영팀이 야간 12시간 상주 근무를 없애고, 위성 기록장치 재전송으로 결손을 메우는 작업도 하지 않게 되어 복구할 수 없는 자료 결손이 더 자주 생길 수 있습니다.
      그래도 전체 수집률은 임무 기준(95%)을 넘을 것으로 봅니다. 모든 MODIS V6.1 제품에 해당합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/modis-light-out-operations-potential-data-loss
  - date: "2021-11-10"
    level: warning
    title: Aqua 궤도 표류 — 통과 시각이 점점 늦어짐
    body: >-
      Aqua는 2021년 3월 마지막 궤도 유지 기동 뒤 7월부터 통과 시각이 늦어지기 시작해 2023년 2월 오후 1시 45분을 넘겼고, 2026년 8월 무렵 오후 3시 50분 안팎에 이를 것으로 예측되었습니다.
      제품은 대체로 과학 품질을 유지하지만 저고도로 격자 범위가 줄고 16일 반복 관측이 엄밀히 지켜지지 않습니다.
    source: https://lpdaac.usgs.gov/news/aqua-modis-acquisition-plan-through-august-2026/

