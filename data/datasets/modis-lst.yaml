transitions:
  - from: MODIS LST C6 (MOD11·MOD21)
    to: MODIS LST C6.1
    status: completed
    date: "2021-02"
    summary: >-
      MOD11의 과학 알고리즘·파일 형식은 그대로이고 입력 L1B 보정이 개선되었습니다. MOD21은 대기 보정 입력이 MERRA-2(일부 NCEP)에서 GEOS-5 FP로 바뀌고
      0.05° 전지구 격자(CMG) 제품 MxD21C1·C2·C3가 새로 생겼습니다. C6 자료는 2023-07-31 배포가 끝났습니다.
    changes:
      - aspect: 입력 L1B 보정
        before: C6 보정
        after: "반사 밴드 주사각 응답 방식 변경, Terra 적외 밴드 광학 혼선 보정, 2012~2017 Terra 순방향 LUT 수정, 편광 보정"
      - aspect: MOD11 알고리즘
        before: 일반화 분할창 (C6)
        after: 변경 없음 (형식도 동일)
      - aspect: MOD21 대기 입력
        before: MERRA-2 / NCEP 운영·준실시간 조합
        after: GEOS-5 FP (약 1/3°×1/4°, 3시간), 사용자 가이드상 품질 차이는 뚜렷하지 않음
      - aspect: MOD21 제품 구성
        before: L2·A1D·A1N·A2
        after: L2·A1D·A1N·A2 + 0.05° CMG 일·8일·월(MxD21C1·C2·C3) 추가
    impacts:
      - C6과 C6.1을 섞지 말고 전 기간을 C6.1로 다시 받으세요(C6은 2023-07-31 이후 배포되지 않습니다).
    sources:
      - name: MOD21A1D V061 컬렉션 설명 (버전 설명)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mod21a1d-061
      - name: MOD11 C6.1 User's Guide
        url: https://lpdaac.usgs.gov/documents/715/MOD11_User_Guide_V61.pdf
      - name: MOD21 C6.1 User's Guide
        url: https://lpdaac.usgs.gov/documents/1398/MOD21_User_Guide_V61.pdf
  - from: MODIS LST MOD11·MOD21 C6.1
    to: VIIRS LST VNP21·VJ121·VJ221 V2
    to_id: viirs-lst
    status: planned
    summary: >-
      NASA의 VIIRS 지표면온도는 MOD21과 같은 TES 알고리즘·입력으로 만든 VNP21(Suomi NPP)·VJ121(NOAA-20)·VJ221(NOAA-21) V2이며, 개발진은 MODIS(MxD21)와 VIIRS LST가
      약 ±0.5 K 안에서 일치한다고 보고했습니다. MOD11 분할창 방식을 잇는 NASA VIIRS 제품은 없으므로, MOD11 사용자는 알고리즘 차이까지 함께 바뀝니다.
      Terra·Aqua가 2026년 말 이후 종료되면 전환이 완료됩니다.
    changes:
      - aspect: 알고리즘
        before: "MOD11·MYD11 분할창(방출률 가정) / MOD21·MYD21 TES"
        after: "TES만 (VNP21·VJ121·VJ221, MOD21과 같은 방식·입력)"
      - aspect: 열적외 밴드
        before: "MODIS 밴드 29(8.55 µm)·31(11 µm)·32(12 µm)"
        after: "VIIRS M14(8.55 µm)·M15(10.76 µm)·M16(12 µm)"
      - aspect: 해상도
        before: "L2 직하 1 km → L3 1 km SIN / 0.05° CMG"
        after: "L2 750 m → L3 1 km SIN(750 m에서 재표본) / 0.05° CMG"
      - aspect: 통과 시각
        before: "Terra 10:30 하강, Aqua 13:30 상승 (2020~2021년 이후 표류)"
        after: "13:30 상승 (Suomi NPP·NOAA-20·NOAA-21 모두 오후 궤도). Terra 같은 오전 궤도를 잇는 VIIRS는 없음"
      - aspect: 기간
        before: "Terra 2000-02~ / Aqua 2002-07~"
        after: "Suomi NPP 2012-01-17~(2026-11 초 전달 종료) / NOAA-20 2018-01-01~ / NOAA-21 2023-02-10~"
      - aspect: 일자료 구성·변수 이름
        before: "MOD11A1: 주간·야간 한 파일(`LST_Day_1km`·`LST_Night_1km`) / MOD21A1D·A1N: 주야 별도 파일(`LST_1KM`)"
        after: "VNP21A1D·A1N: 주야 별도 파일(`LST_1KM`), 방출률 `Emis_14`·`Emis_15`·`Emis_16`"
      - aspect: 파일 형식
        before: HDF-EOS2 (HDF4)
        after: HDF-EOS5 (HDF5)
    impacts:
      - MOD11(분할창) 시계열을 VIIRS로 이어 붙이면 알고리즘 차이(건조지 3~5 K 편향 등)가 불연속으로 나타납니다. 이어 붙일 때는 MOD21(TES)과 VIIRS를 겹치는 기간에 비교하세요.
      - Terra(오전) 시계열을 이을 VIIRS 관측은 없습니다. Aqua(오후)를 VIIRS로 잇더라도 Aqua 궤도 표류 구간(2021년 이후)과 VIIRS의 13:30 관측은 시각이 다릅니다.
      - VIIRS 위성끼리도 통과 시각이 50분~1시간 달라 여름철 약 0.5 K 차이가 보고되었습니다(VNP21 사용자 가이드).
    sources:
      - name: Hulley et al. (2018), IEEE JSTARS — MODIS·VIIRS LST 일관성
        url: https://doi.org/10.1109/JSTARS.2017.2779330
      - name: VNP21 Collection 2 User's Guide
        url: https://lpdaac.usgs.gov/documents/1662/VNP21_User_Guide_V2.pdf
      - name: Transition from MODIS to VIIRS (Earthdata, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS 대기 모드 전환 — 2026-03-26~27 일부 자료 의심·불량 표시
    body: >-
      Terra 위성 이상으로 2026년 3월 26일 20:00 UTC경 MODIS가 대기(standby) 모드로 바뀌었다가 27일 과학 모드로 돌아왔습니다. 보정팀은 3월 26일(DOY 085) 20:00 UTC부터
      흑체 온도가 정상으로 돌아온 27일(DOY 086) 19:23 UTC까지의 자료를 의심 또는 불량으로 표시했고, 그 이후 자료는 써도 된다고 밝혔습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: NASA, Terra 과학 운용 종료를 2027년 2월·Aqua를 2027년 9월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월,
      Aura는 2028년 8월에 과학 운용이 끝날 것으로 전망하며, 그때까지는 운용을 계속한다고 밝혔습니다. 이전 계획(Terra 2025년 12월, Aqua 2026년 8월 종료)보다 늦춰진 일정입니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-03-18"
    level: info
    title: MODIS L1B·지오로케이션 Version 7.0 공개 — 지면 산출물은 아직 C6.1
    body: >-
      LAADS DAAC가 MODIS 보정 복사량·지오로케이션 V7.0을 공개하고 V6.1 L1 자료는 2026-09-30 이후 내린다고 공지했습니다. 2026-10-13 확인 시
      MOD11·MOD21 지면 산출물은 CMR에 V061만 있으며, C7 지면 산출물의 공개 일정은 공식 공지로 확인되지 않았습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2026-01-08"
    level: warning
    title: Terra·Aqua 궤도 표류가 MODIS 자료에 미치는 영향 조사 중 (LDOPE)
    body: >-
      MODIS 지면 품질평가팀(LDOPE)은 Terra·Aqua가 궤도 유지 기동을 멈춘 뒤 표류하면서 화소 크기·간격, 주사 간격(scan gap), 보타이 중첩, 일주기 표본 시각이 달라졌고,
      2024년 말부터 영향이 크게 나타났다며 MODIS 산출물 전반에 대한 영향을 조사 중이라고 밝혔습니다. 일주기 표본 시각 변화는 지표면온도에 직접 영향을 줍니다.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: info
    title: LP DAAC Data Pool의 MODIS 배포 종료(2025-06-30) — Earthdata Cloud로 전환
    body: >-
      LP DAAC는 C6.1을 포함한 모든 MODIS 자료의 Data Pool 배포를 2025년 6월 30일에 끝냈습니다. Data Pool 주소를 쓰던 스크립트는 Earthdata Cloud(HTTPS·earthaccess)로 바꿔야 하며,
      Earthdata Search와 AppEEARS는 그대로 쓸 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 시작
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어가며, 두 위성이 설계 궤도를 벗어나 통과 시각이 바뀌고 있어 자료에 영향을 줄 수 있다고 공지했습니다.
      MODIS 자료 수집이 멈추면 마지막 재처리를 하며, 사용자는 VIIRS 유사 산출물을 검토하라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2024-01-16"
    level: warning
    title: Aqua MYD21 지표면온도 고온 편향 — 밴드 29 밝기온도 표류(2018년 이후)
    body: >-
      LDOPE는 Aqua MODIS 밴드 29 밝기온도가 장파 적외 밴드 간 전자 혼선 증가로 2018년부터 크게 올라가, C6.1 Aqua TES 지표면온도(MYD21)가 예상보다 높게 나온다고 공지했습니다.
      보정팀의 혼선 보정을 시험 중이며 확인되면 forward 생산에 넣을 예정이고, 2018년 이후 재처리 여부는 정해지지 않았습니다.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=220
  - date: "2023-07-25"
    level: info
    title: MODIS V6.0 지면 산출물 배포 종료(2023-07-31) — V6.1로 전환
    body: >-
      LP DAAC는 2023년 7월 31일 MOD11·MOD21을 포함한 MODIS V6.0 지면 산출물의 배포를 끝냈습니다. 사용자 가이드·ATBD는 DOI 페이지에 남아 있고, 자료는 V6.1을 쓰면 됩니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

