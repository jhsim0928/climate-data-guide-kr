notices:
  - date: "2026-09-20"
    level: warning
    title: CHIRPS v2.0 생산 2026년 12월 이후 종료 예정 — v3로 전환 권고
    body: >-
      CHC는 CHIRPS v2 생산이 2026년 12월 이후 끝난다고 밝히고, 업무 연속성을 위해 v3로 옮기라고 권합니다. v2 자료로 감시·예측 체계를 돌리고 있다면
      2027년 전에 v3 경로·Earth Engine ID로 바꾸세요. CHIRPS v2 페이지의 안내문에는 게시일이 없어, CHC가 CHIRPS FAQ에 v2 생산 변경 안내(2026년까지 병행 생산)를 추가한 날(2026-09-20, 위키 수정 기록)을 날짜로 적었습니다.
    source: https://www.chc.ucsb.edu/data/chirps
  - date: "2026-06-10"
    level: info
    title: CHIRPS3 공개 발표 — Scientific Data 논문 게재
    body: >-
      CHC가 'CHIRPS3 자료를 모두가 쓸 수 있게 되었다'고 발표했습니다. 개선 내용은 2026년 4월 11일 Scientific Data에 실린 자료 기술 논문(Funk et al., 2026)에 정리되어 있습니다.
    source: https://www.chc.ucsb.edu/news/announcement/534
  - date: "2025-01"
    level: info
    title: CHIRPS v3 공개 — v2는 2026년까지 병행 생산
    body: >-
      CHIRPS FAQ에 따르면 2025년 1월부터 CHIRPS v3를 공개적으로 쓸 수 있고, 전환 기간 동안 v2 생산을 2026년까지 함께 이어 갑니다. v3 자료 DOI(10.15780/G2JQ0P)도 2025년 1월 등록되었습니다.
    source: https://wiki.chc.ucsb.edu/CHIRPS_FAQ

