  - name: CHC 자료 저장소 (CHIRPS v3.0)
    url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/
    method: HTTPS 다운로드 (계정 없음)
    note: >-
      반순·순·일·월·다개월 폴더와 아프리카·라틴아메리카·전지구 영역으로 나뉩니다. 일자료 설명은 daily/readme.txt, 관측소 출처 목록은 README-CHIRPSv3.0.txt에 있습니다.
  - name: Google Earth Engine
    url: https://developers.google.com/earth-engine/datasets/catalog/UCSB-CHC_CHIRPS_V3_PENTAD
    method: 클라우드 분석 (UCSB-CHC/CHIRPS/V3/PENTAD, DAILY_RNL, DAILY_SAT)
    note: v2는 UCSB-CHG/CHIRPS/DAILY·PENTAD입니다. 2026-10-13 확인 시 v3 반순은 2026-08-26, 일자료는 2026-08-31까지입니다.
  - name: USGS·CHC Early Warning Explorer (EWX)
    url: https://ewx3.chc.ucsb.edu/ewx/index.html
    method: 웹 지도·시계열 보기
  - name: CHC 자료 저장소 (CHIRPS v2.0, 2026년까지)
    url: https://data.chc.ucsb.edu/products/CHIRPS-2.0/
    method: HTTPS 다운로드
    note: 50°S–50°N 판입니다. 2026년 12월 이후 생산이 끝나므로 새 작업은 v3로 시작하세요.

example:
  lang: python
  note: >-
    Google Earth Engine 파이썬 API로 CHIRPS v3 일자료(IMERG 분해판)에서 2023년 7월 한반도 영역 월강수량을 계산하는 예입니다. Earth Engine 계정과
    클라우드 프로젝트가 필요하며 처음에는 ee.Authenticate()를 실행합니다. 프로젝트 이름은 자신의 것으로 바꾸세요.
  code: |
    import ee

    ee.Initialize(project="my-gee-project")   # 자신의 클라우드 프로젝트 이름

    col = (ee.ImageCollection("UCSB-CHC/CHIRPS/V3/DAILY_SAT")   # ERA5 분해판은 DAILY_RNL
           .filterDate("2023-07-01", "2023-08-01")
           .select("precipitation"))                            # mm/d
    total = col.sum()                                           # 7월 합계 (mm)

    korea = ee.Geometry.Rectangle([124, 33, 132, 39])
    stat = total.reduceRegion(ee.Reducer.mean(), korea, scale=5566)
    print(stat.getInfo())   # 바다 쪽은 관측소 없이 위성 추정만 들어간 값입니다

tips:
  - "v3는 우량계 포착 손실 보정(Legates-Willmott) 때문에 대부분 지역에서 v2보다 조금 더 습합니다. v2와 v3를 한 시계열로 이어 붙이지 말고, 관측소와 비교할 때는 CHC 권고대로 같은 보정을 한 관측값을 쓰세요."
  - "CHIRPS는 반순·월 자료가 기본입니다. 일자료는 ERA5나 IMERG의 일 분포를 빌려 나눈 값이라 일 단위 극한·강수일수 분석에는 한계가 큽니다."
  - "1981~2022년 적외 공백은 ERA5 강수로 메웠고(1980년대 육지의 약 20%), 2023년 이후 적외 결측은 -9999로 남깁니다. fill map으로 메운 위치를 확인하세요."
  - "중앙아프리카·중앙아시아는 ERA5 관련 편향이 최대 약 30%까지 있어 그 지역의 10년 변동·추세는 불확실하다고 논문이 밝힙니다. 관측소망도 모든 자료원에서 해마다 줄고 있습니다."
  - "관측소 자료가 섞이는 것은 육지뿐입니다. 해양 값은 위성 추정만으로 만든 것이니 해양 강수 연구에는 적합하지 않습니다."
  - "적외(찬 구름 지속시간) 기반이라 지형성 강수나 따뜻한 구름 강수, 겨울 강설은 잘 잡지 못할 수 있습니다. 한반도처럼 관측망이 조밀한 곳은 기상청 격자 자료와 먼저 비교해 보세요."
  - "예비판과 확정판을 섞어 쓰면 최근 몇 달의 값이 나중에 바뀝니다. 논문에는 확정판을 쓰고, 예비판을 썼다면 밝히세요."

