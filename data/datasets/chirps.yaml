transitions:
  - from: CHIRPS v2.0
    to: CHIRPS v3.0
    status: completed
    date: "2025-01"
    summary: >-
      2025년 1월 v3.0이 공개되어 v2.0을 대체했습니다. 적외 알고리즘·기후값·관측소 수·우량계 보정·공간 범위가 모두 바뀌었고, v2.0은 2026년 말까지만 함께 만듭니다.
    changes:
      - aspect: 공간 범위
        before: "50°S–50°N"
        after: "60°S–60°N (아프리카·라틴아메리카 영역 파일 별도)"
      - aspect: 위성 추정 알고리즘
        before: "CHIRP2 — 절편 항이 분산을 흡수하는 적외 회귀"
        after: "CHIRP3 — 찬 구름 지속시간(235 K 미만 시간)에 기후값 기반 기울기를 곱하는 분산 보존 방식, 1981~2000년은 GridSat-B1, 적외 공백은 ERA5로 채움"
      - aspect: 기후값
        before: "CHPclim v1"
        after: "CHPclim v2 (1991–2020, IMERG v6 Final과 포착 손실 보정 관측소 평년값 사용)"
      - aspect: 관측소
        before: "약 11,500개·12개 출처(2019년 기준), 예비판 약 7,000개(GTS·멕시코)"
        after: "약 21,500개·29개 출처(2024년 말 확정판), 예비판 약 12,000개"
      - aspect: 우량계 포착 손실 보정
        before: "없음"
        after: "Legates-Willmott 보정 적용 — 대부분 지역에서 조금 더 습함"
      - aspect: 일자료
        before: "일자료 제공(전지구, 아프리카 0.25°)"
        after: "반순 합계를 ERA5(rnl, 1981~) 또는 IMERG Late V07(sat, 예비판 포함) 일 비율로 분해한 두 가지"
      - aspect: 생산 상태
        before: "2026년까지 병행 생산, 2026년 12월 이후 종료"
        after: "현재판 — 예비판 반순마다, 확정판 매월"
    impacts:
      - v2와 v3를 한 시계열로 이어 붙이지 말고 전 기간을 v3로 다시 받으세요. v3가 대체로 더 습하므로 기후값·추세도 다시 계산해야 합니다.
      - 50°~60° 위도대는 v3에서 새로 생긴 영역입니다. 이 지역 결과는 v2와 비교할 수 없습니다.
      - Earth Engine 컬렉션 ID가 바뀝니다(UCSB-CHG/CHIRPS/DAILY → UCSB-CHC/CHIRPS/V3/DAILY_RNL 또는 DAILY_SAT).
    sources:
