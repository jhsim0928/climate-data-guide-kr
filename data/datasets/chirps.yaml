# ─────────────────────────────────────────────────────────────
# CHIRPS — 데이터셋 정보 파일
# 위성 탭(강수). UCSB Climate Hazards Center의 적외 위성+관측소 결합 강수입니다. v3.0이 현재판이고 v2.0은 2026년 12월 이후 생산이 끝납니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: chirps
name: "CHIRPS"
full_name: Climate Hazards Center Infrared Precipitation with Stations, Version 3 (적외 위성 추정과 관측소 자료를 결합한 준전지구 육상 강수, 0.05°·1981~)
category: analysis
domain: satellite
group: 강수
order: 40
also_in:
  - domain: atmosphere
    group: 강수 자료
domains: [대기, 육지, 수문]
provider: UC Santa Barbara Climate Hazards Center(CHC) (USGS·USAID FEWS NET 협력, 배포 CHC 자료 저장소·Google Earth Engine·USGS EWX)

status: active
status_note: >-
  CHIRPS v3.0이 현재판이며 예비판(Prelim)은 반순(5일)마다, 확정판(Final)은 매달 갱신됩니다. CHC는 v3.0이 v2.0을 대체한다고 밝혔고,
  v2.0은 전환을 돕기 위해 2026년까지 함께 만들다가 2026년 12월 이후 생산을 끝낸다고 안내합니다. 2026-10-13 확인 시 Google Earth Engine의 v3 일자료는 2026-08-31까지입니다.

period:
  start: "1981-01"
  end: present
  note: >-
    v3 확정판은 1981-01부터 현재까지, v3 예비판은 2025-01부터입니다. 일자료 중 IMERG 기반(sat)은 Sci Data 논문 기준 2001년부터, ERA5 기반(rnl)은 1981년부터입니다.
    v2.0도 1981년부터이며 2026-10-13 확인 시 Earth Engine의 v2 일자료는 2026-08-31까지 들어와 있습니다.

resolution:
  spatial_short: "6 km (0.05°)"
  temporal_short: "1일"
  spatial: >-
    0.05° 위경도 격자. v3 전지구 영역은 60°N–60°S 전 경도(7200×2400), 아프리카(1500×1600)·라틴아메리카(1720×1900) 영역 파일도 있습니다.
    관측소 자료는 육지에만 들어갑니다. v2.0은 50°S–50°N입니다.
  vertical: 지표 강수 단일층
  temporal: >-
    반순(5일)·월이 기본 산출물이고, 순(10일)·2~6개월·연 합계와 일자료는 여기서 파생합니다. 일자료는 반순 합계를 ERA5(rnl) 또는 IMERG Late V07(sat)의 일 비율로 나눈 값입니다.

update: "예비판 반순 종료 2일 뒤(매달 2·7·12·17·22·27일) / 확정판 매달(보통 다음 달 셋째 주)"
license: CC BY 4.0 (CHC는 법이 허용하는 한도에서 저작권을 포기했다고 밝힘). 계정 없이 무료
account_required: false

summary: >-
  CHIRPS는 정지궤도 위성의 적외 '찬 구름 지속시간'으로 추정한 강수(CHIRP)를 고해상도 기후값(CHPclim)에 맞추고, 여러 기관의 관측소 강수를 섞어 만든
  0.05° 준전지구 강수입니다. 관측이 드문 개발도상국의 가뭄 감시와 계절 강수 추세 분석을 위해 USGS·FEWS NET과 함께 개발되었고, 1981년부터 이어집니다.
  v3.0은 관측소 출처가 v2의 약 4배로 늘고, 우량계 포착 손실 보정과 새 기후값(CHPclim v2)·새 적외 알고리즘(CHIRP3)을 도입했으며 범위를 60°까지 넓혔습니다.

time_convention:
  summary: >-
    모든 값은 그 기간의 누적 강수량입니다(일자료 mm/day, 반순 mm/pentad, 월 mm/month). CHIRPS는 기본적으로 반순·월 자료이고, 한 달은 반순 6개로 나뉘어
    1~5·6~10·11~15·16~20·21~25일과 26일~말일로 묶입니다(마지막 반순 길이는 달마다 다름). 일자료는 반순 합계를 다른 자료의 일별 비율로 나눈 것이라
    날짜는 '분해 과정에서 붙인 일관된 이름표'일 뿐, 균일한 관측 시간 창(예: 00~24 UTC)을 뜻하지 않는다고 CHC는 설명합니다.
  points:
    - "반순 하나가 5일이 아닐 수 있습니다(26일~말일은 3~6일). 반순 값을 일평균으로 바꿀 때 실제 일수로 나누세요."
    - "일자료 rnl(ERA5로 분해)과 sat(IMERG Late V07로 분해)은 같은 반순 합계를 서로 다른 일 분포로 나눈 것입니다. 한 연구 안에서는 하나만 쓰세요."
    - "일자료는 반순이 갱신될 때 묶음으로 다시 만들어지며 독립적인 일 관측이 아닙니다. 일 단위 극한값이나 정확한 날짜가 중요한 분석에는 주의하세요."
    - "예비판(Prelim)은 반순 종료 2일 뒤 빠르게 들어오는 관측소만 쓰고, 확정판(Final)은 다음 달 셋째 주쯤 더 많은 관측소로 다시 만듭니다. 같은 기간이라도 두 판의 값이 다릅니다."
    - "ERA5는 약 5일 늦게 나오므로 예비판 일자료는 IMERG 기반(sat)만 있습니다."
  source: https://www.chc.ucsb.edu/data/chirps3
  source_name: "CHC CHIRPS v3 페이지 + Funk et al. (2026) Scientific Data + CHIRPS FAQ(반순 정의)"

variables:
  note: >-
    공개 자료는 강수 하나이며 GeoTIFF·NetCDF·BIL·COG로 배포됩니다. 아래 이름은 Google Earth Engine 밴드 이름이고, CHC NetCDF 파일 속 변수 이름은 공식 문서에서 확인하지 못했습니다.
    결측·오류 값은 -9999입니다(2023년 이후 적외 자료 결측 포함).
  full_list: https://www.chc.ucsb.edu/data/chirps3
  groups:
    - name: 반순·월 (기본 산출물)
      kind: accum
      period: 반순(5일)·월
      items:
        - text: "강수량 — `precipitation` (mm/pentad, mm/month)"
          note: "Earth Engine UCSB-CHC/CHIRPS/V3/PENTAD. 순(10일)·2~6개월·연 합계도 같은 방식"
    - name: 일자료 (rnl·sat)
      kind: accum
      period: 일
      items:
        - text: "일강수량 — `precipitation` (mm/d)"
          note: "Earth Engine UCSB-CHC/CHIRPS/V3/DAILY_RNL(ERA5 분해)·DAILY_SAT(IMERG Late V07 분해). 날짜는 분해 과정에서 붙인 이름표"
    - name: 진단 자료
      kind: static
      items:
        - text: "Legates-Willmott 우량계 포착 손실 보정 계수 격자"
          note: CHC diagnostics/legates-willmott_corrections 폴더
        - text: "적외 결측을 ERA5로 메운 위치(fill map)"
          kind: instant
          note: "1981~2022년 적외 공백을 ERA5로 채운 곳 표시. diagnostics/fillmaps 폴더"

