  acknowledgement: >-
    ESA CCI 이용 조건에 따라 발표·논문에 ESA Climate Change Initiative, Sea State CCI 과제, 자료 제공자를 사사하고 사용한 데이터셋 DOI를 인용합니다.
    CCI 자료가 연구의 핵심이라면 공동 저자 제안을 고려하고, 결과물 사본을 CCI에 보내 달라고 요청합니다.

notices:
  - date: "2026-07-08"
    level: info
    title: v4 정식 기록 CEDA 등록 (DOI 부여)
    body: >-
      고도계 L2P·L3(1991-08~2023-12)·L4(1992-01~2023-12) v4와 Sentinel-1 SAR L2P(Wave Mode 유의파고 2015-03~2025-06, ISSP 등) v4가 CEDA에 DOI와 함께 올라왔습니다.
      모두 'Completed'이며 이후 갱신 계획은 없습니다.
    source: https://catalogue.ceda.ac.uk/uuid/315d8e013696420192f1ea1d9191ca9c/
  - date: "2025-08"
    level: info
    title: v4 공개 — 1991~2023년으로 확장, Sentinel-1 IW·EW SAR 산출물 추가
    body: >-
      ERS-1·ERS-2·TOPEX/Poseidon을 넣어 기록을 1990년대 초로 늘리고, Jason-3·SARAL·CryoSat-2를 3년 연장하고 Sentinel-3A/B·Sentinel-6A를 더해 2023년 12월까지 확장했습니다.
      수심을 GEBCO 2024로 바꾸고 육지 마스크를 해안 거리 기반으로 바꿨으며, Sentinel-1 IW·EW 모드 SAR 산출물이 새로 나왔습니다. 처음에는 Ifremer 서버에 임시판으로 공개되었습니다.
    source: https://umr-lops.github.io/cci-seastate-pum/v4.0/intro.html
  - date: "2022-10-10"
    level: info
    title: v3 공개 (2002-06~2021-01)
    body: >-
      고도계 L2P·L3·L4 v3와 Envisat·Sentinel-1 SAR 산출물이 CEDA에 공개되었습니다. 기간을 2020년 말까지 늘리고 Sentinel-3 SAR 고도계 자료와 보조 변수를 추가한 판입니다.
    source: https://catalogue.ceda.ac.uk/uuid/9c350d4ff7ee438f9f1fc7252cbb2282
  - date: "2020-01-30"
    level: info
    title: v1.1 공개 (1991-07~2018-12)
    body: >-
      GlobWave 과제의 처리를 이어받은 첫 기후자료 판(L2P·L3·L4)이 CEDA에 공개되었습니다. 이후 v3·v4로 대체되었습니다.
    source: https://catalogue.ceda.ac.uk/uuid/47140d618dcc40309e1edbca7e773478

transitions:
  - from: Sea State CCI v3
    to: Sea State CCI v4
    status: completed
    date: "2025-08"
    summary: >-
      기록을 1991~2023년으로 늘리고(이전 2002~2021), 1990년대 위성 3기와 최신 위성 3기를 더한 판입니다. 수심·육지 마스크·Jason-3 재추적 파일이 바뀌고 Sentinel-1 IW·EW SAR 산출물이 추가되었습니다.
    changes:
      - aspect: 기간
        before: "L4 2002-06~2021-01 (L2P·L3 2002~2021)"
        after: "L2P·L3 1991-08~2023-12, L4 1992-01~2023-12"
      - aspect: 고도계 위성
        before: "Jason-1·2·3, Envisat, CryoSat-2, SARAL, Sentinel-3 등"
        after: "ERS-1, ERS-2, TOPEX/Poseidon, Sentinel-3A/B, Sentinel-6A 추가 — 모두 12기"
      - aspect: 수심·육지 마스크
        before: 이전 수심 자료, 이전 육지 마스크
        after: "GEBCO 2024 수심, 해안까지 거리로 육지 마스크 계산"
      - aspect: Jason-3 입력
        before: 이전 재추적 파일
        after: 재추적 파일 판 갱신
      - aspect: SAR 산출물
        before: "Envisat·Sentinel-1 Wave Mode"
        after: "Sentinel-1 IW·EW 모드 추가, Wave Mode 기록 2024~2025년까지 연장"
      - aspect: DOI
        before: "L4 10.5285/9c350d4ff7ee438f9f1fc7252cbb2282"
        after: "L4 10.5285/315d8e013696420192f1ea1d9191ca9c"
    impacts:
      - v3와 v4 파일을 한 시계열에 섞지 마세요. 2002~2020년 구간도 v4로 다시 받으면 같은 처리로 이어집니다.
      - "1990년대가 추가되었지만 그 시기는 위성 수가 적고 재추적기(MLE3)가 다르므로 장기 추세 분석 때 시기별 표본 수를 함께 확인하세요."
    sources:
      - name: CCI Sea State Product User Guide v4.0 — Changes
        url: https://umr-lops.github.io/cci-seastate-pum/v4.0/changes.html
      - name: CEDA — v4 L4 기록
        url: https://catalogue.ceda.ac.uk/uuid/315d8e013696420192f1ea1d9191ca9c/
      - name: CEDA — v3 L4 기록
        url: https://catalogue.ceda.ac.uk/uuid/9c350d4ff7ee438f9f1fc7252cbb2282

