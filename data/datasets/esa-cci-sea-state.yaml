example:
  lang: python
  note: "Ifremer 서버에서 L4 월 파일을 받아 한반도 주변 월평균 유의파고를 보는 예입니다. 로그인은 필요 없습니다."
  code: |
    # pip install xarray netCDF4 requests
    import requests, xarray as xr

    base = "https://data-cersat.ifremer.fr/data/ocean-waves/cci-seastate/v4/data/satellite/altimeter/l4/"
    fname = "ESACCI-SEASTATE-L4-SWH-MULTI_1M-202001-fv01.nc"      # 연도 폴더 아래 월 파일
    with open(fname, "wb") as f:
        f.write(requests.get(base + "2020/" + fname, timeout=120).content)

    ds = xr.open_dataset(fname)
    box = ds.where((ds.lat >= 30) & (ds.lat <= 42) & (ds.lon >= 120) & (ds.lon <= 135), drop=True)  # 한반도 주변
    print(box["swh_mean"].values.round(2))
    print("칸별 pass 수:", box["swh_count"].values)                  # 표본이 적은 칸은 조심

tips:
  - "안내서는 거의 모든 용도에 `swh_denoised`를 권장합니다. `swh`는 위성 간 편차 보정 전 값이라 여러 위성을 섞어 쓰면 위성이 바뀔 때 계단이 생길 수 있습니다."
  - "L4는 위성이 지나간 순간들만으로 만든 월 통계입니다. 한반도 주변처럼 칸이 작고 위성 수가 시기마다 달라지는 곳은 swh_count가 작은 칸·달의 평균과 최댓값을 조심해서 보세요."
  - "태풍 같은 고파고 영역에서는 위성 간 편차 보정이 덜 확실합니다(직접 비교 자료가 적은 5~10 m 구간, 10 m 이상은 외삽). 극값 분석에는 부이·모델과 함께 확인하세요."
  - "해빙 농도 10% 초과는 품질 1, 0~10%는 품질 2로 표시되어 L3·L4에서 빠집니다. 겨울철 오호츠크해·발해처럼 해빙이 생기는 바다는 그 계절 자료가 비거나 표본이 적습니다."
  - "1990년대(ERS-1·ERS-2·TOPEX)는 위성 수가 적고, TOPEX는 사이클 16 이전 제외·Side A/B 분리·기록기 노후로 인한 공백이 있다고 안내서가 밝힙니다. 장기 추세를 볼 때는 시기별 표본 수 변화를 함께 보세요."
  - "재추적기가 위성마다 다릅니다 — Jason-1·2·3, Envisat, CryoSat-2, SARAL은 WHALES, ERS·TOPEX는 MLE3, Sentinel-3A/B·Sentinel-6A는 MLE4. 위성별 비교 시 이를 고려하세요."
  - "L2P에는 관측 지점에 맞춘 ERA5·WAVEWATCH III 파고(era5_swh, ww3_swh)가 함께 들어 있어, 별도 모델 자료를 내려받지 않고도 모델 검증을 바로 할 수 있습니다."
  - "v3(2002-06~2021-01)와 v4는 재추적기 판·수심·육지 마스크 처리가 달라 섞지 마세요. v1.1·v3를 쓴 이전 결과와 비교할 때는 v4로 다시 계산하는 것이 안전합니다."

