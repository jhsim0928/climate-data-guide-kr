  papers:
    - label: Sea State CCI 자료 소개 논문 (v1)
      text: >-
        Dodet, G., Piollé, J.-F., Quilfen, Y., Abdalla, S., Accensi, M., Ardhuin, F., Ash, E., Bidlot, J.-R., Gommenginger, C., Marechal, G., Passaro, M., Quartly, G., Stopa, J.,
        Timmermans, B., Young, I., Cipollini, P., Donlon, C. (2020): The Sea State CCI dataset v1: towards a sea state climate data record based on satellite observations.
        Earth System Science Data, 12(3), 1929–1951.
      doi: 10.5194/essd-12-1929-2020
      bibtex: |
        @article{dodet2020seastate,
          author  = {Dodet, Guillaume and Pioll{\'e}, Jean-Fran{\c{c}}ois and Quilfen, Yves and Abdalla, Saleh and Accensi, Micka{\"e}l and Ardhuin, Fabrice and Ash, Ellis and Bidlot, Jean-Raymond and Gommenginger, Christine and Marechal, Gwendal and Passaro, Marcello and Quartly, Graham and Stopa, Justin and Timmermans, Ben and Young, Ian and Cipollini, Paolo and Donlon, Craig},
