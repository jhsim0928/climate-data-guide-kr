# ─────────────────────────────────────────────────────────────
# ESA Sea State CCI — 데이터셋 정보 파일
# 위성 탭(해면고도·파랑), 해양 탭(위성 관측 자료) 교차 수록. 여러 위성 고도계 유의파고를 상호 보정한 기후자료(L2P 궤도·L3 일·L4 월 1°)와 Sentinel-1 SAR 파랑 자료.
# 2026-10-13 확인 시 최신판은 v4(1991-08~2023-12)이며 CEDA에 2026-07-08 DOI와 함께 올라와 있습니다(갱신 계획 없음).
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: esa-cci-sea-state
name: ESA Sea State CCI v4
full_name: >-
  ESA Sea State Climate Change Initiative (Sea_State_cci) version 4 — 다중 위성 고도계 유의파고 L2P·L3·L4와 Sentinel-1 SAR 파랑 L2P (위성 해상 파랑 기후자료)
category: satellite
domain: satellite
group: 해면고도·파랑
order: 30
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 해양파랑, 원격탐사]
provider: 유럽우주국(ESA) 기후변화 이니셔티브(CCI) Sea State 과제 — 자료 생산·배포 Ifremer(프랑스) / 기록 보관 영국 CEDA

status: active
status_note: >-
  v4가 최신판입니다. Ifremer가 2025년 8월 임시판으로 먼저 내놓았고, 2026-07-08 CEDA에 DOI가 붙은 정식 기록(고도계 L2P·L3·L4, SAR L2P)으로 올라왔습니다.
  CCI 자료는 버전 단위로 내는 연구용 기후자료라 정기 갱신은 없으며(CEDA 'Completed', 갱신 'Not Planned'), 2026-10-13 확인 시 고도계 기록은 2023-12-31에서 끝납니다.
  과제는 2단계(Phase 2)로 이어지고 있고 2026년부터 Copernicus 기후변화 서비스(C3S)에 입력을 제공한다고 과제 페이지가 밝히지만, 다음 버전 일정은 공지되지 않았습니다.

period:
  start: "1991-08"
  end: "2023-12"
  note: >-
    고도계 L2P·L3는 1991-08-03~2023-12-31, L4 월자료는 1992-01~2023-12입니다(CEDA 기준). v4에서 ERS-1·ERS-2·TOPEX/Poseidon을 넣어 1990년대로 늘었고(v3는 2002-06~2021-01),
    Sentinel-1 SAR Wave Mode 유의파고는 2015-03-19~2025-06-11, Sentinel-1 WV 통합 해상 상태 변수(ISSP, DLR)는 2014-12-01~2024-12-30까지입니다.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1일"
  spatial: >-
    고도계 L2P·L3 — 궤도 따라 1 Hz 평균 값(CEDA L3 설명 '약 6 km', 사용자 안내서 요약 '7 km' 간격) /
    L4 — 전지구 1°×1° 정규 원통 투영(위경도) 격자 / Sentinel-1 SAR Wave Mode — 약 20 km 크기 이미지렛, 진행 방향 100 km 간격
  vertical: 해면 단일층 (유의파고)
  temporal: >-
    L2P — 위성 pass 단위 파일, 1 Hz 관측 순간값 / L3 — 여러 위성을 합친 하루 파일(궤도 자료 그대로) / L4 — 월 통계(평균·최대·RMS·개수)
coverage:
  short: 준전지구
  note: "고도계가 지나는 바다만 관측됩니다. L3 범위는 80°S~80°N(CEDA). 해빙이 섞인 관측은 품질 등급이 낮아 L3·L4에서 빠집니다"
update: 정기 갱신 없음 — 버전 단위 재처리 공개(v1.1 2020-01, v3 2022-10, v4 2026-07 CEDA 등록)
license: >-
  ESA CCI Sea State 이용 조건(모든 용도 사용 가능). ESA CCI·Sea State CCI 과제·자료 제공자를 사사하고 데이터셋 DOI를 인용하며, 자료를 쓴 보고서·논문 사본을 CCI에 보내 달라고 요청합니다
account_required: false

summary: >-
  ESA 기후변화 이니셔티브(CCI)가 만든 위성 해상 파랑 기후자료입니다. ERS-1부터 Sentinel-6A까지 고도계 12기의 파형을 다시 처리(재추적, WHALES 등)하고
  Jason-3 기준으로 위성 간 편차를 맞춘 뒤, 부이로 보정하고 경험 모드 분해(EMD)로 잡음을 줄인 유의파고를 궤도 자료(L2P), 하루 병합 궤도 자료(L3), 1° 월 통계 격자(L4)로 제공합니다.
  v4는 1991~2023년을 덮고, Sentinel-1 SAR 영상에서 얻은 유의파고·해상 상태 변수(L2P)도 함께 냅니다. 파랑 기후 변화, 파랑 모델·재분석 검증, 해안 공학에 쓰입니다.

time_convention:
  summary: >-
    L2P·L3의 값은 위성이 지난 순간의 1 Hz 관측(전해상도 관측의 중앙값)이고, L3는 하루 동안 모든 위성의 좋은 품질 관측을 한 파일에 모은 것입니다.
    L4는 달마다 각 1° 칸을 지난 pass별 중앙값을 먼저 구하고, 그 중앙값들로 평균·최대·RMS·개수 같은 월 통계를 낸 값입니다.
  points:
    - "파일명 예 — L2P ESACCI-SEASTATE-L2P-SWH-Jason-2-20170130T145103-fv01.nc(파일 첫 관측 시각), L3 ESACCI-SEASTATE-L3-SWH-MULTI_1D-20170130-fv01.nc, L4 ESACCI-SEASTATE-L4-SWH-MULTI_1M-201701-fv01.nc"
    - "1 Hz 값은 20 Hz(Envisat·TOPEX 18 Hz, SARAL 40 Hz) 전해상도 관측 가운데 유효한 점의 중앙값입니다. 유효 점이 6개(SARAL 12개) 미만이면 불량으로 표시됩니다."
    - "L4의 swh_mean은 하루하루를 고르게 평균한 값이 아니라 그달 위성이 지나간 pass의 중앙값들의 평균입니다. 위성이 지나지 않은 때의 파랑은 반영되지 않습니다."
    - "L4의 swh_max는 관측된 pass 중앙값 가운데 최댓값이라, 위성이 지나지 않은 폭풍의 최대 파고는 담기지 않습니다."
    - "L4에는 swh_sum·swh_squared_sum·swh_count가 있어 여러 달·여러 칸의 평균·분산을 개수 가중으로 다시 계산할 수 있습니다."
  source: https://umr-lops.github.io/cci-seastate-pum/v4.0/altimetry/l4.html
  source_name: CCI Sea State Product User Guide v4.0 (L2P·L3·L4·처리 상세)

variables:
  note: >-
    변수 이름은 CCI Sea State 사용자 안내서 v4.0과 CEDA v4 카탈로그 기준입니다. 거의 모든 용도에 `swh_denoised`(위성 간 편차 보정 + 잡음 제거)를 쓰라고 안내서가 권장합니다.
    L3·L4는 L2P에서 품질 등급 3(좋음)인 Ku 밴드 관측만 씁니다(SARAL만 Ka 밴드).
  full_list: https://umr-lops.github.io/cci-seastate-pum/v4.0/altimetry/l2p.html
  groups:
    - name: 고도계 L2P·L3 (궤도 1 Hz)
      kind: instant
      items:
        - text: "유의파고(편차 보정·잡음 제거, 권장) — `swh_denoised` (m)"
          note: swh_adjusted에 EMD 잡음 제거를 적용한 값
        - text: "유의파고(위성 간 편차 보정) — `swh_adjusted` (m)"
        - text: "유의파고(재추적기 원값, 편차 보정 없음) — `swh` (m)"
        - "유의파고 불확실성 — `swh_uncertainty` (m)"
        - text: "유의파고 품질 등급(0 미정·1 불량·2 사용 가능·3 좋음, L2P) — `swh_quality_level`"
          std: []
        - text: "위성 식별 코드·사이클·상대 pass 번호(L3) — `satellite`, `cycle`, `relative_pass`"
          std: []
        - text: "해안까지 거리 — `distance_to_coast` (m)"
          kind: static
          std: []
        - text: "수심(GEBCO 2024) — `bathymetry` (m)"
          kind: static
          std: []
    - name: 고도계 L2P 보조 자료 (관측 지점에 맞춘 모델·해빙 값)
      kind: instant
      items:
        - text: "해빙 비율 — `sea_ice_fraction` (1)"
          std: []
        - text: "ERA5 유의파고(풍랑+너울) — `era5_swh` (m)"
          note: 모델 값(관측 아님)
        - text: "WAVEWATCH III 후측 유의파고 — `ww3_swh` (m)"
          note: 고도계와 독립인 모델 값
    - name: 고도계 L4 (1° 월 통계)
      kind: mean
      period: 월
      items:
        - text: "월평균 유의파고 — `swh_mean` (m)"
          note: pass별 칸 중앙값들의 평균
        - text: "월 최대 유의파고 — `swh_max` (m)"
          kind: max
          note: pass별 칸 중앙값 가운데 최댓값
        - text: "유의파고 제곱평균제곱근 — `swh_rms` (m)"
        - text: "평균에 쓴 pass 중앙값 개수 — `swh_count` (개)"
          std: []
        - text: "문턱값(0.5~10 m)을 넘은 개수 — `swh_count_greater_than_0.50` … `swh_count_greater_than_10.00` (개)"
          kind: accum
          std: []
        - text: "합계·제곱합(재평균용) — `swh_sum`, `swh_squared_sum` (m, m2)"
          kind: accum
          std: []

