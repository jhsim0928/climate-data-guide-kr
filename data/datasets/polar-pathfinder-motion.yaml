          title   = {An enhancement to sea ice motion and age products at the {National Snow and Ice Data Center} ({NSIDC})},
          journal = {The Cryosphere},
          volume  = {14},
          number  = {5},
          pages   = {1519--1536},
          year    = {2020},
          doi     = {10.5194/tc-14-1519-2020}
        }
    - label: ERA5 (2025년 이후 바람 입력, 안내서가 함께 인용)
      text: >-
        Hersbach, H., et al. (2020): The ERA5 global reanalysis. Quarterly Journal of the Royal Meteorological Society, 146, 1999–2049.
      doi: 10.1002/qj.3803
  acknowledgement: >-
    NSIDC는 데이터셋 인용을 이용 조건으로 요구합니다. 사용한 기간·반구와 접근 날짜를 함께 적고, 2026년 이후 북극 자료를 빠른 연장판(NSIDC-0748)으로 채웠다면
    그 DOI도 따로 적으세요.

notices:
  - date: "2026-10"
    level: warning
    title: 2025년 자료 추가(v4.2) — 입력이 AMSR2·ERA5로 바뀜
    body: >-
      사용자 안내서가 2026년 10월 갱신되면서 일·주간 자료가 2025-12-31까지 연장되었습니다. 2025년분(파일 버전 v4.2)부터 수동마이크로파 입력이
      DMSP SSMIS에서 GCOM-W1 AMSR2로, 바람 입력이 NCEP/NCAR 재분석에서 ERA5로 바뀌었습니다. 1978~2024년(v4.1)은 그대로입니다.
    source: https://nsidc.org/sites/default/files/documents/user-guide/nsidc-0116-v004-userguide_0.pdf
  - date: "2026-09-08"
    level: info
    title: NSIDC AMSR2 산출물 계속 처리 — AMSR3 산출물은 2027년 개발 예정
    body: >-
      이 자료와 빠른 연장판의 위성 입력인 AMSR2 일별 극 격자 밝기온도(NSIDC-0802)·해빙 농도(NSIDC-0803)는 JAXA가 AMSR2 자료를 내는 동안 계속 처리됩니다.
      NSIDC는 AMSR3 기반 산출물 개발을 2027년으로 계획하고 있습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-amsr2-products-continued-forward-processing
  - date: "2026-03-18"
    level: info
    title: NCEP/NCAR 재분석(R1) 갱신 종료 — 이 자료는 2025년부터 ERA5 바람 사용
    body: >-
      NOAA PSL이 R1 갱신 종료를 공지했습니다(NCEP의 CDAS → CORe 전환 2026-03-18). NSIDC-0116은 2025-01-01 이후 바람 입력을 ERA5로 바꾸었고(사용자 안내서 표 11)
      빠른 연장판 NSIDC-0748도 ERA5를 쓰므로 갱신에는 영향이 없습니다. 1978~2024년 구간은 계속 NCEP/NCAR 바람을 입력으로 씁니다.
    source: https://psl.noaa.gov/news/2026/r1datanotice.html

