  acknowledgement: >-
    ESA CCI Salinity 이용 조건은 발표·논문에서 ESA Climate Change Initiative와 Sea Surface Salinity CCI 과제(및 자료 제공자)를 밝히고 데이터셋 DOI를 인용하라고 요구합니다.
    자료를 쓴 보고서·논문 사본을 CCI 쪽에 보내 주고, CCI 자료가 연구의 중심이면 공저자 제안을 고려해 달라고도 부탁합니다.

notices:
  - date: "2025-11-30"
    level: info
    title: CEDA v5.5 자료 다운로드 복구
    body: >-
      CEDA가 2025-11-20부터 SSS CCI v5.5 데이터셋(전지구·극역, 주간·월)을 일시적으로 받을 수 없게 했다가 2025-11-30 온라인 접근을 복구했다고 각 기록에 알렸습니다.
    source: https://catalogue.ceda.ac.uk/uuid/4321d9b540fe48f8943179aa3ef06c79/
  - date: "2025-03-03"
    level: info
    title: SSS CCI v5.5 공개 (2010~2023)
    body: >-
      v4.41보다 1년 늘어난 v5.5가 CEDA에 공개되었습니다(개별 데이터셋 2025-02-24, 모음 DOI 2025-03-03). SMOS L2 염분을 새 유전율 모형으로 재처리하고 SMAP v5.3을 쓰며,
      SMOS 전파 간섭(RFI) 완화를 전지구로 넓히고 65°N 이북 절대 보정을 개선했습니다. 2010년 과소 추정과 SMAP v5.0의 4~8월 문제도 해결되었다고 ESA는 밝혔습니다.
    source: https://climate.esa.int/en/news-events/Sea-Surface-Salinity-Record-Extended/
  - date: "2024-03-20"
    level: info
    title: SSS CCI v4.41 공개 (2010~2022)
    body: >-
      기간을 2년 늘리고 계절 편향 보정, 고위도 안정성, 극역 관측 범위를 개선한 v4.41이 공개되었습니다(CEDA 공개 2024-02-16). 주간·월 산출물을 0.25° 전지구 격자와 25 km 극역 EASE 격자로 제공합니다.
    source: https://climate.esa.int/en/news-events/new-sea-surface-salinity-record-released/
  - date: "2021-10-08"
    level: info
    title: SSS CCI v3.21 공개 (2010~2020)
    body: v3.21 주간·월 염분 산출물이 CEDA에 공개되었습니다. 이후 v04.41(2024-02-16)로 대체되었습니다.
    source: https://catalogue.ceda.ac.uk/uuid/5920a2c77e3c45339477acd31ce62c3c

transitions:
  - from: SSS CCI v4.41
    to: SSS CCI v5.5
    status: completed
    date: "2025-02"
    summary: >-
      기간을 2023년까지 1년 늘리고 SMOS 재처리(새 유전율 모형)·SMAP 입력판 교체·전지구 RFI 완화를 반영한 판입니다.
      v4.41의 2010년 과소 추정과 2015년 4~8월 북대서양 고염 오류가 고쳐졌고, 북반구 계절 편향도 줄었습니다.
    changes:
      - aspect: 기간
        before: "2010-01~2022 (CEDA 공개 2024-02-16)"
        after: "2010-01~2023-12 (CEDA 공개 2025-02-24)"
      - aspect: SMOS 입력
        before: ESA L2OS v700 재처리
        after: "CCI 자체 L2OS 재처리(DPGS L1C v7 기반), 새 유전율 모형, RFI 완화 전지구 확대"
      - aspect: SMAP 입력
        before: RSS L2 v5.0
        after: RSS L2 v5.3
      - aspect: 알려진 오류
        before: "2010년 약 0.1 pss 과소 추정(SMOS 시험 운용기), 2015년 4~8월 북대서양 0.2 pss 이상 고염(SMAP v5.0)"
        after: 두 문제 해결(PVIR v5.1)
      - aspect: 북반구 계절 편향
        before: 0.1 pss 미만
        after: 0.05 pss 미만(첨두 간)
      - aspect: 고위도 절대 보정
        before: v4 방식
        after: 65°N 이북 절대 보정 개선
      - aspect: 데이터셋 DOI
        before: 10.5285/f2ca631f29a24c47a7e98654ddf2c7d9
        after: 10.5285/7294d93479654c139770f13fae4142d1
    impacts:
      - 두 판을 한 시계열로 이어 붙이지 말고 전체 기간을 v5.5로 다시 받으세요. 특히 2010년과 2015년 북대서양 값이 다릅니다.
      - Argo와의 전체 비교 성능은 비슷하지만 연안·고염 해역은 v5.5가 낫고, 5°C 미만 저수온 해역은 약간 나빠졌다고 PVIR이 보고합니다.
      - 인용 DOI가 바뀌었습니다. CEDA 경로도 v04.41에서 v05.5 폴더로 바뀝니다.
    sources:
      - name: ESA CCI — Sea Surface Salinity Record Extended (v5.5)
        url: https://climate.esa.int/en/news-events/Sea-Surface-Salinity-Record-Extended/
      - name: SSS CCI PVIR v5.1 (2025-02-25)
        url: https://climate.esa.int/documents/2953/SSS_cci_PHASE02_D4.1_PVIR_v5.1.pdf
