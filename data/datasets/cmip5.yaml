notices:
  - date: "2025-07-29"
    level: warning
    title: LLNL ESGF 노드 종료
    body: >-
      CMIP 자료를 보관·제공하던 LLNL ESGF 노드가 2025년 7월 29일 종료되었습니다. 예전 안내에 나오는 esgf-node.llnl.gov 경로는 쓸 수 없습니다.
    source: https://wcrp-cmip.org/esgf-information/
  - date: "2025-02-12"
    level: warning
    title: CMIP3·CMIP5는 새 ESGF 색인으로 옮기지 않음
    body: >-
      ESGF 차세대 체계(ESGF-NG)로 옮기는 과정에서 CMIP3·CMIP5 같은 이전 프로젝트는 새 색인으로 옮길 계획이 없다고 안내되었습니다.
      CMIP5는 처음에는 검색되지 않을 수 있으며, 자료는 보존되지만 CEDA·DKRZ 보관소 같은 별도 경로로 받아야 할 수 있습니다.
      (안내 페이지에는 게시일이 없어, 날짜는 WCRP CMIP 뉴스 목록의 'ESGF 인프라 변경 예고' 공지 날짜를 따랐습니다.)
    source: https://wcrp-cmip.org/esgf-information/
  - date: "2020-05"
    level: info
    title: CMIP5 이용 약관 개정 — 모든 출력 '제한 없는' 이용
    body: >-
      개정 약관이 기존 이용 약관을 대체하며, CMIP5 보관소의 모든 모델 출력을 '제한 없이(unrestricted)' 쓸 수 있게 되었습니다.
      사사 문장 표기 등 약관에 적힌 조건은 그대로 지켜야 합니다.
    source: https://pcmdi.llnl.gov/mips/cmip5/terms-of-use.html

