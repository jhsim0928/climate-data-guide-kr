example:
  lang: python
  note: "NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행합니다. AIRS L2·L3 파일은 HDF-EOS2(HDF4)라 pyhdf로 읽습니다."
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="AIRS3STM", version="7.0",          # AIRS-only L3 월자료
        temporal=("2025-01-01", "2025-12-31"),
    )
    files = earthaccess.download(results[:1], "./airs")

    f = SD(files[0], SDC.READ)
    t = f.select("Temperature_A")[:].astype(float)   # (24 기압면, 180 위도, 360 경도), 상승(주간) 궤도
    t[t == -9999] = np.nan                            # 결측값
    print(t.shape, np.nanmean(t[0]))                  # 1000 hPa 기온 평균(면적 가중 아님)

tips:
  - "장기 추세에는 AIRS-only(AIRS2RET·AIRS3STD·AIRS3STM)만 쓰세요. AIRX(AIRS+AMSU)는 2016-09-25에서 끝났고, 두 흐름은 retrieval 표본과 품질 기준이 다릅니다."
  - "L3 상대습도에 200%를 넘는(최대 500%) 비현실적 값이 섞여 있으니 걸러 내라고 사용자 가이드가 안내합니다."
  - "L3 격자값은 품질(QC 0·1)을 통과한 retrieval만 평균한 것이라 짙은 구름·강수 지역에서는 맑은 쪽 표본으로 치우칩니다. 개수(`_ct`)가 적은 격자는 대표성이 낮다고 보고, 격자의 구름량으로 추가 QC를 하지는 마세요(가이드 권고)."
  - "L3 격자 경계가 날짜변경선(180°)에 있어 경도가 -180~180 순서입니다. 0° 중심 지도를 그리려면 경도 순서를 바꿔야 합니다."
  - "Aqua는 2021년 12월 이후 표류하며 적도 통과 시각이 늦어지고 고도가 낮아지고 있습니다. 일주기가 큰 지표 기온·지표면 온도·하층 수증기의 최근 추세는 관측 시각 변화 영향을 받을 수 있습니다."
  - "2026년 1월 19~28일은 L2·L3가 만들어지지 않았고, 2026년 1월 월자료는 이 기간이 빠진 평균입니다."
  - "V7에는 8일 자료가 없습니다. 여러 날을 묶을 때는 일자료를 `_ct`로 가중 평균하세요."

