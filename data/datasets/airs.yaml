notices:
  - date: "2026-03-20"
    level: warning
    title: NASA, Aqua 과학 운용 종료를 2027년 9월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월,
      Aura는 2028년 8월에 과학 운용이 끝날 것으로 전망하며 그때까지 운용을 계속한다고 밝혔습니다. AIRS 기록의 끝도 이 일정에 묶여 있습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-03-02"
    level: warning
    title: AIRS 검출기 DC Restore 이상 — 2026-01-19~28 L2·L3 생산 안 됨
    body: >-
      2026년 1월 19일 약 03:14 UTC부터 AIRS의 DC Restore 회로가 멈춰 모듈 M3~M10 채널 신호가 범위를 벗어났고, 1월 28일 점검 명령으로 정상화되었습니다.
      이 기간 L2·L3는 만들어지지 않았고, 1월 19일·28일 일자료와 2026년 1월 월자료는 일부 그래뉼이 빠진 채 남아 있으니 주의해서 쓰라고 안내했습니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/DC-Restore_Anomaly_Note_Final_260302_ADF1122.pdf
  - date: "2019-12-15"
    level: info
    title: AIRS Version 7 L3 공개 (L2는 2019-11-27)
    body: >-
      전 기간을 다시 처리한 Version 7이 공개되었습니다. L3 월평균 계산이 일자료의 단순 평균으로 바뀌고 8일 산출물이 없어졌습니다.
      CMR에는 Version 6 컬렉션도 남아 있지만 새 연구는 V7을 쓰는 것이 기본입니다.
    source: https://cmr.earthdata.nasa.gov/search/concepts/C1701805662-GES_DISC.html
  - date: "2016-09-24"
    level: critical
    title: AMSU-A2 전원 상실 — AIRS+AMSU(AIRX) 산출 종료
    body: >-
      Aqua의 AMSU-A2가 전원을 잃어 AIRS+AMSU 결합 산출물(AIRX2RET·AIRX3STD·AIRX3STM)이 2016년 9월 24일 자료로 끝났습니다.
      이후 자료는 AIRS-only(AIRS2RET 등)를 쓰라고 안내합니다. AMSU-A1은 계속 운용되지만 일부 채널(5·7·14)에 문제가 있습니다.
    source: https://airs.jpl.nasa.gov/data/outages/

