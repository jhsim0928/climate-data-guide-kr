account_required: true

summary: >-
  NASA Aqua 위성의 초분광 적외 탐측기 AIRS(2,378개 채널)로 구름 낀 하늘까지 보정해 구한 기온·수증기 연직 분포, 지표 기온, 구름, 오존·일산화탄소·메탄 등을
  2002년부터 제공하는 자료입니다. 궤도를 따라 6분 단위로 나오는 L2 스와스 자료와, 이를 1° 격자에 낮(상승)·밤(하강) 궤도별로 모은 L3 일·월자료가 있습니다.
  AMSU 마이크로파 측기 일부가 고장 난 뒤로는 적외만 쓰는 AIRS-only 흐름이 기본이며, 20년 넘는 기록 덕분에 대류권 기온·수증기 변화, 재분석·모델 검증에 널리 쓰입니다.

time_convention:
  summary: >-
    L2는 각 관측 영역을 위성이 지나간 시각의 순간값입니다. L3 일자료는 그날의 상승(낮, 적도 통과 지방시 약 13:30) 궤도와 하강(밤, 약 01:30) 궤도를
    따로 격자에 모은 평균이고(`_A`·`_D`), 월자료는 일자료를 평균한 값입니다.
  points:
    - "L3 일자료의 하루는 자정~자정 UTC가 아니라 날짜변경선에서 시작해 서쪽으로 진행하는 24시간이며, 이웃 격자 사이 관측 시각 차이는 약 90분 이하입니다. 날짜변경선을 지나는 주사선은 두 날짜 파일로 나뉩니다."
    - "변수 이름 끝의 `_A`는 상승(주간) 궤도, `_D`는 하강(야간) 궤도, `_ct`는 평균에 들어간 관측 수, `_sdev`는 표준편차입니다. 기온·수증기의 상관을 볼 때는 같은 관측 표본·같은 품질 기준을 쓰는 `_TqJ_A`·`_TqJ_D` 격자를 쓰라고 권고합니다."
    - "V7 월자료는 일자료의 단순 평균(관측 수 가중 없음)입니다. 일자료에는 궤도 사이 빈틈(gore)이 있습니다."
    - "적도 통과 시각 13:30·01:30은 설계값입니다. Aqua는 2021년 12월 이후 고도 유지를 멈추고 표류하면서 적도 통과가 점점 늦은 지방시로 옮겨 가고 있어, 같은 '주간' 값이라도 최근 연도는 관측 시각이 다릅니다."
    - "준실시간(NRT) L2(AIRS2RET_NRT)는 약 3시간 안에 나오지만 7일만 보관되는 임시 자료입니다. 연구에는 표준 산출(약 72시간 안)을 쓰세요."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L3_User_Guide.pdf
  source_name: AIRS Version 7 Level 3 Product User Guide + AIRS3STD V7.0 CMR 설명 + Aqua 임무 홈페이지

variables:
  note: >-
    L3 변수명은 AIRS V7 L3 사용자 가이드의 필드 이름이며, 각 변수에 `_A`(상승)·`_D`(하강) 접미어가 붙고 `_ct`·`_sdev` 보조 변수가 함께 있습니다(예: `Temperature_A`).
    L2 필드 이름은 V7 L2 사용자 가이드 표를 확인하세요. 결측값은 -9999입니다.
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L3_User_Guide.pdf
  groups:
    - name: L3 기온·수증기 (AIRS3STD 일자료 / AIRS3STM 월자료)
      kind: mean
      period: 일/월
      items:
        - "기온 연직 분포(24개 기압면) — `Temperature_A`, `Temperature_D` (K)"
        - "지표 기온 — `SurfAirTemp_A`, `SurfAirTemp_D` (K)"
        - "지표면(skin) 온도 — `SurfSkinTemp_A`, `SurfSkinTemp_D` (K)"
        - text: "수증기 질량 혼합비(12개 기압면) — `H2O_MMR_A`, `H2O_MMR_D` (g/kg)"
          std: [q]
        - "상대습도 — `RelHum_A`, `RelHum_D` (%)"
        - "총 가강수량(수증기 총량) — `TotH2OVap_A`, `TotH2OVap_D` (kg/m2)"
        - text: "지오퍼텐셜 고도(24개 기압면) — `GPHeight_A`, `GPHeight_D` (m)"
          std: [z]
    - name: L3 구름·복사·미량기체
      kind: mean
      period: 일/월
      items:
        - text: "구름량 — `CloudFrc_A`, `CloudFrc_D` (0~1)"
          std: [cloud]
        - text: "외향 장파복사(전천·청천) — `OLR_A`, `ClrOLR_A` 등 (W/m2)"
          std: [toa_rad]
        - "오존 전량 — `TotO3_A`, `TotO3_D` (DU)"
        - "일산화탄소 부피 혼합비 — `CO_VMR_A`, `CO_VMR_D` (무차원)"
    - name: L2 스와스 (AIRS2RET)
      kind: instant
      period: 관측 시각
      items:
        - text: "지표면(skin) 온도 — `TSurfStd` (K), 품질 플래그 `TSurfStd_QC`"
          std: [tskin]
          note: QC 0 최상, 1 양호, 2 사용 금지
        - text: "기온(28개 면)·수증기(15개 면) 연직 분포, 오존·CO·메탄 연직 분포와 오차 추정치"
          std: [t_air, q, ozone]
          note: 필드 이름은 V7 L2 사용자 가이드 참고

