# ─────────────────────────────────────────────────────────────
# AIRS (Aqua) Version 7 L2·L3 — 데이터셋 정보 파일
# 위성 탭(기온·수증기). AIRS-only(AIRS2RET·AIRS3STD·AIRS3STM)가 현행 기본 흐름이고,
# AIRS+AMSU(AIRX*)는 AMSU-A2 고장(2016-09-24)으로 끝났습니다. CLIMCAPS-Aqua는 같은 관측으로 만든 별도 산출 체계입니다.
# Aqua 과학 운용 종료 전망(2027년 9월)과 궤도 표류가 핵심 주의사항입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: airs
name: "AIRS V7"
full_name: Aqua Atmospheric Infrared Sounder (AIRS) Version 7 Level 2·Level 3 Standard Physical Retrieval (Aqua 위성 초분광 적외 탐측기 기온·수증기 연직 분포)
category: satellite
domain: satellite
group: 기온·수증기
order: 10
domains: [대기, 원격탐사]
provider: NASA JPL AIRS 프로젝트 / NASA GES DISC

status: active
status_note: >-
  AIRS-only Version 7(L2 AIRS2RET, L3 AIRS3STD·AIRS3STM)은 지금도 매일 생산됩니다(2026-10-13 확인 시 L2는 10월 9일, 일자료는 10월 6일, 월자료는 2026년 9월분까지).
  다만 Aqua는 2021년 12월 마지막 고도 유지 기동 이후 궤도가 표류하고 있고, NASA는 연료·전력 한계로 Aqua의 과학 운용이 2027년 9월 끝날 것으로 내다봅니다.
  AIRS+AMSU 산출물(AIRX2RET·AIRX3STD·AIRX3STM)은 AMSU-A2 전원 상실로 2016년 9월에 끝났습니다.

transitions:
  - from: AIRS+AMSU (AIRX2RET·AIRX3STD·AIRX3STM)
    to: AIRS-only (AIRS2RET·AIRS3STD·AIRS3STM)
    status: completed
    date: "2016-09"
    summary: >-
      AMSU-A2가 2016년 9월 24일 전원을 잃으면서 적외+마이크로파 결합 산출이 끝났고, 이후 연속 기록은 적외만 쓰는 AIRS-only 흐름뿐입니다.
      AIRS-only 흐름은 2002년부터 전 기간을 같은 방식으로 처리해 두었습니다.
    changes:
      - aspect: 기간
        before: "2002-08-30 ~ 2016-09-25 (AIRX2RET V7.0, COMPLETE)"
        after: "2002-08-30 ~ 현재 (AIRS2RET V7.0, ACTIVE)"
      - aspect: 입력 측기
        before: AIRS 적외 + AMSU-A 마이크로파
        after: AIRS 적외만 (AMSU 미사용, 지표 분류는 landFrac·예보 적설·해빙 정보 사용)
      - aspect: 마이크로파 단독 산출물
        before: "MW-only 기온·가강수량 등(`TAirMWOnlyStd`, `totH2OMWOnlyStd`) 제공"
        after: MW-only 산출물 없음
      - aspect: 품질 판정 (해양 지표 기온 QC 문턱)
        before: 1.1 K
        after: 1.2 K
      - aspect: 만든 이유
        before: 기본 산출(마이크로파로 구름 영향 보완)
        after: "2007년 6월부터 일부 AMSU 채널 잡음이 크게 늘어 적외 단독판을 따로 만들었고, AMSU-A2 고장 뒤 유일한 연속 흐름이 됨"
    impacts:
      - 장기 시계열은 처음부터 AIRS-only(AIRS2RET·AIRS3STM)로 통일하세요. 2016년 9월에서 AIRX와 AIRS를 이어 붙이면 처리 방식 차이가 기후 신호처럼 섞입니다.
      - V7 L2 가이드에 따르면 AIRS+AMSU 쪽이 품질 0·1(최상·양호) 판정 비율이 더 높습니다. 같은 기간이라도 AIRS-only는 평균에 들어간 표본이 다를 수 있으니 개수(`_ct`) 변수로 표본 수를 확인하세요.
    sources:
      - name: AIRS/AMSU/HSB Version 7 Level 2 Product User Guide (V1.1, 2021-07-14)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L2_Product_User_Guide.pdf
      - name: CMR — AIRX2RET V7.0 (AMSU-A2 전원 상실로 종료)
        url: https://cmr.earthdata.nasa.gov/search/concepts/C1701805641-GES_DISC.html
      - name: AIRS 관측 중단·이상 기록 (AIRS 프로젝트)
        url: https://airs.jpl.nasa.gov/data/outages/
  - from: AIRS Version 6
    to: AIRS Version 7
    status: completed
    date: "2019-12"
    summary: >-
      2019년 말 공개된 Version 7은 전 기간을 다시 처리한 현행판입니다. L3에서는 월평균 계산 방식이 바뀌고 8일 산출물과 일부 미량기체 전체 컬럼 변수가 빠졌습니다.
    changes:
      - aspect: 공개 시점
        before: Version 6
        after: "L2 AIRS2RET V7.0 2019-11-27, L3 AIRS3STD·AIRS3STM V7.0 2019-12-15 (CMR 인용 정보 기준)"
      - aspect: L3 월평균 계산
        before: "관측 수 가중 평균(Averaged By Observation)"
        after: "일자료의 단순 산술 평균(Averaged By Day) — 관측 수로 가중하지 않음"
      - aspect: L3 8일 산출물
        before: "AIRS3ST8 등 8일 산출물 제공"
        after: 제공 안 함 — 일자료와 개수(`_ct`) 변수로 직접 계산
      - aspect: 미량기체
        before: CO·CH4 전체 컬럼 변수 제공
        after: "전체 컬럼 CO·CH4 삭제, CO는 `CO_VMR`(연직 분포)만 남음"
    impacts:
      - V6와 V7 월평균은 계산 방식이 달라 같은 달이라도 값이 다를 수 있습니다. 두 판을 섞지 마세요.
      - 예전 8일 자료(AIRS3ST8 V006)를 쓰던 코드는 V7 일자료(AIRS3STD)를 개수 가중으로 직접 묶도록 바꿔야 합니다.
    sources:
      - name: AIRS Version 7 Level 3 Product User Guide
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/V7_L3_User_Guide.pdf
      - name: AIRS 문서 목록 (V7 Changes from V6 포함)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/AIRS/AIRS_Documentation.pdf

period:
  start: "2002-08"
  end: present
  note: >-
    AIRS-only L2(AIRS2RET)는 2002-08-30, L3 일자료(AIRS3STD)는 2002-08-31, 월자료(AIRS3STM)는 2002-09부터입니다. 2026-10-13 확인 시
    L2는 2026-10-09, 일자료는 2026-10-06, 월자료는 2026년 9월분까지 있습니다. AIRS+AMSU(AIRX*)는 2016-09-25에서, AIRS+AMSU+HSB는 2003-02-05에서 끝났습니다.
    2026-01-19~28은 AIRS 검출기 이상으로 L2·L3가 만들어지지 않았습니다.

resolution:
  spatial_short: "50 km (0.45°)"
  temporal_short: "1일"
  spatial: >-
    L2: 스와스 자료. AIRS 적외 시야 3×3개(직하점 약 15 km)를 묶은 관측 영역(Field of Regard, 직하점 약 50 km)마다 하나의 retrieval,
    한 그래뉼은 궤도 횡단 30개 × 진행 방향 45줄 / L3: 1°×1° 전지구 위경도 격자(180°W–180°E, 90°S–90°N, 격자 경계가 날짜변경선)
  vertical: >-
    L2 표준 산출: 기온 28개 기압면(1100~0.1 hPa), 수증기 15개 면(표준 기압면의 아래쪽 15개) / L3: 기온·지오퍼텐셜 고도 24개 기압면
    (1000~1 hPa, `StdPressureLev`), 수증기 12개 면(1000~100 hPa, `H2OPressureLev`)과 12개 층(`H2OPressureLay`)
  temporal: >-
    L2: 6분 그래뉼(하루 240개), 궤도 주기 98.8분, 16일(233궤도) 반복 / L3: 일(상승·하강 궤도 별도 격자) · 월(일자료 평균).
    V7에는 8일 산출물이 없습니다. 준실시간(NRT) L2는 관측 후 약 3시간 안에 나옵니다.

update: "매일 (표준 산출은 관측 후 72시간 안, NRT는 약 3시간 안). 월자료는 다음 달 초~중순"
