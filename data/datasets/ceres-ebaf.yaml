    method: Earthdata Search / earthaccess (NetCDF4)
    note: 파일 단위 다운로드는 NASA Earthdata 로그인(무료)이 필요합니다.
  - name: Copernicus CDS — Earth's radiation budget (CERES EBAF 포함)
    url: https://cds.climate.copernicus.eu/datasets/satellite-earth-radiation-budget
