  acknowledgement: >-
    CERES 팀은 논문에 'CERES_EBAF_Ed4.2.1'처럼 판 이름을 적고, 자료를 받은 경로로 NASA Langley CERES 주문 도구
    (https://ceres.larc.nasa.gov/data/)를 밝혀 달라고 요청합니다. ASDC는 "These data were obtained from the NASA Langley Research Center
    Atmospheric Science Data Center." 문구를 권장합니다. TOA를 쓰면 Loeb et al. (2018), 지표 복사를 쓰면 Kato et al. (2018)을 인용하세요.

notices:
  - date: "2026-09-10"
    level: warning
    title: 2026년 3월 지표 자료 교체 — 6~7월에 받았다면 다시 받기
    body: >-
      에어로졸 광학두께가 낮게 처리된 2026년 3월 파일이 6월부터 7월까지 약 한 달간 배포되었다가 수정본으로 교체되었습니다.
      지표 단파·장파(전천·청천)와 지표 구름 복사 효과가 영향을 받았습니다. 이 기간에 받은 파일은 다시 받으세요.
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
  - date: "2026-03-20"
    level: info
    title: Terra 과학 운영 2027년 2월 종료 전망 — EBAF는 NOAA-20 기반
    body: >-
      NASA는 연료·전력 한계로 Terra의 과학 운영이 2027년 2월 끝날 것으로 내다봤습니다. Terra의 CERES FM2는 2025년 1월 꺼졌습니다.
      CERES DQS에 따르면 EBAF는 Terra·Aqua 궤도 표류 때문에 이미 2022년 4월부터 NOAA-20 단독 기록으로 전환되어 있습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2025-12-29"
    level: info
    title: 후속 측기 Libera는 JPSS-4 탑재로 변경 (2027년 발사 목표)
    body: >-
      CERES 기록을 이을 Libera가 JPSS-3 대신 JPSS-4(궤도 진입 후 NOAA-22)에 실리게 되었고, NOAA는 2027년 발사를 목표로 밝혔습니다.
      그때까지 EBAF는 NOAA-20의 CERES FM6 한 대에 의존합니다.
    source: https://science.nasa.gov/science-research/earth-science/the-state-of-ceres-updates-and-highlights
  - date: "2025-03-14"
    level: warning
    title: Ed4.2.1 지표 자료 공개 — 2022년 4월 이후는 Ed4.2.1 사용 권장
    body: >-
      TOA(2024-11-25)에 이어 지표·CRE 자료도 Ed4.2.1로 공개되었습니다. 2022년 4월~2024년 7월이 MERRA-2 입력으로 재처리되었고,
      2024년 8월부터는 Ed4.2.1로만 생산됩니다. 2022년 3월까지는 Ed4.2와 같습니다.
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
  - date: "2024-01-02"
    level: info
    title: EBAF Ed4.2 공개, Ed4.1 대체
    body: Ed4.2가 공개되어 Ed4.1을 대체했습니다. 이후 2022년 4월 이후 구간이 Ed4.2.1로 개정되었습니다(2024-11 TOA, 2025-03 지표).
    source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf

