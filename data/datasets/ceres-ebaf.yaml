# CERES EBAF — 데이터셋 정보 파일
# 대기 탭 '복사 자료'에 싣습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: ceres-ebaf
name: CERES EBAF Ed4.2.1
full_name: CERES Energy Balanced and Filled (EBAF) Edition 4.2.1 (에너지 균형을 맞추고 빈 곳을 채운 CERES 월평균 복사수지 자료)
category: satellite
domain: atmosphere
group: 복사 자료
order: 10
domains: [대기, 육지, 해양]
provider: NASA Langley Research Center (LaRC) CERES 팀 / Atmospheric Science Data Center (ASDC)

status: active
status_note: >-
  Ed4.2.1이 현재 판으로 매월 갱신되며, 대기 상단(TOA) 자료는 약 2~3개월 뒤, 지표 자료는 그보다 늦게 나옵니다.
  2022년 4월부터는 궤도가 표류하는 Terra·Aqua 대신 NOAA-20 한 위성(CERES FM6)만으로 이어지고 있어,
  후속 측기 Libera(JPSS-4, 2027년 발사 목표)가 올라가기 전까지는 사실상 단일 측기에 의존합니다.

transitions:
  - from: EBAF Ed4.2
    to: EBAF Ed4.2.1
    status: completed
    date: "2025-03"
    summary: 2022년 4월 이후 구름 산출에 쓰는 대기 입력을 GEOS-5.4.1에서 MERRA-2로 바꾼 개정판입니다. 2022년 3월까지는 Ed4.2와 같고, Ed4.2는 2024년 7월에서 멈췄습니다.
    changes:
      - aspect: 공개 시점
        before: 2024-01-02
        after: TOA 2024-11-25, 지표 2025-03-14
      - aspect: 기간
        before: 2000-03–2024-07 (이후 생산 중단)
        after: 2000-03–현재 (2022-04–2024-07 재처리, 2024-08부터 Ed4.2.1로 생산)
      - aspect: 구름 산출용 대기 입력
        before: GEOS-5.4.1 (2024년 7월 운영 종료)
        after: 2022년 4월부터 MERRA-2 (그 이전은 GEOS-5.4.1 그대로)
      - aspect: 해수면온도 입력
        before: GEOS-5.4.1 SST
        after: 2022년 4월부터 MERRA-2 SST
      - aspect: 알려진 문제 수정
        before: 일부 결측, 부분 구름 영역 협대역→광대역 계수 오류, 태양 반사광(glint) 코딩 오류
        after: 결측 대부분 복구, 계수 수정, glint 오류는 2024년 3월 자료부터 수정
      - aspect: 지표 복사
        before: MODIS→VIIRS 전환에 따른 에어로졸 광학두께 불연속, 극지 지표 플럭스 추세 신뢰 어려움
        after: 에어로졸 불연속 보정, 극지 추세 문제 완화
    impacts:
      - 2000년 3월~2022년 3월 값은 두 판이 같습니다. 2022년 4월 이후 값을 쓰는 분석은 Ed4.2.1로 통일하고 두 판을 섞지 마세요.
      - 차이는 작지만, 2022년 4월~2024년 7월 Ed4.2로 낸 결과는 Ed4.2.1로 다시 확인하는 것이 좋습니다.
      - 파일 속 판 번호·공개 날짜를 데이터 품질 요약(DQS)과 대조하라는 것이 CERES 팀 권고입니다.
    sources:
      - name: CERES EBAF Ed4.2/Ed4.2.1 Data Quality Summary (V8, 2026-09-10)
        url: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
      - name: ECMWF Forum — Reprocessed CERES EBAF (Ed 4.2.1) now available (2025-06-05)
        url: https://forum.ecmwf.int/t/reprocessed-ceres-ebaf-ed-4-2-1-now-available/13343

period:
  start: "2000-03"
  end: present
  note: >-
    2026-10-12 확인 시 CERES 자료 페이지 기준 EBAF-TOA는 2026년 7월, TOA·지표 통합 EBAF는 2026년 5월까지 있습니다.
    2000년 3월~2002년 6월은 Terra 단독, 2002년 7월~2022년 3월은 Terra+Aqua, 2022년 4월부터는 NOAA-20 단독 관측입니다.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1개월"
  spatial: "1°×1° 위경도 격자(지역) + 1° 위도 띠 동서 평균 + 전지구 평균"
  vertical: 대기 상단(TOA)과 지표 2개 면
  temporal: 월평균 (2005-07~2015-06 기후값 별도 제공)

update: 매월 (TOA 약 2~3개월 지연, 지표는 그보다 늦음)
license: NASA 지구과학 자료 공개 정책에 따라 제한 없이 이용 가능 — 인용·감사 문구 요청
account_required: false

summary: >-
  NASA CERES 측기로 관측한 대기 상단(TOA) 단파·장파·순복사를 월평균 1° 격자로 정리한 기후자료기록(CDR)입니다.
  전지구 순복사가 해양 열 저장량 관측과 맞도록 '에너지 균형'을 맞추고, 맑은 하늘 플럭스의 빈 곳을 '채워' 지역적으로 완전한 값을 제공합니다.
  같은 파일 묶음에 복사전달 계산으로 구한 지표 복사(상·하향, 순복사)와 구름 복사 효과, 구름 특성도 들어 있어
  지구 에너지 불균형, 구름 피드백, 모델 검증에 표준처럼 쓰입니다.

time_convention:
  summary: >-
    모든 변수는 달마다의 평균값(W m-2 등)이며, 특정 시각의 순간값이 아닙니다. 기후값(_clim) 변수는 2005년 7월~2015년 6월
    기준 기간의 월별 평균입니다.
  points:
    - "TOA 변수 이름은 끝이 `_mon`(월평균)과 `_clim`(기후값)으로 나뉩니다. 앞에 `z`가 붙으면 동서 평균, `g`가 붙으면 전지구 평균입니다(Ed4.1 파일 메타데이터 기준)."
    - "파일의 time 단위는 'days since 2000-03-01 00:00:00'이고, 기후값 축은 별도 차원(ctime)입니다(Ed4.1 파일 기준)."
    - "지표 순복사는 '하향 − 상향'으로, 양수면 지표가 에너지를 얻는 것입니다. 구름 복사 효과(CRE)는 '전천 − 청천' 플럭스입니다."
    - "청천(clear-sky) 플럭스는 1° 격자 안 구름 없는 부분에서 구한 값으로, 전천과 표본이 달라 가끔 양의 단파 CRE·음의 장파 CRE 같은 비물리적 값이 생깁니다."
    - "실시간 처리 월자료는 다음 달 1일을 포함하지 않고(약 2개월 지연을 위해), 재처리 기록에는 포함됩니다."
    - "구름 광학두께(cldtau)는 주간에만, 나머지 구름 특성은 주야간 평균입니다."
  source: https://ceres.larc.nasa.gov/documents/DQ_summaries/CERES_EBAF_Ed4.2_DQS.pdf
  source_name: CERES EBAF Ed4.2/Ed4.2.1 Data Quality Summary (V8) + EBAF-TOA Ed4.1 파일 메타데이터

variables:
  note: >-
    TOA·구름 변수명은 EBAF-TOA Ed4.1 NetCDF 파일 메타데이터에서 확인한 이름이며, Ed4.2.1에서도 같은지 받은 파일로 확인하세요.
    지표 변수는 공식 문서에 파일 속 이름이 적혀 있지 않아 설명만 적었습니다. 모든 플럭스 단위는 W m-2입니다.
  full_list: https://ceres.larc.nasa.gov/data/
  groups:
    - name: 대기 상단(TOA) 복사 — EBAF-TOA
      kind: mean
      period: 월
      items:
        - "입사 태양복사 — `solar_mon` (W m-2)"
        - "TOA 반사 단파(전천) — `toa_sw_all_mon` (W m-2)"
        - "TOA 방출 장파(OLR, 전천) — `toa_lw_all_mon` (W m-2)"
        - "TOA 순복사(전천) — `toa_net_all_mon` (W m-2)"
        - "TOA 단파·장파·순복사(청천) — `toa_sw_clr_c_mon`, `toa_lw_clr_c_mon`, `toa_net_clr_c_mon` (W m-2)"
        - text: "기후값(2005-07~2015-06) — `toa_sw_all_clim` 등 `_clim` 변수 (W m-2)"
          note: 같은 달끼리 평균한 월별 기후값
    - name: 구름 특성 (CERES-MODIS/VIIRS)
      kind: mean
      period: 월
      items:
        - "구름 면적비(주야간) — `cldarea_total_daynight_mon` (%)"
        - "구름 유효 기압(주야간) — `cldpress_total_daynight_mon` (hPa)"
        - "구름 유효 온도(주야간) — `cldtemp_total_daynight_mon` (K)"
        - text: "구름 가시 광학두께(주간) — `cldtau_total_day_mon` (무차원)"
          note: 주간 관측만 평균
    - name: 지표 복사·구름 복사 효과 (EBAF 통합 파일, 계산값)
      kind: mean
      period: 월
      items:
        - text: "지표 하향·상향 단파복사(전천·청천) (W m-2)"
          note: "공식 문서에 파일 속 변수명이 없어 받은 파일에서 확인 필요"
        - text: "지표 하향·상향 장파복사(전천·청천) (W m-2)"
          note: "공식 문서에 파일 속 변수명이 없어 받은 파일에서 확인 필요"
        - text: "지표 순 단파·장파·총 순복사 (W m-2)"
          note: "공식 문서에 파일 속 변수명이 없어 받은 파일에서 확인 필요"
        - text: "TOA·지표 구름 복사 효과(단파·장파·순) (W m-2)"
          note: "공식 문서에 파일 속 변수명이 없어 받은 파일에서 확인 필요"

