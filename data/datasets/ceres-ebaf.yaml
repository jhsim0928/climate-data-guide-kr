example:
  lang: python
  note: "NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행합니다. 변수명은 받은 파일에서 다시 확인하세요."
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import numpy as np
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(short_name="CERES_EBAF-TOA", version="Edition4.2.1")
    files = earthaccess.download(results[:1], "./ceres")

    ds = xr.open_dataset(files[0])
    net = ds["toa_net_all_mon"]          # TOA 순복사 (W m-2), 1° 월평균
    w = np.cos(np.deg2rad(ds["lat"]))
    print(net.weighted(w).mean(("lat", "lon")).sel(time="2024"))  # 전지구 평균(면적 가중)

tips:
  - EBAF는 '균형을 맞춘' 자료라 전지구 순복사의 절대값은 해양 열 저장량 추정에 맞춰져 있습니다. 순복사 변화(추세·편차)는 관측에서 오지만, 절대 수준 자체를 독립 관측으로 보지는 마세요.
  - 2002년 7월(Aqua 합류)과 2022년 4월(NOAA-20 단독 전환) 전후로 구름 특성에 불연속이 있을 수 있습니다. 구름 특성 장기 추세는 이 시점을 확인하세요.
  - 지표 플럭스는 관측이 아니라 구름·대기 입력으로 계산한 값입니다. 안데스·티베트·중동부 아프리카처럼 보정이 큰 곳은 편차가 잡음일 수 있고, 2006년 3월 이전 육지 근지표 온도는 MERRA-2 SST의 거친 해상도 영향을 받습니다.
  - DQS(V8)는 Ed4.2.1에서 북극 극야(polar night) 구름량이 과보정(최대 20~30%)되었다고 밝히고 있습니다. 극야 구름·복사 상관 분석에는 주의하세요.
  - 2024년 2월 3~5일 결측은 두 판 모두 남아 있습니다. 해당 월 값을 쓸 때 DQS의 결측 안내를 확인하세요.
  - 일·시간 단위 복사가 필요하면 EBAF가 아니라 CERES SYN1deg 제품을 봐야 합니다.

