          pages   = {4501--4527},
          year    = {2018},
          doi     = {10.1175/JCLI-D-17-0523.1}
        }
    - label: 위성 전환 간 TOA 연속성 (NOAA-20 이어붙이기)
      text: >-
        Loeb, N. G., et al. (2024): Continuity in top-of-atmosphere Earth radiation budget observations. Journal of Climate.
        (CERES EBAF DQS가 권장하는 참고문헌)
      doi: 10.1175/JCLI-D-24-0180.1
      bibtex: |
        @article{loeb2024continuity,
          author  = {Loeb, Norman G. and others},
