notices:
  - date: "2026-01-19"
    level: info
    title: CEDA의 OC-CCI v6.0 자료 다운로드 복구 (2025-11-20부터 중단)
    body: >-
      CEDA는 2025년 11월 20일 OC-CCI v6.0 기록(사인 격자 chlor_a 등)의 내려받기가 일시 중단되었다고 알렸고, 2026년 1월 19일 온라인 접근이 복구되었다고 공지했습니다.
      이 기간에 실패한 자동 내려받기는 다시 돌리세요.
    source: https://catalogue.ceda.ac.uk/uuid/474ac06235e54e6cb0ec6eed635e1213/
  - date: "2025-05"
    level: info
    title: OC-CCI CCI+ 2단계 시작 — v7.0 준비
    body: >-
      해색 과제가 2025년 5월 CCI+ 2단계에 들어가 같은 컨소시엄으로 기록 연장과 개선을 이어 갑니다. 처리 체계는 Copernicus 운영 환경으로 옮겨졌고,
      v6.0 사용자 안내서는 다음 판 v7.0을 2025~2026년에 공개할 계획이라고 적었습니다(2026-10-13 확인 시 미공개).
    source: https://climate.esa.int/en/projects/ocean-colour/about/
  - date: "2023-08-08"
    level: info
    title: OC-CCI v6.0 4 km 자료 모음 CEDA 공개 (DOI 부여)
    body: >-
      1997-09-04~2022-12-31 v6.0 4 km 자료(사인·위경도 격자, 일·5일·8일·월·연 합성, 월 기후값)가 CEDA에 보관되고 모음 DOI 10.5285/5011d22aae5a4671b0cbc7d05c56c4f0이 붙었습니다.
      Sentinel-3B OLCI 추가, MERIS 4차 재처리, OLCI 처리 오류 수정, QAA v6 적용이 v5.0과의 주요 차이입니다.
    source: https://catalogue.ceda.ac.uk/uuid/5011d22aae5a4671b0cbc7d05c56c4f0/
  - date: "2022-06-01"
    level: warning
    title: C3S CDS v5.0의 2020-12~2021-02 반사도 급변 문제 — v5.0.1로 수정
    body: >-
      C3S CDS판 v5.0에서 2020년 12월~2021년 2월 원격 반사도가 비정상적으로 뛰는 문제가 보고되었고, 이를 고친 v5.0.1이 CDS에 올라왔습니다.
      CDS 양식에서 v5.0과 v5.0.1은 이제 폐기 예정(deprecated)으로 표시되고 v6.0이 기본입니다.
    source: https://cds.climate.copernicus.eu/datasets/satellite-ocean-colour?tab=documentation
  - date: "2021-05-19"
    level: info
    title: OC-CCI v5.0 공개 — OLCI 처음 포함
    body: >-
      Sentinel-3A OLCI를 처음 넣은 v5.0(1997-09~2020-12, DOI 10.5285/1dbe7a109c0244aaad713e078fd3059a)이 공개되었습니다. 지금은 v6.0으로 대체되었습니다.
    source: https://climate.esa.int/en/projects/ocean-colour/data/

transitions:
  - from: OC-CCI v5.0
    to: OC-CCI v6.0
    status: completed
    summary: >-
      Sentinel-3B OLCI를 더하고 MERIS 4차 재처리를 쓰며, OLCI 처리 오류 수정·대리 교정(SVC)과 마스크 갱신·QAA v6을 적용한 판입니다.
      2019년 이후 MODIS·VIIRS를 빼서 최근 기간의 센서 구성이 바뀌었습니다.
    changes:
      - aspect: 기간 (CEDA CDR)
        before: 1997-09-04~2020-12-31
        after: 1997-09-04~2022-12-31 (이후 C3S·PML 연장분)
      - aspect: 입력 센서
        before: SeaWiFS, MERIS(이전 재처리), MODIS-Aqua, VIIRS, OLCI-A
        after: "SeaWiFS, MERIS(4차 재처리), MODIS-Aqua·VIIRS(2019년까지), OLCI-A, OLCI-B(2018~)"
      - aspect: IOP·Kd(490) 알고리즘
        before: v5.0 체계
        after: "IOP는 QAA_v6G(Zhang 후방산란 계수), Kd(490)는 Zhang 계수를 쓴 Lee 방식"
      - aspect: 처리 개선
        before: "-"
        after: OLCI 처리 오류 수정, 대리 교정(SVC)·마스크 갱신
      - aspect: DOI
        before: 10.5285/1dbe7a109c0244aaad713e078fd3059a
        after: 10.5285/5011d22aae5a4671b0cbc7d05c56c4f0
    impacts:
      - 두 판을 한 시계열로 이어 붙이지 마세요. 2019년 이후는 입력 센서가 달라 채움률과 값이 v5.0과 다릅니다.
      - C3S CDS에서 받을 때 version 값을 6_0으로 명시하세요. 5_0·5_0_1은 폐기 예정입니다.
    sources:
      - name: C3S CDS 데이터셋 개요 (v6.0 변경 사항)
        url: https://cds.climate.copernicus.eu/datasets/satellite-ocean-colour?tab=overview
      - name: OC-CCI Product User Guide v6.5 (D4.2)
        url: https://www.climate.esa.int/documents/3068/D4.2_-_OC-CCI_Product_User_Guide_PUG_v6.5b.docx
      - name: CEDA — v5.0 기록 (Superseded)
        url: https://catalogue.ceda.ac.uk/uuid/8154e881452f49c1ba86982ed88b20f0
  - from: OC-CCI v6.0
    to: OC-CCI v7.0
    status: planned
    summary: >-
      CCI+ 2단계에서 준비 중인 다음 판입니다. 현장 자료 데이터베이스 갱신과 교정 재평가, OLCI 시대의 새 파장(400·620·681·709 nm) 추가가 계획되어 있습니다. 공개 일정은 발표되지 않았습니다.
    changes:
      - aspect: 반사도 파장 (OLCI 시대)
        before: 412·443·490·510·560·665 nm
        after: 기존 6개 + 400·620·681·709 nm 추가 계획
      - aspect: 공개 시점
        before: v6.0 (CEDA 2023-08)
        after: 사용자 안내서상 2025~2026년 계획, 2026-10-13 확인 시 미공개
    impacts:
      - v7.0이 나오면 전 기간이 재처리되므로 v6.0과 섞지 말고 판을 분명히 적으세요.
    sources:
      - name: OC-CCI Product User Guide v6.5 (v7.0 계획)
        url: https://www.climate.esa.int/documents/3068/D4.2_-_OC-CCI_Product_User_Guide_PUG_v6.5b.docx
      - name: IOCS 2025 기관 발표 (NCEO, OC-CCI V7 계획)
        url: https://iocs.ioccg.org/wp-content/uploads/2025/12/AgencyTalk_Groom_NCEO_rr.pdf

