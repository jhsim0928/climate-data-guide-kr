# ─────────────────────────────────────────────────────────────
# ESA Ocean Colour CCI (OC-CCI) v6.0 — 데이터셋 정보 파일
# 위성 탭(해색), 해양 탭(위성 관측 자료) 교차 수록. SeaWiFS·MERIS·MODIS·VIIRS·OLCI 반사도를 MERIS 기준으로 맞춰 병합한 4 km L3 해색 기후자료.
# 2026-10-13 확인 시 CEDA의 v6.0 기후자료기록은 2022-12-31까지, 같은 v6.0 체계의 C3S CDS판은 일자료 2026-03-31·월자료 2026-06까지 있습니다. v7.0은 아직 공개 전입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: oc-cci
name: ESA OC-CCI v6.0
full_name: >-
  ESA Ocean Colour Climate Change Initiative (Ocean_Colour_cci) Version 6.0, 4km resolution data
  (다위성 병합 해색 기후자료 — PML 생산, CEDA 보관, C3S "Ocean colour from 1997 to present derived from satellite observations"로 연장 배포)
category: satellite
domain: satellite
group: 해색
order: 40
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 원격탐사]
provider: >-
  ESA Climate Change Initiative Ocean Colour 과제(Plymouth Marine Laboratory(PML) 생산, NERC NEODAAS 지원) / CEDA 보관 /
  Copernicus Climate Change Service(C3S) Climate Data Store 배포

status: active
status_note: >-
  v6.0이 현재판입니다. CEDA에 보관된 v6.0 기후자료기록(CDR)은 1997-09-04~2022-12-31이고, 그 뒤는 같은 v6.0 체계로 분기마다 덧붙이는 연장분이 PML(oceancolour.org)과 C3S CDS로 나옵니다.
  2026-10-13 확인 시 C3S CDS의 v6.0은 일자료가 2026-03-31, 월자료가 2026-06까지 있습니다(CDS 갱신일 2026-09-05). 2025년 5월 CCI+ 2단계가 시작되었고,
  사용자 안내서는 v7.0을 2025~2026년에 공개할 계획이라고 적었으나 아직 공개되지 않았습니다.

period:
  start: "1997-09"
  end: present
  note: >-
    SeaWiFS 자료가 시작되는 1997-09-04부터입니다. CEDA의 v6.0 기록은 2022-12-31에서 끝나며(상태 Completed), 2023년 이후는 C3S CDS와 PML 서버의 연장분입니다.
    PML 서버의 최신 날짜는 자동 읽기가 막혀 확인하지 못했습니다. 1997~2000년 SeaWiFS 단독 기간에는 자료가 빠진 날이 있습니다.

resolution:
  spatial_short: "4 km (0.04°)"
  temporal_short: "1일"
  spatial: >-
    두 가지 격자로 제공. 사인(sinusoidal) 등면적 4 km 격자(위도 4320줄, 파일 차원 [time, bin_index]) /
    위경도 격자 8640×4320(파일 차원 [time, lat, lon], C3S는 0.042°×0.042°, 적도에서 4 km로 안내). PML은 엽록소·반사도만 1 km 제품도 따로 냅니다
  vertical: 해면 위성 관측(원격 반사도와 그로부터 구한 표층 물성)
  temporal: >-
    일·5일·8일·월·연 합성(L3, 빈칸을 채우지 않은 값)과 월 기후값(1997~2022). 사용자 안내서는 8일·월 합성을 공식 제품으로, 5일 등은 요청에 따라 만든다고 적고 있습니다.
    C3S CDS판은 일·월만 제공합니다

coverage:
  short: 전지구
  note: "바다만 대상. 구름과 해빙이 없는 곳에서만 값이 있음(L3, 빈칸 채우지 않음)"
update: >-
  PML이 현재판(v6.0)을 분기마다 연장합니다. C3S CDS도 분기 갱신이며 지연을 9~12개월로 안내합니다. CEDA의 v6.0 CDR 기록은 갱신 계획이 없습니다
license: >-
  무료·공개. ESA CCI 해색 자료 이용 조건(Terms and Conditions)에 따르며 출처 표기와 인용을 요구합니다.
  C3S CDS판은 CC BY 4.0과 ESA CCI 필수기후변수(ECV) 제품 라이선스를 함께 적용합니다
account_required: false

summary: >-
  ESA 기후변화 이니셔티브(CCI) 해색 과제가 만든 다위성 병합 해색 기후자료입니다. SeaWiFS·MERIS·MODIS-Aqua·VIIRS(S-NPP)·OLCI(Sentinel-3A·3B)의 원격 반사도(Rrs)를
  MERIS 6개 파장으로 맞추고(band shifting) 센서 간 편차를 보정해 병합한 뒤, 엽록소 a·Kd(490)·고유광학특성(IOP)을 계산합니다. 모든 값에 화소별 불확도(RMSD·편차)가 붙고,
  엽록소는 광학 수형(water class)별 알고리즘을 소속도로 가중 혼합해 구합니다. v5.0부터는 C3S가 같은 처리 체계로 생산해 C3S CDS에서 엽록소·반사도를 계속 연장 배포합니다.

time_convention:
  summary: >-
    모든 값은 합성 기간(일·5일·8일·월·연) 동안 들어온 관측의 평균인 L3 합성장이며, 관측이 없는 칸은 비어 있습니다. 일 합성은 UTC 기준 '자료일(data-day)'로 묶어
    실제로는 24~28시간에 걸친 관측이 들어갈 수 있습니다. 파일마다 time 차원은 길이 1이고 파일 이름에 대표 날짜가 붙습니다.
  points:
    - "파일 이름의 날짜는 일 합성 YYYYMMDD, 월 합성 YYYYMM입니다. 8일 합성은 해마다 1월 1일부터 8일 간격(20220101, 20220109, … 20221227)으로 이름이 붙습니다. 사용자 안내서는 이 날짜가 구간의 어느 시점인지 밝히지 않으므로 파일 속 time과 메타데이터로 확인하세요."
    - "엽록소는 로그정규분포를 따르므로 평균·추세 같은 통계는 log10으로 바꿔 계산한 뒤 되돌리라고 안내합니다. 엽록소 불확도(chlor_a_log10_rmsd·bias)도 log10 값 기준입니다."
    - "불확도 변수를 여러 날로 합칠 때 단순 평균하지 말고 사용자 안내서의 합성 식(2.12~2.15)을 따르세요."
    - "nobs 변수는 그 칸·그 합성 기간에 들어간 관측(센서별) 수입니다. 0에 가까우면 하루 한두 번의 관측이 합성값 전체를 대표합니다."
  source: https://www.climate.esa.int/documents/3068/D4.2_-_OC-CCI_Product_User_Guide_PUG_v6.5b.docx
  source_name: OC-CCI Product User Guide (D4.2, Issue 6.5, 2024-04-23, v6.0)

variables:
  note: >-
    변수 이름은 v6.0 사용자 안내서(PUG) 기준입니다. 반사도·IOP 파장은 MERIS 기준 412·443·490·510·560·665 nm입니다. 모두 float32이고 결측이 있습니다.
    C3S CDS판은 chlor_a와 Rrs(와 관측 수)만 들어 있습니다. 센서별 관측 수 이름은 PUG에 MODIS_nobs와 MODISA_nobs가 섞여 있으니 파일에서 확인하세요.
  full_list: https://www.climate.esa.int/documents/3068/D4.2_-_OC-CCI_Product_User_Guide_PUG_v6.5b.docx
  groups:
    - name: 해색 산출물 (L3 합성, 4 km)
      kind: mean
      period: 합성 기간(일·5일·8일·월·연)
      items:
        - text: "엽록소 a 농도 — `chlor_a` (mg m-3)"
          note: OCI·OCI2·OC2·OCx를 광학 수형 소속도로 가중 혼합
        - "원격 반사도 — `Rrs_412`·`Rrs_443`·`Rrs_490`·`Rrs_510`·`Rrs_560`·`Rrs_665` (sr-1)"
        - text: "490 nm 확산 감쇠 계수 — `kd_490` (m-1)"
          note: IOP로부터 Lee et al. (2005) 방법으로 계산
        - text: "식물플랑크톤 흡수 계수 — `aph_412`~`aph_665` (m-1)"
          note: QAA_v6 기반
        - "용존·쇄설 유기물 흡수 계수 — `adg_412`~`adg_665` (m-1)"
        - text: "총 흡수 계수 — `atot_412`~`atot_665` (m-1)"
          note: 편의용 변수(불확도 없음)
        - text: "입자 후방산란 계수 — `bbp_412`~`bbp_665` (m-1)"
          note: 현장 자료 부족으로 불확도 없음
    - name: 화소별 불확도 (현장 관측 대조 기반)
      kind: mean
      period: 합성 기간
      items:
        - text: "엽록소 불확도 — `chlor_a_log10_rmsd`·`chlor_a_log10_bias`"
          note: log10(엽록소) 기준 RMSD·편차
          std: []
        - text: "반사도 불확도 — `Rrs_<파장>_rmsd`·`Rrs_<파장>_bias`"
          std: []
        - text: "Kd(490) 불확도 — `kd_490_rmsd`·`kd_490_bias`"
          std: []
        - text: "흡수 계수 불확도 — `aph_<파장>_rmsd`·`aph_<파장>_bias`, `adg_<파장>_rmsd`·`adg_<파장>_bias`"
          std: []
    - name: 광학 수형·관측 수
      kind: mean
      period: 합성 기간
      items:
        - text: "광학 수형 소속도 — `water_class1`~`water_class14`"
          note: 14개 광학 수형에 대한 소속 정도. 엽록소 알고리즘 혼합과 불확도 배정에 쓰임
          std: []
        - text: "관측 수 — `total_nobs`, 센서별 `SeaWiFS_nobs`·`MERIS_nobs`·`MODISA_nobs`·`VIIRS_nobs`·`OLCI-A_nobs`·`OLCI-B_nobs` (개)"
          kind: accum
          note: 합성 기간 동안 그 칸에 들어간 관측 수(실수형)
          std: []

access:
  - name: CEDA Archive — OC-CCI v6.0 4 km 모음 (CDR, 1997-09~2022-12)
    url: https://catalogue.ceda.ac.uk/uuid/5011d22aae5a4671b0cbc7d05c56c4f0/
    method: HTTPS 직접 다운로드 / OPeNDAP / THREDDS (data.cci.ceda.ac.uk)
    note: >-
      등록 없이 받을 수 있습니다. 경로 예 esacci/ocean_colour/data/v6.0-release/geographic/netcdf/all_products/monthly/v6.0/2022/
      ESACCI-OC-L3S-OC_PRODUCTS-MERGED-1M_MONTHLY_4km_GEO_PML_OCx_QAA-202212-fv6.0.nc. chlor_a만 담은 가벼운 파일은 netcdf/chlor_a/ 아래에 있습니다.
      v1~v5.0 이전 판도 같은 THREDDS(https://data.cci.ceda.ac.uk/thredds/catalog/esacci/ocean_colour/data/catalog.html)에 있습니다.
    login: false
  - name: PML oceancolour.org (THREDDS·OPeNDAP·FTP·웹 GIS)
    url: https://www.oceancolour.org/
    method: THREDDS(NetcdfSubset으로 위경도·기간 부분 추출, OPeNDAP), FTP, 합성장 브라우저, 웹 GIS 포털
    note: >-
      FAQ는 이곳을 현재판의 가장 최신 자료(4 km 전 변수, 1 km 엽록소·반사도)가 있는 곳으로 안내합니다. NetcdfSubset은 한 번에 4 GB를 넘을 수 없어
      Stride로 줄이라고 합니다. FTP 접속 정보는 ESA 자료 페이지에 공개되어 있습니다. Mac 일부 FTP 프로그램은 4 GB가 넘는 월 합성 파일을 깨뜨리니 터미널을 쓰라고 안내합니다.
  - name: C3S Climate Data Store (satellite-ocean-colour)
    url: https://cds.climate.copernicus.eu/datasets/satellite-ocean-colour
    method: 웹 다운로드 / CDS API(cdsapi)
    note: >-
      ECMWF 계정과 이용 조건 동의가 필요합니다. 변수는 mass_concentration_of_chlorophyll_a, remote_sensing_reflectance 두 가지, version은 6_0(5_0_1·5_0은 폐기 예정 표시),
      projection은 regular_latitude_longitude_grid 또는 sinusoidal_grid, temporal_resolution은 daily·monthly입니다.
  - name: Copernicus Marine — OCEANCOLOUR_GLO_BGC_L3_MY_009_107 / L4_MY_009_108 (ESA-CCI 기반)
    url: https://data.marine.copernicus.eu/product/OCEANCOLOUR_GLO_BGC_L3_MY_009_107/description
    method: Copernicus Marine Toolbox / Marine Data Store
    note: >-
      ESA-CCI 입력으로 만든 엽록소·식물플랑크톤 크기군·반사도(L3 일, L4 월) 제품입니다(데이터셋 c3s_obs-oc_glo_bgc-plankton_my_l3-multi-4km_P1D 등).
      2026-10-13 확인 시 카탈로그 기간은 2025-12까지이고 갱신은 비정기입니다. Copernicus Marine 계정(무료)이 필요합니다.
  - name: Google Earth Engine (COPERNICUS/MARINE/SATELLITE_OCEAN_COLOR/V6)
    url: https://developers.google.com/earth-engine/datasets/catalog/COPERNICUS_MARINE_SATELLITE_OCEAN_COLOR_V6
    method: 클라우드 분석 (C3S 일자료의 chlor_a·Rrs·관측 수)
    note: 2026-10-13 확인 시 2026-03-31까지 들어와 있습니다.

example:
  lang: python
  note: >-
    CEDA THREDDS의 OPeNDAP으로 v6.0 월 합성 엽록소 파일 하나를 열어 한반도 주변을 잘라 봅니다(로그인 불필요). 2023년 이후 자료는 C3S CDS(cdsapi) 또는 PML 서버에서 받으세요.
  code: |
    # pip install xarray netCDF4 numpy
    import numpy as np
    import xarray as xr

    url = ("https://data.cci.ceda.ac.uk/thredds/dodsC/esacci/ocean_colour/data/v6.0-release/"
           "geographic/netcdf/chlor_a/monthly/v6.0/2022/"
           "ESACCI-OC-L3S-CHLOR_A-MERGED-1M_MONTHLY_4km_GEO_PML_OCx-202211-fv6.0.nc")
    ds = xr.open_dataset(url)
    chl = ds["chlor_a"].sel(lon=slice(120, 132))
    chl = chl.where((chl.lat >= 30) & (chl.lat <= 40), drop=True)   # 한반도 주변
    # 엽록소는 로그정규분포 — 영역 평균은 log10에서 구한 뒤 되돌립니다
    print(float(10 ** np.log10(chl).mean()))

tips:
  - 연안·탁한 바다(황해·남해 연안 등)는 불확도가 대체로 크고, 엽록소가 아닌 부유물·용존 유기물이 광학 특성을 좌우할 수 있다고 FAQ가 경고합니다. 연안 분석에는 불확도 변수와 광학 수형 소속도를 함께 보세요.
  - "엽록소는 로그정규분포입니다. 영역 평균·기후값·추세는 log10으로 바꿔 계산하세요. 위경도 격자 파일로 통계를 내면 고위도 칸이 넓이보다 크게 반영되니 면적 가중을 하거나 사인 격자 파일을 쓰세요."
  - v6.0에서는 MODIS·VIIRS를 2019년 이후 기록에서 뺐습니다. 최근 몇 년의 공간 채움률·성능은 v5.0과 다르고, 센서 구성이 바뀌는 시점(2002·2012·2016·2020년 전후)에 남은 센서 간 편차가 있을 수 있어 장기 추세 분석에 주의하세요.
  - 1997~2000년 SeaWiFS 단독 기간에는 빠진 날이 있고, 2022년 1월 훙가 통가 화산 폭발 같은 큰 사건은 엽록소 이상값을 만들 수 있다고 사용자 안내서가 적고 있습니다.
  - "v6.0, v5.0, v5.0.1, v4.2 등은 입력 센서·재처리·알고리즘이 달라 섞어 쓰지 마세요. C3S CDS의 v5.0은 2020-12~2021-02 반사도 급변 문제가 있어 v5.0.1로 고쳐졌습니다."
  - L3 합성은 빈칸을 채우지 않습니다. FAQ는 빈칸 채운 L4가 L3보다 오차 특성이 나쁘다며 제공하지 않는다고 밝힙니다. 빈칸 없는 일자료가 필요하면 Copernicus Marine의 GlobColour gap-free 제품을 검토하세요.
  - "C3S CDS판은 엽록소·반사도만 있습니다. Kd(490)·IOP·불확도·광학 수형까지 필요하면 CEDA(2022년까지)나 PML 서버에서 받으세요."

