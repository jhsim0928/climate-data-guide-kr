notices:
  - date: "2026-05-06"
    level: info
    title: 정기 점검으로 관측·자료 서비스 중단 (2026-05-07 09:00~15:00 KST)
    body: >-
      연 2회 하는 AMI 스캐너 보정과 위성자료 저장장치 성능 개선 작업으로 2026년 5월 7일 09~15시(KST) 관측과 자료 서비스가 멈췄습니다.
      점검 직후 약 1시간은 영상 위치 정확도가 떨어질 수 있다고 안내했습니다. 같은 성격의 점검이 2025년 5월·11월에도 있었습니다.
    source: https://nmsc.kma.go.kr/homepage/html/base/bbs/selectBbs.do?bbsCd=00237&bbsUsq=203145
  - date: "2025-12-22"
    level: warning
    title: 국가기상위성센터 누리집 위성 자료 제공 서비스 종료 (2025-12-23)
    body: >-
      국가기상위성센터 누리집의 위성 자료 제공 서비스가 2025년 12월 23일 종료되었습니다. 위성자료 내려받기는 기상자료개방포털(data.kma.go.kr),
      API는 기상청 API허브(apihub.kma.go.kr)에서 이용합니다.
    source: https://nmsc.kma.go.kr/homepage/html/base/bbs/selectBbs.do?bbsCd=00237&bbsUsq=203013
  - date: "2025-09-05"
    level: warning
    title: 자료 서비스 통합 이전 안내 — 다운로드는 기상자료개방포털, Open API는 API허브로
    body: >-
      국가기상위성센터 자료 제공 서비스(datasvc.nmsc.kma.go.kr)를 기상자료개방포털과 기상청 API허브로 통합 이전한다고 알렸습니다.
      처음 안내된 종료일은 자료 제공 2025년 10월 31일, Open API 2025년 12월 22일이며, Open API 사용자는 API허브에서 새 인증키를 받고 호출 주소를 바꿔야 합니다.
    source: https://nmsc.kma.go.kr/homepage/html/base/bbs/selectBbs.do?bbsCd=00237&bbsUsq=202887

