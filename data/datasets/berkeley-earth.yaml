    Berkeley Earth는 자료를 쓸 때 Berkeley Earth를 출처로 밝히고 가능하면 www.berkeleyearth.org를 적어 달라고 안내합니다(CC BY-NC 4.0).
    구 1° 제품 파일은 Rohde & Hausfather (2020)를 인용 논문으로 적고 있습니다. 고해상도 제품은 설명 논문이 심사 중이므로, 확정 전에는
    프리프린트와 Zenodo 판 DOI를 함께 적는 것이 안전합니다.

notices:
  - date: "2026-09-01"
    level: info
    title: 고해상도 제품(BEST-HR) 설명 논문, ESSD 공개 심사 시작
    body: >-
      0.25° 고해상도 자료의 설명 논문이 ESSD Discussions에 게재되어 공개 심사 중입니다. 약 5만 8천 개 관측소, HadSST4 + ORAS5 예측장,
      회귀 크리깅, 새 불확실성 앙상블을 소개하며, 매월 갱신은 Berkeley Earth 웹사이트로 제공한다고 밝혔습니다.
    source: https://essd.copernicus.org/preprints/essd-2026-412/
  - date: "2026-05-28"
    level: info
    title: 고해상도 자료 2026년 4월판 Zenodo 보관 (DOI 발급)
    body: 전지구 TAVG와 육상 TAVG·TMAX·TMIN의 시계열·50개 멤버 앙상블·1°/0.25° 격자를 담은 고정판이 Zenodo에 CC BY-NC 4.0으로 공개되었습니다.
    source: https://zenodo.org/records/20428381
  - date: "2026-01-14"
    level: info
    title: 2025년 전지구 기온 보고서 발표
    body: >-
      Berkeley Earth가 2025년 연례 기온 보고서를 냈습니다. 2026년 1월 초까지 수집된 관측 기준이며, 새 자료가 들어오면 계산이 바뀔 수 있다고 밝혔습니다.
      국가별 평균은 고해상도 격자 자료로 계산했습니다.
    source: https://berkeleyearth.org/global-temperature-report-for-2025/
  - date: "2025-04"
    level: warning
    title: 구 1° 시계열·격자 제품 갱신 중단, 고해상도 제품으로 전환
    body: >-
      데이터 페이지에 "Effective Q2 2025"부터 1° 해상도 시계열·격자 제품(Land_and_Ocean_*, Complete_*, 일별 자료 포함)을 더 이상 갱신하지 않는다고
      공지했습니다(정확한 날짜는 없음). 최신 자료는 고해상도 제품 파일을 쓰세요.
    source: https://berkeleyearth.org/data/

