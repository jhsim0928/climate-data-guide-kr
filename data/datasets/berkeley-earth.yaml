# ─────────────────────────────────────────────────────────────
# Berkeley Earth — 데이터셋 정보 파일
# 대기 탭(기온 자료)에 싣습니다. 육상 관측소 + 해양 HadSST4 재보간 결합 자료입니다.
# 구 1° 제품 → 고해상도(0.25°) 제품 전환은 이 파일의 transitions 에 있습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: berkeley-earth
name: Berkeley Earth
full_name: Berkeley Earth Land/Ocean Surface Temperature (버클리 어스 육지·해양 지표 기온 자료)
category: analysis
domain: atmosphere
group: 기온 자료
order: 30
domains: [대기, 해양]
provider: Berkeley Earth (미국 비영리 연구단체)

status: active
status_note: >-
  2025년 2분기부터 0.25° 고해상도 제품(High-Resolution, BEST-HR)이 운영 자료가 되어 매월 갱신 중이고, 오랫동안 쓰이던 1° 제품
  (Land_and_Ocean_*, Complete_* 파일과 일별 육상 자료)은 더 이상 갱신되지 않습니다. 고해상도 제품은 아직 "예비 자료(PRELIMINARY)"로 표시되어 있고,
  설명 논문이 2026년 9월부터 ESSD에서 심사 중입니다.

period:
  start: "1850-01"
  end: present
  note: >-
    육지+해양 전지구 TAVG는 1850년부터, 육상 전용 TAVG는 1750년부터, 고해상도 육상 TMAX·TMIN은 1850년부터입니다.
    2026-10-12 확인 시 고해상도 전지구 월별 파일 머리말의 분석 실행일은 육지 2026-09-11, 해양 2026-08-13이며, 파일 마지막 행(최신 달)은 직접 확인하지 못했습니다.
    구 1° 제품은 분석 실행일이 2025-01-04로, 그 뒤 갱신이 멈췄습니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1개월"
  spatial: >-
    고해상도(현행) 제품: 0.25° × 0.25° 위경도 격자(전 해상도 파일은 요청 또는 Zenodo 보관본), 바로 받을 수 있는 1° × 1°·5° × 5° 위경도 격자 파일.
    구 제품(갱신 중단): 1° × 1° 위경도 격자와 등면적(Equal Area) 격자
  vertical: 지표 단일층 (육상 지상 기온 + 해양 해수면온도의 혼합)
  temporal: 월평균 편차 (구 제품에는 1880년~ 일별 육상 TAVG·TMAX·TMIN 실험 자료가 있으나 갱신 중단)

update: 매월 (고해상도 제품). 구 1° 제품은 2025년 2분기부터 갱신 중단
license: CC BY-NC 4.0 (비상업적 이용) — 상업적 이용은 Berkeley Earth에 별도 문의, 출처 표기 필요
account_required: false

summary: >-
  미국 비영리 연구단체 Berkeley Earth가 만드는 전지구 지표 기온 자료로, 약 5만 8천 개 육상 관측소 기온과 HadSST4 해수면온도를 합쳐 1850년부터 제공합니다.
  관측소 기록을 잘라 쓰는 통계적 균질화와 크리깅(Kriging) 내삽이 특징이며, 육상 자료는 1750년까지 거슬러 올라갑니다.
  2025년부터는 기상 패턴 기반 예측 구조를 더한 회귀 크리깅으로 만든 0.25° 고해상도 제품이 주력이고, 편차 기준은 1951~1980년입니다.
  격자 파일에 월별 기후값(climatology)이 함께 들어 있어 실제 기온(절대값)도 계산할 수 있습니다.

time_convention:
  summary: >-
    모든 격자 값과 시계열은 해당 달의 월평균 기온 편차(1951년 1월~1980년 12월 평균 기준, °C)입니다. 고해상도 격자 파일의 시간은
    소수 연도로 각 달의 중앙을 가리킵니다(예: 1981.125 = 1981년 2월).
  points:
    - "격자 파일의 `climatology`는 1951~1980년 같은 달의 실제 기온(°C)으로, 12개월 값입니다. 편차 `temperature`에 같은 달 기후값을 더하면 절대 기온이 됩니다."
    - "고해상도 격자에서 그 칸의 편차가 관측으로 20% 미만만 제약되면 값이 NaN입니다."
    - "전지구 텍스트 파일의 '연평균' 열은 그 달을 중심으로 한 12개월 이동평균입니다(예: 1950년 1~12월 평균이 1950년 6월 행에 들어감). 5·10·20년 열도 중심 이동평균입니다."
    - "해빙 지역은 얼음이 있으면 육상 기온에서, 없으면 해양 온도에서 편차를 외삽합니다(해빙 범위는 HadISST v2). 구 제품은 해빙 위를 해수 온도로 외삽한 'Alternate' 판을 따로 줬습니다."
    - "예비 자료라 매달 갱신 때 과거 값이 예고 없이 바뀔 수 있습니다."
  source: https://berkeley-earth-temperature-hr.s3.amazonaws.com/Gridded/High-Res_Gridded_README.txt
  source_name: Berkeley Earth High-Resolution Gridded README / Global_TAVG_monthly.txt 머리말

variables:
  note: >-
    고해상도 격자 NetCDF 파일 기준 변수 이름입니다(README 확인). 구 1° 제품 파일의 변수 이름은 이번 확인에서 직접 열어 보지 못했습니다.
  full_list: https://berkeleyearth.org/data/
  groups:
    - name: 고해상도 격자 (NetCDF, 0.25°·1°·5°)
      kind: mean
      period: 월
      items:
        - "지표 기온 편차 — `temperature` (°C, 1951~1980 기준)"
        - text: "월별 기후값(절대 기온) — `climatology` (°C)"
          kind: mean
          period: 월
          note: 1951~1980년 같은 달의 평균. 12개 값(1~12월)이며 특정 연도의 값이 아님
        - text: "육지 비율 — `land_mask` (0~1)"
          kind: static
    - name: 요약 시계열 (텍스트)
      kind: mean
      period: 월
      items:
        - text: "전지구 육지+해양 TAVG 편차·95% 불확실성 — Global_TAVG_monthly.txt (°C)"
          std: [t_anom]   # 이름에 '불확실성'이 있어 자동 판정에서 빠지므로 직접 지정
        - "육상 TAVG·TMAX·TMIN 편차 — Land_TAVG/TMAX/TMIN_monthly.txt (°C)"
        - "50개 멤버 앙상블 시계열 — *_ensemble.txt (°C)"
        - text: "연평균 편차 — *_annual.txt (°C)"
          kind: mean
          period: 연
    - name: 구 제품 일별 육상 자료 (실험, 갱신 중단)
      kind: mean
      period: 일
      items:
        - "일평균 기온 편차 — Complete_TAVG_Daily_* (°C)"
        - text: "일 최고기온 편차 — Complete_TMAX_Daily_* (°C)"
          kind: max
          period: 일
        - text: "일 최저기온 편차 — Complete_TMIN_Daily_* (°C)"
          kind: min
          period: 일

access:
  - name: Berkeley Earth 데이터 페이지
    url: https://berkeleyearth.org/data/
    method: HTTPS (웹 / wget / curl)
    note: >-
      고해상도 전지구·육상 시계열과 1°·5° 격자 파일(storage.googleapis.com/berkeley-earth-temperature-hr/), 구 1° 제품(갱신 중단),
      관측소 자료를 안내합니다. 0.25° 전 해상도 격자와 국가·도시별 고해상도 시계열은 요청 양식으로 받습니다.
  - name: 고해상도 격자 1° (전지구 TAVG)
    url: https://storage.googleapis.com/berkeley-earth-temperature-hr/global/gridded/Global_TAVG_Gridded_1deg.nc
    method: HTTPS (약 400 MB)
    note: 5° 격자는 같은 폴더의 Global_TAVG_Gridded_5deg.nc(약 8 MB)입니다.
  - name: Zenodo 보관본 (2026년 4월판, 0.25° 포함)
    url: https://doi.org/10.5281/zenodo.20428381
    method: HTTPS (약 55 GB, 21개 파일)
    note: >-
      전지구 TAVG, 육상 TAVG·TMAX·TMIN의 월·연·앙상블 시계열, 1° 앙상블 NetCDF, 0.25° 격자 NetCDF가 들어 있습니다.
      특정 시점으로 고정된 판이라 논문 재현용으로 좋고, 최신 달은 데이터 페이지 파일에서 받으세요.
  - name: 구 1° 제품 (갱신 중단, 2025-01 실행분)
    url: https://berkeley-earth-temperature.s3.us-west-1.amazonaws.com/Global/Gridded/Land_and_Ocean_LatLong1.nc
    method: HTTPS (약 400 MB)
    note: 등면적판(Land_and_Ocean_EqualArea.nc), 해빙 위 해수 온도판(Alternate), 육상 Complete_TAVG/TMAX/TMIN, 일별 육상 파일이 같은 경로에 있습니다.

example:
  lang: python
  note: 고해상도 5° 격자 파일을 받아 편차와 기후값으로 절대 기온을 만들고, 면적 가중 전지구 평균 편차를 계산합니다.
  code: |
    import urllib.request
    import numpy as np
    import xarray as xr

    url = ("https://storage.googleapis.com/berkeley-earth-temperature-hr/"
           "global/gridded/Global_TAVG_Gridded_5deg.nc")
    urllib.request.urlretrieve(url, "be_5deg.nc")
    ds = xr.open_dataset("be_5deg.nc")
    print(ds)                                  # 차원·좌표 이름 확인

    anom = ds["temperature"]                   # °C, 1951~1980 기준 편차
    tdim = ds["time"].dims[0]
    ydim, xdim = ds["latitude"].dims[0], ds["longitude"].dims[0]
    t = ds["time"].values                      # 소수 연도, 월 중앙 (예: 1981.125)
    month = np.floor((t % 1) * 12).astype(int) # 0=1월 … 11=12월

    # 전지구 면적 가중 평균 편차
    w = np.cos(np.deg2rad(ds["latitude"]))
    glob = anom.weighted(w).mean([ydim, xdim])
    print(glob.isel({tdim: slice(-12, None)}).values.round(2))

    # 절대 기온 = 편차 + 같은 달 기후값 (마지막 달 예시)
    clim = ds["climatology"]
    mdim = [d for d in clim.dims if d not in (ydim, xdim)][0]
    absolute_last = anom.isel({tdim: -1}) + clim.isel({mdim: month[-1]})

tips:
  - 구 1° 제품(Land_and_Ocean_complete.txt, Land_and_Ocean_LatLong1.nc 등)은 2025년 2분기부터 갱신되지 않습니다. 기존 스크립트가 이 주소를 쓰고 있다면 고해상도 파일로 바꾸세요. 두 제품은 방법이 달라 한 시계열로 이어 붙이면 안 됩니다.
  - 고해상도 제품은 "PRELIMINARY DATA - SUBJECT TO CHANGE WITHOUT NOTICE - NOT YET PEER REVIEWED"로 표시되어 있습니다. 논문에는 내려받은 날짜를 적거나 Zenodo 고정판(DOI)을 쓰세요.
  - 라이선스가 CC BY-NC 4.0이라 상업적 이용(유료 서비스·제품 포함)은 Berkeley Earth의 허락이 필요합니다.
  - 해양 부분은 HadSST4를 다시 내삽한 것이라 HadCRUT5와 해양 입력이 같습니다. 두 자료가 비슷하다고 해서 독립적인 확인으로 보기는 어렵습니다.
  - 편차 기준이 1951~1980년(GISTEMP와 같음)이고 HadCRUT5는 1961~1990년입니다. 비교할 때 기준 기간을 맞추세요.
  - 고해상도 격자 파일에는 불확실성 정보가 없습니다. 불확실성은 텍스트 시계열의 95% 구간이나 50개 멤버 앙상블 파일을 쓰세요.
  - 0.25° 해상도는 관측소 밀도보다 촘촘할 수 있습니다. 관측이 드문 지역·초기 기간의 작은 규모 구조는 통계적 예측 구조에서 나온 것일 수 있으니 해석에 주의하세요.

transitions:
  - from: Berkeley Earth Land/Ocean
    to: Berkeley Earth BEST-HR
    status: completed
    date: "2025년 2분기"
    summary: >-
      2025년 2분기부터 0.25° 고해상도 제품이 운영 자료가 되고 1° 시계열·격자 제품은 갱신이 멈췄습니다. 설명 논문(ESSD 심사 중)은
      이를 Berkeley Earth 기온 자료의 '버전 2'로 소개합니다.
    changes:
      - aspect: 수평 해상도
        before: "1° × 1° 위경도 격자, 등면적 격자"
        after: "0.25° × 0.25° (공개 파일은 1°·5°, 0.25°는 요청 또는 Zenodo)"
      - aspect: 내삽 방법
        before: "크리깅(Kriging)"
        after: "물리 기반 예측장을 쓰는 회귀 크리깅(regression Kriging), 해안 혼합 방식 개선"
      - aspect: 해양 입력
        before: "HadSST4를 다시 내삽(초기 논문 시점에는 HadSST3)"
        after: "HadSST4 + ORAS5 해양 재분석 예측장으로 공간 세부 보강"
      - aspect: 해빙 위 처리
        before: "두 판 제공 — 육상 기온 외삽(기본) / 해수 온도 외삽(Alternate)"
        after: "얼음이 있으면 육상 기온에서 외삽하는 한 가지 방식"
      - aspect: 불확실성
        before: "시계열 파일의 95% 불확실성"
        after: "50개 멤버 앙상블(시계열, 1° 격자) 추가"
      - aspect: 갱신·상태
        before: "2025-01 실행분이 마지막, 이후 갱신 중단 / ESSD(2020) 동료 심사 완료"
        after: "매월 갱신 / 예비 자료, 설명 논문 ESSD 심사 중(2026-09~)"
      - aspect: 일별 자료
        before: "육상 TAVG·TMAX·TMIN 일별 실험 자료(1880~)"
        after: "고해상도 제품에는 일별 자료 없음(월별만)"
    impacts:
      - 두 제품의 값을 한 시계열로 이어 붙이지 말고, 한 제품으로 전 기간을 다시 계산하세요.
      - 파일 이름·주소·변수 구성이 바뀌었으므로 자동 내려받기 스크립트를 고쳐야 합니다.
      - 일별 자료가 필요하면 갱신이 멈춘 구 제품밖에 없으므로 최근 기간은 다른 자료를 써야 합니다.
    sources:
      - name: Berkeley Earth 데이터 페이지
        url: https://berkeleyearth.org/data/
      - name: Rohde et al. (2026, ESSD 심사 중) BEST-HR 논문
        url: https://doi.org/10.5194/essd-2026-412

