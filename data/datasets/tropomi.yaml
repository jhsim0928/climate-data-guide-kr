notices:
  - date: "2026-10-13"
    level: warning
    title: 2026-11-10 처리기 업그레이드 — L1B 3.1.0, NL-L2 3.0.0, UPAS 3.0.1
    body: >-
      ESA가 2026년 11월 10일 운영 처리기를 바꾼다고 공지했습니다. NL-L2(NO2·CO·CH4·AER_AI·AER_LH·O3_PR)는 3.0.0, UPAS(HCHO·SO2·CLOUD·O3·O3_TCL)는 3.0.1,
      L1B는 3.1.0이 됩니다. NO2는 새 대기질량인자(AMF) 조견표를 쓰고 변수가 늘어 파일이 약 5% 커지며, CH4·AER_LH의 구름 마스크, AER_AI 성능 저하 보정,
      O3_PR·CLOUD·O3_TCL 알고리즘도 바뀝니다. NL-L2의 DOI가 새 버전으로 갱신되고, 교체 작업 중 관측분의 NRT 자료는 만들어지지 않습니다.
      재처리 계획은 공지에 없으므로 전환 전후 값을 한 시계열로 쓸 때는 처리기 버전을 확인하세요.
    source: https://dataspace.copernicus.eu/news/2026-10-13-copernicus-sentinel-5-precursor-s5p-products-improvement
  - date: "2026-10-07"
    level: info
    title: 궤도 제어 기동 — 2026년 10월 7일 자료 품질 저하 가능
    body: >-
      10월 7일 계획된 Sentinel-5P 궤도 제어 기동으로 자료가 일시적으로 없거나 품질이 떨어질 수 있다고 공지했습니다. 영향 범위는 SentiBoard 2026년 10월 이벤트 페이지에 정리됩니다.
    source: https://dataspace.copernicus.eu/news/2026-10-7-copernicus-sentinel-5p-data-unavailability-07-october-2026
  - date: "2025-12-22"
    level: warning
    title: HCHO·SO2 2.8.0 줄무늬 문제 해결 — 영향 기간 OFFL 재처리 예정
    body: >-
      처리기 전환 직후 HCHO(정도는 덜하지만 SO2도) 2.8.0 자료에 뚜렷한 줄무늬가 생겼다가 고쳐졌습니다. 영향 기간은 NRTI 2025-11-26 ~ 12-06(궤도 42080–42230),
      OFFL 2025-11-22 ~ 12-02(궤도 42023–42173)이며 OFFL은 다시 처리할 예정입니다.
    source: https://dataspace.copernicus.eu/news/2025-12-22-copernicus-sentinel-5-precursor-s5p-issue-hcho-and-so2-v280-products-solved
  - date: "2025-11-27"
    level: warning
    title: 처리기 전환 — L1B 3.0.0, NL-L2 2.9.1, UPAS 2.8.0 (OFFL 2025-11-22부터)
    body: >-
      L1B(미광·배경 보정 개선)와 L2 처리기가 바뀌었습니다. NO2·CO·CH4·에어로졸 지수·에어로졸층 높이·오존 연직 분포는 2.9.1, HCHO·SO2·구름·오존 전량·대류권 오존은 2.8.0이며,
      새 버전 자료는 OFFL 궤도 42023(2025-11-22), NRTI 궤도 42080(2025-11-26)부터입니다. NO2는 430 nm 부근 프라운호퍼선을 빼도록 설정이 바뀌었고 CH4 NRTI가 새로 생겼습니다.
    source: https://dataspace.copernicus.eu/news/2025-11-27-copernicus-sentinel-5-precursor-s5p-products-improvement-operational-switch
  - date: "2022-07-17"
    level: info
    title: 처리기 2.4.0 운영 전환과 첫 전체 임무 재처리(RPRO)
    body: >-
      2.4.0이 OFFL 궤도 24655(2022-07-17)부터 운영에 들어갔고, 같은 버전으로 임무 시작(2018-04-30)부터 2022년 7월까지를 다시 처리한 RPRO 자료가 2023년 초부터 제공됩니다.
      공식 권고는 RPRO가 있는 기간은 RPRO, 그 뒤는 최신 OFFL을 쓰는 것입니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/S5P/S5P-MPC-KNMI-PRF-NO2-Sentinel-5P-Nitrogen-Dioxide-Level-2-Product-Readme-File-2025-2.8.pdf
  - date: "2019-08-06"
    level: info
    title: 진행 방향 화소 크기 7 km → 5.5 km
    body: >-
      궤도 9388부터 모든 관측의 진행 방향 분해능이 7.0 km에서 5.5 km로 바뀌었습니다. 직하점 화소는 5.5 × 3.5 km(CO·CH4는 5.5 × 7 km)입니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/S5P/S5P-MPC-KNMI-PRF-NO2-Sentinel-5P-Nitrogen-Dioxide-Level-2-Product-Readme-File-2025-2.8.pdf

