transitions:
  - from: ESA CCI SM v08.1
    to: ESA CCI SM v09.x (v09.1 → v09.2)
    status: completed
    summary: >-
      v09.1에서 처음으로 오차 전파 기반 불확실성이 들어가고, SMOS 여러 입사각을 합치는 방식과 COMBINED 척도 조정 방법이 바뀌었으며 기간이 2023년 말까지 늘었습니다.
      v09.2는 알고리즘 변경 없이 v09.1을 2024년 말까지 연장한 판입니다. C3S의 v202505가 이 'CCI 알고리즘 버전 9'에 해당합니다.
    changes:
      - aspect: 기간 (PASSIVE·COMBINED / ACTIVE)
        before: "v08.1 1978-11~2022-12 / 1991-01~2022-12 (FAQ 기준)"
        after: "v09.1 ~2023-12, v09.2 1978-11-01~2024-12-31 / 1991-08-05~2024-12-31"
      - aspect: 불확실성
        before: "입력 오차 추정 위주"
        after: "처음으로 end-to-end 불확실성 예산(오차 전파) 제공"
      - aspect: PASSIVE 처리
        before: "기존 방식"
        after: "SMOS 여러 입사각을 결합하는 새 방법, 밝기온도 병합 개선"
      - aspect: COMBINED 척도 조정
        before: "기존 방식"
        after: "갱신된 척도 조정(rescaling) 방법"
      - aspect: CEDA 공개
        before: "v08.1 (2023)"
        after: "v09.1 2024-10, v09.2 2025-12-03"
    impacts:
      - 버전을 바꾸면 과거 기간도 모두 다시 받으세요. 같은 날짜라도 버전마다 값이 다릅니다.
      - 새 불확실성(`sm_uncertainty`)은 정의가 바뀌었으므로 v08 이전 오차 값과 직접 비교하지 마세요.
    sources:
      - name: ESA CCI Soil Moisture 프로젝트 페이지
        url: https://climate.esa.int/en/projects/soil-moisture/
      - name: ESA 소식 — v09.1 공개
        url: https://climate.esa.int/en/news-events/New-upgrade-to-ESACCI-SoilMoisture-Dataset-v091/
      - name: CEDA — COMBINED v09.2 카탈로그
        url: https://catalogue.ceda.ac.uk/uuid/d4e66299f5054129b8076fb7502949e1

notices:
  - date: "2025-12-12"
    level: info
    title: C3S 토양수분(CDS) 표층 토양수분 변수 이름 변경
    body: >-
      CDS의 알려진 문제(Known issues)에 C3S 토양수분 제품의 표층 토양수분 두 변수(체적 함수율·포화도) 이름을 더 알기 쉽게 바꿨다는 항목이 올라왔습니다.
      CDS API로 받는 스크립트는 다운로드 양식에서 새 변수 이름을 확인해 고쳐야 합니다. CEDA의 ESA CCI SM 파일 변수(`sm`)와는 무관합니다.
    source: https://cds.climate.copernicus.eu/datasets/satellite-soil-moisture?tab=documentation
  - date: "2025-12-03"
    level: info
    title: ESA CCI SM v09.2 공개 (2024년 말까지 연장)
    body: >-
      ACTIVE·PASSIVE·COMBINED v09.2가 CEDA에 공개되었습니다. v09.1을 2024-12-31까지 시간 연장한 판이며, 사용자 안내서(PUG)와 검증 보고서(PVIR)도 함께 갱신되었습니다.
      데이터셋 DOI는 2026-04-13에 등록되었습니다.
    source: https://catalogue.ceda.ac.uk/uuid/d4e66299f5054129b8076fb7502949e1
  - date: "2024-10"
    level: info
    title: ESA CCI SM v09.1 공개 — 불확실성 예산 첫 도입
    body: >-
      v09.1은 기간을 2023년 말까지 늘리고, 처음으로 오차 전파 기반 불확실성을 제공하며, COMBINED 척도 조정과 PASSIVE 밝기온도 병합 방식을 개선했습니다.
    source: https://climate.esa.int/en/news-events/New-upgrade-to-ESACCI-SoilMoisture-Dataset-v091/

