# ─────────────────────────────────────────────────────────────
# ESA CCI Soil Moisture — 데이터셋 정보 파일
# 지면 탭 '토양수분'에 싣습니다. 같은 알고리즘으로 만드는 C3S 토양수분(CDS)과의 관계도 이 파일에 함께 적었습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: esa-cci-sm
name: "ESA CCI Soil Moisture"
full_name: ESA Soil Moisture Climate Change Initiative (Soil_Moisture_cci) v09.2 — ACTIVE·PASSIVE·COMBINED (다중위성 마이크로파 표층 토양수분 기후자료, 0.25°·일)
category: satellite
domain: land
group: 토양수분
order: 10
domains: [육지, 원격탐사, 수문]
provider: ESA Climate Change Initiative (TU Wien 주관 컨소시엄) / CEDA 배포

status: active
status_note: >-
  최신 버전은 v09.2로, v09.1을 2024년 12월 31일까지 시간 연장한 판입니다(CEDA 공개 2025-12-03). 기후자료(CDR)라서 1년에 한 번 갱신되며,
  다음 버전 일정은 아직 공지되지 않았습니다. 최근 자료가 필요하면 같은 알고리즘으로 약 10일 지연 갱신되는 C3S 토양수분(CDS, v202505)을 쓰라고 ESA가 안내합니다.

period:
  start: "1978-11"
  end: "2024-12"
  note: >-
    PASSIVE·COMBINED는 1978-11-01~2024-12-31, ACTIVE는 1991-08-05~2024-12-31입니다(v09.2).
    1978~1987년 무렵은 SMMR 하나뿐이라 관측 빈도가 낮고 궤도 줄무늬가 보이며, PASSIVE·COMBINED의 불확실성 변수는 1987-07-09부터 있습니다(v09.1 사용자 안내서 기준).

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: 0.25° × 0.25° 전지구 정규 위경도 격자 (1440 × 720 격자점, 이 가운데 육지 244,243개)
  vertical: 표층 토양수분 단일층 (대략 지표 0~5 cm, 실제 감지 깊이는 센서·주파수에 따라 다름)
  temporal: 일 (00:00 UTC 기준일 하나에 영상 1장). 월평균은 ESA CCI 웹 뷰어·C3S에서 별도 제공

update: 매년 (CDR 연 1회 연장) — 최근 자료는 C3S ICDR이 10일 주기·약 10일 지연으로 갱신
license: ESA CCI Soil Moisture 이용 약관 v2 — 무료·등록 없이 이용 가능, CEDA 카탈로그의 인용 문구로 데이터셋을 인용해야 함
account_required: false

summary: >-
  ESA 기후변화 이니셔티브(CCI)가 1978년부터 쓰인 여러 위성의 마이크로파 토양수분을 하나로 이어 붙인 전지구 표층 토양수분 기후자료입니다.
  산란계(능동) 자료를 합친 ACTIVE, 복사계(수동) 자료를 합친 PASSIVE, 둘을 결합한 COMBINED 세 가지가 있고, 모두 0.25° 일 영상으로 제공됩니다.
  ESA는 대부분의 용도에 COMBINED를 권하며, v09 계열부터 오차 전파에 기반한 불확실성이 처음으로 들어갔습니다.
  같은 알고리즘으로 C3S가 근실시간 판(CDS)을 만듭니다.

time_convention:
  summary: >-
    파일 하나가 하루(00:00 UTC 기준 시각)이고, 값은 그날 위성이 실제로 관측한 순간의 토양수분입니다. 실제 관측 시각은 `t0`(1970-01-01 00:00 UTC 기준 일수)에 들어 있고,
    두 센서 값이 섞인 격자는 관측 시각도 평균됩니다. 일평균이 아니며, 관측이 없는 날은 비어 있습니다.
  points:
    - "`time`은 그날의 기준 시각(00:00 UTC)일 뿐이고, 실제 관측 시각은 `t0`를 보세요. 위성마다 통과 시각(오전·오후, 상승·하강)이 다르며 `mode`·`dnflag`로 확인할 수 있습니다."
    - "관측 빈도가 시대마다 다릅니다. 초기(SMMR 시대)는 며칠에 한 번꼴이고 최근은 거의 매일입니다. 월평균·기후값을 만들 때 표본 수 차이를 고려하세요."
    - "ACTIVE의 `sm`은 포화도(%), PASSIVE·COMBINED는 체적 함수율(m3 m-3)이라 단위가 다릅니다."
  source: https://climate.esa.int/documents/2960/ESA_CCI_SM_RD_D4.2_v2_Product_Users_Guide_v09.1_i1.0.pdf
  source_name: ESA CCI SM Product User Guide v09.1 + CEDA v09.2 카탈로그

variables:
  note: >-
    CEDA v09.2 카탈로그와 v09.1 사용자 안내서(PUG) 기준 변수입니다. 세 제품 모두 같은 변수 구성이며 `sm`의 단위만 다릅니다.
    파일 이름은 ESACCI-SOILMOISTURE-L3S-SSMV-<제품>-<YYYYMMDD>000000-fv<버전>.nc 형식이고 연도별 폴더에 들어 있습니다.
  full_list: https://climate.esa.int/documents/2960/ESA_CCI_SM_RD_D4.2_v2_Product_Users_Guide_v09.1_i1.0.pdf
  groups:
    - name: 토양수분 (그날 관측값)
      kind: instant
      items:
        - text: "표층 토양수분(COMBINED·PASSIVE) — `sm` (m3 m-3)"
          note: "관측 시각은 `t0`. COMBINED는 공통 모델 기후값에 맞춰 척도를 조정한 값"
        - text: "표층 토양수분 포화도(ACTIVE) — `sm` (%)"
          note: 산란계 기반, 포화 대비 백분율
        - "토양수분 불확실성 — `sm_uncertainty` (sm과 같은 단위)"
    - name: 관측 정보·품질 (그날 관측 기준)
      kind: instant
      items:
        - "관측 시각 — `t0` (days since 1970-01-01 00:00:00 UTC)"
        - "품질 플래그(비트) — `flag`"
        - "주파수 대역 식별 — `freqbandID`"
        - "주간·야간 구분 — `dnflag` (1 주간, 2 야간, 3 둘 다)"
        - "위성 궤도 방향 — `mode` (1 상승, 2 하강, 3 둘 다)"
        - "사용 센서 — `sensor` (정수 코드)"

access:
  - name: CEDA Archive (ESA CCI SM 공식 배포)
    url: https://data.ceda.ac.uk/neodc/esacci/soil_moisture/data/daily_files/COMBINED/v09.2
    method: HTTP 다운로드 / 익명 FTP / OPeNDAP
    note: >-
      등록 없이 모든 버전을 받을 수 있습니다. daily_files 아래 ACTIVE·PASSIVE·COMBINED → 버전(v09.2) → 연도 폴더 순서입니다.
      익명 FTP 주소는 ftp://anon-ftp.ceda.ac.uk/neodc/esacci/soil_moisture/data/daily_files/ 입니다.
  - name: ESA CCI Open Data Portal
    url: https://climate.esa.int/en/odp/#/dashboard
    method: 웹 검색·다운로드
    note: ESA CCI 전 변수를 한곳에서 찾을 수 있는 포털입니다.
  - name: Copernicus Climate Data Store — C3S 토양수분 (근실시간·월평균)
    url: https://cds.climate.copernicus.eu/datasets/satellite-soil-moisture
    method: 웹 다운로드 / CDS API (cdsapi)
    note: >-
      ESA CCI SM 알고리즘으로 만든 C3S 제품입니다(v202505 = CCI 알고리즘 버전 9). 일·10일·월 평균, 연 1회 갱신되는 CDR과 10일 주기로 이어 붙는 ICDR,
      근권 토양수분(RZSM)·동결/융해(F/T) 제품을 함께 제공합니다. ECMWF 계정이 필요합니다.
  - name: esa_cci_sm 파이썬 패키지 (TU Wien)
    url: https://github.com/TUW-GEO/esa_cci_sm
    method: pip install esa_cci_sm
    note: 일 영상 파일을 격자점별 시계열 형식으로 바꿔 지점 분석을 빠르게 할 수 있습니다.

example:
  lang: python
  note: >-
    CEDA 익명 FTP에서 COMBINED v09.2 한 달치를 받아 한반도 영역 평균을 구하는 예입니다(계정 불필요). 파일 이름 규칙은 v09.1 사용자 안내서·esa_cci_sm 예시를 따른 것이니
    받기 전에 폴더 목록으로 확인하세요.
  code: |
    from ftplib import FTP
    import xarray as xr

    base = "/neodc/esacci/soil_moisture/data/daily_files/COMBINED/v09.2/2024"
    ftp = FTP("anon-ftp.ceda.ac.uk"); ftp.login()
    ftp.cwd(base)
    names = [n for n in ftp.nlst() if "202407" in n]   # 2024년 7월 파일
    for n in names:
        with open(n, "wb") as f:
            ftp.retrbinary(f"RETR {n}", f.write)
    ftp.quit()

    ds = xr.open_mfdataset(sorted(names), combine="by_coords")
    sm = ds["sm"].sel(lat=slice(39, 33), lon=slice(124, 132))  # 위도는 북→남
    good = sm.where(ds["flag"].sel(lat=slice(39, 33), lon=slice(124, 132)) == 0)
    print(good.mean(["lat", "lon"]).values)   # 날짜별 영역 평균 (m3 m-3)

tips:
  - "`flag`가 0이 아닌 값(눈·동결, 밀집 식생, 물리적 범위 초과 등)은 빼고 쓰세요. 64(나지 주의)는 참고용이라 값이 지워지지 않습니다. 여러 비트가 더해진 값이므로 2진수로 풀어 읽습니다."
  - 밀집 식생(열대림), 산악, 얼음·눈, 큰 수면, 극건조 사막은 가려져 값이 없습니다. 결측이 많은 지역의 평균은 계절별 표본 편향이 생기기 쉽습니다.
  - COMBINED의 절대값은 공통 모델 기후값에 맞춰 척도를 조정한 결과라 독립적인 절대 토양수분 관측이 아닙니다. 편차(이상값)·변동 분석에 쓰고, 절대값 비교는 신중히 하세요.
  - "버전이 바뀔 때마다 과거 기간도 다시 계산됩니다. v09.1과 v09.2를 섞지 말고, 논문에 버전과 제품(ACTIVE/PASSIVE/COMBINED)을 적으세요."
  - 센서 조합이 바뀌는 시점에 단절이 생길 수 있습니다. COMBINED는 단절 보정(homogenization)을 거쳤지만, 장기 추세 분석에서는 센서 교체 시기를 함께 확인하세요.
  - C3S 토양수분(CDS)은 같은 알고리즘이지만 버전 이름(v202505 등)·입력 자료 흐름·갱신 주기가 다른 별도 제품입니다. CCI v09.2와 C3S를 이어 붙일 때는 겹치는 기간으로 차이를 먼저 확인하세요.
  - GLEAM4 등 일부 증발산·재분석 자료는 ESA CCI SM을 동화하므로, 이런 자료와 비교하면 독립 검증이 되지 않습니다.

