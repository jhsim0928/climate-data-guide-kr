# ─────────────────────────────────────────────────────────────
# SODA3 — 데이터셋 정보 파일
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: soda3
name: SODA3
full_name: Simple Ocean Data Assimilation version 3 (메릴랜드대 해양·해빙 재분석 3판, 현재 주력판 SODA3.15.2)
category: reanalysis
domain: ocean
group: 재분석
order: 40
domains: [해양, 해빙]
provider: 미국 메릴랜드대(University of Maryland) 대기해양과학과 SODA 프로젝트 (James Carton·Gennady Chepurin 등)

status: active
status_note: >-
  현재 주력판은 ERA5 강제력을 쓴 SODA3.15.2이며, 매달 갱신되는 자료가 아니라 몇 년 단위로 묶어 연장됩니다.
  2026-10-12 확인 시 UMD 서버의 마지막 5일 평균 파일은 2024-12-02(2025-08-06 업로드)이고, 2025년 자료는 아직 없습니다.
  같은 팀이 1/10° 해상도의 후속판 SODA4(1980~2024년 6월)를 공개했지만, SODA3 종료나 다음 연장 일정은 공지되지 않았습니다.

transitions:
  - from: SODA3 (3.15.2)
    to: SODA4 (4.15.2)
    to_id: soda4
    status: completed
    date: "2025-10"
    summary: >-
      같은 GFDL MOM5/SIS1 모델과 ERA5 강제력으로 해상도를 1/4°·50층에서 1/10°·75층으로 높인 중규모 소용돌이 분해(eddy-resolving) 재분석입니다.
      UMD 서버에 1980~2024년 6월 자료가 올라와 있고(원 격자 해양은 1983년부터), 기술 논문은 2025년 10월 EGUsphere 프리프린트로 공개되었습니다(2026-10 확인 시 학술지 게재 미확인).
    changes:
      - aspect: 수평 해상도
        before: "약 1/4° 변위극(displaced pole) 원 격자, 1/2° Mercator 재격자"
        after: "약 1/10° 변위극 원 격자, 1/10° Mercator 재격자"
      - aspect: 연직 층
        before: "50개 z* 층"
        after: "75개 z* 층 (재격자 자료는 한 층 건너 하나씩)"
      - aspect: 기간
        before: "1980~2024 (3.15.2)"
        after: "1980~2024-06 (원 격자 해양 자료는 1983년부터, 1980~82년분 유실)"
      - aspect: 모델·강제력
        before: "MOM5/SIS1, ERA5"
        after: "MOM5/SIS1, ERA5 (변화 없음)"
      - aspect: 자료 위치
        before: "dsrs.atmos.umd.edu/DATA/soda3.15.2/"
        after: "dsrs.atmos.umd.edu/DATA/SODA4.15.2_OR/ (원 격자), SODA4.15.2_REG/ (0.1° 재격자 3600×1700) — 2026-07 정리된 폴더 기준"
    impacts:
      - 해상도와 층 구성이 달라 두 자료를 한 시계열로 섞거나 격자점끼리 바로 비교하지 마세요.
      - SODA4 파일은 같은 기간이라도 훨씬 큽니다. 필요한 지역·변수만 내려받을 계획을 세우세요.
      - SODA4 논문은 프리프린트 단계이므로 인용할 때 EGUsphere DOI와 함께 게재 여부를 확인하세요.
    sources:
      - name: SODA4 포털 (UMD)
        url: https://www.soda.umd.edu/soda4
      - name: Chepurin et al. (2025) SODA4 프리프린트, EGUsphere
        url: https://doi.org/10.5194/egusphere-2025-3810

period:
  start: "1980-01"
  end: "2024-12"
  note: >-
    SODA3.15.2 기준 1980년 1월부터입니다. 2026-10-12 확인 시 5일 평균 재격자 파일은 1980_01_03 ~ 2024_12_02, 월평균 재격자 파일은 1980~2024년(연 단위 파일)이 있습니다.
    과거 판(3.3.2·3.4.2, 1980~2019 등)은 강제력별로 기간이 다릅니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "5일"
  spatial: >-
    원 격자: 삼극(tripolar) Arakawa B 격자 1440 × 1070(README 표기 고위도 0.1°×0.25° ~ 열대 1/4°×1/4°) /
    재격자: 1/2° × 1/2° Mercator 720 × 330(시작점 74.75°S) / 분석 증분: 1° × 1° 격자, 상층 33층
  vertical: "50개 z* 층 (README 표기 약 5 m ~ 약 5,395 m)"
  temporal: 5일 평균(원 격자·1/2° 재격자), 달력월 평균(1/2° 재격자), 10일 간격 분석 증분·수송량

coverage:
  short: 전지구
update: 비정기 일괄 연장 (최근 2025-08 — 2020~2024년 추가)
license: UMD 페이지에 별도 라이선스 표기 없음, 사용 판(version)을 밝히고 Carton et al. (2018) 인용 요청 / NCAR GDEX 앙상블 사본은 CC BY 4.0
account_required: false

summary: >-
  SODA3는 메릴랜드대가 만든 해양·해빙 재분석으로, GFDL CM2.5의 해양 모델 MOM5(약 1/4°, 50층)와 SIS 해빙 모델에
  WOD 수온·염분 프로파일, ICOADS 현장 SST, 위성 SST를 최적내삽(OI) 방식으로 동화했습니다. 표면 열·담수 플럭스의 편향을 줄이는 보정을 넣은 것이 특징입니다.
  같은 체계를 서로 다른 대기 강제력(MERRA-2, ERA-Interim, JRA-55, JRA55-do, ERA5 등)으로 돌린 여러 판이 있으며, 현재 주력판은 ERA5 강제력의 SODA3.15.2입니다.

time_convention:
  summary: >-
    SODA3 파일은 모두 평균값입니다. `5dy` 파일은 5일 평균 한 장, `mn` 파일은 달력상 한 달 평균 12장(1년치)이 들어 있습니다.
    5일 파일 이름의 날짜(YYYY_MM_DD)는 1980_01_03부터 5일 간격이며, APDRC 사본의 시간 값도 1980-01-03 00:00이라 5일 구간의 가운데 날짜로 보입니다(공식 문서에는 기준이 적혀 있지 않음).
  points:
    - "SODA README는 5일 파일이 이름의 날짜로 구분되는 5일 평균 1장이라고만 설명하고, 그 날짜가 구간의 시작·가운데·끝 중 어디인지는 밝히지 않습니다."
    - "월평균(mn)은 모델 적분 뒤 만든 달력월 평균이며, 연 단위 파일(…_mn_ocean_reg_YYYY.nc) 하나에 12개월이 들어 있습니다."
    - "5일 간격은 달력월·윤년과 맞지 않으므로 월평균을 5일 자료로 다시 계산할 때는 경계에 걸친 장을 나눠야 합니다. 월평균 파일을 바로 쓰는 편이 안전합니다."
    - "열플럭스는 W/m², 담수 플럭스는 (kg/m³)(m/s) 단위의 평균 플럭스이며 누적량이 아닙니다."
  source: https://www2.atmos.umd.edu/~carton/soda/soda3_readme.htm
  source_name: "SODA3 README (UMD) + APDRC ERDDAP SODA 3.15.2 5일 자료 시간 축"

variables:
  note: >-
    SODA3 README와 APDRC ERDDAP 사본 기준 주요 변수입니다. 변수명은 netCDF 파일 안의 이름입니다.
    해양 파일(ocean)과 해빙 파일(ice)이 나뉘어 있습니다.
  full_list: https://www2.atmos.umd.edu/~carton/soda/soda3_readme.htm
  groups:
    - name: 3차원 해양 (ocean, 50층)
      kind: mean
      period: 5일 / 월
      items:
        - "잠재수온 — `temp` (°C)"
        - "실용염분 — `salt` (psu)"
        - "동서·남북·연직 유속 — `u`, `v`, `w` (m/s)"
        - "잠재밀도 — `prho` (kg/m³)"
    - name: 2차원 해양 (ocean)
      kind: mean
      period: 5일 / 월
      items:
        - "역학적 해수면 높이(해수면 + Pa/(rho0·g)) — `ssh` (m)"
        - "혼합층 깊이(수온 0.2 K·밀도 0.03 kg/m³·염분 0.01 psu 기준) — `mlt`, `mlp`, `mls` (m)"
        - "해저 압력 편차 — `anompb` (dbar)"
        - "바람 응력 — `taux`, `tauy` (N/m²)"
        - "해면 총 열플럭스(결합기+복원) — `hflux_total` (W/m²)"
        - "순 해면 열플럭스 — `net_heating` (W/m²)"
        - "단파·장파·잠열·현열 — `swflx`, `lw_heat`, `evap_heat`, `sens_heat` (W/m²)"
        - "담수 플럭스(P−E+하천) — `pme_river` ((kg/m³)(m/s))"
    - name: 해빙 (ice)
      kind: mean
      period: 5일 / 월
      items:
        - "해빙 두께 — `hi` (m)"
        - "해빙 질량 — `mi` (kg/m²)"
        - "적설 두께 — `hs` (m)"
        - "두께 범주 5개별 해빙 농도 — `cn1`~`cn5` (0~1)"
    - name: 수송량 (transp, 원 격자, 10일)
      kind: mean
      period: 10일
      items:
        - "연직 적분 질량 수송 — `mxvint`, `myvint` (10⁹ kg/s, 약 Sv)"
        - "격자면 질량 수송 — `mx`, `my` (10⁹ kg/s)"

access:
  - name: SODA 프로젝트 홈페이지 (UMD)
    url: https://www.soda.umd.edu/
    method: 안내 페이지 (SODA3·SODA4 포털)
    note: 판별 안내, 인용 방법, SODA3·SODA4 포털 링크가 있습니다.
  - name: UMD 데이터 서버 — SODA3.15.2
    url: https://dsrs.atmos.umd.edu/DATA/soda3.15.2/
    login: false
    method: HTTP(S) 직접 다운로드
    note: >-
      REGRIDED/(1/2° 재격자: ocean·ice), ORIGINAL/(원 격자: ocean·ice·transport) 폴더에 netCDF 파일이 있습니다.
      재격자 월평균 1년 파일이 약 2.7 GB, 5일 파일 하나가 약 286 MB(원 격자는 약 630 MB)입니다. 자료동화 없는 대조 실험은 soda3.15.2.0/ 에 있습니다.
  - name: UMD 데이터 서버 — 과거 판 (soda3.3.2, soda3.4.2 등)
    url: https://dsrs.atmos.umd.edu/DATA/
    login: false
    method: HTTP(S) 직접 다운로드
    note: MERRA-2 강제력(3.3.2), ERA-Interim 강제력(3.4.2) 등 이전 판 폴더가 남아 있습니다.
  - name: APDRC ERDDAP — SODA 3.15.2 5일 2차원 변수
    url: https://apdrc.soest.hawaii.edu/erddap/griddap/hawaii_soest_65c6_e6c0_c600.html
    login: false
    method: ERDDAP 부분 추출 / OPeNDAP
    note: 하와이대 APDRC 사본입니다. 2026-10 확인 시 1980-01-03 ~ 2022-12-23까지만 있어 UMD 원본보다 짧습니다.
  - name: NSF NCAR GDEX — SODA3 앙상블 평균·표준편차 (d650000)
    url: https://gdex.ucar.edu/datasets/d650000/
    method: 웹 다운로드
    note: 여러 강제력 판의 5일 0.5° 앙상블 평균·표준편차로, 1980-01-03 ~ 2016-12-24입니다. 개별 판과 다른 제품입니다.

example:
  lang: python
  note: "UMD 서버의 1/2° 재격자 월평균 1년 파일(약 2.7 GB)을 받아 xarray로 엽니다. 변수 이름은 README 기준입니다."
  code: |
    import urllib.request
    import xarray as xr

    url = ("https://dsrs.atmos.umd.edu/DATA/soda3.15.2/REGRIDED/ocean/"
           "soda3.15.2_mn_ocean_reg_2020.nc")
    fname = "soda3.15.2_mn_ocean_reg_2020.nc"
    urllib.request.urlretrieve(url, fname)   # 약 2.7 GB

    ds = xr.open_dataset(fname)
    print(ds["temp"])   # 잠재수온 (°C), 12개월 × 50층
    print(ds["ssh"])

tips:
  - "논문에는 반드시 판 번호(예: SODA3.15.2, SODA3.4.2)를 적으세요. 판마다 대기 강제력과 기간이 달라 결과가 다릅니다. 이름 끝의 .0(예: 3.15.2.0)은 자료동화를 하지 않은 대조 실험입니다."
  - "판 이름의 두 번째 숫자가 강제력을 뜻합니다: 3.3 MERRA-2, 3.4 ERA-Interim, 3.7 JRA-55, 3.12 JRA55-do, 3.15 ERA5 등."
  - "원 격자는 삼극(tripolar) 격자라 북극 부근에서 위경도 격자가 아닙니다. 지도·지역 평균은 1/2° Mercator 재격자 파일이 편하지만, 재격자에서 수온·염분은 보존형, 유속은 비보존형으로 옮겼다고 안내되어 있습니다."
  - "SODA README가 두 곳에 있고(soda.umd.edu, www2.atmos.umd.edu/~carton) 판 목록·벌크 공식 표기가 서로 다릅니다. 판별 강제력과 기간은 서버 폴더와 파일 속성으로 다시 확인하세요."
  - "APDRC·NCAR 사본은 UMD 원본보다 기간이 짧거나(APDRC ~2022-12) 다른 제품(NCAR 앙상블 평균)입니다. 최신 기간은 UMD 서버에서 받으세요."

