notices:
  - date: "2026-04-28"
    level: info
    title: Metop-SG A1(Metop-D) 전파 엄폐 자료 평가 보고서 공개
    body: >-
      ROM SAF Report 49에 따르면 2025년 8월 13일 발사된 EPS-SG A1(Metop-D)의 Level 1 굴절각 자료가 2025년 11월 6일부터 EUMETCast로 배포되고 있으며, 하루 약 1,200개 엄폐를 냅니다.
      배경장과의 차이 표준편차가 Metop-B·C, PlanetiQ, Spire보다 작았고, 영국 기상청은 2026년 6월 무렵 현업 동화를 예상했습니다.
    source: https://rom-saf.eumetsat.int/previous_news.php#April28-26_205
  - date: "2026-03-20"
    level: info
    title: ROM SAF 시범 자료 — 대기 10년 기온 추세 (CDR GRM-28-R1 + ICDR GRM-29-I1)
    body: >-
      2002~2016년은 다중 임무 CDR(GRM-28-R1), 그 뒤는 Metop ICDR(GRM-29-I1)로 이은 월 격자 시계열로 표본 오차를 보정한 10년 추세를 계산해 공개했습니다.
      CDR과 ICDR을 이어 쓰는 공식 예시로 참고할 수 있습니다.
    source: https://rom-saf.eumetsat.int/previous_news.php
  - date: "2024-03-08"
    level: info
    title: ROM SAF Metop 준실시간 처리 변경 (GPAC 3.4) — 파일 이름·속성 변경
    body: >-
      Metop 준실시간 처리기가 GPAC 0.4.3에서 3.4.0으로 바뀌면서 netCDF 파일 이름과 전역 속성이 다른 ROM SAF 제품과 같은 형식으로 바뀌었고, bgr 파일이 bgo 파일로 대체되었습니다.
      고고도 반구 편향이 줄고 품질검사 변경으로 정상 엄폐가 늘었습니다. 자동 처리 스크립트를 쓴다면 파일 이름 규칙을 확인하세요.
    source: https://rom-saf.eumetsat.int/previous_news.php

