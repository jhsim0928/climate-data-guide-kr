    CPC·NCEP 페이지에는 공식 인용 문구가 없습니다. 본문에 NOAA NCEP/CPC의 CORe 재분석을 썼다는 사실과 받은 곳(NODD·NOMADS·GDEX), 접근 날짜를 밝히고,
    GDEX 사본을 썼다면 위 데이터셋 인용을 붙이세요. 위 DOI는 개별 논문이 아니라 41차 CDPW 논문집(Climate Prediction S&T Digest, 2017) 전체에 부여된 것입니다.

notices:
  - date: "2026-04-01"
    level: info
    title: NODD에 1950~2025년 전 기간 업로드 완료
    body: >-
      CPC가 2026년 4월 1일 기준으로 1950~2025년 자료(3시간·일평균·월평균)를 NOAA NODD(Google Cloud)에 올렸다고 밝혔습니다.
      이후 자료는 약 1일 지연으로 실시간에 가깝게 추가됩니다.
    source: https://www.cpc.ncep.noaa.gov/products/CORe/index.html
  - date: "2026-03-19"
    level: info
    title: CORe 현업 운영 시작 — CDAS 대체
    body: >-
      CPC CORe 페이지는 CORe가 2026년 3월 19일 현업에 들어갔다고 적고 있습니다(PSL 공지는 NCEP의 전환일을 3월 18일로 표기).
      NCEP 국장 승인에 따라 CDAS는 내부 전환용으로 1년간 더 돌리되, 공개 배포는 CORe 운영 30일 뒤 중단하는 것으로 정해졌습니다.
      PSL은 당장 CORe를 자체 제공할 계획이 없다고 밝혔습니다.
    source: https://www.cpc.ncep.noaa.gov/products/CORe/index.html
  - date: "2026-03-13"
    level: info
    title: NCAR GDEX에 CORe(d090004) 공개
    body: UCAR 데이터 카탈로그상 2026년 3월 13일 공개되었으며, CC BY 4.0이고 데이터셋 DOI는 아직 부여되지 않았습니다.
    source: https://data.ucar.edu/dataset/noaa-conventional-observation-reanalysis-core
  - date: "2026-03-09"
    level: warning
    title: CDAS 파일 제공 종료 — NOMADS·FTP의 cdas, cdas2 경로 삭제
    body: >-
      NWS 서비스 변경 공지 SCN 26-12(2월 9일 발행, 2월 13일 수정)에 따라 2026년 3월 9일부터 NOMADS·FTP의 cdas/, cdas2/ 폴더와
      tgftp의 CDAS 경로 자료를 더 이상 받을 수 없습니다. CORe 자료는 /com/core/ 경로에서 제공됩니다.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf
  - date: "2026-03-09"
    level: warning
    title: 파일 형식 GRIB1 → GRIB2, 파일 이름·폴더 구조 변경
    body: >-
      CDAS의 GRIB1 파일이 CORe의 GRIB2 파일로 바뀌었습니다. 새 경로는 core.YYYYMMDD/HH/post/ 아래 flx, flx_stats, nceppost, spost, spost_stats이고,
      파일 이름은 core.tRRz.flx.memMMM.grib2처럼 멤버(001~080)·앙상블 평균(ensmean)·통계(ensstats)로 나뉩니다. 기존 CDAS 내려받기 스크립트는 수정해야 합니다.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf
  - date: "2025-09-05"
    level: warning
    title: NODD flx 파일의 구름 상·하단 필드 제거, 레코드 번호 변경 예정
    body: >-
      구름 상·하단 기온·기압(TMP/PRES)을 모델 격자에서 가우시안 격자로 옮기는 과정에 문제가 있어, NODD에 올린 flx 파일에서는 해당 필드를 뺐습니다.
      CPC는 실시간 갱신 때 고쳐진 필드가 들어가 flx 파일에 GRIB 메시지 11개가 늘고 필드 번호가 달라진다고 안내했습니다.
    source: https://ftp.cpc.ncep.noaa.gov/CORe/get_core/get_core.txt

