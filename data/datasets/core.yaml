# ─────────────────────────────────────────────────────────────
# CORe — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: core
name: CORe
full_name: NOAA Conventional Observation Reanalysis (미국 NOAA 재래식 관측 재분석, CDAS 후속 현업 재분석)
category: reanalysis
domain: atmosphere
group: 재분석
order: 85
domains: [대기, 육지]
provider: NOAA NCEP 기후예측센터(CPC), EMC·PSL 공동 개발 (배포 NCEP NOMADS, NOAA NODD(Google Cloud), NSF NCAR GDEX)

status: active
status_note: >-
  CPC에 따르면 2026년 3월 19일 NCEP 현업 시스템으로 운영을 시작했고, R1의 실시간 연장이던 CDAS를 대체했습니다.
  NOAA NODD 클라우드 아카이브에 1950년부터 현재까지의 앙상블 평균이 약 1일 남짓 지연으로 매일 추가되며(2026-10-12 확인 시 2026년 10월 10일 12 UTC까지),
  NOMADS에는 최근 7일분이 앙상블 멤버와 함께 올라옵니다. NCAR GDEX(d090004)에도 사본이 있습니다.

period:
  start: "1950-01"
  end: present
  note: >-
    1950년 1월 1일 00 UTC부터(R1·CDAS는 1948년부터). CPC는 2026년 4월 1일 기준 1950~2025년 자료를 NODD에 올렸다고 밝혔고,
    이후 기간은 현업 운영분이 이어 붙습니다. NOMADS는 최근 7일만 보관하므로 과거 기간은 NODD나 GDEX에서 받습니다.

resolution:
  spatial_short: "78 km (0.7°)"
  temporal_short: "3시간"
  spatial: "모델 FV3GFS(UFS) C128 큐브구(cubed-sphere) 격자(CPC 표기 0.7 degree) / 자료동화·제공 격자: flx·pgb 모두 512 × 256 가우시안 격자(GDEX 표기 약 0.703° × 0.702°)"
  vertical: "모델 64층(하이브리드 기압-시그마) / pgb 기압면 22층(1000~1 hPa), 연직속도 `VVEL`은 14층(1000~100 hPa) / flx 토양 4층(0~2 m)"
  temporal: "3시간(00·03·…·21 UTC 분석, 자료동화 주기는 6시간), NODD·GDEX 일평균·월평균 별도"

coverage:
  short: 전지구
update: 매일(현업) — CPC 표기 약 1일 지연(NOMADS 1.x일, NODD 1.x일 이상)
license: NOAA 공개 자료로 NOMADS·NODD에서 무료(CPC·NCEP 페이지에 별도 라이선스 문구는 없음) / NCAR GDEX 사본은 CC BY 4.0
account_required: false

summary: >-
  CORe는 NOAA 기후예측센터(CPC)가 기후 감시용으로 만든 1950년~현재 대기 재분석으로, 2026년 3월 NCEP/NCAR R1의 실시간 연장(CDAS)을 대체했습니다.
  R1을 다시 돌린 자료가 아니라 UFS 기반 FV3GFS 모델(C128, 64층)과 80개 멤버 앙상블 칼만 필터(EnKF)로 새로 만든 별개의 재분석입니다.
  위성 자료는 대기운동벡터(AMV)만 쓰고 위성 복사휘도·기온 산출물은 넣지 않아, 위성 관측 도입에 따른 인위적 '기후 변화'를 줄이고
  최상의 순간 상태보다 장기 추세·편차의 일관성을 우선했습니다. 3시간 간격 GRIB2로 제공되며 기본 산출물은 80개 분석의 앙상블 평균입니다.

time_convention:
  summary: >-
    파일 시각(YYYYMMDDHH, 3시간 간격)은 CORe 분석 시각이고, pgb 기압면 변수와 flx의 기온·바람·적설 같은 상태 변수는 그 시각의 값입니다.
    flx의 '3시간 평균·누적·최고·최저' 변수는 GDEX 파일 메타데이터상 표시 시각부터 3시간 구간입니다(예: flx.2026041300 = 00~03 UTC).
    강수 `PRATE`는 누적량이 아니라 3시간 평균 강도(kg m-2 s-1)입니다.
  points:
    - "자료동화 주기는 6시간(00·06·12·18 UTC, 관측은 주기 시각 ±3시간)입니다. 각 주기의 예보는 증분 갱신으로 관측을 반영하는 '강제' 구간 뒤에 '자유' 예보로 이어지며, CPC는 이 자유 예보 구간의 값(3시간·6시간 시점)을 CORe 분석으로 쓴다고 설명합니다. 그래서 GRIB 안에서는 분석값도 예보(Forecast)로 표기될 수 있습니다."
    - "NOMADS 원본은 사이클 폴더(core.YYYYMMDD/HH) 아래 core.tRRz 파일이며, RR(= HH+03 또는 HH+06)이 분석 시각입니다. NODD·GDEX 파일은 분석 시각을 이름에 그대로 씁니다."
    - "평균 구간의 시작/끝 기준은 NCAR GDEX THREDDS의 시간 경계(time bounds 0~3시간, reftime = 파일 시각)로 확인한 것입니다. CPC 문서에는 따로 적혀 있지 않으므로, 시간 정밀도가 중요하면 wgrib2 목록(-v)으로 직접 확인하세요."
    - "3시간 강수량(mm)은 `PRATE`에 10800을, 하루 강수량(mm/day)으로 바꾸려면 86400을 곱합니다."
    - "NODD·GDEX 일평균은 하루 8개 3시간 값의 평균(GRIB 표기 \"8@3 hour ave(anl)\"), 월평균은 그달의 모든 3시간 값 평균(31일이면 248개)입니다."
    - "분석은 80개 멤버의 앙상블 평균이므로, 개별 멤버보다 극값(최대 풍속 등)이 약해집니다."
  source: https://www.cpc.ncep.noaa.gov/products/CORe/pns/eval/eval_datasets.html
  source_name: "CPC CORe 자료 설명(시간 규칙) + get_core.txt(일·월평균 표기) + NCAR GDEX d090004 THREDDS 파일 메타데이터(시간 경계)"

variables:
  note: >-
    NCAR GDEX(d090004) THREDDS 파일 메타데이터와 CPC 문서 기준 주요 변수입니다. 변수명은 wgrib2 목록·.idx 파일에 나오는 GRIB2 약어이고,
    xarray(cfgrib)로 열면 ecCodes 이름(예: `t`, `gh`)으로 바뀝니다. 모든 값은 80개 멤버의 앙상블 평균(NOMADS에는 멤버별 파일도 있음)입니다.
    CDAS(R1)에 있던 `PRMSL`은 없고 평균 해면기압은 `PRES`(mean sea level)로 제공되며, 상대 소용돌이도·발산(RELV·RELD)은 바람에서 직접 계산해야 합니다.
  full_list: https://gdex.ucar.edu/datasets/d090004/
  groups:
    - name: 기압면 분석 (pgb, 512×256 가우시안, 22층)
      kind: instant
      period: "3시간 간격"
      items:
        - "기온 — `TMP` (K)"
        - "지위고도 — `HGT` (gpm)"
        - "동서 · 남북 바람 — `UGRD`, `VGRD` (m s-1)"
        - "상대습도 — `RH` (%)"
        - "비습 — `SPFH` (kg kg-1)"
        - "연직속도(기압 좌표, 1000~100 hPa 14층) — `VVEL` (Pa s-1)"
        - "절대 소용돌이도 — `ABSV` (s-1)"
        - "유선함수 · 속도 퍼텐셜 — `STRM`, `VPOT` (m2 s-1)"
        - "오존 혼합비 — `O3MR` (kg kg-1)"
    - name: 해면기압 (pgb)
      kind: instant
      period: "3시간 간격"
      items:
        - "평균 해면기압 — `PRES` (mean sea level, Pa)"
        - "평균 해면기압(Eta 모델 환산) — `MSLET` (Pa)"
    - name: 지표·근지표 상태 (flx)
      kind: instant
      period: "3시간 간격"
      items:
        - "2 m 기온 — `TMP` (2 m above ground, K)"
        - "2 m 비습 — `SPFH` (2 m above ground, kg kg-1)"
        - "10 m 동서 · 남북 바람 — `UGRD`, `VGRD` (10 m above ground, m s-1)"
        - "지면 기압 — `PRES` (surface, Pa)"
        - "지표면 온도 — `TMP` (surface, K)"
        - "가강수량(대기 전층) — `PWAT` (kg m-2)"
        - "적설 깊이 — `SNOD` (m)"
        - "적설 물당량 — `WEASD` (kg m-2)"
        - "해빙 피복률 — `ICEC` (비율)"
    - name: 강수·플럭스·구름 — 3시간 평균 (flx)
      kind: mean
      period: 3시간
      items:
        - text: "강수율 — `PRATE` (kg m-2 s-1)"
          note: "GDEX 메타데이터 \"Precipitation rate (3_Hour Average)\", 표시 시각부터 3시간 평균"
        - "대류성 강수율 — `CPRAT` (kg m-2 s-1)"
        - "잠열 · 현열 순플럭스 — `LHTFL`, `SHTFL` (W m-2)"
        - "지중 열플럭스 — `GFLUX` (W m-2)"
        - "하향 단파 · 장파 복사(지표) — `DSWRF`, `DLWRF` (W m-2)"
        - "상향 단파 · 장파 복사(지표 · 대기 상단) — `USWRF`, `ULWRF` (W m-2)"
        - "대기 상단 하향 단파 복사 — `DSWRF` (nominal top, W m-2)"
        - "지표 운동량 플럭스 u · v — `UFLX`, `VFLX` (N m-2)"
        - "전운량 · 상층 · 중층 · 하층 · 경계층 운량 — `TCDC` (%)"
    - name: 2 m 최고·최저 — 3시간 구간 (flx)
      kind: max
      period: 3시간
      items:
        - text: "2 m 최고 기온 — `TMP` (3시간 최댓값, K)"
          note: "CDAS의 `TMAX`와 달리 `TMP`에 통계 처리(최대)가 붙은 형태"
        - text: "2 m 최저 기온 — `TMP` (3시간 최솟값, K)"
          kind: min
        - "2 m 최대 비습 — `SPFH` (3시간 최댓값, kg kg-1)"
        - text: "2 m 최소 비습 — `SPFH` (3시간 최솟값, kg kg-1)"
          kind: min
    - name: 유출·일조 — 3시간 누적 (flx)
      kind: accum
      period: 3시간
      items:
        - "지표 유출(storm surface runoff) — `SSRUN` (kg m-2)"
        - "일조 시간 — `SUNSD` (s)"
    - name: 고정 지면 정보 (flx)
      kind: static
      items:
        - "해륙 구분(0 바다, 1 육지) — `LAND` (0/1)"
        - "토양 형태 · 식생 형태 · 경사 형태 — `SOTYP`, `VGTYP`, `SLTYP` (코드)"

access:
  - name: NOAA NODD — Google Cloud 버킷 noaa-nws-ncep-core
    url: https://storage.googleapis.com/noaa-nws-ncep-core/
    login: false
    method: HTTPS 직접 다운로드 / Google Cloud(gsutil) / get_core.py
    note: >-
      1950년~현재 전 기간. 앙상블 평균만 있고(멤버·통계 없음) 3시간·일평균·월평균 GRIB2를 grib/3hour|day|month/flx|pgb/ 아래에
      flx.YYYYMMDDHH.grb, pgb.YYYYMMDD.grb, pgb.YYYYMM.grb처럼 저장합니다. 파일마다 .idx 목록이 있어 필요한 변수만 바이트 범위로 받을 수 있습니다.
      NOAA NODD 목록에는 Google Cloud만 올라 있고 AWS·Azure 사본은 없습니다.
  - name: NCEP NOMADS — CORe 현업 자료
    url: https://nomads.ncep.noaa.gov/pub/data/nccf/com/core/
    login: false
    method: HTTPS 직접 다운로드
    note: >-
      최근 7일만 보관. 사이클 폴더(core.YYYYMMDD/HH/post/) 아래 flx(멤버 001~080·앙상블 평균), flx_stats(앙상블 통계),
      nceppost(pgb 앙상블 평균), spost·spost_stats(변수·층을 줄인 멤버별·평균·통계 기압면 파일)가 있습니다. 앙상블 멤버가 필요하면 여기서 받아야 합니다.
  - name: NSF NCAR GDEX — NOAA CORe (d090004)
    url: https://gdex.ucar.edu/datasets/d090004/
    method: 웹 다운로드 / THREDDS(OPeNDAP) / 부분 추출·형식 변환 / Globus
    note: >-
      3시간·일·월 단위 flx(2D)·pgb(3D 기압면) 앙상블 평균 GRIB2, CC BY 4.0, 매일 갱신. 2026-10-12 확인 시 THREDDS 목록에는
      2003~2025년 폴더가 보이지 않았으므로, 전 기간이 필요하면 NODD를 쓰세요.
  - name: CPC 다운로드 스크립트 get_core.py
    url: https://ftp.cpc.ncep.noaa.gov/CORe/get_core/get_core.py
    login: false
    method: Python 스크립트(NODD에서 기간·변수 정규식으로 내려받기)
    note: 사용법은 https://ftp.cpc.ncep.noaa.gov/CORe/get_core/get_core.txt 에 있습니다. 예) get_core.py flx 195001 12 1 PRATE .

example:
  lang: python
  note: >-
    NODD의 3시간 pgb 파일 하나를 받아 xarray(cfgrib)로 500 hPa 기온을 읽는 예입니다. 변수마다 기압면 수가 달라(`VVEL` 14층)
    한꺼번에 열면 충돌하므로 shortName으로 걸러 엽니다.
  code: |
    import urllib.request
    import xarray as xr

    url = ("https://storage.googleapis.com/noaa-nws-ncep-core/"
           "grib/3hour/pgb/2025/01/pgb.2025011512.grb")
    urllib.request.urlretrieve(url, "pgb.2025011512.grb")

    ds = xr.open_dataset(
        "pgb.2025011512.grb", engine="cfgrib",
        backend_kwargs={"filter_by_keys": {"typeOfLevel": "isobaricInhPa", "shortName": "t"},
                        "indexpath": ""},
    )
    t500 = ds["t"].sel(isobaricInhPa=500)   # K, 512×256 가우시안 격자
    print(t500)

tips:
  - "R1을 고쳐 다시 만든 자료가 아닙니다. 모델(T62 28층 MRF → C128 64층 FV3GFS), 자료동화(3D-Var → 80멤버 EnKF), 관측(위성 기온 산출물 제외), 경계조건(더 새로운 SST·해빙·적설 분석), 격자(2.5° → 512×256 가우시안)가 모두 다릅니다. R1(또는 CDAS)과 CORe를 한 시계열로 이어 붙이지 말고, 편차는 각 자료의 기후값으로 따로 계산하세요."
  - "기본 산출물은 앙상블 평균이라 열대저기압 같은 강한 현상의 최대 풍속이 분석 불확실성만큼 약해집니다. CPC는 태풍 추적이라면 80개 분석 각각에 추적 프로그램을 돌려 결과를 평균하라고 권합니다. 멤버 파일은 NOMADS 최근 7일분에만 있습니다."
  - "GRIB2(wgrib2 권장)입니다. CDAS의 GRIB1 스크립트는 그대로 쓸 수 없고, `PRMSL` → `PRES`(mean sea level), `TMAX`·`TMIN` → `TMP`(3시간 최대·최소)처럼 이름도 다릅니다. 레코드 번호 대신 변수·층 이름으로 고르세요. CPC는 실시간 갱신 후 flx 파일에 GRIB 메시지 11개가 늘어 번호가 바뀐다고 안내했습니다."
  - "다른 격자가 필요하면 CPC 재격자 안내를 따르세요. wgrib2 -new_grid로 강수(PRATE·CPRAT)는 보존형(budget), 토양·식생 형태는 최근접, 나머지는 쌍선형 보간을 권하며, 지구 반지름은 6371.229 km입니다."
  - "위성 자료를 대기운동벡터(AMV)만 쓰므로 위성 시대 전후의 인위적 불연속은 줄였지만 완전히 위성 무관 자료는 아닙니다. 1979년 이전에는 전지구 적설 분석이 없어 모델 적설에 간단한 보정을 넣었다고 CPC 평가 문서가 밝히고 있습니다."
  - "CPC 평가 문서는 단파·장파 복사 플럭스의 절댓값은 구름에 좌우되어 맞추기 어렵다며 편차 위주로 쓰기를 권하고, 대기 상단 하향 단파(DSWRFtoa) 계산에 경도 방향 이상 패턴이 있다고 적었습니다."
  - "R1 형식(2.5° 기압면·192×94 플럭스, 6시간, GRIB1)을 흉내 낸 'CDAS look-alike' 파일이 평가용·비현업으로 CPC FTP(CDAS_clone_temporary)에 제공된 적이 있습니다. 현재 갱신 여부는 확인하지 못했으니 연구에는 정식 GRIB2 아카이브를 쓰세요."

