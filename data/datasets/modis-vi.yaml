          author      = {Didan, Kamel and Barreto Munoz, Armando},
          title       = {{MODIS} Vegetation Index User's Guide ({MOD13} Series), Version 3.10 (Collection 6.1)},
          institution = {Vegetation Index and Phenology Lab, The University of Arizona},
          year        = {2019},
          url         = {https://lpdaac.usgs.gov/documents/621/MOD13_User_Guide_V61.pdf}
        }
  acknowledgement: >-
    LP DAAC는 EOSDIS 자료 이용·인용 지침에 따라 실제로 쓴 제품(위성·해상도·주기별)의 데이터셋 DOI를 인용해 달라고 요청합니다.
    DOI는 10.5067/MODIS/<짧은 이름>.061 형식입니다(예: MOD13A1 500 m 16일은 10.5067/MODIS/MOD13A1.061, MOD13C1 0.05° 16일은 10.5067/MODIS/MOD13C1.061).
    지수 정의와 합성 방식에는 Huete et al. (2002)을 인용하세요.

transitions:
  - from: MODIS 식생지수 C6.1 (MOD13·MYD13)
    to: VIIRS 식생지수 V2 (VNP13·VJ113·VJ213)
    to_id: viirs-vi
    status: planned
    date: "2027"
    summary: >-
      MODIS 식생지수 체계를 VIIRS에 옮긴 후속 자료로, 합성 방식(CV-MVC)과 NDVI·EVI는 이어지지만 250 m 제품이 없고, 청색 밴드 파장이 달라 EVI 연속성이 약하며,
      2밴드 EVI2가 더해졌습니다. 결측값·척도 표기·화소 신뢰도 등급·파일 형식이 달라 코드를 고쳐야 합니다. MODIS 수집은 Terra·Aqua 종료(2026년 말~2027년)와 함께 끝납니다.
    changes:
      - aspect: 위성·통과 시각
        before: "Terra(원래 10:30 하강)·Aqua(원래 13:30 상승) — 궤도 표류 중"
        after: "Suomi NPP(2012~, 2026년 11월 배포 종료 예정)·NOAA-20(2018~)·NOAA-21(2023~), 13:30 상승 통과. Terra의 오전 관측을 잇는 제품은 없음"
      - aspect: 제품 해상도
        before: "250 m(Q1)·500 m(A1)·1 km(A2·A3)·0.05°(C1·C2)"
        after: "500 m(A1)·1 km(A2·A3)·0.05°(C1·C2) — 250 m 제품 없음"
      - aspect: 16일 합성 간격
        before: "위성별 16일마다(Terra·Aqua가 8일 엇갈려 둘을 합치면 준8일)"
        after: "위성별로 16일 합성을 8일마다 생산(기간이 8일씩 겹침)"
      - aspect: 지수
        before: "NDVI, EVI"
        after: "NDVI, EVI, EVI2(적색·근적외 2밴드, 청색 밴드 없이 계산)"
      - aspect: 합성 방식
        before: "CV-MVC — NDVI 상위 2개 중 시야각 최소"
        after: "CV-MVC — NDVI 상위 2/3 관측 중 시야각 최소, 시야각 구간([0–30°], [>30°])을 더해 큰 시야각 관측을 피함"
      - aspect: 청색 밴드
        before: "MODIS 밴드 3, 459–479 nm"
        after: "VIIRS M3, 478–498 nm — EVI가 청색 밴드에 민감해 MODIS EVI와의 연속성이 약해짐(그래서 EVI2 도입)"
      - aspect: 반사도 층
        before: "적색·근적외·청색·중적외(밴드 1·2·3·7)"
        after: "적색·근적외·청색·녹색·SWIR1·SWIR2·SWIR3"
      - aspect: 저장값·품질 층 (16일 500 m 기준)
        before: "척도 0.0001, 지수 결측 −3000·유효 −2000~10000, 화소 신뢰도 0~3(결측 −1)"
        after: "척도 표기 10000(÷10000), 지수 결측 −15000·유효 −10000~10000, 화소 신뢰도 0~11(결측 −4)"
      - aspect: 층 이름·파일 형식
        before: "`250m 16 days NDVI` 등, HDF-EOS2(HDF4)"
        after: "`500 m 16 days NDVI` 등(해상도와 m 사이 띄어쓰기), HDF-EOS5(HDF5)"
    impacts:
      - 250 m가 필요한 분석(소규모 농경지·도시 녹지 등)은 VIIRS로 같은 해상도를 이어갈 수 없습니다. 500 m로 해상도를 맞춰 비교하세요.
      - EVI 장기 시계열은 청색 밴드 차이로 이음매가 생길 수 있으니, 두 센서를 이을 때는 NDVI나 EVI2를 우선 검토하세요.
      - 결측값·척도 표기·화소 신뢰도 등급이 달라 MODIS용 품질 필터 코드를 그대로 쓰면 안 됩니다.
      - Suomi NPP 제품(VNP13)은 2026년 11월 배포가 끝나므로, 앞으로 이어 쓸 기준은 NOAA-21(VJ213, 주)·NOAA-20(VJ113, 보조)입니다.
    sources:
      - name: Transition from MODIS to VIIRS (NASA Earthdata 공지, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: VNP13 사용자 안내서·ATBD V2.1.2 (Didan et al., 2018)
        url: https://lpdaac.usgs.gov/documents/1372/VNP13_User_Guide_ATBD_V2.1.2.pdf
      - name: Earthdata 카탈로그 — VNP13A1 V002 (층 표)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
      - name: Román et al. (2024) — MODIS C6.1과 VIIRS C2 육상 제품 연속성 (RSE)
        url: https://doi.org/10.1016/j.rse.2023.113963
  - from: MODIS 식생지수 C6
    to: MODIS 식생지수 C6.1
    status: completed
    date: "2023-07"
    summary: >-
      과학 알고리즘은 바꾸지 않고 Terra·Aqua L1B 보정 방식과 편광 보정만 바꿔 전 기간을 다시 만든 판입니다. 형식·층 이름은 C6과 같고,
      C6(006) 육상 제품은 2023년 7월 31일 배포가 끝났습니다.
    changes:
      - aspect: 알고리즘
        before: "C6 (8일 사전 합성 L2G 반사도 입력, CV-MVC)"
        after: "변경 없음"
      - aspect: 입력 보정
        before: "C6 L1B 보정"
        after: "Terra·Aqua L1B 보정 방식 변경, 편광 보정 변경"
      - aspect: 제공 상태
        before: "006 — 2023-07-31 배포 종료"
        after: "061 — 현재 유일한 판"
    impacts:
      - 006으로 만든 결과는 061로 다시 확인하세요. 006 파일은 더 이상 받을 수 없습니다.
    sources:
      - name: MOD13 사용자 안내서 V3.10 (2019)
        url: https://lpdaac.usgs.gov/documents/621/MOD13_User_Guide_V61.pdf
      - name: MODIS Version 6.0 육상 제품 배포 종료 최종 공지 (2023-07-25)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS 대기 모드 진입 — 2026년 85~86일 일부 자료 '의심/불량' 처리
    body: >-
      2026년 3월 26일 약 20시(UTC) Terra 이상으로 MODIS가 대기(standby) 모드에 들어갔다가 3월 27일 과학 모드로 돌아왔습니다.
      보정팀은 2026년 85일 20:00 UTC부터 86일 19:23 UTC까지의 자료를 의심/불량으로 표시했습니다. 이 기간을 포함한 MOD13 16일 합성(2026년 81일 시작분)과 3월 월자료는 품질 층을 확인하세요.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: Terra 2027년 2월, Aqua 2027년 9월 과학 운영 종료 전망
    body: >-
      NASA Earth Observer의 Terra 특집(2025-12-29 게재, 2026-03-20 갱신) 편집자 주는 과학 활동 종료 예상 시점을 Terra 2027년 2월, Aqua 2027년 9월로 밝혔습니다.
      그때까지는 운영을 이어가며, Terra는 배터리 노화로 전력이 부족해 2025년 4월 9일 MOPITT를 꺼 나머지 4개 센서의 전력을 아꼈고, ASTER 단파적외(SWIR)는 이미 동작하지 않습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-01-08"
    level: warning
    title: MODIS 품질팀 공지 — Terra·Aqua 궤도 표류가 화소 크기·주사 틈·일주기 표집에 영향
    body: >-
      LDOPE는 궤도 유지를 멈춘 Terra(마지막 조정 2022년)·Aqua(2021년)의 표류로 화소 크기와 간격, 주사 틈, 보타이(bowtie) 겹침, 일주기 표집이 바뀌었고
      2024년 말부터 영향이 크게 늘었다고 알렸습니다. 산불 제품을 비롯한 각 제품에 미치는 영향은 조사 중입니다.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool의 MODIS 배포 종료(2025-06-30) — Earthdata Cloud로 전환
    body: >-
      LP DAAC는 C6.1을 포함한 모든 MODIS 자료의 Data Pool 접근을 2025년 6월 30일 끝내고 NASA Earthdata Cloud를 주 저장소로 쓴다고 공지했습니다.
      Earthdata Search와 AppEEARS 사용자는 바뀌는 점이 없지만, Data Pool 주소를 직접 쓰던 스크립트는 고쳐야 합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 예정
    body: >-
      NASA는 Terra·Aqua가 2026년 말이나 2027년 초에 운영을 멈출 것으로 보고, 그때 MODIS 자료 수집이 끝나며 마지막 재처리가 이어진다고 공지했습니다.
      두 위성의 궤도 표류가 통과 시각과 자료 품질에 영향을 줄 수 있으니 비슷한 VIIRS 제품으로 옮기라고 권합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS Version 6.0 육상 제품 배포 종료(2023-07-31) — V6.1만 제공
    body: >-
      LP DAAC가 Terra·Aqua·결합 MODIS V6.0 육상 제품(MOD44W·MCD43GF 제외)의 배포를 2023년 7월 31일 끝냈습니다.
      사용자 안내서·ATBD는 DOI 페이지에 남아 있으며, V6.1로 옮기라고 안내했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023
  - date: "2021-11-10"
    level: info
    title: Aqua 궤도 표류 계획 — 16일 반복 관측 주기가 엄밀히 지켜지지 않음
    body: >-
      LP DAAC는 Aqua가 2021년 7월부터 늦은 오후 쪽으로 표류해 2026년 8월 무렵 통과 시각이 약 15:50에 이를 것이라고 안내했습니다.
      제품은 대체로 과학 품질을 유지하지만 고도 하강으로 격자 크기가 줄고, 엄밀한 16일 반복 관측이 깨지며, 태양 고도가 낮아져 그림자가 늘 수 있다고 밝혔습니다.
    source: https://lpdaac.usgs.gov/news/aqua-modis-acquisition-plan-through-august-2026/

