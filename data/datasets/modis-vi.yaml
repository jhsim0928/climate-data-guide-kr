# ─────────────────────────────────────────────────────────────
# MODIS 식생지수 MOD13/MYD13 (NDVI·EVI) — 데이터셋 정보 파일
# 지면 탭 '식생'. Terra·Aqua 종료 예정으로 deprecated, 후속은 VIIRS 식생지수(viirs-vi.yaml).
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: modis-vi
name: "MODIS NDVI/EVI (MOD13)"
full_name: MODIS Vegetation Indices (MOD13Q1/A1/A2/A3/C1/C2, MYD13) Version 6.1 (MODIS NDVI·EVI, 250 m~0.05°·16일/월)
category: satellite
domain: land
group: 식생
order: 12
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA MODIS 육상팀(애리조나대 식생지수·생물계절 연구실, K. Didan) / LP DAAC

status: deprecated
status_note: >-
  Collection 6.1(061)이 계속 나오고 있지만(2026-10-13 확인 시 MOD13Q1은 2026-09-14 시작 합성, MOD13A3는 2026년 8월까지), 위성 수명이 끝나 가는 자료입니다.
  NASA는 Terra·Aqua가 2026년 말~2027년 초 운영을 마치면 MODIS 자료 수집을 멈추고 마지막 재처리를 한 뒤 VIIRS 유사 제품으로 옮기라고 안내했고,
  NASA Earth Observer는 과학 운영 종료 시점을 Terra 2027년 2월, Aqua 2027년 9월로 내다봤습니다. 궤도 표류로 통과 시각과 16일 반복 관측 주기가 흐트러지고 있으니
  새 연구는 VIIRS 식생지수(VNP13·VJ113·VJ213)와 함께 쓰는 방안을 준비하세요.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra(MOD13)는 2000-02-18부터, Aqua(MYD13)는 2002-07-04부터입니다. 2026-10-13에 CMR로 한반도 타일(h28v05)을 확인했을 때
    MOD13Q1은 2026-09-14~29 합성, MYD13Q1은 2026-09-06~21 합성, MOD13A3는 2026년 8월이 최신이었습니다. MODIS 자료 수집은 Terra·Aqua 운영 종료와 함께 끝날 예정입니다.

resolution:
  spatial_short: "0.25 km (0.0025°)"
  temporal_short: "16일"
  spatial: >-
    MODIS Sinusoidal 타일 격자(적도에서 약 10°×10°): 250 m(Q1), 500 m(A1), 1 km(A2·A3) /
    전지구 0.05° 위경도 기후모델격자(CMG, 3600×7200, C1·C2)
  vertical: 지표 단일층
  temporal: >-
    16일 합성(Q1·A1·A2·C1) / 달력 월(A3·C2). Terra와 Aqua의 16일 합성은 8일 엇갈려 만들어져(Terra 1·17·33…일, Aqua 9·25·41…일 시작)
    두 위성을 함께 쓰면 8일 간격의 준(準)8일 시계열이 됩니다.

coverage:
  short: 전지구
update: 16일 합성이 끝나고 대략 2~3주 뒤 추가, 월자료는 다음 달 이후 (Terra·Aqua 운영 종료 시 중단 예정)
license: NASA 지구과학 공개 자료 — 제한 없이 무료 이용(EOSDIS 자료 이용·인용 지침), 파일 다운로드에는 무료 NASA Earthdata 로그인 필요, 데이터셋 DOI 인용 요청
account_required: true

summary: >-
  MODIS 지표 반사도로 계산한 정규식생지수(NDVI)와 향상된 식생지수(EVI)를 16일·월 단위로 합성한 자료입니다. NDVI는 NOAA AVHRR NDVI 기록을 잇고,
  EVI는 청색 밴드로 대기 영향을 줄이고 식생이 빽빽한 곳에서도 덜 포화됩니다. 250 m부터 0.05° 전지구 격자까지 여섯 가지 해상도·주기로 나오며,
  반사도(적색·근적외·청색·중적외), 관측 각도, 합성 일자, 품질 정보가 함께 들어 있어 생물계절·가뭄·작황·토지 변화 연구에 가장 많이 쓰이는 위성 식생 자료 가운데 하나입니다.

time_convention:
  summary: >-
    16일 제품은 '제약 시야각 최대값 합성(CV-MVC)'으로 만듭니다. 16일 동안의 맑은 관측 가운데 NDVI가 가장 높은 2개를 고르고, 그중 천저에 가까운(시야각이 작은) 관측 하나를 택해
    그날의 NDVI·EVI·반사도·각도를 기록합니다(맑은 관측이 부족하면 단순 최대값 합성). 월자료(A3·C2)는 그달과 겹치는 16일 합성들을 겹친 기간에 비례해 가중 평균한 값입니다.
    파일 날짜는 합성 기간 첫날(연중일)입니다.
  points:
    - "16일 값은 기간 평균이 아니라 '선택된 하루'의 관측입니다. 실제 관측일은 `250m 16 days composite day of the year` 층에 연중일로 들어 있으니, 날짜가 중요한 생물계절 분석에서는 이 값을 쓰세요."
    - "Collection 5부터 Terra와 Aqua의 16일 합성은 8일 엇갈려 처리됩니다. 예를 들어 MOD13Q1은 2024년 1·17·33일, MYD13Q1은 9·25·41일에 시작합니다. 두 제품을 번갈아 쓰면 8일 간격이 되지만 각 값은 여전히 16일 합성입니다."
    - "합성은 해마다 1월 1일에 다시 시작하므로 그해 마지막 합성(예: 12월 19일 시작, 이듬해 1월 3일 끝)은 다음 해 첫 합성과 기간이 겹칩니다."
    - "Terra는 원래 오전 10:30(하강), Aqua는 오후 1:30(상승) 통과였으나 궤도 유지를 멈춘 뒤 Terra는 더 이른 오전, Aqua는 더 늦은 오후로 표류하고 있어 관측 시각의 태양 고도·그림자 조건이 해마다 달라집니다."
    - "C6부터 16일 합성의 입력은 일별 자료가 아니라 미리 8일로 합성한 지표 반사도(L2G, 에어로졸을 줄이려 청색이 가장 낮은 관측을 고른 것)입니다."
  source: https://lpdaac.usgs.gov/documents/621/MOD13_User_Guide_V61.pdf
  source_name: "MODIS Vegetation Index User's Guide (MOD13 Series) V3.10, 2019 + LP DAAC 컬렉션 설명 + CMR 파일 목록"

variables:
  note: >-
    LP DAAC 컬렉션 정보(MOD13Q1·MOD13A3 V061)와 MOD13 사용자 안내서 기준입니다. 층(SDS) 이름 앞에 해상도·주기가 붙습니다(250 m 16일은 `250m 16 days …`, 1 km 월은 `1 km monthly …`).
    500 m·1 km 16일과 CMG 제품은 접두어가 다르니 받은 파일에서 이름을 확인하세요. 지수·반사도는 int16 저장값에 0.0001을 곱합니다.
  full_list: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mod13q1-061
  groups:
    - name: 16일 합성 (MOD13Q1 250 m 기준, A1·A2·C1도 같은 구성)
      kind: instant
      period: 16일 합성 중 선택일
      items:
        - text: "정규식생지수(NDVI) — `250m 16 days NDVI` (무차원, 저장값 × 0.0001, 유효 −2000~10000)"
          kind: max
          period: 16일
          note: "CV-MVC — NDVI 상위 2개 관측 중 시야각이 작은 것을 고르므로 기간 최대값이거나 그에 가까운 값"
        - text: "향상된 식생지수(EVI) — `250m 16 days EVI` (무차원, 저장값 × 0.0001)"
          note: 합성 기간 중 선택된 관측일 값
        - text: "적색·근적외·청색·중적외 반사도 — `250m 16 days red reflectance`, `250m 16 days NIR reflectance`, `250m 16 days blue reflectance`, `250m 16 days MIR reflectance` (무차원, × 0.0001)"
          note: "밴드 1·2·3·7, 합성 기간 중 선택된 관측일 값"
        - text: "시야 천정각·태양 천정각·상대 방위각 — `250m 16 days view zenith angle`, `250m 16 days sun zenith angle`, `250m 16 days relative azimuth angle` (도, × 0.01)"
          note: 합성 기간 중 선택된 관측일 값
        - text: "실제 관측일 — `250m 16 days composite day of the year` (연중일 1~366)"
          note: 선택된 관측이 이루어진 날
        - text: "화소 신뢰도 요약 — `250m 16 days pixel reliability` (−1 결측, 0 좋음, 1 보통, 2 눈·얼음, 3 구름)"
          std: []
        - "식생지수 품질 비트 — `250m 16 days VI Quality` (비트 필드)"
    - name: 월자료 (MOD13A3 1 km 기준, C2 0.05°)
      kind: mean
      period: 월
      items:
        - text: "월 NDVI — `1 km monthly NDVI` (무차원, × 0.0001)"
          note: 그달과 겹치는 16일 합성(A2)의 겹친 기간 가중 평균
        - "월 EVI — `1 km monthly EVI` (무차원, × 0.0001)"
        - "월 적색·근적외·청색·중적외 반사도 — `1 km monthly red reflectance` 등 (무차원, × 0.0001)"
        - text: "화소 신뢰도 요약 — `1 km monthly pixel reliability` (−1~3)"
          std: []
        - "식생지수 품질 비트 — `1 km monthly VI Quality` (비트 필드)"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C1748066515-LPCLOUD
    method: 웹 검색·HTTPS 다운로드 / earthaccess
    note: >-
      링크는 MOD13Q1 V061입니다. 짧은 이름은 MOD13Q1·MOD13A1·MOD13A2·MOD13A3·MOD13C1·MOD13C2(Terra)와 MYD13…(Aqua), 버전은 061이며 파일은 HDF-EOS2(.hdf)입니다.
      LP DAAC Data Pool의 MODIS 배포는 2025년 6월 30일 끝났으므로 예전 Data Pool 주소를 쓰던 스크립트는 Earthdata Cloud(earthaccess 등)로 바꾸세요.
  - name: AppEEARS (영역·지점 추출)
    url: https://appeears.earthdatacloud.nasa.gov/
    method: 웹·API — 영역(GeoTIFF·NetCDF4) 또는 지점(CSV) 추출, 투영 변환 가능
    note: 타일·Sinusoidal 투영을 다루지 않고 관심 지역만 받을 수 있고, 품질 비트 해석표도 함께 줍니다.
  - name: LAADS DAAC (MOD13 제품 페이지)
    url: https://ladsweb.modaps.eosdis.nasa.gov/missions-and-measurements/products/MOD13Q1
    method: HTTPS 다운로드
    note: MODIS 처리 시스템(MODAPS) 쪽 배포처입니다. 파일 사양서(filespec)도 여기서 봅니다.

example:
  lang: python
  note: >-
    earthaccess로 2024년 Terra(MOD13Q1)와 Aqua(MYD13Q1) 16일 NDVI를 함께 받아 8일 간격 시계열을 만드는 예입니다(한반도 중부 타일 h28v05).
    HDF4 파일이라 pyhdf로 열고, 화소 신뢰도 0·1만 남깁니다. 각 값의 실제 관측일은 composite day of the year 층에 있습니다.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # 무료 NASA Earthdata 계정
    files = []
    for sn in ("MOD13Q1", "MYD13Q1"):          # Terra와 Aqua는 8일 엇갈려 합성
        res = earthaccess.search_data(
            short_name=sn, version="061",
            temporal=("2024-04-01", "2024-10-31"),
            bounding_box=(127.0, 36.0, 127.5, 36.5),   # (서, 남, 동, 북)
        )
        files += earthaccess.download(res, "./mod13q1")

    for f in sorted(map(str, files), key=lambda p: p.split(".A")[1][:7]):
        if ".h28v05." not in f:
            continue
        sd = SD(f, SDC.READ)
        ndvi = sd.select("250m 16 days NDVI")[:].astype("float32")
        rel = sd.select("250m 16 days pixel reliability")[:]
        ndvi = np.where((ndvi >= -2000) & (rel <= 1), ndvi * 0.0001, np.nan)
        print(f.split("/")[-1][:24], "평균 NDVI:", round(float(np.nanmean(ndvi)), 3))

tips:
  - "NDVI·EVI는 int16 저장값입니다. 0.0001을 곱하고, 결측값 −3000과 유효 범위(−2000~10000) 밖의 값을 먼저 지우세요. 반사도 결측은 −1000, 각도는 × 0.01입니다."
  - "`pixel reliability`(0 좋음, 1 보통, 2 눈·얼음, 3 구름)가 가장 쉬운 품질 선별입니다. 세밀하게 거르려면 `VI Quality`의 0~1번(품질), 2~5번(유용성), 6~7번(에어로졸), 8번(인접 구름), 10번(혼합 구름), 14번(눈·얼음), 15번(그림자) 비트를 쓰세요."
  - "16일 값은 그 기간의 아무 날 관측일 수 있습니다. 봄·가을 생물계절(개엽·낙엽 시기)을 날짜 단위로 따질 때는 파일 날짜 대신 `composite day of the year`를 쓰세요."
  - "Terra와 Aqua를 섞어 8일 시계열을 만들면 관측 시각(오전/오후)과 센서 보정이 번갈아 바뀝니다. 추세 분석은 한 위성 제품으로 하고, 섞을 때는 그 사실을 밝히세요."
  - "궤도 표류 때문에 두 위성 모두 엄밀한 16일 반복 관측이 깨졌고(LP DAAC), 2024년 말부터 화소 크기·주사 틈 영향이 커졌습니다(LDOPE). 2020년대 중반 이후의 작은 추세는 VIIRS 식생지수로 교차 확인하세요."
  - 월자료(A3·C2)는 16일 합성의 가중 평균이라 16일 자료와 값의 성격이 다릅니다. 월 최대 NDVI가 필요하면 16일 자료에서 직접 뽑으세요.
  - "CMG(0.05°) 제품은 맑은 1 km 화소를 공간 평균하고, 모두 흐리면 과거 자료로 채웁니다. 화소 신뢰도 4(과거 시계열로 추정)가 붙은 값은 관측이 아니므로 빼고 쓰는 것이 안전합니다."
  - 한반도는 h28v05·h29v05 등 여러 타일에 걸치고 Sinusoidal 투영이라, 지점 추출·재투영은 AppEEARS나 GDAL을 쓰는 편이 쉽습니다.

