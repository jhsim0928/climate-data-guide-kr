notices:
  - date: "2025-05-31"
    level: warning
    title: v2.0 기술노트 게시 — 9개 변수 전반 수정
    body: >-
      v1.x 변수에 수정을 적용해 v2 출력을 만들었다는 v2 기술노트가 공개되었습니다(문서 "Latest update" 날짜). hurs 상한 105%, huss·rlds·sfcWind 음수 하한 0,
      기후값이 아주 작은 격자의 비정상적으로 큰 pr·rsds 값 조정, 조정된 GMFD로 tasmax·tasmin 전면 재처리(tx<tn인 격자는 값 교환)와 이에 따른 tas 재계산이 포함됩니다.
      v2 파일의 배포 위치와 파일명 꼬리표는 문서에 적혀 있지 않습니다.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2025/06/NEX-GDDP-CMIP6-v2-Tech_Note.pdf
  - date: "2024-02-01"
    level: warning
    title: pr 재처리(v1.1)와 tasmin·tas 전면 재처리(v1.2)
    body: >-
      건조 지역 과보정을 고친 pr이 _v1.1.nc 파일로 추가되었습니다. 또 2023년 8월의 SSP1-2.6·SSP3-7.0 tasmin 수정이 충분한 격자에 적용되지 않은 것으로 밝혀져
      해당 tasmin과 tas를 전부 다시 처리해 _v1.2.nc 파일로 올렸습니다.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf
  - date: "2023-08-27"
    level: warning
    title: tasmin(SSP1-2.6·SSP3-7.0)·TaiESM1·hurs 수정 파일 추가(v1.1)
    body: >-
      주로 해안 격자에서 값이 잘못된 SSP1-2.6·SSP3-7.0 tasmin을 다시 처리했고, CMIP6에서 철회된 TaiESM1 historical tasmax·tasmin을 교체해 tas·tasmax·tasmin을
      재처리했으며, hurs에 더 현실적인 상한을 적용했습니다. 수정 파일은 _v1.1.nc로 추가되고 v1.0 파일은 그대로 남습니다.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf
  - date: "2022-09-20"
    level: info
    title: 라이선스 CC0로 변경, AWS 사본 제공 시작
    body: >-
      CMIP6 라이선스 변경에 따라 2022년 9월부터 모든 NEX-GDDP-CMIP6 출력이 CC BY-SA 4.0 대신 CC0로 제공됩니다(인용 안내는 그대로 유지).
      같은 달부터 AWS에 자료 사본(s3://nex-gddp-cmip6/)이 제공됩니다.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf
  - date: "2022-03-18"
    level: info
    title: SSP1-2.6·SSP3-7.0 시나리오 추가
    body: 기술노트 개정 2판에서 SSP1-2.6과 SSP3-7.0 시나리오가 추가된 것을 반영했습니다.
    source: https://www.nccs.nasa.gov/wp-content/uploads/2024/03/NEX-GDDP-CMIP6-Tech_Note_4.pdf

