# ─────────────────────────────────────────────────────────────
# DUACS — 데이터셋 정보 파일
# 다중 위성 고도계 L4 해수면 격자 자료 (Copernicus Marine 008_047·008_046 / C3S satellite-sea-level-global)
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: duacs
name: DUACS
full_name: >-
  SSALTO/DUACS 다중 위성 고도계 L4 해수면 격자 자료 (해수면 높이 편차·절대 역학 지형·지형류) —
  Copernicus Marine SEALEVEL_GLO_PHY_L4_MY_008_047(재처리)·SEALEVEL_GLO_PHY_L4_NRT_008_046(준실시간), C3S satellite-sea-level-global
category: satellite
domain: ocean
group: 위성 관측 자료
order: 10
domains: [해양]
provider: CLS(프랑스, DUACS 생산) / Copernicus Marine Service(CMEMS)·Copernicus Climate Change Service(C3S) 배포

status: active
status_note: >-
  정상 제공 중입니다. 2024년 11월 전체 기록을 DT-2024 표준으로 다시 처리했고, 이때 Copernicus Marine 판은 격자가 0.25°에서 1/8°(0.125°)로,
  지도 작성 방법이 MIOST로 바뀌었습니다. C3S 판(vDT2024)은 기후 연구용으로 위성 2기 체제를 유지한 0.25° 격자이며 vDT2021·vDT2018은 더 이상 연장되지 않습니다.
  2026-10 확인 기준으로 DT-2024를 대체할 다음 재처리 일정은 공지되지 않았습니다.

period:
  start: "1993-01"
  end: present
  note: >-
    2026-10-12 확인 기준 마지막 날짜 — Copernicus Marine 재처리(MY) 일자료 2026-05-15, 월자료 2026-04,
    준실시간(NRT) 0.125° 일자료 2026-10-11(시작 2024-07-01), C3S vDT2024 2026-01-16(CDS 카탈로그 기준).
    NRT는 보통 최근 2년 정도만 온라인에 유지되므로 장기 분석에는 MY나 C3S를 씁니다.

resolution:
  spatial_short: "14 km (0.125°)"
  temporal_short: "1일"
  spatial: >-
    Copernicus Marine(MY·NRT): 1/8°(0.125°) 정규 위경도 격자, 전지구 2880×1440(격자 중심 179.9375°W~179.9375°E, 89.9375°S~89.9375°N).
    C3S: 0.25° 정규 위경도 격자 1440×720(격자 중심 179.875°W~179.875°E), 자료는 대략 위도 82°까지. 유럽 지역 제품(008_068·008_060)은 1/16°
  vertical: 해면 단일층
  temporal: >-
    일별 지도(daily). 월평균은 Copernicus Marine MY(sla만)와 C3S(sla·eke)에서 별도 제공
coverage:
  short: 전지구
  note: "Copernicus Marine판은 전지구, C3S판은 대략 위도 82°까지"
update: >-
  Copernicus Marine MY — 연 4회 가까이 연장(현재보다 약 5~9개월 전까지), 전체 재처리는 보통 3~4년마다 /
  NRT — 매일 11:30 갱신, 같은 날짜 지도가 예비(d0)→중간(d0+3)→최종(d0+6)으로 교체 /
  C3S — 연 약 3회 연장(약 5개월 지연)
license: >-
  Copernicus Marine 판 — Copernicus Marine Service 이용약관(무료, 출처 표시와 제품 DOI 명시 의무) /
  C3S 판 — CC BY 4.0
account_required: true

summary: >-
  여러 위성 고도계(TOPEX/Poseidon·Jason 시리즈·Sentinel-6 MF·Sentinel-3·SARAL/AltiKa 등)의 궤도 따라 관측(along-track)을 합쳐
  매일 빈칸 없는 전지구 해수면 지도로 만든 L4 자료입니다. 1993~2012년 평균 기준 해수면 높이 편차(SLA), 평균 역학 지형(MDT)을 더한
  절대 역학 지형(ADT), 지형류와 지도 오차를 함께 제공합니다. 프랑스 CLS의 DUACS 시스템이 만들고, 중규모 소용돌이 분석용인
  Copernicus Marine 판(전 위성 사용, 0.125°)과 장기 해수면 변화 감시용인 C3S 판(위성 2기 고정, 0.25°)으로 나뉘어 배포됩니다.

time_convention:
  summary: >-
    일별 지도는 하루 동안의 관측을 평균한 값이 아니라, 앞뒤 여러 주의 궤도 관측을 시공간 보간(Copernicus Marine DT-2024는 MIOST,
    C3S는 최적내삽)으로 합쳐 그 날짜의 해수면을 추정한 지도입니다. time 값은 해당 날짜 00:00 UTC이고, 파일 메타데이터는 전날 12:00~당일 12:00 UTC를
    대표 구간으로 적습니다. 월자료는 일별 지도를 달별로 평균한 값입니다.
  points:
    - "C3S 예: dt_global_twosat_phy_l4_20230910_vDT2024 파일의 time_coverage_start는 2023-09-09T12:00:00Z, time_coverage_end는 2023-09-10T12:00:00Z입니다(time 단위 days since 1950-01-01)."
    - "재처리(DT) 지도는 해당 날짜 앞뒤 관측을 모두 쓰지만, NRT 지도는 '미래' 관측이 없어 그날 이전 6주 관측만 씁니다. 그래서 같은 날짜라도 NRT와 MY 값이 다릅니다."
    - "NRT는 하루에 세 번 지도를 만듭니다: 당일(d0) 예비 지도, d0+3 중간 지도, d0+6 최종 NRT 지도. d0+6에 최종 지도가 예비 지도를 대체합니다."
    - "시간 보간 때문에 지도의 실제 시간 해상도는 하루보다 훨씬 깁니다. 품질 문서(QUID)는 전지구 L4의 유효 시간 해상도를 약 33일로 제시합니다."
    - "월자료(Copernicus Marine …_P1M-m, C3S …-M01)는 일별 지도의 월평균이며, time은 그달 1일로 표기됩니다(Copernicus Marine)."
  source: https://confluence.ecmwf.int/x/kriuHg
  source_name: C3S Sea Level vDT2024 PUGS / Copernicus Marine PUM·QUID (SL 008-046·047)

variables:
  note: >-
    Copernicus Marine 데이터셋 메타데이터와 C3S 제품 사용자 안내서(PUGS) 기준 파일 속 변수명입니다. MY와 C3S 일자료의 변수 구성은 같고,
    NRT에는 tpa_correction이 없습니다. 모든 변수는 int32에 scale_factor 0.0001로 압축 저장되어 있습니다. MDT 자체는 파일에 들어 있지 않습니다.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-SL-PUM-008-046-047-060-068.pdf
  groups:
    - name: 해수면 높이 (일별 지도)
      kind: instant
      items:
        - text: "해수면 높이 편차(SLA, 1993~2012 평균 해수면 기준) — `sla` (m)"
          note: 하루 평균이 아니라 그 날짜(00 UTC 중심)를 추정한 보간 지도입니다. 시간 평활이 들어 있습니다.
        - text: "절대 역학 지형(ADT, 지오이드 기준) — `adt` (m)"
          note: adt = sla + MDT. DT-2024의 MDT는 MDT_CNES_CLS22(지중해·흑해는 CMEMS_2020 지역 MDT와 결합)
        - "SLA 지도 작성 오차(형식 오차) — `err_sla` (m)"
    - name: 지형류 (일별 지도)
      kind: instant
      items:
        - "절대 지형류 동서 성분 — `ugos` (m/s)"
        - "절대 지형류 남북 성분 — `vgos` (m/s)"
        - "지형류 편차 동서 성분 — `ugosa` (m/s)"
        - "지형류 편차 남북 성분 — `vgosa` (m/s)"
        - "지형류 편차 오차(동서·남북) — `err_ugosa`, `err_vgosa` (m/s)"
    - name: 월평균
      kind: mean
      period: 월
      items:
        - text: "월평균 해수면 높이 편차 — `sla` (m)"
          note: Copernicus Marine MY 월자료(…0.125deg_P1M-m)와 C3S 월자료에 있음
        - text: "에디 운동 에너지 — `eke` (cm2 s-2)"
          note: C3S 월자료에만 있음. ½(U²+V²)로 계산
    - name: 플래그·보정값
      kind: instant
      items:
        - text: "해빙 플래그(해빙 농도 15% 기준, 0=바다 1=해빙) — `flag_ice` (0/1)"
          note: OSI SAF 해빙 자료 기준
        - text: "TOPEX-A 기기 표류 보정값 — `tpa_correction` (m)"
          note: 위경도 없이 시간만 있는 1차원 변수. MY·C3S에만 있으며, C3S PUGS는 vDT2024에서 아직 계산되지 않아 기본값으로 채워졌다고 적고 있습니다.

