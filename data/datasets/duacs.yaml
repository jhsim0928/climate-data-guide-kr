      월자료 cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1M-m (현재 버전 202411).
  - name: Copernicus Marine — 준실시간 (SEALEVEL_GLO_PHY_L4_NRT_008_046)
