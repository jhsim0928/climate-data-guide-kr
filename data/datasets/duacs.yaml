      ECMWF 계정과 이용 조건 동의가 필요합니다. variable은 daily 또는 monthly_mean, version은 vdt2024(권장)·vdt2021·vdt2018 중에서 고르며
      NetCDF 파일들이 zip으로 묶여 내려옵니다.
  - name: Copernicus Marine Toolbox 문서
    url: https://toolbox-docs.marine.copernicus.eu/en/stable/
    method: Python / 명령줄(CLI)

example:
  lang: python
  note: >-
    pip install copernicusmarine 후 처음 한 번 copernicusmarine.login()으로 계정을 저장합니다. C3S 판은 아래 주석의 cdsapi 예시처럼
    ~/.cdsapirc에 CDS API key를 넣고 받습니다.
  code: |
    import copernicusmarine

    # Copernicus Marine 재처리(MY) 0.125° 일자료 — 동아시아 부분만
    copernicusmarine.subset(
        dataset_id="cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D",
        variables=["sla", "adt", "ugos", "vgos"],
        minimum_longitude=120, maximum_longitude=150,
        minimum_latitude=20, maximum_latitude=50,
        start_datetime="2020-01-01", end_datetime="2020-12-31",
        output_filename="duacs_my_eastasia_2020.nc",
    )

    # C3S 판(vDT2024, 0.25°, 위성 2기 체제)
    # import cdsapi
    # cdsapi.Client().retrieve(
    #     "satellite-sea-level-global",
    #     {"variable": "monthly_mean", "version": "vdt2024",
    #      "year": ["2020"], "month": [f"{m:02d}" for m in range(1, 13)]},
    #     "c3s_sealevel_2020_monthly.zip",
    # )

tips:
  - >-
    Copernicus Marine 판(allsat)은 그때 쓸 수 있는 모든 위성을 넣어 중규모 소용돌이 분석에 좋지만, 위성 수가 시기마다 달라 장기 균질성은 떨어집니다.
    C3S는 장기 안정성을 위해 위성 수를 2기로 고정한(twosat) 기후용 판을 따로 만든다고 설명하므로, 평균 해수면 상승이나 장기 추세에는 C3S 판이 맞습니다.
  - NRT 자료는 위성 구성 변화로 값이 튀거나 표류할 수 있어 장기 신호 분석에 쓰지 말라고 품질 문서(QUID)가 명시합니다. 최근 몇 달을 이어 붙일 때는 겹치는 기간 차이를 먼저 보세요.
  - "DUACS L4 해수면에는 빙하 후 지각 조정(GIA) 보정이 들어 있지 않습니다. 조위 관측소나 GRACE와 비교·추세 계산 시 필요하면 따로 보정하세요."
  - 고도계 지도에서 계산한 지형류는 현장 관측보다 대체로 약하게 나옵니다(QUID). 소용돌이 운동 에너지 같은 통계를 다른 자료와 비교할 때 이 점을 감안하세요.
  - "ADT는 SLA에 MDT를 더한 값이라 MDT가 바뀌면(DT-2024에서 MDT_CNES_CLS22로 교체) ADT·절대 지형류도 바뀝니다. 버전이 다른 파일을 섞지 마세요."
  - "Copernicus Marine 데이터셋에는 버전(예: 재처리 202411, NRT 202506)이 붙습니다. Toolbox의 dataset_version 인자로 버전을 고정할 수 있으니, 재현성이 중요하면 받은 버전을 함께 기록하세요."

