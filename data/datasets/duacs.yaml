    Copernicus Marine 판을 쓰면 "This study has been conducted using E.U. Copernicus Marine Service Information;" 뒤에 사용한 제품 DOI를 붙입니다.
    C3S 판은 CDS 데이터셋 DOI를 인용하고 C3S 이용 조건의 출처 표시 문구를 넣으세요. DT-2024 자체를 설명하는 학술지 논문은 2026-10 확인 시점에
    공식 문서에서 찾지 못했으며, CLS 발표(EGU 2025, doi:10.5194/egusphere-egu25-3715)가 있습니다.

transitions:
  - from: DUACS DT-2021
    to: DUACS DT-2024
    status: completed
    date: "2024-11"
    summary: >-
      30년 고도계 기록 전체를 새 L2P 입력 표준과 보정값으로 다시 처리한 버전입니다. Copernicus Marine 판은 지도 작성 방법이 MIOST로 바뀌고
      격자가 1/8°로 촘촘해졌으며, C3S 판은 0.25° 최적내삽을 유지하면서 표준만 바뀌었습니다. MDT도 MDT_CNES_CLS22로 바뀌었습니다.
    changes:
      - aspect: 처리 버전·파일 표기
        before: "DT-2021 (예: product_version vDec2021, software_version 7.0_DUACS_DT2021_baseline)"
        after: "DT-2024 (product_version vNov2024, MY software_version 8.0_MIOST_DT2024_baseline)"
      - aspect: Copernicus Marine 격자
        before: "0.25° (…-l4-duacs-0.25deg_P1D)"
        after: "1/8° = 0.125° (…-l4-duacs-0.125deg_P1D). C3S 판은 계속 0.25°"
      - aspect: 지도 작성 방법
        before: 최적내삽(OI)
        after: "Copernicus Marine — MIOST(Multiscale Inversion of Ocean Surface Topography). C3S — 최적내삽 유지"
      - aspect: 해양 조석 모델
        before: "FES2014 (2023-11 myint 데이터셋부터 FES2022)"
        after: FES22b
      - aspect: 평균 해수면(MSS)
        before: "hybrid SIO/CNES_CLS2015/DT15 (2023-11 myint부터 SIO2022/CNES_CLS2022 hybrid)"
        after: "Hybrid_2023 MSS (SIO, CNES/CLS22, DTU21)"
      - aspect: ADT용 평균 역학 지형(MDT)
        before: DT-2021용 MDT
        after: "MDT_CNES_CLS22 (지중해·흑해는 CMEMS_2020 지역 MDT와 결합) — NRT는 2024-11-06부터"
      - aspect: 재처리 데이터셋 ID
        before: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.25deg_P1D (DT-2021) / …_myint_allsat-l4-duacs-0.25deg_P1D (2023-11 신설)"
        after: "cmems_obs-sl_glo_phy-ssh_my_allsat-l4-duacs-0.125deg_P1D / …0.125deg_P1M-m (버전 202411)"
      - aspect: 보고된 개선
        before: "-"
        after: "연안 오차 약 10% 감소(조석 보정 개선), 변동이 큰 해역의 지도 오차 5~7% 감소(MIOST) — CLS EGU 2025 발표 / NRT는 고에너지 해역 중규모 SLA 오차 약 20% 감소"
    impacts:
      - DT-2021과 DT-2024 파일을 한 시계열에 섞지 말고, 1993년부터 전체를 DT-2024로 다시 받으세요.
      - "0.25° 데이터셋 ID(my·myint·nrt)를 쓰던 스크립트는 0.125° ID로 바꿔야 합니다. 격자 크기가 바뀌므로 미리 만든 마스크·지역 인덱스도 다시 만드세요."
      - MDT가 바뀌어 ADT와 절대 지형류(ugos·vgos)의 평균장이 달라졌습니다. 예전 결과와 해류 평균장을 비교할 때 주의하세요.
      - C3S 판과 Copernicus Marine 판은 DT-2024에서 지도 방법(OI 대 MIOST)과 격자가 달라졌으므로, 두 판의 값을 섞거나 직접 바꿔 쓰지 마세요.
    sources:
      - name: Copernicus Marine QUID (CMEMS-SL-QUID-008-032-068)
        url: https://documentation.marine.copernicus.eu/QUID/CMEMS-SL-QUID-008-033-068.pdf
      - name: Copernicus Marine 전환 정보 — SEALEVEL_GLO_PHY_L4_NRT_008_046
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
      - name: Copernicus Marine 전환 정보 — SEALEVEL_GLO_PHY_L4_MY_008_047
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_MY_008_047
      - name: C3S Sea Level vDT2024 PUGS
        url: https://confluence.ecmwf.int/x/kriuHg
      - name: Ballarotta et al. — DUACS DT-2024 (EGU25-3715)
        url: https://meetingorganizer.copernicus.org/EGU25/EGU25-3715.html

notices:
  - date: "2025-11"
    level: info
    title: 시범(demo) 데이터셋 추가 — MIOST 개선 재처리, SWOT-KaRIn 병합 NRT
    body: >-
      재처리 제품에 개선된 MIOST(적도파·고주파 순압 변동 반영)로 30년을 다시 만든 시범 데이터셋(…my_allsat-demo-l4-duacs-0.125deg_P1D-i)이,
      NRT 제품에 SWOT KaRIn 관측을 합친 시범 데이터셋(…nrt_demo-allsat-swos-l4-duacs-0.125deg_P1D-i)이 추가되었습니다.
      재처리 시범본은 기간이 연장되지 않으며, 공식 운영 제품은 계속 기존 데이터셋입니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_MY_008_047
  - date: "2025-09-19"
    level: warning
    title: C3S 판 일부 기간 파일 교체 — 다시 받기 권고
    body: >-
      CDS 알려진 문제(Known issues)에 일·월 자료 전지구, 2023-12-23 이후 구간에 문제가 있었고 수정되었다는 항목이 올라왔습니다.
      2025-09-19 이전에 이 구간을 받은 사용자는 수정된 파일을 다시 받으라고 안내합니다. 영향 구간의 끝 날짜와 원인은 공개 화면에서 확인되지 않았습니다.
    source: https://cds.climate.copernicus.eu/datasets/satellite-sea-level-global?tab=documentation
  - date: "2025-07"
    level: warning
    title: Copernicus Marine Toolbox 1.x 지원 종료
    body: Toolbox 1.x의 지원이 끝났습니다. 2.x로 올려야 하며, 2.4.0부터 Python 3.9 지원이 빠졌습니다.
    source: https://toolbox-docs.marine.copernicus.eu/en/stable/end-of-life.html
  - date: "2025-06"
    level: info
    title: NRT 0.125° 데이터셋을 2024년 하반기로 소급 연장
    body: >-
      NRT 0.125° 일자료(cmems_obs-sl_glo_phy-ssh_nrt_allsat-l4-duacs-0.125deg_P1D)가 2024년 하반기까지 거슬러 연장되었습니다
      (현재 시작일 2024-07-01). 2025-06-25~07-29에는 이중 배포 기간이 있었습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
  - date: "2024-11-26"
    level: warning
    title: NRT를 DT-2024 표준·MIOST·0.125°로 전환, 0.25° NRT 데이터셋 갱신 중단
    body: >-
      NRT L4가 DT-2024 표준, 새 MDT, MIOST 지도 방법, 1/8° 격자로 바뀌어 새 데이터셋(…-0.125deg_P1D)으로 나왔습니다.
      기존 0.25° NRT 데이터셋은 11월 26일부터 갱신되지 않으므로 다운로드 스크립트를 고쳐야 합니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=SEALEVEL_GLO_PHY_L4_NRT_008_046
  - date: "2024-11"
    level: warning
    title: 재처리 전체를 DUACS DT-2024로 교체 (C3S는 vDT2024)
    body: >-
      1993년 이후 재처리 기록 전체가 DT-2024 표준으로 다시 만들어졌습니다. Copernicus Marine 판은 0.125°·MIOST로, C3S 판은 vDT2024(0.25°·최적내삽)로 제공되며,
      C3S의 vDT2021·vDT2018은 더 이상 연장되지 않습니다. 예전 버전과 섞어 쓰지 마세요.
    source: https://documentation.marine.copernicus.eu/QUID/CMEMS-SL-QUID-008-033-068.pdf

