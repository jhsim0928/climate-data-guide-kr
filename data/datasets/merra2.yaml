notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC 온프레미스 서버 종료 — Earthdata Cloud로 전환
    body: >-
      GES DISC가 온프레미스 HTTPS 접근을 2026년 9월 30일까지 단계적으로 닫고, 온프레미스 OPeNDAP은 8월 20일~9월 30일 사이,
      THREDDS는 7월 31일에 중단한다고 안내했습니다. 새 HTTPS 주소는 data.gesdisc.earthdata.nasa.gov 이며, 디렉터리 전체 재귀 다운로드는
      지원되지 않으니 CMR·earthaccess로 파일 목록을 얻어야 합니다. GES DISC 웹사이트는 2026년 11월 이후 earthdata.nasa.gov로 통합됩니다.
      (안내문 최종 수정 2026-09-01)
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2026-04-20"
    level: info
    title: MERRA-2 34개 컬렉션 OPeNDAP 클라우드 이전 완료, Giovanni 재개
    body: OPeNDAP 서비스를 Earthdata Cloud로 옮기는 작업이 끝나 해당 컬렉션의 Giovanni 변수를 다시 쓸 수 있게 되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/giovanni-system-maintenance-merra-2-variables-has-been-completed
  - date: "2026-01-15"
    level: warning
    title: GrADS Data Server(GDS) 서비스 종료 예고
    body: >-
      MERRA-2 컬렉션 약 90여 개를 제공하던 GDS가 빠르면 2026년 3월 27일 이후 종료된다고 공지되었습니다. 같은 자료는 Earthdata Cloud에서
      HTTPS와 부분 추출 서비스로 받을 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-discontinued-earlier-than-march-27-2026
  - date: "2025-05-06"
    level: info
    title: MERRA-2 53개 컬렉션 클라우드 OPeNDAP 추가
    body: 대용량·동시 요청 성능 개선을 위해 MERRA-2 컬렉션 53개의 OPeNDAP 서비스가 Earthdata Cloud로 추가 이전되었습니다.
    source: https://forum.earthdata.nasa.gov/viewtopic.php?p=22904

