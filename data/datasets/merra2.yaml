# ─────────────────────────────────────────────────────────────
# MERRA-2 — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: merra2
name: MERRA-2
full_name: Modern-Era Retrospective analysis for Research and Applications, Version 2 (NASA 현대 위성시대 재분석 2판)
category: reanalysis
domain: atmosphere
group: 재분석
order: 50
domains: [대기, 육지, 에어로졸]
provider: NASA GMAO (Global Modeling and Assimilation Office) / GES DISC 배포

status: active
status_note: >-
  정상 생산 중입니다. GMAO 생산 현황 페이지 기준 2026년 10월 초까지 계산이 진행되었고, 2026년 8월분까지 GES DISC로 전달되었습니다.
  MERRA-2 생산 종료나 공식 후속 자료는 아직 발표되지 않았습니다. GMAO가 1998년 이후 구간의 새 재분석 MERRA-21C(약 25 km)를
  생산하고 있으나, GMAO는 이를 "MERRA-2를 바탕으로 한" 자료로만 소개할 뿐 대체 자료로 공지하지 않았습니다. 한편 GES DISC는
  온프레미스 서버(goldsmr4·goldsmr5 등)를 "2026년 9월 30일 이후" 닫는다고 예고했습니다. 10월 11일 현재 일부 서버가 아직 응답하지만
  언제든 끊길 수 있으니, 예전 주소를 쓰던 스크립트는 Earthdata Cloud 주소로 바꿔 두세요.

period:
  start: "1980-01"
  end: present
  note: 한 달 단위로 처리되며, 보통 다음 달 15~20일 무렵(약 3주 지연) 공개됩니다. 관측·전산 문제로 늦어질 수 있습니다.

resolution:
  spatial_short: "56 km (0.5°×0.625°)"
  temporal_short: "1시간"
  spatial: "출력 격자 0.5°(위도) × 0.625°(경도), 576 × 361 (모델은 약 50 km 큐브구면 격자)"
  vertical: "모델면 72층 / 기압면 42층"
  temporal: 1시간(2차원 변수), 3시간(3차원 변수), 일·월평균, 월별 일주기 평균
coverage:
  short: 전지구
update: 매월 (해당 월 종료 후 약 3주)
license: NASA 공개 데이터(이용 제한 없음, AWS Open Data 등록 정보상 CC BY 4.0). 컬렉션별 DOI 인용 권장
account_required: true

summary: >-
  NASA GMAO가 GEOS 자료동화 시스템으로 생산한 1980년 이후 전지구 재분석으로, 원조 MERRA를 대체했습니다.
  초분광 적외·마이크로파 복사휘도, GPS 전파엄폐 관측 등을 동화하며, 장기 재분석 가운데 처음으로 위성 에어로졸 관측을 동화해
  에어로졸 농도·광학두께 자료도 함께 제공합니다. 파일은 수집 단위(collection, 예 M2T1NXSLV)로 나뉘어 있고 각각 DOI가 있습니다.

time_convention:
  summary: >-
    MERRA-2는 컬렉션 이름 앞부분이 시간 특성을 알려 줍니다. inst는 표시 시각의 순간값, tavg는 구간 평균, const는 시간에 따라 변하지 않는 고정값입니다.
    1시간 평균(tavg1) 자료의 시각은 평균 구간의 가운데(00:30, 01:30 …)로 찍혀 있어, 정시에 찍히는 순간값 자료와 30분 어긋납니다.
  points:
    - "inst1·inst3·inst6: 순간값. inst3는 00·03·06…21 UTC, inst6은 00·06·12·18 UTC, inst1은 매 정시"
    - "tavg1: 1시간 평균, 시각은 구간 중앙(00:30 = 00~01 UTC 평균). tavg3: 3시간 평균, 01:30·04:30 … (01:30 = 00~03 UTC 평균)"
    - "tavgM(월평균)·tavgU(월별 일주기 평균)·statD(일 통계)는 별도 컬렉션입니다(예: M2TMNXSLV). 월평균은 윤년을 반영한 달력월 평균입니다"
    - "강수·플럭스(`PRECTOT`, `HFLUX` 등)는 누적량이 아니라 평균 강도입니다. 단위가 kg m-2 s-1이므로 1시간 강수량(mm)은 3600을 곱합니다"
    - "에어로졸 농도·광학두께(M2T1NXAER)도 1시간 평균입니다"
  source: https://gmao.gsfc.nasa.gov/media/publications/zbly36ziNFDFbmYmvhQeVqPhUo/Bosilovich785.pdf
  source_name: "MERRA-2: File Specification (GMAO Office Note No. 9), 3·5.1절"

variables:
  note: GES DISC 컬렉션 페이지 기준 주요 변수입니다. 변수명은 netCDF 파일 안의 이름이며, 괄호 앞에 해당 컬렉션을 적었습니다.
  full_list: https://gmao.gsfc.nasa.gov/media/publications/zbly36ziNFDFbmYmvhQeVqPhUo/Bosilovich785.pdf
  groups:
    - name: 지표·단일면 (M2T1NXSLV, 1시간 평균)
      kind: mean
      period: 1시간
      items:
        - "2m 기온 — `T2M` (K)"
        - "2m 이슬점온도 — `T2MDEW` (K)"
        - "2m 비습 — `QV2M` (kg kg-1)"
        - "10m 동서·남북 바람 — `U10M`, `V10M` (m s-1)"
        - "해면기압 — `SLP` (Pa)"
        - "지표기압 — `PS` (Pa)"
        - "지표(피부) 온도 — `TS` (K)"
        - "가강수량(연직 적분 수증기) — `TQV` (kg m-2)"
        - "500 hPa 지위고도 — `H500` (m)"
        - "500 hPa 연직속도 — `OMEGA500` (Pa s-1)"
        - "총 오존량 — `TO3` (Dobsons)"
    - name: 지표 플럭스 (M2T1NXFLX, 1시간 평균)
      kind: mean
      period: 1시간
      items:
        - "총 강수 플럭스 — `PRECTOT` (kg m-2 s-1)"
        - "보정된 총 강수 — `PRECTOTCORR` (kg m-2 s-1)"
        - "현열 플럭스 — `HFLUX` (W m-2)"
        - "잠열 플럭스 — `EFLUX` (W m-2)"
        - "지표 동서 응력 — `TAUX` (N m-2)"
        - "경계층 높이 — `PBLH` (m)"
        - "해빙 비율 — `FRSEAICE` (1)"
    - name: 기압면 (M2I3NPASM, 3시간 순간값, 42층)
      kind: instant
      items:
        - "기온 — `T` (K)"
        - "동서·남북 바람 — `U`, `V` (m s-1)"
        - "층 높이 — `H` (m)"
        - "비습 — `QV` (kg kg-1)"
        - "상대습도 — `RH` (1)"
        - "연직속도 — `OMEGA` (Pa s-1)"
        - "오존 질량혼합비 — `O3` (kg kg-1)"
        - "에르텔 잠재와도 — `EPV` (K m2 kg-1 s-1)"
    - name: 에어로졸 (M2T1NXAER, 1시간 평균)
      kind: mean
      period: 1시간
      items:
        - "황사 지표 질량농도(PM2.5) — `DUSMASS25` (kg m-3)"
        - "블랙카본 지표 질량농도 — `BCSMASS` (kg m-3)"
        - "황산염 지표 질량농도 — `SO4SMASS` (kg m-3)"
        - "황사 소산 광학두께 — `DUEXTTAU` (1)"

access:
  - name: NASA GES DISC — MERRA-2 데이터셋 목록
    url: https://disc.gsfc.nasa.gov/datasets?project=MERRA-2
    method: 웹 다운로드 / 부분 추출(Subset) / OPeNDAP
    note: >-
      NASA Earthdata Login 계정이 필요하고, 계정 설정에서 "NASA GESDISC DATA ARCHIVE" 앱 사용을 승인해야 파일이 받아집니다.
      온프레미스 서버는 2026년 9월 30일 이후 순차 종료 대상이므로, Earthdata Cloud(data.gesdisc.earthdata.nasa.gov) 주소를 쓰세요.
  - name: NASA Earthdata — MERRA-2 프로젝트 페이지
    url: https://www.earthdata.nasa.gov/data/projects/merra-2
    method: 컬렉션 안내 / Earthdata Search / earthaccess
    note: 컬렉션별 설명, 인용 형식, 재처리 기록 링크가 모여 있습니다. 파일 목록은 CMR 검색이나 earthaccess로 얻는 것이 권장됩니다.
  - name: Earthdata Cloud (AWS us-west-2 S3)
    url: https://registry.opendata.aws/nasa-m2i3nvasm/
    method: S3 직접 접근
    note: AWS us-west-2 지역에서 계산할 때 유리합니다. Earthdata Login으로 임시 S3 자격 증명을 받아야 합니다.
  - name: GMAO MERRA-2 데이터 접근 안내
    url: https://gmao.gsfc.nasa.gov/gmao-products/merra-2/data-access_merra-2/
    method: 안내 페이지 (시각화 도구 FLUID 등 연결)

example:
  lang: python
  note: "earthaccess가 Earthdata Login 정보를 묻거나 ~/.netrc 를 읽습니다. 컬렉션 short name과 버전(5.12.4)을 함께 지정하세요."
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()  # Earthdata Login
    results = earthaccess.search_data(
        short_name="M2T1NXSLV",
        version="5.12.4",
        temporal=("2024-01-01", "2024-01-02"),
    )
    files = earthaccess.download(results, "./merra2")
    ds = xr.open_mfdataset(files)
    print(ds["T2M"])

tips:
  - "파일 이름 앞부분(MERRA2_100/200/300/400)은 생산 스트림 번호입니다(1980–1991, 1992–2000, 2001–2010, 2011년~). 재처리된 달은 번호가 하나 올라가므로(예: 2020년 9월은 MERRA2_401), 파일명을 고정 패턴으로 만드는 스크립트는 깨질 수 있습니다."
  - "강수는 대기 모델이 만든 `PRECTOT`와 관측으로 보정한 `PRECTOTCORR`가 따로 있습니다. 지면 모델 강제력에는 보정값이 쓰였으므로, 연구 목적에 맞게 골라 쓰고 논문에 어떤 변수를 썼는지 밝히세요."
  - 1000 hPa·850 hPa처럼 지표면 아래에 놓이는 기압면 값은 결측(undefined)입니다. 산악 지역을 포함한 영역 평균은 다른 재분석과 차이가 날 수 있으니 결측 처리를 확인하세요.
  - "GES DISC 온프레미스 THREDDS는 2026년 7월 31일에 닫혔고, 온프레미스 OPeNDAP은 8월 20일~9월 30일 사이에 꺼졌으며, 온프레미스 HTTPS도 9월 30일 이후 종료 대상입니다. goldsmr4/goldsmr5 주소나 디렉터리 통째 wget에 의존하던 스크립트는 earthaccess, CMR 검색, opendap.earthdata.nasa.gov로 옮기세요."

