# ─────────────────────────────────────────────────────────────
# CS2SMOS — 데이터셋 정보 파일
# AWI/ESA CryoSat-2 + SMOS 병합 주간 북극 해빙 두께 (v206까지) → 후속 CS3SMOS (v300)
# ─────────────────────────────────────────────────────────────
id: cs2smos
name: CS2SMOS
full_name: CryoSat-2/SMOS Merged Sea Ice Thickness (ESA SMOS-CryoSat L4 Sea Ice Thickness, CryoSat-2·SMOS 병합 주간 해빙 두께)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 40
also_in:
  - domain: satellite
    group: 해빙
domains: [해빙]
provider: 독일 알프레드 베게너 연구소(AWI) / 유럽우주국(ESA) — 원자료 ESA CryoSat-2·SMOS

status: ended
status_note: >-
  CS2SMOS(마지막 버전 v206)는 2024/25 겨울(2025년 4월)을 끝으로 생산이 멈췄고, 2025/26 겨울부터 Sentinel-3A/B 고도계를 더한
  후속 제품 CS3SMOS(v300, 12.5 km, 남반구 포함)로 넘어갔습니다. 기존 2010~2025년 v206 자료는 ESA 배포 서버에서 계속 받을 수 있습니다.
  SMOS·CryoSat-2 두 위성 모두 2026년에도 자료를 내고 있어 CS3SMOS는 정상 생산 중입니다.

successor:
  name: CS3SMOS (CryoSat-2/Sentinel-3/SMOS Merged Sea Ice Thickness, v300)
  url: https://spaces.awi.de/spaces/CS2SMOS/pages/297634429/CryoSat-2+Sentinel-3+SMOS+Merged+Sea+Ice+Thickness
  note: >-
    2025-10-23부터 운영. 해상도 25 km → 12.5 km, Sentinel-3A(2016-10~)·3B(2018-10~) 고도계 추가, 남반구 겨울(4/15~10/15) 산출,
    파일 형식·불확실성 모델 변경(고도계 불확실성이 v206보다 크게 잡힘). 2026-10 현재 별도 데이터셋 DOI는 확인되지 않습니다.
    인용은 Ricker et al. (2017), The Cryosphere, 11, 1607–1623, doi:10.5194/tc-11-1607-2017 을 AWI가 계속 안내합니다.

transitions:
  - from: CS2SMOS v206
    to: CS3SMOS v300
    to_id: cs3smos
    status: completed
    date: "2025-10"
    summary: >-
      AWI가 병합 해빙 두께 제품에 Sentinel-3A/B 고도계를 더하고 처리 체계를 Python 기반으로 새로 만든 두 번째 대규모 개편입니다.
      해상도가 25 km에서 12.5 km로 높아지고 남반구 겨울 산출이 추가되었으며, 불확실성 모델과 파일 구성이 바뀌었습니다.
      2025/26 겨울(2025-10-23 운영 시작)부터 v206을 대체했습니다.
    changes:
      - aspect: 제품 이름·버전
        before: "CS2SMOS v206 (2023-10 갱신)"
        after: "CS3SMOS v300 (2025-10 갱신, 새 Python 처리 체계)"
      - aspect: 고도계 입력
        before: "CryoSat-2 (AWI L2P v2.6)"
        after: "CryoSat-2 + Sentinel-3A(2016년~) + Sentinel-3B(2018년~), 모두 AWI v2.6 산출. 고도계 일별 격자화는 AWI v2.6 체계에서 수행"
      - aspect: SMOS 입력
        before: "SMOS L3C v3.3"
        after: "SMOS L3 v3.6"
      - aspect: 수평 해상도·격자
        before: "25 km EASE2 북반구 (432×432)"
        after: "12.5 km EASE2, 북·남반구"
      - aspect: 대상 지역·계절
        before: "북극만, 결빙기(대략 10월 중순~4월 중순)"
        after: "북극 10-15 ~ 이듬해 4-15 + 남극 4-15 ~ 10-15"
      - aspect: 기간
        before: "2010-11 ~ 2025-04 (마지막 시즌 2024/25)"
        after: "AWI 준실시간 운영은 2025/26 겨울(2025-10-15 주간장)부터. Copernicus Marine에는 v300 북반구가 2023-10-18부터, 남반구가 2025-04-18부터 공개. 2010년 이후 전체 재처리본의 공개 위치는 확인되지 않음"
      - aspect: 불확실성
        before: "v206 불확실성 모델"
        after: "고도계·SMOS 불확실성 재산정 — SMOS는 해빙 농도 100% 미만 효과를 포함하고 최소 20 cm, 고도계 불확실성은 v206보다 크게 잡힘"
      - aspect: 육지·바다 마스크
        before: "v206 자체 마스크"
        after: "ESA CCI 해빙 산출물과 같은 마스크, 육지/바다 비율 변수 추가"
      - aspect: 파일 내용
        before: "분석·배경장·가중평균 두께, innovation, SMOS·CryoSat-2 각각의 두께와 불확실성 등 (PDD v1.6 표 3)"
        after: "6개로 단순화 — sea_ice_thickness, sea_ice_thickness_uncertainty, sea_ice_concentration, status_flag, quality_flag, density_of_ocean(격자 안 바다 비율) (Copernicus Marine 제품 설명서 기준)"
      - aspect: 파일 이름
        before: "W_XX-ESA,SMOS_CS2,NH_25KM_EASE2_<시작>_<끝>_<o|r>_v206_01_l4sit.nc"
        after: "W_XX-ESA,SMOS_CS2_S3A_S3B,NH_12P5KM_EASE2_<시작>_<끝>_o_v300_01_l4sit (AWI 퀵룩 파일명 기준)"
      - aspect: 받는 곳·DOI
        before: "ESA SMOS 배포 서버 L4_SIT_Open, DOI 10.57780/sm1-4f787c3 (Version 206) / AWI FTP"
        after: "AWI FTP cryosat2_smos/v300 폴더 / Copernicus Marine SEAICE_GLO_PHY_L4_NRT_011_014 (제품 DOI 10.48670/moi-00125). ESA 배포 서버에는 2026-10 현재 v300 없음"
    impacts:
      - v206(2010~2025)과 v300(2025/26~)은 해상도·입력 위성·불확실성 모델이 달라 한 시계열로 이어 붙이면 경계에 계단이 생길 수 있습니다. 장기 분석은 한 버전으로 통일된 기록이 나올 때까지 v206 구간과 v300 구간을 나눠 다루세요.
      - 파일명(SMOS_CS2 → SMOS_CS2_S3A_S3B, 25KM → 12P5KM, v206 → v300)과 변수 구성이 바뀌어 기존 읽기 스크립트가 그대로 동작하지 않습니다. 새 파일의 변수 이름을 직접 확인한 뒤 고치세요.
      - 불확실성 값이 v206보다 크게 나오는 것은 모델 변경 때문이며 품질 저하를 뜻하지 않습니다. 두 버전의 불확실성을 직접 비교하거나 같은 기준으로 자료를 거르지 마세요.
      - 남극 겨울 두께가 새로 생겼지만 CS2SMOS 시절 자료는 북극뿐입니다. 남극 분석에 쓸 때는 기록 시작 시점과 검증 수준을 먼저 확인하세요.
    sources:
      - name: AWI CS3SMOS/CS2SMOS 제품 페이지 (버전 이력)
        url: https://spaces.awi.de/spaces/CS2SMOS/pages/297634429/CryoSat-2+Sentinel-3+SMOS+Merged+Sea+Ice+Thickness
      - name: AWI CS2SMOS-PDS 운영 공지 (2025-10-23 v300 시작)
        url: https://spaces.awi.de/spaces/CS2SMOS/overview
      - name: ESA SMOS-CryoSat L4 Sea Ice Thickness 카탈로그 (v206)
        url: https://earth.esa.int/eogateway/catalog/smos-cryosat-l4-sea-ice-thickness
      - name: ESA CS2SMOS 제품 설명서 (PDD v1.6, v206)
        url: https://earth.esa.int/eogateway/documents/20142/37627/CryoSat-2-SMOS-Merged-Product-Description-Document-PDD.pdf

period:
  start: "2010-11"
  end: "2025-04"
  note: >-
    ESA 카탈로그 기준 2010-11-15 시작. 북반구 결빙기(대략 10월 중순~4월 중순)만 있고 여름은 비어 있습니다.
    v206 마지막 시즌은 2024/25 겨울이며, 2025년 2월 일부 주간 자료가 입력 재분석(JRA-3Q) 중단으로 빠져 있습니다.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "7일"
  spatial: "25 km EASE2 북반구 격자(Lambert 정적 방위 등적도법, 432×432) — 후속 CS3SMOS는 12.5 km"
  vertical: 해당 없음 (두께 단일 값)
  temporal: 주간 평균(7일 창) 장을 매일 갱신 — 파일 하나가 한 주(월~일 또는 최근 7일)를 대표

coverage:
  short: 북극
  note: "북반구만(북극 겨울철)"
update: 갱신 종료 (2025년 4월). 운영 당시 예비 주간장은 매일, 최종본은 약 3~4주 지연
license: ESA 지구관측 자료 이용약관(ESA 배포본) / AWI 배포본은 AWI가 안내하는 인용·감사 문구 조건
account_required: false

summary: >-
  CryoSat-2 고도계는 두꺼운 얼음에서, SMOS L-band 복사계는 약 1 m 이하 얇은 얼음에서 상대적으로 정확하다는 점을 이용해,
  두 위성의 해빙 두께를 최적 내삽(optimal interpolation)으로 합친 북극 주간 해빙 두께 자료입니다.
  CryoSat-2 단독 월평균보다 시간 해상도가 높고 공간 빈틈이 없어 해빙 예측 초기화, 모델 검증, 항로 분석에 많이 쓰였습니다.
  AWI가 생산하고 ESA가 SMOS-CryoSat L4 Sea Ice Thickness라는 이름으로 배포합니다.

time_convention:
  summary: >-
    파일 하나는 7일 구간(파일 이름의 시작일~종료일)의 SMOS·CryoSat-2 관측을 합친 주간 대표 두께로, 순간값이 아니라 7일 평균장입니다.
    v2.02부터 이 7일 창을 하루씩 옮겨 가며 매일 새 파일을 만들기 때문에, 이웃한 날짜의 파일은 6일이 겹칩니다.
  points:
    - "파일 이름의 두 날짜가 7일 창의 시작·끝입니다(예 20190304_20190310). 메타데이터의 time_coverage_end는 끝날 다음날 00:00 UTC로 적혀 있어 실제 구간은 시작일 00:00 ~ 종료일 24:00입니다."
    - "제품 설명서는 '월~일 달력 주' 기준이라고 적고 있지만 ATBD는 v2.02부터 대상 주를 하루 단위로 옮긴다고 설명합니다. 겹치지 않는 표본이 필요하면 월요일 시작 파일만 고르세요."
    - "`time` 변수는 'reference time of product'로만 정의되어 있어 7일 창의 시작인지 중심인지 공식 문서에 명시되어 있지 않습니다. 날짜는 파일 이름이나 time_bnds로 판단하세요."
    - "최적 내삽의 배경장은 대상 주를 뺀 앞뒤 기간(CryoSat-2 앞뒤 2주, SMOS 앞뒤 1주)으로 만듭니다. 운영(o) 파일은 대상 주 이전 자료만 쓰므로 재처리(r) 파일과 값이 다를 수 있습니다."
    - "해빙 농도는 대상 주 동안의 OSI SAF 일별 농도를 평균한 값입니다."
  source: https://earth.esa.int/eogateway/documents/20142/0/CryoSat-2-SMOS-ATBD.pdf/9ba793ce-2cfa-cc59-1b0e-8e18b7180f30
  source_name: ESA CryoSat-2/SMOS 병합 두께 ATBD / 제품 설명서(PDD v1.6)

variables:
  note: >-
    v206 제품 설명서(PDD v1.6, 표 3) 기준 변수입니다. 같은 문서의 그림 설명에는 다른 이름이 섞여 있으니 실제 파일에서 한 번 확인하세요.
    후속 CS3SMOS(v300)는 파일 형식이 바뀌어 변수명이 다를 수 있습니다.
  full_list: https://earth.esa.int/eogateway/documents/20142/37627/CryoSat-2-SMOS-Merged-Product-Description-Document-PDD.pdf
  groups:
    - name: 병합 두께 (주 산출값)
      kind: mean
      period: 7일
      items:
        - text: "병합(분석) 해빙 두께 — `analysis_sea_ice_thickness` (m)"
          note: 7일 창의 주간 SMOS·CryoSat-2 두께를 배경장과 최적 내삽으로 합친 주간 대표값
        - text: "병합 두께 불확실성 — `analysis_sea_ice_thickness_unc` (m)"
          note: 같은 7일 주간 분석값에 대한 불확실성
        - text: "배경장 두께 — `background_sea_ice_thickness` (m)"
          note: 대상 주를 뺀 앞뒤 기간(CryoSat-2 앞뒤 2주, SMOS 앞뒤 1주)의 관측으로 만든 장. 운영 모드는 대상 주 이전 2주 자료만 사용. 7일 평균이 아니라 대상 주 주변 수 주의 자료로 만든 값
        - text: "가중 평균 두께 — `weighted_mean_sea_ice_thickness` (m)"
          note: 7일 주간 평균 CryoSat-2·SMOS 두께의 가중 평균(PDD 정의)
        - text: "분석 증분(innovation) — `innovation` (m)"
          note: 같은 주의 배경장과 분석장의 차이
    - name: 입력 위성별 두께
      kind: mean
      period: 7일
      items:
        - text: "SMOS 해빙 두께 — `smos_sea_ice_thickness` (m)"
          note: PDD 정의 'weekly averaged SMOS ice thickness'
        - text: "SMOS 두께 불확실성 — `smos_sea_ice_thickness_uncertainty` (m)"
          note: 주간 평균 SMOS 두께에 대한 불확실성
        - text: "CryoSat-2 해빙 두께 — `cryosat_sea_ice_thickness` (m)"
          note: PDD 정의 'weekly averaged CryoSat-2 ice thickness'
        - text: "CryoSat-2 두께 불확실성 — `cryosat_sea_ice_thickness_uncertainty` (m)"
          note: 주간 평균 CryoSat-2 두께에 대한 불확실성
    - name: 보조 정보
      kind: mean
      period: 7일
      items:
        - text: "해빙 농도 — `sea_ice_concentration` (%)"
          note: 대상 주 동안 OSI SAF 일별 농도의 주간 평균(ATBD)
        - text: "해빙 유형(2 일년빙, 3 다년빙) — `sea_ice_type` (코드값)"
          note: OSI SAF 일별 해빙 유형을 입력으로 씀. 주간 값으로 어떻게 묶는지(평균·대표일 등)는 공식 문서에 명시되지 않음
        - text: "상관 길이 규모 — `correlation_length_scale` (m)"
          note: 대상 주의 배경장에서 격자마다 추정하는 최적 내삽 매개변수. 주마다 다시 계산되며 관측의 시간 평균은 아님

