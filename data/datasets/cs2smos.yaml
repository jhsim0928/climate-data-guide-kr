example:
  lang: python
  note: "ESA 서버에서 받은 v206 주간 파일을 연다고 가정합니다. 파일명 예시: W_XX-ESA,SMOS_CS2,NH_25KM_EASE2_20190304_20190310_o_v206_01_l4sit.nc"
  code: |
    import xarray as xr

    ds = xr.open_dataset("W_XX-ESA,SMOS_CS2,NH_25KM_EASE2_20190304_20190310_o_v206_01_l4sit.nc")

    sit = ds["analysis_sea_ice_thickness"].squeeze()        # m
    unc = ds["analysis_sea_ice_thickness_unc"].squeeze()    # m

    # 얇은 얼음(1 m 미만)에서 SMOS와 CryoSat-2 기여 비교
    thin = sit < 1.0
    print("SMOS  :", float(ds["smos_sea_ice_thickness"].squeeze().where(thin).mean()))
    print("CS2   :", float(ds["cryosat_sea_ice_thickness"].squeeze().where(thin).mean()))
    print("병합  :", float(sit.where(thin).mean()))

tips:
  - >-
    파일 하나는 7일 평균장입니다. 매일 새 파일이 나오더라도 이웃한 날짜 파일끼리는 6일이 겹치므로, 일별 시계열처럼 다루어 자기상관을 무시하면 안 됩니다.
    서로 겹치지 않는 주간 파일(월~일)만 골라 쓰는 것이 안전합니다.
  - >-
    운영 중에 나온 'o'(operational) 파일과 재처리 'r'(reprocessing) 파일은 값이 다를 수 있습니다. 같은 기간에 두 종류가 있으면 재처리본을 쓰세요.
  - >-
    SMOS 두께는 해빙 농도가 100%보다 낮으면 과소 추정되는 알려진 문제가 있고, 바렌츠·카라·랍테프해는 전파 간섭(RFI)으로 SMOS 관측이 자주 빠집니다.
    이런 곳의 병합 두께는 사실상 고도계 값에 기댄 것이므로 해석에 주의하세요.
  - >-
    v206과 후속 CS3SMOS(v300)는 해상도·입력 위성·불확실성 모델이 달라 같은 기록으로 보기 어렵습니다. 2025/26 겨울 이후를 이어 쓰려면
    가능한 한 v300으로 전체 기간을 맞추고, 섞어 쓸 경우 경계 시점을 명시하세요.

