notices:
  - date: "2026-04-21"
    level: info
    title: 후속 CS3SMOS, 2025/26 북극 시즌 생산 종료
    body: >-
      CS3SMOS 북극 준실시간 처리가 시즌을 마쳤습니다(마지막 장 2026-04-09 ~ 04-15). 남반구 처리는 곧 시작한다고 안내되었고,
      2026/27 북극 시즌 시작 공지는 2026-10-11 현재 아직 없습니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-10-23"
    level: critical
    title: CS2SMOS(v206) → CS3SMOS(v300) 전환
    body: >-
      2025/26 겨울부터 병합 두께 제품이 v300(CS3SMOS)으로 바뀌었습니다. Sentinel-3A/B 고도계 추가, 12.5 km 해상도, 남반구 겨울 산출,
      새 파일 형식이 핵심 변경입니다. v206은 더 이상 갱신되지 않으므로 운영 스크립트의 경로와 변수명을 점검하세요.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-10-23"
    level: warning
    title: 바렌츠·카라·랍테프해 SMOS 전파 간섭(RFI)으로 품질 저하
    body: >-
      SMOS 입력이 이 해역에서 잦은 전파 간섭으로 빠지면서, 해당 지역 두께는 고도계만으로 추정되어 SMOS가 있을 때보다 두껍게 나올 수 있다고 경고되었습니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-04-17"
    level: info
    title: v206 2024/25 시즌 완료 — CS2SMOS 마지막 시즌
    body: v206 준실시간 생산이 2024/25 북극 시즌을 마쳤고, 2025년 10월부터 v300이 뒤를 잇는다고 예고되었습니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2025-02-24"
    level: warning
    title: 2025년 2월 v206 준실시간 생산 중단 — 일부 주간 자료 결측
    body: >-
      입력으로 쓰는 JRA-3Q 재분석 자료를 받지 못해 SMOS L3와 병합 L4 생산이 멈췄다가 2025-03-03 재개되었습니다.
      L4는 2025년 2월 4~23일에 해당하는 주간 자료가 빠져 있습니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview

