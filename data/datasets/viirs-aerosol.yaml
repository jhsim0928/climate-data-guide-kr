transitions:
  - from: VIIRS Deep Blue V2.0 / Dark Target V2.0
    to: VIIRS Deep Blue V2.1 / Dark Target V2.1
    status: completed
    date: "2026-09"
    summary: >-
      Dark Target V2.1은 2025년 12월, Deep Blue V2.1은 2026년 9월에 공개되었고 NOAA-21 판이 새로 생겼습니다. 두 제품 모두 위성 간 교차 보정이 들어가 위성별 AOD 차이를 줄였습니다.
      DT V2.0은 2026-08-31 배포가 끝났고, DB V2.0은 2027-03-31까지 함께 제공됩니다.
    changes:
      - aspect: 위성
        before: Suomi NPP·NOAA-20
        after: Suomi NPP·NOAA-20·NOAA-21
      - aspect: 보정
        before: 위성 간 교차 보정 없음
        after: "DB: 남극 Dome C로 SNPP와 NOAA-21 교차 보정 / DT: SNPP·NOAA-20·NOAA-21 교차 보정 계수 추가"
      - aspect: Deep Blue 알고리즘
        before: V2.0
        after: "북아프리카·남아시아 AOD 분포 개선, 북미·사헬·남아프리카·인도 에어로졸 모델(단산란 알베도) 조정, 해양 태양 반사광 선별 강화, 짙은 황사는 남기고 얇은 구름·해무는 지우도록 구름 선별 수정"
      - aspect: Dark Target 알고리즘
        before: "V2.0 (보조 기상 GEOS-FPIT)"
        after: "해양 구름 마스크 개선, 먼지 검출(`Dust_Flag_Ocean`) 추가, 지표 반사도·도시 보정 수정, 보조 기상 GEOS-IT로 교체, `Optical_Depth_Land_And_Ocean`에 육지 값이 잘못 들어가던 오류 수정"
      - aspect: 버전 표기
        before: "CMR version 2, 파일 이름 .002, 아카이브 5200"
        after: "CMR version 2.1, 파일 이름 .021, 아카이브 5201"
    impacts:
      - V2.0과 V2.1을 한 시계열에 섞지 말고 전 기간을 V2.1로 다시 받으세요.
      - DB V2.1은 해양 산출 범위가 V2.0보다 줄어든 곳이 있습니다(태양 반사광 선별 강화).
    sources:
      - name: Version 2.1 VIIRS Deep Blue Aerosol Data Products Released (LAADS, 2026-09-14)
        url: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199512
      - name: AERDT_L2_VIIRS_SNPP V2.1 컬렉션 설명 (CMR 메타데이터)
        url: https://cmr.earthdata.nasa.gov/search/collections.umm_json?concept_id=C3702902851-LAADS
      - name: V2.1 Level-2 Dark Target Aerosol Data Products Released (LAADS, 2025-12-18)
        url: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199536

notices:
  - date: "2026-10-06"
    level: critical
    title: Suomi NPP 자료 전달 2026년 11월 2일 종료 — AERDB·AERDT SNPP 판 대신 NOAA-20·NOAA-21로
    body: >-
      LAADS DAAC는 NOAA NESDIS 결정(2026-08-03 발표)에 따라 Suomi NPP 과학 자료 전달이 2026년 11월 2일 13:00 UTC(2026년 306일)에 끝난다고 공지했습니다(일정은 바뀔 수 있음).
      AERDB_L2·D3·M3_VIIRS_SNPP와 AERDT_L2_VIIRS_SNPP도 대상이며, 각각 NOAA-20(…_NOAA20)·NOAA-21(…_NOAA21) 판으로 옮기라고 안내합니다. 과거 SNPP 자료는 계속 받을 수 있습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199516
  - date: "2026-09-14"
    level: info
    title: VIIRS Deep Blue 에어로졸 V2.1 공개 — NOAA-21 추가, V2.0은 2027-03-31까지
    body: >-
      LAADS DAAC가 Deep Blue V2.1(L2·D3·M3)을 Suomi NPP·NOAA-20·NOAA-21용으로 공개했습니다. Dome C 교차 보정, 북아프리카·남아시아 AOD 개선, 에어로졸 모델 조정,
      해양 태양 반사광 선별 강화, 구름 선별 수정이 들어갔으며, V2.0은 2027년 3월 31일까지 함께 제공됩니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199512
  - date: "2026-09-01"
    level: info
    title: VIIRS Dark Target V2.0 배포 종료 — V2.1 사용
    body: >-
      LAADS DAAC가 Suomi NPP·NOAA-20 Dark Target V2.0 컬렉션 배포를 끝냈습니다(2026-08-31). 앞으로는 SNPP·NOAA-20·NOAA-21 V2.1(AERDT_L2_VIIRS_*)을 쓰면 됩니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199514
  - date: "2026-08-11"
    level: warning
    title: Suomi NPP 이상(2026-08-02) — 8월 3~6일 자료 처리 제외
    body: >-
      8월 2일 02:05 UTC Suomi NPP 위성 이상으로 과학 자료가 끊겼다가 8월 4일 준실시간 처리가, 10일 확정판 처리가 재개되었습니다. 8월 3일 02:00 UTC~6일 16:24 UTC 자료는
      주야 플래그 문제 등으로 처리하지 않는다고 공지했습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199518
  - date: "2026-07-27"
    level: warning
    title: Suomi NPP 이상(2026-07-10~17) — 5월 1일 이후 자료를 새 보정표로 재생산
    body: >-
      7월 10일 Suomi NPP가 비정상 상태에 들어가 7월 17일까지 과학 자료가 생산되지 않았고, 이 기간 자료는 복구되지 않을 수 있다고 밝혔습니다. 확정판 처리는 VIIRS 보정팀의 새 보정표를 기다려 재개되었고,
      2026년 5월 1일 04:00 UTC 이후 자료를 새 보정표로 다시 만든다고 공지했습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199520
  - date: "2026-03-23"
    level: info
    title: Suomi NPP 자료 지연 — 2026-03-09~13 자료 결측
    body: >-
      3월 9일 17:45 UTC께부터 Suomi NPP 과학 자료가 끊겼다가 3월 12일 위성이 정상으로 돌아왔고, 3월 16일부터 다시 써도 된다고 밝혔습니다. 3월 9일 18:00 UTC~13일 VIIRS 자료는
      복구할 수 없는 지오로케이션 오류로 처리하지 않습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199535
  - date: "2025-12-18"
    level: info
    title: VIIRS Dark Target V2.1 L2 공개 — NOAA-21 추가
    body: >-
      LAADS DAAC가 Suomi NPP·NOAA-20·NOAA-21 Dark Target V2.1 L2(6분 스와스, 6 km)를 공개하고, V2.0은 2026년 6월 30일 내린다고 안내했습니다(실제 배포 종료는 2026-08-31 공지).
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199536
  - date: "2025-05-02"
    level: info
    title: MODIS에서 VIIRS로 전환 안내 — VIIRS 유사 산출물 사용 권고
    body: >-
      NASA LAADS DAAC는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어간다며 MODIS 사용자에게 VIIRS 유사 산출물을 쓰라고 권고했습니다. MODIS MOD04 에어로졸을 잇는 제품이 이 AERDB·AERDT입니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2025-02-27"
    level: info
    title: Suomi NPP Deep Blue V1.1 배포 종료(2025-02-28)
    body: >-
      LAADS DAAC가 Suomi NPP VIIRS Deep Blue V1.1 컬렉션(L2·일·월)을 2025년 2월 28일 내린다고 공지했습니다. V1.1로 받은 자료가 있다면 V2.1로 다시 받으세요.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199546

