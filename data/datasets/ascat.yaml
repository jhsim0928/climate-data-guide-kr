notices:
  - date: "2026-09-16"
    level: info
    title: Metop-C 궤도면 기동으로 ASCAT 바람 일시 중단 (OSI-102-c·OSI-104-c)
    body: >-
      OSI SAF 서비스 메시지 3579. 2026-09-16 12 UTC 무렵 Metop-C의 궤도면 기동(out-of-plane manoeuvre)이 있어 OSI SAF·EARS Metop-C ASCAT 바람이 상당 시간 빠질 수 있다고 알렸습니다.
      이런 기동·장비 이상으로 몇 시간 단위 결측이 생기므로 그 시간대 자료는 결측 여부를 확인하세요.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/metop-c-ascat-wind-products-planned-outage-16-september-out
  - date: "2026-06-18"
    level: info
    title: ASCAT-B L1b 보정 갱신 — 2024년 7월부터 있던 스와스 가로 방향 작은 편차 수정
    body: >-
      KNMI ASCAT-B 제품 이력에 따르면 2024년 7월부터 나타난 스와스 가로 방향(across-swath)의 작은 변동을 바로잡도록 ASCAT-B L1b 보정이 갱신되었습니다.
      2024-07~2026-06 준실시간 ASCAT-B 바람을 WVC 위치별로 비교·평균하는 분석이라면 이 구간을 주의하세요.
    source: https://scatterometer.knmi.nl/ascat_b_osi_25_prod/
  - date: "2026-02-25"
    level: info
    title: 후속 산란계 SCA를 실은 MetOp-SG-B1, 2026년 10월 발사 예정 (ESA)
    body: >-
      ESA는 해상풍 벡터와 토양수분을 관측할 산란계를 실은 MetOp Second Generation B1의 발사가 2026년 10월 쿠루(프랑스령 기아나)에서 예정되어 있다고 밝혔습니다.
      WMO OSCAR(2026-09-23 갱신)는 발사를 2026년 11월로 적고 있어, 정확한 날짜와 SCA 자료 공개 일정은 EUMETSAT 발표를 확인해야 합니다.
    source: https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp_Second_Generation/First_MetOp_Second_Generation-B_satellite_spreads_its_wing
  - date: "2021-11-15"
    level: warning
    title: Metop-A 운용 종료 — ASCAT-A 바람 생산 중단, 궤도 하강 시작
    body: >-
      15년간 운용된 Metop-A가 2021-11-15부터 궤도를 낮추는 퇴역 절차에 들어갔고, OSI SAF Metop-A ASCAT 바람(OSI-102·OSI-104)도 이날로 끝났습니다.
      이후 ASCAT 바람은 Metop-B·C 두 위성만 남아, 2021-11-15 앞뒤로 하루 관측 범위가 줄었습니다.
    source: https://www.eumetsat.int/europes-first-meteorological-satellite-polar-orbit-ends-its-run
  - date: "2019-10-02"
    level: info
    title: Metop-C ASCAT 바람 운영 시작
    body: >-
      2019년 2월 시범 생산을 시작한 Metop-C ASCAT 25 km·해안 바람이 운영 제품이 되었고, 2019-11-28부터 EUMETCast로 모든 사용자에게 배포되었습니다.
    source: https://scatterometer.knmi.nl/ascat_c_osi_25_prod/
  - date: "2018-09-25"
    level: warning
    title: OSI SAF ASCAT 바람에 CMOD7과 응력 등가 바람 적용
    body: >-
      바람 산출 모델 함수가 CMOD5.n에서 CMOD7로 바뀌고, 배경 바람으로 실제 10 m ECMWF 바람 대신 응력 등가 ECMWF 바람을 쓰게 되었습니다(AWDP 3_2_01).
      이날 앞뒤로 바람의 정의와 값이 달라지므로 준실시간 기록을 이어 붙인 장기 분석에서는 주의하세요.
    source: https://scatterometer.knmi.nl/ascat_b_osi_25_prod/

transitions:
  - from: Metop-A ASCAT (ASCAT-A)
    to: Metop-B·C ASCAT (ASCAT-B, ASCAT-C)
    status: completed
    date: "2021-11"
    summary: >-
      2007년부터 이어진 Metop-A ASCAT 바람이 2021-11-15에 끝나고, 2012년부터 함께 돌던 Metop-B와 2019년 운영을 시작한 Metop-C가 기록을 잇습니다.
      세 위성의 ASCAT은 같은 설계지만 보정 차이가 조금씩 있어 RSS는 A·B·C를 상호 보정한 기후자료(V2.1/V2.1.1)를 따로 만들었습니다.
    changes:
      - aspect: 위성
        before: "Metop-A (2006-10-19 발사, 2021-11-30 퇴역)"
        after: "Metop-B (2012-09-17 발사), Metop-C (2018-11-07 발사)"
      - aspect: 준실시간 바람 기간
        before: "2007-03-28 시범, 2008-12-03 운영 ~ 2021-11-15"
        after: "ASCAT-B 2012-11 시범·2013-05-27 운영 ~, ASCAT-C 2019-02 시범·2019-10 운영 ~"
      - aspect: 궤도
        before: "2017년 6월부터 수명 연장을 위해 표류(drifting) 궤도로 운용 — 상승 노드 지방시가 21:30(2017-06)에서 19:30(2021)으로 앞당겨짐"
        after: "적도 통과 시각을 유지하는 태양동기 궤도 (WMO OSCAR 기준 Metop-B 09:00, Metop-C 09:31 하강)"
      - aspect: 보정 안정성 (RSS 분석)
        before: "2016년 중반·2019년 말 두 번의 작은 보정 계단(각 0.1 m/s 미만) — RSS V2.1.1에서 보정"
        after: "첫 6개월 뒤로 안정. ASCAT-C가 ASCAT-B보다 약 0.05 m/s 낮음"
      - aspect: PO.DAAC 모음
        before: "ASCATA-L2-25km, ASCATA-L2-Coastal, ASCATA_L2_25KM_CDR"
        after: "ASCATB-L2-25km·ASCATC-L2-25km, ASCATB-L2-Coastal·ASCATC-L2-Coastal"
    impacts:
      - "2021-11-15 이후 ASCAT 위성 수가 셋에서 둘로 줄어 하루 관측 범위·횟수가 달라졌습니다. 관측 횟수에 민감한 통계는 이 시점 앞뒤를 나눠 보세요."
      - "위성을 바꿔 이어 붙일 때는 0.1 m/s 수준의 보정 차이가 있을 수 있으니 RSS V2.1/V2.1.1처럼 상호 보정된 기후자료를 쓰거나 겹치는 기간으로 차이를 확인하세요."
      - "Metop-A는 2017년 6월부터 표류 궤도라 통과 시각이 2021년까지 약 2시간 앞당겨졌습니다. 일변화가 있는 바람(해륙풍 등)을 볼 때 이 점을 고려하세요."
    sources:
      - name: OSI SAF — Metop-C ASCAT 25 km Winds (OSI-102-c) 제품 이력
        url: https://osi-saf.eumetsat.int/products/osi-102-c
      - name: EUMETSAT — Metop-A 운용 종료 (2021-11-15)
        url: https://www.eumetsat.int/europes-first-meteorological-satellite-polar-orbit-ends-its-run
      - name: EUMETSAT — Metop-A 표류 궤도 운용 결정
        url: https://www.eumetsat.int/eumetsat-council-agreed-ageing-still-healthy-metop-satellite-will-be-exploited-drifting-orbit-june
      - name: RSS — ASCAT-A·B·C 해상풍 기후자료 공지 (2021-08-16)
        url: https://www.remss.com/announcement/ASCAT-ABC-ocean-surface-wind-CDR
      - name: Ricciardulli & Manaster (2021), Remote Sensing
        url: https://doi.org/10.3390/rs13183678
  - from: OSI SAF ASCAT 바람 (CMOD5.n, 10 m 중립 바람)
    to: OSI SAF ASCAT 바람 (CMOD7, 10 m 응력 등가 바람)
    status: completed
    date: "2018-09"
    summary: >-
      2018-09-25 KNMI 처리기(AWDP 3_2_01)가 바뀌며 모델 함수가 CMOD7로, 바람 정의가 10 m 응력 등가 바람으로, 배경 ECMWF 바람도 응력 등가 바람으로 바뀌었습니다.
      준실시간 기록은 다시 처리하지 않았으므로 이 날짜를 사이에 두고 정의가 다른 값이 이어져 있습니다.
    changes:
      - aspect: 모델 함수 (GMF)
        before: CMOD5.n
        after: CMOD7
      - aspect: 바람 정의
        before: "10 m 중립 등가 바람 (2008-11 중립 바람 전환 때 +0.2 m/s)"
        after: "10 m 응력 등가 바람 (대기 안정도·공기 밀도 효과 반영)"
      - aspect: 배경 모델 바람 (model_speed·model_dir)
        before: 실제 10 m ECMWF 바람
        after: 응력 등가 ECMWF 바람
      - aspect: 처리기
        before: AWDP 2.x
        after: "AWDP 3_2_01 (2022-10-04 3_3_01로 갱신)"
    impacts:
      - "2018-09-25 앞뒤 준실시간 값을 한 시계열로 쓰면 정의 차이가 섞입니다. 장기 분석에는 재처리 자료를 쓰세요."
      - "부이 바람과 비교하려면 부이 값을 같은 응력 등가 바람으로 바꿔야 공정합니다(KNMI CMOD7 안내)."
      - "PO.DAAC 일부 설명(해안판)은 아직 CMOD5.n으로 적혀 있으니 판 정보는 KNMI·OSI SAF 이력을 기준으로 보세요."
    sources:
      - name: KNMI — OSI SAF ASCAT-B 25 km 제품 이력
        url: https://scatterometer.knmi.nl/ascat_b_osi_25_prod/
      - name: KNMI — CMOD7 설명
        url: https://scatterometer.knmi.nl/cmod7/
      - name: ASCAT Wind Product User Manual v1.17
        url: https://scatterometer.knmi.nl/publications/pdf/ASCAT_Product_Manual.pdf
  - from: Metop ASCAT
    to: Metop-SG-B SCA (Scatterometer)
    status: planned
    date: "2026"
    summary: >-
      EUMETSAT 2세대 극궤도 위성 Metop-SG의 B형 위성에 실리는 C밴드 산란계 SCA가 ASCAT을 잇습니다. 첫 위성 B1은 ESA 발표로 2026년 10월, WMO OSCAR로 2026년 11월 발사 예정이며,
      2026-10-13 확인 시 SCA 자료 공개 일정은 공식 발표가 없습니다. 더 넓은 스와스와 교차 편파 관측으로 해상도·강풍 관측 범위를 넓히는 것이 목표입니다.
    changes:
      - aspect: 위성
        before: "Metop-B (2012~), Metop-C (2018~)"
        after: "Metop-SG-B1 (2026 발사 예정), B2 (2033 예정), B3 (2040 예정)"
      - aspect: 주파수
        before: C밴드 5.255 GHz
        after: "C밴드 약 5.355 GHz"
      - aspect: 스와스
        before: "약 550 km 스와스 두 개(약 700 km 간격, 유효 폭 525 km)"
        after: "660 km 스와스 두 개(가운데 525 km 공백), 세 방위(45°·90°·135°) 관측, 약 1.5일에 준전지구 관측"
      - aspect: 해상도
        before: "25 km 간격(유효 약 50 km), 해안판 12.5 km 간격(유효 25 km)"
        after: "공칭 25 km를 12.5 km 간격으로, 고해상도 방식 15~20 km를 6.25 km 간격으로 (WMO OSCAR)"
      - aspect: 편파·강풍
        before: "VV 편파. 25 m/s 넘는 바람은 덜 믿을 만함"
        after: "VV에 더해 가운데 빔 교차 편파(VH) 관측 — 약 40 m/s 이상까지 강풍 관측 기대 (SCA Science Plan)"
    impacts:
      - "SCA 자료가 공개되면 ASCAT과 겹치는 기간의 상호 보정 결과를 확인한 뒤 이어 쓰세요. 모델 함수·해상도가 달라 그대로 이어 붙이면 계단이 생길 수 있습니다."
      - "발사일과 자료 공개(시범·운영) 일정은 EUMETSAT·OSI SAF 공지로 다시 확인해야 합니다."
    sources:
