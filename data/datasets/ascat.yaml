# ─────────────────────────────────────────────────────────────
# Metop ASCAT 해상풍 — 데이터셋 정보 파일
# 위성 탭(해상풍), 해양 탭(위성 관측 자료) 교차 수록. EUMETSAT OSI SAF(KNMI 생산)의 Metop-B·C ASCAT L2 스와스 바람(25 km OSI-102, 해안 12.5 km OSI-104)이 중심이고,
# Metop-A 기후자료(OSI-150), Copernicus Marine L3 일 격자, RSS V2.1 기후자료도 함께 안내합니다.
# 2026-10-13 확인 시 PO.DAAC의 Metop-B·C L2는 2026-10-13 낮 궤도까지 올라와 있습니다. 후속 Metop-SG-B1(산란계 SCA)은 2026년 하반기 발사 예정입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: ascat
name: Metop ASCAT 해상풍
full_name: Metop Advanced Scatterometer (ASCAT) ocean surface winds — EUMETSAT OSI SAF L2 wind products (Metop 위성 C밴드 산란계 해상풍 벡터)
category: satellite
domain: satellite
group: 해상풍
order: 20
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 대기, 원격탐사]
provider: EUMETSAT OSI SAF (KNMI 생산) / NASA PO.DAAC 재배포 / Copernicus Marine (L3 격자) / Remote Sensing Systems (V2.1 기후자료)

status: active
status_note: >-
  Metop-B(2012~)와 Metop-C(2019~)의 ASCAT 바람이 준실시간으로 계속 생산되고 있으며, Metop-A는 2021-11-15에 바람 생산을 마치고 궤도를 낮추는 퇴역 절차에 들어갔습니다.
  2026-10-13 확인 시 PO.DAAC에는 Metop-B·C 25 km·해안 L2가 2026-10-13 10~11 UTC 시작 궤도까지(약 2~3시간 지연), Copernicus Marine L3 NRT는 2026-10-12까지, RSS V2.1 격자 자료는 2026-09-08까지 올라와 있습니다.
  후속 산란계 SCA를 실은 Metop-SG-B1은 ESA가 2026년 10월 발사 예정이라 밝혔고(2026-02-25), WMO OSCAR는 2026년 11월로 적고 있습니다(2026-09-23 갱신). SCA 자료 공개 일정은 아직 공식 발표가 없습니다.

period:
  start: "2007-01"
  end: present
  note: >-
    Metop-A ASCAT 준실시간 바람은 2007-03-28 시범 생산, 2008-12-03 운영을 시작해 2021-11-15에 끝났습니다. Metop-B는 2012-11-14 첫 시범판, 2013-05-27 운영,
    Metop-C는 2019-02-12 시범, 2019-10 운영입니다. 재처리 기후자료 OSI-150(Metop-A)은 2007-01-01부터인데, 끝을 OSI SAF 페이지는 2014-12-31, KNMI 설명 페이지와 PO.DAAC는 2014년 3월(2014-04-01)로 적어 서로 다릅니다.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: >-
    L2 스와스: 25 km 간격 바람 벡터 격자(WVC, 한 줄 42개 = 좌우 스와스 각 21개, 유효 스와스 폭 525 km). PO.DAAC는 유효 해상도를 50 km로 안내합니다.
    해안 L2(OSI-104): 12.5 km 간격(한 줄 82개), WVC 중심 15 km 안의 후방산란을 평균하며 유효 해상도 25 km. 시범판 6 km(OSI-AW5.7, Metop-B, KNMI FTP만).
    Copernicus Marine L3: 0.125°(해안 12.5 km 입력)·0.25°(25 km 입력) 위경도 격자.
  vertical: "해면 10 m 바람. 2018-09-25부터 응력 등가(stress-equivalent) 바람, 그 전은 10 m 중립 등가 바람"
  temporal: >-
    L2: 궤도마다 파일 하나(약 100분), 각 WVC는 위성이 지나간 순간의 관측. 위성 하나가 한 지점을 하루 최대 오전(하강)·저녁(상승) 두 번 지나며 스와스 사이에 빈 곳이 남습니다.
    L3(Copernicus Marine·RSS): 하루 단위로 상승·하강 궤도를 따로 격자에 옮긴 파일(평균 아님).

coverage:
  short: 전지구
  note: "전 세계 바다(얼음 없는 해면). 육지는 산출하지 않고, 25 km 자료는 해안 약 35 km 안이 빠지며(해안판은 약 15 km까지), 해빙 위 값은 플래그로 걸러야 합니다. 하루 스와스 사이에 빈 곳이 있음"
update: "L2 준실시간: 궤도마다, 관측 후 약 2시간(OSI SAF 목표 2시간 45분 이내). Copernicus Marine L3 NRT: 매일(다음날 12 UTC, 이틀 뒤 00 UTC). Copernicus Marine L3 재처리(MY): 매달. RSS V2.1: 비정기 갱신(2026-10-13 확인 시 2026-09-08분까지, 2026-09-11 게시)"
license: >-
  OSI SAF 바람 제품은 CC BY 4.0이며 EUMETSAT OSI SAF를 출처로 밝혀야 합니다. KNMI는 쓴 제품마다 'copyright (연도) EUMETSAT' 표기를 요청합니다.
  RSS ASCAT 자료는 RSS 이용 조건(제품별 감사 문구, 논문 게재 시 support@remss.com에 알림)을 따릅니다
account_required: true

summary: >-
  ASCAT은 유럽 기상위성 Metop에 실린 C밴드(5.255 GHz) 산란계로, 위성 궤도 좌우로 약 550 km 폭의 스와스 두 개를 세 방위각의 빔으로 비춰 해면 거칠기에서 10 m 바람의 세기와 방향을 구합니다.
  EUMETSAT OSI SAF가 KNMI에서 25 km(OSI-102)와 해안용 12.5 km(OSI-104) L2 바람을 관측 후 약 2시간 만에 내며, NASA PO.DAAC·Copernicus Marine이 이를 다시 배포하거나 격자로 만듭니다.
  2007년 Metop-A부터 이어진 기록은 재분석·수치예보 동화, 해양 모델 바람 강제력 검증, 바람 응력·컬 연구에 널리 쓰이고, CCMP 같은 다중 위성 바람 분석장의 주요 입력이기도 합니다.

time_convention:
  summary: >-
    L2 스와스 자료의 값은 위성이 그 격자(WVC)를 지나간 순간의 관측이며, 각 WVC에 관측 시각(time, 1990-01-01 00:00:00 기준 초)이 들어 있습니다. 파일 하나는 궤도 하나(약 100분)입니다.
    Copernicus Marine L3 일 파일도 하루 평균이 아니라 상승·하강 궤도별로 순간 관측을 격자에 옮긴 것이며, 격자마다 실제 관측 시각(measurement_time)이 따로 들어 있습니다.
  points:
    - "NetCDF(L2·L3)의 풍향은 해양학 관례(바람이 불어 가는 방향, 0° = 북쪽으로 부는 바람)이고 BUFR는 기상학 관례(불어오는 방향)입니다. 기상학 관례 풍향과 비교할 때 180° 차이에 주의하세요."
    - "Metop-B·C는 현지 태양시 오전 9시~9시 30분께 남쪽으로 내려가며 적도를 지나는 태양동기 궤도라, 한 지점을 대체로 오전(하강)·저녁(상승)에 지납니다. 하루 평균이나 일변화 분석에는 그대로 쓸 수 없습니다."
    - "2018-09-25부터 바람은 10 m 응력 등가 바람(대기 안정도·공기 밀도 효과를 반영해 해면 응력과 직접 대응하는 바람)입니다. 실제 10 m 바람과 정의가 다르므로 부이·모델과 비교할 때 같은 정의로 맞추세요."
    - "model_speed·model_dir는 ECMWF 모델 바람을 관측 위치에 맞춘 배경값으로, 바람 방향 모호성 제거에 쓰인 참고값이지 관측이 아닙니다."
    - "Copernicus Marine L3 NRT 일 파일은 다음날 12 UTC에 나오고 이틀 뒤 00 UTC에 한 번 더 갱신됩니다."
  source: https://scatterometer.knmi.nl/publications/pdf/ASCAT_Product_Manual.pdf
  source_name: ASCAT Wind Product User Manual v1.17 (OSI SAF/EARS, KNMI) + Copernicus Marine WIND_GLO_PHY_L3 제품 설명서

variables:
  note: >-
    L2 변수명은 ASCAT Wind Product User Manual 부록 B(NetCDF) 기준이며 PO.DAAC 변수표와 같습니다. NetCDF에는 선택된 바람 해 하나만 들어 있고(모호성 해·sigma0 없음), 배열은 (NUMROWS, NUMCELLS) 스와스 모양입니다.
    L3 변수명은 Copernicus Marine 제품 설명서 기준입니다.
  full_list: https://scatterometer.knmi.nl/publications/pdf/ASCAT_Product_Manual.pdf
  groups:
    - name: L2 스와스 (OSI SAF 25 km·해안 12.5 km NetCDF, PO.DAAC 동일)
      kind: instant
      items:
        - text: "10 m 풍속 — `wind_speed` (m s-1)"
          note: 2018-09-25부터 응력 등가 바람
        - text: "10 m 풍향 — `wind_dir` (degree)"
          note: 해양학 관례(불어 가는 방향)
        - text: "ECMWF 모델 10 m 풍속 — `model_speed` (m s-1)"
          note: 배경 모델 바람(관측 아님)
          std: []
        - text: "ECMWF 모델 10 m 풍향 — `model_dir` (degree)"
          note: 배경 모델 바람(관측 아님)
          std: []
        - text: "해빙 확률 — `ice_prob` (1)"
          std: []
        - text: "해빙 나이(a 매개변수) — `ice_age` (dB)"
          std: []
        - text: "WVC 품질 플래그 — `wvc_quality_flag` (비트)"
          note: "비트 16 VarQC, 17 KNMI QC, 18 감시 플래그가 서 있으면 쓰지 않음(사용자 안내서)"
          std: []
        - text: "후방산란 거리(모델 함수와의 차이) — `bs_distance` (1)"
          std: []
        - text: "관측 시각 — `time` (seconds since 1990-01-01 00:00:00)"
          std: []
    - name: L3 일 격자 (Copernicus Marine, 위성·상승/하강 궤도별)
      kind: instant
      items:
        - text: "10 m 동서 바람(응력 등가) — `eastward_wind` (m s-1)"
          std: [wind10]
        - text: "10 m 남북 바람(응력 등가) — `northward_wind` (m s-1)"
          std: [wind10]
        - text: "10 m 풍속(응력 등가) — `wind_speed` (m s-1)"
          std: [wind10]
        - text: "10 m 풍향(불어 가는 방향) — `wind_to_dir` (degree)"
        - "바람 응력 크기 — `wind_stress_magnitude` (N m-2)"
        - "동서·남북 바람 응력 — `eastward_stress`·`northward_stress` (N m-2)"
        - "바람 응력 컬·발산 — `stress_curl`·`stress_divergence` (N m-3)"
        - text: "10 m 바람 컬·발산 — `wind_curl`·`wind_divergence` (s-1)"
          std: []
        - text: "공기 밀도 — `air_density` (kg m-3)"
          std: []
        - text: "격자별 관측 시각 — `measurement_time` (seconds since 1990-01-01 00:00:00)"
          std: []

access:
  - name: NASA PO.DAAC — Metop-C ASCAT L2 25 km (ASCATC-L2-25km)
    url: https://podaac.jpl.nasa.gov/dataset/ASCATC-L2-25km
    method: Earthdata Search / earthaccess / OPeNDAP / Harmony 부분 추출 / podaac-data-subscriber
    note: >-
      Metop-B는 ASCATB-L2-25km(2012-10-29~), 해안판은 ASCATB-L2-Coastal·ASCATC-L2-Coastal, 끝난 Metop-A는 ASCATA-L2-25km·ASCATA-L2-Coastal(~2021-11-15),
      Metop-A 기후자료는 ASCATA_L2_25KM_CDR입니다. 궤도 하나가 NetCDF 파일 하나이며 NASA Earthdata 로그인(무료)이 필요합니다.
  - name: EUMETSAT Data Store (OSI SAF 원 배포처, 전체 기록 보관)
    url: https://data.eumetsat.int/
    method: 웹 검색·다운로드, EUMETSAT Data Access API (BUFR·NetCDF)
    note: >-
      예 OSI-102-c는 EO:EUM:DAT:0760, OSI-104-b는 EO:EUM:DAT:0192, OSI-104-c는 EO:EUM:DAT:0202, Metop-A 기후자료 OSI-150-a는 EO:EUM:DAT:METOP:OSI-150-A 모음입니다.
      EUMETSAT 계정(무료)이 필요합니다. 실시간 위성 방송 EUMETCast로도 받을 수 있습니다.
  - name: OSI SAF·KNMI FTP (최근 3일)
    url: https://osi-saf.eumetsat.int/products/osi-102-b
    method: FTP (ftppro.knmi.nl, 디렉터리 ascat_b_osi·ascat_c_osi, 시범 6 km는 ascat_b_osi_057)
    note: 등록 후 요청하면 계정을 줍니다. 최근 3일치만 있으므로 과거 자료는 Data Store나 PO.DAAC에서 받으세요.
  - name: Copernicus Marine — L3 일 격자 NRT (WIND_GLO_PHY_L3_NRT_012_002)
    url: https://data.marine.copernicus.eu/product/WIND_GLO_PHY_L3_NRT_012_002/description
    method: copernicusmarine 도구(Python·명령행) / 웹 부분 추출
    note: >-
      Metop-B·C(0.125°·0.25°)와 HY-2·Oceansat-3·FY-3E 산란계를 위성·상승/하강 궤도별 데이터셋으로 제공합니다(2016-01-01~, 예 cmems_obs-wind_glo_phy_nrt_l3-metopc-ascat-des-0.125deg_P1D-i).
      재처리판 WIND_GLO_PHY_L3_MY_012_005(1991-08~2026-06, Metop-A·B, QuikSCAT, ERS, Oceansat-2)도 있습니다. Copernicus Marine 계정(무료)이 필요합니다.
  - name: RSS ASCAT V2.1 (C-2015 모델 함수, A·B·C 상호 보정 기후자료)
    url: https://data.remss.com/ascat/
    method: HTTPS 직접 다운로드 (metopa·metopb·metopc 폴더, 일 0.25° 격자 bmaps_v02.1, 스와스 ascat*_wind_vectors_v02.1)
    note: OSI SAF와 다른 RSS 자체 처리 자료입니다. 일 격자는 오전(하강)·저녁(상승) 지도를 따로 담습니다.
    login: false

example:
  lang: python
  note: >-
    PO.DAAC의 Metop-C 25 km L2 파일을 earthaccess로 받아 한반도 주변에서 사용자 안내서가 권하는 품질 플래그(VarQC·KNMI QC·감시 플래그)로 거른 뒤 평균 풍속을 구하는 예입니다.
    NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행하세요. KNMI FTP 파일(.nc.gz)은 먼저 압축을 푸세요.
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="ASCATC-L2-25km",            # Metop-B: ASCATB-L2-25km, 해안판: ASCATC-L2-Coastal
        temporal=("2025-08-01", "2025-08-01T23:59:59"),
        bounding_box=(120, 30, 135, 40),        # 서, 남, 동, 북 (한반도 주변)
    )
    files = earthaccess.download(results, "./ascat")

    REJECT = (1 << 16) | (1 << 17) | (1 << 18)  # VarQC 실패, KNMI QC 실패, 감시 플래그
    for f in files:
        ds = xr.open_dataset(f)
        lon = ds["lon"] % 360                    # 경도 표기(0~360 / ±180)에 상관없이
        flag = ds["wvc_quality_flag"].fillna(0).astype("int64")
        box = (ds["lat"] >= 30) & (ds["lat"] <= 40) & (lon >= 120) & (lon <= 135)
        ws = ds["wind_speed"].where(box & ((flag & REJECT) == 0))
        if ws.count() > 0:
            print(f, int(ws.count()), float(ws.mean()))  # 궤도별 유효 WVC 수, 평균 풍속(m/s)

tips:
  - "KNMI QC 플래그(wvc_quality_flag 비트 17)가 선 WVC는 반드시 버리라고 사용자 안내서가 강조합니다. 변분 QC(비트 16)와 감시 플래그(비트 18)가 선 값도 쓰지 말라고 권합니다."
  - "C밴드라 강수에 비교적 둔감하지만, 비가 강한 곳은 모델 함수와 맞지 않아(역산 잔차가 커) KNMI QC로 걸러집니다. RSS는 강한 비 속, 특히 약한 바람에서 ASCAT 정확도가 떨어진다고 안내합니다. 장마전선·태풍 강수대 주변은 플래그와 결측을 꼭 확인하세요."
  - "해빙 위에도 바람 해가 들어 있으며(가짜 바람), KNMI QC와 해빙 플래그(비트 14)로 표시됩니다. 베이즈 해빙 판별이 비가 오는 WVC를 해빙으로 잘못 볼 때도 있고, 모델 해수면온도 5 °C 이상인 곳은 늘 바다로 봅니다. 겨울 오호츠크해·발해처럼 해빙이 생기는 바다에서는 해빙 플래그와 ice_prob를 함께 보세요."
  - "육지 비율이 0.02를 넘는 WVC는 산출하지 않습니다. 25 km·일반 12.5 km 자료는 해안 약 35 km 안이 육지 오염으로 빠지므로, 서해·남해처럼 섬과 해안이 복잡한 곳은 약 15 km까지 산출하는 해안판(OSI-104, PO.DAAC *-L2-Coastal)을 쓰세요."
  - 사용자 안내서는 25 m/s를 넘는 풍속은 대체로 덜 믿을 만하다고 적습니다. 30 m/s 초과에는 플래그(비트 12)가 섭니다. 태풍 최대풍속 분석에는 그대로 쓰지 마세요.
  - "25 km 간격이지만 PO.DAAC는 유효 해상도를 50 km(해안판 25 km)로 안내합니다. 격자 간격 규모의 컬·발산은 잡음이 크니 해상도에 맞게 해석하세요."
  - 스와스 두 개 사이(위성 바로 아래)와 궤도 사이에 빈 곳이 있어 위성 하나로는 하루에 모든 바다를 덮지 못합니다. Metop-B와 Metop-C를 함께 쓰면 빈 곳이 줄지만, 일평균이 필요하면 CCMP 같은 격자 분석장이 낫습니다.
  - "준실시간 기록은 처리 방식이 중간에 바뀌었습니다(2008-11 중립 바람 전환으로 +0.2 m/s, 2018-09-25 CMOD7·응력 등가 바람). 장기 분석에는 재처리 자료(Copernicus Marine L3 MY, OSI-150, RSS V2.1)를 쓰세요."
  - "RSS 상호 보정 연구에 따르면 ASCAT-C는 ASCAT-B보다 약 0.05 m/s 낮고, ASCAT-A는 2016년 중반과 2019년 말에 보정 계단이 있었습니다(RSS V2.1.1에서 보정). 위성을 섞을 때 확인하세요."
  - "PO.DAAC 해안판 설명에는 아직 CMOD5.n으로 적혀 있지만, KNMI 제품 이력상 2018-09-25부터 CMOD7을 씁니다. 판 정보는 KNMI·OSI SAF 제품 페이지를 기준으로 보세요."
  - "궤도 기동·장비 이상으로 몇 시간씩 자료가 빠지는 일이 잦습니다(예 2026-09-16 Metop-C 궤도면 기동). 빈 시간대는 KNMI 제품 페이지의 이상 이력과 OSI SAF 서비스 메시지에서 확인할 수 있습니다."

