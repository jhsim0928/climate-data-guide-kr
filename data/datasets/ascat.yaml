        url: https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp_Second_Generation/First_MetOp_Second_Generation-B_satellite_spreads_its_wing
      - name: WMO OSCAR — Metop-SG-B1
        url: https://space.oscar.wmo.int/satellites/view/metop_sg_b1
      - name: WMO OSCAR — SCA 산란계
        url: https://space.oscar.wmo.int/instruments/view/sca_scatterometer
