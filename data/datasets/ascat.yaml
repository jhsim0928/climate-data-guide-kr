        url: https://user.eumetsat.int/s3/eup-strapi-media/pdf_science_epssg_sca_plan_b35ccedaa8.pdf
      - name: ESA — MetOp-SG facts and figures
        url: https://www.esa.int/Applications/Observing_the_Earth/Meteorological_missions/MetOp_Second_Generation/MetOp-SG_facts_and_figures

