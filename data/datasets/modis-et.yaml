      doi: 10.1016/j.rse.2011.02.019
      bibtex: |
        @article{mu2011mod16,
          author  = {Mu, Qiaozhen and Zhao, Maosheng and Running, Steven W.},
          title   = {Improvements to a {MODIS} global terrestrial evapotranspiration algorithm},
          journal = {Remote Sensing of Environment},
          volume  = {115},
          number  = {8},
          pages   = {1781--1800},
          year    = {2011},
          doi     = {10.1016/j.rse.2011.02.019}
        }
  acknowledgement: >-
    쓴 제품(Terra·Aqua, 8일·연, 보완판·forward판)에 맞는 LP DAAC 데이터셋 DOI를 인용하세요. Aqua판 DOI는 10.5067/MODIS/MYD16A2GF.061,
    10.5067/MODIS/MYD16A3GF.061, 10.5067/MODIS/MYD16A2.061입니다. 알고리즘은 Mu et al. (2011)을 함께 인용합니다.

transitions:
  - from: MOD16 C6
    to: MOD16 C6.1
    status: completed
    date: "2021-03"
    summary: >-
      과학 알고리즘은 그대로이고, 입력 MODIS L1B 보정 개선과 함께 결측 처리 방식이 바뀌었습니다. C6은 오염된 LAI·FPAR 화소를 채움값으로 남겨 빈 곳이 많았지만,
      C6.1은 기후값 LAI·FPAR와 결측 보완 알베도를 예비 입력으로 써서 빈 곳을 채웁니다. C6 자료는 2023-07-31 배포가 끝났습니다.
    changes:
      - aspect: 과학 알고리즘
        before: Penman-Monteith 기반 MOD16 (Mu et al., 2011)
        after: 변경 없음
      - aspect: 입력 L1B 보정
        before: C6 보정
        after: "반사 밴드 주사각 응답(RVS) 방식 변경, Terra 적외 밴드 광학 혼선 보정, 2012~2017 Terra 순방향 LUT 수정, 편광 보정"
      - aspect: LAI·FPAR 결측 처리 (forward판)
        before: 오염된 LAI·FPAR 화소는 채움값으로 남김
        after: 최근 5년 8일별 최적 LAI·FPAR 평균(MCD15A2HCL 기후값)을 예비 입력으로 사용
      - aspect: 알베도
        before: 결측 보완 없음
        after: 결측 보완 알베도(Sun et al., 2017)를 GF·예비 처리에 사용
      - aspect: 제공 기간 (8일 forward판)
        before: "2000~ (MOD16A2 V006)"
        after: "V061 MOD16A2·MYD16A2는 2021-01-01부터. 그 이전은 GF판 사용"
      - aspect: 파일 형식
        before: HDF-EOS2
        after: 동일 (변수 이름·형식 그대로)
    impacts:
      - C6과 C6.1을 섞지 말고 전 기간을 C6.1 GF판으로 다시 받으세요(C6은 2023-07-31 이후 배포되지 않습니다).
      - C6.1 forward판은 예비 입력 덕분에 빈 곳이 줄었지만, 기후값 LAI·FPAR가 들어간 화소는 그해의 실제 식생 상태를 반영하지 않습니다.
    sources:
      - name: MOD16 C6.1 User's Guide
        url: https://lpdaac.usgs.gov/documents/931/MOD16_User_Guide_V61.pdf
      - name: "Final Notice: MODIS Version 6.0 Land Data Products Decommissioned July 31, 2023"
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023
  - from: MODIS 증발산 MOD16/MYD16 C6.1
    to: VIIRS 증발산 VNP16·VJ116 V2.1 (공개 전)
    status: planned
    summary: >-
      NASA는 MODIS 종료에 대비해 같은 MOD16 알고리즘을 VIIRS(Suomi NPP·NOAA-20·NOAA-21)에 적용한 VNP16·VJ116·VJ216 V2를 2025~2026년에 공개했지만,
      자료 문제가 발견되어 2026-08-17 모두 철회하고 '과학 품질이 아니므로 연구에 쓰지 말라'고 공지했습니다. 문제를 고친 뒤 V2.1로 재처리할 예정이며 일정은 정해지지 않았습니다.
    changes:
      - aspect: 제공 상태
        before: "MOD16·MYD16 C6.1 생산 중 (Terra·Aqua 종료 시 중단 예정)"
        after: "VIIRS V2는 2026-08-17 철회·삭제, V2.1 재처리 예정(날짜 미정). 2026-10-13 확인 시 CMR에 공개된 VIIRS 증발산 컬렉션 없음"
      - aspect: 알고리즘
        before: Penman-Monteith 기반 MOD16
        after: 같은 계열 알고리즘(MODIS 증발산 시리즈를 잇도록 설계), 입력만 VIIRS LAI·FPAR·알베도로 교체
      - aspect: 위성·통과 시각
        before: "Terra(오전 10:30 하강, 표류 중)·Aqua(오후 1:30 상승, 표류 중)"
        after: "Suomi NPP·NOAA-20·NOAA-21 (오후 1:30 상승). Suomi NPP 자료 전달은 2026년 11월 초 종료 예정"
      - aspect: 해상도·제품 구성
        before: "500 m SIN, 8일(MOD16A2·A2GF), 연(A3GF)"
        after: "500 m SIN, 8일(VNP16A2·A2GF), 연(A3GF만) — V2 기준"
      - aspect: 파일 형식
        before: HDF-EOS2 (HDF4)
        after: HDF-EOS5 (HDF5)
    impacts:
      - 철회된 VIIRS 증발산 V2 파일을 이미 받았다면 연구에 쓰지 마세요. NASA는 V2를 과학 품질이 아니라고 밝혔습니다.
      - V2.1이 나와도 MODIS와 겹치는 기간에 두 자료의 차이를 확인한 뒤 이어 붙여야 합니다. 특히 Terra(오전) 관측을 이을 VIIRS 위성은 없습니다.
    sources:
      - name: VIIRS Actual and Potential Evapotranspiration Data Products Unavailable (LP DAAC, 2026-08-17)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-actual-potential-evapotranspiration-data-products-unavailable
      - name: VIIRS Version 2 Actual and Potential Evapotranspiration Data Products Released (LP DAAC, 2025-07-10)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-actual-potential-evapotranspiration-data-products-released
      - name: VIIRS Land — NASA Evapotranspiration and Potential Evapotranspiration
        url: https://viirsland.gsfc.nasa.gov/Products/NASA/ET_ESDR.html

notices:
  - date: "2026-08-17"
    level: warning
    title: 후속 자료 VIIRS 증발산 V2 전면 철회 — V2.1 재처리 예정, 일정 미정
    body: >-
      LP DAAC는 자료 문제가 새로 발견되었다며 Suomi NPP·NOAA-20·NOAA-21의 VIIRS 증발산(VNP16·VJ116·VJ216) V2 제품을 모두 아카이브에서 내리고
      AppEEARS에서도 비활성화했습니다. 이 자료는 과학 품질이 아니므로 어떤 연구에도 쓰지 말라고 안내했으며, 문제를 고친 뒤 V2.1로 재처리할 예정입니다.
      그때까지 MODIS 증발산을 이을 NASA VIIRS 산출물은 없습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-actual-potential-evapotranspiration-data-products-unavailable
  - date: "2026-03-20"
    level: warning
    title: NASA, Terra 과학 운용 종료를 2027년 2월·Aqua를 2027년 9월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월,
      Aura는 2028년 8월에 과학 운용이 끝날 것으로 전망하며, 그때까지는 운용을 계속한다고 밝혔습니다. 이전 계획(Terra 2025년 12월, Aqua 2026년 8월 종료)보다 늦춰진 일정입니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era
  - date: "2026-03-18"
    level: info
    title: MODIS L1B·지오로케이션 Version 7.0 공개 — 지면 산출물은 아직 C6.1
    body: >-
      LAADS DAAC가 MODIS 보정 복사량·지오로케이션 V7.0을 공개하고 V6.1 L1 자료는 2026-09-30 이후 내린다고 공지했습니다. 2026-10-13 확인 시
      MOD16 등 지면 산출물은 CMR에 V061만 있으며, C7 지면 산출물의 공개 일정은 공식 공지로 확인되지 않았습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2026-01-08"
    level: warning
    title: Terra·Aqua 궤도 표류가 MODIS 자료에 미치는 영향 조사 중 (LDOPE)
    body: >-
      MODIS 지면 품질평가팀(LDOPE)은 Terra·Aqua가 궤도 유지 기동을 멈춘 뒤 표류하면서 화소 크기·간격, 주사 간격(scan gap),
      보타이 중첩, 일주기 표본 시각이 달라졌고, 2024년 말부터 영향이 크게 나타났다며 MODIS 산출물 전반에 대한 영향을 조사 중이라고 밝혔습니다.
    source: https://landweb.modaps.eosdis.nasa.gov/displayissue?id=1254
  - date: "2025-06-03"
    level: info
    title: LP DAAC Data Pool의 MODIS 배포 종료(2025-06-30) — Earthdata Cloud로 전환
    body: >-
      LP DAAC는 C6.1을 포함한 모든 MODIS 자료의 Data Pool 배포를 2025년 6월 30일에 끝냈습니다. Data Pool 주소를 쓰던 스크립트는 Earthdata Cloud(HTTPS·earthaccess)로 바꿔야 하며,
      Earthdata Search와 AppEEARS는 그대로 쓸 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 시작
    body: >-
      NASA는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어가며, 두 위성이 설계 궤도를 벗어나 통과 시각이 바뀌고 있어 자료에 영향을 줄 수 있다고 공지했습니다.
      MODIS 자료 수집이 멈추면 마지막 재처리를 하며, 사용자는 VIIRS 유사 산출물을 검토하라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS V6.0 지면 산출물 배포 종료(2023-07-31) — V6.1로 전환
    body: >-
      LP DAAC는 2023년 7월 31일 MOD16을 포함한 MODIS V6.0 지면 산출물의 배포를 끝냈습니다. 사용자 가이드·ATBD는 DOI 페이지에 남아 있고, 자료는 V6.1을 쓰면 됩니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

