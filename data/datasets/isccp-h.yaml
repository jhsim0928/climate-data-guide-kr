notices:
  - date: "2026-09-21"
    level: info
    title: 후속 ISCCP-NG 시범 자료 공개 (CM SAF, 2021년분)
    body: >-
      EUMETSAT CM SAF가 정지궤도 위성 5기의 전지구 1단계 합성 자료로 만든 ISCCP-NG 시범 자료를 공개했습니다. 첫 공개분은 2021년 한 해이며
      0.05°·30분 간격의 구름 특성과 대기 상단 복사를 담았습니다. 장기 기후자료가 아니라 시범 자료이므로 ISCCP-H 기록을 잇는 정식 자료로 보기는 이릅니다.
