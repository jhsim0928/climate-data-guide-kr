notices:
  - date: "2026-06-08"
    level: info
    title: 후속 해양 재분석 ORAS6 공개 준비 발표
    body: >-
      ECMWF가 6세대 해양·해빙 재분석 ORAS6(NEMO4/SI3 모델, 앙상블 기반 자료동화, SST 직접 동화)의 공개를 준비 중이라고 밝혔습니다.
      1993년 이후 구간은 생산을 마치고 회원국·협력 기관에 먼저 제공될 예정이며, 1950년부터의 구간은 생산 중입니다.
      ORAS6는 ERA6의 해양·해빙 초기장으로 쓰입니다. 일반 공개 일정과 ORAS5 종료 여부는 아직 발표되지 않았습니다.
    source: https://www.ecmwf.int/en/about/media-centre/news/2026/new-oras6-ocean-reanalysis
  - date: "2026-04-27"
    level: info
    title: ORAS5 월별 시계열(ARCO) 데이터셋 CDS 공개
    body: >-
      한 지점의 긴 시계열을 효율적으로 받을 수 있도록 ORAS5 일부 변수를 Zarr(ARCO) 형식으로 재구성한
      reanalysis-oras5-timeseries 데이터셋이 추가되었습니다. 실험적 서비스로 안내되어 있습니다.
    source: https://forum.ecmwf.int/t/new-dataset-published-in-cds-oras5-global-ocean-reanalysis-monthly-time-series-data-from-1958-to-present/14863
  - date: "2025-07-02"
    level: info
    title: CDS 라이선스가 CC BY 4.0으로 변경
    body: CDS·ADS·EWDS의 "Licence to use Copernicus Products"가 CC BY로 바뀌었습니다. 새 약관에 동의해야 다운로드가 됩니다.
    source: https://forum.ecmwf.int/t/cc-by-licence-to-replace-licence-to-use-copernicus-products-on-02-july-2025/13464
  - date: "2024-09-26"
    level: critical
    title: 구 CDS 종료 — 새 계정·API key 필요
    body: >-
      구(legacy) CDS가 폐쇄되고 신규 CDS로 전환되었습니다. ORAS5를 받는 기존 스크립트도
      pip install --upgrade cdsapi 후 .cdsapirc 의 url과 key를 새로 설정해야 동작합니다.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380

