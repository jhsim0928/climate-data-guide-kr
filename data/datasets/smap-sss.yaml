# ─────────────────────────────────────────────────────────────
# NASA SMAP 해면 염분 (RSS V6.0 · JPL CAP V5.0) — 데이터셋 정보 파일
# 위성 탭(해면 염분), 해양 탭(위성 관측 자료) 교차 수록. 같은 SMAP L밴드 복사계 관측을 RSS와 JPL이 서로 다른 알고리즘으로 처리한 두 계열의 L3 산출물을 한 페이지에 정리했습니다.
# 2026-10-13 확인 시 JPL CAP V5.0 8일 L3는 2026-10-06 중심일 파일까지, RSS V6.0 8일 L3는 2026-09-19 중심일 파일까지 PO.DAAC에 올라와 있습니다.
# 같은 페이지 안 버전 변경(RSS V5.0 → V6.0)은 transitions(to_id 없음)에 적었습니다. 토양수분 제품은 ../smap/ 페이지에 있습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: smap-sss
name: "SMAP 해면 염분 (RSS·JPL)"
full_name: >-
  Soil Moisture Active Passive (SMAP) Sea Surface Salinity — RSS SMAP Level 2C/Level 3 SSS V6.0과 JPL SMAP CAP Level 2B/Level 3 SSS V5.0
  (SMAP L밴드 복사계 해면 염분, NASA PO.DAAC 배포)
category: satellite
domain: satellite
group: 해면 염분
order: 10
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 원격탐사]
provider: Remote Sensing Systems(RSS, V6.0) · NASA JPL SMAP 염분 팀(CAP V5.0) / NASA PO.DAAC 배포, NASA Ocean Salinity Science Team 지원

status: active
status_note: >-
  SMAP는 L밴드 복사계로 계속 관측 중이며 두 계열 모두 정상 갱신되고 있습니다. 2026-10-13 확인 시 PO.DAAC에 JPL CAP V5.0 8일 L3는 2026-10-06 중심일(10-02~10-10) 파일,
  월자료는 2026년 9월분까지, RSS V6.0 8일 L3는 2026-09-19 중심일(09-15~09-23) 파일, 월자료는 2026년 8월분까지, RSS L2C 준실시간판은 2026-10-11 궤도까지 올라와 있습니다.
  현재판은 RSS V6.0(2024-03 공개, 2024-09 전 기간 재처리 완료)과 JPL CAP V5.0입니다.

period:
  start: "2015-04"
  end: present
  note: >-
    SMAP 과학 관측은 2015년 4월 시작했습니다. RSS V6.0 8일 L3 첫 파일은 2015-04-01 중심(2015-03-28~04-05), 월자료는 2015-04부터이고, JPL CAP V5.0 8일 L3는 2015-05-04 중심 파일부터입니다.
    위성 안전모드로 2019-06-19~07-23과 2022년 8월 초~9월 하순(궤도 복귀는 10-06)에 자료가 없습니다. RSS 릴리스 노트는 공백을 2019-06-17~07-25, 2022-08-06~09-21(8일 파일 없음)로,
    PO.DAAC 공지는 2019-06-19~07-23, 2022-08-09~10-06으로 적고 있어 문서마다 조금 다릅니다. RSS 기준 2019년 7월, 2022년 8·9월 월자료는 없습니다.

resolution:
  spatial_short: "70 km (0.25°)"
  temporal_short: "8일"
  spatial: >-
    L3는 두 계열 모두 0.25° × 0.25° 정규 위경도 격자입니다. RSS V6.0은 약 70 km로 평활한 표준 염분(`sss_smap`)과 원래 약 40 km 해상도 염분(`sss_smap_40km`, 실험용)을 함께 싣고,
    JPL CAP V5.0은 공간 해상도를 약 60 km로 안내합니다. L2(RSS L2C, JPL L2B)는 폭 1000 km 스와스 궤도 자료입니다
  vertical: 해면 단일층 — L밴드(1.41 GHz) 복사계가 감지하는 표층 염분
  temporal: >-
    L3 8일 이동평균(파일은 하루 1개, 파일 날짜가 8일 구간의 가운데) / L3 월평균. 궤도 자료는 RSS L2C(지연 4일)·L2C 준실시간(약 5시간), JPL L2B·L2B 준실시간(2시간판 포함)이 따로 있습니다

coverage:
  short: 전지구
  note: "전지구 해양. 해빙역·육지 가까운 격자는 비거나 플래그 처리되며, RSS는 해빙 오염 등급(sea_ice_zones)에 따라 염분을 빼거나 표준 평활 제품에서 제외합니다"
update: >-
  매일(8일 이동평균 파일 하루 1개). PO.DAAC 안내 지연은 RSS L3 8일·월 모두 구간 끝 후 약 7일, JPL 8일 약 7일·월 약 1개월입니다.
  2026-10 확인 시 실제로는 JPL 8일 파일이 구간 끝 약 3일 뒤, JPL 월자료가 다음 달 2일께, RSS 8일 파일이 구간 끝 약 1주 뒤, RSS 월자료는 약 1개월 뒤에 올라왔습니다
license: >-
  NASA 지구과학 공개 자료 — 제한 없이 무료로 공개(PO.DAAC·Earthdata 안내). PO.DAAC에서 받으려면 무료 NASA Earthdata 로그인이 필요하고, RSS 서버(HTTPS)는 로그인 없이 받을 수 있습니다.
  RSS는 데이터셋 DOI 인용과 감사 문구를 요청합니다
account_required: false

summary: >-
  NASA SMAP 위성의 L밴드(1.41 GHz) 복사계 관측으로 만든 해면 염분(SSS) 자료입니다. SMAP는 토양수분 관측 위성이지만 2015년 6월 Aquarius가 끝난 뒤 NASA의 위성 염분 관측을 이어받았고,
  같은 밝기온도를 두 팀이 서로 다른 알고리즘으로 처리합니다. Remote Sensing Systems(RSS)의 V6.0은 Aquarius와 같은 계열의 알고리즘에 CCMP 바람을 거칠기 보정에 쓰는 자료이고,
  JPL의 CAP(Combined Active-Passive) V5.0은 Aquarius용으로 개발한 결합 알고리즘으로 염분과 바람을 함께 구하는 자료입니다. 둘 다 0.25° 격자의 8일 이동평균·월평균 L3를 PO.DAAC에서 제공합니다.

time_convention:
  summary: >-
    L3 8일 파일은 그 날짜를 가운데로 앞뒤 3.5일(8일) 안의 유효 관측을 평균한 값이고, 파일은 하루 하나씩 나옵니다. 월자료는 그 달 전체의 평균입니다.
    파일 속 time은 두 계열 모두 평균 구간의 가운데 시각입니다. 실제 관측은 오전 6시(하강)·오후 6시(상승) 무렵 위성이 지나간 순간들이며, 8일 동안 한 격자가 여러 번 관측됩니다.
  points:
    - "RSS 8일 파일 이름의 연중 일수(예 RSS_smap_SSS_L3_8day_running_2026_262_FNL_v06.0 → 2026년 262일 = 9월 19일)가 구간의 가운데이고, 그 날 ±3.5일 안의 관측을 평균합니다."
    - "JPL 8일 파일 이름의 날짜(예 SMAP_L3_SSS_20261006_8DAYS_V5.0)도 구간 가운데입니다. PO.DAAC 기록상 이 파일 구간은 10월 2일 12 UTC~10월 10일 12 UTC이며, JPL은 가우스 가중치로 평균합니다(`weight` 변수)."
    - "8일 파일은 매일 나오지만 이웃한 파일끼리 7일이 겹치므로 서로 독립 표본이 아닙니다. 독립적인 시계열이 필요하면 8일 간격으로 골라 쓰거나 월자료를 쓰세요."
    - "time 기준이 다릅니다 — RSS는 'seconds since 2000-01-01T00:00:00Z', JPL은 'seconds since 2015-1-1 00:00:00 UTC'입니다."
    - "RSS L3는 앞·뒤 관측(fore/aft)과 상승·하강 궤도를 모두 합쳐 평균합니다. 궤도별 순간값이 필요하면 L2C(RSS)나 L2B(JPL)를 쓰세요."
  source: https://data.remss.com/smap/SSS/V06.0/documents/Release_V6.0.pdf
  source_name: RSS SMAP Salinity V6.0 Release Notes + PO.DAAC·Earthdata 변수표

variables:
  note: >-
    변수 이름과 단위는 NASA Earthdata 카탈로그(PO.DAAC) 변수표 기준입니다. 염분 단위 1e-3은 실용염분(psu와 같은 크기)입니다. RSS와 JPL은 파일 구조와 변수 이름이 다르니 함께 쓸 때 주의하세요.
  full_list: https://www.earthdata.nasa.gov/data/catalog/pocloud-smap-rss-l3-sss-smi-8day-runningmean-v6-6.0
  groups:
    - name: RSS SMAP L3 V6.0 (8일 이동평균·월, 0.25°)
      kind: mean
      period: 8일 이동 또는 월
      items:
        - text: "해면 염분(약 70 km 평활, 표준) — `sss_smap` (1e-3)"
          note: RSS가 공식 제품으로 권장
        - text: "해면 염분(원 해상도 약 40 km, 실험용) — `sss_smap_40km` (1e-3)"
          note: 잡음이 큼
        - text: "강우 영향을 걸러낸 해면 염분(약 70 km) — `sss_smap_RF` (1e-3)"
        - text: "염분 총 불확도 추정 — `sss_smap_unc`, `sss_smap_40km_unc`, `sss_smap_RF_unc` (1e-3)"
          std: []
        - text: "HYCOM 참고 염분 — `sss_ref` (1e-3)"
          std: []
        - text: "평균에 쓴 관측 수 — `nobs`, `nobs_40km`, `nobs_RF` (1)"
          kind: accum
          std: []
        - text: "보조 해상풍속(CCMP NRT, 거칠기 보정용) — `winspd` (m s-1)"
          std: []
        - text: "보조 수온(CMC) — `surtep` (K)"
          std: []
        - text: "해빙 비율 추정(안테나 이득 가중) — `gice_est` (1)"
          std: []
        - text: "육지 비율 — `gland`, `fland` (1)"
          std: []
    - name: JPL SMAP CAP L3 V5.0 (8일 이동평균·월, 0.25°)
      kind: mean
      period: 8일 이동 또는 월
      items:
        - "해면 염분 — `smap_sss` (1e-3)"
        - text: "염분 불확도 — `smap_sss_uncertainty` (1e-3)"
          std: []
        - text: "SMAP 10 m 해상풍속 — `smap_spd` (m s-1)"
          note: SMAP 관측에서 염분과 함께 구한 값
        - text: "SMAP 10 m 해상풍속(보조 염분 사용) — `smap_high_spd` (m s-1)"
          std: [wind10]
