notices:
  - date: "2026-08-11"
    level: warning
    title: SMAP 2026-05-14~07-28 위치(geolocation) 오류 — 표준 제품 재처리
    body: >-
      NSIDC는 SMAP 표준·준실시간 자료에 2026년 5월 14일~7월 28일 위치 오류가 있어 표준 제품을 재처리해 교체한다고 알렸습니다(준실시간 제품은 교체하지 않음).
      공지는 NSIDC(토양수분 배포처) 안내라 염분 제품은 따로 언급하지 않습니다. 2026-10-13 확인 시 PO.DAAC의 RSS V6.0 8일 L3 중 2026년 5월 초~9월 초 중심일 파일이 2026-09-12에,
      월자료 2026-05~08이 09-29에 다시 올라와 있으나, 이 교체가 위치 오류 때문인지는 PO.DAAC·RSS가 공지하지 않았습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-data-reprocessing
  - date: "2024-09-23"
    level: info
    title: RSS SMAP 염분 V6.0 전 기간 재처리(back-fill) 완료
    body: >-
      PO.DAAC가 RSS SMAP 해면 염분 V6.0 검증 자료의 과거 기간 처리를 마쳤다고 알렸습니다(공지 문구는 '2015-05-25부터 현재까지'이나, PO.DAAC 목록에는 2015년 4월 파일부터 있습니다).
      V5.3 평가판은 이 재처리가 끝날 때까지 대신 쓰라고 안내했던 임시판입니다.
    source: https://podaac.jpl.nasa.gov/announcements/2024-09-23-Back-fill-completion-of-SMAP-RSS-Sea-Surface-Salinity-V6.0-Validated-Datasets
  - date: "2024-03-26"
    level: info
    title: RSS SMAP 염분 V6.0 공개
    body: >-
      L2C, L2C 준실시간, L3 8일·월 V6.0이 PO.DAAC에 공개되었습니다. 2015년 4~8월 레이더 작동기의 편향 제거, 관측 방향에 따른 편향 완화, 북반구 고위도의 과도하게 짠 값 감소,
      태양 반사(sun glint) 플래그 수정이 바뀐 점입니다. 지연은 L2C 4일, L2C 준실시간 5시간, L3 7일입니다.
    source: https://podaac.jpl.nasa.gov/announcements/2024-03-26-SMAP-RSS-Sea-Surface-Salinity-V6.0-Validated-Dataset-Release
  - date: "2022-08-22"
    level: warning
    title: SMAP 안전모드 (2022-08-08 진입) — 염분 관측 공백
    body: >-
      SMAP가 2022년 8월 8일 안전모드에 들어가 과학 관측이 멈췄습니다. SMAP 운영 이벤트 기록에는 이때 안테나 회전이 멈춘(spin down) 것으로 적혀 있고, 복사계는 9월 19일 다시 켜졌으며 10월 6일 궤도 조정으로 정상 과학 운용에 돌아왔습니다.
      RSS 기준 2022년 8·9월 월자료가 없습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-smap-safe-mode
  - date: "2019-06-24"
    level: warning
    title: SMAP 안전모드 (2019-06-19~07-23 관측 공백)
    body: >-
      SMAP가 2019년 6월 19일 저녁 안전모드에 들어가 모든 기기가 꺼졌고, 7월 23일 복사계가 다시 켜질 때까지 관측이 없습니다. 이 기간에는 염분 L2·8일 L3 파일이 없고 RSS 2019년 7월 월자료도 없습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/smap-safe-mode

transitions:
  - from: RSS SMAP SSS V5.0
    to: RSS SMAP SSS V6.0
    status: completed
    date: "2024-03"
    summary: >-
      입력 안테나 온도를 SMAP L1B Version 6(Piepmeier et al., 2023)으로 바꾸고 몇 가지 편향 보정을 손본 판입니다. 2024년 3월 공개, 9월에 전 기간 재처리가 끝났습니다.
      전 기간 재처리가 끝나기 전에는 V6.0과 처리가 같고 입력만 V5 L1B인 V5.3 평가판(2023년 말까지)을 쓰도록 안내했습니다.
    changes:
      - aspect: 입력 L1B
        before: SMAP L1B Version 5 안테나 온도
        after: "SMAP L1B Version 6 안테나 온도(RFI 제외 문턱값이 낮아져 의심 간섭을 더 걸러냄)"
      - aspect: 초기(2015-04~08) 편향
        before: 레이더 작동기 고속·저속 안테나 온도 차이(약 0.25 K)로 대륙붕 주변에 짠 테두리
        after: 이 편향을 수동 제거
      - aspect: 반사 은하·반사판 온도 보정
        before: 관측 방향에 따른 싱거운 편향, 북반구 고위도의 짠 편향
        after: 반사 은하 보정·반사판 물리 온도 모델 조정으로 두 편향 감소
      - aspect: 태양 반사(sun glint) 플래그
        before: 음의 glint 각도도 플래그
        after: "음의 각도는 플래그하지 않고, 고위도 약풍·측엽 후방산란용 새 플래그 추가"
      - aspect: 데이터셋 DOI
        before: "10.5067/SMP50-… (V5.0)"
        after: "10.5067/SMP60-2SOCS(L2C)·3SPCS(L3 8일)·3SMCS(L3 월)"
    impacts:
      - V5.0으로 만든 시계열은 V6.0으로 전 기간을 다시 받아 바꾸세요. 특히 2015년 4~8월과 북반구 고위도 값이 달라집니다.
      - "V6.0은 RFI를 더 강하게 걸러 일부 격자의 관측 수(`nobs`)가 줄 수 있습니다."
      - "V6.0에서도 2020년 이후 남위 60° 부근의 짠 편향과 동아시아·아라비아해·지중해의 미탐지 RFI는 해결되지 않은 문제로 남아 있습니다."
    sources:
      - name: RSS SMAP Salinity V6.0 Release Notes (PDF)
        url: https://data.remss.com/smap/SSS/V06.0/documents/Release_V6.0.pdf
      - name: PO.DAAC — V6.0 공개 공지 (2024-03-26)
        url: https://podaac.jpl.nasa.gov/announcements/2024-03-26-SMAP-RSS-Sea-Surface-Salinity-V6.0-Validated-Dataset-Release
      - name: PO.DAAC — V5.3 평가판 공지 (2024-06-07)
        url: https://podaac.jpl.nasa.gov/announcements/2024-06-07-SMAP-RSS-SSS-V5.3-Evaluation-Dataset-Release

