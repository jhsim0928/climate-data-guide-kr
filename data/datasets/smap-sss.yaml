example:
  lang: python
  note: >-
    earthaccess로 RSS V6.0 8일 L3 한 달치를 받아 한반도 주변 표준 염분(`sss_smap`)을 고르는 예입니다. NASA Earthdata 계정으로 earthaccess.login()을 한 번 거쳐야 합니다.
    JPL CAP을 쓰려면 short_name을 SMAP_JPL_L3_SSS_CAP_8DAY-RUNNINGMEAN_V5로, 변수를 `smap_sss`, 좌표를 latitude·longitude로 바꾸세요.
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="SMAP_RSS_L3_SSS_SMI_8DAY-RUNNINGMEAN_V6",  # 월자료: SMAP_RSS_L3_SSS_SMI_MONTHLY_V6
        temporal=("2025-08-01", "2025-08-31"),
    )
    files = earthaccess.download(results, "./smap_sss")

    ds = xr.open_dataset(files[0])
    box = (ds.lat >= 25) & (ds.lat <= 40) & (ds.lon >= 120) & (ds.lon <= 135)  # 한반도·동중국해
    sss = ds["sss_smap"].where(box, drop=True)
    print(float(sss.mean()), int(ds["nobs"].where(box, drop=True).sum()))

tips:
  - "RSS는 약 70 km 평활 염분(`sss_smap`)을 공식 제품으로, 40 km 염분(`sss_smap_40km`)은 실험용으로 둡니다. 대부분의 외해 분석에는 잡음이 훨씬 적은 70 km 값을 쓰라고 안내합니다."
  - "RSS는 일본·중국·대만 주변에서 특정 기간 탐지되지 않은 전파 간섭(RFI)으로 염분이 실제보다 낮게(싱겁게) 나올 수 있다고 밝힙니다. 동아시아 연해 분석에서는 이상하게 낮은 값을 의심하세요."
  - 연안 가까운 격자는 육지 오염으로 값이 빠지거나 품질이 낮습니다. RSS는 강한 육지 오염 격자는 염분을 내지 않고, 중간 정도 오염은 표준 평활 제품에서 뺍니다. 황해·동중국해처럼 좁은 바다는 비는 곳이 많습니다.
  - 강수 직후에는 표층이 성층되어 SMAP 염분이 Argo(약 5 m 깊이)나 HYCOM보다 낮게 나옵니다. 이것은 오차가 아니라 측정 깊이 차이일 수 있으며, 강우 영향을 줄인 `sss_smap_RF`를 함께 보세요.
  - "RSS는 2020년부터 남위 60° 부근에서 염분이 점점 높게(짜게) 나오는 편향을 보고했습니다. 남극해 장기 추세 분석에는 주의하세요. 수온 5°C 미만 해역도 품질 저하로 표시됩니다."
  - RSS와 JPL은 같은 SMAP 관측이라도 알고리즘·보조자료가 달라 값이 다릅니다. 한 시계열 안에서 섞지 말고, 논문에는 어느 계열(RSS V6.0 / JPL CAP V5.0)을 썼는지 적으세요.
  - "2019-06~07, 2022-08~09 안전모드 공백 외에도 RSS는 L2 파일이 없는 날(2015-12-03·04, 2016-04-15·16, 2017-09-27·28, 2017-11-25, 2018-12-16)과 CCMP 바람이 없어 검색을 못 한 날(2017-05-25·26, 2020-10-22·23)을 공개합니다. 이 날을 포함한 8일 파일은 관측 수가 적습니다."
  - "2026-10-13 확인 시 PO.DAAC의 RSS V6.0 8일 L3 가운데 2026년 5월 초~9월 초 중심일 파일들이 2026-09-12에 다시 만들어져 있고, 월자료 2026-05~08도 09-29에 갱신되었습니다(SMAP 2026-05-14~07-28 위치 오류 재처리 시기와 겹침). 이 기간 자료를 그 전에 받았다면 다시 받는 것이 안전합니다."

