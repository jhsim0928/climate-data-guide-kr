account_required: true

summary: >-
  세계기후연구계획(WCRP) GEWEX가 조정하는 전지구 강수 분석으로, 마이크로파·적외 위성 추정과 GPCC 우량계 분석을 합쳐 육지·해양을 빈틈없이 덮습니다.
  현재판 V3.3은 0.5° 격자의 월자료(1983–)와 일자료(1998–)이며, 일자료는 IMERG를 바탕으로 만들어 합계가 월자료와 맞도록 보정됩니다.
  옛 V2.3(2.5° 월, 1979–)은 수많은 논문의 기준 자료였고 지금도 매달 갱신되지만, 공식적으로는 V3.3으로 대체되었습니다.

time_convention:
  summary: >-
    월자료는 그달의 평균 강수율(mm/day), 일자료는 하루 강수량(mm/day)입니다. V3.3 파일의 time은 그 달(또는 날)의 시작·끝 시각
    두 값으로 적혀 있습니다(minutes since 1979-01-01 00:00:00).
  points:
    - "월값 단위가 mm/day이므로 월 강수량(mm)은 그 달 일수를 곱해 구합니다."
    - "V3.3 일자료는 IMERG Final 30분 자료를 하루로 모은 뒤, 격자마다 하루 값들의 합이 V3.3 월값과 거의 같아지도록 비율(0.2~4배 제한)을 곱한 것입니다."
    - "일자료 하루의 경계 시각(예: 00~24 UTC)은 README·ATBD에 명시되어 있지 않습니다. 파일의 time 시작·끝 값을 확인하세요."
    - "액체 강수 확률(probability_liquid_phase)은 월자료에서 3시간 확률을 강수량 가중 평균한 값입니다."
    - "V2.3 NCEI 파일은 이름에 preliminary가 붙은 예비본이 먼저 나오고 나중에 최종본으로 바뀝니다."
  source: https://measures.gesdisc.eosdis.nasa.gov/data/GPCP/GPCPMON.3.3/doc/README.GPCPV3.3_Monthly.pdf
  source_name: GES DISC GPCP V3.3 Monthly·Daily README + V3.3 ATBD

variables:
  note: >-
    V3.3은 GES DISC README(Table 3)의 파일 속 변수명, V2.3은 NCEI THREDDS 집계 자료의 변수명입니다.
    V3.3 월 파일의 품질 지수(quality index, 등가 우량계 수)는 README에 공백이 있는 이름으로 적혀 있어 받은 파일에서 확인하세요.
  full_list: https://measures.gesdisc.eosdis.nasa.gov/data/GPCP/GPCPMON.3.3/doc/README.GPCPV3.3_Monthly.pdf
  groups:
    - name: V3.3 월자료 (GPCPMON, 0.5°)
      kind: mean
      period: 월
      items:
        - "위성·우량계 합성 강수 — `sat_gauge_precip` (mm/day)"
        - "합성 강수 무작위 오차 — `sat_gauge_error`, `sat_gauge_random_error` (mm/day)"
        - text: "합성 강수 절대 편향 오차 — `sat_gauge_absolute_bias_error` (mm/day)"
          note: V3.3에서 새로 추가
        - "위성 단독 강수 — `satellite_precip` (mm/day)"
        - "바람 손실 보정 우량계 강수 — `gauge_precip` (mm/day)"
        - text: "액체 강수 확률 — `probability_liquid_phase` (%)"
          note: 3시간 확률의 강수량 가중 월평균
        - "우량계 상대 가중치 — `gauge_relative_weight` (%)"
    - name: V3.3 일자료 (GPCPDAY, 0.5°)
      kind: accum
      period: 일
      items:
        - text: "일 강수량 — `precip` (mm/day)"
          note: 하루 총량이자 일평균 강수율. 합이 월값에 맞도록 보정됨
        - text: "액체 강수 확률 — `probability_liquid_phase` (%)"
          kind: mean
          period: 일
    - name: V2.3 월자료 (NCEI CDR, 2.5°)
      kind: mean
      period: 월
      items:
        - "위성·우량계 합성 강수 — `precip` (mm/day)"
        - "합성 강수 오차 — `precip_error` (mm/day)"

