notices:
  - date: "2026-10-14"
    level: info
    title: Copernicus CDS의 GPCP v3.3을 2025년까지 연장 — 앞으로 6개월마다 갱신
    body: >-
      2024년 9월에서 멈춰 있던 CDS의 GPCP v3.3에 2025년까지의 ICDR 연장분이 올라와 CDS 웹 양식이나 CDS API로 받을 수 있습니다.
      ECMWF는 앞으로 6개월마다 갱신한다고 안내했습니다.
    source: https://forum.ecmwf.int/t/new-gpcp-v3-3-dataset-now-available-on-cds/14469
  - date: "2026-10-02"
    level: warning
    title: NCEI 클라우드 이전으로 자료 접근 지연 (2026-10-30까지 예정)
    body: >-
      NCEI가 자료와 서비스를 클라우드로 옮기는 중이라 다운로드·주문 서비스가 간헐적으로 느리거나 실패할 수 있습니다.
      NCEI 경로가 안 되면 AWS·Google Cloud 사본이나 GES DISC를 이용하세요.
    source: https://www.ncei.noaa.gov/alerts
  - date: "2026-05-01"
    level: info
    title: V3.3을 2025년 12월까지 연장 — 2025년 10~12월 일자료는 IMERG Late 기반
    body: >-
      GES DISC에 V3.3 월·일자료 2025년분이 추가되었습니다. IMERG V07 Final 생산이 끝나 2025년 10~12월 일자료는
      IMERG V07 Late로 만들었고, 2025년 12월 월값 보정에는 다른 GPROF 제품을 썼다고 ATBD에 적혀 있습니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/MEaSUREs/GPCP/GPCP_ATBD_V3.3_Daily.pdf
  - date: "2025-12-02"
    level: info
    title: Copernicus CDS에 GPCP v3.3 공개
    body: CDS의 GPCP 자료가 v3.3으로 바뀌었습니다(월 1983-01~2024-09, 일 1998-01~2024-09). GES DISC보다 기간이 짧습니다.
    source: https://forum.ecmwf.int/t/new-gpcp-v3-3-dataset-now-available-on-cds/14469
  - date: "2025-08-05"
    level: warning
    title: NOAA CDR이 V3.3으로 교체 — V2.3·일별 V1.3은 '대체된 판'
    body: >-
      NOAA NCEI가 GPCP 월·일 CDR V3.3(0.5°)을 공개하고, V2.3(월)과 V1.3(일)을 대체된 판으로 표시했습니다.
      이전 연구 재현처럼 드문 경우가 아니면 옛 판을 쓰지 말라고 안내합니다. 다만 V2.3 파일은 2026년 10월에도 계속 올라오고 있습니다.
    source: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01725
  - date: "2025-02-12"
    level: info
    title: V3.3 공개, V3.2 대체
    body: >-
      GES DISC가 V3.3 월·일자료를 공개하고 V3.2를 대체했습니다. 입력이 GPROF2021, PERSIANN-CDR, GPCC V2022 등으로 바뀌고
      절대 편향 오차 변수가 추가되었으며, 일자료가 1998년 1월부터로 늘었습니다. 해양 강수는 V3.2보다 대체로 많습니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/MEaSUREs/GPCP/Release_Notes.GPCPV3.3.pdf

