    note: C3S가 재배포하는 사본입니다(2025-12 v3.3 공개). 2026-10 확인 시 카탈로그 기간 표기는 2025-12까지입니다. ECMWF 계정 필요.

example:
  lang: python
  note: "NASA Earthdata 계정으로 earthaccess.login()을 한 번 거친 뒤 실행합니다. 계정 없이 최근 달이 필요하면 아래 주석처럼 NOAA AWS의 V2.3을 받습니다."
  code: |
    # pip install earthaccess xarray netCDF4
    import earthaccess
    import xarray as xr

    earthaccess.login()
    results = earthaccess.search_data(
        short_name="GPCPMON", version="3.3", temporal=("2024-01", "2024-12")
    )
    files = earthaccess.download(results, "./gpcp")
    ds = xr.open_mfdataset(files, combine="by_coords")
    pr = ds["sat_gauge_precip"]          # mm/day, 월평균 강수율
    print(pr.sel(lat=slice(33, 39), lon=slice(124, 132)).mean(("lat", "lon")).values)

    # 계정 없이 V2.3(2.5°): https://noaa-cdr-precip-gpcp-monthly-pds.s3.amazonaws.com/data/2026/
    #   gpcp_v02r03_monthly_dYYYYMM_cYYYYMMDD.nc (예비본은 gpcp_v02r03-preliminary_...)

tips:
  - 2.5° V2.3과 0.5° V3.3은 기후값·추세가 다릅니다. 선행 연구와 비교할 때는 같은 판을 쓰고, 논문에 판 번호(V2.3/V3.3)를 꼭 적으세요.
  - V3.3 일자료는 개별 날짜·격자 값의 정확도가 낮다고 NOAA가 명시합니다. 극한 강수 사례 분석보다는 대규모·통계적 분석에 쓰세요.
  - V3.3 일자료는 IMERG에 기대므로 IMERG Final이 V08로 넘어가기 전까지 2026년 이후 연장이 늦어질 수 있습니다. 최신 일강수는 IMERG Early·Late를 함께 검토하세요.
  - 같은 날짜 V2.3 파일도 예비본(preliminary)이 최종본으로 바뀌므로, 최근 몇 달은 나중에 다시 받아 확인하세요.
  - "V3.3은 위경도 격자 중심값입니다. 2.5° 격자 시대의 영역 정의(예: 1.25° 오프셋)를 그대로 쓰지 마세요."

