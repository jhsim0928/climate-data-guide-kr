# ─────────────────────────────────────────────────────────────
# GPCP — 데이터셋 정보 파일
# 대기 탭(강수 자료). 주 제품은 V3.3(0.5° 월·일)이고, 옛 V2.3(2.5° 월)·일별 V1.3(1°)을 함께 설명합니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: gpcp
name: GPCP V3.3
full_name: Global Precipitation Climatology Project (GPCP) Version 3.3 Satellite-Gauge 합성 강수 (전지구 위성·우량계 합성 강수 분석)
category: analysis
domain: atmosphere
group: 강수 자료
order: 10
also_in:
  - domain: satellite
    group: 강수
domains: [대기, 육지, 해양]
provider: NASA GSFC·University of Maryland ESSIC GPCP 팀 (배포 NASA GES DISC, NOAA NCEI 기후자료기록 CDR)

status: delayed
status_note: >-
  현재 권장판은 V3.3(0.5° 월·일)이며, NASA와 NOAA CDR 프로그램 모두 V2.3(월)·V1.3(일)을 대체된 판으로 표시합니다.
  다만 V3.3은 몇 달 단위로 몰아서 갱신되고 2026-10-12 확인 시 2025년 12월까지만 있습니다. 공식 설명에는 적외 입력의 새 보정 방식을 기다리느라
  생산이 멈췄었다는 안내가 남아 있고, 일별 자료의 바탕인 IMERG V07 Final도 2025년 9월에 끝났습니다.
  최근 몇 달이 필요하면 아직 매달 나오는 V2.3(2.5°)을 임시로 쓸 수 있습니다.

transitions:
  - from: GPCP V2.3
    to: GPCP V3.3
    status: completed
    date: "2025-08"
    summary: NOAA CDR이 2025년 8월 V3.3을 새 기후자료기록으로 내면서 V2.3·V1.3을 '대체된 판'으로 바꿨습니다. 격자가 2.5°(일별 1°)에서 0.5°로 촘촘해지고 입력 자료가 전면 교체되었습니다.
    changes:
      - aspect: 격자
        before: 월 2.5° (144×72), 일 1°
        after: 월·일 모두 0.5° (720×360)
      - aspect: 기간
        before: 월 1979-01–현재, 일 1996-10–현재
        after: 월 1983-01–현재, 일 1998-01–현재
      - aspect: 적외(IR) 위성 입력
        before: 정지·극궤도 위성 적외 밝기온도(1986–), 1979–1985는 OPI
        after: GridSat 기반 PERSIANN-CDR 3시간 자료를 SSM/I·SSMIS로 보정한 뒤 MCTG 기후값 비율 적용
      - aspect: 고위도
        before: TOVS(1987-08–2002-12)·AIRS(2003-01–) 강수
        after: TOVS(1983–2002-08)·AIRS(2002-09–) 강수
      - aspect: 우량계 분석
        before: GPCC Full Data Reanalysis V7 + Monitoring
        after: GPCC V2022 Final + Monitoring
      - aspect: 일별 산출 방식
        before: 일별 V1.3 (1°, 1996-10–)
        after: 55°N–55°S는 IMERG Final 30분 자료를 하루로 모아 0.5°로 평균, 고위도는 TOVS/AIRS를 쓰고 월값에 맞춰 비율 보정
      - aspect: 새 변수
        before: 강수·무작위 오차
        after: 절대 편향 오차, 액체 강수 확률, 우량계 가중치 추가
      - aspect: 갱신 지연
        before: 예비(ICDR) 약 10일, 최종 약 2개월 뒤
        after: 약 3개월 이상 (몇 달씩 묶어 갱신)
    impacts:
      - 두 판을 한 시계열로 이어 붙이지 마세요. V3.3은 특히 해양에서 강수가 대체로 더 많게 나옵니다.
      - V3.3 월자료는 1983년부터라 1979–1982년이 필요하면 V2.3밖에 없습니다. 이 경우 논문에 판 차이를 명시하세요.
      - 2.5° 격자 기준으로 짠 기후값·지수 계산 코드는 0.5° 격자(격자 중심 위치 포함)에 맞게 고쳐야 합니다.
      - NOAA는 V2.3을 '이전 연구 재현 같은 드문 경우가 아니면 쓰지 말라'고 안내합니다.
    sources:
      - name: NOAA NCEI — GPCP Monthly CDR Version 3.3 (C01725)
        url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01725
      - name: NOAA NCEI — GPCP Daily CDR Version 3.3 (C01726)
        url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01726
      - name: GES DISC — GPCP V3.3 Release Notes
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/MEaSUREs/GPCP/Release_Notes.GPCPV3.3.pdf
      - name: NCEI GPCP Monthly CDR V2.3 알고리즘 설명서 (CDRP-ATBD-0848)
        url: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Precipitation_GPCP-Monthly/AlgorithmDescription_01B-34.pdf
      - name: Huffman et al. (2023), The New Version 3.2 GPCP Monthly and Daily Precipitation Products, J. Climate
        url: https://doi.org/10.1175/JCLI-D-23-0123.1

period:
  start: "1983-01"
  end: present
  note: >-
    V3.3 월자료는 1983-01, 일자료는 1998-01부터이며, 2026-10-12 확인 시 GES DISC에 둘 다 2025-12까지 있습니다(2026-05-01 추가).
    V2.3 월자료(1979-01부터)는 2026-09 예비본까지, 일별 V1.3(1996-10부터)은 2026-07까지 NOAA에 올라와 있습니다.
    V3.3 일자료의 2025년 10~12월은 IMERG Final 생산 종료로 IMERG V07 Late를 써서 만들었습니다.

resolution:
  spatial_short: "56 km (0.5°)"
  temporal_short: "1일"
  spatial: "V3.3: 0.5°×0.5° 전지구 위경도 격자(720×360, 격자 중심값) / V2.3 월: 2.5° 격자(144×72, 첫 격자 중심 88.75°N·1.25°E) / 일별 V1.3: 1°×1°"
  vertical: 지표 강수 단일층
  temporal: 월(V3.3 1983–, V2.3 1979–) / 일(V3.3 1998–, V1.3 1996-10–)

coverage:
  short: 전지구
update: V3.3은 몇 달 단위 비정기 갱신(목표는 분기별) / V2.3 월자료는 매월(예비본 약 10일 지연)
