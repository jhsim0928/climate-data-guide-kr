notices:
  - date: "2026-07-04"
    level: info
    title: ESA CryoSat Ice Baseline-F 오프라인 처리기 운영 시작
    body: >-
      ESA가 CryoSat Ice Level 1·Level 2 오프라인 처리기를 Baseline-F로 올렸습니다. Level 2에 해빙 프리보드·두께 변수가 새로 들어갔고
      조석 모델(FES2022b)과 지오이드(EGM2008)가 바뀌었습니다. AWI v2.6은 Baseline-E L1B를 쓰므로 당장 값이 바뀌지는 않지만,
      ESA 공식 L2 두께와 AWI 두께를 비교할 때 기준 버전을 확인하세요. 준실시간 Baseline-F 처리기는 아직 공개 전입니다.
    source: https://earth.esa.int/eogateway/instruments/siral/processor-releases
  - date: "2025-10-09"
    level: info
    title: AWI v2.6 준실시간 자료 2025/26 겨울 생산 시작 (CryoSat-2·Sentinel-3A/B)
    body: 2025/26 겨울철 북극 준실시간 산출물 생산이 시작되었습니다. 버전은 v2.6으로 이전 겨울과 같습니다.
    source: https://spaces.awi.de/spaces/SIRAL/pages/185827416/Sea+Ice+Thickness+from+Satellite+Radar+Altimetry
  - date: "2023-10-05"
    level: warning
    title: AWI CryoSat-2 v2.6 운영 시작 — 이전 버전 자료 보관 처리
    body: >-
      v2.6부터 전체 기록에 CryoSat-2 Baseline-E L1B를 쓰고, OSI SAF/C3S v3 해빙 유형 자료로 10월 초 해빙 유형 정보를 개선했습니다.
      준실시간 지연은 36시간에서 48시간으로 늘었습니다. 이전 버전 자료는 보관 처리되었으며 필요하면 info[at]meereisportal.de로 문의해야 합니다.
    source: https://spaces.awi.de/display/SIRAL/Version+History

