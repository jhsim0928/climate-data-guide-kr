        }
  acknowledgement: >-
    편이보정 팩트시트는 ISIMIP3b 편이보정 기후 입력자료를 쓰면 Lange (2019)·Lange (2021)(방법)와 Cucchi et al. (2020)·Lange et al. (2021)(W5E5)을 인용하도록 요청합니다.
    ISIMIP 공개자료 이용 약관은 관련 DOI 인용과 이용 사실 알림(info@isimip.org)을 요청하고, 입력자료·영향모델 출력을 함께 쓴 경우의 사사 예문
    ("For their roles in producing, coordinating, and making available the ISIMIP input data and impact model output, we acknowledge …")을 제시합니다.
    원 GCM은 CMIP6 자료이므로 CMIP6 모델 출력 인용도 함께 검토하세요.

notices:
  - date: "2026-08-28"
    level: info
    title: CMIP7 기반 ISIMIP4b 시작 — 첫 입력자료 공개
    body: >-
      CMIP7 ScenarioMIP의 첫 EC-Earth 시뮬레이션을 바탕으로 한 ISIMIP4b 첫 입력자료 묶음(picontrol, historical, High·Very Low 시나리오)이 공개되었습니다.
      UKESM 등 다른 GCM은 가능한 한 빨리 추가될 예정이며, AR7 제출 마감(2027년 5월 예상)을 목표로 하고 있습니다.
    source: https://www.isimip.org/news/isimip4b-kicked-off
  - date: "2022-01-10"
    level: info
    title: 2차(secondary) 기후 입력자료 공개
    body: >-
      1차 GCM 5개의 추가 실험(hist-nat, ssp119, ssp245, ssp460)과 2차 GCM 5개(CNRM-CM6-1, CNRM-ESM2-1, CanESM5, EC-Earth3, MIROC6)의 편이보정 자료가
      공개되었습니다(DOI 10.48364/ISIMIP.581124). 프로토콜에 포함되지 않은 자료이므로 프로토콜 실험을 먼저 수행해 달라고 안내합니다.
    source: https://www.isimip.org/newsletter/isimip3b-secondary-climate-input-data-now-available
  - date: "2021-05-17"
    level: critical
    title: ISIMIP3b 편이보정 기후 입력자료 전면 교체 (ISIMIP3BASD v2.5.0, W5E5 v2.0)
    body: >-
      ISIMIP3b 편이보정 기후 입력자료가 완전히 교체되었습니다. 편이보정 코드가 ISIMIP3BASD v2.4.1에서 v2.5.0으로, 기준자료가 W5E5 v1.0에서 v2.0으로 바뀌었습니다.
      새 ISIMIP3b 시뮬레이션은 반드시 새 자료를 써야 하며, 옛 자료로 한 시뮬레이션을 다시 해야 하는지는 당시 결정되지 않았습니다.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3-replaced-bias-adjusted-climate-input-data
  - date: "2021-04-19"
    level: critical
    title: 문제 있는 ISIMIP3 기후 입력자료 철회
    body: >-
      ISIMIP3b 편이보정 기후 입력자료(와 ISIMIP3a 관측 기반 입력자료)의 문제 있는 판이 ESGF·ISIMIP 서버에서 철회되었습니다. 더 이상 쓰지 말고 새 판을 기다리도록 안내했습니다.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3-climate-input-data-retracted-isimip-servers
  - date: "2021-02-18"
    level: warning
    title: 편이보정 기후 입력자료에서 불연속 발견
    body: ISIMIP3b 편이보정 기후 입력자료의 통계가 매달 경계마다 불연속인 것으로 확인되었습니다. 편이보정을 달력 월 단위로 따로 적용했기 때문입니다.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3b-discontinuities-found-bias-adjusted-climate-input-data
  - date: "2020-06-19"
    level: warning
    title: ISIMIP3BASD v2.3.1 결함으로 편이보정 자료 교체
    body: >-
      ISIMIP3BASD v2.3.1의 결함으로 ps·rlds·tas를 뺀 모든 변수(특히 강수)의 편이보정이 잘못되어, v2.4.1로 다시 보정한 자료로 2020-06-19 교체했습니다.
      모든 기후모델과 시나리오가 영향을 받았습니다.
    source: https://www.isimip.org/gettingstarted/input-data-changelog/isimip3b-bias-adjusted-gcm-data-replaced/

