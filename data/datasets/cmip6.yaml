# ─────────────────────────────────────────────────────────────
# CMIP6 — 데이터셋 정보 파일
# WCRP 결합모델 상호비교 프로젝트 6단계 (DECK + historical + CMIP6 승인 MIP)
# ─────────────────────────────────────────────────────────────
id: cmip6
name: CMIP6
full_name: Coupled Model Intercomparison Project Phase 6 (WCRP 결합모델 상호비교 프로젝트 6단계)
category: model_output
domain: model
group: 전지구 모델 실험
order: 20
domains: [대기, 해양, 해빙, 육지]
provider: WCRP CMIP (WGCM 조정) · 참여 모델링 센터 · ESGF(지구시스템 그리드 연합)

status: deprecated
status_note: >-
  2026-10-16 확인 시 CMIP6 자료는 모두 그대로 받을 수 있으며, 지금도 가장 많은 모델이 모인 다중모델 기후모델 자료입니다(삭제 예정 없음).
  다만 ESGF의 CMIP6 프로젝트는 2025-04-07부터 새 자료 게시를 받지 않고, 후속 단계인 CMIP7 자료가 2026-09-04부터 ESGF에 올라오기 시작해
  '대체 예정'으로 표시했습니다. ESGF 검색 체계도 새 색인으로 옮겨 가는 중이라 검색 경로·도구 설정이 바뀌고 있으니 아래 공지와 팁을 확인하세요.

transitions:
  - from: CMIP6
    to: CMIP7
    to_id: cmip7
    status: planned
    date: "2026-09"
    summary: >-
      CMIP7 자료가 2026-09-04부터 ESGF에 공개되기 시작했지만(발표 당시 모델 5개·기관 3곳·실험 7개, 2026-10-16 STAC 색인 집계 모델 8개·기관 5곳·실험 24개), 아직 초기 단계라 다중모델 분석의 중심은 당분간 CMIP6입니다.
      실험 설계·시나리오·변수 이름·파일 이름 규칙이 모두 바뀌었으므로 두 자료를 한 앙상블로 섞지 말고 따로 다루세요.
    changes:
      - aspect: 실험 설계
        before: DECK + CMIP historical + CMIP6 승인 MIP 23개
        after: 확장된 DECK(historical·esm-hist·piClim-control·piClim-anthro·piClim-4xCO2 추가) + Assessment Fast Track 우선 실험 58개
      - aspect: historical 기간
        before: 1850–2014
        after: 1850-01-01 ~ 2021-12-31 (172년)
      - aspect: 미래 시나리오
        before: SSP 시나리오(ssp119·ssp126·ssp245·ssp370·ssp585 등), 2015–2100, 일부 연장
        after: 새 ScenarioMIP 시나리오(scen7-h·hl·m·ml·l·ln·vl, 배출 구동 esm-scen7-*), 2022-01-01 ~ 2100-12-31, 연장(-ext)은 최대 2500년
      - aspect: 데이터 요청(Data Request)
        before: DR6 — 실험 322개에 변수 약 2,063개, 빈도는 MIP 테이블(Amon·day 등)로 지정
        after: DR7 v1.2.2.5 — 전체 규모는 DR6와 비슷, 모든 실험에 요청하는 핵심 변수(ESM-BCV) 135개, 활용 사례(Opportunities) 46개 단위로 정리
      - aspect: 변수 이름
        before: 테이블 + 변수 (예 Amon.tas)
        after: 브랜드 변수 + 빈도 + 지역 (예 atmos.tas.tavg-h2m-hxy-u.mon.glb) — 빈도가 변수 정의에서 분리됨
      - aspect: 파일 이름·디렉터리(DRS)
        before: <variable_id>_<table_id>_<source_id>_<experiment_id>_<member_id>_<grid_label>[_<기간>].nc
        after: <variable_id>_<branding_suffix>_<frequency>_<region>_<grid_label>_<source_id>_<experiment_id>_<variant_label>[_<기간>].nc (member_id 대신 variant_label)
      - aspect: 격자 표기(grid_label)
        before: gn(원본 격자)·gr(재격자)·gr1~gr9·gm(전지구 평균)
        after: 등록된 격자 번호 g<세 자리 수>(g100 이상, 예 g104)
      - aspect: 라이선스 표기
        before: 대부분 CC BY 4.0(일부 CC0), 모델별 라이선스 페이지가 파일 속성보다 우선
        after: 데이터셋마다 license_id 속성에 CC-BY-4.0 또는 CC0-1.0
      - aspect: 검색 색인
        before: ESGF Solr 색인 → 미국 노드는 Globus 기반 ESGF 1.5 색인
        after: ESGF 차세대(ESGF-NG) STAC 색인(discovery.east.esgf.io·discovery.west.esgf.io)
      - aspect: 메타데이터 규약
        before: CF-1.7 CMIP-6.2
        after: CF-1.11~CF-1.13 (2026-10-16 STAC 색인 CMIP7 컬렉션 요약)
    impacts:
      - CMIP 평가 체계(REF)는 "두 앙상블은 직접 비교할 수 없다"며 CMIP6와 CMIP7 결과를 따로 보여 줍니다. 두 세대 모델을 한 앙상블 평균·범위에 섞지 마세요.
      - historical 종료 연도(2014 대 2021)와 시나리오(SSP 대 scen7-*)가 달라 미래 변화량의 기준 기간과 시나리오를 그대로 맞대어 비교할 수 없습니다.
      - intake-esgf v2026.9.4부터 기본 프로젝트가 CMIP7입니다. 예전 CMIP6 스크립트에는 project="CMIP6"을 꼭 넣으세요.
      - 테이블(Amon 등)·member_id·gn/gr를 전제로 한 파일 이름 해석·디렉터리 탐색 코드는 CMIP7에서 고쳐야 합니다.
