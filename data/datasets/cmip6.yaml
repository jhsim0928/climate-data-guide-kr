notices:
  - date: "2026-09-28"
    level: warning
    title: CMIP6 STAC 색인 게시 오류 — 일부 member_id 잘못 표시
    body: >-
      intake-esgf v2026.9.28에 'CMIP6 STAC 게시 오류' 경고가 추가되었습니다. intake-esgf 문서에 따르면 CMIP6를 새 STAC 색인에 다시 올리는 과정의 오류로
      일부 항목의 member_id 앞에 sub_experiment_id가 붙어 있고(예 s2000-r1i1p1f1, 원래 r1i1p1f1), 해결될 때까지 CMIP6 검색에서는 STAC 색인을 끄라고 권합니다.
    source: https://github.com/esgf2-us/intake-esgf/releases/tag/v2026.9.28
  - date: "2026-09-04"
    level: info
    title: 첫 CMIP7 자료 ESGF 공개
    body: >-
      CMIP7 데이터셋이 ESGF에 공개되기 시작했습니다. 발표 시점에는 모델링 센터 3곳의 모델 5개, 실험 7개 자료이며 앞으로 수개월에 걸쳐 더 추가될 예정입니다.
    source: https://wcrp-cmip.github.io/cmip7-guidance/docs/Updates_for_Users/
  - date: "2026-09-04"
    level: warning
    title: intake-esgf 기본 프로젝트가 CMIP7로 변경 — CMIP6 스크립트에 project="CMIP6" 필요
    body: >-
      intake-esgf v2026.9.4부터 기본 프로젝트(default_project)가 CMIP7로 바뀌고, 기본 색인에 Globus 기반 ESGF 1.5 색인(CMIP3~6)과 CMIP7용 East·West STAC 색인이 들어갔습니다.
      검색에 project="CMIP6"을 넣으면 예전 동작이 유지됩니다. 설정을 저장해 둔 사용자는 설정을 초기화해야 할 수 있습니다.
    source: https://github.com/esgf2-us/intake-esgf/releases/tag/v2026.9.4
  - date: "2025-07-29"
    level: warning
    title: LLNL ESGF 노드 종료 — 노드별 검색 결과 차이 주의
    body: >-
      LLNL ESGF 노드가 종료되었습니다. ESGF는 두 검색 체계가 함께 돌아가는 과도기에 있어 일부 서비스가 동작하지 않을 수 있고,
      미국 노드(ORNL 등, Globus 색인)와 DKRZ·IPSL·CEDA(옛 Solr 색인)의 검색 결과가 서로 다를 수 있습니다.
    source: https://wcrp-cmip.org/esgf-information/
  - date: "2025-04-07"
    level: warning
    title: ESGF CMIP6 프로젝트 신규 게시 종료
    body: >-
      CMIP7 기반 시설에 자원을 돌리기 위해 ESGF의 CMIP6 프로젝트가 새 자료 게시를 받지 않게 되었습니다. CMIP6 자료는 모두 계속 제공되며,
      CMIP6Plus·obs4MIPs·input4MIPs 등은 영향을 받지 않습니다. DECK와 비슷한 실험의 새 자료는 CMIP6Plus로 게시할 수 있습니다.
    source: https://wcrp-cmip.org/esgf-information/
  - date: "2022-10-12"
    level: info
    title: 모든 CMIP6 모델 출력 라이선스 완화 (CC BY 4.0)
    body: >-
      이용 약관 6.2판에서 2022년 10월 기준 모든 CMIP6 모델 그룹이 출력 자료의 라이선스를 완화했다고 밝혔습니다. 이전의 CC BY-NC-SA·CC BY-SA 제한이 풀렸고,
      현재 라이선스는 CMIP6 라이선스 페이지가 파일의 license 속성보다 우선합니다.
    source: https://pcmdi.llnl.gov/CMIP6/TermsOfUse/TermsOfUse6-2.html

