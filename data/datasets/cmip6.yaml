period:
  start: "1850-01"
  end: "2100-12"
  note: >-
    대표 실험 기준입니다. historical은 1850~2014년, ScenarioMIP의 SSP 시나리오(ssp119·ssp126·ssp245·ssp370·ssp585 등)는 2015~2100년이며
    일부 모델은 2300년(드물게 2500년)까지 연장했습니다. 다른 실험은 기간이 다릅니다 — 예를 들어 amip은 1979~2014년, DAMIP의 hist-nat·hist-GHG는
    1850~2020년이고, piControl·1pctCO2·abrupt-4xCO2 같은 이상화 실험은 실제 연도가 아닌 모델 연도입니다(CMIP6_CVs 실험 목록, ESGF 색인 확인).

resolution:
  spatial_short: "모델마다 다름"
  temporal_short: "1시간 미만"
  spatial: >-
    모델마다 다름. 파일 전역 속성 nominal_resolution(CMIP6 CV 값 0.5 km~10000 km, 1x1 degree)이 대략적인 격자 간격을 나타내며,
    2026-10-16 ORNL 색인에서 historical·Amon·tas 최신 데이터셋은 250 km 1,198개, 100 km 630개, 500 km 535개, 10000 km 3개, 50 km 2개였습니다.
    grid_label은 gn = 모델 원본(native) 격자, gr = 제공 기관이 고른 대상 격자로 재격자화한 자료, gr1~gr9 = 그 밖의 재격자, gm = 전지구 평균입니다
    (CMIP6_CVs grid_label). 해양·해빙 변수는 대개 모델 원본의 곡선 격자(gn, 예 ORCA1)로 제공됩니다.
  vertical: >-
    변수(테이블)마다 다름 — Amon의 3차원 대기 변수는 기압면 19층(plev19), day 테이블의 3차원 변수는 기압면 8층(plev8)이며(CMOR 표),
    일부 테이블은 plev3·plev27이나 모델층(alevel)을 씁니다. 해양 3차원 변수는 모델 연직층(lev, 단위 m)입니다. 근지표 변수는 2 m(height2m)·10 m(height10m)입니다.
  temporal: >-
    빈도(frequency)는 CMIP6_CVs의 16가지 — subhrPt(1시간 미만 순간 샘플), 1hr·1hrPt·1hrCM, 3hr·3hrPt, 6hr·6hrPt, day, mon·monPt·monC, yr·yrPt, dec, fx(고정장).
    이름 끝에 Pt가 붙은 빈도는 순간 샘플, 붙지 않은 빈도는 그 간격의 평균입니다. 자료 대부분은 월(mon)·일(day) 평균이며,
    1시간 미만 자료는 CFsubhr·Esubhr 테이블의 일부 변수(지점·격자 순간값)뿐입니다.

coverage:
  short: 전지구
  note: >-
    대부분 전지구 격자 자료입니다. 일부 테이블은 영역이 다릅니다 — 빙상 테이블(ImonAnt·ImonGre 등)은 남극·그린란드만, CFsubhr 등의 일부 변수는
    선택된 지점(site)만, EmonZ·EdayZ 등은 동서 평균(위도-고도 단면) 자료입니다.
update: 신규 게시 종료 (2025-04-07부터 ESGF CMIP6 프로젝트에 새 자료 게시를 받지 않음). 이미 게시된 자료는 계속 제공
license: >-
  CMIP6 이용 약관(Terms of Use 6.2, 2022-10-12) 기준 CC BY 4.0입니다. 2022년 10월 모든 모델 그룹이 이전의 CC BY-NC-SA·CC BY-SA 제한을 풀었고,
  모델별 현재 라이선스는 CMIP6 라이선스 표(132개 중 CC BY 4.0 125개, CC0 6개)에서 확인합니다. 이 표가 NetCDF 파일의 license 전역 속성보다 우선합니다.
  인용(데이터 인용 지침), 사사 문장, 사용한 모델·기관 표가 요구됩니다.
account_required: false

summary: >-
  CMIP6는 세계기후연구프로그램(WCRP) 결합모델작업반(WGCM)이 조정한 결합모델 상호비교 프로젝트 6단계로, 전 세계 모델링 센터가 같은 실험 설계로 돌린
  기후모델 출력을 ESGF를 통해 공개한 자료입니다. 모든 모델이 수행하는 기본 실험(DECK)과 historical, 그리고 23개 CMIP6 승인 MIP(ScenarioMIP·DAMIP 등)
  실험으로 이루어지며, IPCC 6차 평가보고서(AR6)의 바탕이 되었습니다. 미래 기후 전망, 원인 규명(탐지·귀속), 모델 평가,
  지역 다운스케일링·편이보정의 입력 자료로 가장 널리 쓰입니다.

time_convention:
  summary: >-
    변수마다 시간 처리 방식이 cell_methods 속성에 적혀 있습니다. Amon·day 같은 평균 테이블의 변수는 time_bnds로 표시된 구간(한 달·하루)의 평균("time: mean")이고,
    tasmax·tasmin은 하루 최댓값·최솟값, 빈도 이름에 Pt가 붙은 3hrPt·6hrPt·1hrPt·subhrPt 테이블 변수는 그 시각의 순간 샘플("time: point")입니다.
  points:
    - "평균 변수의 time 값은 time_bnds 구간 안의 한 시각일 뿐 그 시각의 값이 아닙니다. 예: EC-Earth3 historical Amon 파일은 time이 time_bnds의 가운데(월 중앙)에 있지만, CF 규약은 '구간 안 또는 끝'만 요구하므로 모델마다 위치가 다를 수 있습니다. 월·일을 가를 때는 time_bnds를 기준으로 하세요"
    - "Amon의 tasmax·tasmin은 cell_methods가 \"time: maximum within days time: mean over days\"(최솟값은 minimum)로, 하루 최고·최저기온을 한 달 동안 평균한 값입니다. day 테이블의 tasmax·tasmin은 하루 최댓값·최솟값 자체입니다"
    - "같은 변수 이름도 테이블에 따라 의미가 다릅니다 — 3hr 테이블의 pr은 3시간 평균, tas·uas·vas·huss는 3hrPt(순간값, 좌표 이름 time1)입니다. 테이블(table_id)·frequency를 함께 확인하세요"
    - "강수 pr은 누적량이 아니라 평균 플럭스(kg m-2 s-1)입니다. 일 강수량(mm/일)은 86400을 곱해 구합니다"
    - "time의 calendar 속성(proleptic_gregorian·standard·noleap·360_day 등)이 모델마다 다릅니다. ESGF 색인의 SSP585 월자료 시작 시각만 봐도 2015-01-16T12, 2015-01-16T00, 2015-01-15T12 등으로 제각각입니다"
  source: https://cfconventions.org/cf-conventions/cf-conventions.html#cell-methods
  source_name: CF Conventions 7장(셀 경계·cell_methods·기후 통계) + CMIP6 CMOR 표(github.com/PCMDI/cmip6-cmor-tables)

variables:
  note: >-
    CMIP6 CMOR 표(PCMDI/cmip6-cmor-tables, data_specs_version 01.00.33)와 ORNL ESGF 색인·실제 파일 속성으로 단위와 cell_methods를 확인한 핵심 변수입니다.
    변수명은 CMOR 이름(파일 속 변수명)이며, 같은 변수가 여러 테이블(빈도)에 있으니 검색할 때 table_id를 함께 지정하세요.
    모든 모델이 모든 변수를 낸 것은 아닙니다. 전체 목록은 CMOR 표와 CMIP6 Data Request에서 볼 수 있습니다.
  full_list: https://github.com/PCMDI/cmip6-cmor-tables/tree/main/Tables
  groups:
    - name: 월평균 대기 — 지표·단일면 (Amon)
      kind: mean
      period: 월
      items:
        - "근지표(2 m) 기온 — `tas` (K)"
        - text: "일 최고기온의 월평균 — `tasmax` (K)"
          kind: max
          period: 일 최고값의 월평균
          note: 'cell_methods "area: mean time: maximum within days time: mean over days"'
        - text: "일 최저기온의 월평균 — `tasmin` (K)"
          kind: min
          period: 일 최저값의 월평균
          note: 'cell_methods "area: mean time: minimum within days time: mean over days"'
        - "강수량 — `pr` (kg m-2 s-1)"
        - "해면기압 — `psl` (Pa)"
        - "근지표(2 m) 비습 — `huss` (1)"
        - "근지표(2 m) 상대습도 — `hurs` (%)"
        - "근지표(10 m) 동서 바람 — `uas` (m s-1)"
        - "근지표(10 m) 남북 바람 — `vas` (m s-1)"
        - "지표 하향 단파복사 — `rsds` (W m-2)"
        - "지표 하향 장파복사 — `rlds` (W m-2)"
        - "전운량 — `clt` (%)"
    - name: 월평균 대기 — 기압면 19층 (Amon, plev19)
      kind: mean
      period: 월
      items:
        - "기온 — `ta` (K)"
        - "동서풍 — `ua` (m s-1)"
        - "남북풍 — `va` (m s-1)"
        - "지위고도 — `zg` (m)"
        - "비습 — `hus` (1)"
    - name: 일 대기 (day)
      kind: mean
      period: 일
      items:
        - "일평균 근지표(2 m) 기온 — `tas` (K)"
        - text: "일 최고기온 — `tasmax` (K)"
          kind: max
          note: 'cell_methods "area: mean time: maximum"'
        - text: "일 최저기온 — `tasmin` (K)"
          kind: min
          note: 'cell_methods "area: mean time: minimum"'
        - "일 강수량 — `pr` (kg m-2 s-1)"
        - "해면기압 — `psl` (Pa)"
        - "근지표(2 m) 비습 — `huss` (1)"
        - "근지표(10 m) 풍속 — `sfcWind` (m s-1)"
        - "근지표(10 m) 동서 바람 — `uas` (m s-1)"
        - "근지표(10 m) 남북 바람 — `vas` (m s-1)"
        - "지표 하향 단파복사 — `rsds` (W m-2)"
    - name: 월평균 해양 (Omon)
      kind: mean
      period: 월
      items:
        - "해수면온도 — `tos` (degC)"
        - text: "해면 염분 — `sos` (0.001)"
          note: 소수의 오래된 파일은 단위가 psu로 적혀 있습니다(ORNL 색인).
        - "해수면 높이(지오이드 기준) — `zos` (m)"
        - "해수 잠재수온 — `thetao` (degC)"
        - "해수 염분 — `so` (0.001)"
    - name: 월평균 해빙 (SImon)
      kind: mean
      period: 월
      items:
        - "해빙 면적 비율(해양 격자) — `siconc` (%)"
        - text: "해빙 두께 — `sithick` (m)"
          note: >-
            격자 평균이 아니라 해빙이 덮인 부분만 평균한 실제(floe) 두께입니다(cell_methods "area: time: mean where sea_ice"). CMIP5처럼 부피를 격자 면적으로 나눈 값이 아닙니다.
        - "단위 면적당 해빙 질량 — `simass` (kg m-2)"
    - name: 고정장 (fx·Ofx)
      kind: static
      items:
        - text: "대기 격자 면적 — `areacella` (m2)"
          note: '대기 격자 변수의 면적 가중 평균에 씁니다(cell_methods "area: sum").'
        - "육지 비율(호수 포함) — `sftlf` (%)"
        - "지표 고도 — `orog` (m)"
        - text: "해양 격자 면적 — `areacello` (m2)"
          note: 해양·해빙 변수(Omon·SImon)의 면적 가중에 씁니다.
        - "해양 비율 — `sftof` (%)"
        - "해저 깊이 — `deptho` (m)"

access:
  - name: ESGF MetaGrid — ORNL (미국 Globus 색인)
    url: https://esgf-node.ornl.gov/search
    login: false
    method: 웹 검색 → HTTP 다운로드·wget 스크립트·Globus
    note: >-
      CMIP6 자료는 이용 제한 없이 공개되어 있어 로그인 없이 파일을 받을 수 있습니다(Globus 전송만 무료 Globus 계정 필요).
      WCRP는 DKRZ·CEDA·NCI·IPSL의 검색 화면도 안내하지만, 과도기에는 유럽 노드(옛 Solr 색인)와 미국 노드(Globus 색인)의 검색 결과가 다를 수 있습니다.
  - name: intake-esgf (Python)
    url: https://intake-esgf.readthedocs.io/en/latest/
    login: false
    method: Python 패키지 (검색 → 내려받아 xarray로 열기, 면적 정보 자동 포함)
    note: >-
      2026-09 이후 기본 프로젝트가 CMIP7이므로 search()에 project="CMIP6"을 넣어야 합니다. CMIP6를 STAC 색인에 다시 올리는 과정의 오류로
      일부 member_id가 잘못 표시되니, 문서 권고대로 CMIP6 검색 때는 STAC 색인을 끄세요(아래 예시).
  - name: ORNL ESGF 1.5 색인 검색 API (Solr 호환)
    url: https://esgf-node.ornl.gov/esgf-1-5-bridge
    login: false
    method: REST 검색 API (project·experiment_id·table_id·variable_id 등 조건 → 파일별 HTTPS·OPeNDAP·Globus 주소)
    note: 예전 ESGF Solr 검색 API와 같은 형식의 응답을 돌려줍니다. latest=true로 최신 버전만 골라 보세요.
  - name: Copernicus Climate Data Store — CMIP6 climate projections
    url: https://cds.climate.copernicus.eu/datasets/projections-cmip6
    login: true
    method: 웹 양식·CDS API (영역·기간 잘라 받기, NetCDF4 CF-1.7)
    note: >-
      historical(1850–2014)과 SSP(2015–2100)의 일·월 자료 중 주요 변수 46개만 제공합니다. 요청하면 자료가 있는 ESGF 노드에서 잘라 보내 줍니다.
      CDS 계정과 데이터셋 이용 약관 동의가 필요합니다.
  - name: Pangeo/ESGF 클라우드 사본 — Google Cloud (gs://cmip6)·AWS (s3://cmip6-pds)
    url: https://pangeo-data.github.io/pangeo-cmip6-cloud/
    login: false
    method: 클라우드 Zarr (카탈로그 https://storage.googleapis.com/cmip6/pangeo-cmip6.json, intake-esm으로 열기)
    note: >-
      일부 핵심 CMIP6 자료를 Zarr로 바꿔 둔 사본입니다. 문서에 따르면 AWS 사본은 복사 과정이 고장 나 Google Cloud 사본과 다를 수 있고,
      새 버전(Pangeo-ESGF CMIP6 Zarr Data 2.0, leap-stc/cmip6-leap-feedstock)이 시험 중입니다. -noQC 카탈로그에는 정오표 상태가 함께 들어 있습니다.
  - name: AWS Open Data — CMIP6 (Zarr cmip6-pds, NetCDF esgf-world)
    url: https://registry.opendata.aws/cmip6/
    login: false
    method: S3 (--no-sign-request), Zarr(us-west-2)·원본 NetCDF(us-east-2)
    note: ESGF·Pangeo가 관리합니다. NetCDF 사본 목록은 https://cmip6-nc.s3.amazonaws.com/esgf-world.csv.gz 에 있습니다.

example:
  lang: python
  note: >-
    intake-esgf 문서의 ESGFCatalog 검색 방식입니다. 기본 프로젝트가 CMIP7로 바뀌었으므로 project="CMIP6"을 넣고,
    문서 권고에 따라 CMIP6 검색 동안 STAC 색인을 끕니다(기본 Globus 색인으로 검색).
  code: |
    # pip install intake-esgf
    import intake_esgf
    from intake_esgf import ESGFCatalog

    stac_off = {"discovery.west.esgf.io": False, "discovery.east.esgf.io": False}
    with intake_esgf.conf.set(indices=stac_off):
        cat = ESGFCatalog()
        cat.search(
            project="CMIP6",
            experiment_id="historical",
            source_id="CanESM5",
            member_id="r1i1p1f1",
            table_id="Amon",
            variable_id="tas",
        )
        print(cat)                    # 검색된 데이터셋 확인
        dsd = cat.to_dataset_dict()   # 로컬 캐시에 받은 뒤 xarray Dataset 딕셔너리로 반환

    ds = dsd["tas"]
    print(ds["tas"].attrs.get("cell_methods"), ds.time.encoding.get("calendar"))

tips:
  - >-
    한 변수도 모델·실험·멤버·격자·버전·시간 구간별로 여러 파일로 나뉘어 받아집니다. 파일 이름은
    <variable_id>_<table_id>_<source_id>_<experiment_id>_<member_id>_<grid_label>_<기간>.nc 형식(예 tas_Amon_EC-Earth3_historical_r1i1p1f1_gr_188201-188212.nc,
    1년 단위 파일)이고, 디렉터리에 버전(vYYYYMMDD)이 들어갑니다. 여러 모델·멤버를 한꺼번에 받고 합치는 방법과 가용성 표는 이 사이트의
    '모델 자료 받기' 페이지(/model-data/)를 참고하세요.
  - >-
    모델마다 달력이 다릅니다(proleptic_gregorian·standard·noleap·360_day 등). xarray로 열 때 cftime으로 디코딩하고, 월·연 평균은 time_bnds 길이로
    가중하세요. 360_day 모델은 2월 30일이 있고 noleap 모델은 2월 29일이 없습니다.
  - >-
    멤버 이름 r<k>i<l>p<m>f<n>은 실현(realization)·초기화·물리·강제력 번호입니다. f2처럼 f 번호가 다르면 강제력 설정이 다른 실험이고
    (예: 2026-10-16 ORNL 색인에서 UKESM1-0-LL historical은 r1i1p1f1 없이 f2·f3 멤버만 있음), 그 차이가 variant_info 속성에 잘 적혀 있지 않을 수 있으니 ES-DOC 문서를 확인하세요.
    DCPP 예측 실험은 member_id가 s1960-r1i1p1f1처럼 sub_experiment_id(초기화 연도)가 앞에 붙습니다.
  - >-
    gn은 모델 원본 격자, gr은 재격자 자료입니다. 같은 모델·변수가 gn과 gr로 함께 있을 수 있으니 하나만 고르고,
    면적 평균에는 cos(위도) 대신 같은 모델·격자의 areacella(대기)·areacello(해양) 고정장을 쓰세요. 여러 모델을 공통 격자로 맞출 때는
    보존적 보간(예 xESMF conservative)을 쓰고, 해양 곡선 격자는 경계 좌표가 필요합니다.
  - >-
    오류가 확인되면 기존 데이터셋이 철회(retracted)되고 새 버전으로 다시 올라옵니다. 분석 전에 최신 버전(latest)인지와
    ESGF 정오표(errata.esgf.io)를 확인하고, 논문에는 사용한 데이터셋 버전(없으면 내려받은 날짜)을 적으세요.
  - >-
    ESGF가 옛 Solr 색인을 퇴역시키고 새 STAC 색인으로 옮기는 중입니다. 과도기에는 노드마다 검색 결과가 다를 수 있고, STAC 색인의 일부 CMIP6 항목은
    member_id 앞에 sub_experiment_id가 잘못 붙어 있습니다(예 s2000-r1i1p1f1, 실제는 r1i1p1f1). 예전 Solr 주소(esgf-node.llnl.gov 등)를 쓰던 스크립트는
    LLNL 노드 종료(2025-07-29)로 동작하지 않을 수 있습니다.
  - >-
    파일 안의 license 속성이 옛 값(예 CC BY-SA 4.0)으로 남아 있는 경우가 있습니다. 이용 약관은 CMIP6 라이선스 표가 파일 속성보다 우선한다고 밝히므로
    현재 라이선스는 그 표에서 확인하세요.
  - >-
    CMIP6와 CMIP7을 한 앙상블로 섞지 마세요. historical 종료 연도·시나리오·강제력이 다르고, CMIP 평가 체계(REF)도 두 앙상블을 따로 보여 줍니다.
    intake-esgf 등 도구의 기본값이 CMIP7로 바뀌었으니 CMIP6 검색에는 project="CMIP6"을 명시하세요.

citations:
  dataset:
    - label: CMIP6 모델 출력 데이터 인용 (필수)
      text: >-
        CMIP6 데이터 인용 지침에 따라 사용한 모델 출력을 모델·실험 단위(세밀) 또는 모델·MIP 단위(대략)로 인용하고, 데이터셋 버전(없으면 내려받은 날짜)을 넣습니다.
        WDC-Climate(DKRZ) 인용 서비스에서 데이터셋별 인용문과 DOI를 찾을 수 있습니다.
        예: EC-Earth Consortium (EC-Earth) (2019). EC-Earth-Consortium EC-Earth3 model output prepared for CMIP6 CMIP historical.
        Version YYYYMMDD. Earth System Grid Federation. https://doi.org/10.22033/ESGF/CMIP6.4700
