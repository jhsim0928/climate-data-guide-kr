# ─────────────────────────────────────────────────────────────
# JRA-55 — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: jra55
name: JRA-55
full_name: Japanese 55-year Reanalysis (일본 기상청 55년 재분석)
category: reanalysis
domains: [대기, 육지]
provider: 일본 기상청 (JMA)

status: ended
status_note: >-
  준실시간 갱신이 2024년 1월 말로 종료되었습니다. 1958년~2024년 1월 자료는 계속 받을 수 있지만
  더 이상 기간이 늘어나지 않습니다. 최근 기간이 필요하거나 새로 연구를 시작한다면 후속 자료인 JRA-3Q를 검토하세요.

successor:
  name: JRA-3Q
  url: https://gdex.ucar.edu/datasets/d640000/
  note: >-
    기간 1947년 9월~현재(월 단위 갱신), 모델 해상도 TL479(약 40 km)·100층.
    라이선스가 CC BY-NC-SA 4.0(비상업)이라는 점이 JRA-55와 다릅니다.
    인용: Kosaka et al. (2024), J. Meteor. Soc. Japan, 102, 49–109, doi:10.2151/jmsj.2024-004

period:
  start: "1958-01"
  end: "2024-01"
  note: 준실시간 갱신 종료로 2024년 1월 31일 자료가 마지막입니다.

resolution:
  spatial: "모델 해상도 TL319(약 55 km) / 1.25° 위경도 격자 / 약 0.5625° 가우시안 격자"
  vertical: "모델면 60층 / 기압면 37층"
  temporal: 6시간 분석, 3시간 예보·진단 (월평균 별도 제공)

update: 종료 (2024년 1월 말)
license: CC BY 4.0 (NCAR GDEX 기준) + JMA 이용 조건
account_required: true

summary: >-
  일본 기상청(JMA)이 수행한 두 번째 장기 전지구 재분석입니다. 전지구 라디오존데 관측망이 갖춰진 1958년부터 시작하며,
  4D-Var 자료동화와 위성 복사휘도 변분 편향보정(VarBC)을 사용했습니다. 동아시아 연구에서 ERA5와 함께
  비교용으로 많이 쓰였습니다.

access:
  - name: NSF NCAR GDEX — 3시간·6시간 자료 (d628000)
    url: https://gdex.ucar.edu/datasets/d628000/
    method: 웹 다운로드 / 부분 추출·형식 변환 / THREDDS
    note: NCAR 계정 등록 필요. GRIB1 형식, 전체 약 91 TB이므로 필요한 변수·층만 골라 받으세요.
  - name: NSF NCAR GDEX — 월평균·분산 (d628001)
    url: https://gdex.ucar.edu/datasets/d628001/
    method: 웹 다운로드
  - name: DIAS (일본 데이터 통합·분석 시스템)
    url: https://diasjp.net/en/
    method: 웹 다운로드
    note: >-
      장기 점검 후 2026년 7~9월 공지로 일부 서비스만 재개된 상태입니다. JMA 페이지에는 여전히 접근 불가로 안내되어 있으니,
      DIAS에서 JRA-55 제공 여부를 먼저 확인하고 안 되면 NCAR을 이용하세요.

tips:
  - JMA 이용 조건에 따라, JRA-55를 사용한 논문·보고서 사본을 JMA(jra@met.kishou.go.jp)에 보내야 합니다.
  - "GDEX 데이터셋 페이지의 Publications 항목 중 JRA-55 논문 링크의 DOI가 JRA-25 논문(10.2151/jmsj.85.369)으로 표기되어 있습니다. JRA-55 논문의 올바른 DOI는 10.2151/jmsj.2015-001 입니다."
  - JRA-55와 JRA-3Q는 기후값과 추세가 다를 수 있으므로, 한 분석 안에서 두 자료를 이어 붙이지 마세요.

