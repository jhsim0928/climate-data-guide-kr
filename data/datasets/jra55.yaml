notices:
  - date: "2025-12-02"
    level: info
    title: JMA 재분석 홈페이지 주소 변경
    body: JRA 프로젝트 홈페이지가 jra.kishou.go.jp에서 www.data.jma.go.jp/jra/html/ 로 이전했습니다. 당분간 자동 연결됩니다.
    source: https://www.data.jma.go.jp/jra/html/JRA-55/index_en.html
  - date: "2024-01-31"
    level: critical
    title: 준실시간 갱신 종료 — JRA-55 프로젝트 종료
    body: >-
      2024년 1월 말로 JRA-55 준실시간 자료 갱신이 끝났습니다. 기존 자료는 협력 기관(NCAR 등)에서 계속 받을 수 있으며,
      후속 자료로 JRA-3Q 사용이 권고됩니다.
    source: https://www.data.jma.go.jp/jra/html/
  - date: "2023-12-05"
    level: warning
    title: 갱신 종료 예고 및 JRA-3Q 준실시간 자료 NCAR 제공 시작
    body: NCAR이 JRA-55 갱신 종료(2024년 1월 말)를 예고하고, JRA-3Q 준실시간 자료로 전환하라고 안내했습니다.
    source: https://gdex.ucar.edu/news/jra-55-will-be-discountinued-at-the-end-of-jan-2024/

