notices:
  - date: "2026-10-12"
    level: warning
    title: DIAS의 AphroTemp(기온 V1204R1) 내려받기 불가 표시
    body: >-
      확인 시점에 DIAS 데이터셋 페이지가 이 자료는 현재 DIAS에서 내려받을 수 없다고 표시하고, 최신 버전은 APHRODITE 누리집에 있다고 안내합니다.
      기온 자료는 히로사키대학 누리집의 V1808을 이용하세요.
    source: http://search.diasjp.net/en/dataset/AphroTemp
  - date: "2019-03"
    level: info
    title: V1901(00~24 UTC 하루 경계 보정판) 공개, APHRODITE-2 연구비 종료
    body: >-
      위성 강수(CMORPH)로 관측소의 하루 마감 시각을 00~24 UTC로 맞춘 몬순아시아 일강수 V1901(1998~2015년)과 0.05° 기후값이 공개되었습니다.
      누리집은 이후 APHRODITE-2 연구비가 끝나 문의 대응이 늦어질 수 있다고 알렸습니다. 공개 정확한 날짜는 누리집에 적혀 있지 않아 프로젝트 종료 시점(2019년 3월)으로 표기했습니다.
    source: http://aphrodite.st.hirosaki-u.ac.jp/index.html
  - date: "2018-10-05"
    level: info
    title: V1101EX → V1101EX_R1 교체 (인도·대만 문제 수정)
    body: V1101 알고리즘으로 2007~2015년을 연장한 V1101EX에서 인도·대만 지역 문제가 발견되어 고친 V1101EX_R1로 교체되었습니다. 2007년은 V1101과 겹칩니다.
    source: http://aphrodite.st.hirosaki-u.ac.jp/product_readme/V1101EX_R1_readme.html
  - date: "2018-09-27"
    level: info
    title: APHRODITE-2 자료 공개 — V1801_MA, V1101EX_R1, V1808_MA(기온), APHRO_JP V1207R3
    body: 새 알고리즘의 몬순아시아 일강수 V1801과 기온 V1808, 일본 자료 개정판이 공개되었고, 10월 9일부터 히로사키대학 APHRODITE-2 누리집에서 배포됩니다.
    source: https://www.chikyu.ac.jp/precip/english/

