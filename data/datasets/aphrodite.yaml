# ─────────────────────────────────────────────────────────────
# APHRODITE — 데이터셋 정보 파일
# 대기 탭(강수 자료). 2019년 V1901 이후 새 버전이 없어 '갱신 종료'로 분류했습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: aphrodite
name: APHRODITE
full_name: Asian Precipitation – Highly-Resolved Observational Data Integration Towards Evaluation of Water Resources (아시아 우량계 기반 일강수 격자 자료)
category: analysis
domain: atmosphere
group: 강수 자료
order: 30
domains: [대기, 육지]
provider: APHRODITE 프로젝트 — 일본 종합지구환경학연구소(RIHN, APHRODITE-1), 히로사키대학 야타가이 아키요 교수 연구팀(APHRODITE-2). 일부 버전은 DIAS(JAMSTEC)에서도 배포

status: ended
status_note: >-
  APHRODITE-2 프로젝트(2016년 6월~2019년 3월)의 연구비가 끝났고, 2019년 V1901(몬순아시아 일강수, 1998~2015년) 이후 새 버전이 나오지 않았습니다.
  자료는 히로사키대학 APHRODITE 누리집과 DIAS에서 계속 받을 수 있지만 2016년 이후 기간은 없습니다. 누리집은 질문을 받되 답변이 늦을 수 있다고 안내합니다.

successor:
  name: 없음
  url: http://aphrodite.st.hirosaki-u.ac.jp/
  note: >-
    공식 후속 자료는 발표되지 않았습니다. 2016년 이후가 필요하면 다른 우량계 기반 격자 강수나 위성 강수(예: IMERG)를 쓰되,
    APHRODITE와 한 시계열로 이어 붙이지 마세요.

period:
  start: "1951-01"
  end: "2015-12"
  note: >-
    V1101(몬순아시아·중동·러시아) 1951-01-01~2007-12-31, 같은 알고리즘의 연장판 V1101EX_R1 2007~2015년(2007년 중복),
    새 알고리즘 V1801_R1과 하루 경계를 00~24 UTC로 맞춘 V1901 1998~2015년. 기온 AphroTemp V1204R1은 1961~2007년이며,
    후속 기온 V1808(APHRO_TAVE_MA_V1808)의 기간은 NCAR Climate Data Guide 기준 1961~2015년입니다(공식 README에서 직접 확인하지 못함).
    2026-10-12 확인 시 마지막 자료 날짜는 2015-12-31입니다.

resolution:
  spatial_short: "28 km (0.25°)"
  temporal_short: "1일"
  spatial: >-
    0.25°·0.5° 위경도 격자로 공개(내부 계산은 0.05° 격자, 공개용 재격자 과정에서 관측소 값은 보존되지 않음).
    몬순아시아(MA) 60.0°E–150.0°E, 15.0°S–55.0°N(0.5° 180×140, 0.25° 360×280), 중동(ME) 20.0°E–65.0°E, 15.0°N–45.0°N,
    러시아(RU) 15.0°E–165.0°W, 34.0°N–84.0°N. 일본(APHRO_JP)은 0.05° 격자(123°E–146°E, 24°N–46°N).
  vertical: 지표 단일층(일강수·일평균 기온)
  temporal: >-
    일. V1901의 '하루'는 00~24 UTC 누적이고(위성 CMORPH로 관측소 하루 경계를 보정), V1801은 영역·국가별 현지 경계(예: 일본 15 UTC),
    V1101은 나라마다 다른 관측소 하루 경계를 그대로 씁니다(예: 인도 03 UTC). V1901은 0.05° 일 기후값도 제공합니다.

coverage:
  short: 아시아
  note: "육지, 몬순아시아(60–150°E·15°S–55°N)·중동·러시아 세 영역 + 일본 0.05°판"
update: 갱신 종료 — 마지막 공개 V1901(2019년), 2015년 12월까지
license: >-
  학술 기관·연구자 비상업적 이용만 허용. 자료 전체·일부의 일반 재배포 금지, 2차 산출물 공개는 APHRODITE 프로젝트 허락 필요,
  논문에 APHRODITE 및 누리집 표기(DIAS 이용 조건 기준). 이메일 등록 필요
account_required: true

summary: >-
  APHRODITE는 아시아 각국 기상·수문 기관과 연구자에게서 직접 모은 우량계 자료에 GTS·GHCN 등 공개 자료를 더해, 지형을 고려한 내삽으로 만든
  관측 기반 일강수 격자 자료입니다. 몬순아시아·중동·러시아 영역을 0.25°·0.5°로 1951년부터 제공하며, 히말라야 등 관측이 드문 지역에
  다른 전지구 자료보다 많은 우량계를 넣은 것이 특징입니다. 격자마다 관측소가 들어간 비율(RSTN)을 함께 제공해 값의 신뢰도를 가늠할 수 있습니다.
  일평균 기온 자료(AphroTemp, V1808)와 일본 0.05° 자료(APHRO_JP)도 있습니다.

time_convention:
  summary: >-
    모든 강수 값은 하루(24시간) 누적 강수량(mm/day)입니다. 하루의 경계는 버전마다 다릅니다. V1901은 위성 자료로 관측소의 하루 마감 시각을
    보정해 모든 격자를 00~24 UTC로 맞췄고, V1101·V1101EX_R1·V1801_R1은 각 나라 관측소의 하루 마감 시각을 그대로(또는 영역별로) 씁니다.
  points:
    - "V1901의 00~24 UTC는 한국 시간 09시~다음날 09시입니다. 기상청 일강수(00~24 KST)와 하루 경계가 9시간 다릅니다."
    - "V1101 계열은 나라마다 하루 경계가 달라(README 예: 인도 03 UTC, V1801은 일본 15 UTC) 넓은 영역의 같은 날 지도를 비교할 때 하루가 어긋날 수 있습니다. APHRODITE 팀은 이 때문에 V1901을 '하루 경계 보정판(EOD-adjusted)'이라고 밝혀 인용하라고 요청합니다."
    - "공개 격자(0.25°·0.5°)는 0.05° 격자 값을 평균한 것이라 관측소 값과 정확히 일치하지 않습니다."
    - "기온(AphroTemp·V1808)은 일평균 기온입니다."
  source: http://aphrodite.st.hirosaki-u.ac.jp/product_readme/Readme_V1901.pdf
  source_name: APHRO_MA_V1901 README + V1101EX_R1 README

variables:
  note: >-
    공식 README 기준 변수입니다. 이진(binary) 파일에는 날마다 강수 배열 다음에 관측소 비율 배열이 이어지며(4바이트 실수, little-endian, 레코드 표지 없음),
    netCDF 파일도 함께 제공됩니다. netCDF 안의 변수 이름은 README에서 확인하지 못했으므로 파일을 열어 확인하세요. 결측값은 -99.9입니다.
  full_list: http://aphrodite.st.hirosaki-u.ac.jp/products.html
  groups:
    - name: 일강수 (APHRO_MA·ME·RU V1101, V1101EX_R1, V1801_R1, V1901)
      kind: accum
      period: 일
      items:
        - text: "일강수량 (mm/day)"
          note: "V1901은 00~24 UTC, 그 밖의 버전은 관측소별 하루 경계"
        - text: "관측소 포함 비율 RSTN (%)"
          kind: instant
          note: >-
            격자 안 0.05° 칸 중 관측소가 있는 칸의 비율로 날마다 달라지는 신뢰도 지표입니다(시간 통계가 아니라 그날의 관측 밀도).
            V1901 README는 단위를 %와 분수로 섞어 표기합니다
    - name: 일평균 기온 (AphroTemp V1204R1, APHRO_TAVE_MA_V1808)
      kind: mean
      period: 일
      items:
        - text: "일평균 기온"
          note: 단위·변수 이름은 공식 문서에서 확인하지 못함. 몬순아시아 0.25°·0.5°
    - name: 일본 고해상도 (APHRO_JP)
      kind: accum
      period: 일
      items:
        - text: "일강수량 0.05° (mm/day)"
          note: "최신판 V1207R3(2018년 공개). 기간은 이전 판 V1207 기준 1900~2011년이며 R3의 기간은 확인하지 못함"

access:
  - name: APHRODITE 누리집 (히로사키대학, 최신 버전)
    url: http://aphrodite.st.hirosaki-u.ac.jp/download/
    method: 웹 다운로드 (이메일 등록)
    note: >-
      V1901, V1801_R1, V1101EX_R1, V1808(기온), APHRO_JP와 APHRODITE-1 자료(V1101 등)를 받을 수 있습니다. 이전 버전이 필요하면
      aphrodite.precinfo@gmail.com으로 알려 달라고 안내합니다. 이진 파일과 함께 GrADS 제어 파일(.ctl), Fortran 예제, netCDF가 제공됩니다.
  - name: DIAS — APHRO_MA V1101 (몬순아시아)
    url: http://search.diasjp.net/en/dataset/APHRO_MA
    method: 웹 다운로드 (DIAS 이메일 등록)
    note: 1951~2007년 V1101 판입니다. 2026-10-12 확인 시 같은 DIAS의 AphroTemp(기온 V1204R1) 페이지는 '현재 내려받기 불가'로 표시되어 있습니다.

example:
  lang: python
  note: >-
    README에 적힌 이진 파일 구조(하루마다 [강수, RSTN] 두 배열, 4바이트 little-endian 실수, 레코드 표지 없음)대로 몬순아시아 0.5° 연 파일 하나를 읽는 예입니다.
    파일 이름과 격자 시작 좌표·방향은 함께 받은 .ctl 파일(XDEF·YDEF)에서 확인해 바꾸세요.
  code: |
    import numpy as np

    nx, ny = 180, 140                      # 몬순아시아 0.5° (0.25°는 360, 280)
    fname = "APHRO_MA_050deg_V1101.2005"   # 받은 파일 이름으로 바꾸세요

    raw = np.fromfile(fname, dtype="<f4")
    nday = raw.size // (2 * nx * ny)       # 0.5° 평년 파일 = 73,584,000 바이트 = 365일
    raw = raw.reshape(nday, 2, ny, nx)

    precip = np.where(raw[:, 0] <= -99.0, np.nan, raw[:, 0])   # mm/day
    rstn = np.where(raw[:, 1] <= -99.0, np.nan, raw[:, 1])     # 관측소 포함 비율

    # 관측소가 하나도 없는 격자(rstn == 0)는 내삽만으로 만든 값이므로 따로 표시해 두기
    print(nday, np.nanmean(precip), np.mean(rstn == 0))

tips:
  - "버전마다 하루 경계가 다릅니다. 극한 강수·날짜별 사례 분석에는 00~24 UTC로 맞춘 V1901이 알맞고, V1101과 V1901의 같은 날짜 값을 직접 비교하지 마세요."
  - "RSTN(관측소 포함 비율)을 꼭 함께 보세요. 관측소가 없는 격자는 주변 관측소로 내삽한 값이라 지역·시기에 따라 신뢰도가 크게 다릅니다. NCAR Climate Data Guide도 입력 관측 수의 시공간 변화가 추세 분석을 제한한다고 지적합니다."
  - "관측소 이전·우량계 교체에 대한 균질화가 되어 있지 않습니다. 장기 추세보다 기후값·사례 분석에 더 알맞습니다."
  - "한반도는 몬순아시아(MA) 영역(60–150°E, 15°S–55°N) 안에 들어갑니다. 다만 공식 자료에서 한국 관측소의 출처와 수를 확인하지 못했으므로, 한반도 연구에서는 RSTN으로 격자별 관측 밀도를 확인하고 기상청 ASOS 관측과 비교해 보세요. APHRO_JP는 일본 육지 자료입니다."
  - "0.05° 관측소 격자는 자료 제공 기관의 이용 제한 때문에 대부분 공개되지 않습니다(일본 APHRO_JP와 V1901 기후값 제외)."
  - "V1101 이진 파일은 레코드 표지가 없는 direct-access 형식이라 Fortran 순차 읽기나 일반 numpy 읽기에서 recl·바이트 순서를 맞춰야 합니다. 파일 크기로 일수를 검산하세요."
  - "상업적 이용·재배포가 금지되어 있습니다. 가공 자료를 공개하려면 APHRODITE 팀의 허락을 받아야 합니다."

