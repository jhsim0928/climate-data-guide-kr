# ─────────────────────────────────────────────────────────────
# FLDAS — 데이터셋 정보 파일
# 지면 탭 '육상 재분석·자료동화'에 싣습니다. 전지구 Noah 0.1° 월자료(최종·예비)와 중앙아시아 Noah-MP 0.01° 일자료를 함께 다룹니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: fldas
name: "FLDAS"
full_name: FEWS NET Land Data Assimilation System (FLDAS, 기근 조기경보 체계 FEWS NET을 위한 NASA 육상 자료동화 시스템 — 전지구 0.1° 월·중앙아시아 0.01° 일)
category: reanalysis
domain: land
group: 육상 재분석·자료동화
order: 21
domains: [육지, 수문]
provider: NASA GSFC 수문과학연구실(HSL) / GES DISC (FEWS NET 지원)

status: active
status_note: >-
  전지구 Noah 0.1° 월자료는 최종판(MERRA-2·CHIRPS, 1982년~)과 예비판(GDAS·CHIRPS-Prelim, 2019년~)이 매달 갱신되고, 중앙아시아 Noah-MP 0.01° 일자료는 하루 지연으로 매일 나옵니다.
  2026-10-13 확인 시 최종판은 2026년 8월, 예비판은 2026년 9월, 중앙아시아 일자료는 2026년 10월 11일까지 있습니다.
  아프리카 지역판(2019년 폐기)과 중앙아시아 Noah 3.6 일자료(2023-10-01 생산 종료)는 더 이상 제공되지 않으며, 자료를 받는 GES DISC 온프레미스 서버(hydro1)는 2026년 9월 30일 이후 닫힐 수 있습니다.

period:
  start: "1982-01"
  end: present
  note: >-
    전지구 최종판(FLDAS_NOAH01_C_GL_M)과 편차(MA)는 1982-01부터, 예비판(FLDAS_NOAH01_CP_GL_M)은 2019-01부터, 월 기후값(MC)은 1982~2016년 평균입니다.
    중앙아시아 일자료(FLDAS_NOAHMP001_G_CA_D)는 2000-10-01부터입니다. 2026-10-13 확인 시 최종판 2026-08, 예비판 2026-09, 중앙아시아 일자료 2026-10-11까지 있습니다.

resolution:
  spatial_short: "11 km (0.1°)"
  temporal_short: "1일"
  spatial: >-
    전지구판: 0.1°×0.1° 위경도 격자, 60°S–90°N·180°W–180°E(준전지구 육지). 중앙아시아판: 0.01°×0.01° 격자(3500×7000), 21–56°N·30–100°E
    (격자 중심 21.005°N·30.005°E ~ 55.995°N·99.995°E).
  vertical: 지표 단일층 + 토양 4층(0–10, 10–40, 40–100, 100–200 cm)
  temporal: "월(전지구 최종·예비, 월 편차, 1982~2016년 월 기후값) / 일(중앙아시아 Noah-MP)"

update: "전지구 예비판은 보통 다음 달 5일까지, 최종판은 다음 달 20일까지(한 달에 두 번 실행) / 중앙아시아 일자료는 약 1일 지연으로 매일"
license: NASA 지구과학 공개 자료 — 무료. GES DISC에서 받으려면 무료 NASA Earthdata 로그인이 필요하며, 제품별 DOI 인용을 요청합니다
account_required: true

summary: >-
  FLDAS는 미국 국제개발처(USAID)의 기근 조기경보 체계(FEWS NET)를 위해 NASA GSFC가 Land Information System(LIS)으로 운영하는 지면 모델 체계로,
  관측이 드문 개발도상국의 식량·물 안보 판단에 쓰일 토양수분·증발산·유출·적설을 만듭니다. 공개 자료의 주력은 Noah 3.6.1 모델을 CHIRPS 강수와 MERRA-2(최종)
  또는 GDAS(예비) 기상장으로 돌린 1982년부터의 전지구 0.1° 월자료이고, 아프가니스탄 등 중앙아시아에는 Noah-MP 4.0.1로 만든 0.01° 일자료가 있습니다.
  이름과 달리 공개 제품은 관측을 동화하지 않는 오픈루프 모의입니다.

time_convention:
  summary: >-
    변수 이름의 접미사가 시간 특성을 나타냅니다. `_tavg`는 출력 간격(월자료는 그달, 중앙아시아 일자료는 그날) 동안의 평균이고, `_inst`는 순간값입니다.
    강수·증발산·유출 같은 물 플럭스는 누적량이 아니라 평균 비율(kg m-2 s-1)로 들어 있으므로 월합계는 그달 초 수를 곱해 구합니다.
  points:
    - "월 파일의 `Rainf_f_tavg`·`Evap_tavg`·`Qs_tavg`·`Qsb_tavg` 등은 kg m-2 s-1(= mm s-1) 단위의 월평균 비율입니다. 월합계(mm)는 값 × 86400 × 그달 일수입니다."
    - "토양수분 `SoilMoi*_tavg`는 체적함수율(m3 m-3)의 기간 평균입니다(GLDAS의 kg m-2와 다름)."
    - "적설 `SWE_inst`·`SnowDepth_inst`·`SnowCover_inst`만 순간값(`_inst`)입니다. README는 이 순간값이 기간 중 어느 시각인지 밝히지 않으므로, 월 안의 변화를 볼 때는 주의하세요."
    - "중앙아시아 일자료는 하루에 한 번 출력하며 `_tavg`는 일평균입니다. README는 하루 구간을 따로 정의하지 않고, 파일 메타데이터의 시간 범위는 해당 날짜 00 UTC~다음 날 00 UTC입니다."
    - "중앙아시아 일자료의 `RadT_tavg_max`·`RadT_tavg_min`은 그날 지표 복사온도의 최고·최저입니다."
    - "월 편차(MA)는 각 달 값에서 1982~2016년 같은 달 기후값(MC)을 뺀 값입니다. NASA LDAS 웹 지도의 편차는 1991~2020년 기준이라고 안내되어 있어 기준 기간이 다릅니다."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf
  source_name: "README for FLDAS (최종 수정 2026-06-12) + README for FLDAS2 Noah-MP Central Asia (2024-08-13) + CMR 컬렉션·파일 메타데이터"

variables:
  note: >-
    GES DISC README의 변수표(Table 5a·5c, FLDAS2 Table 6) 기준 주요 변수입니다. 변수명은 netCDF 파일 안 이름이며, `_f`가 붙은 변수는 모델 출력이 아니라 강제력입니다.
    README의 일부 표기(예: `Qs_tavg` 단위, 중앙아시아판의 `Snowcover_inst` 대소문자)는 표마다 다르니 받은 파일에서 한 번 확인하세요.
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf
  groups:
    - name: 물 플럭스 (전지구 월자료, 월평균 비율)
      kind: mean
      period: 월
      items:
        - text: "총강수율 (강제력, CHIRPS) — `Rainf_f_tavg` (kg m-2 s-1)"
          std: [precip]
          note: 50°S–50°N 바깥은 MERRA-2(최종)·GDAS(예비) 강수
        - text: "강설 강도 — `Snowf_tavg` (kg m-2 s-1)"
          std: [snowfall]
        - "증발산 — `Evap_tavg` (kg m-2 s-1)"
        - "지표 유출 — `Qs_tavg` (kg m-2 s-1)"
        - "기저 유출(지하 유출) — `Qsb_tavg` (kg m-2 s-1)"
    - name: 에너지 플럭스·지표 (전지구 월자료)
      kind: mean
      period: 월
      items:
        - "잠열 플럭스 — `Qle_tavg` (W m-2)"
        - "현열 플럭스 — `Qh_tavg` (W m-2)"
        - "지중 열플럭스 — `Qg_tavg` (W m-2)"
        - "순 단파·장파복사 — `Swnet_tavg`, `Lwnet_tavg` (W m-2)"
        - text: "지표 복사온도 — `RadT_tavg` (K)"
          std: [tskin]
    - name: 토양 (전지구 월자료, 4층)
      kind: mean
      period: 월
      items:
        - "토양수분 4층 — `SoilMoi00_10cm_tavg`, `SoilMoi10_40cm_tavg`, `SoilMoi40_100cm_tavg`, `SoilMoi100_200cm_tavg` (m3 m-3)"
        - "토양온도 4층 — `SoilTemp00_10cm_tavg`, `SoilTemp10_40cm_tavg`, `SoilTemp40_100cm_tavg`, `SoilTemp100_200cm_tavg` (K)"
    - name: 적설 (전지구 월자료, 순간값)
      kind: instant
      items:
        - text: "적설 수당량 — `SWE_inst` (kg m-2)"
          std: [snow]
        - text: "적설 깊이 — `SnowDepth_inst` (m)"
          std: [snow]
        - text: "적설 피복률 — `SnowCover_inst`"
          std: [snow]
    - name: 강제력 (전지구 월자료, 월평균)
      kind: mean
      period: 월
      items:
        - "지표 기온 (강제력) — `Tair_f_tavg` (K)"
        - "비습 (강제력) — `Qair_f_tavg` (kg kg-1)"
        - "지표 기압 (강제력) — `Psurf_f_tavg` (Pa)"
        - "지표 바람 속도 (강제력) — `Wind_f_tavg` (m s-1)"
        - "하향 단파·장파복사 (강제력) — `SWdown_f_tavg`, `LWdown_f_tavg` (W m-2)"
    - name: 중앙아시아 Noah-MP 일자료 (FLDAS_NOAHMP001_G_CA_D)
      kind: mean
      period: 일
      items:
        - text: "총강수율 — `Rainf_tavg` (kg m-2 s-1)"
          std: [precip]
        - "증발산 — `Evap_tavg` (kg m-2 s-1)"
        - "지표·지하 유출 — `Qs_tavg`, `Qsb_tavg` (kg m-2 s-1)"
        - text: "융설량 — `Qsm_tavg` (kg m-2 s-1)"
          std: [snow]
        - "토양수분 4층 — `SoilMoi00_10cm_tavg` ~ `SoilMoi100_200cm_tavg` (m3 m-3)"
        - "육수저장량 — `TWS_tavg` (mm)"
        - text: "지표 복사온도 일최고 — `RadT_tavg_max` (K)"
          kind: max
          std: [tskin]
        - text: "지표 복사온도 일최저 — `RadT_tavg_min` (K)"
          kind: min
          std: [tskin]
        - text: "적설 수당량 — `SWE_inst` (kg m-2)"
          kind: instant
          std: [snow]
    - name: 월 편차·기후값 (FLDAS_NOAH01_C_GL_MA·MC)
      kind: mean
      period: 월
      items:
        - text: "총유출 — `Qtotal_tavg` (kg m-2 s-1)"
          note: 편차·기후값 파일에만 있는 변수
        - "증발산·강수·기온·토양수분 4층 — `Evap_tavg`, `Rainf_f_tavg`, `Tair_f_tavg`, `SoilMoi*_tavg`"

access:
  - name: NASA GES DISC — FLDAS 데이터셋 목록
    url: https://disc.gsfc.nasa.gov/datasets?keywords=FLDAS
    method: HTTPS 다운로드 / earthaccess / Earthdata Search / OPeNDAP / 부분 추출
    note: >-
      전지구 최종판 FLDAS_NOAH01_C_GL_M, 예비판 FLDAS_NOAH01_CP_GL_M, 편차 FLDAS_NOAH01_C_GL_MA, 기후값 FLDAS_NOAH01_C_GL_MC,
      중앙아시아 일자료 FLDAS_NOAHMP001_G_CA_D이며 모두 버전 001입니다. 무료 Earthdata 로그인이 필요합니다.
      예전 서버(hydro1.gesdisc.eosdis.nasa.gov)는 2026년 9월 30일 이후 닫힐 수 있으니 data.gesdisc.earthdata.nasa.gov 또는 earthaccess로 바꾸세요.
  - name: AWS us-west-2 직접 접근 (S3)
    url: https://data.gesdisc.earthdata.nasa.gov/s3credentials
    method: 클라우드 저장소(S3, us-west-2 안에서만)
    note: "예: s3://gesdisc-cumulus-prod-protected/FLDAS/FLDAS_NOAH01_C_GL_M.001/ — 임시 자격증명이 필요합니다."
  - name: NASA Giovanni
    url: https://giovanni.gsfc.nasa.gov/giovanni/#dataKeyword=FLDAS
    method: 웹 지도·시계열 분석, NetCDF·GeoTIFF·KMZ 내려받기
    note: 영역 평균 시계열과 편차 지도를 내려받기 전에 확인할 수 있습니다.
  - name: NASA LDAS — FLDAS 모델 설명
    url: https://ldas.gsfc.nasa.gov/fldas
    method: 문서·지도
    note: 전지구·중앙아시아·예측(Forecast) 시스템 설명과 매개변수 자료가 있습니다. 아프리카·중동 0.25° 예측 자료는 공개 저장소가 아니라 요청 시 제공됩니다.

example:
  lang: python
  note: >-
    earthaccess로 2024년 전지구 최종판 월자료를 받아 한반도 영역의 월강수량과 월증발산(mm)을 구하는 예입니다. 처음 실행 때 Earthdata 아이디·비밀번호를 묻습니다.
    좌표 이름은 받은 파일에서 확인하세요(아래는 lon·lat 기준).
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="FLDAS_NOAH01_C_GL_M", version="001",
        temporal=("2024-01-01", "2024-12-31"),
        bounding_box=(124, 33, 132, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "fldas_global_monthly")

    ds = xr.open_mfdataset(files, combine="by_coords")
    print(ds)                                   # 좌표·변수 이름 확인
    sub = ds.sel(lon=slice(124, 132), lat=slice(33, 39))
    days = sub["time"].dt.days_in_month

    precip_mm = sub["Rainf_f_tavg"] * 86400 * days   # 월평균 비율(kg m-2 s-1) → 월강수량(mm)
    et_mm = sub["Evap_tavg"] * 86400 * days          # 월증발산(mm)
    print((precip_mm - et_mm).mean(["lat", "lon"]).values)

tips:
  - "예비판(CP, GDAS·CHIRPS-Prelim)과 최종판(C, MERRA-2·CHIRPS)은 강제력이 달라 같은 달이라도 값이 다릅니다. 예비판은 매달 전달 최종판 상태에서 다시 출발하므로, 최근 몇 달을 예비판으로 채웠다면 최종판이 나온 뒤 바꿔 받고 논문에는 판을 밝히세요."
  - "CHIRPS는 50°S–50°N에만 있어 그 바깥(고위도)은 MERRA-2(최종)·GDAS(예비) 강수를 씁니다. 50° 위도선 부근에서 강수 특성이 달라질 수 있습니다."
  - "토양수분 단위가 m3 m-3(체적함수율)입니다. GLDAS(kg m-2)와 비교할 때 단위를 맞추세요."
  - "물 플럭스는 kg m-2 s-1 비율입니다. 월합계는 × 86400 × 그달 일수이며, 단위를 보지 않고 값을 그대로 더하면 수십만 배 작은 값이 나옵니다."
  - "편차 파일(MA)의 기준은 1982~2016년 기후값(MC)입니다. NASA LDAS 웹 지도·FEWS NET 자료의 편차(1991~2020년 기준 등)와 기준 기간이 다를 수 있으니 직접 계산할 때 기준을 밝히세요."
  - "2020년 11월 내륙 수면 위 잘못된 모델 값을 MODIS(MOD44W) 육지 마스크로 지웠습니다. 그 전에 받은 자료는 다시 받으세요(강제력 변수 `_f`는 영향 없음)."
  - "NASA LDAS는 전지구 예비판 2023년 5월, 중앙아시아 Noah 3.6 2023-05-22~06-25, 중앙아시아 Noah-MP 2021-10-01~2023-03-25·2023-05-22~06-21 구간을 재처리했다고 알렸습니다(게시일 표시 없음). 이 구간을 예전에 받았다면 다시 받으세요."
  - "NASA LDAS FAQ에는 아직 동·남·서아프리카 지역판이 있다고 적혀 있지만, GES DISC README에 따르면 지역판은 2019년에 폐기되고 전지구판으로 대체되었습니다."

