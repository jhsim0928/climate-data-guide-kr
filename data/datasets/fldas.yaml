transitions:
  - from: FLDAS 중앙아시아 Noah 3.6 일자료 (FLDAS_NOAH001_G_CA_D)
    to: FLDAS2 중앙아시아 Noah-MP 일자료 (FLDAS_NOAHMP001_G_CA_D)
    status: completed
    date: "2023-10"
    summary: >-
      같은 영역·해상도·기간(2000-10~)을 Noah-MP 4.0.1로 다시 만든 FLDAS2 제품이 2023년 11월 공개되었고, Noah 3.6 일자료는 2023년 10월 1일 생산을 멈춘 뒤
      2024년 3월 폐기 예정으로 안내되었습니다. 2026-10-13 확인 시 NASA CMR에서 Noah 3.6 컬렉션은 검색되지 않습니다.
    changes:
      - aspect: 지면 모델
        before: Noah 3.6
        after: Noah-MP 4.0.1 (LIS 기반 FLDAS2)
      - aspect: short name·DOI
        before: "FLDAS_NOAH001_G_CA_D (10.5067/VQ4CD3Y9YC0R)"
        after: "FLDAS_NOAHMP001_G_CA_D (10.5067/C4IOYF41EEZB)"
      - aspect: 변수
        before: "23개"
        after: "27개 — 지표 복사온도 일최고·최저(`RadT_tavg_max`·`RadT_tavg_min`), 육수저장량(`TWS_tavg`), 적설 피복률 추가"
      - aspect: 영역·해상도·강제력
        before: "21–56°N·30–100°E, 0.01°, GDAS"
        after: "같음"
    impacts:
      - "모델이 달라 같은 날짜라도 토양수분·유출 값이 다릅니다. 두 판을 한 시계열로 잇지 말고 2000년 10월부터 Noah-MP로 다시 받으세요."
      - "중앙아시아 편차 지수의 기준 기간은 2000-10-01~2022-09-30(수문연도 2001~2022)으로 안내되어 있습니다."
    sources:
      - name: NASA LDAS — FLDAS Central Asia
        url: https://ldas.gsfc.nasa.gov/fldas/models/central-asia
      - name: README for FLDAS2 Noah-MP Central Asia
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS2.pdf
  - from: FLDAS 아프리카 지역판 (동·남·서아프리카)
    to: FLDAS 전지구판 (0.1° 월)
    status: completed
    date: "2019-11"
    summary: >-
      동·남·서아프리카별로 나뉘어 있던 지역 월·일자료가 2019년 9~11월에 폐기되고, 같은 Noah 0.1° 구성의 준전지구 월자료로 대체되었습니다.
    changes:
      - aspect: 영역
        before: "동·남·서아프리카 지역 격자"
        after: "60°S–90°N 준전지구"
      - aspect: 제품
        before: "지역 'C' 월자료(2019-09-16 폐기), 지역 'A' Noah·VIC 일·월자료(2019-11-01 폐기)"
        after: "FLDAS_NOAH01_C_GL_M·MA·MC (Noah, 월)"
      - aspect: 시간 간격
        before: "일·월 (지역 'A' 0.1°·0.25°)"
        after: "월만 제공 (아프리카 일자료 없음)"
    impacts:
      - "아프리카 일자료가 필요하면 공개 GES DISC 제품으로는 얻을 수 없습니다. 월자료로 분석하거나 FEWS NET·NASA LDAS에 문의하세요."
    sources:
      - name: README for FLDAS
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf

notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC 온프레미스 서버 종료 — FLDAS도 Earthdata Cloud로 전환 필요
    body: >-
      GES DISC는 온프레미스 서버의 HTTPS 접근을 2026년 9월 30일까지 닫고 온프레미스 OPeNDAP도 8월 20일~9월 30일 사이에 끈다고 안내했습니다.
      FLDAS가 있는 hydro1.gesdisc.eosdis.nasa.gov 서버도 '빨라야 2026년 9월 30일 이후' 접근이 끝난다고 표시하고 있습니다(2026-10-13 확인 시 아직 응답).
      스크립트 주소를 data.gesdisc.earthdata.nasa.gov나 earthaccess로 바꾸세요.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2023-11-07"
    level: warning
    title: 중앙아시아 일자료 Noah-MP(FLDAS2)로 교체 — Noah 3.6판 생산 종료
    body: >-
      중앙아시아 Noah 3.6 일자료(FLDAS_NOAH001_G_CA_D)는 2023년 10월 1일 갱신이 멈췄고 2024년 3월 폐기 예정으로 안내되었습니다.
      같은 영역의 Noah-MP 4.0.1 일자료(FLDAS_NOAHMP001_G_CA_D)가 2023년 11월 7일 공개되었으니 이쪽으로 바꾸세요.
    source: https://ldas.gsfc.nasa.gov/fldas/models/central-asia
  - date: "2020-11"
    level: warning
    title: 내륙 수면 마스크 후처리 — 2020년 11월 이전 다운로드분은 다시 받기
    body: >-
      일부 내륙 수면 격자에 잘못된 모델 값이 있어 모든 출력을 MODIS MOD44W 육지 마스크로 다시 처리했습니다. 강제력 변수(_f)는 바뀌지 않았습니다.
      2020년 11월 이전에 받은 FLDAS 자료는 다시 받으라고 안내합니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf
  - date: "2019-11-01"
    level: info
    title: 아프리카 지역판 폐기 — 전지구판으로 대체
    body: >-
      지역 'C' 월자료는 2019년 9월 16일, 지역 'A' Noah·VIC 일·월자료는 2019년 11월 1일 폐기되었습니다. README는 전지구 0.1° 월자료를 쓰라고 안내합니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_FLDAS.pdf

