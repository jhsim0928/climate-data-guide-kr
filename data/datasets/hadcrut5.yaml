# ─────────────────────────────────────────────────────────────
# HadCRUT5 — 데이터셋 정보 파일
# 대기 탭(기온 자료)에 싣습니다. 육상 CRUTEM5 + 해양 HadSST4 결합 자료입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: hadcrut5
name: HadCRUT5
full_name: HadCRUT5 — Met Office Hadley Centre/CRU global surface temperature anomalies (전지구 지표 기온 편차 격자 자료 5판)
category: analysis
domain: atmosphere
group: 기온 자료
order: 10
domains: [대기, 해양]
provider: Met Office Hadley Centre · University of East Anglia Climatic Research Unit (CRU)

status: active
status_note: >-
  정상 갱신 중이며, 2026-09-18 현재 버전이 HadCRUT.5.2.0.0으로 바뀌었습니다(육상 입력 CRUTEM.5.2.0.0).
  버전이 바뀔 때마다 1850년부터 전 기간 값이 다시 계산되므로, 논문에는 사용한 버전 번호를 꼭 적어야 합니다.
  CRU(UEA) 웹페이지는 아직 5.0.2.0(2024년 5월까지)을 안내하고 있으니 Met Office 페이지를 기준으로 받으세요.

period:
  start: "1850-01"
  end: present
  note: >-
    2026-10-12 확인 시 HadCRUT.5.2.0.0 연간 요약 파일에 2026년(부분 연도) 값이 들어 있고, 함께 공개된 CRUTEM.5.2.0.0 릴리스 노트는
    "2026년 값은 첫 7개월 자료 기준"이라고 밝혀 2026년 7월까지 반영된 것으로 보입니다. 월별 파일의 마지막 행은 직접 확인하지 못했습니다.

resolution:
  spatial_short: "555 km (5°)"
  temporal_short: "1개월"
  spatial: "5° 위도 × 5° 경도 정규 격자 (전지구). 비보간(non-infilled)판은 관측이 없는 칸이 빈 값, 분석(analysis)판은 통계적 보간으로 빈 곳을 채움"
  vertical: 지표 단일층 (육상 지상 2 m 부근 기온 + 해양 해수면온도의 혼합)
  temporal: 월평균 편차 (요약 시계열은 월·연 파일 별도 제공)

coverage:
  short: 전지구
update: >-
  정기 갱신 (HadCRUT5 페이지에 주기 명시 없음. CRU 안내는 1~2개월 간격, 입력 HadSST4는 매월 갱신).
  버전 갱신 때는 전 기간 재계산
license: 영국 정부 저작권(Crown copyright) — Open Government Licence v3. 버전·내려받은 날짜를 넣은 출처 표기 필수
account_required: false

summary: >-
  영국 기상청(Met Office) 해들리센터와 이스트앵글리아대학교 기후연구단(CRU)이 만드는 1850년부터의 전지구 월별 지표 기온 편차 자료입니다.
  육상 기온 CRUTEM5와 해수면온도 HadSST4를 합친 5° 격자로, 편차 기준은 1961~1990년입니다.
  관측이 있는 칸만 담은 비보간(non-infilled)판과 통계적으로 빈 곳을 채운 분석(analysis)판이 있고, 둘 다 불확실성을 표현하는 200개 앙상블 멤버로 제공됩니다.
  IPCC·WMO 보고서에 쓰이는 대표적인 전지구 기온 자료 중 하나입니다.

time_convention:
  summary: >-
    모든 격자 값과 시계열은 해당 달의 월평균 기온 편차(1961~1990년 평균 기준, °C)입니다. 특정 시각의 순간값이 아니며,
    시간 값은 그 달을 가리키는 표시입니다. 연간 파일은 그해 월값의 평균입니다.
  points:
    - "CSV 요약 시계열의 시간 열(Time)은 월별 파일이 \"1956-06\"처럼 연-월, 연간 파일이 \"2025\"처럼 연도로 표기됩니다."
    - "요약 시계열은 앙상블에서 계산한 중심값과 95% 신뢰구간(2.5%·97.5%)을 함께 줍니다."
    - "가장 최근 해는 부분 연도입니다(예: 5.2.0.0의 2026년 값은 1~7월 기준). 연평균 순위를 매길 때 주의하세요."
    - "버전이 바뀌면 과거 값도 바뀝니다. 같은 달 값이라도 버전이 다르면 비교하지 마세요."
  source: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/download.html
  source_name: HadCRUT.5.2.0.0 다운로드 페이지 / CRUTEM.5.2.0.0 릴리스 노트

variables:
  note: >-
    공식 다운로드 페이지 기준 제공 자료입니다. CSV 요약 시계열의 열 이름은 파일에서 확인한 그대로입니다.
    격자 NetCDF 파일 속 변수 이름은 이번 확인에서 직접 열어 보지 못해 적지 않았습니다(받은 뒤 ncdump -h로 확인하세요).
  full_list: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/HadCRUT.5.2.0.0/download.html
  groups:
    - name: 격자 자료 (분석판·비보간판 공통)
      kind: mean
      period: 월
      items:
        - "지표 기온 편차 — 200개 앙상블 멤버 (°C, 1961~1990년 기준), 10개 멤버씩 묶은 zip 20개"
        - "지표 기온 편차 앙상블 평균 — `tas_mean` (°C), ensemble_mean.nc"
        - text: "육지·해양 가중치 — `weights` (0-1), weights.nc"
          kind: static
          note: 육상 기온과 해수면온도를 섞을 때 쓰인 육지 비율
        - text: "비보간판 측정·표집 불확실성 — `tas_unc` (°C), uncorrelated.nc, 10년 단위 error_covariance zip"
          kind: mean
          period: 월
          note: 비보간판에만 제공. 앙상블 멤버에 들어 있지 않은 상관 없는 오차와 오차 공분산
    - name: 요약 시계열 (전지구 (NH+SH)/2 · 북반구 · 남반구)
      kind: mean
      period: 월
      items:
        - "편차 중심값 — `Anomaly (deg C)` (°C)"
        - "95% 신뢰구간 하한·상한 — `Lower confidence limit (2.5%)`, `Upper confidence limit (97.5%)` (°C)"
        - text: "연평균 편차 — annual 파일의 같은 열 (°C)"
          kind: mean
          period: 연
        - "200개 멤버별 시계열 — ensemble_series 파일 (°C)"
        - "불확실성 성분별 시계열 — component_series 파일 (°C)"

