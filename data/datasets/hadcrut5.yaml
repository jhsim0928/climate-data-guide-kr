notices:
  - date: "2026-09-18"
    level: info
    title: HadCRUT.5.2.0.0 공개 — 육상 입력 CRUTEM.5.2.0.0으로 갱신
    body: >-
      현재 버전이 HadCRUT.5.2.0.0으로 바뀌었습니다. 육상 입력 CRUTEM.5.2.0.0에서 중국 380개 관측소 계열이 중국기상국(CMA) 자료로 갱신되고,
      미국 본토 1,218개 관측소가 USHCN 값으로 교체되었으며, 캐나다 1개 관측소가 빠졌습니다. 전 기간 값이 바뀌므로 이전 버전 결과와 섞지 마세요.
    source: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/versions/HadCRUT.5.2.0.0_release_notes.html
  - date: "2025-09"
    level: info
    title: 해양 입력 HadSST.4.2.0.0 공개 (제2차 세계대전 시기 고온 편향 완화)
    body: >-
      HadSST4의 새 버전이 나와 1941~1945년 해수면온도가 비정상적으로 높게 나오던 문제를 줄였습니다(엔진 흡입구 편향 보정 개선).
      HadCRUT.5.2.0.0 릴리스 노트는 이 문서를 링크하면서도 본문에는 HadSST.4.1.1.0을 썼다고 적고 있어, HadCRUT5 반영 여부는 확인되지 않습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.2.0.0_product_user_guide.pdf
  - date: "2025-09"
    level: info
    title: HadCRUT.5.1.0.0 공개 — CRUTEM.5.1.0.0·HadSST.4.1.1.0 반영
    body: >-
      육상 입력이 CRUTEM.5.1.0.0(여러 나라 관측소 계열 갱신·추가)으로, 해양 입력이 HadSST.4.1.1.0으로 바뀌고, 육지·해양 혼합 가중에 쓰는 해빙 자료가
      HadISST.2.2.2.0으로 바뀌었습니다. 비보간판 파일 이름에 'noninfilled'가 들어가도록 바뀌었습니다. 공식 페이지에 정확한 공개일은 없어 릴리스 노트 갱신 시점(2025-09-05)으로 적었습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/versions/HadCRUT.5.1.0.0_release_notes.html
  - date: "2025-02"
    level: info
    title: HadSST.4.1.0.0 공개 — 처리 체계 재구현, 전지구 평균 차이 약 0.01°C
    body: >-
      HadSST4 처리 코드를 Python으로 다시 만들고 몇 가지 오류를 고쳤습니다. 1945년 이후 편향 보정의 공간 분포가 바뀌었지만
      전지구 연평균 차이는 0.01°C 수준이라고 밝혔습니다. 4.1.0.0은 짧게만 공개되고 곧 4.1.1.0으로 대체되었습니다.
    source: https://www.metoffice.gov.uk/hadobs/hadsst4/documentation/HadSST.4.1.0.0_release_notes.pdf

