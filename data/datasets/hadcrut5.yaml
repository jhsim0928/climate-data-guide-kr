      앙상블 평균·가중치 파일이 있습니다. 파일 이름에 버전(HadCRUT.5.2.0.0)이 들어가므로 버전이 바뀌면 주소도 바뀝니다.
  - name: 이전 버전 목록 (5.0.0.0 ~ 5.1.0.0)
    url: https://www.metoffice.gov.uk/hadobs/hadcrut5/data/versions/versions.html
    login: false
    method: HTTPS
    note: 논문 재현 등으로 이전 버전이 필요할 때 씁니다. 버전별 릴리스 노트에 바뀐 점이 정리돼 있습니다.
  - name: CEDA 아카이브 (HadCRUT.5.0.0.0)
    url: https://catalogue.ceda.ac.uk/uuid/b9698c5ecf754b1d981728c37d3a9f02/
    method: CEDA 웹 다운로드 / OPeNDAP
    note: 최초 버전(1850~2018) 보관본입니다. 최신 자료는 Met Office 페이지에서 받으세요.

example:
  lang: python
  note: 분석판 전지구 월별 요약 시계열(CSV)을 읽어 1850~1900년 기준 편차로 바꿉니다. 파일 주소의 버전 번호는 현재 버전에 맞게 고치세요.
  code: |
    import pandas as pd

    ver = "HadCRUT.5.2.0.0"
    url = (f"https://www.metoffice.gov.uk/hadobs/hadcrut5/data/{ver}/analysis/diagnostics/"
           f"{ver}.analysis.summary_series.global.monthly.csv")
    df = pd.read_csv(url)
    df["Time"] = pd.PeriodIndex(df["Time"], freq="M")
    s = df.set_index("Time")["Anomaly (deg C)"]           # °C, 1961~1990 기준

    # 1850~1900년 평균을 빼서 '산업화 이전 대비' 편차로 바꾸기
    s_pi = s - s["1850":"1900"].mean()
    print(s_pi.tail(12).round(2))

tips:
  - 분석판(analysis)과 비보간판(noninfilled)은 전지구 평균이 다릅니다. 비보간판은 관측이 드문 북극 등 빈 칸을 평균에서 빼므로, 두 판을 섞어 쓰거나 이어 붙이지 마세요.
  - 편차 기준이 1961~1990년이라 GISTEMP·Berkeley Earth(1951~1980년)와 값의 높낮이가 다릅니다. 여러 자료를 비교할 때는 같은 기준 기간으로 다시 맞추세요.
  - 불확실성을 제대로 반영하려면 앙상블 평균 하나보다 200개 멤버 전체로 계산한 뒤 분포를 보세요. 비보간판은 앙상블 밖의 측정·표집 오차(uncorrelated·error_covariance 파일)도 따로 더해야 합니다.
  - Open Government Licence 조건상 출처 표기가 필수입니다. 버전 번호, 내려받은 날짜, "© British Crown Copyright, Met Office" 문구를 넣으세요(아래 인용 안내 참고).
  - HadCRUT.5.2.0.0 릴리스 노트는 해양 입력을 "HadSST.4.1.0.0 → HadSST.4.1.1.0"으로 바꿨다고 적으면서 링크는 HadSST.4.2.0.0 문서로 걸려 있어 서로 맞지 않습니다. 실제 사용 버전이 중요하면 Met Office에 문의하세요.
  - CRU(UEA) 홈페이지의 자료 표는 2026년 10월 현재도 5.0.2.0(2024년 5월까지)을 안내합니다. 최신 버전은 Met Office 페이지에서 받으세요.
  - "육상 관측소 자료는 국가별로 몰아서 갱신되므로(예: 5.2.0.0에서 중국·미국 관측소 교체) 버전이 바뀌면 지역 평균이 눈에 띄게 달라질 수 있습니다."

