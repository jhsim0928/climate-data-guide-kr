transitions:
  - from: VIIRS 적설 Version 1 (VNP10 C1)
    to: VIIRS 적설 Version 2 (C2)
    status: completed
    date: "2024-06"
    summary: >-
      알고리즘·구름 마스크·잡음 검출을 개선하고 NOAA-20(VJ110) 제품을 더한 판입니다. Version 1(Suomi NPP만)은 2024년 6월 17일 생산을 멈췄고,
      NOAA-21(VJ210) 제품은 2026년 1월에 추가되었습니다.
    changes:
      - aspect: 위성
        before: "Suomi NPP(VNP10)만"
        after: "Suomi NPP(VNP10) + NOAA-20(VJ110, 2023-06 공개) + NOAA-21(VJ210, 2026-01 공개)"
      - aspect: 알고리즘·입력
        before: "C1 알고리즘"
        after: "적설 알고리즘 개선, 구름 마스크 개선, 잡음 검출 강화(NSIDC 안내)"
      - aspect: 제품
        before: "L2, 일(A1), 구름 채움 일(A1F), 일 CMG(C1)"
        after: "같은 구성 + 375 m 전지구 구름 채움(D1F, 2025년 DOI 등록)"
      - aspect: 메타데이터
        before: "`mask_values`·`mask_meanings` 속성"
        after: "CF-1.6에 맞춰 `flag_values`·`flag_meanings`로 이름 변경, Projection 변수 추가"
      - aspect: 생산
        before: "2024-06-17 정방향 생산 종료"
        after: "현재 판"
    impacts:
      - V1과 V2를 섞지 말고 전 기간을 V2로 다시 받으세요.
      - "`mask_values` 속성을 읽던 코드는 `flag_values`로 고쳐야 합니다."
    sources:
      - name: NSIDC — VIIRS Version 1 (Collection 1) 생산 종료 공지
        url: https://nsidc.org/data/user-resources/data-announcements/user-notice-visible-infrared-imaging-radiometer-suite-viirs-version-1-collection-1-cease-forward-0
      - name: NSIDC VNP10A1 V2 사용자 안내서 (버전 이력)
        url: https://nsidc.org/sites/default/files/documents/user-guide/multi_vnp10a1-v002-userguide.pdf

notices:
  - date: "2026-10-06"
    level: critical
    title: Suomi NPP VIIRS 자료 전달 2026년 11월 2일 종료 — VNP10 신규 자료 중단
    body: >-
      NSIDC는 Suomi NPP 과학 산출물 전달이 2026년 11월 2일 13:00 UTC에 끝난다고 공지하고, JPSS-1(NOAA-20)·JPSS-2(NOAA-21) 동등 제품(VJ110·VJ210)으로 옮기라고 권했습니다.
      이미 공개된 과거 자료와 문서는 계속 받을 수 있습니다. 근거는 NOAA의 2026년 8월 3일 S-NPP 자료 전달 종료 공지입니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-s-nppvisible-infrared-imaging-radiometer-suite-viirs-data-sets-cessation-data-delivery
  - date: "2026-07-11"
    level: warning
    title: Suomi NPP 위성 이상 — VIIRS 적설 생산 일시 중단
    body: >-
      Suomi NPP가 7월 10일 14:50 UTC께 비정상 상태에 들어가 11일 01:30 UTC부터 모든 산출물이 멈췄습니다. 7월 21일 위성이 정상으로 돌아와 이후 생산이 재개되었고,
      복구할 수 있는 결측 자료는 검토 뒤 공개한다고 NSIDC가 안내했습니다.
    source: https://nsidc.org/data/vnp10a1/versions/2
  - date: "2026-03-05"
    level: info
    title: AppEEARS에서 VIIRS 375 m 일 적설(VNP10A1·VJ110A1) 제공 시작
    body: >-
      Suomi NPP와 NOAA-20 VIIRS 일 적설 375 m V2 자료를 AppEEARS로 지점·영역 추출할 수 있게 되었습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-viirsjpss1-and-viirsnpp-snow-cover-daily-l3-global-375m-sin-grid-data-sets-are-now
  - date: "2026-01-29"
    level: info
    title: NOAA-21(JPSS-2) VIIRS Version 2 적설 자료 공개
    body: >-
      NSIDC가 NOAA-21 VIIRS Version 2 자료(VJ210 적설 등)를 공개했습니다. 2023년 2월부터의 기록이며, Suomi NPP 종료 뒤 주 후속 자료가 됩니다.
    source: https://nsidc.org/data/user-resources/data-announcements/new-data-sets-released-viirs-jpss-2-version-2
  - date: "2024-06-17"
    level: info
    title: VIIRS Version 1 적설·해빙 자료 생산 종료
    body: >-
      VIIRS Version 1(Collection 1) 적설·해빙 자료의 정방향 생산이 끝났습니다. V1 자료는 한동안 받을 수 있지만 NSIDC는 Version 2로 옮기라고 강하게 권했습니다.
    source: https://nsidc.org/data/user-resources/data-announcements/user-notice-visible-infrared-imaging-radiometer-suite-viirs-version-1-collection-1-cease-forward-0

