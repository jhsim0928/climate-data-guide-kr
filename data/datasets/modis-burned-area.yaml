transitions:
  - from: MCD64A1 C6
    to: MCD64A1 C6.1
    status: completed
    date: "2021-11"
    summary: >-
      입력 L1B 보정을 고친 Collection 6.1로 전 기간을 다시 만들었습니다. 연소 면적 알고리즘 자체는 C6과 같고, C6(버전 006)은 2023년 7월 31일 배포가 끝났습니다.
    changes:
      - aspect: 입력 자료 보정
        before: "C6 L1B"
        after: "Aqua·Terra 반사 밴드 주사각 응답(RVS) 처리 개선, Terra 적외 밴드 광학 교차 간섭 보정, 2012–2017 Terra 순방향 보정표 수정, 반사 태양 밴드 편광 보정"
      - aspect: 버전 표기·DOI
        before: "MCD64A1.006"
        after: "MCD64A1.061, DOI 10.5067/MODIS/MCD64A1.061 (2021-11-08 공개)"
      - aspect: 제공 상태
        before: "2023-07-31 LP DAAC 배포 종료"
        after: "현재 판, 매월 갱신"
    impacts:
      - C6 파일로 만든 시계열에 C6.1을 이어 붙이지 말고 전 기간을 C6.1로 다시 받으세요.
    sources:
      - name: MCD64A1 C6.1 User Guide
        url: https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf
      - name: "Final Notice: MODIS Version 6.0 Land Data Products Decommissioned on July 31, 2023"
        url: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023
  - from: MODIS MCD64A1 C6.1
    to: VIIRS VNP64A1 C2
    to_id: viirs-burned-area
    status: planned
    date: "2027"
    summary: >-
      VNP64A1은 MCD64A1 C6.1 알고리즘을 Suomi NPP VIIRS에 맞게 고친 후속 제품으로, 같은 500 m Sinusoidal 격자와 같은 층 구성을 씁니다.
      2012~2023년 비교에서 월별 전지구 연소 면적의 상관이 0.989로 매우 높지만 VIIRS 쪽이 해마다 2~6% 많아, 두 자료를 그대로 이어 붙이면 안 됩니다.
      다만 Suomi NPP 자료 공급이 2026년 11월 끝나므로, NOAA-20을 함께 쓰는 Collection 3이 나오기 전까지 VIIRS 쪽 연속성도 확정되지 않았습니다.
    changes:
      - aspect: 위성·센서
        before: "Terra(오전 10:30)·Aqua(오후 1:30) MODIS 결합"
        after: "Suomi NPP VIIRS 단독(오후 1:30 상승) — 오전 관측 없음"
      - aspect: 입력 해상도
        before: "500 m 반사도 + 1 km 활성 화재(MOD14/MYD14 계열)"
        after: "750 m M밴드 반사도를 500 m로 재표본 + VNP14A1 활성 화재(750 m → 1 km 격자)"
      - aspect: 연소 지수 밴드
        before: "단파적외 밴드 5·7 (밴드 7 2.105–2.155 µm)"
        after: "VIIRS 대응 밴드(단파적외 2.225–2.275 µm), 적색 밴드도 다름"
      - aspect: 알고리즘 매개변수
        before: "C6.1 기본값"
        after: "시간 질감 문턱 8 → 7.5일, 형태학적 침식 완화(N → N−1 이웃), 최소 사전확률 0.01 → 0.005"
      - aspect: 기간
        before: "2000-11~현재 (Terra 2027-02, Aqua 2027-09 과학 운영 종료 전망)"
        after: "2012-03~현재 (Suomi NPP 자료 공급 2026-11-01 종료 예정)"
      - aspect: 처리 수준·형식
        before: "L3, HDF-EOS2, 파일 이름 MCD64A1.AYYYYDDD.hHHvVV.061.*.hdf"
        after: "L4, HDF4(HDF-EOS2) — 구조가 사실상 같음, VNP64A1.AYYYYDDD.hHHvVV.002.*.hdf (Collection 3부터 netCDF4 예정)"
      - aspect: 검증 오차 (Landsat 기준, 561쌍)
        before: "누락 71.5%, 오탐 34.2%"
        after: "누락 72.4%, 오탐 36.7%"
      - aspect: 연소 면적 크기 (2012–2023 평균)
        before: "연 370.9 Mha"
        after: "연 386.0 Mha (해마다 2.1~6.3% 많음, 동남아시아에서 차이가 가장 큼)"
    impacts:
      - 두 자료를 한 시계열로 단순히 이어 붙이지 마세요. 2012~현재 겹치는 기간으로 지역별 차이를 먼저 확인하고, 이어 붙였다면 그 사실과 보정 방법을 논문에 밝히세요.
      - 지역별 차이가 유럽 0.1%에서 동남아시아 33.1%까지 크게 다르므로, 전지구 평균 차이(약 4%)로 일괄 보정하면 안 됩니다.
      - 파일 구조와 층 이름이 같아 MCD64A1 코드를 거의 그대로 쓸 수 있습니다. 다만 VIIRS는 오전 관측이 없어 연소 날짜 일치율이 약간 낮습니다(활성 화재 날짜와 같은 날 일치 38% vs 46%).
      - Suomi NPP가 2026년 11월 공급을 멈추므로, 2026년 11월 이후 VIIRS 연소 면적은 NOAA-20 결합 제품(Collection 3 예정)의 공개 여부를 확인해야 합니다.
    sources:
      - name: Giglio et al. (2025), The NASA VIIRS burned area product, global validation, and intercomparison with the NASA MODIS burned area product
        url: https://doi.org/10.1016/j.rse.2025.115006
      - name: Transition from MODIS to VIIRS (Earthdata, 2025-05-02)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
      - name: VNP64A1 V002 (LP DAAC DOI 랜딩)
        url: https://doi.org/10.5067/VIIRS/VNP64A1.002

notices:
  - date: "2026-03-26"
    level: info
    title: Terra MODIS 대기 모드 전환 — 2026년 3월 26일 20시~27일 19시 23분(UTC) 자료 주의
    body: >-
      Terra 위성 이상으로 MODIS가 하루 가까이 대기(standby) 모드에 들어갔다가 3월 27일 과학 모드로 돌아왔습니다. 그 사이 자료는 보정팀이
      의심·불량으로 분류했고, 안내된 관련 제품 목록에 MCD64A1 V061도 들어 있습니다. 2026년 3월 연소 면적에는 Terra 관측이 하루 정도 빠졌을 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/terra-modis-placed-standby-mode
  - date: "2026-03-20"
    level: warning
    title: Terra 과학 운영 2027년 2월, Aqua 2027년 9월 종료 전망
    body: >-
      NASA는 연료·전력 한계로 Terra의 과학 운영 종료를 2027년 2월, Aqua를 2027년 9월로 전망한다고 밝혔습니다. 두 위성이 모두 멈추면
      MCD64A1의 정규 생산도 끝나므로, 장기 연구는 VIIRS VNP64A1과 겹치는 기간을 확보해 두는 것이 좋습니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2025-06-03"
    level: warning
    title: LP DAAC Data Pool의 MODIS 배포 종료(2025-06-30) — Earthdata Cloud로 전환
    body: >-
      LP DAAC는 MODIS C6.1을 포함한 모든 MODIS 자료의 Data Pool(e4ftl01) 배포를 2025년 6월 30일 끝내고 Earthdata Cloud를 주 저장소로 쓴다고 공지했습니다.
      Earthdata Search·AppEEARS 사용자는 그대로 쓰면 되지만, Data Pool 주소를 쓰던 스크립트는 earthaccess나 클라우드 주소로 바꿔야 합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/lp-daac-discontinue-data-pool-distribution-modis-datasets
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 예정
    body: >-
      Terra·Aqua는 2026년 말~2027년 초부터 운영을 마칠 예정이며, MODIS 자료 수집이 끝나면 마지막 재처리를 하게 됩니다. 두 위성은 설계 궤도에서
      벗어나 통과 시각이 바뀌고 있어 자료에 영향을 줄 수 있으므로, NASA는 비슷한 VIIRS 제품을 미리 검토하라고 권합니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2023-07-25"
    level: info
    title: MODIS 버전 6.0 육상 제품(MCD64A1.006 포함) 2023-07-31 배포 종료
    body: >-
      LP DAAC는 Terra·Aqua·결합 MODIS 버전 6.0 육상 자료 전체의 배포를 2023년 7월 31일 끝냈습니다(MOD44W·MCD43GF만 예외).
      연소 면적은 버전 6.1(MCD64A1.061)을 쓰세요.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/final-notice-modis-version-6-0-land-data-products-decommissioned-july-31-2023

