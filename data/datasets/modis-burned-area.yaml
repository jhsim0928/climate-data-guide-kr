account_required: true

summary: >-
  MCD64A1은 Terra·Aqua MODIS의 500 m 지표 반사도와 1 km 활성 화재(active fire) 탐지를 함께 써서, 화재로 탄 500 m 격자마다
  '탄 날짜'를 기록한 월별 전지구 연소 면적 제품입니다. 단파적외(밴드 5·7) 기반 연소 민감 식생지수의 시간 변화에 활성 화재로 학습한
  동적 문턱값을 적용해 연소 여부와 날짜를 정합니다. GFED·FINN 같은 화재 배출량 자료와 탄소순환·대기질 연구의 기준 연소 면적으로 가장 널리 쓰입니다.

time_convention:
  summary: >-
    파일 하나는 한 달력 월을 담고, `Burn Date`는 그달에 연소가 감지된 날의 연중 일수(1~366)입니다. 값은 '그 시각의 관측'이 아니라
    한 달 동안의 반사도 시계열을 분석해 정한 그달의 결과이며, 날짜 정확도는 하루 단위에 불확실성(`Burn Date Uncertainty`, 일)이 따로 붙습니다.
    Terra(오전 10:30 하강)·Aqua(오후 1:30 상승) 두 위성의 관측을 함께 쓰지만, 두 위성 모두 궤도 표류로 통과 시각이 크게 바뀌었습니다.
  points:
    - "파일 이름의 AYYYYDDD는 그 달력 월의 첫날(연중 일수)입니다. 예: A2026182 = 2026년 7월(7월 1일 = 182일)."
    - "`Burn Date`의 0은 타지 않은 육지, -1은 자료 부족으로 판정 불가, -2는 물입니다. 연소 면적을 셀 때는 1~366인 화소만 세세요."
    - "`First Day`·`Last Day`는 변화를 믿을 만하게 감지할 수 있었던 첫날·마지막 날입니다. 구름이 오래 끼면 이 범위가 그달보다 좁아지고 QA 비트 2(판정 기간 단축)가 켜집니다."
    - "연간 연소 면적은 12개 월 파일의 연소 화소를 모아 셉니다. 같은 화소가 한 해에 두 번 탈 수 있으니, '탄 면적'과 '한 번 이상 탄 면적' 중 무엇을 셀지 정하세요."
    - "Terra는 2020년 이후 궤도 유지를 멈춰 적도 통과 시각이 10:30에서 2025년 말 약 9:00로, Aqua는 13:30에서 2026년 8월 약 15:50로 바뀔 것으로 안내되었습니다. 태양 고도·그림자·화소 간격이 달라져 최근 몇 해의 탐지 특성이 이전과 다를 수 있습니다."
  source: https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf
  source_name: "MCD64A1 C6.1 User Guide (Giglio et al.) + LP DAAC Terra·Aqua MODIS 관측 계획 공지"

variables:
  note: >-
    LP DAAC·LAADS 파일 명세(HDF-EOS2, HDF4) 기준 과학 자료 층(SDS) 5개입니다. 층 이름에 공백이 들어 있으니(예: "Burn Date") 읽을 때 그대로 쓰세요.
    축척 인수(scale_factor)는 없습니다. Google Earth Engine(`MODIS/061/MCD64A1`)에서는 띄어쓰기 없는 밴드 이름(`BurnDate`, `Uncertainty`, `QA`, `FirstDay`, `LastDay`)을 씁니다.
  full_list: https://ladsweb.modaps.eosdis.nasa.gov/filespec/MODIS/61/MCD64A1
  groups:
    - name: 월별 연소 면적 층 (500 m)
      kind: instant
      items:
        - text: "연소 날짜(연중 일수) — `Burn Date` (일, int16)"
          note: "그달 안에서 연소가 감지된 날. 0 = 타지 않음, -1 = 판정 불가, -2 = 물"
          std: [burned_area]
        - text: "연소 날짜 불확실성 — `Burn Date Uncertainty` (일)"
          note: 타지 않은 화소·판정 불가 화소는 0
        - text: "변화 감지 가능 첫날 — `First Day` (연중 일수)"
          note: 그달의 연소를 믿을 만하게 판정할 수 있었던 첫날
          std: []
        - text: "변화 감지 가능 마지막 날 — `Last Day` (연중 일수)"
          std: []
        - text: "품질 정보 — `QA` (8비트 플래그)"
          note: "비트 0 육지/물, 1 유효 자료, 2 판정 기간 단축, 3 주변 화소 기준 재분류, 5–7 타지 않은 화소의 특수 상황 코드(관측 부족·학습 표본 부족·지속 열원 등)"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2565786756-LPCLOUD
    method: 웹 검색·HTTPS 다운로드 / earthaccess / AWS us-west-2 S3 직접 접근
    note: >-
      short_name MCD64A1, version 061입니다. 파일은 타일별 HDF-EOS2(.hdf)이며 무료 Earthdata 로그인이 필요합니다.
      S3 경로는 s3://lp-prod-protected/MCD64A1.061/이며 임시 자격증명은 https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials 에서 받습니다.
      예전 LP DAAC Data Pool(e4ftl01)의 MODIS 배포는 2025년 6월 30일 종료되었습니다.
  - name: AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: 영역·지점 부분 추출, 투영 변환(GeoTIFF·NetCDF4)
    note: 타일을 직접 다루지 않고 관심 영역만 위경도 격자로 받을 때 편합니다.
  - name: LP DAAC 제품 페이지 (DOI 랜딩)
    url: https://doi.org/10.5067/MODIS/MCD64A1.061
    method: 문서(사용자 안내서·ATBD)·층 정보
  - name: 메릴랜드대학교 연소 면적 서버 (fuoco.geog.umd.edu)
    url: https://lpdaac.usgs.gov/documents/1006/MCD64_User_Guide_V61.pdf
    method: SFTP — 위경도(Plate Carrée) GeoTIFF·Shapefile 부분 자료
    note: 과학팀이 지역별로 다시 투영한 GeoTIFF와 연소 구역 Shapefile을 제공합니다. 공개 접속 정보는 사용자 안내서에 있습니다.
  - name: Google Earth Engine
    url: https://developers.google.com/earth-engine/datasets/catalog/MODIS_061_MCD64A1
    method: 클라우드 분석 (`MODIS/061/MCD64A1`)
  - name: NASA FIRMS (Burned Area 모드)
    url: https://firms.modaps.eosdis.nasa.gov/
    method: 웹 지도 보기
    note: 월·연 연소 면적을 VIIRS VNP64A1과 겹쳐 보며 비교할 수 있습니다.

example:
  lang: python
  note: >-
    earthaccess로 2025년 3월 한반도 동부를 덮는 타일을 받아 연소 화소 수와 면적을 세는 예입니다. HDF4 파일은 GDAL이 있는 rasterio로 엽니다.
    층 이름은 subdatasets 목록에서 찾아 쓰고, 화소 한 칸 면적은 463.31271653 m의 제곱입니다.
  code: |
    # pip install earthaccess rasterio numpy   (rasterio는 HDF4를 지원하는 GDAL이 필요)
    import earthaccess
    import numpy as np
    import rasterio

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="MCD64A1", version="061",
        temporal=("2025-03-01", "2025-03-31"),
        bounding_box=(127, 35, 130, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "mcd64a1")

    for f in files:
        with rasterio.open(f) as src:
            sds = [s for s in src.subdatasets if s.endswith("Burn Date")][0]
        with rasterio.open(sds) as b:
            burn = b.read(1)
        burned = (burn >= 1) & (burn <= 366)       # 0 미연소, -1 판정 불가, -2 물
        area_km2 = burned.sum() * 463.31271653**2 / 1e6
        print(f, burned.sum(), "화소,", round(area_km2, 1), "km2")

tips:
  - "`Burn Date`는 연소 '날짜'이지 면적이 아닙니다. 면적은 1~366인 화소 수 × 화소 면적(463.31271653 m의 제곱, 약 21.5 ha)으로 계산하고, 0·-1·-2를 빼세요."
  - "Sinusoidal 투영이라 위경도 격자로 바꿀 때 최근접(nearest) 재표본을 쓰세요. 평균·쌍선형 보간을 하면 날짜 값이 섞여 엉뚱한 날짜가 생깁니다."
  - "500 m 제품은 작은 불을 많이 놓칩니다. Landsat 30 m 기준 검증(Giglio et al. 2025)에서 MCD64A1의 누락 오차가 71.5%, 오탐 오차가 34.2%였고, GFED5는 작은 불을 보태 MCD64A1보다 연소 면적을 약 90% 크게 잡습니다. 한반도처럼 작은 산불·농경지 소각이 많은 곳은 과소 추정이 큽니다."
  - "사용자 안내서는 농경지 연소를 '낮은 신뢰도'로 다루라고 권합니다. 농경지 소각을 따로 볼 때는 MCD64A1만으로 판단하지 마세요."
  - "2001년 6월(Terra 장기 결측)과 2020년 8월(Aqua 약 2주 자료 손실, 직접 수신 자료로 일부 보완)은 품질이 떨어지는 달입니다."
  - "구름이 오래 낀 곳은 `Burn Date`가 -1(판정 불가)이거나 `First Day`~`Last Day` 범위가 그달보다 좁습니다. 결측을 '타지 않음'으로 세지 마세요(QA 비트 1·2 확인)."
  - "Terra·Aqua 궤도 표류로 최근 자료의 관측 시각·화소 간격이 달라졌습니다. 2020년대 추세를 볼 때는 이 변화와, 2012년 이후 겹치는 VIIRS VNP64A1 결과를 함께 확인하세요."
  - "파일 이름 끝의 생산 일시는 재처리 때마다 바뀝니다. 스크립트에서 파일 이름을 통째로 고정하지 말고 날짜·타일로 찾으세요."

