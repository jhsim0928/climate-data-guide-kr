# ─────────────────────────────────────────────────────────────
# MODIS 연소 면적 MCD64A1 C6.1 — 데이터셋 정보 파일
# 지면 탭 '산불'에 싣습니다. Terra·Aqua 임무 종료를 앞두고 VIIRS 연소 면적(VNP64A1, viirs-burned-area.yaml)으로 넘어가는 중입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: modis-burned-area
name: "MODIS Burned Area (MCD64A1)"
full_name: MODIS/Terra+Aqua Burned Area Monthly L3 Global 500m SIN Grid V061 (MCD64A1, Terra·Aqua MODIS 월별 연소 면적, 500 m)
category: satellite
domain: land
group: 산불
order: 10
domains: [육지, 원격탐사]
provider: NASA MODIS 육상 과학팀(메릴랜드대학교, Louis Giglio) / NASA GSFC MODAPS 생산 / LP DAAC(USGS EROS) 배포

status: deprecated
status_note: >-
  지금도 매달 생산되고 있지만(2026-10-13 확인 시 2026년 7월분까지 공개), 두 위성의 임무 종료가 다가와 대체 예정 상태입니다.
  NASA는 Terra의 과학 운영 종료를 2027년 2월, Aqua는 2027년 9월로 내다보고 있으며, 자료 수집이 멈추면 마지막 재처리를 한 뒤
  VIIRS 유사 제품으로 옮겨 가라고 안내합니다. 연소 면적의 후속은 같은 알고리즘·같은 격자의 VIIRS VNP64A1(2012년 3월~)이지만,
  이 제품도 Suomi NPP 자료 공급이 2026년 11월 끊기는 문제를 안고 있으니 viirs-burned-area 페이지를 함께 보세요.

period:
  start: "2000-11"
  end: present
  note: >-
    2000년 11월부터입니다(그 이전은 Terra MODIS 교차 간섭·보정 문제로 배포하지 않음). 초기에는 Terra만 쓰였고 Aqua 관측은 Aqua 운영 이후 더해졌습니다.
    2026-10-13 CMR 확인 시 최신 파일은 2026년 7월 자료(2026-09-10 생산)였습니다. 2001년 6월은 Terra 장기 결측으로 품질이 크게 떨어집니다.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1개월"
  spatial: >-
    MODIS Sinusoidal(SIN) 타일 격자(가로 h00–h35, 세로 v00–v17, 타일 하나 약 10°×10°), 500 m — 실제 격자 크기는 463.31271653 m이며
    타일 하나가 2400 × 2400 화소입니다(격자 이름 MOD_Grid_Monthly_500m_DB_BA).
  vertical: 지표 단일층
  temporal: 월(달력 월 단위 파일). 각 화소에는 그달 안에서 연소가 감지된 날(연중 일수, 1일 단위)이 들어 있습니다.

update: "매월 (2026-10-13 확인 시 2026년 7월분이 2026-09-10 생산 — 관측 월 종료 후 약 6주)"
