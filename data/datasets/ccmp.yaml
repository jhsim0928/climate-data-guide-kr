notices:
  - date: "2024-07-22"
    level: info
    title: PO.DAAC에서 CCMP V3.1 6시간·월자료 배포 시작
    body: >-
      NASA PO.DAAC가 RSS CCMP Level 4 V3.1 자료(6시간 CCMP_WINDS_10M6HR_L4_V3.1, 월 CCMP_WINDS_10MMONTHLY_L4_V3.1)를 1993년부터 공개했습니다.
      Earthdata 클라우드·OPeNDAP·Harmony로 받을 수 있고 각각 DOI가 붙었습니다.
    source: https://podaac.jpl.nasa.gov/announcements
  - date: "2023-08-25"
    level: info
    title: CCMP V3.1 공개 (1993~현재)
    body: >-
      V3.0과 같은 처리 체계에서 2021년 1월 이후 ERA5 보정에 OSCAR 준실시간판을 쓰고, AMSR2 V8.2와 ASCAT-B(2012-12-13~)를 넣은 V3.1이 나왔습니다.
      낮은 지연으로 계속 갱신할 수 있게 한 판이며, 2012-07-02 이전 값은 V3.0과 같습니다.
    source: https://www.remss.com/announcement/New-Version-3.1-Cross-Calibrated-Multi-Platform/
  - date: "2023-02-13"
    level: info
    title: CCMP V3.0 공개 — 배경장 ERA-Interim → ERA5
    body: >-
      ERA-Interim 생산 종료(2019-07)에 따라 배경장을 ERA5 중립 안정도 바람으로 바꾸고, 해류·풍속 분포·계절 벡터 보정과 복사계 지역 보정을 더한 V3.0이 공개되었습니다.
      강풍(15 m/s 이상) 정확도와 장기 추세 신뢰도가 좋아졌다고 RSS는 밝혔고, 기간은 OSCAR 해류 자료가 시작되는 1993년부터입니다.
    source: https://www.remss.com/announcement/New-Version-3.0-Cross-Calibrated-Multi-Platform/

transitions:
  - from: CCMP V2.0
    to: CCMP V3.0
    status: completed
    date: "2023-02"
    summary: >-
      배경장을 ERA-Interim에서 보정된 ERA5 중립 바람으로 바꾸고, 부이 동화를 빼고 GMI를 더했으며, 복사계 바람과 ERA5에 사전 보정을 적용했습니다.
      기간 시작은 1987년에서 1993년으로 늦춰졌고 강풍 정확도와 장기 안정성이 나아졌습니다.
    changes:
      - aspect: 배경장
        before: ERA-40·ERA-Interim 10 m 바람(보정 없음)
        after: "ERA5 10 m 중립 안정도 바람 + OSCAR 해류 보정, 산란계 기준 풍속 분포 보정, 계절·지역 벡터 보정"
      - aspect: 기간
        before: "1987-07~ (RSS 서버 v02.0 폴더는 2019년에서 멈춤)"
        after: "1993-01~ (OSCAR 해류 자료 시작 시점)"
      - aspect: 위성 입력
        before: "복사계 SSM/I·SSMIS·AMSR-E·WindSat·TMI·AMSR2, 산란계 QuikSCAT·ASCAT-A"
        after: "V2.0 입력 + GMI"
      - aspect: 부이 자료
        before: TAO·TRITON·PIRATA·RAMA·NDBC 등 계류 부이 바람을 동화
        after: 동화하지 않고 독립 검증용으로 남김
      - aspect: 복사계 바람 보정
        before: 없음
        after: 19 GHz 계열(SSM/I·SSMIS)에서 가장 큰 소규모 지역 보정 적용
      - aspect: 월자료 편차 기준
        before: V2.0 기후값
        after: 1995~2014년 기후값
    impacts:
      - V2.0과 V3.x를 한 시계열로 이어 붙이지 마세요. 관측이 없는 곳에서는 배경장 차이만큼 값이 다릅니다.
      - V2.0은 부이를 동화해 부이 주변에 인공 구조가 생겨 응력 컬 같은 미분량에서 두드러졌습니다. V3.x는 이 문제가 없지만 부이 비교가 더는 '동화된 자료와의 비교'가 아닙니다.
      - 1993년 이전 기간이 필요하면 V2.0만 있으므로, 그 기간을 쓰는 연구는 판을 분명히 적고 V3.x와의 차이를 따로 확인하세요.
    sources:
      - name: RSS — CCMP V3.0 공개 공지 (2023-02-13)
        url: https://www.remss.com/announcement/New-Version-3.0-Cross-Calibrated-Multi-Platform/
      - name: Mears et al. (2022), Remote Sensing
        url: https://doi.org/10.3390/rs14174230
      - name: Mears et al. (2019), JGR Oceans (V2.0·NRT 비교)
        url: https://doi.org/10.1029/2019JC015367
      - name: CCMP V3.1 User Guide (버전 비교표)
        url: https://archive.podaac.earthdata.nasa.gov/podaac-ops-cumulus-docs/ccmp/open/L4_V3.1/docs/User_Guide_3.1.r1.pdf
  - from: CCMP V3.0
    to: CCMP V3.1
    status: completed
    date: "2023-08"
    summary: >-
      처리 체계는 같고 2012년 7월 이후 입력만 바뀐 판입니다. AMSR2 V8.2와 ASCAT-B가 들어가 그 이후 바람이 개선되었고, 준실시간 OSCAR를 써서 지연 없이 계속 갱신할 수 있게 되었습니다.
    changes:
      - aspect: 기간
        before: "1993-01~2019 (계속 갱신 계획이었으나 V3.1로 대체)"
        after: "1993-01~현재 (약 매달 갱신)"
      - aspect: ERA5 사전 보정
        before: OSCAR 해류 사용
        after: "2021-01 이후 OSCAR025-nrt(준실시간판) 사용"
      - aspect: 산란계 입력
        before: QuikSCAT, ASCAT-A
        after: "QuikSCAT, ASCAT-A(2016년 이후 V2.1.1, 2021-11 종료), ASCAT-B(2012-12-13~ 전 기간)"
      - aspect: AMSR2
        before: V8.0
        after: "V8.2 (2012-07-02~ 전 기간)"
      - aspect: 2012-07-02 이전 값
        before: V3.0
        after: V3.0과 동일
    impacts:
      - 2012-07 이후 구간은 V3.0과 값이 다르므로 V3.0으로 만든 결과를 V3.1과 섞지 마세요. 그 이전 구간은 같은 값입니다.
      - "RSS 페이지의 인용 DOI는 아직 V3.0으로 표시되어 있습니다. 논문에는 실제로 쓴 판(파일명의 V03.1)을 적으세요."
    sources:
      - name: RSS — CCMP V3.1 공개 공지 (2023-08-25)
        url: https://www.remss.com/announcement/New-Version-3.1-Cross-Calibrated-Multi-Platform/
      - name: RSS CCMP 설명 페이지
        url: https://www.remss.com/measurements/ccmp/

