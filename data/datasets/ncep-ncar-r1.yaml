notices:
  - date: "2026-03-17"
    level: critical
    title: R1 갱신 종료 — 마지막 자료 2026년 3월 17일
    body: >-
      PSL이 "NCEP/NCAR Reanalysis 1 has stopped production"이라고 공지했습니다. NWS가 CDAS를 CORe로 바꾸면서 R1이 더 이상 생산되지 않으며,
      지난 자료는 PSL에 계속 남습니다. PSL 공지는 NCEP의 전환일을 3월 18일로, CPC CORe 페이지는 CORe 운영 시작을 3월 19일로 적고 있습니다.
    source: https://psl.noaa.gov/news/2026/r1datanotice.html
  - date: "2026-02-28"
    level: warning
    title: PSL, R1 갱신 중단 예고
    body: PSL 자료 공지에서 R1이 3월 18일 전후로 더 이상 갱신되지 않는다고 미리 알렸습니다.
    source: https://psl.noaa.gov/data/notices/
  - date: "2026-02-09"
    level: warning
    title: NWS 서비스 변경 공지 SCN 26-12 — CDAS를 CORe로 교체
    body: >-
      NWS가 "2026년 3월 9일 무렵" CDAS를 CORe로 바꾸고 NOMADS·FTP의 cdas, cdas2 폴더 자료 제공을 끝낸다고 공지했습니다(2월 13일 수정본 재발행).
      CORe 파일은 GRIB2로 /com/core/ 경로에서 제공됩니다.
    source: https://www.weather.gov/media/notification/pdf_2026/scn26-12_Updated_CDAS_COReUpdate_aaa.pdf

