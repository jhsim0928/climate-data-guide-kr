# ─────────────────────────────────────────────────────────────
# CRU TS — 데이터셋 정보 파일
# 대기 탭(기온 자료). 매년 한 번 새 버전(4.xx)이 나옵니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: cru-ts
name: CRU TS v4.10
full_name: Climatic Research Unit gridded Time Series (CRU TS) version 4.10 (영국 이스트앵글리아대학 기후연구소 월별 0.5° 육지 기후 격자 자료)
category: analysis
domain: atmosphere
group: 기온 자료
order: 40
domains: [대기, 육지]
provider: University of East Anglia Climatic Research Unit (CRU) / 보관·배포 CEDA(NERC EDS Centre for Environmental Data Analysis)

status: active
status_note: >-
  매년 한 해씩 늘려 새 버전을 냅니다. 최신 v4.10(1901~2025년)은 2026년 6월 7일 CRU 누리집에 공개되었고, 2026-10-12 확인 시 CEDA에는 아직 v4.09(1901~2024년)가 최신으로 올라 있습니다.
  v4.10부터 CRU 누리집의 이용 조건이 Open Government Licence에서 Open Database License로 바뀌었습니다. 담당자는 은퇴한 Ian Harris에서 Andrew Friedman(Tim Osborn 지도)으로 바뀌었습니다.

period:
  start: "1901-01"
  end: "2025-12"
  note: >-
    v4.10은 1901-01~2025-12, CEDA의 v4.09는 1901-01~2024-12입니다. 다음 버전 일정은 공지되지 않았습니다.
    2026-10-12 확인 시 마지막 자료 달은 2025년 12월입니다.

resolution:
  spatial_short: "56 km (0.5°)"
  temporal_short: "1개월"
  spatial: >-
    0.5° × 0.5° 위경도 격자, 육지만(남극 제외). CEDA 표기 범위 180°W–180°E, 60°S–90°N. 관측소 편차를 각거리 가중(ADW)으로 내삽한 뒤
    CRU CL v1.0(1961~1990년) 기후값을 더해 절댓값으로 만듭니다.
  vertical: 지표 단일층(지상 기온 등)
  temporal: 월 (1901년 1월부터). 파일은 10년 단위 묶음과 전 기간 묶음이 함께 제공됩니다

update: 매년 1회 새 버전 (v4.08 2024-06-27, v4.09 2025-03-19, v4.10 2026-06-07)
license: >-
  v4.10(CRU 누리집): Open Database License, 개별 내용은 Database Contents License — 출처 'Climatic Research Unit, University of East Anglia' 표기·동일 조건 공유.
  v4.09 이전(CEDA): Open Government Licence v3.0, 이용 목적 제한 없음, CEDA 인용 문구 사용
account_required: false

summary: >-
  CRU TS는 전 세계 4,000개 이상 관측소의 월별 자료를 0.5° 육지 격자로 내삽한 1901년~최근의 월별 기후 자료입니다.
  평균·최고·최저 기온, 일교차, 강수량, 강수일수, 증기압, 운량, 서리일수, 잠재증발산량 10개 변수를 함께 제공해, 기후 영향·생태·농업·수문 연구와
  모델 검증에 오래 쓰여 왔습니다. 관측이 없는 격자는 기후값으로 채우므로 결측은 없지만, 격자마다 내삽에 쓴 관측소 수(`stn`)를 함께 제공합니다.

time_convention:
  summary: >-
    모든 값은 월 단위입니다. 기온·일교차·증기압·운량은 그달의 평균, 강수량은 그달 합계(mm/month), 강수일수·서리일수는 그달의 날 수(days)이고,
    잠재증발산량은 그달 평균 일량(mm/day)입니다. 최고·최저 기온은 그달 '일최고·일최저 기온의 평균'이며 월 극값이 아닙니다.
  points:
    - "`tmx` = `tmp` + 0.5 × `dtr`, `tmn` = `tmp` − 0.5 × `dtr`로 계산한 파생 변수입니다."
    - "`pet`(mm/day)을 월 합계로 바꾸려면 그달 일수를 곱하세요. `pre`는 이미 월 합계(mm/month)입니다."
    - "`wet`는 하루 0.1 mm 이상 강수가 있었던 날 수입니다."
    - "관측소가 없는 격자(`stn` = 0)는 1961~1990년 기후값이 그대로 들어가 편차가 0입니다. 결측이 없다고 해서 관측이 있었다는 뜻은 아닙니다."
    - "netCDF의 time 좌표가 달 안의 어느 날짜를 가리키는지는 공식 문서에 적혀 있지 않습니다. 월 단위로만 다루세요."
  source: https://doi.org/10.1038/s41597-020-0453-3
  source_name: Harris et al. (2020) Scientific Data + CEDA CRU TS 변수 목록

variables:
  note: >-
    CEDA 데이터셋 기록의 변수 이름·단위 기준입니다. netCDF 파일마다 변수 하나와 내삽에 쓴 관측소 수 `stn`(0~8, 정수)이 함께 들어 있고(`pet`에는 없음),
    ASCII판은 `stn` 파일이 따로 있습니다. v4.08부터는 대부분 변수에 내삽 품질 지표 MAE·MAEA 파일(*.mae.gz, *.maea.gz)도 제공합니다.
    TMP·DTR·PRE는 관측만으로 만든 1차 변수, VAP·WET·CLD는 관측이 드문 곳에 다른 변수로 만든 합성값을 섞은 2차 변수, TMN·TMX·FRS·PET는 다른 변수에서 계산한 파생 변수입니다.
  full_list: https://catalogue.ceda.ac.uk/uuid/9cf07e92afaa405da4f40b6733f362d3/
  groups:
    - name: 기온 (월평균)
      kind: mean
      period: 월
      items:
        - "평균 기온 — `tmp` (degrees Celsius)"
        - text: "최고 기온 — `tmx` (degrees Celsius)"
          note: 일최고기온의 월평균, tmp + 0.5×dtr로 계산
        - text: "최저 기온 — `tmn` (degrees Celsius)"
          note: 일최저기온의 월평균, tmp − 0.5×dtr로 계산
        - "일교차 — `dtr` (degrees Celsius)"
    - name: 강수·수분 (월합계·일수)
      kind: accum
      period: 월
      items:
        - "강수량 — `pre` (mm/month)"
        - text: "강수일수 — `wet` (days)"
          note: 하루 0.1 mm 이상인 날 수
        - text: "증기압 — `vap` (hPa)"
          kind: mean
    - name: 구름·서리·증발산
      kind: mean
      period: 월
      items:
        - "운량 — `cld` (percentage)"
        - text: "서리일수 — `frs` (days)"
          kind: accum
          note: 일최저기온 격자값에서 경험식으로 계산한 파생 변수
        - text: "잠재증발산량 — `pet` (mm/day)"
          note: "FAO-56 Penman-Monteith 식(tmp, vap, cld, 바람)으로 계산한 그달 평균 일량"

access:
  - name: CEDA Archive (CRU TS 보관처)
    url: https://catalogue.ceda.ac.uk/uuid/9cf07e92afaa405da4f40b6733f362d3/
    method: 웹 다운로드 (무료 CEDA 계정 로그인)
    note: >-
      CRU가 우선 권하는 정식 보관처입니다. v4.09는 data.ceda.ac.uk/badc/cru/data/cru_ts/cru_ts_4.09/ 아래 586개 파일(약 14 GB)이 있습니다.
      2026-10-12 확인 시 v4.10은 아직 CEDA에 등록되지 않았습니다.
  - name: CRU 누리집 — CRU TS v4.10
    url: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/
    login: false
    method: HTTPS 직접 다운로드 (로그인 없음)
    note: >-
      CEDA로 받을 수 없거나 해당 버전이 아직 CEDA에 없을 때 쓰라는 사본입니다. 변수별 폴더에 netCDF(*.dat.nc.gz)와 ASCII, stn·mae·maea 파일이
      10년 단위와 전 기간(1901~2025)으로 있습니다. 먼저 Release_Notes_CRU_TS_4.10.txt를 읽으세요. 국가별 평균 CRU CY도 함께 있습니다.
  - name: CRU 고해상도 격자 자료 안내 (버전 목록)
    url: https://crudata.uea.ac.uk/cru/data/hrg/
    method: 웹 안내
    note: 이전 버전 폴더(cru_ts_4.09/, cru_ts_4.08/ …)와 Google Earth 인터페이스로 가는 시작 페이지입니다.

example:
  lang: python
  note: >-
    CRU 누리집에서 평균 기온 전 기간 netCDF(gzip 압축)를 받아 한반도 영역 연평균을 계산하는 예입니다. 파일 이름은 v4.08까지의
    'cru_ts4.xx.1901.YYYY.var.dat.nc.gz' 형식을 따랐으니, 실제 이름은 폴더 목록에서 확인하세요.
  code: |
    import gzip, shutil, urllib.request
    import xarray as xr

    base = "https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/cruts.2604091129.v4.10/tmp/"
    name = "cru_ts4.10.1901.2025.tmp.dat.nc"
    urllib.request.urlretrieve(base + name + ".gz", name + ".gz")
    with gzip.open(name + ".gz", "rb") as fi, open(name, "wb") as fo:
        shutil.copyfileobj(fi, fo)

    ds = xr.open_dataset(name)
    kor = ds.sel(lat=slice(33, 39), lon=slice(124, 132))
    tmp = kor["tmp"].where(kor["stn"] > 0)   # 관측소 없이 기후값으로 채운 격자 제외
    print(tmp.groupby("time.year").mean().mean(["lat", "lon"]).sel(year=slice(1991, 2025)))

tips:
  - "결측이 없는 대신, 관측소가 없는 격자는 1961~1990년 기후값으로 채워져 편차가 0입니다. 추세·변동 분석에서는 `stn` = 0인 격자를 빼거나 비율을 함께 보고하세요. 특히 20세기 초와 관측이 드문 지역에서 중요합니다."
  - "`tmx`·`tmn`은 그달 일최고·일최저의 평균입니다. 폭염·한파 같은 극값 연구에는 일 자료를 쓰세요."
  - "버전마다 과거 값도 조금씩 바뀝니다(관측소 추가·품질 관리·내삽 방식 변경). v4.08에서 TMP·PRE, v4.09에서 DTR에 '코호트' 관측소 선택이 도입되었고 PRE는 v4.09에서 다시 이전 방식으로 돌아갔습니다. 버전을 섞지 말고 논문에 버전을 명시하세요."
  - "최근 몇 달 값은 CLIMAT 보고 위주로 만들어 관측소가 적습니다. v4.09는 2024년 12월 일부 관측에 품질 관리 전 DWD CLIMAT 자료를 썼다고 밝혔습니다."
  - "VAP·WET·CLD는 관측이 드문 곳에서 기온·일교차 등으로 만든 합성값이 섞여 있고, FRS·PET는 전부 계산값입니다. 이 변수들의 장기 추세는 기온 추세를 일부 반영할 수 있습니다."
  - "CEDA의 v4.09까지와 CRU 누리집의 v4.10은 이용 조건이 다릅니다(OGL v3.0 → ODbL). 가공 자료를 배포한다면 v4.10의 출처 표시·동일 조건 공유 조건을 확인하세요."
  - "10년 단위 파일은 새 버전이 나오면 보관되지 않을 수 있습니다. 재현성을 위해 쓴 파일을 따로 보관하세요."

