notices:
  - date: "2026-06-07"
    level: info
    title: CRU TS v4.10 공개 (1901~2025년) — CEDA 등록·버전 DOI는 아직
    body: >-
      2025년까지 늘린 v4.10이 CRU 누리집에 공개되었습니다. 처리 방식은 v4.09와 같고(주 내삽 알고리즘은 v4.03 이후 그대로),
      2025년 CLIMAT 관측은 MCDW, 호주 최고·최저 기온은 BoM 자료를 썼습니다. CRU는 CEDA 등록 후 버전별 DOI를 게시하겠다고 밝혔습니다.
      관리 담당은 은퇴한 Ian Harris를 이어 Andrew Friedman(Tim Osborn 지도)이 맡습니다.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/Release_Notes_CRU_TS_4.10.txt
  - date: "2026-06-07"
    level: warning
    title: v4.10부터 이용 조건 변경 — Open Government Licence → Open Database License
    body: >-
      v4.09까지 CRU 누리집과 CEDA는 Open Government Licence를 적용했지만, v4.10 페이지는 Open Database License(개별 내용은 Database Contents License)로 바뀌었고
      출처 표시 문구도 'Climatic Research Unit, University of East Anglia'로 바뀌었습니다. 가공 자료를 배포한다면 동일 조건 공유 조건을 확인하세요.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.10/
  - date: "2025-03-19"
    level: info
    title: CRU TS v4.09 공개 (1901~2024년), CEDA 등록 2025-04-17
    body: >-
      v4.08에서 TMP·PRE에 도입한 '코호트' 관측소 선택을 DTR로 넓혔고, PRE는 관측이 드문 곳에 이상한 패턴이 생겨 코호트 방식을 중단했습니다.
      2024년 12월 MCDW 자료 공백은 품질 관리 전 DWD CLIMAT 자료로 채운 뒤 CRU 품질 관리를 거쳤습니다.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.09/Release_Notes_CRU_TS_4.09.txt
  - date: "2024-06-27"
    level: info
    title: CRU TS v4.08 공개 — 코호트 관측소 선택, MAE·MAEA 품질 변수 추가
    body: >-
      TMP·PRE의 내삽 관측소를 가까운 순서가 아니라 변동 특성이 비슷한 관측소(코호트)로 고르도록 바꿔 주기적인 과도한 변동을 줄였고,
      대부분 변수에 MAE·MAEA 품질 지표를 추가했습니다. 6월 24일 일부 공개 뒤 DTR 관련 불일치가 발견되어 전체를 다시 계산했습니다.
    source: https://crudata.uea.ac.uk/cru/data/hrg/cru_ts_4.08/Release_Notes_CRU_TS_4.08.txt

