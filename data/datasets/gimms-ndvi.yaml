# ─────────────────────────────────────────────────────────────
# GIMMS NDVI (NDVI3g → GIMMS-3G+ V1.2, PKU GIMMS NDVI) — 데이터셋 정보 파일
# 지면 탭 '식생'. NDVI3g v1(~2015)의 공식 후속 GIMMS-3G+와 베이징대 재보정판 PKU GIMMS NDVI가 모두 2022년 12월에서 멈춰 '갱신 종료'로 분류했습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: gimms-ndvi
name: "GIMMS NDVI"
full_name: Global Inventory Modeling and Mapping Studies (GIMMS) AVHRR NDVI — NDVI3g v1(1981~2015)과 후속 GIMMS-3G+ V1.2(1982~2022), 베이징대 재보정판 PKU GIMMS NDVI(1982~2022) (1/12°·반월 최대값 합성)
category: satellite
domain: land
group: 식생
order: 40
also_in:
  - domain: satellite
    group: 지면
domains: [육지, 원격탐사]
provider: NASA GSFC GIMMS 그룹(Pinzon·Tucker) / NASA ORNL DAAC 배포 (PKU GIMMS NDVI는 베이징대학 Piao·Zhu 연구진, Zenodo 배포)

status: ended
status_note: >-
  NDVI3g v1은 2015년 12월에서 끝났고, 같은 GIMMS 팀의 후속판 GIMMS-3G+ V1.2(ORNL DAAC, 2023-08-24 공개)와 베이징대 재보정판 PKU GIMMS NDVI V1.2(Zenodo, 2023)도 모두 2022년 12월 자료가 마지막입니다.
  2026-10-13 확인 시 NASA CMR의 GIMMS-3G+ 컬렉션 기간은 2022-12-31에서 끝나고 새 연도·새 판이 등록되어 있지 않으며, 두 자료 모두 연장 계획 공지가 없어 '갱신 종료'로 분류했습니다.
  1980년대부터의 장기 NDVI 기록으로는 여전히 표준적으로 쓰이지만, 2023년 이후는 다른 자료로 이어야 합니다.
successor:
  name: 없음 (공식 후속 미발표)
  url: https://daac.ornl.gov/cgi-bin/dsviewer.pl?ds_id=2187
  note: >-
    GIMMS 팀이 2022년 이후를 잇는 새 판을 발표하지 않았습니다. 2023년 이후 NDVI가 필요하면 VIIRS 식생지수(viirs-vi) 같은 현역 위성 NDVI를 쓰되,
    센서·합성 방식·해상도가 달라 GIMMS 기록에 그대로 이어 붙이지 말고 겹치는 기간으로 보정·검토하세요.

period:
  start: "1982-01"
  end: "2022-12"
  note: >-
    GIMMS-3G+ V1.2는 NASA CMR 기준 1982-01-01~2022-12-31입니다(ORNL 자료 제목은 '1981-2022'로 되어 있으나 파일은 1982년부터).
    PKU GIMMS NDVI는 AVHRR 단독판 1982-01~2015-12, MODIS 결합판 1982-01~2022-12입니다.
    갱신이 끝난 NDVI3g v1은 1981-07~2015-12(NCAR Climate Data Guide 기준), 그 이전 판 NDVI3g(v0)은 2013-12까지입니다.

resolution:
  spatial_short: "9 km (0.083°)"
  temporal_short: "15일"
  spatial: "1/12°(0.0833°) 전지구 위경도 격자(WGS84, 화소 중심 좌표, 4320 × 2160) — GIMMS-3G+·NDVI3g·PKU GIMMS NDVI 공통"
  vertical: 지표 단일층
  temporal: "반월(한 달 2개) 최대값 합성 — GIMMS-3G+ 기준 1~15일, 16일~말일. GIMMS-3G+ 파일은 6개월(합성 12개)씩 묶음(파일 이름 _0106, _0712)"

coverage:
  short: 전지구
update: 갱신 종료 (GIMMS-3G+·PKU 모두 2022-12 자료가 마지막, 연장 계획 미발표)
license: "GIMMS-3G+: NASA EOSDIS 자료 이용·인용 지침에 따라 제한 없이 공개(내려받기는 무료 NASA Earthdata 로그인) / PKU GIMMS NDVI: CC BY 4.0"
account_required: true

summary: >-
  GIMMS NDVI는 1981년부터 NOAA·MetOp 위성의 AVHRR 관측을 이어 붙여 센서 간 보정, 궤도 표류·화산 에어로졸 영향 보정을 거친 전지구 1/12° 반월 NDVI 기록으로,
  40년 넘는 식생 녹색도 추세·생물계절 연구의 기준 자료로 쓰여 왔습니다. 제3세대 NDVI3g는 v1(2015년까지)에서 멈췄고,
  NASA GIMMS 팀은 2023년 2022년까지 연장·수정한 GIMMS-3G+ V1.2를 ORNL DAAC에 공개했습니다. 별도로 베이징대 연구진이 NDVI3g를 Landsat으로 재보정하고
  2003년 이후를 MODIS로 이은 PKU GIMMS NDVI(1982~2022)를 냈습니다. 세 자료 모두 2022년 이후로는 연장되지 않았습니다.

time_convention:
  summary: >-
    각 값은 반월(1~15일 또는 16일~말일) 동안의 일별 NDVI 중 최대값을 고른 최대값 합성(MVC)입니다. 구름·대기 영향을 줄이려는 방식이라 그 기간의 평균보다 높게 나옵니다.
    GIMMS-3G+의 `time`은 합성 기간의 가운데 날(1982-01-01 기준 일수)이고, `time_bnds`에 시작·끝 날이 있습니다.
  points:
    - "GIMMS-3G+ 파일 하나에 6개월치 합성 12개가 들어 있습니다(예 ndvi3g_geo_v1_2_2021_0712.nc4 = 2021년 7~12월). CMR 기준 2014년까지 파일 이름은 v1_1, 2015년부터 v1_2입니다."
    - "여러 NOAA 위성과 MetOp 위성의 AVHRR를 이어 쓰므로 위성마다 관측 시각·태양 천정각이 다르고 궤도 표류로 바뀌기도 합니다. 공식 안내서는 센서·궤도 표류·태양 천정각 편향을 줄였지만 완전히 없애지는 못했다고 밝힙니다."
    - "결측·구름 화소는 스플라인 보간이나 평년 계절 곡선으로 채워져 있고, 그 여부는 `percentile` 변수 안의 플래그(값 ÷ 2000의 몫)로 알 수 있습니다."
    - "PKU GIMMS NDVI도 반월 최대값 합성 체계이며, 2003년 이후 결합판은 MODIS 16일 합성(MOD13C1)을 시간 가중으로 반월에 배분한 뒤 1/12°로 옮긴 값입니다."
  source: https://daac.ornl.gov/VEGETATION/guides/Global_Veg_Greenness_GIMMS_3G.html
  source_name: "ORNL DAAC — Global Vegetation Greenness (NDVI) from AVHRR GIMMS-3G+, 1981-2022 (안내서) + Li et al. (2023) ESSD"

variables:
  note: >-
    GIMMS-3G+는 ORNL DAAC 안내서의 netCDF4 변수표 기준입니다. 정수 변수의 채움값은 −32768입니다. PKU GIMMS NDVI는 변수 이름이 없는 GeoTIFF(uint16)라
    밴드 이름 대신 내용만 적었습니다(Zenodo 설명 기준). NDVI3g v1의 변수 구성은 공식 문서로 확인하지 못해 적지 않았습니다.
  full_list: https://daac.ornl.gov/VEGETATION/guides/Global_Veg_Greenness_GIMMS_3G.html
  groups:
    - name: GIMMS-3G+ V1.2 (NASA, 1982~2022)
      kind: max
      period: 반월 (1~15일, 16일~말일)
      items:
        - text: "정규식생지수 NDVI — `ndvi` (무차원, 저장값 ÷ 10000)"
          note: "유효 범위 −0.03~1.0. −5000은 NDVI를 계산할 수 없었던 화소"
        - text: "백분위·품질 플래그 — `percentile` (부호화 정수)"
          kind: instant
          note: "값 = 백분위×10 + 플래그×2000. 플래그 0 양호, 1 스플라인 보간, 2 평년 계절 곡선(눈·구름 가능), 3 결측. 백분위 기준 기간 1982~2021"
        - text: "기여한 위성 수 — `satellites` (개)"
          kind: instant
          note: 해당 합성 기간에 쓰인 플랫폼 수
    - name: PKU GIMMS NDVI V1.2 (베이징대, AVHRR 단독 1982~2015 / MODIS 결합 1982~2022)
      kind: max
      period: 반월
      items:
        - text: "Landsat 기준으로 재보정한 NDVI (무차원, 저장값 × 0.001)"
          note: "GeoTIFF uint16, 유효 0–1000, 채움 65535. 결합판의 2003년 이후는 MODIS MOD13C1 기반. 변수 이름이 없는 GeoTIFF 밴드라 변수명 칸은 비움. NDVI·QC가 몇 번째 밴드(또는 별도 파일)인지는 Zenodo 동봉 Readme PDF에만 있고 Zenodo 설명·ESSD 논문에는 없어 확인하지 못함"
        - text: "품질 관리(QC) 층"
          kind: instant
          note: Zenodo 설명은 QC 층을 함께 쓰라고 권하지만 값의 의미는 동봉 Readme에만 있어 여기서는 확인하지 못했습니다

