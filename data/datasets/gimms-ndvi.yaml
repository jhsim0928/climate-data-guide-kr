    GIMMS-3G+를 쓰면 ORNL DAAC 데이터셋 DOI(10.3334/ORNLDAAC/2187)를 EOSDIS 자료 인용 지침에 따라 인용하고, 방법 설명에는 Pinzon & Tucker (2014)를 함께 듭니다.
    PKU GIMMS NDVI를 쓰면 Zenodo DOI와 Li et al. (2023) ESSD 논문을 인용하세요. 어느 판(NDVI3g v1, GIMMS-3G+ V1.2, PKU V1.2)을 썼는지 본문에 밝히는 것이 중요합니다.

transitions:
  - from: GIMMS NDVI3g v1
    to: GIMMS-3G+ V1.2
    status: completed
    date: "2023-08"
    summary: >-
      같은 NASA GIMMS 팀이 NDVI3g 기록을 2022년까지 늘리고 보정을 고쳐 ORNL DAAC에 공개한 후속판입니다. 격자(1/12°)와 반월 최대값 합성 체계는 같지만,
      배포처가 바뀌어 ORNL DAAC DOI가 생겼고 MetOp AVHRR가 들어갔으며 일부 보정이 수정되었습니다. 이 판도 2022년 12월에서 멈췄습니다.
    changes:
      - aspect: 기간
        before: "1981-07~2015-12"
        after: "1982-01~2022-12 (CMR 기준)"
      - aspect: 입력 위성
        before: "NOAA 위성 AVHRR (NOAA-7·9·11·14·16·17·18 등)"
        after: "NOAA 위성 + EUMETSAT MetOp 위성 AVHRR"
      - aspect: 보정 수정 (ORNL 안내서가 든 세 가지)
        before: "이전 판(안내서 표기 'Version 0')은 북반구 겨울 눈 덮인 지역의 음(−) NDVI를 0으로 가려 생물계절 지표에 인공 흔적 / 2006년 이후 보정 문제로 NDVI 하락 흔적 / 해안선 화소 결측"
        after: "음의 NDVI 복원 / SeaWiFS 전 기간 육상 산출물 재처리로 2006년 이후 하락 완화 / 해안 화소 시계열 보정"
      - aspect: 배포·식별자
        before: "NASA NEX 프로젝트 서버 배포, 데이터셋 DOI 없음"
        after: "NASA ORNL DAAC(Earthdata Cloud) — DOI 10.3334/ORNLDAAC/2187, CMR short name Global_Veg_Greenness_GIMMS_3G_2187"
      - aspect: 파일 구성
        before: "반기별 netCDF4 (CF 규약을 따르지 않음 — NCAR Climate Data Guide)"
        after: "반기별 netCDF4 ndvi3g_geo_v1_2_YYYY_0106/0712.nc4 (1982~2014년은 v1_1 파일 이름), 변수 ndvi·percentile·satellites·time_bnds"
    impacts:
      - NDVI3g v1과 GIMMS-3G+를 한 시계열로 섞지 말고 1982년부터 GIMMS-3G+로 다시 받으세요. 겨울철 고위도 NDVI와 2006년 이후 값이 특히 다릅니다.
      - 파일 안에서 2014년까지(v1_1)와 2015년부터(v1_2)의 판 표기가 다르지만 ORNL은 하나의 데이터셋(V1.2)으로 배포합니다. 판 표기를 근거로 기간을 잘라 쓰지 않도록 주의하세요.
      - 2023년 이후는 GIMMS-3G+로도 이을 수 없습니다.
    sources:
      - name: ORNL DAAC 안내서 — Global Vegetation Greenness (NDVI) from AVHRR GIMMS-3G+, 1981-2022
        url: https://daac.ornl.gov/VEGETATION/guides/Global_Veg_Greenness_GIMMS_3G.html
      - name: Pinzon & Tucker (2014), NDVI3g
        url: https://doi.org/10.3390/rs6086929
      - name: NCAR Climate Data Guide — NDVI3g
        url: https://climatedataguide.ucar.edu/climate-data/ndvi-normalized-difference-vegetation-index-3rd-generation-nasagfsc-gimms
  - from: GIMMS NDVI3g v1
    to: PKU GIMMS NDVI V1.2 (베이징대)
    status: completed
    date: "2023-08"
    summary: >-
      NASA 공식판이 아닌 베이징대 연구진의 재보정판입니다. NDVI3g v1을 Landsat NDVI 약 360만 표본에 맞춘 생물군계별 신경망(BPNN)으로 다시 보정해 궤도 표류·센서 열화 흔적을 줄였고,
      2003년 이후는 MODIS NDVI로 이어 2022년까지 늘렸습니다. 2015년 이후 NDVI3g 갱신이 멈추자 나온 대안이며, 역시 2022년에서 멈췄습니다.
    changes:
      - aspect: 기간·구성
        before: "1981-07~2015-12, AVHRR만"
        after: "AVHRR 단독판 1982-01~2015-12 / MODIS 결합판 1982-01~2022-12 (1982~2002 AVHRR 기반, 2003~2022 MODIS MOD13C1 V6.1 기반, 2003~2015 겹침으로 화소별 랜덤포레스트 연결)"
      - aspect: 보정 기준
        before: "AVHRR 센서 간 보정 (Pinzon & Tucker 2014 방식)"
        after: "Landsat 5·7·8 NDVI(Landsat 7 수준으로 상호보정)에 맞춘 생물군계별 신경망 재보정"
      - aspect: Landsat 대비 정확도 (1984~2015)
        before: "R² 0.94, RMSE 0.09, MAPE 20%"
        after: "R² 0.97, RMSE 0.05, MAPE 9% — 열대 상록활엽수림 R² 0.16 → 0.47"
      - aspect: 파일 형식·라이선스
        before: "netCDF4, NASA 공개 자료"
        after: "GeoTIFF(uint16, ×0.001, 채움 65535), CC BY 4.0, Zenodo DOI 10.5281/zenodo.8253971"
    impacts:
      - PKU판은 NASA GIMMS-3G+와 별개의 2차 가공 자료입니다. 두 자료의 추세가 다를 수 있으니 결론이 한 자료에만 기대지 않도록 비교해 보세요.
      - 결합판은 2003년부터 MODIS 값이므로 Terra MODIS의 특성(궤도 표류 포함)이 그대로 들어갑니다. AVHRR만의 일관성이 필요하면 단독판(~2015)을 쓰세요.
      - 2023년 이후 연장 공지는 없습니다(2026-10-13 확인 시 Zenodo 최신판 V1.2).
    sources:
      - name: Li et al. (2023), ESSD — PKU GIMMS NDVI
        url: https://doi.org/10.5194/essd-15-4181-2023
      - name: Zenodo — PKU GIMMS NDVI V1.2
        url: https://doi.org/10.5281/zenodo.8253971

notices:
  - date: "2023-08-24"
    level: info
    title: NASA ORNL DAAC, GIMMS-3G+ V1.2(1982~2022) 공개 — NDVI3g v1 후속
    body: >-
      GIMMS 팀의 AVHRR NDVI가 2022년까지 연장·수정된 GIMMS-3G+ V1.2로 ORNL DAAC에 공개되었습니다(DOI 10.3334/ORNLDAAC/2187).
      2026-10-13 확인 시 이 데이터셋은 2022-12-31 이후로 갱신되지 않았고 새 판도 등록되어 있지 않습니다.
    source: https://daac.ornl.gov/cgi-bin/dsviewer.pl?ds_id=2187
  - date: "2023-08-17"
    level: info
    title: PKU GIMMS NDVI V1.2(1982~2022) Zenodo 공개
    body: >-
      베이징대 연구진이 NDVI3g를 Landsat으로 재보정하고 2003년 이후를 MODIS로 이은 PKU GIMMS NDVI를 V1.2로 갱신해 공개했습니다(AVHRR 단독판 1982~2015, MODIS 결합판 1982~2022).
      2026-10-13 확인 시 이후 판은 나오지 않았습니다.
    source: https://doi.org/10.5281/zenodo.8253971

