example:
  lang: python
  note: >-
    earthaccess로 GIMMS-3G+ 2021년 하반기 파일을 받아 한반도 NDVI와 품질 플래그를 푸는 예입니다. 처음 실행 때 Earthdata 아이디·비밀번호를 묻습니다.
    저장값 규칙(÷10000, −32768 채움, −5000 계산 불가)을 직접 적용하려고 자동 척도 변환을 끄고 엽니다.
  code: |
    import earthaccess
    import xarray as xr

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="Global_Veg_Greenness_GIMMS_3G_2187", version="1",
        temporal=("2021-07-01", "2021-12-31"),
    )
    files = earthaccess.download(results, "gimms3g_plus")

    ds = xr.open_dataset(files[0], mask_and_scale=False)
    sub = ds.sel(lon=slice(124, 132))
    sub = sub.sel(lat=slice(33, 39)) if sub.lat[0] < sub.lat[-1] else sub.sel(lat=slice(39, 33))

    raw = sub["ndvi"]
    ndvi = (raw.where((raw != -32768) & (raw != -5000)) / 10000.0)
    pct = sub["percentile"]
    flag = pct // 2000                      # 0 양호, 1 스플라인, 2 계절 곡선, 3 결측
    ndvi_good = ndvi.where(flag == 0)
    print(ndvi_good.mean(dim=("lat", "lon")).values)   # 반월 합성 12개의 영역 평균

tips:
  - "반월 최대값 합성(MVC)이라 같은 기간의 평균 NDVI보다 높게 나옵니다. 월값을 만들 때 두 합성의 최대값을 썼는지 평균을 썼는지 논문에 밝히세요."
  - "NDVI3g v1(2015년까지), GIMMS-3G+(2022년까지), PKU GIMMS NDVI는 같은 AVHRR 원자료에서 나왔지만 보정이 달라 값이 다릅니다. 판을 섞지 말고 논문에 정확한 판 이름과 DOI를 적으세요."
  - "공식 안내서는 피나투보 화산(1991년) 같은 대기 영향과 센서 보정·궤도 표류·태양 천정각 편향이 완전히 제거되지 않았다고 밝힙니다. 장기 추세는 위성 교체 시점과 함께 점검하세요."
  - "PKU 연구진은 열대 상록활엽수림에서 NDVI3g의 궤도 표류·센서 열화 흔적이 컸다고 보고했습니다. 열대림 추세 분석에는 PKU판과 GIMMS-3G+를 비교해 보세요."
  - "PKU 결합판은 2003년부터 MODIS 값이라 그 이전과 원자료가 다릅니다. 1982~2015년 AVHRR만의 일관성이 중요하면 AVHRR 단독판(solely)을 쓰세요. Zenodo 설명은 추세 분석 때 NDVI 0.1 미만의 희박 식생을 빼라고 권합니다."
  - "2023년 이후는 GIMMS 계열 자료가 없습니다. VIIRS·MODIS NDVI로 잇는다면 겹치는 기간(예 2012~2022)으로 차이를 먼저 확인하세요."

