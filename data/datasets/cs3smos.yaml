# ─────────────────────────────────────────────────────────────
# CS3SMOS — 데이터셋 정보 파일
# AWI CryoSat-2 + Sentinel-3A/B + SMOS 병합 주간 해빙 두께 (v300, CS2SMOS v206의 후속, 2025-10-23 운영 시작)
# ─────────────────────────────────────────────────────────────
id: cs3smos
name: CS3SMOS
full_name: CryoSat-2/Sentinel-3/SMOS Merged Sea Ice Thickness (CS3SMOS, v300; CryoSat-2·Sentinel-3A/B·SMOS 병합 주간 해빙 두께)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 35
also_in:
  - domain: satellite
    group: 해빙
domains: [해빙]
provider: 독일 알프레드 베게너 연구소(AWI) — ESA CS2SMOS-PDS 과제 / Copernicus Marine(FMI) 재배포 — 원자료 ESA CryoSat-2·SMOS, Copernicus Sentinel-3A/B

status: active
status_note: >-
  CS2SMOS v206을 대체한 v300으로, AWI가 2025-10-23부터 북극 준실시간 생산을 시작했고 2025/26 북극 시즌은 2026-04-09~15 주간장을 끝으로 마쳤습니다.
  계절 산출 자료라 여름철 공백은 정상이며, 남반구는 4/15~10/15에 만들어집니다(Copernicus Marine 남반구 데이터셋은 2026-10-06까지 갱신).
  2026/27 북극 시즌은 AWI가 2026-10-30에 준실시간 처리를 시작했습니다(입력 자료 공백으로 7일 지연, 첫 두께장 10/15~10/22).

period:
  start: "2023-10"
  end: present
  note: >-
    공개 배포본 기준입니다. Copernicus Marine(SEAICE_GLO_PHY_L4_NRT_011_014) 북반구 v300 자료가 2023-10-18부터, 남반구가 2025-04-18부터 있고,
    AWI 준실시간 운영은 2025/26 겨울(첫 주간장 2025-10-15~21)부터입니다. 북반구는 10/15~4/15, 남반구는 4/15~10/15만 있습니다.
    AWI가 학회 발표(ESA LPS25)에서 2010년 이후 15년 기록을 소개했지만, 그 전체 재처리본의 공개 위치는 공식 페이지에서 확인되지 않습니다.

resolution:
  spatial_short: "12.5 km (0.11°)"
  temporal_short: "7일"
  spatial: >-
    12.5 km EASE-Grid 2.0 격자(Lambert 정적 방위 등적도법, WGS 84) — 북반구 "WGS 84 / NSIDC EASE-Grid 2.0 North"(EPSG:6931),
    남반구 "… South"(EPSG:6932), 864×864(xc, yc). Copernicus Marine 기본 제공본은 0.1° 위경도 좌표이며 원래 격자는 originalGrid 부분으로 따로 제공
  vertical: 해당 없음 (두께 단일 값)
  temporal: 7일 관측 창(UTC 달력일)의 주간 평균장을 매일 산출 — 시각 표기는 창 4번째 날 12:00 UTC(창 중심)

coverage:
  short: 양극
update: >-
  결빙기 동안 매일(북반구 10/15~4/15, 남반구 4/15~10/15). 준실시간('o') 파일은 7일 창 종료 약 2일 뒤 생산,
  Copernicus Marine에는 약 5일 지연 후 12 UTC 전 갱신
license: >-
  AWI 배포본은 별도 라이선스 표기 없이 Ricker et al. (2017) 인용과 감사 문구를 요청 /
  Copernicus Marine 배포본은 Copernicus Marine Service 이용 약관(Commitments and Licence)
account_required: false

summary: >-
  CryoSat-2·Sentinel-3A/B 레이더 고도계의 두꺼운 얼음 두께와 SMOS L-band 복사계의 얇은 얼음 두께를 최적 내삽으로 합친 주간 해빙 두께 자료로,
  CS2SMOS(v206)를 잇는 v300입니다. 해상도가 12.5 km로 높아졌고 처음으로 남극 겨울 두께도 만들며, 파일은 해빙 부피 계산에 필요한 변수 위주로 단순해졌습니다.
  AWI가 ESA 과제로 생산해 AWI FTP에 올리고, Copernicus Marine이 준실시간 L4 자료(SEAICE_GLO_PHY_L4_NRT_011_014)로 재배포합니다.

time_convention:
  summary: >-
    파일 하나는 7일 관측 창(파일 이름의 시작일~종료일, UTC 달력일)의 관측을 합친 주간 평균장이며, 시각은 창의 중심인 4번째 날 12:00 UTC로 표기합니다.
    창을 하루씩 옮겨 매일 새 파일을 만들기 때문에 이웃한 날짜의 파일은 6일이 겹칩니다.
  points:
    - "예: AWI 마지막 2025/26 북극 장 20260409_20260415의 기준 시각은 2026-04-12 12:00 UTC입니다. 북반구 기준일은 10-18 ~ 04-12, 남반구는 04-18 ~ 10-12입니다."
    - "`time`은 창 중심 시각, `time_bnds`는 7일 창의 경계입니다(seconds since 1970-01-01). 날짜를 맞출 때 파일 이름의 시작일을 기준 날짜로 쓰면 3.5일 어긋납니다."
    - "최적 내삽의 배경장은 준실시간판에서 관측 창 시작 전 14일 자료로 만들고, 재처리판은 창 뒤 14일도 씁니다. 운영('o') 파일은 과거 자료만 쓰므로 나중의 재처리본과 값이 다를 수 있습니다."
    - "고도계(CryoSat-2·Sentinel-3A/B) 자료는 AWI v2.6 처리 체계에서 먼저 일별 격자로 모은 뒤 병합합니다. 해빙 농도도 같은 7일 창의 평균입니다."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-SEAICE-PUM-011-014.pdf
  source_name: Copernicus Marine PUM / QUID (SEAICE_GLO_PHY_L4_NRT_011_014, v300) · AWI CS3SMOS 변경 이력

variables:
  note: >-
    Copernicus Marine 제품 설명서(PUM)의 v300 파일 헤더와 Copernicus Marine 메타데이터에서 확인한 변수입니다. AWI는 v300에서 파일 구성을
    해빙 부피 계산에 필요한 변수 위주로 줄였다고 밝혔으며, v206의 배경장·innovation·위성별 두께 변수는 이 목록에 없습니다.
  full_list: https://documentation.marine.copernicus.eu/PUM/CMEMS-SEAICE-PUM-011-014.pdf
  groups:
    - name: 병합 두께
      kind: mean
      period: 7일
      items:
        - text: "해빙 두께 — `sea_ice_thickness` (m)"
          note: 7일 창의 고도계·SMOS 두께를 배경장과 최적 내삽으로 합친 값. 격자 칸의 얼음 덮인 부분 평균 두께(개빙 구역 제외)
        - text: "해빙 두께 불확실성 — `sea_ice_thickness_uncertainty` (m)"
          note: 같은 7일 분석값의 불확실성. v300 불확실성 모델 기준이라 v206 값과 직접 비교하지 않음
    - name: 보조 정보·플래그
      kind: mean
      period: 7일
      items:
        - text: "해빙 농도 — `sea_ice_concentration` (%)"
          note: 같은 7일 창 동안의 OSI SAF 해빙 농도 평균
        - text: "산출 상태 플래그(0 정상, 1 개빙 해역, 2 육지·호수·육상 빙하, 3 산출 실패) — `status_flag` (코드값)"
          note: 해당 7일 분석장에 대한 플래그
        - text: "품질 플래그(0 고도계+복사계, 1 고도계만, 2 복사계만, 3 내삽, 4 해빙 없음) — `quality_flag` (코드값)"
          note: 해당 7일 창에 어떤 관측이 들어갔는지 표시. RFI 해역 점검에 유용
        - text: "격자 안 바다 비율(0–1) — `density_of_ocean` (1)"
          kind: static
          note: 이름과 달리 밀도가 아니라 육지/바다 비율 마스크. 시간 차원이 없는 고정값(ESA CCI 해빙과 같은 마스크)

