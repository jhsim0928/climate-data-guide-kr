example:
  lang: python
  note: >-
    AWI FTP 또는 Copernicus Marine에서 받은 북반구 v300 파일을 연다고 가정합니다. AWI 원본(퀵룩 이름 기준 W_XX-ESA,SMOS_CS2_S3A_S3B,NH_12P5KM_EASE2_…)과
    Copernicus Marine 파일(W_XX_ESA_SMOS_CS2_NH_12P5KM_EASE2_…)은 이름이 조금 다르므로 끝부분으로 찾습니다.
  code: |
    import glob
    import xarray as xr

    f = sorted(glob.glob("*NH_12P5KM_EASE2_*_v300_01_l4sit.nc"))[-1]
    ds = xr.open_dataset(f)

    sit = ds["sea_ice_thickness"].squeeze()        # m, 얼음 덮인 부분의 평균 두께
    sic = ds["sea_ice_concentration"].squeeze()    # %
    qf = ds["quality_flag"].squeeze()              # 0 고도계+복사계, 1 고도계만, 2 복사계만, 3 내삽, 4 해빙 없음
    ocean = ds["density_of_ocean"]                 # 격자 안 바다 비율(0–1)

    print(ds["time"].values, ds["time_bnds"].values)   # 창 중심 시각과 7일 경계

    # 해빙 부피(km3) = 격자 면적 × 바다 비율 × 농도 × 두께 (PUM 안내 식)
    cell_area = 12.5e3 * 12.5e3                    # m2
    vol = (cell_area * ocean * sic / 100 * sit).sum() / 1e9
    print(f"{float(vol):.0f} km3")

    # SMOS 없이 고도계만으로 추정된 격자 비율 (RFI 해역 점검)
    ice = qf <= 3
    print(float((qf == 1).sum() / ice.sum()))

tips:
  - >-
    v206과 다른 점: 격자가 25 km EASE2 북반구(432×432)에서 12.5 km EASE2 북·남반구(864×864, EPSG:6931/6932)로 바뀌었고, Sentinel-3A/B 고도계가 더해졌으며
    SMOS 입력이 v3.3에서 v3.6으로 올라갔습니다. 육지/바다 마스크도 ESA CCI 해빙 산출물과 같은 것으로 바뀌었습니다.
  - >-
    불확실성 모델이 바뀌었습니다. 고도계 불확실성은 AWI v2.6의 계통·무작위 성분을 반영해 v206보다 크게 나오고, SMOS 불확실성에는 해빙 농도 100% 미만 효과를 더하고
    최소 20 cm로 제한합니다. 불확실성이 커진 것은 품질 저하가 아니므로 v206과 같은 기준으로 자료를 거르지 마세요.
  - >-
    파일 형식이 단순해져 v206의 `analysis_sea_ice_thickness`, `background_sea_ice_thickness`, `innovation`, `smos_sea_ice_thickness`, `cryosat_sea_ice_thickness`
    같은 변수가 없고 `sea_ice_thickness`와 상태·품질 플래그, 바다 비율이 들어 있습니다. 파일 이름도 SMOS_CS2 → SMOS_CS2_S3A_S3B, 25KM → 12P5KM, v206 → v300으로 바뀌어 기존 스크립트를 고쳐야 합니다.
  - >-
    이웃한 날짜 파일은 6일이 겹치는 7일 평균장입니다. 독립 표본이 필요하면 7일 간격으로 골라 쓰고, 날짜는 `time`(창 중심)이나 `time_bnds`로 맞추세요.
  - >-
    ESA SMOS 배포 서버의 L4_SIT_Open 컬렉션은 2025년 4월(v206)까지만 있습니다. v300은 AWI FTP나 Copernicus Marine에서 받으세요.
    C3S Climate Data Store의 'Sea ice thickness gridded data for the Arctic' L4(CryoSat-2·Sentinel-3·SMOS, 북극 10~4월)는 별도 배포본이며,
    Copernicus Marine QUID는 이 제품의 재처리판을 CDS에 공개할 예정이라고 밝히고 있습니다.

