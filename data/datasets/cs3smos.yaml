notices:
  - date: "2026-10-30"
    level: info
    title: AWI CS3SMOS 2026/27 북극 시즌 준실시간 생산 시작 (7일 지연, 첫 두께장 10/15~10/22)
    body: >-
      AWI가 입력 자료 공백(OSI SAF 서비스 메시지: AMSR3 자료 누락)으로 7일 늦게 L4 CS3SMOS 해빙 두께의 2026/27 북극 시즌 운영 처리를 시작했습니다. 첫 두께장은 2026년 10월 15~22일입니다.
      Copernicus Marine 재배포본(SEAICE_GLO_PHY_L4_NRT_011_014)의 재개는 Copernicus Marine 공지에서 따로 확인하세요.
    source: https://spaces.awi.de/spaces/CS2SMOS/overview
  - date: "2026-10-29"
    level: warning
    title: Copernicus Marine 북반구 2026/27 시즌 생산 시작 지연 (JAXA AMSR2·AMSR3 배포 중단)
    body: >-
      Copernicus Marine이 JAXA의 AMSR2·AMSR3 자료 배포 중단 때문에 SEAICE_GLO_PHY_L4_NRT_011_014 북반구 생산 시작(예정일 2026-10-24)이 늦어지고 있다고 알렸습니다([ICE-817], 진행 중).
      재개 날짜는 아직 공지되지 않았습니다.
    source: https://marine.copernicus.eu/user-corner/user-notification-service
  - date: "2026-10-11"
    level: info
    title: 남반구 2026 겨울 자료 Copernicus Marine에서 갱신 중 — 2026/27 북극 시즌 공지는 아직 없음
    body: >-
      AWI 위키에는 남반구 L4 처리 시작 공지가 따로 올라오지 않았지만, Copernicus Marine 남반구 데이터셋은 2026-10-06 기준일까지 갱신되어 있습니다
      (메타데이터 2026-10-11 갱신). 남반구 산출 기간은 10-15까지이며, 2026/27 북극 시즌 시작 공지는 2026-10-12 현재 AWI 위키에 없습니다.
    source: https://stac.marine.copernicus.eu/metadata/SEAICE_GLO_PHY_L4_NRT_011_014/esa_obs-si_ant_phy-sit_nrt_l4-multi_P1D-m_202411/dataset.stac.json
  - date: "2026-04-21"
    level: info
    title: 2025/26 북극 시즌 준실시간 생산 종료
    body: >-
      CS3SMOS 북극 준실시간 처리가 2025/26 겨울을 마쳤습니다. 마지막 장은 2026-04-09 ~ 04-15이며, 남반구 운영 처리는 곧 시작한다고 안내되었습니다.
      계절 산출 자료의 정상적인 시즌 종료이며 생산 중단이 아닙니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2026/04/21/624500204/L4+CryoSat-2+Sentinel-3+SMOS+CS3SMOS+near+real-time+sea+ice+thickness+processing+ends+for+the+Arctic+2025+26+winter+season
  - date: "2025-10-23"
    level: warning
    title: 바렌츠·카라·랍테프해 SMOS 전파 간섭(RFI)으로 품질 저하
    body: >-
      SMOS 입력이 이 해역에서 잦고 지속적인 전파 간섭을 받아 얇은 얼음 관측이 빠집니다. 이곳 두께는 레이더 고도계 자료에만 기대므로
      SMOS가 있을 때보다 두껍게 나올 수 있습니다. `quality_flag` = 1(고도계만) 격자를 확인하세요.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/23/596052016/L4+CryoSat-2+Sentinel-3+SMOS+CS3SMOS+near+real-time+sea+ice+thickness+processing+has+started+for+the+Arctic+2025+26+winter+season
  - date: "2025-10-23"
    level: info
    title: CS3SMOS(v300) 북극 준실시간 생산 시작 — CS2SMOS v206 대체
    body: >-
      2025/26 북극 겨울부터 병합 두께 제품이 v206(CS2SMOS)에서 v300(CS3SMOS)으로 바뀌었습니다. Sentinel-3 고도계 추가, 25 km → 12.5 km 해상도,
      4~10월 남극 겨울 두께 산출, 새 파일 형식·내용이 핵심 변경입니다. 첫 주간장은 2025-10-15 ~ 10-21입니다.
    source: https://spaces.awi.de/spaces/CS2SMOS/blog/2025/10/23/596052016/L4+CryoSat-2+Sentinel-3+SMOS+CS3SMOS+near+real-time+sea+ice+thickness+processing+has+started+for+the+Arctic+2025+26+winter+season
  - date: "2025-10-16"
    level: info
    title: 해빙 농도 입력 SSMIS(OSI-401) → AMSR2(OSI-408) 교체
    body: >-
      2025년 여름 SSMIS 원자료 수신이 불안정해져 보조 해빙 농도 입력을 AMSR2 기반 OSI-408로 급히 바꿨습니다.
      영향 분석 결과 두께 차이는 한 겨울 평균 약 4 mm로 무시할 만하다고 보고되었습니다(Copernicus Marine QUID issue 2.2).
    source: https://documentation.marine.copernicus.eu/QUID/CMEMS-SEAICE-QUID-011-014.pdf

