  acknowledgement: >-
    JAXA는 'GSMaP data by Japan Aerospace Exploration Agency (JAXA)'처럼 자료 출처를 밝히고 주요 GSMaP 논문을 인용하라고 요청합니다.
    우량계 보정판(Gauge)을 썼다면 Mega et al. (2019)을 함께 인용하고, 쓴 제품(NOW·NRT·MVK, Gauge 여부)과 알고리즘 버전(v8)을 본문에 적으세요.
    JAXA 이용 가이드는 GSMaP를 쓴 논문을 JAXA에 알려 달라고도 안내합니다.

transitions:
  - from: GSMaP v7 (제품 버전 V04)
    to: GSMaP v8 (제품 버전 V05)
    status: completed
    date: "2021-12"
    summary: >-
      2021년 12월 1일 알고리즘 v8 배포가 시작되었고, 2023년 7월 재처리로 1998년부터의 기록이 만들어졌습니다. 마이크로파 강수 추정이 극지까지 넓어지고
      입력 센서·데이터베이스·지형성 강우 판정·우량계 보정이 바뀌었습니다. v7 갱신은 2026년에 끝났습니다.
    changes:
      - aspect: 기간
        before: "v7 표준 2014-03~2026-05-31, 준실시간 2017-04~2026-06-29 (갱신 종료)"
        after: "v8 1998-01~현재 (운영 2021-12-01부터, 1998~2021-11은 재처리)"
      - aspect: 공간 범위
        before: "60°S–60°N"
        after: "마이크로파만 쓰는 값으로 극지까지 확장(해빙·그린란드는 결측). NetCDF는 90°S–90°N 격자"
      - aspect: 마이크로파 알고리즘
        before: "KuPR V04A 2년 자료로 만든 강수 연직구조 데이터베이스"
        after: "DPR V06A 5년 자료 데이터베이스, 언 강수 깊이 추가, 강설·해빙 판별 개선, 센서 간 강수 분포 정규화 모듈 추가"
      - aspect: 입력 센서
        before: "GMI, AMSR2, SSMIS, AMSU/MHS 등"
        after: "Metop-C MHS, Suomi NPP·NOAA-20 ATMS 추가"
      - aspect: 지형성 강우
        before: "번개가 강한 지역에서는 지형성 강우 판정을 꺼서 따뜻한 지형성 강우를 과소 추정"
        after: "하층 정적 안정도로 따뜻한 지형성 강우를 판정"
      - aspect: 우량계 보정
        before: "v7 보정 방식(인위적인 무늬가 나타나는 문제)"
        after: "NOAA CPC 전지구 일 우량계 분석 기반 보정으로 인위적 무늬 감소"
      - aspect: 파일 형식
        before: "이진·텍스트(FTP), HDF(G-Portal)"
        after: "같은 이진·텍스트 형식 유지 + 실시간·준실시간판 NetCDF 추가"
    impacts:
      - v7과 v8을 한 시계열로 이어 붙이지 말고 전 기간을 v8로 다시 받으세요. v7 기간(2014년 이후)도 v8 값과 다릅니다.
      - FTP 경로의 v7을 v8로 바꾸세요(/standard/v8/, /realtime_ver/v8/). G-Portal에서는 제품 버전 V05가 v8입니다.
      - 2023년 7월 처음 공개된 재처리 표준판(V8.0000.0)은 2023년 9월 V8.0000.1로 다시 만들어졌으므로 그 사이 받은 파일은 다시 받아야 합니다.
    sources:
      - name: GSMaP version05 / Algorithm version8 요약 (JAXA)
        url: https://www.eorc.jaxa.jp/GPM/doc/product_info/release_note_gsmapv05-v8_en.pdf
      - name: GSMaP V05/v8 Release Note (2023-11-10)
        url: https://www.eorc.jaxa.jp/GPM/doc/product/ReleaseNote/08_note_GPM-GSMaP_20231110.pdf
      - name: GSMaP 재처리 노트 (2023-07)
        url: https://www.eorc.jaxa.jp/GPM/doc/reprocessing_note/GSMaP_reprocessing_note202307A.pdf
      - name: JAXA EORC GPM 소식 (v7 갱신 종료, 2026-06-16·07-29)
        url: https://www.eorc.jaxa.jp/GPM/en/news.html
  - from: GSMaP 제품 버전 V05 (알고리즘 v8)
    to: GSMaP 제품 버전 V06
    status: planned
    date: "2026-10"
    summary: >-
      JAXA는 G-Portal에서 GSMaP 시간·월 제품의 새 버전 V06을 2026년 10월 19일 공개한다고 예고했습니다. 형식이 HDF5에서 NetCDF4로 바뀌고
      새 G-Portal 시스템에서만 제공되며, V05도 계속 제공됩니다. 2026-10-13 확인 시 알고리즘 개선 내용과 FTP(Global Rainfall Watch) 쪽 변화는 아직 공개되지 않았습니다.
    changes:
      - aspect: 파일 형식
        before: "HDF5 (.h5)"
        after: "NetCDF4 (.nc)"
      - aspect: 제공처
        before: "옛 G-Portal(gportal.jaxa.jp/gpr)과 새 G-Portal"
        after: "2026년 10월 문을 연 새 G-Portal에서만 (새 계정 필요)"
      - aspect: 대상 제품
        before: "GSMaP L3 Hourly·Monthly V05"
        after: "GSMaP Precipitation (Hourly)·(Monthly) V06, V05도 계속 제공"
    impacts:
      - V06이 나오면 알고리즘 문서와 형식 설명서를 확인하고, V05와 V06을 섞어 쓰지 마세요.
      - HDF5용 읽기 코드는 NetCDF4용으로 바꿔야 합니다. 파일 이름 규칙도 새 설명서를 확인하세요.
    sources:
      - name: Plan for the GSMaP product version up (V06) (G-Portal, 2026-10-09)
        url: https://gportal.jaxa.jp/gpr/notice/notice/view/1510
      - name: Notice Regarding G-Portal System Renewal
        url: https://gportal.jaxa.jp/gpr/notice/case/view/1502

notices:
  - date: "2026-10-09"
    level: warning
    title: G-Portal에서 GSMaP 새 제품 버전 V06을 2026-10-19 공개 예정 (NetCDF4)
    body: >-
      JAXA는 GSMaP 시간·월 강수 제품의 새 버전 V06을 2026년 10월 19일 G-Portal에 공개할 계획이라고 알렸습니다. 형식은 HDF5 대신 NetCDF4이고,
      2026년 10월 문을 연 새 G-Portal에서만(계정 필요) 받을 수 있으며 V05도 계속 제공됩니다. 알고리즘 개선 내용은 JAXA EORC GPM 누리집에서 안내한다고 했습니다.
    source: https://gportal.jaxa.jp/gpr/notice/notice/view/1510
  - date: "2026-09-15"
    level: warning
    title: G-Portal 새 시스템 공개(2026-10-01) — 계정 재등록, SFTP 주소·인증 방식 변경, 옛 시스템 10월 말 종료 예정
    body: >-
      G-Portal이 2026년 10월 1일 새 시스템(www.gportal.jaxa.jp)으로 바뀌었고, 약 한 달 병행 운영 뒤 10월 말 옛 시스템을 닫을 예정입니다.
      계속 쓰려면 새 계정을 만들어야 하며(설정·공개키는 옮겨지지 않음), SFTP는 sftp.gportal.jaxa.jp(22번 포트)로 바뀌고 공개키 인증만 됩니다. 자동 내려받기 스크립트를 고치세요.
    source: https://gportal.jaxa.jp/gpr/notice/case/view/1502
  - date: "2026-06-16"
    level: info
    title: GSMaP 알고리즘 v7 갱신 종료 (표준 2026-05-31, 준실시간 2026-06-29)
    body: >-
      FTP의 v7 표준판(MVK·Gauge, /standard/v7)은 2026년 5월 31일, 준실시간판(NRT·Gauge_NRT, /realtime_ver/v7)은 6월 29일 자료로 갱신이 끝났습니다(7월 29일 공지 갱신).
      지난 v7 자료와 v6·v8은 계속 받을 수 있습니다. G-Portal도 V04(v7) 표준 제품 배포를 5월 31일로 마쳤습니다.
    source: https://www.eorc.jaxa.jp/GPM/en/news.html
  - date: "2025-06-17"
    level: info
    title: NOAA-19 AMSU-A/MHS 입력 사용 중단
    body: >-
      JAXA Global Rainfall Watch 안내서의 입력 위성 변경 목록에 따르면 GSMaP는 2025년 6월 17일부터 NOAA-19 AMSU-A/MHS 자료를 쓰지 않습니다.
      마이크로파 관측 빈도가 바뀌므로 이 날짜 앞뒤로 품질 특성이 달라질 수 있습니다.
    source: https://sharaku.eorc.jaxa.jp/GSMaP/guide.html
  - date: "2024-11-29"
    level: info
    title: GSMaP_NOW 알고리즘 개정 (2024-12-01부터)
    body: >-
      2024년 12월 1일부터 GSMaP_NOW와 GSMaP_Gauge_NOW가 개정된 v8 알고리즘으로 생산됩니다. NOW는 처리 알고리즘이 개선되었고 Gauge_NOW는 오류가 고쳐졌습니다.
    source: https://www.eorc.jaxa.jp/GPM/en/news.html
  - date: "2023-09-15"
    level: warning
    title: v8 재처리 표준판 다시 생산 (V8.0000.0 → V8.0000.1) — 다시 받아야 함
    body: >-
      2023년 7월 공개한 재처리 GSMaP_MVK·Gauge v8 자료에 문제가 있어 다시 처리했고, 제품 버전이 V8.0000.0에서 V8.0000.1로 바뀌었습니다.
      이전 파일을 받은 사용자는 다시 받으라고 안내했습니다.
    source: https://sharaku.eorc.jaxa.jp/GSMaP/document/20230915_GSMaP_STD_v8_repro_list.pdf
  - date: "2023-07-10"
    level: info
    title: v8 재처리 자료 공개 — 1998년 1월부터
    body: >-
      TRMM 시대를 포함한 v8 재처리 자료가 공개되어 v8을 1998년 1월부터 받을 수 있게 되었습니다. 2000년 3월 이전은 GridSat-B1 적외 자료로 빈칸을 메웠습니다.
    source: https://www.eorc.jaxa.jp/GPM/doc/reprocessing_note/GSMaP_reprocessing_note202307A.pdf
  - date: "2021-12-01"
    level: info
    title: GSMaP 알고리즘 v8 배포 시작
    body: >-
      알고리즘 버전 8 GSMaP 배포가 시작되었습니다. 이진·텍스트 형식은 그대로이고 실시간·준실시간 v8에 NetCDF가 추가되었습니다. 당시 v6·v7도 계속 제공되었습니다.
    source: https://www.eorc.jaxa.jp/GPM/en/news.html

