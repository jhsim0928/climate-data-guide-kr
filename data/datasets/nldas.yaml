transitions:
  - from: NLDAS-2 GRIB-1 (V002)
    to: NLDAS-2 netCDF (V2.0)
    status: completed
    date: "2024-08"
    summary: >-
      같은 NLDAS-2 자료를 CF·ALMA 규약 netCDF로 다시 만든 V2.0이 2020~2021년 공개되었고, GRIB-1판(V002)은 2024년 8월 1일 23Z 자료를 끝으로 갱신이 멈췄습니다.
    changes:
      - aspect: 형식·버전
        before: "GRIB-1, 버전 002"
        after: "netCDF, 버전 2.0 (파일 끝 .020.nc)"
      - aspect: 변수 이름
        before: "GRIB PDS 번호·약어"
        after: "ALMA 이름(`Tair`, `Rainf`, `SoilM_0_10cm` 등)과 cell_methods(point·mean·sum) 속성"
      - aspect: Mosaic 증발 플럭스 부호
        before: "4개 증발 플럭스 부호 반대"
        after: "수정"
      - aspect: 월 기후값 기간
        before: "1980–2009 (30년)"
        after: "1981–2020 (40년)"
      - aspect: 갱신
        before: "2024-08-01 23Z에서 중단"
        after: "매일 약 4일 지연"
    impacts:
      - "GRIB용 스크립트는 변수 이름과 파일 경로를 모두 고쳐야 합니다."
      - "기후값 기준 기간이 바뀌어 편차 값이 달라집니다."
    sources:
      - name: NLDAS-2 GRIB-1 files no longer updated as of 1 August 2024 (NASA LDAS)
        url: https://ldas.gsfc.nasa.gov/nldas/news/nldas-2-grib-1-files-no-longer-updated-1-august-2024
      - name: NLDAS-2 README (netCDF V2.0)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/NLDAS2_README.pdf
  - from: NLDAS-2
    to: NLDAS-3
    status: planned
    summary: >-
      NASA가 개발 중인 3단계 NLDAS로, 해상도를 1 km로 높이고 영역을 북·중미 전체로 넓히며 Noah-MP 모델과 위성 자료동화를 도입합니다.
      2026-10-13 확인 시 2001~2023년 베타 강제력만 AWS에 공개되어 있고, 모델 출력은 '2026년 중반 공개 예정'으로 안내된 뒤 아직 나오지 않았습니다. GES DISC·CMR에는 등록되어 있지 않습니다.
    changes:
      - aspect: 공간 해상도·격자
        before: "0.125°(약 12.5 km), 464×224"
        after: "1 km, 11,700×6,500 격자"
      - aspect: 영역
        before: "25–53°N, 125–67°W (미국 본토 중심)"
        after: "7–72°N, 169–52°W (알래스카·하와이·푸에르토리코를 포함한 북미와 중미)"
      - aspect: 지면 모델
        before: "Noah, Mosaic, VIC, SAC"
        after: "Noah-MP + HyMAP 하천 추적"
      - aspect: 강제력
        before: "NARR + CPC 일 우량계 분석(레이더 시간 분해)"
        after: "MERRA-2·GEOS-IT 배경장 + 우량계·IMERG·캐나다 CaPA 강수"
      - aspect: 자료동화
        before: "없음 (오픈루프)"
        after: "토양수분(SMAP 등), 적설, MODIS·VIIRS LAI, GRACE·GRACE-FO 육수저장량 동화 계획"
      - aspect: 기간·지연
        before: "1979-01~현재, 약 4일 지연"
        after: "베타 강제력 2001~2023. 계획상 준실시간 Early Look 약 7시간 지연"
      - aspect: 공개 상태
        before: "GES DISC 정식 제공"
        after: "베타 강제력만 AWS(s3://nasa-waterinsight/NLDAS3/forcing/)에 공개, 정식 공개 전 크게 바뀔 수 있다고 안내"
    impacts:
      - "베타 자료는 정식 공개 전 크게 바뀔 수 있으니 논문용 장기 분석에는 아직 NLDAS-2를 쓰세요."
      - "NLDAS-3가 나오면 해상도·모델·강제력이 모두 달라지므로 NLDAS-2와 한 시계열로 잇지 마세요."
      - "2025년 4월 워크숍 자료의 일정(오픈루프 2025년 늦여름, 자료동화 2025년 늦가을)은 지켜지지 않았습니다. 공개 여부는 NASA LDAS NLDAS-3 페이지와 GitHub를 확인하세요."
    sources:
      - name: NASA LDAS — NLDAS-3
        url: https://ldas.gsfc.nasa.gov/nldas/v3
      - name: NLDAS-3 GitHub (NASAWaterInsight)
        url: https://github.com/NASAWaterInsight/NLDAS-3
      - name: NLDAS-3 Drought Workshop 3 Slides (2025-04-10)
        url: https://ldas.gsfc.nasa.gov/sites/default/files/ldas/nldas/NLDAS-3_Drought-Workshop-3_Slides.pdf

notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC 온프레미스 서버 종료 — NLDAS도 Earthdata Cloud로 전환 필요
    body: >-
      GES DISC는 온프레미스 서버의 HTTPS 접근을 2026년 9월 30일까지 닫고 온프레미스 OPeNDAP도 8월 20일~9월 30일 사이에 끈다고 안내했습니다.
      NLDAS가 있는 hydro1.gesdisc.eosdis.nasa.gov 서버도 '빨라야 2026년 9월 30일 이후' 접근이 끝난다고 표시하고 있습니다(2026-10-13 확인 시 아직 응답).
      스크립트 주소를 data.gesdisc.earthdata.nasa.gov나 earthaccess로 바꾸세요.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2026-04-16"
    level: info
    title: GrADS Data Server(GDS) 서비스 종료 — NLDAS 포함
    body: >-
      NLDAS 강제력·Noah·Mosaic·VIC 시간별·월·기후값 컬렉션을 제공하던 GES DISC의 GDS가 2026년 4월 6일 종료되었습니다(1월 15일 예고).
      같은 자료는 Earthdata Cloud에서 HTTPS와 부분 추출 서비스로 받을 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-has-been-discontinued
  - date: "2024-08-01"
    level: warning
    title: NLDAS-2 GRIB-1판(V002) 갱신 중단 — netCDF판(V2.0)으로 전환
    body: >-
      GES DISC의 NLDAS 버전 002(GRIB-1) 파일은 2024년 8월 1일 23Z 자료를 끝으로 매일 갱신이 멈췄습니다. 매일 갱신되는 NLDAS V2.0 netCDF 자료로 바꾸라고 안내합니다.
    source: https://ldas.gsfc.nasa.gov/nldas/news/nldas-2-grib-1-files-no-longer-updated-1-august-2024
  - date: "2024-06-07"
    level: critical
    title: 2022-08-01~2024-03-01 전 컬렉션 재처리 — 이전 다운로드분은 다시 받기
    body: >-
      2022년 8월 NCEP R-CDAS(NARR 실시간 연장판)의 적설 깊이 입력 오류로 기온이 너무 높게 들어가 2022~23년 겨울 적설이 적고 북부 토양이 지나치게 건조해졌습니다.
      FORA·FORB·Mosaic·Noah·VIC의 시간별·월자료(netCDF·GRIB 모두)를 이 구간에 대해 재처리해 2024년 6월 7일 공개했습니다. 그 전에 받은 이 구간 자료는 다시 받으세요.
    source: https://ldas.gsfc.nasa.gov/nldas/news/nldas-2-data-re-processed-2022-08-01-2024-03-01
  - date: "2020-04-01"
    level: info
    title: NLDAS-1 자료 폐기
    body: NLDAS 1단계(버전 001) 자료가 2020년 4월 1일 GES DISC에서 내려갔습니다. NLDAS-2를 쓰세요.
    source: https://ldas.gsfc.nasa.gov/nldas/news/nldas-1-data-will-be-decommissioned-412020

