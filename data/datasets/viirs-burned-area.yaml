# ─────────────────────────────────────────────────────────────
# VIIRS 연소 면적 VNP64A1 C2 — 데이터셋 정보 파일
# 지면 탭 '산불'에 싣습니다. MODIS MCD64A1(modis-burned-area.yaml)의 후속 제품이며, MCD64A1 → VNP64A1 비교는 MODIS 파일에 있습니다.
# Suomi NPP 자료 공급이 2026년 11월 1일 끝나므로, 그 뒤 생산 상황(Collection 3, NOAA-20 결합)을 꼭 다시 확인하세요.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: viirs-burned-area
name: "VIIRS Burned Area (VNP64A1)"
full_name: VIIRS/NPP Burned Area Monthly L4 Global 500m SIN Grid V002 (VNP64A1, Suomi NPP VIIRS 월별 연소 면적, 500 m)
category: satellite
domain: land
group: 산불
order: 11
domains: [육지, 원격탐사]
provider: NASA VIIRS 육상 과학팀(메릴랜드대학교, Louis Giglio) / NASA GSFC LandSIPS 생산 / LP DAAC(USGS EROS) 배포

status: deprecated
status_note: >-
  MODIS MCD64A1을 잇는 NASA 표준 연소 면적 제품으로 지금은 매달 정상 생산됩니다(2026-10-13 확인 시 2026년 8월분까지 공개).
  그러나 NOAA가 Suomi NPP 과학 자료 공급을 2026년 11월 1일 13시(UTC)에 끝낸다고 발표했고, 이 제품은 Suomi NPP 한 위성만 쓰므로 정규 생산이 곧 멈출 예정입니다.
  과학팀은 Suomi NPP와 NOAA-20을 함께 쓰는 Collection 3을 준비 중이라고 밝혔지만, 2026-10-13 현재 NOAA-20 연소 면적 제품은 공개되지 않았습니다.

period:
  start: "2012-03"
  end: present
  note: >-
    2012년 3월부터입니다(Suomi NPP 2011년 10월 발사). 2026-10-13 CMR 확인 시 최신 파일은 2026년 8월 자료(2026-10-06 생산)였습니다.
    Suomi NPP 자료 공급이 2026년 11월 1일 끝나므로 2026년 10~11월 무렵이 마지막 월자료가 될 가능성이 크며, 마지막 달을 어떻게 처리할지는 공지되지 않았습니다.

resolution:
  spatial_short: "0.5 km (0.005°)"
  temporal_short: "1개월"
  spatial: >-
    MODIS/VIIRS Sinusoidal(SIN) 타일 격자(가로 h00–h35, 세로 v00–v17, 타일 하나 약 10°×10°), 500 m(타일 하나 2400 × 2400 화소) — MCD64A1과 같은 격자입니다.
    입력은 VIIRS 750 m 영상을 500 m 격자로 재표본한 것입니다.
  vertical: 지표 단일층
  temporal: 월(달력 월 단위 파일). 각 화소에는 그달 안에서 연소가 감지된 날(연중 일수, 1일 단위)이 들어 있습니다.

update: "매월 (2026-10-13 확인 시 2026년 8월분이 2026-10-06 생산 — 관측 월 종료 후 약 5주). Suomi NPP 자료 공급 종료(2026-11-01) 뒤에는 정규 생산이 멈출 예정"
