notices:
  - date: "2026-08-07"
    level: critical
    title: Suomi NPP 과학 자료 공급 2026년 11월 1일 종료 — VNP64A1 정규 생산 중단 예정
    body: >-
      NOAA NESDIS(2026-08-03 발표)에 따라 Suomi NPP의 VIIRS 등 모든 과학 자료 공급이 2026년 11월 1일 13시(UTC)에 끝나며, NASA는 NOAA-20·NOAA-21 제품으로
      옮겨 가라고 안내했습니다(날짜는 바뀔 수 있음). VNP64A1 컬렉션 설명에도 공급 종료일이 2026년 11월 2일(2026/306)로 적혀 있습니다.
      LAADS는 이미 만들어진 Suomi NPP VIIRS 자료는 종료 뒤에도 계속 제공할 계획이라고 답했지만 바뀔 수 있다고 덧붙였습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026
  - date: "2025-09-24"
    level: info
    title: NASA FIRMS에 VNP64A1 연소 면적 추가
    body: >-
      FIRMS의 Advanced·Burned Area 모드에서 VNP64A1 월·연 연소 면적을 MODIS 제품과 함께 볼 수 있게 되었습니다.
      안내문은 두 제품 모두 약 5개월 지연으로 지도에 반영된다고 밝히며, Suomi NPP와 NOAA-20을 결합한 연소 면적 제품을 계획 중이라고 덧붙였습니다.
    source: https://www.earthdata.nasa.gov/news/blog/viirs-global-burned-area-product-added-firms
  - date: "2025-07-08"
    level: info
    title: VIIRS 버전 1 연소 면적(VNP64A1.001) 등 2025-07-31 배포 종료
    body: >-
      LP DAAC는 VIIRS 버전 1 열 이상·토지피복 변화·식생지수·연소 면적·BRDF/알베도 제품의 배포를 2025년 7월 31일 끝낸다고 공지했습니다.
      연소 면적은 버전 2(VNP64A1.002)를 쓰세요.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-1-data-products-decommissioned
  - date: "2024-11-02"
    level: info
    title: Suomi NPP GPS 이상 — 2024년 11월 2~6일 VIIRS 육상 자료 결측
    body: >-
      GPS 이상으로 2024년 11월 2일 21시 12분부터 6일 17시 36분(UTC)까지의 자료는 위치·시각 오류로 복구할 수 없게 되었고, 그 사이 Suomi NPP VIIRS 육상 제품 생산이 멈췄습니다.
      복구 뒤 정상 생산이 재개되었으나 결측 구간은 남아 있어 2024년 11월 연소 면적에 영향을 줄 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-viirs-data-product-anomaly-november-2024
  - date: "2024-10-22"
    level: info
    title: VIIRS 버전 2 연소 면적(VNP64A1.002) 공개
    body: >-
      LP DAAC가 Suomi NPP VIIRS 연소 면적 버전 2를 2012년 3월부터 공개했습니다. 보정·위치 정확도·구름 마스크가 개선되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-burned-area-data-product-released
  - date: "2024-09-24"
    level: info
    title: Suomi NPP VIIRS 이상 — 2024년 9월 26~27일 자료 복구 불가
    body: >-
      2024년 9월 26일 0시부터 27일 17시 30분(UTC)까지의 자료는 복구할 수 없었고, 그동안 Suomi NPP VIIRS 육상 제품 생산이 일시 중단되었습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/suomi-npp-viirs-data-product-anomaly-september-2024

