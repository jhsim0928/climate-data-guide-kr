account_required: true

summary: >-
  VNP64A1은 MODIS MCD64A1 Collection 6.1 알고리즘을 Suomi NPP VIIRS에 맞게 고쳐 만든 월별 전지구 500 m 연소 면적 제품입니다.
  VIIRS 750 m 영상과 활성 화재 탐지를 써서 연소 민감 식생지수와 시간 질감에 동적 문턱값을 적용하고, 탄 500 m 화소마다 연소 날짜를 기록합니다.
  MCD64A1과 같은 격자·같은 층 구성이라 기존 코드를 거의 그대로 쓸 수 있으며, MODIS 이후 연소 면적 기록을 이어 가기 위한 제품입니다.

time_convention:
  summary: >-
    파일 하나는 한 달력 월을 담고, `Burn Date`는 그달에 연소가 감지된 날의 연중 일수(1~366)입니다. 한 달 동안의 반사도 시계열을 분석해
    정한 결과이며 날짜 불확실성(`Burn Date Uncertainty`)이 따로 있습니다. Suomi NPP는 오후 1시 30분(현지 평균시) 상승 궤도 한 번만 관측하므로,
    오전(Terra)과 오후(Aqua) 관측을 함께 쓰던 MCD64A1보다 하루 관측 기회가 적습니다.
  points:
    - "파일 이름의 AYYYYDDD는 그 달력 월의 첫날(연중 일수)입니다. 예: A2026213 = 2026년 8월(8월 1일 = 213일)."
    - "`Burn Date`의 0은 타지 않은 육지, -1은 자료 부족으로 판정 불가, -2는 물입니다. 연소 면적은 1~366인 화소만 세세요."
    - "`First Day`·`Last Day`는 변화를 믿을 만하게 감지할 수 있었던 기간입니다. 이 범위가 그달보다 좁으면 그 화소는 한 달 전체를 판정하지 못한 것입니다(QA 비트 2)."
    - "오전 관측이 없어 연소 날짜가 MODIS보다 조금 늦게 잡힐 수 있습니다. 공식 비교에서 활성 화재 날짜와 같은 날 일치하는 비율은 VNP64A1 38%, MCD64A1 46%였고, ±2일 안 일치는 71%와 72%로 비슷했습니다."
  source: https://doi.org/10.1016/j.rse.2025.115006
  source_name: "VNP64 User Guide v1.1 + Giglio et al. (2025) VIIRS 연소 면적 검증·비교 논문"

variables:
  note: >-
    VNP64 사용자 안내서와 LP DAAC 층 정보 기준 과학 자료 층(SDS) 5개로, MCD64A1과 이름·의미가 같습니다. 파일은 비용 절감을 위해 HDF4(HDF-EOS2)로
    만들어지며 Collection 3부터 netCDF4로 바뀔 예정입니다. 축척 인수(scale_factor)는 없습니다.
  full_list: https://lpdaac.usgs.gov/documents/2124/VNP64_User_Guide_v1.1.pdf
  groups:
    - name: 월별 연소 면적 층 (500 m)
      kind: instant
      items:
        - text: "연소 날짜(연중 일수) — `Burn Date` (일, int16)"
          note: "그달 안에서 연소가 감지된 날. 0 = 타지 않음, -1 = 판정 불가, -2 = 물"
          std: [burned_area]
        - text: "연소 날짜 불확실성 — `Burn Date Uncertainty` (일)"
          note: 타지 않은 화소·판정 불가·물 화소는 0
        - text: "변화 감지 가능 첫날 — `First Day` (연중 일수)"
          std: []
        - text: "변화 감지 가능 마지막 날 — `Last Day` (연중 일수)"
          std: []
        - text: "품질 정보 — `QA` (8비트 플래그)"
          note: "MCD64A1과 같은 정의: 비트 0 육지/물, 1 유효 자료, 2 판정 기간 단축, 3 주변 화소 기준 재분류, 5–7 타지 않은 화소의 특수 상황 코드"

access:
  - name: NASA Earthdata Search (LP DAAC, Earthdata Cloud)
    url: https://search.earthdata.nasa.gov/search/granules?p=C2847928673-LPCLOUD
    method: 웹 검색·HTTPS 다운로드 / earthaccess / AWS us-west-2 S3 직접 접근
    note: >-
      short_name VNP64A1, version 002입니다. 파일은 타일별 HDF(.hdf)이며 무료 Earthdata 로그인이 필요합니다.
      S3 경로는 s3://lp-prod-protected/VNP64A1.002/이며 임시 자격증명은 https://data.lpdaac.earthdatacloud.nasa.gov/s3credentials 에서 받습니다.
  - name: AppEEARS
    url: https://appeears.earthdatacloud.nasa.gov/
    method: 영역·지점 부분 추출, 투영 변환(GeoTIFF·NetCDF4)
  - name: LP DAAC 제품 페이지 (DOI 랜딩)
    url: https://doi.org/10.5067/VIIRS/VNP64A1.002
    method: 문서(사용자 안내서·ATBD)·층 정보
  - name: NASA FIRMS (Burned Area 모드)
    url: https://firms.modaps.eosdis.nasa.gov/
    method: 웹 지도 보기
    note: 2025년 9월부터 VNP64A1 월·연 연소 면적을 MODIS 제품과 겹쳐 볼 수 있습니다.

example:
  lang: python
  note: >-
    MCD64A1 예제와 같은 방식입니다. short_name과 version만 바꾸면 되고, 층 이름도 같습니다. HDF4를 지원하는 GDAL이 있는 rasterio가 필요합니다.
  code: |
    # pip install earthaccess rasterio numpy
    import earthaccess
    import numpy as np
    import rasterio

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="VNP64A1", version="002",
        temporal=("2025-03-01", "2025-03-31"),
        bounding_box=(127, 35, 130, 39),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "vnp64a1")

    for f in files:
        with rasterio.open(f) as src:
            sds = [s for s in src.subdatasets if s.endswith("Burn Date")][0]
        with rasterio.open(sds) as b:
            burn = b.read(1)
        burned = (burn >= 1) & (burn <= 366)       # 0 미연소, -1 판정 불가, -2 물
        print(f, burned.sum(), "화소")

tips:
  - "MCD64A1과 격자·층 이름이 같아 코드는 그대로 쓸 수 있지만 값은 같지 않습니다. 2012~2023년 전지구 연소 면적은 VNP64A1이 해마다 2~6% 많았고, 동남아시아에서는 평균 33% 차이가 났습니다."
  - "두 제품을 이어 붙여 추세를 볼 때는 겹치는 기간(2012년 3월~)으로 지역별 차이를 먼저 확인하세요. 개발팀도 세밀한 추세 분석에서 단순 연결은 권하지 않습니다."
  - "2022년 7월 27일~8월 10일 Suomi NPP VIIRS 결측으로 2022년 7월, 특히 8월 자료가 나빠졌습니다(사용자 안내서 알려진 문제). 2024년 9월 26~27일, 11월 2~6일 결측도 해당 월에 영향을 줄 수 있습니다."
  - "농경지 연소는 낮은 신뢰도로 다루라고 안내합니다. 오전 관측이 없어 짧게 타고 사라지는 농경지 소각을 특히 놓치기 쉽습니다."
  - "Suomi NPP 자료 공급이 2026년 11월 1일 끝납니다. 2026년 11월 이후 연소 면적이 필요하면 NOAA-20을 쓰는 후속 제품(Collection 3 예정) 공개 여부를 LP DAAC 공지에서 확인하세요. 이미 만들어진 VNP 자료는 계속 제공할 계획이라고 안내되었습니다(변경 가능)."
  - "버전 1(VNP64A1.001)은 내륙 수변·고위도에서 구름 마스크 결함으로 오탐이 많아 제한적으로만 공개되었고 2025년 7월 31일 배포가 끝났습니다. 옛 결과가 001 기반이면 002로 다시 계산하세요."
  - "Sinusoidal 투영이라 위경도 격자로 바꿀 때 최근접(nearest) 재표본을 쓰세요. 보간하면 날짜 값이 섞입니다."

