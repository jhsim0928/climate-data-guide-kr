transitions:
  - from: VNP64A1 V001
    to: VNP64A1 V002 (Collection 2)
    status: completed
    date: "2024-10"
    summary: >-
      구름 마스크와 보정을 고친 Collection 2(V002)가 2024년 10월 22일 공개되었습니다. V001은 구름 마스크 결함으로 오탐이 많아 제한적으로만 공개되었고
      2025년 7월 31일 배포가 끝났습니다.
    changes:
      - aspect: 공개 상태
        before: "제한적·잠정(provisional) 공개, 2025-07-31 배포 종료"
        after: "2024-10-22 공개, 정규 제품 (2012-03~)"
      - aspect: 구름 마스크
        before: "약 5 km 크기의 네모난 구름 마스크 결함 때문에 내륙 수변·고위도에서 오탐 다수"
        after: "개선된 구름 마스크, VNP03의 8분류 육지/물 마스크 사용"
      - aspect: 입력 자료
        before: "Collection 1 VIIRS 입력"
        after: "보정 계수 갱신, 위치 정확도 개선, 에어로졸 양 플래그 수정"
    impacts:
      - V001로 만든 결과는 V002로 다시 계산하세요. V001은 더 이상 받을 수 없습니다.
    sources:
      - name: VIIRS Version 2 Burned Area Data Product Released (Earthdata, 2024-10-22)
        url: https://www.earthdata.nasa.gov/data/alerts-outages/viirs-version-2-burned-area-data-product-released
      - name: VNP64A1 V001 자료 목록 (배포 종료 안내)
        url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp64a1-001
      - name: Giglio et al. (2025)
        url: https://doi.org/10.1016/j.rse.2025.115006
  - from: VNP64A1 C2 (Suomi NPP 단독)
    to: VIIRS 연소 면적 Collection 3 (Suomi NPP + NOAA-20)
    status: planned
    summary: >-
      개발팀은 Suomi NPP와 NOAA-20 VIIRS를 함께 쓰는 Collection 3을 계획하고 있다고 밝혔습니다(파일 형식도 netCDF4로 변경 예정).
      Suomi NPP 공급이 2026년 11월 끝나므로 이후 연소 면적 기록의 연속성은 이 제품에 달려 있지만, 2026-10-13 현재 공개 일정은 나오지 않았습니다.
    changes:
