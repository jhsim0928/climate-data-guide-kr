notices:
  - date: "2024-11-02"
    level: warning
    title: UAH v6.1로 변경 — 2021년 이후 NOAA-19 제외, Metop-B 단독
    body: >-
      UAH는 NOAA-19가 일주기를 따라 너무 멀리 표류해 보정이 어렵다며 2021년부터 NOAA-19 자료를 빼고, 이름을 v6.1로 바꿨습니다.
      2024년 10월 하부 대류권 편차는 +0.94 °C에서 +0.73 °C로 낮아졌고, 전지구 추세는 10년당 0.01 °C 줄었습니다. 2021년 이후 UAH는 Metop-B 한 위성 자료입니다.
    source: https://www.drroyspencer.com/2024/11/uah-global-temperature-update-for-october-2024-truncation-of-the-noaa-19-satellite-record/
  - date: "2023-12-07"
    level: warning
    title: NOAA STAR v5.0이 V3.0·V4.0·V4.1 대체 (backward merging·새 일주기 보정)
    body: >-
      STAR는 2023년 1월부터 기후변화 연구용으로 v5.0을 쓰라고 안내했습니다. MSU·AMSU-A·ATMS를 안정 궤도 위성 기준으로 잇는 backward merging, 새 일주기 표류 보정,
      NOAA-11·12·14·15 보정 표류 제거가 들어갔고, 편차 기준 기간은 2000~2019년입니다. 2023년 1~5월 배포본의 일부 결측은 6월 이후 수정되었습니다.
    source: https://www.star.nesdis.noaa.gov/data/mscat/MSU_AMSU_v5.0/Monthly_Atmospheric_Layer_Mean_Temperature/Readme_STAR_V5.0_Mean_Layer_Temperature_CDR.pdf
  - date: "2016-06-28"
    level: info
    title: RSS TLT V4.0 공개 (TMT·TTT V4.0은 2016-03-02)
    body: >-
      RSS가 일주기 보정을 새로 최적화하고 육지·바다의 위성 간 보정을 따로 계산한 하부 대류권 TLT V4.0을 내놓았습니다. 앞서 3월 2일에는 TMT·TTT V4.0이 나왔고 NOAA-19·Metop-B가 추가되었습니다.
      V4.0에 대한 불확실성 분석은 아직 완료되지 않았다고 밝히고 있습니다.
    source: https://www.remss.com/measurements/upper-air-temperature/

