# ─────────────────────────────────────────────────────────────
# MSU/AMSU 층 평균 기온 (RSS V4.0 · UAH v6.1 · NOAA STAR v5.0) — 데이터셋 정보 파일
# 위성 탭(기온·수증기). 같은 마이크로파 탐측기 관측을 세 기관이 서로 다른 방식으로 이어 붙인 세 제품을 한 페이지에서 비교합니다.
# 상태는 페이지 대표값(active)이고 제품별 상태·버전은 status_note·tips에 적었습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: msu-amsu
name: "MSU/AMSU (RSS·UAH·STAR)"
full_name: MSU/AMSU(/ATMS) Mean Layer Atmospheric Temperatures — RSS V4.0, UAH v6.1, NOAA STAR v5.0 (위성 마이크로파 탐측기로 만든 대류권·성층권 두꺼운 층 평균 기온)
category: satellite
domain: satellite
group: 기온·수증기
order: 20
domains: [대기, 원격탐사]
provider: Remote Sensing Systems(RSS) / 앨라배마대 헌츠빌(UAH) / NOAA NESDIS STAR (NOAA NCEI CDR 배포)

status: active
status_note: >-
  세 제품 모두 매달 갱신되고 있습니다(2026-10-13 확인 시 RSS V4.0·UAH v6.1·NOAA STAR v5.0 모두 2026년 9월분까지).
  UAH는 2024년 11월 NOAA-19의 궤도 표류 때문에 2021년 이후 NOAA-19를 빼고 Metop-B 한 위성만 쓰는 v6.1로 바꿨고, STAR는 2023년부터 MSU·AMSU-A·ATMS를 이어 붙인 v5.0을 씁니다.
  RSS는 아직 ATMS를 쓰지 않아 노후 AMSU 위성에 의존하며, NCEI에 보관된 RSS CDR 사본은 2025년 2월에서 멈춰 있습니다.

transitions:
  - from: UAH v6.0
    to: UAH v6.1
    status: completed
    date: "2024-11"
    summary: >-
      궤도가 일주기를 따라 너무 멀리 표류한 NOAA-19를 2021년부터 처리에서 빼고, 그 뒤로는 Metop-B 한 위성만 쓰도록 바꾼 판입니다.
      최근 몇 년의 따뜻한 값이 조금 낮아졌고 1979~2024년 추세는 10년당 0.01 °C 줄었습니다.
    changes:
      - aspect: 2021년 이후 사용 위성
        before: NOAA-19 + Metop-B
        after: Metop-B 단독
      - aspect: 하부 대류권(LT) 전지구 추세
        before: "10년당 +0.16 °C (2024년 9월까지, v6.0)"
        after: "10년당 +0.15 °C (2024년 10월까지, v6.1)"
      - aspect: 2024년 10월 LT 편차
        before: "+0.94 °C (NOAA-19 포함 시)"
        after: "+0.73 °C"
    impacts:
      - v6.0과 v6.1 값을 섞지 마세요. 2021년 이후 값이 다르며, 이전 논문의 v6.0 수치를 v6.1로 바로 비교하면 안 됩니다.
      - 2021년 이후 UAH는 위성 하나에 기대므로 그 위성의 표류·고장에 더 민감합니다.
    sources:
      - name: Roy Spencer 블로그 — UAH v6.1 Global Temperature Update for October 2024 (2024-11-02)
        url: https://www.drroyspencer.com/2024/11/uah-global-temperature-update-for-october-2024-truncation-of-the-noaa-19-satellite-record/
  - from: NOAA STAR v4.1
    to: NOAA STAR v5.0
    status: completed
    date: "2023-01"
    summary: >-
      STAR v5.0은 MSU·AMSU-A·ATMS 세 세대 측기(16개 극궤도 위성)를 안정 궤도 위성(Aqua·Metop-A·Suomi NPP·NOAA-20) 기준으로 거꾸로 이어 붙이는 'backward merging',
      새 일주기 표류 보정, NOAA-11·12·14·15 보정 표류 제거를 도입한 판으로, 2023년 1월부터 V3.0·V4.0·V4.1을 대체했습니다.
    changes:
      - aspect: 위성 이어 붙이기
        before: "위성 간 동시 직하 관측(SNO) 짝으로 상호 보정 (MSCAT 방법론 페이지)"
        after: 안정 궤도 기준 위성에서 과거로 거슬러 맞추는 backward merging
      - aspect: 일주기 표류 보정
        before: "MSCAT 방법론 페이지에 설명된 이전 방식 — RSS 일주기 편차 자료에 척도 인수(MSU 2채널 0.875, AMSU-A 5채널 0.917)를 곱해 보정"
        after: 관측 기반·준물리적 일주기 표류 보정 알고리즘
      - aspect: 보정 표류 제거
        before: 일부 위성의 보정 표류가 남음
        after: NOAA-11·12·14·15의 가짜 보정 표류를 재보정으로 제거
    impacts:
      - v4.x로 낸 추세는 v5.0으로 다시 계산하세요. 위성 보정·일주기 보정이 모두 바뀌었습니다.
      - 2023년 1~5월 배포본에는 1985년 2월 TUT와 2018년 이후 TMT 일부 격자 결측이 있었고 6월 이후 고쳐졌습니다. 그 사이 받은 파일은 다시 받으세요.
    sources:
      - name: Readme — STAR V5.0 Mean Layer Temperature CDR
        url: https://www.star.nesdis.noaa.gov/data/mscat/MSU_AMSU_v5.0/Monthly_Atmospheric_Layer_Mean_Temperature/Readme_STAR_V5.0_Mean_Layer_Temperature_CDR.pdf
      - name: Zou et al. (2023), JGR Atmospheres
        url: https://doi.org/10.1029/2022JD037472

period:
  start: "1978-11"
  end: present
  note: >-
    제품·층마다 시작이 다릅니다. NOAA STAR v5.0은 TMT 1978-11, TLS 1978-12, TUT·TLT 1981-01부터, RSS는 TLT·TMT·TLS 1978년 말, TTS 1987년부터,
    UAH v6.1 하부 대류권 그림은 1979년부터입니다. 2026-10-13 확인 시 세 제품 모두 2026년 9월분까지 있습니다(STAR는 NCEI판 기준, STAR 서버 파일은 2025년 7월분에 멈춰 있음).

resolution:
  spatial_short: "278 km (2.5°)"
  temporal_short: "1개월"
  spatial: >-
    RSS: 2.5°×2.5° 위경도 격자(144×72), 월평균은 82.5°S–82.5°N(TLT는 70°S–82.5°N)까지만 / NOAA STAR: 2.5°×2.5° 전지구 격자 /
    UAH: 층별 텍스트 파일(uahncdc_*_6.1.txt) 제공 — 지역 구성은 파일 머리글에서 확인
  vertical: >-
    채널별 가중함수로 정의되는 두꺼운 층의 평균 밝기온도(층 하나당 값 하나). STAR v5.0 Readme 기준 가중함수 정점은 TLT 약 3 km, TMT 약 5 km,
    TUT 약 10 km, TLS 약 17 km. RSS는 TTS(대류권-성층권), UAH는 TP(대류권계면) 층을 따로 제공
  temporal: 월평균

coverage:
  short: 전지구
  note: "RSS는 82.5°S–82.5°N(TLT는 70°S–82.5°N)"
update: "매월 (UAH는 보통 다음 달 첫 주, RSS 파일은 2026-10-06에 9월분 갱신, NOAA STAR NCEI판은 2026-10-05에 9월분 갱신)"
license: >-
  RSS는 무료 이용(FTP 서버는 무료 등록 필요), UAH는 공개 텍스트 파일, NOAA STAR CDR은 NOAA 공개 자료로 제한 없이 이용 가능 — 모두 인용 요청
account_required: false

summary: >-
  1978년 말부터 NOAA·Metop·Aqua 등 극궤도 위성의 마이크로파 탐측기(MSU → AMSU-A → ATMS)가 잰 산소 열복사로 대기의 두꺼운 층(하부·중층 대류권, 하부 성층권 등) 평균 기온을 구한 월별 자료입니다.
  같은 관측을 RSS, UAH, NOAA STAR가 위성 간 보정·궤도 표류(일주기) 보정 방식을 달리해 이어 붙였기 때문에, 1979년 이후 대류권 온난화 추세의 크기가 제품마다 다릅니다.
  라디오존데가 드문 곳까지 고르게 덮는 40여 년 상층 기온 기록이라 기후변화 탐지, 재분석·기후모델 검증(대류권 증폭 논쟁)에 표준처럼 쓰입니다.

time_convention:
  summary: >-
    모든 값은 달마다의 평균 밝기온도(K) 또는 그 편차입니다. 위성 통과 시각이 바뀌는 효과를 '일주기 보정'으로 없애 일정한 지방 시각에 맞춘 값이며,
    특정 시각의 순간값이 아닙니다.
  points:
    - "편차(anomaly)의 기준 기간이 제품마다 다릅니다. RSS는 1979~1998년(페이지 일부에는 1978~1998년), NOAA STAR v5.0은 2000~2019년입니다. 제품끼리 비교할 때는 같은 기준 기간으로 다시 맞추세요."
    - "극궤도 위성은 시간이 지나며 통과 지방 시각이 표류하므로, 그대로 두면 하루 중 기온 변화가 추세로 섞입니다. 이 보정 방법의 차이가 RSS·UAH·STAR 추세 차이의 주된 원인입니다."
    - "UAH v6.1은 2021년 이후 Metop-B(궤도 유지 위성) 하나만 쓰고, STAR v5.0은 Aqua·Metop-A·Suomi NPP·NOAA-20 같은 안정 궤도 위성을 기준으로 이어 붙입니다."
    - "TLT는 한 채널을 그대로 쓴 값이 아니라 관측을 조합해 만든 값입니다. 예를 들어 STAR v5.0은 TLT = 1.430×TMT − 0.462×TUT + 0.032×TLS 로 계산합니다."
  source: https://www.star.nesdis.noaa.gov/data/mscat/MSU_AMSU_v5.0/Monthly_Atmospheric_Layer_Mean_Temperature/Readme_STAR_V5.0_Mean_Layer_Temperature_CDR.pdf
  source_name: STAR V5.0 Readme + RSS Upper Air Temperature 페이지 + UAH v6.1 공지

variables:
  note: >-
    세 제품은 파일 형식과 변수 이름이 서로 다릅니다. 변수명 칸은 NOAA STAR v5.0 netCDF(NCEI 배포, Mean-Layer-Temperature-NOAA_v05r00_<층>_*.nc)의 이름이며, NCEI OPeNDAP 메타데이터(.das·.dds)로 확인했습니다(2026-10-14).
    RSS V4.0은 NCEI 사본(uat4_tb_v04r00_anom_ch<층>_*.nc)의 편차 파일에서 `brightness_temperature_anomaly`를 확인했고, RSS 서버 파일(RSS_Tb_*Maps_ch_*_V4_0.nc) 속 이름은 공식 문서에 없어 확인하지 못했습니다.
    UAH는 netCDF 없이 텍스트 표만 제공합니다. 단위는 모두 K(편차는 K 차이)입니다.
  full_list: https://www.ncei.noaa.gov/thredds/catalog/satellite/mean-layer-temperature-noaa/catalog.html
  groups:
    - name: 대류권 층 평균 기온
      kind: mean
      period: 월
      items:
        - text: "하부 대류권 기온 TLT — `tcdr_MSU_AMSUA_ATMS_TLT` (K)"
          std: [t_air]
          note: "제공처 RSS·UAH(LT)·STAR. 이름은 STAR(편차 `tcdr_MSU_AMSUA_ATMS_TLT_anomaly`, 기후값 `_climatology`). RSS는 층마다 파일 하나(NCEI 사본 편차 `brightness_temperature_anomaly`), UAH는 텍스트 표 uahncdc_lt_6.1.txt"
        - text: "중층 대류권 기온 TMT — `tcdr_MSU_AMSUA_ATMS_TMT` (K)"
          std: [t_air]
          note: "제공처 RSS·UAH(MT)·STAR. 이름은 STAR(편차 `_anomaly`, 기후값 `_climatology`). RSS NCEI 사본 편차 `brightness_temperature_anomaly`, UAH는 텍스트 표 uahncdc_mt_6.1.txt"
        - text: "상부 대류권 기온 TUT — `tcdr_MSU_AMSUA_ATMS_TUT` (K)"
          std: [t_air]
          note: "STAR만 제공. 편차 `_anomaly`, 기후값 `_climatology`"
        - text: "대류권 기온 TTT — RSS (K)"
          std: [t_air]
          note: "RSS만 제공, TMT·TLS 조합(Fu & Johanson 2005 방식). RSS 서버 파일 RSS_Tb_Maps_ch_TTT_V4_0.nc(NCEI 사본 없음) 속 변수 이름은 공식 문서 미기재"
    - name: 대류권계면·성층권 층 평균 기온
      kind: mean
      period: 월
      items:
        - text: "대류권계면~하부 성층권 기온 TTS — RSS (K)"
          std: [t_air]
          note: "RSS만 제공, 1987년부터. 층마다 파일 하나라 NCEI 사본(uat4_tb_v04r00_*_chtts_*.nc)도 TLT·TMT와 같은 이름 구조(편차 `brightness_temperature_anomaly`)로 보이나 이 층은 직접 확인하지 못함"
        - text: "대류권계면 층 기온 TP — UAH (K)"
          std: [t_air]
          note: "UAH만 제공. 텍스트 표 uahncdc_tp_6.1.txt라 변수 이름 없음"
        - text: "하부 성층권 기온 TLS — `tcdr_MSU_AMSUA_ATMS_TLS` (K)"
          std: [t_air]
          note: "제공처 RSS·UAH(LS)·STAR. 이름은 STAR(편차 `_anomaly`, 기후값 `_climatology`). RSS는 NCEI 사본 편차 파일, UAH는 텍스트 표 uahncdc_ls_6.1.txt"
    - name: 편차·보조 자료
      kind: mean
      period: 월
      items:
        - text: "월 편차 지도 — `tcdr_MSU_AMSUA_ATMS_*_anomaly`, `brightness_temperature_anomaly` (K)"
          note: "앞은 NOAA STAR v5.0 netCDF(* 자리에 TLT·TMT·TUT·TLS, 기후값 `tcdr_MSU_AMSUA_ATMS_*_climatology`), 뒤는 RSS V4.0의 NCEI 사본 uat4_tb_v04r00_anom_ch*.nc(기후값 `brightness_temperature_climatology`). RSS 서버 파일 RSS_Tb_Anom_Maps_ch_*_V4_0.nc 속 이름은 공식 문서 미기재, STAR 서버의 *_Anomaly.dat는 이진 파일이라 변수 이름 없음"
        - text: "지역 평균 편차 시계열 — 텍스트 표 (K)"
          note: "모두 텍스트 표. UAH uahncdc_*_6.1.txt(열 이름은 파일 머리글, 2026-10-14 서버가 자동 접근을 막아 미확인). STAR …_Regional_Means_Anomaly.txt(열 이름: Year, Month, Ftime, Global_Mean_Anomaly, NH_Anomaly, SH_Anomaly, Global_Land_Anomaly, Global_Ocean_Anomaly). RSS RSS_Monthly_MSU_AMSU_Channel_*_Anomalies_Land_and_Ocean_v04_0.txt(열: year, mon, 위도대 -70.0/82.5, -20.0/20.0, 20.0/82.5, -70.0/-20.0, 60.0/82.5, -70.0/-60.0, Cont. USA, 0.0/82.5, -70.0/0.0)"

access:
  - name: RSS — Upper Air Temperature (자료 설명·다운로드)
    url: https://www.remss.com/measurements/upper-air-temperature/
    method: 웹 / HTTPS (netCDF 지도, 텍스트 시계열)
  - name: RSS netCDF 지도 파일 (V4.0)
    url: https://data.remss.com/msu/data/netcdf/
    method: HTTPS 직접 다운로드
    note: "월평균(RSS_Tb_Maps_ch_*_V4_0.nc)과 편차(RSS_Tb_Anom_Maps_ch_*_V4_0.nc) 파일이 층마다 하나씩 있습니다."
  - name: UAH v6.1 하부 대류권 시계열 (텍스트)
    url: https://vortex.nsstc.uah.edu/data/msu/v6.1/tlt/uahncdc_lt_6.1.txt
    method: HTTP 직접 다운로드
    note: 중층 대류권은 tmt/uahncdc_mt_6.1.txt, 대류권계면은 ttp/uahncdc_tp_6.1.txt, 하부 성층권은 tls/uahncdc_ls_6.1.txt 입니다.
  - name: NOAA NCEI — Mean Layer Temperature-NOAA CDR (STAR v5.0)
    url: https://www.ncei.noaa.gov/products/climate-data-records/mean-layer-temperature-noaa
    method: HTTPS·THREDDS·AWS S3·Google Cloud (netCDF4)
    note: 2026-10 확인 시 NCEI THREDDS에 2026년 9월분까지 있습니다. STAR 자체 서버의 v5.0 파일은 2025년 7월분에서 멈춰 있어 최신 자료는 NCEI에서 받으세요.
  - name: NOAA NCEI — Mean Layer Temperature-RSS CDR (V4.0 사본)
    url: https://www.ncei.noaa.gov/products/climate-data-records/mean-layer-temperature-rss
    method: HTTPS·THREDDS·클라우드 (netCDF4)
    note: NCEI 메타데이터상 2025년 2월에서 끝나고 '갱신 계획 없음'입니다. 최신 RSS 자료는 RSS 서버에서 받으세요.

example:
  lang: python
  note: "RSS netCDF는 로그인 없이 HTTPS로 받습니다. 공식 페이지에 변수 이름이 없으므로 먼저 열어서 확인하세요. NOAA STAR v5.0은 NCEI THREDDS 카탈로그에서 최신 파일 이름(…_E<마지막 달>_C<생성일>.nc)을 확인해 같은 방식으로 받습니다."
  code: |
    # pip install xarray netCDF4 requests
    import requests
    import xarray as xr

    url = "https://data.remss.com/msu/data/netcdf/RSS_Tb_Anom_Maps_ch_TLT_V4_0.nc"   # RSS V4.0 TLT 월 편차 지도
    with open("rss_tlt_anom.nc", "wb") as f:
        f.write(requests.get(url, timeout=120).content)

    ds = xr.open_dataset("rss_tlt_anom.nc")
    print(ds)                       # 변수 이름·차원(시간, 위도, 경도)·기준 기간 속성 확인

tips:
  - "세 제품의 1979년 이후 TLT·TMT 추세는 같은 관측에서 나왔어도 서로 다릅니다. 결론이 특정 제품에 달려 있지 않은지 세 제품을 모두 보고 범위로 보고하세요."
  - "RSS 페이지는 TTS·TLS가 '아직 V3.3'이라는 설명과 V4.0이라는 표기가 섞여 있습니다. 실제 배포 파일 이름은 모든 층이 V4_0이므로, 논문에는 받은 파일 이름의 버전과 층별 참고문헌(TLT Mears & Wentz 2017, TMT·TTT 2016, TTS·TLS 2009)을 함께 적으세요."
  - "RSS 텍스트(UAH 호환 형식) 파일은 '구식(deprecated)'으로 표시되어 있어 새 코드에는 netCDF를 쓰라고 안내합니다."
  - "RSS는 ATMS를 아직 쓰지 않는다고 밝히고 있습니다(AMSU는 앞으로 ATMS로 대체 예정). 노후 AMSU 위성이 표류·고장으로 빠지면 RSS 기록의 연속성이 흔들릴 수 있습니다."
  - "NOAA STAR v5.0은 ATMS(Suomi NPP·NOAA-20)를 씁니다. Suomi NPP 과학 자료 전달이 2026년 11월 초 끝난다는 NOAA·NASA 공지가 있으니, 그 이후 판 갱신·재처리 공지를 확인하세요."
  - "TLS·TTS 등 성층권 층은 큰 화산 분출(엘치촌, 피나투보) 뒤 크게 튀므로 선형 추세를 구할 때 해당 기간 처리를 명시하세요."
  - "격자 자료의 면적 평균에는 위도의 cos 가중을 주고, RSS는 고위도(82.5° 바깥, TLT는 70°S 남쪽) 값이 없다는 점을 반영하세요."

