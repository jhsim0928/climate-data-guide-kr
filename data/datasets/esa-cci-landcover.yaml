transitions:
  - from: ESA CCI Land Cover v2.0.7cds (1992–2015)
    to: C3S Land Cover v2.1.1 (2016~)
    status: completed
    date: "2019-10"
    summary: >-
      ESA CCI 사업이 만든 1992~2015년 기록을 C3S가 같은 처리 체계로 이어 받아 2016년부터 해마다 지도를 추가하고 있습니다.
      두 판은 한 시계열로 이어지도록 설계되었지만 생산 주체·입력 위성·파일 이름이 다릅니다.
    changes:
      - aspect: 기간
        before: 1992–2015
        after: 2016–2022 (2026-10 기준, 2023–2025 검토 중)
      - aspect: 생산·배포
        before: ESA CCI Land Cover 사업 (CEDA·CCI 뷰어, CDS에는 v2.0.7cds로 수록)
        after: Copernicus C3S (CDS) — 2016~2018년은 2019년 10월, 2019년은 2021년 1월, 2020년은 2021년 5월 공개
      - aspect: 변화 탐지 입력 위성
        before: AVHRR(1992–1999), SPOT-VGT(1998–2012), PROBA-V(2013–2015)
        after: PROBA-V, Sentinel-3 OLCI·SLSTR
      - aspect: 파일 이름
        before: ESACCI-LC-L4-LCCS-Map-300m-P1Y-…-v2.0.7cds
        after: C3S-LC-L4-LCCS-Map-300m-P1Y-YYYY-v2.1.1.nc
      - aspect: 변수·범례
        before: lccs_class + 품질 플래그 4종, 22등급 LCCS 범례
        after: 동일
    impacts:
      - CDS에서 연도에 맞는 버전을 골라야 합니다(1992~2015 v2_0_7cds, 2016~ v2_1_1). 두 판을 이어 쓰는 것은 공식적으로 의도된 사용법입니다.
      - 2015→2016년 경계에서 입력 위성과 생산 체계가 바뀌므로, 이 해의 변화량이 튀면 실제 변화인지 확인하세요.
    sources:
      - name: CDS — Land cover classification gridded maps from 1992 to present (개요)
        url: https://cds.climate.copernicus.eu/datasets/satellite-land-cover?tab=overview
      - name: ESA CCI — Release of C3S Global Land Cover products for 2016, 2017 & 2018
        url: https://climate.esa.int/en/projects/land-cover/news/new-release-c3s-global-land-cover-products-2016-2017-2018-consistent-cci-1992-2015-map-series/
      - name: ESA CCI Land Cover 다운로드 페이지 (연도별 공개 이력)
        url: https://maps.elie.ucl.ac.be/CCI/viewer/download.php

notices:
  - date: "2026-10-05"
    level: info
    title: CDS 이용약관 개정 (2026-10-28 시행)
    body: >-
      CDS 이용약관 제1조(제품·서비스 설명)가 2026년 10월 28일부터 바뀝니다. 계속 쓰면 동의한 것으로 보며,
      동의하지 않으면 10월 27일까지 ECMWF 지원창구에 알려야 하고 그 경우 Copernicus 제품 접근이 끊깁니다.
    source: https://forum.ecmwf.int/t/upcoming-cds-terms-of-use-change/15374
  - date: "2026-07-17"
    level: info
    title: 2023~2025년 지도와 문서 ECMWF 검토 중 — 공개까지 보통 약 3개월
    body: >-
      ECMWF는 2023~2025년 자료와 관련 문서(PUGS·PQAR·ATBD)가 검토 단계에 있으며, 이 단계부터 CDS 공개까지 보통 3개월쯤 걸린다고 답했습니다.
      여름 휴가철로 늦어질 수 있다고 덧붙였고, 정확한 공개일은 밝히지 않았습니다.
    source: https://forum.ecmwf.int/t/esa-cci-lc-landcover-23-24-25-updates/15175
  - date: "2026-04-16"
    level: warning
    title: 공개 일정 재조정 — 2023·2024·2025년 지도를 2026년 6월 함께 전달
    body: >-
      사업단은 2023·2024·2025년 지도를 2026년 6월 ECMWF에 함께 넘기고, 공개는 표준 검토 절차를 거친다고 밝혔습니다.
      이전 계획(2023·2024년은 2026년 3월 말, 2025년은 2027년 2월 말)보다 2023·2024년은 약 3개월 늦고 2025년은 약 8개월 빠릅니다.
    source: https://forum.ecmwf.int/t/update-of-land-cover-classification-gridded-maps/12957
  - date: "2025-07-04"
    level: warning
    title: 사업 단계 전환으로 갱신 지연 — 2023·2024년 지도는 2026년 중 예정
    body: >-
      CDS 데이터셋 안내문은 사업 단계가 바뀌면서 갱신 일정이 달라졌고, 2023·2024년 자료는 2026년 중 나올 예정이라고 밝혔습니다.
      평소에는 1년 지연으로 해마다 갱신됩니다.
    source: https://cds.climate.copernicus.eu/datasets/satellite-land-cover
  - date: "2024-09-26"
    level: critical
    title: 구 CDS 종료 — API 주소·키 갱신 필요
    body: >-
      구(legacy) CDS가 닫히고 새 CDS로 전환되었습니다. .cdsapirc의 url을 https://cds.climate.copernicus.eu/api로 바꾸고 새 CDS의 API key를 넣어야 하며,
      예전 설정으로 보낸 요청은 실패합니다.
    source: https://forum.ecmwf.int/t/goodbye-legacy-climate-data-store-hello-new-climate-data-store-cds/6380

