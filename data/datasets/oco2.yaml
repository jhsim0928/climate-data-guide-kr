# ─────────────────────────────────────────────────────────────
# OCO-2 XCO2·SIF — 데이터셋 정보 파일
# 위성 탭(에어로졸·대기 성분). Lite XCO2는 2014~2023년 V11.2r, 2024년 이후 V11.3r(검출기 결빙 보정)로 나뉩니다.
# 2026년 8월부터 Caltech이 NASA와의 무상 우주법 협정(최대 5년)으로 OCO-2·OCO-3를 운영합니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: oco2
name: "OCO-2"
full_name: Orbiting Carbon Observatory-2 (OCO-2) Level 2 XCO2 (Lite FP·Standard) and Solar-Induced Fluorescence (Lite SIF), Build 11 (NASA 궤도 탄소 관측위성 2호 이산화탄소 기둥 평균 농도·엽록소 형광)
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 80
domains: [대기, 육지, 원격탐사]
provider: NASA JPL OCO-2/OCO-3 과학팀 (2026-08부터 Caltech 운영) / NASA GES DISC

status: active
status_note: >-
  2014년 7월 발사된 OCO-2는 2년 주임무를 훨씬 넘겨 계속 관측 중입니다. NASA는 2025년 두 임무를 맡을 협력 기관을 공모한 끝에 2026년 8월 14일 Caltech과 OCO-2·OCO-3 운영에 관한 무상 우주법 협정(Space Act Agreement)을 맺었습니다.
  협정 기간은 최대 5년이고 임무 소유권은 NASA에 남으며, Caltech이 위성·과학자료 체계를 운영합니다. 2026-10-13 확인 시 GES DISC의 Lite XCO2 V11.3r은 2026-07-28, Lite SIF V11.2r은 2026-07-27,
  준실시간 Forward V11.3은 2026-10-10 자료까지 올라와 있습니다. 2026-06-01부터 2024년 이후 XCO2는 검출기 결빙 편향을 보정한 V11.3r로 바뀌었습니다.

transitions:
  - from: OCO-2 Lite XCO2 V11.2r
    to: OCO-2 Lite XCO2 V11.3r
    status: completed
    date: "2026-06"
    summary: >-
      2024년 이후 검출기(초점면 배열)에 얼음이 쌓이면서 생긴 음(−)의 XCO2 편향을 보정 항으로 바로잡은 판입니다. 2014~2023년은 다시 처리하지 않았으므로
      전 기간 분석은 2023년까지 V11.2r, 2024년부터 V11.3r을 이어 씁니다.
    changes:
      - aspect: 공개 시점
        before: "V11.2r 2024-04-01 (인용 정보 공개일)"
        after: "V11.3r 2026-06-01 (Forward V11.3은 2026-06-03 생산분부터)"
      - aspect: 적용 기간
        before: "2014-09~2026-03 (CMR 파일 기준)"
        after: "2024-01-01~현재. 2014~2023년은 V11.2r을 그대로 사용"
      - aspect: 편향 보정
        before: "특징(FEAT)·footprint(FOOT)·TCCON 전역 보정 세 항"
        after: "위 세 항 + 결빙 항(zero-level offset, 미광 지표로 결빙에 따른 투과율 손실 추정)"
      - aspect: 보정 크기(2024년 평균)
        before: "2025년 2월 해빙(decontamination) 직전 V11.2 편향 약 0.5 ppm(footprint마다 다름)"
        after: "결빙 보정량 평균 0.20 ppm(육지 0.25, 바다 0.17 ppm)"
      - aspect: 되돌리기
        before: "-"
        after: "Lite 파일에 결빙 항 정보가 들어 있어 V11.3r 값에서 빼면 V11.2r 값을 복원할 수 있음"
    impacts:
      - "2024년 이후 V11.2r 값은 결빙 편향(최대 약 0.5 ppm)이 남아 있으니 V11.3r로 바꾸세요. 성장률·계절 진폭 분석에서 0.2~0.5 ppm은 무시할 수 없는 크기입니다."
      - "2014~2023년은 V11.3r 파일이 없습니다. 장기 시계열은 두 판을 이어 붙이되, 이음 지점(2024-01)을 논문에 밝히세요."
      - "SIF Lite와 L2 Standard는 이번 개정 대상이 아닙니다(공개 문서 기준)."
    sources:
      - name: OCO-2 Level 2 Data Release Statement v11.3 (Rev A, 2026-06)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_L2_Data_Release_Statement_v11.3_RevA_V01.pdf
      - name: OCO-2 V11.2 / OCO-3 V11 L2 Data User's Guide (v04 Rev B, 2026-06-10)
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_V11.2_OCO3_V11_L2_Data_Users_Guide_v04_RevB_260610.pdf

period:
  start: "2014-09"
  end: present
  note: >-
    OCO-2는 2014-07-02 발사되었고 2014-08-03 A-Train 대열에 들어갔습니다. Lite XCO2 V11.2r 파일은 2014-09-06부터, Lite SIF V11.2r은 2014-09-01부터 있습니다.
    2026-10-13 확인 시 확정판(Retrospective) Lite XCO2 V11.3r은 2026-07-28, Lite SIF는 2026-07-27, L2 Standard V11.2r은 2026-07-28 자료까지이고,
    준실시간 Forward XCO2(OCO2_L2_Fwd_FP V11.3, 2025-02-02부터)는 2026-10-10까지 올라와 있습니다. 해빙 작업·궤도 조정 기간에는 자료가 빕니다.

resolution:
  spatial_short: "2 km (0.02°)"
  temporal_short: "1일"
  spatial: >-
    궤도를 따라 한 번에 8개 footprint를 나란히 관측(0.333초마다)하는 스와스 자료. footprint는 진행 방향 2.25 km 미만, 직교 방향 0.1~1.3 km(천저 기준)이고,
    스와스는 시야각 0.8°, 폭 10 km 미만입니다. 격자 자료가 아니라 관측점(sounding)마다 위경도가 있는 점 자료입니다.
  vertical: "기둥 평균 건조공기 몰분율 XCO2 (단일 값) + 사전 CO2 분포·평균화 커널은 관측점별 산출 기압면(`pressure_levels`) 위에 제공"
  temporal: >-
    태양동기 극궤도, 상승 교점 지방시 약 13:30, 16일(233궤도) 반복 주기. 낮 쪽 반구만 관측하며 천저(nadir)·태양 반사광(glint)·표적(target) 모드를 씁니다.
    Lite 파일은 UTC 하루 단위로 묶이고, Standard 파일은 궤도·모드 구간 단위입니다.

coverage:
  short: 전지구
  note: "폭 10 km 미만 좁은 궤도 스와스의 점 자료, 주간"
update: "준실시간 Forward: 보통 관측 후 2일 안(일별 편향 보정 Forward는 일주일 안) / 확정판 Retrospective: 월 단위 (2026-10 기준 약 2~3개월 지연)"
license: NASA 지구과학 공개 자료 — 무료, 이용 제한 없음. 내려받기에는 무료 NASA Earthdata 로그인이 필요하며 데이터셋 DOI 인용을 요청합니다
account_required: true

summary: >-
  OCO-2는 이산화탄소(CO2) 1.61·2.06 µm 띠와 산소 A띠(0.76 µm)의 태양 반사광을 고분광 분해능으로 측정해, 지표부터 대기 꼭대기까지 평균한
  건조공기 CO2 몰분율(XCO2)을 천저 기준 1.3 km × 2.25 km 이하 크기의 관측점으로 하루 최대 약 100만 개 얻는 NASA 탄소 관측위성입니다. 같은 O2 A띠에서 식물의 광합성 활동을 나타내는
  태양 유도 엽록소 형광(SIF)도 산출합니다. 연구에는 품질 선별과 편향 보정을 마친 일별 Lite 파일(XCO2: OCO2_L2_Lite_FP, SIF: OCO2_L2_Lite_SIF)을 쓰도록 권장되며,
  탄소 흡수원·도시·발전소 배출, 가뭄의 식생 영향 연구에 널리 쓰입니다.

time_convention:
  summary: >-
    모든 값은 위성이 지나간 순간의 관측값(약 13:30 지방시 통과)입니다. Lite 파일 하나에는 UTC 하루 동안의 관측점이 들어 있고, `time`은 관측점별 시각입니다.
    SIF에는 순간값과 함께, 맑은 하늘 일사량 변화를 가정해 하루 평균으로 환산한 `Daily_SIF_*`가 따로 들어 있습니다.
  points:
    - "XCO2 Lite의 `time`은 1970-01-01 00:00:00 UTC부터의 초, SIF Lite의 `Delta_Time`은 1990-01-01 00:00:00 UTC부터의 초입니다. 두 파일의 시간 기준이 다릅니다."
    - "Lite 파일 날짜는 UTC 하루입니다. 동아시아(한국 시간 오후 1시 반 무렵 통과)는 같은 UTC 날짜 안에 들어가지만, 날짜변경선 근처 궤도는 경계를 넘을 수 있습니다."
    - "준실시간 Forward(OCO2_L2_Fwd_FP)는 관측 후 며칠 안에 나오지만 보정·선별이 덜 된 판입니다. 확정판 Retrospective(이름 끝 'r', 예 11.3r)는 한 달 단위로 나오며 연구에 권장됩니다."
    - "`Daily_SIF_*`는 측정한 하루 평균이 아니라 순간 SIF에 `Science/daily_correction_factor`(맑은 하늘 cos(태양천정각) 적분 가정)를 곱한 추정값입니다."
    - "Aqua·Aura 등이 빠지면서 2025년 1월 기준 A-Train에는 OCO-2와 GCOM-W1만 남았습니다. 함께 쓰던 Aqua MODIS 등과는 이제 통과 시각이 다릅니다."
  source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_V11.2_OCO3_V11_L2_Data_Users_Guide_v04_RevB_260610.pdf
  source_name: OCO-2 V11.2 / OCO-3 V11 L2 Data User's Guide + OCO-2 SIF v11.2 User's Guide + OCO-2 Lite 파일 설명서(V8r)

variables:
  note: >-
    XCO2 Lite 변수는 OCO-2 L2 사용자 안내서(V11.2/V11.3)와 Lite 파일 설명서(V8r, 2017)에, SIF Lite 변수는 SIF V11.2 사용자 안내서 표 4-1에 근거합니다.
    `Sounding/`·`Retrieval/`·`Science/`·`Metadata/`는 netCDF4 그룹입니다. 일부 읽기 도구는 그룹을 보여 주지 않으니 HDF5 도구나 xarray의 group 인자를 쓰세요.
  full_list: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_V11.2_OCO3_V11_L2_Data_Users_Guide_v04_RevB_260610.pdf
  groups:
    - name: XCO2 Lite (OCO2_L2_Lite_FP, 일별 netCDF4)
      kind: instant
      period: 관측 시각
      items:
        - text: "편향 보정·품질 선별 XCO2 — `xco2` (ppm)"
          std: [co2]
          note: 과학 분석용 기본 변수
        - "XCO2 사후 불확실성 — `xco2_uncertainty` (ppm)"
        - text: "단순 품질 플래그 — `xco2_quality_flag`"
          note: 0 좋음(모든 시험 통과), 1 나쁨
        - "품질 시험별 비트 플래그 — `xco2_qf_bitflag`, `xco2_qf_simple_bitflag`"
        - "보정 전 XCO2 — `Retrieval/xco2_raw` (ppm)"
        - text: "사전 XCO2 — `xco2_apriori` (ppm)"
          std: []
        - text: "기둥 평균화 커널 — `xco2_averaging_kernel` (무차원)"
          std: []
        - text: "사전 CO2 연직 분포 — `co2_profile_apriori` (ppm)"
          std: []
        - "산출 기압면 — `pressure_levels` (hPa)"
        - "기압 가중 함수 — `pressure_weight`"
        - text: "산출된 지표 기압 — `Retrieval/psurf`"
        - text: "관측점 중심 위도·경도 — `latitude`, `longitude` (°)"
        - text: "관측 시각 — `time` (seconds since 1970-01-01 00:00:00 UTC)"
        - text: "관측점 식별자 — `sounding_id`"
          note: YYYYMMDDhhmmssmf 형식 16자리 숫자
        - text: "관측 모드 — `Sounding/operation_mode`"
          note: 0 천저, 1 반사광, 2 표적, 3 전환
        - text: "육지 비율 — `Sounding/land_fraction`"
        - text: "태양천정각 — `solar_zenith_angle` (°)"
    - name: SIF Lite (OCO2_L2_Lite_SIF, 일별 netCDF4)
      kind: instant
      period: 관측 시각
      items:
        - text: "740 nm 환산 SIF — `SIF_740nm` (W/m2/sr/µm)"
          note: 757·771 nm 산출값에서 환산
        - "740 nm SIF 1σ 불확실성 — `SIF_Uncertainty_740nm` (W/m2/sr/µm)"
        - "757·771 nm SIF — `Science/SIF_757nm`, `Science/SIF_771nm` (W/m2/sr/µm)"
        - text: "하루 평균 환산 SIF — `Daily_SIF_740nm`, `Daily_SIF_757nm`, `Daily_SIF_771nm` (W/m2/sr/µm)"
          kind: mean
          period: 일
          note: 순간값 × 일평균 보정 계수(맑은 하늘 가정)
        - "일평균 보정 계수 — `Science/daily_correction_factor`"
        - text: "품질 플래그 — `Quality_Flag`"
          note: 0 최상, 1 양호, 2 실패, −1 미검토. 보통 0·1만 사용
        - text: "위도·경도 — `Latitude` (°N), `Longitude` (°E)"
        - text: "관측 시각 — `Delta_Time` (seconds since 1990-01-01 00:00:00 UTC)"
        - text: "관측 모드 — `Metadata/MeasurementMode`"
          note: 0 천저, 1 반사광, 2 표적, 3 영역 지도(OCO-3 전용), 4 전환

