notices:
  - date: "2026-09-18"
    level: warning
    title: GES DISC 기존 데이터 서버 접근 종료 예정 — Earthdata Cloud로 전환
    body: >-
      GES DISC는 온프레미스 서버의 HTTPS 접근을 빨라야 2026년 9월 30일 이후 끊는다고 긴급 공지했습니다. 자료는 Earthdata Cloud에서 계속 무료로 받을 수 있지만,
      wget·curl로 디렉터리를 통째로 받는 방식은 더 이상 안 되므로 CMR(또는 earthaccess)로 파일 목록을 만들어야 합니다. OCO2_L2_Lite_FP V11.3r·Fwd_FP V11.3의 OPeNDAP도 2026년 8월 말 클라우드로 옮겨졌습니다.
    source: https://disc.gsfc.nasa.gov/information/alerts
  - date: "2026-08-24"
    level: info
    title: NASA, Caltech과 OCO-2·OCO-3 운영 협정 체결 (최대 5년)
    body: >-
      NASA는 2026년 8월 14일 Caltech과 OCO-2·OCO-3에 관한 무상 우주법 협정을 맺었다고 밝혔습니다. Caltech이 두 임무와 과학자료 체계를 운영하고 새 산출물도 만들며,
      임무 소유권은 NASA가 유지합니다. 협력 기간은 최대 5년입니다.
    source: https://science.nasa.gov/blogs/oco-2/2026/08/24/nasa-caltech-partner-on-two-earth-science-missions/
  - date: "2026-06-01"
    level: warning
    title: Lite XCO2 V11.3r 공개 — 2024년 이후 검출기 결빙 편향 보정
    body: >-
      2023년 2월부터 2025년 2월까지 해빙 작업이 없어 검출기에 얼음이 쌓이면서 V11.2 XCO2가 음의 방향으로 치우쳤습니다(2025년 2월 무렵 약 0.5 ppm).
      V11.3은 편향 보정에 결빙 항을 더해 2024-01-01 이후 자료를 고쳤습니다. 2024년 이후 분석은 V11.3r로 바꾸세요.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/OCO/OCO2_L2_Data_Release_Statement_v11.3_RevA_V01.pdf
  - date: "2025-06-10"
    level: info
    title: 편향 보정 일별 Forward XCO2·SIF 제공 시작 (관측 후 일주일 안)
    body: >-
      OCO-2·OCO-3의 편향 보정 일별 Forward 산출물(V11.2)이 관측 후 일주일 안에 나오기 시작했습니다. 기준 기록은 여전히 한 달 단위로 나오는 확정판 Lite 파일입니다.
    source: https://ocov2.jpl.nasa.gov/whats-new-oco-2/
  - date: "2025-02-20"
    level: info
    title: 21번째 해빙(decontamination) 완료 — 역대 가장 긴 2년 공백 후
    body: >-
      OCO-2가 초점면 배열에 쌓인 얼음을 없애는 21번째 해빙 작업(2025년 2월 10~17일)을 마쳤습니다. 이전 해빙과 2년 간격으로 가장 길었으며, 이 기간 결빙 영향은 V11.3에서 보정되었습니다.
    source: https://ocov2.jpl.nasa.gov/whats-new-oco-2/

