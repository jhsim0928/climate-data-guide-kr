example:
  lang: python
  note: >-
    earthaccess로 2024년 7월 한반도 주변 Lite XCO2(V11.3r)를 받아 품질 0인 관측점만 고르는 예입니다. 처음 실행 때 Earthdata 아이디·비밀번호를 묻습니다.
    2023년 이전 기간은 version="11.2r"로 바꾸세요.
  code: |
    import earthaccess
    import xarray as xr
    import numpy as np

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="OCO2_L2_Lite_FP", version="11.3r",
        temporal=("2024-07-01", "2024-07-31"),
        bounding_box=(120, 30, 135, 45),   # (서, 남, 동, 북)
    )
    files = earthaccess.download(results, "oco2_lite")

    out = []
    for f in files:
        ds = xr.open_dataset(f)                         # 최상위 변수 (xco2, latitude, ...)
        good = (ds["xco2_quality_flag"] == 0) \
            & ds["latitude"].between(30, 45) & ds["longitude"].between(120, 135)
        out.append(ds[["xco2", "xco2_uncertainty", "latitude", "longitude", "time"]].where(good, drop=True))
        # 관측 모드·육지 비율은 그룹 안에 있습니다:
        # snd = xr.open_dataset(f, group="Sounding"); snd["operation_mode"]

    sel = xr.concat(out, dim=out[0]["xco2"].dims[0])   # 관측점 차원으로 이어 붙이기
    print(sel.sizes, float(sel["xco2"].mean()))

tips:
  - "연구에는 Lite 파일의 `xco2`(편향 보정·선별 완료)를 쓰세요. `Retrieval/xco2_raw`나 L2 Standard의 XCO2는 편향 보정 전 값이라 그대로 쓰면 안 됩니다."
  - "`xco2_quality_flag` = 0만 쓰는 것이 기본입니다. 육지·바다(glint) 관측은 편향 특성이 달라, 둘을 섞어 평균할 때는 모드(`Sounding/operation_mode`)별로 먼저 비교해 보세요."
  - "2024년 이후 기간은 V11.3r을 쓰세요. 2023년 2월~2025년 2월 해빙 작업이 없었던 탓에 검출기 결빙으로 V11.2 XCO2가 최대 약 0.5 ppm 낮게 치우쳤습니다. 해빙은 매년 하기로 했습니다."
  - "사용자 안내서에 따르면 Lite 파일에는 WMO X2019 CO2 척도로 바꾼 XCO2(X2007 척도보다 약 0.08 ppm 높음)가 따로 들어 있습니다. `xco2`의 척도는 변수의 comment 속성에 적혀 있으니, 지상 관측(NOAA·TCCON)과 비교할 때 척도를 맞추세요."
  - "`xco2_uncertainty`는 산출 알고리즘의 사후 오차로, 설명서는 실제 오차보다 30~50% 작다고 밝힙니다. 오차 전파나 역산 가중치에 그대로 쓰지 마세요."
  - "구름·에어로졸이 많은 지역(동아시아 여름 장마, 열대)은 유효 관측점이 크게 줄어듭니다. 지역 평균은 표본 수를 함께 보고하세요."
  - "OCO-3(국제우주정거장 일본 실험 모듈 외부, 2019년~)는 OCO-2와 같은 방식의 자매 관측기로, 북위·남위 약 52° 안에서 하루 중 여러 시각을 관측하고 도시 지역을 훑는 SAM 모드가 있습니다. 2023년 11월~2024년 7월(7월 16일 과학 관측 재개) 보관 기간에는 자료가 없습니다. 자료는 GES DISC에서 OCO-3 컬렉션으로 따로 받습니다."
  - "SIF는 740 nm 환산값(`SIF_740nm`)이 다른 위성(TROPOMI 등)과 비교하기 쉽습니다. 광합성량(GPP)과 비교할 때는 순간값 대신 `Daily_SIF_*`를 쓰고, 맑은 하늘 가정임을 밝히세요."

