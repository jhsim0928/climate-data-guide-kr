notices:
  - date: "2026-08-31"
    level: warning
    title: 2026-09-01부터 OSI-405-d가 AMSR3 기반으로 운영 (서비스 메시지 #3571)
    body: >-
      AMSR3가 OSI SAF 해빙 산출물의 주 입력 센서가 되면서 L3 해빙 이동 OSI-405-d도 AMSR3 기반으로 운영됩니다. 제품 ID와 파일 이름은 바뀌지 않고
      FTP·THREDDS·EUMETCast 위치도 그대로입니다. 2026년 9월 전후로 입력 센서가 다르다는 점을 분석에 기록하세요.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september
  - date: "2026-08-18"
    level: info
    title: JAXA G-portal 점검으로 3일간 해빙 산출물 중단 (서비스 메시지 #3564·#3568)
    body: >-
      AMSR2 자료를 배포하는 JAXA G-portal 점검으로 2026-08-18 06:00 ~ 08-21 02:00 UTC에 OSI-405-d를 포함한 AMSR2 기반 산출물이 중단되었습니다.
      8월 18~20일자 파일은 정시에 나오지 않았고, OSI-405-d는 이틀 간격 입력이 필요해 다른 제품보다 늦게 재개된다고 안내되었습니다.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/resuming-production-osi-saf-sea-ice-products-based-amsr2
  - date: "2026-06-01"
    level: info
    title: 기후자료 연장판 OSI-435(2021~2025) 시범 공개
    body: >-
      OSI-455(1991~2020)를 잇는 저해상도 해빙 이동 연장판(ICDR) OSI-435가 시험(demonstrational) 제품으로 FTP(reprocessed_test)와 THREDDS에 올라왔습니다.
      SSMIS·AMSR2와 ERA5T 바람(백업 ECMWF 운영 예보)을 쓰며, DOI와 정식 운영 일정은 아직 공지되지 않았습니다.
    source: https://osi-saf.eumetsat.int/products/osi-435-complementing-osi-455
  - date: "2025-07-17"
    level: warning
    title: OSI-405-d 입력에서 DMSP SSMIS 제외 (서비스 메시지 #3321)
    body: >-
      DMSP SSMIS 자료 공급이 불안정해지면서 다중 센서 산출물(OSI-402-d·403-d·405-d)이 SSMIS를 더 이상 쓰지 않고 AMSR2를 주 입력으로 씁니다.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2025-05-19"
    level: warning
    title: 중해상도 해빙 이동 OSI-407-a 배포 종료 (서비스 메시지 #3236)
    body: >-
      정기적으로 쓰는 사용자가 확인되지 않아 중해상도 해빙 이동 OSI-407-a의 EUMETCast·FTP 배포가 2025-05-19 끝났습니다(공지 2025-04-09).
      OSI SAF는 저해상도 이동(OSI-405) 또는 Copernicus Marine 고해상도 SAR 해빙 이동 자료를 대안으로 권합니다.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/discontinuation-osi-saf-medium-resolution-sea-ice-drift-19-may
  - date: "2025-03-04"
    level: info
    title: OSI-405-c → OSI-405-d 전환 (서비스 메시지 #3193)
    body: >-
      저해상도 해빙 이동 준실시간 제품이 OSI-405-d로 일괄 전환되었습니다. NetCDF3 → NetCDF4, ASCAT Metop-B → Metop-C, 전역 속성 변경이 핵심이며
      EUMETCast 파일 이름에서 .gz가 빠졌습니다.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/new-sea-ice-emissivity-and-lr-sea-ice-drift-products

