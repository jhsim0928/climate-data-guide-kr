example:
  lang: python
  note: >-
    FTP나 THREDDS에서 받은 OSI-405-d 북반구 병합 파일을 연다고 가정합니다. 파일명 규칙은 ice_drift_<nh|sh>_polstere-625_multi-oi_<시작>-<끝>.nc
    (시각은 YYYYMMDDhhmm)입니다. OSI-455는 ice_drift_<nh|sh>_ease2-750_cdr-v1p0-<센서>_24h-<끝 YYYYMMDD1200>.nc 규칙(병합 파일은 센서 부분 생략)이므로 정확한 이름은 FTP 목록에서 확인하세요.
  code: |
    import numpy as np
    import xarray as xr

    ds = xr.open_dataset("ice_drift_nh_polstere-625_multi-oi_202401011200-202401031200.nc")
    dX = ds["dX"].squeeze()            # km, 48시간 누적 변위 (격자 x 방향)
    dY = ds["dY"].squeeze()
    flag = ds["status_flag"].squeeze()

    # 벡터별 실제 경과 시간 = (time_bnds[1] + dt1) - (time_bnds[0] + dt0)
    tb = ds["time_bnds"].squeeze().values
    span_s = (tb[1] - tb[0]) / np.timedelta64(1, "s") + ds["dt1"].squeeze() - ds["dt0"].squeeze()

    speed_cm_s = np.hypot(dX, dY) * 1e5 / span_s       # km → cm, 구간 평균 속도
    good = flag >= 20                                  # 20–30: 유효 벡터(30이 정상 품질)
    print(float(speed_cm_s.where(good).mean()), "cm/s")

tips:
  - >-
    `dX`, `dY`는 속도가 아니라 48시간(OSI-405-d) 또는 24시간(OSI-455) 누적 변위(km)이며, 방향도 동·북이 아니라 격자 x·y축입니다.
    바람·해류와 비교하려면 경과 시간으로 나눠 속도로 바꾸고, 도착점(`lat1`, `lon1`)과 출발점(`lat`, `lon`)으로 방향을 다시 계산하는 것이 안전합니다.
  - >-
    OSI-405-d는 매일 나오지만 각 파일이 48시간 구간이라 이웃한 날짜 파일끼리 24시간이 겹칩니다. 일별 시계열로 쓰거나 독립 표본으로 셀 때 주의하세요.
  - >-
    여름철(북반구 5/1~10/1, 남반구 11/1~4/1)에는 녹은 표면 때문에 위성 추적이 어려워 정확도가 떨어집니다. OSI-405-d는 병합 파일에만 여름 벡터가 있고,
    OSI-455의 여름 값은 대부분 ERA5 바람 기반 자유 표류 모델에서 온 것이므로 status_flag로 출처를 확인하세요.
  - >-
    OSI-455(1991~2020)는 위성 입력이 SSM/I·SSMIS(근 90 GHz)와 AMSR-E·AMSR2(36.5 GHz)로 시기마다 다르고, 병합 파일은 남은 공백을 공간 내삽·바람 벡터로 채웁니다.
    NRT OSI-405-d와 격자(62.5 km 극 평사도 vs 75 km EASE2)·변위 구간(48시간 vs 24시간)이 달라 한 시계열로 그냥 이어 붙이면 안 됩니다.
  - >-
    2021년 이후를 기후자료와 같은 방식으로 이으려면 시범 연장판 OSI-435(2021~2025)가 유일한 선택지입니다. 아직 시험 단계(DOI 없음, reprocessed_test 폴더)이므로
    논문에 쓸 때는 제품 ID와 받은 날짜를 함께 적고 이후 정식 공개 여부를 확인하세요.

