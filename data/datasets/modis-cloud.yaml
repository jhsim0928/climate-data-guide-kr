# ─────────────────────────────────────────────────────────────
# MODIS 구름 MOD06_L2·MYD06_L2(구름 상단·광학 특성)·MOD35_L2(구름 마스크)·MOD08 L3 구름 C6.1 — 데이터셋 정보 파일
# 위성 탭(구름·복사). 구름 마스크, 구름 상단 기압·온도·높이, 구름 광학두께·유효 반경·수액량과 1° L3 통계를 한 페이지에서 다룹니다.
# Terra·Aqua 궤도 표류와 위성 종료가 핵심 주의사항입니다. 후속 MODIS-VIIRS 연속 구름 제품(CLDPROP·CLDMSK)은 viirs-cloud.yaml.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: modis-cloud
name: "MODIS Cloud (MOD06·MOD35)"
full_name: MODIS/Terra·Aqua Clouds 5-Min L2 Swath 1km and 5km (MOD06_L2·MYD06_L2), Cloud Mask and Spectral Test Results (MOD35_L2·MYD35_L2) 및 MOD08/MYD08 L3 1° 구름 Collection 6.1 (MODIS 구름 마스크·구름 상단·광학 특성)
category: satellite
domain: satellite
group: 구름·복사
order: 60
domains: [대기, 원격탐사]
provider: NASA GSFC MODIS 대기팀(구름 광학 특성 Platnick 등, 구름 상단·구름 마스크 위스콘신대 SSEC) / NASA LAADS DAAC (MODAPS)

status: deprecated
status_note: >-
  Collection 6.1이 지금도 매일 생산되고 있지만(2026-10-13 확인 시 MOD08_D3는 10월 9일 자료까지), Terra·Aqua가 궤도를 벗어나 통과 시각이 바뀌고 있고
  NASA는 Terra 과학 운용이 2027년 2월, Aqua가 2027년 9월에 끝날 것으로 내다봅니다. LAADS DAAC는 MODIS·VIIRS 공통 밴드만 쓰는 연속 구름 제품(CLDMSK·CLDPROP)으로 옮기라고 안내하며,
  운용이 끝난 뒤 최종 보정(v8.0)으로 마지막 재처리를 하겠다고 밝혔습니다. 2026-10-13 기준 CMR에는 Version 6.1만 공개되어 있습니다.

period:
  start: "2000-02"
  end: present
  note: >-
    Terra(MOD06·MOD35·MOD08)는 2000-02-24부터, Aqua(MYD06·MYD35·MYD08)는 2002-07-04부터입니다. 2026-10-13 확인 시 LAADS에는 2026년 10월 초 자료(MOD08_D3 A2026282)까지 있습니다.
    C6.1은 Terra가 2017년 9~12월, Aqua가 2018년 1~3월에 전 기간 재처리되었고, 2018년 4월 30일 이후로는 C6.1만 생산됩니다.

resolution:
  spatial_short: "1 km (0.01°)"
  temporal_short: "1일"
  spatial: >-
    L2 스와스(직하점 기준): 구름 마스크 MOD35 1 km(250 m 가시 판정 비트 포함) / MOD06 구름 광학 특성·1 km 구름 상단(`cloud_top_*_1km`) 1 km, 기존 구름 상단 특성(`Cloud_Top_Pressure` 등) 5 km —
    직하에서 멀어질수록 화소가 커짐 / L3: 전지구 1°×1° 등위경도 격자(360×180, MOD08_D3·E3·M3)
  vertical: 구름 상단 기압·온도·높이와 기주 적분 구름 특성(광학두께·유효 반경·수액량)
  temporal: >-
    L2는 5분 단위 그래뉼(궤도 스와스). 구름 마스크·구름 상단은 주간·야간 모두, 광학 특성은 주간만 / L3 일(D3)·8일(E3)·월(M3).
    설계상 적도 통과 시각은 Terra 10:30(하강, 주간), Aqua 13:30(상승, 주간) 지방시이고 야간 관측은 반대편 궤도에서 이뤄지지만, 궤도 표류로 바뀌었습니다.

coverage:
  short: 전지구
update: 매일 (L3 일자료는 관측 다음 날 무렵), 8일·월 자료는 구간 종료 후. 준실시간(NRT)판은 LANCE에서 별도 제공
license: NASA EOSDIS 자료 이용 정책에 따라 제한 없이 공개된 무료 자료입니다. 내려받기(HTTPS·OPeNDAP 포함)에는 무료 NASA Earthdata 로그인이 필요하며, 데이터셋 DOI 인용을 요청합니다.
account_required: true

summary: >-
  MODIS 36개 밴드로 만든 NASA 표준 구름 자료입니다. MOD35는 가시·적외 문턱값 검사를 모아 화소마다 '맑을 확신 정도'를 판정하는 구름 마스크이고,
  MOD06은 CO2 흡수 밴드(CO2 slicing)와 적외 창 밴드로 구한 구름 상단 기압·온도·높이·적외 상(phase)과, 가시·단파적외 반사도로 구한 구름 광학두께·유효 입자 반경·수액량(주간)을 담습니다.
  MOD08 L3는 이를 1° 격자에 모은 일·8일·월 통계로, 같은 파일에 에어로졸·수증기·대기 연직 정보도 들어 있습니다. Terra(오전)·Aqua(오후) 판이 따로 있으며,
  MODIS에만 있는 CO2·수증기 흡수 밴드를 쓰므로 VIIRS로는 같은 알고리즘을 그대로 이어 갈 수 없습니다.

time_convention:
  summary: >-
    L2(MOD06·MOD35)는 위성이 지나간 순간의 관측값입니다. 파일 이름의 시각(AYYYYDDD.HHMM)은 5분 그래뉼 첫 주사의 시작 시각(UTC)입니다. 구름 마스크와 구름 상단 특성은 주간·야간 모두,
    광학 특성(광학두께·유효 반경·수액량)은 태양광이 필요하므로 주간에만 있습니다. L3 일자료(MOD08_D3)는 그날 L2 값을 1° 칸마다 모은 통계이며 주간(`_Day`)·야간(`_Night`) 통계가 따로 있고,
    8일(E3)·월(M3)은 일평균들의 평균(`_Mean_Mean`)입니다.
  points:
    - "설계상 Terra는 지방시 10:30 하강, Aqua는 13:30 상승으로 주간에 적도를 지나고, 야간 관측은 반대편 궤도에서 이뤄집니다. 구름량은 하루 중 크게 변하므로(특히 대류운·해양 층운) Terra와 Aqua 값의 차이에는 관측 시각 차이가 들어 있습니다."
    - "궤도 표류: Terra는 2020년 2월 27일 마지막 경사각 조정 뒤 이른 시각으로 옮겨 2022년 가을 10:15에 이르렀고, Aqua는 2021년 3월 8일 마지막 조정 뒤 늦어져 2026년 8월 무렵 약 15:50으로 예상되었습니다. 일주기가 큰 구름 변수의 장기 추세는 이 변화를 함께 고려해야 합니다."
    - "L3 일자료는 UTC 날짜 기준이지만, C6부터 날짜변경선 부근 빈틈·중복을 줄이려고 앞뒤 최대 3시간까지 그래뉼을 넓혀 넣습니다(L3 ATBD)."
    - "8일(E3)은 1월 1일부터 시작하는 연속 8일 일자료로, 월(M3)은 그달 일자료 전체로 만듭니다. L3 ATBD에 따르면 구름 광학 특성의 8일·월 평균은 일평균을 화소 수로 가중해 평균합니다."
    - "구름 광학두께는 로그 정규 분포에 가까워 L3에는 산술 평균(`_Mean`)과 로그 평균(`_Log_Mean`)이 함께 있습니다. 복사 계산·기후 모델 비교에는 어느 평균을 썼는지 밝혀야 합니다."
    - "준실시간(NRT, LANCE)판은 확정판(LAADS)과 별도로 만들어지므로 연구용 시계열에는 확정판을 쓰세요."
  source: https://atmosphere-imager.gsfc.nasa.gov/sites/default/files/ModAtmo/L3_ATBD_C6_C61_2019_02_20.pdf
  source_name: "MODIS Atmosphere L3 Global Gridded Product User's Guide & ATBD (C6·C6.1) + MOD06_L2·MOD35_L2 컬렉션 설명(CMR) + NASA Terra 기사·LP DAAC Aqua 궤도 계획"

variables:
  note: >-
    CMR 변수 목록(UMM-Var) 기준 SDS 이름·단위입니다. 파일은 HDF-EOS2(HDF4)이고 정수로 저장되므로 실제 값 = scale_factor × (저장값 − add_offset)입니다(MODIS 대기 정의, add_offset을 '뺍니다').
    예를 들어 `Cloud_Top_Temperature`는 scale 0.01, add_offset −15000이라 실제 값 = 0.01 × (저장값 + 15000) K입니다. MYD(Aqua) 파일도 변수 이름이 같습니다.
  full_list: https://atmosphere-imager.gsfc.nasa.gov/products/cloud
  groups:
    - name: L2 구름 마스크 1 km (MOD35_L2·MYD35_L2)
      kind: instant
      period: 통과 시각
      items:
        - text: "구름 마스크와 분광 검사 결과 — `Cloud_Mask` (6바이트 비트 필드)"
          std: [cloud_phase_mask]
          note: 1바이트 0~2비트에 판정 여부와 '구름·구름 가능·맑음 가능·맑음 확신' 4단계, 주야·태양 반사광·눈/얼음·육지/물 경로. 2~4바이트는 1 km 검사, 5~6바이트는 250 m 가시 검사
        - "250 m 반사도 분산 지수 — `Cloud_Mask_SPI` (밴드 1·2)"
    - name: L2 구름 상단·상 (MOD06_L2·MYD06_L2)
      kind: instant
      period: 통과 시각
      items:
        - "구름 상단 기압(5 km) — `Cloud_Top_Pressure` (hPa, scale 0.1)"
        - "구름 상단 기압(1 km) — `cloud_top_pressure_1km` (hPa)"
        - "구름 상단 높이(1 km, 지오퍼텐셜 높이) — `cloud_top_height_1km` (m)"
        - "구름 상단 온도(5 km) — `Cloud_Top_Temperature` (K, scale 0.01, add_offset −15000)"
        - text: "구름 면적비(5×5 1 km 화소, 구름 마스크 기반) — `Cloud_Fraction` (무차원, scale 0.01)"
          std: [cloud]
        - "적외 구름 상(1 km) — `Cloud_Phase_Infrared_1km` (0=맑음, 1=물, 2=얼음, 3=혼합, 6=미결정)"
    - name: L2 구름 광학 특성 1 km, 주간 (MOD06_L2·MYD06_L2)
      kind: instant
      period: 통과 시각 (주간)
      items:
        - "구름 광학두께(2.1 µm 밴드 조합) — `Cloud_Optical_Thickness` (무차원, scale 0.01)"
        - "구름 유효 입자 반경(2.1 µm) — `Cloud_Effective_Radius` (µm, scale 0.01)"
        - text: "구름 수액량(액체·얼음 기주량, 2.1 µm) — `Cloud_Water_Path` (g m-2)"
          std: [cloud_water]
        - "광학 산출에 쓴 구름 상 — `Cloud_Phase_Optical_Properties` (0=미판정, 1=맑음, 2=물, 3=얼음, 4=미결정·물로 산출)"
        - text: "1.6 µm·1.6/2.1 µm 조합 광학두께 — `Cloud_Optical_Thickness_16`, `Cloud_Optical_Thickness_1621` (무차원)"
          std: [cloud_optical]
        - "구름 가장자리 부분 운량 화소 산출(PCL) — `Cloud_Optical_Thickness_1621_PCL` (무차원)"
    - name: L3 일자료 1° (MOD08_D3·MYD08_D3)
      kind: mean
      period: 일 (UTC 날짜, 앞뒤 최대 3시간 확장)
      items:
        - text: "구름 면적비(구름 마스크 '구름+구름 가능'/전체) 일평균 — `Cloud_Fraction_Mean` (무차원, scale 0.0001)"
          std: [cloud]
        - text: "주간·야간 구름 면적비 일평균 — `Cloud_Fraction_Day_Mean`, `Cloud_Fraction_Night_Mean` (무차원)"
          std: [cloud]
        - "구름 상단 기압 일평균 — `Cloud_Top_Pressure_Mean` (hPa, scale 0.1)"
        - "구름 상단 온도 일평균 — `Cloud_Top_Temperature_Mean` (K, scale 0.01, add_offset −15000)"
        - "구름 상단 높이 일평균 — `Cloud_Top_Height_Mean` (m)"
        - "물·얼음 구름 광학두께 일평균 — `Cloud_Optical_Thickness_Liquid_Mean`, `Cloud_Optical_Thickness_Ice_Mean` (무차원, scale 0.01)"
        - "물 구름 유효 반경 일평균 — `Cloud_Effective_Radius_Liquid_Mean` (µm, scale 0.01)"
        - text: "물 구름 수액량 일평균 — `Cloud_Water_Path_Liquid_Mean` (g m-2)"
          std: [cloud_water]
    - name: L3 8일·월 자료 1° (MOD08_E3 8일 / MOD08_M3 월)
      kind: mean
      period: 8일 또는 월 (일평균의 평균)
      items:
        - text: "구름 면적비 — `Cloud_Fraction_Mean_Mean` (무차원, scale 0.0001)"
          std: [cloud]
        - "구름 상단 온도 — `Cloud_Top_Temperature_Mean_Mean` (K)"
        - "물 구름 광학두께 — `Cloud_Optical_Thickness_Liquid_Mean_Mean` (무차원)"
        - "물 구름 유효 반경 — `Cloud_Effective_Radius_Liquid_Mean_Mean` (µm)"
        - text: "물 구름 수액량 — `Cloud_Water_Path_Liquid_Mean_Mean` (g m-2)"
          std: [cloud_water]

