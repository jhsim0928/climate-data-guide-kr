transitions:
  - from: MODIS 구름 C6 (MOD06·MOD35·MOD08)
    to: MODIS 구름 C6.1
    status: completed
    date: "2018-03"
    summary: >-
      입력 L1B 문제를 고친 재처리로, 구름 산출물에 대한 변화는 대체로 작습니다(보조 입력, QA, 구름 상단 채움값 처리 등). Terra 밴드 29 보정 표류로 생긴 해양 거짓 구름과
      C6의 12월 해양 저층운 기압 편향이 C6.1에서 고쳐졌습니다. 2018년 4월 30일 이후로는 C6.1만 생산됩니다.
    changes:
      - aspect: 입력 L1B
        before: C6 L1B (Terra 밴드 29 보정 표류, Aqua 2016년 7월 이후 1~2% 불연속)
        after: C6.1 L1B로 보정 문제 수정
      - aspect: 구름 상단
        before: "Terra에서 밴드 29 표류로 해양 거짓 저층운(2010년~, 2014년 이후 심함), 12월 해양 저층운 1 km 기압 편향"
        after: 두 문제 모두 수정
      - aspect: 구름 광학 특성
        before: C6
        after: 보조 입력·QA 갱신 등 작은 변화
      - aspect: 생산
        before: C6 (2018-04-30까지 병행 생산)
        after: C6.1 단독 생산
    impacts:
      - C6과 C6.1을 한 시계열에 섞지 말고 전 기간을 C6.1로 다시 받으세요.
    sources:
      - name: MODIS Atmosphere — Data Versions (컬렉션 개요)
        url: https://atmosphere-imager.gsfc.nasa.gov/collections/overview
      - name: MODIS 구름(06_L2) 알려진 문제
        url: https://atmosphere-imager.gsfc.nasa.gov/issues/cloud
      - name: C6.1 구름 광학 특성 변경 요약
        url: https://modis-atmos.gsfc.nasa.gov/sites/default/files/ModAtmo/C6.1_Change_Summary_Cloud_Optical_%2806_OD%29_v2.pdf
  - from: MODIS 구름 MOD06·MOD35·MOD08 C6.1
    to: MODIS-VIIRS 연속 구름 제품 CLDMSK·CLDPROP
    to_id: viirs-cloud
    status: planned
    summary: >-
      VIIRS에는 MODIS의 CO2 흡수 밴드(13 µm대)와 수증기 밴드(6.7·7.3 µm)가 없고 단파적외 밴드도 2.13 µm 대신 2.25 µm라 MOD06·MOD35를 그대로 옮길 수 없습니다.
      그래서 NASA는 두 센서의 공통 밴드만 쓰는 알고리즘으로 VIIRS(Suomi NPP·NOAA-20)와 Aqua MODIS 모두에 같은 방식의 구름 마스크(CLDMSK)·구름 특성(CLDPROP)을 만들었습니다.
      Aqua MODIS판 CLDPROP으로 MODIS 기록을 같은 알고리즘으로 다시 만들어 VIIRS와 이어 붙일 수 있게 한 것이 핵심입니다.
    changes:
      - aspect: 구름 마스크 알고리즘
        before: "MOD35 (MODIS 전 밴드, CO2·수증기 흡수 밴드 검사 포함)"
        after: "MODIS-VIIRS 구름 마스크(MVCM): MOD35 계승, 공통 밴드만 사용(0.905·0.936·6.7·7.3·13.3·13.9 µm 검사 없음)"
      - aspect: 구름 상단 알고리즘
        before: "CO2 slicing(13 µm대 밴드) + 적외 창"
        after: "NOAA CLAVR-x AWG 구름 높이 알고리즘(ACHA), 적외 창 위주 — 결과가 구조적으로 달라짐"
      - aspect: 구름 광학 특성
        before: "MOD06 (2.13 µm, 액체 굴절률 300 K 자료)"
        after: "MOD06 계승, 공통 밴드(0.65·0.86·1.24·1.6·2.2·3.7·11 µm), 액체 굴절률 265 K 자료, 다층운 검출 없음"
      - aspect: 위성·통과 시각
        before: "Terra 10:30 하강, Aqua 13:30 상승 (표류 중)"
        after: "Aqua MODIS·Suomi NPP·NOAA-20 모두 13:30 무렵 상승 오후 궤도. Terra 오전 관측의 연속 제품은 없음"
      - aspect: 해상도·형식
        before: "L2 1 km·5 km, L3 1° (D3·E3·M3), HDF-EOS2(HDF4)"
        after: "L2 VIIRS 750 m·MODIS 1 km, L3 1° (D3·M3, 8일 없음), NetCDF-4"
      - aspect: 기간
        before: "Terra 2000-02~ / Aqua 2002-07~"
        after: "Aqua MODIS 2002-07~ / Suomi NPP 2012-03~(2026-11-02 전달 종료) / NOAA-20 2018-02~"
    impacts:
      - "MOD06 C6.1과 CLDPROP은 같은 Aqua 관측이어도 값이 다릅니다(굴절률·구름 상단 알고리즘·QA가 다름). MODIS 표준 제품 시계열을 VIIRS CLDPROP과 직접 이어 붙이지 말고, Aqua MODIS CLDPROP을 다리로 쓰세요."
      - Platnick et al. (2021)은 VIIRS 2.25 µm와 MODIS 2.13 µm 차이 때문에 유효 반경과 상 판정이 체계적으로 다르고, 일부 차이는 센서 간 복사 보정 차이와 아직 분리되지 않았다고 밝혔습니다.
      - "Terra(오전) 구름 시계열을 이을 연속 제품은 없습니다. 하루 중 시각이 다른 관측을 섞지 마세요."
    sources:
      - name: Platnick et al. (2021), Remote Sensing — The NASA MODIS-VIIRS Continuity Cloud Optical Properties Products
        url: https://doi.org/10.3390/rs13010002
      - name: LAADS DAAC — MODIS to VIIRS Transition (연속 제품 표)
        url: https://ladsweb.modaps.eosdis.nasa.gov/learn/modis-to-viirs-transition
      - name: MODIS-VIIRS Cloud Mask (MVCM) User Guide
        url: https://ladsweb.modaps.eosdis.nasa.gov/api/v2/content/archives/Document%20Archive/Science%20Data%20Product%20Documentation/MVCM_User_Guide_Oct_2020.pdf

notices:
  - date: "2026-08-03"
    level: info
    title: LAADS Classic API 2026-08-31 폐지 — API-V2로 전환
    body: >-
      LAADS DAAC는 예전 웹 서비스 Classic API를 2026년 8월 31일에 폐지한다고 공지했습니다. 자동 내려받기 스크립트·프로그램은 JSON/REST 방식의 LAADS API-V2로 옮겨야 합니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199517
  - date: "2026-04-30"
    level: info
    title: LAADS OPeNDAP 접속에 Earthdata 로그인 필요
    body: >-
      2026년 4월 30일부터 LAADS OPeNDAP 서비스도 NASA Earthdata 로그인 인증을 거쳐야 쓸 수 있습니다. 인증 없이 OPeNDAP 주소로 읽던 스크립트는 자격 증명을 추가해야 합니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199527
  - date: "2026-03-31"
    level: info
    title: Terra 이상으로 MODIS 대기(standby) 모드 전환 — 2026-03-26~27 자료 의심·불량
    body: >-
      2026년 3월 26일 20:00 UTC께 Terra 위성 이상으로 MODIS가 대기 모드로 바뀌었다가 27일 오후 과학 모드로 돌아왔습니다. 보정팀은 3월 26일 20:00 UTC부터
      27일 19:30 UTC까지의 자료를 의심 또는 불량으로 표시했고, 그 이후 자료는 써도 된다고 밝혔습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199533
  - date: "2026-03-20"
    level: warning
    title: NASA, Terra 과학 운용 종료를 2027년 2월·Aqua를 2027년 9월로 전망
    body: >-
      NASA Science 기사 'Terra: The End of An Era'(2025-12-29 게재, 2026-03-20 갱신)의 편집자 주는 연료·전력 한계로 Terra는 2027년 2월, Aqua는 2027년 9월에
      과학 운용이 끝날 것으로 전망하며, 그때까지는 운용을 계속한다고 밝혔습니다. Aqua가 끝나면 Aqua MODIS 연속 구름 제품(CLDPROP·CLDMSK)도 함께 끝납니다.
    source: https://science.nasa.gov/science-research/earth-science/terra-the-end-of-an-era/
  - date: "2026-03-18"
    level: info
    title: MODIS L1B·지오로케이션 Version 7.0 공개 — 구름 산출물은 아직 C6.1
    body: >-
      LAADS DAAC가 MODIS 보정 복사량(L1B)·지오로케이션 V7.0을 공개하고, V6.1 L1 자료는 2026-09-30에 내린다고 공지했습니다. V7 L1B에는 Aqua 밴드 27~30 전자 혼선 보정과
      Terra 밴드 29 편향 보정이 들어 있습니다. 2026-10-13 확인 시 MOD06·MOD35·MOD08은 CMR에 Version 6.1만 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/version-7.0-modis-calibrated-radiances-geolocation-data-products-now-available
  - date: "2025-05-02"
    level: warning
    title: MODIS에서 VIIRS로 전환 안내 — Terra·Aqua 2026년 말~2027년 초 종료 시작
    body: >-
      NASA LAADS DAAC는 Terra·Aqua가 2026년 말~2027년 초부터 운용 종료에 들어가며, 두 위성이 설계 궤도를 벗어나 통과 시각이 바뀌고 있어 자료에 영향을 줄 수 있다고 공지했습니다.
      MODIS 자료 수집이 멈추면 마지막 재처리를 하며, 사용자는 VIIRS 유사 산출물을 쓰라고 권고했습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs
  - date: "2022-12-19"
    level: warning
    title: NOAA Reynolds SST 중단 — MOD35·MOD06에 마지막 SST 고정 사용
    body: >-
      NOAA가 Reynolds SST 생산을 끝내, MODAPS는 대체 SST를 정할 때까지 2022-11-27 주의 마지막 Reynolds SST로 Terra·Aqua 구름 마스크(MxD35_L2)와 구름 상단(MxD06)을 계속 만들었습니다.
      대체 SST로 바꾸면 영향 기간을 재처리할 예정이라고 밝혔습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199628
  - date: "2022-11-29"
    level: info
    title: Terra 궤도 이탈 기동 뒤 L1B·대기 산출물 재처리(2022-10-23~11-21)
    body: >-
      Terra의 궤도 이탈 기동(10월 12·19일) 뒤 밴드 27~30 일부 검출기의 혼선 특성이 바뀌어, 2022년 10월 23일~11월 21일 Terra C6.1 L1B·대기 산출물을 재처리했습니다.
      주된 영향은 구름·수증기 산출물이며, 11월 22일부터는 보정된 L1B로 생산됩니다. 이 기간은 재처리판을 쓰라고 권고했습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199633
  - date: "2022-11-04"
    level: info
    title: Aqua 안전 모드 뒤 L1B·대기 산출물 재처리(2022-04-17~07-26)
    body: >-
      Aqua MODIS가 2022년 3월 31일~4월 14일 안전 모드에서 돌아온 뒤 밴드 27~30 혼선 보정이 표류해, 4월 17일~7월 26일 Aqua C6.1 L1B·대기 산출물을 재처리했습니다.
      구름·수증기 산출물 영향이 가장 크며, 7월 27일 이후 생산분에는 이미 수정이 들어 있습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199635
  - date: "2021-08-06"
    level: warning
    title: Terra 부품 고장(2020-10-05)으로 고위도 구름 마스크·구름 상단 오류
    body: >-
      2020년 10월 5일 Terra MODIS 부품(PWA) 고장으로 고위도 일부 장면의 가시·근적외 반사도가 빠져, 구름 마스크가 눈·얼음 없음으로 가정하고 주간에 거짓 구름을 많이 판정했으며
      구름 상단 산출물은 이런 장면을 '야간'으로 잘못 분류했습니다. 후속 공지(2021-11-23)에 따르면 2020-10-05~2021-09-25 MOD35·MOD06을 수정 알고리즘으로 재처리했고, 2021년 9월 기록장치 재부팅 뒤 기기가 정상으로 돌아왔습니다.
    source: https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/199683

