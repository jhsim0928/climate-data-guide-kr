example:
  lang: python
  note: >-
    earthaccess로 Aqua MYD08_M3 월자료를 받아 pyhdf로 구름 면적비 월평균을 읽는 예입니다. MODIS 대기 산출물은 '저장값에서 add_offset을 뺀 뒤 scale_factor를 곱하는' 방식이라 직접 변환합니다.
  code: |
    # pip install earthaccess pyhdf numpy
    import earthaccess
    import numpy as np
    from pyhdf.SD import SD, SDC

    earthaccess.login()  # 무료 NASA Earthdata 계정
    results = earthaccess.search_data(
        short_name="MYD08_M3", version="6.1",
        temporal=("2024-07-01", "2024-07-31"),
    )
    files = earthaccess.download(results[:1], "myd08")

    hdf = SD(files[0], SDC.READ)
    sds = hdf.select("Cloud_Fraction_Mean_Mean")
    raw = sds.get().astype("float64")
    att = sds.attributes()
    cf = np.where(raw == att["_FillValue"], np.nan,
                  att["scale_factor"] * (raw - att["add_offset"]))  # 1° 격자 180×360
    lat = 89.5 - np.arange(180)                     # 행 0 = 89~90°N
    w = np.cos(np.deg2rad(lat))[:, None] * np.ones((1, 360))
    ok = np.isfinite(cf)
    print("전지구 면적 가중 구름 면적비:", (cf[ok] * w[ok]).sum() / w[ok].sum())

tips:
  - "구름 '면적비'가 자료마다 뜻이 다릅니다. L3 `Cloud_Fraction_Mean`은 구름 마스크의 '구름+구름 가능' 화소 비율이고, `Cloud_Retrieval_Fraction_*`은 광학 특성 산출에 성공한 화소 비율입니다. ISCCP·재분석 운량과 비교할 때 어느 정의인지 맞추세요."
  - "광학두께·유효 반경·수액량은 주간에만, 구름이 화소를 덮고 산출이 성공한 경우에만 있습니다. 극야 지역, 태양 천정각이 큰 고위도 겨울, 얇은 권운이 많은 곳은 표본이 적고 편향될 수 있습니다."
  - "같은 구름 상단 변수라도 5 km(`Cloud_Top_Pressure`)와 1 km(`cloud_top_pressure_1km`)가 있습니다. MODIS 대기팀은 새 연구에 1 km를 권하지만, L3 통계는 여전히 5 km L2로 만듭니다."
  - "HDF4 파일의 실제 값은 scale_factor × (저장값 − add_offset)입니다. `Cloud_Top_Temperature`처럼 add_offset이 −15000인 변수에서 부호를 잘못 쓰면 300 K가 아니라 엉뚱한 값이 나옵니다."
  - "MODIS 대기팀 알려진 문제에 따르면 Aqua 밴드 29(8.6 µm)가 점점 따뜻해져 Aqua C6.1 적외 구름 상(IR phase)에 인위적 추세가 생겼고(열대에서 가장 큼), Aqua 남아프리카 상공 09~12:30 UTC에는 5 km 구름 상단 자료가 간헐적으로 빠집니다."
  - "Terra는 2020년 10월 5일 부품(PWA) 고장으로 고위도 일부 장면의 가시·근적외 반사도가 빠져 극·아극 지역 주간 구름 마스크에 거짓 구름이 생겼습니다. 2020-10-05~2021-09-25 MOD35·MOD06은 수정 알고리즘으로 재처리되었으니, 이 기간 자료는 재처리판(생산 날짜로 확인)을 쓰세요."
  - "2022년 12월 NOAA Reynolds SST가 중단된 뒤 MOD35·MOD06은 마지막 Reynolds SST(2022-11-27 주)를 고정해 썼습니다(LAADS 공지). 대체 SST 적용·재처리 여부는 2026-10-13 기준 공지로 확인하지 못했으니, 2022년 12월 이후 해양 구름 마스크·저층운 상단을 분석할 때 주의하세요."
  - "MODIS 대기팀 문제 목록에는 'C7.0 구름 L3' 항목(2026-09 갱신)이 있지만, 2026-10-13 확인 시 CMR·LAADS에 공개된 MODIS C7 구름 산출물은 없습니다. 공개 여부를 LAADS 공지로 확인하세요."

