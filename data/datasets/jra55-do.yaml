tips:
  - "대기 변수(tas, huss, uas, vas)는 10 m 높이 값입니다. 2 m 기온을 가정한 벌크 공식에 그대로 넣지 말고, Tsujino et al. (2018)이 권장하는 Large and Yeager 계열 벌크 공식(bulk_ncar.F90)을 쓰세요."
  - 복사·강수는 3시간 평균이고 첫 값이 매년 1월 1일 00~03 UTC 구간의 중앙에 놓입니다. 바람·기온·습도·기압은 00 UTC부터의 순간값이라 시간축이 1.5시간 어긋나 있습니다.
  - 총 강수는 prra + prsn, 총 담수 유출은 friver + licalvf 입니다. 해면기압을 제외한 모든 대기 변수는 기준 관측자료에 맞춰 보정된 값이라 JRA-55 원자료와 다릅니다.
  - v1.5 이전 판에는 일부 열대저기압이 잘못 회전하는 오류(1959년 북동태평양, 1967~1987년 북대서양)가 있었고 v1.5부터 고쳐졌습니다. 옛 판으로 돌린 실험과 비교할 때 참고하세요.

