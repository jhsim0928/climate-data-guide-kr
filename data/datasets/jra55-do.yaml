# ─────────────────────────────────────────────────────────────
# JRA55-do — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: jra55-do
name: JRA55-do
full_name: JRA-55 based surface dataset for driving ocean–sea-ice models (JRA-55 기반 해양·해빙 모델 구동용 지표 강제력 자료)
category: forcing
domain: ocean
group: 모델 강제력
order: 10
domains: [해양, 해빙, 대기]
provider: 일본 기상청 기상연구소 (JMA/MRI)

status: ended
status_note: >-
  바탕 자료인 JRA-55가 끝나면서 2024년 1월 31일로 갱신이 중단되었고, v1.6.0(1958년 1월~2024년 1월)이 최종판입니다.
  MRI는 JRA-3Q 기반 후속판을 공개하지 않았습니다(2026-10 확인). CMIP7 OMIP용 차세대 강제력으로는 NCAR·GFDL·LANL이
  ERA5 기반 CFORCE를 개발 중이라고 WCRP에서 발표했으므로, 장기적으로는 그쪽 공개 여부를 지켜보세요.

successor:
  name: 없음
  note: >-
    공식 후속판은 아직 없습니다. ERA5 기반 CFORCE가 차세대 OMIP 강제력으로 개발되고 있습니다(2024년 10월 WCRP 발표).

transitions:
  - from: JRA55-do
    to: CFORCE
    status: planned
    summary: >-
      공식 후속판이 아니라 계획 단계의 정보입니다. NCAR·GFDL·LANL이 ERA5를 바탕으로 해양·해빙 모델 구동용 차세대 강제력(CFORCE)을
      만들고 있으며, 2024년 10월 WCRP 발표 자료는 2026년 초 공개를 목표로 하고 공개되면 OMIP·LMIP가 이 자료로 옮겨 갈 수 있다고 밝혔습니다.
      같은 발표는 CMIP7 OMIP에는 2023년까지 있는 JRA55-do를 쓴다고 했으므로, 2026년 10월 확인 시점에 공개된 자료나 정식 문서는 없습니다.
    changes:
      - aspect: 바탕 재분석
        before: "JRA-55 (2024년 1월 종료)"
        after: "ERA5 (ECMWF가 계속 생산하는 재분석)"
      - aspect: 기간
        before: "1958-01 ~ 2024-01"
        after: "1940년 ~ 현재 (계획)"
      - aspect: 해상도·시간 간격
        before: "TL319(약 0.5625°), 3시간"
        after: "0.25°, 1시간 (계획 목표 — 소용돌이 분해·연안 해양 모델용)"
      - aspect: 생산 기관
        before: "일본 기상청 기상연구소 (MRI)"
        after: "NSF NCAR · NOAA GFDL · DOE LANL (CLIVAR OMDP와 협력, DOE·NOAA 지원)"
      - aspect: 연장 방식
        before: "갱신 종료, v1.6.0이 최종판"
        after: "매년 연장을 전제로 설계(보정용 관측자료도 최신 유지 필요), 공개 Python 도구로 생산해 ERA6 등 이후 재분석에도 적용 예정"
      - aspect: 대상 실험
        before: "OMIP-2 (CMIP6), CMIP7 OMIP에도 1958~2023년 구간 사용 예정"
        after: "OMIP-Future · LMIP-Future (향후 OMIP/LMIP 전환 후보)"
      - aspect: 공개 상태
        before: "input4MIPs(MRI-JRA55-do-1-6-0)로 공개 완료"
        after: "미공개 — 2024년 10월 발표 기준 2026년 초 공개 예상이었으나 2026-10 확인 시 공식 공개 자료 없음"
    impacts:
      - 지금 OMIP 방식 실험을 시작한다면 여전히 JRA55-do v1.6.0(1958~2023년 주기)이 표준입니다. CFORCE를 기다리느라 실험을 미룰 이유는 아직 공식적으로 없습니다.
      - CFORCE가 공개되면 바탕 재분석·해상도·보정 방법이 모두 달라지므로, JRA55-do로 돌린 실험과 결과를 직접 이어 비교할 수 없습니다. 같은 모델로 두 강제력 실험을 각각 돌려 차이를 확인해야 합니다.
      - 변수 구성, 벌크 공식, 담수 유출 자료는 아직 발표되지 않았습니다. 공개 전에는 JRA55-do 전처리 코드를 CFORCE용으로 고칠 계획을 확정하지 마세요.
    sources:
      - name: WCRP 발표 자료 — Next Generation Datasets for Forcing Ocean/Sea-ice (CFORCE, NSF NCAR, 2024-10)
        url: https://wcrp-cmip.org/wp-content/uploads/2024/10/S5_DLawrence.pdf
      - name: MRI JRA55-do 공식 페이지 (2024-01-31 갱신 중단, v1.6.0 최종판)
        url: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/

period:
  start: "1958-01"
  end: "2024-01"
  note: >-
    v1.6.0 기준 1958년 1월 1일 ~ 2024년 2월 1일 00 UTC. v1.6.0의 내용은 v1.5.0(~2020년 7월)과 그 연장판 v1.5.0.1(2020~2024년)을
    이어 붙인 것과 같습니다. OMIP 실험은 1958~2023년 66년 구간을 한 주기로 씁니다.

resolution:
  spatial_short: "62 km (0.56°)"
  temporal_short: "3시간"
  spatial: "대기 변수 TL319 가우시안 격자(약 0.5625°, 약 55 km) / 하천·빙하 유출 0.25° / 보조 SST·해빙 1°"
  vertical: 지표(대기 10 m 고도) 단일층
  temporal: 대기 변수 3시간(복사·강수는 3시간 평균, 나머지는 순간값) / 유출 일평균

update: 종료 (2024년 1월 31일 갱신 중단)
license: CC BY 4.0 (input4MIPs v1.6.0 파일 메타데이터 기준)
account_required: false

summary: >-
  JRA-55 재분석의 지표 대기 변수를 위성·현장 관측 기반 자료에 맞춰 보정해 만든, 해양·해빙 모델 구동용 강제력 자료입니다.
  CORE-II를 대체하는 OMIP 2단계(OMIP-2) 표준 강제력으로 쓰였으며, 3시간 간격 바람·기온·습도·복사·강수와
  하천·남극·그린란드 담수 유출을 한 묶음으로 제공합니다. 원자료보다 해상도와 갱신 빈도가 높아 고해상도 해양 모델 실험에 널리 쓰였습니다.

time_convention:
  summary: >-
    3시간 대기 변수 중 바람·기온·습도·해면기압(uas, vas, tas, huss, psl)은 순간값이고, 하향 복사와 강수(rsds, rlds, prra, prsn)는 3시간 평균입니다.
    하천·빙하 유출(friver, licalvf)은 일평균입니다. 강수·유출은 누적량이 아니라 평균 플럭스(kg m-2 s-1)입니다.
  points:
    - "순간값 변수의 첫 자료는 매년 1월 1일 00 UTC 값입니다."
    - "3시간 평균 변수의 첫 자료는 1월 1일 00~03 UTC 구간 평균이며, 시간 좌표는 구간의 가운데(01:30 UTC)에 놓입니다. 그래서 순간값 변수와 시간축이 1.5시간 어긋나 있습니다."
    - "하천 유출 friver와 빙산 분리 licalvf는 0.25° 격자의 일평균 값입니다."
    - "보조 자료 중 tos·siconc(COBE-SST)는 일평균, siconca·ts(JRA-55)는 3시간 순간값, sos는 월별 기후값, uos·vos는 연평균 기후값입니다."
  source: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/docs/v1_6-manual/User_manual_jra55_do_v1_6.pdf
  source_name: "JRA55-do v1.6 User Manual (Table 1·2)"

variables:
  note: >-
    JRA55-do v1.6 사용자 매뉴얼 Table 1·2 기준 변수입니다. 변수명은 input4MIPs 파일 속 CMOR 변수명이며 파일은 NetCDF입니다.
    대기 변수는 해수면 위 10 m 높이 값입니다(2 m 아님).
  full_list: https://climate.mri-jma.go.jp/pub/ocean/JRA55-do/docs/v1_6-manual/User_manual_jra55_do_v1_6.pdf
  groups:
    - name: 대기 강제력 (3시간, TL319)
      kind: instant
      period: "3시간 간격"
      items:
        - "10 m 기온 — `tas` (K)"
        - "10 m 비습 — `huss` (kg kg-1)"
        - "10 m 동서 바람 — `uas` (m s-1)"
        - "10 m 남북 바람 — `vas` (m s-1)"
        - "해면기압 — `psl` (Pa)"
        - text: "하향 단파 복사 — `rsds` (W m-2)"
          kind: mean
          period: "3시간"
        - text: "하향 장파 복사 — `rlds` (W m-2)"
          kind: mean
          period: "3시간"
        - text: "강우 플럭스 — `prra` (kg m-2 s-1)"
          kind: mean
          period: "3시간"
          note: "평균 강수 플럭스이며 누적량이 아님"
        - text: "강설 플럭스 — `prsn` (kg m-2 s-1)"
          kind: mean
          period: "3시간"
          note: "평균 강설 플럭스이며 누적량이 아님"
    - name: 담수 유출 (일평균, 0.25°)
      kind: mean
      period: "일"
      items:
        - "액체 유출(하천 등) — `friver` (kg m-2 s-1)"
        - "고체 유출(빙산 분리) — `licalvf` (kg m-2 s-1)"
    - name: 보조 자료
      kind: mean
      period: "일"
      items:
        - "해수면온도(COBE-SST, 일평균 1°) — `tos` (°C)"
        - "해빙 분포(COBE-SST, 일평균 1°) — `siconc` (%)"
        - text: "해빙 분포(JRA-55, 3시간) — `siconca` (%)"
          kind: instant
          period: "3시간 간격"
          note: "JRA-55 해빙 분포(0% 또는 100%)"
        - text: "해면 염분(WOA13 v2, 월 기후값) — `sos` (0.001)"
          kind: mean
          period: "월"
          note: "World Ocean Atlas 2013 v2의 월별 기후값(해마다 같은 값 반복)"
        - text: "격자 면적(대기 격자) — `areacella` (m2)"
          kind: static

