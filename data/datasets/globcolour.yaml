# ─────────────────────────────────────────────────────────────
# Copernicus-GlobColour 전지구 해색 (Copernicus Marine OCEANCOLOUR_GLO_BGC_*_009_101~104) — 데이터셋 정보 파일
# 위성 탭(해색), 해양 탭(위성 관측 자료) 교차 수록. ACRI-ST가 다위성 엽록소·반사도·투명도·일차생산 등을 4 km(OLCI 300 m) L3 일·L4 월/빈칸 없는 일 자료로 생산.
# 2026-10-13 확인 시 MY L3는 2026-10-05, NRT L3 다중센서 엽록소는 2026-10-11까지 있습니다. 2026-11-24 새 데이터셋 판(202611)으로 바뀔 예정입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: globcolour
name: Copernicus-GlobColour
full_name: >-
  Global Ocean Colour (Copernicus-GlobColour), Bio-Geo-Chemical, L3 (daily) / L4 (monthly and interpolated) from Satellite Observations
  (Copernicus Marine 전지구 다위성 해색 — MY OCEANCOLOUR_GLO_BGC_L3_MY_009_103·L4_MY_009_104, NRT L3_NRT_009_101·L4_NRT_009_102)
category: satellite
domain: satellite
group: 해색
order: 50
also_in:
  - domain: ocean
    group: 위성 관측 자료
domains: [해양, 원격탐사]
provider: Copernicus Marine Service (해색 TAC, ACRI-ST 생산 — Copernicus-GlobColour 처리기)

status: active
status_note: >-
  다년(MY)·준실시간(NRT) 모두 매일 갱신되고 있습니다. 2026-10-13 확인 시 MY L3 일자료는 2026-10-05, NRT L3 다중센서 엽록소는 2026-10-11, MY L4 월자료는 2026-09, MY L4 빈칸 없는 일자료는 2026-09-07까지 있습니다.
  2026년 3월 다중센서 자료에서 MODIS를 빼고(2023년 초 이후) VIIRS-NOAA21을 넣은 새 판(202603)이 나왔고, 2026년 11월에는 OC5 계수 갱신·탄소(POC·DOC) 데이터셋 추가 등을 담은 판(202611)으로 바뀔 예정입니다.

period:
  start: "1997-09"
  end: present
  note: >-
    MY 다중센서는 1997-09-04(L4 월은 1997-09)부터, OLCI 단독 자료는 2016-04-25부터입니다. NRT는 최근 기간만 담습니다(2026-10-13 확인 시 NRT L3 모음 2023-04-25~, 다중센서 엽록소 202411판 2024-09-30~).
    1997~2002년 SeaWiFS 단독 기간에는 빠진 날이 있고, 식물플랑크톤 기능군(PFT)은 2002년 이전에 없습니다.

resolution:
  spatial_short: "4 km (0.04°)"
  temporal_short: "1일"
  spatial: >-
    4 km 제품은 정방위경도(plate carrée) 격자 위도 4320 × 경도 8640, 격자 간격 0.0416667°(격자 중심 89.979°S~89.979°N, 179.979°W~179.979°E).
    OLCI 300 m 제품은 위도 32400 × 경도 64800, 간격 0.0055556°. PUM은 '4 km'가 적도에서의 대략적 화소 크기이며 고위도로 갈수록 동서 간격이 좁아진다고 설명합니다
  vertical: 해면 위성 관측(원격 반사도와 그로부터 구한 표층 물성, 일차생산은 수층 적분값)
  temporal: >-
    L3 일(모든 위성 통과를 합친 일 합성) / L4 월평균 / L4 빈칸 없는 일자료(엽록소·투명도, 시공간 보간). 일차생산(PP)은 L4 월자료만 있습니다

coverage:
  short: 전지구
  note: "바다만 대상. L3는 구름·해빙·야간·낮은 태양 고도(고위도 겨울)에서 값이 없고, L4 gap-free 일자료만 빈칸을 보간"
update: >-
  MY L3·NRT는 매일 22:00(UTC) 갱신(NRT 첫 판은 관측 후 약 24시간), MY L4 월자료는 매월. PUM은 MY 연장분(MYINT)을 관측 후 31일 안에 낸다고 적고 있으며,
  QUID는 MY가 현재보다 약 8일 전까지 이어진다고 적고 있으며 2026-10-13 확인 시 MY L3 최신일은 2026-10-05입니다
license: Copernicus Marine Service 이용 약관(Service Commitments and Licence)에 따른 무료 이용. 출처 표기와 제품 DOI 인용을 요구합니다
account_required: true

summary: >-
  Copernicus Marine 해색 TAC가 ACRI-ST의 Copernicus-GlobColour 처리기로 만드는 전지구 해색 생지화학 자료입니다. SeaWiFS·MODIS·MERIS·VIIRS(SNPP·NOAA-20·NOAA-21)·OLCI(S3A·S3B)를
  병합한 4 km 다중센서 제품과 OLCI 단독 4 km·300 m 제품이 있고, 엽록소 a·식물플랑크톤 기능군·크기군·원격 반사도·Kd(490)·투명도(Secchi 깊이)·부유물·후방산란·유색 용존 유기물·일차생산을 냅니다.
  센서별로 엽록소를 먼저 계산한 뒤 병합하는 방식이라 반사도를 먼저 병합하는 OC-CCI와 다르며, 관측 다음 날 나오는 NRT와 1997년부터의 다년(MY) 자료가 따로 있습니다.

time_convention:
  summary: >-
    L3 일자료는 그날 모든 위성 통과를 합친 일 합성의 평균값이고, L4 월자료는 그달 값을 시간 평균한 것입니다. L4 빈칸 없는 일자료는 시공간 보간으로 구름 낀 칸을 채운 값입니다.
    월자료의 time 값은 그달 1일 00:00 UTC(예 1997-09-01, … 2026-09-01)이며 실제 평균 구간은 그달 전체입니다.
  points:
    - "일 합성 하나는 약 24시간 관측을 담습니다. QUID는 날짜 변경선(180°)을 가로지르는 영역은 두 날의 제품이 필요하다고 안내합니다."
    - "NRT는 처음에 기후값 보조자료(궤도·기상)로 만들어 품질이 다소 낮을 수 있고, 나중에 재처리됩니다. MY 연장분(MYINT)은 전체 재처리 때에만 MY로 대체됩니다."
    - "일차생산 PP의 단위는 mg m-2 day-1로 하루 생산률의 월평균입니다. 월 총량은 그달 일수를 곱해야 합니다."
    - "gap-free 일자료의 flags 변수에서 1은 육지(LAND), 2는 보간된 칸(INTERPOLATED)입니다. 실제 관측 기반 값만 쓰려면 2인 칸을 빼세요."
    - "*_uncertainty 변수는 같은 칸 값의 불확도 추정치이며 단위는 %입니다."
  source: https://documentation.marine.copernicus.eu/PUM/CMEMS-OC-PUM.pdf
  source_name: Copernicus Marine OC PUM (Issue 7.0) + QUID 009-101to104 (Issue 7.0) + STAC 메타데이터

variables:
  note: >-
    변수 이름·단위는 Copernicus Marine 데이터셋 메타데이터(STAC, 202603·202411판) 기준입니다. 다중센서 4 km 데이터셋은 plankton(엽록소·PFT), reflectance(반사도), optics(BBP·CDM),
    transp(KD490·SPM·ZSD), pp(일차생산) 다섯 묶음으로 나뉩니다. OLCI 단독 데이터셋은 반사도 파장이 더 많습니다(400~709 nm, 제품 설명 기준).
  full_list: https://data.marine.copernicus.eu/product/OCEANCOLOUR_GLO_BGC_L3_MY_009_103/description
  groups:
    - name: 엽록소·식물플랑크톤 (plankton, L3 일 / L4 월)
      kind: mean
      period: 일(L3) 또는 월(L4)
      items:
        - text: "엽록소 a 농도 — `CHL` (mg m-3)"
          note: 저영양 해역은 CI(Hu et al.), 중영양·연안은 OC5, 0.15~0.2 mg m-3에서 혼합
        - text: "엽록소 불확도 — `CHL_uncertainty` (%)"
          std: []
        - text: "식물플랑크톤 기능군 엽록소 — `DIATO`(규조류)·`DINO`(와편모류)·`GREEN`(녹조류)·`HAPTO`(착편모류)·`PROCHLO`(프로클로로코쿠스)·`PROKAR`(원핵생물) (mg m-3)"
          note: 각 변수마다 *_uncertainty(%)가 있음. 2002년 이전 없음
        - text: "식물플랑크톤 크기군 엽록소 — `MICRO`·`NANO`·`PICO` (mg m-3)"
        - text: "엽록소 수평 경사 — `CHL_gradient` (mg m-3 km-1)"
          note: OLCI 데이터셋에 있으며 2026년 11월부터 다중센서 L3 일자료로 확대 예정
          std: []
        - text: "플래그 — `flags`"
          kind: static
          note: "1 육지(LAND). gap-free 일자료는 2 보간(INTERPOLATED) 추가"
          std: []
    - name: 원격 반사도 (reflectance, 다중센서 4 km)
      kind: mean
      period: 일(L3) 또는 월(L4)
      items:
        - "완전 정규화 원격 반사도 — `RRS412`·`RRS443`·`RRS490`·`RRS555`·`RRS670` (sr-1)"
        - text: "반사도 불확도 — `RRS412_uncertainty` 등 (%)"
          std: []
    - name: 광학·투명도 (optics·transp)
      kind: mean
      period: 일(L3) 또는 월(L4)
      items:
        - "490 nm 확산 감쇠 계수 — `KD490` (m-1)"
        - "투명도(Secchi 깊이) — `ZSD` (m)"
        - "무기 부유 입자 농도 — `SPM` (g m-3)"
        - "443 nm 입자 후방산란 계수 — `BBP` (m-1)"
        - "유색 용존·쇄설 유기물 흡수 — `CDM` (m-1)"
        - text: "각 변수의 불확도 — `KD490_uncertainty`·`ZSD_uncertainty`·`SPM_uncertainty`·`BBP_uncertainty`·`CDM_uncertainty` (%)"
          std: []
    - name: 일차생산 (pp, L4 월만)
      kind: mean
      period: 월
      items:
        - text: "일차생산 — `PP` (mg m-2 day-1)"
          note: Antoine & Morel 모델. 병합 엽록소·PAR·Kd(PAR), OSTIA SST, GLORYS12V1 혼합층 깊이 사용
        - text: "일차생산 불확도 — `PP_uncertainty` (%)"
          std: []
    - name: 빈칸 없는 일자료 (L4 gap-free, 다중센서 4 km)
      kind: mean
      period: 일
      items:
        - text: "보간 엽록소 a — `CHL` (mg m-3)"
          note: 시공간 보간으로 구름 칸을 채움. flags=2가 보간된 칸
        - text: "보간 엽록소 불확도 — `CHL_uncertainty` (%)"
          std: []
        - text: "보간 확산 감쇠 계수·투명도 — `KD490` (m-1), `ZSD` (m)"
          note: "데이터셋 cmems_obs-oc_glo_bgc-transp_my_l4-gapfree-multi-4km_P1D(202603판). 불확도 `KD490_uncertainty`·`ZSD_uncertainty`(%)와 `flags`가 함께 있음. 2019·2020년부터 KD·ZSD gap-free 제공(QUID)"

