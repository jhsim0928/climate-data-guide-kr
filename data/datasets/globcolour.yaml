example:
  lang: python
  note: >-
    Copernicus Marine Toolbox로 MY L4 월 엽록소를 한반도 주변만 잘라 받는 예입니다. 처음 한 번 copernicusmarine.login()으로 계정을 저장하세요.
    데이터셋 판이 바뀌는 시기(예 2026-11)에는 dataset_version을 지정해 결과를 고정할 수 있습니다.
  code: |
    # pip install copernicusmarine xarray
    import copernicusmarine
    import xarray as xr

    copernicusmarine.login()   # 처음 한 번만 (사용자 이름·비밀번호 저장)
    copernicusmarine.subset(
        dataset_id="cmems_obs-oc_glo_bgc-plankton_my_l4-multi-4km_P1M",
        variables=["CHL", "CHL_uncertainty"],
        minimum_longitude=120, maximum_longitude=132,
        minimum_latitude=30, maximum_latitude=40,
        start_datetime="2024-01-01", end_datetime="2024-12-31",
        output_filename="globcolour_chl_korea_2024.nc",
    )
    ds = xr.open_dataset("globcolour_chl_korea_2024.nc")
    print(ds["CHL"].mean(["latitude", "longitude"]).values)

tips:
  - "PUM은 GlobColour MY가 상류 센서 재보정·처리 변경 때문에 시계열 불연속이 있을 수 있고, 센서 간 일관성을 우선한 OC-CCI는 대신 현재까지 이어지지 않는다고 설명합니다. 장기 추세는 OC-CCI, 최근·준실시간 감시는 GlobColour로 나눠 쓰는 것을 검토하세요."
  - "다중센서 자료에서 MODIS가 2023년 초 이후 빠지고 VIIRS-NOAA21이 2022년 11월 이후 들어갔습니다(2026-03 판). 이 시기 앞뒤로 채움률·값이 달라질 수 있습니다."
  - 재처리로 일부 해역에서 값이 20% 넘게 바뀔 수 있다고 QUID가 밝힙니다. 논문에는 데이터셋 ID와 판(파일 속 버전·내려받은 날짜)을 적고, 새 판과 섞지 마세요.
  - "황해·동중국해 연안처럼 탁한 바다에서는 OC5의 복잡 수역 보정이 쓰이지만, 엽록소보다 부유물(SPM)·CDM이 광학을 좌우할 수 있으니 SPM·CDM과 불확도를 함께 보세요."
  - gap-free 일자료는 보간값입니다. flags가 2(INTERPOLATED)인 칸은 실제 관측이 아니므로, 적조·블룸 같은 짧은 현상 분석에는 L3 일자료나 flags로 거른 값을 쓰세요.
  - "300 m OLCI 제품은 연안 분석에 유리하지만 2016-04-25 이후만 있고, 다중센서 4 km와 알고리즘·센서가 달라 섞어 쓰면 안 됩니다."
  - 일차생산 PP는 GLORYS12V1 혼합층 깊이와 OSTIA SST 같은 모델·분석 입력에 기대므로, 현장 검증(r² 약 0.63)이 제한적이라는 QUID 설명을 고려하세요.
  - "2026-11-24 202611판이 공개되고 일부 202603판은 같은 날 퇴역할 예정입니다(STAC 메타데이터). 이중 배포 기간은 2026-11-03~2027-01-12로 안내되어 있으니 그 전에 스크립트를 점검하세요."

