notices:
  - date: "2026-11-24"
    key_date: "2026-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: warning
    title: (예정) 2026년 11월 판 갱신 — OC5 계수 갱신, 탄소(POC·DOC) 데이터셋 추가, 스크립트 수정 필요
    body: >-
      OC5 계수 갱신으로 다중센서 엽록소·투명도·일차생산을 재처리하고, GLOPHYTS 알고리즘으로 OLCI 시기 PFT를 개선하며, 새 탄소(car) 데이터셋(POC·DOC)과
      다중센서 L3 엽록소 경사 변수를 추가합니다. 자료 처리 스크립트를 고쳐야 한다고 안내했고, NRT 이중 배포 기간은 2026-11-03~2027-01-12입니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L3_NRT_009_101
  - date: "2026-03-31"
    key_date: "2026-03"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: warning
    title: 다중센서 자료에서 MODIS 제외, VIIRS-NOAA21 추가 (MY L3·L4 갱신)
    body: >-
      2026년 3월 GLO MY(L3·L4) 갱신에서 다중센서 데이터셋의 2023년 초 이후 MODIS 자료를 빼고, 2022년 11월 이후 VIIRS-NOAA21을 넣었습니다(새 데이터셋 판 202603, 2026-03-31 공개).
      NRT에도 같은 변경이 적용되었습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L4_MY_009_104
  - date: "2025-11-25"
    key_date: "2025-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: OLCI 4 km 엽록소 경사 변수에 불확도 추가, MY 시계열 2024년까지 연장
    body: >-
      cmems_obs-oc_glo_bgc-plankton_my_l3-olci-4km_P1D의 엽록소 경사 변수에 불확도 필드가 붙었고, MY 시계열이 2024년 자료까지 연장되었습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L3_MY_009_103
  - date: "2024-11-26"
    key_date: "2024-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: OLCI 기반 엽록소 수평 경사 변수 추가, PFT 재보정
    body: >-
      OLCI 자료로 계산한 엽록소 수평 경사(CHL_gradient) 변수가 GLO MY·NRT에 추가되었고, 식물플랑크톤 기능군(PFT) 변수가 최신 자료로 재보정되었습니다(알고리즘은 같음).
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L4_MY_009_104
  - date: "2023-11-30"
    key_date: "2023-11"  # 메일 발송 기록용 원래 날짜(바꾸지 마세요)
    level: info
    title: MY 전체 시계열 재처리 — 반사도 병합 개선, BBP·CDM 알고리즘 갱신
    body: >-
      EUMETSAT OLCI 재처리(3.01), MERIS 4차 재처리, NASA R2022(Aqua·VIIRS) 입력으로 다중센서 반사도 병합을 개선하고 BBP·CDM 알고리즘을 갱신해 MY 전 기간을 재처리했습니다.
      내려받기 스크립트는 바꿀 필요가 없다고 안내했습니다.
    source: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L4_MY_009_104

transitions:
  - from: GlobColour 202603판
    to: GlobColour 202611판
    status: planned
    date: "2026-11"
    summary: >-
      같은 제품 안에서 데이터셋 판이 바뀝니다. OC5 계수 갱신으로 다중센서 엽록소·투명도·일차생산이 재처리되고, 탄소 데이터셋과 새 변수가 추가됩니다.
    changes:
      - aspect: 엽록소 알고리즘
        before: OC5(이전 계수) + CI 혼합
        after: 최신 상류 반사도 재처리로 다시 맞춘 OC5 계수
      - aspect: PFT (OLCI 시기)
        before: 기존 PFT 알고리즘
        after: GLOPHYTS 알고리즘, 300 m OLCI 데이터셋에도 PFT 추가
      - aspect: 새 데이터셋·변수
        before: "-"
        after: "탄소(car) 데이터셋(POC·DOC, OCROC 알고리즘), 다중센서 L3 엽록소 경사"
      - aspect: 데이터셋 판
        before: 202603 (일부 2026-11-24 퇴역 예정)
        after: 202611 (2026-11-24 공개 예정)
    impacts:
      - 엽록소·PP 값이 재처리로 바뀌므로 202603판으로 만든 결과와 섞지 마세요.
      - 자료 처리 스크립트 수정이 필요하다고 안내되었습니다. dataset_version을 고정해 둔 스크립트는 퇴역일 이후 실패할 수 있습니다.
    sources:
      - name: Copernicus Marine 제품 로드맵 — L4_MY_009_104
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L4_MY_009_104
      - name: Copernicus Marine 제품 로드맵 — L3_NRT_009_101
        url: https://marine.copernicus.eu/user-corner/product-roadmap/transition-information?product=OCEANCOLOUR_GLO_BGC_L3_NRT_009_101

