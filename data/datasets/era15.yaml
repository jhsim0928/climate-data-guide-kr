# ─────────────────────────────────────────────────────────────
# ERA-15 — 데이터셋 정보 파일
# ─────────────────────────────────────────────────────────────
id: era15
name: ERA-15
full_name: ECMWF 15-year Reanalysis (ECMWF 15년 재분석, 1세대)
category: reanalysis
domain: atmosphere
group: 재분석
order: 90
domains: [대기, 육지]
provider: ECMWF

status: ended
status_note: >-
  1990년대 중반에 한 번 생산되고 끝난 ECMWF의 첫 재분석입니다. ECMWF 공개 다운로드 서비스 목록에는 더 이상 없고,
  지금은 NCAR GDEX와 영국 CEDA에 보관된 사본으로만 쉽게 받을 수 있습니다. GDEX도 "보조 용도 권장" 자료로 분류하므로
  옛 논문 재현이나 재분석 세대 비교가 아니라면 ERA5를 쓰세요.

successor:
  name: "ERA-40 (현재 권장: ERA5)"
  url: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels
  note: >-
    직접 후속은 1957~2002년의 ERA-40이고, 그 뒤 ERA-Interim을 거쳐 현재는 ERA5(1940년~현재, 약 31 km)가 ECMWF의 현역 재분석입니다.
    링크는 ERA5 CDS 페이지입니다.

transitions:
  - from: ERA-15
    to: ERA-40
    to_id: era40
    status: completed
    summary: 최적내삽(OI)·T106L31의 1세대에서 3D-Var·T159L60의 2세대로 넘어가며 기간이 1957년까지 늘고, 위성 복사휘도 직접 동화와 파랑 결합이 추가되었습니다.
    changes:
      - aspect: 기간
        before: 1979–1993 (15년)
        after: 1957-09–2002-08 (45년)
      - aspect: 수평 해상도
        before: T106 (약 1.125°, 약 125 km 가우시안 격자)
        after: T159 (축소 가우시안 N80, 약 125 km 격자 간격)
      - aspect: 연직 해상도·모델 상한
        before: 모델면 31층 (최상층 약 10 hPa)
        after: 모델면 60층 (최상층 약 0.1 hPa)
      - aspect: 기압면 제공 층수
        before: 17층 (1000–10 hPa)
        after: 23층
      - aspect: 자료동화
        before: 최적내삽(OI), 6시간 주기
        after: 3D-Var (FGAT), 6시간 주기
      - aspect: 위성 관측 사용
        before: TOVS 구름 제거 복사휘도를 1D-Var로 변환해 100 hPa 아래에서만 사용 (20°N–20°S에서는 100 hPa 위 미사용)
        after: VTPR·TOVS·SSM/I·ATOVS 등 위성 복사휘도를 직접 동화 (VTPR·SSU는 이때 처음 사용)
      - aspect: 해양 파랑
        before: 없음
        after: 1.5° 파랑 모델 결합, 유의파고 등 파랑 변수 제공
      - aspect: 모델 버전
        before: 1995년 현업 체계 기반 (해상도만 변경)
        after: IFS CY23r4
    impacts:
      - 두 자료는 모델·동화 방식·관측 사용이 모두 달라 기후값과 변동 폭이 다를 수 있으므로, 1979–1993년 겹치는 구간에서도 서로 섞어 쓰지 마세요.
      - ERA-15의 기압면은 10 hPa까지 17층뿐입니다. 성층권을 다루던 옛 분석을 재현할 때는 ERA-40의 공통 기압면만 골라 비교하세요.
      - Uppala et al.(2005)은 ERA-40이 전반적으로 ERA-15보다 낫다고 평가하면서도, 후반부 열대 해양 강수 과다와 지나치게 강한 Brewer-Dobson 순환을 ERA-40의 문제로 남겼습니다. ERA-40으로 바꿔도 물순환·성층권 분석에는 한계가 있습니다.
      - 두 자료 모두 지금은 갱신되지 않는 이전 세대 자료이므로, 새 연구라면 ERA5를 쓰세요.
    sources:
      - name: Gibson et al. (1997), ERA Description (ERA-15 Report Series No. 1)
        url: https://www.ecmwf.int/en/elibrary/9584-era-description
      - name: Uppala et al. (2005), The ERA-40 re-analysis, QJRMS
        url: https://doi.org/10.1256/qj.04.176
      - name: Kållberg et al. (2004), The ERA-40 archive (ERA-40 Project Report Series No. 17)
        url: https://www.ecmwf.int/sites/default/files/elibrary/2004/10595-era-40-archive-revised-october-2007.pdf
      - name: Uppala (2006), From ERA-15 to ERA-40 and ERA-Interim (ECMWF/GEO Workshop)
        url: https://www.ecmwf.int/sites/default/files/elibrary/2006/12885-era-15-era-40-and-era-interim.pdf
      - name: NCAR Climate Data Guide — ERA-40
        url: https://climatedataguide.ucar.edu/climate-data/era40
      - name: CEDA ERA-15 파라미터 표 (기압면 17층)
        url: https://artefacts.ceda.ac.uk/badc_datadocs/ecmwf-era/params.html

period:
  start: "1979-01"
  end: "1993-12"
  note: >-
    ECMWF와 NCAR GDEX 기준 1979년 1월 ~ 1993년 12월(15년). CEDA 아카이브는 1994년 2월 말까지의 자료를 함께 보관하고 있습니다.

resolution:
  spatial: "스펙트럼 T106(약 1.125°, 약 125 km) / 축소 가우시안 N80 / 2.5° 위경도 격자 제공본"
  vertical: "모델면 31층 / 기압면 17층(1000~10 hPa)"
  temporal: 6시간(00·06·12·18 UTC) 분석 (월평균 별도)

update: 종료 (1990년대 중반 생산 완료)
license: NCAR GDEX 사본은 CC BY 4.0 + ECMWF 이용 약관 / CEDA 사본은 ECMWF ERA products licence
account_required: true

summary: >-
  ECMWF가 1995년 당시 현업 자료동화·예보 체계를 고정해 1979~1993년을 다시 분석한 첫 번째 재분석입니다.
  최적내삽(OI) 자료동화와 T106·31층 모델을 사용했고, 같은 시기 NCEP/NCAR 재분석과 함께 1세대 재분석으로 분류됩니다.
  여기서 얻은 경험(관측 편향 처리, 품질관리 목록 등)이 ERA-40에 반영되었습니다.

time_convention:
  summary: >-
    NCAR·CEDA에 보관된 ERA-15 자료는 00·06·12·18 UTC 분석장이며, 여기 적은 변수는 모두 그 시각의 순간값입니다.
    강수·복사·열속 같은 누적 예보 변수는 이 사이트가 정리한 공개 파라미터 표에 없습니다.
  points:
    - "파일 이름의 시각(YYMMDDHH의 HH = 00·06·12·18)이 분석 시각입니다."
    - "ECMWF 문서에 따르면 분석은 6시간 주기 최적내삽(OI)으로 만들어졌습니다. 즉 각 값은 그 시각의 분석 상태입니다."
    - "누적 예보 변수(강수·플럭스)나 월평균이 필요하면 ERA-15 기술 보고서의 아카이브 표(월평균·예보 누적 표)를 확인해야 합니다. 이 페이지의 변수 목록에는 포함하지 않았습니다."
  source: https://artefacts.ceda.ac.uk/badc_datadocs/ecmwf-era/params.html
  source_name: "CEDA ERA-15 parameter tables (analysis files)"

variables:
  note: >-
    CEDA가 보관 중인 ERA-15 자료의 파라미터 표 기준입니다. 변수명은 ECMWF GRIB 약어(원문은 대문자)이며,
    최신 ecCodes에서는 같은 코드가 소문자 short name(`t`, `2t` 등)으로 표시됩니다. 원본은 GRIB1입니다.
  full_list: https://artefacts.ceda.ac.uk/badc_datadocs/ecmwf-era/params.html
  groups:
    - name: 기압면 (17층)
      kind: instant
      items:
        - "지위(geopotential) — `Z` (m2 s-2)"
        - "기온 — `T` (K)"
        - "동서풍 — `U` (m s-1)"
        - "남북풍 — `V` (m s-1)"
        - "연직속도(기압좌표) — `W` (Pa s-1)"
        - "상대습도 — `R` (%)"
        - "상대와도(스펙트럼 자료) — `VO` (s-1)"
        - "발산(스펙트럼 자료) — `D` (s-1)"
    - name: 지표·단일면
      kind: instant
      items:
        - "평균 해면기압 — `MSL` (Pa)"
        - "2m 기온 — `2T` (K)"
        - "2m 이슬점온도 — `2D` (K)"
        - "10m 동서풍 — `10U` (m s-1)"
        - "10m 남북풍 — `10V` (m s-1)"
        - "지표(skin) 온도 — `SKT` (K)"
        - "적설 깊이 — `SD` (m of water equivalent)"
    - name: 지면
      kind: instant
      items:
        - "토양온도 1층 — `STL1` (K)"
        - "토양 수분 1층 — `SWL1` (m of water)"
        - text: "지표 거칠기 — `SR` (m)"
          kind: instant
          note: "분석 파일에 시각별로 들어 있는 값. 시간에 따라 변하는지는 공식 문서에서 확인하지 못함"
        - text: "알베도 — `AL` (-)"
          kind: instant
          note: "분석 파일에 시각별로 들어 있는 값. 시간에 따라 변하는지는 공식 문서에서 확인하지 못함"

