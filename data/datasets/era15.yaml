    method: 웹 다운로드(HTTPS) / Globus / 부분 추출
    note: 6시간 지표·단일면 자료, 약 12 GB. 부분 추출·형식 변환은 NCAR 로그인이 필요합니다.
  - name: NSF NCAR GDEX — ERA-15 상층 분석 (d115001)
    url: https://gdex.ucar.edu/datasets/d115001/
    method: 웹 다운로드(HTTPS) / Globus / 부분 추출
    note: 6시간 상층(기압면) 분석, 약 55 GB.
  - name: NSF NCAR GDEX — ERA-15 모델 해상도 상층 분석 (d115004)
    url: https://gdex.ucar.edu/datasets/d115004/
    method: 웹 다운로드(HTTPS) / Globus
  - name: CEDA Archive — ERA-15 모델 자료
    url: https://catalogue.ceda.ac.uk/uuid/73ec447ea99457c77c0ef9692f76393f
    method: 웹 다운로드
    note: CEDA 계정 등록 필요. ECMWF ERA products licence 조건이 적용됩니다.

tips:
  - "ECMWF 보고서에 따르면 생산 초기 1979~1980년 8월 구간은 상층 습도 오류로 재생산되었고, 1990년 6월~1992년 10월은 위성 구름추적바람(GMS 제외)이 빠져 재생산되었습니다. 오래된 사본을 쓴다면 재생산본인지 확인하세요."
  - 분석 주기마다 적설이 관측으로 보정되기 때문에 물수지(강수-증발-유출)가 닫히지 않습니다. 물순환 수지 계산에는 적합하지 않습니다.
  - 기압면이 17층(최상층 10 hPa)뿐이고 위성 복사휘도를 직접 동화하지 않은 1세대 자료이므로, 성층권이나 장기 추세 분석에는 ERA5를 쓰세요.

