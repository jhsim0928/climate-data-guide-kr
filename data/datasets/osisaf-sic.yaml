notices:
  - date: "2026-10-20"
    level: warning
    title: JAXA 시스템 점검으로 AMSR3 기반 준실시간 해빙 산출물 누락·지연 (10/19~10/23, 서비스 메시지 #3605)
    body: >-
      자료 원천 기관(JAXA)의 시스템 점검으로 2026-10-19 05:00 UTC부터 10-23 03:00 UTC까지 GOSAT-GW AMSR3 기반 산출물
      OSI-410-g(L2 PMW 해빙 농도), OSI-408-g(AMSR3 해빙 농도), OSI-404-d(해빙 방출률)가 제공되지 않거나 늦어진다고 OSI SAF가 알렸습니다.
      이 기간 준실시간 AMSR3 해빙 농도를 쓰는 경우 빈 날짜를 확인하세요.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/missing-amsr3-products
  - date: "2026-08-31"
    level: warning
    title: 2026-09-01부터 AMSR3 기반 해빙 산출물 운영 시작 (서비스 메시지 #3571)
    body: >-
      AMSR3가 주 입력 센서가 되면서 AMSR3 기반 연장판 OSI-438-a(약 2일 지연)가 운영을 시작했습니다.
      AMSR2 기반 OSI-438은 정규(약 16일 지연) 파일만 새 FTP 위치에서 계속 나오고 빠른 갱신(fast-track) 파일은 중단되므로,
      fast-track 사용자는 OSI-438-a로 바꿔야 합니다. 준실시간 L3 농도는 OSI-408-g(AMSR3)로 파일명이 바뀝니다.
    source: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september
  - date: "2026-05-04"
    level: info
    title: AMSR2 기반 연장판 OSI-438 정식 운영 선언
    body: >-
      2025년 7월부터 시범 제공되던 OSI-438(AMSR2 기반 2021년 이후 연장판)이 검증을 마치고 2026-05-04 정식 운영 제품이 되었습니다.
      AMSR 계열 CDR인 OSI-458과 일관되게 이어지는 연장판입니다.
    source: https://osi-saf.eumetsat.int/products/osi-438
  - date: "2025-10-17"
    level: critical
    title: SSMIS 기반 연장판 OSI-430-a 생산 중단
    body: >-
      DMSP SSMIS 입력이 자주 끊겨 시간적 일관성을 유지할 수 없게 되면서 OSI-430-a 생산이 중단되었습니다(마지막 자료 2025-10-16).
      OSI SAF는 AMSR2 기반 OSI-438로 전환할 것을 권고합니다. SSMIS만 쓰는 준실시간 OSI-401-d도 입력이 불안정하므로 OSI-408 사용이 권장됩니다.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2025-06-13"
    level: warning
    title: DMSP SSMIS 자료 종료가 OSI SAF 산출물에 미치는 영향 안내
    body: >-
      미 국방부의 SSMIS 자료 제공 중단 계획(처음 2025-06-30, 이후 연기되어 2026년 9월까지 best-effort 제공)에 따라
      OSI SAF가 제품별 대응을 안내했습니다. 다중 센서 산출물은 2025년 7월부터 SSMIS를 쓰지 않으며, SSMIS 단독 산출물은 AMSR2 기반 제품으로 대체를 권고합니다.
      이 안내 페이지는 상황에 따라 계속 갱신됩니다.
    source: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
  - date: "2025-06-04"
    level: warning
    title: 수정판 CDR OSI-450-a1 공개 — OSI-450-a 대체
    body: >-
      해안 육지 오염 보정 오류로 343일 자료가 영향을 받았던 OSI-450-a를 고친 OSI-450-a1(v3.1, 새 DOI 10.15770/EUM_SAF_OSI_0023)이
      운영 제품으로 공개되었습니다. 기존 OSI-450-a를 받아 쓰고 있다면 새 버전으로 교체하세요.
    source: https://osi-saf.eumetsat.int/products/osi-450-a1

