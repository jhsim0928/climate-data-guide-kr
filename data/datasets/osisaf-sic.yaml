# ─────────────────────────────────────────────────────────────
# OSI SAF (해빙 농도) — 데이터셋 정보 파일
# EUMETSAT OSI SAF 해빙 농도 기후자료(CDR/ICDR)와 준실시간(NRT) 산출물
# ─────────────────────────────────────────────────────────────
id: osisaf-sic
name: "OSI SAF (해빙 농도)"
full_name: EUMETSAT OSI SAF Global Sea Ice Concentration Climate Data Record (OSI-450-a1 외, 수동마이크로파 해빙 농도 기후자료)
category: satellite
domain: seaice
group: 위성 관측 자료
order: 10
also_in:
  - domain: satellite
    group: 해빙
domains: [해빙, 해양]
provider: EUMETSAT Ocean and Sea Ice Satellite Application Facility (OSI SAF) / 노르웨이 기상청(MET Norway)

status: active
status_note: >-
  정상 제공 중이지만 입력 센서가 바뀌는 과도기입니다. DMSP SSMIS 자료가 불안정해지면서 SSMIS 기반 연장판(OSI-430-a)은
  2025년 10월 17일부터 생산이 중단되었고, AMSR2 기반 연장판(OSI-438, 2026-05-04 정식 운영)이 그 자리를 이어받았습니다.
  2026년 9월 1일부터는 AMSR3 기반 연장판(OSI-438-a)이 빠른 갱신(약 2일 지연)을 담당합니다.

transitions:
  - from: OSI SAF SSMIS 계열
    to: OSI SAF AMSR 계열
    status: completed
    date: "2025-10"
    summary: >-
      DMSP SSMIS 자료가 끊기기 시작하면서 OSI SAF가 해빙 농도 기후자료의 연장(ICDR)을 SSMIS 계열에서 AMSR 계열로 옮겼습니다.
      SSMIS 연장판 OSI-430-a는 2025-10-17 생산이 중단되었고, AMSR2 기반 OSI-438이 2026-05-04 정식 운영, 2026-09-01부터는 AMSR3 기반 OSI-438-a가
      빠른 갱신을 맡습니다. 격자와 지연 시간은 같지만 AMSR 계열 기록은 2002년부터만 있어 1978년부터의 단일 장기 기록과는 별개로 다뤄야 합니다.
    changes:
      - aspect: 입력 센서
        before: "SMMR·SSM/I·SSMIS (2021년 이후 연장은 DMSP SSMIS)"
        after: "AMSR-E(2002-06~2011-10)·AMSR2(2012-07~), 2026-09-01부터 GOSAT-GW AMSR3"
      - aspect: 기후자료(CDR) 기준 기록
        before: "OSI-450-a1 — 1978-10-25 ~ 2020-12-31"
        after: "OSI-458 — 2002-06-01 ~ 2020-12-31 (2011-10-04 ~ 2012-07-23 공백)"
      - aspect: 연장판(ICDR)
        before: "OSI-430-a — 2021-01-01 ~ 2025-10-16 (2025-10-17 생산 중단)"
        after: "OSI-438(AMSR2) 2021-01-01~, 2026-05-04 정식 운영 / OSI-438-a(AMSR3) 2026-09-01~"
      - aspect: 격자·시간 간격·지연
        before: "25 km EASE2, 일평균, 정규 16일·빠른 갱신 2일 지연"
        after: "같음 — 25 km EASE2, 일평균, 정규 16일·빠른 갱신 2일 지연"
      - aspect: 빠른 갱신(fast-track) 파일
        before: "OSI-430-a fast-track (FTP 전용)"
        after: "2026-09-01부터 OSI-438-a(AMSR3)만 fast-track 제공, OSI-438(AMSR2)은 정규 파일만 새 FTP 위치에서 계속"
      - aspect: 실제 센서 해상도·해안 오염
        before: "SSMIS 실효 해상도 약 30~60 km, 해안 육지 오염이 상대적으로 큼"
        after: "AMSR 실효 해상도 약 15~25 km, 해빙 가장자리 표현이 낫고 해안 육지 오염이 적음"
      - aspect: 북극점 관측 공백
        before: "SSMIS — 89°N 이북"
        after: "AMSR-E 89.5°N 이북, AMSR3는 관측 폭이 좁아 AMSR2보다 조금 넓음"
      - aspect: 파일 이름의 제품 ID
        before: "cdr-v3p1 (OSI-450-a1) / icdr-v3p0, icdrft-v3p0 (OSI-430-a)"
        after: "cdr-v3p0-amsr (OSI-458) / icdr-v3p0-amsr, icdrft-v3p0-amsr (OSI-438)"
      - aspect: FTP 경로 (ftp://osisaf.met.no/reprocessed/ 아래)
        before: "ice/conc/v3p1 (OSI-450-a1), conc-cont-reproc/v3p0 (OSI-430-a)"
        after: "ice/conc_amsr/v3p0 (OSI-458), ice/conc-cont-reproc-amsr/v3p0_amsr2_continued (OSI-438), ice/conc-cont-reproc-amsr/v3p0 (OSI-438-a)"
      - aspect: DOI
        before: "10.15770/EUM_SAF_OSI_0023 (OSI-450-a1), 10.15770/EUM_SAF_OSI_0014 (OSI-430-a)"
        after: "10.15770/EUM_SAF_OSI_0015 (OSI-458), 10.15770/EUM_SAF_OSI_0024 (OSI-438), 10.15770/EUM_SAF_OSI_0027 (OSI-438-a)"
      - aspect: 준실시간(10 km 극 평사도) 산출물
        before: "OSI-401-d (SSMIS) — 입력 불안정으로 사용 자제 권고"
        after: "OSI-408-a (AMSR2, 2016년~), 2026-09-01부터 OSI-408-g (AMSR3, 파일명 amsr2 → amsr3)"
    impacts:
      - 1978년부터 이어지는 단일 SSMIS 계열 기록은 2025-10-16에서 멈췄습니다. 2021년 이후를 AMSR 계열 연장판(OSI-438)으로 채우려면 CDR도 같은 계열(OSI-458)을 써야 일관성이 유지되며, 이 경우 시작은 2002년입니다.
      - OSI-450-a1 + OSI-438처럼 서로 다른 계열을 한 시계열로 이어 붙이면 센서 해상도·해안 오염 차이 때문에 경계 시점에 계단이 생길 수 있습니다. 불가피하면 2002~2020 중복 기간으로 두 계열 차이를 먼저 확인하세요.
      - 자동 다운로드 스크립트는 FTP 경로와 파일명의 제품 ID(icdr-v3p0 → icdr-v3p0-amsr 등)를 바꿔야 합니다. 2일 지연 파일이 필요하면 2026-09-01 이후는 OSI-438-a를 받아야 합니다.
      - 2026-09-01 AMSR3 전환 이후 OSI-438-a 구간은 OSI-438(AMSR2)과 센서가 다릅니다. 최근 몇 주 분석에는 OSI-438-a, 정규 기후 분석에는 OSI-438 정규 파일을 쓰고 둘을 섞은 경우 그 사실을 기록하세요.
      - 논문에는 실제로 쓴 제품별 DOI(OSI-458, OSI-438, OSI-438-a)를 각각 적어야 합니다.
    sources:
      - name: OSI SAF — Implications of the end of SSMIS data on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-end-ssmis-data-osi-saf-products
      - name: OSI SAF — Implications of AMSR2 being replaced by AMSR3 on OSI SAF products
        url: https://osi-saf.eumetsat.int/community/stories/implications-amsr2-being-replaced-amsr3-osi-saf-products
      - name: OSI SAF 서비스 메시지 #3571 (2026-08-31)
        url: https://osi-saf.eumetsat.int/community/list-of-service-messages/operational-release-amsr3-based-sea-ice-products-1st-september
      - name: OSI-430-a 제품 페이지
        url: https://osi-saf.eumetsat.int/products/osi-430-a
      - name: OSI-438 제품 페이지
        url: https://osi-saf.eumetsat.int/products/osi-438
      - name: OSI-458 제품 페이지
        url: https://osi-saf.eumetsat.int/products/osi-458
      - name: 해빙 농도 CDR/ICDR 제품 사용자 설명서 (PUM v3.4)
        url: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-conc-climate-data-record_3.4.pdf
  - from: OSI-450-a v3.0
    to: OSI-450-a1 v3.1
    status: completed
    date: "2025-06"
    summary: >-
      SSMIS 계열 기후자료 OSI-450-a에서 해안 육지 오염 보정 오류가 발견되어, 이를 고친 수정판 OSI-450-a1이 새 DOI로 공개되었습니다.
      기간·격자·변수는 그대로입니다.
    changes:
      - aspect: 해안 육지 오염 보정
        before: "보정 오류로 343일 자료가 영향을 받음"
        after: "오류 수정 (영향 날짜 목록은 PUM 부록 B)"
      - aspect: 버전·DOI
        before: "v3.0, DOI 10.15770/EUM_SAF_OSI_0013"
        after: "v3.1, DOI 10.15770/EUM_SAF_OSI_0023 (2025-06-04 운영 선언)"
      - aspect: FTP 경로 (ftp://osisaf.met.no/reprocessed/ 아래)
        before: "ice/conc/v3p0"
        after: "ice/conc/v3p1"
      - aspect: 기간·격자·변수
        before: "1978-10-25 ~ 2020-12-31, 25 km EASE2"
        after: "같음"
    impacts:
      - OSI-450-a를 받아 둔 경우 OSI-450-a1로 다시 받으세요. 특히 해안 가까운 해역의 농도·면적을 다룬다면 영향 날짜(PUM 부록 B)를 확인하세요.
      - 논문 인용 DOI를 10.15770/EUM_SAF_OSI_0023으로 바꿔야 합니다.
    sources:
      - name: OSI-450-a1 제품 페이지
        url: https://osi-saf.eumetsat.int/products/osi-450-a1
      - name: OSI-450-a 제품 페이지 (대체 안내)
        url: https://osi-saf.eumetsat.int/products/osi-450-a
      - name: 해빙 농도 CDR/ICDR 제품 사용자 설명서 (PUM v3.4)
        url: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-conc-climate-data-record_3.4.pdf

period:
  start: "1978-10"
  end: present
  note: >-
    SSMIS 계열 CDR(OSI-450-a1)은 1978-10-25 ~ 2020-12-31, 그 연장판 OSI-430-a는 2021-01-01 ~ 2025-10-16에서 멈췄습니다.
    AMSR 계열은 CDR(OSI-458) 2002-06 ~ 2020-12(2011-10 ~ 2012-07 공백)와 연장판 OSI-438(2021-01~, AMSR2),
    OSI-438-a(2026-09~, AMSR3)로 이어집니다. 1987년 7월 이전 SMMR 구간은 이틀 간격입니다.

resolution:
  spatial_short: "25 km (0.23°)"
  temporal_short: "1일"
  spatial: "기후자료 25 km EASE2 격자(Lambert 정적 방위 등적도법, 북·남반구 각 432×432) / 준실시간 OSI-401-d·OSI-408 10 km 극 평사도법"
  vertical: 해당 없음 (지표면 자료)
  temporal: 일평균(정오 12:00 기준), 월평균·연평균 파일과 월별 해빙 면적·범위 지표 별도 제공

coverage:
  short: 양극
update: >-
  연장판(ICDR) 매일 갱신 — 정규 파일 약 16일 지연, 빠른 갱신(fast-track) 파일 약 2일 지연(FTP 전용, 16일 뒤 정규 파일로 교체).
  준실시간 OSI-401-d·OSI-408은 약 5시간 지연.
license: CC BY 4.0 (출처 "EUMETSAT OSI SAF" 표시 필수, DOI 함께 기재)
account_required: false

summary: >-
  EUMETSAT OSI SAF가 SMMR, SSM/I, SSMIS, AMSR-E/AMSR2/AMSR3 수동마이크로파 관측으로 만든 전지구(북·남반구) 해빙 농도 자료입니다.
  ERA5로 대기 영향을 보정하고 동적 tie-point를 쓰며, 격자마다 불확실성 추정치를 함께 제공한다는 점이 특징입니다.
  장기 기후 분석에는 CDR과 그 연장판(ICDR)을, 당일 상황 파악에는 준실시간 산출물(OSI-401-d, OSI-408)을 씁니다.
  ESA CCI 해빙 프로젝트와 같은 알고리즘 계열이며, Copernicus Marine과 C3S CDS에서도 재배포합니다.

time_convention:
  summary: >-
    기후자료(CDR/ICDR) 일자료의 각 값은 12:00 UTC를 중심으로 한 24시간(00~24 UTC) 동안의 위성 관측을 격자마다 같은 가중치로 평균한 일평균장입니다.
    파일 이름의 시각(…1200)은 평균 구간의 중심이며 그 시각의 순간값이 아닙니다. 월·연 파일은 일자료를 다시 평균한 값입니다.
  points:
    - "일자료: 12.5 km 반경 안의 관측 지점(footprint)을 하루 단위로 평균한 뒤(L3), 관측이 빈 격자는 앞뒤 날(D-1, D+1) 평균과 공간 보간으로 채웁니다(L4). 보간된 격자는 status_flag로 구분됩니다."
    - "1987년 7월 이전 SMMR 시기는 센서가 이틀에 한 번만 운용되어 시간 간격이 48시간이고, 빈 날 보간에 D-2·D+2를 씁니다."
    - "월·연 평균은 필터를 걸지 않은 일별 농도(ice_conc + raw_ice_conc_values)를 평균한 뒤 10% 미만은 0%, 100% 초과는 100%로 자릅니다. 결측일은 보간하지 않으며, 5일 넘게 연속으로 비면 그 달 파일을 만들지 않습니다."
    - "월·연 파일에는 불확실성 변수가 없습니다. 일자료 불확실성은 그날 일평균장(필터 전 값)에 대한 1 표준편차이고, 보간 격자에는 주어지지 않습니다."
    - "준실시간 OSI-401-d·OSI-408도 하루 한 장(중심 12:00)이지만 기후자료와 처리·격자가 달라 같은 규칙을 그대로 적용하지 마세요."
  source: https://osisaf-hl.met.no/sites/osisaf-hl/files/baseline_document/osisaf_atbd_sea-ice-conc-climate-data-record_3.2.pdf
  source_name: OSI SAF 해빙 농도 CDR ATBD v3.2 (6.1절) / PUM v3.4 / OSI-450-a1 제품 페이지

variables:
  note: >-
    공식 제품 사용자 설명서(PUM v3.4) 기준 기후자료(CDR/ICDR) 일자료 파일의 변수입니다. 월·연평균 파일에는 불확실성 변수가 없고,
    월·연평균 10% 미만 값은 ice_conc에서 빠져 raw_ice_conc_values로 옮겨집니다. 준실시간(OSI-401-d, OSI-408) 파일은 변수 구성이 다릅니다.
  full_list: https://osisaf-hl.met.no/sites/osisaf-hl/files/user_manuals/osisaf_pum_sea-ice-conc-climate-data-record_3.4.pdf
  groups:
    - name: 해빙 농도
      kind: mean
      period: 일
      items:
        - text: "해빙 농도(필터·후처리 적용) — `ice_conc` (%)"
          note: 12:00 UTC 중심 24시간 평균(SMMR 시기 48시간 간격). 월·연 파일의 같은 이름 변수는 월·연평균
        - text: "필터로 바뀐 격자의 원래 값(0% 미만·100% 초과 포함) — `raw_ice_conc_values` (%)"
          note: ice_conc와 같은 일평균장에서 필터로 바뀐 격자의 원래 값. 월·연 파일에서는 평균 후 잘려 나간 값
    - name: 불확실성(1 표준편차)
      kind: mean
      period: 일
      items:
        - text: "총 불확실성 — `total_standard_uncertainty` (%)"
          note: 그날 일평균 농도(필터 전 값)에 대한 불확실성. 알고리즘·스미어링 분산을 합친 값이며 보간 격자에는 없음. 일자료 파일에만 있음
        - text: "알고리즘 불확실성 — `algorithm_standard_uncertainty` (%)"
          note: 일평균 농도에 딸린 값. 하루 동안의 관측 불확실성을 분산으로 합성
        - text: "스미어링(해상도 차이) 불확실성 — `smearing_standard_uncertainty` (%)"
          note: 일평균 농도에 딸린 값(센서 footprint와 격자 해상도 차이에서 오는 오차)
    - name: 품질 정보
      kind: mean
      period: 일
      items:
        - text: "처리 상태 비트 플래그 — `status_flag` (비트값)"
          note: 그날 일평균장에 적용된 처리(육지·호수, 개빙 필터, 해안 보정, 시·공간 보간, 기후값 밖 등)를 나타내는 날짜별 플래그. 육지·호수 비트는 고정 마스크에서, 최대 해빙 기후값 비트는 월별로 바뀜

