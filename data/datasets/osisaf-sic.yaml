    note: 준실시간 운영 자료로 기후자료와 알고리즘·격자가 다릅니다. 2026-09-01부터 AMSR3 기반 OSI-408-g가 주력입니다.

example:
  lang: python
  note: 제품 페이지의 FTP나 THREDDS에서 받은 일자료 파일을 연다고 가정합니다. 파일명 규칙은 ice_conc_<nh|sh>_ease2-250_<제품ID>_<YYYYMMDD>1200.nc 입니다.
  code: |
    import xarray as xr

    # 예: OSI-450-a1 북반구 일자료 (제품ID cdr-v3p1)
    ds = xr.open_dataset("ice_conc_nh_ease2-250_cdr-v3p1_201909011200.nc")
    sic = ds["ice_conc"].squeeze()                       # 단위: % (0–100), 하루치 2차원 격자
    unc = ds["total_standard_uncertainty"].squeeze()     # 단위: % (1 표준편차)

    # EASE2 격자는 등적(equal-area) 25 km × 25 km → 셀 면적 625 km²
    area_km2 = float((sic.where(sic >= 15) / 100 * 625).sum())
    print(f"해빙 면적(농도 15% 이상 격자): {area_km2:,.0f} km²")

tips:
  - >-
    같은 기후자료라도 SSMIS 계열(OSI-450-a1 + OSI-430-a)과 AMSR 계열(OSI-458 + OSI-438 + OSI-438-a)은 별개 기록입니다.
    2021년 이후를 이어 붙일 때는 CDR과 같은 계열의 연장판을 쓰세요. OSI-430-a는 2025-10-16에서 끝났으므로 장기 갱신이 필요하면 AMSR 계열로 옮기는 것이 좋습니다.
  - >-
    예전 OSI-450-a(DOI 10.15770/EUM_SAF_OSI_0013)는 343일에 해안 육지 오염(land spill-over) 보정 오류가 있었고
    2025년 수정판 OSI-450-a1(DOI 10.15770/EUM_SAF_OSI_0023)로 대체되었습니다. 해당 날짜 목록은 PUM 부록 B에 있습니다.
  - >-
    여름철 융빙 연못(melt pond)은 마이크로파에 바다처럼 보여 해빙 농도가 낮게 나옵니다. 이 오차는 불확실성 변수에도 반영되어 있지 않으니
    6~8월 북극 농도 해석에 주의하세요. 또 약 10% 이하의 얇은 가장자리 해빙은 기상 필터에 의해 0%로 지워질 수 있습니다.
  - >-
    북극점 주변의 관측 공백(pole hole)은 센서마다 크기가 다릅니다(SMMR 84°N, SSM/I 87°N, SSMIS 89°N 이북). 기후자료에서는 보간으로 채워져 있으므로
    status_flag로 보간 격자를 확인하고, 면적·범위 시계열을 직접 계산할 때 이 영역 처리를 명시하세요.

