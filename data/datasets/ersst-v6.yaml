# ─────────────────────────────────────────────────────────────
# ERSST v6 — 데이터셋 정보 파일
# ERSST v5의 후속 버전입니다. v5→v6 비교표는 ersst.yaml 의 transitions 에 있습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: ersst-v6
name: ERSST v6
full_name: NOAA Extended Reconstructed Sea Surface Temperature, Version 6 (NOAA 확장 재구성 해수면온도 6판)
category: analysis
domain: ocean
group: 해수면온도 분석장
order: 15
domains: [해양]
provider: NOAA National Centers for Environmental Information (NCEI)

status: active
status_note: >-
  NCEI가 2025년 12월 공개한 ERSST의 최신 버전으로 매월 갱신 중입니다. 2026년부터 NOAA의 ENSO 판정·RONI 지수와
  전지구 기온 자료(NOAAGlobalTemp 6.1.0)가 v6를 쓰며, 이전 버전 v5는 중단 예고 상태입니다.
  다만 격자별 불확실성 자료는 아직 정식 공개되지 않았습니다.

period:
  start: "1850-01"
  end: present
  note: >-
    2026-10-12 확인 시 NCEI 월별 파일은 ersst.v6.202609.nc(2026년 9월)까지 있고, NOAA PSL 묶음 파일도 2026년 9월까지 들어 있습니다.
    NCEI는 1940년대 이후 값이 더 신뢰할 만하다고 안내합니다.

resolution:
  spatial_short: "222 km (2°)"
  temporal_short: "1개월"
  spatial: "2° × 2° 위경도 격자. NOAA PSL 파일 기준 경도 180 × 위도 89 격자점, 격자 중심 88°S~88°N, 0°~358°E"
  vertical: 해수면 단일층
  temporal: 월평균

update: 매월
license: 미국 정부 공공 자료 — 이용 제한 없음(data.gov 카탈로그 기준 CC0 1.0), 데이터셋 DOI와 논문 인용 요청
account_required: false

summary: >-
  NOAA NCEI가 ICOADS Release 3.0.2 선박·부이 관측과 Argo 자료를 바탕으로 만든 1850년부터의 전지구 월별 해수면온도 재구성 자료입니다.
  관측이 빈 곳을 인공신경망(ANN) 내삽으로 채워 공간적으로 완전한 2° 격자를 제공하며, 위성 자료는 쓰지 않습니다.
  선박 관측 품질관리(최근접 이웃 검사), 대규모 필터, 해빙역 대리 SST가 함께 개선됐고 편차 기준 기후값은 1991~2020년입니다.
  2026년부터 NOAA의 ENSO 판정과 NOAAGlobalTemp의 해양 부분에 쓰이는 NOAA의 공식 SST 자료입니다.

time_convention:
  summary: >-
    월별 분석 자료로, 모든 값은 해당 달의 평균 해수면온도(또는 그 편차)입니다. 시간 값은 그 달을 가리키는 표시일 뿐 특정 시각의 순간값이 아닙니다.
  points:
    - "NOAA PSL 파일(sst.mnmean.nc)은 statistic을 'Mean', 평균 구간(avg_period)을 1개월로 표기하고, time은 매월 1일 00시(예: 1850-01-01 ~ 2026-09-01)이며 time_bnds가 함께 들어 있습니다."
    - "NCEI 원본은 ersst.v6.YYYYMM.nc처럼 한 달에 한 파일입니다. 파일 안의 시간 표기 방식은 이번 확인에서 열어 보지 못했으므로, 여러 배포처 자료를 합칠 때는 날짜가 아니라 연·월로 맞추세요."
    - "편차는 1991~2020년 월별 기후값 기준입니다(v5는 1971~2000년)."
  source: https://www.ncei.noaa.gov/products/extended-reconstructed-sst
  source_name: NCEI ERSST 제품 페이지 / NOAA PSL THREDDS 파일 메타데이터

variables:
  note: >-
    NOAA PSL 파일(sst.mnmean.nc)에는 `sst` 한 변수만 들어 있습니다. NCEI 메타데이터는 원본 파일에 SST와 편차(SSTA)가 함께 있다고 안내하지만,
    이번 확인에서 원본 파일 속 편차 변수 이름은 직접 확인하지 못했습니다(v5 파일은 `ssta`).
  full_list: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01737
  groups:
    - name: 해수면온도
      kind: mean
      period: 월
      items:
        - "월평균 해수면온도 — `sst` (°C)"
        - text: "해수면온도 편차 (1991~2020년 기후값 기준, NCEI 원본 파일)"
          kind: mean
          period: 월
          note: 월평균 SST에서 1991~2020년 월별 기후값을 뺀 편차
    - name: 기후값 (PSL 별도 파일)
      kind: mean
      period: 월
      items:
        - text: "월별 평년값 — `sst` (°C), sst.mon.ltm.1991-2020.nc · sst.mon.ltm.1981-2010.nc"
          note: 특정 연도가 아니라 같은 달의 다년 평균

access:
  - name: NCEI 직접 다운로드 (월별 NetCDF)
    url: https://www.ncei.noaa.gov/data/sea-surface-temperature-extended-reconstructed/v6/access/
    method: HTTPS (wget / curl)
    note: NCEI 제품 페이지가 안내하는 공식 위치입니다. ersst.v6.YYYYMM.nc 처럼 한 달에 한 파일(약 164 KB)입니다.
  - name: NCEI pub 경로 (월별 + 전 기간 한 파일)
    url: https://www.ncei.noaa.gov/pub/data/cmb/ersst/v5/v6/
    method: HTTPS (wget / curl)
    note: >-
      같은 월별 파일(ersst.v6.185001.nc~)이 있고, netcdf.one/ 폴더에 1850년~최근을 한 파일로 묶은 ersst.v6.1850-last.nc(약 272 MB),
      index/ 폴더에 v6 기반 기후 지수 파일(ersst.v6.el_nino.dat, pdo, amo, iod, atl3)이 있습니다. v5 폴더 아래에 있으니 경로를 헷갈리지 마세요.
  - name: NOAA PSL (전 기간 한 파일)
    url: https://psl.noaa.gov/data/gridded/data.noaa.ersst.v6.html
    method: 웹 다운로드 / THREDDS / OPeNDAP
    note: >-
      전 기간 SST가 sst.mnmean.nc 한 파일에 들어 있어 바로 쓰기 편합니다. 월별 평년값 파일(1981~2010, 1991~2020)도 있습니다.
      THREDDS 카탈로그는 https://psl.noaa.gov/thredds/catalog/Datasets/noaa.ersst.v6/catalog.html 입니다.

example:
  lang: python
  note: NOAA PSL의 OPeNDAP 주소로 전 기간 파일을 바로 열어, 1991~2020년 기준 Niño3.4 영역 평균 편차를 계산합니다.
  code: |
    import xarray as xr

    url = "https://psl.noaa.gov/thredds/dodsC/Datasets/noaa.ersst.v6/sst.mnmean.nc"
    sst = xr.open_dataset(url)["sst"]          # °C, 월평균, lat은 88 → -88 (북→남)

    # 1991~2020년 월별 기후값과 편차
    clim = sst.sel(time=slice("1991-01-01", "2020-12-01")).groupby("time.month").mean("time")
    ssta = sst.groupby("time.month") - clim

    # Niño3.4 (5°S~5°N, 170°W~120°W = 190~240°E) 영역 평균
    nino34 = ssta.sel(lat=slice(5, -5), lon=slice(190, 240)).mean(["lat", "lon"])
    print(nino34.sel(time=slice("2025-01-01", None)).round(2).to_series())

tips:
  - v5와 v6는 편차 기준 기후값이 다릅니다(v5 1971~2000, v6 1991~2020). 두 버전의 편차를 그대로 비교하거나 이어 붙이지 마세요.
  - v6는 내삽 방법(EOT→ANN)이 바뀌고 v5의 3개월 이동평균이 빠졌습니다. 같은 달이라도 v5와 값·공간 패턴이 다르고 월별 변동이 더 클 수 있으니, 한 시계열로 섞지 마세요.
  - PSL 파일의 위도는 북→남(88 → -88) 순서입니다. sel(lat=slice(남, 북))으로 자르면 빈 결과가 나오니 slice(5, -5)처럼 북쪽 값을 먼저 쓰세요.
  - PSL 파일 전역 속성(summary·source 등)에는 '1971~2000년 기후값', 'NCEP GTS' 같은 v5 시절 설명이 남아 있습니다. 기준 기간·입력 자료는 NCEI 문서를 따르세요.
  - 직접 계산한 Niño3.4 편차는 NOAA 공식 ENSO 지수(RONI 등)와 정의·평활이 달라 값이 다를 수 있습니다. 공식 판정과 맞춰야 하면 NOAA가 배포하는 지수 값을 쓰세요.
  - 격자별 불확실성(앙상블) 자료는 아직 정식 공개되지 않았습니다. NCAR Climate Data Guide의 개발자 안내(2025년 8월)는 2026년 공개 예정이라고 밝혔고, 2026년 10월 NCEI pub 경로 unc/ 폴더에 RONI 불확실성 파일이 올라왔지만 설명 문서는 아직 확인되지 않습니다.
  - 관측이 드문 1945년 이전, 특히 1900년 이전·두 세계대전 시기·40°S 남쪽 해역은 불확실성이 크고 인위적 변동이 있을 수 있습니다(NCAR Climate Data Guide). 이 시기 추세는 HadSST·COBE-SST 등 다른 자료와 함께 확인하세요.
  - 2° 월평균이라 극값이나 일 변동은 표현하지 못합니다. 모델과 비교할 때는 모델을 2° 격자로 옮기고, 자료마다 기후값이 다르므로 편차보다 절대 SST로 비교하는 것을 개발자들이 권합니다.
  - 데이터셋 DOI는 v6 전용 10.25921/z7cw-es89입니다. 일부 카탈로그(data.gov, NCEI 메타데이터의 'landing page' 링크)에는 v5 DOI(10.7289/V5T72FNM)가 남아 있으니 v6 인용에 쓰지 마세요.

