# ─────────────────────────────────────────────────────────────
# CORDEX-CMIP5 — 데이터셋 정보 파일
# WCRP CORDEX 1세대: CMIP5 전지구 모델을 지역기후모델(RCM)로 역학 다운스케일링 (RCP 시나리오)
# 2026-10-16 확인: 새 시뮬레이션 없음(CORDEX-CMIP6로 넘어감), 2025년 초 DKRZ 자료 손실로 ESGF 일부 자료 사라짐
# ─────────────────────────────────────────────────────────────
id: cordex-cmip5
name: CORDEX-CMIP5
full_name: Coordinated Regional Climate Downscaling Experiment driven by CMIP5 (CMIP5 기반 WCRP 지역기후 다운스케일링 국제 공동실험)
category: model_output
domain: model
group: 지역 다운스케일링
order: 20
domains: [대기, 육지, 극지]
provider: WCRP CORDEX (각 지역 모델링 그룹 생산, ESGF·Copernicus CDS 배포)

status: ended
status_note: >-
  CMIP5 GCM·RCP 시나리오 기반의 1세대 CORDEX 자료로, 공동체 작업은 CMIP6 기반 CORDEX-CMIP6로 넘어갔습니다. 2026-10-16 확인 시
  2025년 초 DKRZ ESGF 노드의 자료 손실로 약 20,000개 데이터셋(200 TB 이상)이 ESGF에서 사라진 상태이며, 많이 쓰는 변수 일부는 Copernicus CDS에서 계속 받을 수 있습니다.
  미국 ESGF 색인(ORNL Globus 색인)에서는 CORDEX 프로젝트가 검색되지 않습니다.
successor:
  name: CORDEX-CMIP6
  url: https://wcrp-cordex.github.io/simulation-status/
  note: CMIP6 GCM·SSP 시나리오 기반 후속 세대입니다. 2026-10-16 기준 유럽·북미 등 일부 영역만 ESGF에 공개되었고 동아시아(EAS)는 아직 공개 전입니다.

period:
  start: "1950"
  end: "2100"
  note: >-
    보관 규격 기준 과거 실험(historical) 1950–2005년, RCP4.5·RCP8.5 시나리오 2006–2100년, ERA-Interim 구동 평가 실험(evaluation)은 1989–2008년이 권장 기간입니다.
    Copernicus CDS 수록본은 평가 1979–2019년, 과거 1948–2010년, RCP 2006–2101년 범위 안에서 시뮬레이션마다 다르고, RCP2.6도 포함합니다.

resolution:
  spatial_short: "모델마다 다름"
  temporal_short: "3시간"
  spatial: >-
    영역별 CORDEX 회전극 격자 — 보관 규격 표 1은 0.44° 13개 영역(EAS-44 등)과 0.22°(MNA-22·SEA-22)·0.11°(EUR-11)까지 16개 격자를 정의하며,
    이후 EAS-22 같은 0.22° 영역도 쓰였습니다(CORDEX 도메인 표).
    핵심 변수는 정규 위경도 i-격자(EAS-44i 0.5° 등, 격자 경계가 정수 위경도)로도 제공하도록 규정되어 있습니다.
    Copernicus CDS 수록 동아시아 자료는 0.22°와 0.44°입니다.
  vertical: 지표·단일면 변수 + 일부 기압면 변수(200·500·850 hPa 등)
  temporal: 3시간·6시간·일·월·계절(sem) + 고정장(fx)

coverage:
  short: 대륙별 영역
  note: >-
    CORDEX 14개 지역 영역(남미·중미·북미·유럽·아프리카·남아시아·동아시아·중앙아시아·오스트랄라시아·남극·북극·지중해·중동북아프리카(MENA)·동남아시아).
    한반도는 동아시아(EAS, CORDEX Region 7) 영역에 들어가며, EAS-44는 회전극 북극점(경도 -64.78°, 위도 77.61°) 기준 203×167 격자,
    EAS-44i는 0.5° 정규 격자 227×157(62.75°–175.75°E, 18.75°S–59.25°N 격자 위치)입니다.
update: 갱신 종료 (새 시뮬레이션 없음. CDS 수록본은 분기별 갱신으로 안내되며 최신 버전만 제공)
license: >-
  CORDEX-CMIP5 이용 약관(2013-05-02)은 자료를 "unrestricted"(상업 이용 가능)와 "non-commercial"(비상업 연구·교육 전용)로 나누며, 시뮬레이션마다 어느 쪽인지는
  CORDEX RCM 목록에서 확인합니다. Copernicus CDS 수록본은 "CORDEX licence"로, BOUN-RegCM4-3(중앙아시아·MENA)과 RU-CORE-RegCM4-3(동남아시아)을 빼면 상업 이용이 가능합니다.
  논문에는 사사 문장과 사용 모델·기관 표가 필요합니다.
account_required: true

summary: >-
  CORDEX-CMIP5는 WCRP 지역기후 다운스케일링 공동실험(CORDEX)이 CMIP5 전지구 기후모델(GCM)과 ERA-Interim 재분석을 경계조건으로 여러 지역기후모델(RCM)을 돌려 만든
  1세대 대륙별 영역 기후 시뮬레이션입니다. 대부분 영역이 0.44°(약 50 km) 격자이고, 과거(1950–2005)와 RCP2.6·4.5·8.5 시나리오(2006–2100)를 다룹니다.
  IPCC AR6 Atlas의 지역 기후변화 평가에 쓰인 C3S CORDEX 앙상블의 바탕이며, 지금은 CMIP6 기반 CORDEX-CMIP6가 후속 세대입니다.

time_convention:
  summary: >-
    평균·최대·최소 변수는 시간 좌표가 구간의 가운데(중간점)에 찍히고 time_bnds로 구간을 줍니다. 3시간·6시간 순간값 변수는 정시(0Z부터 3시간 또는 6시간 간격) 값입니다.
  points:
    - "6시간 순간값은 0·6·12·18Z, 6시간 평균값은 3·9·15·21Z, 3시간 순간값은 0Z부터 3시간 간격, 3시간 평균값은 1.5Z·4.5Z…에 찍힙니다."
    - "같은 tas라도 3시간 자료는 순간값(point), 일·월·계절 자료는 평균입니다. 월·계절 tasmax·tasmin은 '일 최고(최저)의 평균'입니다."
    - "시간 단위는 'days since 1949-12-01T00:00:00Z'(또는 같은 뜻의 형식)이고, 달력은 구동 자료를 따릅니다(평가 실험은 proleptic Gregorian 또는 standard Gregorian). GCM 구동 실험은 365일·360일 달력일 수 있습니다."
    - "평가 실험의 experiment_id는 'historical'이 아니라 'evaluation'입니다."
  source: http://wcrp-cordex.github.io/cordex-cmip5/cordex_archive_specifications.pdf
  source_name: CORDEX Archive Specifications v3.2 (2020-05-05) + CORDEX 변수 요구표 v3.1 (2014-02-21)

variables:
  note: >-
    CORDEX 변수 요구표(CORDEX variables requirement table, v3.1, 2014-02-21)의 핵심 변수입니다. 변수명은 파일 속 이름, 단위는 요구표 표기입니다.
    1시간 자료는 규정되어 있지 않습니다. Copernicus CDS에서는 같은 변수를 '2m_air_temperature' 같은 CDS 이름으로 고릅니다.
  full_list: http://wcrp-cordex.github.io/cordex-cmip5/CORDEX_variables_requirement_table.pdf
  groups:
    - name: 일 (day)
      kind: mean
      period: 일
      items:
        - {text: "지상 기온 — `tas` (K)", std: [t2m]}
        - text: "일 최고기온 — `tasmax` (K)"
          kind: max
        - text: "일 최저기온 — `tasmin` (K)"
          kind: min
        - "강수 — `pr` (kg m-2 s-1)"
        - "지상 비습 — `huss` (1)"
        - "지상 상대습도 — `hurs` (%)"
        - "해면기압 — `psl` (Pa)"
        - {text: "지상 풍속 — `sfcWind` (m s-1)", std: [wind10]}
        - {text: "지상 동서 바람 — `uas` (m s-1)", std: [wind10]}
        - {text: "지상 남북 바람 — `vas` (m s-1)", std: [wind10]}
        - "지표 하향 단파복사 — `rsds` (W m-2)"
        - "지표 하향 장파복사 — `rlds` (W m-2)"
        - "증발 — `evspsbl` (kg m-2 s-1)"
        - text: "총 유출 — `mrro` (kg m-2 s-1)"
          note: 육지 평균
    - name: 월 (mon)
      kind: mean
      period: 월
      items:
        - {text: "지상 기온 — `tas` (K)", std: [t2m]}
        - text: "일 최고기온의 월평균 — `tasmax` (K)"
          note: 일 최고기온을 평균한 값
        - text: "일 최저기온의 월평균 — `tasmin` (K)"
          note: 일 최저기온을 평균한 값
        - "강수 — `pr` (kg m-2 s-1)"
        - "해면기압 — `psl` (Pa)"
        - "전운량 — `clt` (%)"
    - name: 3시간 (3hr)
      kind: instant
      period: 3시간
      items:
        - {text: "지상 기온 — `tas` (K)", std: [t2m]}
        - text: "강수 — `pr` (kg m-2 s-1)"
          kind: mean
        - "지상 비습 — `huss` (1)"
        - "해면기압 — `psl` (Pa)"
        - {text: "지상 풍속 — `sfcWind` (m s-1)", std: [wind10]}
        - text: "지표 하향 단파복사 — `rsds` (W m-2)"
          kind: mean
    - name: 6시간 (6hr)
      kind: instant
      period: 6시간
      items:
        - {text: "지상 동서 바람 — `uas` (m s-1)", std: [wind10]}
        - {text: "지상 남북 바람 — `vas` (m s-1)", std: [wind10]}
        - "500 hPa 지위고도 — `zg500` (m)"
        - "850 hPa 동서 바람 — `ua850` (m s-1)"
    - name: 고정장 (fx)
      kind: static
      items:
        - "지표 고도 — `orog` (m)"
        - "육지 비율 — `sftlf` (%)"

access:
  - name: Copernicus CDS — CORDEX regional climate model data on single levels
    url: https://cds.climate.copernicus.eu/datasets/projections-cordex-domains-single-levels
    login: true
    method: 웹 다운로드 폼 / CDS API (cdsapi), 2026년 7월부터 영역·기간 잘라 받기 가능
    note: >-
      14개 영역(동아시아 0.22°·0.44° 포함), 평가·과거·RCP2.6·4.5·8.5, 3시간·6시간·일·월·계절 자료, 주요 변수 24종이 있습니다. NetCDF4(CF-1.4).
      ECMWF 계정과 CORDEX 라이선스 동의가 필요합니다. DKRZ 손실 뒤에도 많이 쓰는 변수는 이곳에서 받을 수 있다고 CORDEX가 안내합니다.
  - name: CEDA 아카이브 — CORDEX EAS-44i (MOHC HadRM3P, ERA-Interim 평가 실험)
    url: https://catalogue.ceda.ac.uk/uuid/c47ee635b055465da578404741e3170f
    login: true
    method: CEDA 아카이브 웹·FTP (경로 /badc/cordex/data/CORDEX/output/EAS-44i/MOHC/ECMWF-ERAINT/evaluation)
    note: 영국 기상청 해들리센터의 동아시아 0.44° 평가 실험(1990–2010) 월·계절 평균입니다. CEDA 등록 사용자면 받을 수 있습니다.

example:
  lang: python
  note: >-
    ~/.cdsapirc에 CDS API key를 넣고 웹 페이지에서 라이선스에 동의한 뒤 실행합니다. 영역·해상도·GCM·RCM·멤버 조합이 실제로 있어야 요청이 성공하므로,
    다운로드 폼에서 가능한 조합을 먼저 확인하고 값을 바꾸세요(아래 GCM·RCM 조합은 예시).
  code: |
    # pip install --upgrade cdsapi
    import cdsapi

    client = cdsapi.Client()
    client.retrieve(
        "projections-cordex-domains-single-levels",
        {
            "domain": "east_asia",
            "experiment": "historical",
            "horizontal_resolution": "0_44_degree_x_0_44_degree",
            "temporal_resolution": "daily_mean",
            "variable": ["2m_air_temperature"],
            "gcm_model": "mohc_hadgem2_es",
            "rcm_model": "clmcom_cclm5_0_2",
            "ensemble_member": "r1i1p1",
            "year": ["2001", "2002", "2003", "2004", "2005"],
            "month": ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"],
        },
        "cordex_eas44_tas_day.zip",
    )

tips:
  - >-
    2025년 초 DKRZ 노드 자료 손실로 복제본이 없던 CORDEX-CMIP5 데이터셋 약 20,000개(200 TB 이상)가 ESGF에서 사라졌습니다. 필요한 자료가 손실 목록
    (GitHub WCRP-CORDEX/cordex-cmip5의 esgf-data-loss/Missing_CORDEX_Data.txt)에 있는지 먼저 확인하고, 예전에 받아 둔 파일은 지우지 마세요.
    손실 자료를 갖고 있다면 CORDEX(datasupport@cordex.org)에 알리도록 요청하고 있습니다.
  - >-
    ESGF 경로는 과도기입니다. CORDEX 안내 페이지는 SMHI-NSC·DKRZ·CEDA(BADC)·IPSL 네 노드가 CORDEX 검색 항목을 완전히 지원한다고 하지만,
    ESGF는 이 노드들이 쓰는 옛 SOLR 색인을 퇴역시키는 중이고 CMIP5 같은 옛 프로젝트를 새 색인으로 옮길 계획이 없다고 밝혔습니다. 2026-10-16 확인 시
    미국 ORNL Globus 색인에서 project=CORDEX 검색 결과는 0건입니다. ESGF로 받으려면 CORDEX Research(비상업) 또는 CORDEX Commercial 그룹 가입이 필요합니다.
  - >-
    동아시아 ESGF 현황표(2023-07-13판)에는 EAS-22(REMO2015·RegCM4-4, 구동 HadGEM2-ES·MPI-ESM-LR·MPI-ESM-MR·NorESM1-M, RCP2.6·8.5)와
    EAS-44(CCLM5-0-2·HIRHAM5, 구동 CNRM-CM5·EC-EARTH·HadGEM2-ES·MPI-ESM-LR, RCP4.5·8.5) 조합만 보입니다. 국내 기관이 만든 동아시아 시뮬레이션은
    이 표에 거의 없으므로, CORDEX 동아시아 영역 페이지가 연결해 둔 지역 웹사이트(EAST ASIA CORDEX)와 담당 연구진 안내를 함께 확인하세요.
  - >-
    파일 이름은 변수_영역_GCM_실험_멤버_RCM_RCM버전(v1 등)_빈도_기간.nc 형식이고, 3·6시간 자료는 1년, 일 자료는 5년 이하, 월·계절 자료는 10년 이하 단위로 나뉩니다.
    한 GCM–RCM 조합의 과거(1950–2005)와 RCP(2006–2100) 파일을 이어 붙여 연속 시계열을 만듭니다.
  - >-
    회전극 원격자(EAS-44 등)에는 rlat·rlon 좌표와 2차원 lat·lon이 함께 들어 있습니다. 여러 RCM을 비교할 때는 핵심 변수가 있는 정규 i-격자(EAS-44i 등)를 쓰거나,
    보존적 보간 등으로 공통 격자에 맞추세요. 달력도 구동 GCM을 따라 365일·360일일 수 있습니다.
  - >-
    오류가 알려진 자료는 CDS 문서에서 연결하는 CORDEX 정오표(errata) 서비스와 CDS 알려진 문제(Known issues) 페이지에서 확인하세요.

