notices:
  - date: "2026-07"
    level: info
    title: Copernicus CDS CORDEX 자료 영역·기간 잘라 받기 지원
    body: >-
      CDS 데이터셋 페이지의 갱신 기록에 따르면 공간·시간 잘라 받기가 가능해졌습니다. 요청 방식이 WPS 기반으로 바뀌어 시작·끝 키 대신 year·month 항목으로 기간을 고릅니다.
      예전 API 스크립트는 요청 키를 점검하세요.
    source: https://cds.climate.copernicus.eu/datasets/projections-cordex-domains-single-levels?tab=documentation
  - date: "2025-05-16"
    level: critical
    title: DKRZ ESGF 자료 손실 — CORDEX-CMIP5 약 20,000개 데이터셋 사라짐
    body: >-
      2025년 초 DKRZ에서 큰 자료 손실이 있었고, 복제본 없이 그 노드에만 있던 데이터셋이 많아 대부분 복구할 수 없습니다. 여러 영역·변수·빈도에 걸쳐
      약 20,000개 데이터셋(200 TB 이상)이 영향을 받았으며, 전체 목록은 GitHub의 Missing_CORDEX_Data.txt에 있습니다. 자주 쓰는 변수 일부는 Copernicus CDS에서 계속 받을 수 있습니다.
    source: https://cordex.org/2025/05/16/esgf-data-loss-impacting-the-availablility-of-cordex-cmip5-data/

transitions:
  - from: CORDEX-CMIP5
    to: CORDEX-CMIP6
    to_id: cordex-cmip6
    status: planned
    summary: >-
      구동 GCM이 CMIP5에서 CMIP6로, 시나리오가 RCP에서 SSP로 바뀐 후속 세대입니다. 2026-10-16 기준 유럽·북미 등 일부 영역은 ESGF에 공개되었지만
      동아시아(EAS)는 아직 공개 전이라 한반도 연구는 한동안 두 세대를 함께 보게 됩니다.
    changes:
      - aspect: 구동 전지구 모델
        before: CMIP5 GCM (예 — 동아시아 HadGEM2-ES·MPI-ESM-LR·MPI-ESM-MR·NorESM1-M·CNRM-CM5·EC-EARTH)
        after: CMIP6 GCM (EAS-12 EC-Earth3-Veg·MPI-ESM1-2-HR·NorESM2-MM, EAS-25 UKESM1-0-LL)
      - aspect: 미래 시나리오
        before: RCP2.6·4.5·8.5, 2006–2100
        after: SSP1-2.6·3-7.0 우선, SSP2-4.5·5-8.5 권장, 2015–2100
      - aspect: 과거 실험 기간
        before: 1950–2005
        after: 1950–2014 (최소 1960–2014)
      - aspect: 평가 실험(재분석 구동)
        before: ERA-Interim, 1989–2008 권장
        after: ERA5, 1979–2020 이상
      - aspect: 영역 이름·해상도
        before: EAS-44·EAS-22·EAS-11 (격자 간격 °), 대부분 영역 기본 0.44°
        after: EAS-50·EAS-25·EAS-12 (가까운 km, 같은 격자 정의), 주 목표 격자 간격 25 km·12.5 km
      - aspect: 출력 빈도
        before: 3시간·6시간·일·월·계절(sem)·고정장
        after: 1시간·3시간·6시간·일·월·고정장 (CORE 변수 1시간 권장, 계절 자료 없음)
      - aspect: 보관 규격·DRS
        before: CORDEX Archive Specifications (v3.2, 2020), project_id CORDEX, RCM 버전 v1 등
        after: CORDEX-CMIP6 보관 규격 (v1 2024 → v4 2026), project_id CORDEX-CMIP6, version_realization vN-rM 추가
      - aspect: 시간 단위
        before: days since 1949-12-01T00:00:00Z
        after: days since 1950-01-01 (1950년 이전 구간은 1850-01-01 허용)
      - aspect: 라이선스
        before: unrestricted / non-commercial 두 가지 (시뮬레이션마다 다름)
        after: CC BY 4.0 강력 권장 (2026-10-16 등록 모델 54개 모두 CC BY 4.0)
      - aspect: 배포처
        before: ESGF 옛 색인(DKRZ 손실 영향) + Copernicus CDS
        after: ESGF 새 STAC 색인 (CORDEX-CMIP6 컬렉션), 공개 전 일부는 임시 서버
    impacts:
      - "구동 GCM과 시나리오가 모두 바뀌었으므로 CORDEX-CMIP5와 CORDEX-CMIP6 결과를 한 앙상블로 섞거나 시계열로 이어 붙이지 마세요. RCP와 SSP 시나리오는 1:1로 대응하지 않습니다."
      - "영역 이름이 바뀌어(EAS-44 → EAS-50, EAS-22 → EAS-25) 검색어와 스크립트의 영역 값을 고쳐야 합니다. 격자 정의는 같습니다."
      - "CORDEX-CMIP6 EAS-25는 2026-10-16 기준 구동 GCM이 UKESM1-0-LL 하나뿐이라 GCM 간 불확실성 범위가 CORDEX-CMIP5 동아시아 앙상블과 다를 수 있습니다."
      - "검색 프로젝트 이름이 CORDEX에서 CORDEX-CMIP6로 바뀌었고, 실험 이름도 driving_experiment_id(historical·ssp126 등)로 검색합니다."
    sources:
      - name: CORDEX Archive Specifications v3.2 (CORDEX-CMIP5)
        url: http://wcrp-cordex.github.io/cordex-cmip5/cordex_archive_specifications.pdf
      - name: CORDEX-CMIP6 Archiving Specifications for Dynamical Downscaling
        url: https://wcrp-cordex.github.io/archive-specifications/CORDEX-CMIP6_archiving_specifications_DD/
      - name: CORDEX experiment design for dynamical downscaling of CMIP6 (2021-05-18)
        url: https://cordex.org/wp-content/uploads/2021/05/CORDEX-CMIP6_exp_design_RCM.pdf
      - name: CORDEX 도메인 표 (WCRP-CORDEX/domain-tables)
        url: https://github.com/WCRP-CORDEX/domain-tables
      - name: CORDEX-CMIP6 영역별 시뮬레이션 현황
        url: https://wcrp-cordex.github.io/simulation-status/CORDEX_CMIP6_status.html
      - name: CORDEX-CMIP6 이용 약관
        url: https://cordex.org/data-access/cordex-cmip6-data/cordex-cmip6-terms-of-use/

