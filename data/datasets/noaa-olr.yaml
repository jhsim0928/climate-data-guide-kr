summary: >-
  NOAA 극궤도 위성의 적외 관측으로 추정한 대기 상단 외향 장파복사(OLR) 격자 자료입니다. 열대에서 OLR이 낮으면 깊은 대류운이 있다는 뜻이라,
  CERES 이전(1970년대 후반)부터 이어지는 긴 기록 덕분에 MJO·ENSO·몬순 대류 지수의 기본 자료로 쓰입니다.
  현행 NCEI OLR CDR은 HIRS·IASI·CrIS를 위성 간 보정해 일(1°)·월(2.5°) 자료를 만들고, PSL Interpolated OLR(2.5°, 1974~2022)은 옛 연구 재현용으로 남아 있습니다.

time_convention:
  summary: >-
    모든 값은 하루 또는 한 달 평균 OLR(W m-2)입니다. 극궤도 위성은 하루 몇 번만 지나가므로, OLR CDR은 정지궤도 위성 OLR로 일주기를 보완해 하루 평균을 만들고,
    PSL Interpolated OLR은 하루 두 번 값(주간·야간 통과)을 보간해 평균합니다.
  points:
    - "OLR Daily CDR v2.0은 극궤도 시야별 OLR을 시간별 지도로, 정지궤도 OLR을 3시간 지도로 모은 뒤 격자마다 7일 이동 창(boxcar)으로 두 자료를 맞춰 하루 값으로 적분합니다. 하루 경계(UTC 등)는 사용자 가이드에 명시되어 있지 않습니다."
    - "일자료 예비판은 약 36시간 뒤 정지궤도 입력으로 NESDIS GSIP를, 확정판은 약 6개월 뒤 GridSat-B1을 씁니다. 같은 날짜라도 두 판의 값이 다를 수 있습니다."
    - "OLR Monthly CDR v3.0은 기후값 일주기 모델로 극궤도 관측 시각 차이를 보정합니다. 엘니뇨처럼 일주기 자체가 바뀌는 시기에는 이 가정이 덜 맞을 수 있다고 가이드가 밝힙니다."
    - "PSL Interpolated OLR은 NOAA의 하루 두 번 OLR을 시간·공간으로 보간해 결측을 채운 뒤 하루 평균한 값입니다(파일 설명 기준). 결측이 없는 대신 보간된 날이 섞여 있습니다."
    - "PSL 파일의 시간 단위는 'hours since 1800-01-01'입니다."
  source: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Outgoing%20Longwave%20Radiation%20-%20Daily/UserGuide_01B-21.pdf
  source_name: OLR Daily·Monthly CDR User Guide (Rev 0) + PSL interp_OLR 파일 메타데이터

variables:
  note: >-
    PSL 파일의 변수 이름은 THREDDS 메타데이터에서 확인한 이름입니다. NCEI CDR 파일 속 변수 이름은 사용자 가이드에 적혀 있지 않아 설명만 적었습니다(받은 파일에서 확인하세요).
    모든 OLR 단위는 W m-2(PSL 표기 W/m^2)입니다.
  full_list: https://www.ncei.noaa.gov/products/climate-data-records/outgoing-longwave-radiation-daily
  groups:
    - name: 일평균 OLR
      kind: mean
      period: 일
      items:
        - text: "외향 장파복사 — OLR Daily CDR v2.0, 1° (W m-2)"
          std: [toa_rad]
        - text: "외향 장파복사 — PSL Interpolated OLR 일자료 `olr` (W/m^2)"
          std: [toa_rad]
        - text: "일별 기후값 — PSL `olr.day.ltm.1991-2020.nc` 등 (W/m^2)"
          std: [toa_rad]
          note: 기준 기간의 같은 날짜끼리 평균한 값
    - name: 월평균 OLR
      kind: mean
      period: 월
      items:
        - text: "외향 장파복사 — OLR Monthly CDR v3.0, 2.5° (W m-2)"
          std: [toa_rad]
        - text: "외향 장파복사 — PSL Interpolated OLR 월자료 (W/m^2)"
          std: [toa_rad]

access:
  - name: NCEI — OLR Daily CDR 제품 페이지 (문서·다운로드 링크)
    url: https://www.ncei.noaa.gov/products/climate-data-records/outgoing-longwave-radiation-daily
    method: 웹 / AWS S3 탐색기 (netCDF-4, 연 1파일)
    note: 다운로드 링크는 NOAA CDR 저장소(https://archive.data.noaa.gov/climatedatarecords#UMD_ESSIC/OLR_CDR/Daily/OLR-D-CDR_01B-21/)로 연결됩니다.
  - name: NCEI — OLR Monthly CDR 제품 페이지
    url: https://www.ncei.noaa.gov/products/climate-data-records/outgoing-longwave-radiation-monthly
    method: 웹 / AWS S3 탐색기 (netCDF-4, 한 파일에 전 기간)
  - name: NOAA PSL 다운로드 서버 — OLR CDR 사본(olr_cdr_day)과 Interpolated OLR(interp_OLR)
    url: https://downloads.psl.noaa.gov/Datasets/olr_cdr_day/
    method: HTTPS 직접 다운로드 / THREDDS·OPeNDAP
    note: >-
      olr.day.mean.v2.nc(일, 약 3.6 GB)·olr.mon.mean.v2.nc(월)와 1991–2020 기후값을 한 파일로 묶어 제공합니다. Interpolated OLR은
      https://downloads.psl.noaa.gov/Datasets/interp_OLR/ 에 있습니다. 계정이 필요 없습니다.

example:
  lang: python
  note: "계정 없이 PSL OPeNDAP으로 바로 엽니다. Interpolated OLR은 2022년까지라, 이후 기간은 olr_cdr_day 폴더의 OLR CDR 사본을 내려받아 같은 방식으로 여세요(변수 이름은 파일에서 확인)."
  code: |
    # pip install xarray netCDF4
    import xarray as xr

    url = "https://psl.noaa.gov/thredds/dodsC/Datasets/interp_OLR/olr.day.mean.nc"
    ds = xr.open_dataset(url)
    olr = ds["olr"].sel(time=slice("2015-01-01", "2016-12-31"))
    trop = olr.where(abs(olr["lat"]) <= 15, drop=True)  # 위도 순서와 상관없이 15°S–15°N 선택
    # 열대 평균 OLR 시계열 (W/m^2)
    print(trop.mean(("lat", "lon")).to_series().head())

tips:
  - OLR CDR 일자료 v1.2와 v2.0, PSL Interpolated OLR과 OLR CDR은 서로 다른 자료입니다. 한 시계열로 이어 붙이지 말고 한 자료로 통일하세요.
  - "OLR CDR 일자료의 최근 구간은 예비판(파일 이름에 -preliminary)입니다. 확정판이 나오면 다시 받아 결과를 확인하세요."
  - "OLR CDR에는 품질 플래그가 없습니다. 일자료 v2.0에는 30일 결측이 있고(주로 NOAA-6·NOAA-9 단독 시기), CrIS 위성 간 보정이 약 1.4 W m-2로 크게 나왔다고 가이드가 밝힙니다."
  - "HIRS 관련 알려진 문제 — NOAA-15·16 주사 위치 한 칸 어긋남, 1999년 3월 이후 NOAA-14 천정각 오류, 1998년 말 이전 정지궤도 자료의 불완전한 범위가 가이드에 적혀 있습니다. 해당 시기 국지 분석은 주의하세요."
  - "PSL 파일과 NCEI CDR 파일은 격자(2.5° 144×73, 1° 360×180, 2.5° 144×72)와 위도 정렬 순서가 다를 수 있습니다. `sel(lat=slice(...))`로 자르기 전에 위도 순서를 확인하세요."
  - 대류 지수(MJO의 OMI·RMM 등)는 쓰는 OLR 자료에 따라 값이 달라집니다. 논문에는 OLR 자료 이름과 판을 함께 적으세요.
  - 에너지 수지(절대값)가 필요하면 광대역 복사계 자료인 CERES EBAF·SYN1deg를 쓰세요. OLR CDR은 협대역·초분광 복사휘도에서 추정한 값으로, 정확도는 CERES 대비 약 2 W m-2입니다.

