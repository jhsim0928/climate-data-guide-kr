notices:
  - date: "2026-05-07"
    level: info
    title: PSL OMI(MJO 지수) 갱신 — NOAA 일별 blended OLR 사용
    body: >-
      PSL이 OLR 기반 MJO 지수(OMI)를 거의 현재까지 갱신했으며, 이제 NOAA 일별 blended OLR을 입력으로 쓴다고 공지했습니다.
      Interpolated OLR은 2022년 이후 자료가 없으므로, OMI를 예전 값과 이어 쓸 때는 입력 자료가 바뀐 점을 고려하세요.
    source: https://psl.noaa.gov/data/notices/
  - date: "2025-08-26"
    level: warning
    title: OLR CDR 일자료 v2.0·월자료 v3.0 공개, 일자료 v1.2 대체
    body: >-
      NCEI가 HIRS·IASI·CrIS를 함께 쓰는 OLR CDR 일자료 Version 2.0과 월자료 Version 3.0을 공개했습니다. 일자료 v1.2는 2025-08-22 자료에서 멈추고 '대체됨'으로 바뀌었으며,
      NCEI는 예전 연구 재현이 아니면 새 판을 쓰라고 안내합니다.
    source: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C00875

