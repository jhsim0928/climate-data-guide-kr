# ─────────────────────────────────────────────────────────────
# NOAA OLR (PSL Interpolated OLR · NCEI HIRS OLR CDR) — 데이터셋 정보 파일
# 위성 탭(구름·복사), 대기 탭 '복사 자료'에 교차 수록.
# PSL Interpolated OLR(2.5°)은 2022-12-31 자료에서 멈췄고, 현행 기록은 NCEI OLR CDR(일 v2.0·월 v3.0, 2025-08 공개)입니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: noaa-olr
name: "NOAA OLR"
full_name: NOAA Interpolated Outgoing Longwave Radiation (PSL) 및 NOAA Climate Data Record of Daily/Monthly Outgoing Longwave Radiation (NCEI) (NOAA 극궤도 위성 외향 장파복사 일·월 격자 자료)
category: satellite
domain: satellite
group: 구름·복사
order: 50
also_in:
  - domain: atmosphere
    group: 복사 자료
domains: [대기, 원격탐사]
provider: NOAA NCEI CDR 프로그램(OLR CDR, 메릴랜드대 ESSIC Hai-Tien Lee) / NOAA PSL(Interpolated OLR)

status: active
status_note: >-
  현행 기록은 NCEI의 OLR CDR입니다. 2025년 8월 26일 HIRS·IASI·CrIS를 함께 쓰는 일자료 Version 2.0(1°)과 월자료 Version 3.0(2.5°)이 나왔고,
  일자료는 약 이틀 늦게 매일, 월자료는 매달 갱신됩니다(PSL 사본 olr.day.mean.v2.nc가 2026-10-12에 갱신됨). 일자료 v1.2는 2025-08-22 자료에서 멈추고 '대체됨(superseded)'으로 표시되었습니다.
  MJO 연구에 오래 쓰인 PSL Interpolated OLR(2.5°)은 2022년 12월 31일 자료가 마지막으로, 그 뒤로 이어지지 않습니다.

transitions:
  - from: OLR Daily CDR v1.2 (HIRS)
    to: OLR Daily CDR v2.0 (HIRS+IASI+CrIS)
    status: completed
    date: "2025-08"
    summary: >-
      IASI·CrIS 초분광 관측을 HIRS와 일관되게 묶고 HIRS 회귀계수를 새로 만든 판입니다. 같은 날 월자료도 v3.0으로 바뀌었고, 일자료 v1.2는 2025-08-22에서 멈췄습니다.
    changes:
      - aspect: 공개 시점
        before: v1.2 (2011년 인용 정보)
        after: 2025-08-26 (일 v2.0·월 v3.0)
      - aspect: 기간
        before: 1979-01-01 ~ 2025-08-22 (갱신 종료, superseded)
        after: 1979-01-01 ~ 현재 (약 2일 지연)
      - aspect: 입력 관측
        before: HIRS 복사휘도 중심
        after: HIRS(1979~) + IASI(2007~) + CrIS(2012~), Metop-A IASI OLR을 절대 기준으로 삼아 위성 간 보정
      - aspect: HIRS OLR 산출식
        before: 기존 다중분광 회귀식
        after: IASI로 모의한 HIRS 복사휘도·IASI OLR로 새로 만든 회귀계수 — HIRS 기반 값과 IASI·CrIS 기반 값의 일관성 개선
      - aspect: 준실시간판과 확정판 (일자료)
        before: "-"
        after: 예비판(preliminary, 약 36시간 지연, 정지궤도 입력 NESDIS GSIP) → 확정판(연 1회, 약 6개월 지연, 정지궤도 입력 GridSat-B1)
      - aspect: 파일 이름 (일자료)
        before: "-"
        after: "OLR-Daily_v02r00_sYYYY0101_eYYYY1231.nc (연 1파일), 예비판은 OLR-Daily_v02r00-preliminary_s..._e....nc"
      - aspect: 월자료
        before: "v2.x (예: v2.2-1, DOI 10.7289/V5222RQP — superseded)"
        after: "v3.0 (2.5°, 약 5일 지연, OLR-Monthly_v03r00_s197901_eYYYYMM.nc)"
      - aspect: DOI (일자료)
        before: 10.7289/V5SJ1HH2
        after: 10.25921/9pt5-by77
    impacts:
      - v1.2와 v2.0을 한 시계열로 섞지 마세요. 전 기간을 v2.0으로 다시 받는 것이 안전합니다.
      - 최근 며칠~몇 달 값은 예비판이며, 확정판이 나오면 정지궤도 입력이 바뀌어 값이 달라질 수 있습니다. 연구 결과는 확정판으로 다시 확인하세요.
      - NCEI는 v1.2를 예전 연구 재현 같은 경우가 아니면 쓰지 말라고 안내합니다.
    sources:
      - name: NCEI — NOAA CDR of Daily OLR, Version 2.0 (메타데이터)
        url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01732
      - name: NCEI — Daily OLR CDR v1.2 (Version Superseded)
        url: https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C00875
      - name: OLR Daily CDR User Guide (Rev 0, 2025-10-23)
        url: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Outgoing%20Longwave%20Radiation%20-%20Daily/UserGuide_01B-21.pdf
      - name: OLR Monthly CDR User Guide (Rev 0, 2025-10-23)
        url: https://www.ncei.noaa.gov/pub/data/sds/cdr/CDRs/Outgoing%20Longwave%20Radiation%20-%20Monthly/UserGuide_01B-06.pdf
  - from: PSL Interpolated OLR (2.5°)
    to: NCEI OLR CDR (일 1° / 월 2.5°)
    status: completed
    summary: >-
      PSL Interpolated OLR은 2022년 12월 31일 자료에서 멈췄습니다. 이후 기간까지 이어지는 NOAA OLR이 필요하면 OLR CDR(또는 PSL이 함께 제공하는 CPC Blended OLR)로 옮겨야 합니다.
    changes:
      - aspect: 기간
        before: 1974-06-01 ~ 2022-12-31 (일자료)
        after: 1979-01-01 ~ 현재
      - aspect: 격자
        before: 2.5° × 2.5° (144 × 73)
        after: 일 1° × 1° (360 × 180), 월 2.5° × 2.5° (144 × 72)
      - aspect: 만드는 방식
        before: NOAA 극궤도 위성의 하루 두 번 OLR 값을 시간·공간으로 보간해 빈 곳을 채우고 하루 평균
        after: HIRS·IASI·CrIS 시야별 OLR을 위성 간 보정하고, 정지궤도 위성 OLR로 일주기를 반영해 시간 적분
      - aspect: 배포처
        before: NOAA PSL (THREDDS·downloads 서버)
        after: NOAA NCEI (CDR 저장소, AWS) — PSL에도 사본(olr_cdr_day) 제공
    impacts:
      - 두 자료는 센서·알고리즘·격자가 달라 기후값과 편차 크기가 다릅니다. 이어 붙이지 말고, 겹치는 1979~2022년으로 차이를 먼저 확인하세요.
      - Interpolated OLR 기반으로 정의된 지수(예 OMI)를 이어서 계산하려면 자료 교체에 따른 기준값 차이를 고려해야 합니다. PSL도 OMI 계산 입력을 blended OLR로 바꿨습니다.
    sources:
      - name: PSL THREDDS — interp_OLR/olr.day.mean.nc 메타데이터 (시간 범위 1974-06-01 ~ 2022-12-31)
        url: https://psl.noaa.gov/thredds/dodsC/Datasets/interp_OLR/olr.day.mean.nc.das
      - name: PSL Data Notices (2026-05-07 OMI 갱신)
        url: https://psl.noaa.gov/data/notices/

period:
  start: "1974-06"
  end: present
  note: >-
    PSL Interpolated OLR 일자료는 1974-06-01 ~ 2022-12-31(17,746일)입니다. NCEI OLR CDR은 일·월 모두 1979년 1월부터이며, 일자료는 약 이틀 늦게 매일 이어집니다
    (확정판은 해마다 한 번 약 6개월 늦게 바뀜). 일자료 v2.0에는 HIRS 고장 등으로 단일 위성 시기(NOAA-6·NOAA-9)에 30일의 결측이 있습니다.

resolution:
  spatial_short: "111 km (1°)"
  temporal_short: "1일"
  spatial: >-
    OLR Daily CDR v2.0 — 전지구 1° × 1° 등각 격자(360 × 180, 값은 격자 중심 대표). OLR Monthly CDR v3.0 — 2.5° × 2.5°(144 × 72).
    PSL Interpolated OLR — 2.5° × 2.5°(144 × 73).
  vertical: 대기 상단(TOA) 단일면
  temporal: 일평균(OLR Daily CDR, Interpolated OLR) / 월평균(OLR Monthly CDR, Interpolated OLR 월자료) / 일·월 기후값(PSL, 1991–2020 등)

