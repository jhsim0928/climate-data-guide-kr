access:
  - name: GOSAT Data Archive Service (GDAS, NIES) — GOSAT
    url: https://data2.gosat.nies.go.jp/index_en.html
    method: 웹 검색·주문 (사용자 등록 필요)
    note: >-
      GOSAT L1B~L4 표준 산출물을 받는 곳입니다. 'product & service' 페이지의 사용자 인증에서 먼저 등록해야 합니다.
      2026-10-13 확인 시 누리집이 점검(under maintenance) 화면만 보여 최신 판과 등록 절차를 확인하지 못했습니다.
  - name: GOSAT-2 Product Archive (NIES)
    url: https://prdct.gosat-2.nies.go.jp/
    method: 웹 주문(장바구니 → zip 내려받기) / SFTP 일괄 받기
    note: >-
      일반 사용자(General User) 등록은 이용 약관·개인정보 처리 동의 후 프로필을 적고, 7일 안에 확인 메일 링크를 눌러 마칩니다. 주문이 준비되면 메일이 오고 주문 상세 페이지에서 zip을 받으며,
      주문 이력은 90일 보관됩니다. 연구 공모(RA) 등 인가 사용자(Authorized User)는 신청서를 gosat-2_desk@nies.go.jp로 보냅니다. 판별 형식 설명서·릴리스 노트는 Documents 페이지에 있습니다.
  - name: GOSAT-GW TANSO-3 Product Archive (NIES)
    url: https://product.gosat-gw.nies.go.jp/en/home/
    method: 웹 검색·명령줄 검색, 사용자 등록 후 내려받기 (HDF5)
    note: 2026-07-23부터 L1B(V101.101)를 공개했습니다. 2026-10-19~2027-02 무렵 새 L1B 제공이 멈추며, L2는 2027년 봄 일반 공개 예정입니다.
  - name: NASA GES DISC — ACOS_L2_Lite_FP v11.0 (GOSAT XCO2)
    url: https://disc.gsfc.nasa.gov/datasets/ACOS_L2_Lite_FP_11.0/summary
    method: HTTPS / earthaccess / Earthdata Search (Earthdata 로그인)
    note: Colorado State University가 OCO-2와 같은 ACOS 알고리즘으로 GOSAT 스펙트럼(JAXA L1B v300300·v300301)에서 만든 편향 보정 XCO2 일별 파일입니다. 2009-04-18부터(2026-10-13 확인 시 2026-07-31 자료까지).
  - name: JAXA EORC GOSAT 누리집
    url: https://www.eorc.jaxa.jp/GOSAT/index.html
    method: 운용 상태·공지, 일별 부분 기둥 GHG, 월별 GHG 지도, GHG 추세 보기
    note: GOSAT·GOSAT-2 관측 중단·재개 공지가 가장 먼저 올라오는 곳입니다.

example:
  lang: python
  note: >-
    (1) earthaccess로 NASA ACOS GOSAT Lite v11.0을 받아 변수 목록을 확인하고, (2) GOSAT-2 Product Archive에서 받은 SWFP 일별 파일(HDF5)에서 'Good' 품질의 XCO2를 고르는 예입니다.
    GOSAT-2 파일 이름은 GOSAT2TFTS2YYYYMMDD_02SWFPV0230..... .h5 형식이며 아래 이름은 예시입니다.
  code: |
    import earthaccess, xarray as xr, h5py, numpy as np

    # (1) NASA ACOS GOSAT XCO2 (2009-04-18 ~ )
    earthaccess.login()  # 무료 NASA Earthdata 계정
    res = earthaccess.search_data(short_name="ACOS_L2_Lite_FP", version="11.0",
                                  temporal=("2020-07-01", "2020-07-31"),
                                  bounding_box=(120, 30, 135, 45))
    files = earthaccess.download(res, "acos_gosat")
    print(xr.open_dataset(files[0]).data_vars)   # 변수 이름·단위 확인

    # (2) GOSAT-2 FTS-2 SWIR L2 SWFP (Product Archive에서 받은 파일)
    with h5py.File("GOSAT2TFTS2_example_02SWFPV0230.h5", "r") as f:
        xco2 = f["RetrievalResult/xco2"][:]               # ppm, 결측 -999
        qf   = f["RetrievalResult/xco2_quality_flag"][:]   # 0 Good, 1 Fair, 2 Poor, 3 NG
        lat  = f["SoundingGeometry/latitude"][:]
        lon  = f["SoundingGeometry/longitude"][:]
    good = (qf == 0) & (xco2 > 0)
    print(good.sum(), np.mean(xco2[good]))

tips:
  - "GOSAT-2 SWFP는 'Good'(0) 품질만 쓰라고 안내합니다. 결측값은 -999.0입니다."
  - "GOSAT-2 XCH4 단위가 ppb가 아니라 ppm입니다. 다른 자료(TROPOMI 등, ppb)와 비교할 때 1000을 곱하세요."
  - "GOSAT-2는 발사 뒤 지수적으로 떨어지던 Band 1 감도가 2024~2026년 약 10% 회복해, V02.30까지 보정되지 않은 양의 편향이 2024년 이후 시간에 따라 변합니다. 2024년 이후 추세·성장률 분석은 이 점을 명시하세요."
  - "GOSAT-2 V02.21 릴리스 노트(2026년 7월 개정)에는 TCCON(GGG2020)을 기준으로 만든 XCO2·XCH4·XCO 경험적 편향 보정식과 계수가 실려 있습니다. 파일 형식 설명서에는 편향 보정 변수가 없으므로, 필요하면 쓰는 판의 릴리스 노트에서 식을 확인해 직접 적용하세요."
  - "NIES GOSAT L2와 NASA ACOS GOSAT은 같은 스펙트럼을 다른 알고리즘으로 처리한 별개 자료입니다. 한 시계열로 섞지 말고, 어느 것을 썼는지 밝히세요."
  - "GOSAT·GOSAT-2는 장비 이상·궤도 조정으로 수일~수주씩 관측이 빕니다(예 GOSAT FTS 2025-12-18~2026-02-04). 월평균을 만들 때 관측 일수를 확인하세요."
  - "출처 표기를 빠뜨리지 마세요. GOSAT·GOSAT-2는 'JAXA/NIES/MOE', GOSAT-GW(TANSO-3)는 'NIES/MOE'입니다."

