# ─────────────────────────────────────────────────────────────
# GOSAT·GOSAT-2·GOSAT-GW (이부키 시리즈) — 데이터셋 정보 파일
# 위성 탭(에어로졸·대기 성분). 일본 환경성(MOE)·국립환경연구소(NIES)·JAXA의 온실가스 관측위성 세 세대를 한 페이지에 정리합니다.
# 세대 변화(GOSAT → GOSAT-2 → GOSAT-GW)는 같은 페이지 안 transitions(to_id 없음)로 적었습니다.
# 수정 후에는 공식 페이지에서 확인한 날짜로 last_verified 를 갱신하세요.
# ─────────────────────────────────────────────────────────────
id: gosat
name: "GOSAT (GOSAT-2·GOSAT-GW)"
full_name: Greenhouse gases Observing SATellite series (GOSAT 'IBUKI', GOSAT-2 'IBUKI-2', GOSAT-GW 'IBUKI GW') — TANSO-FTS·FTS-2·TANSO-3 온실가스 기둥 평균 농도(XCO2·XCH4)
category: satellite
domain: satellite
group: 에어로졸·대기 성분
order: 81
domains: [대기, 원격탐사]
provider: 일본 환경성(MOE)·국립환경연구소(NIES)·우주항공연구개발기구(JAXA) (배포 NIES GDAS·GOSAT-2 Product Archive·TANSO-3 Product Archive, NASA GES DISC(ACOS))

status: active
status_note: >-
  세 위성 모두 궤도에서 운용 중입니다. 2009년 발사된 GOSAT은 2025년 12월 18일~2026년 2월 4일 원인 미상 사건으로 FTS 자료 배포가 멈췄다가 재개되었고,
  GOSAT-2(2018년 발사, 설계 수명 5년)는 관측이 이어지지만 발사 뒤 계속 떨어지던 Band 1 감도가 2024~2026년 약 10% 회복하면서 2024년 이후 XCO2·XCH4에 시간에 따라 변하는 양(+)의 편향이 있으며 짧은 관측 중단이 잦습니다.
  2025년 6월 발사된 GOSAT-GW는 2026년 7월 23일부터 TANSO-3 L1B를 공개했지만 2026년 10월 19일부터 Band 3 정비로 새 L1B 제공을 멈추고(2027년 2월 무렵 재개 예정), L2 일반 공개는 2027년 봄 예정입니다.
  2026-10-13 확인 시 GOSAT 자료 배포처(GDAS) 누리집은 점검(under maintenance) 화면만 보였습니다.

transitions:
  - from: GOSAT (TANSO-FTS)
    to: GOSAT-2 (TANSO-FTS-2)
    status: completed
    date: "2018-10"
    summary: >-
      GOSAT-2는 GOSAT의 측정 방식(태양 반사광 푸리에 변환 분광)을 이어받으면서 일산화탄소(CO) 산출, 구름을 피해 시선을 돌리는 지능형 지향(Intelligent Pointing)을 더한 후속기입니다.
      두 위성이 지금도 함께 관측하므로 겹치는 기간 비교로 연속성을 점검할 수 있습니다(NIES 2023년 9월 정합성 조사 발표).
    changes:
      - aspect: 발사
        before: "2009-01-23 (H-IIA 15호기)"
        after: "2018-10-29 (H-IIA 40호기)"
      - aspect: 궤도·재방문
        before: "고도 약 666 km, 3일 주기(44궤도)"
        after: "고도 613 km, 하강 교점 13:00±0:15, 6일 주기"
      - aspect: 관측 화소(footprint)
        before: "약 10.5 km × 10.5 km (NASA ACOS GOSAT 설명 기준)"
        after: "순간 시야(IFOV) 9.7 km"
      - aspect: 분광 띠
        before: "SWIR 3개 띠(P·S 편광) + TIR 1개 띠"
        after: "5개 띠 — Band 1 O2 A띠, Band 2·3 CO2·CH4·CO·H2O(근·단파 적외), Band 4·5 열적외"
      - aspect: L2 산출 기체
        before: "XCO2, XCH4"
        after: "XCO2, XCH4, XCO, XH2O (SWFP 산출물)"
      - aspect: 관측점 선택
        before: "격자점·특정점 관측, 3일에 약 56,000점 중 맑은 하늘 2~5%만 사용 가능"
        after: "지능형 지향으로 구름 회피, 6일에 10만 점 이상, 하루 600점 이상 온실가스 산출 목표"
      - aspect: 배포처
        before: "GOSAT Data Archive Service (GDAS)"
        after: "GOSAT-2 Product Archive (일반 사용자 등록 후 웹 주문·SFTP)"
    impacts:
      - "두 위성의 XCO2·XCH4는 관측기·알고리즘·판이 달라 그대로 이어 붙이면 안 됩니다. 겹치는 기간(2019년~)에 TCCON 등 지상 관측으로 각각 편향을 확인하세요."
      - "GOSAT-2 L2(SWFP)는 2024년 이후 Band 1 감도 변화로 시간에 따라 변하는 양의 편향이 있어(V02.30에서 보정 안 됨), 2024년 이후 추세 분석에 특히 주의해야 합니다."
    sources:
      - name: GOSAT-2 Spacecraft & Instruments (NIES)
        url: https://www.gosat-2.nies.go.jp/about/spacecraft_and_instruments/
      - name: Imasu et al. (2023) GOSAT-2 mission overview
        url: https://doi.org/10.1186/s40645-023-00562-2
      - name: GOSAT-2 FTS-2 SWIR L2 SWFP V02.30 Release Note
        url: https://prdct.gosat-2.nies.go.jp/documents/pdf/ReleaseNote_FTS-2_L2_SWFP_ver0230_en_01.pdf
  - from: GOSAT-2 (TANSO-FTS-2)
    to: GOSAT-GW (TANSO-3)
    status: planned
    date: "2027"
    summary: >-
      GOSAT-GW는 점 관측 푸리에 분광기 대신 넓은 폭을 훑는 영상 분광기 TANSO-3을 실어, CO2·CH4와 함께 NO2를 같은 시야에서 면으로 관측합니다. 2025년 6월 29일 발사되었고
      L1B는 2026년 7월부터 공개되었으나, XCO2·XCH4·NO2 L2의 일반 공개는 2027년 봄으로 예정되어 있어 '예정'으로 둡니다.
    changes:
      - aspect: 발사·공개
        before: "2018-10-29 발사, L1 2019-08, L2 2020-11 공개 시작"
        after: "2025-06-29 발사(H-IIA 50호기, 마지막 비행), L1B V101.101 2026-07-23부터 공개, L2 일반 공개 2027년 봄 예정"
      - aspect: 관측 방식
        before: "점 관측 푸리에 변환 분광기(관측점 사이 간격 적도에서 보통 200 km 미만)"
        after: "영상 분광기 — 광역(Wide) 모드 폭 900 km 이상·해상도 약 10 km, 정밀(Focus) 모드 폭 90 km 이상·해상도 1~3 km"
      - aspect: 관측 성분
        before: "XCO2, XCH4, XCO, XH2O"
        after: "XCO2, XCH4, NO2 (L2 GHG·NO2 산출물, 광역·정밀 모드별)"
      - aspect: 함께 실린 센서
        before: "TANSO-CAI-2 (구름·에어로졸 영상기)"
        after: "AMSR3 (마이크로파 복사계, JAXA·문부과학성 개발)"
      - aspect: 자료 정책·출처 표기
        before: "JAXA/NIES/MOE 표기 (GOSAT/GOSAT-2 정책)"
        after: "NIES/MOE 표기 (TANSO-3 정책, 2025-03 제정·2026-06 개정)"
      - aspect: 배포처
        before: "GOSAT-2 Product Archive"
        after: "GOSAT-GW TANSO-3 Product Archive (등록 필요, HDF5)"
    impacts:
      - "TANSO-3 L2는 2026-10 현재 일반 공개 전입니다. 2027년 공개 전까지 연구에는 GOSAT·GOSAT-2 L2를 쓰고, 공개 뒤에도 초기 판은 검증 결과를 확인한 뒤 쓰세요."
      - "면 관측이라 화소 수·공간 분포가 이전 위성과 전혀 다릅니다. 이전 위성과 같은 지점 평균으로 비교할 때 표본 차이를 고려하세요."
    sources:
      - name: GOSAT-GW News (NIES)
        url: https://gosat-gw.nies.go.jp/en/news/
      - name: NIES 보도자료 — TANSO-3 정밀 모드 첫 분석 결과 (2026-01-08)
        url: https://www.nies.go.jp/en/pr/news-and-updates/2026/20260122/20260122.html
      - name: GOSAT-GW (TANSO-3) Data Policy (2026-06-22 개정)
        url: https://www.nies.go.jp/soc/doc/TANSO-3_DataPolicy_en_20260622b.pdf

period:
  start: "2009-04"
  end: present
  note: >-
    GOSAT(2009-01-23 발사) L2는 2009년 4월 관측부터 있습니다(JAXA EORC·NASA ACOS 모두 2009-04-18 시작). GOSAT-2(2018-10-29 발사) FTS-2 SWIR L2는 2019-03-01 관측부터이며,
    판별 제공 기간은 V02.20이 2019-03-01~2024-02-29, V02.21이 2024-03-01 이후, V02.30(2026-08 일반 공개)이 2019-03-01 이후 관측입니다. NASA ACOS GOSAT Lite v11.0은 2009-04-18부터이며, 컬렉션 설명문은 2025-03-26까지로 적혀 있지만 2026-10-13 확인 시 CMR에는 2026-07-31 자료까지 있습니다.
    GOSAT-GW TANSO-3은 2025년 8월 첫 관측, L1B 공개 2026-07-23, L2 공개 2027년 봄 예정입니다. 장비 이상·궤도 조정 때마다 수일~수주 공백이 있습니다(아래 공지 참고).

resolution:
  spatial_short: "10 km (0.09°)"
  temporal_short: "1일"
  spatial: >-
    점(관측점) 자료 — GOSAT TANSO-FTS 약 10.5 km × 10.5 km(NASA ACOS 설명 기준), GOSAT-2 FTS-2 순간 시야 9.7 km(관측점 간격은 적도에서 보통 200 km 미만).
    GOSAT-GW TANSO-3은 면 관측으로 광역 모드 폭 900 km 이상·약 10 km, 정밀 모드 폭 90 km 이상·1~3 km입니다. L3 GOSAT FTS SWIR 월별 지도는 2.5° 격자입니다.
  vertical: "기둥 평균 건조공기 몰분율(XCO2·XCH4·XCO·XH2O) 단일 값 + 사전 분포·기둥 평균화 커널(GOSAT-2 SWFP는 15층)"
  temporal: >-
    GOSAT은 3일(44궤도), GOSAT-2는 6일(하루 약 15궤도) 주기로 같은 지점에 돌아오며, 낮 동안 태양 반사광으로 관측합니다(GOSAT-2 하강 교점 13:00±0:15).
    GOSAT-2 L2 파일은 UTC 하루(00:00~23:59) 단위입니다. L3는 월평균 지도입니다.

coverage:
  short: 전지구
  note: "격자점 사이가 띄엄띄엄한 점(관측점) 자료, 주간"
update: 일별 L2 파일을 계속 생산 (배포 지연은 공식 페이지에서 확인하지 못함). 장비 이상 때는 배포가 멈췄다가 재개됩니다
license: >-
  무료. GOSAT/GOSAT-2 자료 정책상 비차별 원칙으로 온라인 배포하며, 논문에는 "JAXA/NIES/MOE" 출처 표기가 필요합니다. GOSAT-GW(TANSO-3)는 "NIES/MOE" 표기가 필요합니다.
  일반에 공개된 표준 산출물만 재배포할 수 있고, 평화적 목적 외 이용은 금지됩니다. 받으려면 각 배포처 사용자 등록이 필요합니다
account_required: true

summary: >-
  GOSAT 시리즈는 일본 환경성·국립환경연구소(NIES)·JAXA가 운영하는 온실가스 전용 관측위성입니다. 2009년 발사된 GOSAT(이부키)은 세계 처음으로 우주에서 CO2와 메탄(CH4)의 기둥 평균 농도를
  측정했고, 2018년 GOSAT-2(이부키 2호)가 CO까지 더해 이어받았으며, 2025년 GOSAT-GW가 넓은 폭을 영상으로 훑는 TANSO-3으로 NO2까지 함께 관측하기 시작했습니다.
  NIES가 L2 XCO2·XCH4(태양 반사광 단파 적외 산출)를 비롯해 L3 월별 지도, L4 플럭스·3차원 농도를 배포하고, NASA는 같은 GOSAT 스펙트럼으로 만든 ACOS XCO2를 따로 제공합니다.
  2009년부터 이어지는 위성 CO2·메탄 기록으로, 전 지구 온실가스 증가율과 메탄 배출원 역산 연구에 널리 쓰입니다.

time_convention:
  summary: >-
    L2 값은 위성이 관측점을 지나간 순간의 관측값입니다(GOSAT-2 하강 교점 13:00±0:15 지방시 무렵). GOSAT-2 L2 파일은 UTC 하루 단위로, 관측점마다 관측 시각이 들어 있습니다.
    L3 월별 지도는 L2를 한 달 모아 평균한 값입니다.
  points:
    - "GOSAT-2 SWFP의 관측 시각 `SoundingAttribute/observationTime`은 'YYYY-MM-DDThh:mm:ss.ffffffZ' 형식의 UTC 문자열입니다. 숫자로 바꿔 쓰세요."
    - "태양 반사광을 쓰므로 낮 쪽만, 그것도 구름이 없는 관측점만 산출됩니다. GOSAT은 3일 동안 약 56,000번 측정해도 맑은 하늘 자료는 2~5%뿐입니다."
    - "GOSAT은 3일, GOSAT-2는 6일마다 같은 지점에 돌아오므로 한 지점의 일별 시계열은 만들 수 없습니다. 지역·월 단위로 모아 쓰는 것이 기본입니다."
    - "GOSAT-GW L1B·L2는 광역(W)·정밀(F) 모드별 산출물(예 GWT3W_L2_GHG, GWT3F_L2_NO2)로 나뉩니다. 정밀 모드는 도시 등 좁은 지역을 겨냥한 관측이며, 인가 사용자가 관측을 요청할 수 있습니다."
    - "준실시간판과 확정판의 구분은 공식 문서에서 확인하지 못했습니다. 대신 판 번호(예 V02.30)와 RA(연구 공모) 사용자 우선 공개 → 일반 사용자 공개 순서가 있습니다."
  source: https://www.gosat-2.nies.go.jp/about/spacecraft_and_instruments/
  source_name: GOSAT-2 Spacecraft & Instruments·Observation (NIES) + GOSAT-2 FTS-2 SWIR L2 SWFP 파일 형식 설명서(V02.30)

variables:
  note: >-
    GOSAT-2 변수 이름·단위는 'GOSAT-2 TANSO-FTS-2 SWIR L2 Column-averaged Dry-air Mole Fraction Product' 파일 형식 설명서(V02.30, 2026-03) 기준입니다(HDF5, 일별 파일).
    GOSAT(NIES V03.05)과 GOSAT-GW L2 파일의 변수 이름은 2026-10-13 배포처 점검·미공개로 확인하지 못해 적지 않았습니다.
  full_list: https://prdct.gosat-2.nies.go.jp/documents/pdf/Vol.5_FTS-2_L2_SWFP_ver0230_en_07.pdf
  groups:
    - name: GOSAT-2 FTS-2 SWIR L2 기둥 평균 몰분율 (SWFP V02.30, 일별 HDF5)
      kind: instant
      period: 관측 시각
      items:
        - "XCO2 — `RetrievalResult/xco2` (ppm)"
        - text: "XCH4 — `RetrievalResult/xch4` (ppm)"
          note: ppb가 아니라 ppm 단위
        - "XCO — `RetrievalResult/xco` (ppm)"
        - "XH2O — `RetrievalResult/xh2o` (ppm)"
        - "산출 불확실성 — `RetrievalResult/xco2_uncert`, `xch4_uncert`, `xco_uncert`, `xh2o_uncert` (ppm)"
        - text: "사전 기둥 평균값 — `RetrievalResult/xco2_apriori`, `xch4_apriori` 등 (ppm)"
          std: []
        - text: "기체별 품질 플래그 — `RetrievalResult/xco2_quality_flag`, `xch4_quality_flag`, `xco_quality_flag`, `xh2o_quality_flag`"
          note: 0 Good, 1 Fair, 2 Poor, 3 NG, −1 무효. 'Good'만 쓰라고 안내
        - text: "기둥 평균화 커널 — `RetrievalResult/xco2_column_averaging_kernel` 등 (무차원, 15층)"
          std: []
        - text: "사전 연직 분포 — `RetrievalResult/co2_profile_apriori`, `ch4_profile_apriori` 등 (ppm)"
          std: []
        - text: "관측점 위도·경도 — `SoundingGeometry/latitude`, `SoundingGeometry/longitude` (deg)"
        - text: "관측 시각 — `SoundingAttribute/observationTime`"
          note: UTC 문자열
    - name: GOSAT TANSO-FTS SWIR L2 (NIES, V03.05 등)
      kind: instant
      period: 관측 시각
      items:
        - text: "XCO2 기둥 평균 몰분율"
          note: GDAS에서 받음. 파일 속 변수 이름은 제품 설명서로 확인
        - text: "XCH4 기둥 평균 몰분율"
          note: GDAS에서 받음
        - text: "NASA ACOS GOSAT Lite v11.0 편향 보정 XCO2 (ppm)"
          note: NASA GES DISC 일별 netCDF4, 2009-04-18~(2026-10-13 확인 시 2026-07-31까지)
    - name: GOSAT L3 월별 지도
      kind: mean
      period: 월
      items:
        - text: "FTS SWIR L3 월평균 CO2·CH4 기둥 농도 (2.5° 격자)"
