    level: info
    title: TANSO-3 정밀 모드 첫 분석 — L1B 2026년 봄, L2 2027년 봄 공개 계획
    body: >-
      NIES는 2025년 9월 5일 로스앤젤레스 정밀 모드 관측에서 XCO2·XCH4와 NO2 경사 기둥을 한 시야에서 영상으로 얻었다고 발표했습니다(간이 산출로 정량 해석 주의).
      L1B는 2026년 봄, L2(XCO2·XCH4·NO2)는 2027년 봄 공개 계획이라고 밝혔습니다.
    source: https://www.nies.go.jp/en/pr/news-and-updates/2026/20260122/20260122.html
  - date: "2025-07-01"
    level: info
    title: GOSAT-GW 발사 성공 (2025-06-29, H-IIA 50호기)
    body: >-
      GOSAT 시리즈 3호기 GOSAT-GW(이부키 GW)가 2025년 6월 29일 다네가시마 우주센터에서 H-IIA 50호기(마지막 비행)로 발사되었습니다. TANSO-3과 AMSR3을 싣고 있으며,
