    source: https://product.gosat-gw.nies.go.jp/en/news/detail/?newsid=19
  - date: "2026-09-29"
    level: info
    title: GOSAT-2 FTS-2 관측 일시 중단 (2026-09-22~09-27)
    body: >-
      GOSAT-2 FTS-2가 2026년 9월 22일 15시대(UT)부터 관측을 멈췄다가 9월 27일 00:37(UT)에 재개했습니다. 2026-09-22 15:32:30 ~ 09-27 00:37:12(UT) 관측 자료는 제공되지 않습니다.
    source: https://www.eorc.jaxa.jp/GOSAT/index.html
  - date: "2026-08"
    level: warning
    title: GOSAT-2 FTS-2 SWIR L2 V02.30 일반 공개 — 2024년 이후 Band 1 편향 미보정
    body: >-
      V02.30은 알고리즘·파일 형식은 그대로이고, 입력 TANSO-CAI-2 L2 구름 판별 산출물을 V01.30·V01.31로 바꾼 판입니다(RA 사용자 2026-03, 일반 사용자 2026-08 공개).
      발사 뒤 지수적으로 떨어지던 Band 1 감도가 2024~2026년 약 10% 회복했는데 이 판에서도 보정하지 않아, 2024년 이후 Xgas에 시간에 따라 변하는 양의 편향이 있습니다.
    source: https://prdct.gosat-2.nies.go.jp/documents/pdf/ReleaseNote_FTS-2_L2_SWFP_ver0230_en_01.pdf
  - date: "2026-07-09"
    level: info
    title: GOSAT-GW TANSO-3 L1B(V101.101) 2026-07-23부터 공개
    body: >-
      일반 사용자용 TANSO-3 L1B 공개가 한 차례 미뤄진 뒤(2026-06-18 공지), 2026년 7월 23일부터 V101.101로 공개되었습니다. L2(XCO2·XCH4·NO2)는 2027년 봄 공개 예정입니다.
    source: https://gosat-gw.nies.go.jp/en/news/
  - date: "2026-07-03"
    level: info
    title: GOSAT-2 FTS-2 관측 일시 중단 (2026-06-26~07-01)
    body: >-
      GOSAT-2 FTS-2가 2026년 6월 26일 14:49(UTC)부터 관측을 멈췄다가 7월 1일 재개했습니다. 2026-06-26 14:49:41 ~ 07-01 01:07:56(UTC) 관측은 모두 취소되었습니다.
    source: https://www.eorc.jaxa.jp/GOSAT/index.html
  - date: "2026-02-17"
    level: warning
    title: GOSAT TANSO-FTS 자료 배포 재개 — 2025-12-18~2026-02-04 공백
    body: >-
      GOSAT TANSO-FTS의 원인 미상 사건으로 2025년 12월 18일부터 멈췄던 자료 배포가 FTS 재시동 뒤 2026년 2월 4일 관측분부터 재개되었습니다.
      확정된 FTS 공백은 2025-12-18 06:02:14 ~ 2026-02-04 02:45:58(UT), TANSO-CAI 공백은 2026-01-26 23:43:19 ~ 2026-02-03 02:42:13(UT)입니다.
