    자료를 받은 경로(예: ECMWF 지원을 통한 제공)와 날짜를 Data availability에 함께 적는 것이 좋습니다.

notices:
  - date: "2023-06-01"
    level: critical
    title: ECMWF Public Datasets 서비스 종료 — CERA-20C 공개 다운로드 중단
    body: >-
      2023년 3월 2일 예고대로 ECMWF Public Datasets 서비스(웹 인터페이스와 Web API)가 종료되어 CERA-20C를 공개적으로 받을 수 없게 되었습니다.
      ECMWF 안내 표에는 CERA-20C의 대체 경로가 적혀 있지 않습니다.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2023/03/02/320999831/Decommissioning+of+ECMWF+Public+Datasets+service
  - date: "2017-01-30"
    level: info
    title: CERA-20C 일 자료 공개
    body: ECMWF Public Datasets 서비스로 CERA-20C 3시간(일) 자료가 공개되었습니다(월평균은 2017년 1월 12일 공개). 이 서비스는 2023년 종료되었습니다.
    source: https://confluence.ecmwf.int/spaces/WEBAPI/blog/2017/01/30/72129401/New+Public+Dataset+CERA-20C+daily

