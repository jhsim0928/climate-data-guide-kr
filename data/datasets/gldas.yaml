transitions:
  - from: GLDAS-1
    to: GLDAS-2.1
    status: completed
    date: "2020-06"
    summary: >-
      GLDAS-1 생산은 2020년 3월 자료로 끝났고 2020년 6월 30일 GES DISC에서 모두 내려갔습니다. 강제력과 지면 모델을 새로 바꾼 GLDAS-2.1이 이를 대체합니다.
    changes:
      - aspect: 생산 상태
        before: "2020년 3월 자료로 생산 종료, 2020-06-30 GES DISC에서 제거"
        after: "GLDAS-2.1 2000-01부터 현재까지 계속 갱신 (1948~2014년은 GLDAS-2.0)"
      - aspect: 강제력의 알려진 문제
        before: "북반구 단파복사에 부자연스러운 경계선, 2009년부터 강수 특성 변화, SRB 대비 복사 과대·GPCP 대비 강수 과소"
        after: "편향을 보정한 AGRMET 복사, GPCP 기반 강수, GDAS 기반 시간 분해로 개선"
      - aspect: 지면 모델
        before: "GLDAS-1 모델 판"
        after: "Noah 3.6, CLSM-F2.5, VIC 4.1.2 (갱신된 LIS 소프트웨어)"
      - aspect: 처리 이력
        before: "-"
        after: "2020년 1~2월 Noah 2.1 재처리, 2020-10 내륙 수면 마스크 적용"
    impacts:
      - "GLDAS-1 자료는 더 이상 받을 수 없습니다. 예전 논문을 재현하려면 GLDAS-2.0·2.1로 다시 계산해야 하며 값이 다를 수 있습니다."
      - "GLDAS-1과 GLDAS-2 값을 한 시계열로 섞지 마세요."
    sources:
      - name: GLDAS-1 products will be decommissioned on 6/30/2020 (NASA LDAS)
        url: https://ldas.gsfc.nasa.gov/gldas/news/gldas-1-products-will-be-decomissioned-6302020
      - name: README for NASA GLDAS Version 2 Data
        url: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_GLDAS2.pdf

notices:
  - date: "2026-05-11"
    level: warning
    title: GES DISC 온프레미스 서버 종료 — GLDAS도 Earthdata Cloud로 전환 필요
    body: >-
      GES DISC는 온프레미스 서버의 HTTPS 접근을 2026년 9월 30일까지 닫고 온프레미스 OPeNDAP도 8월 20일~9월 30일 사이에 끈다고 안내했습니다.
      GLDAS가 있는 hydro1.gesdisc.eosdis.nasa.gov 서버도 '빨라야 2026년 9월 30일 이후' 접근이 끝나며 Earthdata Cloud로 옮기라고 표시하고 있습니다(2026-10-13 확인 시 아직 응답).
      스크립트 주소를 data.gesdisc.earthdata.nasa.gov나 earthaccess로 바꾸세요.
    source: https://github.com/nasa/gesdisc-tutorials/blob/main/user-guidance/GES_DISC_Migration_to_Earthdata_Website_and_Earthdata_Cloud.md
  - date: "2026-04-16"
    level: info
    title: GrADS Data Server(GDS) 서비스 종료 — GLDAS 포함
    body: >-
      GLDAS(Noah·CLSM·VIC 3시간·일·월)를 제공하던 GES DISC의 GDS가 2026년 4월 6일 종료되었습니다(1월 15일 예고).
      같은 자료는 Earthdata Cloud에서 HTTPS와 부분 추출 서비스로 받을 수 있습니다.
    source: https://www.earthdata.nasa.gov/data/alerts-outages/grads-data-server-gds-service-has-been-discontinued
  - date: "2025-08-13"
    level: info
    title: GLDAS-2.1 복사 강제력이 2025-06-09부터 GALWEM으로 바뀜
    body: >-
      미 공군 기상청이 WWMCA에서 GALWEM으로 옮겨 가면서 WWMCA가 2025년 6월 8일부로 끊겼고, GLDAS-2.1은 6월 9일부터 GALWEM 복사장을 입력으로 씁니다.
      README(2025-08-13 수정)에 기록되었으며, 전환 전후 불연속 여부에 대한 설명은 없습니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_GLDAS2.pdf
  - date: "2020-10"
    level: warning
    title: 내륙 수면 마스크 후처리 — 2020-11-01 이전 다운로드분은 다시 받기
    body: >-
      재처리 때 추가된 하도 추적(routing) 때문에 내륙 수면 격자에 잘못된 값이 들어가 있어, 2.0·2.1의 3시간·월 모델 출력을 MODIS MOD44W 육지 마스크로 다시 처리했습니다.
      강제력 변수(_f)는 바뀌지 않았습니다. 2020년 11월 1일 이전에 받은 자료는 다시 받으라고 안내합니다.
    source: https://docserver.gesdisc.eosdis.nasa.gov/public/project/hydrology/README_GLDAS2.pdf
  - date: "2020-06-30"
    level: info
    title: GLDAS-1 제품 폐기
    body: GLDAS-1은 2020년 3월 자료로 생산을 마쳤고 2020년 6월 30일 GES DISC에서 내려갔습니다. GLDAS-2.1이 후속입니다.
    source: https://ldas.gsfc.nasa.gov/gldas/news/gldas-1-products-will-be-decomissioned-6302020
  - date: "2020-02"
    level: info
    title: GLDAS-2.1 Noah 재처리판 공개, 새 CLSM·VIC 제품과 2.2 추가
    body: >-
      2020년 1~2월 재처리한 GLDAS-2.1 Noah 3시간·월자료(GES DISC 공개 2020-01-30)가 이전 판을 대체했고, CLSM·VIC 2.1 제품과 GRACE 동화 GLDAS-2.2,
      조기 제품이 새로 공개되었습니다(README 개정 기록 2020-02-27). 2.0 Noah는 2019년 말 Princeton 강제력 V2.2로 재처리되었고, 2.0 CLSM·VIC 1° 제품은 2020년 9월에 추가되었습니다.
    source: https://ldas.gsfc.nasa.gov/gldas/news/new-and-reprocessed-gldas-2-simulations-released

