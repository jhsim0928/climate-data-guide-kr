# ─────────────────────────────────────────────────────────────
# 사이트 설정 — 처음 한 번만 아래 3곳을 본인 정보로 바꾸세요
#   1) site_url   2) repo_url   3) extra.site_citation
# ─────────────────────────────────────────────────────────────
site_name: 기후데이터 길잡이
site_description: 대기·해양·해빙·극지·원격탐사 연구자를 위한 데이터 출처, 받는 방법, 인용, 중단·변경 공지 모음
site_url: https://data4researchers.kr/
repo_url: https://github.com/jhsim0928/climate-data-guide-kr
repo_name: climate-data-guide-kr
edit_uri: edit/main/docs/
copyright: 콘텐츠 CC BY 4.0 · 코드 MIT

theme:
  name: material
  language: ko
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ko
        - en

hooks:
  - hooks/datasets.py

nav:
  - 홈: index.md
  - 자료 찾기:
      - 전체 목록: datasets/index.md
      - 자료 비교: compare.md
  # 대기·해양·해빙 메뉴는 data/datasets/*.yaml 의 domain·group·order 값으로 자동 생성됩니다
  - __DATA_SECTIONS__: auto
  - 공지·전환:
      - 공지 모음: notices.md
      - 전환 가이드: transitions.md
  - 참여:
      - 알림 신청: subscribe.md
      - 데이터셋 제안: suggest.md
  - 소개:
      - 소개·인용: about.md
      - 개인정보 처리방침: privacy.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/notranslate.js
  - javascripts/forms.js
  - javascripts/site.js

extra:
  # 데이터셋 페이지 하단 "이 사이트 인용" 안내에 들어가는 문장
  site_citation: "예) 기후데이터 길잡이, https://data4researchers.kr/ (접속일 YYYY-MM-DD)"

  # 알림 신청·데이터셋 제안 폼을 보낼 주소. 비워두면 "준비 중"으로 표시됩니다.
  # 메일 알림을 시작할 때 Google Apps Script 웹앱 주소 등을 넣으면 바로 연결됩니다.
  forms:
    subscribe_endpoint: ""
    suggest_endpoint: ""
