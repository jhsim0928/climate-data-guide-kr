# ─────────────────────────────────────────────────────────────
# 사이트 설정 — 처음 한 번만 아래 3곳을 본인 정보로 바꾸세요
#   1) site_url   2) extra.site_citation (DOI·인용 문구)
# 방문자가 GitHub 저장소로 가지 않도록 repo_url·edit_uri는 일부러 넣지 않았습니다.
# ─────────────────────────────────────────────────────────────
site_name: 기후데이터 길잡이
site_description: ERA5·JRA-3Q·MERRA-2·OISST·GLORYS 등 기후·해양·해빙 자료의 받는 방법, 변수(순간값·평균·누적), 해상도, 논문 인용(DOI), 제공 중단·변경 공지를 한곳에 정리한 연구자용 가이드
site_url: https://data4researchers.kr/
copyright: 콘텐츠 CC BY 4.0 · 코드 MIT

theme:
  name: material
  language: ko
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang:
        - ko
        - en

hooks:
  - hooks/datasets.py

nav:
  - 홈: index.md
  - 자료 찾기:
      - 전체 목록: datasets/index.md
      - 자료 비교: compare.md
  # 대기·해양·해빙 메뉴는 data/datasets/*.yaml 의 domain·group·order 값으로 자동 생성됩니다
  - __DATA_SECTIONS__: auto
  - 세대별 비교: transitions.md
  - 중요 공지: notices.md
  - 참여:
      - 중요 공지 알림 신청: subscribe.md
      - 데이터셋 제안: suggest.md
  - 소개:
      - 소개·인용: about.md
      - 개인정보 처리방침: privacy.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/notranslate.js
  - javascripts/forms.js
  - javascripts/site.js
  - javascripts/excel.js

extra:
  # 사이트 인용 정보 — 소개 페이지, 각 데이터셋 페이지 하단, 엑셀 저장 파일에 똑같이 들어갑니다.
  # doi 는 Zenodo의 "모든 버전" DOI(concept DOI) — 새 버전을 올려도 바꿀 필요가 없습니다.
  site_citation:
    doi: "10.5281/zenodo.23300923"
    # 사사(Acknowledgements) 문장 — 사이트 안내·엑셀 저장 파일에 들어갑니다
    ack_en: "Information on the datasets used in this study was compiled with the help of the Korean Climate Data Guide (Sim, 2026; https://doi.org/10.5281/zenodo.23300923)."
    bibtex: |-
      @misc{sim2026kcdg,
        author       = {Sim, Ji-Han},
        title        = {Korean Climate Data Guide},
        year         = {2026},
        publisher    = {Zenodo},
        doi          = {10.5281/zenodo.23300923},
        url          = {https://doi.org/10.5281/zenodo.23300923}
      }

  # 검색엔진 최적화(SEO) — 검색 등록 후 받은 확인 코드를 따옴표 안에 넣으면 됩니다 (README 'SEO' 참고)
  seo:
    base_ko: https://data4researchers.kr/
    base_en: https://data4researchers.kr/en/
    og_image: assets/og-ko.png
    google_site_verification: ""
    naver_site_verification: ""
    bing_site_verification: ""

  # 언어 선택 (오른쪽 위 메뉴). 영어판은 mkdocs.en.yml 로 site/en/ 에 따로 빌드합니다.
  alternate:
    - name: 한국어
      link: /
      lang: ko
    - name: English
      link: /en/
      lang: en

  # 알림 신청·데이터셋 제안 폼을 보낼 주소. 비워두면 "준비 중"으로 표시됩니다.
  # 메일 알림을 시작할 때 Google Apps Script 웹앱 주소 등을 넣으면 바로 연결됩니다.
  contact_email: data4researchers@gmail.com
  forms:
    subscribe_endpoint: "https://script.google.com/macros/s/AKfycbxL9C99BeAUZ6JOyv3lHXtBHwUVE8Z3qkvc4W1MFO5KxPkzjExUUniSjwF6IfmF16D7/exec"
    report_endpoint: "https://script.google.com/macros/s/AKfycbxL9C99BeAUZ6JOyv3lHXtBHwUVE8Z3qkvc4W1MFO5KxPkzjExUUniSjwF6IfmF16D7/exec"
    suggest_endpoint: "https://script.google.com/macros/s/AKfycbxL9C99BeAUZ6JOyv3lHXtBHwUVE8Z3qkvc4W1MFO5KxPkzjExUUniSjwF6IfmF16D7/exec"
